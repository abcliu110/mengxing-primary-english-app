&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;语法 · 形态与句法&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-grammar&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;23 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Langacker · 《剑桥英语语法》 · 章振邦 · 连淑能&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-01&lt;/span&gt;&lt;span&gt;形式跟着功能走：语法形式是装着意义的符号，不是空壳规矩&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-02&lt;/span&gt;&lt;span&gt;一个句子的时态只标记一次：标在第一个动词上，后面的动词回原形&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-03&lt;/span&gt;&lt;span&gt;do 是替补队员：英语实义动词丢了自己提问、否定的能力，do 被拉来扛时态&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-04&lt;/span&gt;&lt;span&gt;三单 -s 是北方方言留下的幸存者：动词变位大简化后唯一没被磨掉的词尾&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-05&lt;/span&gt;&lt;span&gt;名词复数 -s 和三单 -s 不是一家人：长得像，是两条独立源流后来的巧合&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-06&lt;/span&gt;&lt;span&gt;不规则过去式按「家族」住：老词靠元音换声留住老样子，高频是它们的保命符&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-07&lt;/span&gt;&lt;span&gt;情态动词说的是「力」：must 是一股推力，may 是搬走障碍，can 是自己有劲儿&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-08&lt;/span&gt;&lt;span&gt;情态动词是语法化的化石：它们曾经是普通动词，所以没有三单 -s、不能连排&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-09&lt;/span&gt;&lt;span&gt;否定词会「磨损—加固」打转：not 本来是被喊来帮忙加强否定的，后来自己当了主角&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-10&lt;/span&gt;&lt;span&gt;some / any 是说话人的立场选择，不是「肯定句 some、疑问否定 any」的铁律&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-11&lt;/span&gt;&lt;span&gt;because 和 so 各管一段路：英语一段因果通常只留一个连接点，两个都上是汉语的习惯迁移&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-12&lt;/span&gt;&lt;span&gt;主谓一致有三股力在拉：形式、意义、就近——there be 听离它最近的那个名词&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-13&lt;/span&gt;&lt;span&gt;所有格 &amp;#x27;s 是「关联标记」，不是「所有权证书」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-14&lt;/span&gt;&lt;span&gt;代词的格跟着位置走：主语位用主格、宾语位用宾格，「讲究过头」也会错&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-15&lt;/span&gt;&lt;span&gt;a / an 按声音不按字母：耳朵决定，字母只是参考&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-16&lt;/span&gt;&lt;span&gt;错误是学习者心里的「临时系统」在试单，不是粗心也不是坏习惯&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-17&lt;/span&gt;&lt;span&gt;注意到，才学得会：形式被「看见」的那一刻才开始变成自己的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-18&lt;/span&gt;&lt;span&gt;把形式拉回交际现场：一边说话解决问题，一边顺手看形式&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-19&lt;/span&gt;&lt;span&gt;频率在调谐大脑：见得多的先会、不规则的靠见得多才活得下来&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-20&lt;/span&gt;&lt;span&gt;语块先于规则：整句先住进来，语法是后来从里面拆出来的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-21&lt;/span&gt;&lt;span&gt;语法讲解的及格线：短、准、够用——先过效率与适切两道检查&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-22&lt;/span&gt;&lt;span&gt;汉语不标的，英语偏要标：冠词、时态、复数、三单 -s 是中国孩子的错误集中区&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;GR-23&lt;/span&gt;&lt;span&gt;输出把「听懂」逼成「会用」：说不出来，才知道自己哪里没真会&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#b0512f&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;时态与体&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-tense-aspect&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;18 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Comrie · Bybee · Sweetser · 章振邦「两时两体」&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-01&lt;/span&gt;&lt;span&gt;时态 = 时间 × 看法两个开关，不是十二个要逐个背的格子&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-02&lt;/span&gt;&lt;span&gt;英语形态上只有两个时态：没有「将来时」这个词形，将来是借工具谈的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-03&lt;/span&gt;&lt;span&gt;体是「看事情的方式」：同一件事，可以看全景，也可以钻进去看中间&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-04&lt;/span&gt;&lt;span&gt;一般现在时装不下「正在发生」：整件事必须和说话这一刻完全重叠&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-05&lt;/span&gt;&lt;span&gt;完成体看的是「过去的事和现在的牵连」：痕迹在，事已远&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-06&lt;/span&gt;&lt;span&gt;现在完成时不能点名过去时间：*I have seen him yesterday 为什么错&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-07&lt;/span&gt;&lt;span&gt;动词自带「时间形状」：有的事有终点、有的事是瞬间、有的状态没有过程可看&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-08&lt;/span&gt;&lt;span&gt;过去形式还管「距离」：礼貌、假设、转述，都是把事情从眼前推远&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-09&lt;/span&gt;&lt;span&gt;过去完成时是「锚点搬家」：站在过去某个点上，再回头看更早的事&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-10&lt;/span&gt;&lt;span&gt;will 说将来带着「我预言 / 我乐意」的口气，因为它本是意愿动词变的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-11&lt;/span&gt;&lt;span&gt;be going to 是「已经在路上」：从走向某地去做某事，变成预兆与打算&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-12&lt;/span&gt;&lt;span&gt;完成体的来历：从「我手里有一封写好的信」到「我已经写了信」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-13&lt;/span&gt;&lt;span&gt;时刻表上的将来用现在时：因为时刻表把未来写成了「已定的事实」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-14&lt;/span&gt;&lt;span&gt;讲故事可以把过去拉到眼前：历史现在时是「演」不是「说错」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-15&lt;/span&gt;&lt;span&gt;汉语靠词和语境表时间，英语靠动词变形：每个英语句子被迫选时&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-16&lt;/span&gt;&lt;span&gt;「了 / 过」≠ 现在完成时：对得上的只有一部分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-17&lt;/span&gt;&lt;span&gt;学时态的顺序：先把高频动词的过去式用熟，再回头看系统表&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;TA-18&lt;/span&gt;&lt;span&gt;「镜头讲法」教时态有实验支持，但证据强度要如实说：方向有据、低龄待验&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#2f7db0&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;句型构式&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-constructions&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;16 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Goldberg · Tomasello · Lewis&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-01&lt;/span&gt;&lt;span&gt;句型模具本身带意思：整句的意义大于动词意思之和&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-02&lt;/span&gt;&lt;span&gt;双宾模具自带「让某人收到某物」：bake 进去，就长出「给」义&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-03&lt;/span&gt;&lt;span&gt;有些动词进不了双宾模具：意思不合是一关，词的「长相」也是一关&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-04&lt;/span&gt;&lt;span&gt;致使移动模具：喷嚏也能「打飞」一张餐巾纸&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-05&lt;/span&gt;&lt;span&gt;结果模具：「把某物弄成某个样」——变样的意思来自模具，不在动词里&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-06&lt;/span&gt;&lt;span&gt;双宾模具是一个「意思家族」：从真给出去，到打算给、答应给&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-07&lt;/span&gt;&lt;span&gt;There be 是「出场介绍」模具：把新面孔推上舞台，所以主语多半是新客&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-08&lt;/span&gt;&lt;span&gt;被动句是「换主角」，不是「没人做主语时的救急」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-09&lt;/span&gt;&lt;span&gt;主语是「镜头主角」，不保证是动作的发出者&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-10&lt;/span&gt;&lt;span&gt;孩子学句型是「先整句、再换零件」：带空格的句子先行，抽象句型后长&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-11&lt;/span&gt;&lt;span&gt;理解句子时，大脑先认模具、后认动词&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-12&lt;/span&gt;&lt;span&gt;构式和语块是同一条谱系：从整块背下的句子，到半成品框架，到全抽象模具&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-13&lt;/span&gt;&lt;span&gt;一个分句只有一台「上牌发动机」：限定动词管时态，to do / doing 是不上牌的零件&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-14&lt;/span&gt;&lt;span&gt;to 还是 -ing，由前面的动词点名：这是搭配事实，不是自由二选一&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-15&lt;/span&gt;&lt;span&gt;英语先立骨架再挂修饰，汉语先铺垫后点题：两种句子建筑术&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;CO-16&lt;/span&gt;&lt;span&gt;构式讲法的边界：模具管「整句的戏」，词形细节归形态层管&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#2f8f6e&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;疑问与信息结构&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-questions-info&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;15 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Quirk 尾焦原则 · Gundel 已知性 · 真词源 *kʷo-/*to-&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-01&lt;/span&gt;&lt;span&gt;疑问词各管一块拼图：问句是按「缺哪块信息」分工合作的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-02&lt;/span&gt;&lt;span&gt;疑问词与指示词是两个词族：wh- 与 th- 从未互变，「换字母得答词」是假规律&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-03&lt;/span&gt;&lt;span&gt;whose 是 who 的「家的」，why 是「用什么」的变身：两个真词源&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-04&lt;/span&gt;&lt;span&gt;提问的动作 = 把助动词举到主语前面：被举到前面的，总是排第一的那个助动词&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-05&lt;/span&gt;&lt;span&gt;新信息爱住句尾：先说已知的，再把「新货」放在最后并重读&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-06&lt;/span&gt;&lt;span&gt;状语排队是倾向不是定律：「先地点后时间」只是常态出场顺序&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-07&lt;/span&gt;&lt;span&gt;前置是「变强调」的正当手段：把谁提到句首，就是先给谁打光&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-08&lt;/span&gt;&lt;span&gt;语调是问句的第二套标记：一般疑问常升调、特殊疑问常降调——是常态，不是铁律&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-09&lt;/span&gt;&lt;span&gt;Why 的回答多用 Because，但不是「必用」：问目的时 To / For 同样正宗&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-10&lt;/span&gt;&lt;span&gt;How 与 What 分工：一个问「怎么样/用什么法子」，一个问「是什么东西」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-11&lt;/span&gt;&lt;span&gt;选择问句不用 Yes / No 回答：人家给了选项，要选一个&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-12&lt;/span&gt;&lt;span&gt;回答否定问句，英语跟「事实」走，汉语常跟「对方的话」走&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-13&lt;/span&gt;&lt;span&gt;英语把疑问词搬到句首，汉语让疑问词留在原地：问句最大的结构差&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-14&lt;/span&gt;&lt;span&gt;疑问句是分阶段长出来的：整句模仿 → 换疑问词 → 最后才学会倒装&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;QI-15&lt;/span&gt;&lt;span&gt;提问要先有「真缺口」：为不知道而问，形式才记得住&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#c0392b&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;词汇与词源 · 框架&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-vocab / dom-frames&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;18 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Nation · Lewis · Laufer · Fillmore · CLEC 语料库&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-01&lt;/span&gt;&lt;span&gt;「认识一个词」是九个格子的事，不是背一个中文意思&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-02&lt;/span&gt;&lt;span&gt;先学谁由词频决定：最常用的约 2000 个词族罩住文本的大头&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-03&lt;/span&gt;&lt;span&gt;读懂一页书有一条硬线：认识的词要达到约 98%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-04&lt;/span&gt;&lt;span&gt;学词要四条腿走路：输入、输出、专门学、练流利缺一不可&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-05&lt;/span&gt;&lt;span&gt;英语的积木是「词块」，不是单个词&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-06&lt;/span&gt;&lt;span&gt;大脑存词是「杂货铺」：整句和单词躺在同一个仓库里&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-07&lt;/span&gt;&lt;span&gt;一个词的意义，一半写在它的伙伴名单里（搭配）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-08&lt;/span&gt;&lt;span&gt;知道一个词「为什么这样说」，记得更牢（词源精细加工）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-09&lt;/span&gt;&lt;span&gt;练习有没有用，看任务里有没有「需要、查找、评估」（投入量假说）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-10&lt;/span&gt;&lt;span&gt;最危险的不是生词，是「以为自己认识」的词（欺骗性透明）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-11&lt;/span&gt;&lt;span&gt;词是「提取」出来的，不是「看」熟的&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-12&lt;/span&gt;&lt;span&gt;猜词是门手艺，但手艺有天花板（语境猜义的前提）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-13&lt;/span&gt;&lt;span&gt;词的意思要到「戏」里学：一幕买卖戏教全 buy/sell/pay/cost（框架语义）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-14&lt;/span&gt;&lt;span&gt;同框架的词要成组学：学会一个，免费带走一串推论&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-15&lt;/span&gt;&lt;span&gt;词能拆，但只能拆真的：构词透明度是一条连续谱&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-16&lt;/span&gt;&lt;span&gt;一词多义不是清单，是从一个原型义长出的网&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-17&lt;/span&gt;&lt;span&gt;说出来、写出来，才知道自己「不会」（输出促注意）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;V-18&lt;/span&gt;&lt;span&gt;中国孩子的词汇错误有地图：CLEC 告诉我们错在哪几类&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#d4880f&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;可数性与冠词&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-countability-articles&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;20 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Langacker 识解 · Gundel · Lyons · Ionin 波动假说&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-01&lt;/span&gt;&lt;span&gt;总纲：可数不可数是「看法」，不是物体的物理属性（识解说）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-02&lt;/span&gt;&lt;span&gt;物质名词的判据是「同质」：随便拿一小份，还是它&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-03&lt;/span&gt;&lt;span&gt;可数名词的「界」可以是模糊的：season、tummy 都可数&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-04&lt;/span&gt;&lt;span&gt;看法可以当场切换：磨成料、分作份（grinding / portioning）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-05&lt;/span&gt;&lt;span&gt;数一摊东西要借单位，而汉语量词就是现成的老师&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-06&lt;/span&gt;&lt;span&gt;a 的本职：让听者「认出是哪一类」就够了&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-07&lt;/span&gt;&lt;span&gt;the 的本职：让听者「唯一定位到那一个」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-08&lt;/span&gt;&lt;span&gt;把东西「找出来」的线索只有五条路（定指的建立菜单）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-09&lt;/span&gt;&lt;span&gt;学习者选错冠词有个系统原因：先按「具体」选，后按「定指」选（波动假说）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-10&lt;/span&gt;&lt;span&gt;中国学生的冠词错误居名词短语错误之前列，且以「漏」和「滥」为主&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-11&lt;/span&gt;&lt;span&gt;机构名词有两种读法：「去做那件事」不加冠词，「去那栋楼」才加&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-12&lt;/span&gt;&lt;span&gt;有些搭配是「约定存货」：play the piano 加 the、play football 不加&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-13&lt;/span&gt;&lt;span&gt;类指有三种说法，分工不同：a tiger / the tiger / tigers&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-14&lt;/span&gt;&lt;span&gt;a/an 看声音不看字母：an 是原形，a 是弱化形&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-15&lt;/span&gt;&lt;span&gt;抽象名词不可数，因为它们被看成「一类事」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-16&lt;/span&gt;&lt;span&gt;集合名词可单可复，看你把「一家人」看成一个单位还是几口人&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-17&lt;/span&gt;&lt;span&gt;量词排队先看识解：many/much、few/little 是同一总开关的下游&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-18&lt;/span&gt;&lt;span&gt;复数 -s 只落在「有界单位」上：这是它从不落在料上的原因&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-19&lt;/span&gt;&lt;span&gt;选冠词时，心里要过一遍「对方知道吗」——冠词是给听者的服务&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;C-20&lt;/span&gt;&lt;span&gt;冠词错误要分型纠：漏用、误加、替换是三种病、三种药&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#0f8a7d&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;介词与空间时间&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-prepositions&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;18 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Tyler &amp;amp; Evans · Coventry &amp;amp; Garrod · 汉语迁移研究&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-01&lt;/span&gt;&lt;span&gt;总纲：一个介词 = 一张原型图 + 一张亲戚网（有原则的多义）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-02&lt;/span&gt;&lt;span&gt;原型不是凭感觉选的：四条证据定中心&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-03&lt;/span&gt;&lt;span&gt;in 的原型是「装进容器」：边界之内，且受容器影响&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-04&lt;/span&gt;&lt;span&gt;on 的原型是「贴面加承重」：接触面在替它撑着&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-05&lt;/span&gt;&lt;span&gt;at 的原型是「当成一个点」：把对象压扁成坐标&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-06&lt;/span&gt;&lt;span&gt;over 的中心是「在上方」，不是「盖住」：一个全家福的定案示范&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-07&lt;/span&gt;&lt;span&gt;up 是「多」：数量往上涨，所以 prices go up&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-08&lt;/span&gt;&lt;span&gt;几何算一半，功能算另一半：苹果在碗沿之下为什么还能说 in（功能几何框架）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-09&lt;/span&gt;&lt;span&gt;时间介词是把空间图「借」到时间上：时长定介词是伪规则&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-10&lt;/span&gt;&lt;span&gt;教介词要教「图 + 长法」，不要教义项清单：三组教学实验的共识&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-11&lt;/span&gt;&lt;span&gt;华语学生的介词错误是「切分不同」，不是「记性不好」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-12&lt;/span&gt;&lt;span&gt;谁做图形谁做背景：介词句子先定位「要找的东西」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-13&lt;/span&gt;&lt;span&gt;垂直方向是四个词合伙切的：above / over / under / below 的分工&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-14&lt;/span&gt;&lt;span&gt;to / for / at：三个「指向」介词的分工&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-15&lt;/span&gt;&lt;span&gt;小品词是介词的「动词版亲戚」：up / out / off 的图式义随身携带&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-16&lt;/span&gt;&lt;span&gt;静态的东西借动态的词：The road runs along the river（虚构运动）&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-17&lt;/span&gt;&lt;span&gt;先空间、后时间、再抽象：介词义的展开顺序就是教学顺序&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;P-18&lt;/span&gt;&lt;span&gt;中国课堂的本土证据：概念教学对华语学生同样有效&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#5b7f2a&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;语音与拼读&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-phonetics&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;19 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：国家阅读专家组 · Ehri · Castles/Rastle/Nation · Roach&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-01&lt;/span&gt;&lt;span&gt;先系统地学字母—声音对应、而且越早开始收益越大，这是全领域证据最硬的一条教学结论&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-02&lt;/span&gt;&lt;span&gt;认词不是把词形拍成照片存起来，而是把拼写、读音、词义在脑子里「焊」成一个整体&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-03&lt;/span&gt;&lt;span&gt;孩子认词要走四个台阶：看图猜词 → 只用首尾字母 → 逐字母全拼 → 成块认词&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-04&lt;/span&gt;&lt;span&gt;每自己拼对一个生词，孩子就给自己上了一课——解码是阅读的「自我教学」机器&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-05&lt;/span&gt;&lt;span&gt;听觉上先有「块」再有「个」：孩子先听得出押韵和词块（首音—韵脚），然后才听得出单个音素&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-06&lt;/span&gt;&lt;span&gt;字母和声音的对应是「多半如此」的统计倾向，不是定律：先教最稳的一批，剩下的进变脸名单逐个记&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-07&lt;/span&gt;&lt;span&gt;会拼读 ≠ 会阅读：认词和听懂是两套能力，阅读是两者的乘积&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-08&lt;/span&gt;&lt;span&gt;英语里出现最多的元音是一个「含糊音」/ə/：不重读的音节，元音大多缩水成它&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-09&lt;/span&gt;&lt;span&gt;小词有两副嗓子：a、the、to、can 这些功能词，单独念读强式，放进句子里多半读弱式&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-10&lt;/span&gt;&lt;span&gt;语言的节奏没有「两种」，只有一条连续带：英语偏向「重音说了算」的一端，汉语偏向「音节平均」的一端&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-11&lt;/span&gt;&lt;span&gt;句子里被重读的，是说话人要你注意的那个词——重音是「划重点」的工具&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-12&lt;/span&gt;&lt;span&gt;连读不是「读得快糊在一起」，是音节在重新组队：前一个词的尾巴辅音会跑去当后一个词的开头&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-13&lt;/span&gt;&lt;span&gt;发音学得好不好，第一标准是「人家听不听得懂」，不是「像不像英国人/美国人」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-14&lt;/span&gt;&lt;span&gt;中国孩子发音的难点不在「舌头笨」，在汉语的音系清单和英语不一样：没有的音、没有的弱读、没有的词尾辅音群，要专门补&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-15&lt;/span&gt;&lt;span&gt;字母名和单词读音对不上，是因为拼写先被印刷固定下来、读音随后大搬了家——「元音大推移」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-16&lt;/span&gt;&lt;span&gt;英语里 f 对拉丁语 p、th 对 t 这类「对不上的对应」，是一次成系统的辅音大搬家留下的——格林定律&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-17&lt;/span&gt;&lt;span&gt;foot 的复数是 feet 不是 foots：一个早就消失的词尾 -i，在消失前把前面的元音「传染」变了样——i-变音&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-18&lt;/span&gt;&lt;span&gt;buses、watches 里多出来的一个音节不是随便加的：两个「嘶嘶声」不能紧挨着，中间必须垫一个元音&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;S-19&lt;/span&gt;&lt;span&gt;knight 里的 k 和 gh 不发音，不是拼写在捣乱：它们曾经真的发音，是声音先消失、字母留了下来&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#a03d7c&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;日常表达与语用&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-expressions&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;15 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：Austin · Grice · Canale &amp;amp; Swain · 何自然&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-01&lt;/span&gt;&lt;span&gt;说话就是做事：每句话在传递信息之外，都在执行一个动作——请求、道歉、承诺、感谢、邀请&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-02&lt;/span&gt;&lt;span&gt;很多话不能按字面听：「你能把盐递给我吗」问的不是能力，是请求——意思要过「他想让我做什么」这一关&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-03&lt;/span&gt;&lt;span&gt;对话能进行下去，靠双方默认「我还在配合你」：答非所问往往不是乱答，是在用绕弯的方式回答&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-04&lt;/span&gt;&lt;span&gt;日常句子是整块从记忆里取出来的，不是逐词现拼的：问候、点餐、道别靠的是「现成块」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-05&lt;/span&gt;&lt;span&gt;语法错了，人家笑你「说得不好」；场合错了，人家觉得你「人不好」——语用失误比语法错误更伤人，而且更难被察觉&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-06&lt;/span&gt;&lt;span&gt;语用失误分两种，治法完全不同：一种是「现成说法用错了」，一种是「不懂这个场合的规矩」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-07&lt;/span&gt;&lt;span&gt;请求、打扰、拒绝越「压人」，英语越要加缓冲：礼貌是替对方的「面子」留余地，客气程度随关系远近和事的大小滑动&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-08&lt;/span&gt;&lt;span&gt;一句回应「对不对」，不看句子本身，看三件事：谁在说、对谁说、上一句说了什么&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-09&lt;/span&gt;&lt;span&gt;汉语的客套会「跟着人一起出国」：谦虚、称呼、拒绝的方式直译成英语，常会变成失误&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-10&lt;/span&gt;&lt;span&gt;「会说英语」是四种本事合起来：语法只占四分之一，其余是得体、成篇、和卡壳时的自救&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-11&lt;/span&gt;&lt;span&gt;卡壳不是失败，是交际的一部分：会换个说法、打个比方、问一句「怎么说」，本身就是本事&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-12&lt;/span&gt;&lt;span&gt;得体不会自己长出来：语法学得再好的人也会说错场合的话——语用必须专门教、把规矩讲在明处&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-13&lt;/span&gt;&lt;span&gt;对话是两个人轮流搭的：一问一答是绑在一起的「对子」，上一句长什么样，就预定了下一句的活&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-14&lt;/span&gt;&lt;span&gt;没注意到的东西学不会：语用规矩藏在语境中，不把孩子的注意力引过去，他听一百遍也可能没看见&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;E-15&lt;/span&gt;&lt;span&gt;说错了能自己改回来，是对话自带的功能：交际教学不该一出错就打断，先让人把「自我修复」走完&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dom&quot; style=&quot;--c:#4464a8&quot;&gt;
&lt;div class=&quot;domhead&quot;&gt;&lt;span class=&quot;name&quot;&gt;写作框架&lt;/span&gt;&lt;span class=&quot;id&quot;&gt;dom-writing&lt;/span&gt;&lt;span class=&quot;cnt&quot;&gt;15 条&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;anchors&quot;&gt;专家锚：王初明 · 文秋芳 · Flower &amp;amp; Hayes · Swain&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-01&lt;/span&gt;&lt;span&gt;写作和说话最大的不同：读者不在你面前，看不见你脑子里的画——每个信息都要用文字亲手交到读者眼前&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-02&lt;/span&gt;&lt;span&gt;写好作文不是一口气从头写到尾：想（计划）、写（落笔）、改（回看）三件事是来回切换的，不是一条直线&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-03&lt;/span&gt;&lt;span&gt;孩子写作文「想到什么写什么」不是偷懒，是发展阶段：从「知识讲述」长到「边写边想清楚」需要很多年&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-04&lt;/span&gt;&lt;span&gt;修改分两层，顺序不能反：先改「意思对不对、读者懂不懂」，最后才改「字词句对不对」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-05&lt;/span&gt;&lt;span&gt;最省力的写作进步法是「接着写」：先读一段好文章，再顺着它的势往下写——理解会把产出「拉平」到更高水平&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-06&lt;/span&gt;&lt;span&gt;内容要创造，语言要模仿：新意放在想什么上，句子的说法先借现成的——反过来就会写出「想法平庸、句子奇葩」&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-07&lt;/span&gt;&lt;span&gt;写不出来恰恰是最有用的时刻：只有动笔输出，才知道自己缺哪一块——「注意到缺口」是进步的扳机&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-08&lt;/span&gt;&lt;span&gt;对小学生怎么写才有效，有官方级的证据清单：天天写、教过程、练基本功、建写作圈——四件事按证据强度排好了队&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-09&lt;/span&gt;&lt;span&gt;年龄再大一点，什么写作教学最有效已经有元分析答案：教「写作策略」排第一，范文研读、句子合并、同伴合作都在有效清单上&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-10&lt;/span&gt;&lt;span&gt;支架的意义在于「用完要撤」：句子框架、范文、师生共构都是临时拐杖，撤掉还能写，才算学会&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-11&lt;/span&gt;&lt;span&gt;先把课上成「围着写作转」：先给学生一个写不好的真实任务，让他撞见缺口，再给范文和句型——顺序反过来，学的就用不上&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-12&lt;/span&gt;&lt;span&gt;字写不顺、词拼不对，会把脑子「堵住」：基本功不自动化，就没有余力想内容&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-13&lt;/span&gt;&lt;span&gt;句子是攒出来的：把两个短句合成一个长句的练习（句子合并），是实测能提升写作质量的少数单项训练&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-14&lt;/span&gt;&lt;span&gt;衔接词是给读者的路标，不是作文的装饰品：路标必须对准真实的逻辑关系，贴错地方比没有更糟&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;eid&quot;&gt;W-15&lt;/span&gt;&lt;span&gt;任何「套这个公式保满分」的承诺都没有研究支持：能涨分的只有策略、练习量与反馈的组合——这是写作域的诚实底线&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;foot&quot;&gt;全文（每条含机制 / 出处 / 支撑 / 边界 / 专家分歧）见《专家规律总结清单 v1》。&lt;br&gt;约 13 处标「待核」（书目真实、一手页未打开，入模前复核）；专家分歧 20 余处均已登记。生成于 2026-11-01。&lt;/div&gt;

&lt;span class=&quot;tag&quot;&gt;展示原形 · 语法组（GR-01 – GR-23）&lt;/span&gt;
&lt;h1&gt;语法工坊&lt;/h1&gt;
&lt;p&gt;语法不是背下来的规矩清单。每个形式变化，都在替听的人传递一条消息。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（GR-01）：&lt;/b&gt;形式跟着功能走——数、人称、时、指称、连接，每一种形式变化都在回答听话人的一个问题：几个？谁做的？何时？指哪一个？学语法，就是学每个形式在「干什么活」。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;form&quot;&gt;形式&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;hat&quot;&gt;帽子&lt;/div&gt;

&lt;div class=&quot;tab&quot; data-p=&quot;align&quot;&gt;对齐&lt;/div&gt;

&lt;!-- 形式 GR-01 GR-15 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-form&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;30&quot; y=&quot;52&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;dog&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;52&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;s&lt;/text&gt;&lt;path d=&quot;M96 34 q14 -16 34 -12&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;128&quot; y=&quot;8&quot; width=&quot;104&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;报告：不止一个！&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;102&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;she read&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;102&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;s&lt;/text&gt;&lt;path d=&quot;M150 84 q12 -12 30 -10&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;176&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;211&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;报告：是她！&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;每个小尾巴，都在悄悄告诉听的人一件事（GR-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：语法形式本身就是装着意义的符号，不是空壳规矩。不过它管「为什么有这个形式」，管不了个别老词形的历史任意性——那部分靠记（见「过去家族」屏）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;听报告&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two dogs&lt;/span&gt;（-s 报告：好几个）· &lt;span class=&quot;en&quot;&gt;She reads.&lt;/span&gt;（-s 报告：做事的是 she）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个 -s，站在不同的词后面，报告的消息不同——它们的身世在「两个 -s」屏揭晓。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 耳朵也能定形式&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;按声音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;an hour&lt;/span&gt;（h 不出声，开头是元音）· &lt;span class=&quot;en&quot;&gt;a university&lt;/span&gt;（开头是「优」的辅音味儿）（GR-15）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;a 还是 an，不看第一个字母长什么样，看第一个声音。an 的 -n 就是为了不让两个元音撞在一起。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;看字母选冠词是错招——&lt;span class=&quot;en&quot;&gt;a one-way street&lt;/span&gt;（one 开头是 w 的音）也是按声音。耳朵决定，字母只是参考。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;每个形式回答一个问题：&lt;span class=&quot;chip&quot;&gt;几个？→ 数&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;谁做的？→ 人称&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;何时？→ 时&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;指哪一个？→ 指称&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;两句什么关系？→ 连接&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&lt;b&gt;Tom&#x27;s&lt;/b&gt; dog &lt;b&gt;chased&lt;/b&gt; two &lt;b&gt;cats&lt;/b&gt;. —— 一句短话里有三个小报告员：&#x27;s 报告「有关系」，-ed 报告「已经发生」，-s 报告「不止一只」。听懂报告，就听懂了一半语法。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 帽子 GR-02 GR-03 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hat&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;28&quot; y=&quot;38&quot; width=&quot;52&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#5f54b8&quot;/&gt;&lt;text x=&quot;54&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;Did&lt;/text&gt;&lt;path d=&quot;M54 38 l0 -14 M40 24 h28&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;92&quot; y=&quot;59&quot; font-size=&quot;17&quot; fill=&quot;#22303c&quot;&gt;you&lt;/text&gt;&lt;rect x=&quot;138&quot; y=&quot;38&quot; width=&quot;46&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;text x=&quot;161&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;go&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;59&quot; font-size=&quot;17&quot; fill=&quot;#22303c&quot;&gt;home?&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;帽子（时态）戴在 Did 头上，go 就脱帽用原形&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;时态像一顶帽子，一个句子只戴一次（GR-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：时态由动词队伍里排第一的那个扛。为什么要有 do？很久以前实义动词能自己提问，后来不行了，就请 do 来当替补队员，专门举手提问、摇头否定（GR-03）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;提问&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Did you go?&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;Does she like it?&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;did / does 出来站岗扛时态，后面的 go、like 统统脱帽，用原形。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ do 还管否定和强调&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;否定·强调&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I didn&#x27;t go.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;I do like it!&lt;/span&gt;（我真的喜欢！）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;摇头否定、拍胸脯强调，都是这位替补队员的活。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;帽子不能戴两次——&lt;span class=&quot;en&quot;&gt;Does she like…?&lt;/span&gt; 对，&lt;span class=&quot;en&quot;&gt;✗ Does she likes&lt;/span&gt; 是把帽子又给 like 戴了一顶。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;不用请替补的老队员：&lt;span class=&quot;chip&quot;&gt;be（Is she happy?）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;情态动词（Can you swim?）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;它们能自己举手提问、自己否定&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;昨天放学，Mia 问 Tom:「&lt;b&gt;Did&lt;/b&gt; you &lt;b&gt;see&lt;/b&gt; my pen?」Tom 说:「I &lt;b&gt;didn&#x27;t see&lt;/b&gt; it, but I &lt;b&gt;do&lt;/b&gt; want to help!」—— 三个句子里，帽子每次都稳稳戴在 do 一家头上，see 从头到尾都是原形。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 两个-s GR-04 GR-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-twos&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;52&quot; r=&quot;30&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;24&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;-s&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;名词家：管「好几个」&lt;/text&gt;&lt;circle cx=&quot;180&quot; cy=&quot;52&quot; r=&quot;30&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;24&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;-s&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;动词家：管「他/她做」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;两个 -s 只是长得像，来自不同的老祖宗（GR-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：复数 -s 来自古英语名词的老词尾；三单 -s 是北方方言的词尾——以前动词尾巴有很多种，后来越说越简单，只剩它一个还在值班（GR-04）。两条线在路上偶然长成了同一个样子。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;分清两兄弟&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two books&lt;/span&gt; 的 -s 说「好几个」· &lt;span class=&quot;en&quot;&gt;He reads.&lt;/span&gt; 的 -s 说「做事的是他」&lt;br&gt;&lt;span class=&quot;why&quot;&gt;看到 -s 先问一句：它站在名词后面，还是站在 he/she 的动词后面？&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 虽然出身不同，今天发音规则相同&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;同规矩&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;watches&lt;/span&gt;（多加一拍 /ɪz/）· &lt;span class=&quot;en&quot;&gt;plays&lt;/span&gt;（读 /z/）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;两兄弟今天穿同一套发音规则——「源流不同」只用来破除「一个 -s 包打天下」的误会，不影响拼读。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;错误说法辟谣：&lt;/b&gt;「三单 -s 是主语的勋章，是给动词的补偿」——这是编出来的故事，专家已核查为假说法（GR-04）。真相平平无奇：它就是北方方言留下的一个老词尾。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;南方老词尾 -eth（已被 -s 换下）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;古英语名词词尾 -as（复数 -s 的祖先）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;三单 -s 更深的来历，有专家说可能和古诺斯语（维京人的语言）有关，还没有定论——没定论的，咱们就说「一说」，不装作知道（GR-04）。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&lt;b&gt;She reads&lt;/b&gt; two &lt;b&gt;books&lt;/b&gt; every week. —— 前一个 -s 在报告「是她在读」，后一个 -s 在报告「书不止一本」。长得一模一样，干的是两家的活。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 过去家族 GR-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-family&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;68&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;sing → sang&lt;/text&gt;&lt;text x=&quot;68&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;ring → rang&lt;/text&gt;&lt;rect x=&quot;132&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;drink → drank&lt;/text&gt;&lt;text x=&quot;182&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;swim → swam&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;元音家族：换中间的元音变过去&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;不规则过去式按「家族」住：换元音变过去（GR-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这些老词是古英语强动词的后代，靠元音换声表示过去。用得越多的词，大脑记得越牢，越舍不得改成 -ed——高频，是它们的保命符。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;元音家族&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;sing–sang · ring–rang · drink–drank · swim–swam&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;i 变 a 是一大家子。按家族一串一串记，比一个一个背省力得多。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 也有别的家族和「借来的」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;其他家族&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;bring–brought&lt;/span&gt;（词尾型）· &lt;span class=&quot;en&quot;&gt;go–went&lt;/span&gt;（went 是从别的词借来的）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;不是每个不规则词都换元音——杂项要单记，不能宣称「不规则全是换元音」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;说出 &lt;span class=&quot;en&quot;&gt;✗ goed&lt;/span&gt; 不是粗心——是大脑在试「加 -ed」这条新规则，试错的样子就是在学习（见「学法」屏 GR-16）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;家族名单（部分）：&lt;span class=&quot;chip&quot;&gt;i→a 家：sing / ring / drink / swim / begin&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;词尾家：bring / buy / teach（brought / bought / taught）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;借来家：go–went&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Yesterday, Tom &lt;b&gt;sang&lt;/b&gt; a song, &lt;b&gt;drank&lt;/b&gt; some water and &lt;b&gt;swam&lt;/b&gt; in the river. —— 三个过去式全是 i→a 家族的成员，排队出现，一眼认亲。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 情态 GR-07 GR-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-modal&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;30&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#b33636&quot;&gt;must&lt;/text&gt;&lt;path d=&quot;M30 48 h52&quot; stroke=&quot;#b33636&quot; stroke-width=&quot;4&quot;/&gt;&lt;polygon points=&quot;82,48 70,41 70,55&quot; fill=&quot;#b33636&quot;/&gt;&lt;circle cx=&quot;102&quot; cy=&quot;48&quot; r=&quot;10&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;被推着走&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#257a35&quot;&gt;may&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;42&quot; width=&quot;8&quot; height=&quot;26&quot; fill=&quot;#257a35&quot; transform=&quot;rotate(-32 144 55)&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;76&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;路障搬开了&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#2f7db0&quot;&gt;can&lt;/text&gt;&lt;path d=&quot;M196 62 q10 -18 22 -4 q10 -14 16 2&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;76&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;自己有劲儿&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;三种「力」：外力推 / 障碍让开 / 自己有力气&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;情态动词说的是「力」：推力、让路和自己的劲儿（GR-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：must 像有人在后面推你「必须去」，may 像门卫把路障搬开「可以啦」，can 是你自己有力气「我能行」。猜事情的时候，也是这股力在脑子里推着你下结论。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;做事的力&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;You must go now.&lt;/span&gt;（必须）· &lt;span class=&quot;en&quot;&gt;You may go now.&lt;/span&gt;（可以）· &lt;span class=&quot;en&quot;&gt;I can swim.&lt;/span&gt;（我能）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一件事换一股力，意思就全变了。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一股力，搬进脑子里猜事情&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;猜事的力&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He must be tired.&lt;/span&gt;（准是累了——证据在推我）· &lt;span class=&quot;en&quot;&gt;It can&#x27;t be true.&lt;/span&gt;（不可能是真的——力把结论推开）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;义务的「力」和推断的「力」是同一套图：前提「迫使」人得出结论。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;化石规矩（GR-08）：&lt;/b&gt;情态动词是从普通动词变来的「化石」，老习惯都在：不加三单 -s（✗ She cans）、不能两个连排（✗ will can）、后面跟原形。will 以前就是「想要」这个动词，走着走着变成了小帮手。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;must / have to 推力家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;may / might 让路家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;can / could 有劲家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;will 意愿家（想要→将来）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mech&quot; style=&quot;margin-top:6px&quot;&gt;边界：Could you…? 这种客气话不是「能力」在直译——力图式是语义骨架，礼貌用法另有说法，不硬套。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;「&lt;b&gt;Can&lt;/b&gt; you swim?」教练问（看你有没有劲儿）。「You &lt;b&gt;must&lt;/b&gt; wear a cap.」（泳池的规矩在推你）「You &lt;b&gt;may&lt;/b&gt; come in now.」（门卫把路让开了）—— 一个泳池门口，三种力全齐了。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 立场 GR-10 GR-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-stance&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;96&quot; x2=&quot;60&quot; y2=&quot;26&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M60 28 h52 l-12 10 12 10 h-52 z&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;86&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#5c4300&quot;&gt;some&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;我心里有数&lt;/text&gt;&lt;line x1=&quot;180&quot; y1=&quot;96&quot; x2=&quot;180&quot; y2=&quot;26&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M180 28 h52 l-12 10 12 10 h-52 z&quot; fill=&quot;#bcd6f5&quot;/&gt;&lt;text x=&quot;206&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#2f5f8f&quot;&gt;any&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;随便哪个都行&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;some / any 是说话人的立场：举哪面旗，看心思（GR-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：some 是「我心里有数、我乐意」的小旗，any 是「随便哪个都行、我没预设」的小旗。选哪个，看说话人的心思，不只看句子是肯定还是否定。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;常态&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have some friends.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;I don&#x27;t have any money.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;平常陈述多举 some，否定和一般疑问多举 any——记住，这是「倾向」，不是铁律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 心思变了，旗就变&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;看心思&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Would you like some tea?&lt;/span&gt;（请人喝茶：我猜你会答应，所以用 some）· &lt;span class=&quot;en&quot;&gt;Any doctor will tell you.&lt;/span&gt;（肯定句里 any = 任何一位医生都行）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;邀请时预期对方答应 → some；「哪个都行」→ any。句子形式没变，心思决定选词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;错误说法辟谣：&lt;/b&gt;「肯定句只能用 some，疑问否定只能用 any」——这是把倾向说成了铁律。铁律解释不了请人喝茶时的 some 和肯定句里的 any，立场说可以。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;somebody / something 我心里有数版&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;anybody / anything 随便哪个版&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;somewhere 心里有谱的地方&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;奶奶端来茶:「&lt;b&gt;Would&lt;/b&gt; you &lt;b&gt;like some&lt;/b&gt; tea?」—— 她猜你会点头，所以举 some 的旗。你要是问「&lt;b&gt;Any&lt;/b&gt; tea is OK?」意思就成了「随便什么茶都行吗」——旗换了，心思就换了。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 对齐 GR-12 GR-13 GR-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-align&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;125&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;There is a pen and two books.&lt;/text&gt;&lt;path d=&quot;M60 44 q30 22 62 8&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;52&quot; y=&quot;62&quot; width=&quot;150&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;127&quot; y=&quot;79&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;is 听离它最近的 a pen 的话&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;就近原则：先跟最近的名词对齐&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;动词对齐有三股力：形式、意义、就近（GR-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：动词选单数还是复数，有时看长相（形式），有时看意思（意义），有时看谁站得近（就近）。there be 句里，动词先听紧挨着的第一个名词的。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;就近&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;There is a pen and two books.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;There are two books and a pen.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;挨着谁，就先跟谁对齐——顺序一换，is/are 就换。正式作文里则要多照顾整个主语，小学先学就近口径。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ &#x27;s 是小绳子，不是证书&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;关联&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;yesterday&#x27;s news&lt;/span&gt;（昨天的新闻）· &lt;span class=&quot;en&quot;&gt;a day&#x27;s journey&lt;/span&gt;（一天的路程）（GR-13）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;&#x27;s 把两样东西拴在一起说「有关系」：时间、路程、来源都行，不只是「谁的东西」。它还拴在整串词的末尾：the King of England&#x27;s crown（英格兰国王的王冠）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 格跟着位置走&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;位置&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Tom and I are friends.&lt;/span&gt;（站句首当主角，穿 I）· &lt;span class=&quot;en&quot;&gt;Come with Tom and me.&lt;/span&gt;（跟在介词后面，穿 me）（GR-14）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;I 和 me 是同一个人穿的两件衣裳，穿哪件看位置。&lt;span class=&quot;en&quot;&gt;between you and I&lt;/span&gt; 是「讲究过头」穿错了——宾语位上该穿 me。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;&lt;span class=&quot;en&quot;&gt;the leg of the table&lt;/span&gt;（桌子腿）在正式说法里更稳妥——没生命的东西，&#x27;s 用不用是渐变地带，不是一刀切。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;The family are…（英式：按「几口人」的意思用复数）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;It&#x27;s me.（口语里的真实说法，不算错）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;介绍全家福时 Lily 说:「This is &lt;b&gt;my family&#x27;s&lt;/b&gt; photo. &lt;b&gt;Tom and I&lt;/b&gt; are in it. Look, there &lt;b&gt;is&lt;/b&gt; a cake and two cups on the table!」—— &#x27;s 拴关系、I 站主角位、is 听最近的 cake，三股力同框。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 学法 GR-16..23 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-lab&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;26&quot; width=&quot;140&quot; height=&quot;66&quot; rx=&quot;12&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;咦，这里有个 -s！&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;被「看见」的那一刻，开始变成自己的&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;学法实验室：专家们量出来的学习规律&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;语法是这样学会的：试单、注意、开口（GR-16）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：说错话常常说明大脑正在自己试一条新规则——你心里有一套不断重组的「临时系统」，错误是它试单留下的痕迹，不是粗心，也不是坏习惯。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;注意到&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;光听很多还不够；哪天你突然「咦，这里有个 -s！」——这个形式才开始进脑子（GR-17）。老师把对比、高亮、复现摆好，就是在帮你「看见」。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;顺手学&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;最好的学语法时间，是你正想说清楚一件事、刚好被一个小形式卡住的那几秒——老师在这时递上形式，记得最牢（GR-18）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;见得多&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一个说法遇见一百次，它就自己住进脑子；连 went 这种「不讲理」的词，也是天天见才没被改掉（GR-19）。所以先学最常用的，不常用的慢慢来。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;整句住进来&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;先整句整句地学 &lt;span class=&quot;en&quot;&gt;Can I have…? What&#x27;s this?&lt;/span&gt;，说熟了再拆开换零件——语法是从整句里拆出来的（GR-20）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;开口检查&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;光听懂像看别人游泳；自己开口说，才发现哪个动作还不会——说，就是检查自己最好的办法（GR-23）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;有的专家（如 Krashen）说，光是多听多读、听懂了就会了，开口不重要；有的专家（Schmidt、Swain）说，必须注意到形式、必须开口试。我们的取舍：两样都要——多听多读打底，再加「注意到」和「开口说」两道工序（GR-17 / GR-23）。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;给老师的检查表（GR-21）：&lt;/b&gt;讲规则像递工具——挑最顺手的、只讲用得上的（短、准、够用），讲完马上拿去干活；适不适合这个年龄和班级，也要过一遍。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Ben 以前总说 &lt;b&gt;goed&lt;/b&gt;（试单中）。有一天读故事时他突然指着书说:「咦，是 &lt;b&gt;went&lt;/b&gt;！」——被他自己「看见」的那一刻，went 才真正开始变成他的。从那以后，他越说越顺。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：把容易混的摆在一起&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病句多半不是形式没记住，是机制拿错了。先分清机制，再选形式。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：一座桥就够了（GR-11）&lt;/h4&gt;
&lt;p&gt;英语说因果像只搭一座桥：站在 &lt;span class=&quot;en&quot;&gt;because&lt;/span&gt; 这头说原因，或者站在 &lt;span class=&quot;en&quot;&gt;so&lt;/span&gt; 那头说结果——&lt;span class=&quot;en&quot;&gt;Because it rained, we stayed home.&lt;/span&gt; / &lt;span class=&quot;en&quot;&gt;It rained, so we stayed home.&lt;/span&gt;「因为…所以…」两座桥一起搭，是把汉语成对关联词的习惯带进了英语，是中国学生语料里稳定的高频错误。（旧说法「两个一起用语法树会断」是编出来的伪机制，已删除。）&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：否定词的三次搬家（GR-09）&lt;/h4&gt;
&lt;p&gt;否定词说多了会「变弱」，人们就喊一个更重的词来帮忙；新词抢了班，老词慢慢退场，隔几百年再来一轮：英语 &lt;span class=&quot;en&quot;&gt;ne → ne…not → not&lt;/span&gt;，法语 &lt;span class=&quot;en&quot;&gt;ne → ne…pas → pas&lt;/span&gt; 是同款故事。这叫耶斯佩森循环——它是语言自己变的历史，不是你今天说错否定句的原因。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：全家是一个还是几个？（GR-12）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;The family is big.&lt;/span&gt; 把全家看成一个整体，用单数；英式英语常说 &lt;span class=&quot;en&quot;&gt;The family are watching TV.&lt;/span&gt;，心里想的是「几口人」，按意义用复数。两边都有道理——动词在跟「你心里把它看成几个」对齐。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频语法病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因先分两类：一类是汉语里根本没有这些标记（冠词、时态、复数、三单 -s 是错误集中区，GR-22）；一类是大脑的临时系统在试单（GR-16）。对症下药，别都当成粗心。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Does she likes music?&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Does she like music?&lt;/span&gt; —— 帽子已经戴在 does 头上了，like 不能再戴一顶 -s。时态一个句子只标记一次（GR-02）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Because the rain was heavy, so we stayed at home.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Because the rain was heavy, we stayed at home.&lt;/span&gt; —— 因果只搭一座桥。because 和 so 各管一段路，同一条因果链里留一个就够（GR-11）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ There are a pen and two books on the desk.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ There is a pen and two books on the desk.&lt;/span&gt; —— there be 先听离它最近的名词：a pen 是单数，就用 is（GR-12）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I waited for a hour.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I waited for an hour.&lt;/span&gt; —— hour 的 h 不出声，开头是元音的声音，所以用 an。冠词看声音，不看字母（GR-15）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ She cans draw very well.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ She can draw very well.&lt;/span&gt; —— can 是从动词变来的化石小帮手，老习惯是「不加 -s」。情态动词永远不戴三单帽子（GR-08）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I don&#x27;t have some money.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I don&#x27;t have any money.&lt;/span&gt; —— 否定句里「我没预设」的心思占上风，常态用 any。记住这是倾向不是铁律：请人喝茶时 Would you like some tea? 照样用 some（GR-10）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 机制想通了再选&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. Did you ___ to the park yesterday?（did 已经戴上时态帽子）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;go&quot;&gt;&lt;div class=&quot;opt&quot;&gt;go&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;went&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;goes&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. She ___ sing very well.（情态小帮手从不加 -s）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;can&quot;&gt;&lt;div class=&quot;opt&quot;&gt;cans&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;can&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;canning&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. —Would you like ___ tea?（奶奶请你喝茶，她猜你会答应）&lt;/div&gt;

&lt;div class=&quot;opts&quot; data-a=&quot;is&quot;&gt;&lt;div class=&quot;opt&quot;&gt;are&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;be&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. I need ___ umbrella.（听第一个声音）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;an&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;

&lt;div class=&quot;qq&quot;&gt;7. yesterday&#x27;s news 里的 &#x27;s 说的是什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;rel&quot;&gt;&lt;div class=&quot;opt&quot;&gt;新闻是昨天的「财产」&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;rel&quot;&gt;两样东西「有关系」&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
