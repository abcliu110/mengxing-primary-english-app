&lt;/div&gt;

&lt;!-- WA-01 Dogme --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-dogme&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;20&quot; width=&quot;222&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#f4f4f8&quot; stroke=&quot;#b7b3cc&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;#55506e&quot;&gt;See… friend… no see… fifteen years!&lt;/text&gt;&lt;path d=&quot;M125 52 v12&quot; stroke=&quot;#b45309&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;8&quot; y=&quot;68&quot; width=&quot;234&quot; height=&quot;32&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;89&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;I&#x27;ve just seen a friend I haven&#x27;t seen for fifteen years!&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;课本先放一边——你今天最想说的那件事，就是这节课的课文（WA-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Thornbury 的 Dogme / 涌现式教学）：不按预设的语法进度表选句子，而是抓住学习者当场想说而说不完整的话，当场加工成目标形式写上黑板。三条主张：以谈话为驱动、轻材料、聚焦「涌现的语言」——语法点从学生嘴里「长」出来。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：专家博客（Scott Thornbury《An A–Z of ELT》&quot;D is for Dogme&quot;, 2010）· 证据等级：专家专栏 / 运动纲领，非实证研究&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;招牌实例&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;学生说出 &lt;span class=&quot;en&quot;&gt;See..friend..no see….fifteen years!&lt;/span&gt;，老师把它补写成 &lt;span class=&quot;en&quot;&gt;I&#x27;ve just seen a friend I haven&#x27;t seen for fifteen years!&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;进度表让位于真实的表达需要——这是 British Council 官方导读文给出的招牌实例。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 它的来历&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;二十年&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;始于 Thornbury 2000 年的文章，讨论组同年发起；专著版《Teaching Unplugged》(2009) 获 2010 年 ELTon 奖&lt;br&gt;&lt;span class=&quot;why&quot;&gt;老师侧的保留原文也记录了：部分学生期待以教材为锚，这样上课会让他们不安。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;小学适配（如实按源文件口径）：留取材纪律、弃禁材料主张。&lt;/b&gt;Dogme 强式（不用教材）在小学阶段不适用——低龄学习者恰恰需要故事、图片等材料支架（见 WA-07/WA-08）。能搬进小学的只是内核：&lt;b&gt;让教学语言从学生的真实表达中涌现并当场回铸&lt;/b&gt;。学界对 Dogme 的常见批评是「反教材」姿态过强、难以规模化；Thornbury 本人后来也趋温和——Dogme 是对材料主导教学的矫正，而非禁令。访问注记：原博客页对自动抓取返回 403，本条经 British Council 官方导读全文核实，未冒充打开原文。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;三条主张：&lt;span class=&quot;chip&quot;&gt;谈话驱动&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;轻材料&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;聚焦涌现的语言&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- WA-02 Fluency --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-flu&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;quote&quot;&gt;&quot;Fluency is a function of memory.&quot;&lt;br&gt;&lt;span style=&quot;font-size:12px;color:#7c8a94;font-weight:400&quot;&gt;流利度其实是记忆的函数——实时无停顿地说话，靠的是记忆中存有一库存量充足的套式「语块」。（Thornbury 原文，由高校教师培训课件逐字引录）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;说得顺 ≠ 说得快：靠的是脑子里存着的整块现成话（WA-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：流利度的观测指标不是语速，而是两次停顿之间能连贯输出多长。语块是「可靠的小岛」——把加工负荷从逐词拼装降到整块提取，话就顺了。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：专家博客（《An A–Z of ELT》&quot;F is for Fluency&quot;, 2009）+ 学术版双重著录（Thornbury 2019, 剑桥《Cambridge Papers in ELT》）· 证据等级：专家博客，其后经作者本人学术化复核&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;证据一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;儿童朗读速度与语块熟悉度显著相关（Ellis et al. 2008）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;引自 Thornbury 2019 年学术版。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;证据二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;被老师反复使用的课堂语块频率，解释了学习结果的相当变异（Shin &amp;amp; Nation 2008）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;老师嘴里的现成话，就是学生库存的来源之一。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;Thornbury 本人列明了反对意见：成人学习者会把语块拆开分析再重组（Wray 2002 的批评）——记忆库存是流利度的下限通道，不排斥规则加工。对儿童恰恰相反：拆解倾向弱、整块记忆强，本条对小学阶段的适配度反而高于成人。本条与专著锚点双向互证（Pawley &amp;amp; Syder 的句干库存、语料库搭配研究），网文的独特贡献是把它压成一句可教的话，并给出课堂读法：看停顿间的长段，不看语速。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;练流利这样练：&lt;span class=&quot;chip&quot;&gt;整块背熟常用话&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;看停顿间的长段&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;不比语速&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- WA-03 WA-04 被动侦探 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-passive&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;26&quot; width=&quot;104&quot; height=&quot;32&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;be + 过去分词&lt;/text&gt;&lt;rect x=&quot;132&quot; y=&quot;26&quot; width=&quot;104&quot; height=&quot;32&quot; rx=&quot;9&quot; fill=&quot;#fdeeee&quot; stroke=&quot;#d66&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#b33636&quot;&gt;像 ensue 这种词&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#257a35&quot;&gt;有宾语才能变被动&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#b33636&quot;&gt;没有宾语，变不出来&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;先认准句式，再开口批评&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;骂一句话之前，先认准它是不是被动句（WA-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Pullum）：被动是&lt;b&gt;形式范畴&lt;/b&gt;——由 be/get + 过去分词构成，主语对应主动句的宾语。不及物动词没有宾语，结构上不可能有被动式。误认的危害是实打实的：真正想批评的是「把责任说没了」的内容问题，一旦错扣「被动语态」的帽子，对方尽可以指出术语错误而全身而退，真问题反而被放过。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：专家群体博客（Geoffrey Pullum, Language Log, 宾夕法尼亚大学托管, 2012）· 证据等级：专家博客（公开论证 + 案例存档），其判准与《剑桥英语语法》专著完全一致；原文已打开全文核实&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;等式一 ✗&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;「被动 = 一种时态」不成立（WA-04）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;语态与时态是两个独立维度：&lt;span class=&quot;en&quot;&gt;I am irritated by…&lt;/span&gt; 是现在时被动，&lt;span class=&quot;en&quot;&gt;I was irritated…&lt;/span&gt; 是过去时被动——时态在变，语态不变。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;等式二 ✗&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;「被动 = 说话含糊」双向不成立（WA-04）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;被动句可以带 by 短语把做事的人说全（…by the dog）；主动句也能把人藏起来（&lt;span class=&quot;en&quot;&gt;They&#x27;ve decided…&lt;/span&gt; 的 they 是谁并未交代）。该警惕的「含糊推责」是一种修辞选择，与用哪种语态没有必然关系。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;也有写作教师认为「少用被动」作为文体启发即便术语不严也有用；Pullum 的回应是误标会反噬教学公信力——本页取 Pullum 的判准、存启发派的存在（WA-03）。对小学阶段，本组服务于老师与教材编写者：引进任何「别用被动句」类规则前，先用形式判准自检。误认有源头：Orwell 名文与 Strunk &amp;amp; White 手册的坏示范污染了几代评论者（与 WA-05 相连）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;判准口袋版：&lt;span class=&quot;chip&quot;&gt;be/get + 过去分词？&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;主动句里它原是宾语？&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;两个都对，才是被动&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- WA-05 公开勘误 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-errata&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;20&quot; y1=&quot;58&quot; x2=&quot;230&quot; y2=&quot;58&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;42&quot; cy=&quot;58&quot; r=&quot;6&quot; fill=&quot;#b45309&quot;/&gt;&lt;text x=&quot;42&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;800&quot; fill=&quot;#b45309&quot;&gt;2009 长文&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;期刊批评&lt;/text&gt;&lt;circle cx=&quot;112&quot; cy=&quot;58&quot; r=&quot;6&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;800&quot; fill=&quot;#2f7db0&quot;&gt;同日 博客导读&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;开放讨论&lt;/text&gt;&lt;circle cx=&quot;182&quot; cy=&quot;58&quot; r=&quot;6&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;2010 扩展版&lt;/text&gt;&lt;text x=&quot;182&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;+ 辩护文往复&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;纸书的勘误周期是再版，博客的勘误周期是当天&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一本书写错了不会自己改——专家在网上盯着它公开勘误（WA-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Pullum 批评 Strunk &amp;amp; White 语法错误的长文（2009）发表同日，Language Log 的导读帖把它引入博客读者群并开放讨论；此后十余年，「被动误认案例库」（WA-03/WA-04）持续为长文的核心论断追加新证据；辩护方的文章（Bulley 2010）也在公开渠道留痕，双方可互查。这就是网文渠独有的知识形态：为专著结论提供持续更新的公开复核层。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：专家群体博客（Language Log, 2009 导读帖及后续系列）· 证据等级：传播史事实，均可逐项打开核查；与 NE-15（长文本身）分开著录、互相指引&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;本条是关于「知识传播形态」的元条目，不直接产生儿童教学内容；它的课堂落点是&lt;b&gt;教师侧纪律&lt;/b&gt;：规矩对不对，不看印了多少年，要看经不经得起查。辩护方的成立范围同 NE-15：限于文体启蒙，不动摇「语法论断无据」的判定。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Pullum 在 Language Log 称那本手册为「吃掉美国大脑的书」（the book that ate America&#x27;s brain）——这句批评如今已写进该书在 Wikipedia 上的公共评价史。公开批评留下的痕迹，谁都能查。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- WA-06 规则滑动尺 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-scale&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;path d=&quot;M24 62 h202&quot; stroke=&quot;#b45309&quot; stroke-width=&quot;4&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;62&quot; r=&quot;9&quot; fill=&quot;#257a35&quot;/&gt;&lt;circle cx=&quot;125&quot; cy=&quot;62&quot; r=&quot;9&quot; fill=&quot;#d4880f&quot;/&gt;&lt;circle cx=&quot;198&quot; cy=&quot;62&quot; r=&quot;9&quot; fill=&quot;#b33636&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#257a35&quot;&gt;硬约定&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96690a&quot;&gt;机构约定&lt;/text&gt;&lt;text x=&quot;198&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#b33636&quot;&gt;个人偏好&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;规定主义是一条滑动标尺，不是两种阵营&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;英语没有「官府」定对错——对错是约定俗成（WA-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（职业编辑 Stan Carey）：英语没有官方语言学院，就不存在放之四海皆准的「统一标准英语」，只有地方与机构的约定（原文：&quot;There are local and institutional conventions, but since English lacks an official language academy, there is no universal Standard English.&quot;）；正确性最终是社会约定。编辑与老师的真实技艺，是依语境在标尺上&lt;b&gt;换位&lt;/b&gt;：分清哪条是硬约定、哪条是机构约定、哪条只是个人偏好。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：从业者专家专栏（Stan Carey《Sentence First》, 2010）· 证据等级：高声望从业者专栏（作者为职业编辑，非学院语言学家）；被 Vocabulary.com「Blog Excerpts」选摘长期展示，被教师出版机构誉为「最好的总结」；原站 403，经该全文摘录核实&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;换位术&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;规则分三等，老师按语境换位（源文件对照表归纳）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是编辑行业传统给清单的独有增量：语言学的描写条目从没给出过这套实务分类法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;小学阶段不教「描写主义」这个词，教的是态度：约定可以学、伪规则不必怕。但考试有评分约定——「地方与机构约定」在应试语境就是真实约束，不可用本条否定考试规范（WA-06）。Carey 的「战争结束」是修辞性调停：语言学家多自认描写派，词典编者与编辑在两派间换位，主张是按个案判断而非站队。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;三等分：&lt;span class=&quot;chip&quot;&gt;硬约定（照守）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;机构约定（看场合）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;个人偏好（不必怕）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- WA-07 WA-08 故事课 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-story&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;28&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;语言年龄尺&lt;/text&gt;&lt;rect x=&quot;134&quot; y=&quot;28&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;心智年龄尺&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;话太难听不懂 · 故事太幼稚没意思&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;两把尺都对上，才是好故事&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;选故事要对两把尺：语言年龄 × 心智年龄（WA-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（British Council 少儿英语专家 Gail Ellis）：孩子的第二语言水平可以落后，但他们的观念与志向与发育年龄相称——选书须同时过语言与认知两关（原文：&quot;The key to successful storytelling is having the right story for the linguistic and cognitive ability of the children.&quot;）。图画是理解的脚手架：孩子把听到的声音与看到的画面对位，不用翻译就能把握整体意义；故事课还要设计成「准备—讲述中—后续」的序列，并在一开始告诉孩子本课的产出（表演、做一本书、做一个项目）。&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;来源形态：机构官方专栏（British Council《Voices Magazine》, Gail Ellis——《Tell it Again!》合著者）· 证据等级：权威机构 + 具名领域专家（教学法共识层，无对照实验数据）；机构官网原文已打开全文核实&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;讲 ≠ 读&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;先把故事拆成「骨架」装进脑子，眼睛和身体才能空出来表演（WA-08）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;讲述者按故事骨架（情节、场景、角色、关键语句的提纲图）用自己的话重建故事，不逐字背诵；正因眼睛离开书页，才能用目光、手势、表情与孩子交流。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 表演参数与年龄分段&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;三段式&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;讲前激活背景 → 讲述中参与 → 讲后活动（WA-08）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;变化音量、音高与语速，为不同角色换声线，用手势「画」场景，用停顿制造期待。低龄段以重复句式参与（举图、齐声重复、做动作），高龄段以预测与核对参与；讲后可由讲述者&lt;b&gt;故意讲错&lt;/b&gt;让孩子纠正、把故事编成 chant 复述。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;span class=&quot;src&quot;&gt;WA-08 来源形态：机构教师平台方法文（Paula Stoyle, British Council 教师培训师, TeachingEnglish；经 ELTA 塞尔维亚教师协会通讯 2014 年授权转载版核实）· 证据等级：从业者工作坊文章，低于 WA-07&lt;/span&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;WA-07 的效果表述（如发展视觉素养、社会情感）应按经验主张引用，而非实证结论；页面未标刊年，以访问日与作者在职身份为据。WA-08 中「孩子天生爱故事」是经验性表述而非研究结论，本页只采其技艺层（骨架法、表演参数、三段式）。另有一条原文没有的课堂化提醒（源文件已标明）：「故意讲错」须控制频率，避免低龄儿童把错误版当真。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;讲述者的工具箱：&lt;span class=&quot;chip&quot;&gt;故事骨架图&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;换声线&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;手势画场景&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;停顿造期待&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;重复句一起喊&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：被动语态误认门诊&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病人都是真病例，全部来自 Language Log 十余年的「被动误认案例库」（WA-03/WA-04）——病不在句子，在认错句式的人。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病例一：《经济学人》把 ensue 的句子斥为「被动语态」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：范畴错误。&lt;/span&gt;ensue（接踵而至）是不及物动词，没有宾语，结构上变不出被动式。那篇文章真正想批评的是「把责任说没了」，那是内容问题——帽子扣错，批评就落空（WA-03）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病例二：企业文体指南把 have decided 标成「被动」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：误认。&lt;/span&gt;have decided 是现在完成时主动式。同系列病例还有把将来进行时 will be implementing 误标为被动的——Pullum 用「0 for N」计数法记录专业写作圈的辨认失败率（WA-03）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病例三：广播节目称一句普通主动句是 &quot;in the passive tense&quot;&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：维度混淆。&lt;/span&gt;根本没有「被动时态」这个东西：语态和时态是两个独立维度。被动句自带现在、过去之分（I am irritated… / I was irritated…），时态在变、语态不变（WA-04）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病例四：「这句太被动了，含糊推责！」——可句子明明带着 …by the dog&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：等式不成立。&lt;/span&gt;被动句可以把做事的人用 by 短语说得全全的；反过来，主动句 They&#x27;ve decided… 照样能把人藏起来。推责是一种修辞选择，不归语态管（WA-04）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 先诊断，再迁移&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.下面哪句才是被动句？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;A scandal ensued.&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;The window was broken by the dog.&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;c&quot;&gt;They have decided.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.&quot;I was irritated by the noise&quot; 和 &quot;I am irritated by the noise&quot;，变的是什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;时态变了，语态没变（都是被动）&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;语态变了，时态没变&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.课堂上一个孩子说：「Yesterday… park… play… happy!」按 Dogme 的取材纪律，老师最该先做什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;翻开课本，按进度表讲下一个语法点&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;抓住这句当场回铸成整句写上黑板，作为今天的新句子&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.给三年级选英文绘本：一本语言简单但内容是给幼儿看的，一本图画丰富、故事正合他们心思但句子略难。按「双尺」该选哪本？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;后一本：心智尺对上，语言的难处由图画脚手架托住&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;前一本：语言简单永远优先&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.一个孩子说英语总是蹦词、停顿多。按 WA-02，该帮他练什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;练语速，越快越流利&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;把常用整块话存熟，让停顿之间的长段变长&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一个核心机制（儿童版标题句 + 示意图 + 案例 + 诚实边界小字）；每条均标明来源形态（专家博客 / 从业者专栏 / 机构官方专栏）与证据等级——专家专栏 ≠ 同行评审，网文的地位依据是「作者资历 + 平台权威性 + 长期引用」三项可核事实。&lt;b&gt;中文网文未收&lt;/b&gt;：按同一门槛检索后，能定位到的只有新闻对学者的转述与培训营销内容，不合门槛，故本簇未收中文网文，宁缺毋滥（若有具体学者专栏线索可按同门槛补核）；剑桥渠道亦未收——具名内容多为活动摘要与访谈转述，未定位到合格的专家原创专栏长文。&lt;br&gt;内容来源：catalog_add_web_classics.md（WA-01 – WA-08，共 8 条）。待核项：0 条整条待核；访问限制如实记录——Thornbury 与 Carey 原文页对自动抓取返回 403，两条经第三方权威引录（British Council 官方导读、高校课件逐字引录、Vocabulary.com 全文摘录）核实，未冒充打开原文；Language Log 与 British Council 两站为直接打开全文核实。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
const f=document.getElementById(b.dataset.f);
f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{
const fb=g.nextElementSibling;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
const v=o.dataset.v||o.textContent.trim();
const right=v===g.dataset.a;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
fb.textContent=right?&#x27;对了：这正是本页机制的用法——先认准形式，再开口判断；材料从学生嘴里来；选书过两把尺。&#x27;:&#x27;再想想：回到机制——它有宾语能变被动吗？变的是时态还是语态？材料该从哪儿来？两把尺都对上了吗？&#x27;;
}));
});
&lt;/script&gt;

&lt;h1&gt;做课人的书房&lt;/h1&gt;
&lt;p&gt;这一组不是给孩子看的课，是给做课的人看的书房：十三条检查标准，管的是规则怎么出场、练习怎么设计、听说读说各缺哪一格。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;一句话总纲：&lt;/b&gt;此前清单里几乎全是「学习者侧的事实」；这一组补的是「设计者侧的检查表」——孩子在学生面只会看到它落下来的结果：练习为什么这样安排、这一课为什么先讲这个。&lt;/div&gt;

&lt;!-- TM-01 TM-02 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-skill&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;130&quot; cy=&quot;58&quot; r=&quot;40&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M130 58 L130 18 A40 40 0 0 1 165 82 Z&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M130 58 L165 82 A40 40 0 0 1 95 82 Z&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;用&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;80&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;义&lt;/text&gt;&lt;text x=&quot;106&quot; y=&quot;80&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;形&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;三维派：切入点可以换，配比要重组&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;知道规则像知道菜谱；会语法像会炒菜——要在说话的当口把对的形式端出来（TM-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Larsen-Freeman 的 grammaring 主张：语法是继听说读写之后的第五技能，指「准确、有意义、得体地使用语法结构的能力」。传统教学的病叫惰性知识——课上填得对，真开口时用不出，因为背的是静态系统，技能却只能在使用中长。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;填空全对、开口卡壳，就是惰性知识的标准像。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;设计含义：规则讲解至多是一个输入口，目标活动必须让学习者在语篇里用形式做事。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;TM-02&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;每个语法单位过三问：形、义、用。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例二：学习者知道 house 的意思，却不知道何时该说 residence / dwelling——词典给了形和义，「用」（正式程度、场合）没人教，产出对而不得体。三问各对一种质量：形→准确，义→有意义，用→得体。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;「第五技能」是教学论主张，不是实证定律；它否认的是「讲解 = 学会」，不否认讲解的价值。显性教学阵营指出讲解对测验型产出效率高——分歧的实质是双方量的「学会」不是同一个东西（TM-01）。三维框架给出的是检查维度，「用」维没有封闭清单（TM-02）。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;落到孩子身上：&lt;/b&gt;学生面不会出现「grammaring」这个词；孩子只会发现，这个 app 的语法活动总是让他开口做事，而不是背完规则就结束。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-03 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-route&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;path d=&quot;M20 96 V40 M130 96 V40 M240 96 V40&quot; stroke=&quot;#c9bda9&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;2&quot; y=&quot;18&quot; width=&quot;76&quot; height=&quot;24&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;先给规则&lt;/text&gt;&lt;rect x=&quot;92&quot; y=&quot;18&quot; width=&quot;76&quot; height=&quot;24&quot; rx=&quot;9&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;先看例子猜&lt;/text&gt;&lt;rect x=&quot;182&quot; y=&quot;18&quot; width=&quot;76&quot; height=&quot;24&quot; rx=&quot;9&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;整篇里挖&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;三条路没有天生的优劣，看情境选路&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;新句型可以老师先讲、可以让孩子先猜、也可以藏在故事里让大家找出来（TM-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Thornbury 把语法呈现立为决策谱系：演绎路（先规则后例子）、归纳路（先例子后归纳）、语篇路（在整篇真实语篇中呈现，代表技术 dictogloss：听短文、记要点、小组重写、与原文对照）。选哪条由情境变量决定——评价框架是 E-factor（economy / ease / efficacy）与 A-factor（appropriacy），已在语法组 GR-21 著录；注意：原书就是 E / A，不存在所谓「E/P 框架」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;规则本身先要过门槛：Swan 的五标准。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;真、有界（说清不适用的地方）、清晰、简单、可亲（用学习者已知的概念讲）——规则不达标，再好的呈现路也救不回来。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;dictogloss 是语篇路的招牌动作。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;听一遍短文 → 记要点 → 小组重写 → 与原文对照：语法点是在「自己写不出原文那么好」的落差里被注意到的。对小学低段，记要点的能力还没成熟，须大幅简化或不用——这是源文件写明的边界。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;演绎与归纳何者更优，实证结论至今混合：归纳在保持与迁移上常占优，但耗时、且对低龄低水平者门槛高。本屏只给决策维度，不裁定路线信仰。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-04 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-target&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;42&quot; fill=&quot;none&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;28&quot; fill=&quot;none&quot; stroke=&quot;#b07908&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;13&quot; fill=&quot;#b33636&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;34&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;练准&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;34&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#8a5a00&quot;&gt;练顺&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;最里圈是「重组」：靶心最难打，也最常缺席&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;同一组练习，目的可能完全不同：把句子说对、把句子说顺、把脑子里那套旧说法换新（TM-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：练习三靶——Accuracy（准确，受控操练）、Fluency（流利，交际任务）、Restructuring（重组：旧的错误概括被新证据推翻重建）。只有第三靶触及系统变化；操练只会巩固已有的系统，错误系统会被越练越牢——除非练习内含迫使重组的新证据与冲突。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;配套纠错法：reformulation（改述）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;老师把学习者的话用正确地道的形式重说一遍，让他对照自省，而不是当场打断——纠错的时机与方式是设计变量，不是态度问题。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;课型之争（PPP 对任务型）实质是三靶配比之争。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;先说清这一单元三个靶各占多少，再选活动；混为一谈是练习失效的主因。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;「重组」是周 / 月尺度的变化，一节课里看不见、验不了——三靶是单元与学期的检查表，不是课时目标。改述对极低水平者（听不出差别）效果有限，属有条件推荐。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-rules&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;24&quot; width=&quot;216&quot; height=&quot;78&quot; rx=&quot;12&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;六条是「否决线」，不是「必做清单」&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5f5546&quot;&gt;过了否决线，再用 E / A 因子选路（TM-03）&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5f5546&quot;&gt;整组使用，单抽一条都会跑偏&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;教语法有六条别犯的错：别脱离故事讲、别光讲不用、别一股脑全倒、别教用不上的、别催着全学会、别对谁都一个教法（TM-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Thornbury 第 10 章「How NOT to teach grammar」的六条 Rule：语境律、使用律、经济律、相关律、培育律（Nurture）、适切律。其中培育律是他的涌现主义立场：语法能力很大程度上是「长出来的」，教学的职责是供给生长条件（可理解输入、使用机会、注意引导），而非把整个系统一次性装入。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;语境&lt;/b&gt;：在语篇里教，孤立句是残缺的形式—意义配对。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;使用&lt;/b&gt;：目标是使用能力，规则知识只是中途站。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;经济&lt;/b&gt;：讲解越短，练习时间越多。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;相关&lt;/b&gt;：只教与当前水平和需求相关的。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;培育&lt;/b&gt;：供给生长条件，不催全学会。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;适切&lt;/b&gt;：方法服从年龄、水平、班额与期望。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;戒律是经验法则，不是实证定律；经济律的「短」没有量化标准。培育律若被极端化（什么都不教、只等长出来），恰是 Thornbury 本人反对的强交际极端——它受语境、使用、相关三条约束，必须整组使用。他的折中是：教，但教得像园丁而非工程师。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-five&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;text x=&quot;22&quot; y=&quot;40&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;五关&lt;/text&gt;&lt;rect x=&quot;58&quot; y=&quot;20&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;效&lt;/text&gt;&lt;rect x=&quot;98&quot; y=&quot;20&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;115&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;量&lt;/text&gt;&lt;rect x=&quot;138&quot; y=&quot;20&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;成&lt;/text&gt;&lt;rect x=&quot;178&quot; y=&quot;20&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;195&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;异&lt;/text&gt;&lt;rect x=&quot;218&quot; y=&quot;20&quot; width=&quot;34&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;41&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;趣&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;效度 · 数量 · 成功导向 · 异质性 · 趣味&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;五关不过，活动做得再热闹也是注水&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;给孩子出的每一组练习，先自查五件事：练的是不是它说的那个本事？量够不够？是不是大多能做对？好中差能不能都下手？有没有意思？（TM-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Penny Ur 的有效练习五特征是全书的评价骨架。关键论断在成功导向：自动化来自反复成功地执行；纠正学生 50 次，至多提升其意识，不会自动改善实际表现——练习环节里，错误是成本而不是资源。练习的定义本身也立了界：把所学巩固进长时记忆、且教师支持逐步撤除——这把「练习」与「表演 / 测验」分开。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;效度反例：完成时填空，空里要填的全是 has / have。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;靠位置就能填对——程序测的是眼力，不是完成时。这正是 app 练习最容易注水的地方。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;异质性正例：开放题没有唯一答案。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Ur 的例子大意是：由「Jenny 是婴儿所以不上学」发散开问，各水平的学生都有话可说；而只有对错两档的选择题是同质的——只有会的人能下手。数量关同理：量太少的「练习」，实质只是非正式测验。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;张力并呈（小字）：&lt;/b&gt;Ur 的「成功导向」与学习科学的「合意困难」（LS-08）表面打架，源文件的裁决是&lt;b&gt;对象不同&lt;/b&gt;：Ur 谈技能的自动化阶段（执行须流畅，错误执行同样会被自动化），Bjork 谈陈述性记忆的保持（提取越努力记得越牢）。app 侧分工：新技能的练习关卡保持高成功率；已学内容的复习环节，故意加提取难度。用反了，两边都受伤。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-recipe&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;45&quot; cy=&quot;58&quot; r=&quot;24&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;有纲&lt;/text&gt;&lt;text x=&quot;45&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#857a6a&quot;&gt;心里有地图&lt;/text&gt;&lt;circle cx=&quot;102&quot; cy=&quot;58&quot; r=&quot;24&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;简规&lt;/text&gt;&lt;text x=&quot;102&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#857a6a&quot;&gt;规则讲人话版&lt;/text&gt;&lt;circle cx=&quot;159&quot; cy=&quot;58&quot; r=&quot;24&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;159&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;集练&lt;/text&gt;&lt;text x=&quot;159&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#857a6a&quot;&gt;专心练一阵&lt;/text&gt;&lt;circle cx=&quot;216&quot; cy=&quot;58&quot; r=&quot;24&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;216&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;真用&lt;/text&gt;&lt;text x=&quot;216&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#857a6a&quot;&gt;到真说话里用&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;四步是逻辑次序，不是死排的时间顺序&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;稳妥走法：心里有张地图、规则讲人话版、先专心练一阵、再到真说话里用——哪里缺补哪里（TM-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Ur 的中间路线配方：系统的语法大纲有帮助；简化版显性规则有帮助（简化是刻意的教学处理，不等于规则不真）；集中的形式练习有益（但须过 TM-06 五关）；比机械练习更重要的是有意义的使用；交际中的即时回应式教学能增益。总目标克制：不是完美，而是掌握最重要的用法、能有效且可接受地传达意义。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;顺序不必排死。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「规则 → 机械练 → 意义练 → 交际用」只是逻辑次序，真实课堂可以从任何一处切入、来回环——这是配方里最容易被误读成课表的一条。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;即时回应是正式教学的一部分。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;学生在用语言做事时，教师就其形式问题作出回应——与 TM-04 的改述同向，都是「在交际中回应」，而非「打断纠错」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;「系统大纲」对低龄儿童适用性最弱——儿童的系统感主要来自活动序列，而不是语法纲目本身。「简化规则」以不失真为界：越界即成假规则，本项目数据审计删掉的民间口诀多属此类。与 Thornbury 相比，Ur 明显更信任教学干预，这是光谱位置之争，非对错之争。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hear&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;16&quot; width=&quot;216&quot; height=&quot;20&quot; rx=&quot;8&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;神经层：听见、注意&lt;/text&gt;&lt;rect x=&quot;22&quot; y=&quot;42&quot; width=&quot;216&quot; height=&quot;20&quot; rx=&quot;8&quot; fill=&quot;#dcebf7&quot; stroke=&quot;#274156&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;语言层：切分词句、认词&lt;/text&gt;&lt;rect x=&quot;22&quot; y=&quot;68&quot; width=&quot;216&quot; height=&quot;20&quot; rx=&quot;8&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;语义层：补全、推理、记忆&lt;/text&gt;&lt;rect x=&quot;22&quot; y=&quot;94&quot; width=&quot;216&quot; height=&quot;20&quot; rx=&quot;8&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;1.8&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;语用层：猜意图、组织回应&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;听英语不是把声音录下来，是边听边猜、边补、边核对——听的人和说的人一起把意思搭出来（TM-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Rost 的二语听力加工层级模型：神经 → 语言 → 语义 → 语用，终点是自动加工。听力理解的主要工作发生在语义 / 语用层：听者用图式、语境和意图推断，主动补出未听清与未明说的部分（listener enrichment)。低层自动化之后，高层建构才有资源可用。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;困难一：词都黏在一起，听不出词界。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是低层切分失败——药是语音切分与精听训练。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;困难二：每个词都听到了，意思却没搭起来。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是高层建构失败——药是图式、预测与推理训练。两种困难长得像，诊断与药完全不同。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;层级是诊断用的分析框架，不代表加工在时间上严格串行。对小学儿童，低层（语音切分）权重通常更高——儿童的图式与推理资源尚在发育，高层补偿弱于成人，配比须调整。与语音组（S 组）的分工：那边管「听出 / 读出词形」，Rost 管「听懂意思」；只练前者的听力课，只训了四层中的一层半。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-sixhear&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;38&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;六种听&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#857a6a&quot;&gt;配比审计&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;30&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;精听&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;30&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;选听&lt;/text&gt;&lt;text x=&quot;22&quot; y=&quot;104&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;互动听&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;104&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;自主听&lt;/text&gt;&lt;text x=&quot;118&quot; y=&quot;14&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;泛听&lt;/text&gt;&lt;text x=&quot;112&quot; y=&quot;120&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;回应听&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;听英语有六种听法：逐字抠的、抓重点的、边听边接话的、听着玩的、听完要表态的、自己找来听的（TM-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Rost 第 9 章的听力活动类型学是配比审计工具：六类各有加工重心——精听训低层切分，选听训注意分配，互动听让听与说咬合，泛听以量促自动化与语感，回应听主攻语用层，自主听是前五类的迁移终点。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;精听&lt;/b&gt;：短材料、高密度，抠切分与解析。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;选听&lt;/b&gt;：长材料里抓指定信息。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;互动听&lt;/b&gt;：听的目的在回应与协商。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;泛听&lt;/b&gt;：大量、自选、低压。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;回应听&lt;/b&gt;：听后须给出评价与立场。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;自主听&lt;/b&gt;：自设目标、自选材料、自我监控。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;六类是设计分类，不是发展序列，不要求按序解锁；小学阶段「自主听」要降格为「在有限菜单中自选」。一个课程若只有精听题（中国课堂与多数 app 的常态），六格空五格，缺的恰是泛听与互动听。泛听的证据强度在本子领域仍有争议，学习科学侧的频率 / 间隔条目从另一路为「量」提供支撑。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-read&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;26&quot; width=&quot;98&quot; height=&quot;52&quot; rx=&quot;11&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#274156&quot;&gt;认词工人&lt;/text&gt;&lt;text x=&quot;71&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;必须练到自动&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;58&quot; font-size=&quot;17&quot; fill=&quot;#b7a98d&quot;&gt;+&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;26&quot; width=&quot;98&quot; height=&quot;52&quot; rx=&quot;11&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;189&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;懂故事工人&lt;/text&gt;&lt;text x=&quot;189&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#857a6a&quot;&gt;主旨、推理、监控&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;认词组慢了，懂故事组就没人手&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;看英文时脑子里有两组工人：一组认词，一组懂故事——认词要练到不用想，故事才读得懂（TM-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Grabe 的双层加工架构：低层（词识别、词汇—句法加工、命题编码）必须自动化，因为工作记忆有限，认词每多耗一份资源，理解就少一份；高层（主旨建构、文本与情境模型、推理、监控）才有余力运转。阅读困难先分层归因：低层卡住与高层缺失，药完全不同。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;低层卡住：词认得慢、词汇量小。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;理解策略教得再好也没有运行的资源——先补认词自动化，别先怪「不会读题」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;高层缺失：词都认得，却抓不住主旨、不会推理。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;药在高层：主旨、篇章结构与策略训练（见下一屏七项）。与拼读侧（S 组）的分工：那边建「词形 → 词义」的通道，Grabe 管通道自动化之后的理解系统。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;源文件给出的认词速度数字是流利成人读者的量级，绝不可当作儿童的达标指标——儿童取的只是方向：认词自动化程度决定理解上限。双层是分析框架，真实阅读中两层高度交互，分层是为诊断与分工，不是说脑子分两班倒。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-seven&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;七项，不是十项&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5f5546&quot;&gt;按作者本人讲演的定版著录&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5f5546&quot;&gt;「十项」说法未在已打开的来源中核到&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;宁缺毋编：核到几项，就写几项&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;把英语读好有七件套：认识很多词、一眼抓住大意、看得出文章骨架、读得顺、用得上小策略、读很多很多、读时顺便学知识（TM-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Grabe 的七项教学含义与双层架构一一对应：认读词汇与流利度建低层自动化；主旨、篇章结构、策略读者建高层；大量阅读供总量；语言与内容整合供生态。排序是讲演的呈现序，不是重要性权重序。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;1 大词汇&lt;/b&gt;：建庞大的认读词汇——见词识义的速度与量。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;2 抓主旨&lt;/b&gt;：专门练抓大意，而非只答细节题。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;3 看篇章&lt;/b&gt;：教文章的组织骨架，能迁移到新文本。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;4 练流利&lt;/b&gt;：流利度本身就是教学目标。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;5 养策略&lt;/b&gt;：培养会计划、监控、调整的读者。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;6 海量读&lt;/b&gt;：大量阅读是课程要件，不是课外自愿。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;7 融内容&lt;/b&gt;：读真实题材，语言在内容中长。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;b&gt;定位&lt;/b&gt;：七项是为有一定识字基础的学习者提炼的；小学低段，第 1、4 项先让位于解码建设。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;七项证据强度并不齐：策略教学的独立效应在元分析中中等偏小，弱于大量阅读与词汇两项——并列呈现是著录体例，入模时应按证据强度分层（此为清单的编辑判断，源文件已标明非原书表述）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-speak&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;106&quot; height=&quot;50&quot; rx=&quot;11&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#274156&quot;&gt;嘴跟得上&lt;/text&gt;&lt;text x=&quot;71&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;生产技能：听清、想起、说成串&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;30&quot; width=&quot;106&quot; height=&quot;50&quot; rx=&quot;11&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;189&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#6b4226&quot;&gt;脑子在线&lt;/text&gt;&lt;text x=&quot;189&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#857a6a&quot;&gt;互动技能：轮次、协商、管理&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;知道操纵杆的名字 ≠ 会开车（Bygate 的喻）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;开口说英语要过两关：一关是嘴巴利索，一关是脑子跟得上场面——两关都得练（TM-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Bygate 先分知识与技能：知道语法词汇只是知识，能在当场快速决定、顺畅执行、随意外调整，才是技能。生产技能须练至近乎自动，因为说话是实时的、没有回改余地；互动技能是对话中的决策系统：套路（现成的对话脚本段落）、意义协商（听不懂、说不清时如何澄清修复）、互动管理（话题的开启、维持、结束与轮次分配）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;为「绕过去」正名：顺畅化与补偿是生产技能的合法部件。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;简化、省略、用熟式填充让产出跑得动；换词、迂说、求助把缺口绕过去——Bygate 明说，这能帮学习者开口、从而学会开口，不是作弊。与表达组的「卡壳不是失败」（E-11）互为表里。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;策略分两种：成就策略对缩减策略。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;绕着说、想办法说清，是成就；避谈、把目标改小，是缩减——省事但不长本事，教学应奖励前者。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;原书面向教师培训的成人语境：迁到小学要降格——互动管理简化为轮次与求助脚本，自动化标准按儿童语速与注意跨度下调。准确派批评这套框架会纵容错误固化；Bygate 的回应是：准确与互动不是二选一，是课程配比问题。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- TM-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-task&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#274156&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#274156&quot;&gt;信息差&lt;/text&gt;&lt;rect x=&quot;74&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#faf3e8&quot; stroke=&quot;#6b4226&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#6b4226&quot;&gt;游戏&lt;/text&gt;&lt;rect x=&quot;134&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;模拟&lt;/text&gt;&lt;rect x=&quot;194&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;项目&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#857a6a&quot;&gt;换玩法，就是换练到的技能&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;练说话的活动分四种玩法：拼图式、游戏式、演一场式、一起做件真事式（TM-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：分类的深层标准是任务条件对产出的塑造：同一语言点，信息差练协商与澄清，模拟练得体与管理，游戏练速度与自动化——教师选任务，即是选技能。书末的方法论收尾是「教师即研究者」：任务效果依语境而变，要靠小规模课堂项目在自己班上检验，框架给的是谱系与变量，不是保证书。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;信息差是互动技能的最低成本发生器。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;双方各持对方没有的信息，不开口就拼不全——几乎所有交际教材的双人活动都以此为默认结构。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;模拟与项目把压力调高、把链条拉长。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;模拟在「像真的」压力下综合两族技能；项目以真实产出物为目标做长程协作。儿童本就擅长假装游戏，模拟对小学是加分项（此为适配判断，源文件已标明非原书表述）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;四类按 1987 年的课堂形态写成，不含数字媒介互动；迁到 app 时分类逻辑（按任务条件分）仍可用，活动实例须重设。任务型教学（TBLT）后来把「任务」升格为整个大纲的单位，超出本书「活动谱系」的定位，引用时勿混。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;练习诊所：拿检查表验三份「作业设计」&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这一组没有学生的病句，只有设计者的病设计。用 TM-06 五关与 TM-09 配比当听诊器。点「看诊断」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 设计一：完成时练习，十个空要填的全是 has / have，靠位置就能全对&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看诊断&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：&lt;/span&gt;效度关不过（TM-06）——程序实际在测眼力，不是完成时。改法方向：让空真正落在完成时与其他形式的选择上，程序测什么，题面就得逼学生用什么。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 设计二：一整个单元的听力，全是逐字抠的精听题&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看诊断&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：&lt;/span&gt;配比缺角（TM-09）——六种听只占一格，泛听（自动化与语感的来源）与互动听（真实交际形态）全空。先补这两格，再谈难度。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 设计三：新句型刚学，练习故意出得很难，美其名曰「练得难记得牢」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看诊断&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;诊断：&lt;/span&gt;张力用反了（TM-06 边界）——合意困难管的是记忆保持，新技能的自动化阶段要的是高成功率；错误执行同样会被自动化。难度的位置在复习环节，不在初学关卡。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 先诊断，再迁移&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.（诊断）一组填空题靠词的位置就能全填对，它没过五关中的哪一关？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;valid&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;valid&quot;&gt;效度——没在练它声称的本事&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;趣味——题目不好玩&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;数量——题太少&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.（诊断）学生词都认得，就是抓不住文章大意——按双层架构，先查哪一层？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;high&quot;&gt;&lt;div class=&quot;opt&quot;&gt;低层：认词还不够快&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;high&quot;&gt;高层：主旨与推理没建起来&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;先查他的听力&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.（诊断）孩子每个词都听到了，却说不出讲了什么——这是听力四层里的哪种失败？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;build&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;build&quot;&gt;高层建构失败：意思没搭起来&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;低层切分失败：词界没切开&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;他没在听&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.（迁移）新技能刚上手时，练习关卡应该怎么设？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;succ&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;succ&quot;&gt;高成功率——先让正确执行自动化&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;故意很难——越难记得越牢&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;一半对一半错最公平&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.（迁移）复习老内容时，想记得更牢，该往哪边调？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;diff&quot;&gt;&lt;div class=&quot;opt&quot;&gt;再讲一遍规则&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;diff&quot;&gt;加提取难度——先自己想，再看答案&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;把题量减半&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6.（迁移）想练「听不懂时怎么澄清修复」，选哪类口语任务最对路？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;gap&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;gap&quot;&gt;信息差——不问清楚就拼不全&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;个人演讲——一个人讲到底&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;跟读录音——一字不差&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7.（迁移）Grabe 的二语阅读教学含义，定版是几项？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;seven&quot;&gt;&lt;div class=&quot;opt&quot;&gt;十项&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;seven&quot;&gt;七项——按作者自述定版著录&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;五项&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：本页是设计者侧原形——每屏 = 一条设计标准（大白话版 + 示意图 + 案例 + 诚实边界），学生面只呈现其落地结果；Thornbury 的评价框架按源文件著录为 E-factor / A-factor（语法组 GR-21)，不写「E/P 框架」；阅读教学含义按作者自述定版为七项。&lt;br&gt;知识来源：catalog_add_teaching_books.md · 教学法经典组 TM-01 – TM-13（Larsen-Freeman 2003；Celce-Murcia &amp;amp; Larsen-Freeman 1999；Thornbury 1999；Ur 1988/2009；Rost 2002/2011；Grabe 2009；Bygate 1987）。&lt;br&gt;待核：9 类挂账（6 本书各自的接触等级保留事项 + 总挂账 3 项）——其中 Larsen-Freeman、Rost、Grabe 三本未达原书正文级，条目已按接触等级收窄；「十大教学含义」在已打开来源中不存在逐字对应清单，按七项著录并留修订口。&lt;/div&gt;
&lt;/div&gt;
