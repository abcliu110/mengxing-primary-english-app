&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 词汇组（V-01 – V-18）&lt;/span&gt;
&lt;h1&gt;词汇仓库&lt;/h1&gt;
&lt;p&gt;背单词不是给词贴一张中文标签。词有好多面、爱成块出现、住在场景里——仓库的规矩先看清，词才存得住。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律一（V-01）：&lt;/b&gt;「认识一个词」是九个格子的事——形、义、用三面都建好联结，才算真会。&lt;b&gt;总规律二（V-05）：&lt;/b&gt;英语的积木是「词块」不是单个词——高手说话是整块取用，不是逐词现拼。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;grid&quot;&gt;九格&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;freq&quot;&gt;劳模词&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;legs&quot;&gt;四条腿&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;chunk&quot;&gt;词块&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;frame&quot;&gt;买卖戏&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;tree&quot;&gt;词树&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;fake&quot;&gt;假朋友&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-01 九格 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-grid&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;g9&quot;&gt;
&lt;div class=&quot;rh&quot;&gt;形 FORM&lt;/div&gt;
&lt;div class=&quot;c&quot;&gt;读音&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;拼写&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;构成&lt;/div&gt;
&lt;div class=&quot;rh&quot;&gt;义 MEANING&lt;/div&gt;
&lt;div class=&quot;c&quot;&gt;概念&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;联想&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;多义&lt;/div&gt;
&lt;div class=&quot;rh&quot;&gt;用 USE&lt;/div&gt;
&lt;div class=&quot;c&quot;&gt;语法&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;搭配&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;场合&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;一个词有好多面：长什么样、读什么音、是什么意思、和谁是好朋友、什么时候能说——全认识了，才算真会。（V-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：记忆不是贴一张中文标签，而是九条通道分别建链。「会认不会用」「会拼不会搭」，都是某一格没建好。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;缺格 1&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;背下 &lt;span class=&quot;en&quot;&gt;decision = 决定&lt;/span&gt;，写出 &lt;span class=&quot;en&quot;&gt;do a decision&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「义」格有了，「用—搭配」格是空的：错不在词义，在没建的那一格（详见词块屏 V-07）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 缺哪一格，就在哪一格出错&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;缺格 2&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;认识 &lt;span class=&quot;en&quot;&gt;dog&lt;/span&gt;，却说 &lt;span class=&quot;en&quot;&gt;two dog&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「概念」格有了，「形—构成」与「用—语法」格没跟上：不知道它变复数要加 -s。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 目标：九格逐格点亮&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;过关&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;查一个新词时顺手多问三句：怎么读？和谁搭配？在哪种场合说？&lt;br&gt;&lt;span class=&quot;why&quot;&gt;框架是清单不是习得顺序：低龄先点亮读音、拼写与核心义，搭配、场合随年龄后长（V-01 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Paul Nation《Learning Vocabulary in Another Language》(2001/2013) 形/义/用框架&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-02 + V-03 劳模词 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-freq&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div style=&quot;text-align:left;max-width:300px;margin:0 auto&quot;&gt;
&lt;div style=&quot;font-size:12.5px;font-weight:700&quot;&gt;最常用的约 2000 个词族&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:80%&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;div style=&quot;font-size:12px;color:#7c8a94&quot;&gt;罩住日常文本约八成的词次（V-02）&lt;/div&gt;
&lt;div style=&quot;font-size:12.5px;font-weight:700;margin-top:10px&quot;&gt;读懂一页书的硬线&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:98%&quot;&gt;&lt;/i&gt;&lt;/div&gt;
&lt;div style=&quot;font-size:12px;color:#7c8a94&quot;&gt;认识的词达到约 98%，才能流畅读、顺带猜出生词（V-03）&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;英语里有一小队「劳模词」，到处都是它们；先把劳模词认全，书里的大部分字一下子就都认识了。（V-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：词出现的次数极不均匀——少数词反复出现。学习顺序按频率排，就是按「每学一词能解锁多少文本」排。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-02&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;the, of, and, a, to, in, is…&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;一页书里到处是它们的身影。先攻劳模队，回报率最高；学术词表 570 词族另罩住学术文本约一成。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 劳模认全之后，还差一条线&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-03&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一页 100 个词，&lt;span class=&quot;en&quot;&gt;5 个不认识&lt;/span&gt;：拼图缺了 5 块，整幅画拼不出来。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;认识约 95% 只能吃力猜读——生词一密，猜词要靠的「锚点」本身就断了，理解是断崖式崩塌，不是慢慢变难。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 只缺一两块时&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-03&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一页只缺 &lt;span class=&quot;en&quot;&gt;2 块&lt;/span&gt;：靠周围认识的词，能猜出缺的是什么。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;所以选书先看覆盖率：小学阶段靠分级读物把覆盖率控制在 98% 上下，而不是硬背八千词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;阈值派（Laufer）说覆盖率是硬线；补偿派说熟悉的话题、背景知识能部分代偿。Laufer 本人也承认知识补偿存在——分歧在「能代偿多少」。另外提醒：2000 词族的老词表是 1953 年的（West GSL），computer 这类新高频词缺位，现在要用它的后继表（V-02 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;West《通用词表 GSL》(1953)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Nation (2006) 覆盖率研究&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Laufer 词汇阈值系列 (1989–)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-04 + V-09 + V-11 + V-17 四条腿 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-legs&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;tri&quot; style=&quot;grid-template-columns:1fr 1fr;max-width:300px;margin:0 auto&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;输入&lt;/span&gt;&lt;br&gt;听说读中遇见&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;输出&lt;/span&gt;&lt;br&gt;说写中用出来&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;专学&lt;/span&gt;&lt;br&gt;专门研究词本身&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;流利&lt;/span&gt;&lt;br&gt;拿会的词练速度&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;学词像吃饭要营养均衡：多听多读、多说多写、认真研究、反复用熟——四样都要有。（V-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：四种条件各建词的不同侧面——遇见建识别、用出建提取与精确、专学建形式细节、流利练自动性，不能互相替代。只背单词表，只占了四分之一。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-09&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;同样练词，效果差在任务上：&lt;span class=&quot;en&quot;&gt;抄三遍&lt;/span&gt; 不如 &lt;span class=&quot;en&quot;&gt;用词造句&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;投入量假说：任务里有「需要这个词、自己去查、比较取舍怎么用」三成分，保持量最高；其中「评估取舍」贡献最大。实验证据的排序是：写作 &amp;gt; 阅读+填空 &amp;gt; 阅读。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 记住的动作，不是「看」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-11&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;记词像走小路：&lt;span class=&quot;en&quot;&gt;自己走一遍，路就踩出来了&lt;/span&gt;；光看地图看十遍，还是不会走。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;把词努力「提取」出来用一次，比再看三遍记得牢。注意：提取必须配反馈——调错了不纠正，错误也会被固化。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 输出是查漏的灯&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-17&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;听读时以为懂了的词，一到说、写就卡壳——&lt;span class=&quot;en&quot;&gt;嘴巴最诚实&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;输出假说（Swain）：产出把缺口照亮，注意到缺口，才会回去补。输入负责遇见，输出负责查漏；但无反馈的大量乱说也会固化错误。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;「深加工」和「提取次数」哪个更重要，学界还没定论——Folse (2006) 发现三次填空胜过一次造句。教学上最稳妥的做法是两者叠加：深加工 + 多次提取（V-09 / V-11）。输出的地位也有争论（Krashen 阵营认为输出只是表象），主流已接受输出有独立贡献，分歧在贡献大小（V-17）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Nation「四股」框架 (2007/2013)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Laufer &amp;amp; Hulstijn 投入量假说 (2001)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Swain 输出假说 (1985/1995)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;小雨把 &lt;b&gt;brave&lt;/b&gt; 抄了五遍，考试还是写不出；第二天她用 brave 造了句「The brave dog saved the boy.」还讲给同桌听——这个词再也没忘。四条腿里，她第一天只用了「专学」一条，第二天补上了输出和提取。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-05 + V-06 + V-07 词块 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-chunk&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;110&quot; viewBox=&quot;0 0 240 110&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;30&quot; width=&quot;80&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;rect x=&quot;30&quot; y=&quot;62&quot; width=&quot;80&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;40&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;182&quot; cy=&quot;40&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;204&quot; cy=&quot;40&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;66&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;182&quot; cy=&quot;66&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;204&quot; cy=&quot;66&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;拼好的组件&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;79&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;拿来就用&lt;/text&gt;&lt;text x=&quot;182&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;单个零件现拼：慢，易错&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说英语像搭乐高：高手手里有很多拼好的小组件，拿来就用；一个一个零件现拼，又慢又容易拼错。（V-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：大脑的词仓库是「杂货铺」（V-06）——词素、单词、词块、整句话并排躺着，说话时先伸手拿大件，省力又快；整句和单词在同一个仓库里，不是两套系统。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-05&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;How are you? / by the way / as soon as possible&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这些都不是现拼的，是整块取用的现成组合：搭配、多词单位、固定表达、半固定句架——这就是 Lewis 说的「被语法组织起来的词汇」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 词的意义，一半在伙伴名单里&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-07&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;make a decision ✓　do a decision ✗&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;搭配对错没有道理可讲，是用法沉淀的约定，靠推理推不出来，只能靠遇见和整记。语料证据：学习者语法已经很好时，搭配错误仍是主要错误源（Bahns 1993）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 所以学动词要连伙伴一起学&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-07&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;记 &lt;span class=&quot;en&quot;&gt;decision&lt;/span&gt; 时，把它的好朋友 &lt;span class=&quot;en&quot;&gt;make&lt;/span&gt; 一起记进仓库。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：不是一切一起出现的词都算搭配，要达到一定频率和约定强度；儿童阶段只收高频交际块，块再多也不能取消语法，否则造新句子的能力会封顶（V-05 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;词汇法（Lewis）被批评「块如何被拆开、长成语法」交代不足；Lewis 阵营以归纳式课堂回应。此分歧未决——教学上块与规则并行，最稳妥（V-05）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Lewis《The Lexical Approach》(1993/1997)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Wray《Formulaic Language and the Lexicon》(2002)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Bahns (1993) 搭配对比研究&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-13 + V-14 买卖戏 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-frame&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;130&quot; viewBox=&quot;0 0 260 130&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;18&quot; width=&quot;150&quot; height=&quot;66&quot; rx=&quot;10&quot; fill=&quot;none&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;14&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一幕戏：买卖&lt;/text&gt;&lt;circle cx=&quot;85&quot; cy=&quot;51&quot; r=&quot;12&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;175&quot; cy=&quot;51&quot; r=&quot;12&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;rect x=&quot;118&quot; y=&quot;40&quot; width=&quot;24&quot; height=&quot;20&quot; rx=&quot;3&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;74&quot; r=&quot;7&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;text x=&quot;85&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#22303c&quot;&gt;买家&lt;/text&gt;&lt;text x=&quot;175&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#22303c&quot;&gt;卖家&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#22303c&quot;&gt;货物&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;97&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#22303c&quot;&gt;钱&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;122&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;四个词 = 四台摄像机对准同一幕戏&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学词像看戏：先看懂整场戏里有谁、发生了什么，每个词自然就知道站在哪个位置说话了。（V-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：词义是相对于「框架」定义的——一个词会把整幕场景和全部角色一起激活。所以听到 buy，就自动知道「必曾有人卖、必有价格」，哪怕句子里没说：框架白送一串推论。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-13&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I bought the book for 20 yuan.&lt;/span&gt;（镜头对准买家）&lt;br&gt;&lt;span class=&quot;en&quot;&gt;The shop sold me the book.&lt;/span&gt;（镜头对准卖家）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一幕戏，换机位就是换词：buy / sell 不是两个孤立的词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 镜头对准钱和货物&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-13&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I paid 20 yuan.&lt;/span&gt;（对准钱）　&lt;span class=&quot;en&quot;&gt;The book costs 20 yuan.&lt;/span&gt;（对准货物标价）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;pay 和 cost 也在这幕戏里。先认全「买家、卖家、货物、钱」四个角色，四个词各就各位。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同框架的词，成组学&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-14&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;买卖、看病、邮寄——&lt;span class=&quot;en&quot;&gt;按场景成组学词&lt;/span&gt;，学会一个，免费带走一串推论。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;秘诀是「隐形角色追问」：学每个词都问一句——这幕戏里还有谁？词与词互相做支点，比逐个孤立背省力。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;分组的对与错（专家分歧，如实登记）：&lt;/b&gt;成组学指的是「同一场景、不同角色」的词。把拼写、发音相近或词义太像的词扎堆教，反而互相干扰（Tinkham、Waring 等人的语义聚类之争）——分组的维度不能混：按场景角色 ✓，按长相相似 ✗（那正是 V-10 形近误认的坑）。另外，框架解释词义和搭配，不解释词形读音；编不出一幕戏的词，明说「约定俗成」，不硬编（V-13 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Fillmore 框架语义 (1977) 与 FrameNet 工程&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;本项目 FRAME_SEMANTICS_DB 与 FrameNet 逐项吻合&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;老师演了一幕小商店：明明当卖家、朵朵当买家。一幕戏演完，&lt;b&gt;buy、sell、pay、cost&lt;/b&gt; 四个词全班都记住了——因为每个人都亲眼看见了「戏」，词只是戏里四个人的台词。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-08 + V-15 + V-16 词树 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-tree&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;130&quot; viewBox=&quot;0 0 240 130&quot;&gt;&lt;line x1=&quot;120&quot; y1=&quot;118&quot; x2=&quot;120&quot; y2=&quot;66&quot; stroke=&quot;#96690a&quot; stroke-width=&quot;5&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;80&quot; x2=&quot;70&quot; y2=&quot;46&quot; stroke=&quot;#96690a&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;74&quot; x2=&quot;170&quot; y2=&quot;42&quot; stroke=&quot;#96690a&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;86&quot; x2=&quot;120&quot; y2=&quot;40&quot; stroke=&quot;#96690a&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;circle cx=&quot;66&quot; cy=&quot;40&quot; r=&quot;13&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;circle cx=&quot;174&quot; cy=&quot;36&quot; r=&quot;13&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;32&quot; r=&quot;14&quot; fill=&quot;#57b96a&quot;/&gt;&lt;rect x=&quot;92&quot; y=&quot;112&quot; width=&quot;56&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;#96690a&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;123&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;中心义&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;140&quot; text-anchor=&quot;middle&quot; font-size=&quot;0&quot; fill=&quot;#fff&quot;&gt;&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;多义词像一棵树：树干是它最主要的意思，其他意思都是树枝——先认树干，树枝就好认了。（V-16）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：义项之间的引申靠两种操作——「相似」长出隐喻枝、「相邻」长出转喻枝。义项有亲缘、有理据，不是把同音词硬凑成一串清单。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-15&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;un-happy ✓　teach-er ✓&lt;/span&gt;——真积木，能拆开看。&lt;br&gt;&lt;span class=&quot;en&quot;&gt;watch、news 拆字 ✗&lt;/span&gt;——看着像积木，其实是一整块石头。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;词能拆，但只能拆真的：可分析性从全透明到全不透明是一条谱。透明的真拆，不透明的整记，半透明的注明「只是帮记」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 真来历能帮记忆，假来历污染记忆&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-08&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;给词接上一个&lt;span class=&quot;en&quot;&gt;真实的来历场景&lt;/span&gt;，记忆多一条图像通道，保持更好。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;词源精细加工（Boers 2001）：图像与语词双重编码，提取路径翻倍。前提铁律——来历必须是真的；编造的假词源既污染事实，又误导机制。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 学多义词的顺序&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-16&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;先教&lt;span class=&quot;en&quot;&gt;树干（中心义）&lt;/span&gt;，再顺着枝教分支义，还能猜没学过的新义。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;实验显示：按「原型 + 引申」组织，比按义项清单教学，延迟后测更好、能迁移到未教义项。但引申是事后理据，推不出的义项注明约定俗成，不硬编链条。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;两棵树不能硬连成一棵：&lt;/b&gt;light「光」和 light「轻」是同形异源——两棵独立的树。本项目审查已将二者拆分登记（VF-003）。看见同形，先查是不是一家人，不是就分开记。&lt;br&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;词源教学里，「被动读注释」被 Szczepaniak &amp;amp; Lew (2011) 证明无效——关键在让学生先主动猜来历、再揭晓，而不是注释本身（V-08）。待核提示：Bauer &amp;amp; Nation (1993) 词缀分级表与 Taylor《Linguistic Categorization》出处已于 2026-11-01 补核：前者页码 253–279 与 DOI 已核清；后者三个版次（1989/1995/2003）与原说法一致（见页脚）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Boers 词源精细加工实验 (2001/2004)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Nation 词部件章 + Bauer &amp;amp; Nation 词缀分级 (1993，已核）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Taylor 原型与多义网络 (1989/2003，待核)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- V-10 + V-12 假朋友 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-fake&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;110&quot; viewBox=&quot;0 0 240 110&quot;&gt;&lt;circle cx=&quot;120&quot; cy=&quot;48&quot; r=&quot;26&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;111&quot; cy=&quot;42&quot; r=&quot;3.5&quot; fill=&quot;#22303c&quot;/&gt;&lt;circle cx=&quot;129&quot; cy=&quot;42&quot; r=&quot;3.5&quot; fill=&quot;#22303c&quot;/&gt;&lt;path d=&quot;M108 60 Q120 52 132 60&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#b33636&quot; font-weight=&quot;700&quot;&gt;笑脸很熟——其实你不认识它&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;有些词是「假朋友」：长得特别眼熟，其实根本不是你以为的意思。越眼熟，越要多看一眼。（V-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：形式相似会触发自动误认——大脑一认错，查字典、猜词义的流程根本不会启动，错误无声无息。这类词叫「欺骗性透明」：最危险的不是生词，是以为自己认识的词。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;V-10&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;price（价格）/ prize（奖品）&lt;/span&gt;——形近词，只差一个字母。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Laufer (1989) 实验归纳的误认五类：欺骗性构词、习语、假朋友、多义词、形近词。小学阶段最常见两类：形近词，和多义词「只认那个熟义」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 那读到生词能不能猜？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;V-12&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;猜词是门手艺：像侦探找线索，先猜一猜，再核对。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;但手艺有天花板——覆盖率够高（98% 上下）、线索不误导时，猜才靠谱。奠基实验（Bensoussan &amp;amp; Laufer 1984）里，学习者的错猜大多不是不会用线索，而是栽在形近误认上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 手艺的前提&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;V-12&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;线索太少的时候，老实查字典；先把词汇量攒够，再谈猜。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;专家分歧（如实登记）：策略教学派强调猜义可训练、可迁移；Laufer 阵营强调先保词汇量。分歧在教学顺序，不在猜义的机制本身（V-12）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Laufer「欺骗性透明」(1997) 与形近词 synforms (1988)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Bensoussan &amp;amp; Laufer 猜义奠基实验 (1984)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;阅读题里写着 &lt;b&gt;The boy won a prize.&lt;/b&gt;，安安读成「这个男孩赢了一个价格」，整道题答反了——错不在生词，prize 他「认识」，只是认错了。假朋友专坑最自信的时候。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：分组的对错、练法的擂台&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;同样的词、同样的练习时间，组织方式不同，效果天差地别。证据都在条目里。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：成组学，按什么分？（V-14）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;按场景 ✓&lt;/span&gt;&lt;br&gt;买卖戏：buy / sell / pay / cost&lt;br&gt;不同角色，互相支点&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;按词义太像 ✗&lt;/span&gt;&lt;br&gt;反义词、近义词扎堆&lt;br&gt;容易交叉干扰（学界有争论）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;按长相 ✗&lt;/span&gt;&lt;br&gt;形近词扎堆&lt;br&gt;正撞 V-10 的误认坑&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;结论只取条目内的：取「场景角色」分组，避开另外两种（V-14 边界）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：练法擂台——保持量排序（V-09 / V-11）&lt;/h4&gt;
&lt;p&gt;实验里三种练法的保持量排序稳定是：&lt;span class=&quot;en&quot;&gt;用词写作 &amp;gt; 阅读 + 填空 &amp;gt; 只阅读&lt;/span&gt;（Hulstijn &amp;amp; Laufer 2001 双地实验）。排在前面的任务都有一个共同点：要动脑「提取」和「取舍」。元分析（42 项研究）同时提醒：重复遇见的次数也独立起作用——深加工和多提取，缺一不可。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：中国孩子的词汇错误地图（V-18）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;词形&lt;/span&gt;&lt;br&gt;拼写、构词错误&lt;br&gt;字母文字经验晚，错得持久&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;搭配&lt;/span&gt;&lt;br&gt;动名搭配、近义词误选&lt;br&gt;汉语的切分法搬了过来&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;缺词赘词&lt;/span&gt;&lt;br&gt;冠词、限定词、介词的漏与多&lt;br&gt;汉语没有的范畴最易漏&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;地图来自 CLEC 中国学习者英语语料库（桂诗春、杨惠中 2003）：错误不是随机摔跤，是有地图的。边界要说清：CLEC 以中学生到大学生的书面语为主，小学生借它的「分类框架」用，不直接搬数值（V-18 边界）。教学火力按地图分配，不平均用力。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：词汇的高频病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因大多是同一个：把汉语的伙伴名单、切分法套到了英语词上（V-07 / V-18）。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ We should do a decision now.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ make a decision&lt;/span&gt; —— decision 的好朋友是 make，不是 do。搭配是几百年用法沉淀的约定，推不出道理，只能整记（V-07）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Please open the light.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ turn on the light&lt;/span&gt; —— 把汉语「开灯」的「开」直译成了 open。英语里灯的开关伙伴是 turn on / turn off——又是一个整记的词块（V-05 / V-07）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The library is very quite.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ quiet（安静的）&lt;/span&gt; —— quite（相当）与 quiet（安静）是形近词，字母顺序不同。越眼熟越要多看一眼（V-10）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He returned back home at six.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ He returned home at six.&lt;/span&gt; —— return 本身就含「回」，back 是赘词。CLEC 地图里「赘词」是单独一类坑（V-18）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 讲解：news 是 north、east、west、south 四个方位的首字母拼成的。&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是编造的假词源，禁止使用。&lt;/span&gt; —— 词源教学的前提是来历必须为真（V-08）；news 属「拆不开」的词，按 V-15 的谱：不透明，整记。把假故事挂在词上，会同时污染事实和机制。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. 下面哪个词是「真积木」，可以拆开讲？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;un-happy&quot; data-why=&quot;对了：un- + happy 是历史上真发生过的拼合，透明可拆（V-15）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;un-happy&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;watch 拆字&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;news 拆字母&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. ___ a decision，空格里该填哪个伙伴？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;make&quot; data-why=&quot;对了：decision 的好朋友是 make，搭配整记（V-07）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;do&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;make&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;take&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. 一页书里的词，大约认识多少才能流畅读、还能猜出生词？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;98%&quot; data-why=&quot;对了：约 98% 是流畅理解的硬线；95% 只能吃力猜读（V-03）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;80%&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;90%&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;98%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. 哪种练法保持量最高？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;用词造句&quot; data-why=&quot;对了：需要 + 查找 + 评估三成分齐全，投入量最高（V-09）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;抄三遍&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;读三遍&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;用词造句&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. buy / sell / pay / cost 是同一幕什么戏里的四个机位？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;买卖&quot; data-why=&quot;对了：买家、卖家、钱、货物——同一幕买卖戏换机位（V-13）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;买卖&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;看病&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;邮寄&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. price 和 prize 这类「长得像、意思差很远」的词，最危险在哪？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;会认错还不自知&quot; data-why=&quot;对了：欺骗性透明——自动误认，连查字典的流程都不会启动（V-10）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;太难拼写&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;会认错还不自知&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;出现太少&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. 记词最有效的「动作」是哪一个？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;自己提取出来用&quot; data-why=&quot;对了：重复提取才是固化记忆的动作，重复呈现只是原料（V-11）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;多看几遍&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;听老师读&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;自己提取出来用&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 相同——示意图 + 儿童版标题句 + 机制灰字 + 分级案例 + 易混对比 + 亲戚网（出处） + 案例小故事；组级附对比台、病句医院、进阶测验。&lt;br&gt;知识来源：《专家规律总结清单 v1》词汇组 V-01 – V-18（Nation 2001/2013；West 1953；Lewis 1993；Wray 2002；Laufer &amp;amp; Hulstijn 2001；Boers 2001；Fillmore 1977；桂诗春、杨惠中 CLEC 2003 等）。&lt;br&gt;待核登记：Bauer &amp;amp; Nation (1993)《Word families》与 Taylor《Linguistic Categorization》为学界通行书目，清单编制时未打开原文页面——出处已于 2026-11-01 补核销项，条内标注已同步更新。&lt;/div&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 可数性与冠词组（C-01 – C-20）&lt;/span&gt;
&lt;h1&gt;数数与冠词&lt;/h1&gt;
&lt;p&gt;一个东西能不能数、用 a 还是 the，不看东西本身长什么样——先看你怎么看它、对方能不能找到它。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（C-01）：&lt;/b&gt;可数不可数是「看法」，不是物体的物理属性：说话人先决定把东西看成一个个、一摊还是一类，形式跟着看法走。&lt;b&gt;配套总开关（C-19）：&lt;/b&gt;选冠词时心里要过一遍「对方知道吗」——冠词是给听者的服务。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;view&quot;&gt;看法&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;mass&quot;&gt;一摊料&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;switch&quot;&gt;换看法&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;a&quot;&gt;a&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;the&quot;&gt;the&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;hearer&quot;&gt;替对方想&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;dual&quot;&gt;两读法&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;generic&quot;&gt;类指&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;master&quot;&gt;总开关&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-01 + C-03 看法 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-view&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;24&quot; width=&quot;104&quot; height=&quot;66&quot; rx=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#e4572e&quot;/&gt;&lt;circle cx=&quot;76&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;看成一个个 → 能数&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;24&quot; width=&quot;104&quot; height=&quot;66&quot; rx=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;ellipse cx=&quot;192&quot; cy=&quot;62&quot; rx=&quot;38&quot; ry=&quot;18&quot; fill=&quot;#e8d9a8&quot;/&gt;&lt;circle cx=&quot;172&quot; cy=&quot;56&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;190&quot; cy=&quot;64&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;206&quot; cy=&quot;55&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;70&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;180&quot; cy=&quot;67&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;text x=&quot;192&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;看成一摊 → 借单位数&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;数不数得清，先看你怎么看：看成一个一个的，就能数；看成一摊、一堆的，就不能直接数，要借杯子、碗来帮忙数。（C-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这叫「识解」——同一件东西，说话人可以给它换不同的看法（取景）：把「一个个」算进图里，就是可数；只看一整摊，就是不可数。语法形式是看法的回执，不是物体自带的属性标签。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;C-01 注记（口径，务必看清）：&lt;/b&gt;专家说的「有界」，指的是&lt;b&gt;取景时有没有把限界算进这幅图&lt;/b&gt;，和物体有没有物理边框无关——湖里的水有岸，water 照样不可数；moment 没有任何形状，照样可数。学界（Nicolas 等）还批评过：有界既不是可数的充分条件、也不是必要条件。所以本组把「有界」定位为&lt;b&gt;主导判据 + 教学入口，不是定义&lt;/b&gt;；个别名词到底可不可数，最终以英语的习惯用法为准。&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;反例 1&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;rice&lt;/span&gt; 一粒一粒分得清清楚楚，却不可数；&lt;span class=&quot;en&quot;&gt;furniture&lt;/span&gt; 件件有形，却不可数。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;如果可数看物理形状，这两个词当场就解释不通——「物理边界说」正是这样被证伪的（它只许以错误身份出现在病句医院里）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 「界」可以是心里设的，不必锋利&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-03&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a season / a tummy&lt;/span&gt;——季节、肚子的边糊里糊涂，照样说得出「一个」。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;界是认知上设定的：把一段东西当成一个整体单位来指，单位性就成立，其锐利程度不影响。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一物体，两种看法都合法&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;预告&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a glass&lt;/span&gt;（一只杯子）/ &lt;span class=&quot;en&quot;&gt;glass&lt;/span&gt;（玻璃这种料）——同一个词双读。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;看法能当场切换，语法就跟着翻面——这是下一屏「换看法」的主题（C-04）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker《认知语法》 (1987；通俗定版 2008 第 5 章）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Nicolas 等对有界充要性的批评（纲领 basis 登记）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-02 + C-15 一摊料 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-mass&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M40 74 Q40 44 75 44 L165 44 Q200 44 200 74 L200 82 L40 82 Z&quot; fill=&quot;#e8a84c&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;44&quot; x2=&quot;120&quot; y2=&quot;82&quot; stroke=&quot;#fff&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;bread&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;还是 bread&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;切成多少份，每一份都还是它&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一滴水也是水，一小块面包也是面包——切多少份都还是它，这样的东西不能一个一个数。（C-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这类东西靠「质」被认出来，不靠「形」：随便拿一小份，都自带全套识别特征。所以语言不给它配 a 和 -s，要数就借单位切开来数。这条判据叫「同质」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-02&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;water / wood / bread&lt;/span&gt;——任意取一小份，性质和整体完全相同。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同质性一次预测三件事：没有复数、切开不变名、用量词时配 much 不配 many。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 有个著名的例外要说清&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;例外&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;rice、sand&lt;/span&gt; 颗粒明明看得见，却被整摊处理（登记号 xc-rice-grains）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这说明判据是英语的「习惯打包」：同质性压过可辨性——不是对每粒米验算一遍，而是整类一起看成一摊。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 摸不着的东西，同一条路&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-15&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;homework / information / advice&lt;/span&gt; 没有形状可切，被整类打包成「一类事」。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;要说「一条建议」，同样借单位：a piece of advice。抽象名词继承了物质名词的全部语法待遇：无 a、无 -s、借单位、配 much。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;「切一切看看」只是演示法，对部分物质名词有效，本项目已把它降格为帮助记忆的小演示（mnemonic），&lt;b&gt;不许称它为定律&lt;/b&gt;（C-02 分歧栏）。另外，个别抽象名词有专门的可数读法（如 works 表示「著作」），属词条级约定，逐词登记，不类推。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker (2008: 133） 以 wood 立论的同质性原例&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型例外登记 xc-rice-grains / xc-homework-uncuttable&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;妈妈把面包切成四片，弟弟问：「现在它变成四个面包了吗？」姐姐说：「不对——每一片都还是面包，只是四&lt;b&gt;片&lt;/b&gt;面包。」数的是「片」，不是面包本身。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-04 + C-05 换看法 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-switch&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;path d=&quot;M52 38 L84 38 L80 88 Q78 96 68 96 Q58 96 56 88 Z&quot; fill=&quot;#f2b134&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M102 38 L134 38 L130 88 Q128 96 118 96 Q108 96 106 88 Z&quot; fill=&quot;#f2b134&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;93&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;two beers = 两杯/瓶&lt;/text&gt;&lt;ellipse cx=&quot;205&quot; cy=&quot;76&quot; rx=&quot;42&quot; ry=&quot;16&quot; fill=&quot;#d94f4f&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;苹果 → 果泥：一摊&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;同一样东西，换个看法就换个说法：苹果看成一摊果泥就不能数了；啤酒按「一杯一杯」看，又能数了。（C-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：两个方向相反的操作——「磨成料」抹去个体、只留质料；「分作份」借容器或惯例份量，临时给料装上边界。两个操作都证明：语法跟着当下的看法走，不跟词的「终身标签」走。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-04&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two beers / two coffees&lt;/span&gt;——餐馆里说的是两杯、两瓶。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是省略读法：复数 -s 其实落在被省略的单位（杯）上（登记号 xc-two-coffees）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 反方向：磨成料&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-04&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;整个的苹果能数；打成一摊果泥，就只能当料看。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;磨碎方向多是修辞、非常规语境：儿童阶段只作理解、不作产出要求；要练的是「分作份」这个方向。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 分作份的工具：借单位&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-05&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a bowl of rice / two pieces of paper&lt;/span&gt;——复数加在 bowl、pieces 上，不加在料上。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;汉语是现成的老师：「一碗饭、两张纸」用的正是同一套办法——先借单位切成有界的份，再数。可以直接搬过来的正迁移。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;边界与待核：&lt;/b&gt;单位词有自己的搭配习惯（a piece of advice，不能说 a bowl of advice），须逐个登记。单位词作为独立语法系统的类型学出处是 Aikhenvald《Classifiers》(2000)——&lt;b&gt;出处已于 2026-11-01 补核：初版（2000，精装）与 2003 年平装本的版次、ISBN 均已核清&lt;/b&gt;（C-05）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker grinding / portioning 论述 (2008)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Aikhenvald《Classifiers》(2000，已核）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;纲领 coreView：汉语量词正迁移&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-06 + C-14 a --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-a&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M120 18 L146 62 L94 62 Z&quot; fill=&quot;#f7d774&quot; opacity=&quot;.55&quot;/&gt;&lt;ellipse cx=&quot;120&quot; cy=&quot;96&quot; rx=&quot;52&quot; ry=&quot;12&quot; fill=&quot;#f7d774&quot; opacity=&quot;.35&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;92&quot; r=&quot;8&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;124&quot; cy=&quot;95&quot; r=&quot;8&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;circle cx=&quot;142&quot; cy=&quot;91&quot; r=&quot;8&quot; fill=&quot;#e4572e&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;灯光只够认出「是哪一类」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说 a 的时候，是在说「随便哪一个都行，我说的就是这种东西里的一个」。（C-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：a 只要求听者做到最低一档——「认出是哪一类」（type identifiable）。所以第一次提到、任选其一、说职业身份，都用 a。它是给听者的最低限度定位指令。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-06&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have a dog.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;第一次提起：你认出「是狗这一类」就够了，不必知道是哪一只。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 类别身份也是 a&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-06&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She is a teacher.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;说的是「她属于教师这一类」，还是类别定位——与首次提及是同一个机制，不是例外。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ a 的双胞胎：看声音不看字母&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-14&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;an hour ✓&lt;/span&gt;（h 不发音，开头是元音声）　&lt;span class=&quot;en&quot;&gt;a university ✓&lt;/span&gt;（开头读 /j/，是辅音声）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;a 和 an 是同一个词：它本是古英语 ān「一」，元音前保留 an 垫着读，辅音前弱化成 a。判据永远是读音，不是字母。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel, Hedberg &amp;amp; Zacharski 给定性等级 (1993)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型主张 cl-a-etym：a/an &amp;lt; 古英语 ān（词源以 OED 为准）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-07 + C-08 the --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-the&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M120 14 L152 66 L88 66 Z&quot; fill=&quot;#f7d774&quot; opacity=&quot;.8&quot;/&gt;&lt;ellipse cx=&quot;120&quot; cy=&quot;98&quot; rx=&quot;56&quot; ry=&quot;12&quot; fill=&quot;#f7d774&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;94&quot; r=&quot;10&quot; fill=&quot;#e4572e&quot;/&gt;&lt;circle cx=&quot;82&quot; cy=&quot;98&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;97&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;线索够了，灯锁定唯一那一个&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说 the 的时候，是在说「就是那一个，你知道的」——对方得能一下子找到它。（C-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：the 要求对方能「唯一定位」（uniquely identifiable）。说 the 就等于发出信号：「线索已经够了，你应该找得到。」听者定位不到，就是误用。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;路一 · 上文提过&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have a dog. The dog is white.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;刚说过的那一只，第二句就能定位——回指。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;路二 · 关联带出&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a wedding → the bride&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;提到婚礼，新娘自动被「带出来」。习得研究显示：五条路里这一条最晚学会（Liu &amp;amp; Gleason 2002)。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;路三 · 修饰语锁定&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;the book on the desk&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「桌上的那本」当场把范围收成唯一。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;路四 · 眼前情境&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Pass me the salt.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;盐就在桌上，看得见，就定位得到——不用上文。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;路五 · 常识唯一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;the sun / the moon&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;全世界只有一个的东西，人人都能定位。五路皆无，就不能用 the（C-08）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;the 的核心是什么，学界争了上百年——「熟悉说」（听者必须早已熟悉它）对「唯一说」（唯一可定位即可）。Lyons (1999) 的裁定是两说各覆盖一部分，用上位概念「可辨识性」综合。教学只取综合说的一句话：对方能不能找到是哪一个（C-07）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel et al. (1993)：the = 可唯一辨识级&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Hawkins《Definiteness and Indefiniteness》(1978) 定位理论与五路分类&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Lyons《Definiteness》(1999)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-19 + C-09 + C-10 替对方想 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hearer&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;circle cx=&quot;52&quot; cy=&quot;52&quot; r=&quot;17&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;说话人（我）&lt;/text&gt;&lt;circle cx=&quot;208&quot; cy=&quot;52&quot; r=&quot;17&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;听者（对方）&lt;/text&gt;&lt;path d=&quot;M74 46 Q130 22 184 44&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;34&quot; r=&quot;11&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;?&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;说话前先算一笔账：对方找得到吗？&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说英语的时候要多想一步：「我说的这个东西，对方找得到吗？」把答案用小词标出来，听的人才不迷路。（C-19）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：a / the / 零 的选择，本质是说话人替听者算账：不停估算对方的定位状态，再把答案标在句子表面。汉语把这笔账记在语境里，英语把它写出来——这正是中国学生最不习惯的地方。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-09&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I saw the dog yesterday.&lt;/span&gt;（其实是第一次遇见的一只狗）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;特征性错误。初学者不是乱猜，而是用了另一套切分：把 the 发给「我心里有具体所指」的名词——心里有 ≠ 对方能定位。这叫波动假说：先按「具体」选，积累够了才切换到英语的切分。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两股力叠加成指纹&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-10&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;中国学生的冠词错误居名词短语错误前列，形态高度集中：&lt;span class=&quot;en&quot;&gt;该加不加（漏）&lt;/span&gt; + &lt;span class=&quot;en&quot;&gt;the 泛化到泛指（滥）&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;漏，来自汉语没有冠词这个范畴；滥，来自按具体性补位（C-09）。两个病因叠在一起，就是这张错误指纹（CLEC 语料）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 教学顺序：先立槽位&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-10&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;低段先立一条规矩：&lt;span class=&quot;en&quot;&gt;单数可数名词前面必须站一个小词&lt;/span&gt;（a / the / this / my…）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;先解决「有没有」，再解决「选哪个」——槽位意识是第一步（C-10 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;波动假说有个替代解释（Deprez、Sleeman 等）：早期按具体性选，也许只是因为冠词词条没学全、语用原则先行，不必诉诸先天参数。两说对教学的处方一致——大量带听者信息的语境输入。另注：波动证据来自成人被试，儿童的波动形态与时长需要本项目自己验证（C-09 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel et al. 给定性等级 (1993) / Prince 熟悉度量表 (1981)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Ionin, Ko &amp;amp; Wexler 波动假说 (2004)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;桂诗春、杨惠中 CLEC (2003)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-11 + C-12 两读法 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-dual&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;34&quot; y=&quot;36&quot; width=&quot;76&quot; height=&quot;52&quot; rx=&quot;4&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M28 38 L72 14 L116 38&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;the school = 那栋楼&lt;/text&gt;&lt;circle cx=&quot;188&quot; cy=&quot;46&quot; r=&quot;15&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;168&quot; y=&quot;66&quot; width=&quot;40&quot; height=&quot;26&quot; rx=&quot;4&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;text x=&quot;188&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;school = 上学这件事&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;go to school 是「去上学」（做事），go to the school 是「去那所学校」（去一栋楼）——加不加 the，看你说的是事还是楼。（C-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这是识解切换在冠词上的又一回执——表示「去做那件事」时，名词被看成一种活动（类型层），脱去了个体性，自然零冠词；表示实物时回到个体层，冠词按 a/the 的规矩正常运作。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-11&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;go to school / go to bed&lt;/span&gt;（做事） vs &lt;span class=&quot;en&quot;&gt;go to the school&lt;/span&gt;（去楼）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;英式英语里成套对立（in prison / in the prison）证明这是系统性的读法切换，不是个别例外。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 但它只是倾向，不是铁律&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;美式英语住院说 &lt;span class=&quot;en&quot;&gt;in the hospital&lt;/span&gt;（登记号 xc-hospital-us）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;凡是机制推不出的，一律按约定单记，不许编理由——这是本项目的铁律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 约定存货：整串整记&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-12&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;play the piano ✓　play football ✓（不加 the)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;乐器加 the、球类不加，是历史沉淀的约定，机制只能解释一部分。好在两类各自成串（乐器串、球类串），内部高度一致，按串整记即可。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;反面教材（审查史）：&lt;/b&gt;旧库曾为 on foot 编造「双脚踩地所以接触」的伪因果，已被裁定删除——编一个假理由，代价是错误机制到处扩散。约定就是约定，注明「这里没有为什么」，才是诚实教法（C-12)。&lt;b&gt;待核：&lt;/b&gt;Swan《Practical English Usage》冠词条目持同一处理口径，清单编制时未打开该书页面，条目编号待核（C-12)。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;模型主张 cl-zero-func（倾向型）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Master《The English Article System》(1997) 教学框架&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;例外登记 xc-hospital-us / xc-piano&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-13 类指 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-generic&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a tiger&lt;/span&gt;&lt;br&gt;任取一只&lt;br&gt;代表全类&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;the tiger&lt;/span&gt;&lt;br&gt;把物种当作&lt;br&gt;一个整体&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;tigers&lt;/span&gt;&lt;br&gt;整类敞开说&lt;br&gt;零冠词复数&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;介绍一种动物有三台摄像机：一只代表大家、把全种当成一个大家伙、或者一群一起上镜——选哪台，句子就不一样。（C-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：类指是识解在「类别层」的运作——a 用一只样本例示全类，the 把类别本身当成一个整体个体，零冠词复数直接以整类为指称。三种形式不是随便换的同义词，是三种取景。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;样本机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;A tiger has stripes.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;随便哪只老虎都有条纹——属性对任一样本成立时，用 a。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 谓词能验出分工&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;整体机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The tiger is endangered. ✓&lt;/span&gt;　&lt;span class=&quot;en&quot;&gt;*A tiger is endangered. ✗&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「濒危」是整个物种的属性，不是一只样本的属性——这时只能把物种当整体，用 the。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 小学阶段的主力&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;整类机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Tigers are strong.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：小学主教零冠词复数和 a 类指；the 类指只登记、作高年级内容。不能因为它，就推翻 C-07「the 是定位那一个」的主读法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Lyons《Definiteness》(1999) 类指系统讨论&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型例外登记 xc-generic-the&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-16 + C-17 + C-18 总开关 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-master&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;106&quot; y=&quot;44&quot; width=&quot;48&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;circle cx=&quot;141&quot; cy=&quot;57&quot; r=&quot;10&quot; fill=&quot;#fff&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;总开关：识解（C-01）&lt;/text&gt;&lt;circle cx=&quot;46&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;46&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;冠词&lt;/text&gt;&lt;circle cx=&quot;130&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;复数 -s&lt;/text&gt;&lt;circle cx=&quot;214&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;214&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;many / much&lt;/text&gt;&lt;path d=&quot;M118 70 L52 84 M130 70 L130 80 M142 70 L208 84&quot; stroke=&quot;#b9c6ce&quot; stroke-width=&quot;2&quot;/&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先决定东西是「一个个」还是「一摊」：一个个的用 many/few，一摊的用 much/little——开关只有一个，灯有好几盏。（C-17）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：量化词、复数 -s、冠词，都是同一个识解总开关的下游出口。量怎么选、章盖在哪，都不取决于词本身，只取决于东西当前被看成什么。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-17&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;many chickens&lt;/span&gt;（鸡只，一个个）/ &lt;span class=&quot;en&quot;&gt;much chicken&lt;/span&gt;（鸡肉，一摊）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个 chicken，量化词随读法当场翻转——这是「量化跟识解走」最干净的证据（模型 ex-chicken）。a lot of 两边通吃，是因为它绕过了识解标记。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ -s 是「复制章」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-18&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;*waters、*rices ✗&lt;/span&gt;（日常义）；&lt;span class=&quot;en&quot;&gt;two bottles of water ✓&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;-s 的语义是「同一个有界单位被复制了多份」。料没有单位可复制，所以章盖不上——先借单位，章盖在单位上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 一致也是回执&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-16&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;My family is big.&lt;/span&gt;（看成一个单位）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;family、team、class 指「一群互连的成员」：看成整体，动词用单数；看成成员们，英式可用复数。边界：police、people 只有复数待遇，是词条级约定，单记，不自由切换。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;less / fewer 之争——描写派（Quirk 等）认为 less + 复数可数名词在非正式语体可接受；规范派（考试口径）要求必须 fewer。处理：&lt;b&gt;教学守考试口径，教师知识取描写口径&lt;/b&gt;，阅读中承认 less 的口语存在即可（C-17）。另注：-s 还有三单、所有格等同形用法，机制不同、教学分轨，不用本屏的「复制章」去解释三单（C-18 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker 可数域参数组：有界 / 同质 / 可扩展 / 可复制 (2002/2008)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Quirk et al.《综合语法》(1985) 量化描写&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：同一物，两种看法&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;可数与不可数之争，十有八九是「看错了图」。先定看法，再选形式（C-01 / C-04）。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：双生活名词——一个词，两种活法&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;cake&lt;/span&gt;&lt;br&gt;a cake 一整个蛋糕&lt;br&gt;some cake 一些蛋糕（料）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;glass&lt;/span&gt;&lt;br&gt;a glass 一只杯子&lt;br&gt;glass 玻璃（料）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;chicken&lt;/span&gt;&lt;br&gt;chickens 鸡只&lt;br&gt;chicken 鸡肉&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;词没有「终身标签」：每一句里，它当前被看成哪种，语法就按哪种走（模型 cl-whole-material）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：单数可数名词，前面必须站一个「小门卫」（C-10）&lt;/h4&gt;
&lt;p&gt;单独一个可数名词出门，前面必须有词占位：&lt;span class=&quot;en&quot;&gt;a dog / the dog / this dog / my dog&lt;/span&gt; 都可以，唯独不能空着。先把这条槽位规矩立住，漏用型错误就断了大半；至于门卫选 a 还是 the，再回到「对方能不能定位」慢慢练。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：借单位「价目表」——单位搭配逐个登记（C-05）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a bowl of&lt;/span&gt;&lt;br&gt;rice 饭&lt;br&gt;（盛饭的单位）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a piece of&lt;/span&gt;&lt;br&gt;paper / advice&lt;br&gt;（张、条的单位）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;two bottles of&lt;/span&gt;&lt;br&gt;water&lt;br&gt;（装水的单位）&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;单位不是随便抓的：饭用碗、建议用 piece，说 &lt;span class=&quot;en&quot;&gt;*a bowl of advice&lt;/span&gt; 就错了。单位清单逐条登记，不许类推乱配（C-05 边界）。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：冠词错误分型治疗（C-20）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;冠词错误分三型，三种病、三种药：&lt;b&gt;漏用&lt;/b&gt;（缺槽位意识，药是立规矩）→ &lt;b&gt;the 滥用&lt;/b&gt;（按具体性选词，药是换判据到「对方能否定位」）→ &lt;b&gt;a/the 替换&lt;/b&gt;（定位判断摇摆，药是五路线索训练）。干预就按这个顺序来；不分型地「多练冠词」，效率最低。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have dog.（漏用型）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I have a dog.&lt;/span&gt; —— 单数可数名词前缺了占位的小词。病因：汉语没有冠词范畴，位置「默认空白」（C-10）。先立槽位规矩，再谈选词。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He gave me an information.（漏用型 · 抽象名词）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ a piece of information&lt;/span&gt; —— information 被整类打包成「一类事」，不能直接配 a（C-15）；要数，借单位 piece（C-05）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The dogs are lovely animals.（滥用型 · 泛指）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Dogs are lovely animals.&lt;/span&gt; —— 这里是敞开说整个类，用零冠词复数（C-13）。the 被泛化到泛指上，是中国学生的典型「滥」（C-10）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Yesterday I saw the dog in the park. It was white.（替换型 · 波动）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ a dog&lt;/span&gt; —— 向听者第一次提起，听者无从定位。说话人心里有具体那只，不等于听者找得到——判据要换到「对方能否定位」（C-09）。第二句起再用 the dog。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Tom goes to the school every day.（读法型 · 活动与实物）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ goes to school&lt;/span&gt; —— 说的是「上学」这件事（活动读法），零冠词；加了 the，就变成每天去「那栋楼」了（C-11）。（若真是去那栋楼办事，the 才对。）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 「断言」：rice 一粒一粒分得清，所以 rice 是可数名词，可以说 two rices。&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是已被证伪的「物理边界说」。&lt;/span&gt; —— 可数看的是习惯看法，不是物理颗粒：rice 颗粒分明，英语仍把它整摊看（C-01 / C-02，例外登记 xc-rice-grains）。数米饭要借单位：two bowls of rice（C-05）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. 数米饭：I want two ___ of rice.&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;bowls&quot; data-why=&quot;对了：料不能直接数，借单位；-s 落在单位 bowls 上（C-05）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;rices&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;bowls&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;much&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. Pass me ___ salt, please.（盐就在餐桌上）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;the&quot; data-why=&quot;对了：眼前情境这条路让听者能唯一定位（C-08 路四）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. ___ tiger has stripes.（任取一只，代表全类）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;A&quot; data-why=&quot;对了：样本机位——属性对任一样本都成立，用 a 类指（C-13）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;A&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;The&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. How ___ water do you drink every day?&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;much&quot; data-why=&quot;对了：water 被看成一摊，量化用 much——总开关在起作用（C-17）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;many&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;much&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;few&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. 哪个搭配对？（看声音，不看字母）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;an hour&quot; data-why=&quot;对了：hour 的 h 不发音，开头是元音声，用 an（C-14）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a hour&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an hour&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an university&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. Tom goes to ___ school every morning.（意思是去上学）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;不加&quot; data-why=&quot;对了：活动读法零冠词；加 the 就成了去那栋楼（C-11）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. Yesterday I saw ___ dog in the park. It was white.（第一次向对方提起）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot; data-why=&quot;对了：听者还定位不到，只能认出类别——用 a；下一句再用 the（C-06 / C-09）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 相同——示意图（取景框 / 定位灯 / 总开关） + 儿童版标题句 + 机制灰字 + 分级案例 + 易混对比与注记 + 亲戚网（出处） + 案例小故事；组级附对比台、病句医院（按 C-20 分型）、进阶测验。&lt;br&gt;知识来源：《专家规律总结清单 v1》可数性与冠词组 C-01 – C-20（Langacker 1987/2008；Gundel, Hedberg &amp;amp; Zacharski 1993；Hawkins 1978；Lyons 1999；Ionin, Ko &amp;amp; Wexler 2004；Master 1997；桂诗春、杨惠中 CLEC 2003），与 boundedness.yaml 模型逐条对齐。&lt;br&gt;待核登记：Aikhenvald《Classifiers》(2000）与 Swan《Practical English Usage》冠词条目——书目真实，编制时未打开原文页，已随条目标注，入模前复核。专家分歧均如实登记于各屏：有界充要性（Nicolas)、熟悉说 vs 唯一说、波动假说的替代解释、less/fewer 描写派与规范派之争。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{

 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);

 const f=document.getElementById(b.dataset.f);
 f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;

 g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
  const right=o.textContent.trim()===g.dataset.a;
  g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
  o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
  fb.textContent=right?(g.dataset.why||&#x27;对了！&#x27;):&#x27;再想想：回到这一屏的图——先定看法，再问对方能不能定位。&#x27;;
 }));
});
