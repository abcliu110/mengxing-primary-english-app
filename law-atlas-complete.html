&lt;!-- 篇章 CG-01 胡壮麟 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-text&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;钉子看得见&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;and · then · it&lt;/text&gt;&lt;rect x=&quot;134&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fdf0e9&quot; stroke=&quot;#b34724&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#8f3418&quot;&gt;画要连得上&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;心里顺着走下去&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;有钉子没画，叫假连贯；没钉子有画，叫隐连贯&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;句子手拉手只是表面，「意思接得上」才是真的连成一段（CG-01 · 胡壮麟）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（胡壮麟《语篇的衔接与连贯》1994）：衔接是语篇的表层特征——照应、替代、省略、词汇复现这些看得见的线索；连贯是交际的最终效果——读者结合语境在心里建起的统一意义。两者不是一回事。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先保画&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;写一段话，光用 &lt;span class=&quot;en&quot;&gt;and、then、it&lt;/span&gt; 把句子粘住还不够——读的人心里要能顺着一幅画走下去。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;教学次序是硬的：先保「意思顺成一幅画」，连接词是后加的钉子；不能反过来拿钉子冒充画（本页对比台有正反两段演示）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;全员干活&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;衔接不只是几个连接词的事——它在好几层同时发生。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;胡壮麟把衔接手段推广到多层：声音与信息安排、词汇、句法、语义、社会语境——是全语言系统共同干的活。（五层划分的原书页码待核，引用具体层目时以原书为准。）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;表层线索（衔接）：&lt;span class=&quot;chip&quot;&gt;照应 it / they 指谁&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;替代与省略&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;词汇复现与搭配&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;连接词 and / then / but&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;这是写作与阅读层面的框架，不是词句对错的判据。学界对衔接与连贯的边界并未完全定型：张德禄、刘汝山把衔接扩到「语篇与语境之间」，覆盖面比胡壮麟更宽；也有研究者认为连贯主要是心理建构。属框架层分歧，不影响本条教学用法。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 迁移 CG-02 戴炜栋 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-transfer&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;quad&quot; style=&quot;margin-top:2px&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;躲&lt;/div&gt;没把握就绕开&lt;br&gt;（生产不足）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;套&lt;/div&gt;会的到处用&lt;br&gt;（生产过剩）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;错&lt;/div&gt;替代、借用、改结构&lt;br&gt;（生产错误）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;岔&lt;/div&gt;听岔、读岔&lt;br&gt;（误解）&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;说错英语不全是中文在捣乱——负迁移有四张脸（CG-02 · 戴炜栋）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（戴炜栋、王栋 2002，《外国语》）：负迁移的表现可细分为四类——生产不足、生产过剩、生产错误、误解。四张脸对应四种完全不同的纠正办法，所以诊断要先行。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;对症下药&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;躲&lt;/span&gt;：如回避定语从句、只说简单句 → 给支架、鼓励产出；&lt;span class=&quot;en&quot;&gt;套&lt;/span&gt;：对已掌握结构过度使用 → 给边界；&lt;span class=&quot;en&quot;&gt;错&lt;/span&gt;：替代、借用、结构改变 → 对照纠正；&lt;span class=&quot;en&quot;&gt;岔&lt;/span&gt;：受母语词序、文化习惯影响 → 讲英汉切分差异。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;把所有错误都当成「粗心」，等于四种病开一种药。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;中文在帮忙&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;正迁移一直在帮忙，只是你没注意到。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;汉语词序与英语 SVO 同序、量词意识等，都是中国学生的真实资产。戴、王的梳理还指出：迁移的结果不止正、负二分，还有「习得时间差异」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;四类是诊断分类，同一错误可兼有回避与替代，不能干净归类；更不能反推「有负迁移就先把中文戒掉」。迁移在二语习得中的权重本身有争议：「差异 = 困难、可预测」的强版本对比分析已被证伪；当代框架（Jarvis &amp;amp; Pavlenko 2008）把迁移看作多因素之一。本条只挂已核实的 2002 年期刊论文——戴炜栋《外语教育学》一书本轮未打开原文，其论点未挂入（待核登记）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 隐喻 CG-03 CG-04 束定芳 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-metaphor&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;66&quot; cy=&quot;50&quot; r=&quot;28&quot; fill=&quot;#fdf0e9&quot; stroke=&quot;#b34724&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#8f3418&quot;&gt;跨圈借&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;靠「像」&lt;/text&gt;&lt;circle cx=&quot;184&quot; cy=&quot;50&quot; r=&quot;28&quot; fill=&quot;#eef6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;同圈指&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;靠「挨着」&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;先问一句：这两个东西是一个圈子的吗？&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;隐喻靠的是「有点像」：全像就不是隐喻，完全不像也成不了（CG-03 · 束定芳）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（束定芳《隐喻学研究》2000）：隐喻是部分语义特征的转移——始源域与目标域之间必须有相似性，但相似性有程度、还和文化传统有关。两事物完全相同 → 无所谓隐喻；截然没有相似 → 隐喻不成立。隐喻在本质上是人类理解世界的一种感知和形成概念的工具，不只是修辞点缀。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;只借一部分&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;把时间说成「小偷」，借的是「悄悄拿走东西」，不是一模一样。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;说 argument is war，只借「对抗」，不借「流血」——「部分转移」解释了为什么隐喻不能字字当真。合格的隐喻理解，就是找出「像在哪、没借哪」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;同圈是转喻&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;「白宫发话了」不是把白宫比作人——白宫和总统本来就挨着，拿房子代指里面的人，这叫转喻（CG-04）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;&lt;span class=&quot;en&quot;&gt;the Crown&lt;/span&gt;（王冠→王权）、&lt;span class=&quot;en&quot;&gt;all hands on deck&lt;/span&gt;（手→水手）都是转喻。读到 &lt;span class=&quot;en&quot;&gt;The pen is mightier than the sword&lt;/span&gt; 若按隐喻硬解会卡住，按转喻（笔→写作/舆论，剑→武力）立刻通。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;英汉同题、借法不同：&lt;/b&gt;同是「时间」隐喻，汉语说「光阴似箭」，英语说 &lt;span class=&quot;en&quot;&gt;time flies&lt;/span&gt;——像的部分不一样。隐喻的相似性带着文化烙印，这正是英汉隐喻教学的分界点（CG-03）。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;相似性究竟是隐喻的&lt;b&gt;前提&lt;/b&gt;还是&lt;b&gt;产物&lt;/b&gt;？互动论与概念整合理论认为，有些「像」是诗人说完、听者才发现的，并非预先存在（CG-03 分歧栏）。另外，隐喻与转喻在真实语料中常交织，小学阶段只要求能判主导机制，不追求分类学洁癖（CG-04）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 空间 CG-05 CG-06 蓝纯 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-space&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;34&quot; y=&quot;40&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;往前 →&lt;/text&gt;&lt;text x=&quot;34&quot; y=&quot;66&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;三天之后&lt;/text&gt;&lt;path d=&quot;M118 52 h26&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;polygon points=&quot;144,52 138,46 138,58&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;150&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;#fdf0e9&quot; stroke=&quot;#b34724&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;193&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#8f3418&quot;&gt;先画空间&lt;/text&gt;&lt;text x=&quot;193&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;时间搭第二层&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;看得见的远近高低，先于看不见的过去未来&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先懂空间，才懂时间：时间词是借空间词盖的房子（CG-05 · 蓝纯）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（蓝纯空间隐喻研究）：人有感知空间的器官与神经，却没有感知时间的器官，所以对空间的感知和概念化必然先于时间；个人成长中也是先习得空间概念、后习得时间概念。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;母语是活教材&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;「上周 / 下周」「前天 / 后天」——汉语自己就在用空间词说时间，这份经验可以直接正迁移。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;教 &lt;span class=&quot;en&quot;&gt;before / after、in an hour、from now on&lt;/span&gt; 这类时间表达时，先把空间图式（前后、长短、远近）画出来，时间义是搭在上面的第二层，不是另起炉灶背一遍。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;状态排第一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;汉语说「情绪高涨、士气低落」，英语说 &lt;span class=&quot;en&quot;&gt;high spirits、feel down&lt;/span&gt;——把高低借去说心情，全世界都这么干（CG-06）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;蓝纯对英汉「上/下」与 UP/DOWN 的语料对比显示：映射到状态、数量、时间、社会等级四个目标域时，&lt;b&gt;状态域在英汉中都排第一&lt;/b&gt;（语料样本量据学术综述转引：上 750 例、下 434 例、UP 529 例、DOWN 431 例——原书统计口径待核）；其余三域的次序英汉不同。所以方位隐喻先攻状态域（好状态为上），再逐个对比，&lt;b&gt;禁止把对照表整表平移&lt;/b&gt;。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;分界要标出：&lt;/b&gt;汉语还有纵向时间——「上周 / 下周」用上下说时间，英语没有对应说法。空间图式有文化差异，迁移时这一刀要切清楚（CG-05）。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;时间是否&lt;b&gt;全部&lt;/b&gt;借自空间？Evans (2004) 主张时间有独立结构。主流共识是「空间是时间概念化的主要而非唯一来源」——教学取主要来源，分歧如实并存（CG-05）。另：次序说的是概念依赖，不是每条时间表达都必须先教空间义（如 yesterday 可整体习得）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 判据 CG-07 薄冰 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-rule&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;24&quot; width=&quot;190&quot; height=&quot;40&quot; rx=&quot;12&quot; fill=&quot;#fdf0e9&quot; stroke=&quot;#b34724&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;800&quot; fill=&quot;#8f3418&quot;&gt;跟现在还有关系吗？&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#257a35&quot;&gt;有 → have done&lt;/text&gt;&lt;text x=&quot;188&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#5a6b78&quot;&gt;只讲那一刻 → 过去时&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;have done 不是在说「做完了没有」，是在说「以前的事，现在还算数」（CG-07 · 薄冰）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（薄冰《英语语法手册》定版讲法）：现在完成时表示动作发生在过去，但与现在情况有关系——用一个过去的动作来说明现在的情况；一般过去时只表示动作发生在过去，一般不表示和现在的关系。分界不在时间远近，在「是否表示和现在的关系」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;丢钥匙&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have lost my key.&lt;/span&gt; —— 丢是过去的事，重点是&lt;b&gt;现在没钥匙用&lt;/b&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;只讲过去那一刻、不管现在，就用过去时。判据先立住，完成时就不会乱用。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;去过北京&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have been to Beijing.&lt;/span&gt; —— 去是过去的事，留下的是&lt;b&gt;现在有这份经历&lt;/b&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;用法再分三面：已完成/刚完成（了）、经验或结果（过）、延续到现在（since / for）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;语料里的病根：&lt;/b&gt;中国学生语料（CLEC）中，完成时误用多为「与过去时间状语连用」——正是判据没立住、只记住「做完」的直接后果。本页病句医院第一案就是它。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;薄冰的表述与国际定版（Comrie、CGEL 的「现时相关」）在此点完全一致——它不是新发明，而是国内主流语法书数十年的定版，只是大量课堂口诀把它压扁成了「过去做完」。但薄冰框架仍属传统「时态」讲法，没有分开时与体，也未处理完成时的语篇功能；且英式/美式有真实差异（美式在 just / already / yet 场景更常用过去时，本讲法偏英式规范），教学时应注明。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 儿童 CG-08 Halliday --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-child&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;要东西&lt;/div&gt;工具型&lt;br&gt;&quot;I want&quot;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;指挥人&lt;/div&gt;调节型&lt;br&gt;&quot;do as I tell you&quot;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;交朋友&lt;/div&gt;互动型&lt;br&gt;维系关系&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;说自己&lt;/div&gt;个人型&lt;br&gt;表达感受&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;问为什么&lt;/div&gt;启发型&lt;br&gt;&quot;why&quot;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;编故事&lt;/div&gt;想象型&lt;br&gt;假装与创造&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;小宝宝还不会说句子，就已经会用声音办七种事（CG-08 · Halliday）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Halliday《Learning How to Mean》1975，对孩子 Nigel 的纵向观察）：儿童在掌握成人语法之前，先发展出七种「微功能」——工具、调节、互动、个人、启发、想象，最后才是&lt;b&gt;信息型&lt;/b&gt;（传递事实）。成人眼中语言的「主业」传信息，在孩子那里是压轴出场的。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先有事，后有话&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;孩子是先把语言当&lt;b&gt;做事的工具&lt;/b&gt;，后当&lt;b&gt;传递信息的系统&lt;/b&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这直接给出小学英语的组织原则：单元按「孩子要用英语办的事」排，而不是按语法点排（与课程屏 CG-11 同一条线）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;七种活儿的出场顺序：&lt;span class=&quot;chip&quot;&gt;要东西&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;指挥&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;互动&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;表达自我&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;求知&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;想象&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;传信息（最后）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;七功能源于个案纵向观察（以 Nigel 为主），清单与次序带个案烙印；它是发展视角的组织框架，不是课时表——不能推成「一年级只教工具型」这类机械排课。功能切法各家不同（Dore 以言语行为重切；Halliday 后期把七功能收编进三大元功能）；「功能先于形式」的强版本也受到用法基础理论（Tomasello）的修正。本条取其稳固部分。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;一条线穿起本组：&lt;/b&gt;把系统功能语言学带入中国的桥梁人物正是 Halliday，而在华传播的主将是胡壮麟（本页篇章屏 CG-01）——两条首尾呼应。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 课程 CG-09 CG-10 CG-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-course&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#fdf0e9&quot; stroke=&quot;#b34724&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;43&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#8f3418&quot;&gt;内容&lt;/text&gt;&lt;rect x=&quot;76&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#eef6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;99&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;交流&lt;/text&gt;&lt;rect x=&quot;132&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;155&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;动脑&lt;/text&gt;&lt;rect x=&quot;188&quot; y=&quot;30&quot; width=&quot;46&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;211&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;文化&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;CLIL 的 4Cs：四样一起转，缺一样就瘸一条腿&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学英语的目标不是「学完第三单元」，而是「能用英语做成一件事」（CG-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：CEFR（欧洲委员会 2001；2020 扩充）的核心是行动导向——学习者是「社会行为者」，水平不按语法覆盖量定义，而按 can-do 描述语定义（六级 A1–C2，2020 年补 Pre-A1）。方法论后果是逆向设计：从「最终需要能做什么」倒推课程、教材与考试。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;目标写成一句话&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;把目标写成「我能……」：能自己去问路、能给外国小朋友介绍我的学校。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;本 app 的用法就是目标语言：每个单元的学习目标改写成儿童版 can-do 句，进度按「做成的事」计。2020 版还把「调解」（把一段说明讲给同伴听、在人和文本之间搭桥）升为第四种活动——同伴互助、图文转述就是现成的任务原型。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;用英语上别的课&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;CLIL 的 4Cs（Coyle、Hood &amp;amp; Marsh 2010，CG-09）：内容、交流、动脑、文化四样共生，不是相加。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;抽掉「动脑」只剩词汇操练，抽掉「交流」只剩默读课文，抽掉「内容」就退回普通语言课。对本 app，它是科学、数学等学科英语模块的设计检查表：每个模块过一遍 4Cs，缺哪补哪。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;先排要办的事&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;意念-功能大纲（Wilkins 1976；van Ek 1975，CG-11）：先看你要办什么事——道歉、邀请、问时间、比大小——再把办这些事需要的句子配齐。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一功能可由多个形式实现（Could you…? / Please… / …!）；语法不是主角，是工具箱。van Ek 的《Threshold Level》是第一份完整规格，这条线直通 CEFR（B1 级至今官方别名仍叫 Threshold）。中国现行课标的「语言功能」板块即其直系后裔。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（如实标注）：&lt;/b&gt;① CEFR 是欧洲为通用学习者（以成人流动为原始场景）研制的参照框架，其描述语与分级&lt;b&gt;不是&lt;/b&gt;为中国小学生的发展次序实证标定的——A1/A2 可借作目标措辞与大致标尺，不得把六级阶梯当作小学英语的发展定律或达标线；中国语境的法定参照是义务教育英语课程标准与中国英语能力等级量表（CSE，2018）。② CLIL 的成效证据高度依赖实施条件，欧洲证据多来自中学与自愿项目，小学低段直接证据薄弱；Bruton 等人指出不少 CLIL 研究存在选择偏差，语言收益可能被高估。「文化」维度在单语课堂最易流于表面节庆（food-flags-festivals），框架作者本人亦警告过。③ 纯功能大纲的已知缺陷：功能清单本身没有内在难度次序，先教哪个仍要靠语法与频率裁决——本组收作组织原则，不主张废弃语法序列。（CG-09 的 4Cs 页码 p.41 出自多家转述，待核登记。）&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 泡与读 CG-12 CG-13 CG-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-soak&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;28&quot; width=&quot;96&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#eef6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;听 · 读&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;泡得接近母语者&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;28&quot; width=&quot;96&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fdeeee&quot; stroke=&quot;#d66&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#b33636&quot;&gt;说 · 写&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;准确会卡住&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;沉浸式五十年评估的收敛结论（CG-12）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;整天听英语，耳朵会越来越厉害；但开口说的小毛病会悄悄固定下来（CG-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：加拿大法语沉浸式（1965 年起）五十年评估的收敛结论（Genesee 1987 综述；Cummins 三十年回顾）：沉浸生母语与学业不受损，二语接收技能（听、读）到小学高段可接近母语者水平；而产出技能（说、写）明显滞后——流利敢说，但语法准确性、得体性与词汇精确度与母语者有持续差距。Swain 据此提出输出假说：学习者需要在产出中「注意到缺口」、被推着修正，沉浸课堂必须有意识地插入形式聚焦——学科教学不总是好的语言教学。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先修拼读这条路&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;cat = c-a-t&lt;/span&gt;：看见字母能拼出声音、把声音连成词（CG-13，英国 Rose 审查 2006）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Rose 的定版结论：高质量拼读教学应是初学阅读的首要路线，合成拼读是其中最优形态——按明确次序教字母-音素对应，拼合（读）与切分（拼写）是可逆的同一技能。但两个限定同等重要：拼读须置于广阔丰富的语言课程之中；且按「简单阅读观」，阅读 = 解码 × 语言理解——解码满分而理解为零，阅读仍是零。政策落地：英格兰 2007 年起 Letters and Sounds、2012 年设一年级拼读筛查。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;多听可懂的&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;多听、多看你基本能懂的英语故事，英语会慢慢自己长进脑子里（CG-14，Krashen 输入假说）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Krashen 的核心主张：语言习得的唯一途径是接收可理解输入——略高于当前水平（i+1）、能听懂意思的语言；焦虑会挡住输入生效（情感过滤）。它把教学重心从「讲解与操练」扭向「足量、有趣、可懂的听读材料」，对一线教师的影响居 20 世纪同类理论之首。它的定性与争议，必须整段读完下面这框。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;CG-14 的分歧，必须整段呈现（定版：输入必要而不充分）：&lt;/b&gt;① &lt;b&gt;可证伪性&lt;/b&gt;——Gregg (1984) 与 McLaughlin (1987) 指其核心概念（习得/学得之分、i 的界定）无法独立检验，理论「在每个关口都不成立」（McLaughlin 语）；Gregg 讥其解释力不强于莫里哀笔下「鸦片有催眠之力因其有催眠之德」的笑话。② &lt;b&gt;充分性&lt;/b&gt;——本屏 CG-12 的沉浸证据显示，足量可懂输入并不自动带来产出准确性，Swain 输出假说即由此而起。③ &lt;b&gt;现代修正&lt;/b&gt;——技能习得研究（DeKeyser）显示显性知识可经练习自动化，「学得不能变习得」的强断言已被普遍放弃；Lichtman &amp;amp; VanPatten (2021) 的四十年再评估为其部分平反。共识状态：&lt;b&gt;输入必要而不充分&lt;/b&gt;。本条按「有重大影响的教学主张」收录，不按已证定论收录；app 内凡引用 Krashen，必须连同本分歧呈现。另：i+1 的 i 与 +1 无法独立测量，只能作材料选择的方向性原则。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;① CG-12 的加拿大沉浸是官方双语国的自愿项目（家长主动选择、教师为双语者），与中国 EFL 课堂条件差异巨大：可迁移的是机制结论（输入 ≠ 产出能力、形式聚焦不可缺），不是课时比例或成效数字；且产出差距是「相对母语者」的差距，其绝对水平远超普通外语课学生，不得反读为「沉浸无效」。产出差距的归因亦有争论（产出机会不足 vs 输入本身缺少某些形式）。② CG-13 的对象是英语为母语的儿童（解码是其瓶颈）；中国儿童的瓶颈是解码 + 词汇量 + 听力理解三者并缺，「首要路线」迁移时须重新排序。Rose 路线在英国学界有持续批评（Wyse &amp;amp; Styles、UKLA 质疑合成拼读优先的证据强度）：跨国稳固的只有「系统性」三字，「合成优先」是英方立场，如实标注。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：衔接 ≠ 连贯，摆在一起看&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;下面两段是机制演示（非文献原例）：一段钉子齐全却不成画，一段没有钉子却自成一幅画（CG-01）。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A 段：有衔接，没连贯（假连贯）&lt;/h4&gt;
&lt;p&gt;「我有一支铅笔。&lt;span class=&quot;en&quot;&gt;Then&lt;/span&gt; 铅笔是红的。&lt;span class=&quot;en&quot;&gt;Then&lt;/span&gt; 月亮很圆。&lt;span class=&quot;en&quot;&gt;Then&lt;/span&gt; 我七岁了。」—— 每句都有连接词粘着，代词、复现也都在，可是读的人心里拼不出任何一幅画：这叫有衔接、没连贯。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;B 段：没衔接，有连贯（隐连贯）&lt;/h4&gt;
&lt;p&gt;「天黑了。妈妈把灯打开。饭菜的香味飘过来。我们围坐在桌子旁。」—— 一个连接词都没有，意思却自己顺成一幅晚饭前的画：这叫没有显眼线索、连贯照样成立。写作先保 B 段这样的「画」，钉子是后加的。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对照二：「上」不能整表平移（CG-06）&lt;/h4&gt;
&lt;p&gt;状态域英汉同构：情绪&lt;b&gt;高&lt;/b&gt;涨 / &lt;span class=&quot;en&quot;&gt;high&lt;/span&gt; spirits，士气&lt;b&gt;低&lt;/b&gt;落 / feel &lt;span class=&quot;en&quot;&gt;down&lt;/span&gt;——这一格可以放心对上。但数量、时间、等级等其余目标域，英汉排位不同：把「上 = up」的对照表整张搬过去，必然在某些格子上出错。先攻状态域，再逐格对比。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的典型案子&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;每个案子的病因都挂在本组的机制上：判据没立住、手法判错、只粘钉子、或者根本不是「错」而是「躲」。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have finished my homework yesterday.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I finished my homework yesterday.&lt;/span&gt; —— yesterday 是纯过去的时间点，和它连用就只讲「过去那一刻」，用过去时。完成时的判据是「与现在有关系」（CG-07）；中国学生语料里，这正是完成时最常见的误用类型。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 读 The pen is mightier than the sword，按「笔比剑厉害」硬解，卡住&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是转喻：笔 → 写作/舆论，剑 → 武力。&lt;/span&gt; —— 笔和写作在同一个圈子里挨着，是同圈指代（CG-04），不是跨圈打比方。先问「是一个圈子的吗」，阅读立刻通。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 作文每句都有 and / then，读起来还是不通&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 钉子齐了，画没排好——缺的是连贯（CG-01）。&lt;/span&gt; —— 先把事情在心里排成一幅有顺序的画，再决定哪里需要连接词。连接词是后加的钉子，不能反过来拿钉子冒充画。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 作文只敢写简单句，定语从句一次都没出现&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是「生产不足」（躲），处方是给支架、鼓励产出，不是加倍纠错（CG-02）。&lt;/span&gt; —— 负迁移四张脸对应四种药：躲 → 给支架；套 → 给边界；错 → 对照纠正；岔 → 讲英汉切分差异。先诊断，再下药。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 回到机制再选&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.（诊断）I have seen this film yesterday. 错在哪里？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;seen 拼错了&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;yesterday 只讲过去那一刻，和「与现在有关系」的完成时判据冲突&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;film 前面少了 the&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.（迁移）&quot;All hands on deck!&quot;（全体水手到甲板集合）里的 hands 是什么手法？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;隐喻：把水手比作手&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;转喻：手和水手在同一个圈子里，拿挨着的部分指代人&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;夸张：手的数量特别多&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.（诊断）一段话句句都有 then，却读不连贯。它缺的是什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;连接词还不够多&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;连贯——句子之间的意思没有接成一幅画&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;句子太短了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.（迁移）要学 in an hour、from now on 这类时间说法，先做什么最稳？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;先把短语背二十遍&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;先把前后、长短的空间图式画出来，时间义搭在上面学&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;先查词典里的第一个意思&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一个核心机制（儿童版标题句 + 示意图 + 案例 + 诚实边界），每屏标注来源条目编号；CG-14（Krashen）的分歧整段呈现、不作定论；样本数字等未核项在屏内就地标注待核。&lt;br&gt;内容来源：《专家规律总结清单》中国学者 + 全球传统簇 CG-01 – CG-14（catalog_add_china_global.md，共 14 条；胡壮麟 1994；戴炜栋、王栋 2002；束定芳 2000；蓝纯 2003；薄冰《英语语法手册》；Halliday 1975；Coyle, Hood &amp;amp; Marsh 2010；Council of Europe 2001 / 2020；Wilkins 1976；van Ek 1975；Genesee 1987；Swain；Rose 2006；Krashen 1982 / 1985）。&lt;br&gt;待核项：4 项（CG-02 戴炜栋《外语教育学》原文未核、其论点未挂入条内；CG-01 胡壮麟五层衔接的原书页码；CG-06 蓝纯语料样本数字为学术综述转引、原书统计口径未核；CG-09 CLIL 4Cs 的 p.41 页码出自多家转述）。&lt;/div&gt;
&lt;/div&gt;

&lt;span class=&quot;tag&quot;&gt;展示原形 · 母语专家组（NE-01 – NE-29）&lt;/span&gt;
&lt;h1&gt;母语专家之眼&lt;/h1&gt;
&lt;p&gt;英美澳的专家教自己孩子学英语时，眼睛盯的不是「对不对」，而是：他们真的怎么说、孩子真的怎么学。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总纲：&lt;/b&gt;语言不是一个词一个词现拼的——脑子里整存着成块的现成话（NE-01–NE-03）；规矩要向事实低头，先问证据（NE-04/NE-15）；说法是做出来的&lt;b&gt;选择&lt;/b&gt;（NE-16），学习是先被托着走、再自己走（NE-19/NE-29）；发音的目标是&lt;b&gt;被听懂&lt;/b&gt;，不是扮成谁（NE-14）。&lt;/div&gt;

&lt;div class=&quot;cov&quot;&gt;&lt;b&gt;覆盖表&lt;/b&gt;（29 条全部上屏）&lt;br&gt;
理解侧：NE-01 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-02 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-03 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-04 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-05 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-06 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-07 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-08 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-09 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-10 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-11 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-12 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-13 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-14 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-15 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt;&lt;br&gt;
教学侧：NE-16 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-17 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-18 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-19 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-20 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-21 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-22 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-23 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-24 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-25 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-26 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-27 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-28 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; NE-29 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt;&lt;/div&gt;

&lt;!-- 整块库存 NE-01 NE-02 NE-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-stock&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;26&quot; width=&quot;104&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;整句拿出来用&lt;/text&gt;&lt;rect x=&quot;132&quot; y=&quot;26&quot; width=&quot;104&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#f4f4f8&quot; stroke=&quot;#b7b3cc&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#55506e&quot;&gt;一词一词现拼&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#257a35&quot;&gt;快 · 地道&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#b33636&quot;&gt;慢 · 每句都对但不像&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;母语者的秘密：脑子里有一座现成话仓库&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一句话有一百种「没说错」的讲法，他们翻来覆去只用那两三种（NE-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Pawley &amp;amp; Syder）：语法允许的正确说法几乎无穷多，但母语者稳定地只选少数听起来自然的——这种知识不在规则里，在对「惯例化现成说法」的掌握里。学习者最典型的状态就是「每句都对，但每句都不像他们会说的」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;谜题一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I want to marry you.&lt;/span&gt; ✔ 他们会说的&lt;br&gt;&lt;span class=&quot;en&quot;&gt;It is my wish to become married to you.&lt;/span&gt; ✔ 合语法，但没人这么说&lt;br&gt;&lt;span class=&quot;why&quot;&gt;两句都「对」，只有一句「地道」——地道选择（NE-01）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 为什么他们说得那么快？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;谜题二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;说话快，不是因为拼句子拼得快，是整存了大量&lt;b&gt;现成的半句、整句&lt;/b&gt;（词汇化句干），拿出来稍加改装就能用（NE-02）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;实验证据：现成说法读起来明显更快（Conklin &amp;amp; Schmitt 2008）；课堂上注意整块话的学习者，被盲评为口语更流利（Boers et al. 2006）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 所以学英语的起步单位是整块&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;起步法&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;先把整句话囤进脑子用熟，再慢慢看懂里面怎么搭（NE-03）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;有人数过：日常口语里约一半上下是现成说法（Erman &amp;amp; Warren 2000：口语 58.6%、书面语 52.3%，计数口径不同会浮动）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;对比台（屏内）：&lt;/b&gt;「合语法」是入场券，「地道」是他们真用的那一种。只学规则现拼，会得到 NE-01 说的那种英语：&lt;b&gt;每句都对，每句都不像&lt;/b&gt;。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;句干库存「以数十万计」是 Pawley &amp;amp; Syder 的&lt;b&gt;理论估计&lt;/b&gt;，无法逐条实测清点，引用时只能按估计口径。Wray 还提出「识别问题」：一段话到底是整取还是现拼，没有单一可靠测试能判定，所以占比数字永远是近似的（NE-02/NE-03）。整块也要拆：只囤不拆，遇到没背过的场合就卡壳。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;排队买票时你不会现拼句子——&lt;b&gt;Can I have…? What&#x27;s this?&lt;/b&gt; 整句早就住在嘴边。母语者一整天的话，一大半都是这样整块拿出来用的。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 规则考古 NE-04 NE-05 NE-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-rules&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;24&quot; y1=&quot;62&quot; x2=&quot;226&quot; y2=&quot;62&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#c05a8e&quot;&gt;1762&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;Lowth 贬斥句末介词&lt;/text&gt;&lt;circle cx=&quot;152&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;1864&lt;/text&gt;&lt;text x=&quot;152&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;Alford 推广分裂不定式禁忌&lt;/text&gt;&lt;circle cx=&quot;222&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#0f766e&quot;/&gt;&lt;text x=&quot;222&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;今天&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;两条「铁律」的出生证：都照着拉丁语发明的&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;好些「语法铁律」是两三百年前照着拉丁语发明的（NE-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Crystal）：句末介词的禁忌出自 Lowth (1762)，分裂不定式的禁忌主要由 Alford (1864) 推广——理由都是「拉丁语里不能这样」。但英语不是拉丁语：句末介词自古英语以来就是常态，分裂不定式从 13 世纪起大作家一直在用。判别测试：一条「规则」若逼得你把话说得别扭，它多半是假的。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;零容忍&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;没有任何一条规则是被所有人、所有时候百分之百遵守的（NE-04）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Crystal：妄图把语言「冻住」的做法每一代都失败。替代标准不是「唯一正确」，而是「得体」——对谁说、在什么场合说。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 英语到底归谁管？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;三圈世界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;全世界说英语的人里，母语者反而是少数；多数交际发生在非母语者之间（NE-06）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Kachru 三圈模型：内圈提供规范、外圈发展规范、扩展圈（中日韩等）依赖规范。学习目标应从「像某个母语者」转为「在国际场合被广泛理解」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;辟谣位（本区）：&lt;/b&gt;「句子最后不能放介词」「to 和动词中间不能插词」——不是英语生来就有的规矩（NE-05）。Fowler 兄弟早在 1907 年就警告：对分裂不定式的「迷信」本身才是要纠正的毛病。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;反规定主义 ≠ 没有标准：学校、考试与正式出版的公共书面规范照教，但要如实说明它是「正式场合的约定」。正式作文里绕开句末介词是&lt;b&gt;文体策略&lt;/b&gt;，不能讲成语言对错、更不能据此判错口语。三圈模型也有批评：Jenkins 等指出它把扩展圈永久钉在「依赖规范」的位置，与 ELF 研究的现实不符——模型的历史功绩与过时之处要同时呈现（NE-06）。另有翻案之声指出分裂不定式禁忌迟至 1803 年才被明文提出、Lowth 本人态度比传说温和，但总判断不受影响（NE-05）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;得体 &amp;gt; 唯一正确（NE-04）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;规范是约定，不是法律（NE-04）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;说给全世界听（NE-06）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 词典工程 NE-07 NE-08 NE-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-dict&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;125&quot; cy=&quot;54&quot; r=&quot;38&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#0b5f57&quot;&gt;约 3000 词&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;释义只许用这些&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;掌握这把钥匙，整部词典都读得懂&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;只用三千个已知词，就能解释一切新词（NE-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Hornby）：学习者词典写释义时，只许用一张约 3000 个高频词的清单（受控释义词汇）——查哪个词都不会卡在另一个生词上。原理来自 Johnson 的老原则：解释用的词必须比被解释的词更浅易。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;句型&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;查动词不能只看意思，还要看它后面怎么接（NE-08）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Hornby 在 1942 年就归纳出 25 个动词句型写进词典。造句出错多半不是词义错，是「句型假类推」：仿 &lt;span class=&quot;en&quot;&gt;I asked him to come&lt;/span&gt; 造出 &lt;span class=&quot;en&quot;&gt;✗ I proposed him to come&lt;/span&gt;。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 先有情景，再有句型&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;情景法&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;学一句话，先演一出小情景：谁、在哪儿、想干什么（NE-09）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Hornby 的情景法：新结构必须放进有意义的情景里呈现和操练——先有场合与目的，再有句型。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;「3000」是约数，随版次在 2800–3500 间浮动，不得写死（NE-07）。25 个句型全表是教师备查工具，小学只引入最高频的几个基本句型（NE-08）。情景法的历史局限也明确：操练偏机械、真实交际不足，这正是它后来被交际法取代的原因——取其「情景先行」，操练要换成有真实表达目的的任务（NE-09）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;词典里还要看：&lt;span class=&quot;chip&quot;&gt;[C] / [U] 可数标记（NE-08）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;真实例句（NE-08）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;动词的「接法」（NE-08）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;查 &lt;b&gt;propose&lt;/b&gt; 时只看中文意思「提议」，就会造出 ✗ I proposed him to come。词典里的句型栏早就写清了它不能这样接——词典真正的灵魂是例句和句型。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 声音身份 NE-10 NE-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-voice&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;125&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;I didn&#x27;t say &lt;tspan fill=&quot;#c05a8e&quot;&gt;she&lt;/tspan&gt; took it.&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;14.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;I didn&#x27;t say she &lt;tspan fill=&quot;#c05a8e&quot;&gt;took&lt;/tspan&gt; it.&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;重音落在哪个词上，否认的对象就换一个&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;语调三 T：切块 · 落点 · 走向&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说话时每时每刻在做三个决定：切块、落点、走向（NE-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Wells 的「三 T」）：先把话切成一小块一小块（调群划分），再决定哪块里哪个词喊重一点（调核落点，标出新信息），最后决定这个词的声音往下掉还是往上挑（调型，带态度）。语调和词汇、语法平级地表义。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;三 T&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I didn&#x27;t say she took it.&lt;/span&gt;——重音换位，意思全变（NE-10）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;三 T 里，调核落点与调型是英语最特异、最值得教的两件；切块各语言大体相通，相对不难。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 口音又是怎么回事？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;口音地图&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;各地口音不一样，是「从哪儿来」的标记，不是说错了（NE-11）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Wells：口音差异不是随机错误，是成系统的整组对应（同一批词的元音整组地变）。他用「词汇集」关键词（FLEECE、KIT、BATH…）让各种口音可以精确对照。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;教学仍需选定一个参照口音作输入样本——参照是坐标系，不是审判席。小学目标是「听得懂多种、说得出一种清楚的」，不是消除一切口音特征（NE-11，与 NE-14 一致）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;语调的活儿：&lt;span class=&quot;chip&quot;&gt;标态度&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;切分句子&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;指出新信息&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;衔接话语&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;标记身份&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 身体发音 NE-12 NE-13 NE-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-body&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;30&quot; width=&quot;48&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0b5f57&quot;&gt;舌&lt;/text&gt;&lt;rect x=&quot;72&quot; y=&quot;30&quot; width=&quot;48&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;96&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0b5f57&quot;&gt;唇&lt;/text&gt;&lt;rect x=&quot;128&quot; y=&quot;30&quot; width=&quot;48&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0b5f57&quot;&gt;下巴&lt;/text&gt;&lt;rect x=&quot;184&quot; y=&quot;30&quot; width=&quot;48&quot; height=&quot;34&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0b5f57&quot;&gt;嗓音&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;四个肌肉「按钮」：前后 · 开合 · 上下 · 开关&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;先摸下巴感受，再听声音&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;发音不是用脑子想的，是用嘴练的：先找到四个「按钮」（NE-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Underhill）：发音是语言的身体维度，教学应像体育、舞蹈教练那样从身体入手——先用本体感觉接通自己的发音肌肉（舌、唇、下颌、声带），知道它们在做什么，才能改它们。顺序倒转：感受肌肉 → 自己试出声音 → 再对照目标。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;摸着练&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;拇指抵住下巴尖，在 &lt;span class=&quot;en&quot;&gt;/iː/&lt;/span&gt; 和 &lt;span class=&quot;en&quot;&gt;/ɑː/&lt;/span&gt; 之间滑动（NE-12）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;下巴的开合用手指就能摸到——一串不同的元音，就是下巴开多大、舌头在哪儿。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 音标表是干什么的？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;发音地图&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;音标表不是考卷，是一张可以上手玩的地图（NE-13）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;44 个音按发音的空间关系排布：嘴前面的音排前面，上面的音排上面。老师点一个格子，全班就能认、比、改、玩这个音。发音还不该只在「发音时段」出现，它弥漫在一切语言活动里。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 目标到底是什么？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;被听懂&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;目标是被听懂，不是扮成母语者（NE-14）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Hancock：没有证据表明「母语口音」比「非母语口音」更易懂。把 &lt;span class=&quot;en&quot;&gt;shave&lt;/span&gt; 说成 &lt;span class=&quot;en&quot;&gt;safe&lt;/span&gt; 不是「错」，是「不起作用，听者会懂成另一个词」；&lt;span class=&quot;en&quot;&gt;gate&lt;/span&gt; 的元音不必和谁一模一样，但必须与 &lt;span class=&quot;en&quot;&gt;get&lt;/span&gt; 不同——区别在，可懂度就在。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;身体路线擅长攻克单个音的产出；语流里的弱读、连读是听力理解的主要门槛，须专门教听辨，但产出端不强求全套复制（NE-14）。Hancock 的发音教学是「四 M」：肌肉、思维、意义、记忆——不只是听后跟读。可懂度优先与传统「以英美标准音为唯一产出目标」的教学观正面冲突，本页站在可懂度阵营（与清单现行裁定方向一致）；有特殊目标（应试朗读等）可另行设定（NE-14）。音标表以英式 44 音位为格架，美音参照格数略有出入；系统音标读写随识字进程逐步引入（NE-13）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;发音四 M：&lt;span class=&quot;chip&quot;&gt;肌肉 muscle&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;思维 mind&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;意义 meaning&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;记忆 memory&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 证据关 NE-15 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-evi&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;18&quot; width=&quot;140&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fdeeee&quot; stroke=&quot;#d66&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#b33636&quot;&gt;著名语法小册子&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;连「被动句」都认不全&lt;/text&gt;&lt;path d=&quot;M125 70 v14&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;先问：证据呢？&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;连最有名的语法小册子都会写错——规矩先过证据关（NE-15）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Pullum）：Strunk &amp;amp; White《The Elements of Style》风靡几代人，但其语法论断多出于直觉而非对真实用法的考察：说「none 须配单数」，查名家原文却见复数搭配比比皆是；给出的「被动」例句多半根本不是被动句；还自相矛盾——刚命令少用形容词，下一句就违反自家戒律。规则的合法性来自可核查的用法证据。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;查原文&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;检验一条规则，就去查大作家们真的怎么写（NE-15）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Pullum 逐条核查的方法本身，就是「规则须过证据关」的工作程序——他是《剑桥英语语法》(2002) 的联合主编，批评以描写成果为据。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 焦虑从哪来？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;无来由的焦虑&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;几代学生写 however、than me 就心慌，却说不出为什么&lt;br&gt;&lt;span class=&quot;why&quot;&gt;被无据的规则训练出的「语法焦虑」，正是 NE-04/NE-05 要拆的东西。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（家长小字）：&lt;/b&gt;Pullum 的火力集中于该书的&lt;b&gt;语法论断&lt;/b&gt;；其文体建议（如「删繁就简」）他多视为无害。也有辩护方（Bulley 2010）认为该书作为文体启蒙自有价值——辩护成立的范围限于文体启蒙，不动摇「语法论断无据」的判定（NE-15）。本条在小学的用途是教师侧纪律：引进任何「规则」前先核证据，不把焦虑传给孩子。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;写得不好当然要改——Pullum 的原话是「Bad writing needs to be fixed. But let&#x27;s make sure we fix the right things.」（坏文章要改，但要改对地方。）&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;zone&quot;&gt;第二区 · 教学侧：母语国家的课堂怎么做&lt;small&gt;NE-16 – NE-29 · Myhill / 悉尼学派 / Clay / Mercer / Alexander / Corbett / Gibbons —— 每条都带「搬到中国小学」的条件（家长小字）&lt;/small&gt;&lt;/div&gt;

&lt;!-- 语法选择 NE-16 NE-17 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-choice&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;62&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;49&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#4c439e&quot;&gt;长句&lt;/text&gt;&lt;rect x=&quot;94&quot; y=&quot;30&quot; width=&quot;62&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;短句&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;30&quot; width=&quot;62&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;201&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;换主角&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;同一种意思总有几种说法&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;学语法 = 多一条可选的路&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学语法像学调色：多一种颜色，画画时多一种选法（NE-16）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Myhill）：语法是修辞资源，不是贴标签、纠错误。教学目标是让学生看见「有哪些选法、各有什么效果」，并在谈话中把选择说出口——能说出自己为什么这样写，才算把语感变成了可控的写作决定。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;嵌进去教&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;语法要嵌在写作里教：叙事单元教人称如何制造不同的叙述声音，长短句如何制造节奏（NE-17）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;每个语法点都连着一个当下要做的写作决定——学的是「这个形式在这个语类里能干什么」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;证据要成对看（家长小字，NE-17）：&lt;/b&gt;
&lt;div class=&quot;pair&quot;&gt;&lt;div class=&quot;cell plus&quot;&gt;&lt;b&gt;正效果（中学 RCT）&lt;/b&gt;Exeter 随机对照试验：700 余名八年级学生、31 所学校，嵌入式语法组写作进步约为对照组两倍，效应量 e = 0.21——这是语法教学研究中罕见的严格因果证据。&lt;/div&gt;&lt;div class=&quot;cell minus&quot;&gt;&lt;b&gt;限定与复制失败&lt;/b&gt;① 被试是母语 13 岁学生，不是小学生、更不是 EFL，只能取方向、不能搬效应量；② 写作强的学生受益更多，弱的受益较少；③ 教师自己的元语言知识是中介，讲不清则效应打折；④ EEF 在小学六年级的复制评估&lt;b&gt;未复制出&lt;/b&gt;清晰效应——小学阶段是否同样有效，在英国证据体系内仍是开放问题。&lt;/div&gt;&lt;/div&gt;
两面都摆出来，才是这一条完整的样子：不得只引中学的阳性结果。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-16）：&lt;/b&gt;中国小学生的英语句型存量远小于母语儿童，「可选的仓库」本身很小——选择教学要等存量积累，先在口头与仿写中积累型式再谈选择。且「选择」不等于「没有对错」：EFL 阶段准确性目标不能被冲掉。学界长期分裂：多项元分析发现传统语法教学对写作无益甚至有害，Myhill 的回应是「只有换成选择/效果观并嵌入写作才有用」——不得简化为「研究证明教语法有效」。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;选择题面：&lt;span class=&quot;chip&quot;&gt;长句 / 短句&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;主动 / 被动&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;第一人称 / 第三人称&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;把为什么说出口（元语言谈话）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 语类地图 NE-18 NE-19 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-genre&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;34&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;43&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;先铺垫&lt;/text&gt;&lt;path d=&quot;M80 49 h14&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;34&quot; width=&quot;58&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;再出事&lt;/text&gt;&lt;path d=&quot;M156 49 h14&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;172&quot; y=&quot;34&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;207&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#4c439e&quot;&gt;再解决&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;故事的过关路线：Orientation → Complication → Resolution&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;说明书则是「一步一步来」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;每种文章都有自己的过关路线，先看清地图再上路（NE-18）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（J. R. Martin）：语类是「分阶段、奔着社会目的去的做事方式」——文本长成这样，是因为它在文化中承担一种目的（讲故事娱乐人、写报告分类存信息）。阶段可分析、可命名，「好文本」从玄学变成一张可以摆上桌面的地图，弱势学生不必靠家庭文化资本去猜。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;第一步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;把话题聊透（建立语场）→ 全班一起拆一篇范文（解构）（NE-19）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 拆完合写&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;第二步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;全班在老师执笔下合写一篇新的（共同建构）→ 最后才自己写（独立建构）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;支撑量沿循环递减：能力先在集体层面出现，再内化为个体能力——不会游泳的人不是被直接推下水的。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-18/NE-19）：&lt;/b&gt;语类清单是英语文化与澳大利亚课程的产物，搬的是「先给文本地图再让学生写」这一机制，目录要按本地任务重绘（自我介绍、看图写话、简单通知）。课时与班额是硬账：母语课堂跑完一个循环要数周，中国小学每周 2–4 节、40 人以上，「全班共同建构」时真正开口的比例会低得多，需用小组共写、句框接龙改造；且 EFL 学生连范文都可能读不懂，「建立语场」一环要额外承担词汇与理解的前置教学。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;专家分歧（NE-18/NE-19）：&lt;/b&gt;语类教学自诞生起就有「公式化」批评，担心阶段图把写作变成填空；悉尼学派回应：显性图式恰是创新的前提。过程写作传统则批评它过于教师主导，悉尼学派反批评：把要求藏起来的「自由」只奖励早就会的孩子——这是两种公平观的冲突，两边都要呈现。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 精读支架 NE-20 NE-21 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-r2l&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;16&quot; width=&quot;190&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;整篇：读前准备 → 共写 → 独立写&lt;/text&gt;&lt;rect x=&quot;48&quot; y=&quot;48&quot; width=&quot;154&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;段落：精细阅读 → 共同改写&lt;/text&gt;&lt;rect x=&quot;66&quot; y=&quot;80&quot; width=&quot;118&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#4c439e&quot;&gt;句子：造句 · 拼写 · 改写&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;不给「简单版课文」糊弄你——把支架加厚到句子层（NE-20）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Rose 的 Reading to Learn）：公平设计与分级读物相反——不降低文本难度，而是加厚互动支架。核心招式「精细阅读」：老师课前把文本逐句备好，课堂上先给意义提示、再让学生指出原文词句、最后确认展开，带每个学生读懂超出其独立阅读水平的文本。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;教师的语法书&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;语法不按词类排队，按语言的四种活儿排队（NE-21）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Derewianka 给小学教师的语法书分四块：表达经验（谁在做什么）、连接思想、与人互动、织造成文。备课先问「这篇文本要干哪种活儿」，再选要教的语法点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-20/NE-21）：&lt;/b&gt;R2L 对备课要求极高（逐句预设提示与追问），培训不到位容易退化成老师讲学生听；大班额下逐句互动的覆盖面是硬约束。EFL 低年级学生的拼读尚在建立，「共读难文本」需与系统拼读配合，不能替代它。分级阅读阵营与 R2L 的分歧是结构性的（匹配水平 vs 支架代降难度），实践中两者常互补——本页只登记 R2L 的主张，不裁定分级读物无用。功能语法的术语体系（参与者、过程等）与国内通用术语不重合，可借的是「按活儿组织内容」的思路，术语只能选择性吸收、不能全盘移植（NE-21）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;语言的四种活儿：&lt;span class=&quot;chip&quot;&gt;表达经验&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;连接思想&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;与人互动&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;织造成文&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 观察孩子 NE-22 NE-23 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-clay&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;24&quot; width=&quot;190&quot; height=&quot;46&quot; rx=&quot;8&quot; fill=&quot;#fff&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;42&quot; y=&quot;44&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;word word word&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;62&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;→ 从左往右 · 一词是一词 →&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;文字（不是图画）承载故事&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;先懂书怎么运作，再谈认字&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;读书之前先懂书的规矩：从哪页开始、从左往右读（NE-22）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Marie Clay 的「印刷概念」）：书有正反与页序、阅读方向、文字而非图画承载内容、词与词之间有界、词由字母按序构成——这些不是认字教学的副产品，而是阅读的先行组织框架。Clay 把它做成标准化观察任务：先逐个观察孩子实际在做什么，再据此教学。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;对中国孩子&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;汉字直觉帮不上忙：英语的这套「印刷品规则」要整套新建（NE-22）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这正是本条对 EFL 的价值——但测验材料与常模不能直接套用新西兰版本；且它测的是「懂不懂规矩」，高分不保证会读。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最吃力的孩子怎么办？&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;一对一干预&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;Reading Recovery：一年级阅读最困难的孩子，每天单独上 30 分钟、连上 12–20 周（NE-23）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;课的结构固定：重读熟悉书 → 跑读记录 → 字母/词的工作 → 写一句自己编的话、剪开重组 → 读一本新书。目标是建成「自我延伸系统」——脱离干预也能自己学。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;争议必须整段呈现（家长小字，NE-23）：&lt;/b&gt;
&lt;div class=&quot;pair&quot;&gt;&lt;div class=&quot;cell plus&quot;&gt;&lt;b&gt;短期效应：有据为正&lt;/b&gt;美国 i3 全国推广随机试验（1,222 所学校、6,888 名学生）确认一年级即时效应显著为正；早期评估机构曾给予正面评级。&lt;/div&gt;&lt;div class=&quot;cell minus&quot;&gt;&lt;b&gt;长期效果：新证据反转&lt;/b&gt;May 等 (2024) 用断点回归追踪至三、四年级：参与者的州测验分数反而低 0.19–0.43 个标准差；一项 19 项研究的纵向元分析报告一年后平均效应转负。批评方归因于「三线索猜词」与系统拼读不足；RR 阵营反驳样本流失逾 75%、比较组污染。&lt;/div&gt;&lt;/div&gt;
另有独立的成本之争（每生逾万美元）。本页立场：不得引用 RR 作为「一对一辅导有效」的无条件证据。中国课堂可迁移的只是设计原则（第一年就干预、基于逐日观察、目标是脱离干预），其一对一成本结构不可复制；且母语儿童的阅读困难与中国孩子「先缺口语与词汇量」的成因完全不同。也注意：对 RR 的批评不得转嫁到印刷概念（NE-22）这一观察框架上，反之亦然。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 课堂谈话 NE-24 NE-25 NE-26 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-talk&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;tri&quot;&gt;&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;吵架型&lt;/div&gt;谁也不听谁&lt;br&gt;断言对断言&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;附和型&lt;/div&gt;你说啥都对&lt;br&gt;堆起来不检验&lt;/div&gt;&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;探索型&lt;/div&gt;我说想法你问为什么&lt;br&gt;越聊越清楚&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;小组说话有三种样子，只有「探索型」里思考是公开进行的（NE-24）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Mercer）：谈话不只是思维的出口，谈话的型式本身就是思维的型式。探索型谈话里要做的事——提假设、要理由、权衡方案——正是独立思考的内在结构：先学会跟人一起这样想，才学会自己这样想。未经教导时，探索型占比很低，吵架与附和是默认状态。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先立规矩&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;讨论之前，全班一起把规矩谈出来（NE-25）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Thinking Together：规则要师生共建而非老师颁布——共享信息、主张给理由、欢迎质疑、人人受邀发言、力求共识并共同负责。英国原始研究：9–10 岁儿童学谈话规则后，关键推理语言特征出现频率增至约四倍；该方法已在&lt;b&gt;香港小学英语课堂&lt;/b&gt;完整实施并评估（125 名小学生）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 老师的检验尺&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;五原则&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;集体 · 互惠 · 支持 · 累积 · 目的（NE-26）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Alexander：多数课堂问答是「伪开放」——看似开放，实为等预设答案。五原则里「累积」最难：贡献要一块压一块往上垒，缺了它，热闹不是对话。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-24–NE-26）：&lt;/b&gt;① 中国课堂有自己的发言规范（举手、齐答），「质疑同伴」在低年级要先解决面子与安全感——先借「型式可命名、可自评」（让孩子分辨刚才是在吵、附和还是真讨论），比直接要求探索型更可行。② EFL 有语言瓶颈：想探索却没词——&lt;span class=&quot;en&quot;&gt;because… / I think… because…&lt;/span&gt; 等句框必须先于谈话规范到位（香港案例的改造点）。③ 大班额下 Talk Lessons 的定位是学期初的少量投资（先立规矩），低年级八条规则要减量并图示化。④ 全英对话链条很难拉长，可把五原则用在 3–5 分钟「短回合、高支架」片段里，并允许汉语承担元谈话。注：Alexander 本人 2020 年已修订扩展该框架，本页按「经典五原则」口径使用。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;谈话规矩（共建版）：&lt;span class=&quot;chip&quot;&gt;人人开口&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;理由跟上&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;可以不同意，要好好说&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一起做决定&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;定期回头评一评&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 先说后写 NE-27 NE-28 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-tfw&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;34&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#eefaf7&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;43&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;模仿&lt;/text&gt;&lt;path d=&quot;M80 49 h14&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;96&quot; y=&quot;34&quot; width=&quot;58&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;创新&lt;/text&gt;&lt;path d=&quot;M156 49 h14&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;172&quot; y=&quot;34&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;207&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#4c439e&quot;&gt;发明&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;学写故事像学唱歌：唱熟 → 换词 → 作曲&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;能说出来的，才能写出来&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先把范文说进嘴里，再谈写：模仿 → 创新 → 发明（NE-27）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Corbett 的 Talk for Writing）：孩子写不出他从未在口头上拥有过的文本类型。模仿段全班把范文内化（以读者身份读 + 以作者身份读、拆手法）；创新段在范文骨架上受控替换（换人物、场景、视角）；发明段独立写同类型新文本。单元前后各有一次「未教先写」与「学后独立写」作对照。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;发动机&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;故事地图 + 全身动作：把文本变成可以指着演的图（NE-28）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;范文压缩成手绘地图（图标与箭头标出阶段与关键连接词），全班边指边做动作复述——听觉、视觉、动觉三路同时编码。地图必须由孩子参与绘制才有图式价值，老师印好发下去的只剩装饰功能。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;证据等级（如实标注，NE-27）：主流实践框架，无 RCT 级证据。&lt;/b&gt;Talk for Writing 的证据基础主要是实践者网络、个案与视导观察，采用广度本身是其「成熟实践」的证据形态，与 NE-17 那一级的随机对照证据不同级；英国国内亦有批评认为范文模仿偏重、可能挤压自发写作。本页定位为「英国主流课堂实践框架」，&lt;b&gt;不标「经实验证明最有效」&lt;/b&gt;。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-27/NE-28）：&lt;/b&gt;这是与中国小学英语适配度最高、也最容易被误用的一条。风险：模仿段极易滑成机械背诵课文——Corbett 的模仿从来是带动作、带地图、带理解讨论的「内化」，不是默写。课时差异：英国单元有三周每日语文课支撑，中国课时下三段要压缩、范文大幅缩短（低年级可至百词内）；1–2 年级停留在口头三段（说熟 → 换说 → 编说），不必落到书面发明。教师要自己先会「演」范文——示范意愿与口头流利度是前置条件；班额大时用同桌互演 + 抽查替代全班齐演。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 支架设计 NE-29 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-scaf&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;path d=&quot;M20 92 h210 M20 92 l24 -56 M230 92 l-24 -56 M44 36 h162&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#0b5f57&quot;&gt;够不着的地方&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;78&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;台阶① 先一起说&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;60&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;台阶② 看例子&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;支架的检验标准：最后能撤掉&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;好老师不喂答案，是提前把台阶修好（NE-29）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Gibbons）：对在主流课堂里用第二语言学内容的孩子，帮助不能靠临场善意，必须预先设计——分课前设计的支架（选文本、预教语言、切分任务、给句框与示范）与课中互动的支架（即时放大、重铸、追问）。语言不单独补习，而是在内容学习中同步教；学习活动沿「从口头到书面」的连续体进阶。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;设计支架&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;选什么文本、预教哪些词、任务切几步、给什么句框——课前定好&lt;br&gt;&lt;span class=&quot;why&quot;&gt;支架不是「任何帮助」：检验标准是最终能撤掉、指向独立。给句框不自动等于支架。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 互动支架&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;课中搭手&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;在对话中即时把学生的半句话放大、重铸、追问下去&lt;br&gt;&lt;span class=&quot;why&quot;&gt;教学循环（NE-19）解决「单元怎么排」，Gibbons 解决「每一步里老师具体怎么搭手」，两者同源互补。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;搬到中国小学（家长小字，NE-29）：&lt;/b&gt;原书的二语孩子身处英语沉浸环境（全天各科用英语），支架撤除后仍有海量输入托底；中国孩子一周只有几节英语课——支架必须更珍惜：同一句框要在多课复现。「从口头到书面」的连续体在小学多数只能走到前半段（口头报告、短句写作），不宜按原书的学科写作终点要求低年级。另一差异：原书假设教师是母语者，中国教师自身也是英语学习者，教师示范文本的质量控制（录音、范文来源）要额外设计。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本区的亲戚关系：&lt;span class=&quot;chip&quot;&gt;NE-19 循环排单元&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;NE-29 每步怎么搭手&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;NE-20 精细阅读是支架加厚&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;NE-25 规则也是支架&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：发明出来的规则考古&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;把两条最著名的「假规则」摆上时间线——它们有出生年月、有发明人，就是没有英语本身的依据（NE-05）。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1762 · Lowth《英语语法简论》&lt;/h4&gt;
&lt;p&gt;以拉丁语为模型贬斥句末介词。但英语是日耳曼语，句末介词自古英语以来即为常态——规则在「发明」之前，英语已经这样说了上千年。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;1864 · Alford《为女王的英语辩》&lt;/h4&gt;
&lt;p&gt;推广分裂不定式禁忌：理由是拉丁语的不定式是一个不可分的词。可英语不定式本来就是 to + 动词两截，自 13 世纪起 Chaucer、Shakespeare 一直在分裂着用。Fowler 兄弟 1907 年即警告：这种「迷信」本身才是要纠正的毛病。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;验真测试（随身版）&lt;/h4&gt;
&lt;p&gt;一条「规则」若逼得你把话说得别扭不自然，它多半就是假的（NE-05）；再加 Pullum 的一关：去查大作家们的原文，他们真的都守吗（NE-15）？&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;辟谣位：这些「铁律」是被发明出来的&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;p&gt;&lt;b style=&quot;color:#b33636&quot;&gt;错误说法一：&lt;/b&gt;「句子最后绝不能放介词。」——发明于 18 世纪的规定主义（NE-05）。正式作文可以绕开，那是文体策略；判它为「错」，没有依据。&lt;/p&gt;
&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b style=&quot;color:#b33636&quot;&gt;错误说法二：&lt;/b&gt;「to 和动词之间绝不能插词（不能分裂不定式）。」——拉丁语的规矩搬错了地方（NE-05）。&lt;/p&gt;
&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b style=&quot;color:#b33636&quot;&gt;错误说法三：&lt;/b&gt;「none 必须配单数动词。」——Strunk &amp;amp; White 的论断经 Pullum 查证：Wilde、Stoker 等名家原文中复数搭配比比皆是，手册作者从未查过任何一本书（NE-15）。&lt;/p&gt;
&lt;p style=&quot;margin-top:8px&quot;&gt;&lt;b style=&quot;color:#b33636&quot;&gt;错误说法四：&lt;/b&gt;「有口音 = 发音错。」——口音是成系统的变异与身份标记（NE-11）；发音评判只问一件事：听者懂不懂（NE-14）。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 先诊断，再迁移&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.哪句是英国人美国人真的会说的？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;I want to marry you.&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;It is my wish to become married to you.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.「句末不能放介词」这条规矩是哪来的？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;英语自古如此&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;18 世纪照着拉丁语发明的&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.把 gate 说得和 get 的元音一样了，问题出在哪？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;区别丢了，听者会懂成另一个词&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;口音不像英国人&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.关于 Reading Recovery，哪种说法符合证据全貌？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;短期长期都被证明有效&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;一年级短期效应为正，但追踪到三四年级的新研究发现效应转负，学界未定论&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.学写一种新文体（如写一则通知），按教学循环该先做什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;直接让学生独立写，错了再改&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;先把话题聊透，再全班拆一篇范文、合写一篇，最后才独立写&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6.小组讨论时大家只顾点头附和、没人提理由。按 Mercer 的分型，这是哪一型？该先做什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;附和型；先全班共建谈话规矩（给理由、欢迎质疑），并配好 because… 句框&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;探索型；什么都不用做&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一个核心机制（儿童版标题句 + 示意图 + 案例 + 诚实边界小字）；争议条目成对呈现正反证据（NE-17 的中学 RCT 与小学复制失败、NE-23 的短期正效应与长期反转证据），实践框架的证据等级如实标注（NE-27/NE-28）；各条「搬到中国小学」的条件（班额、课时、输入量、教师元语言知识）均保留在家长小字层。&lt;br&gt;内容来源：catalog_add_native_understanding.md（NE-01 – NE-15，理解侧 15 条）+ catalog_add_native_teaching.md（NE-16 – NE-29，教学侧 14 条），共 29 条。待核项 6 处（均为细节级）：理解侧 2 处（Pawley &amp;amp; Syder 1983 页码经二手来源交叉著录、未亲见原书扫描页；Hancock 教材册次分工未逐册核对）+ 教学侧 4 项（Corbett 原著出版年与版次、Alexander 2020 修订框架构成、R2L 斯德哥尔摩项目量化效应、Derewianka《Exploring How Texts Work》第 2 版出版年）。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 专著深读层（PB-01 – PB-13）&lt;/span&gt;
&lt;h1&gt;介词背后的书房&lt;/h1&gt;
&lt;p&gt;介词花园（学生屏）背后站着四组经典专著。这一页不重复花园的课，它打开书房：每本书怎么切分介词、彼此在哪里吵架，都如实摆出来——吵架不藏，书读到哪一层也如实标。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;本页总纲：&lt;/b&gt;介词的学问有两半：一半在每个词的「图式」里，一半在「怎么偏离图式也算数」的规则里（PB-08 / PB-09）；而图式本身怎么定中心、切几个义，各家专著裁决不同——本页把裁决&lt;b&gt;并存&lt;/b&gt;呈现，不替学界拍板（PB-07）。&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;书架与诚实招牌：我们把每本书读到了哪一层&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;本轮&lt;b&gt;没有任何一本达到通读级&lt;/b&gt;。下表逐本标明实际接触等级：读到目录与书评的，就不冒充读过正文。这是本页的诚实招牌，不许藏。&lt;/p&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th style=&quot;width:44%&quot;&gt;书&lt;/th&gt;&lt;th&gt;接触等级（如实）&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《English Prepositions Explained》&lt;/b&gt;&lt;br&gt;Seth Lindstromberg（初版 1997/1998；修订版 2010）&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;目录+书评级&lt;/span&gt;&lt;br&gt;出版社目录全文 + 两篇学术书评；另读到作者教师专栏原文（2001）。原书正文章节未读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《The Story of Over》&lt;/b&gt;（1981 硕士论文）+ &lt;b&gt;Lakoff (1987)&lt;/b&gt; 的 over 个案&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;二手系统论述级&lt;/span&gt;&lt;br&gt;网络图经 Rice (1993) 复刻件；批评方 Tyler &amp;amp; Evans (2001) 的原文全文已读（一手批评文献）。原论文与原书个案章未直读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《Language and Spatial Cognition》&lt;/b&gt;（1986）&lt;br&gt;Annette Herskovits&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;目录+书评级&lt;/span&gt;&lt;br&gt;全书目录 + 《Computational Linguistics》书评全文 + Tenbrink (2005) 带页码的系统重构。正文未直读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《Shaping meanings for language》&lt;/b&gt;（2001，合著章）&lt;br&gt;Melissa Bowerman &amp;amp; Soonja Choi&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;二手系统论述级（多源互证）&lt;/span&gt;&lt;br&gt;至少三家独立转述结论一致。章节原文未直读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Dirven (1993)&lt;/b&gt; 介词意义链论文&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;二手系统论述级&lt;/span&gt;&lt;br&gt;三家转述互证（含分类表与域名单）。原文未直读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rudzka-Ostyn&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;未收（明说跳过）&lt;/span&gt;&lt;br&gt;她是《Topics in Cognitive Linguistics》(1988) 的编者，未找到她本人独立的介词分析框架，不虚构、不单列条目。&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;覆盖表：&lt;/b&gt;本簇 13 条全部上屏 ✓ —— PB-01 簇编排 · PB-02 可描绘性 · PB-03 on1/on2 · PB-04 against/through · PB-05 over 源头网络 · PB-06 图式变换 · PB-07 中心义之争 · PB-08 理想意义 · PB-09 使用类型与容差 · PB-10 功能知识 · PB-11 英韩切分 · PB-12 刀口错位图（推论条）· PB-13 Dirven 意义链。&lt;/div&gt;
&lt;/div&gt;
