&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 语法组（GR-01 – GR-23）&lt;/span&gt;
&lt;h1&gt;语法工坊&lt;/h1&gt;
&lt;p&gt;语法不是背下来的规矩清单。每个形式变化，都在替听的人传递一条消息。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（GR-01）：&lt;/b&gt;形式跟着功能走——数、人称、时、指称、连接，每一种形式变化都在回答听话人的一个问题：几个？谁做的？何时？指哪一个？学语法，就是学每个形式在「干什么活」。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;form&quot;&gt;形式&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;hat&quot;&gt;帽子&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;twos&quot;&gt;两个 -s&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;family&quot;&gt;过去家族&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;modal&quot;&gt;情态&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;stance&quot;&gt;立场&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;align&quot;&gt;对齐&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;lab&quot;&gt;学法&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 形式 GR-01 GR-15 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-form&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;30&quot; y=&quot;52&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;dog&lt;/text&gt;&lt;text x=&quot;88&quot; y=&quot;52&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;s&lt;/text&gt;&lt;path d=&quot;M96 34 q14 -16 34 -12&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;128&quot; y=&quot;8&quot; width=&quot;104&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;25&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;报告：不止一个！&lt;/text&gt;&lt;text x=&quot;30&quot; y=&quot;102&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;she read&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;102&quot; font-size=&quot;26&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;s&lt;/text&gt;&lt;path d=&quot;M150 84 q12 -12 30 -10&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;176&quot; y=&quot;60&quot; width=&quot;70&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;211&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;报告：是她！&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;每个小尾巴，都在悄悄告诉听的人一件事（GR-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：语法形式本身就是装着意义的符号，不是空壳规矩。不过它管「为什么有这个形式」，管不了个别老词形的历史任意性——那部分靠记（见「过去家族」屏）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;听报告&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two dogs&lt;/span&gt;（-s 报告：好几个）· &lt;span class=&quot;en&quot;&gt;She reads.&lt;/span&gt;（-s 报告：做事的是 she）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个 -s，站在不同的词后面，报告的消息不同——它们的身世在「两个 -s」屏揭晓。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 耳朵也能定形式&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;按声音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;an hour&lt;/span&gt;（h 不出声，开头是元音）· &lt;span class=&quot;en&quot;&gt;a university&lt;/span&gt;（开头是「优」的辅音味儿）（GR-15）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;a 还是 an，不看第一个字母长什么样，看第一个声音。an 的 -n 就是为了不让两个元音撞在一起。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;看字母选冠词是错招——&lt;span class=&quot;en&quot;&gt;a one-way street&lt;/span&gt;（one 开头是 w 的音）也是按声音。耳朵决定，字母只是参考。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;每个形式回答一个问题：&lt;span class=&quot;chip&quot;&gt;几个？→ 数&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;谁做的？→ 人称&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;何时？→ 时&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;指哪一个？→ 指称&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;两句什么关系？→ 连接&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&lt;b&gt;Tom&#x27;s&lt;/b&gt; dog &lt;b&gt;chased&lt;/b&gt; two &lt;b&gt;cats&lt;/b&gt;. —— 一句短话里有三个小报告员：&#x27;s 报告「有关系」，-ed 报告「已经发生」，-s 报告「不止一只」。听懂报告，就听懂了一半语法。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 帽子 GR-02 GR-03 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hat&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;28&quot; y=&quot;38&quot; width=&quot;52&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#5f54b8&quot;/&gt;&lt;text x=&quot;54&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;Did&lt;/text&gt;&lt;path d=&quot;M54 38 l0 -14 M40 24 h28&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;92&quot; y=&quot;59&quot; font-size=&quot;17&quot; fill=&quot;#22303c&quot;&gt;you&lt;/text&gt;&lt;rect x=&quot;138&quot; y=&quot;38&quot; width=&quot;46&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;text x=&quot;161&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;go&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;59&quot; font-size=&quot;17&quot; fill=&quot;#22303c&quot;&gt;home?&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;帽子（时态）戴在 Did 头上，go 就脱帽用原形&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;时态像一顶帽子，一个句子只戴一次（GR-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：时态由动词队伍里排第一的那个扛。为什么要有 do？很久以前实义动词能自己提问，后来不行了，就请 do 来当替补队员，专门举手提问、摇头否定（GR-03）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;提问&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Did you go?&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;Does she like it?&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;did / does 出来站岗扛时态，后面的 go、like 统统脱帽，用原形。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ do 还管否定和强调&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;否定·强调&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I didn&#x27;t go.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;I do like it!&lt;/span&gt;（我真的喜欢！）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;摇头否定、拍胸脯强调，都是这位替补队员的活。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;帽子不能戴两次——&lt;span class=&quot;en&quot;&gt;Does she like…?&lt;/span&gt; 对，&lt;span class=&quot;en&quot;&gt;✗ Does she likes&lt;/span&gt; 是把帽子又给 like 戴了一顶。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;不用请替补的老队员：&lt;span class=&quot;chip&quot;&gt;be（Is she happy?）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;情态动词（Can you swim?）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;它们能自己举手提问、自己否定&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;昨天放学，Mia 问 Tom:「&lt;b&gt;Did&lt;/b&gt; you &lt;b&gt;see&lt;/b&gt; my pen?」Tom 说:「I &lt;b&gt;didn&#x27;t see&lt;/b&gt; it, but I &lt;b&gt;do&lt;/b&gt; want to help!」—— 三个句子里，帽子每次都稳稳戴在 do 一家头上，see 从头到尾都是原形。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 两个-s GR-04 GR-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-twos&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;52&quot; r=&quot;30&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;24&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;-s&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;名词家：管「好几个」&lt;/text&gt;&lt;circle cx=&quot;180&quot; cy=&quot;52&quot; r=&quot;30&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;24&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;-s&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;动词家：管「他/她做」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;两个 -s 只是长得像，来自不同的老祖宗（GR-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：复数 -s 来自古英语名词的老词尾；三单 -s 是北方方言的词尾——以前动词尾巴有很多种，后来越说越简单，只剩它一个还在值班（GR-04）。两条线在路上偶然长成了同一个样子。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;分清两兄弟&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two books&lt;/span&gt; 的 -s 说「好几个」· &lt;span class=&quot;en&quot;&gt;He reads.&lt;/span&gt; 的 -s 说「做事的是他」&lt;br&gt;&lt;span class=&quot;why&quot;&gt;看到 -s 先问一句：它站在名词后面，还是站在 he/she 的动词后面？&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 虽然出身不同，今天发音规则相同&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;同规矩&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;watches&lt;/span&gt;（多加一拍 /ɪz/）· &lt;span class=&quot;en&quot;&gt;plays&lt;/span&gt;（读 /z/）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;两兄弟今天穿同一套发音规则——「源流不同」只用来破除「一个 -s 包打天下」的误会，不影响拼读。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;错误说法辟谣：&lt;/b&gt;「三单 -s 是主语的勋章，是给动词的补偿」——这是编出来的故事，专家已核查为假说法（GR-04）。真相平平无奇：它就是北方方言留下的一个老词尾。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;南方老词尾 -eth（已被 -s 换下）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;古英语名词词尾 -as（复数 -s 的祖先）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;三单 -s 更深的来历，有专家说可能和古诺斯语（维京人的语言）有关，还没有定论——没定论的，咱们就说「一说」，不装作知道（GR-04）。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&lt;b&gt;She reads&lt;/b&gt; two &lt;b&gt;books&lt;/b&gt; every week. —— 前一个 -s 在报告「是她在读」，后一个 -s 在报告「书不止一本」。长得一模一样，干的是两家的活。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 过去家族 GR-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-family&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;68&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;sing → sang&lt;/text&gt;&lt;text x=&quot;68&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;ring → rang&lt;/text&gt;&lt;rect x=&quot;132&quot; y=&quot;30&quot; width=&quot;100&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;drink → drank&lt;/text&gt;&lt;text x=&quot;182&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;swim → swam&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;元音家族：换中间的元音变过去&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;不规则过去式按「家族」住：换元音变过去（GR-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这些老词是古英语强动词的后代，靠元音换声表示过去。用得越多的词，大脑记得越牢，越舍不得改成 -ed——高频，是它们的保命符。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;元音家族&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;sing–sang · ring–rang · drink–drank · swim–swam&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;i 变 a 是一大家子。按家族一串一串记，比一个一个背省力得多。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 也有别的家族和「借来的」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;其他家族&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;bring–brought&lt;/span&gt;（词尾型）· &lt;span class=&quot;en&quot;&gt;go–went&lt;/span&gt;（went 是从别的词借来的）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;不是每个不规则词都换元音——杂项要单记，不能宣称「不规则全是换元音」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;说出 &lt;span class=&quot;en&quot;&gt;✗ goed&lt;/span&gt; 不是粗心——是大脑在试「加 -ed」这条新规则，试错的样子就是在学习（见「学法」屏 GR-16）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;家族名单（部分）：&lt;span class=&quot;chip&quot;&gt;i→a 家：sing / ring / drink / swim / begin&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;词尾家：bring / buy / teach（brought / bought / taught）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;借来家：go–went&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Yesterday, Tom &lt;b&gt;sang&lt;/b&gt; a song, &lt;b&gt;drank&lt;/b&gt; some water and &lt;b&gt;swam&lt;/b&gt; in the river. —— 三个过去式全是 i→a 家族的成员，排队出现，一眼认亲。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 情态 GR-07 GR-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-modal&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;30&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#b33636&quot;&gt;must&lt;/text&gt;&lt;path d=&quot;M30 48 h52&quot; stroke=&quot;#b33636&quot; stroke-width=&quot;4&quot;/&gt;&lt;polygon points=&quot;82,48 70,41 70,55&quot; fill=&quot;#b33636&quot;/&gt;&lt;circle cx=&quot;102&quot; cy=&quot;48&quot; r=&quot;10&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;102&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;被推着走&lt;/text&gt;&lt;text x=&quot;140&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#257a35&quot;&gt;may&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;42&quot; width=&quot;8&quot; height=&quot;26&quot; fill=&quot;#257a35&quot; transform=&quot;rotate(-32 144 55)&quot;/&gt;&lt;text x=&quot;158&quot; y=&quot;76&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;路障搬开了&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;34&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#2f7db0&quot;&gt;can&lt;/text&gt;&lt;path d=&quot;M196 62 q10 -18 22 -4 q10 -14 16 2&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;text x=&quot;212&quot; y=&quot;76&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;自己有劲儿&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;三种「力」：外力推 / 障碍让开 / 自己有力气&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;情态动词说的是「力」：推力、让路和自己的劲儿（GR-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：must 像有人在后面推你「必须去」，may 像门卫把路障搬开「可以啦」，can 是你自己有力气「我能行」。猜事情的时候，也是这股力在脑子里推着你下结论。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;做事的力&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;You must go now.&lt;/span&gt;（必须）· &lt;span class=&quot;en&quot;&gt;You may go now.&lt;/span&gt;（可以）· &lt;span class=&quot;en&quot;&gt;I can swim.&lt;/span&gt;（我能）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一件事换一股力，意思就全变了。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一股力，搬进脑子里猜事情&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;猜事的力&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He must be tired.&lt;/span&gt;（准是累了——证据在推我）· &lt;span class=&quot;en&quot;&gt;It can&#x27;t be true.&lt;/span&gt;（不可能是真的——力把结论推开）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;义务的「力」和推断的「力」是同一套图：前提「迫使」人得出结论。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;化石规矩（GR-08）：&lt;/b&gt;情态动词是从普通动词变来的「化石」，老习惯都在：不加三单 -s（✗ She cans）、不能两个连排（✗ will can）、后面跟原形。will 以前就是「想要」这个动词，走着走着变成了小帮手。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;must / have to 推力家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;may / might 让路家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;can / could 有劲家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;will 意愿家（想要→将来）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mech&quot; style=&quot;margin-top:6px&quot;&gt;边界：Could you…? 这种客气话不是「能力」在直译——力图式是语义骨架，礼貌用法另有说法，不硬套。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;「&lt;b&gt;Can&lt;/b&gt; you swim?」教练问（看你有没有劲儿）。「You &lt;b&gt;must&lt;/b&gt; wear a cap.」（泳池的规矩在推你）「You &lt;b&gt;may&lt;/b&gt; come in now.」（门卫把路让开了）—— 一个泳池门口，三种力全齐了。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 立场 GR-10 GR-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-stance&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;60&quot; y1=&quot;96&quot; x2=&quot;60&quot; y2=&quot;26&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M60 28 h52 l-12 10 12 10 h-52 z&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;86&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#5c4300&quot;&gt;some&lt;/text&gt;&lt;text x=&quot;60&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;我心里有数&lt;/text&gt;&lt;line x1=&quot;180&quot; y1=&quot;96&quot; x2=&quot;180&quot; y2=&quot;26&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M180 28 h52 l-12 10 12 10 h-52 z&quot; fill=&quot;#bcd6f5&quot;/&gt;&lt;text x=&quot;206&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#2f5f8f&quot;&gt;any&lt;/text&gt;&lt;text x=&quot;180&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;随便哪个都行&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;some / any 是说话人的立场：举哪面旗，看心思（GR-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：some 是「我心里有数、我乐意」的小旗，any 是「随便哪个都行、我没预设」的小旗。选哪个，看说话人的心思，不只看句子是肯定还是否定。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;常态&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have some friends.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;I don&#x27;t have any money.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;平常陈述多举 some，否定和一般疑问多举 any——记住，这是「倾向」，不是铁律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 心思变了，旗就变&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;看心思&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Would you like some tea?&lt;/span&gt;（请人喝茶：我猜你会答应，所以用 some）· &lt;span class=&quot;en&quot;&gt;Any doctor will tell you.&lt;/span&gt;（肯定句里 any = 任何一位医生都行）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;邀请时预期对方答应 → some；「哪个都行」→ any。句子形式没变，心思决定选词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;错误说法辟谣：&lt;/b&gt;「肯定句只能用 some，疑问否定只能用 any」——这是把倾向说成了铁律。铁律解释不了请人喝茶时的 some 和肯定句里的 any，立场说可以。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;somebody / something 我心里有数版&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;anybody / anything 随便哪个版&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;somewhere 心里有谱的地方&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;奶奶端来茶:「&lt;b&gt;Would&lt;/b&gt; you &lt;b&gt;like some&lt;/b&gt; tea?」—— 她猜你会点头，所以举 some 的旗。你要是问「&lt;b&gt;Any&lt;/b&gt; tea is OK?」意思就成了「随便什么茶都行吗」——旗换了，心思就换了。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 对齐 GR-12 GR-13 GR-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-align&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;125&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;There is a pen and two books.&lt;/text&gt;&lt;path d=&quot;M60 44 q30 22 62 8&quot; fill=&quot;none&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;52&quot; y=&quot;62&quot; width=&quot;150&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;127&quot; y=&quot;79&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#96690a&quot;&gt;is 听离它最近的 a pen 的话&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;就近原则：先跟最近的名词对齐&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;动词对齐有三股力：形式、意义、就近（GR-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：动词选单数还是复数，有时看长相（形式），有时看意思（意义），有时看谁站得近（就近）。there be 句里，动词先听紧挨着的第一个名词的。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;就近&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;There is a pen and two books.&lt;/span&gt; · &lt;span class=&quot;en&quot;&gt;There are two books and a pen.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;挨着谁，就先跟谁对齐——顺序一换，is/are 就换。正式作文里则要多照顾整个主语，小学先学就近口径。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ &#x27;s 是小绳子，不是证书&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;关联&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;yesterday&#x27;s news&lt;/span&gt;（昨天的新闻）· &lt;span class=&quot;en&quot;&gt;a day&#x27;s journey&lt;/span&gt;（一天的路程）（GR-13）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;&#x27;s 把两样东西拴在一起说「有关系」：时间、路程、来源都行，不只是「谁的东西」。它还拴在整串词的末尾：the King of England&#x27;s crown（英格兰国王的王冠）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 格跟着位置走&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;位置&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Tom and I are friends.&lt;/span&gt;（站句首当主角，穿 I）· &lt;span class=&quot;en&quot;&gt;Come with Tom and me.&lt;/span&gt;（跟在介词后面，穿 me）（GR-14）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;I 和 me 是同一个人穿的两件衣裳，穿哪件看位置。&lt;span class=&quot;en&quot;&gt;between you and I&lt;/span&gt; 是「讲究过头」穿错了——宾语位上该穿 me。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;&lt;span class=&quot;en&quot;&gt;the leg of the table&lt;/span&gt;（桌子腿）在正式说法里更稳妥——没生命的东西，&#x27;s 用不用是渐变地带，不是一刀切。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;The family are…（英式：按「几口人」的意思用复数）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;It&#x27;s me.（口语里的真实说法，不算错）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;介绍全家福时 Lily 说:「This is &lt;b&gt;my family&#x27;s&lt;/b&gt; photo. &lt;b&gt;Tom and I&lt;/b&gt; are in it. Look, there &lt;b&gt;is&lt;/b&gt; a cake and two cups on the table!」—— &#x27;s 拴关系、I 站主角位、is 听最近的 cake，三股力同框。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 学法 GR-16..23 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-lab&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;26&quot; width=&quot;140&quot; height=&quot;66&quot; rx=&quot;12&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#5f54b8&quot;&gt;咦，这里有个 -s！&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;被「看见」的那一刻，开始变成自己的&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;学法实验室：专家们量出来的学习规律&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;语法是这样学会的：试单、注意、开口（GR-16）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：说错话常常说明大脑正在自己试一条新规则——你心里有一套不断重组的「临时系统」，错误是它试单留下的痕迹，不是粗心，也不是坏习惯。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;注意到&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;光听很多还不够；哪天你突然「咦，这里有个 -s！」——这个形式才开始进脑子（GR-17）。老师把对比、高亮、复现摆好，就是在帮你「看见」。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;顺手学&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;最好的学语法时间，是你正想说清楚一件事、刚好被一个小形式卡住的那几秒——老师在这时递上形式，记得最牢（GR-18）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;见得多&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一个说法遇见一百次，它就自己住进脑子；连 went 这种「不讲理」的词，也是天天见才没被改掉（GR-19）。所以先学最常用的，不常用的慢慢来。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;整句住进来&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;先整句整句地学 &lt;span class=&quot;en&quot;&gt;Can I have…? What&#x27;s this?&lt;/span&gt;，说熟了再拆开换零件——语法是从整句里拆出来的（GR-20）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;开口检查&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;光听懂像看别人游泳；自己开口说，才发现哪个动作还不会——说，就是检查自己最好的办法（GR-23）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;老师们也有两种看法：&lt;/b&gt;有的专家（如 Krashen）说，光是多听多读、听懂了就会了，开口不重要；有的专家（Schmidt、Swain）说，必须注意到形式、必须开口试。我们的取舍：两样都要——多听多读打底，再加「注意到」和「开口说」两道工序（GR-17 / GR-23）。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;给老师的检查表（GR-21）：&lt;/b&gt;讲规则像递工具——挑最顺手的、只讲用得上的（短、准、够用），讲完马上拿去干活；适不适合这个年龄和班级，也要过一遍。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Ben 以前总说 &lt;b&gt;goed&lt;/b&gt;（试单中）。有一天读故事时他突然指着书说:「咦，是 &lt;b&gt;went&lt;/b&gt;！」——被他自己「看见」的那一刻，went 才真正开始变成他的。从那以后，他越说越顺。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：把容易混的摆在一起&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病句多半不是形式没记住，是机制拿错了。先分清机制，再选形式。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：一座桥就够了（GR-11）&lt;/h4&gt;
&lt;p&gt;英语说因果像只搭一座桥：站在 &lt;span class=&quot;en&quot;&gt;because&lt;/span&gt; 这头说原因，或者站在 &lt;span class=&quot;en&quot;&gt;so&lt;/span&gt; 那头说结果——&lt;span class=&quot;en&quot;&gt;Because it rained, we stayed home.&lt;/span&gt; / &lt;span class=&quot;en&quot;&gt;It rained, so we stayed home.&lt;/span&gt;「因为…所以…」两座桥一起搭，是把汉语成对关联词的习惯带进了英语，是中国学生语料里稳定的高频错误。（旧说法「两个一起用语法树会断」是编出来的伪机制，已删除。）&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：否定词的三次搬家（GR-09）&lt;/h4&gt;
&lt;p&gt;否定词说多了会「变弱」，人们就喊一个更重的词来帮忙；新词抢了班，老词慢慢退场，隔几百年再来一轮：英语 &lt;span class=&quot;en&quot;&gt;ne → ne…not → not&lt;/span&gt;，法语 &lt;span class=&quot;en&quot;&gt;ne → ne…pas → pas&lt;/span&gt; 是同款故事。这叫耶斯佩森循环——它是语言自己变的历史，不是你今天说错否定句的原因。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：全家是一个还是几个？（GR-12）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;The family is big.&lt;/span&gt; 把全家看成一个整体，用单数；英式英语常说 &lt;span class=&quot;en&quot;&gt;The family are watching TV.&lt;/span&gt;，心里想的是「几口人」，按意义用复数。两边都有道理——动词在跟「你心里把它看成几个」对齐。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频语法病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因先分两类：一类是汉语里根本没有这些标记（冠词、时态、复数、三单 -s 是错误集中区，GR-22）；一类是大脑的临时系统在试单（GR-16）。对症下药，别都当成粗心。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Does she likes music?&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Does she like music?&lt;/span&gt; —— 帽子已经戴在 does 头上了，like 不能再戴一顶 -s。时态一个句子只标记一次（GR-02）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Because the rain was heavy, so we stayed at home.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Because the rain was heavy, we stayed at home.&lt;/span&gt; —— 因果只搭一座桥。because 和 so 各管一段路，同一条因果链里留一个就够（GR-11）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ There are a pen and two books on the desk.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ There is a pen and two books on the desk.&lt;/span&gt; —— there be 先听离它最近的名词：a pen 是单数，就用 is（GR-12）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I waited for a hour.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I waited for an hour.&lt;/span&gt; —— hour 的 h 不出声，开头是元音的声音，所以用 an。冠词看声音，不看字母（GR-15）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ She cans draw very well.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ She can draw very well.&lt;/span&gt; —— can 是从动词变来的化石小帮手，老习惯是「不加 -s」。情态动词永远不戴三单帽子（GR-08）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I don&#x27;t have some money.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I don&#x27;t have any money.&lt;/span&gt; —— 否定句里「我没预设」的心思占上风，常态用 any。记住这是倾向不是铁律：请人喝茶时 Would you like some tea? 照样用 some（GR-10）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 机制想通了再选&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. Did you ___ to the park yesterday?（did 已经戴上时态帽子）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;go&quot;&gt;&lt;div class=&quot;opt&quot;&gt;go&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;went&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;goes&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. She ___ sing very well.（情态小帮手从不加 -s）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;can&quot;&gt;&lt;div class=&quot;opt&quot;&gt;cans&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;can&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;canning&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. —Would you like ___ tea?（奶奶请你喝茶，她猜你会答应）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;some&quot;&gt;&lt;div class=&quot;opt&quot;&gt;any&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;some&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. There ___ a book and two pens on the desk.（先听最近的名词）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;is&quot;&gt;&lt;div class=&quot;opt&quot;&gt;are&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;be&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. I need ___ umbrella.（听第一个声音）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;an&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. 哪句是对的？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;Because he was ill, so he stayed home.&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;Because he was ill, he stayed home.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. yesterday&#x27;s news 里的 &#x27;s 说的是什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;rel&quot;&gt;&lt;div class=&quot;opt&quot;&gt;新闻是昨天的「财产」&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;rel&quot;&gt;两样东西「有关系」&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一个核心机制（儿童版标题句 + 示意图 + 分级案例 + 易混对比 + 亲戚网 + 案例小故事），每屏标注来源条目编号；已被证伪的说法（勋章说、语法树说、铁律说）只在辟谣位以「错误说法」身份出现。&lt;br&gt;知识来源：《专家规律总结清单 v1》语法组 GR-01 – GR-23（Langacker 1987/1991；Huddleston &amp;amp; Pullum《CGEL》2002；Ellegård 1953；Sweetser 1990；Swan《Practical English Usage》；连淑能 1993；Corder 1967 / Selinker 1972；Schmidt 1990；Long 1991；Swain 1985 / 文秋芳 2015；N. C. Ellis 2002；Lewis 1993 / Wray 2002；Thornbury 1999）。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
 document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
 const f=document.getElementById(b.dataset.f);
 f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
 b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));
const WHY={go:&#x27;对了：帽子在 did 头上，后面的动词脱帽用原形。&#x27;,can:&#x27;对了：情态动词是化石小帮手，从不加 -s。&#x27;,some:&#x27;对了：请人时预期对方答应，举 some 的旗。&#x27;,is:&#x27;对了：there be 先听最近的名词 a book。&#x27;,an:&#x27;对了：umbrella 开头是元音的声音，用 an。&#x27;,b:&#x27;对了：因果只搭一座桥，because 那头站稳了，就不用 so。&#x27;,rel:&quot;对了：&#x27;s 是小绳子，说的是「有关系」，不是所有权证书。&quot;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{
 const fb=g.nextElementSibling;
 g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
  const v=o.dataset.v||o.textContent.trim();
  const right=v===g.dataset.a;
  g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
  o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
  fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：回到这一屏的机制——帽子戴在谁头上？举的是哪面旗？动词在听谁的话？&#x27;;
 }));
});
&lt;/script&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 时态与体（TA-01 – TA-18）&lt;/span&gt;
&lt;h1&gt;时间镜头房&lt;/h1&gt;
&lt;p&gt;时态不是十二个要背的格子，是两个开关：一个管「什么时候」，一个管「怎么看」。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（TA-01）：&lt;/b&gt;时态 = 时间 × 看法。时间开关只有两档（过去 / 非过去）；看法开关决定镜头放在哪——看全景、钻进中间、还是看事情留给现在的痕迹。两个开关一组合，时态就出来了。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;switch&quot;&gt;两个开关&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;lens&quot;&gt;镜头看事&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;trace&quot;&gt;完成体·看痕迹&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;anchor&quot;&gt;锚点与距离&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;future&quot;&gt;将来是借的&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;story&quot;&gt;故事与对照&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;order&quot;&gt;学习顺序&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 两个开关 TA-01 TA-02 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-switch&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;56&quot; r=&quot;16&quot; fill=&quot;#5b54b8&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;开关一：时间&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;过去 / 非过去&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;62&quot; font-size=&quot;16&quot; fill=&quot;#b7c3ca&quot;&gt;×&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;circle cx=&quot;214&quot; cy=&quot;56&quot; r=&quot;16&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;188&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;开关二：看法&lt;/text&gt;&lt;text x=&quot;188&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;全景 / 内部 / 痕迹&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;时态像两个开关，一拨就组合出样子（TA-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：英语动词的形态对立其实只有「现在 / 过去」两项（TA-02）——动词只有两件衣裳。说将来的事，要借 will、going to 这些小帮手的力气，它们不是第三件衣裳。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;时间档&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I walk to school. / I walked to school.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个动词，两件衣裳：原形是「非过去」，-ed 是「过去」。衣裳就这两件，再无第三件。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 换看法开关，时间不动&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;看法档&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I walked. / I was walking. / I had walked.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;都在过去：第一句看全景，第二句钻进中间，第三句站在更晚的过去点回头看——变的只是看法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两个开关一起拨&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;组合&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She has finished. = 非过去 × 看痕迹&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;所谓「现在完成时」不是第三个时间，是「时间在现在、看法盯痕迹」的组合名。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 专家有分歧（TA-02）：&lt;/b&gt;主流语法书（《剑桥英语语法》）判定 will 是情态词、英语没有将来时；但 Declerck 等学者主张 will 的一部分用法应算将来时。本 app 采用主流口径 teaching，但不装作学界已一致——这条分歧如实记着。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;章振邦「两时两体」&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Comrie 时/体两分&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;将来靠借工具（第 5 屏）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Yesterday, Mia &lt;b&gt;walked&lt;/b&gt; home（过去×全景）, it &lt;b&gt;was raining&lt;/b&gt;（过去×钻进中间）, and she &lt;b&gt;had lost&lt;/b&gt; her umbrella the day before（站在昨天回头看更早）. —— 一段话拨了三次开关，全是两个开关的组合。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 镜头看事 TA-03 TA-04 TA-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-lens&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;86&quot; x2=&quot;235&quot; y2=&quot;86&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;rect x=&quot;28&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;42&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f7db0&quot;&gt;全景：整件事&lt;/text&gt;&lt;rect x=&quot;150&quot; y=&quot;44&quot; width=&quot;30&quot; height=&quot;20&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;138&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;42&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;181&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;推进：只看中间&lt;/text&gt;&lt;rect x=&quot;52&quot; y=&quot;48&quot; width=&quot;38&quot; height=&quot;10&quot; rx=&quot;5&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;156&quot; y=&quot;50&quot; width=&quot;18&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一件事，镜头远近不同&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;「体」就是看事情的方式：看全景，还是钻进去看中间（TA-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Comrie 的经典定义）：体不是时间，是「观看一件事内部的样子」。看全景用一般体，钻进中间用进行体——先想清楚要给人看哪一段，再选形式。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;全景&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He built a house. / She read the book.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;站在远处，把整件事从头到尾看成一整块——有头有尾。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 镜头推进，只看中间&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;内部&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He was building a house. / She was reading.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;钻进事件中间：只看见正在进行的那一段，头尾先不管。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 为什么「正在发生」必须推进镜头&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;关键&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Look! The baby is crying.（不是 *The baby cries 表此刻）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「现在」只有一眨眼那么短，装不下一件完整的事（TA-04）——所以正在发生的事只能钻进镜头说；一般现在时平时管习惯和道理：The baby cries a lot. / The sun rises in the east.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：动词自带「时间形状」（TA-07）&lt;/b&gt; —— run 是能一直转的轮子（活动，无终点），build a house 是有头有尾的一段路（有终点），know 是静止的牌子（状态，没有过程）。牌子没法「正在进行」，所以 *I am knowing the answer 不成立，要说 I know the answer。形状不对，镜头套不上。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;活动 run / swim&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;完结 build / paint a picture&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;瞬间 find / recognize&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;状态 know / love&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;At 7 last night, Mum &lt;b&gt;was cooking&lt;/b&gt;（钻进厨房看中间）, Dad &lt;b&gt;read&lt;/b&gt; the paper from start to finish（全景看完）, and I &lt;b&gt;knew&lt;/b&gt; dinner was coming（状态牌子，不用进行时）. —— 三种形状，三个镜头。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 完成体 TA-05 TA-06 TA-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-trace&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;84&quot; x2=&quot;235&quot; y2=&quot;84&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;84&quot; r=&quot;6&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f7db0&quot;&gt;过去：钥匙丢了&lt;/text&gt;&lt;path d=&quot;M58 78 Q125 30 190 74&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;polygon points=&quot;190,74 178,72 184,62&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;84&quot; r=&quot;6&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;现在：进不了门&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;痕迹从过去连到现在&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;完成时看的不是「做完」，是「过去的事和现在还有牵连」（TA-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Comrie 定版口径）：完成体的眼睛盯着现在——过去那件事留下的痕迹、结果、经验，到现在还算数。旧讲法「过去做完」已被本项目全量更换：做完做完不是关键，和现在相不相连才是。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;结果&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have lost my key. / She has broken her leg.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;钥匙丢没丢不重要，重要的是「现在进不了门」；腿断没断是过去，「现在打着石膏」才是重点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 痕迹也可以是「经验本身」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;经历&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have been to Beijing. / Have you ever read this book?&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;去过北京这件事，痕迹就是「我现在是个去过的人」——这一层如实讲，不硬编具体结果。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 近况与持续，也是同一家人&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;近况·持续&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;It has rained a lot lately. / We have lived here for years.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;最近的雨影响着现在的地；住了几年并且还住着——四种用法共享同一条线：锚点在现在。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;铁律对比：完成时不能点名过去时间（TA-06）&lt;/b&gt; —— *I have seen him yesterday 不成立：yesterday 把事件钉回过去，完成时的眼睛却盯着现在，两套定位打架。要点名时间讲过去，就换一般过去时：I saw him yesterday。这条能批量预测：since / for 可用，yesterday / in 2019 不可用。&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:10px&quot;&gt;&lt;h4&gt;来历故事（TA-12）——只是故事，不是定义&lt;/h4&gt;&lt;p&gt;很久以前，&lt;span class=&quot;en&quot;&gt;I have the letter written&lt;/span&gt; 是说「写好的信在我手里」；说着说着，重心从「信」滑到「我写过」，完成时就这样长出来的。讲给孩子听可以，但必须说清：这是祖先的故事，今天完成时的意思以「现时相关」为准，不许拿「手里攥着结果」当定义。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;结果 have lost&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;经历 have been to&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;近况 have rained lately&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;持续 have lived for years&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Ben can&#x27;t open the door — he &lt;b&gt;has lost&lt;/b&gt; his key（痕迹：现在进不去）. He &lt;b&gt;has tried&lt;/b&gt; every pocket（经历：都摸过了）. Poor Ben &lt;b&gt;has waited&lt;/b&gt; for ten minutes（持续到现在）. —— 三句完成时，句句都连着「现在」。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 锚点与距离 TA-09 TA-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-anchor&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;84&quot; x2=&quot;235&quot; y2=&quot;84&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;45&quot; cy=&quot;84&quot; r=&quot;5&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#2f7db0&quot;&gt;更早&lt;/text&gt;&lt;path d=&quot;M45 84 L118 84&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;polygon points=&quot;118,40 118,84 142,84 118,62&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;锚点：站在过去回头看&lt;/text&gt;&lt;circle cx=&quot;205&quot; cy=&quot;84&quot; r=&quot;5&quot; fill=&quot;#7c8a94&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;现在&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;过去完成时是「锚点搬家」：旗子插在过去某天，再往前看（TA-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：完成体只要求「事件早于参照点」。参照点在现在 = 现在完成时；把参照点搬到过去 = 过去完成时。维度没变多，只是旗子挪了位置（Comrie 相对时态）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;锚点在过去&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;When I got home, Mum had cooked dinner.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「我到家」是旗子；做饭比旗子还早，所以站在旗子上回头看，用 had cooked。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一机制，锚点回到现在&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;对照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Now Mum has cooked dinner.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;旗子插回现在，同一件事就变回 has cooked——完成体四种用法，两顶帽子通用。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 过去形式还有第二份工作：管距离&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;推远&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I wondered if you could help me. / If I were you…&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;过去形还管「认识距离」（TA-08）：把话从眼前推远——时间上是过去，心理上是假设，社交上是客气，是同一次「推远」的三种用法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：过去完成时不是「更过去的过去」&lt;/b&gt; —— 它单独出现会显得突兀，因为旗子没插下：先给一个过去点（When I arrived…)，再说更早的事（…the film had started)。若 before / after 已把顺序说清，had 常可省略，那是省冗余，不是规则坏了。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;礼貌 I wondered…&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;假设 If I were you&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;转述时态后退&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;小学阶段：距离只埋种子&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;The film &lt;b&gt;had started&lt;/b&gt; when we arrived（旗子：我们到的时候；电影开场更早）. And Tom whispered, &quot;I &lt;b&gt;wondered&lt;/b&gt; if we could sit here&quot;（把请求推远一点，客气）. —— 一个 had 管回头，一个 -ed 管推远。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 将来是借的 TA-10 TA-11 TA-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-future&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;path d=&quot;M20 96 Q90 60 150 62 T232 40&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;82&quot; r=&quot;7&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96690a&quot;&gt;已经在路上&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;16&quot; width=&quot;64&quot; height=&quot;24&quot; rx=&quot;6&quot; fill=&quot;#5b54b8&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;将来 →&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;将来没有自己的衣裳，全是借来的工具&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;将来是借工具谈的：will 是「我保证」，going to 是「已经在路上」（TA-10 / TA-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：will 的祖先是「想要」——所以它说将来总带着拍胸脯的口气（预言 / 当场答应）；be going to 的祖先是「走过去做某事」——人已上路，所以它说的将来带着「已有苗头、已有打算」的底色（语法化路径，Bybee 等）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;will&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;&quot;I&#x27;ll get the door!&quot; / I think it will rain tomorrow.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;当场决定、开口答应、开口预言——都是「我愿意 / 我预言」的残影在说话。残影不是全部：天气预报里的 will 已很中性，只说「带着预言的味道」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 换一个借来的工具：已经在路上&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;going to&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Look at the clouds! It&#x27;s going to rain. / We&#x27;re going to visit Grandma this weekend.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;黑云压顶是「预兆」，周末计划是「打算」——两件事都已经有点影子了，才用 going to。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 还有第三种借法：把未来写成事实&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;时刻表&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The train leaves at six. / School starts on Monday.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;时刻表、日历把未来事件钉成了「已定的事实」，所以借一般现在时来说（TA-13）。只限时刻表语境——*It rains tomorrow 不成立，临时计划不用这一式。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：will 与 going to 是倾向，不是铁律&lt;/b&gt; —— 大量语境两者可互换。原型对比只帮入门：有预兆 / 有打算 → going to 更贴；临场决定 / 承诺 / 纯预测 → will 更贴。不许讲成「一个管计划、一个管临时」的死分工。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;will 意愿→意图→预测&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;going to 移动→打算→预兆&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;时刻表现在时 futurate&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&quot;The train &lt;b&gt;leaves&lt;/b&gt; at six tomorrow（时刻表，铁板钉钉）. Look at those clouds — it&#x27;s &lt;b&gt;going to&lt;/b&gt; rain on our trip（预兆）. Don&#x27;t worry, I&#x27;&lt;b&gt;ll&lt;/b&gt; take an umbrella（当场答应）.&quot; —— 三种将来，三个借来的工具，各说各的口气。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 故事与对照 TA-14 TA-15 TA-16 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-story&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;26&quot; width=&quot;84&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;汉语&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;时间藏在词里&lt;/text&gt;&lt;path d=&quot;M120 54 L150 54&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;150,54 140,49 140,59&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;156&quot; y=&quot;26&quot; width=&quot;84&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#f1f0fa&quot; stroke=&quot;#5b54b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;198&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#5b54b8&quot;&gt;英语&lt;/text&gt;&lt;text x=&quot;198&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;时间藏在动词形状里&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;编码位置不同，是中国孩子时态错误的源头&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;汉语靠词说时间，英语靠动词变形：每说一句，都被迫选一次时态（TA-15）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（连淑能《英汉对比研究》）：汉语是「词汇型」——昨天、明天、了、过把时间说清，动词不用变；英语是「形态型」——每个句子必须在动词上做时态选择。所以中国孩子漏 -ed，是系统差异造成的结构性难点，不是粗心、不是态度问题。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;对照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;他昨天去北京。→ He went to Beijing yesterday.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;汉语只加了「昨天」一个词；英语除了 yesterday，还必须把 go 换成 went——时间被迫标两次，孩子常只记得词、忘了动词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 「了 / 过」和完成时，只对得上一部分&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;错位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;「我去过北京」≈ I have been to Beijing.（经历，对得上）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;但「了」是「做成了」，「过」是「经历过」，完成时管的是「和现在有牵连」（TA-16）——三个人长得有点像，不是同一个人。把「了」直接翻译成 have done，是病句医院的常客。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 讲故事时，还有一种合法的「演法」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;故事&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;So he opens the door… and there&#x27;s a cat!&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;历史现在时（TA-14）：讲到紧张处，把过去的事当作正在发生来「演」，听的人像站在现场。它不是说错——但小学阶段只要求认得出、不误判，正式写作仍以过去时为默认。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 出处已核（TA-14）：&lt;/b&gt;历史现在时的语篇语言学出处已补核——Wolfson (1979)，《Language》55(1): 168–182：历史现在时本身没有意义，和过去时来回切换，才是讲故事分段的标记。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;了 = 做成了（实现）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;过 = 经历过（经验体）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;着 = 持续（另一维）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;完成时 = 和现在有牵连&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt; retelling a trip: &quot;Last summer we &lt;b&gt;went&lt;/b&gt; to the zoo（过去时讲事实）. I &lt;b&gt;have been&lt;/b&gt; there three times（经历连到现在）. Then the tiger &lt;b&gt;comes&lt;/b&gt; out — wow!（高潮处切换成『演』的现在时）&quot; —— 三段各有各的道理。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 学习顺序 TA-17 TA-18 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-order&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;66&quot; width=&quot;60&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;went&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;52&quot; width=&quot;60&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;71&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;saw · had&lt;/text&gt;&lt;rect x=&quot;162&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;197&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;系统大表&lt;/text&gt;&lt;path d=&quot;M78 74 L90 68 M150 60 L162 48&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;先用熟高频词，系统自己浮出来&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学时态的顺序：先把 went、saw、had 用熟，再回头看系统表（TA-17）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Tomasello 用法基础习得观）：孩子的大脑是从一个个具体词例里长出系统的——高频动词的过去式先被整存，成为锚点；讲故事讲顺了，时态大表自己会慢慢浮出来。先灌系统表，顺序反了。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;第一步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;went / saw / had / ate / took&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;天天用的高频不规则过去式，先在故事里用熟、整存——它们是全系统的锚点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 用顺了，再连点成面&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;第二步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;walked / played / watched（-ed 家族）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;规则过去式成组跟上：形状统一，靠量取胜，和第一步的「钉子户」并存。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最后才摊开系统&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;第三步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;两个开关总表（回到第 1 屏）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这时再看「时间 × 看法」大表，表里每个格子都有孩子自己的例句垫底。高年级补系统表有显性学习的效率优势——是先后，不是取舍。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 证据强度（TA-18）：&lt;/b&gt;「镜头讲法」（把时态讲成看法）有实验支持：Drożdż（2011）及 2024 年准实验显示认知解释组占优；但 Bielak &amp;amp; Pawlak（2011）只测出与传统教法相当。而且现有证据全部来自青少年和成人，&lt;b&gt;没有 6–12 岁随机对照实验&lt;/b&gt;。用于小学属合理外推，必须标「待验」——本 app 采用镜头讲法，但不宣称「已被证明更优」。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;高频先行&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;图式从词例中涌现&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;系统表后置&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;证据：方向有据 · 低龄待验&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;A term of stories: Lily first &lt;b&gt;went&lt;/b&gt; everywhere in her tales, then &lt;b&gt;saw&lt;/b&gt; and &lt;b&gt;had&lt;/b&gt; joined, and one day she lined them up herself: &quot;went, saw, had — 都是过去！&quot; —— 系统是被她自己发现的，这才是顺序对了的样子。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：最容易混的四对&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;时态选错，多半是开关拨错：先问「锚点在哪、看的是什么」，再选形式。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：完成时 vs 一般过去时（一句话判据）&lt;/h4&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th&gt;问题&lt;/th&gt;&lt;th&gt;一般过去时&lt;/th&gt;&lt;th&gt;现在完成时&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;能不能点名过去时间？&lt;/td&gt;&lt;td&gt;能：I saw him &lt;b&gt;yesterday&lt;/b&gt;.&lt;/td&gt;&lt;td&gt;不能：*I have seen him yesterday.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;眼睛看哪？&lt;/td&gt;&lt;td&gt;看过去那件事本身&lt;/td&gt;&lt;td&gt;看它留给现在的痕迹&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;典型搭档&lt;/td&gt;&lt;td&gt;yesterday / last night / in 2019&lt;/td&gt;&lt;td&gt;since / for / ever / just&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：will vs going to（倾向，不是分工表）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Watch out! You&#x27;re going to drop it!&lt;/span&gt;（眼前有预兆）vs &lt;span class=&quot;en&quot;&gt;&quot;I&#x27;ll catch it!&quot;&lt;/span&gt;（当场答应）。两者大量语境可换，抓原型即可，不背分工表（TA-11 边界）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：「了 / 过」与完成时的重叠地图（TA-16）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;对得上&lt;/span&gt;&lt;br&gt;经历：去过北京&lt;br&gt;have been to Beijing&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;半对&lt;/span&gt;&lt;br&gt;结果持续：钥匙丢了&lt;br&gt;常可 have lost，但着眼点不同&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;对不上&lt;/span&gt;&lt;br&gt;「了」只表做成了&lt;br&gt;点名时间时必须用过去时&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例四：一般现在时的三份正经工作（TA-04）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;习惯&lt;/span&gt; I get up at seven. · &lt;span class=&quot;en&quot;&gt;道理&lt;/span&gt; Water boils at 100°C. · &lt;span class=&quot;en&quot;&gt;时刻表&lt;/span&gt; The bus leaves at eight. —— 「正在发生」不在它的职责范围内，那是进行时的工作。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频时态病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因大多来自三处：把「了/过」直译、给完成时点名时间、忘了动词的形状。下面病句均为学习者高频错误类型，点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have seen him yesterday.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I saw him yesterday.&lt;/span&gt; —— 病因：完成时的眼睛盯着现在（TA-05)，yesterday 把事件钉回过去，两套定位打架（TA-06)。点名时间讲过去，是一般过去时的专职。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I am knowing the answer.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I know the answer.&lt;/span&gt; —— 病因：know 是「静止的牌子」，没有过程可看（TA-07 动词的时间形状）。牌子套不进进行时的镜头。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The train will leaves at six tomorrow.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ The train leaves at six tomorrow.&lt;/span&gt; —— 病因：时刻表把未来写成了已定的事实，借一般现在时就够（TA-13)；will 是借来的帮手，不能和 leaves 的衣裳叠穿。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ If I am you, I will help him.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ If I were you, I would help him.&lt;/span&gt; —— 病因：假设是把事情「推远」到现实之外，要用过去形式管距离（TA-08)。am 站在眼前，装不下「假如」。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ When we got to the cinema, the film has started.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ …the film had started.&lt;/span&gt; —— 病因：叙事锚点已经搬到过去（got 到达那一刻），更早的事要站在锚点回头看，用过去完成时（TA-09)。has 的锚点在现在，和故事的时间线脱节。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have finished my homework at eight last night.（想说「我昨晚八点写完了作业」）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I finished my homework at eight last night.&lt;/span&gt; —— 病因：把汉语「了」（做成了）直译成完成时（TA-16)。「了」只报告做成，不问与现在的牵连；一旦点名时间，就归一般过去时管。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;拨开关选时态 · 进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. I ___ my key yesterday, so I couldn&#x27;t get in.（点名了昨天——哪顶帽子？）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;lost&quot;&gt;&lt;div class=&quot;opt&quot;&gt;have lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;am losing&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. I can&#x27;t get in. I ___ my key!（不说时间，只说现在进不了门这个结果）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;have lost&quot;&gt;&lt;div class=&quot;opt&quot;&gt;lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;have lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;lose yesterday&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. Shh! The baby ___ now.（正在发生，要钻进镜头里看）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;is crying&quot;&gt;&lt;div class=&quot;opt&quot;&gt;cries&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is crying&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;cry&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. ___ you help me, please?（把请求推远一点，更客气）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;Would&quot;&gt;&lt;div class=&quot;opt&quot;&gt;Will&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;Would&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;Do&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. Look at the black clouds! It ___ rain.（预兆已经摆在眼前）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;is going to&quot;&gt;&lt;div class=&quot;opt&quot;&gt;is going to&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;rains&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;rained&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. The film ___ at seven tonight.（电影院节目单：已定的事实）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;starts&quot;&gt;&lt;div class=&quot;opt&quot;&gt;will starts&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;starts&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. When we arrived, the film ___ already ___.（站在「到达」回头看更早的事）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;had … started&quot;&gt;&lt;div class=&quot;opt&quot;&gt;has … started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;had … started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is … starting&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 同构；分歧与待核如实呈现（将来时之争 TA-02、现时相关含糊性批评 TA-05、历史现在时出处已补核 TA-14、镜头讲法低龄证据待验 TA-18）。&lt;br&gt;知识来源：《专家规律总结清单 v1》时态与体组 TA-01 – TA-18（Comrie 1976/1985；Langacker 1991/2001；Vendler 1957；Bybee et al. 1994；CGEL 2002；章振邦；连淑能 1993）。&lt;br&gt;条目索引：屏1 TA-01/02 · 屏2 TA-03/04/07 · 屏3 TA-05/06/12 · 屏4 TA-08/09 · 屏5 TA-10/11/13 · 屏6 TA-14/15/16 · 屏7 TA-17/18 · 对比台与病句医院回指各条。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
 document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
 const f=document.getElementById(b.dataset.f);
 f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
 b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));
const WHY={&#x27;lost&#x27;:&#x27;对了：点名了过去时间，就归一般过去时管（TA-06）。&#x27;,&#x27;have lost&#x27;:&#x27;对了：不点名时间、只看现在的痕迹——完成时（TA-05）。&#x27;,&#x27;is crying&#x27;:&#x27;对了：「现在」装不下整件事，要钻进镜头用进行时（TA-04）。&#x27;,&#x27;Would&#x27;:&#x27;对了：过去形式管距离，推远一点就客气（TA-08）。&#x27;,&#x27;is going to&#x27;:&#x27;对了：预兆在眼前，用「已经在路上」的 going to（TA-11）。&#x27;,&#x27;starts&#x27;:&#x27;对了：时刻表把未来写成事实，借现在时（TA-13）。&#x27;,&#x27;had … started&#x27;:&#x27;对了：锚点搬到过去，回头看用过去完成时（TA-09）。&#x27;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{
 const fb=g.nextElementSibling;
 g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
  const right=o.textContent.trim()===g.dataset.a;
  g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
  o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
  fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：先定锚点（旗子插在哪），再定看法（全景、中间，还是痕迹）？&#x27;;
 }));
});
&lt;/script&gt;

&lt;span class=&quot;tag&quot;&gt;展示原形 · 句型构式（CO-01 – CO-16）&lt;/span&gt;
&lt;h1&gt;句型模具厂&lt;/h1&gt;
&lt;p&gt;句型不只是单词排队：模具本身带意思。动词是面团，倒进不同的模具，出来的味道就不一样。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（CO-01）：&lt;/b&gt;整句的意义大于动词意思之和——多出来的那部分，是模具给的。所以每个句型都自带一出「戏」：谁给谁、谁变样、谁在哪儿。学句型 = 学每台模具自带的戏。&lt;/div&gt;
