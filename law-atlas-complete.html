&lt;h1&gt;专家规律总览 · 321 条 / 21 组&lt;/h1&gt;
&lt;div class=&quot;sub&quot;&gt;来源只走四条渠道：经典书籍、经典理论、经典网文、英语教学专家。每条带出处、机制、边界与分歧记录；儿童面只呈现接地气的形态，机制与边界完整保留在教师/家长层。点任意卡片进入该组展示屏。&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;&lt;span&gt;总机制 1 · 识解&lt;/span&gt;&lt;span&gt;2 · 原型+亲戚网&lt;/span&gt;&lt;span&gt;3 · 已知性&lt;/span&gt;&lt;span&gt;4 · 库存与频率&lt;/span&gt;&lt;span&gt;5 · 得体即正确&lt;/span&gt;&lt;span&gt;6 · 发展与支架&lt;/span&gt;&lt;span&gt;7 · 提取与间隔&lt;/span&gt;&lt;span&gt;8 · 机制先于形式&lt;/span&gt;&lt;span&gt;＋ 词汇类层（VB）&lt;/span&gt;&lt;span&gt;＋ 设计标准层（TM）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;card&quot; data-go=&quot;gr&quot;&gt;&lt;div class=&quot;ct&quot;&gt;语法 · GR · 23 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;句子不是词填空：形式、意义、用法三维一起看&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;ta&quot;&gt;&lt;div class=&quot;ct&quot;&gt;时态与体 · TA · 18 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;时态是两维坐标：时间点 × 镜头在事件内还是外&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;co&quot;&gt;&lt;div class=&quot;ct&quot;&gt;构式 · CO · 16 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;句型本身带意义：槽位有准入，整句先于词&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;qi&quot;&gt;&lt;div class=&quot;ct&quot;&gt;疑问与信息 · QI · 15 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;提问是定位信息的工具，语序是给听者的路标&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;v&quot;&gt;&lt;div class=&quot;ct&quot;&gt;词汇 · V · 18 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;会一个词是会一张网：词族、搭配、深度分层&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;c&quot;&gt;&lt;div class=&quot;ct&quot;&gt;可数与冠词 · C · 20 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;先看心里怎么切（一个个/一摊），再选词&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;p&quot;&gt;&lt;div class=&quot;ct&quot;&gt;介词花园 · P · 18 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;一个介词 = 一张原型图 + 一张亲戚网&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;s&quot;&gt;&lt;div class=&quot;ct&quot;&gt;语音 · S · 19 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;拼读是系统不是例外表；听辨先于产出&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;e&quot;&gt;&lt;div class=&quot;ct&quot;&gt;表达 · E · 15 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;说话是做事：得体与合语法同等重要&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;w&quot;&gt;&lt;div class=&quot;ct&quot;&gt;写作 · W · 15 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;好篇章靠衔接与连贯两层一起成立&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;yl&quot;&gt;&lt;div class=&quot;ct&quot;&gt;少儿英语研究 · YL · 14 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;难度落差里长本事；「越小越好」在课堂语境不成立&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;cb&quot;&gt;&lt;div class=&quot;ct&quot;&gt;语料库与真实英语 · CB · 14 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;英语多半是整块选的：真实语料说了算&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;ls&quot;&gt;&lt;div class=&quot;ct&quot;&gt;学习科学 · LS · 15 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;app 的设计律：自己考自己、分散开学（非英语知识本身）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;cg&quot;&gt;&lt;div class=&quot;ct&quot;&gt;中国学者与全球传统 · CG · 14 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;胡壮麟/戴炜栋/束定芳/蓝纯/薄冰与全球框架的中国课堂版&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;ne&quot;&gt;&lt;div class=&quot;ct&quot;&gt;母语国家专家 · NE · 29 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;地道来自库存不来自拼装；争议证据成对呈现&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;pb&quot;&gt;&lt;div class=&quot;ct&quot;&gt;介词专著书房 · PB · 13 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;Lindstromberg / Brugman / Herskovits / Bowerman 的框架层&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;vb&quot;&gt;&lt;div class=&quot;ct&quot;&gt;动词专著书房 · VB · 13 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;Levin 动词类整层补入；Leech / Palmer / Bolinger / Lewis&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;pr&quot;&gt;&lt;div class=&quot;ct&quot;&gt;代词与指称 · PR · 11 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;代词是社会关系与已知性的定价器；漏主语是类型迁移&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;wa&quot;&gt;&lt;div class=&quot;ct&quot;&gt;经典网文 · WA · 8 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;专家博客与专栏：Dogme 取材纪律、被动误认门诊&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; data-go=&quot;tm&quot;&gt;&lt;div class=&quot;ct&quot;&gt;教学法书房 · TM · 13 条&lt;/div&gt;&lt;div class=&quot;cd&quot;&gt;给做课的人的设计标准层：练习效度、规则出场、听力配比&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;foot&quot;&gt;待你裁定的三项仍悬置：语音产出取向（弱读传统 vs LFC 排序参考）、写作 POA 小学适配（W-11）、各组条目审定本身。书级深读接触等级总声明：本轮无一本通读级，最好为章节原文预览，逐本等级标在各书房页顶部。&lt;/div&gt;

&lt;/body&gt;&lt;/html&gt;" style="display:block"></iframe><iframe id="f-map" srcdoc="&lt;!DOCTYPE html&gt;&lt;html lang=&quot;zh-CN&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;title&gt;规律地图 · 321 条&lt;/title&gt;&lt;style&gt;body{font-family:-apple-system,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,sans-serif;background:#f6f3ec;color:#2b2620;margin:0;padding:24px}h1{font-size:24px;margin:0 0 6px}.sub{color:#7a7264;font-size:13px;margin-bottom:18px}h2{font-size:17px;margin:26px 0 10px;color:#8a5a1e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px}.it{background:#fff;border:1px solid #e7dfd0;border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.5}.id{display:inline-block;background:#efe6d2;color:#8a5a1e;border-radius:4px;padding:0 6px;font-weight:700;margin-right:6px;font-size:12px}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;h1&gt;规律地图 · 全部 321 条标题&lt;/h1&gt;&lt;div class=&quot;sub&quot;&gt;标题逐字取自《专家规律总结清单 v3》，按清单顺序分组。点任意一组入口页可进入该组的展示屏。&lt;/div&gt;&lt;h2&gt;语法（GR，23 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-01&lt;/span&gt;形式跟着功能走：语法形式是装着意义的符号，不是空壳规矩&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-02&lt;/span&gt;一个句子的时态只标记一次：标在第一个动词上，后面的动词回原形&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-03&lt;/span&gt;do 是替补队员：英语实义动词丢了自己提问、否定的能力，do 被拉来扛时态&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-04&lt;/span&gt;三单 -s 是北方方言留下的幸存者：动词变位大简化后唯一没被磨掉的词尾&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-05&lt;/span&gt;名词复数 -s 和三单 -s 不是一家人：长得像，是两条独立源流后来的巧合&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-06&lt;/span&gt;不规则过去式按「家族」住：老词靠元音换声留住老样子，高频是它们的保命符&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-07&lt;/span&gt;情态动词说的是「力」：must 是一股推力，may 是搬走障碍，can 是自己有劲儿&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-08&lt;/span&gt;情态动词是语法化的化石：它们曾经是普通动词，所以没有三单 -s、不能连排&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-09&lt;/span&gt;否定词会「磨损—加固」打转：not 本来是被喊来帮忙加强否定的，后来自己当了主角&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-10&lt;/span&gt;some / any 是说话人的立场选择，不是「肯定句 some、疑问否定 any」的铁律&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-11&lt;/span&gt;because 和 so 各管一段路：英语一段因果通常只留一个连接点，两个都上是汉语的习惯迁移&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-12&lt;/span&gt;主谓一致有三股力在拉：形式、意义、就近——there be 听离它最近的那个名词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-13&lt;/span&gt;所有格 &amp;#x27;s 是「关联标记」，不是「所有权证书」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-14&lt;/span&gt;代词的格跟着位置走：主语位用主格、宾语位用宾格，「讲究过头」也会错&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-15&lt;/span&gt;a / an 按声音不按字母：耳朵决定，字母只是参考&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-16&lt;/span&gt;错误是学习者心里的「临时系统」在试单，不是粗心也不是坏习惯&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-17&lt;/span&gt;注意到，才学得会：形式被「看见」的那一刻才开始变成自己的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-18&lt;/span&gt;把形式拉回交际现场：一边说话解决问题，一边顺手看形式&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-19&lt;/span&gt;频率在调谐大脑：见得多的先会、不规则的靠见得多才活得下来&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-20&lt;/span&gt;语块先于规则：整句先住进来，语法是后来从里面拆出来的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-21&lt;/span&gt;语法讲解的及格线：短、准、够用——先过效率与适切两道检查&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-22&lt;/span&gt;汉语不标的，英语偏要标：冠词、时态、复数、三单 -s 是中国孩子的错误集中区&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;GR-23&lt;/span&gt;输出把「听懂」逼成「会用」：说不出来，才知道自己哪里没真会&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;时态与体（TA，18 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-01&lt;/span&gt;时态 = 时间 × 看法两个开关，不是十二个要逐个背的格子&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-02&lt;/span&gt;英语形态上只有两个时态：没有「将来时」这个词形，将来是借工具谈的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-03&lt;/span&gt;体是「看事情的方式」：同一件事，可以看全景，也可以钻进去看中间&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-04&lt;/span&gt;一般现在时装不下「正在发生」：整件事必须和说话这一刻完全重叠&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-05&lt;/span&gt;完成体看的是「过去的事和现在的牵连」：痕迹在，事已远&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-06&lt;/span&gt;现在完成时不能点名过去时间：*I have seen him yesterday 为什么错&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-07&lt;/span&gt;动词自带「时间形状」：有的事有终点、有的事是瞬间、有的状态没有过程可看&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-08&lt;/span&gt;过去形式还管「距离」：礼貌、假设、转述，都是把事情从眼前推远&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-09&lt;/span&gt;过去完成时是「锚点搬家」：站在过去某个点上，再回头看更早的事&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-10&lt;/span&gt;will 说将来带着「我预言 / 我乐意」的口气，因为它本是意愿动词变的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-11&lt;/span&gt;be going to 是「已经在路上」：从走向某地去做某事，变成预兆与打算&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-12&lt;/span&gt;完成体的来历：从「我手里有一封写好的信」到「我已经写了信」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-13&lt;/span&gt;时刻表上的将来用现在时：因为时刻表把未来写成了「已定的事实」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-14&lt;/span&gt;讲故事可以把过去拉到眼前：历史现在时是「演」不是「说错」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-15&lt;/span&gt;汉语靠词和语境表时间，英语靠动词变形：每个英语句子被迫选时&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-16&lt;/span&gt;「了 / 过」≠ 现在完成时：对得上的只有一部分&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-17&lt;/span&gt;学时态的顺序：先把高频动词的过去式用熟，再回头看系统表&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TA-18&lt;/span&gt;「镜头讲法」教时态有实验支持，但证据强度要如实说：方向有据、低龄待验&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;构式（CO，16 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-01&lt;/span&gt;句型模具本身带意思：整句的意义大于动词意思之和&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-02&lt;/span&gt;双宾模具自带「让某人收到某物」：bake 进去，就长出「给」义&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-03&lt;/span&gt;有些动词进不了双宾模具：意思不合是一关，词的「长相」也是一关&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-04&lt;/span&gt;致使移动模具：喷嚏也能「打飞」一张餐巾纸&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-05&lt;/span&gt;结果模具：「把某物弄成某个样」——变样的意思来自模具，不在动词里&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-06&lt;/span&gt;双宾模具是一个「意思家族」：从真给出去，到打算给、答应给&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-07&lt;/span&gt;There be 是「出场介绍」模具：把新面孔推上舞台，所以主语多半是新客&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-08&lt;/span&gt;被动句是「换主角」，不是「没人做主语时的救急」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-09&lt;/span&gt;主语是「镜头主角」，不保证是动作的发出者&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-10&lt;/span&gt;孩子学句型是「先整句、再换零件」：带空格的句子先行，抽象句型后长&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-11&lt;/span&gt;理解句子时，大脑先认模具、后认动词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-12&lt;/span&gt;构式和语块是同一条谱系：从整块背下的句子，到半成品框架，到全抽象模具&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-13&lt;/span&gt;一个分句只有一台「上牌发动机」：限定动词管时态，to do / doing 是不上牌的零件&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-14&lt;/span&gt;to 还是 -ing，由前面的动词点名：这是搭配事实，不是自由二选一&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-15&lt;/span&gt;英语先立骨架再挂修饰，汉语先铺垫后点题：两种句子建筑术&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CO-16&lt;/span&gt;构式讲法的边界：模具管「整句的戏」，词形细节归形态层管&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;疑问与信息（QI，15 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-01&lt;/span&gt;疑问词各管一块拼图：问句是按「缺哪块信息」分工合作的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-02&lt;/span&gt;疑问词与指示词是两个词族：wh- 与 th- 从未互变，「换字母得答词」是假规律&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-03&lt;/span&gt;whose 是 who 的「家的」，why 是「用什么」的变身：两个真词源&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-04&lt;/span&gt;提问的动作 = 把助动词举到主语前面：被举到前面的，总是排第一的那个助动词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-05&lt;/span&gt;新信息爱住句尾：先说已知的，再把「新货」放在最后并重读&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-06&lt;/span&gt;状语排队是倾向不是定律：「先地点后时间」只是常态出场顺序&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-07&lt;/span&gt;前置是「变强调」的正当手段：把谁提到句首，就是先给谁打光&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-08&lt;/span&gt;语调是问句的第二套标记：一般疑问常升调、特殊疑问常降调——是常态，不是铁律&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-09&lt;/span&gt;Why 的回答多用 Because，但不是「必用」：问目的时 To / For 同样正宗&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-10&lt;/span&gt;How 与 What 分工：一个问「怎么样/用什么法子」，一个问「是什么东西」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-11&lt;/span&gt;选择问句不用 Yes / No 回答：人家给了选项，要选一个&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-12&lt;/span&gt;回答否定问句，英语跟「事实」走，汉语常跟「对方的话」走&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-13&lt;/span&gt;英语把疑问词搬到句首，汉语让疑问词留在原地：问句最大的结构差&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-14&lt;/span&gt;疑问句是分阶段长出来的：整句模仿 → 换疑问词 → 最后才学会倒装&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;QI-15&lt;/span&gt;提问要先有「真缺口」：为不知道而问，形式才记得住&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;词汇（V，18 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-01&lt;/span&gt;「认识一个词」是九个格子的事，不是背一个中文意思&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-02&lt;/span&gt;先学谁由词频决定：最常用的约 2000 个词族罩住文本的大头&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-03&lt;/span&gt;读懂一页书有一条硬线：认识的词要达到约 98%&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-04&lt;/span&gt;学词要四条腿走路：输入、输出、专门学、练流利缺一不可&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-05&lt;/span&gt;英语的积木是「词块」，不是单个词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-06&lt;/span&gt;大脑存词是「杂货铺」：整句和单词躺在同一个仓库里&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-07&lt;/span&gt;一个词的意义，一半写在它的伙伴名单里（搭配）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-08&lt;/span&gt;知道一个词「为什么这样说」，记得更牢（词源精细加工）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-09&lt;/span&gt;练习有没有用，看任务里有没有「需要、查找、评估」（投入量假说）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-10&lt;/span&gt;最危险的不是生词，是「以为自己认识」的词（欺骗性透明）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-11&lt;/span&gt;词是「提取」出来的，不是「看」熟的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-12&lt;/span&gt;猜词是门手艺，但手艺有天花板（语境猜义的前提）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-13&lt;/span&gt;词的意思要到「戏」里学：一幕买卖戏教全 buy/sell/pay/cost（框架语义）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-14&lt;/span&gt;同框架的词要成组学：学会一个，免费带走一串推论&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-15&lt;/span&gt;词能拆，但只能拆真的：构词透明度是一条连续谱&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-16&lt;/span&gt;一词多义不是清单，是从一个原型义长出的网&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-17&lt;/span&gt;说出来、写出来，才知道自己「不会」（输出促注意）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;V-18&lt;/span&gt;中国孩子的词汇错误有地图：CLEC 告诉我们错在哪几类&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;可数与冠词（C，20 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-01&lt;/span&gt;总纲：可数不可数是「看法」，不是物体的物理属性（识解说）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-02&lt;/span&gt;物质名词的判据是「同质」：随便拿一小份，还是它&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-03&lt;/span&gt;可数名词的「界」可以是模糊的：season、tummy 都可数&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-04&lt;/span&gt;看法可以当场切换：磨成料、分作份（grinding / portioning）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-05&lt;/span&gt;数一摊东西要借单位，而汉语量词就是现成的老师&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-06&lt;/span&gt;a 的本职：让听者「认出是哪一类」就够了&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-07&lt;/span&gt;the 的本职：让听者「唯一定位到那一个」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-08&lt;/span&gt;把东西「找出来」的线索只有五条路（定指的建立菜单）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-09&lt;/span&gt;学习者选错冠词有个系统原因：先按「具体」选，后按「定指」选（波动假说）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-10&lt;/span&gt;中国学生的冠词错误居名词短语错误之前列，且以「漏」和「滥」为主&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-11&lt;/span&gt;机构名词有两种读法：「去做那件事」不加冠词，「去那栋楼」才加&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-12&lt;/span&gt;有些搭配是「约定存货」：play the piano 加 the、play football 不加&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-13&lt;/span&gt;类指有三种说法，分工不同：a tiger / the tiger / tigers&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-14&lt;/span&gt;a/an 看声音不看字母：an 是原形，a 是弱化形&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-15&lt;/span&gt;抽象名词不可数，因为它们被看成「一类事」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-16&lt;/span&gt;集合名词可单可复，看你把「一家人」看成一个单位还是几口人&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-17&lt;/span&gt;量词排队先看识解：many/much、few/little 是同一总开关的下游&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-18&lt;/span&gt;复数 -s 只落在「有界单位」上：这是它从不落在料上的原因&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-19&lt;/span&gt;选冠词时，心里要过一遍「对方知道吗」——冠词是给听者的服务&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;C-20&lt;/span&gt;冠词错误要分型纠：漏用、误加、替换是三种病、三种药&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;介词（P，18 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-01&lt;/span&gt;总纲：一个介词 = 一张原型图 + 一张亲戚网（有原则的多义）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-02&lt;/span&gt;原型不是凭感觉选的：四条证据定中心&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-03&lt;/span&gt;in 的原型是「装进容器」：边界之内，且受容器影响&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-04&lt;/span&gt;on 的原型是「贴面加承重」：接触面在替它撑着&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-05&lt;/span&gt;at 的原型是「当成一个点」：把对象压扁成坐标&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-06&lt;/span&gt;over 的中心是「在上方」，不是「盖住」：一个全家福的裁决示范（T&amp;amp;E 版；Brugman/Lakoff 动态复合中心说并存登记，见 PB-05–PB-07）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-07&lt;/span&gt;up 是「多」：数量往上涨，所以 prices go up&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-08&lt;/span&gt;几何算一半，功能算另一半：苹果在碗沿之下为什么还能说 in（功能几何框架）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-09&lt;/span&gt;时间介词是把空间图「借」到时间上：时长定介词是伪规则&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-10&lt;/span&gt;教介词要教「图 + 长法」，不要教义项清单：三组教学实验的共识&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-11&lt;/span&gt;华语学生的介词错误是「切分不同」，不是「记性不好」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-12&lt;/span&gt;谁做图形谁做背景：介词句子先定位「要找的东西」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-13&lt;/span&gt;垂直方向是四个词合伙切的：above / over / under / below 的分工&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-14&lt;/span&gt;to / for / at：三个「指向」介词的分工&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-15&lt;/span&gt;小品词是介词的「动词版亲戚」：up / out / off 的图式义随身携带&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-16&lt;/span&gt;静态的东西借动态的词：The road runs along the river（虚构运动）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-17&lt;/span&gt;先空间、后时间、再抽象：介词义的展开顺序就是教学顺序&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;P-18&lt;/span&gt;中国课堂的本土证据：概念教学对华语学生同样有效&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;语音（S，19 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-01&lt;/span&gt;先系统地学字母—声音对应、而且越早开始收益越大，这是全领域证据最硬的一条教学结论&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-02&lt;/span&gt;认词不是把词形拍成照片存起来，而是把拼写、读音、词义在脑子里「焊」成一个整体&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-03&lt;/span&gt;孩子认词要走四个台阶：看图猜词 → 只用首尾字母 → 逐字母全拼 → 成块认词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-04&lt;/span&gt;每自己拼对一个生词，孩子就给自己上了一课——解码是阅读的「自我教学」机器&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-05&lt;/span&gt;听觉上先有「块」再有「个」：孩子先听得出押韵和词块（首音—韵脚），然后才听得出单个音素&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-06&lt;/span&gt;字母和声音的对应是「多半如此」的统计倾向，不是定律：先教最稳的一批，剩下的进变脸名单逐个记&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-07&lt;/span&gt;会拼读 ≠ 会阅读：认词和听懂是两套能力，阅读是两者的乘积&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-08&lt;/span&gt;英语里出现最多的元音是一个「含糊音」/ə/：不重读的音节，元音大多缩水成它&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-09&lt;/span&gt;小词有两副嗓子：a、the、to、can 这些功能词，单独念读强式，放进句子里多半读弱式&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-10&lt;/span&gt;语言的节奏没有「两种」，只有一条连续带：英语偏向「重音说了算」的一端，汉语偏向「音节平均」的一端&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-11&lt;/span&gt;句子里被重读的，是说话人要你注意的那个词——重音是「划重点」的工具&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-12&lt;/span&gt;连读不是「读得快糊在一起」，是音节在重新组队：前一个词的尾巴辅音会跑去当后一个词的开头&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-13&lt;/span&gt;发音学得好不好，第一标准是「人家听不听得懂」，不是「像不像英国人/美国人」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-14&lt;/span&gt;中国孩子发音的难点不在「舌头笨」，在汉语的音系清单和英语不一样：没有的音、没有的弱读、没有的词尾辅音群，要专门补&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-15&lt;/span&gt;字母名和单词读音对不上，是因为拼写先被印刷固定下来、读音随后大搬了家——「元音大推移」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-16&lt;/span&gt;英语里 f 对拉丁语 p、th 对 t 这类「对不上的对应」，是一次成系统的辅音大搬家留下的——格林定律&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-17&lt;/span&gt;foot 的复数是 feet 不是 foots：一个早就消失的词尾 -i，在消失前把前面的元音「传染」变了样——i-变音&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-18&lt;/span&gt;buses、watches 里多出来的一个音节不是随便加的：两个「嘶嘶声」不能紧挨着，中间必须垫一个元音&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;S-19&lt;/span&gt;knight 里的 k 和 gh 不发音，不是拼写在捣乱：它们曾经真的发音，是声音先消失、字母留了下来&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;表达（E，15 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-01&lt;/span&gt;说话就是做事：每句话在传递信息之外，都在执行一个动作——请求、道歉、承诺、感谢、邀请&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-02&lt;/span&gt;很多话不能按字面听：「你能把盐递给我吗」问的不是能力，是请求——意思要过「他想让我做什么」这一关&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-03&lt;/span&gt;对话能进行下去，靠双方默认「我还在配合你」：答非所问往往不是乱答，是在用绕弯的方式回答&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-04&lt;/span&gt;日常句子是整块从记忆里取出来的，不是逐词现拼的：问候、点餐、道别靠的是「现成块」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-05&lt;/span&gt;语法错了，人家笑你「说得不好」；场合错了，人家觉得你「人不好」——语用失误比语法错误更伤人，而且更难被察觉&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-06&lt;/span&gt;语用失误分两种，治法完全不同：一种是「现成说法用错了」，一种是「不懂这个场合的规矩」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-07&lt;/span&gt;请求、打扰、拒绝越「压人」，英语越要加缓冲：礼貌是替对方的「面子」留余地，客气程度随关系远近和事的大小滑动&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-08&lt;/span&gt;一句回应「对不对」，不看句子本身，看三件事：谁在说、对谁说、上一句说了什么&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-09&lt;/span&gt;汉语的客套会「跟着人一起出国」：谦虚、称呼、拒绝的方式直译成英语，常会变成失误&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-10&lt;/span&gt;「会说英语」是四种本事合起来：语法只占四分之一，其余是得体、成篇、和卡壳时的自救&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-11&lt;/span&gt;卡壳不是失败，是交际的一部分：会换个说法、打个比方、问一句「怎么说」，本身就是本事&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-12&lt;/span&gt;得体不会自己长出来：语法学得再好的人也会说错场合的话——语用必须专门教、把规矩讲在明处&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-13&lt;/span&gt;对话是两个人轮流搭的：一问一答是绑在一起的「对子」，上一句长什么样，就预定了下一句的活&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-14&lt;/span&gt;没注意到的东西学不会：语用规矩藏在语境中，不把孩子的注意力引过去，他听一百遍也可能没看见&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;E-15&lt;/span&gt;说错了能自己改回来，是对话自带的功能：交际教学不该一出错就打断，先让人把「自我修复」走完&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;写作（W，15 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-01&lt;/span&gt;写作和说话最大的不同：读者不在你面前，看不见你脑子里的画——每个信息都要用文字亲手交到读者眼前&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-02&lt;/span&gt;写好作文不是一口气从头写到尾：想（计划）、写（落笔）、改（回看）三件事是来回切换的，不是一条直线&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-03&lt;/span&gt;孩子写作文「想到什么写什么」不是偷懒，是发展阶段：从「知识讲述」长到「边写边想清楚」需要很多年&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-04&lt;/span&gt;修改分两层，顺序不能反：先改「意思对不对、读者懂不懂」，最后才改「字词句对不对」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-05&lt;/span&gt;最省力的写作进步法是「接着写」：先读一段好文章，再顺着它的势往下写——理解会把产出「拉平」到更高水平&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-06&lt;/span&gt;内容要创造，语言要模仿：新意放在想什么上，句子的说法先借现成的——反过来就会写出「想法平庸、句子奇葩」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-07&lt;/span&gt;写不出来恰恰是最有用的时刻：只有动笔输出，才知道自己缺哪一块——「注意到缺口」是进步的扳机&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-08&lt;/span&gt;对小学生怎么写才有效，有官方级的证据清单：天天写、教过程、练基本功、建写作圈——四件事按证据强度排好了队&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-09&lt;/span&gt;年龄再大一点，什么写作教学最有效已经有元分析答案：教「写作策略」排第一，范文研读、句子合并、同伴合作都在有效清单上&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-10&lt;/span&gt;支架的意义在于「用完要撤」：句子框架、范文、师生共构都是临时拐杖，撤掉还能写，才算学会&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-11&lt;/span&gt;先把课上成「围着写作转」：先给学生一个写不好的真实任务，让他撞见缺口，再给范文和句型——顺序反过来，学的就用不上&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-12&lt;/span&gt;字写不顺、词拼不对，会把脑子「堵住」：基本功不自动化，就没有余力想内容&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-13&lt;/span&gt;句子是攒出来的：把两个短句合成一个长句的练习（句子合并），是实测能提升写作质量的少数单项训练&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-14&lt;/span&gt;衔接词是给读者的路标，不是作文的装饰品：路标必须对准真实的逻辑关系，贴错地方比没有更糟&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;W-15&lt;/span&gt;任何「套这个公式保满分」的承诺都没有研究支持：能涨分的只有策略、练习量与反馈的组合——这是写作域的诚实底线&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;少儿英语研究（YL，14 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-01&lt;/span&gt;活动的「难度落差」就是学习发生的地点：任务要求与教师支持之间的差，决定孩子学不学得到东西&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-02&lt;/span&gt;儿童是在「活动 + 话语」里把意思搭出来的：听不懂整句时，他们靠线索猜、靠做中学&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-03&lt;/span&gt;一个主题滚一周：词汇和句型要在故事、游戏、手工里反复见面，才算学过&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-04&lt;/span&gt;孩子之间会互相「搭手」：同伴支架是儿童课堂的真实学习机制，不是纪律问题&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-05&lt;/span&gt;儿童学二语的路径由「语境」决定：在家、在课堂、在沉浸环境，是三种学法&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-06&lt;/span&gt;故事是儿童英语课的发动机：一本真实绘本可以组织一整段学习&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-07&lt;/span&gt;老师「讲」故事胜过「读」故事：讲述者的眼睛和节奏就是脚手架&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-10&lt;/span&gt;少儿英语课要有「单元骨架」：以主题组织整段学习，先听说、后读写&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-13&lt;/span&gt;先听懂、再开口，用身体记住语言（TPR）：有效但证据有边界，只适合打地基&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-08&lt;/span&gt;「越小开始越好」在课堂外语环境里不成立：决定成败的是接触的总量、质量与连续性&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-09&lt;/span&gt;儿童学外语的动机住在课堂里：好玩的活动、亲近的老师、看得见的进步&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-11&lt;/span&gt;外语环境里，课堂（和产品）几乎是孩子唯一的英语来源——所以体验质量就是学习质量&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-12&lt;/span&gt;英语课是孩子整体教育的一部分，不是孤立的「语言系统」训练&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;YL-14&lt;/span&gt;让孩子参与设计与评议：儿童不只是任务的执行者，也是任务的共同作者&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;语料库与真实英语（CB，14 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-01&lt;/span&gt;英语大部分时候不是逐词拼的，是整块选的（idiom principle）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-02&lt;/span&gt;一个词的意义，一半住在它常跟谁一起出现里（collocation）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-03&lt;/span&gt;关于英语的断言，先信文本，不信直觉（Trust the Text）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-04&lt;/span&gt;口语和书面语的差别是系统性的，不是口语「不规范」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-05&lt;/span&gt;高频词串是搭起语篇的预制砖（lexical bundles）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-06&lt;/span&gt;「投入互动」对「信息密度」：一条轴看懂口语与书面语（Dimension 1）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-07&lt;/span&gt;把话题先端出来、或在句尾再补一句，都不是病句（heads &amp;amp; tails）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-08&lt;/span&gt;话说得「含糊」，常常是熟练和体贴（vague language）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-09&lt;/span&gt;句子语法之上还有一层「话语语法」：省略、应和与插话都是规则&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-10&lt;/span&gt;换个型式，就换了个意思（pattern grammar）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-11&lt;/span&gt;最有势力的 700 个词，先攻它们（lexical syllabus）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-12&lt;/span&gt;对比中介语分析：两面镜子照出母语的指纹（CIA）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-13&lt;/span&gt;学习者的毛病大多是「频率错位」，不只是「用错」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CB-14&lt;/span&gt;一个词不是一级「会」的，是一个义项一级（EVP）&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;学习科学（LS，15 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-01&lt;/span&gt;十种常见学法逐个评级：只有「自己考自己」和「分散开学」拿到最高档&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-02&lt;/span&gt;测验效应：合上书想一遍，比把课文再读几遍记得牢得多&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-03&lt;/span&gt;答对一次不等于学会：会了以后「继续考」才留得住，「继续看」几乎白费&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-04&lt;/span&gt;提取要配反馈：答错不可怕，没人告诉你对错才可怕&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-05&lt;/span&gt;小步常考在真实课堂里同样成立：六年级与八年级的整学期证据&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-06&lt;/span&gt;分散练习：把同一内容拆开隔几天学，赢过一口气学完——两个统计口径都指同一个结论&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-07&lt;/span&gt;想记多久，就按比例隔多久：最优间隔随保持期拉长而变长，但占的比例反而变小&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-08&lt;/span&gt;Bjork 合意困难：练得慢一点、错多一点的条件常常记得更牢——但只有「正中机制」的难才合意&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-09&lt;/span&gt;流畅错觉：答案摊在眼前时人人觉得会了——「看着眼熟」是被实验证伪的掌握指标&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-10&lt;/span&gt;交错练习：把不同题型打散混着练，当下更慢更错，日后测验却赢一大截——练的其实是「先选对方法」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-11&lt;/span&gt;精细化提问与自我解释：每学一步就追问「为什么、凭什么」，把例子读出道理的人学到的才是会迁移的那一份&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-12&lt;/span&gt;双重编码：词和图各存一份，等于给记忆留两个入口——但那组到处流传的百分比没有出处，禁用&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-13&lt;/span&gt;Mayer 多媒体原则：动画课的画面纪律是有实验账本的——删无关、给信号、词图同地同时&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-14&lt;/span&gt;Sweller 认知负荷：新手先看「做完的范例」，熟手再看就是累赘——指导的量必须随水平反着调&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;LS-15&lt;/span&gt;Nation 四线平衡：一个设计良好的语言课程有四条等时的线——只跑「讲练线」，等于缺了四分之三的课&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;中国学者与全球传统（CG，14 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-01&lt;/span&gt;句子手拉手只是表面，「意思接得上」才是真的连成一段（衔接 ≠ 连贯）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-02&lt;/span&gt;母语不是只会「捣乱」：负迁移有四张脸，正迁移一直在帮忙&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-03&lt;/span&gt;隐喻靠的是「有点像」：全像就不是隐喻，完全不像也成不了隐喻&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-04&lt;/span&gt;隐喻是「跨界借」，转喻是「在本家里指代」：一个靠像，一个靠挨着&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-05&lt;/span&gt;先懂空间，才懂时间：时间词是借空间词盖的房子&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-06&lt;/span&gt;上/下、UP/DOWN 搭出的世界大同小异：状态第一，次序英汉不同&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-07&lt;/span&gt;现在完成时的判据是「与现在有关系」，不是「做完了没有」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-08&lt;/span&gt;孩子学说话，是先学会「用话办事」：七种活儿排在语法前头&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-09&lt;/span&gt;用英语上别的课，要四样一起转：内容、交流、动脑、文化（CLIL 的 4Cs）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-10&lt;/span&gt;先说清「能用英语做成什么事」，再倒推教什么（CEFR 的行动导向与 can-do）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-11&lt;/span&gt;先按「要办的事和要说的意思」排课，语法是随后配齐的工具（意念-功能大纲）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-12&lt;/span&gt;「泡」在语言里，听读能泡出高水平，说写的准确却会卡住（沉浸式的成熟结论）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-13&lt;/span&gt;初学读字，先把「拼读」这条路修直，但不能只剩拼读（Rose 审查）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;CG-14&lt;/span&gt;听懂很多，英语就会自己长出来——影响最大的说法，也是吵得最凶的说法（Krashen 输入假说）&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;母语国家专家（NE，29 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-01&lt;/span&gt;合语法不等于地道：母语者只说「惯例会说的那一种」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-02&lt;/span&gt;说话快得不像现编的：大脑里整存着一座「句干仓库」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-03&lt;/span&gt;学英语的起步单位是整块，不是单词加规则&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-04&lt;/span&gt;没有哪条规则被所有人永远遵守：「零容忍」是规定主义神话&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-05&lt;/span&gt;好些「语法铁律」是两三百年前照着拉丁语发明的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-06&lt;/span&gt;英语已经不归母语者管了：三圈世界与「说给全世界听」的目标&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-07&lt;/span&gt;只用三千个已知词，就能解释一切新词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-08&lt;/span&gt;词典真正的灵魂是例句和句型：动词是句子的枢纽&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-09&lt;/span&gt;先有情景，再有句型：Hornby 的情景法遗产&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-10&lt;/span&gt;说话时每时每刻在做三个决定：语调的「三 T」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-11&lt;/span&gt;口音是地图不是污点：差异有系统，身份在其中&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-12&lt;/span&gt;发音先练肌肉：找到嘴里的四个「按钮」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-13&lt;/span&gt;音标表不是考卷，是一张可以上手玩的「发音地图」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-14&lt;/span&gt;目标是被听懂，不是扮成母语者：可懂度优先于口音&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-15&lt;/span&gt;规则先过证据关：被几代人奉为圭臬的手册也会认错被动语态&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-16&lt;/span&gt;语法是「选择的仓库」：学语法是为了写作时多一条可选的路，不是为了少犯一个错&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-17&lt;/span&gt;语法要嵌在写作里教才有效：Exeter 随机对照试验给出的是「有条件的有效」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-18&lt;/span&gt;语类是「分阶段、奔着社会目的去的做事方式」：故事、报告、说明各有各的台阶&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-19&lt;/span&gt;教学循环：先全班拆一篇 → 再全班合写一篇 → 最后才轮到你自己写（Teaching-Learning Cycle）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-20&lt;/span&gt;Reading to Learn：把支架加厚到句子层——让全班读同一篇难文本，而不是给差生降难度&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-21&lt;/span&gt;Derewianka：给小学教师的语法书按「语言的四种活儿」组织，不按词类清单组织&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-22&lt;/span&gt;印刷概念（Concepts About Print）：开始读之前，孩子先要搞懂「书是怎么运作的」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-23&lt;/span&gt;Reading Recovery：最早、最贵的一对一干预——短期效应有据，长期效果正被新证据改写&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-24&lt;/span&gt;谈话有三型：吵架型、附和型、探索型——只有探索型谈话里，思考是公开进行的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-25&lt;/span&gt;Thinking Together：先全班约法（ground rules），再放小组讨论——规矩是谈出来的，不是贴出来的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-26&lt;/span&gt;Alexander 的对话式教学五原则：集体、互惠、支持、累积、目的——缺了「累积」，热闹不是对话&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-27&lt;/span&gt;Talk for Writing 三段：模仿 → 创新 → 发明——写作教学的顺序是「先有文本存量，再有个人创作」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-28&lt;/span&gt;模仿段的发动机：故事地图 + 全身动作——把文本变成可以指着演的图，记忆才托得住语言&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;NE-29&lt;/span&gt;支架是设计出来的，不是随口帮一句：语言支架与学习支架要同时搭在内容课里&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;介词专著书房（PB，13 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-01&lt;/span&gt;介词书可以不按词编、按「意义簇」编：先有共同的画面，再比邻居的差别&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-02&lt;/span&gt;基本义要能「画出来」：可描绘性是 Lindstromberg 给核心义定的门槛&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-03&lt;/span&gt;on 被他拆成两个基本义：on1「接触承托」与 on2「继续向前」——切分粒度之争的一个标本&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-04&lt;/span&gt;against 有专章、through 在路径簇：力在场与穿过介质——现清单完全没有的两个招牌分析&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-05&lt;/span&gt;over 网络的原始形态：中心不是静态「在上方」，而是动态的「从上方越过」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-06&lt;/span&gt;连接节点的不是「引申理据」，是「图式变换」：链的性质决定了网络能长多长&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-07&lt;/span&gt;中心义判定之争：Tyler &amp;amp; Evans 用两条判据把 24 个义项压回 15 个，并把中心换成静态图式&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-08&lt;/span&gt;每个介词只有一个「理想意义」：几何自画像，其余全是偏离&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-09&lt;/span&gt;偏离走两条道：挂账的「使用类型」与现场的「语用容差」——外加四条语用原则当交警&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-10&lt;/span&gt;功能知识：介词不只看形状，还看「这东西是干什么用的」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-11&lt;/span&gt;韩语孩子按「紧贴不紧贴」切世界，英语孩子按「包住/托住」切——同一批积木，两种分法，从一岁半就开始分&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-12&lt;/span&gt;对中国孩子：刀口错位图——汉语的「上/里」与英语的 in/on/at 在哪几处必然打架（本簇推论条）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PB-13&lt;/span&gt;Dirven 的意义链：物理空间怎么切，心理空间就怎么搭——at/on/in 是三个能走遍所有抽象域的词&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;动词专著书房（VB，13 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-01&lt;/span&gt;交替是探针：一个动词能进哪些句型，先由它的意思说了算&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-02&lt;/span&gt;break 和 cut 不是一回事：一个只说「结果」，一个自带「怎么切」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-03&lt;/span&gt;动词类是词典的组织方式：先归类，再预判，没见过的词也能猜出七八分&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-04&lt;/span&gt;方式与结果只能选一端写进词里：这是 break/cut 之别的总原理&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-05&lt;/span&gt;完成体不是「做完」，是「过去牵着现在」：Leech 与 Comrie 在这一点上互相印证&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-06&lt;/span&gt;进行体三件套：持续、有限期、不必做完——外加「临时性消失时」的特殊读法&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-07&lt;/span&gt;Leech 的章名就是立场：没有「将来时」一章，只有「将来时间的表达」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-08&lt;/span&gt;情态先分两大阵营：对「命题真假的表态」和对「事件落地的推动」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-09&lt;/span&gt;「过去时也是情态」：形式上的后退一步，同时是时间、真实与礼貌上的后退&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-10&lt;/span&gt;小品词自带两件行李：「穿过某地而动」＋「抵达终点/产生结果」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-11&lt;/span&gt;习语性有三级：大多数短语动词可拆可解，只有最高一级才是死记的习语&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-12&lt;/span&gt;通用原则：一个形式只有一个通义；出现「例外」，错的是规则写窄了&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;VB-13&lt;/span&gt;情态词是「说话人此刻的判断」，不是时态的附庸：must 与 have to 的分界在主观/客观&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;代词与指称（PR，11 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-01&lt;/span&gt;代词首先是「关系词」，不是「代替名词的词」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-02&lt;/span&gt;「我」是把自己钉在此时此地、并为这句话担责的词&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-03&lt;/span&gt;we 是最「滑」的代词：包不包你，要靠听者自己猜&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-04&lt;/span&gt;礼貌和亲疏本来住在代词里——英语把这套系统拆了，礼貌搬了家&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-05&lt;/span&gt;「人称」不是一张三人称表，而是一个范畴家族——英语的版本相当「素」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-06&lt;/span&gt;用全名、代词还是零形式，由「可及性」定价——代词是给最熟的那个的&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-07&lt;/span&gt;有的语言能把主语代词「省掉」，靠的是动词身上带着人称——英语把这套丢了，所以代词必须站出来&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-08&lt;/span&gt;漏主语的总根：汉语是「话题优先 + 话题链」的语言，英语是「主语优先」的语言&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-09&lt;/span&gt;迁移不只是「把汉语形式搬过来」，更是「把汉语的功能塞进英语的形式」——存现句与 it 外置的过产&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-10&lt;/span&gt;天气里的 it 不是「没意思的占位符」，它指着「整个环境」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;PR-11&lt;/span&gt;他/她说混了，错在汉语 tā 同音——口语高发、书面低发，是加工问题不是态度问题&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;经典网文（WA，8 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-01&lt;/span&gt;课堂的真材料是学生自己说的话：教材可以放下，谈话先行（Dogme / 涌现式教学）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-02&lt;/span&gt;说得顺≠说得快：流利度是记忆的函数，靠的是脑子里存着的整块的现成话&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-03&lt;/span&gt;骂一句话之前先认准它是不是被动句：不及物动词根本没有被动形式&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-04&lt;/span&gt;「被动」不是一种时态，也不等于「说话含糊」：两个民间等式都不成立&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-05&lt;/span&gt;经典的网文形态：纸书被判错之后，博客是它二十年的公开勘误表&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-06&lt;/span&gt;没有「全世界统一的标准英语」：对错是约定俗成，编辑和老师的本事是在标尺上滑动&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-07&lt;/span&gt;故事课成败先在选书：故事要对上孩子的「语言年龄」和「心智年龄」两把尺&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;WA-08&lt;/span&gt;讲故事不是读故事：先把故事拆成「骨架」装进脑子，眼睛和身体才能空出来表演&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;教学法书房（TM，13 条）&lt;/h2&gt;&lt;div class=&quot;grid&quot;&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-01&lt;/span&gt;语法不是一套要背的知识，是第五种技能：会「用形式做事」才算会语法&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-02&lt;/span&gt;每个语法单位都要过三问：长什么样（形）、什么意思（义）、什么时候用（用）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-03&lt;/span&gt;规则出场有三条路：先给规则、先看例子猜、从整篇语料里挖——没有哪条天生最优&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-04&lt;/span&gt;练语法有三个不同的目标：练准、练顺、练到「重组」——混为一谈是练习失效的主因&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-05&lt;/span&gt;语法课的六条戒律：到语境里教、拿去用、省着教、教有用的、留出「长出来」的空间、看人下菜&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-06&lt;/span&gt;练习好不好，先过五关：效度、数量、成功导向、异质性、趣味&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-07&lt;/span&gt;语法教学的稳妥配方：有系统的纲、有简化的规则、有集中的练、有真的用——且顺序不必排死&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-08&lt;/span&gt;听者不是录音机：听懂 = 在脑子里把说话人的意思「补全并共同建构」出来&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-09&lt;/span&gt;听力课要有「六种听」的配比：精听、选听、互动听、泛听、回应听、自主听&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-10&lt;/span&gt;阅读是两层加工的合奏：底层「认词」必须练到自动，才腾得出脑子来「懂意思」&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-11&lt;/span&gt;二语阅读的教学含义（作者定版七项）：大词汇、抓主旨、看篇章、练流利、养策略、海量读、融内容&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-12&lt;/span&gt;会说话 = 两件本事：一件是「嘴跟得上」（生产技能），一件是「脑子跟得上场面」（互动技能）&lt;/div&gt;&lt;div class=&quot;it&quot;&gt;&lt;span class=&quot;id&quot;&gt;TM-13&lt;/span&gt;口语任务的设计谱系：信息差、交际游戏、模拟、项目——任务的「条件」决定练到哪族技能&lt;/div&gt;&lt;/div&gt;&lt;/body&gt;&lt;/html&gt;" style="display:none"></iframe><iframe id="f-gr" srcdoc="&lt;!DOCTYPE html&gt;
