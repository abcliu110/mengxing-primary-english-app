&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 语音与拼读组（S-01 – S-19）&lt;/span&gt;
&lt;h1&gt;声音工坊&lt;/h1&gt;
&lt;p&gt;这个领域没有一条包打天下的总规律——专家老实交代：它靠三条真依据组织起来。硬编总规律，反而是假规律。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;本组组织原则（纲领明示「无单一机制」）：&lt;/b&gt;① 系统拼读——字母与声音的对应是统计倾向，按证据教学；② 语音本体——重音、弱读、节奏有自己的实情；③ 真实音变史——发音的「为什么」去历史里找，不编口诀。三条依据各管一摊，下面五屏逐条展开。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;rules&quot;&gt;拼读主线&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;road&quot;&gt;认词之路&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;ears&quot;&gt;耳朵先行&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;weak&quot;&gt;弱读重音&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;hist&quot;&gt;声音的历史&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏1 拼读主线 S-01 S-06 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-rules&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;30&quot; width=&quot;40&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;c&lt;/text&gt;&lt;rect x=&quot;76&quot; y=&quot;30&quot; width=&quot;40&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;96&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;a&lt;/text&gt;&lt;rect x=&quot;134&quot; y=&quot;30&quot; width=&quot;40&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;154&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;19&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;t&lt;/text&gt;&lt;path d=&quot;M38 76 v10 M96 76 v10 M154 76 v10&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;38&quot; y=&quot;103&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;/k/&lt;/text&gt;&lt;text x=&quot;96&quot; y=&quot;103&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;/æ/&lt;/text&gt;&lt;text x=&quot;154&quot; y=&quot;103&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;/t/&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;56&quot; font-size=&quot;13&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;→ cat&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先把字母和声音一对一对学清楚，越早学会拼，后面读得越顺（S-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：英语拼写是「深正字法」，对应关系成百上千；只有按计划显性教完，孩子拼新词时才有可调用的规则库存，而不是靠猜图、猜上下文。这是全领域证据最硬的一条：38 项实验的元分析总效应 d=0.41，一年级开始 d=0.55，教学结束后效果仍保持。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;最稳层&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;c→/k/、a→/æ/、t→/t/（cat）｜ s→/s/、i→/ɪ/、p→/p/（sit）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;先教一致性最高的一批对应——它们在低年级文本里几乎不翻车，是拼读主线的第一段（S-06）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 主线之外，还有一批「变脸」的&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;变脸名单&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;ea 在 beach 里读 /iː/，在 bread 里读 /e/；ough 一家更是人人不同&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一字母组合在不同词里读法不同——不是孩子没学好，是英语拼写保存了好几层历史（盎格鲁-撒克逊、诺曼法语、拉丁希腊借词各带一套）。这类词不编口诀，进「变脸名单」逐个记（S-06）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 名单不是记一次就完&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;滚动更新&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;低年级：ea、词尾 -er 先入名单；高年级：学术词多了，词源层变多，名单继续加&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;对应的一致性随年级而变，变脸名单要随学段滚动更新（S-06 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：统一口诀 vs 统计倾向&lt;/b&gt; —— 「ea 一律读长音 /iː/」这样的口诀说得太满，读到 bread 当场翻车。真实的对应是「多半如此」：主线按最稳的教，例外进名单——承认统计倾向，比假装有定律更符合语言事实（S-06）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;系统拼读 ≠ 只教拼读（见「认词之路」S-07）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;字母知识 + 音素意识是地基&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;变脸名单：ea / ough / -er …&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;小明背了「ea 读长音」的口诀，读 beach 很顺，读 bread 却卡住——不是他忘了口诀，是 bread 本来就在变脸名单里。把 bread 请进名单单独记住，下次见面直接认，这才是 S-06 给的正解。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏2 认词之路 S-02 S-03 S-04 S-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-road&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;82&quot; width=&quot;52&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;rect x=&quot;68&quot; y=&quot;60&quot; width=&quot;52&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#d4e6f2&quot;/&gt;&lt;rect x=&quot;128&quot; y=&quot;38&quot; width=&quot;52&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#bcd9ef&quot;/&gt;&lt;rect x=&quot;188&quot; y=&quot;16&quot; width=&quot;52&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;34&quot; y=&quot;99&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;看图猜&lt;/text&gt;&lt;text x=&quot;94&quot; y=&quot;77&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#2f5f8f&quot;&gt;首尾字母&lt;/text&gt;&lt;text x=&quot;154&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#2f5f8f&quot;&gt;逐字母拼&lt;/text&gt;&lt;text x=&quot;214&quot; y=&quot;33&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;成块认词&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;认词像上楼梯：先看样子猜，再认头一个字母，然后每个字母都能拼，最后看到词块一下就认出来（S-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Ehri 阶段论）：每个台阶由当时掌握的字母知识决定——连接是部分的，就只能部分解码；连接成块（词族、词缀、音节），才能处理多音节词。台阶是渐进重叠的，不是某天突然跳级。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;台阶 1–2&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;看图和上下文猜词；只看 c…t，分不清是 cat 还是 cut&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;首尾字母 + 猜，是「部分连接」阶段的真实样子：能猜对一部分，也注定有一部分猜不出（S-03）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 连接补全了，词就「焊」住了&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;台阶 3&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;c-a-t 逐字母拼出读音，拼写—读音—词义三样「焊」成一个整体（S-02）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这叫正字法映射：不是把词形拍成照片背下来，而是每个字母和声音对上号。对上号的词换了字体、大小写照样认得出；sword 只有 w 不发音，其余部分照样可以这样记。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 每拼对一次，就是给自己上了一课&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;台阶 4&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;-ight 一家：night、light、right 看到词块一眼认出（S-03）；自己拼对的生词，读过几次就变熟词（S-04）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Share 的假词实验证明：亲口「读出来」本身就会产生正字法学习——解码是阅读的「自我教学」机器。生词多到不可能逐个教，全靠这台机器自转；前提是孩子真的在读，不读，机器空转。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;诚实提醒：会拼 ≠ 会读懂（S-07）&lt;/b&gt; —— 阅读 = 认词 × 听懂，两套能力。认词再准，口语词汇和背景知识跟不上，照样读不懂；任何一项接近零，理解就接近零。拼读管「认词」这一半，另一半靠听说和阅读量。（「简单阅读观」的公式归属 Gough &amp;amp; Tunmer 1986 本次未核到一手页，标&lt;b&gt;待核&lt;/b&gt;，乘积框架以 Castles 等 2018 综述为准。）&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;阶段按主导策略分，同个孩子可混用&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;汉语拼音经验会改变早期台阶的样子&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Share 说发展是逐词积累、Ehri 说有台阶——教学结论兼容（分歧如实注）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏3 耳朵先行 S-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-ears&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;25&quot; y=&quot;26&quot; width=&quot;88&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;69&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;c-at&lt;/text&gt;&lt;rect x=&quot;137&quot; y=&quot;26&quot; width=&quot;88&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;181&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;h-at&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; fill=&quot;#f2b134&quot; font-weight=&quot;800&quot;&gt;♪&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;先听出「一家人」（押韵），再拆出每个小声音&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;c-a-t → /k/ /æ/ /t/&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;耳朵学声音是先听出大块（哪个词和哪个词押韵），再听出小块（每个小声音）（S-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：音节天然分成首音（onset）和韵脚（rime）；学前儿童对韵脚的敏感先于音素意识出现。纵向研究证明：学前的押韵敏感度，在控制智力与词汇之后，仍能预测后来的阅读成绩。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;大块&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;cat / hat / mat 是一家人；听得出谁和谁押韵，谁是「插队的」&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;押韵、头韵这类大单位的听辨游戏，是拼读教学的前奏——先把耳朵练到能分「块」（S-05）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 大块还能直接用来读新词&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;类比&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;会读 beak，遇到 peak 先试着押同样的韵——初学者会自发这样读生词&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Goswami 的线索词实验证明：孩子凭「同韵脚同拼法」的类比读新词，这是真实存在的阅读策略（S-05）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 但类比有边界，最后还要落到单个音&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;小块&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;把 cat 拆成 /k/–/æ/–/t/ 三个音素，逐个听得出、拼得回&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：韵脚类比只覆盖拼法一致的词族，-ea 一家这类异读韵脚会让类比翻车，必须配变脸名单；而形成熟词最终要靠音素级映射（S-02）。两条路径的课时配比学界尚无定论——Goswami 重韵脚、Ehri/NRP 重音素，主流共识是「韵脚打底、音素必需」，本屏如实并置。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：先个后块是反的&lt;/b&gt; —— 一上来就要求幼儿分辨单个音素，违背听觉发展的顺序：先有「块」再有「个」。教学顺序照发展顺序排：押韵游戏 → 首音—韵脚 → 音素拆分（S-05）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;押韵怪词游戏（rhyme oddity）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;头韵听辨&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;类比读词：beak → peak&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏4 弱读与重音 S-08 S-09 S-11 S-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-weak&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;20&quot; y=&quot;52&quot; font-size=&quot;14&quot; fill=&quot;#b7c3ca&quot;&gt;I&lt;/text&gt;&lt;text x=&quot;45&quot; y=&quot;52&quot; font-size=&quot;15&quot; fill=&quot;#b7c3ca&quot;&gt;want&lt;/text&gt;&lt;text x=&quot;105&quot; y=&quot;52&quot; font-size=&quot;12&quot; fill=&quot;#b7c3ca&quot;&gt;tə&lt;/text&gt;&lt;text x=&quot;132&quot; y=&quot;52&quot; font-size=&quot;15&quot; fill=&quot;#b7c3ca&quot;&gt;go&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;26&quot; width=&quot;66&quot; height=&quot;36&quot; rx=&quot;9&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;201&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;800&quot; fill=&quot;#5c4300&quot;&gt;HOME&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;小词缩成 /ə/，重点词被踩下重拍&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;about 的 a、teacher 的 -er 都是 /ə/&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;英语里最常见的声音是个懒懒的「呃」——不重要的音节，元音都会变成它；小词钻进句子里还会变小声、变短（S-08 / S-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：英语重音系统要求非重读音节「省力」，元音向中央靠拢并缩短，统统走向 /ə/（schwa）——它是弱读系统的总出口。听力里「听不清小词」，多半不是生词，是没认出弱式。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;含糊音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;&lt;b&gt;a&lt;/b&gt;bout 的 a、teach&lt;b&gt;er&lt;/b&gt; 的 -er、Chin&lt;b&gt;a&lt;/b&gt; 的 a，全读 /ə/&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;schwa 是口语英语里频率最高的元音，多数多音节词至少含一个。边界：它只出现在非重读音节，重读的音节永远不读 /ə/；美式词尾 -er 带 r 色彩，标注要分开（S-08）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 小词有两副嗓子&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;强弱式&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a、the、to、can：单独念是强式，进了句子多半读弱式&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;功能词不带新信息，句子把它们降级处理。强式只留给强调、对比、句末和单独回答。教学口径：先求「听得出弱式」，产出不强求全弱读；慢速朗读、逐词听写时用强式完全正确（S-09）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 句子的重音是「划重点」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;句重音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I said &lt;b&gt;HER&lt;/b&gt; book, not yours.——重音前移，意思立刻变味&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;默认落点是最后一个实词的新信息（核重音）；说话人可以挪动它制造对比。听者靠重音找「这句的新消息」，重音错位就会理解错位。注意：单词内部的重音（PHOtograph）是词的属性、逐词记，和句重音别混教（S-11）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 词和词之间还会「重新组队」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;连读&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;an apple 听起来像 a-napple：前词的尾巴辅音搬去给后词当开头&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;连读不是读快了糊在一起，是音节在语流里重新切分（辅音优先给后一音节当首音）。这是听力断句困难的结构原因。先解决「听得出边界」，低年级不要求处处连读；停顿、强调时本来就不连（S-12）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧如实注：弱读要不要苦练？&lt;/b&gt; 英式语音教学传统把弱式列为必修（听力绕不开）；Jenkins 的通用语核心（S-13）却把弱式列为&lt;b&gt;非核心&lt;/b&gt;——国际交际里弱读反而降低可懂度。两说冲突点在对比台展开，本 app 现行口径：听辨保留、产出降格。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;schwa /ə/：弱读总出口&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;核重音：找新消息&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;连读、同化、省音：语流三件套&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏5 声音的历史 S-15..S-19 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hist&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;20&quot; y1=&quot;62&quot; x2=&quot;230&quot; y2=&quot;62&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;45&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;125&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;62&quot; r=&quot;7&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;拼写被印刷固定&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;读音大搬家&lt;/text&gt;&lt;text x=&quot;205&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;今天的「对不上」&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;字母是化石：声音先变，字母留了下来&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;有些词里藏着「不出声的字母」，它们以前是出声的——声音退休了，字母还留在岗位上（S-19）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：发音的好多「为什么」，答案不在口诀里，在历史里。下面五件都是语言学家考证过的真事，每一件都解释了一批今天的「不规则」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;元音大推移&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;字母 a/e/i 的「名字音」和它们在词里的音对不上（S-15）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;约 1350–1700 年，英语全部长元音链式抬升；而拼写在 15–16 世纪先被印刷固定。时间差 = 今天的一大块「不规则」。边界：它只动长元音，father、broad 等词没跟上，借词 police 是后来的——不能说「所有词都变了」。（推链还是拉链，学界至今有争论，那是成人学术层的事。）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 辅音也整批搬过家&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;格林定律&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;拉丁 piscis 对英语 fish、tres 对 three、canis 对 hound（S-16）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;原始印欧语的塞音在日耳曼语里链式移位：p→f、t→th、k→h。认出「差一格」的方向，就能认出一大批长得不像的亲戚词；保留 p 的，多半是移位之后才借进来的词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 消失的词尾，把元音「传染」了&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;i-变音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;foot→feet、man→men、goose→geese、tooth→teeth、mouse→mice、louse→lice、woman→women（S-17）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;古英语词尾的 /i/ 在消失前把前面的元音拉变了样，只留下变了样的元音当复数标记。现代英语只剩这七组——它们全是高频词，高频正是它们没被 -s 同化的原因。这是给七个怪词的真来历，不是能类推的规则：computer 的复数只能 computers。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两个嘶嘶声相撞，要垫一个音&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;嘶声垫音&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;buses、watches 多出一拍 /ɪ/；wanted 的 -ed 同理读 /ɪd/（S-18）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;词尾是嘶声（/s z ʃ tʃ/ 等）时，后缀的 /s z/ 紧挨着没法读，语言垫进元音 /ɪ/ 隔开。决定读法的是词尾的&lt;b&gt;音&lt;/b&gt;不是字母：judged 拼 -ed 读 /d/，horses 拼 -s 读 /ɪz/。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最后一件：沉默字母有两种来历&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;化石层&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;knight 古时读 /knixt/，k 和 gh 都出声；debt 的 b 却是学者按拉丁语硬塞回去的（S-19）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;一类是音变消失、字母留下（knight）；一类是文艺复兴时「正字」塞回来的（debt）——两类成因要分清，不能一概讲成「以前发音」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：真历史 vs 编口诀&lt;/b&gt; —— 同样是解释「为什么」，一边是可查证的音变（有中古文本、押韵、误拼信件为证），一边是为好记编的故事。本组的规矩：发音的为什么只用真历史，编的故事只能当记忆术、还要标明是编的（S-19 支撑口径）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;七组 i-变音怪词全表（见上）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;-s 三读法 /s/ /z/ /ɪz/&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;-ed 三读法 /t/ /d/ /ɪd/&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台一：发音的第一名，是「像外国人」还是「听得懂」？（S-13 × S-09）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这是本领域最著名的一场专家分歧，两面都摆出来——取舍是课程层的事，不替孩子先下结论。&lt;/p&gt;
&lt;div class=&quot;duo&quot;&gt;
&lt;div class=&quot;cell a&quot;&gt;&lt;span class=&quot;w&quot;&gt;Jenkins「通用语核心」：可懂度优先&lt;/span&gt;基于多国学习者真实交际的失误记录：真正害人听不懂的只有一小撮——多数辅音到位、元音长短分清、辅音丛处理好、核重音放对。&lt;b&gt;/θ ð/ 的精确舌位、词重音、弱式&lt;/b&gt;对可懂度影响小，列为&lt;b&gt;非核心&lt;/b&gt;，不必苦练。&lt;/div&gt;
&lt;div class=&quot;cell b&quot;&gt;&lt;span class=&quot;w&quot;&gt;英式语音教学传统（Roach / 王桂珍体系）：弱式是听力刚需&lt;/span&gt;连贯语流里小词全是弱式，不认弱式就听不懂母语者的正常语速；schwa 与强弱式是教材的固定章节。本 app 的旧 STRESS 库误标（teacher 词尾误标 /ɜːr/）已按弱读口径订正。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:10px&quot;&gt;&lt;h4&gt;本 app 现行口径（纲领裁定）&lt;/h4&gt;&lt;p&gt;听辨上保留弱式教学（听力绕不开），产出上不强求全弱读；同时声明场景边界：若目标是国内考试的听力与朗读评分，标准音特征仍在评分范围内——「可懂度优先」不能被曲解成「发音随便学」。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台二：节奏是一条带子，不是一道选择题（S-10）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;旧说法把语言分成「重音计时 vs 音节计时」两种——实测早已证伪：重音间隔的时长并不恒定。Dauer (1983) 与 Grabe &amp;amp; Low (2002) 的测量（PVI）显示，语言在一条连续带上分布。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;slider&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;left:12%&quot;&gt;汉&lt;/span&gt;&lt;span class=&quot;dot&quot; style=&quot;left:78%&quot;&gt;英&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;sliderlab&quot;&gt;&lt;span&gt;汉语端：音节平均、元音不弱化&lt;/span&gt;&lt;span&gt;英语端：重音说了算、弱音节缩水&lt;/span&gt;&lt;/div&gt;
&lt;p style=&quot;margin-top:10px&quot;&gt;中国孩子读英语「每个音节一样用力」，正是把母语在带子上的位置带进了英语——要练的是往英语端挪：重音踩重拍、弱音节放松缩短。同一人的语速和文体都会让位置滑动，所以这条带是描述工具，&lt;b&gt;不能给孩子贴「你就是音节计时」的标签&lt;/b&gt;。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台三：中国孩子的发音难点，是一张能列出来的清单（S-14）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;难点不在「舌头笨」，在汉语的音系清单和英语不一样。清单能列，就能逐项击破；它用来排教学优先级，不给孩子的发音贴标签——个体差异（听辨、模仿意愿、输入量）会让同一个难点在不同孩子身上程度悬殊。&lt;/p&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;没有的音&lt;/span&gt;&lt;br&gt;/θ ð v/ 汉语里不存在&lt;br&gt;think 易被顶替成 sink / fink&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;没有的词尾&lt;/span&gt;&lt;br&gt;汉语没有词尾辅音群&lt;br&gt;word 的尾巴容易吞音或加元音&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;没有的弱化&lt;/span&gt;&lt;br&gt;汉语音节元音不缩水&lt;br&gt;读英语每节一样用力、听不出弱式&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;发音医院：中国孩子的高频误区&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;以下误区类型均出自汉英音系对比的预测清单与弱读/拼读各条的边界说明。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ think 读成 sink 或 fink&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ /θ/ 是汉语清单里没有的新动作，要单独补练&lt;/span&gt; —— 学习者会不自觉地拿最接近的汉语音顶替（S-14 机制）。这不是舌头笨，是这个音从来没练过；补的是动作，不是态度。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ word 读成「沃——」吞掉词尾，或在词尾辅音群里硬加元音&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 词尾辅音群要专门练「尾巴收干净」&lt;/span&gt; —— 汉语音节结构简单、没有词尾辅音丛，孩子会吞音或垫元音把它「改回」汉语的形状（S-14）。逐项击破：先单练词尾，再放回句子。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 读句子每个音节一样用力，像排队走&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 把节奏往英语端挪：重拍踩重、弱节放松&lt;/span&gt; —— 这是把汉语在节奏连续带上的位置带进了英语（S-10）。练法是先听出哪里是重拍（S-11 的核重音），再让非重读音节缩水成 /ə/（S-08）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ teacher 的词尾读成响亮的 /ɜːr/&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 词尾 -er 在非重读音节读弱化的 /ə/（英式）&lt;/span&gt; —— 本 app 旧库曾把此处误标为 /ɜːr/，已按弱读口径订正（S-08/S-09 纲领裁定）。美式带 r 色彩是另一套标注，不能混。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 拿「ea 读长音」的口诀读 bread，读一个错一个&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ bread 在「变脸名单」里，单独记住，不套口诀&lt;/span&gt; —— 对应是统计倾向不是定律（S-06）。口诀错不在孩子，在口诀本身把话说得太满。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 听力里 a、the、to 总是「听不见」，以为是生词&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 它们多半读的是弱式——小声、短、元音缩成 /ə/&lt;/span&gt; —— 功能词进句子默认降级（S-09）。先专门练「认出弱式」，听力断句会跟着变好；连读让词界重新组队（S-12），也是同一个训练方向。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. about、teacher、China 里都藏着同一个出现最多的元音，它是？（S-08）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;/ə/&quot;&gt;&lt;div class=&quot;opt&quot;&gt;/æ/&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;/ə/&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;/ɑː/&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. foot 的复数是 feet，真正的原因是？（S-17）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;i-变音&quot;&gt;&lt;div class=&quot;opt&quot;&gt;拼写错误&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;随便变的&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;i-变音&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. buses 为什么比 bus 多出一拍声音？（S-18）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;嘶声相撞垫元音&quot;&gt;&lt;div class=&quot;opt&quot;&gt;嘶声相撞垫元音&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;为了好听&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;字母规定的&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. 英语和汉语的节奏关系，正确的说法是？（S-10）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;一条带子的两端&quot;&gt;&lt;div class=&quot;opt&quot;&gt;两个格子&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;一条带子的两端&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;完全一样&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. knight 里的 k，在古代是？（S-19）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;真的发音&quot;&gt;&lt;div class=&quot;opt&quot;&gt;一直不发音&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;真的发音&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;装饰字母&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. 听一句话时，「新消息」一般藏在哪个词上？（S-11）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;被重读的词&quot;&gt;&lt;div class=&quot;opt&quot;&gt;第一个词&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;被重读的词&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;最长的词&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. bread 里的 ea 和 beach 里的 ea 读法不同，正确的学法是？（S-06）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;进变脸名单逐个记&quot;&gt;&lt;div class=&quot;opt&quot;&gt;套统一口诀&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;进变脸名单逐个记&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;跳过不学&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 同构；语音组纲领无单一机制，页首如实写为三条组织原则；节奏按连续统呈现；Jenkins 与弱读传统之争两面并置，最终取舍属课程层裁定；「简单阅读观」公式归属待核已在屏内标注。&lt;br&gt;知识来源：《专家规律总结清单 v1》语音与拼读组 S-01 – S-19（National Reading Panel / Ehri / Share / Goswami / Roach / Jenkins / Dauer / Jespersen / Grimm / 王桂珍 等）。&lt;/div&gt;
&lt;/div&gt;

&lt;h1&gt;说话办事处&lt;/h1&gt;
&lt;p&gt;每句话都在「办一件事」。这个领域同样没有一条总规律——它按言语行为组织，每句回应都要先过三问。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;本组组织原则（纲领明示「无单一机制」）：&lt;/b&gt;内容按「言语行为」排队——一句话是干什么活的；每一句回应合不合格，不看句子本身，先过&lt;b&gt;三问：谁在说？对谁说？上一句说了什么？&lt;/b&gt;（E-08）。下面五屏，从「说话是做事」一路讲到「会说英语是四种本事」。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;acts&quot;&gt;说话是做事&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;chunks&quot;&gt;现成块&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;face&quot;&gt;得体与面子&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;three&quot;&gt;三问检查站&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;four&quot;&gt;四种本事&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏1 说话是做事 E-01 E-02 E-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-acts&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;path d=&quot;M30 20 h150 a14 14 0 0 1 14 14 v26 a14 14 0 0 1 -14 14 h-90 l-28 24 v-24 h-32 a14 14 0 0 1 -14 -14 v-26 a14 14 0 0 1 14 -14z&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;112&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;“It&#x27;s cold here.”&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;同一句话，能办三件不同的事&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说话不只是说出声音，还在「做一件事」：说对不起是在道歉，说请是在请求（E-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Austin 言语行为理论）：同一个句子形式可以做不同的事。判断一句话「对不对」，先看它做的事成没成、合不合场合，而不是只看语法。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;一件三办&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;It&#x27;s cold here.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;可以是陈述（报告温度）、抱怨（这屋子真冷）、也可以是请人关窗的请求。靠语境判定——教孩子的是先问「这句在干什么活」，不是给句子贴死标签（E-01）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 有些话，壳和里不是一回事&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;间接请求&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Can you pass me the salt?&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;字面上问「你能不能」，实际上是请求递盐（Searle 间接言语行为）。英语的请求系统高度依赖这种间接性——「字面对了」常常「用意错了」。边界：紧急场合、亲密关系、明确指令时，直接说才得体，间接不是永远更好（E-02）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 对话能转起来，靠一台推理机&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;合作原则&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;问：「作业写完了吗？」答：「动画片正演到最精彩的地方。」&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;表面答非所问，听者却能反推：他还没写。Grice 说，双方默认彼此满足量（信息够）、质（说真话）、关系（切题）、方式（清楚）四准则；表面违反时，就反推出言外之意。对儿童只取一个习惯：听话时想想「他为什么这样说」（E-03；专家注：关联理论主张用单一「关联」原则替代四准则，本屏按启蒙框架呈现，不表述为一致定论）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：按字面听 vs 先问意图&lt;/b&gt; —— 把 &quot;Can you open the window?&quot; 答成 &quot;Yes, I can.&quot; 然后坐着不动，就是只过了字面关、没过「他想让我做什么」这一关（E-02）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;句子办的活：&lt;span class=&quot;chip&quot;&gt;请求&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;道歉&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;承诺&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;感谢&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;邀请&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;抱怨&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;晚饭时爸爸说：「窗户还开着呢。」妈妈起身把窗关上了。爸爸一个「请」字都没说，事情却办完了——因为妈妈先过的不是字面关，是「他想让我做什么」这一关（E-01 + E-02）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏2 现成块 E-04 E-13 E-15 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-chunks&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;10&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;65&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;Happy birthday!&lt;/text&gt;&lt;rect x=&quot;135&quot; y=&quot;34&quot; width=&quot;100&quot; height=&quot;34&quot; rx=&quot;10&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;text x=&quot;185&quot; y=&quot;56&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;I&#x27;d like a ___&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;整块拿出来用，槽位可以换&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说「生日快乐」「请给我一杯水」时，我们是把整块句子一下子拿出来用的，不是一个词一个词拼的（E-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Wray 程式化序列）：母语者的话有极大比例是整存整取的「现成块」——省加工、保地道。凡事逐词现拼，既慢，又容易拼出语法没错、母语者却不那么说的句子。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;整块存&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;问候、点餐、道别、道谢，先按整句—整块存进记忆&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;日常表达的教学单位因此是「块」，不是单词：先整块会用，再慢慢扩展（E-04）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 块不是死的：学会拆槽位&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;拆槽位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I&#x27;d like a cup of &lt;b&gt;tea&lt;/b&gt;. → 换成 water / juice / coffee&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：只背整块、不拆槽位，会卡在原句上换不了东西；块内哪部分能换、哪部分不能，要显性点出来（E-04 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 对话是两个人轮流搭的&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;相邻对&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;问候—问候、提问—回答、邀请—接受或婉拒（E-13）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;会话分析（Sacks 等）发现：第一句一出现，就预定了第二句的活——该答不答，本身就成了信息。本 app 的对话数据逐轮复核，依据的就是这条结构律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 说错了，先自己改&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;自我修复&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;“I go— I went to the park yesterday.”（E-15）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;对话自带修复功能，而且偏好「自己发现、自己改」。课堂里一出错就打断，既破坏交际流，也剥夺了练修复的机会——前提是这错孩子自己察觉得到；系统性不会的，仍要教。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：逐词拼 vs 整块取&lt;/b&gt; —— 把 &quot;How are you?&quot; 一个词一个词翻译式拼装，永远拼不出母语者的语感；整块存取解决流利与地道，拆槽位解决扩展——两步都要有（E-04）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;现成块：整存整取&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;槽位替换：块的扩展法&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;话轮交接：乒乓球规则&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏3 得体与面子 E-05 E-06 E-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-face&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;path d=&quot;M60 78 a40 40 0 1 1 52 -32&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;86&quot; cy=&quot;52&quot; r=&quot;5&quot; fill=&quot;#22303c&quot;/&gt;&lt;path d=&quot;M72 66 q14 10 28 0&quot; fill=&quot;none&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;140&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;183&quot; y=&quot;52&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#96690a&quot;&gt;请求越大&lt;/text&gt;&lt;text x=&quot;183&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#96690a&quot;&gt;缓冲越厚&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;礼貌 = 替对方的面子留余地&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;要请别人帮越大的忙，说话就要越客气：先垫一句话、把命令改成商量，给人家留个台阶（E-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Brown &amp;amp; Levinson 面子理论）：请求天然「压人」，说话人按三件事估算分量——关系远近（D）、身份高低（P）、事情大小（R）；分量越大，越用间接、商量、致歉开场来补偿。英语的 Could you...? / Would you mind...? 成为默认请求式，就是这套权衡的固定结果。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先认清 stakes&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;场合错了，人家觉得你「人不好」（E-05）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Thomas 的发现：听者对语法错天然宽容（知道你在学），对语用失误却归因为人品和态度；而且语用失误没有「报错信号」，孩子往往长期不自知——所以得体必须专门教，不能等它自然好。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 失误分两种，药不一样&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;两类失误&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;① 现成说法用错了（形式配错）② 句子没错、场合判错了（规矩不懂）（E-06）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;第一种给公式就能纠；第二种根子在文化判断，要把场合的逻辑讲明。真实失误里两种常交织，分类是诊断工具，不是给孩子贴的标签。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 客气程度是一把滑动尺&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;称分量&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;借一块橡皮 → “Lend me your rubber.” 也过得去；借相机一周 → “Could I possibly borrow your camera for a week?”&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一件事，对象换成老师、事情变大，缓冲就自动加厚。边界：亲密关系里过度客气反而见外——对好朋友说 Would you mind...? 就是把尺滑过头了（E-07 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧如实注：&lt;/b&gt;面子理论的「普适性」受东亚学者批评——中国礼貌研究另有顾曰国「礼貌五准则」等本土框架；三变量的估算方式也因文化而异（中国语境里年龄、辈分权重更高）。教学中两说并置，儿童层只取共识部分：&lt;b&gt;客气随场合滑动&lt;/b&gt;（E-07）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;缓冲件：商量问句&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;缓冲件：致歉开场&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;缓冲件：先垫一句&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;D + P + R：客气称重公式&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏4 三问检查站 E-08 E-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-three&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;30&quot; width=&quot;66&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;47&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;谁在说？&lt;/text&gt;&lt;text x=&quot;47&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;角色&lt;/text&gt;&lt;rect x=&quot;92&quot; y=&quot;30&quot; width=&quot;66&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;对谁说？&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;对象与场合&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;30&quot; width=&quot;66&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;203&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;上一句？&lt;/text&gt;&lt;text x=&quot;203&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;状态与所指&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;三问全过，回应才算成立&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一句话说得对不对，要看是谁说的、对谁说的、前面的人说了什么——脱了这三样，谁也判断不了（E-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Hymes「得体」维 + Canale &amp;amp; Swain 社会语言能力）：得体是关系判断，不是形式判断。本 app 把这三问定为每条对话数据的生产规范——审查中发现的 29 条表达错误，26 条正是脱离语境的机械收尾，全栽在这一屏。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;问角色&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;&quot;It tastes good.&quot; 食客说，是夸奖；服务员自己说，是角色错位&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一句话，换个人说就变味——先确认说话人的身份与立场（E-08）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 再问上文&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;问所指&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;&quot;The same to you.&quot; 只有上文有人先祝福你，它才成立&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;too、the same 这类回指句，必须在上文有被回指的对象；没有上文就机械接这句，等于指着空气说话（E-08）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最大的坑：把汉语规矩搬进英语&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;防迁移&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;被夸奖回 “No, no.” 的自谦式回应；把「您慢走」一个词一个词直译过去（E-09）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;社交-语用迁移：形式上是英语，规矩上是汉语，在英语听者处被读成「否定对方的判断」或无所指的空客套。边界：迁移不是全错，不少致谢、道歉的基本结构两语通用——只指出已知的高频错位点，不搞「中文习惯全盘可疑」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：句子对 ≠ 回应成立&lt;/b&gt; —— 一句语法完美的回答，可能因为角色错位、没有回指对象而整体不成立。检查顺序永远是：先过三问，再看语法（E-08）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;高频错位点清单：&lt;span class=&quot;chip&quot;&gt;夸奖回应（自谦式）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;称呼长辈的方式&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;迂回拒绝直译&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;机械收尾句&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏5 四种本事 E-10 E-11 E-12 E-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-four&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;45&quot; y=&quot;14&quot; width=&quot;76&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;83&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;语法&lt;/text&gt;&lt;rect x=&quot;129&quot; y=&quot;14&quot; width=&quot;76&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;167&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;得体&lt;/text&gt;&lt;rect x=&quot;45&quot; y=&quot;62&quot; width=&quot;76&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;83&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;成篇&lt;/text&gt;&lt;rect x=&quot;129&quot; y=&quot;62&quot; width=&quot;76&quot; height=&quot;40&quot; rx=&quot;9&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;167&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;卡壳自救&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;会英语不只是句子没错，还要说得合场合、能连着说好几句、卡住时有办法绕过去（E-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Canale &amp;amp; Swain 交际能力四分）：语法、社会语言（得体）、语篇（连缀成篇）、策略（补救中断）——四者缺一，真实交际就塌一块。语法只占四分之一。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;自救本事&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;求生句：“How do you say … in English?” / “I mean …” / “It&#x27;s like a …”（E-11）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;策略能力把「补救」定义为本事本身：母语者也天天换述、迂回、求助。边界：策略是过桥工具，不能代替词汇句型的积累，全靠比划过不了精确表达的场合。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 得体不会自己长出来&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;专门教&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;语法学得再好的人，也会说错场合的话（E-12）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Kasper &amp;amp; Rose 的总结论：语用发展不随语法自动跟进；接受显性教学（规矩讲明 + 情境练习）的学习者，进步显著快于只靠浸泡的。这是表达域坚持显性讲场合的证据基础。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 教的核心动作：把注意力引过去&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;注意到&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;同一个场景两种说法并排一放，规矩立刻显形（E-14）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Schmidt 注意假说：输入只有被有意识「注意到」，才可能被学走；语用规矩藏在语境里最隐蔽，听一百遍也可能没看见。对低龄儿童，「注意」靠情境对比和戏剧化呈现引出，不靠讲术语。（专家注：强式注意假说有争议，本条按弱式采用——注意到越多，学得越多。）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：浸泡自然会 vs 显性教更快&lt;/b&gt; —— 把孩子放进英语环境「泡」，语法会长，得体不会自动长（E-12）；而泡的前提仍是注意到（E-14）。所以表达教学的动作是：设计对比 → 引出注意 → 情境里练，而不是单纯增加浸泡时长。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;语篇能力（小学段：连贯说 3–5 句）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;求生句清单&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;显性教 + 情境练&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台一：客气是一把滑动尺，不是一个开关（E-07 / E-02）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;同一件「请人递盐」，按关系和场合从左到右逐级加厚。滑到哪一格，由 D（距离）+ P（身份）+ R（事情大小）称出来。&lt;/p&gt;
&lt;div class=&quot;ladder&quot;&gt;
&lt;div class=&quot;rung&quot; style=&quot;background:#fdeeee&quot;&gt;① 命令式：&lt;span class=&quot;en&quot; style=&quot;font-weight:700&quot;&gt;Pass me the salt.&lt;/span&gt; —— 只在亲密、紧急或上下级明确时才不刺耳&lt;/div&gt;
&lt;div class=&quot;rung&quot; style=&quot;background:#fdf6ec&quot;&gt;② 直接问句：&lt;span class=&quot;en&quot; style=&quot;font-weight:700&quot;&gt;Can you pass me the salt?&lt;/span&gt; —— 壳是问能力，里是请求，日常餐桌的安全档&lt;/div&gt;
&lt;div class=&quot;rung&quot; style=&quot;background:#eef7ee&quot;&gt;③ 商量问句：&lt;span class=&quot;en&quot; style=&quot;font-weight:700&quot;&gt;Could you pass me the salt, please?&lt;/span&gt; —— could 比 can 再软一档，默认请求式&lt;/div&gt;
&lt;div class=&quot;rung&quot; style=&quot;background:#e2f2e4&quot;&gt;④ 致歉开场 + 商量：&lt;span class=&quot;en&quot; style=&quot;font-weight:700&quot;&gt;Sorry to bother you — would you mind passing me the salt?&lt;/span&gt; —— 对象是长辈、场合正式时用满格&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:10px&quot;&gt;&lt;p&gt;滑过头也是失误：对天天见面的同桌用第 ④ 格，会显得见外（E-07 边界）。客气的学问不在「越客气越好」，在「称准分量」。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台二：直译翻车现场（E-09）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;三句都是「汉语客套跟着人出了国」——形式是英语，规矩是汉语。&lt;/p&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;被夸奖&lt;/span&gt;&lt;br&gt;直译：&lt;span style=&quot;color:#b33636;font-weight:700&quot;&gt;No, no, my English is poor.&lt;/span&gt;&lt;br&gt;英语听感：你在否定我的判断&lt;br&gt;地道：&lt;b&gt;Thank you!&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;邀请&lt;/span&gt;&lt;br&gt;直译：&lt;span style=&quot;color:#b33636;font-weight:700&quot;&gt;You must come to my home.&lt;/span&gt;&lt;br&gt;英语听感：命令，不是邀请&lt;br&gt;地道：&lt;b&gt;Would you like to come?&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;送别&lt;/span&gt;&lt;br&gt;直译：&lt;span style=&quot;color:#b33636;font-weight:700&quot;&gt;Walk slowly!&lt;/span&gt;（慢走直译）&lt;br&gt;英语听感：没头没尾的空话&lt;br&gt;地道：&lt;b&gt;Take care! / See you!&lt;/b&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台三：同一句 “The same to you”，一对一错（E-08）&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;✓ 成立&lt;/h4&gt;&lt;p&gt;A：&lt;span class=&quot;en&quot;&gt;&quot;Happy New Year!&quot;&lt;/span&gt; B：&lt;span class=&quot;en&quot;&gt;&quot;The same to you!&quot;&lt;/span&gt; —— 上文有祝福可回指，所指问过关。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;✗ 不成立&lt;/h4&gt;&lt;p&gt;A：&lt;span class=&quot;en&quot;&gt;&quot;I&#x27;m sorry I&#x27;m late.&quot;&lt;/span&gt; B：&lt;span class=&quot;en&quot;&gt;&quot;The same to you.&quot;&lt;/span&gt; —— 上文没有任何可回指的东西，机械收尾——正是本 app 审查中订正掉的那一类错误（26 条同类）。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;失误医院：语用失误专诊&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这些错语法上大多挑不出毛病，病全在场合与规矩（E-05：这类错更伤人，还没人提醒你）。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 对老师说：“Give me your book.”&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ “Could I borrow your book, please?”&lt;/span&gt; —— 对老师（P 大）用命令式请求，威胁面子又没缓冲（E-07）。换成商量问句，就是把客气称到了位。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 被夸 “Your English is great!” 答：“No, no.”&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ “Thank you! I&#x27;m glad to hear that.”&lt;/span&gt; —— 自谦式回应是汉语程式，搬进英语会被读成否定对方判断（E-09）。英语的默认对子是接受 + 致谢（E-13）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 任何对话结尾都接一句 “The same to you.”&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 先过所指问：上文有可回指的内容才用它&lt;/span&gt; —— 没有回指对象的收尾是空转（E-08）。本 app 审查的 29 条表达错误里 26 条属于这一类机械收尾。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 邀请同学：“You must come to my home tomorrow.”&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ “Would you like to come to my home tomorrow?”&lt;/span&gt; —— must 是命令的壳，邀请要把选择权留给对方（E-07：给面子留余地）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 请同桌递橡皮：“Would you mind possibly passing me the rubber?”&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ “Pass me the rubber, please.” 就够了&lt;/span&gt; —— 小事、熟人，客气滑过头反而见外（E-07 边界，何自然所举同类例子）。客气要称分量，不是堆得越多越好。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 问 “Where is Tom?” 答 “The classroom door is open.”——这不是乱答&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是「话里有话」：暗示 Tom 应该就在教室附近&lt;/span&gt; —— 表面违反「切题」准则，听者按合作原则反推出言外之意（E-03）。把它当乱答批改，恰恰错过了语用理解的训练点。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. “Can you open the window?” 这句话真正在办什么事？（E-02）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;请求&quot;&gt;&lt;div class=&quot;opt&quot;&gt;考能力&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;请求&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;聊天&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. 请人帮忙时，哪种情况要最客气？（E-07）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;请校长帮大忙&quot;&gt;&lt;div class=&quot;opt&quot;&gt;请同桌递橡皮&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;请校长帮大忙&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;请弟弟拿水杯&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. 判断一句回应合不合，先看哪三样？（E-08）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;角色对象上文&quot;&gt;&lt;div class=&quot;opt&quot;&gt;单词难不难&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;句子长不长&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;角色对象上文&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. 哪种错更伤人、还更难被察觉？（E-05）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;场合错&quot;&gt;&lt;div class=&quot;opt&quot;&gt;拼写错&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;场合错&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;发音错&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. 说话卡住、想不起一个词，最好的办法是？（E-11）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;换个说法绕过去&quot;&gt;&lt;div class=&quot;opt&quot;&gt;停下来不说&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;换个说法绕过去&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;直接说中文&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. “Happy birthday!” 为什么能脱口而出？（E-04）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;整块存取&quot;&gt;&lt;div class=&quot;opt&quot;&gt;逐词拼的&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;整块存取&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;猜的&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. 你问了问题，对方沉默不答——这说明什么？（E-13）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;不答本身是信息&quot;&gt;&lt;div class=&quot;opt&quot;&gt;他没听见&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不答本身是信息&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;对话结束了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：与介词组 v2 同构；表达组纲领无单一机制，页首如实写为组织原则与三问规范；面子理论的普适性分歧已在屏内如实标注，两说并置。&lt;br&gt;知识来源：《专家规律总结清单 v1》日常表达与语用组 E-01 – E-15（Austin / Searle / Grice / Wray / Thomas / Brown &amp;amp; Levinson / Hymes / Canale &amp;amp; Swain / Sacks 等 / Schmidt / Kasper &amp;amp; Rose / 何自然 等）。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
 document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
 const f=document.getElementById(b.dataset.f);

const WHY={&#x27;请求&#x27;:&#x27;对了：壳是问能力，里是请求——先过「他想让我做什么」这一关。&#x27;,&#x27;请校长帮大忙&#x27;:&#x27;对了：距离远、身份高、事情大（D+P+R 最大），缓冲要最厚。&#x27;,&#x27;角色对象上文&#x27;:&#x27;对了：谁在说、对谁说、上一句说了什么——三问就是得体的检查站。&#x27;,&#x27;场合错&#x27;:&#x27;对了：语法错被原谅，场合错会被记到人品账上。&#x27;,&#x27;换个说法绕过去&#x27;:&#x27;对了：换述、比方、求助都是策略能力，卡壳不是失败。&#x27;,&#x27;整块存取&#x27;:&#x27;对了：现成块整存整取，所以又快又地道。&#x27;,&#x27;不答本身是信息&#x27;:&#x27;对了：相邻对里该答不答，沉默就成了回答。&#x27;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{

  fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：回上面对应的那一屏，看机制再答一次。&#x27;;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 写作组（W-01 – W-15）&lt;/span&gt;
&lt;h1&gt;小作家工作室&lt;/h1&gt;
&lt;p&gt;写作，是请一位不在场的读者，到你脑子里看一幅画。公式和句型只是帮你递画的支架，不是画本身。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;本组核心（纲领功能目的式总纲）：&lt;/b&gt;写作和说话最大的不同，是读者不在你面前——每个信息都要用文字亲手交到他眼前（W-01）。其余十四条，都是为这一件事服务的：过程怎么转、支架怎么扶又怎么撤、什么方法有证据、什么承诺是假的。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;reader&quot;&gt;读者在心里&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;loop&quot;&gt;想写改转圈&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;continue&quot;&gt;接着写&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;scaffold&quot;&gt;输出与支架&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;evidence&quot;&gt;证据清单&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏1 读者在心里 W-01 W-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-reader&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;52&quot; cy=&quot;48&quot; r=&quot;24&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M38 44 l10 -12 8 8 6 -6 10 14z&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;198&quot; cy=&quot;48&quot; r=&quot;24&quot; fill=&quot;#fbfdfd&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;198&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; fill=&quot;#b7c3ca&quot;&gt;?&lt;/text&gt;&lt;path d=&quot;M82 48 h84&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5a6b78&quot;&gt;只有文字能过桥&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;作者脑里有画，读者脑里空白&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;写作文的时候，读者看不见你心里想的画面；你不写出来，他就不知道（W-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Flower「以写者为中心 vs 以读者为中心」）：说话有表情、手势、现场实物兜底，写作把这些全部撤掉，只剩文字。新手最典型的毛病，是自己懂、读者懵——把口头交际的兜底错带进了写作。读者意识，是区分新手与熟手最稳定的变量之一。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;交代清&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;谁、哪一个、什么顺序、为什么——指代要交代，顺序要排好，因果要说出声&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;心里想着「就是那个人嘛」写下去，读者却不知道「那个人」是谁。每个信息都要亲手递到读者眼前（W-01）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 「想到什么写什么」不是病，是阶段&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;发展阶段&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;把知道的事一件件顺次写下来 = 「知识讲述」，是儿童的默认模式（W-03）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Bereiter &amp;amp; Scardamalia 的双模型：从「知识讲述」长到「边写边想清楚」（知识转化），要在内容和修辞之间反复协商，需要很多年。小学生作文像流水账，是阶段问题，不是态度问题——先求写得出、写得顺，再逐步加「回看时问读者懂不懂」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：写给自己懂 vs 写给不在场的人懂&lt;/b&gt; —— 日记、私人记录不适用本条；低龄孩子的读者起初就是老师和家长，先有「写给具体某个人看」的经验，再慢慢抽象到「不在场的读者」（W-01 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;读者意识：新手熟手的分水岭&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;知识讲述 → 知识转化&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;纲领语：请读者看一幅画&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;小华写：「他把那个给她了，她很高兴。」老师问：他是谁？那个是什么？——小华脑里全有，纸上全无。补上名字和东西之后，读者脑里的画才亮起来。这就是 W-01 的日常样子。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏2 想写改转圈 W-02 W-04 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-loop&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;34&quot; r=&quot;20&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;想&lt;/text&gt;&lt;circle cx=&quot;168&quot; cy=&quot;34&quot; r=&quot;20&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;168&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;写&lt;/text&gt;&lt;circle cx=&quot;119&quot; cy=&quot;82&quot; r=&quot;20&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;119&quot; y=&quot;87&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;改&lt;/text&gt;&lt;path d=&quot;M94 30 q22 -8 48 0&quot; fill=&quot;none&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M156 52 q6 18 -14 26&quot; fill=&quot;none&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M96 84 q-24 -4 -30 -26&quot; fill=&quot;none&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;不是流水线，是转圈圈&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;写作文不是先想完再写、写完再改；是边想边写边改，转来转去（W-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Flower &amp;amp; Hayes 认知过程模型）：真实写作中，计划、落笔、回看三件事在「监控器」调度下任意互相嵌入——写着冒出新想法就回去改计划，改着就重写整段。把写作教成「列提纲→抄正→交卷」的流水线，恰恰砍掉了熟手最核心的回环。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;回环&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;写到一半发现开头要换、改着改着冒出更好的情节——都正常，而且是好事&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;高手的回环是带着目标切换；教学要给的是每个环节可用的小策略，而不是只宣布「可以来回改」（W-02 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 修改分两层，顺序不能反&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;先意思&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;第一遍只问：故事讲清了吗？读者跟得上吗？段落该删的删、该挪的挪（W-04）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;专家修改以内容结构为主，新手却全耗在表面纠错上。先精修字词，等于给要拆的房子刷漆——段落一删，全白改。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最后才轮到表面&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;后字词&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;意思层定稿后，再查拼写、标点、句子对不对&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;低年级的「修订」只落到加一句、调顺序这类微动作，不搞大手术；考试限时作文里两层要压缩合并，本条是学习过程的默认顺序，不是考场死规矩（W-04 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：流水线 vs 回环&lt;/b&gt; —— 「先列提纲、再抄正、最后交卷」看着整齐，却把写作最核心的来回切换砍掉了；过程写作法正是从这个模型长出来的教法（W-02）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;计划 / 转化 / 回顾 + 监控器&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;高层修订先于表面修订&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;过程写作法&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏3 接着写 W-05 W-06 W-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-continue&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;24&quot; width=&quot;96&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22685e&quot;&gt;范文开头&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22685e&quot;&gt;（读懂它）&lt;/text&gt;&lt;path d=&quot;M122 54 h26&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;4&quot;/&gt;&lt;rect x=&quot;156&quot; y=&quot;24&quot; width=&quot;76&quot; height=&quot;60&quot; rx=&quot;8&quot; fill=&quot;#fff&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&lt;text x=&quot;194&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot;&gt;你续写的&lt;/text&gt;&lt;text x=&quot;194&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot;&gt;（被拉高）&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;理解的水位，把产出往上拉&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先读一段写得好的故事，再接着往下编；读过的句子会悄悄跑到你的笔下，文章就变好了（W-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（王初明「协同 / 拉平」效应）：理解能力天然高于产出能力；续写任务迫使你的产出与刚读到的文本对齐，理解便把产出往上拉。配套原则叫「学伴用随」——语言必须伴着恰当语境一起学、用，孤立背的句型，写的时候调不出来。这一方法已有系列实证，并已进入高考英语的读后续写题型。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;续写&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;读一段好文章 → 顺着它的势往下写，内容和语言都被原文「带着走」&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：原文难度要与水平匹配，太难则无从协同；小学段用简化形态——看图 + 短文起头，续写几句即可（W-05）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 分工原则：一样自己发明，一样先借&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;模仿&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;内容要创造，语言要模仿（W-06）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;初学者资源有限，内容和语言同时创新必然互相抢。把语言一头托管给范文句式，资源全留给「写什么」。反过来操作，就会写出「想法平庸、句子奇葩」。边界：模仿是过渡态，长期只借不化会形成腔调依赖，高年级要逐步改写、重组。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 课堂顺序也可以反过来：先写，再学&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;产出先行&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;先布置一个「写不好」的真实任务 → 撞见缺口 → 再给范文和句型（W-11）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是文秋芳产出导向法（POA）的顺序思想：先尝试、先饥饿，再精准投喂输入，治的正是「学用分离」。&lt;b&gt;适配待验（如实标注）：&lt;/b&gt;POA 原体系的对象是中高级学习者（大学、高中为主），向小学段迁移目前没有直接实证——本 app 只取「产出先行」的顺序思想，流程本体不照搬。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：先学后用 vs 先用带学&lt;/b&gt; —— 先输入后输出的老顺序，常导致输入与产出脱钩、学了不会用（W-11 针对的病灶）；但零基础者要先给足输入再谈输出，顺序的适用有前提，不是一律倒置（W-07 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;读后续写（王初明）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;学伴用随&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;POA 顺序思想（适配待验）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏4 输出与支架 W-07 W-10 W-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-scaffold&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;path d=&quot;M50 96 V44 l24 0 v52 M96 96 V30 l24 0 v66 M142 96 V52 l24 0 v44&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M30 96 h190&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M180 96 l26 -34&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;194&quot; y=&quot;52&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;支架撤掉&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#7c8a94&quot;&gt;扶着走是暂时的，松开手才是学会&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;有很多词，听的时候都懂，一到自己写就卡住；卡住的地方，就是你要学的新东西（W-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Swain 输出假说）：理解可以走语义捷径跳过语法，产出被迫进行句法加工；当你发现「想说的说不准」，就注意到了知识里的缺口，继而在后续输入中定向捕捉、试写检验——输出不只是练习，是进步的扳机。（专家分歧如实注：Krashen 主张可理解输入已足够、输出只是结果；Swain 以沉浸式教学数据反驳。主流取中间立场：输入是必要条件，输出是加速与精确化机制，本屏按此呈现。）&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;缺口&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;写不出来 ≠ 没学好；写不出来恰恰标出了「下一课在哪」&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;前提：已有一定输入储备、任务难度适中。零基础先给输入，顺序不可倒置（W-07 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 缺口靠支架补，但支架有任期&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;支架&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;句子框架、范文、师生共构都是临时拐杖；撤掉还能写，才算学会（W-10）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Gibbons 的教学循环：建立话题知识 → 示范文体 → 师生共同建构 → 学生独立写作——一条有起有终的坡道。撤除节奏因人而异，靠平时表现判断，没有固定周数。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 还有一种卡，是手把脑子堵住了&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;基本功&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;每个字都要想半天怎么写，就没力气想故事了（W-12）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;写作时工作记忆同时扛内容和转录（书写、拼写、造句）；转录不自动化，就会持续抢资源，表现为「想得出、写不出、写着写着忘了要说什么」。练法：把手写、拼写、句子构造练到流利——但要嵌在真实写作里练，脱离写作的纯抄写量效比低。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：一直扶着 vs 用完要撤&lt;/b&gt; —— 长期套框架写，撤掉就空白，说明支架没完成它的使命；支架的价值不在「扶得稳」，在「撤得掉」（W-10）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;注意到缺口（输出三功能之一）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;最近发展区&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;转录流利度（IES 推荐 3）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 屏5 证据清单 W-08 W-09 W-13 W-14 W-15 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-evidence&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;14&quot; width=&quot;140&quot; height=&quot;88&quot; rx=&quot;10&quot; fill=&quot;#fff&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;证据清单（小学段）&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;58&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot;&gt;✓ 天天写 ✓ 教过程&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;76&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot;&gt;✓ 练基本功 ✓ 写作圈&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;94&quot; font-size=&quot;11.5&quot; fill=&quot;#b33636&quot;&gt;✗ 套公式保满分 —— 无证据&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;每天都写一点、学会想—写—改的办法、把字和句子练顺、和小伙伴互相读作文——这四件事是被很多研究证明有用的（W-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：小学段有官方级循证指南（美国教育科学研究院 IES 实践指南，Graham 主持）把推荐按证据强度排了队；年龄再大一点，Writing Next 元分析给了 11 个有效素的排序。写作这一域，难得地有「清单 + 证据等级」可查。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;小学四推荐&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;天天写、教写作过程（强证据）、练基本功流利度（中等证据）、建写作共同体（W-08）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;证据多来自英语母语课堂，「每天一小时」的配比不能照搬中国课时，需压缩适配；证据等级是 2012 年评审口径，后续研究仍在累积。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 大孩子的数据里，第一名是它&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;策略第一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;教「写作策略」（想什么、怎么办、怎么查）效应排第一，其后：范文研读、句子合并、同伴合作（W-09）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;结论：教方法比多布置更能改变写作质量。边界：样本以高年级为主，向低段外推要降阶；效应依赖实施质量，不是把策略名字写进教材就生效。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两个能立刻上手的单项&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;单项训练&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;句子合并：两个短句拼一个长句（W-13）；衔接词：给读者的路标，必须对准逻辑（W-14）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;句子合并绕开语法术语、直接用产出练句法，是证据最干净的单项之一；但长句不是目的，读者看得见、跟得上才是。路标同理：then 管时序、because 管因果、but 管转折，贴错地方比没有更糟。（W-14 待核标注：其经典出处 Halliday &amp;amp; Hasan《Cohesion in English》1976 本次未打开一手页，机制表述与 E-10 语篇能力相衔，先行采用、引文待补核。）&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;诚实底线（W-15）：没有任何研究支持「套公式保满分」&lt;/b&gt; —— 正规元分析只报告效应量（平均提升多少），从不承诺个体分数。能涨分的是「显性策略 + 足量练习 + 形成性反馈」的组合。结构支架本身有用（见上一屏），但把支架宣传成保分工具，是把手段冒充因果，本组明令清除。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;本屏亲戚：&lt;span class=&quot;chip&quot;&gt;IES 小学写作指南（2012）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Writing Next 元分析（2007）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;SRSD 自我调节策略&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台一：「讲述」和「转化」，是阶段不是对错（W-03）&lt;/h2&gt;
&lt;div class=&quot;duo&quot;&gt;
&lt;div class=&quot;cell&quot; style=&quot;background:#f2f6fb;border:1.5px solid #c9dcee&quot;&gt;&lt;span class=&quot;w&quot;&gt;知识讲述（儿童默认）&lt;/span&gt;想到什么写什么，顺次检索、写下、不回头。不是偷懒，是低负荷的合理策略；简单记录类任务里，成人也用它。&lt;/div&gt;
&lt;div class=&quot;cell&quot; style=&quot;background:#fdf6ec;border:1.5px solid #ecd9ae&quot;&gt;&lt;span class=&quot;w&quot;&gt;知识转化（慢慢长出）&lt;/span&gt;边写边在「内容」和「读者」之间协商，写作本身会改主意。需要很多年，靠「回看时问读者懂不懂」这类小动作逐步引入。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:10px&quot;&gt;&lt;p&gt;教学含义：拿转化标准去苛责低龄儿童是错位；放任高年级一直停在讲述层，同样是错位。阶段论给的是顺序感，不是判决书。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台二：句子合并演示（W-13）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;不改变意思，只操练句法工具——从句、并列、修饰，像搭积木一样把短句攒成长句。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;合并前&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;en&quot;&gt;The dog ran. The dog was fast. The dog was happy.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;合并后（说法不止一种）&lt;/h4&gt;&lt;p&gt;&lt;span class=&quot;en&quot;&gt;The fast, happy dog ran.&lt;/span&gt; ／ &lt;span class=&quot;en&quot;&gt;The dog ran fast and happily.&lt;/span&gt; —— 提醒：合并练的是操作，不自动改善内容；长句不是目的，读者跟得上才是（与 W-01 配套）。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台三：这个承诺，能不能信？（W-15）&lt;/h2&gt;
&lt;div class=&quot;duo&quot;&gt;
&lt;div class=&quot;cell a&quot;&gt;&lt;span class=&quot;w&quot;&gt;✗ 保分话术（清除对象）&lt;/span&gt;「套这个公式，95% 的考场作文逃不出三大母题」「背熟模板保满分」——伪造的统计、保证性的承诺，在循证文献里根本不存在这种表述。&lt;/div&gt;
&lt;div class=&quot;cell b&quot;&gt;&lt;span class=&quot;w&quot;&gt;✓ 证据表述（本组口径）&lt;/span&gt;「策略教学在元分析中效应居前」「这项推荐证据强度为中等」——只报告效应量与证据等级，不承诺任何人的分数。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;作文医院：中式作文的典型毛病&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这些毛病在批改里天天见，但按本组的机制看，多数不是「不用心」，是阶段、顺序或支架的问题。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 通篇流水账：一件接一件，平铺直叙&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 先别判「不用心」——这是知识讲述阶段的正常形态（W-03）&lt;/span&gt; —— 处方分两步：先让讲述流畅（写得出、写得顺），再引入一个小动作：回看时问一句「读者到这里懂不懂？」转化从这里开始长。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ “He gave it to him, and he was happy.” 读者全程懵&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 指代全交代：谁、把什么、给谁，逐样写出（W-01）&lt;/span&gt; —— 作者脑里有画、纸上没画。把 he/it/him 换回名字和实物，读者脑里的画立刻亮起来。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ although、moreover 一顿硬塞，逻辑却对不上&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 路标宁少勿错：先有逻辑，再贴词（W-14）&lt;/span&gt; —— 衔接词是给读者的路标，必须对准真实关系；贴错方向比没有路标更糟。儿童写作中先求 then/because/but 用准，再谈丰富。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 每个字都抠过、没有错字，主线却还是乱的&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 修改顺序反了：先改意思层，最后才改字词层（W-04）&lt;/span&gt; —— 先给要拆的房子刷了漆。第一遍只看故事清不清楚、段落顺不顺，字词纠错留到最后一遍。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 全篇范文腔，框架一撤就一个字也写不出&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 支架到期未撤 + 模仿只借未化（W-10 / W-06）&lt;/span&gt; —— 回到教学循环的后半程：师生共构之后必须安排独立写作；模仿的句子要逐步要求改写、重组，长成自己的说法。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 写着写着忘了下一句——「想得出，写不出」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 是转录把工作记忆堵住了（W-12）&lt;/span&gt; —— 在作文里嵌入基本功训练：把高频词拼写、常用句构造练到不用想，给内容腾出脑力。脱离写作的纯抄写效果差，不用加量。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. 写作和说话最大的不同是什么？（W-01）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;读者不在场&quot;&gt;&lt;div class=&quot;opt&quot;&gt;要用笔&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;读者不在场&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不能改&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. 改作文时，应该先改什么？（W-04）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;意思清不清楚&quot;&gt;&lt;div class=&quot;opt&quot;&gt;有没有错字&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;意思清不清楚&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;字写得好不好&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. 写不出来、卡住了，说明什么？（W-07）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;缺口被照出来了&quot;&gt;&lt;div class=&quot;opt&quot;&gt;没天赋&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;缺口被照出来了&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;白学了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. 范文和句子框架，本质上是？（W-10）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;用完要撤的支架&quot;&gt;&lt;div class=&quot;opt&quot;&gt;考试模板&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;用完要撤的支架&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;背得越多越好&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. 下面哪句话不可信？（W-15）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;套公式保满分&quot;&gt;&lt;div class=&quot;opt&quot;&gt;多写多改有帮助&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;套公式保满分&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;策略教学有效&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. then、because、but 这类词的作用是？（W-14）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;给读者的路标&quot;&gt;&lt;div class=&quot;opt&quot;&gt;装饰门面&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;凑字数&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;给读者的路标&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. 读后续写为什么能让文章变好？（W-05）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;理解把产出拉高&quot;&gt;&lt;div class=&quot;opt&quot;&gt;可以抄原文&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;理解把产出拉高&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;字数变多了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：与介词组 v2 同构；写作组以纲领核心（请读者看一幅画）为页首总纲；W-11 产出导向法只取顺序思想并标注「适配待验」；W-14 衔接理论原典标待核已在屏内注明；W-15 保分话术作为诚实底线单列。&lt;br&gt;知识来源：《专家规律总结清单 v1》写作组 W-01 – W-15（Flower / Flower &amp;amp; Hayes / Bereiter &amp;amp; Scardamalia / 王初明 / 文秋芳 / Swain / Graham 等 IES 指南与 Writing Next / Gibbons 等）。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{

 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);

 b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;

const WHY={&#x27;读者不在场&#x27;:&#x27;对了：没有表情手势兜底，每个信息都要用文字亲手递过去。&#x27;,&#x27;意思清不清楚&#x27;:&#x27;对了：先改意思层，最后改字词层——顺序不能反。&#x27;,&#x27;缺口被照出来了&#x27;:&#x27;对了：注意到缺口是进步的扳机，它标出了下一课在哪。&#x27;,&#x27;用完要撤的支架&#x27;:&#x27;对了：支架撤掉还能写，才算学会。&#x27;,&#x27;套公式保满分&#x27;:&#x27;对了：这种保证性承诺没有任何研究支持，是本组的诚实底线。&#x27;,&#x27;给读者的路标&#x27;:&#x27;对了：路标必须对准真实的逻辑关系，贴错比没有更糟。&#x27;,&#x27;理解把产出拉高&#x27;:&#x27;对了：理解能力高于产出，续写让理解把产出「拉平」上去。&#x27;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{

  fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：回上面对应的那一屏，看机制再答一次。&#x27;;
 }));
