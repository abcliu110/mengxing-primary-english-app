&lt;!-- C-01 + C-03 看法 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-view&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;24&quot; width=&quot;104&quot; height=&quot;66&quot; rx=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#e4572e&quot;/&gt;&lt;circle cx=&quot;76&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;57&quot; r=&quot;11&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;看成一个个 → 能数&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;24&quot; width=&quot;104&quot; height=&quot;66&quot; rx=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;ellipse cx=&quot;192&quot; cy=&quot;62&quot; rx=&quot;38&quot; ry=&quot;18&quot; fill=&quot;#e8d9a8&quot;/&gt;&lt;circle cx=&quot;172&quot; cy=&quot;56&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;190&quot; cy=&quot;64&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;206&quot; cy=&quot;55&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;70&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;circle cx=&quot;180&quot; cy=&quot;67&quot; r=&quot;2.6&quot; fill=&quot;#b89b3e&quot;/&gt;&lt;text x=&quot;192&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;看成一摊 → 借单位数&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;数不数得清，先看你怎么看：看成一个一个的，就能数；看成一摊、一堆的，就不能直接数，要借杯子、碗来帮忙数。（C-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这叫「识解」——同一件东西，说话人可以给它换不同的看法（取景）：把「一个个」算进图里，就是可数；只看一整摊，就是不可数。语法形式是看法的回执，不是物体自带的属性标签。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;C-01 注记（口径，务必看清）：&lt;/b&gt;专家说的「有界」，指的是&lt;b&gt;取景时有没有把限界算进这幅图&lt;/b&gt;，和物体有没有物理边框无关——湖里的水有岸，water 照样不可数；moment 没有任何形状，照样可数。学界（Nicolas 等）还批评过：有界既不是可数的充分条件、也不是必要条件。所以本组把「有界」定位为&lt;b&gt;主导判据 + 教学入口，不是定义&lt;/b&gt;；个别名词到底可不可数，最终以英语的习惯用法为准。&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;反例 1&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;rice&lt;/span&gt; 一粒一粒分得清清楚楚，却不可数；&lt;span class=&quot;en&quot;&gt;furniture&lt;/span&gt; 件件有形，却不可数。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;如果可数看物理形状，这两个词当场就解释不通——「物理边界说」正是这样被证伪的（它只许以错误身份出现在病句医院里）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 「界」可以是心里设的，不必锋利&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-03&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a season / a tummy&lt;/span&gt;——季节、肚子的边糊里糊涂，照样说得出「一个」。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;界是认知上设定的：把一段东西当成一个整体单位来指，单位性就成立，其锐利程度不影响。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一物体，两种看法都合法&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;预告&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a glass&lt;/span&gt;（一只杯子）/ &lt;span class=&quot;en&quot;&gt;glass&lt;/span&gt;（玻璃这种料）——同一个词双读。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;看法能当场切换，语法就跟着翻面——这是下一屏「换看法」的主题（C-04）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker《认知语法》 (1987；通俗定版 2008 第 5 章）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Nicolas 等对有界充要性的批评（纲领 basis 登记）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-02 + C-15 一摊料 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-mass&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M40 74 Q40 44 75 44 L165 44 Q200 44 200 74 L200 82 L40 82 Z&quot; fill=&quot;#e8a84c&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;44&quot; x2=&quot;120&quot; y2=&quot;82&quot; stroke=&quot;#fff&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;bread&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;还是 bread&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;切成多少份，每一份都还是它&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一滴水也是水，一小块面包也是面包——切多少份都还是它，这样的东西不能一个一个数。（C-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这类东西靠「质」被认出来，不靠「形」：随便拿一小份，都自带全套识别特征。所以语言不给它配 a 和 -s，要数就借单位切开来数。这条判据叫「同质」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-02&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;water / wood / bread&lt;/span&gt;——任意取一小份，性质和整体完全相同。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同质性一次预测三件事：没有复数、切开不变名、用量词时配 much 不配 many。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 有个著名的例外要说清&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;例外&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;rice、sand&lt;/span&gt; 颗粒明明看得见，却被整摊处理（登记号 xc-rice-grains）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这说明判据是英语的「习惯打包」：同质性压过可辨性——不是对每粒米验算一遍，而是整类一起看成一摊。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 摸不着的东西，同一条路&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-15&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;homework / information / advice&lt;/span&gt; 没有形状可切，被整类打包成「一类事」。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;要说「一条建议」，同样借单位：a piece of advice。抽象名词继承了物质名词的全部语法待遇：无 a、无 -s、借单位、配 much。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;「切一切看看」只是演示法，对部分物质名词有效，本项目已把它降格为帮助记忆的小演示（mnemonic），&lt;b&gt;不许称它为定律&lt;/b&gt;（C-02 分歧栏）。另外，个别抽象名词有专门的可数读法（如 works 表示「著作」），属词条级约定，逐词登记，不类推。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker (2008: 133） 以 wood 立论的同质性原例&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型例外登记 xc-rice-grains / xc-homework-uncuttable&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;妈妈把面包切成四片，弟弟问：「现在它变成四个面包了吗？」姐姐说：「不对——每一片都还是面包，只是四&lt;b&gt;片&lt;/b&gt;面包。」数的是「片」，不是面包本身。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-04 + C-05 换看法 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-switch&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;path d=&quot;M52 38 L84 38 L80 88 Q78 96 68 96 Q58 96 56 88 Z&quot; fill=&quot;#f2b134&quot; opacity=&quot;.85&quot;/&gt;&lt;path d=&quot;M102 38 L134 38 L130 88 Q128 96 118 96 Q108 96 106 88 Z&quot; fill=&quot;#f2b134&quot; opacity=&quot;.85&quot;/&gt;&lt;text x=&quot;93&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;two beers = 两杯/瓶&lt;/text&gt;&lt;ellipse cx=&quot;205&quot; cy=&quot;76&quot; rx=&quot;42&quot; ry=&quot;16&quot; fill=&quot;#d94f4f&quot; opacity=&quot;.75&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#22303c&quot;&gt;苹果 → 果泥：一摊&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;同一样东西，换个看法就换个说法：苹果看成一摊果泥就不能数了；啤酒按「一杯一杯」看，又能数了。（C-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：两个方向相反的操作——「磨成料」抹去个体、只留质料；「分作份」借容器或惯例份量，临时给料装上边界。两个操作都证明：语法跟着当下的看法走，不跟词的「终身标签」走。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-04&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;two beers / two coffees&lt;/span&gt;——餐馆里说的是两杯、两瓶。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这是省略读法：复数 -s 其实落在被省略的单位（杯）上（登记号 xc-two-coffees）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 反方向：磨成料&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-04&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;整个的苹果能数；打成一摊果泥，就只能当料看。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;磨碎方向多是修辞、非常规语境：儿童阶段只作理解、不作产出要求；要练的是「分作份」这个方向。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 分作份的工具：借单位&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-05&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a bowl of rice / two pieces of paper&lt;/span&gt;——复数加在 bowl、pieces 上，不加在料上。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;汉语是现成的老师：「一碗饭、两张纸」用的正是同一套办法——先借单位切成有界的份，再数。可以直接搬过来的正迁移。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;边界与待核：&lt;/b&gt;单位词有自己的搭配习惯（a piece of advice，不能说 a bowl of advice），须逐个登记。单位词作为独立语法系统的类型学出处是 Aikhenvald《Classifiers》(2000)——&lt;b&gt;书目为通行引用，但清单编制时未打开原文页，标「待核」&lt;/b&gt;，入模前复核（C-05）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker grinding / portioning 论述 (2008)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Aikhenvald《Classifiers》(2000，待核）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;纲领 coreView：汉语量词正迁移&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-06 + C-14 a --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-a&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M120 18 L146 62 L94 62 Z&quot; fill=&quot;#f7d774&quot; opacity=&quot;.55&quot;/&gt;&lt;ellipse cx=&quot;120&quot; cy=&quot;96&quot; rx=&quot;52&quot; ry=&quot;12&quot; fill=&quot;#f7d774&quot; opacity=&quot;.35&quot;/&gt;&lt;circle cx=&quot;104&quot; cy=&quot;92&quot; r=&quot;8&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;124&quot; cy=&quot;95&quot; r=&quot;8&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;circle cx=&quot;142&quot; cy=&quot;91&quot; r=&quot;8&quot; fill=&quot;#e4572e&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;灯光只够认出「是哪一类」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说 a 的时候，是在说「随便哪一个都行，我说的就是这种东西里的一个」。（C-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：a 只要求听者做到最低一档——「认出是哪一类」（type identifiable）。所以第一次提到、任选其一、说职业身份，都用 a。它是给听者的最低限度定位指令。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-06&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have a dog.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;第一次提起：你认出「是狗这一类」就够了，不必知道是哪一只。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 类别身份也是 a&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-06&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She is a teacher.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;说的是「她属于教师这一类」，还是类别定位——与首次提及是同一个机制，不是例外。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ a 的双胞胎：看声音不看字母&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-14&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;an hour ✓&lt;/span&gt;（h 不发音，开头是元音声）　&lt;span class=&quot;en&quot;&gt;a university ✓&lt;/span&gt;（开头读 /j/，是辅音声）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;a 和 an 是同一个词：它本是古英语 ān「一」，元音前保留 an 垫着读，辅音前弱化成 a。判据永远是读音，不是字母。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel, Hedberg &amp;amp; Zacharski 给定性等级 (1993)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型主张 cl-a-etym：a/an &amp;lt; 古英语 ān（词源以 OED 为准）&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-07 + C-08 the --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-the&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;path d=&quot;M120 14 L152 66 L88 66 Z&quot; fill=&quot;#f7d774&quot; opacity=&quot;.8&quot;/&gt;&lt;ellipse cx=&quot;120&quot; cy=&quot;98&quot; rx=&quot;56&quot; ry=&quot;12&quot; fill=&quot;#f7d774&quot; opacity=&quot;.5&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;94&quot; r=&quot;10&quot; fill=&quot;#e4572e&quot;/&gt;&lt;circle cx=&quot;82&quot; cy=&quot;98&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;97&quot; r=&quot;7&quot; fill=&quot;#b9c6ce&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;80&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;线索够了，灯锁定唯一那一个&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说 the 的时候，是在说「就是那一个，你知道的」——对方得能一下子找到它。（C-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：the 要求对方能「唯一定位」（uniquely identifiable）。说 the 就等于发出信号：「线索已经够了，你应该找得到。」听者定位不到，就是误用。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;路一 · 上文提过&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have a dog. The dog is white.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;刚说过的那一只，第二句就能定位——回指。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;路二 · 关联带出&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a wedding → the bride&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;提到婚礼，新娘自动被「带出来」。习得研究显示：五条路里这一条最晚学会（Liu &amp;amp; Gleason 2002)。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;路三 · 修饰语锁定&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;the book on the desk&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「桌上的那本」当场把范围收成唯一。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;路四 · 眼前情境&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Pass me the salt.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;盐就在桌上，看得见，就定位得到——不用上文。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;路五 · 常识唯一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;the sun / the moon&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;全世界只有一个的东西，人人都能定位。五路皆无，就不能用 the（C-08）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;the 的核心是什么，学界争了上百年——「熟悉说」（听者必须早已熟悉它）对「唯一说」（唯一可定位即可）。Lyons (1999) 的裁定是两说各覆盖一部分，用上位概念「可辨识性」综合。教学只取综合说的一句话：对方能不能找到是哪一个（C-07）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel et al. (1993)：the = 可唯一辨识级&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Hawkins《Definiteness and Indefiniteness》(1978) 定位理论与五路分类&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Lyons《Definiteness》(1999)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-19 + C-09 + C-10 替对方想 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hearer&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;circle cx=&quot;52&quot; cy=&quot;52&quot; r=&quot;17&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;说话人（我）&lt;/text&gt;&lt;circle cx=&quot;208&quot; cy=&quot;52&quot; r=&quot;17&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;听者（对方）&lt;/text&gt;&lt;path d=&quot;M74 46 Q130 22 184 44&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;circle cx=&quot;130&quot; cy=&quot;34&quot; r=&quot;11&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;?&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;说话前先算一笔账：对方找得到吗？&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说英语的时候要多想一步：「我说的这个东西，对方找得到吗？」把答案用小词标出来，听的人才不迷路。（C-19）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：a / the / 零 的选择，本质是说话人替听者算账：不停估算对方的定位状态，再把答案标在句子表面。汉语把这笔账记在语境里，英语把它写出来——这正是中国学生最不习惯的地方。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-09&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I saw the dog yesterday.&lt;/span&gt;（其实是第一次遇见的一只狗）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;特征性错误。初学者不是乱猜，而是用了另一套切分：把 the 发给「我心里有具体所指」的名词——心里有 ≠ 对方能定位。这叫波动假说：先按「具体」选，积累够了才切换到英语的切分。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两股力叠加成指纹&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-10&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;中国学生的冠词错误居名词短语错误前列，形态高度集中：&lt;span class=&quot;en&quot;&gt;该加不加（漏）&lt;/span&gt; + &lt;span class=&quot;en&quot;&gt;the 泛化到泛指（滥）&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;漏，来自汉语没有冠词这个范畴；滥，来自按具体性补位（C-09）。两个病因叠在一起，就是这张错误指纹（CLEC 语料）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 教学顺序：先立槽位&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-10&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;低段先立一条规矩：&lt;span class=&quot;en&quot;&gt;单数可数名词前面必须站一个小词&lt;/span&gt;（a / the / this / my…）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;先解决「有没有」，再解决「选哪个」——槽位意识是第一步（C-10 边界）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;波动假说有个替代解释（Deprez、Sleeman 等）：早期按具体性选，也许只是因为冠词词条没学全、语用原则先行，不必诉诸先天参数。两说对教学的处方一致——大量带听者信息的语境输入。另注：波动证据来自成人被试，儿童的波动形态与时长需要本项目自己验证（C-09 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Gundel et al. 给定性等级 (1993) / Prince 熟悉度量表 (1981)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Ionin, Ko &amp;amp; Wexler 波动假说 (2004)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;桂诗春、杨惠中 CLEC (2003)&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-11 + C-12 两读法 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-dual&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;34&quot; y=&quot;36&quot; width=&quot;76&quot; height=&quot;52&quot; rx=&quot;4&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M28 38 L72 14 L116 38&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;the school = 那栋楼&lt;/text&gt;&lt;circle cx=&quot;188&quot; cy=&quot;46&quot; r=&quot;15&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;168&quot; y=&quot;66&quot; width=&quot;40&quot; height=&quot;26&quot; rx=&quot;4&quot; fill=&quot;#3d9e50&quot;/&gt;&lt;text x=&quot;188&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot;&gt;school = 上学这件事&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;go to school 是「去上学」（做事），go to the school 是「去那所学校」（去一栋楼）——加不加 the，看你说的是事还是楼。（C-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这是识解切换在冠词上的又一回执——表示「去做那件事」时，名词被看成一种活动（类型层），脱去了个体性，自然零冠词；表示实物时回到个体层，冠词按 a/the 的规矩正常运作。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-11&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;go to school / go to bed&lt;/span&gt;（做事） vs &lt;span class=&quot;en&quot;&gt;go to the school&lt;/span&gt;（去楼）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;英式英语里成套对立（in prison / in the prison）证明这是系统性的读法切换，不是个别例外。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 但它只是倾向，不是铁律&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;美式英语住院说 &lt;span class=&quot;en&quot;&gt;in the hospital&lt;/span&gt;（登记号 xc-hospital-us）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;凡是机制推不出的，一律按约定单记，不许编理由——这是本项目的铁律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 约定存货：整串整记&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-12&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;play the piano ✓　play football ✓（不加 the)&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;乐器加 the、球类不加，是历史沉淀的约定，机制只能解释一部分。好在两类各自成串（乐器串、球类串），内部高度一致，按串整记即可。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;反面教材（审查史）：&lt;/b&gt;旧库曾为 on foot 编造「双脚踩地所以接触」的伪因果，已被裁定删除——编一个假理由，代价是错误机制到处扩散。约定就是约定，注明「这里没有为什么」，才是诚实教法（C-12)。&lt;b&gt;待核：&lt;/b&gt;Swan《Practical English Usage》冠词条目持同一处理口径，清单编制时未打开该书页面，条目编号待核（C-12)。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;模型主张 cl-zero-func（倾向型）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Master《The English Article System》(1997) 教学框架&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;例外登记 xc-hospital-us / xc-piano&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-13 类指 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-generic&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a tiger&lt;/span&gt;&lt;br&gt;任取一只&lt;br&gt;代表全类&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;the tiger&lt;/span&gt;&lt;br&gt;把物种当作&lt;br&gt;一个整体&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;tigers&lt;/span&gt;&lt;br&gt;整类敞开说&lt;br&gt;零冠词复数&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;child&quot;&gt;介绍一种动物有三台摄像机：一只代表大家、把全种当成一个大家伙、或者一群一起上镜——选哪台，句子就不一样。（C-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：类指是识解在「类别层」的运作——a 用一只样本例示全类，the 把类别本身当成一个整体个体，零冠词复数直接以整类为指称。三种形式不是随便换的同义词，是三种取景。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;样本机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;A tiger has stripes.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;随便哪只老虎都有条纹——属性对任一样本成立时，用 a。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 谓词能验出分工&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;整体机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The tiger is endangered. ✓&lt;/span&gt;　&lt;span class=&quot;en&quot;&gt;*A tiger is endangered. ✗&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「濒危」是整个物种的属性，不是一只样本的属性——这时只能把物种当整体，用 the。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 小学阶段的主力&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;整类机位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Tigers are strong.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;边界：小学主教零冠词复数和 a 类指；the 类指只登记、作高年级内容。不能因为它，就推翻 C-07「the 是定位那一个」的主读法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Lyons《Definiteness》(1999) 类指系统讨论&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模型例外登记 xc-generic-the&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- C-16 + C-17 + C-18 总开关 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-master&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;120&quot; viewBox=&quot;0 0 260 120&quot;&gt;&lt;rect x=&quot;106&quot; y=&quot;44&quot; width=&quot;48&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;circle cx=&quot;141&quot; cy=&quot;57&quot; r=&quot;10&quot; fill=&quot;#fff&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;总开关：识解（C-01）&lt;/text&gt;&lt;circle cx=&quot;46&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;46&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;冠词&lt;/text&gt;&lt;circle cx=&quot;130&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;复数 -s&lt;/text&gt;&lt;circle cx=&quot;214&quot; cy=&quot;92&quot; r=&quot;10&quot; fill=&quot;#f7d774&quot;/&gt;&lt;text x=&quot;214&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot;&gt;many / much&lt;/text&gt;&lt;path d=&quot;M118 70 L52 84 M130 70 L130 80 M142 70 L208 84&quot; stroke=&quot;#b9c6ce&quot; stroke-width=&quot;2&quot;/&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先决定东西是「一个个」还是「一摊」：一个个的用 many/few，一摊的用 much/little——开关只有一个，灯有好几盏。（C-17）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：量化词、复数 -s、冠词，都是同一个识解总开关的下游出口。量怎么选、章盖在哪，都不取决于词本身，只取决于东西当前被看成什么。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;C-17&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;many chickens&lt;/span&gt;（鸡只，一个个）/ &lt;span class=&quot;en&quot;&gt;much chicken&lt;/span&gt;（鸡肉，一摊）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个 chicken，量化词随读法当场翻转——这是「量化跟识解走」最干净的证据（模型 ex-chicken）。a lot of 两边通吃，是因为它绕过了识解标记。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ -s 是「复制章」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;C-18&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;*waters、*rices ✗&lt;/span&gt;（日常义）；&lt;span class=&quot;en&quot;&gt;two bottles of water ✓&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;-s 的语义是「同一个有界单位被复制了多份」。料没有单位可复制，所以章盖不上——先借单位，章盖在单位上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 一致也是回执&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;C-16&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;My family is big.&lt;/span&gt;（看成一个单位）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;family、team、class 指「一群互连的成员」：看成整体，动词用单数；看成成员们，英式可用复数。边界：police、people 只有复数待遇，是词条级约定，单记，不自由切换。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧（如实登记）：&lt;/b&gt;less / fewer 之争——描写派（Quirk 等）认为 less + 复数可数名词在非正式语体可接受；规范派（考试口径）要求必须 fewer。处理：&lt;b&gt;教学守考试口径，教师知识取描写口径&lt;/b&gt;，阅读中承认 less 的口语存在即可（C-17）。另注：-s 还有三单、所有格等同形用法，机制不同、教学分轨，不用本屏的「复制章」去解释三单（C-18 边界）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;出处：&lt;span class=&quot;chip&quot;&gt;Langacker 可数域参数组：有界 / 同质 / 可扩展 / 可复制 (2002/2008)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Quirk et al.《综合语法》(1985) 量化描写&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：同一物，两种看法&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;可数与不可数之争，十有八九是「看错了图」。先定看法，再选形式（C-01 / C-04）。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：双生活名词——一个词，两种活法&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;cake&lt;/span&gt;&lt;br&gt;a cake 一整个蛋糕&lt;br&gt;some cake 一些蛋糕（料）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;glass&lt;/span&gt;&lt;br&gt;a glass 一只杯子&lt;br&gt;glass 玻璃（料）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;chicken&lt;/span&gt;&lt;br&gt;chickens 鸡只&lt;br&gt;chicken 鸡肉&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;词没有「终身标签」：每一句里，它当前被看成哪种，语法就按哪种走（模型 cl-whole-material）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：单数可数名词，前面必须站一个「小门卫」（C-10）&lt;/h4&gt;
&lt;p&gt;单独一个可数名词出门，前面必须有词占位：&lt;span class=&quot;en&quot;&gt;a dog / the dog / this dog / my dog&lt;/span&gt; 都可以，唯独不能空着。先把这条槽位规矩立住，漏用型错误就断了大半；至于门卫选 a 还是 the，再回到「对方能不能定位」慢慢练。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：借单位「价目表」——单位搭配逐个登记（C-05）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a bowl of&lt;/span&gt;&lt;br&gt;rice 饭&lt;br&gt;（盛饭的单位）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;a piece of&lt;/span&gt;&lt;br&gt;paper / advice&lt;br&gt;（张、条的单位）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;two bottles of&lt;/span&gt;&lt;br&gt;water&lt;br&gt;（装水的单位）&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;单位不是随便抓的：饭用碗、建议用 piece，说 &lt;span class=&quot;en&quot;&gt;*a bowl of advice&lt;/span&gt; 就错了。单位清单逐条登记，不许类推乱配（C-05 边界）。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：冠词错误分型治疗（C-20）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;冠词错误分三型，三种病、三种药：&lt;b&gt;漏用&lt;/b&gt;（缺槽位意识，药是立规矩）→ &lt;b&gt;the 滥用&lt;/b&gt;（按具体性选词，药是换判据到「对方能否定位」）→ &lt;b&gt;a/the 替换&lt;/b&gt;（定位判断摇摆，药是五路线索训练）。干预就按这个顺序来；不分型地「多练冠词」，效率最低。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have dog.（漏用型）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I have a dog.&lt;/span&gt; —— 单数可数名词前缺了占位的小词。病因：汉语没有冠词范畴，位置「默认空白」（C-10）。先立槽位规矩，再谈选词。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He gave me an information.（漏用型 · 抽象名词）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ a piece of information&lt;/span&gt; —— information 被整类打包成「一类事」，不能直接配 a（C-15）；要数，借单位 piece（C-05）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The dogs are lovely animals.（滥用型 · 泛指）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Dogs are lovely animals.&lt;/span&gt; —— 这里是敞开说整个类，用零冠词复数（C-13）。the 被泛化到泛指上，是中国学生的典型「滥」（C-10）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Yesterday I saw the dog in the park. It was white.（替换型 · 波动）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ a dog&lt;/span&gt; —— 向听者第一次提起，听者无从定位。说话人心里有具体那只，不等于听者找得到——判据要换到「对方能否定位」（C-09）。第二句起再用 the dog。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Tom goes to the school every day.（读法型 · 活动与实物）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ goes to school&lt;/span&gt; —— 说的是「上学」这件事（活动读法），零冠词；加了 the，就变成每天去「那栋楼」了（C-11）。（若真是去那栋楼办事，the 才对。）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 「断言」：rice 一粒一粒分得清，所以 rice 是可数名词，可以说 two rices。&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;cf6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;cf6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这是已被证伪的「物理边界说」。&lt;/span&gt; —— 可数看的是习惯看法，不是物理颗粒：rice 颗粒分明，英语仍把它整摊看（C-01 / C-02，例外登记 xc-rice-grains）。数米饭要借单位：two bowls of rice（C-05）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. 数米饭：I want two ___ of rice.&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;bowls&quot; data-why=&quot;对了：料不能直接数，借单位；-s 落在单位 bowls 上（C-05）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;rices&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;bowls&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;much&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. Pass me ___ salt, please.（盐就在餐桌上）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;the&quot; data-why=&quot;对了：眼前情境这条路让听者能唯一定位（C-08 路四）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. ___ tiger has stripes.（任取一只，代表全类）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;A&quot; data-why=&quot;对了：样本机位——属性对任一样本都成立，用 a 类指（C-13）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;A&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;The&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. How ___ water do you drink every day?&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;much&quot; data-why=&quot;对了：water 被看成一摊，量化用 much——总开关在起作用（C-17）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;many&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;much&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;few&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. 哪个搭配对？（看声音，不看字母）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;an hour&quot; data-why=&quot;对了：hour 的 h 不发音，开头是元音声，用 an（C-14）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a hour&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an hour&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;an university&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. Tom goes to ___ school every morning.（意思是去上学）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;不加&quot; data-why=&quot;对了：活动读法零冠词；加 the 就成了去那栋楼（C-11）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. Yesterday I saw ___ dog in the park. It was white.（第一次向对方提起）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot; data-why=&quot;对了：听者还定位不到，只能认出类别——用 a；下一句再用 the（C-06 / C-09）。&quot;&gt;&lt;div class=&quot;opt&quot;&gt;the&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;a&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;不加&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 相同——示意图（取景框 / 定位灯 / 总开关） + 儿童版标题句 + 机制灰字 + 分级案例 + 易混对比与注记 + 亲戚网（出处） + 案例小故事；组级附对比台、病句医院（按 C-20 分型）、进阶测验。&lt;br&gt;知识来源：《专家规律总结清单 v1》可数性与冠词组 C-01 – C-20（Langacker 1987/2008；Gundel, Hedberg &amp;amp; Zacharski 1993；Hawkins 1978；Lyons 1999；Ionin, Ko &amp;amp; Wexler 2004；Master 1997；桂诗春、杨惠中 CLEC 2003），与 boundedness.yaml 模型逐条对齐。&lt;br&gt;待核登记：Aikhenvald《Classifiers》(2000）与 Swan《Practical English Usage》冠词条目——书目真实，编制时未打开原文页，已随条目标注，入模前复核。专家分歧均如实登记于各屏：有界充要性（Nicolas)、熟悉说 vs 唯一说、波动假说的替代解释、less/fewer 描写派与规范派之争。&lt;/div&gt;
&lt;/div&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 v3 · 深度 + 广度&lt;/span&gt;
&lt;h1&gt;介词花园&lt;/h1&gt;
&lt;p&gt;介词不用背清单。每个介词只有一张「中心图」，其他用法都是这张图的亲戚——点一点亲戚网，看它们怎么长出来。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（P-01）：&lt;/b&gt;一个介词 = 一张原型图 + 一张亲戚网。v3 加深：亲戚网画成可点的图、图式动起来、新增垂直/指向/位置/路径四个家族；广度：15 个介词全部入园。&lt;/div&gt;

&lt;div class=&quot;path&quot;&gt;&lt;span class=&quot;n&quot;&gt;第一级 · 空间&lt;small&gt;看得见的图&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;n&quot;&gt;第二级 · 时间&lt;small&gt;图借给时间&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;n&quot;&gt;第三级 · 抽象&lt;small&gt;图借给想法&lt;/small&gt;&lt;/span&gt;&lt;span style=&quot;flex:none;font-size:11px&quot;&gt;学习顺序（P-17）&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;in&quot;&gt;in&lt;small&gt;容器&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;on&quot;&gt;on&lt;small&gt;贴面&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;at&quot;&gt;at&lt;small&gt;点&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;over&quot;&gt;over&lt;small&gt;上方&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;up&quot;&gt;up&lt;small&gt;向上&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;vert&quot;&gt;垂直&lt;small&gt;家族&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;point&quot;&gt;指向&lt;small&gt;家族&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;place&quot;&gt;位置&lt;small&gt;家族&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;path&quot;&gt;路径&lt;small&gt;家族&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- IN --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-in&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;124&quot; viewBox=&quot;0 0 240 124&quot;&gt;&lt;rect x=&quot;55&quot; y=&quot;26&quot; width=&quot;130&quot; height=&quot;82&quot; rx=&quot;10&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;g class=&quot;anim-ball&quot;&gt;&lt;circle cx=&quot;120&quot; cy=&quot;72&quot; r=&quot;13&quot; fill=&quot;#f2b134&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;120&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;看：球掉进盒子，被盒子围住（动画图式）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;in 就是「进到里面，被围起来」（P-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：容器不光装东西，还会影响里面的东西——被围住、受保护、受影响。所以「在麻烦里」in trouble 也是 in：人被麻烦围住了。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The ball is in the box. / There is milk in the cup.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;球在盒子里、牛奶在杯子里。杯子没盖照样算容器：它围住了牛奶。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 容器可以放大&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;in the classroom / in Beijing / in the photo / in the rain&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;教室、城市、照片、雨幕都是大号容器：照片这张「纸面世界」也装得下人，雨把人整个包住。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一张图，借给时间&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;时间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;in June / in summer / in the morning / in 2026&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;把一个月、一个季节、一个上午看成大容器，人站在里面做事（P-09）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 再借给抽象的事&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;抽象&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;in love / in trouble / in English / in red&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;恋爱、麻烦能把人围在里面；说英语是「泡在」这门语言里；穿红衣服是整个人裹在红色里。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：in the corner&lt;/b&gt; —— 房间的角落在「里面」，是墙围出的容器一角，所以用 in。街道拐角是另一回事，看对比台。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;搭配银行：&lt;span class=&quot;chip&quot;&gt;in the team 在队伍里&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;in a minute 一会儿后&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;in hospital 住院治病&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;in the end 最后&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;in time 及时（赶进时间容器）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;in a line 排成一队（被队形围住）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Tom got up &lt;b&gt;in&lt;/b&gt; the morning, put his books &lt;b&gt;in&lt;/b&gt; his bag, and ran &lt;b&gt;in&lt;/b&gt; the rain to school. —— 三个 in 是同一张图：上午是大容器、书包是小容器、雨幕是把他围住的「天气容器」。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- ON --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-on&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;124&quot; viewBox=&quot;0 0 240 124&quot;&gt;&lt;rect x=&quot;95&quot; y=&quot;30&quot; width=&quot;50&quot; height=&quot;26&quot; rx=&quot;4&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;55&quot; y=&quot;60&quot; width=&quot;130&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;70&quot; y=&quot;68&quot; width=&quot;8&quot; height=&quot;30&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;162&quot; y=&quot;68&quot; width=&quot;8&quot; height=&quot;30&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;书贴在桌子面上，桌子托着它&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;on 就是「贴在一个面上，面托着它」（P-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：面可以换方向——画挂在墙上（墙托着画）、戒指套在手指上（手指托着戒指）、船浮在水面上（水托着船），图没变。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The book is on the desk. / A picture on the wall. / A ring on her finger.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;桌面朝上托、墙面竖着托、手指环着托——都是「贴面 + 由面负责」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 面变成「承载工具」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;on the bus / on the train / on a bike / on a horse&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;大车、自行车、马都是「驮着人走的面」：人站在、坐在、骑在它们的承载面上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一张图，借给时间&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;时间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;on Monday / on my birthday / on June 1st&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;把具体某一天看成一个面，事情「贴」在这一天上（P-09）。月份太大只能「泡」进去用 in；日子一旦被点名，图就换成面。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 再借给抽象的事&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;抽象&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;on TV / on the phone / on duty / on sale&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;屏幕、信号是承载面；值班、在售是「挂在状态面上」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：on the corner&lt;/b&gt; —— 站在街道拐角的街面上，美式常说 on the corner。房间内角、街面、见面点三种 corner，在对比台一次分清。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;搭配银行：&lt;span class=&quot;chip&quot;&gt;on foot 步行*&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;on Friday 周五&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;on the left 在左边&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;on time 准时（贴在点位面上）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;on the way 在路上&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;on fire 着火（裹在火面上，记搭配）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mech&quot; style=&quot;margin-top:6px&quot;&gt;* on foot 是约定俗成的老搭配，只记不讲道理——诚实边界，不编假解释。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;On Monday, Lily got &lt;b&gt;on&lt;/b&gt; the bus with her homework &lt;b&gt;on&lt;/b&gt; her phone screen. —— 一天是面、公交是面、屏幕是面，三个 on 一家人。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- AT --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-at&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;124&quot; viewBox=&quot;0 0 240 124&quot;&gt;&lt;circle cx=&quot;120&quot; cy=&quot;58&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;58&quot; r=&quot;6&quot; fill=&quot;#f2b134&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;18&quot; x2=&quot;120&quot; y2=&quot;34&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;line x1=&quot;120&quot; y1=&quot;82&quot; x2=&quot;120&quot; y2=&quot;98&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;line x1=&quot;80&quot; y1=&quot;58&quot; x2=&quot;96&quot; y2=&quot;58&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;line x1=&quot;144&quot; y1=&quot;58&quot; x2=&quot;160&quot; y2=&quot;58&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;再大的地方，在 at 眼里只是一个点&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;at 就是「把东西看成一个小点点」（P-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这叫「点化」——大小、形状统统不管，只管它在哪儿。所以 at 能同时管地点、时刻、目标和价位。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;at the door / at school / at the bus stop / at the top&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;门、学校、车站再大，说话时只当它是「等人、会合、到达」的位置点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一张图，借给时间&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;时间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;at 7 o&#x27;clock / at noon / at night*&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;钟点是时间轴上的点。*at night 是老搭配照记；「在深夜里做事」也可说 in the night（把夜当容器）——两种图并存，各有场合，不硬凑。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 点变成「目标」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;抽象&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;look at / laugh at / aim at / good at&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;目光、笑声、箭头冲着目标点；good at 的 at 是「盯住一个目标练」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 点变成「刻度」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;抽象&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;at $5 / at 100 km/h / at the age of ten&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;价格、速度、年龄都是刻度上的一个点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：at the corner&lt;/b&gt; —— 把拐角当成「约好见面的坐标点」：Let&#x27;s meet at the corner.&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;搭配银行：&lt;span class=&quot;chip&quot;&gt;at home 在家&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;at work 在上班&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;at first 起初&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;at the weekend 周末（英式）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;at last 终于&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;at the station 在车站&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;At 8 o&#x27;clock, Sam was &lt;b&gt;at&lt;/b&gt; the bus stop, looking &lt;b&gt;at&lt;/b&gt; his watch. —— 钟点是点、车站是点、目光落在点上，三个 at 一张图。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- OVER --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-over&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;124&quot; viewBox=&quot;0 0 240 124&quot;&gt;&lt;path d=&quot;M40 84 Q120 20 200 84&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M30 100 Q120 82 210 100&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&lt;g class=&quot;anim-hop&quot;&gt;&lt;circle cx=&quot;52&quot; cy=&quot;78&quot; r=&quot;8&quot; fill=&quot;#f2b134&quot;/&gt;&lt;/g&gt;&lt;text x=&quot;120&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;看：球从上方越过去（动画图式）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;over 的中心是「在上方」，不是「盖住」（P-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：专家给 over 的十几个义项排过「全家福」座次：正中间是「在上方、可越过」；盖、遍、完、超过都是坐在四周的亲戚——点下面的亲戚网，看每个亲戚是怎么从中心长出来的。&lt;/div&gt;
&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 360 218&quot; style=&quot;width:100%;margin-top:10px&quot;&gt;
&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;62&quot; y2=&quot;38&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;180&quot; y2=&quot;26&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;298&quot; y2=&quot;38&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;56&quot; y2=&quot;168&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;180&quot; y2=&quot;188&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;180&quot; y1=&quot;104&quot; x2=&quot;302&quot; y2=&quot;168&quot; stroke=&quot;#bcd8d2&quot; stroke-width=&quot;2&quot;/&gt;
&lt;g class=&quot;netnode&quot; data-net=&quot;jump&quot;&gt;&lt;circle cx=&quot;62&quot; cy=&quot;38&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot;&gt;越过&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;netnode sel&quot; data-net=&quot;above&quot;&gt;&lt;circle cx=&quot;180&quot; cy=&quot;26&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot;&gt;在上方&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;netnode&quot; data-net=&quot;cover&quot;&gt;&lt;circle cx=&quot;298&quot; cy=&quot;38&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;298&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot;&gt;盖住&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;netnode&quot; data-net=&quot;all&quot;&gt;&lt;circle cx=&quot;56&quot; cy=&quot;168&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;56&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot;&gt;遍布&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;netnode&quot; data-net=&quot;more&quot;&gt;&lt;circle cx=&quot;180&quot; cy=&quot;188&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot;&gt;超过&lt;/text&gt;&lt;/g&gt;
&lt;g class=&quot;netnode&quot; data-net=&quot;end&quot;&gt;&lt;circle cx=&quot;302&quot; cy=&quot;168&quot; r=&quot;24&quot;/&gt;&lt;text x=&quot;302&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot;&gt;结束&lt;/text&gt;&lt;/g&gt;
&lt;circle cx=&quot;180&quot; cy=&quot;104&quot; r=&quot;27&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;109&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;over&lt;/text&gt;
&lt;/svg&gt;
&lt;div class=&quot;netinfo&quot; id=&quot;netinfo&quot;&gt;&lt;b&gt;在上方（中心义）&lt;/b&gt;：The plane is over the city. —— 全家的中心：东西在上面，没有接触。这是其他亲戚出发的地方。&lt;/div&gt;
&lt;div class=&quot;kin&quot; style=&quot;margin-top:10px&quot;&gt;搭配银行：&lt;span class=&quot;chip&quot;&gt;over and over 一遍又一遍&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;think over 仔细考虑&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;over there 在那边&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;all over the world 全世界&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- UP --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-up&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;124&quot; viewBox=&quot;0 0 240 124&quot;&gt;&lt;polyline points=&quot;45,92 95,70 135,76 195,32&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;195,32 180,34 190,46&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;rect x=&quot;52&quot; y=&quot;34&quot; width=&quot;52&quot; height=&quot;24&quot; rx=&quot;6&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;78&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#5c4300&quot;&gt;$ ↑&lt;/text&gt;&lt;text x=&quot;120&quot; y=&quot;121&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;往上走，就是「多起来」&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;up 是「多」：往上走，就是多起来（P-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：人从小就知道「堆得高 = 数量多」。英语把这张身体经验图用到了价格、声音、速度、情绪上——每个引申都要能说回这张图，说不回的就按老搭配记。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;空间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;stand up / climb up / pick up the pen&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;身体、位置真的往上——中心图。捡笔也是把笔「提起来」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 从「上」长出「多、大、快」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;数量&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Prices go up. / Turn up the radio. / Hurry up! / Speed up!&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;价格线往上爬、音量往上推、速度往上加——同一张图。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 再长出「完、满、醒」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;抽象&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;eat up / drink up / Time is up. / Wake up!&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;吃光是吃到「满格」；时间到是沙漏「走满」；醒来是意识从低处「升起来」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;搭配银行：&lt;span class=&quot;chip&quot;&gt;grow up 长大&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;cheer up 振作起来&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;give up 放弃*&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;get up 起床&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;dress up 盛装打扮（往「满格」打扮）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mech&quot; style=&quot;margin-top:6px&quot;&gt;* give up 的来历说法不一，按老搭配记，不硬套图——诚实边界。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- VERTICAL --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-vert&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;130&quot; viewBox=&quot;0 0 240 130&quot;&gt;&lt;line x1=&quot;30&quot; y1=&quot;66&quot; x2=&quot;210&quot; y2=&quot;66&quot; stroke=&quot;#8494a0&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;rect x=&quot;92&quot; y=&quot;46&quot; width=&quot;56&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#8494a0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;58&quot; y=&quot;34&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;over 正上方&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;34&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#2f7db0&quot;&gt;above 更高&lt;/text&gt;&lt;text x=&quot;52&quot; y=&quot;112&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0f8a7d&quot;&gt;under 正下方&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;112&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#2f7db0&quot;&gt;below 更低&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;垂直方向是四个词合伙切的（P-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：over / under 是「有关系的一对」——正对着、可越过、常被盖着；above / below 是「只比海拔的一对」——只说更高更低，多用于温度、海拔、刻度。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;over&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a bridge over the river / jump over the fence&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;正上方，有「跨过去」的戏。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;above&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;above zero / The plane is above the clouds.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;只说「更高」，不强调正对着谁。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;under&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;under the table / under the bed / under a tree&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;正下方，常带「被上面的东西盖着、压着」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;below&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;below zero / below the surface&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;只说「更低」，像看温度计的刻度。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;一句话分工：&lt;/b&gt;讲位置关系（谁正对着谁）用 over / under；讲刻度高低（温度、海拔、分数）用 above / below。所以零下五度是 five degrees &lt;b&gt;below&lt;/b&gt; zero，猫钻桌子底是 &lt;b&gt;under&lt;/b&gt; the table。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- POINT --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-point&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;110&quot; viewBox=&quot;0 0 240 110&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;55&quot; r=&quot;9&quot; fill=&quot;#f2b134&quot;/&gt;&lt;path d=&quot;M52 55 H150&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;150,55 136,48 136,62&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;rect x=&quot;168&quot; y=&quot;38&quot; width=&quot;44&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;to：一条路，通向终点&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;三个「指向」介词，各管一段（P-14）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：to 管「路径通向终点」，for 管「为了谁」，at 管「冲着目标点」——先分清是哪种「指」，再选词。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;to&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;go to school / walk to the park / give the book to me&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;一条路有头有尾，终点就是 to 指的地方；东西传递也走这条路。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;for&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a gift for you / This letter is for Tom. / leave for Beijing&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;for 指「受益的那个人」；leave for 是它的亲戚：「奔着目的地去」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;at&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;look at the bird / shout at the dog / smile at me&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;at 带「瞄准感」：目光、声音冲着目标点发射出去。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：give it to me vs buy it for me&lt;/b&gt; —— 「递给我」是路径终点（to）；「买给我」是为我受益（for）。同一个我，角色不同，词就不同。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PLACE --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-place&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;rect x=&quot;96&quot; y=&quot;34&quot; width=&quot;48&quot; height=&quot;48&quot; rx=&quot;6&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#8494a0&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;58&quot; r=&quot;8&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;180&quot; cy=&quot;58&quot; r=&quot;8&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;102&quot; r=&quot;8&quot; fill=&quot;#0f8a7d&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;位置家族都围着「参照物」转&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;位置家族：先找参照物，再说在哪边&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（P-12）：位置句先要分清「要找的东西」（图形）和「拿来比的大东西」（背景）。英语的位置词，都是围着背景说图形在哪儿。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;前后&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;in front of the school / behind the tree&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;in front of 是整存词块，别拆；behind 是「在背面那一侧」，常带「被挡住」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;中间&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;between the two trees / among the flowers&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;between 管「两个之间」（点对点）；among 管「一堆里面」（花丛中）——汉语一个「在……中间」，英语分两张图。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;旁边&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;next to the door / near the window / beside the bed&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;next to 是「紧挨着」，near 是「在附近」，beside 是 next to 的亲戚（书面一点）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;对面&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;across from the bank / opposite the park&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;隔着一条路/一条河「脸对脸」，是 across 的静态亲戚。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：in front of vs in the front of&lt;/b&gt; —— 多一个 the 大不同：in front of 是「在物体外面前面」（校门口）；in the front of 是「在物体内部的前部」（教室的前部）。汉语都说「在前面」，英语靠一顶 the 的帽子分家。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PATH --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-path&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;240&quot; height=&quot;120&quot; viewBox=&quot;0 0 240 120&quot;&gt;&lt;rect x=&quot;86&quot; y=&quot;18&quot; width=&quot;68&quot; height=&quot;84&quot; rx=&quot;34&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M20 60 H220&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;4&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;118&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;through：从里面穿过去&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;路径家族：路怎么走，词就怎么选&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：路径词看「穿过的是什么」——穿过内部空间用 through，跨过表面用 across，沿着线走用 along，绕着圈走用 around。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;through&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;through the tunnel / through the forest / through the door&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;从一个有内部的空间里穿过去：隧道、森林、门洞，四周都被包着走。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;across&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;across the river / across the road / swim across&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;跨过一个「面」：河面、路面——从这条边到那条边。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;along&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;walk along the river / along the street&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;沿着一条线走，方向跟着线走（呼应虚构运动 P-16：The road runs along the river）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;around&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;around the lake / sit around the table / turn around&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;绕着圈：环湖、围坐、转身，都是「圈」这张图。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：through vs across&lt;/b&gt; —— 穿过森林是 through（在树丛里面走），游过河是 across（跨过水面）。判据只问一句：「走的时候，我是在它里面，还是在它上面跨？」&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;亲戚网导读：为什么「盖住」不是 over 的中心？（P-02 / P-06）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;专家定「哪张图是中心」，靠四条证据，不靠感觉：①哪个义出现得最早；②哪个义用得最多、最能代表这个词；③看它跟邻居词的对照（over 和 above 的分界在哪儿）；④从哪张图出发，能把其他义项都「推导」出来。四条都指向「在上方」——从「盖住」出发，推不出「超过 100 岁」，从「在上方」出发，全家都能排通。&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;汉英对照台：汉语一个字，英语几张图（P-11）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;中国孩子介词出错，多半不是词错了，是汉语的「切法」和英语不同。先看切法，再选词。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;汉语「上」→ 英语三张图&lt;/h4&gt;
&lt;p&gt;桌子上 → &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; the desk（贴面）｜墙上 → &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; the wall（贴面）｜车上 → &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; the bus（承载面）但 &lt;span class=&quot;en&quot;&gt;in&lt;/span&gt; the car（容器）｜床上 → &lt;span class=&quot;en&quot;&gt;in&lt;/span&gt; bed 睡觉（被窝是容器）/ &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; the bed 坐在床面｜早上 → in the morning（大容器），但星期一早上 → &lt;b&gt;on&lt;/b&gt; Monday morning（点名了日子，换成面）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;汉语「里」→ 不总是 in&lt;/h4&gt;
&lt;p&gt;在心里 → &lt;span class=&quot;en&quot;&gt;in&lt;/span&gt; my heart ✓ 容器｜在电视里 → &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; TV（屏幕是面）｜在电话里 → &lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; the phone｜在照片里 → &lt;span class=&quot;en&quot;&gt;in&lt;/span&gt; the photo（纸面世界是容器）。同一个「里」，先问图再选词。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;汉语没有的功课：at 的「点化」&lt;/h4&gt;
&lt;p&gt;汉语说「在学校」，不区分把学校当点还是当容器；英语必须选：&lt;span class=&quot;en&quot;&gt;at&lt;/span&gt; school（当上学地点/去做上学这件事）、&lt;span class=&quot;en&quot;&gt;in&lt;/span&gt; the school（强调在那栋楼里面）。选哪个，取决于你想让听者看到哪张图——这叫识解，是整个介词系统的总开关。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：同一个地方，三种看法&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;介词选错，多半是「图看错了」。同一场景，先问看成什么，再选词。（P-08 / P-12）&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：the corner 三兄弟&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;in&lt;/span&gt;&lt;br&gt;the corner&lt;br&gt;房间内角——被墙围住的一角（容器）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;on&lt;/span&gt;&lt;br&gt;the corner&lt;br&gt;街道拐角的街面上（承载面）&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;at&lt;/span&gt;&lt;br&gt;the corner&lt;br&gt;约人见面的坐标点（点化）&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：车，为什么 bus 用 on、car 用 in？&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;on the bus / on the train&lt;/span&gt; —— 大车像「移动的地板」，人站在承载面上走动；&lt;span class=&quot;en&quot;&gt;in the car / in a taxi&lt;/span&gt; —— 小车像「小盒子」，人钻进去被围住。不是按大小背清单，是按图选词：能在里面走动的，多半是面；只能坐进去的，是容器。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：苹果在碗里，为什么低于碗沿还说 in？（P-08 功能几何）&lt;/h4&gt;
&lt;p&gt;苹果沉在碗底、没到碗沿，按纯几何不算「在里面」。但英语仍说 &lt;span class=&quot;en&quot;&gt;an apple in the bowl&lt;/span&gt; —— 因为碗的&lt;b&gt;职责&lt;/b&gt;就是盛它：介词算一半几何账、一半功能账。花插在花瓶里 &lt;span class=&quot;en&quot;&gt;flowers in the vase&lt;/span&gt; 同理。纯几何判介词，必错一半。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例四：时间阶梯（一张表看懂 in / on / at）&lt;/h4&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th&gt;图&lt;/th&gt;&lt;th&gt;时间单位&lt;/th&gt;&lt;th&gt;例子&lt;/th&gt;&lt;th&gt;为什么&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;in&lt;/b&gt; 容器&lt;/td&gt;&lt;td&gt;月、季、年、上午/下午&lt;/td&gt;&lt;td&gt;in June, in 2026, in the morning&lt;/td&gt;&lt;td&gt;时段大，人「泡」在里面&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;on&lt;/b&gt; 面&lt;/td&gt;&lt;td&gt;具体某一天、星期几&lt;/td&gt;&lt;td&gt;on Monday, on June 1st&lt;/td&gt;&lt;td&gt;事情「贴」在这一天上&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;at&lt;/b&gt; 点&lt;/td&gt;&lt;td&gt;钟点、noon、night*&lt;/td&gt;&lt;td&gt;at 7:00, at noon&lt;/td&gt;&lt;td&gt;时刻是时间轴上的点&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;注意 on June 1st：一旦说出「哪一天」，月份就退成背景，图从容器换成了面——介词跟着「你强调的那一层」走。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频介词病句（P-11）&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病句取自学习者语料中反复出现的类型。病因几乎都一样：把汉语的切分法套到了英语上。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I go to school by my father&#x27;s car.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ in my father&#x27;s car&lt;/span&gt; —— 小汽车是「钻进去的容器」，用 in。by car 是「交通方式」说法（by bus / by bike 一律零冠词），两者不能混搭。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ We have a meeting in Monday morning.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ on Monday morning&lt;/span&gt; —— 一旦点名「星期一」，图就从「上午大容器」换成「这一天的面」，介词跟着最具体的那层走。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He was born in June 1st.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ on June 1st&lt;/span&gt; —— 只说月份用 in June；说出「1 号」这一天，就换成 on。同上条，一个道理。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The teacher is standing on the front of the classroom.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ in front of the classroom&lt;/span&gt; —— in front of 是整存词块，别拆开按字面拼；「在教室内部的前部」才说 in the front of。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ There is a picture in the wall.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ on the wall&lt;/span&gt; —— 画是「贴」在墙面上、由墙托着的，不是钻进墙里面。汉语「在墙上」的「上」，在这里是 on 的图。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ We went through the river by boat.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ across the river&lt;/span&gt; —— 过河是「跨过水面」用 across；through 是从有内部的空间里穿过去（穿隧道、穿森林）。汉语一个「过」，英语两张图。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ My home is near to the school.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f7&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f7&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ near the school&lt;/span&gt; —— near 本身就带「距离近」，后面直接接参照物，不加 to。汉语「离学校近」的「离」没有对应的词，别硬塞。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He is good in English.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f8&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f8&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ good at English&lt;/span&gt; —— 「擅长」是盯着目标练，用带瞄准感的 at（good at / bad at 是一对词块）。汉语「在英语上好」是直译陷阱。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;进阶测验：选词、诊断、迁移&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. The cat is ___ the table.（猫贴在桌面上，被桌子托着）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;on&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;on&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;at&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. He was born ___ May.（整个五月是个大容器）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;on&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;at&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. The temperature is five degrees ___ zero.（只比刻度，不强调正对）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;below&quot;&gt;&lt;div class=&quot;opt&quot;&gt;under&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;below&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;over&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. We walked ___ the tunnel and came out the other side.（人在隧道里面走）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;through&quot;&gt;&lt;div class=&quot;opt&quot;&gt;across&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;through&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;over&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.A ladybird is ___ the leaf, drinking water.（瓢虫趴在叶子表面上——没学过的场景，用图推）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;on&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;on&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;at&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6.「in June 1st」错在哪一步？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;图选错了&quot;&gt;&lt;div class=&quot;opt&quot;&gt;词记错了&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;图选错了&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;语序错了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. Please turn ___ the light before bed.（让灯「脱离工作状态」）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;off&quot;&gt;&lt;div class=&quot;opt&quot;&gt;up&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;out&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;off&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;8.She is ___ the queue, waiting for tickets.（她整个人被队伍「排」在里面）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;in&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;on&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;at&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形 v3 说明：深度——over 亲戚网可点、图式动画、汉英切分对照、病句医院扩至 8 例、测验加入诊断题与迁移题；广度——新增垂直/指向/位置/路径四家族，全园 15+ 介词。&lt;br&gt;知识来源：《专家规律总结清单 v1》介词组 P-01 – P-18（Tyler &amp;amp; Evans 2003；Coventry &amp;amp; Garrod 2004；CLEC 学习者语料类型）。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
const NET={
above:[&#x27;&lt;b&gt;在上方（中心义）&lt;/b&gt;：The plane is over the city. —— 全家的中心：东西在上面，没有接触。其他亲戚都从这里出发。&#x27;,&#x27;&#x27;],
jump:[&#x27;&lt;b&gt;越过&lt;/b&gt;：jump over the fence —— 在上方的图加上运动轨迹：从这一边跨到那一边。&#x27;,&#x27;&#x27;],
cover:[&#x27;&lt;b&gt;盖住&lt;/b&gt;：a cloth over the table —— 布在桌面上方、垂下来把桌面遮满，「上方」贴得更近，就成了盖。&#x27;,&#x27;&#x27;],
all:[&#x27;&lt;b&gt;遍布&lt;/b&gt;：all over the world —— 「盖」盖满整个世界，就成了「到处都是」。&#x27;,&#x27;&#x27;],
more:[&#x27;&lt;b&gt;超过&lt;/b&gt;：over 100 years old —— 心里有一条 100 的线，年龄「越过线」就是超过。&#x27;,&#x27;&#x27;],
end:[&#x27;&lt;b&gt;结束&lt;/b&gt;：The game is over. —— 事情像翻过一页、越过终点线，就成了「完」。&#x27;,&#x27;&#x27;]
};
document.querySelectorAll(&#x27;.netnode&#x27;).forEach(n=&gt;n.addEventListener(&#x27;click&#x27;,()=&gt;{
document.querySelectorAll(&#x27;.netnode&#x27;).forEach(x=&gt;x.classList.remove(&#x27;sel&#x27;));
n.classList.add(&#x27;sel&#x27;);
document.getElementById(&#x27;netinfo&#x27;).innerHTML=NET[n.dataset.net][0];
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
const f=document.getElementById(b.dataset.f);
f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));
const WHY={on:&#x27;对了：这是「贴面+承重」的图。&#x27;,at:&#x27;对了：这是「点化」的图。&#x27;,in:&#x27;对了：这是「容器」的图。&#x27;,below:&#x27;对了：只比刻度高低，用 below 家族。&#x27;,off:&#x27;对了：off 是「脱离」——关灯、脱衣、下车都是它。&#x27;,through:&#x27;对了：人在空间「里面」穿行，用 through。&#x27;,&#x27;图选错了&#x27;:&#x27;对了：词没记错，是图选错了——说出「1 号」就该换成「面」的图。介词题先诊断图，再换词。&#x27;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{
const fb=g.nextElementSibling;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
const right=o.textContent.trim()===g.dataset.a;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：先画图——装进容器、贴在面上、压成点、从里面穿，还是只比刻度？&#x27;;
}));
});
&lt;/script&gt;
