&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 时态与体（TA-01 – TA-18）&lt;/span&gt;
&lt;h1&gt;时间镜头房&lt;/h1&gt;
&lt;p&gt;时态不是十二个要背的格子，是两个开关：一个管「什么时候」，一个管「怎么看」。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（TA-01）：&lt;/b&gt;时态 = 时间 × 看法。时间开关只有两档（过去 / 非过去）；看法开关决定镜头放在哪——看全景、钻进中间、还是看事情留给现在的痕迹。两个开关一组合，时态就出来了。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;switch&quot;&gt;两个开关&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;lens&quot;&gt;镜头看事&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;trace&quot;&gt;完成体·看痕迹&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;anchor&quot;&gt;锚点与距离&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;future&quot;&gt;将来是借的&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;story&quot;&gt;故事与对照&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;order&quot;&gt;学习顺序&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 两个开关 TA-01 TA-02 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-switch&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;56&quot; r=&quot;16&quot; fill=&quot;#5b54b8&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;开关一：时间&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;过去 / 非过去&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;62&quot; font-size=&quot;16&quot; fill=&quot;#b7c3ca&quot;&gt;×&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;circle cx=&quot;214&quot; cy=&quot;56&quot; r=&quot;16&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;188&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;开关二：看法&lt;/text&gt;&lt;text x=&quot;188&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;全景 / 内部 / 痕迹&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;时态像两个开关，一拨就组合出样子（TA-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：英语动词的形态对立其实只有「现在 / 过去」两项（TA-02）——动词只有两件衣裳。说将来的事，要借 will、going to 这些小帮手的力气，它们不是第三件衣裳。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;时间档&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I walk to school. / I walked to school.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;同一个动词，两件衣裳：原形是「非过去」，-ed 是「过去」。衣裳就这两件，再无第三件。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 换看法开关，时间不动&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;看法档&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I walked. / I was walking. / I had walked.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;都在过去：第一句看全景，第二句钻进中间，第三句站在更晚的过去点回头看——变的只是看法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 两个开关一起拨&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;组合&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She has finished. = 非过去 × 看痕迹&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;所谓「现在完成时」不是第三个时间，是「时间在现在、看法盯痕迹」的组合名。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 专家有分歧（TA-02）：&lt;/b&gt;主流语法书（《剑桥英语语法》）判定 will 是情态词、英语没有将来时；但 Declerck 等学者主张 will 的一部分用法应算将来时。本 app 采用主流口径 teaching，但不装作学界已一致——这条分歧如实记着。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;章振邦「两时两体」&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Comrie 时/体两分&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;将来靠借工具（第 5 屏）&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Yesterday, Mia &lt;b&gt;walked&lt;/b&gt; home（过去×全景）, it &lt;b&gt;was raining&lt;/b&gt;（过去×钻进中间）, and she &lt;b&gt;had lost&lt;/b&gt; her umbrella the day before（站在昨天回头看更早）. —— 一段话拨了三次开关，全是两个开关的组合。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 镜头看事 TA-03 TA-04 TA-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-lens&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;86&quot; x2=&quot;235&quot; y2=&quot;86&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;rect x=&quot;28&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;42&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;71&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f7db0&quot;&gt;全景：整件事&lt;/text&gt;&lt;rect x=&quot;150&quot; y=&quot;44&quot; width=&quot;30&quot; height=&quot;20&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;138&quot; y=&quot;30&quot; width=&quot;86&quot; height=&quot;42&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;1.2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;181&quot; y=&quot;22&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;推进：只看中间&lt;/text&gt;&lt;rect x=&quot;52&quot; y=&quot;48&quot; width=&quot;38&quot; height=&quot;10&quot; rx=&quot;5&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;156&quot; y=&quot;50&quot; width=&quot;18&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一件事，镜头远近不同&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;「体」就是看事情的方式：看全景，还是钻进去看中间（TA-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Comrie 的经典定义）：体不是时间，是「观看一件事内部的样子」。看全景用一般体，钻进中间用进行体——先想清楚要给人看哪一段，再选形式。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;全景&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He built a house. / She read the book.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;站在远处，把整件事从头到尾看成一整块——有头有尾。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 镜头推进，只看中间&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;内部&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He was building a house. / She was reading.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;钻进事件中间：只看见正在进行的那一段，头尾先不管。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 为什么「正在发生」必须推进镜头&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;关键&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Look! The baby is crying.（不是 *The baby cries 表此刻）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「现在」只有一眨眼那么短，装不下一件完整的事（TA-04）——所以正在发生的事只能钻进镜头说；一般现在时平时管习惯和道理：The baby cries a lot. / The sun rises in the east.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：动词自带「时间形状」（TA-07）&lt;/b&gt; —— run 是能一直转的轮子（活动，无终点），build a house 是有头有尾的一段路（有终点），know 是静止的牌子（状态，没有过程）。牌子没法「正在进行」，所以 *I am knowing the answer 不成立，要说 I know the answer。形状不对，镜头套不上。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;活动 run / swim&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;完结 build / paint a picture&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;瞬间 find / recognize&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;状态 know / love&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;At 7 last night, Mum &lt;b&gt;was cooking&lt;/b&gt;（钻进厨房看中间）, Dad &lt;b&gt;read&lt;/b&gt; the paper from start to finish（全景看完）, and I &lt;b&gt;knew&lt;/b&gt; dinner was coming（状态牌子，不用进行时）. —— 三种形状，三个镜头。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 完成体 TA-05 TA-06 TA-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-trace&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;84&quot; x2=&quot;235&quot; y2=&quot;84&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;84&quot; r=&quot;6&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f7db0&quot;&gt;过去：钥匙丢了&lt;/text&gt;&lt;path d=&quot;M58 78 Q125 30 190 74&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;polygon points=&quot;190,74 178,72 184,62&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;circle cx=&quot;205&quot; cy=&quot;84&quot; r=&quot;6&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;现在：进不了门&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;痕迹从过去连到现在&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;完成时看的不是「做完」，是「过去的事和现在还有牵连」（TA-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Comrie 定版口径）：完成体的眼睛盯着现在——过去那件事留下的痕迹、结果、经验，到现在还算数。旧讲法「过去做完」已被本项目全量更换：做完做完不是关键，和现在相不相连才是。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;结果&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have lost my key. / She has broken her leg.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;钥匙丢没丢不重要，重要的是「现在进不了门」；腿断没断是过去，「现在打着石膏」才是重点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 痕迹也可以是「经验本身」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;经历&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I have been to Beijing. / Have you ever read this book?&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;去过北京这件事，痕迹就是「我现在是个去过的人」——这一层如实讲，不硬编具体结果。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 近况与持续，也是同一家人&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;近况·持续&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;It has rained a lot lately. / We have lived here for years.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;最近的雨影响着现在的地；住了几年并且还住着——四种用法共享同一条线：锚点在现在。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;铁律对比：完成时不能点名过去时间（TA-06）&lt;/b&gt; —— *I have seen him yesterday 不成立：yesterday 把事件钉回过去，完成时的眼睛却盯着现在，两套定位打架。要点名时间讲过去，就换一般过去时：I saw him yesterday。这条能批量预测：since / for 可用，yesterday / in 2019 不可用。&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:10px&quot;&gt;&lt;h4&gt;来历故事（TA-12）——只是故事，不是定义&lt;/h4&gt;&lt;p&gt;很久以前，&lt;span class=&quot;en&quot;&gt;I have the letter written&lt;/span&gt; 是说「写好的信在我手里」；说着说着，重心从「信」滑到「我写过」，完成时就这样长出来的。讲给孩子听可以，但必须说清：这是祖先的故事，今天完成时的意思以「现时相关」为准，不许拿「手里攥着结果」当定义。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;结果 have lost&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;经历 have been to&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;近况 have rained lately&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;持续 have lived for years&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Ben can&#x27;t open the door — he &lt;b&gt;has lost&lt;/b&gt; his key（痕迹：现在进不去）. He &lt;b&gt;has tried&lt;/b&gt; every pocket（经历：都摸过了）. Poor Ben &lt;b&gt;has waited&lt;/b&gt; for ten minutes（持续到现在）. —— 三句完成时，句句都连着「现在」。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 锚点与距离 TA-09 TA-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-anchor&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;line x1=&quot;15&quot; y1=&quot;84&quot; x2=&quot;235&quot; y2=&quot;84&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;45&quot; cy=&quot;84&quot; r=&quot;5&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#2f7db0&quot;&gt;更早&lt;/text&gt;&lt;path d=&quot;M45 84 L118 84&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;polygon points=&quot;118,40 118,84 142,84 118,62&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;锚点：站在过去回头看&lt;/text&gt;&lt;circle cx=&quot;205&quot; cy=&quot;84&quot; r=&quot;5&quot; fill=&quot;#7c8a94&quot;/&gt;&lt;text x=&quot;205&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;现在&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;过去完成时是「锚点搬家」：旗子插在过去某天，再往前看（TA-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：完成体只要求「事件早于参照点」。参照点在现在 = 现在完成时；把参照点搬到过去 = 过去完成时。维度没变多，只是旗子挪了位置（Comrie 相对时态）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;锚点在过去&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;When I got home, Mum had cooked dinner.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「我到家」是旗子；做饭比旗子还早，所以站在旗子上回头看，用 had cooked。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一机制，锚点回到现在&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;对照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Now Mum has cooked dinner.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;旗子插回现在，同一件事就变回 has cooked——完成体四种用法，两顶帽子通用。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 过去形式还有第二份工作：管距离&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;推远&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I wondered if you could help me. / If I were you…&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;过去形还管「认识距离」（TA-08）：把话从眼前推远——时间上是过去，心理上是假设，社交上是客气，是同一次「推远」的三种用法。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：过去完成时不是「更过去的过去」&lt;/b&gt; —— 它单独出现会显得突兀，因为旗子没插下：先给一个过去点（When I arrived…)，再说更早的事（…the film had started)。若 before / after 已把顺序说清，had 常可省略，那是省冗余，不是规则坏了。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;礼貌 I wondered…&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;假设 If I were you&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;转述时态后退&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;小学阶段：距离只埋种子&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;The film &lt;b&gt;had started&lt;/b&gt; when we arrived（旗子：我们到的时候；电影开场更早）. And Tom whispered, &quot;I &lt;b&gt;wondered&lt;/b&gt; if we could sit here&quot;（把请求推远一点，客气）. —— 一个 had 管回头，一个 -ed 管推远。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 将来是借的 TA-10 TA-11 TA-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-future&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;path d=&quot;M20 96 Q90 60 150 62 T232 40&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;6 4&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;82&quot; r=&quot;7&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96690a&quot;&gt;已经在路上&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;16&quot; width=&quot;64&quot; height=&quot;24&quot; rx=&quot;6&quot; fill=&quot;#5b54b8&quot;/&gt;&lt;text x=&quot;200&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;将来 →&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;将来没有自己的衣裳，全是借来的工具&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;将来是借工具谈的：will 是「我保证」，going to 是「已经在路上」（TA-10 / TA-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：will 的祖先是「想要」——所以它说将来总带着拍胸脯的口气（预言 / 当场答应）；be going to 的祖先是「走过去做某事」——人已上路，所以它说的将来带着「已有苗头、已有打算」的底色（语法化路径，Bybee 等）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;will&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;&quot;I&#x27;ll get the door!&quot; / I think it will rain tomorrow.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;当场决定、开口答应、开口预言——都是「我愿意 / 我预言」的残影在说话。残影不是全部：天气预报里的 will 已很中性，只说「带着预言的味道」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 换一个借来的工具：已经在路上&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;going to&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Look at the clouds! It&#x27;s going to rain. / We&#x27;re going to visit Grandma this weekend.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;黑云压顶是「预兆」，周末计划是「打算」——两件事都已经有点影子了，才用 going to。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 还有第三种借法：把未来写成事实&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;时刻表&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The train leaves at six. / School starts on Monday.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;时刻表、日历把未来事件钉成了「已定的事实」，所以借一般现在时来说（TA-13）。只限时刻表语境——*It rains tomorrow 不成立，临时计划不用这一式。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：will 与 going to 是倾向，不是铁律&lt;/b&gt; —— 大量语境两者可互换。原型对比只帮入门：有预兆 / 有打算 → going to 更贴；临场决定 / 承诺 / 纯预测 → will 更贴。不许讲成「一个管计划、一个管临时」的死分工。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;will 意愿→意图→预测&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;going to 移动→打算→预兆&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;时刻表现在时 futurate&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&quot;The train &lt;b&gt;leaves&lt;/b&gt; at six tomorrow（时刻表，铁板钉钉）. Look at those clouds — it&#x27;s &lt;b&gt;going to&lt;/b&gt; rain on our trip（预兆）. Don&#x27;t worry, I&#x27;&lt;b&gt;ll&lt;/b&gt; take an umbrella（当场答应）.&quot; —— 三种将来，三个借来的工具，各说各的口气。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 故事与对照 TA-14 TA-15 TA-16 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-story&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;26&quot; width=&quot;84&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;72&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;汉语&lt;/text&gt;&lt;text x=&quot;72&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;时间藏在词里&lt;/text&gt;&lt;path d=&quot;M120 54 L150 54&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;150,54 140,49 140,59&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;156&quot; y=&quot;26&quot; width=&quot;84&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#f1f0fa&quot; stroke=&quot;#5b54b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;198&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#5b54b8&quot;&gt;英语&lt;/text&gt;&lt;text x=&quot;198&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;时间藏在动词形状里&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;编码位置不同，是中国孩子时态错误的源头&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;汉语靠词说时间，英语靠动词变形：每说一句，都被迫选一次时态（TA-15）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（连淑能《英汉对比研究》）：汉语是「词汇型」——昨天、明天、了、过把时间说清，动词不用变；英语是「形态型」——每个句子必须在动词上做时态选择。所以中国孩子漏 -ed，是系统差异造成的结构性难点，不是粗心、不是态度问题。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;对照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;他昨天去北京。→ He went to Beijing yesterday.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;汉语只加了「昨天」一个词；英语除了 yesterday，还必须把 go 换成 went——时间被迫标两次，孩子常只记得词、忘了动词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 「了 / 过」和完成时，只对得上一部分&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;错位&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;「我去过北京」≈ I have been to Beijing.（经历，对得上）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;但「了」是「做成了」，「过」是「经历过」，完成时管的是「和现在有牵连」（TA-16）——三个人长得有点像，不是同一个人。把「了」直接翻译成 have done，是病句医院的常客。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 讲故事时，还有一种合法的「演法」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;故事&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;So he opens the door… and there&#x27;s a cat!&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;历史现在时（TA-14）：讲到紧张处，把过去的事当作正在发生来「演」，听的人像站在现场。它不是说错——但小学阶段只要求认得出、不误判，正式写作仍以过去时为默认。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 出处待核（TA-14）：&lt;/b&gt;历史现在时已登记在项目纲领中，但其语篇语言学专著出处（Wolfson 1979）本轮未检索核实，清单中标「待核」，入模前须补核。这里如实呈现，不装作已核完。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;了 = 做成了（实现）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;过 = 经历过（经验体）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;着 = 持续（另一维）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;完成时 = 和现在有牵连&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt; retelling a trip: &quot;Last summer we &lt;b&gt;went&lt;/b&gt; to the zoo（过去时讲事实）. I &lt;b&gt;have been&lt;/b&gt; there three times（经历连到现在）. Then the tiger &lt;b&gt;comes&lt;/b&gt; out — wow!（高潮处切换成『演』的现在时）&quot; —— 三段各有各的道理。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 学习顺序 TA-17 TA-18 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-order&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;66&quot; width=&quot;60&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;85&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;went&lt;/text&gt;&lt;rect x=&quot;90&quot; y=&quot;52&quot; width=&quot;60&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;120&quot; y=&quot;71&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;saw · had&lt;/text&gt;&lt;rect x=&quot;162&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;197&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#fff&quot; font-weight=&quot;700&quot;&gt;系统大表&lt;/text&gt;&lt;path d=&quot;M78 74 L90 68 M150 60 L162 48&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;先用熟高频词，系统自己浮出来&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学时态的顺序：先把 went、saw、had 用熟，再回头看系统表（TA-17）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Tomasello 用法基础习得观）：孩子的大脑是从一个个具体词例里长出系统的——高频动词的过去式先被整存，成为锚点；讲故事讲顺了，时态大表自己会慢慢浮出来。先灌系统表，顺序反了。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;第一步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;went / saw / had / ate / took&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;天天用的高频不规则过去式，先在故事里用熟、整存——它们是全系统的锚点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 用顺了，再连点成面&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;第二步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;walked / played / watched（-ed 家族）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;规则过去式成组跟上：形状统一，靠量取胜，和第一步的「钉子户」并存。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最后才摊开系统&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;第三步&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;两个开关总表（回到第 1 屏）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这时再看「时间 × 看法」大表，表里每个格子都有孩子自己的例句垫底。高年级补系统表有显性学习的效率优势——是先后，不是取舍。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 证据强度（TA-18）：&lt;/b&gt;「镜头讲法」（把时态讲成看法）有实验支持：Drożdż（2011）及 2024 年准实验显示认知解释组占优；但 Bielak &amp;amp; Pawlak（2011）只测出与传统教法相当。而且现有证据全部来自青少年和成人，&lt;b&gt;没有 6–12 岁随机对照实验&lt;/b&gt;。用于小学属合理外推，必须标「待验」——本 app 采用镜头讲法，但不宣称「已被证明更优」。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;高频先行&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;图式从词例中涌现&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;系统表后置&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;证据：方向有据 · 低龄待验&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;A term of stories: Lily first &lt;b&gt;went&lt;/b&gt; everywhere in her tales, then &lt;b&gt;saw&lt;/b&gt; and &lt;b&gt;had&lt;/b&gt; joined, and one day she lined them up herself: &quot;went, saw, had — 都是过去！&quot; —— 系统是被她自己发现的，这才是顺序对了的样子。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：最容易混的四对&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;时态选错，多半是开关拨错：先问「锚点在哪、看的是什么」，再选形式。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：完成时 vs 一般过去时（一句话判据）&lt;/h4&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th&gt;问题&lt;/th&gt;&lt;th&gt;一般过去时&lt;/th&gt;&lt;th&gt;现在完成时&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;能不能点名过去时间？&lt;/td&gt;&lt;td&gt;能：I saw him &lt;b&gt;yesterday&lt;/b&gt;.&lt;/td&gt;&lt;td&gt;不能：*I have seen him yesterday.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;眼睛看哪？&lt;/td&gt;&lt;td&gt;看过去那件事本身&lt;/td&gt;&lt;td&gt;看它留给现在的痕迹&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;典型搭档&lt;/td&gt;&lt;td&gt;yesterday / last night / in 2019&lt;/td&gt;&lt;td&gt;since / for / ever / just&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：will vs going to（倾向，不是分工表）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;Watch out! You&#x27;re going to drop it!&lt;/span&gt;（眼前有预兆）vs &lt;span class=&quot;en&quot;&gt;&quot;I&#x27;ll catch it!&quot;&lt;/span&gt;（当场答应）。两者大量语境可换，抓原型即可，不背分工表（TA-11 边界）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：「了 / 过」与完成时的重叠地图（TA-16）&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;对得上&lt;/span&gt;&lt;br&gt;经历：去过北京&lt;br&gt;have been to Beijing&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;半对&lt;/span&gt;&lt;br&gt;结果持续：钥匙丢了&lt;br&gt;常可 have lost，但着眼点不同&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;对不上&lt;/span&gt;&lt;br&gt;「了」只表做成了&lt;br&gt;点名时间时必须用过去时&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例四：一般现在时的三份正经工作（TA-04）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;习惯&lt;/span&gt; I get up at seven. · &lt;span class=&quot;en&quot;&gt;道理&lt;/span&gt; Water boils at 100°C. · &lt;span class=&quot;en&quot;&gt;时刻表&lt;/span&gt; The bus leaves at eight. —— 「正在发生」不在它的职责范围内，那是进行时的工作。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频时态病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因大多来自三处：把「了/过」直译、给完成时点名时间、忘了动词的形状。下面病句均为学习者高频错误类型，点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have seen him yesterday.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I saw him yesterday.&lt;/span&gt; —— 病因：完成时的眼睛盯着现在（TA-05)，yesterday 把事件钉回过去，两套定位打架（TA-06)。点名时间讲过去，是一般过去时的专职。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I am knowing the answer.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I know the answer.&lt;/span&gt; —— 病因：know 是「静止的牌子」，没有过程可看（TA-07 动词的时间形状）。牌子套不进进行时的镜头。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The train will leaves at six tomorrow.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ The train leaves at six tomorrow.&lt;/span&gt; —— 病因：时刻表把未来写成了已定的事实，借一般现在时就够（TA-13)；will 是借来的帮手，不能和 leaves 的衣裳叠穿。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ If I am you, I will help him.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ If I were you, I would help him.&lt;/span&gt; —— 病因：假设是把事情「推远」到现实之外，要用过去形式管距离（TA-08)。am 站在眼前，装不下「假如」。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ When we got to the cinema, the film has started.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ …the film had started.&lt;/span&gt; —— 病因：叙事锚点已经搬到过去（got 到达那一刻），更早的事要站在锚点回头看，用过去完成时（TA-09)。has 的锚点在现在，和故事的时间线脱节。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I have finished my homework at eight last night.（想说「我昨晚八点写完了作业」）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I finished my homework at eight last night.&lt;/span&gt; —— 病因：把汉语「了」（做成了）直译成完成时（TA-16)。「了」只报告做成，不问与现在的牵连；一旦点名时间，就归一般过去时管。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;拨开关选时态 · 进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. I ___ my key yesterday, so I couldn&#x27;t get in.（点名了昨天——哪顶帽子？）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;lost&quot;&gt;&lt;div class=&quot;opt&quot;&gt;have lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;am losing&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. I can&#x27;t get in. I ___ my key!（不说时间，只说现在进不了门这个结果）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;have lost&quot;&gt;&lt;div class=&quot;opt&quot;&gt;lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;have lost&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;lose yesterday&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. Shh! The baby ___ now.（正在发生，要钻进镜头里看）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;is crying&quot;&gt;&lt;div class=&quot;opt&quot;&gt;cries&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is crying&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;cry&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. ___ you help me, please?（把请求推远一点，更客气）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;Would&quot;&gt;&lt;div class=&quot;opt&quot;&gt;Will&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;Would&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;Do&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. Look at the black clouds! It ___ rain.（预兆已经摆在眼前）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;is going to&quot;&gt;&lt;div class=&quot;opt&quot;&gt;is going to&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;rains&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;rained&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. The film ___ at seven tonight.（电影院节目单：已定的事实）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;starts&quot;&gt;&lt;div class=&quot;opt&quot;&gt;will starts&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;starts&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. When we arrived, the film ___ already ___.（站在「到达」回头看更早的事）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;had … started&quot;&gt;&lt;div class=&quot;opt&quot;&gt;has … started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;had … started&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is … starting&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 同构；分歧与待核如实呈现（将来时之争 TA-02、现时相关含糊性批评 TA-05、历史现在时出处待核 TA-14、镜头讲法低龄证据待验 TA-18）。&lt;br&gt;知识来源：《专家规律总结清单 v1》时态与体组 TA-01 – TA-18（Comrie 1976/1985；Langacker 1991/2001；Vendler 1957；Bybee et al. 1994；CGEL 2002；章振邦；连淑能 1993）。&lt;br&gt;条目索引：屏1 TA-01/02 · 屏2 TA-03/04/07 · 屏3 TA-05/06/12 · 屏4 TA-08/09 · 屏5 TA-10/11/13 · 屏6 TA-14/15/16 · 屏7 TA-17/18 · 对比台与病句医院回指各条。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
 document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
 const f=document.getElementById(b.dataset.f);
 f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
 b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));

&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 句型构式（CO-01 – CO-16）&lt;/span&gt;
&lt;h1&gt;句型模具厂&lt;/h1&gt;
&lt;p&gt;句型不只是单词排队：模具本身带意思。动词是面团，倒进不同的模具，出来的味道就不一样。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总规律（CO-01）：&lt;/b&gt;整句的意义大于动词意思之和——多出来的那部分，是模具给的。所以每个句型都自带一出「戏」：谁给谁、谁变样、谁在哪儿。学句型 = 学每台模具自带的戏。&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;mold&quot;&gt;模具总纲&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;give&quot;&gt;双宾模具&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;gate&quot;&gt;模具门禁&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;move&quot;&gt;致使移动&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;result&quot;&gt;结果模具&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;stage&quot;&gt;出场与主角&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;engine&quot;&gt;一台发动机&lt;/div&gt;
&lt;div class=&quot;tab&quot; data-p=&quot;build&quot;&gt;建筑术与边界&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 模具总纲 CO-01 CO-11 CO-12 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-mold&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;path d=&quot;M30 84 L58 34 L86 84 Z&quot; fill=&quot;none&quot; stroke=&quot;#b0512f&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;58&quot; cy=&quot;70&quot; r=&quot;9&quot; fill=&quot;#f2b134&quot;/&gt;&lt;path d=&quot;M104 60 L132 60&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;132,60 122,55 122,65&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;150&quot; y=&quot;38&quot; width=&quot;70&quot; height=&quot;46&quot; rx=&quot;10&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;3&quot;/&gt;&lt;path d=&quot;M162 74 L174 52 L186 74 L198 52 L210 74&quot; fill=&quot;none&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;58&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;面团（动词）&lt;/text&gt;&lt;text x=&quot;185&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;点心（整句）多了模具的味&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;句型像模具：多出来的味道，是模具给的（CO-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Goldberg 1995，构式语法奠基）：构式是「形式—意义」的配对体。动词决定大半，但当整句的意思不能由动词完全预测时，剩下的意义由模具本身贡献——这是本厂全部机器的工作原理。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;证据一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He baked her a cake.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;bake 词典里没有「给」，整句却多出「给她」——多出来的只能来自模具（详见第 2 屏）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 大脑也是先认模具的&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;证据二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;给句子分组时，先按句型分，不按动词分。&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;心理实验（Bencini &amp;amp; Goldberg 2000；中国学习者样本亦复现，CO-11）：让人给句子归类，多数先认出「这是给东西的句型」，再看是哪个动词。模具是真实的心理单位，不是老师编的口诀。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 模具从哪来：一条家族谱系&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;谱系&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;整句背下 → 半成品框架 → 抽象模具&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;CO-12：背熟的整句话（语块）、能换零件的「I want ___」、看不见摸不着的句型模具，是一家三代——背得越多、用得越活，模具越清楚。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 专家有分歧（CO-01）：&lt;/b&gt;生成语法传统质疑抽象模具会不会「过度生成」（什么都解释 = 什么都没解释）；Goldberg 本人在书中讨论过这条批评。本 app 取构式口径，并把分歧如实记着。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;双宾 = 给东西的戏&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;致使移动 = 弄过去的戏&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;结果 = 弄成样的戏&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;There be = 出场介绍的戏&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;One verb, three molds: Tom &lt;b&gt;kicked&lt;/b&gt; the ball（一脚，普通戏）. Tom &lt;b&gt;kicked&lt;/b&gt; the ball &lt;b&gt;into the goal&lt;/b&gt;（致使移动：球被踢到某处）. The goalkeeper &lt;b&gt;kicked&lt;/b&gt; the mud &lt;b&gt;off his boots&lt;/b&gt;（把泥踢掉：路径还是模具给的）——同一个 kick，换模具就换一出戏。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 双宾 CO-02 CO-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-give&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;circle cx=&quot;46&quot; cy=&quot;48&quot; r=&quot;14&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;34&quot; y=&quot;64&quot; width=&quot;24&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;86&quot; y=&quot;44&quot; width=&quot;34&quot; height=&quot;26&quot; rx=&quot;5&quot; fill=&quot;#f2b134&quot;/&gt;&lt;path d=&quot;M66 56 L84 56&quot; stroke=&quot;#b0512f&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;86,56 76,51 76,61&quot; fill=&quot;#b0512f&quot;/&gt;&lt;circle cx=&quot;176&quot; cy=&quot;48&quot; r=&quot;14&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;rect x=&quot;164&quot; y=&quot;64&quot; width=&quot;24&quot; height=&quot;26&quot; rx=&quot;6&quot; fill=&quot;#c05a8e&quot;/&gt;&lt;text x=&quot;103&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96690a&quot;&gt;东西&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;人 + 人 + 东西 = 有人收到了东西&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;双宾模具自带「让某人收到某物」：bake 进去，就长出「给」义（CO-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：模具的中心义是图式化的「X 让 Y 收到 Z」。动词只需提供「怎么给」的方式（烤、做、买、写……），「给」这层意思由模具供给——所以本无「给」义的动词入模后，都能读出转移。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;中心义&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She gave me a book. / He showed us a photo.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;真把东西交出去——全家的大哥，住在正中间。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 动词换掉，「给」还在&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;入模生义&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;He baked her a cake. / Mum made me a kite.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;bake、make 词典里都没有「给」；放进模具，「给她、给我」自己长出来——母语者对现编的新动词也能立刻这样读。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 一家人：围着「转移」的亲戚们&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;家族&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I promised him a bike.（答应给）/ Grandma baked us a pie for when we visit.（做给、打算给）/ They refused him entry.（不让他拿到）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;CO-06：双宾是一个意思家族——成功转移是中心，引申出打算给、答应给、做给他、拒绝给，各义都围着「转移」这张图，不是巧合罗列。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：双宾 vs to 式&lt;/b&gt; —— 给出东西有两条路：模具直达（give me the book）与介词小路（give the book to me）。多数 give 类动词两条路都走得通；但有些动词只能走小路——那是下一屏「门禁」的事。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;真给 give / show / send&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;做给 bake / make / build&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;答应给 promise / offer&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;拒绝给 refuse&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Grandma &lt;b&gt;baked&lt;/b&gt; Leo &lt;b&gt;a cake&lt;/b&gt;（做给他）, &lt;b&gt;promised him&lt;/b&gt; a story after dinner（答应给）, and &lt;b&gt;showed him&lt;/b&gt; an old photo（递给他看）. —— 三句话共用一台模具：总有人收到点什么。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 门禁 CO-03 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-gate&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;88&quot; y=&quot;18&quot; width=&quot;74&quot; height=&quot;86&quot; rx=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#b0512f&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;150&quot; cy=&quot;62&quot; r=&quot;4&quot; fill=&quot;#b0512f&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;46&quot; width=&quot;52&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#e2f4e5&quot; stroke=&quot;#3d9e50&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;46&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#257a35&quot;&gt;bake ✓&lt;/text&gt;&lt;rect x=&quot;178&quot; y=&quot;46&quot; width=&quot;58&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#fdeeee&quot; stroke=&quot;#d66&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;207&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; font-weight=&quot;700&quot; fill=&quot;#b33636&quot;&gt;explain ✗&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;进门要过两道关：意思关 + 长相关&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;有些动词进不了双宾模具：要过意思关，还要过「长相」关（CO-03）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Pinker 1989 双层分析）：宽域规则先查意思——动词得含「有意把东西交出去」；窄域规则再逐类查「长相」——本族短词、重音在前面的容易进；拉丁出身、又长又绕的词被抗拒。两关都过，才能进双宾。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;意思关&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;*explain me this（✗）→ explain this to me（✓）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;explain 是「说清楚」，不是「交东西」——意思不对路，只能走 to 的小路把话送到对方面前。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 长相关：词的出身与形状&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;长相关&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;*donate the library a book（✗）→ donate a book to the library（✓）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;donate 意思明明是「给」，却进不了门：它太长、重音不在前，是拉丁源词的典型长相。give、send 这些短词则畅通无阻。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 结论：逐词攒语感，没有万能公式&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;用法&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;say / tell 分工：tell me a story（✓）· say it to me（✓）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;窄域小类靠逐类习得：新动词进不进双宾，要查证、靠语感积累。本项目句型库已定版：explain / say / donate 只走 to 式。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;dispute&quot;&gt;&lt;b&gt;诚实角 · 专家有分歧（CO-03）：&lt;/b&gt;Groefsema（2001）等指出「长相」限制的解释覆盖不足，语义因素的权重应更高。本 app 保留 Pinker 双层说（它对真词与新造词的预测有经典实证），并注明此分歧，不装作定论。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;畅通 give / send / show / bake&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;走小路 explain / donate / describe&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;say→to · tell→双宾&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&quot;Teacher, &lt;b&gt;explain&lt;/b&gt; this word &lt;b&gt;to me&lt;/b&gt;, please.&quot;（走小路）— &quot;OK, I&#x27;ll &lt;b&gt;give you&lt;/b&gt; an example.&quot;（直达）— &quot;And &lt;b&gt;tell me&lt;/b&gt; a story with it!&quot;（tell 直达）—— 同一分钟里，两条路按门禁各行其道。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 致使移动 CO-04 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-move&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;86&quot; width=&quot;150&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;52&quot; cy=&quot;52&quot; r=&quot;12&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;path d=&quot;M70 48 Q104 26 138 44&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;path d=&quot;M138 44 Q168 58 190 84&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 3&quot;/&gt;&lt;rect x=&quot;182&quot; y=&quot;80&quot; width=&quot;26&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;114&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;一个喷嚏，把餐巾纸「喷」下了桌&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;致使移动模具：喷嚏也能「打飞」一张餐巾纸（CO-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：这台模具自带「让某物沿着一条路移动」的意思。不及物动词（sneeze、laugh 本来谁也不带动）入模后，模具补上「致使 + 路径」，动词只提供「用什么方式弄动的」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;标志例&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Sam sneezed the napkin off the table.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Goldberg 书中的经典例句：sneeze 词典里没有「弄飞」，整句的致使移动义来自模具（1995: 29）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一台模具，不同的方式&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;换方式&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;She laughed him out of the room. / The wind blew the leaves into the yard.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;笑、吹、踢、滚——方式随便换，「弄得某物到某处」的骨架是模具的。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 门禁：要有真实的致使链&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;*He knew the ball over the fence.（✗）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「知道」产生不了物理推动，模具和动词意思不相容，就会被拒——模具不是谁都能进（与第 3 屏门禁同理）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;kick the ball into the goal&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;roll the barrel down the hill&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;sneeze … off the table&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;The wind &lt;b&gt;blew&lt;/b&gt; the map &lt;b&gt;off the desk&lt;/b&gt;. Leo &lt;b&gt;rolled&lt;/b&gt; the ball &lt;b&gt;under the sofa&lt;/b&gt; to hide it, and &lt;b&gt;kicked&lt;/b&gt; his shoes &lt;b&gt;into the corner&lt;/b&gt;. —— 三句都是「方式（动词）+ 路径（模具）」拼出来的。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 结果 CO-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-result&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;36&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;66&quot; rx=&quot;6&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;path d=&quot;M96 63 L116 63&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;116,63 106,58 106,68&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;128&quot; y=&quot;30&quot; width=&quot;52&quot; height=&quot;66&quot; rx=&quot;6&quot; fill=&quot;#e2483d&quot;/&gt;&lt;circle cx=&quot;204&quot; cy=&quot;52&quot; r=&quot;10&quot; fill=&quot;#f2b134&quot;/&gt;&lt;path d=&quot;M196 62 L186 78&quot; stroke=&quot;#96690a&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一扇门：刷 → 变成红色&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;结果模具：「把某物弄成某个样」——变样的意思来自模具（CO-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：结果构式贡献「状态变化 + 终点状态」。动词提供手法（刷、擦、锤），结尾的小词提供终点（red、clean、flat）——两半缺一，「变成什么样」这出戏就不成立。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;原型例&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;paint the door red / wipe the table clean&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;paint 只管刷、wipe 只管擦；「成红色、变干净」是模具在句尾安排的终点。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 换手法，骨架不变&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;换手法&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;hammer the metal flat / push the door open&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;锤平、推开——手法随便换，后面必须跟着一个「变成的样子」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 边界：终点要能被动作直接造成&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;?He sang the baby asleep.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;唱歌「造成」入睡太间接，这类句子要很强的语境才勉强成立。小学阶段只用 paint / wipe / make 等原型动词教，不钻边角。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：结果 vs 普通宾语&lt;/b&gt; —— wipe the table（擦桌子：桌子是对象）vs wipe the table clean（把桌子擦干净：clean 是模具要的终点）。多出的那个词不是修饰桌子，是报出「戏的结局」。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;paint … red&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;wipe … clean&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;make … happy&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;push … open&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;Art class: Ann &lt;b&gt;painted&lt;/b&gt; her box &lt;b&gt;blue&lt;/b&gt;, &lt;b&gt;wiped&lt;/b&gt; the desk &lt;b&gt;clean&lt;/b&gt;, and &lt;b&gt;made&lt;/b&gt; her deskmate &lt;b&gt;happy&lt;/b&gt; with a drawing. —— 三个结局（蓝、干净、开心），全是模具在句尾报出来的。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 出场与主角 CO-07 CO-08 CO-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-stage&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;88&quot; width=&quot;218&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#5a6b78&quot;/&gt;&lt;path d=&quot;M52 88 L82 30 L112 88 Z&quot; fill=&quot;#fdf6ec&quot; opacity=&quot;.85&quot;/&gt;&lt;circle cx=&quot;82&quot; cy=&quot;66&quot; r=&quot;10&quot; fill=&quot;#f2b134&quot;/&gt;&lt;path d=&quot;M150 88 L172 44 L194 88 Z&quot; fill=&quot;#f1f0fa&quot; opacity=&quot;.9&quot;/&gt;&lt;rect x=&quot;160&quot; y=&quot;62&quot; width=&quot;24&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;舞台中央站谁，谁就是主语&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;主语是「镜头主角」：谁站在舞台中央，谁当主语（CO-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（Langacker）：主语编码的是「首要焦点参与者」，不保证是动作的发出者。做事的人只是主角的原型——门自己开、钥匙开门、故事被讲，主角都可以另有其人。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;出场介绍&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;There is a dog in the garden.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;There be 是「出场介绍」模具（CO-07）：把新面孔领上台。所以主语多半是新客——*There is the dog 就别扭（清单列举等特殊语境除外）；它和 have 的「我领有」是两出不同的戏。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一出戏，换主角&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;被动&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;Tom broke the window. → The window was broken.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;被动是「换主角」（CO-08），不是「没人做主语时的救急」：想让大家看窗户怎么样了，就把窗户推到舞台中央，施事退后或隐去。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 主角不一定动手&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;非施事主角&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The door opened. / The key opened the door.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;门没「做」开门的动作、钥匙更不会——它们只是镜头对准的那一位。判读时仍要结合动词和语境分清角色，不能只看位置。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：There be vs have&lt;/b&gt; —— There is a book on the desk.（向大家介绍：桌上有本书——出场）/ I have a book.（这本书归我——领有）。中国孩子的名句 *There has a book on the desk，就是把两出戏混成了一出。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;出场 There is / are&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;换主角 be + 过去分词&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;主角 ≠ 动手的人&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;&lt;b&gt;There is&lt;/b&gt; a small shop on our street（领出新面孔）. The shop &lt;b&gt;was opened&lt;/b&gt; by Mr Lee last year（主角换成店）. Mr Lee &lt;b&gt;has&lt;/b&gt; two cats（领有，另一出戏）. —— 三句三种站位，各演各的。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 发动机 CO-13 CO-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-engine&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;26&quot; y=&quot;44&quot; width=&quot;72&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;#b0512f&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;69&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#fff&quot;&gt;发动机&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96502c&quot;&gt;戴时态帽子&lt;/text&gt;&lt;rect x=&quot;128&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;to do&lt;/text&gt;&lt;rect x=&quot;182&quot; y=&quot;50&quot; width=&quot;44&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;204&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;doing&lt;/text&gt;&lt;text x=&quot;176&quot; y=&quot;34&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;零件：脱帽，穿工作服&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;一个分句，只有一台能上牌的发动机&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;一个分句只有一台「上牌发动机」：后面的动词要脱帽穿工作服（CO-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（CGEL 限定/非限定分析）：时态这顶帽子一个分句只能戴一次，戴在第一个动词上。跟在后面的动词不带独立时态，必须换上 to do 或 doing 的「工作服」出场——穿哪件，由前面的动词点名（CO-14）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;工作服一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I want to go. / She decided to stay.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;want、decide 点名 to：第二个动词脱帽穿 to 的工作服。*I want go 就是零件没穿衣服出厂。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 工作服二：换个东家换件衣服&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;工作服二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I enjoy swimming. / He finished doing his homework.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;enjoy、finish 点名 -ing。穿哪件是词条级的搭配事实，不是自由二选一——记动词时把搭档一起记下来。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一个动词，两件衣服两种意思&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;分工&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;stop to smoke（停下来，去抽烟）≠ stop smoking（戒烟）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;like to do / like doing 也有细差。选择和意义挂钩，但推不出一条总规则——只能以「动词 + 框架」为记忆单位（本项目已裁定：旧「to/-ing 二分口诀」作废，改「动词决定搭配」）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：并列谓语是特许结构&lt;/b&gt; —— come and see、go and play 共享同一台发动机，不算「两个动词都没穿工作服」，别误伤。助记可以有（未来指向多配 to、已然活动多配 -ing)，但只能标「倾向」，不许冒充规则。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;want / hope / decide → to&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;enjoy / finish / mind → -ing&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;stop 两件衣服两意&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;I &lt;b&gt;want to learn&lt;/b&gt; swimming. I &lt;b&gt;enjoy swimming&lt;/b&gt; every week, and I &lt;b&gt;hope to join&lt;/b&gt; the school team. —— want 点 to、enjoy 点 -ing、hope 点 to：三位东家，三次点名，全对上。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 建筑术与边界 CO-15 CO-16 CO-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-build&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;120&quot; viewBox=&quot;0 0 250 120&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;30&quot; width=&quot;12&quot; height=&quot;58&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;56&quot; y=&quot;30&quot; width=&quot;12&quot; height=&quot;58&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;24&quot; y=&quot;22&quot; width=&quot;56&quot; height=&quot;8&quot; rx=&quot;3&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;rect x=&quot;24&quot; y=&quot;88&quot; width=&quot;56&quot; height=&quot;8&quot; rx=&quot;3&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;52&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f7db0&quot;&gt;英语：先立柱子&lt;/text&gt;&lt;path d=&quot;M108 78 Q150 44 186 70 T232 58&quot; fill=&quot;none&quot; stroke=&quot;#c05a8e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;180&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#c05a8e&quot;&gt;汉语：像流水铺展，最后点题&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;英语先立骨架再挂修饰，汉语先铺垫后点题：两种句子建筑术（CO-15）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（连淑能《英汉对比研究》形合/意合）：英语靠形式标记先确立主谓骨架、再往四周扩展，像盖楼先立柱；汉语靠语义衔接线性铺展、重心在后，像流水。语序差异只是建筑术差异的表层结果。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;英语式&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;The boy who won the race is my brother.&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;主干 The boy is my brother 先立住，who won the race 是后挂的房间——再长也不塌，因为柱子先在。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 汉语式直译过来，就会「柱子迟到」&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;诊断&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;中国学生作文的成类问题：主语缺失、谓语叠床、状语全堆句首。&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;不是单词错了，是建筑术没切换。先立骨架（谁 + 做什么），再挂修饰——这是可以练的顺序感。形合/意合是统计大势，不是逐句判错的定律。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 最后一课：每台机器都有辖区（边界）&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;模具管「整句的戏」，词形细节归形态层管。（CO-16）&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;模具告诉你谁给谁、谁变样；但时态对不对、-s 加没加，要去隔壁形态车间检查（那是语法组 GR 的辖区）。讲法越界，就会编出新的假规律——本厂的机器全部标了辖区。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;学句型的顺序（CO-10）：&lt;/b&gt;孩子不是先学抽象模具的——先整句住进来（I want ___ 只换最后一个词），换得多了，模具自己浮出来（Tomasello 动词岛）。所以本厂的学法是：先用熟整句，再点破模具，最后才换零件乱搭。生成语法派对此有不同解释（认为句法范畴有先天基础），本 app 取用法基础口径并记录分歧。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;亲戚们：&lt;span class=&quot;chip&quot;&gt;形合 英语 · 意合 汉语&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;先骨架 后修饰&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;模具辖区 = 论元结构&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;词形辖区 = 形态层&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;案例小故事：&lt;/b&gt;作文修改课：✗ &quot;Because the rain was heavy, so we stayed home, very happy.&quot;（铺垫太久、so 叠床）→ ✓ &quot;We stayed home because the rain was heavy, and we were happy.&quot;（柱子先立：we stayed home，原因和心情随后挂上）—— 词没换几个，建筑术一换，句子就站住了。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：同一出戏，两种拍法&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;构式题选错，多半是没认出是哪台模具：先问「这出戏是谁给谁、谁变样、谁出场」，再选形式。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例一：给东西的两条路&lt;/h4&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th&gt;动词&lt;/th&gt;&lt;th&gt;双宾（直达）&lt;/th&gt;&lt;th&gt;to 式（小路）&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;give / bake / show&lt;/td&gt;&lt;td&gt;✓ give me the book&lt;/td&gt;&lt;td&gt;✓ give the book to me&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;explain / donate&lt;/td&gt;&lt;td&gt;✗ explain me this&lt;/td&gt;&lt;td&gt;✓ explain this to me&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;say / tell&lt;/td&gt;&lt;td&gt;✓ tell me a story&lt;/td&gt;&lt;td&gt;✓ say it to me&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;p style=&quot;margin-top:6px&quot;&gt;门禁两关：意思关（explain 不是交东西）+ 长相关（donate 太长、重音在后）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例二：主动 vs 被动，不是「谁没了」，是「镜头对准谁」&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;The dog chased the cat.&lt;/span&gt;（镜头跟狗）→ &lt;span class=&quot;en&quot;&gt;The cat was chased (by the dog).&lt;/span&gt;（镜头跟猫）。事件一点没变，变的只是舞台中央站谁——这就是 CO-08/CO-09 在真实语篇里的样子：新闻标题爱用被动，因为读者关心的是「出事的东西」。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例三：stop 的两件工作服&lt;/h4&gt;
&lt;div class=&quot;tri&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;stop to do&lt;/span&gt;&lt;br&gt;停下手里的事&lt;br&gt;去做另一件&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;stop doing&lt;/span&gt;&lt;br&gt;把正在做的&lt;br&gt;停下来不做了&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;span class=&quot;w&quot;&gt;判据&lt;/span&gt;&lt;br&gt;没有总口诀&lt;br&gt;按「动词+框架」记&lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;案例四：There be 的主语为什么多半是「新客」&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;There is a new student in our class.&lt;/span&gt;（介绍新面孔 ✓）vs &lt;span class=&quot;en&quot;&gt;*There is the new student…&lt;/span&gt;（听众还不认识他时别扭）。出场介绍的功能决定了定指限制——除非是清单点名：&lt;span class=&quot;en&quot;&gt;There is the bus!&lt;/span&gt;（等的车到了，特许）。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的高频句型病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病因集中在三处：模具认错、门禁没过、第二动词没穿工作服。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Please explain me this word.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Please explain this word to me.&lt;/span&gt; —— 病因：explain 过不了双宾的意思关（CO-03)：它只「说清楚」，不「交东西」，必须走 to 的小路。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ There has a book on the desk.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ There is a book on the desk.&lt;/span&gt; —— 病因：把「出场介绍」（There be）和「领有」（have）两出戏混成一出（CO-07)。桌上「有」书是向人介绍新面孔，用 There be。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I want go home.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I want to go home.&lt;/span&gt; —— 病因：一个分句只有一台发动机（CO-13),go 是后面的零件，必须穿上 to 的工作服。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I enjoy to swim in summer.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f4&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f4&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I enjoy swimming in summer.&lt;/span&gt; —— 病因：enjoy 点名的是 -ing 工作服（CO-14)。穿哪件由前面的动词定，不是自由二选一。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ My mother bought a new bike to me.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f5&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f5&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ My mother bought me a new bike.（或 bought a new bike for me)&lt;/span&gt; —— 病因：buy 的「给」走双宾直达或 for 小路（CO-02)，to 小路是给 explain 那类动词用的；把汉语「给我买」逐字套 to，是模具认错。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The window broke by Tom.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f6&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f6&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ The window was broken by Tom. / Tom broke the window.&lt;/span&gt; —— 病因：想让窗户当主角（被动站位，CO-08)，就必须给它配齐被动的形式 be + 过去分词；只挪位置不换形式，戏就串了。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;认模具选句型 · 进阶测验&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1. He baked ___ a cake.（bake 本无「给」义，是模具给的）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;her&quot;&gt;&lt;div class=&quot;opt&quot;&gt;to her&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;her&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;for her to&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2. 哪句对？（explain 要过门禁）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;explain this to me&quot;&gt;&lt;div class=&quot;opt&quot;&gt;explain me this&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;explain this to me&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;explain me to this&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3. Sam sneezed the napkin ___ the table.（致使移动：弄到哪里去）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;off&quot;&gt;&lt;div class=&quot;opt&quot;&gt;off&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;is&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;to napkin&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4. Paint the door ___.（结果模具：句尾要报出「变成什么样」）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;red&quot;&gt;&lt;div class=&quot;opt&quot;&gt;a brush&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;red&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;slowly please&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5. ___ is a dog in the garden.（向大家介绍一位新面孔）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;There&quot;&gt;&lt;div class=&quot;opt&quot;&gt;It has&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;There&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;Has&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6. I enjoy ___ in the sea.（enjoy 点名的工作服）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;swimming&quot;&gt;&lt;div class=&quot;opt&quot;&gt;to swim&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;swimming&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;swim&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7. The window was broken. 这句把镜头对准了谁？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;窗户&quot;&gt;&lt;div class=&quot;opt&quot;&gt;打破窗户的人&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;窗户&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;没人，救急句&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：一屏一机制的骨架与介词组 v2 同构；分歧如实呈现（构式过度生成之争 CO-01、拉丁源限制权重之争 CO-03、动词岛 vs 先天句法 CO-10）；构式辖区边界见 CO-16。&lt;br&gt;知识来源：《专家规律总结清单 v1》句型构式组 CO-01 – CO-16（Goldberg 1995；Pinker 1989；Langacker 2008；Tomasello 2003；CGEL 2002；连淑能 1993）。&lt;br&gt;条目索引：屏1 CO-01/11/12 · 屏2 CO-02/06 · 屏3 CO-03 · 屏4 CO-04 · 屏5 CO-05 · 屏6 CO-07/08/09 · 屏7 CO-13/14 · 屏8 CO-10/15/16 · 对比台与病句医院回指各条。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
 document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
 t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
 const f=document.getElementById(b.dataset.f);
 f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
 b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起处方&#x27;:&#x27;看处方&#x27;;
}));
