&lt;!-- 整块选 CB-01 CB-02 CB-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-chunk&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#fdf1e7&quot; stroke=&quot;#b85c1e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#96500f&quot;&gt;现成的一块&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;34&quot; width=&quot;96&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot; stroke=&quot;#93a3ad&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;54&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;一词一词现拼&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96500f&quot;&gt;平时用得最多&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;只是退路&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;108&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;说英语像搭积木，不是一个字一个字现刻&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说英语像拿现成的积木块搭东西，不是一个字一个字现刻（CB-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：Sinclair 的两套原理——open-choice（逐词填槽）与 idiom principle（整块选取半预制短语）。语料证据显示整块选取远比传统语法假设的普遍，是默认模式；逐词拼装只是退路。两套是同一过程的两端、随时切换，不是二选一。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;认词认伙伴&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;认一个词，还要认它的小伙伴——有些词总是一起出现，拆开用就怪怪的（CB-02）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;搭配（collocation）指两个或多个词在一小段距离内共现；共现不是随机的，搭配的词是「一次共同选择」的结果，搭配本身带着意义：知道一个词，还要知道它常和谁来往、躲着谁。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 怎么知道的？数出来的&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;先信文本&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;想知道英语到底怎么说，别光凭感觉——去数一数大家真的怎么说（CB-03）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;Sinclair 的方法论：连母语者和语言学家的语感，对频率、搭配、场合分布的判断都系统性不可靠；只有大规模检索真实文本，语言事实才会浮现。他晚年还提出：意义的典型单位比一个词大，是一组共选的词。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;搭配是概率倾向，不是铁律——有的词后面几乎什么都能跟，有的词伙伴高度固定（CB-02）。而且数出来「常一起出现」还不等于「值得教」，要再看学习者的需要和汉语会不会干扰。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（CB-03）：&lt;/b&gt;语料只能告诉我们「人们这样说」，不能单独决定「课堂该不该教」；教什么还要叠加年龄、需求与目标。语料收了什么文本，结论就只能推广到多大范围。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能用：&lt;span class=&quot;chip&quot;&gt;学新词时连它的常见伙伴一起记&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;拿不准怎么说，先想「课本和故事里是怎么整句说的」&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 两种样子 CB-04 CB-05 CB-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-register&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;line x1=&quot;30&quot; y1=&quot;52&quot; x2=&quot;220&quot; y2=&quot;52&quot; stroke=&quot;#93a3ad&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;52&quot; r=&quot;11&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;circle cx=&quot;202&quot; cy=&quot;52&quot; r=&quot;11&quot; fill=&quot;#b85c1e&quot;/&gt;&lt;text x=&quot;48&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#2f5f8f&quot;&gt;聊天端&lt;/text&gt;&lt;text x=&quot;48&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;我、你、动词多&lt;/text&gt;&lt;text x=&quot;202&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96500f&quot;&gt;文章端&lt;/text&gt;&lt;text x=&quot;202&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;名词打包多&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5a6b78&quot;&gt;一条尺子：越聊越热闹 ←→ 越包越紧实&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;说话像聊天，越聊越热闹；写文章像打包，越包越紧实（CB-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：Biber 的多维分析统计几十个语法特征的共现，发现它们成团出现：第一、二人称代词、缩略式、现在时、问句总是一起多（会话端）；名词、介词、定语形容词、长词总是一起多（学术散文端）。两团互补——背后是交际功能在驱动：实时互动 vs 高密度传信息。这条维度叫 Dimension 1。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;差别是系统的&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;说话和写文章本来就是两种样子——说话时「我、你」多，写文章时名词多；不是谁对谁错（CB-04）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;LGSWE 团队用 4000 万词的口语与书面英语料，按会话、小说、新闻、学术散文分别统计：差别源于产出条件（实时互动 vs 可以反复修改的信息打包），不是水平高下。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;预制砖&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;有些词总是手拉手一串出现，学会整串，说话写字都顺（CB-05）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这类反复出现的词串叫词汇束（lexical bundles），判据纯统计：出现够频、分布够广。会话里如 &lt;span class=&quot;en&quot;&gt;do you want me to&lt;/span&gt;，学术文章里如 &lt;span class=&quot;en&quot;&gt;in the case of the&lt;/span&gt;——每个场合有自己的一套常用砖。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;数字纪律：&lt;/b&gt;CB-04 里语域的页码级百分比（如某语域名词占比）在簇文件中标注为待核（二手转引、原书页面未开），本屏只呈现已核实的定性图景，不把待核数字当定版展示。&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧如实登记（CB-05）：&lt;/b&gt;词串在纸面上高频共现，不等于大脑里整存整取——加工实验发现，学习者读词汇束并不比读普通词串更快，没有测出整存优势。「常一起出现」与「整块存储」不能划等号。另注意：语域是连续谱不是四个盒子，小说里有大量对话、演讲稿在中间，不能拿群体倾向评判单个句子（CB-04／CB-06）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能观察：&lt;span class=&quot;chip&quot;&gt;读对话时数一数「I / you」出现多少次&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;读课文说明文时找一找长长的名词打包&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 口语规矩 CB-07 CB-08 CB-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-spoken&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;22&quot; width=&quot;218&quot; height=&quot;34&quot; rx=&quot;12&quot; fill=&quot;#fdf1e7&quot; stroke=&quot;#b85c1e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#96500f&quot;&gt;That friend of yours, did you see her again?&lt;/text&gt;&lt;rect x=&quot;16&quot; y=&quot;66&quot; width=&quot;218&quot; height=&quot;34&quot; rx=&quot;12&quot; fill=&quot;#f2f6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;88&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#2f5f8f&quot;&gt;It&#x27;s a great place to visit, Barcelona.&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;先端出话题，或在句尾补一句——都是口语的规矩&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先把要说的东西「端到前面」，或说完了在后面「补个尾巴」——不是说错了（CB-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：CANCODE 口语语料（500 万词）显示，会话中常把话题成分前置（heads，如上第一句），或在句末把代词展开成名词短语（tails，如上第二句）。Carter &amp;amp; McCarthy 在《Cambridge Grammar of English》（2006: 192）中的定性：这是非正式口语语法的标准特征，功能是替听者安排信息焦点，服务实时加工。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;含糊是本事&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;说「蓝蓝的东西」「…什么的」不是偷懒——有时候不用说那么准，听的人反而更舒服（CB-08）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;&lt;span class=&quot;en&quot;&gt;thing、stuff、or something、sort of&lt;/span&gt; 这类模糊说法在口语里极其常见且成系统：标记「精确不重要／拿不准／给对方留面子」。Carter &amp;amp; McCarthy 的定性（2006: 202）：模糊语言更可能是熟练而敏感的说话人的标志，应被鼓励而非纠正。诚实边界：时间、数量、指令、安全事项需要精确时，含糊就是错误——学的是「会选」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;句子之上还有一层&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;聊天时话可以省着说（「喝茶吗？」），听的人还要搭腔（「太好了！」）——这些省和搭都有规矩（CB-09）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;口语在实时互动中生成，长出句子语法管不到的装置：情境省略（语境清楚时省主语、助动词）、插入语（&lt;span class=&quot;en&quot;&gt;well、oh、right&lt;/span&gt;）、应和词、称呼语。McCarthy 的提法：句子进入真实话语，语法就变成「话语语法」，单位是话轮而不是孤立的句子。低龄教学先做听辨与模仿，不讲术语。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;口语规矩 ≠ 没有规矩。heads/tails、省略、模糊都属非正式口语场合；正式写作与考试作文里不用——是「换场合换规则」，不是「书面语序不作数」（CB-07）。省略以「语境能补回来」为条件，补不回就是病句（CB-09）。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;待核如实标：&lt;/b&gt;CB-07/08/09 所引《Cambridge Grammar of English》页码（182／192／202）来自教学文章的逐页转引，原书页面本轮未打开核对，页脚已列入待核清单；定性结论以语料与转引互证为准。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能观察：&lt;span class=&quot;chip&quot;&gt;听对话时找一找「补在句尾」的那句&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;该说准时说准，不重要时可以说「什么的」&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 词穿外套 CB-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-pattern&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;text x=&quot;125&quot; y=&quot;26&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;reflect&lt;/text&gt;&lt;rect x=&quot;14&quot; y=&quot;40&quot; width=&quot;66&quot; height=&quot;42&quot; rx=&quot;8&quot; fill=&quot;#fdf1e7&quot; stroke=&quot;#b85c1e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;47&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#96500f&quot;&gt;外套一&lt;/text&gt;&lt;text x=&quot;47&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;反射光&lt;/text&gt;&lt;rect x=&quot;92&quot; y=&quot;40&quot; width=&quot;66&quot; height=&quot;42&quot; rx=&quot;8&quot; fill=&quot;#f2f6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#2f5f8f&quot;&gt;外套二&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;映出样子&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;40&quot; width=&quot;66&quot; height=&quot;42&quot; rx=&quot;8&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;203&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#4c439e&quot;&gt;外套三&lt;/text&gt;&lt;text x=&quot;203&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;仔细思考&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;同一个词，换外套就换意思（例子出自 Hunston &amp;amp; Francis）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;同一个词，穿不同的「句子外套」，意思就不一样——看词要连外套一起看（CB-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：Hunston &amp;amp; Francis 的型式语法——一个词的 pattern 是与它规律性相伴、并对它的意义有贡献的全部词与结构（2000: 37）。同一词的不同义项通常由不同型式区分（reflect 的三义分别对应不同的句子型式，见图），同一型式槽位里出现的词往往意义相亲。结论：词汇与语法不是两个盒子，词选型式，型式定义词义。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;连外套一起记&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;学词的时候把它的外套一起带走：&lt;span class=&quot;en&quot;&gt;good at…&lt;/span&gt;、&lt;span class=&quot;en&quot;&gt;look at…&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;簇文件给儿童的落地正是这一条：连型式一起记词，不背型式术语表。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 外套也是倾向，不是铁框&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;诚实边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;型式是概率性的「搭配＋结构」倾向，强型式与自由组合之间是连续谱，不是每个词都被一件外套锁死（CB-10）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;易混对比：&lt;/b&gt;只背单词表（词＝一个中文意思）vs 连型式记词（词＋外套＋意思一起）——前者会在换外套时认不出词已经换了意思（CB-10）。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能用：&lt;span class=&quot;chip&quot;&gt;记新词时顺手记它最常穿的那件外套&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 先学谁 CB-11 CB-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-order&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;26&quot; width=&quot;190&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;rect x=&quot;30&quot; y=&quot;26&quot; width=&quot;133&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;#b85c1e&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#5a6b78&quot;&gt;最常用的约 700 个词，覆盖了日常文本的约七成&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;再往后学，覆盖涨得越来越慢（Willis 1990）&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#b33636&quot;&gt;但频率是成人世界的频率——孩子的先学谁，要再对一遍&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;先认识出场最多的那一小队词——它们到处都是（CB-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：Willis 的词汇大纲主张按频率组织接触顺序而非按语法项目分级：最高频的词同时携带英语最常用的型式与用法，「抓住常用词，就不可避免地抓住了常用型式」。数据依据为 COBUILD 语料统计（Willis 1990）：约 700 词覆盖约 70% 文本，其后覆盖率陡降。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;一个意思一级&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;同一个词有好几个意思，先学会最常用的那个，其他意思长大一点再学——词是一层一层认识的（CB-14）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;English Vocabulary Profile（English Profile 计划，Capel 领衔）的分级单位不是词条，而是单个义项与短语：如 &lt;span class=&quot;en&quot;&gt;bring&lt;/span&gt; 的「带来」义标为 A2，短语 &lt;span class=&quot;en&quot;&gt;bring sth to an end&lt;/span&gt; 标为 C1。级别依据是剑桥学习者语料中全球学习者的实际产出——画的是习得的真实次序，不是编者的直觉排序。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 顺序表也要对本地孩子校准&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;诚实边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;频率是成人通用语料的频率，孩子的世界（家庭、学校、游戏）分布不同，直接套用会错过儿童高频词（CB-11）；EVP 的级别刻画全球通用学习者，不是中国小学生的专属次序，且它标的是「能产出」，孩子听读能懂的通常更早，不能拿级别卡输入难度（CB-14）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家分歧如实登记（CB-11）：&lt;/b&gt;频率 ≠ 可教性。Widdowson 的反诘：高频词的抽象用法（如 &lt;span class=&quot;en&quot;&gt;make a decision&lt;/span&gt;）虽然更常出现，却未必比具体用法（&lt;span class=&quot;en&quot;&gt;make a cake&lt;/span&gt;）更适合初学者先学；Willis 本人也承认一般频率不是唯一标准。定顺序时频率要与孩子的认知可达性对冲。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能用：&lt;span class=&quot;chip&quot;&gt;先把最常见的一小队词学扎实&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;一个词先学透一个意思，再加新意思&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 错误地图 CB-12 CB-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-map&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;30&quot; width=&quot;64&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#fdeeee&quot; stroke=&quot;#d66&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;46&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#b33636&quot;&gt;用错&lt;/text&gt;&lt;text x=&quot;46&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;看得见&lt;/text&gt;&lt;rect x=&quot;93&quot; y=&quot;30&quot; width=&quot;64&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;多用&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;只数得出&lt;/text&gt;&lt;rect x=&quot;172&quot; y=&quot;30&quot; width=&quot;64&quot; height=&quot;46&quot; rx=&quot;9&quot; fill=&quot;#f2f6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;203&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;少用&lt;/text&gt;&lt;text x=&quot;203&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;只数得出&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;三种毛病，只第一种靠眼睛看得见，后两种要靠数&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学英语的毛病不只是「用错」，还有「安全的词说太多、该用的词不敢用」（CB-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师／家长）：Granger 的对比中介语分析（CIA）揭示三型差距：misuse（用错）、overuse（多用，多为回避难点的「安全牌」）、underuse（少用，母语者常用的表达系统性缺席）。传统错误分析只看得见第一型；后两型是频率分布问题，只有语料对比能照出来。教学干预随之分工：少用要补输入，多用要推着走出舒适区。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;两面镜子&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;把很多学习者写的英语收集起来，和英语国家的人写的、和其他国家学习者写的比一比——就能看出每个国家的孩子容易在哪儿摔跤（CB-12）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;基础设施是 ICLE 学习者语料库（第二版涵盖 16 个母语群体）及其口语库 LINDSEI（14 个母语背景）。两类对比分工：学习者 vs 母语者，照出与目标的距离；不同母语学习者之间，分离出「母语迁移的特异困难」与「所有学习者共有的发展困难」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 方法能搬，名单不能照抄&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;诚实边界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;ICLE／LINDSEI 的主体是中高级、多为大学阶段的学习者，他们的困难清单不能直接当中国小学生的困难清单——方法可迁移，结论须用本地学习者语料重验（CB-12）。多用／少用也是群体统计结论，落到某个孩子身上还要再看成因（CB-13）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;待核如实标：&lt;/b&gt;CB-12 未采用 ICLE 总词量数字——转述口径与官方页面不一致，簇文件已注明待官方手册核实，本屏不展示该数字。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;今天就能用：&lt;span class=&quot;chip&quot;&gt;改作文时除了圈错，想想「哪些好说法我一直没用过」&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：把容易混的摆在一起&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;真实句子摆在一起看，比背定义清楚。例子均为簇文件原例。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对比一：口语端 vs 文章端（CB-04／CB-06）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;That friend of yours, did you see her again?&lt;/span&gt;（聊天：先端话题、代词多、问句——投入互动端）vs 学术散文里名词与介词短语层层打包（信息密度端）。差别来自产出条件，是系统的、可数的，不是「口语不规范」。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对比二：整块选 vs 逐词拼（CB-01）&lt;/h4&gt;
&lt;p&gt;会话里整串出现的 &lt;span class=&quot;en&quot;&gt;do you want me to&lt;/span&gt; 是整块取用的；新造词、专名、术语表达更靠逐词拼装一端。两套原理随时切换——把「整块」说成唯一方式，同样是把倾向说成了铁律。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对比三：同一个词，三件外套（CB-10）&lt;/h4&gt;
&lt;p&gt;&lt;span class=&quot;en&quot;&gt;reflect&lt;/span&gt; 表「反射光」「映出」「思考」时分别穿不同的句子型式（Hunston &amp;amp; Francis 2000: 255–256）。只背「reflect＝反映」一个意思，换件外套就认不出——这就是型式语法的课堂含义。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;真实语料观察室：三种「频率错位」病历&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;本簇登记的学习者问题不是单个病句，而是语料对比照出的三型分布问题（CB-13，鲁汶 CECL 官方页明言 CIA 与错误分析揭示此三型）。病例按三型呈现，不编造个体病句。点「看病历说明」展开。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病历一 · 用错（misuse）：真实错误，眼睛看得见&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看病历说明&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;这是传统错误分析唯一看得见的一型。配套的计算机辅助错误分析使用 50 余个错误标签的标注体系（CECL 官方页）。&lt;span class=&quot;good&quot;&gt;处置方向：定位错误本身（CB-12／CB-13）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病历二 · 多用（overuse）：安全的词说得太多&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看病历说明&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;某些词与结构在学习者产出中显著多于母语者，多为回避难点的「安全牌」。单个句子挑不出错，只有频率对比能照出来。&lt;span class=&quot;good&quot;&gt;处置方向：推着走出舒适区（CB-13）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;病历三 · 少用（underuse）：该用的词一直缺席&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看病历说明&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;母语者常用的表达在学习者那里系统性缺席——不出现的东西，靠批改永远发现不了。基于错误标注语料开发的学习者词典提示框（如 Macmillan 学习词典的 get-it-right 提示）正是对这一型的工具回应（CECL）。&lt;span class=&quot;good&quot;&gt;处置方向：补输入（CB-13）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 先回到机制，再选&lt;/h2&gt;
&lt;p class=&quot;d&quot; style=&quot;font-size:12.5px;color:#7c8a94;margin-bottom:10px&quot;&gt;诊断题查机制，迁移题换个场景再查一次。答错不给新说法，只提示回哪一屏的机制。&lt;/p&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.「英语大部分时候是整块选出来的」——这说的是哪套原理占主导？（CB-01）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;a&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;a&quot;&gt;整块选取（idiom principle）&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;逐词填槽是唯一方式&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;先拼词再背整句&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.有人凭语感说「这个词肯定不常和那个词一起用」，按 CB-03 该怎么办？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;听语感最准的人的&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;去语料库里数一数&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;查词典的例句就够了&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.聊天记录里「I、you、问句、缩略」特别多，说明它落在这条尺子的哪一端？（CB-06）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;c&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;c&quot;&gt;投入互动端（聊天端）&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;信息打包端（文章端）&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;说明它不规范&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.&lt;span class=&quot;en&quot;&gt;It&#x27;s a great place to visit, Barcelona.&lt;/span&gt; 句尾的 Barcelona 是什么？（CB-07）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;d&quot;&gt;&lt;div class=&quot;opt&quot;&gt;说错了，多余的&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;d&quot;&gt;口语的「补尾巴」，把所指说清&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;正式写作的规范&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.一个学生作文从不算错，但老师总觉得「说法太单调、安全」——语料地图上这是哪一型？（CB-13）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;e&quot;&gt;&lt;div class=&quot;opt&quot;&gt;用错（misuse）&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;e&quot;&gt;多用安全牌＋少用好表达&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;没有任何问题&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6.为什么不能把成人频率表直接当小学生的先学顺序？（CB-11）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;f&quot;&gt;&lt;div class=&quot;opt&quot;&gt;频率表是错的&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;f&quot;&gt;孩子世界的词频分布不同，要再对一遍&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;小学生不用学常用词&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一条（组）总结（儿童版标题句＋示意图＋分级呈现＋诚实边界），机制与出处只进灰色小字层；频率只作观察工具呈现，不作教条；专家分歧（CB-05 整存之争、CB-11 频率与可教性之争）如实登记。&lt;br&gt;内容来源：《专家规律总结清单》增补簇 catalog_add_corpus.md —— 语料库与真实英语 CB-01 – CB-14，共 14 条（Sinclair 1991/2004；Biber 等 LGSWE 1999 与多维分析；McCarthy &amp;amp; Carter CANCODE／《Cambridge Grammar of English》2006；Hunston &amp;amp; Francis 2000；Willis 1990；Granger 与鲁汶 CECL 的 ICLE/LINDSEI/CIA；English Profile／Capel 的 EVP）。&lt;br&gt;待核项：5 项（LGSWE 页码级数字；CGE 页码引文 182/192/202；ICLE 总词量——未采用；LINDSEI 母语背景数版本沿革；Sinclair 1991 所据语料规模口径）——待核数字未上屏为定版。&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.addEventListener(&#x27;click&#x27;,()=&gt;{
document.querySelectorAll(&#x27;.tab&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
document.querySelectorAll(&#x27;.panel&#x27;).forEach(x=&gt;x.classList.remove(&#x27;on&#x27;));
t.classList.add(&#x27;on&#x27;);document.getElementById(&#x27;p-&#x27;+t.dataset.p).classList.add(&#x27;on&#x27;);
}));
document.querySelectorAll(&#x27;.btn&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{
const f=document.getElementById(b.dataset.f);
f.style.display=f.style.display===&#x27;block&#x27;?&#x27;none&#x27;:&#x27;block&#x27;;
b.textContent=f.style.display===&#x27;block&#x27;?&#x27;收起说明&#x27;:&#x27;看病历说明&#x27;;
}));
const WHY={a:&#x27;对了：整块选取是默认模式，逐词拼装只是退路（CB-01）。&#x27;,b:&#x27;对了：语感对频率与搭配的判断系统性不可靠，先信文本（CB-03）。&#x27;,c:&#x27;对了：代词、问句、缩略成团出现，是投入互动端的标记（CB-06）。&#x27;,d:&#x27;对了：句尾展开所指是口语的标准装置，叫 tails（CB-07）。&#x27;,e:&#x27;对了：安全牌多用与好表达少用都是频率错位，单个句子看不出来（CB-13）。&#x27;,f:&#x27;对了：频率来自成人通用语料，儿童的交际世界分布不同（CB-11）。&#x27;};
document.querySelectorAll(&#x27;.opts&#x27;).forEach(g=&gt;{
const fb=g.nextElementSibling;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(o=&gt;o.addEventListener(&#x27;click&#x27;,()=&gt;{
const v=o.dataset.v||o.textContent.trim();
const right=v===g.dataset.a;
g.querySelectorAll(&#x27;.opt&#x27;).forEach(x=&gt;x.classList.remove(&#x27;ok&#x27;,&#x27;no&#x27;));
o.classList.add(right?&#x27;ok&#x27;:&#x27;no&#x27;);
fb.textContent=right?(WHY[g.dataset.a]||&#x27;对了！&#x27;):&#x27;再想想：回上面对应那一屏，看机制和边界是怎么说的。&#x27;;
}));
});
&lt;/script&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 学习科学组（LS-01 – LS-15）&lt;/span&gt;
&lt;h1&gt;学法实验室&lt;/h1&gt;
&lt;p&gt;这一组讲的不是英语知识，而是「怎么学才记得牢」——每个知识点以什么节奏、什么练习形态、什么画面纪律交到你手里，背后都有实验在撑腰。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;pos&quot;&gt;&lt;b&gt;本组定位（如实说）：&lt;/b&gt;这 15 条主要是这个 &lt;b&gt;app 的设计律&lt;/b&gt;——为什么复习题总是隔几天才出现、为什么画面不堆热闹装饰，都是它们定的。你在这一组里看到两样东西：一是&lt;b&gt;你自己能用的学法小秘诀&lt;/b&gt;，二是「为什么这个 app 这样安排」的说明。设计律不是英语知识本身，不冒充。&lt;/div&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总纲（LS-01）：&lt;/b&gt;流行的学法和有效的学法，是系统性错位的——十种常见学法逐个评级后，拿到最高档的只有两种：&lt;b&gt;自己考自己&lt;/b&gt;（练习测验）和&lt;b&gt;把复习分散开&lt;/b&gt;（分散练习）；最受欢迎的划线和一遍遍重读，恰恰排在最低档。&lt;/div&gt;

&lt;div class=&quot;cov&quot;&gt;&lt;b&gt;覆盖表（15 条全部上屏）：&lt;/b&gt;&lt;br&gt;
LS-01 总纲屏 ✓ · LS-02 提取屏 ✓ · LS-03 提取屏 ✓ · LS-04 提取屏 ✓ · LS-05 提取屏 ✓ · LS-06 间隔屏 ✓ · LS-07 间隔屏 ✓ · LS-08 困难屏 ✓ · LS-09 困难屏 ✓ · LS-10 交错屏 ✓ · LS-11 自问屏 ✓ · LS-12 画面屏 ✓ · LS-13 画面屏 ✓ · LS-14 画面屏 ✓ · LS-15 课程屏 ✓&lt;/div&gt;

&lt;!-- 总纲 LS-01 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-rank&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;86&quot; y=&quot;14&quot; width=&quot;78&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#0e7c6b&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;30&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;高效用 ×2&lt;/text&gt;&lt;rect x=&quot;56&quot; y=&quot;46&quot; width=&quot;138&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;62&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#5c4300&quot;&gt;中效用 ×3&lt;/text&gt;&lt;rect x=&quot;26&quot; y=&quot;78&quot; width=&quot;198&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;#e7edf1&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#5a6b78&quot;&gt;低效用 ×5（划线、重读在这里）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀①：最有用的学法只有两个——把书合上自己考自己、把复习分开几天（LS-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（给家长）：Dunlosky 团队（2013）按十个标准系统评估了学生最常用的十种学习技巧，分三档。高效用只有练习测验与分散练习；中效用是精细化提问、自我解释、交错练习；低效用是做摘要、划线划重点、关键词记忆术、为课文造意象、一遍遍重读。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;高效用&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;练习测验&lt;/span&gt; + &lt;span class=&quot;en&quot;&gt;分散练习&lt;/span&gt;&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这正是本 app 的两根支柱：复习以「考你」的形式出现，而不是把课文再放一遍；同一内容拆开、隔几天再见面（见间隔屏 LS-06）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 低效用不是完全没用&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;看清低档&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;重读不是白读——只是同样的时间里，有明显更好的替代品。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;关键词记忆术（口诀类）对短时外语词配对有局部效果，但受材料和保持期限制，仍被评为低效用：口诀不能当学单词的主力。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;三档名单：&lt;span class=&quot;chip&quot;&gt;高效用：练习测验 · 分散练习&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;中效用：问为什么 · 自我解释 · 交错练习&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;低效用：摘要 · 划线 · 关键词术 · 造意象 · 重读&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;这份评级评估的是「学生能自主使用的技巧」，证据主体来自中学生以上与大学生。对小学生，结论要翻译成&lt;b&gt;由 app 和老师代为安排的练习形态&lt;/b&gt;——app 出题让你提取、app 替你排间隔，不能指望孩子自发用起来。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;app 为什么这样安排：&lt;/b&gt;你学完一课，过两天再打开，app 先不让你重看课文，而是先考你两道——这不是故意为难你，是 LS-01 和 LS-02 两条规律在排班。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 提取 LS-02 LS-03 LS-04 LS-05 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-retr&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;38&quot; y=&quot;26&quot; width=&quot;74&quot; height=&quot;52&quot; rx=&quot;8&quot; fill=&quot;#fff&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#0e7c6b&quot;&gt;合上书&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;自己想一遍&lt;/text&gt;&lt;path d=&quot;M118 52 h26&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;polygon points=&quot;144,52 134,46 134,58&quot; fill=&quot;#f2b134&quot;/&gt;&lt;rect x=&quot;150&quot; y=&quot;26&quot; width=&quot;74&quot; height=&quot;52&quot; rx=&quot;8&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;187&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;想出来&lt;/text&gt;&lt;text x=&quot;187&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;路就修宽了&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;提取不是检查，是把记忆的路再修一遍&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀②：学完别急着再看一遍——先合上，自己想：刚才讲了啥？（LS-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：提取不是检查记忆的中性动作，而是改造记忆的事件：每次努力把信息从脑子里「取出来」，取它的通路就被加固一分（Roediger &amp;amp; Karpicke 2006）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span style=&quot;width:74px&quot;&gt;反复测验组&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; style=&quot;width:61%;background:#0e7c6b&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;b&gt;61%&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;bar&quot;&gt;&lt;span style=&quot;width:74px&quot;&gt;反复重读组&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; style=&quot;width:40%;background:#b7c3ca&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;b&gt;40%&lt;/b&gt;&lt;/div&gt;
&lt;p class=&quot;mech&quot;&gt;一周后能回忆出课文的比例。重读组平均读了 14.2 遍，测验组只测了 3.4 遍。注意：刚学完 5 分钟时重读组反而占优——测验效应只在「隔一段时间再测」时成立。&lt;/p&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;答对≠毕业&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一个词答对了，别急着把它扔出复习堆——过几天再考两次，它才真正变成你的（LS-03）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;大学生学 40 对斯瓦希里语—英语词对的实验：答对后「继续考」的，一周后记得约 80%；答对后只「继续看」或被移出的，只剩约三分之一。所以本 app 的单词卡不会「答对一次就毕业」，而是降频保留、再考几次。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;考完要批&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;考完马上告诉我对不对、正确答案是啥（LS-04）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;选择题有个副作用：干扰项会被误记成真知识。反馈一边巩固答对的，一边拆掉被干扰项带偏的错误。在 app 里就是：答错后，正确形式会再完整出现一次——不只是打个叉。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;课堂实证&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;不算分的小测，在真实课堂里同样管用（LS-05）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;六年级社会课整学期实验：被小测过的内容，单元考与学期考都更好。八年级科学课：有小测的内容在总结考试上提升 13%–25%。前提是「小测不算分、低风险」——变成计分考试，证据就不直接适用了。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;LS-02/03/04 的原实验被试是大学生；LS-05 是 11–14 岁学生（六/八年级），是本簇年龄最接近的证据。向 6–10 岁外推时方向可信，但题型要更游戏化、单次题量更小。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 间隔 LS-06 LS-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-space&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;40&quot; cy=&quot;52&quot; r=&quot;13&quot; fill=&quot;#0e7c6b&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;学&lt;/text&gt;&lt;path d=&quot;M56 52 h34&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;circle cx=&quot;106&quot; cy=&quot;52&quot; r=&quot;13&quot; fill=&quot;#2f7db0&quot;/&gt;&lt;text x=&quot;106&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;复习&lt;/text&gt;&lt;path d=&quot;M122 52 h52&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;circle cx=&quot;190&quot; cy=&quot;52&quot; r=&quot;13&quot; fill=&quot;#7c5cd6&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#fff&quot;&gt;复习&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;见面次数拆开，每次间隔还慢慢拉长&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀③：今天学一点、过几天再碰一点，比把所有次数挤在今天记得牢（LS-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：间隔让第二次学习发生在「已经有点忘了」的状态——提取更费力，记忆被重新激活并改写加固。间隔效应是记忆研究里复制次数最多的现象之一（Cepeda 等 2006 定量合成）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;小孩证据&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;3 岁幼儿：范例之间只隔 30 秒，「间隔组」在记忆和归类上都胜过连着看的（Vlach 等 2008）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;小学低年级真实课堂：36 名孩子上科学课，间隔排课组在一周后测验的记忆与泛化两项上，都胜过集中排课组（Gluckman 等 2014）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;按比例隔&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;想记多久，就按比例隔多久（LS-07）：想记住一周的东西，间隔约占这一周的 20–40% 最好；想记住一年的东西，间隔占比降到约 5–10%。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;间隔不是固定天数，它跟着「你要记多久」一起长大，只是长得没那么快。太短，提取太容易、加固不足；太长，提取直接失败——中间有个最高点（1,354 名成人、32 条冷门事实、26 种组合测出来的「时间脊线」）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（数字有两个口径，不许混）：&lt;/b&gt;原论文口径是 317 个实验、184 篇文章、839 次评估；「254 项研究、14,000 多名被试、分散 47% vs 集中 37%」是 Dunlosky 等 (2013) 的转述口径——两套数字不能混搭引用。且儿童最优间隔的定量地图还不存在：app 排程只借方向（拆开、拉长），不借成人的天数参数。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;app 为什么这样安排：&lt;/b&gt;同一个单词不会在一天里连着考你五次，而是今天见一次、后天见一次、下周再见一次——每次见面都比上一次记得久一点（LS-06 / LS-07）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 困难 LS-08 LS-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-hard&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;30&quot; width=&quot;92&quot; height=&quot;26&quot; rx=&quot;8&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;68&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;存得深（只增不减）&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;30&quot; width=&quot;92&quot; height=&quot;26&quot; rx=&quot;8&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;182&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;取得出（会涨会落）&lt;/text&gt;&lt;path d=&quot;M68 62 v18 M182 62 v18&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;125&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;当下顺不顺，只看「取得出」那一条——它会骗你&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀④：练的时候有点费劲、偶尔想不起来，不一定是坏事（LS-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Bjork 夫妇给每条记忆记两种强度——存储强度（学得多扎实，只增不减）和提取强度（此刻多容易想起来，会涨会落）。当下表现只由提取强度决定；越是在「有点忘了」的时候成功想起来，加固越大。间隔、交错、提取练习有效，都是先把提取强度压低、再让你把它挣回来——这叫「合意困难」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;难在点子上&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;难，要难在点子上：字印得太小、声音太吵那种难，只会添乱，不会帮你学。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;反例已被实验否掉：把字体做得难认（所谓难读字体）并不带来记忆收益，复制检验失败（Taylor 等 2020）。「故意制造麻烦」不等于合意困难。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;眼熟≠会&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;课文打开看着都懂，一合上就想不起来——「看着眼熟」不算会（LS-09）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;答案摊在眼前时，它会把你的判断抬高（预见偏差）：你以为学会了，其实只是眼熟。补救办法就是 app 的做法：先遮住答案让你想、想不出来再看——能不能在看不见答案时自己想起来，那才算数。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;「合意」有硬门槛——难度必须落在靠努力能跨过去的范围里。孩子的工作记忆余量比成人小，剂量要更保守，还必须保留「想得出来」的成功体验：难到提不出来，就不是合意困难，只是失败。另外，两强度的划分是理论框架，批评者质疑它能否被分别测量——本组按「设计启发」使用它，不当测量工具。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 交错 LS-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-mix&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;24&quot; width=&quot;96&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;#eef3f7&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;66&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#5a6b78&quot;&gt;一类做完再换&lt;/text&gt;&lt;text x=&quot;66&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;排版替你选好了招&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;24&quot; width=&quot;96&quot; height=&quot;64&quot; rx=&quot;10&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;184&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;几类混着来&lt;/text&gt;&lt;text x=&quot;184&quot; y=&quot;68&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;每题先想：用哪招？&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;交错练的其实是「先选对方法」这一步&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀⑤：别把同一类题一口气做完——每道题先停一下想「这道该用哪一招」（LS-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：一类题连着做，题目的排版已经替你选好了方法，剩下的只有执行；混着练，每道题都要先辨别题型、再选方法——「辨别—选择」这一步本身被反复练到。同时，同类题被天然拉开了间隔（和 LS-06 叠加）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;当下反着来&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;大学生练立体体积题：练习时交错组 60%、分组组 89%——混着练当下更慢、更错。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;可一周后做新题：交错组 63%，分组组只剩 20%。当下顺不顺，和学没学到，是两回事（呼应 LS-08/LS-09）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;小孩证据&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;四年级儿童练棱柱题：两种排法间隔控制得一样，交错仍让一天后的测验成绩翻倍。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;七年级真实课堂（126 名学生、为期 3 个月）：复习后 1 天和 30 天的突击测验，交错组都胜出，间隔越久优势越大。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界 + 一处归属更正：&lt;/b&gt;网上常把「七年级课堂」记在 Rohrer &amp;amp; Taylor (2007) 名下——核对后：2007 年那篇是大学生实验，七年级课堂是 2015 年的另一篇研究，两者不许混搭引用。另：直接证据集中在数学，英语句型、词义混练属机制迁移；且交错要求先对各类有最低认识——零基础时先给少量示范（LS-14），再混着练。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;app 为什么这样安排：&lt;/b&gt;复习题里，刚做完一道过去时的题，下一道可能是问路的句子——不是排乱了，是在练你「先认出这是什么题、再选招」的那一步（LS-10）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 自问 LS-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-why&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;circle cx=&quot;80&quot; cy=&quot;46&quot; r=&quot;24&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;80&quot; y=&quot;53&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;为什么?&lt;/text&gt;&lt;path d=&quot;M108 46 h34&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;142,46 132,40 132,52&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;186&quot; y=&quot;40&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;这一步凭什么对？&lt;/text&gt;&lt;text x=&quot;186&quot; y=&quot;60&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;换个样子还对吗？&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;讲不出来的地方，就是还没懂的地方&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀⑥：看例题别只记答案——每一步都问自己「为什么这一步是对的？」（LS-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：两个同源技巧：精细化提问（面对一个事实追问「为什么这是真的」，把新信息和已有知识编织成网）与自我解释（研读范例时，为每一步补出它没写明的理由）。补出的推论，正是范例省略、而换个样子做题时必需的部分。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;讲得出才懂&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;大学生研读力学范例：学得好的平均每个范例给自己讲 15.3 条理由，学得差的只有 2.8 条；后测成绩 82% 对 46%。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;八年级学生读循环系统课文：只加一句「读完每句向自己解释一下」的提示，学习增益就显著大于自读组（Chi 等 1989 / 1994）。这是可教、可诱发的加工，不是学霸的个人习惯。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;给小孩的版本&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;低龄孩子面对开放式「为什么」常常无话可说——追问要做成有支架的形态。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;在 app 里就是：给两个候选理由让你选一选、把理由的后半句留给你补完，而不是把成人的发问原样搬给小学生。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;1989 年原研究只有 8 名大学生（相关发现），因果证据来自 1994 年 14 名八年级学生的提示实验，样本依然小。自我解释在儿童身上自发发生率低，需要程序或成人提示触发。Dunlosky 评级里两技巧只拿中效用——因为它们都要求「有可调用的已有知识」垫底。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 画面 LS-12 LS-13 LS-14 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-pic&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;24&quot; y=&quot;22&quot; width=&quot;60&quot; height=&quot;44&quot; rx=&quot;8&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;54&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot;&gt;🍎&lt;/text&gt;&lt;text x=&quot;54&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;apple&lt;/text&gt;&lt;path d=&quot;M92 44 h30&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;152&quot; cy=&quot;44&quot; r=&quot;15&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;152&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;图码&lt;/text&gt;&lt;circle cx=&quot;206&quot; cy=&quot;44&quot; r=&quot;15&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;206&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;词码&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;一个词配一幅对的图 = 给记忆留两个入口&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀⑦：一个词配上一幅对的图，脑子里就存了两份（LS-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Paivio 的双重编码理论——言语系统与意象系统各自独立、又互相联结。具体物象天然被存两份：图的样子一份，词的声音和拼写一份；想起图能带出词，想起词也能带出图。成人实验（合计 519 人）中，回忆成绩稳定呈「图片 &amp;gt; 具体词 &amp;gt; 抽象词」的次序。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;画面纪律&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;屏幕上的每样东西都要为学习干活（LS-13，Mayer 多媒体原则）：无关的热闹删掉、重要的地方做记号、讲到哪儿图就出现在哪儿、就放在旁白说的那个词旁边。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;实验账本（大学生、迁移测验）：删无关材料 d = 0.86（23/23 项实验支持）、旁白与动画同步 d = 1.22（9/9）、给信号标记 d = 0.41（24/28）。「词图就近摆放」的效应量原章未核到确切数字——&lt;b&gt;待核，不上屏当定版&lt;/b&gt;，只用「就近」这个方向。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;先看范例&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;刚学新本领，先看一个从头做到尾的例子，再自己动手；已经会了，例子就该撤掉（LS-14）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;新手直接上手，脑子被「找办法」占满，题做完了、方法没建成——这叫工作记忆超载（Sweller 认知负荷理论）。澳大利亚中学生实验：先研读范例的孩子，后续做题更快、错更少。等图式建成，同样的逐步指导反成累赘（专家反转效应），所以 app 的提示会随你的水平渐渐撤走。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;① 双重编码是图片优势的「主流解释之一」：近年有研究主张真正起作用的是「独特性」，教学结论「词配对图」在两派下都成立，但机制不许写成唯一定论。图还必须和词指同一物——装饰图不产生收益，反而违反一致性原则。② Mayer 的效应量来自大学生科学短片，不得转写成对儿童的收益承诺；低龄儿童的屏幕文字可能是解码脚手架，不整条套用「冗余原则」。③ 认知负荷的「三类负荷」在测量上能否干净分离仍有争议（Kalyuga 主张两类足够），本组按设计清单使用。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;app 为什么这样安排：&lt;/b&gt;动画里没有满屏乱飞的装饰，旁白说到哪个词、图就亮在哪里，新句型先给你一个完整的例子再让你接手——LS-12、LS-13、LS-14 三条一起定的规矩。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 课程 LS-15 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-course&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;250&quot; height=&quot;118&quot; viewBox=&quot;0 0 250 118&quot;&gt;&lt;rect x=&quot;14&quot; y=&quot;24&quot; width=&quot;52&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0e7c6b&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;听懂&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#0b5a4e&quot;&gt;读懂&lt;/text&gt;&lt;rect x=&quot;72&quot; y=&quot;24&quot; width=&quot;52&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#eef6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;98&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;说出&lt;/text&gt;&lt;text x=&quot;98&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;写出&lt;/text&gt;&lt;rect x=&quot;130&quot; y=&quot;24&quot; width=&quot;52&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;156&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;抠词&lt;/text&gt;&lt;text x=&quot;156&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#7c5cd6&quot;&gt;抠语法&lt;/text&gt;&lt;rect x=&quot;188&quot; y=&quot;24&quot; width=&quot;52&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;214&quot; y=&quot;46&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;练到&lt;/text&gt;&lt;text x=&quot;214&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;又快又顺&lt;/text&gt;&lt;text x=&quot;125&quot; y=&quot;100&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;四条线等时：少哪一条，课就瘸一条腿&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;学法小秘诀⑧：学英语的时间要分四份，差不多一样多（LS-15）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Paul Nation 的四线框架——意义聚焦输入（听故事、读绘本把意思弄懂）、意义聚焦输出（开口说、动手写把意思送出去）、语言聚焦学习（专门停下来抠单词和语法）、流利度发展（不学生词，只把已经会的练到又快又顺）。原文定版：「设计良好的课程里，四条线应大致平衡、各占约相等的时间。」&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;输入线&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;听读材料要保持约 98% 是你已经认识的词，只留少量新词可学。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;太难的故事不是输入，是噪音——98% 覆盖是输入线和流利度线互相划界的标尺。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;流利线&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;流利度活动有四条成立条件：材料全部熟悉、注意力在意思上、带一点速度压力、量要大。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;这条线最容易在课程里被整条漏掉；市面上最常见的失衡，是「抠词抠语法」一线独大、其余三线萎缩——四分之三的时间本应以意义为中心。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;「各占四分之一」是课程设计的&lt;b&gt;规范框架&lt;/b&gt;，不是实验测得的效应量，不许包装成「研究证明 25% 最优」。小学段只作巡检参照：输入靠听读故事、输出靠表演讲述、流利度靠复读复述与限时小游戏。另：四线等时归到 Nation (2001) 原书的说法本轮未核到，可核源头是 2007 年论文与 2012 年复述——引用时以此为准（待核登记）。&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;app 为什么这样安排：&lt;/b&gt;你每天打开 app，有时是听故事，有时是开口表演，有时停下来抠一个词，还有时是限时把学过的句子说顺——四种时间轮着来，就是 LS-15 在排课表。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;对比台：重读 vs 自测，摆在一起看&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;同一个内容、同样的时间，两种练法，一周后见分晓（LS-02 / LS-03）。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对照一：读 14.2 遍 vs 考 3.4 次&lt;/h4&gt;
&lt;p&gt;大学生学同一篇课文：反复重读组平均读了 &lt;span class=&quot;en&quot;&gt;14.2 遍&lt;/span&gt;，反复测验组只测了 &lt;span class=&quot;en&quot;&gt;3.4 次&lt;/span&gt;。刚学完 5 分钟测，重读组占优；&lt;b&gt;一周后再测：测验组回忆出 61%，重读组只剩 40%&lt;/b&gt;。而且重读组对自己的掌握更自信——自信和实际保持脱了钩（见 LS-09）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;对照二：答对之后，「继续看」vs「继续考」&lt;/h4&gt;
&lt;p&gt;词对实验（LS-03）：一个词答对以后，把它继续留在测验里，一周后记得约 &lt;span class=&quot;en&quot;&gt;80%&lt;/span&gt;；答对后改成只重学、或直接移出练习，只剩约&lt;span class=&quot;en&quot;&gt;三分之一&lt;/span&gt;。「会了就不用练了」这个直觉，对「看」成立，对「考」恰好相反。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;学法医院：流传很广、证据不站队的说法&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这三条都不是英语知识，是关于「怎么学」的流行说法——逐个按源文件口径验明正身。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 「只听记住 10%、读到 20%、看图 30%……图文结合记住 65%」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 这组百分比查无原始实验出处，禁用。&lt;/span&gt; —— 所谓「学习金字塔」数字在培训材料里流传很广，但 Paivio 从未给出此类比例（LS-12）。能站住的只有定性的那句：一个词配一幅对的图，回忆时多一条入口。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 「把字体做得难认一点，记得更牢」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 复制检验没有复现这个效果（Taylor 等 2020）。&lt;/span&gt; —— 合意困难（LS-08）的「难」必须作用在目标加工本身（想、选、辨别），字体难认、声音嘈杂这类难只添乱，不加固。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 「课文看着都眼熟，那就是学会了」&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ 眼熟是预见偏差（LS-09），不是掌握。&lt;/span&gt; —— 答案在眼前时人人高估自己。掌握的判据只有一个：遮住答案，自己能想起来。所以 app 判定你「会了」，靠的是遮住答案后的提取成败，不是跟读完一遍。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 回到机制再选&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.（诊断）小明考前把单词表读了十遍，觉得全会了，一周后忘了一大半。最主要的问题是？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;读的遍数还不够多&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;一直在重读、没合上书自测，还被「眼熟」骗了&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;单词表的字印得太清楚&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.（迁移）一个词你今天答对了。想让它一周后还在，接下来最好怎么办？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;立刻把它删出复习堆，毕业啦&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;过几天再考你两次&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;再抄写十遍&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.（迁移）要记住「一个学期都不能忘」的内容，复习间隔应该怎么排？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;固定每天一次，雷打不动&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;跟着要记的时长走：记越久、隔越开，但间隔占的比例慢慢变小&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;全挤在考试前一天&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.（诊断）做题时把同一类题全做完再换一类，练的时候很顺，考试却常常选不对方法。该怎么改？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;b&quot;&gt;&lt;div class=&quot;opt&quot;&gt;每类题再多做二十道&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;b&quot;&gt;几类题混着练，每道先想「这道该用哪一招」&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;练的时候把答案放旁边对照&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一条设计律 / 学法（儿童版「学法小秘诀」标题句 + 示意图 + 案例 + 诚实边界），每屏标注来源条目编号；源文件标为未核实的数字（如空间临近效应量）不上屏当定版，民间伪数字只在辟谣位以「错误说法」身份出现。&lt;br&gt;内容来源：《专家规律总结清单》学习科学簇 LS-01 – LS-15（catalog_add_learningscience.md，共 15 条；Dunlosky et al. 2013；Roediger &amp;amp; Karpicke 2006；Karpicke &amp;amp; Roediger 2008；Cepeda et al. 2006 / 2008；Bjork &amp;amp; Bjork；Koriat &amp;amp; Bjork 2005；Rohrer &amp;amp; Taylor 2007 / Taylor &amp;amp; Rohrer 2010；Chi et al. 1989 / 1994；Paivio 1971 / 1986；Mayer &amp;amp; Fiorella 2014；Sweller；Nation 2007）。&lt;br&gt;待核项：4 项（LS-13 空间临近原则效应量未在原章核到，不上屏数字；LS-14 相关负荷后期定位的原句；LS-15 四线表述归 Nation 2001 原书的页码；LS-08 Storm, Bjork &amp;amp; Bjork 2008 实验细节为转引）。&lt;/div&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 中国学者与全球传统组（CG-01 – CG-14）&lt;/span&gt;
&lt;h1&gt;中文这只手&lt;/h1&gt;
&lt;p&gt;你学英语，从来不是一张白纸：中文这只手一直在旁边，一会儿帮忙，一会儿使绊子。这一组先讲清它怎么帮、怎么绊，再讲全世界课堂试出来的组织办法。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总纲：&lt;/b&gt;中国孩子的英语，一半规律写在汉语这一侧——意思怎样连成一段（胡壮麟）、母语怎样既帮又扰（戴炜栋）、时间怎样借空间来搭（蓝纯）；另一半是全球传统试出来的办法——按「要办的事」排课、用 can-do 定目标、泡在语言里还得补上开口和纠错。&lt;/div&gt;
