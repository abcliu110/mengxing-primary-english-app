&lt;!-- 书架 PB-01 PB-02 PB-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-shelf&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;120&quot; viewBox=&quot;0 0 252 120&quot;&gt;&lt;rect x=&quot;6&quot; y=&quot;16&quot; width=&quot;76&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;路径簇&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;to / into / through…&lt;/text&gt;&lt;rect x=&quot;88&quot; y=&quot;16&quot; width=&quot;76&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;上方簇&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;above / over + across&lt;/text&gt;&lt;rect x=&quot;170&quot; y=&quot;16&quot; width=&quot;76&quot; height=&quot;58&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;下方簇&lt;/text&gt;&lt;text x=&quot;208&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;under / below&lt;/text&gt;&lt;path d=&quot;M44 84 v10 M126 84 v10 M208 84 v10&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2&quot;/&gt;&lt;rect x=&quot;52&quot; y=&quot;96&quot; width=&quot;148&quot; height=&quot;20&quot; rx=&quot;10&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#96690a&quot;&gt;第 21 章：从概念反查介词&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;介词书可以不按词编，按「意义簇」编（PB-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：Lindstromberg 把意义相邻的介词编成一簇一簇讲——每簇从核心词的基本义出发，越走越远地比它和邻居的差别；他的基本教学动作是「替换测试」：同一句里换掉一个介词，意义为什么变、怎样变。最后一章干脆倒过来：从想表达的概念出发，反查该用哪个介词——这是清单里此前完全没有的「产出端」组织法。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;证件照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;基本义要能「画出来」（PB-02）：on 的招牌图就是侧视图里一个圆团被一条线从下方托住。画不出来的词（如 with）就老实承认它没有单一基本图——能不能画，本身就是检验「基本义定得对不对」的尺子。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;他明确反对只靠搭配学介词：纯搭配法永远揭示不了 on what condition 与 under what condition 的意义差别。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 同一个 on，他拆成两张照片&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;拆两义&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;on1&lt;/span&gt;「接触承托」（贴在面上）与 &lt;span class=&quot;en&quot;&gt;on2&lt;/span&gt;「继续向前」（go on、on and on）（PB-03）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;两组用法的图式差异大到画不出同一张图时，拆分派宁可立两个基本义，也不为理论整齐硬连。Tyler &amp;amp; Evans 的处理相反：把「继续」义放在小品词引申一侧——这是介词词义学一条真实的断层线，本页登记不裁定。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;两种组织轴，不必二选一：&lt;/b&gt;现清单 P 组的总纲是「一个词一张网」（纵轴引申）；Lindstromberg 的总纲是「一簇词一张对照表」（横轴对照）。两者互补——清单此前只有前者，本簇补上后者。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界：&lt;/b&gt;Lindstromberg 本人承认，这些基本义的「认知真实性仍需实证支持」——图标是教学表征，不冒充心理实验结论。on2 在小学阶段不必立条教学，在短语动词单元以整块形式出现即可。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- over 双中心 PB-05 PB-06 PB-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-over&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;118&quot; viewBox=&quot;0 0 252 118&quot;&gt;&lt;path d=&quot;M14 62 q30 -34 62 -6&quot; fill=&quot;none&quot; stroke=&quot;#b26f00&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;76,56 64,50 66,62&quot; fill=&quot;#b26f00&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#96690a&quot;&gt;动态复合中心：从上方越过&lt;/text&gt;&lt;line x1=&quot;150&quot; y1=&quot;66&quot; x2=&quot;238&quot; y2=&quot;66&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;176&quot; y=&quot;38&quot; width=&quot;34&quot; height=&quot;18&quot; rx=&quot;4&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;193&quot; y=&quot;86&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#22685e&quot;&gt;静态中心：射体高于界标&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;over 的中心义，两家专著给了两个不同的答案（PB-05 / PB-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：这不是措辞差异，是网络拓扑差异——以动态复合为中心时，「静态上方」要靠抽掉路径得到；以静态 ABOVE 为中心时，「越过」义要靠「上方+路径」在线组合补出。哪边更省，正是判据之争。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;duo&quot;&gt;
&lt;div class=&quot;cell a&quot;&gt;&lt;h5&gt;甲案 · Brugman / Lakoff（源头，1981/1987）&lt;/h5&gt;
· 中心 = &lt;b&gt;动态复合图式&lt;/b&gt;：「沿路径从参照物上方越过」（飞机飞过院子、Sam 开车过桥）&lt;br&gt;
· 义项 &lt;b&gt;24+&lt;/b&gt; 个：每个节点都是全规格的具体用法类型（PB-05）&lt;br&gt;
· 连线 = &lt;b&gt;图式变换&lt;/b&gt;：对图式做小手术——聚焦路径终点、多点聚成面（PB-06）&lt;br&gt;
· 静态「在上方」（直升机盘旋）是抽掉路径后的近亲，&lt;b&gt;不是&lt;/b&gt;中心&lt;/div&gt;
&lt;div class=&quot;cell b&quot;&gt;&lt;h5&gt;乙案 · Tyler &amp;amp; Evans（修订，2001/2003）&lt;/h5&gt;
· 中心 = &lt;b&gt;静态原型场景&lt;/b&gt;：「射体高于界标」（ABOVE）&lt;br&gt;
· 义项压到 &lt;b&gt;15&lt;/b&gt; 个：过两关判据才算独立义项——带原型场景里没有的意义成分、且不依赖具体语境（PB-07）&lt;br&gt;
· 连线 = &lt;b&gt;语用强化&lt;/b&gt;：形式只是提示，意义在语境中在线建成&lt;br&gt;
· 直升机对海洋、蜂鸟对花，在乙案里是同一个「上方」义项的两次实现&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;源头长相&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;多义网络这张图是 Brugman 1981 年的硕士论文第一个画出来的（PB-05）；Rice (1993) 复刻的原网是多维网络，后世教材里整齐的「中心+辐射」星形图是 Lakoff 理想化之后的样子——源头比转述更交错。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;招牌节点：覆盖义（spread the tablecloth over the table）、分布义（guards posted all over the hill)、「在另一边」义（the village over the hill)、翻转义（turn over）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;连接机制&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;像传话游戏：每人只改一个字，传到最后句子面目全非，但每一步都能说清改了哪里（PB-06）。链式相连解释了为什么 over 一家没有一组共同特征、却仍是一个家族。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;「定案」之争，如实呈现：&lt;/b&gt;现清单 P-06 曾把乙案写成「全家福的定案示范」——&lt;b&gt;过满&lt;/b&gt;。甲案是源头学派的正式主张，乙案是&lt;b&gt;一方裁决&lt;/b&gt;，学界未有终局（Evans 2014 年自承其框架「可能过于简单」，二手述评）。本项目的教学取乙案，是取其可教性与可核查性，&lt;b&gt;不宣称学理已定案&lt;/b&gt;；另有 Sandra &amp;amp; Rice (1995) 的心理真实性质疑、Vandeloise (1990) 的简约性质疑，一并登记（PB-07）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 力与穿行 PB-04 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-force&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;118&quot; viewBox=&quot;0 0 252 118&quot;&gt;&lt;line x1=&quot;66&quot; y1=&quot;14&quot; x2=&quot;66&quot; y2=&quot;96&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;5&quot;/&gt;&lt;line x1=&quot;66&quot; y1=&quot;90&quot; x2=&quot;112&quot; y2=&quot;30&quot; stroke=&quot;#b26f00&quot; stroke-width=&quot;4&quot;/&gt;&lt;path d=&quot;M84 58 h-14&quot; stroke=&quot;#b33636&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;70,58 80,53 80,63&quot; fill=&quot;#b33636&quot;/&gt;&lt;text x=&quot;88&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;梯子顶着墙：接触 + 压力&lt;/text&gt;&lt;rect x=&quot;168&quot; y=&quot;34&quot; width=&quot;66&quot; height=&quot;44&quot; rx=&quot;6&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M156 56 h108&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;56&quot; r=&quot;7&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;201&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#7c8a94&quot;&gt;穿过介质：两端在外、中段在内&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;against 是「顶着」，through 是「从里面穿过去」（PB-04）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：against 的图式三要素是接触 + 压力/对抗方向——别的位置介词的画面里没有「力」，它是 Lindstromberg 书里配得上单独一章的词。through 的图式是路径 + 介质内通过，与 across「越过一个面」分工。这两个图式在现清单 P 组里&lt;b&gt;完全没有&lt;/b&gt;（against 查证为零，through 仅顺带出现、无分析）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;顶着&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;a ladder against the wall&lt;/span&gt;（墙替梯子挡住倒下的方向）· &lt;span class=&quot;en&quot;&gt;against the wind&lt;/span&gt;（逆着力走）&lt;br&gt;&lt;span class=&quot;why&quot;&gt;「反对、对抗」义是从这个身体画面直接长出来的：against the rules、fight against。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 穿过&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;穿行&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;火车穿过山洞：从这一头进、那一头出；介质可以是实体（tunnel)、群体（crowd)、森林，也可以是时段——&lt;span class=&quot;en&quot;&gt;through the night&lt;/span&gt; 是同一图式的时间版。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;学理上游是 Talmy 的力动态（清单 P-15 已引其名）；Lindstromberg 的处理是力动态在教学词典学中的落地版——清单此前有源无流，本条补流。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;教学边界：&lt;/b&gt;against 的力图式只需「静态倚靠」一个画面起步；through 的时间义属引申，小学只教空间穿行。against 的「反对」义在小学高年级阅读里高频，不必等。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 偏离会计 PB-08 PB-09 PB-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-dev&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;118&quot; viewBox=&quot;0 0 252 118&quot;&gt;&lt;rect x=&quot;16&quot; y=&quot;30&quot; width=&quot;56&quot; height=&quot;48&quot; rx=&quot;6&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;44&quot; cy=&quot;54&quot; r=&quot;9&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;44&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#22685e&quot;&gt;in · 包含&lt;/text&gt;&lt;line x1=&quot;96&quot; y1=&quot;66&quot; x2=&quot;152&quot; y2=&quot;66&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;124&quot; cy=&quot;56&quot; r=&quot;9&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;124&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#22685e&quot;&gt;on · 面接触&lt;/text&gt;&lt;circle cx=&quot;206&quot; cy=&quot;54&quot; r=&quot;6&quot; fill=&quot;#f2b134&quot;/&gt;&lt;circle cx=&quot;206&quot; cy=&quot;54&quot; r=&quot;16&quot; fill=&quot;none&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;206&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; fill=&quot;#22685e&quot;&gt;at · 当作点&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;每个介词只发一张几何自画像，其余全是「偏离」（PB-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：Herskovits 是单义架构——in 是「包含于有界空间内」，on 是「与面接触（并典型地被承托）」，at 是「与被当作一个点的界标重合」。这套框架出身人工智能：要让计算机既能解码又能编码，意义必须写成可算的几何描述。「当作点」是理想化操作：任何真实界标都有体积，把大地方看作一个点，是看法转换（与清单 P-05 相通）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;挂账&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;偏离报销方式一：约定俗成的&lt;b&gt;使用类型&lt;/b&gt;（PB-09）——如 on 可以只表接触、不表承托：画挂在墙上，没有东西托着它，也用 on。这是挂在理想意义之下的成文清单，属于词库的一部分。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;现场放行&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;偏离报销方式二：语用&lt;b&gt;容差&lt;/b&gt;——苹果摞在别的苹果上、高出碗沿，仍说 &lt;span class=&quot;en&quot;&gt;in the bowl&lt;/span&gt;：差不多成立，就当成立。说话像量身高，差一点点也算过关。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;四位交警&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;放行听四条语用原则指挥：&lt;span class=&quot;en&quot;&gt;the dust in / on the bowl&lt;/span&gt;——说 in 取「在碗内空间」，说 on 取「附在碗内表面」，哪个与话题相关选哪个（相关性）；&lt;span class=&quot;en&quot;&gt;the fountain behind the city hall&lt;/span&gt; 里喷泉必须离市政厅不远，这个「近」不在 behind 的几何里，是典型情境的知识（典型性）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;四条语用原则：&lt;span class=&quot;chip&quot;&gt;显著性&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;相关性&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;容差&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;典型性&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;功能知识（PB-10）：介词不只看形状，还看「这东西是干什么用的」。&lt;/b&gt;碗是用来盛东西的，所以摞高的苹果还算在碗里；墙是用来挂画的，所以没有托举的画也在墙上。思想链有三环：Herskovits (1986) 提出功能知识 → Coventry &amp;amp; Garrod 把它做成功能几何实验（清单 P-08）→ Tyler &amp;amp; Evans 把「承托」写进 on 的原型场景（清单 P-04）——清单此前只登记了后两环。&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;分歧不藏：&lt;/b&gt;Coventry &amp;amp; Garrod 直评 Herskovits 的使用类型「以特设方式挂在中心义上」——每遇反例就新登记一条类型，框架的解释力会被自己的清单吃掉。本清单的「已知例外必填」正是 Herskovits 式工具，好用的前提是登记纪律：例外要设上限、编号、有出处。另：单义架构（Herskovits）与多义网络架构（Brugman / Tyler &amp;amp; Evans）是框架级二选一，本项目已选多义为主框架，吸收她的「偏离会计」作例外层，不换主框架。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 刀口错位 PB-11 PB-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-cut&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;118&quot; viewBox=&quot;0 0 252 118&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;18&quot; width=&quot;106&quot; height=&quot;66&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;英语的刀&lt;/text&gt;&lt;text x=&quot;63&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;in 包住 · on 托住&lt;/text&gt;&lt;text x=&quot;63&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#8494a0&quot;&gt;紧不紧：不看&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;18&quot; width=&quot;106&quot; height=&quot;66&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;189&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;韩语的刀&lt;/text&gt;&lt;text x=&quot;189&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;kkita 紧贴 · nehta 松放&lt;/text&gt;&lt;text x=&quot;189&quot; y=&quot;75&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#8494a0&quot;&gt;包住还是托住：不分&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一桌积木（套戒指、嵌拼图、摞杯子），两种切法&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;空间范畴是各语言自己切的，孩子从小就学本语言的切法（PB-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师/家长层）：旧图景以为婴儿先有全人类相同的空间概念、词只是贴标签。Bowerman &amp;amp; Choi 的跨语言证据推翻了这个推论：英韩幼儿约 14–16 个月起产出分化，18–23 个月在不用语言的分类任务里就已按本语言的刀口看世界。词还会反过来扶着范畴长：只听到熟悉的 on 一词，就能帮 18 个月婴儿把「支撑」类事件归成一类（Casasola 2005）。结论不否认知觉基础——被否定的只是「词的范畴必然等于婴儿的知觉范畴」。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;margin-top:12px&quot;&gt;
&lt;span class=&quot;badge&quot;&gt;本簇推论 · PB-12（原理出自 PB-11，错位例为本簇逐例核对，非单一文献原话）&lt;/span&gt;
&lt;h4&gt;中国孩子的「刀口错位图」：汉语的刀与英语的刀在哪三处必然打架&lt;/h4&gt;
&lt;p&gt;&lt;b&gt;错位一 ·「上」横跨三家：&lt;/b&gt;在报纸上 = &lt;span class=&quot;en&quot;&gt;in the newspaper&lt;/span&gt;、在电视上 = &lt;span class=&quot;en&quot;&gt;on TV&lt;/span&gt;、在会上 = &lt;span class=&quot;en&quot;&gt;at the meeting&lt;/span&gt;。中文的「上」是一把大伞，英语把它拆成三把小伞。&lt;br&gt;
&lt;b&gt;错位二 ·「树上」再切一刀：&lt;/b&gt;同一个「在树上」，英语按「长在树上的一部分」与「位于枝叶之间」再切——苹果 &lt;span class=&quot;en&quot;&gt;on the tree&lt;/span&gt;，鸟 &lt;span class=&quot;en&quot;&gt;in the tree&lt;/span&gt;，汉语不切这一刀。&lt;br&gt;
&lt;b&gt;错位三 ·「紧贴」住在动词里：&lt;/b&gt;汉语把紧不紧放在动词里（塞进、套上、嵌进 vs 放进、装进），不在方位词里——中国孩子对「紧」有现成的注意，却要学会在选介词时&lt;b&gt;不看&lt;/b&gt;它。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k4&quot;&gt;为什么成批错&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;清单 P-11（CLEC 语料）记录了「错在哪」；PB-11 给出「为什么必然错在这类地方」：范畴切口在母语习得期已经长成，带着「上」这个大范畴去够英语，发生的是范畴级的系统迁移。病句医院的选题可由这张错位图直接生成：刀口交叉处即错误高发区。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;边界：&lt;/b&gt;错位图是&lt;b&gt;预测工具，不是定罪工具&lt;/b&gt;——个体错误还有语音、教学、粗心等来源，本屏不写任何错误率数字。「树上」一例也有语境变通：鸟落在枝头表面时口语可说 on a branch，那是界标换成「枝条」后的正确选择，不是本例的反例。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 意义链 PB-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-chain&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;112&quot; viewBox=&quot;0 0 252 112&quot;&gt;&lt;rect x=&quot;6&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;44&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;41&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;物理空间&lt;/text&gt;&lt;text x=&quot;41&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#5a6b78&quot;&gt;操场上学会的词&lt;/text&gt;&lt;path d=&quot;M80 52 h14&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;94,52 86,47 86,57&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;98&quot; y=&quot;30&quot; width=&quot;56&quot; height=&quot;44&quot; rx=&quot;9&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;时间&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#5a6b78&quot;&gt;at 5 · on Mon&lt;/text&gt;&lt;path d=&quot;M158 52 h14&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;polygon points=&quot;172,52 164,47 164,57&quot; fill=&quot;#b7c3ca&quot;/&gt;&lt;rect x=&quot;176&quot; y=&quot;30&quot; width=&quot;70&quot; height=&quot;44&quot; rx=&quot;9&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;211&quot; y=&quot;49&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;心理空间&lt;/text&gt;&lt;text x=&quot;211&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#5a6b78&quot;&gt;in love · at work&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;98&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一串词，沿着链走遍抽象域（Dirven 1993）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;物理空间怎么切，心理空间就怎么搭（PB-13）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：Dirven 把介词的空间概念排成一串链——先切物理空间，再走进时间，最后走进心理与抽象空间。链的抽象端不是含糊的「比喻义」，而是点名到户的域名单；at / on / in 是链上走得最远的三个词，在每个抽象域都有席位。这套链后来被 Radden &amp;amp; Dirven (2007) 的认知语法教材收编。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;抽象域名单（教师备课地图）：&lt;span class=&quot;chip&quot;&gt;状态：at work · on holiday · in love&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;话题：good at math · an expert on history&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;方式：on foot · at full speed&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;情境&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;原因&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;定位与边界：&lt;/b&gt;本条是&lt;b&gt;教师书房&lt;/b&gt;条目——链条只作教师备课地图（知道 in love、at work 的 in/at 从哪来），不对儿童讲授「链」本身。链条与 PB-06 的变换链同享心理真实性的质疑（Sandra &amp;amp; Rice 1995 一系）；时间用法按清单 P-09 的现行裁决选词，不把「时间全是空间的影子」说满。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;书房争论登记：分歧不许抹掉&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;学术争论放在教师/家长层呈现，但不为了「好懂」把分歧抹平。以下三条断层线，都是专著之间真实存在的。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;断层线一：一个词一个义，还是一个词一张网？&lt;/h4&gt;
&lt;p&gt;Herskovits（PB-08）是一词一义、偏离外包给使用类型与容差；Brugman / Tyler &amp;amp; Evans（PB-05 / PB-07）是一词多义、偏离内化为网络节点。两家对同一批例句（如苹果高出碗沿）给出不同账目。本项目已选多义架构为主框架，吸收 Herskovits 的偏离会计作例外层——这是&lt;b&gt;项目裁定&lt;/b&gt;，不是学界终局。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;断层线二：「功能」应该放在哪一层？三家三放&lt;/h4&gt;
&lt;p&gt;语用/世界知识层（Herskovits，PB-10）、语义的情境计算层（Coventry &amp;amp; Garrod 的功能几何，清单 P-08）、词义图式内部（Tyler &amp;amp; Evans 的功能要素，清单 P-04）——现清单三种放法混用而未自觉，本页登记此不一致，留待入模时统一裁定。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;断层线三：on 切一个还是切两个？&lt;/h4&gt;
&lt;p&gt;Lindstromberg 立 on1 / on2 两个基本义（PB-03），Tyler &amp;amp; Evans 只立一个原型场景。分析层切两个，与短语动词单元「整块储存」的学习层处理（清单 P-15）并不矛盾，但两个层面要在条目间互相注明，免得一处拆、一处合，自相矛盾。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：刀口交叉处的高频病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;病例由 PB-12 的刀口错位图直接生成（汉语刀口与英语刀口交叉之处，即错误高发区）。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ I read the news on the newspaper.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;pf1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;pf1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ I read the news in the newspaper.&lt;/span&gt; —— 「在报纸上」的「上」被汉语大伞罩住了：报纸的内容是「印在里面的」，英语用 in。先问一句：是贴在面上（on）、装在里面（in）、还是就在那个场合（at）?（PB-12 错位一）&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ There is a bird on the tree.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;pf2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;pf2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ There is a bird in the tree.&lt;/span&gt;（鸟在枝叶之间时）—— 英语的「树上」要再切一刀：长在树上、是树的一部分，用 on（苹果 on the tree）；位于枝叶之间，用 in（鸟 in the tree）。汉语不切这一刀，所以成批错在这里（PB-12 错位二）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He spoke on the meeting.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;pf3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;pf3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ He spoke at the meeting.&lt;/span&gt; —— 「在会上」的「会」是一个场合、一个活动点，英语用 at。错位一的第三家：场合归 at（PB-12）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 书房的题，考的是「哪家裁决」&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;有人说：「over 的中心义已经学界定案，就是静态的『在上方』。」这话对吗？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;no&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;no&quot;&gt;不对：Brugman/Lakoff 的动态复合中心是正式主张，「静态 ABOVE」只是 Tyler &amp;amp; Evans 一方的裁决，学界未终局&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;对：Tyler &amp;amp; Evans 说了算&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;对：义项数少的那家就是对的&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;苹果摞得高出碗沿，还说 in the bowl。在 Herskovits 的账本里，这笔账记在哪？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;tol&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in 多了一个新义项&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;tol&quot;&gt;记「容差」：不精确但可接受，差不多成立就当成立&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;记错了，应该用 on&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;新场景：树上结满了苹果。「苹果在树上」用哪个？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;on&quot;&gt;&lt;div class=&quot;opt&quot;&gt;in the tree&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;at the tree&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;on&quot;&gt;on the tree（苹果是长在树上的一部分）&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;新场景：火车从山洞这一头进、那一头出。用 through 还是 across？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;th&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;th&quot;&gt;through：从有界介质内部穿过去&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;across：越过一个面&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;两个都行，没区别&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;
内容来源：《专家规律总结清单 · 书级深读增补簇 —— 介词经典专著》（catalog_add_prep_books.md），PB-01 – PB-13，共 13 条。本页定位为「介词花园背后的书房」（专著层），不与学生屏 prep v3 重复；学术分歧保留在教师/家长层呈现，未抹平。&lt;br&gt;
&lt;b&gt;各书接触等级总表（如实）&lt;/b&gt;：Lindstromberg《English Prepositions Explained》——目录+书评级（另含作者专栏原文）；Brugman (1981) / Lakoff (1987)——二手系统论述级（含 Rice 1993 网络图复刻件；批评方 Tyler &amp;amp; Evans 2001 原文已读）；Herskovits (1986)——目录+书评级（另含 Tenbrink 带页码重构）；Bowerman &amp;amp; Choi (2001)——二手系统论述级（多源互证）；Dirven (1993)——二手系统论述级（三家互证）；Rudzka-Ostyn——未收（仅编者身份、无独立框架，未虚构）。&lt;b&gt;本轮无一本通读级。&lt;/b&gt;&lt;br&gt;
&lt;b&gt;待核项：8 项&lt;/b&gt;——① EPE 初版年份 1997 / 1998 著录出入；② Lakoff 版 over 义项数「24+」与「22」两说并存；③ Lakoff 个案研究编号 Case Study 1 / 2 之异（正文已回避编号）；④ Lindstromberg 的 Subject 术语别称（Located Object）待回核原书；⑤ Herskovits 使用类型页码（1986: 87）与容差定义页（1986: 39ff.）未经原书对页；⑥ Bowerman &amp;amp; Choi 月龄区间与章节页码（475–511）待对原书；⑦ Dirven 章页码（73–97）与域名单措辞待核；⑧ Brugman 1989 Garland 版与 1981 论文是否有修订，未获对读证据。入模引用页码前须逐项复核。
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 专著深读层（VB-01 – VB-13）&lt;/span&gt;
&lt;h1&gt;动词背后的书房&lt;/h1&gt;
&lt;p&gt;语法工坊（学生屏）背后站着五本（组）动词专著。时态、情态、短语动词的讲法从哪本书来、哪两本书在同一个问题上分工不同，这一页如实摆出来——书读到哪一层，也逐本标明。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;本页总纲：&lt;/b&gt;动词的&lt;b&gt;意思先行，句型随后&lt;/b&gt;（VB-01）——一个动词能进哪些句型、带不带得动哪种宾语，先由它词根里写了「方式」还是「结果」说了算（VB-04）；而时、体、情态这些形式，说的都是&lt;b&gt;说话人此刻的选择与判断&lt;/b&gt;（VB-12 / VB-13）。&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;书架与诚实招牌：我们把每本书读到了哪一层&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;本轮&lt;b&gt;没有任何一本达到通读级&lt;/b&gt;。最好的 Lewis 是章节原文节选级，最弱的 Bolinger 只有二手系统论述——都如实标，不许藏。&lt;/p&gt;
&lt;table class=&quot;time&quot;&gt;
&lt;tr&gt;&lt;th style=&quot;width:44%&quot;&gt;书&lt;/th&gt;&lt;th&gt;接触等级（如实）&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《English Verb Classes and Alternations》&lt;/b&gt;（1993）&lt;br&gt;Beth Levin&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;目录+书评级&lt;/span&gt;&lt;br&gt;出版社全目录（交替八章 + 动词类 49 章逐章核对）+ 正式书评 + 作者讲座幻灯与讲义。正文未通读。&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;《Meaning and the English Verb》&lt;/b&gt;（1971；第 3 版 2004）&lt;br&gt;Geoffrey Leech&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lv&quot;&gt;目录+书评级&lt;/span&gt;&lt;br&gt;出版社页核对全目录与定位；核心论点经三篇学术文献带页码转述。全书 PDF 在登录墙后，未打开。&lt;/td&gt;&lt;/tr&gt;

&lt;!-- 动词类 VB-01 VB-03 --&gt;
&lt;div class=&quot;panel on&quot; id=&quot;p-class&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;128&quot; viewBox=&quot;0 0 252 128&quot;&gt;&lt;rect x=&quot;46&quot; y=&quot;6&quot; width=&quot;160&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;24&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#4c439e&quot;&gt;构式层：整句的模具（CO 组）&lt;/text&gt;&lt;path d=&quot;M126 36 v8&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;46&quot; width=&quot;180&quot; height=&quot;30&quot; rx=&quot;8&quot; fill=&quot;#fff7e6&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;动词类层：Levin 的 48 个大家族&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#7c8a94&quot;&gt;同一家族，共享一本句型档案&lt;/text&gt;&lt;path d=&quot;M126 78 v8&quot; stroke=&quot;#b7c3ca&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;56&quot; y=&quot;88&quot; width=&quot;140&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;#eef6f4&quot; stroke=&quot;#0f8a7d&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;126&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#22685e&quot;&gt;词条层：一个一个的动词&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;动词像不同脾气的玩具：摆法早就写在它的意思里了（VB-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：Levin 的全书假设是——动词的行为，特别是它能带什么样的宾语、进什么样的句型，「在很大程度上由它的意思决定」（原书 p.1，经学术转述核实）。她的探测工具叫「交替」：同一个动词在不同句型格局间系统地变换（能变换、不能变换），就像探针，探出词义里哪些成分对语法「可见」。她甚至用一个母语者几乎不识的旧捕鲸词 gally 说明：只告诉你它的意思，你就能预判它怎么造句。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;先归类&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;动词像动物分科（VB-03）：Levin 把 3,000 多个动词按意义交叉分类成 &lt;b&gt;48 个大类、约 192 个小类&lt;/b&gt;——切的一家、碎的一家、给的一家、放的一家……同一家族的成员，共享一组句型行为。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 再预判&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;能预测&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;新词只要语义归类对，它能进的句型、不能进的句型、宾语能不能省略、能不能被动，大半可以由类推得。这套分类后来被计算词典 VerbNet 直接继承为骨架——词典从「一词一条互不相干」变成「一类一组共享档案」。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;层位说明（本页框架图）：&lt;/b&gt;现清单此前有词条层（V 组）、有构式层（CO 组），唯独&lt;b&gt;中间这一层整层缺席&lt;/b&gt;。后果很具体：CO-03 说双宾句型准入「意思不合是一关」，但没有 Levin 的类清单，就说不出&lt;b&gt;哪些&lt;/b&gt;动词意思不合。本簇补的正是这一层。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;理论张力，登记不裁定：&lt;/b&gt;Levin 是「动词中心」（句型行为由动词意义决定），Goldberg 是「构式中心」（整句模具自带意义）。Levin 自己的数据表明构式义必须尊重词汇约束——两家是约束与被约束的关系，不是二选一。另：Levin 本人把这本书限定为「初步调查」（a preliminary investigation），不宣称穷尽分类；教学中只取高频大类（切、碎、给、放、运动），48 类全表是词典学家的工具，不是课表。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 切与碎 VB-02 VB-04 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-cut&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;104&quot; viewBox=&quot;0 0 252 104&quot;&gt;&lt;circle cx=&quot;62&quot; cy=&quot;42&quot; r=&quot;24&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M46 28 l32 28 M78 28 l-32 28&quot; stroke=&quot;#b33636&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#4c439e&quot;&gt;break：只说「碎了」&lt;/text&gt;&lt;rect x=&quot;158&quot; y=&quot;20&quot; width=&quot;60&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;path d=&quot;M188 20 v40&quot; stroke=&quot;#b33636&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;circle cx=&quot;146&quot; cy=&quot;34&quot; r=&quot;7&quot; fill=&quot;#f2b134&quot;/&gt;&lt;text x=&quot;188&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;cut：自带一把刀&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;break 只说结果，cut 自带「怎么切」（VB-02）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Levin 在原书 pp.5–9 用三组交替把四个近义动词切开（经学术转述逐页核实）：break 只词汇化了「纯状态改变，完全不说明改变如何发生」；cut 词汇化了工具（利刃）与施事的方式。在全书分类里，两家分属两端：§21「切」类与 §45.1「碎」类（属状态改变类）。四种语言的比较研究（Guerssel 等 1985）得出同样的对立——这不是英语一家的偶然。&lt;/div&gt;
&lt;/div&gt;
&lt;table class=&quot;time&quot; style=&quot;margin-top:10px&quot;&gt;
&lt;tr&gt;&lt;th style=&quot;width:30%&quot;&gt;最小对立&lt;/th&gt;&lt;th&gt;break（碎）&lt;/th&gt;&lt;th&gt;cut（切）&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;能「自己发生」吗？&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;en&quot;&gt;The window broke.&lt;/span&gt; ✓ 施事可以是人、工具、自然力&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;en&quot;&gt;*The bread cut.&lt;/span&gt; ✗ 施事缺席，句子崩坏&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;词根里写了什么？&lt;/td&gt;&lt;td&gt;只写结果：变样了，没说怎么弄的&lt;/td&gt;&lt;td&gt;写了方式+工具：利刃接触、分离&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;能「试着做」吗？&lt;/td&gt;&lt;td&gt;不能进尝试式&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;en&quot;&gt;cut at the bread&lt;/span&gt; ✓ 因为它词汇化了「接触＋运动」&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;结果名词指什么？&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;en&quot;&gt;a cut / a break&lt;/span&gt; 指伤口（状态）&lt;/td&gt;&lt;td&gt;同左；而 &lt;span class=&quot;en&quot;&gt;a hit&lt;/span&gt; 指动作本身&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;与本项目的同源关系（写在明处）：&lt;/b&gt;这正是白板动画里 &lt;b&gt;C1「切类」守恒原则&lt;/b&gt;的语言学根据——切类动作在语言里就自带「施事＋工具接触＋分离结果」。动画中出现「无人持刀、苹果自裂成两半」，不仅是物理错误，也是&lt;b&gt;把 cut 演成了 break&lt;/b&gt;：动词类选错，画面逻辑必然错。&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;总原理&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;一个动词像一支笔，只能涂满一头（VB-04）：要么把「怎么动」说细（&lt;span class=&quot;en&quot;&gt;wipe、scrub、run&lt;/span&gt;——方式），要么把「变成什么样」说死（&lt;span class=&quot;en&quot;&gt;break、open、arrive&lt;/span&gt;——结果）。这叫&lt;b&gt;方式/结果互补&lt;/b&gt;，是 break/cut 之别在全词库尺度上的推广（Levin 与 Rappaport Hovav 在 1993 年分类之后的发展）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;推论成串：方式动词能带非选定宾语、结果靠构式补（sweep the floor clean），能省略宾语（Leslie swept）；结果动词的宾语必须受影响、测度事件进程，不能随意省略。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;边界：&lt;/b&gt;互补是&lt;b&gt;强倾向，不是无例外定律&lt;/b&gt;——climb 的再分析之争、cut 本身（兼有方式与分离结果）长期被双方引为战例，精确形式至今仍在修订。小学教学只取「动词自带一头重点」这一直觉层。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 完成·进行 VB-05 VB-06 VB-07 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-leech&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;106&quot; viewBox=&quot;0 0 252 106&quot;&gt;&lt;line x1=&quot;20&quot; y1=&quot;66&quot; x2=&quot;232&quot; y2=&quot;66&quot; stroke=&quot;#22303c&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;70&quot; cy=&quot;66&quot; r=&quot;7&quot; fill=&quot;#b33636&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;过去：钥匙丢了&lt;/text&gt;&lt;path d=&quot;M78 62 q40 -18 76 -2&quot; fill=&quot;none&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;circle cx=&quot;196&quot; cy=&quot;66&quot; r=&quot;7&quot; fill=&quot;#5f54b8&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;现在：还没钥匙&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;完成体：过去的事，效力牵到说话这一刻&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;完成体不是「做完」，是「过去牵着现在」（VB-05）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Leech 把表达过去的两种手段并置：过去时把事件钉在已关闭的过去时段；完成体是 &quot;past involving the present&quot;（Leech 2004: 36）——事件在过去，效力区间延伸到说话时刻。真正的教学难点是&lt;b&gt;选择&lt;/b&gt;：同一件过去的事，选过去时还是完成体，取决于说话人要不要把它和现在挂钩。这一点与 Comrie、Palmer 三家独立互证。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;现在完成体的用法清单（Leech 的可判读分型）：&lt;span class=&quot;chip&quot;&gt;持续型：That house has been empty for ages.（2004: 36）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;经历—结果型：The taxi has arrived.（2004: 39）&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;招牌例：I have lost my key. ——重要的不是「丢」，是「现在没钥匙」&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;三件套&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;进行体拆成可逐项核查的成分（VB-06）：① &lt;b&gt;持续&lt;/b&gt;；② &lt;b&gt;有限的持续&lt;/b&gt;（只是眼下这一阵，临时性）；③ &lt;b&gt;不必完成&lt;/b&gt;（没说做完没做完）。进行时像把镜头推近，只看中间一段。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;临时性消失&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;当「临时性」成分缺席（配 always / forever / continually），进行体反而读出反复、夸张的习惯化色彩——这是成分表能解释、而一幅统一图象解释不了的边角。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;咖啡对照&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;When we arrived she made some coffee.&lt;/span&gt;（到达之后才做）vs &lt;span class=&quot;en&quot;&gt;she was making some coffee.&lt;/span&gt;（到达落在做咖啡的中间）——Leech 1971 年的招牌对照（p.17，经 Salkie 1989 转引），一个时间关系就把简单/进行之别钉死。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;章名就是立场（VB-07）：&lt;/b&gt;Leech 第 3 版的目录里，过去有专章「过去时间的表达」，将来对应的&lt;b&gt;不是&lt;/b&gt;「将来时」，而是「&lt;b&gt;将来时间的表达&lt;/b&gt;」——将来不是动词的一个时，而是一组表达手段的拼盘：will 的情态义、be going to、现在进行表安排、一般现在表时刻表，各拼各的、各带情态色彩。Palmer 把 will/shall 单列情态章，完全同向。现清单 TA-03 用 Langacker 的「钻进事件内部看」给进行体一幅统一图象，Leech 给的是&lt;b&gt;一张检查单&lt;/b&gt;——前者是一幅图，后者可逐项核查，二者互证，都反对「进行时＝正在进行」的一句口诀。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;分歧登记：&lt;/b&gt;「现时相关」被 Salkie 等批评为更像由时间意义推出的自然推理、而非基本义本身（现清单 TA-05 已登记 Dahl &amp;amp; Hedin、McCoard 之争）。Leech 的清单化讲法回避不了这个理论争议，只是把它推迟——本页如实标注，不装作已解决。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 情态双地图 VB-08 VB-09 VB-13 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-modal&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;100&quot; viewBox=&quot;0 0 252 100&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;18&quot; width=&quot;106&quot; height=&quot;56&quot; rx=&quot;9&quot; fill=&quot;#eef6fb&quot; stroke=&quot;#2f7db0&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;63&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#2f5f8f&quot;&gt;机制层 · Sweetser&lt;/text&gt;&lt;text x=&quot;63&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;力图式：障碍 / 外力 / 潜能&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;18&quot; width=&quot;106&quot; height=&quot;56&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#7c5cd6&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;189&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;800&quot; fill=&quot;#4c439e&quot;&gt;范畴层 · Palmer&lt;/text&gt;&lt;text x=&quot;189&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;命题情态 / 事件情态&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;92&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;同一批情态词，两张地图，问题不同&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;情态动词说两种事：一种是猜，一种是推（VB-08）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：同一个 must 两边都能站——「他准是在办公室」（我对这句话是真是假的把握）和「你必须去」（我让事情发生的劲），要看它管的是「话」还是「事」。Palmer 先分命题情态（说话人对命题事实地位的判断：认识+证据）与事件情态（指向尚未实现的事件：义务+动力），再给形式诊断（见下）。他在《The English Verb》里把完成体称作 phase（相）而非体的一部分，以示其「与现在关联」的独立地位。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;duo&quot;&gt;
&lt;div class=&quot;cell a&quot;&gt;&lt;h5&gt;Sweetser：机制层（清单原有）&lt;/h5&gt;
用力图式（障碍/外力/潜能）把根情态与认识情态连成一个隐喻家族，回答：&lt;b&gt;为什么同一个词能管两边&lt;/b&gt;。给的是认知机制。&lt;/div&gt;
&lt;div class=&quot;cell b&quot;&gt;&lt;h5&gt;Palmer：范畴层（本簇新补）&lt;/h5&gt;
用功能分类加形式诊断，回答：&lt;b&gt;这两边怎么分、在语言里怎么组织&lt;/b&gt;。给的是范畴地图与判据——清单此前只有 Sweetser 一线，学习者知道 must 的力图式，却没有判断程序。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;两处「主观」，含义不同，不可混用（如实标注）：&lt;/b&gt;Palmer 说的「主观性」是范畴的&lt;b&gt;定义性特征&lt;/b&gt;——语气是「说话人主观态度与意见的语法化」（1986: 16）；Sweetser 说的「主观化」是一条&lt;b&gt;历时—认知路径&lt;/b&gt;（意义如何一步步变得主观）。引用时把两处当成一回事，就是把地图和历史混为一谈。&lt;/div&gt;
&lt;div class=&quot;kin&quot;&gt;Palmer 的形式诊断（倾向性，非铁律）：&lt;span class=&quot;chip&quot;&gt;must / may 后接 have＋分词 → 必为认识义&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;义务义 may 可换成 can；认识义换了，意义翻转&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;认识义 must / may 不被否定辖域覆盖&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;后退一格&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;「过去时也是情态」（VB-09）：英语把「往后退一格」当成万能开关——事情退到过去（&lt;span class=&quot;en&quot;&gt;I went&lt;/span&gt;）、退出现实（&lt;span class=&quot;en&quot;&gt;If I went tomorrow…&lt;/span&gt;）、退远关系（&lt;span class=&quot;en&quot;&gt;I wanted to ask…&lt;/span&gt;），用的是同一个形式动作。Palmer 专设一章论证：「过去」范畴的核心义含「与当下现实的距离」，时间距离只是其一；这在大量语言中反复出现，是类型学证据。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;arrowdn&quot;&gt;▼ 距离的课堂版：判断归谁&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;脑子 vs 世界&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;must&lt;/span&gt; 是「我觉得非这样不可」（说话人此刻的判断），&lt;span class=&quot;en&quot;&gt;have to&lt;/span&gt; 是「外面的规矩摆在那儿」（VB-13）。正因 must 的判断绑定说话时刻，回忆过去的必然只能用 &lt;span class=&quot;en&quot;&gt;had to&lt;/span&gt;——「过去的 must」不存在，这是其主观性的直接推论。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;课堂实景（Lewis 的招牌提醒）：老师上课老说 I must…，学生就以为替别人请假也要 must——其实那是把自己的判断安到了别人头上。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;重心修正登记：&lt;/b&gt;现清单 TA-08 把「距离」处理为过去时的&lt;b&gt;附加用法&lt;/b&gt;；Lewis 的通用原则（VB-12）与 Palmer 的类型学都表明，remote（遥远）是第二形式的&lt;b&gt;通义&lt;/b&gt;——距离不是过去时的兼职，是它的本职之一。此为重心修正，非事实推翻；同一结论由类型学、教学语法、认知语法三方独立得出，是本领域最稳固的共识之一。另注意反向操作存在：历史现在时（TA-14）是把距离拉近，方向由语篇功能决定。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 小品词 VB-10 VB-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-phr&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;106&quot; viewBox=&quot;0 0 252 106&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;16&quot; width=&quot;86&quot; height=&quot;52&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;73&quot; y=&quot;37&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#4c439e&quot;&gt;行李一&lt;/text&gt;&lt;text x=&quot;73&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;经由空间而动&lt;/text&gt;&lt;rect x=&quot;136&quot; y=&quot;16&quot; width=&quot;86&quot; height=&quot;52&quot; rx=&quot;9&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;179&quot; y=&quot;37&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;800&quot; fill=&quot;#4c439e&quot;&gt;行李二&lt;/text&gt;&lt;text x=&quot;179&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;抵达终点 / 出结果&lt;/text&gt;&lt;text x=&quot;126&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;eat（无界）+ up → eat up（吃光，有界）&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;小品词走到哪儿，都带着两件行李（VB-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制：Bolinger (1971) 的核心主张（pp.85–87，经多篇学术文献一致转引）：任一小品词的基本义必含两个特征——经空运动与终点/结果。由此，小品词能给原本无终点的动词装上终点：eat 没有头，eat up 有头。每个小品词都有一张可核查的「语义身份证」，不是一串例外清单。短语动词因此不是习语垃圾堆，而是一台可分析、还在生长的机器。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;系统性例外&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;on&lt;/span&gt; 的基本义是「保持在视野内的水平持续」（pp.89, 107），所以它表持续而非结果，也不能构成结果式（&lt;span class=&quot;en&quot;&gt;I spurred them on&lt;/span&gt; 可以，&lt;span class=&quot;en&quot;&gt;*they were on&lt;/span&gt; 不行）——Bolinger 本人以「持续即其基本义」处理，不硬套两特征。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tri&quot; style=&quot;margin-top:10px&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;一级&lt;/div&gt;基本义的直接延伸&lt;br&gt;&lt;span class=&quot;en&quot;&gt;load up&lt;/span&gt;（装满）&lt;br&gt;看得懂，不用背&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;二级&lt;/div&gt;整个短语的比喻延伸&lt;br&gt;&lt;span class=&quot;en&quot;&gt;make up a face&lt;/span&gt;&lt;br&gt;「编一张脸」→ 编造，要拐个弯&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;w&quot;&gt;三级&lt;/div&gt;含特定名词的固定表达&lt;br&gt;&lt;span class=&quot;en&quot;&gt;put on airs&lt;/span&gt;（摆架子）&lt;br&gt;只有这一级接近真习语&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mech&quot; style=&quot;margin-top:6px;text-align:center&quot;&gt;习语性三级（VB-11，Bolinger 1971: 113）：别把整座冰山都当成要死背的——只有最底下薄薄一层是猜不出的。但三级虽少却高频（put up with 类），不能因「层级低」而略过。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;分工之争，登记：&lt;/b&gt;同一现象，Bolinger 从&lt;b&gt;小品词&lt;/b&gt;切入（词有义），Goldberg 一系从&lt;b&gt;构式&lt;/b&gt;切入（模具带义）——VB-01 的「动词中心 vs 构式中心」张力在此重现。与清单 CO-12 的语块谱系图象互证、切分不同：CO-12 按抽象程度排谱系，Bolinger 按隐喻距离排层级，两套在「大部分可分析、少数须整记」上结论一致。与培训界「短语动词全靠死背」的通行做法正面冲突。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- 说话人 VB-12 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-lewis&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;252&quot; height=&quot;104&quot; viewBox=&quot;0 0 252 104&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;44&quot; r=&quot;17&quot; fill=&quot;#f1effa&quot; stroke=&quot;#5f54b8&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;rect x=&quot;84&quot; y=&quot;40&quot; width=&quot;44&quot; height=&quot;8&quot; rx=&quot;4&quot; fill=&quot;#5f54b8&quot;/&gt;&lt;rect x=&quot;118&quot; y=&quot;40&quot; width=&quot;7&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;#5f54b8&quot;/&gt;&lt;text x=&quot;99&quot; y=&quot;84&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;一个形式，一把钥匙，只开一种锁&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;38&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#22303c&quot;&gt;will&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;58&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;不是「将来专用」&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;74&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;Boys will be boys.&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;出现「例外」，错的是规则写窄了（VB-12）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（教师书房）：Lewis 的「通用原则」——任一动词形式的全部用法，必须能由一个足够宽的底层意义统一解释；「先立规则、再打补丁」的目录式讲法，必然让学习者先学一条、再被告知它不算数。一般现在时的通义不是「现在」或「习惯」，而是「说话人把事件看作一个无时间性的整体事实」；它与第二形式的对立不在时间，而在即刻（immediate）vs 遥远（remote）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;story&quot;&gt;&lt;b&gt;原书判语（p.47，原文）：&lt;/b&gt;&quot;Time is not the same as tense… Time is an element of our experience of reality. Tense is a purely grammatical idea.&quot; —— 时间是我们经验现实的一部分，时是纯粹的语法概念，两者不是一回事。&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;筛假规则&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;小学阶段用这条原则只做一件事：筛除假规则——如「will ＝ 将来时」。will 和 can、must 一样，是说话人表态的钥匙，是情态组的普通一员（VB-13 的情态组清单含 will / shall，不含 have to / ought to）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;形式即选择&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;动词形式的选择，本质上是说话人在说话时刻行使判断——语法与其说是被规则生成的，不如说是说话人挑了某个形式，来传达他对此事的看法（经教师培训讲义转述其立场）。这也是本簇 VB-13「must 是判断、have to 是规矩」的上位表述。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;边界（教师书房定位）：&lt;/b&gt;通用原则是&lt;b&gt;方法论戒律&lt;/b&gt;，不是已被证明的语言学定律——在 get 这类强多义形式上，「一个通义」会被拉到很抽象的层面，抽象到失去教学价值时 Lewis 本人也会停手。本条落在「教师书房」：用它筛规则、备课，不向孩子灌输「通义」本身。Lewis 这本书出版后即成为 DELTA 等高级教师培训的必读书；其动词专著框架此前在清单里完全缺席——清单里的 Lewis 只有「词块教学」一面。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;书房争论登记：分歧不许抹掉&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;学术争论放在教师/家长层呈现。四处张力与修正，全部如实登记——包括对现清单自身的两处修正要求。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;张力一：动词中心 vs 构式中心&lt;/h4&gt;
&lt;p&gt;Levin 主张句型行为由动词意义决定（VB-01），Goldberg 主张整句模具自带意义（清单 CO 组）。Levin 的数据恰恰表明构式义必须尊重词汇约束：哪些动词进不了哪个句型，模具说了不算。两家是约束与被约束的关系，本页登记为真实理论张力，不二选一。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;张力二：方式/结果互补，是定律还是强倾向？&lt;/h4&gt;
&lt;p&gt;互补说的精确形式至今仍在修订：Goldberg (2001, 2005) 对「省略宾语」等预测提过反例与弱化版本，climb、cut 本身是双方的战例（VB-04）。但 break / cut 的基本对立本身无主流异议——呈现时把「对立」与「互补说的强形式」分开，不打包成定案。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;修正要求一：TA-08 的重心&lt;/h4&gt;
&lt;p&gt;清单把过去式的「距离」义处理为附加用法；Lewis 的通用原则（第二形式通义 = remote）与 Palmer 的类型学（第 8 章「过去时也是情态」）双证表明，距离是第二形式的通义。建议清单升格表述——此为&lt;b&gt;重心修正，非事实推翻&lt;/b&gt;（VB-09 / VB-12）。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;修正要求二：TA-05 的操作面&lt;/h4&gt;
&lt;p&gt;清单 TA-05 取 Comrie 的统一式定义；Leech 补上「选择问题＋用法清单」的操作面（VB-05）——统一式之外先分型（持续型 / 经历—结果型）、再谈挂钩，否则「现时相关」在课堂里不可判读，这正是 Dahl &amp;amp; Hedin 批评的落点。两边互证，不冲突。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：动词类选错的病句&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;这三张病历的病因都不在「没背住」，而在动词类与情态的机制拿错了。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ The bread cut by itself.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf1&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ The bread was cut. / The window broke.&lt;/span&gt; —— cut 自带施事和一把看不见的刀，不能「自己发生」；能自己发生的是 break 一家（只说结果、不说怎么弄）。把 cut 说成能自发，等于把「切」演成了「碎」（VB-02）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ Yesterday I must go to school.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf2&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ Yesterday I had to go to school.&lt;/span&gt; —— must 的判断绑定说话这一刻，回忆过去的必然没有「过去的 must」可用，只能换 had to。这是 must 主观性的直接推论（VB-13）。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ He broke at the wall.&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;vf3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;vf3&quot;&gt;&lt;span class=&quot;good&quot;&gt;✓ He hit at the wall. / He cut at the bread.&lt;/span&gt; —— 「试着做」（尝试式）只许词汇化了「接触＋运动」的方式类动词进；break 只写结果，进不去（VB-02）。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 书房的题，考的是「词根里写了什么」&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;The cup broke. 能成立，*The bread cut. 不能成立——差别在哪？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;res&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;res&quot;&gt;break 只说结果、不说怎么弄，所以能自己发生；cut 自带施事和刀，施事缺席就崩坏&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;break 是不规则动词，cut 是规则动词&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;杯子比面包轻&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;must 和 have to 都译成「必须」，Lewis 说分界在哪？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;sub&quot;&gt;&lt;div class=&quot;opt&quot;&gt;must 更正式，have to 更口语&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;sub&quot;&gt;must 是说话人脑子里的判断，have to 是外面世界的规矩&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;have to 只能用于过去&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;新动词 scrub（擦洗）：它词根写的是哪一端？Leslie scrubbed.（省略宾语）能说吗？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;man&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;man&quot;&gt;方式端（把「怎么擦」说细）；方式动词能省略宾语，能说&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;结果端；结果动词的宾语不能省略，不能说&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;两端都写满了；说不说都行&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;I was wondering if you could help. 里面的过去形式 was 在干什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;dist&quot;&gt;&lt;div class=&quot;opt&quot;&gt;表示「以前想过、现在不想了」&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;dist&quot;&gt;把关系退远一格：是客气试探，用的是过去形式的「距离」义&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;写错了，应该用现在时&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;

&lt;h1&gt;小词关系站&lt;/h1&gt;
&lt;p&gt;代词个子小，管的事不小：它一边标出人和人的关系，一边替每句话把「谁」摆好。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;一句话总纲：&lt;/b&gt;代词不只是替名字省事——选哪个词，是在标关系；用多小的词，看对方记得多牢；而英语的每句话，都得先把「谁」明明白白摆出来。&lt;/div&gt;

&lt;div class=&quot;panel on&quot; id=&quot;p-social&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;55&quot; cy=&quot;52&quot; r=&quot;24&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;55&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;I&lt;/text&gt;&lt;circle cx=&quot;130&quot; cy=&quot;52&quot; r=&quot;24&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#2563eb&quot;&gt;you&lt;/text&gt;&lt;circle cx=&quot;208&quot; cy=&quot;52&quot; r=&quot;27&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;5 4&quot;/&gt;&lt;text x=&quot;208&quot; y=&quot;59&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;we?&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;106&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;we 的圈画到哪儿，要听的人自己猜&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;代词首先是「关系词」，不是「代替名词的词」（PR-01）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Mühlhäusler &amp;amp; Harré 把顺序倒过来讲——指人的词首要的工作是标出个人位置、社会关系和身份：谁在说、和谁是一伙、亲疏远近。代替名词省力气，只是它顺带做的事。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;PR-02&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;I&lt;/span&gt; 永远是「正在说话的这个人」：你说 &lt;span class=&quot;en&quot;&gt;I&lt;/span&gt; 指你自己，换我回答，我的 &lt;span class=&quot;en&quot;&gt;I&lt;/span&gt; 就指我。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一（换位）：小朋友先把 I/you 当成名字，聊着聊着才发现它随说话人翻转。案例二（担责）：谁说 I，谁就为这句话负责——I 把说话的人钉在此时此地。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;PR-03&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;we&lt;/span&gt; 是最「滑」的代词：包不包听的人，要靠听的人自己想。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一：老师说的「我们班」，通常把全班算在里面。案例二：演说者说的「我们国家」，圈画得更大。听到 we，先问一句：这里面有没有我？&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k3&quot;&gt;PR-04&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;礼貌和亲疏本来住在代词里——英语把这套拆了，礼貌搬了家。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一：法语一类语言里，「你」分亲近版和尊敬版（tu / vous）。案例二：英语现在只剩一个 you，对老师说 you 完全正确，礼貌改住在别处：&lt;span class=&quot;en&quot;&gt;Please&lt;/span&gt;、&lt;span class=&quot;en&quot;&gt;Mr. / Ms.&lt;/span&gt;、&lt;span class=&quot;en&quot;&gt;Could you…?&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;对中国孩子：&lt;/b&gt;汉语有「您 / 你」的分工，这个概念不陌生——要学的只是：英语的礼貌不住在代词里，别因为对老师说了 you 就以为自己不礼貌。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;英语的代词系统很小，社会关系编得隐蔽，不能按法语等语言的显性程度夸大展示；这一屏取的是结论层——「英语的礼貌换地方住了」。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PR-05 PR-06 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-price&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;12&quot; y=&quot;42&quot; width=&quot;66&quot; height=&quot;34&quot; rx=&quot;10&quot; fill=&quot;#eef3f7&quot; stroke=&quot;#93a3ad&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;45&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#5a6b78&quot;&gt;（不说）&lt;/text&gt;&lt;path d=&quot;M82 59 h18&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;104&quot; y=&quot;42&quot; width=&quot;52&quot; height=&quot;34&quot; rx=&quot;10&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;it / he&lt;/text&gt;&lt;path d=&quot;M160 59 h18&quot; stroke=&quot;#f2b134&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;182&quot; y=&quot;42&quot; width=&quot;66&quot; height=&quot;34&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;215&quot; y=&quot;64&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;说全名&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;102&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;记得越牢，词用得越小&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;刚提过的人或东西，用小代词就够了；怕搞混，就把全名再说一遍（PR-06）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：用全名、代词还是干脆不说，由「可及性」定价——对方脑子里记得越牢、越突出，词就可以越小；记得不牢或怕指错，就得把全名词短语请回来。这正是冠词组讲过的「给定性等级」（C-06 / C-07）在代词这一端的运行方式：那边给认知状态标刻度，这边让形式随刻度伸缩，两边是同一套道理的两张脸。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;PR-06&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;案例一：刚说完的那个东西，紧接着就用 &lt;span class=&quot;en&quot;&gt;it&lt;/span&gt;——你觉得对方记得牢，所以敢用小词。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例二：隔了好久没提，或者旁边有好几个容易混的，就把全名再说一遍——说得越全，说明你怕对方记不清。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;PR-05&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;英语的代词表其实很「素」。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一：别的语言里「我们」分两种——算上听的人一种、不算听的人一种；英语只有一个 we。案例二：性别只在第三人称露一下（he / she / it），离说话人越近越不分性别。700 多种语言里，英语这一版算简单的。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;写作文时最有用：&lt;/b&gt;读的人要是看不清「它」指谁，多半不是词没学好，是定价定错了——该说全名的地方，只给了小代词。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;记得牢不牢由好几个因素一起决定（有多突出、篇章连不连贯、有没有竞争者），专家们对各自权重还在讨论；这里只取两头直觉，不编一个万能公式。类型学地图（PR-05）是给老师看的背景，不是让孩子背的课。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PR-07 PR-08 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-stand&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;18&quot; y=&quot;36&quot; width=&quot;104&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#2563eb&quot;&gt;动词自己认人&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;主语可以不说&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;63&quot; font-size=&quot;16&quot; fill=&quot;#b7c3ca&quot;&gt;≠&lt;/text&gt;&lt;rect x=&quot;146&quot; y=&quot;36&quot; width=&quot;104&quot; height=&quot;44&quot; rx=&quot;10&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;198&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#0f766e&quot;&gt;英语：谁必须站出来&lt;/text&gt;&lt;text x=&quot;198&quot; y=&quot;72&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#5a6b78&quot;&gt;动词只剩 -s 认一个人&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;104&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; fill=&quot;#7c8a94&quot;&gt;英语是「非省略型」语言：每句先摆谁&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;英语的动词几乎不认人了，所以每句话都得把「谁」摆出来，一个都不能少（PR-07）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：有的语言动词身上带着人称标记，动词自己就能认出主语，代词只在强调时才出现；英语的动词人称标记几乎磨光了（只剩第三人称单数的 -s），认人的活全压在必须出现的代词身上。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;PR-08&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;汉语说话像接龙：先说一次话题，后面就能一路省下去。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一：开头说一次「小明」，后面几句不用再提他，大家都知道在说谁——这是汉语的「话题链」。案例二：汉语可以直接说「下雨了」，一个主语都不用；英语不行，连天气句也得先摆一个 it（下一屏细讲）。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;PR-07&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;漏主语不是粗心，是把汉语的组织方式带进了英语。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例一：汉语是「话题优先」的语言，英语是「主语优先」的语言，两种排兵布阵撞在一起，漏掉的正好是英语每句必摆的主语。案例二（诚实边界）：英语口语里偶尔也有日记式的省法，如 &lt;span class=&quot;en&quot;&gt;Went home early.&lt;/span&gt;——那是特殊语体，不能拿来给作业里的漏主语当理由。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;rumor&quot;&gt;&lt;b&gt;先把误会说清：&lt;/b&gt;漏主语是「没学好、太粗心」吗？专家定版不是这样：它是语言类型对撞的可预测产物（PR-08）。罚抄治不了它——要练的是新习惯：英语每一句开口前，先把「谁」摆好。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;「话题优先 / 主语优先」教学上按两分讲机制；清单层登记了修正——它其实是一条连续谱，普通话的位置靠中间，不是非黑即白（PR-08）。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PR-09 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-func&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;38&quot; width=&quot;96&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;68&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;700&quot; fill=&quot;#96690a&quot;&gt;汉语的习惯&lt;/text&gt;&lt;text x=&quot;68&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;先介绍新东西&lt;/text&gt;&lt;path d=&quot;M120 58 h24&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;3.5&quot;/&gt;&lt;polygon points=&quot;144,58 134,52 134,64&quot; fill=&quot;#0f766e&quot;/&gt;&lt;rect x=&quot;148&quot; y=&quot;38&quot; width=&quot;96&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;There is…&lt;/text&gt;&lt;text x=&quot;196&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;穿上英语外衣&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;爱用 There is… 开头，不全是学错了——是想先把新东西介绍出来，这是汉语组织句子的习惯（PR-09）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：Schachter &amp;amp; Rutherford 的发现叫「功能 → 形式迁移」：搬过来的不只是汉语的形式，更是汉语的功能——想先立一个新话题再展开，于是把英语的 there be 当成「话题介绍员」反复使用。错的样子由英语决定，错的动机藏在汉语的语篇习惯里。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;中国学习者写英语时，存现句（&lt;span class=&quot;en&quot;&gt;There is / There are…&lt;/span&gt;）用得格外多。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;每句单看可能没错，毛病在「过产」：新东西一出场就请它报到——它在替汉语的话题引入功能值班。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;同一项研究里，日本学习者过产的是另一种句式（把句子外置，先铺背景）。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;母语不同，借用的英语形式就不同——可见被搬来的不是某个词，而是各自母语「组织一句话的功能」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;和迁移分类表的关系（小字）：&lt;/b&gt;负迁移四分（CG-02）负责给错误分类，PR-09 负责讲清其中「生产过剩」这一类背后的语篇机制——一个是分类表，一个是病因书，互相回指。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;1979 年的原始样本是成人学习者的书面英语；儿童口语里的同类现象与它同源但不完全同形，引用时不能把成人写作的结论直接当儿童口语的定版。另登记：Schachter 本人后来对「迁移」概念另有重构主张，本条用的是 1979 年的功能迁移说，作为教学诊断的近似。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PR-10 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-it&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;130&quot; cy=&quot;55&quot; r=&quot;34&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;50&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;800&quot; fill=&quot;#2563eb&quot;&gt;it&lt;/text&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; text-anchor=&quot;middle&quot; font-size=&quot;10.5&quot; fill=&quot;#5a6b78&quot;&gt;整个环境&lt;/text&gt;&lt;path d=&quot;M98 26 q-8 10 0 18 M130 20 q-8 10 0 18 M162 26 q-8 10 0 18&quot; stroke=&quot;#7fb0e6&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;#22303c&quot; font-weight=&quot;700&quot;&gt;It is raining.&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;It is raining 里的 it 指着「周围这一整片情况」：天、时候、冷热，全包在里面（PR-10）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：汉语气象句可以一个主语都不用（「下雨了」「打雷了」），英语每句必须先立一个所指——说不清是谁在下雨时，就用 it 把「整个环境」摆出来当主语。它和漏普通主语同根，都是话题优先撞上主语优先（PR-08）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;&lt;span class=&quot;en&quot;&gt;It is raining.&lt;/span&gt; —— it 指笼罩整个场景的环境本身。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;案例二：汉语说「打雷了」可以零主语；搬进英语时把 it 一起省掉，就成了中国孩子最典型的漏法之一。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例三&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;天气、时间、距离这三类句子，句首都得放 &lt;span class=&quot;en&quot;&gt;it&lt;/span&gt;。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;操作要求不因讲法改变：该放的 it 一个都不能少；变的是讲法——不说它「什么都不指」。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;专家有分歧，这里并呈（小字）：&lt;/b&gt;Bolinger 说这个 it 有真实所指，指整个环境（环境 it）；Quirk 等人的权威语法书则说它是占位成分，语义内容极少或全无。清单的取舍：课堂讲法用 Bolinger 的说法（有得指、对中国孩子讲得通），学术分歧如实登记，不替学界拍板。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;Bolinger 还认为，指东西的 it、先行占位的 it、环境 it 是同一条渐变带上的三段，切多细都有任意性——所以这一屏只定讲法，不宣称「学界已经定案」。&lt;/div&gt;
&lt;/div&gt;

&lt;!-- PR-11 --&gt;
&lt;div class=&quot;panel&quot; id=&quot;p-heshe&quot;&gt;
&lt;div class=&quot;stage&quot;&gt;
&lt;svg width=&quot;260&quot; height=&quot;126&quot; viewBox=&quot;0 0 260 126&quot;&gt;&lt;circle cx=&quot;70&quot; cy=&quot;50&quot; r=&quot;26&quot; fill=&quot;#fdf6ec&quot; stroke=&quot;#d4880f&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; font-size=&quot;16&quot; font-weight=&quot;800&quot; fill=&quot;#96690a&quot;&gt;tā&lt;/text&gt;&lt;text x=&quot;70&quot; y=&quot;94&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;汉语口语：一个音&lt;/text&gt;&lt;path d=&quot;M100 42 h34 M100 60 h34&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;3&quot;/&gt;&lt;polygon points=&quot;136,42 127,36 127,48&quot; fill=&quot;#0f766e&quot;/&gt;&lt;polygon points=&quot;136,60 127,54 127,66&quot; fill=&quot;#0f766e&quot;/&gt;&lt;rect x=&quot;140&quot; y=&quot;24&quot; width=&quot;46&quot; height=&quot;26&quot; rx=&quot;9&quot; fill=&quot;#e6f4f1&quot; stroke=&quot;#0f766e&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;163&quot; y=&quot;42&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#0f766e&quot;&gt;he&lt;/text&gt;&lt;rect x=&quot;140&quot; y=&quot;58&quot; width=&quot;46&quot; height=&quot;26&quot; rx=&quot;9&quot; fill=&quot;#e8eefc&quot; stroke=&quot;#2563eb&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;163&quot; y=&quot;76&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;800&quot; fill=&quot;#2563eb&quot;&gt;she&lt;/text&gt;&lt;text x=&quot;216&quot; y=&quot;58&quot; font-size=&quot;11&quot; fill=&quot;#7c8a94&quot;&gt;说出口前&lt;br/&gt;必须分清&lt;/text&gt;&lt;/svg&gt;
&lt;div class=&quot;child&quot;&gt;汉语里「他、她」听起来一模一样，脑子不用分；英语说话时必须当场分清 he 还是 she（PR-11）&lt;/div&gt;
&lt;div class=&quot;mech&quot;&gt;机制（小字）：定版说法是加工问题，不是态度问题——开口之前的那一瞬，性别信息没有被稳稳装进要说的话里，实时压力一大就脱落；写下来能回头看，错误就少得多：同一批学习者，口头和笔头的错误率相差一个数量级（研究记录过明显差异，具体数字待核）。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k1&quot;&gt;案例一&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;说快了容易说反，慢慢写就很少错。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;病灶在「开口前编码」那一步，不在认识不认识这两个词——认识，笔头都对；是临场调用时掉了。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;span class=&quot;k k2&quot;&gt;案例二&lt;/span&gt;&lt;div class=&quot;ex&quot;&gt;对症的练法长在嘴上：指图说话、限时复述。&lt;br&gt;&lt;span class=&quot;why&quot;&gt;只做笔头选词练习，练的是慢慢想的那条通道，对不准口语脱落的病灶。&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vs&quot;&gt;&lt;b&gt;病因两说并呈（小字）：&lt;/b&gt;一说母语迁移——汉语 tā 同音，性别从没成为开口前的必填项；一说在概念层的言前编码本身。综述的立场是两者对汉语学习者可以同时成立，本屏按「迁移成因 + 编码机制」的复合口径讲。&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;&lt;b&gt;诚实边界（小字）：&lt;/b&gt;现有证据的样本是大学生与成人学习者；小学儿童的混用率与干预效果需要本项目自己验证。这一屏只取机制（同音 → 编码脱落 → 口语先练），不取任何具体错误率数字。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec hosp&quot;&gt;
&lt;h2&gt;病句医院：中国孩子的三大代词病&lt;/h2&gt;
&lt;p class=&quot;d&quot;&gt;三样病都不是「粗心」：一个是语言类型对撞，一个是功能搬家，一个是开口前编码脱落。先认病因，再开处方。点「看处方」对答案。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 病一：主语空缺——句子开了头，却找不到「谁」（话题链式漏主语）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f1&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f1&quot;&gt;&lt;span class=&quot;good&quot;&gt;处方：&lt;/span&gt;病因是话题优先迁移（PR-08）：汉语立一次话题就能一路省，英语每句都要重新摆主语（PR-07）。练法不是罚抄，是养成开口顺序——每句先摆「谁」，再说他做了什么；连下雨，也要先摆 it。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 病二：There is… 开头泛滥——新东西一出场就用存现句报到（过产）&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f2&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f2&quot;&gt;&lt;span class=&quot;good&quot;&gt;处方：&lt;/span&gt;先分清：单句多半不算错，病在用量失衡。病因是功能 → 形式迁移（PR-09)：there be 被当成汉语式的话题引入装置。诊断时先问「他想先介绍新东西吗」，再谈句式轮换，别一上来判语法错。&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;case&quot;&gt;&lt;div class=&quot;bad&quot;&gt;✗ 病三：口头 he / she 说反——笔头选得对，开口就互换&lt;/div&gt;&lt;span class=&quot;btn&quot; data-f=&quot;f3&quot;&gt;看处方&lt;/span&gt;&lt;div class=&quot;fix&quot; id=&quot;f3&quot;&gt;&lt;span class=&quot;good&quot;&gt;处方：&lt;/span&gt;病因在言前编码（PR-11)：tā 同音让性别信息在开口前脱落。处方是口头快速产出训练——指图说话、限时复述；在嘴上练，别只加笔头选词题。&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;sec&quot;&gt;
&lt;h2&gt;过关测验 · 先诊断，再迁移&lt;/h2&gt;
&lt;div class=&quot;quiz&quot;&gt;
&lt;div class=&quot;qq&quot;&gt;1.（诊断）补主语：___ is raining.（汉语可以说「下雨了」，英语这一句句首要摆什么？）&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;it&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;it&quot;&gt;It&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;什么都不摆&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;There&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;2.（诊断）正式写作里看到 Went home early. 这样的句子，它少了什么？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;subj&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;subj&quot;&gt;主语——每句先摆「谁」&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;过去式标记&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;句号&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;3.（诊断）孩子作文里 There is… 出现得特别多，最对得上号的病因是？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;func&quot;&gt;&lt;div class=&quot;opt&quot;&gt;太粗心，没检查&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;func&quot;&gt;把 there be 当成「先介绍新东西」的话题装置&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;there 这个词没背会&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;4.（迁移）老师说了一句 we——听懂它的第一步是？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;guess&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;guess&quot;&gt;先想：这个 we 里面有没有我&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;先查它代替哪个名词&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;先看它是不是复数&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;5.（迁移）刚说完的那个东西，紧接着再提它，用哪个更合适？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;small&quot;&gt;&lt;div class=&quot;opt&quot;&gt;把全名再说一遍&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;small&quot;&gt;小代词 it——对方记得牢&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;干脆省掉不说&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;6.（迁移）隔了好久没提、旁边还有几个容易混的，这时该怎么做？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;full&quot;&gt;&lt;div class=&quot;opt&quot; data-v=&quot;full&quot;&gt;把全名再说一遍，免得指错&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;还是用 it，越小越好&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;用 we 猜一猜&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;qq&quot;&gt;7.（迁移）练 he / she 不说反，哪种练法最对症？&lt;/div&gt;
&lt;div class=&quot;opts&quot; data-a=&quot;oral&quot;&gt;&lt;div class=&quot;opt&quot;&gt;多做笔头选词填空&lt;/div&gt;&lt;div class=&quot;opt&quot; data-v=&quot;oral&quot;&gt;指图说话、限时复述——在嘴上练&lt;/div&gt;&lt;div class=&quot;opt&quot;&gt;把 he / she 各抄十遍&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;foot&quot;&gt;原形说明：每屏 = 一个核心机制（儿童版标题句 + 示意图 + 案例 + 易混对比 / 分歧并呈 + 诚实边界），每屏标注来源条目编号；天气 it 的 Bolinger 与 Quirk 之争按源文件并呈，课堂讲法取 Bolinger，学术不拍板。&lt;br&gt;知识来源：catalog_add_pronoun_books.md · 代词与指称簇 PR-01 – PR-11（Mühlhäusler &amp;amp; Harré 1990；Siewierska 2004；Li &amp;amp; Thompson 1976/1981；Schachter &amp;amp; Rutherford 1979；Bolinger 1977；Frontiers in Psychology 2021 综述）。&lt;br&gt;待核：6 组来源均有待核 / 保留事项（接触等级多为二手系统论述级、Siewierska 为章节预览级）；其中 1 项为入模前必须补核——某语料研究报告的性别代词错误率数字，本页未上屏为定版数字，只以「研究记录过明显差异，具体数字待核」呈现。&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;phone&quot;&gt;
&lt;header&gt;
&lt;span class=&quot;tag&quot;&gt;展示原形 · 经典网文组（WA-01 – WA-08）&lt;/span&gt;
&lt;h1&gt;网文经典&lt;/h1&gt;
&lt;p&gt;这一组不住在书里，住在网上：专家博客与机构专栏里流传了十几二十年、被老师们反复引用的文章。它们不是论文——每条都标明了来源形态与证据等级。&lt;/p&gt;
&lt;/header&gt;

&lt;div class=&quot;law&quot;&gt;&lt;b&gt;总纲：&lt;/b&gt;网文渠的价值不在替代专著，而在三样书里没有的东西——&lt;b&gt;从学生嘴里取材的课堂纪律&lt;/b&gt;（WA-01）、&lt;b&gt;持续更新的公开勘误&lt;/b&gt;（WA-05）、&lt;b&gt;老师的手上技艺&lt;/b&gt;（WA-07/WA-08）。引用任何手册式规则前，先查它有没有被专家公开勘误过。&lt;/div&gt;

&lt;div class=&quot;cov&quot;&gt;&lt;b&gt;覆盖表&lt;/b&gt;（8 条全部上屏）&lt;br&gt;
WA-01 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-02 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-03 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-04 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-05 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-06 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-07 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt; WA-08 &lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;tabs&quot;&gt;
&lt;div class=&quot;tab on&quot; data-p=&quot;dogme&quot;&gt;涌现课堂&lt;/div&gt;

&lt;div class=&quot;tab&quot; data-p=&quot;passive&quot;&gt;被动侦探&lt;/div&gt;
