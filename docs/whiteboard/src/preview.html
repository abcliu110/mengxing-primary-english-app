<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>WB preview</title>
<style>body{margin:0;padding:12px;background:#e9eef2;font-family:sans-serif}svg{width:960px;display:block;background:#fff}</style></head><body>
<!-- 用法：preview.html?tab=bamboo_tree&case=0 -->
<svg id="st"></svg>
<script src="wb_engine.js"></script>
<script src="wb_actor.js"></script>
<script>
const q = new URLSearchParams(location.search), TAB = q.get('tab') || 'bamboo_tree';
if (TAB.startsWith('fp_')) document.write('<script src="cases/fp_props.js"><\/script>');
if (TAB.startsWith('ze_') || TAB === 'pron_map') document.write('<script src="cases/fp_props.js"><\/script>');
if (TAB.startsWith('wo_') || TAB.startsWith('ze_') || TAB.startsWith('fp_') || ['phrasal_key', 'eight_endings', 'pron_map', 'intonation_map', 'irregular_plural', 'bamboo_tree', 'aux_transformer'].includes(TAB)) document.write('<script src="cases/wo_props.js"><\/script>');
if (TAB.startsWith('wo_vowel_')) document.write('<script src="cases/wo_vowel_kit.js"><\/script>');
document.write('<script src="cases/' + TAB + '.js"><\/script>');
</script>
<script>
let player = null, auto = true;
window.__count = () => WB_LAB[TAB].length;
window.__load = i => { auto = false; player = WB.mount(document.getElementById('st'), WB_LAB[TAB][i].build, 7 + i); return player.end; };
window.__seek = t => { auto = false; for (let i = 0; i < 40; i++) player.render(t); };
// 打开就播放：?case=序号
(function () {
  const i = +(q.get('case') || 0); player = WB.mount(document.getElementById('st'), WB_LAB[TAB][i].build, 7 + i); let t = 0, last = performance.now();
  (function f(now) { t += (now - last) / 1000; last = now; if (t > player.end) t = 0; if (auto) player.render(t); requestAnimationFrame(f); })(last);
})();
</script></body></html>
