# ============================================================================
# 元素库 · linda（人物）—— 本项目第一个人物元素；格式样板见 teapot.yaml
# 造型来源：boundedness 家族现行位图姿势集（fb39v2 精灵 l_coff0/l_coff2/l_think/l_idea0/
# l_point/l_laugh/l_w0-3）逐帧看图分件重绘——短碎发、橙色领巾、白衬衫、灰短裤、白球鞋，
# 同一角色可辨认为准。姿势语义与位图帧名一一对应（见 profiles 的 from 字段）。
#
# 【人物格式扩展】（teapot 的扁平部件装不下人物关节链，本定义引入三项扩展，渲染器在
# v5/props/props.js 的 drawCharacter / FK 体系实现；扩展点在此声明，不静默魔改）：
#  E1 部件层级：part.parent 指父部件；子部件 pivot 以父部件局部系计，部件 shapes 以
#     本部件局部系（原点 = 本部件 pivot）计——手臂绕肩、头绕颈、前臂绕肘、胫绕膝皆然。
#     （teapot 等道具部件无 parent，shapes 仍以元素系计，drawElement 口径不变。）
#  E2 部件变体：part.geometry.variants = { 变体名: shapes }，由 profile 的 variant 选用
#     （torso 的 shirt/blazer、head 的 features 五种表情同理走 features 字段）。
#  E3 门控/附着部件：part.gate = 门名，仅当 pose.show 含该门时绘制（book/bubble/drape）；
#     part.attachTo = 元素锚点名时，该部件原点（grip）由 hold 基元对位到该锚点绘制。
# 姿态角约定：度；画布旋转方向（顺时针为正，y 向下）。对垂下状态的肢体，正角摆向身后
# （-x，她面朝 +x），负角摆向身前。profile.ik = { armL/armR: { target } } 时该臂角度不
# 写死，由 point/到达 IK 在姿态解析时实算（target 为锚点名或 '$target' 场景外给目标）。
# 关节盖盘：肩/肘/膝各置一枚同色圆盘压住接缝（绑定规范的「重叠盖缝」），见各部件首/末 shape。
# ============================================================================

element:
  id: linda
  kind: character
  version: 1
  title: "Linda（boundedness 家族主讲；位图姿势集分件重绘）"

frame:
  origin: "脚底中心（双脚间地面点）"
  x: "+x 向右（她面朝 +x）"
  y: "+y 向下（舞台坐标系）"
  unit: "px @1920x1080（本地系总高 460，舞台高由场景缩放）"

placement:
  world: [300, 838] # boundedness_1 上台位（脚底，舞台左）；场景可覆盖

skin:
  source: "自绘分件造型，临摹现行位图姿势集的角色特征（发色/领巾/衬衫/短裤/球鞋配色取自帧图）"
  license: "自有造型，无第三方素材。"
  tokens:
    skin: "#ffedd8"
    edge: "#6e5f4d"
    hair: "#f4ecdc"
    hairEdge: "#8a7a5f"
    shirt: "#ffffff"
    shirtEdge: "#9aa0a6"
    scarf: "#e07b26"
    scarfEdge: "#b25a14"
    blazer: "#dd9a5f"
    blazerDark: "#c07f3e"
    blazerEdge: "#9a6224"
    shorts: "#b7bcc4"
    shortsEdge: "#7d838c"
    shoe: "#ffffff"
    shoeEdge: "#8b8f96"
    ink: "#3d3428"
    mouth: "#8a4b3a"
    tongue: "#d98a76"
    page: "#fdf6e3"
    bookCover: "#b5651d"
    bookEdge: "#7c4210"
    cloud: "#ffffff"
    cloudEdge: "#b9c4cc"

parts:
  - id: legR
    role: "远侧腿（大腿）"
    pivot: [-18, -184]
    anchors: { knee: [0, 86] }
    geometry:
      shapes:
        - type: path
          segments: [["M", -16, 2], ["C", -15, 30, -10, 60, -9, 84], ["L", 9, 84], ["C", 10, 58, 14, 30, 16, 2], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
    z: 1
  - id: shinR
    role: "远侧胫 + 球鞋"
    parent: legR
    pivot: [0, 86]
    anchors: { ankle: [0, 85], foot: [24, 98] }
    geometry:
      shapes:
        - type: path
          segments: [["M", -14, 0], ["C", -13, 30, -10, 60, -9, 85], ["L", 9, 85], ["C", 11, 58, 13, 28, 14, 0], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: path # 袜口
          segments: [["M", -9, 63], ["L", 9, 63], ["L", 9, 85], ["L", -9, 85], ["Z"]]
          style: { fill: skin.shoe }
        - type: path # 球鞋（鞋头朝 +x）
          segments: [["M", -14, 80], ["C", -15, 95, -6, 100, 4, 100], ["L", 27, 100], ["C", 35, 100, 36, 91, 29, 87], ["C", 19, 82, 4, 78, -14, 80], ["Z"]]
          style: { fill: skin.shoe, stroke: skin.shoeEdge, lineWidth: 3 }
        - type: circle # 膝关节盖盘
          at: [0, 2]
          r: 13.5
          style: { fill: skin.skin }
    z: 0
  - id: legL
    role: "近侧腿（大腿）"
    pivot: [16, -184]
    anchors: { knee: [0, 86] }
    geometry:
      shapes:
        - type: path
          segments: [["M", -16, 2], ["C", -15, 30, -10, 60, -9, 84], ["L", 9, 84], ["C", 10, 58, 14, 30, 16, 2], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
    z: 2
  - id: shinL
    role: "近侧胫 + 球鞋"
    parent: legL
    pivot: [0, 86]
    anchors: { ankle: [0, 85], foot: [24, 98] }
    geometry:
      shapes:
        - type: path
          segments: [["M", -14, 0], ["C", -13, 30, -10, 60, -9, 85], ["L", 9, 85], ["C", 11, 58, 13, 28, 14, 0], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: path # 袜口
          segments: [["M", -9, 63], ["L", 9, 63], ["L", 9, 85], ["L", -9, 85], ["Z"]]
          style: { fill: skin.shoe }
        - type: path # 球鞋（鞋头朝 +x）
          segments: [["M", -14, 80], ["C", -15, 95, -6, 100, 4, 100], ["L", 27, 100], ["C", 35, 100, 36, 91, 29, 87], ["C", 19, 82, 4, 78, -14, 80], ["Z"]]
          style: { fill: skin.shoe, stroke: skin.shoeEdge, lineWidth: 3 }
        - type: circle # 膝关节盖盘
          at: [0, 2]
          r: 13.5
          style: { fill: skin.skin }
    z: 0
  - id: torso
