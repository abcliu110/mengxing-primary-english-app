          segments: [["M", -50, -56], ["L", 0, -47], ["L", 50, -56], ["L", 50, 0], ["L", 0, 7], ["L", -50, 0], ["Z"]]
          style: { fill: skin.page, stroke: skin.bookEdge, lineWidth: 2 }
        - type: strokePath
          segments: [["M", 0, -47], ["L", 0, 7]]
          style: { stroke: skin.bookEdge, lineWidth: 2 }
        - type: strokePath
          segments: [["M", -42, -44], ["L", -10, -38], ["M", -42, -30], ["L", -10, -24], ["M", 10, -38], ["L", 42, -44], ["M", 10, -24], ["L", 42, -30]]
