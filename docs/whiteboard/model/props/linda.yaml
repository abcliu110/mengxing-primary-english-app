    z: 3
  - id: book
    role: "摊开的书（仅 idea 姿态；原点 = 握持点 grip，由 hold 基元对位 hand_L）"
    attachTo: hand_L
    attachRotDeg: -6
    gate: book
    anchors: { grip: [0, 10] }
    geometry:
      shapes:
        - type: path # 封面
          segments: [["M", -58, -64], ["L", 0, -54], ["L", 58, -64], ["L", 58, 6], ["L", 0, 14], ["L", -58, 6], ["Z"]]
          style: { fill: skin.bookCover, stroke: skin.bookEdge, lineWidth: 3 }
