    z: 8
  - id: bubble
    role: "思考云（仅 thinking 姿态，承位图 l_think 的云朵）"
    gate: bubble
    geometry:
      shapes:
        - type: path
          segments: [["M", 84, -440], ["C", 78, -458, 92, -470, 106, -466], ["C", 110, -482, 130, -488, 142, -478], ["C", 156, -488, 176, -480, 178, -464], ["C", 192, -458, 194, -440, 184, -432], ["C", 180, -418, 162, -414, 150, -420], ["L", 108, -420], ["C", 94, -414, 82, -426, 84, -440], ["Z"]]
          style: { fill: skin.cloud, stroke: skin.cloudEdge, lineWidth: 3 }
        - type: circle
          at: [72, -424]
          r: 6
          style: { fill: skin.cloud, stroke: skin.cloudEdge, lineWidth: 2.5 }
        - type: circle
          at: [88, -434]
          r: 9
          style: { fill: skin.cloud, stroke: skin.cloudEdge, lineWidth: 2.5 }
    z: 9

anchors:
  hand_L: { from: "parts.forearmL.anchors.hand（经 FK 链实算）", use: "hold/point 基元对位（近侧手）" }
  hand_R: { from: "parts.forearmR.anchors.hand（经 FK 链实算）", use: "hold 基元对位（远侧手）" }
  gaze: { from: "parts.head.anchors.eye + 头部累积角", use: "point 基元视线对位校验（视线方向 = 头角，面朝 +x 为 0°）" }
  mouth: { from: "parts.head.anchors.mouth", use: "说话/表情参照" }
  chin: { from: "parts.head.anchors.chin", use: "thinking 姿态手托下巴的 IK 目标" }
  temple: { from: "parts.head.anchors.temple", use: "idea 姿态挠头手的 IK 目标" }
  foot_L: { from: "parts.shinL.anchors.foot（经 FK 链实算）", use: "落脚点（站立双脚贴地断言）" }
  foot_R: { from: "parts.shinR.anchors.foot（经 FK 链实算）", use: "落脚点" }

params:
  height:
    design: 484 # 位图帧高（FI l_coff0 h=484）
    computed: 460 # 元素系实算：-(torso.pivot.y + head.pivot.y + head.anchors.top.y) = -(-184-148-128)；舞台高由场景按 520/460 缩放
    formula: "发梢（head.top 经 torso+head 枢轴链）到脚底的距离，由定义内坐标实算"
  armLengths:
    upper: 92 # = |forearm.pivot|（arm 部件坐标）
    fore: 90 # = |forearm.anchors.hand| 实算 √(1²+90²)≈90.0
    reach: 182 # upper + fore（point 断言的 reach 上限）
  legLengths:
    thigh: 86 # = |shin.pivot|
    shin: 101 # = |shin.anchors.foot| 实算 √(24²+98²)≈100.9

profiles:
  standing: # from 位图 l_coff0（开场站立讲解，西装变体——位图集本身如此，逐姿态 1:1 承袭）
    from: l_coff0
    variant: blazer
    face: smile
    angles: { armR: 3, forearmR: -8, armL: -3, forearmL: -10, head: 0, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  relaxed: # from l_coff2（外套搭臂，衬衫变体）
    from: l_coff2
    variant: shirt
    face: smile
    show: [drape]
    angles: { armR: 4, forearmR: -12, armL: -2, forearmL: -34, head: 2, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  thinking: # from l_think（手托下巴 + 思考云）
    from: l_think
    variant: shirt
    face: think
    show: [bubble]
    ik: { armL: { target: chin } }
    angles: { armR: 4, forearmR: -10, head: -5, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  idea: # from l_idea0（挠头 + 捧书）
    from: l_idea0
    variant: shirt
    face: puzzled
    show: [book]
    ik: { armR: { target: temple } }
    angles: { armL: 14, forearmL: -58, head: -3, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  pointing: # from l_point（近侧手指向展品；角度由 point 基元按场景目标实算，含视线跟随）
    from: l_point
    variant: shirt
    face: surprise
    ik: { armL: { target: "$target" } }
    angles: { armR: 4, forearmR: -10, head: 0, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  laughing: # from l_laugh（双手捂肚、闭眼大笑、头微仰；armL 前臂角取镜像正值——手自外侧收向腹前）
    from: l_laugh
    variant: shirt
    face: laugh
    angles: { armR: 14, forearmR: -52, armL: -14, forearmL: 52, head: -9, legL: 1, shinL: 0, legR: -1, shinR: 0 }
  # walking 不设静态姿态：由 props.js 的 walkPose(phase) 程序化生成（腿摆 ±26°、臂反摆、承位图 l_w0-3 的步态）

assertions:
  - id: point-direction
    rule: "point 姿态：目标须在身前半平面（相对肩点 dx ≥ -20）；解析后 hand 射线（肩→手）与目标方向夹角 ≤ 3°；视线（头角）与目标方向夹角 ≤ 25°；手距 ≤ reach"
    enforcedBy: "v5/props/props.js 的 assertPoint（构建期执行，不过抛错停建）"
  - id: hold-contact
    rule: "hold 对位后残差 |手锚点 - (道具原点 + grip)| ≤ 0.5（idea 姿态的书 grip↔hand_L 由此校验）"
    enforcedBy: "v5/props/props.js 的 assertHold（构建期/测试执行）"
  - id: anchor-reach
    rule: "IK 姿态（thinking 手托下巴 / idea 手挠头）：解析后 |hand - 目标锚点| ≤ 6（IK 精确解应 ≈0，留造型裕量）"
    enforcedBy: "v5/props/props.js 的 assertAnchorReach（构建期执行）"
  - id: feet-on-ground
    rule: "站立类姿态（非 walking）：foot_L/foot_R 的 y ∈ [-2, 2]（双脚贴地线）"
    enforcedBy: "v5/props/props.js 的 assertFeetOnGround（构建期/测试执行）"
