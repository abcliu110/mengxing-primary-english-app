    pivot: [0, -184]
    anchors: { shoulderL: [54, -132], shoulderR: [-54, -132] }
    geometry:
      variants:
        shirt:
          - type: path # 短裤（先画，衬衫下摆压其上沿）
            segments: [["M", -52, -8], ["C", -54, 14, -53, 34, -50, 52], ["L", -18, 52], ["C", -16, 30, -15, 14, -14, -2], ["L", 14, -2], ["C", 15, 14, 16, 30, 18, 52], ["L", 50, 52], ["C", 53, 34, 54, 14, 52, -8], ["Q", 0, 0, -52, -8], ["Z"]]
            style: { fill: skin.shorts, stroke: skin.shortsEdge, lineWidth: 3 }
          - type: path # 白衬衫
            segments: [["M", -56, -138], ["C", -58, -96, -54, -48, -50, -6], ["Q", 0, 4, 50, -6], ["C", 54, -48, 58, -96, 56, -138], ["C", 30, -148, -30, -148, -56, -138], ["Z"]]
            style: { fill: skin.shirt, stroke: skin.shirtEdge, lineWidth: 3 }
          - type: path # 领巾双尾
            segments: [["M", 2, -128], ["L", 16, -126], ["L", 20, -72], ["L", 6, -68], ["Z"]]
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
          - type: path
            segments: [["M", 16, -126], ["L", 28, -120], ["L", 30, -84], ["L", 20, -72], ["Z"]]
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
          - type: circle
            at: [10, -136]
            r: 11
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
        blazer:
          - type: path # 短裤
            segments: [["M", -52, -8], ["C", -54, 14, -53, 34, -50, 52], ["L", -18, 52], ["C", -16, 30, -15, 14, -14, -2], ["L", 14, -2], ["C", 15, 14, 16, 30, 18, 52], ["L", 50, 52], ["C", 53, 34, 54, 14, 52, -8], ["Q", 0, 0, -52, -8], ["Z"]]
            style: { fill: skin.shorts, stroke: skin.shortsEdge, lineWidth: 3 }
          - type: path # 西装外套身
            segments: [["M", -58, -140], ["C", -62, -92, -58, -30, -54, 16], ["Q", 0, 26, 54, 16], ["C", 58, -30, 62, -92, 58, -140], ["C", 32, -150, -32, -150, -58, -140], ["Z"]]
            style: { fill: skin.blazer, stroke: skin.blazerEdge, lineWidth: 3 }
          - type: path # 内衬白衬衫 V
            segments: [["M", -14, -142], ["L", 14, -142], ["L", 4, -84], ["L", -4, -84], ["Z"]]
            style: { fill: skin.shirt }
          - type: path # 翻领
            segments: [["M", -14, -142], ["L", -30, -138], ["L", -8, -82], ["L", -2, -96], ["Z"]]
            style: { fill: skin.blazerDark }
          - type: path
            segments: [["M", 14, -142], ["L", 30, -138], ["L", 8, -82], ["L", 2, -96], ["Z"]]
            style: { fill: skin.blazerDark }
          - type: circle
            at: [27, -58]
            r: 3.5
            style: { fill: skin.blazerDark }
          - type: circle
            at: [28, -28]
            r: 3.5
            style: { fill: skin.blazerDark }
          - type: path # 领巾双尾（压在外套胸前，同位图 l_coff0）
            segments: [["M", 2, -128], ["L", 16, -126], ["L", 20, -72], ["L", 6, -68], ["Z"]]
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
          - type: path
            segments: [["M", 16, -126], ["L", 28, -120], ["L", 30, -84], ["L", 20, -72], ["Z"]]
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
          - type: circle
            at: [10, -136]
            r: 11
            style: { fill: skin.scarf, stroke: skin.scarfEdge, lineWidth: 2.5 }
    z: 3
  - id: armR
    role: "远侧上臂（绕肩枢轴）"
    parent: torso
    pivot: [-54, -132]
    anchors: { elbow: [0, 92] }
    geometry:
      shapes:
        - type: circle # 肩关节盖盘
          at: [0, 0]
          r: 16
          style: { fill: skin.shirt }
        - type: path # 上臂（肤）
          segments: [["M", -14, 34], ["C", -15, 56, -12, 74, -10, 90], ["L", 11, 90], ["C", 13, 72, 14, 54, 14, 34], ["Q", 0, 40, -14, 34], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: path # 短袖筒
          segments: [["M", -18, -6], ["C", -19, 10, -18, 28, -16, 44], ["L", 16, 44], ["C", 18, 26, 19, 8, 18, -6], ["Q", 0, -12, -18, -6], ["Z"]]
          style: { fill: skin.shirt, stroke: skin.shirtEdge, lineWidth: 3 }
    z: -1
  - id: forearmR
    role: "远侧前臂 + 手（绕肘枢轴）"
    parent: armR
    pivot: [0, 92]
    anchors: { hand: [1, 90] }
    geometry:
      shapes:
        - type: circle # 肘关节盖盘
          at: [0, 0]
          r: 13
          style: { fill: skin.skin }
        - type: path
          segments: [["M", -13, 0], ["C", -14, 26, -12, 56, -10, 80], ["L", 10, 80], ["C", 12, 56, 13, 26, 13, 0], ["Q", 0, 6, -13, 0], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: circle
          at: [1, 86]
          r: 13
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 2.5 }
    z: 0
  - id: armL
    role: "近侧上臂（绕肩枢轴）"
    parent: torso
    pivot: [54, -132]
    anchors: { elbow: [0, 92] }
    geometry:
      shapes:
        - type: circle # 肩关节盖盘
          at: [0, 0]
          r: 16
          style: { fill: skin.shirt }
        - type: path
          segments: [["M", -14, 34], ["C", -15, 56, -12, 74, -10, 90], ["L", 11, 90], ["C", 13, 72, 14, 54, 14, 34], ["Q", 0, 40, -14, 34], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: path
          segments: [["M", -18, -6], ["C", -19, 10, -18, 28, -16, 44], ["L", 16, 44], ["C", 18, 26, 19, 8, 18, -6], ["Q", 0, -12, -18, -6], ["Z"]]
          style: { fill: skin.shirt, stroke: skin.shirtEdge, lineWidth: 3 }
    z: 4
  - id: forearmL
    role: "近侧前臂 + 手（绕肘枢轴）"
    parent: armL
    pivot: [0, 92]
    anchors: { hand: [1, 90] }
    geometry:
      shapes:
        - type: circle # 肘关节盖盘
          at: [0, 0]
          r: 13
          style: { fill: skin.skin }
        - type: path
          segments: [["M", -13, 0], ["C", -14, 26, -12, 56, -10, 80], ["L", 10, 80], ["C", 12, 56, 13, 26, 13, 0], ["Q", 0, 6, -13, 0], ["Z"]]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: circle
          at: [1, 86]
          r: 13
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 2.5 }
    z: 0
  - id: drape
    role: "搭在近侧前臂上的外套（仅 relaxed 姿态，承位图 l_coff2）"
    parent: forearmL
    pivot: [0, 8]
    gate: drape
    geometry:
      shapes:
        - type: path
          segments: [["M", -16, 0], ["C", -20, 22, -14, 44, -6, 62], ["C", 2, 68, 12, 66, 16, 54], ["C", 20, 36, 14, 14, 8, 0], ["Q", -4, 6, -16, 0], ["Z"]]
          style: { fill: skin.blazer, stroke: skin.blazerEdge, lineWidth: 3 }
    z: 1
  - id: head
    role: "头（绕颈枢轴；表情走 features 五变体）"
    parent: torso
    pivot: [2, -148]
    anchors: { eye: [29, -62], mouth: [31, -30], chin: [24, -2], temple: [50, -88], top: [0, -128] }
    geometry:
      shapes:
        - type: path # 颈
          segments: [["M", -9, -14], ["L", 9, -14], ["L", 10, 8], ["L", -10, 8], ["Z"]]
          style: { fill: skin.skin }
        - type: ellipse # 脸
          at: [6, -56]
          radii: [52, 58]
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 3 }
        - type: circle # 耳
          at: [-42, -50]
          r: 12
          style: { fill: skin.skin, stroke: skin.edge, lineWidth: 2.5 }
        - type: path # 碎发（尖角刘海盖头顶）
          segments: [["M", -48, -64], ["C", -56, -96, -44, -118, -28, -124], ["L", -30, -106], ["L", -16, -126], ["L", -12, -108], ["L", 2, -128], ["L", 8, -110], ["L", 24, -124], ["L", 26, -104], ["L", 42, -112], ["C", 54, -100, 58, -84, 54, -66], ["C", 40, -78, 20, -82, 0, -80], ["C", -20, -78, -36, -74, -48, -64], ["Z"]]
          style: { fill: skin.hair, stroke: skin.hairEdge, lineWidth: 3 }
      features:
        smile:
          - { type: ellipse, at: [16, -62], radii: [4, 7], style: { fill: skin.ink } }
          - { type: ellipse, at: [42, -62], radii: [4, 7], style: { fill: skin.ink } }
          - { type: strokePath, segments: [["M", 8, -76], ["Q", 16, -81, 24, -76]], style: { stroke: skin.ink, lineWidth: 2.5 } }
          - { type: strokePath, segments: [["M", 34, -77], ["Q", 42, -82, 50, -76]], style: { stroke: skin.ink, lineWidth: 2.5 } }
          - { type: strokePath, segments: [["M", 22, -32], ["Q", 31, -25, 40, -31]], style: { stroke: skin.ink, lineWidth: 3 } }
        think:
          - { type: ellipse, at: [18, -60], radii: [3.5, 6], style: { fill: skin.ink } }
          - { type: ellipse, at: [44, -60], radii: [3.5, 6], style: { fill: skin.ink } }
          - { type: strokePath, segments: [["M", 8, -80], ["Q", 16, -86, 24, -80]], style: { stroke: skin.ink, lineWidth: 2.5 } }
          - { type: strokePath, segments: [["M", 34, -79], ["Q", 42, -84, 50, -79]], style: { stroke: skin.ink, lineWidth: 2.5 } }
          - { type: strokePath, segments: [["M", 25, -29], ["L", 39, -29]], style: { stroke: skin.ink, lineWidth: 3 } }
        puzzled:
