# ============================================================================
# 元素库 · ball（球）—— 球体元素；格式样板见 teapot.yaml。
# 本批口径：只定义几何与锚点——圆心/半径/接触点是滚动、弹跳、踢抛等运动基元的
# 唯一对位依据；运动学参数仅在 params.kinematics 占位声明（状态 + 对位口径），
# 滚动/弹跳基元本身不在本批实现（待后续车道，届时接触点锚点即滚动的地面相切点）。
# ============================================================================

element:
  id: ball
  kind: prop
  version: 1
  title: "球（足球）"

frame:
  origin: "元素枢轴 = 球心"
  x: "+x 向右"
  y: "+y 向下（舞台坐标系）"
  unit: "px @1920x1080"

placement:
  world: [960, 700] # 默认上台位（地面附近）；场景可覆盖

skin:
  source: "自绘参数化造型（足球侧视：白底、中央五边形块、弧形拼缝）；配色自拟"
  license: "自有造型，无第三方素材。"
  tokens:
    ball: "#f5f2ec"
    edge: "#5a6068"
    patch: "#3d4450"
    seam: "#8b9096"

parts:
  - id: body
    role: "球体（圆：半径由 circle 形状 r 给出，绘制与断言共用同一数值）"
    pivot: [0, 0]
    anchors:
      center: [0, 0] # 球心（轨迹/旋转对位）
      contact: [0, 46] # 底接触点（= 球心 + [0, r]：静止/滚动时与地面相切的点）
      top: [0, -46] # 顶点
    geometry:
      shapes:
        - type: circle
          at: [0, 0]
          r: 46
          style: { fill: skin.ball, stroke: skin.edge, lineWidth: 3.5 }
    z: 1
  - id: pattern
    role: "球面纹样（中央五边形块 + 拼缝弧线，纯装饰）"
    pivot: [0, 0]
    geometry:
      shapes:
        - type: path
          segments: [["M", 0, -13], ["L", 12, -4], ["L", 8, 11], ["L", -8, 11], ["L", -12, -4], ["Z"]]
          style: { fill: skin.patch }
        - type: strokePath
          segments: [["M", -45, -8], ["C", -30, -3, -20, -3, -12, -4]]
          style: { stroke: skin.seam, lineWidth: 2.5 }
        - type: strokePath
          segments: [["M", 45, -8], ["C", 30, -3, 20, -3, 12, -4]]
          style: { stroke: skin.seam, lineWidth: 2.5 }
        - type: strokePath
          segments: [["M", -8, 11], ["C", -14, 25, -25, 35, -38, 41]]
          style: { stroke: skin.seam, lineWidth: 2.5 }
        - type: strokePath
          segments: [["M", 8, 11], ["C", 14, 25, 25, 35, 38, 41]]
          style: { stroke: skin.seam, lineWidth: 2.5 }
    z: 2

anchors:
  center: { from: "parts.body.anchors.center", use: "球心：抛物轨迹与旋转的对位原点" }
  contact: { from: "parts.body.anchors.contact", use: "底接触点：地面相切口径（滚动基元绕此点的切地关系、弹跳的触地点）" }
  top: { from: "parts.body.anchors.top", use: "顶点（高度量测/接球上界）" }

params:
  radius:
    design: 46 # 球半径（与 body 形状 circle.r 同值，断言对账）
    computed: 46 # 由 circle 形状 r 实算（模块 assertBallGeometry 读取形状本身）
    formula: "parts.body 第一个 circle 形状的 r，不手填第二份"
  kinematics:
    status: "占位——本批不实现滚动/弹跳基元，仅立几何与锚点口径"
    groundContact: "contact 锚点与地面相切；滚动时球心恒在地面上方 r 处"
    note: "kick/throw/catch/bounce 的轨迹与时序参数待运动基元车道定义，届时只许引用 center/contact 锚点，不许另存半径数字"

assertions:
  - id: radius-consistent
    rule: "半径三方一致：circle 形状 r = params.radius.design = contact 锚点距球心（|contact − center|）；top 锚点 = center + [0, −r]"
    enforcedBy: "v5/props/props.js 的 assertBallGeometry（构建期执行，不过抛错停建）"
