  invariants:
    - "同一出行事件有两种说法：介词短语式（by bus，零冠词）与动词短语式（take a bus，带冠词），出行者与目的地指称不变（本幕判据；与 stock_hd_fr09_1 的 items 对照）"
    - "动词短语式中冠词不得省：take a bus / ride a bike 的冠词是动词短语的一部分，与 by 式的零冠词正相反（本幕判据原话：中间必须加冠词 a / the 或 my）"
    - "步行在两式中写法不同：介词式说 on foot，动词式以 walks 作谓语（本幕 items 与 stock_hd_fr09_1 的 items 对照）"
