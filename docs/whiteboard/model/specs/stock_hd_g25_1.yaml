title: 📘 G25 底层原理
items:
- - w
  - G25 底层原理
- - w
  - 一般将来时：will + 动词原形 —— 表示未来的意愿、承诺或必然到来的未来（无人称变化，统统用 will！）
- - w
  - 【will 原来是什么意思？】
- - w
  - will 本义是“意愿、决心”，演化成通用的将来时助动词“将会……”，不管主语是谁，永远是 will + 动词原形！
- - w
  - 🔬 will 的三种用法
- - w
  - 预测：It will be sunny tomorrow.
- - w
  - 临时决定：I'm thirsty. I will get some water.
- - w
  - 承诺：I will help you.
- - s
  - It will be sunny tomorrow. I will help you.
  - 明天会是晴天。我会帮你。
- - w
  - 公式：主语 + will + 动词原形（人称不变）；否定 won't = will not
- - w
  - 🧲 will 后面动词回原形：He will go. ✓（He will goes ✗）
- - w
  - 对比 be going to：早有计划、看到迹象 → be going to
- - w
  - 🗣️ 语境实证：I will be twelve years old next month.
- - w
  - 🎵 口诀：将来助动小 will，主语是谁它不管；后面紧接动词原形，否定缩写变成 won't (wi
