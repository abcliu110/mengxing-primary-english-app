  invariants:
    - "将来用 will，后面跟原形，谁来都不变：will + 动词原形表将来（意愿、承诺、临时决定、预测），不随主语的人称和数变化；否定是 won't（g25-will）"
    - "will 后面接形容词时不能漏掉原形 be，如 It will be sunny tomorrow.（g25-will）"
    - "will 本义是『意愿、决心』，来自古英语 willan『想要』；判断一句是不是将来时看结构 will + 原形，不靠猜『意愿』（g25-etym 的 boundary）"
    - "本幕常错：He will goes，应改为 He will go，will 后动词恒回原形（本幕判据）"
