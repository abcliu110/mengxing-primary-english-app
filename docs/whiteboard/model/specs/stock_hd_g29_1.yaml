title: 📘 G29 底层原理
items:
- - w
  - G29 底层原理
- - w
  - 否定句变形双轨制（be/情态 vs 实义动词借 don't/doesn't/didn't） —— 有 be 或 can/will 直接加 not；只有实义动词必须请助动词帮忙！
- - w
  - 【为什么绝对不能说 I am not like？】只有系动词和情态动词才能直接加 not；
- - w
  - 普通实义动词（like/go/eat）必须请专职保镖 don't / doesn't / didn't 站在它前面！
- - w
  - 🔬 否定两条路
- - w
  - 路一：句中有 be / can / will → 直接加 not：is → isn't，can → can't，will → won't
- - w
  - 路二：只有实义动词 → 请 don't / doesn't / didn't，动词回原形
- - w
  - 对比：I like it. → I don't like it. ｜ He likes it. → He doesn't like it. ｜ I went.
    → I didn't go.
- - s
  - He likes it. He doesn't like it.
  - 他喜欢它。他不喜欢它。
- - w
  - 常错：I am not like it. ✗ → I don't like it. ✓；He doesn't likes it. ✗
- - w
  - 🗣️ 语境实证：She isn't a doctor. He can't swim.
- - w
  - 🎵 口诀：变否定分两路：句中有 be 或情态(can/will)，后面直接加上 not；若是只有实
- - w
  - G29 第1幕
- - s
  - She isn't a doctor. He can't swim.
  - 她不是医生。他不会游泳。
- - n
  - 🎵 口诀：变否定分两路：句中有 be 或情态(can/will)，后面直接加上 not；若是只有实义动词，快请 don't / doesn't / didn't
    来相助，后面动词回原形，还要把 some 变成 any！
facts:
  objects:
    - { name: "例句对 I like it. → I don't like it.｜He likes it. → He doesn't like it.｜I went. → I didn't go.", kind: "例句", states: "路二对照组：只有实义动词时请 don't、doesn't、didn't，动词回原形" }
    - { name: "例句 He likes it. He doesn't like it.", kind: "例句", states: "肯定与否定成对呈现的例句对" }
    - { name: "例句 She isn't a doctor. He can't swim.", kind: "例句", states: "路一语境实证：be 与 can 直接加 not 的形式 isn't 与 can't" }
    - { name: "否定两条路", kind: "规则", states: "本幕分路卡：路一为句中有 be、can、will 时直接加 not；路二为只有实义动词时请助动词帮忙" }
  invariants:
    - "有 be、情态直接加 not；只有实义动词，请 don't 来帮忙：句中有 be 动词或情态动词（can、will、must、should 等）直接在它们后面加 not；只有实义动词时请 don't、doesn't、didn't 站到动词前面，其后的实义动词恢复原形（g29-two-tracks）"
    - "否定句默认 some 变 any，特指的时候可以不变：some 在否定句中可以保留表特指（xc-g29-some-kept：I didn't buy some of the books，指其中一部分没买）；小学卷面按默认替换答题，不得把保留用法讲成错误（g29-some-any-neg）"
    - "『保镖』只类比『助动词出面承担否定与时态』；实义动词自己不能直接加 not 是结构事实，不靠比喻推（g29-two-tracks 的 boundary）"
    - "本幕常错：I am not like it 与 He doesn't likes it 均为错式（本幕判据）"
