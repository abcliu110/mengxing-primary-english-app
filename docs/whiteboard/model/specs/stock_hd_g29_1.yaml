title: 📘 G29 底层原理
items:
- - w
  - G29 底层原理
- - w
  - 否定句变形双轨制（be/情态 vs 实义动词借 don't/doesn't/didn't） —— 有 be 或 can/will 直接加 not；只有实义动词必须请助动词帮忙！
- - w
  - 【为什么绝对不能说 I am not like？】只有系动词和情态动词才能直接加 not；
- - w
  - 普通实义动词（like/go/eat）必须请专职保镖 don't / doesn't / didn't 站在它前面！
- - w
  - 🔬 否定两条路
- - w
  - 路一：句中有 be / can / will → 直接加 not：is → isn't，can → can't，will → won't
- - w
  - 路二：只有实义动词 → 请 don't / doesn't / didn't，动词回原形
- - w
  - 对比：I like it. → I don't like it. ｜ He likes it. → He doesn't like it. ｜ I went.
    → I didn't go.
- - s
  - He likes it. He doesn't like it.
  - 他喜欢它。他不喜欢它。
- - w
  - 常错：I am not like it. ✗ → I don't like it. ✓；He doesn't likes it. ✗
- - w
  - 🗣️ 语境实证：She isn't a doctor. He can't swim.
- - w
  - 🎵 口诀：变否定分两路：句中有 be 或情态(can/will)，后面直接加上 not；若是只有实
- - w
  - G29 第1幕
- - s
  - She isn't a doctor. He can't swim.
  - 她不是医生。他不会游泳。
- - n
  - 🎵 口诀：变否定分两路：句中有 be 或情态(can/will)，后面直接加上 not；若是只有实义动词，快请 don't / doesn't / didn't
    来相助，后面动词回原形，还要把 some 变成 any！
