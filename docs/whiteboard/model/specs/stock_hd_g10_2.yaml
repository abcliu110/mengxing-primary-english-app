title: 📘 G10 底层原理 · 第2幕
items:
- - w
  - G10 底层原理
- - w
  - 不定代词 some 与 any 的地盘分工 —— some 住肯定句和热情邀请屋；any 住否定句和普通疑问屋！
- - w
  - 【为什么疑问句和否定句要把 some 换成 any？】some 默认“肯定有这么一些”；而在疑问或否定句里换上表示“任何一点”的 any！
- - w
  - 但如果你端着蛋糕热情邀请别人 Would you like some cake?，你真心希望对方说 Yes，所以保留 some！
- - w
  - 🔬 常规分工：肯定句用 some；否定句和一般疑问句用 any
- - w
  - 肯定：I have some storybooks.
- - w
  - 否定：I don't have any crayons.
- - w
  - 疑问：Do you have any?
- - s
  - I don't have any crayons. Do you have any?
  - 我没有蜡笔。你有吗？
- - w
  - 答句：— Do you have any comic books? — Yes, I have some.
- - s
  - Do you have any comic books? Yes, I have some.
  - 你有漫画书吗？有，我有一些。
- - w
  - G10 第2幕
- - n
  - 🎵 口诀：some 和 any 都表“一些”，可数复数不可数都能接；肯定句里用 some，否定疑问换 any；唯有邀请和请求（Would you like
    / Can I have），满怀诚意还用 some！
