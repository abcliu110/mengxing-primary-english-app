  - We watch TV on Sunday.
  - ⌚ 第二幕【意象桥梁·经守夜中转】：watch 这个词最早是"守夜、保持清醒"的意思。最早的"手表"其实是能把人叫醒的小闹钟——它替你"守夜"，到点喊你起床，所以继承了 watch 这个名字；后来它越做越小，戴上了手腕。
