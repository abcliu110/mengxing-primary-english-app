title: 📘 G31 底层原理 · 第1幕
items:
- - w
  - G31 底层原理
- - w
  - 特殊疑问词全家福 (5W1H 精准分工) —— what / who / whose / where / when / why / which / how
    —— 缺什么信息就派谁站句首！
- - w
  - 【为什么英语疑问词几乎都以 wh- 开头，而且必须放在句首第一个词？】
- - w
  - 英语把疑问词放在句首第一位，就像给听话人大脑发送一条检索指令：“请立刻去搜索【地点 Where / 时间 When / 人物 Who / 原因
    Why】！”
- - w
  - 🔬 Who / Whose / Who's 三兄弟
- - w
  - Who 谁：问人是谁
- - w
  - Whose 谁的：问东西归谁，后面常跟名词
- - w
  - Who's = Who is（谁是）
- - w
  - 例：— Who is that girl? — She is my cousin.
- - s
  - Who is that girl? She is my cousin.
  - 那个女孩是谁？她是我的堂姐。
- - w
  - 例：— Whose schoolbag is this? — It's Mike's.
- - s
  - Whose schoolbag is this? It's Mike's.
  - 这是谁的书包？是迈克的。
- - w
  - G31 第1幕
- - n
  - 🎵 口诀：什么 what 谁是 who，谁的东西用 whose；哪里 where 何时 when，哪一个用 which 选；为什么 why 用 because
    答，怎样程度全归 how！
