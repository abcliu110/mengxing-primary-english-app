title: 📘 G32 底层原理 · 第3幕
items:
- - w
  - G32 底层原理
- - w
  - 深度原理突破：How 与 What 到底怎么选？ —— 告别死记硬背！看懂「What 是代词（追问事物/名词）vs How 是副词（追问方式/状态/形容词程度）」
- - w
  - 【核心原理揭秘：为什么同样问天气，一句话是 How is the weather? 另一句话却是 What is the weather like?】
- - w
  - • What 的本质是【疑问代词（替身名词）】：填补名词空缺！
- - w
  - 在 What is the weather like? 里，like 是介词“像……”，后面缺一个宾语名词，所以必须派代词 What 去当 like 的宾语！
- - w
  - • How 的本质是【疑问副词（方式与程度探针）】：修饰动词（问方式 How do you go?）或修饰形容词/副词（问状态程度 How is the weather?
    / How old / How tall）！
- - w
  - 没有介词 like 时，直接问状态形容词，必须派副词 How 出场！
- - w
  - 🔬 What + 名词家族 vs How + 形容词家族
- - w
  - What colour / What time / What day / What date / What size
- - w
  - What day 问星期几 ｜ What date 问几月几号
- - w
  - How old / How tall / How heavy / How long / How far / How often
- - w
  - How many + 可数复数 ｜ How much + 不可数或问价钱
- - s
  - What size are your shoes? Size 37. How much are they? 80 yuan.
  - 你的鞋几码？37 码。多少钱？80 元。
- - w
  - 问方式：How does she go to work? — By car.
- - w
  - 常错：How is your bedroom like? ✗ → What is your bedroom like? ✓
- - s
  - What is your new English teacher like? She is kind. How does she go to work? By
    car.
  - 你的新英语老师是什么样的？她很和蔼。她怎么去上班？开车。
- - w
  - G32 第3幕
- - n
  - 🎵 口诀：What 是代词替名词，追问事物与名称（What colour / What time / What...like）；How 是副词探状态，追问方式与程度！How
    加形容词问高低（How old/tall/heavy/long/far），How many 数复数，How much 问价钱和不可数！
