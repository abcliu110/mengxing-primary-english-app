    - { name: "sheep → sheep、deer → deer、fish → fish", kind: "词表", states: "单复数同形组，一只和一群写法一样，本幕注明很多是动物名字；锚例句 One sheep, ten sheep. One deer, five deer. One fish, many fish." }
    - { name: "leaf → leaves、knife → knives、wolf → wolves", kind: "词表", states: "f 或 fe 变 v 再加 es 组；例外对照 roof → roofs 只加 s，本幕提醒遇到新词查一查" }
