facts:
  objects:
    - { name: "cold", kind: "单词", states: "音标 /koʊld/；本幕词头卡标注寒冷的，冷的，其名词义在③卡给出" }
    - { name: "② 意象桥梁：寒冷低温及其引发的受凉症状", kind: "义项", states: "本幕第2幕所立环节：s 说明定位为场景变形·寒气侵入身体，寒气引起打喷嚏" }
    - { name: "③ 引申新义：n. 感冒，伤风（着凉受冻生的小病）", kind: "义项", states: "③卡给出的引申义：其括注『着凉受冻生的小病』直接取自②桥梁的受凉一支" }
    - { name: "It is cold in winter.", kind: "例句", states: "本幕 s 配对句仍为本义例句：其第二元素说明文字承担本幕寒气侵入身体的场景，感冒义例句未在此幕作 s 配对句" }
  invariants:
