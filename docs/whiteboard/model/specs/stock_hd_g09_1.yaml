  - 指示代词四兄妹 (this / that / these / those) —— 近处单数 this、远处单数 that；近处复数 these、远处复数 those！
- - w
  - 【为什么指示词也要分单复数？】
- - w
  - 英语讲究“数的一致”：指着 1 个苹果说 this is an apple，指着一堆苹果必须同步把指示词和系动词都变成复数 these are apples！
- - w
  - 🔬 问答替换：答句换成 it / they
- - w
  - Is this / that ...? → Yes, it is. / No, it isn't.
- - s
  - Is this an apple? Yes, it is. No, it isn't.
  - 这是苹果吗？是的。不是。
- - s
  - Is that a bird? Yes, it is.
  - 那是鸟吗？是的。
- - w
  - Are these / those ...? → Yes, they are. / No, they aren't.
- - s
  - Are these apples? Yes, they are. No, they aren't.
  - 这些是苹果吗？是的。不是。
- - w
  - 例：— What are those? — They are sheep.
- - s
  - What are those? They are sheep.
  - 那些是什么？它们是绵羊。
- - w
  - 例：— Are those tomatoes over there? — Yes, they are.
- - s
  - Are those tomatoes over there? Yes, they are.
  - 那边那些是西红柿吗？是的。
