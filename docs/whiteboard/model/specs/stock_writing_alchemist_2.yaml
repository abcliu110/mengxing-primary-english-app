title: ✍️ 写作炼金术 · 2
items:
- - n
  - 为什么有的作文读起来像一盘散沙？因为句子和句子之间没有「路标」。
- - w
  - 满分作文炼金炉
- - w
  - 炼金术 ②  四大逻辑衔接词链
- - n
  - 衔接词：连接句子、说明前后关系的词，比如 First of all、What's more。
- - w
  - First of all,
- - w
  - 第一棒：开头
- - n
  - 逻辑路标：像路边的指示牌，告诉老师：现在讲第一点、在补充，还是要转折了。
- - w
  - 普通
- - w
  - First, I will do homework.
- - n
  - First of all,：「首先」，放在句子开头，后面加逗号。也可以用 To begin with,。
- - w
  - 高分
- - w
  - First of all, / To begin with, I am going to finish my homework
- - w
  - carefully.
- - s
  - First of all, I am going to finish my homework carefully.
  - 首先，我要认真写完作业。
- - n
  - Cohesion Chain：衔接链。每一句都用衔接词扣住上一句，像链子一环扣一环。
- - w
  - What's more,
- - w
  - 第二棒：递进
- - w
  - 普通
- - w
  - And I also help my mom.
- - n
  - 递进：意思再往前进一步，「而且」。用 What's more, 或 Besides, 代替 And。
- - w
  - 高分
- - w
  - What's more, / Besides, I often help my parents do some
- - w
  - housework, such as sweeping the floor.
- - s
  - What's more, I often help my parents do some housework, such as sweeping the floor.
  - 而且，我常帮父母做家务，比如扫地。
- - n
  - such as：「比如」，后面举例子：such as sweeping the floor（比如扫地）。
- - w
  - Although
- - w
  - 第三棒：转折
- - n
  - 转折：前后意思相反，比如「虽然很累，但是很开心」。
- - w
  - 普通
- - w
  - I was tired, but I was happy.
- - w
  - 高分
- - w
  - Although I felt a little tired after the trip, I learned a lot
- - w
  - and had a great time!
- - s
  - Although I felt a little tired after the trip, I learned a lot and had a great
    time!
  - 虽然旅行后有点累，但我学到很多，玩得很开心！
- - n
  - 黄金铁律：英语里 Although（虽然）和 but（但是）不能出现在同一个句子里！
- - w
  - Although + but
- - w
  - 不能同句！
- - n
  - Because（因为）和 so（所以）也一样，二选一，不能一起用！
- - w
  - Because + so
- - w
  - 也不能同句！
- - n
  - 总结：最后一棒收尾：All in all,（总而言之）或 In a word,（总之），代替 At last。
- - s
  - First, I will do homework. And I also help my mom.
  - 首先，我要写作业。我还帮妈妈。
  - First I will do homework And also help my mom
- - s
  - First of all, to begin with, I am going to finish my homework carefully.
  - 首先，一开始，我要认真写完作业。
  - First of all To begin with am going finish my carefully To begin with
- - s
  - What's more, besides, I often help my parents do some housework, such as sweeping
    the floor.
  - 而且，另外，我常帮父母做家务，比如扫地。
  - What's more Besides often parents some housework such as sweeping the floor
- - s
  - I was tired, but I was happy.
  - 我很累，但我很开心。
  - was tired but happy is
- - s
  - Although I felt a little tired after the trip, I learned a lot and had a great
    time!
  - 虽然旅行后有点累，但我学到很多，玩得很开心！
  - Although felt a little after trip learned lot had great time
- - s
  - Because it rained, we stayed at home. It rained, so we stayed at home.
  - 因为下雨，我们待在家里。下雨了，所以我们待在家里。
  - Because so
- - s
  - All in all, in a word, my weekend is busy but meaningful. I can't wait for it!
  - 总而言之，总之，我的周末忙碌但有意义。我等不及了！
  - All in all In a word weekend busy meaningful can't wait for it busy but meaningful
- - s
  - At last. Cohesion chain.
  - 最后。衔接链。
  - At last Cohesion Chain
- - w
  - 第四棒 · 收尾：All in all, / In a word, my weekend is busy but meaningful. I can't wait
    for it!
- - w
  - 口诀：首先 First of all，而且 What's more，虽然 Although 不配 but，总之 All in all！
- - n
  - busy but meaningful：「忙碌但有意义」。这句只有 but、没有 Although，所以没问题。
- - n
  - 口诀：首先 First of all，而且 What's more，虽然不配 but，总之 All in all！
facts:
  objects:
    - { name: "例句 First of all, I am going to finish my homework carefully.", kind: "例句", states: "第一棒开头：First of all 义为首先、放句首后加逗号，可替换为 To begin with；普通版对照为 First, I will do homework." }
    - { name: "例句 What's more, I often help my parents do some housework, such as sweeping the floor.", kind: "例句", states: "第二棒递进：What's more 或 Besides 代替 And 表而且；such as 表比如、后面举例子" }
    - { name: "例句 Although I felt a little tired after the trip, I learned a lot and had a great time!", kind: "例句", states: "第三棒转折：由普通版 I was tired, but I was happy. 升级而来，句中只有 Although、没有 but" }
    - { name: "收尾句 All in all, my weekend is busy but meaningful.", kind: "例句", states: "第四棒收尾：All in all 或 In a word 表总而言之、总之，代替 At last；完整版后接 I can't wait for it!" }
  invariants:
    - "黄金铁律：Although 与 but 不能出现在同一个句子里，Because 与 so 也一样、二选一（本幕判据；模型同源主张 g15-because-so：because 与 so 干同一件活、同一对句子只能选一种接法）"
    - "衔接链要求每一句都用衔接词扣住上一句、像链子一环扣一环，衔接词是告诉读者现在讲第几点、在补充还是转折的逻辑路标（本幕定义判据）"
    - "四棒顺序在本幕内恒定：首先 First of all、而且 What's more、转折、总之 All in all（本幕口诀）"
    - "分类边界：模型裁定 Although 不属衔接棒、应单列为句型升级的让步句，衔接链实为三棒衔接加一棒句型升级（模型记录 dom-writing 所载 C-6 归类裁定）"
