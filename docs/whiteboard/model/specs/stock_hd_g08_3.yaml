title: 📘 G08 底层原理 · 第3幕
items:
- - w
  - G08 底层原理
- - w
  - 形容词性物主代词 vs 名词性物主代词 (my vs mine) —— my 是“粘人精”（后面必带名词），mine 是“独行侠”（自带名词光环）！
- - w
  - 【为什么有了 my 还要发明 mine？】为了避免啰嗦重复！
- - w
  - 当别人问 Whose book is this? 直接把 my book 合体浓缩成一个词 mine（我的书），既简洁又有力！
- - w
  - 🔬 做题秒杀：看空格后面有没有名词
- - w
  - 有名词 → my / your / her / our / their
- - w
  - 没名词 → mine / yours / hers / ours / theirs
- - w
  - 例：Their dog is big, but ours is small and cute.
- - s
  - Their dog is big, but ours is small and cute.
  - 他们的狗很大，我们的又小又可爱。
- - w
  - 常错：This blue umbrella is my. ✗ → This blue umbrella is mine. ✓
- - s
  - This blue umbrella is mine.
  - 这把蓝伞是我的。
- - w
  - 例：Our classroom is on the first floor, and theirs is on the second floor.
- - w
  - G08 第3幕
- - n
  - 🎵 口诀：形物代(my/your/her/our/their)是粘人精，后面必须跟名词；名物代(mine/yours/hers/ours/theirs)是独行侠，句尾单干不带名！牢记公式：形物代
    + 名词 = 名物代！
