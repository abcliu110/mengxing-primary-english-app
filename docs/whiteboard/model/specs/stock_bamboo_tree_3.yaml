    - { name: "例句 The girl in a red dress under the tree is my sister.", kind: "例句", states: "本幕修正终句：核心名词 the girl 在前，修饰语 in a red dress 与 under the tree 挂其后；与中文原句指称同一" }
    - { name: "主干 The girl is my sister", kind: "句型", states: "先立的主干：is 是谓语动词；修饰语后挂不改变主干" }
    - { name: "核心名词 girl", kind: "单词", states: "句子真正在说的那个人；中文原句中被一长串定语压在后面，英语须第一时间说出" }
    - { name: "介词短语 in a red dress 与 under the tree", kind: "短语", states: "本幕后置修饰：in a red dress 表穿着，under the tree 表位置，都挂在 girl 后面" }
    - { name: "例句 The boy with glasses is my brother.", kind: "例句", states: "本幕预测揭晓句：先说核心名词 The boy，with glasses 挂在 boy 后面" }
  invariants:
    - "先立核心名词，长修饰语往后挂（本幕判据口诀原话）"
    - "英语长的修饰语挂在名词后面，不得照中文顺序全堆在名词前面（本幕判据）"
