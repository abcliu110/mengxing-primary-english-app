title: 📘 G28 底层原理
items:
- - w
  - G28 底层原理
- - w
  - 肯定陈述句黄金语序：主谓宾 + 先地点后时间 —— 英语先把“谁做了什么”说完，再把地点、时间排在句尾：一般先地点、后时间，反过来也对！
- - w
  - 【为什么汉语说“我每天在学校踢球”，英语却说“我踢球 + 在学校 + 每天”？】
- - w
  - 英语先把主干说完——主语 + 谓语 + 宾语，把“谁做了什么”先交代清楚 (I play football)，再挂上 地点 (at school) 和 时间
    (every day)！
- - w
  - 🔬 G28 · 肯定陈述句黄金语序：主谓宾 + 先地点后时间 底层结构拆解与汉英思维对比
- - w
  - ① 典型语境：I (主) read (谓) books (宾) in the study (地点) every night (时间).
- - w
  - 我每天晚上在书房看书。他每天7点半骑自行车去学校。
- - s
  - I play football at school every day.
  - 我每天在学校踢足球。
- - s
  - He rides a bike to school at half past seven every day.
  - 他每天7点半骑自行车去学校。
- - w
  - ② 核心结构规律：① 黄金语序公式：主语 (Who) + 谓语动词 (Action) + 宾语 (What) + 方式 (How) + 地点 (Where)
    + 时间 (When)
- - s
  - Who, action, what, how, where, when.
  - 谁、动作、什么、怎么样、在哪里、什么时候。
- - w
  - ③ 进阶要点：② 切忌中式直译：绝不能把时间地点插在主语和谓语动词之间！
- - w
  - G28 第1幕
- - s
  - I (主) read (谓) books (宾) in the study (地点) every night (时间).
  - 我每天晚上在书房看书。
- - n
  - 🎵 口诀：汉英排序大不同，英语骨架打先锋：主语+谓语+宾语排前头，方式、地点、时间依次挂句尾！记住口诀：句尾一般先地点后时间，反过来也对！
facts:
  objects:
    - { name: "例句 I read books in the study every night.", kind: "例句", states: "本幕典型语境句，台词逐项标注：I 为主语、read 为谓语、books 为宾语、in the study 为地点、every night 为时间" }
    - { name: "黄金语序公式（本幕台词版）", kind: "句型", states: "本幕台词列为：主语 + 谓语动词 + 宾语 + 方式 + 地点 + 时间；其与裁定口径的关系见不变量" }
  invariants:
    - "先说谁做了什么，地点时间排后面：英语陈述句先把主干说完（主语 + 谓语 + 宾语），方式、地点、时间是补充信息，一般排在句尾，想强调时也可以把状语提到句首；频率副词 always、often 等是另一路，站在主语和谓语之间（g28-svo-order）"
    - "句尾一般先地点后时间，反过来也对：时间排在地点前面（last night at home）同样正确、同样常见（g28-place-time；例外例 xc-g28-time-first：We had a big dinner last night at home.）"
    - "不得据此倾向把任何一序设为错误选项（g28-place-time 的 boundary）"
    - "旧讲法『焦点先行思维』是自造标签，已定案为假统一概念，禁止再用；本条讲的是信息顺序习惯，不是民族思维（g28-svo-order 的 boundary）"
