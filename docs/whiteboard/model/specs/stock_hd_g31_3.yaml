- - w
  - 特殊疑问词全家福 (5W1H 精准分工) —— what / who / whose / where / when / why / which / how
    —— 缺什么信息就派谁站句首！
- - w
  - 【为什么英语疑问词几乎都以 wh- 开头，而且必须放在句首第一个词？】
- - w
  - 英语把疑问词放在句首第一位（焦点前置），就像给听话人大脑发送一条检索指令：“请立刻去搜索【地点 Where / 时间 When / 人物 Who / 原因
    Why】！”
- - w
  - 🔬 Why 和 Because 锁死配对
- - w
  - 用 Why 提问，回答必用 Because ...
- - w
  - Which 哪一个：在几样里挑一个
- - s
  - Why do you like spring? Because there are beautiful flowers.
  - 你为什么喜欢春天？因为有美丽的花。
- - w
  - 例：— Which season do you like best, and why? — Winter, because I can make a snowman!
- - s
  - Which season do you like best? Winter, because I can make a snowman!
  - 你最喜欢哪个季节？冬天，因为我可以堆雪人！
