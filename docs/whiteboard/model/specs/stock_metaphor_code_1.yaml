  objects:
    - { name: "foot 与例句 There is a small village at the foot of the mountain.", kind: "例句", states: "字面义为脚，比喻义为最底部；短语 at the foot of the mountain 义为在山脚下，另有锚例句 My home is at the foot of the hill." }
    - { name: "face 与 hand：face of a clock、hour hand", kind: "词表", states: "face 字面义为脸、比喻义为朝外的一面故称钟面；hand 因会指方向而称钟上指针，短针为 hour hand；锚例句 Look at the clock face. The hour hand points to three." }
    - { name: "mouth of a river", kind: "单词", states: "mouth 字面义为嘴，因嘴是进出的口子而比喻河流进大海的出入口即河口" }
    - { name: "head、headmaster 与 at the head of the line", kind: "词表", states: "head 字面义为头，比喻义为最前端与带头人；headmaster 为一校之头即校长；预测揭晓 the head of the bed 为床头，锚例句 My cat sleeps at the head of the bed." }
    - { name: "eye of a needle、neck of a bottle、give me a hand", kind: "词表", states: "本幕补充名单：针眼称针的眼睛，瓶颈称瓶子的脖子，帮忙称给我一只手；锚例句 Can you give me a hand?" }
