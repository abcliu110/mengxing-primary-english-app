title: 📘 G17 底层原理
items:
- - w
  - G17 底层原理
- - w
  - be 动词过去时双子星 (was / were) —— 坐上时光机回到过去：am/is 变成 was，are 变成 were！
- - w
  - 【为什么昨天“在家”不能说 I am at home yesterday？】
- - w
  - 只要时间发生在过去（yesterday / last week / ago），be 动词必须换上过去时盔甲 was / were！
- - w
  - 🔬 G17 · be 动词过去时双子星 (was / were) 底层结构拆解与汉英思维对比
- - w
  - ① 典型语境：I was short two years ago, but now I am tall.
- - w
  - 两年前我很矮，但现在我很高。昨天是星期日，天气晴朗。昨晚你在哪里？我们在电影院。
- - s
  - Yesterday was Sunday. The weather was fine.
  - 昨天是星期日，天气晴朗。
- - s
  - Where were you last night?
  - 昨晚你在哪里？
- - s
  - We were at the cinema.
  - 我们在电影院。
- - w
  - ② 核心结构规律：① 变身对应：am / is ➔ was（否定 wasn't）；are ➔ were（否定 weren't）
- - s
  - I wasn't at home yesterday.
  - 我昨天不在家。
- - s
  - They weren't at home.
  - 他们不在家。
- - w
  - ③ 进阶要点：② 过去时间标志词：yesterday, last night/week/year, ...ago, just now, in 2020
- - s
  - Just now, I was at home.
  - 刚才我在家。
- - s
  - In 2020, I was in Beijing.
  - 2020 年我在北京。
- - w
  - G17 第1幕
- - s
  - I was short two years ago, but now I am tall.
  - 两年前我很矮，但现在我很高。
- - n
  - 🎵 口诀：过去时间看标志（yesterday / last... / ...ago）；现在的 am 和 is 变身 was（含 s 对应单数），现在的 are
    变身 were（含 re 对应复数）！
