    - { name: "遮住主谓看核心词性判据卡", kind: "规则", states: "本幕破案实验的判断法：去掉主谓，看剩下的核心词是名词还是形容词，再定 What 还是 How" }
  invariants:
    - "感叹句被感叹的核心是名词用 What：单数可数名词用 What + a/an + 形容词 + 名词；复数与不可数名词只用 What，不加 a/an（模型同源主张 g34-exclamatory）"
    - "感叹句被感叹的核心是形容词或副词用 How：结构为 How + 形容词或副词 + 主语 + 谓语（模型同源主张 g34-exclamatory）"
    - "判断法恒为划掉句尾的主语和谓语，看剩下的核心词（模型同源主张 g34-exclamatory；本幕台词同述为遮住主谓）"
    - "感叹句与疑问句共用同一底层分工：名词归 What，程度归 How（模型同源主张 g34-exclamatory 及其 boundary）"
