- - s
  - Linda is a tall and outgoing girl with big bright eyes.
  - 琳达是个高个子、性格外向的女孩，有一双明亮的大眼睛。
- - n
  - 后置定语：放在名词后面修饰它。with big bright eyes 挂在 girl 后面，省掉一句话。
- - n
  - 性格品质：用形容词写脾气：outgoing 外向，polite 有礼貌，helpful 乐于助人。
- - n
  - Not only is she…：「她不仅……」。Not only 放在句首时，is 要跑到 she 前面。
- - n
  - be good at：擅长……，后面动词加 ing：good at playing the piano（擅长弹钢琴）。
- - n
  - Whenever… always…：「每当……她总是……」，写出朋友帮助我的小细节，这就是榜样力量。
- - w
  - 母题二：过去经历篇
- - w
  - 时间·天气·交通
- - w
  - +
- - w
  - 上午·下午活动
- - w
  - +
- - w
  - 感受·感叹
- - w
  - Last Sunday, the weather was sunny and warm. I went to the countryside with my
    family by
- - w
  - car. In the morning, we picked fresh strawberries and fed the cute sheep. In the
    afternoon,
- - w
  - we took many beautiful photos by the lake. Tired as we were, what a fantastic
    day we had!
- - s
  - Last Sunday, I went to the countryside with my family by car.
  - 上周日，我和家人坐车去了乡下。
- - n
  - 过去式：已经发生的事，动词要变样：is→was，go→went，take→took。
- - n
  - 全文动词都锁定过去式：was, went, picked, fed, took, had，一个都不能漏！
- - n
  - Tired as we were：「虽然我们很累」。结尾再用感叹句，像画龙点睛，一下子亮起来。
- - n
  - be going to：母题三写计划：be going to「打算做……」，再换着用 will、plan to。
- - s
  - With, be good at. She is good at playing the piano.
  - 带有、擅长。她擅长弹钢琴。
  - with be good at playing the piano good at playing the piano ing
- - s
  - Linda is a tall and outgoing girl with big bright eyes.
