  objects:
    - { name: "人物 Linda 与写人范文三句", kind: "人物", states: "范文主角：Linda is a tall and outgoing girl with big bright eyes. 写外貌；Not only is she polite and helpful, but she is also good at playing the piano. 写性格与爱好；Whenever I have trouble with English, she always helps me patiently. 写榜样力量" }
    - { name: "写经历范文", kind: "例句", states: "Last Sunday, the weather was sunny and warm. 起时间天气；I went to the countryside with my family by car. 写交通；上午摘草莓喂羊、下午湖边拍照写活动；Tired as we were, what a fantastic day we had! 以感叹收尾" }
    - { name: "计划篇积木词表", kind: "词表", states: "打算总起用 be going to，三项计划用 First、What's more、Finally 排开，期待收尾用 I look forward to it!；将来说法另有 will 与 plan to" }
  invariants:
    - "写人积木顺序恒定：外貌（with 短语后置修饰）加性格形容词加爱好（be good at）加榜样力量（本幕积木判据与口诀：写人抓外貌、性格、爱好）"
    - "句法细则恒定：with 短语放名词后面作后置定语；be good at 后面动词加 ing；Not only 放句首时 is 要跑到 she 前面（本幕台词判据）"
    - "写经历全文动词锁定过去式：was、went、picked、fed、took、had 一个都不能漏，is 变 was、go 变 went、take 变 took（本幕判据与口诀）"
    - "写计划换着用将来的说法：be going to、will、plan to 与 look forward to（本幕口诀）"
    - "母题与公式只是搭文的支架、不作分数承诺：本幕开场的百分比说法在模型中被裁定为无来源伪统计，写作公式不保满分（模型记录 dom-writing；scene_fixes sf-042 分数承诺删除裁定）"
