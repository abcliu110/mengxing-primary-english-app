  - G20 底层原理
- - w
  - 现在进行时 (am/is/are + V-ing) —— 此时此刻正在上演的动作大片——be 动词与 -ing 缺一不可！
- - w
  - 【为什么不能只写 He running，非要写 He is running？】
- - w
  - 加上 -ing 后的动词（running）变成了描述状态的现在分词，必须请 am / is / are 来当支架，组成 be + doing 双人组合！
- - w
  - 🔬 进行时两件套：be + 动词-ing，缺一不可
- - w
  - 公式：I am / He is / They are + 动词-ing
- - s
  - They are doing their homework.
  - 他们正在做作业。
- - w
  - -ing 变法：一般 +ing（playing）；不发音的 e 结尾去 e（make → making）；重读闭音节双写（run → running, swim → swimming）
- - s
  - Make, making. Run, running. Swim, swimming.
  - make、making。run、running。swim、swimming。
