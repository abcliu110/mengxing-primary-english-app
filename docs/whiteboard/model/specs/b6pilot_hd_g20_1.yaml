  - Look! The bird is flying in the sky.
  - 看！小鸟正在天空中飞翔。
- - n
  - 🎵 口诀：Look! Listen! 加 Now，现在进行正热闹；结构公式要记牢：be(am/is/are) 加动词 ing，缺了哪一个都报错！直接加、去e加(writing)、双写加(running/swimming)！
facts:
  objects:
    - { name: "例句 He is playing football now.", kind: "例句", states: "本幕立现在进行时肯定式：主语 He 配 is 加 playing；与习惯句 He plays football every day. 对比，呈现『正在』对『习惯』" }
    - { name: "例句 Look! The bird is flying in the sky.", kind: "例句", states: "信号词 Look! 的语境实证句：主语 The bird 配 is 加 flying" }
    - { name: "be 动词支架 am / is / are", kind: "语法对象", states: "公式：I 配 am、He 配 is、They 配 are；与动词-ing 组成 be 加 doing 双人组合，本幕称缺一不可；单写 He running 被判错，须补成 He is running" }
    - { name: "动词-ing 变法", kind: "规则", states: "一般直接加 ing（playing）；不发音的 e 结尾去 e（make 变 making）；重读闭音节双写（run 变 running、swim 变 swimming）" }
  invariants:
    - "现在进行时恒为 be（am / is / are）加动词-ing，表此时此刻正在发生，两部分缺一不可（g20-progressive）"
    - "信号词恒提示此刻进行：now、Look!、Listen!（g20-progressive；本幕信号词卡）"
    - "-ing 加法恒分三路：一般直接加、不发音的 e 结尾去 e 再加、重读闭音节双写尾辅音再加（g20-progressive）"
    - "变形对象恒为同一动作的两种看法：He plays football every day. 是习惯，He is playing football now. 是正在进行（本幕判据：对比卡）"
