title: 🧱 五大基本句型 · ④ SVOO 双手递礼型 · 第 2 节
items:
- - n
  - 也可以把物放前面、人放后面，但人前面要加 to 或 for。
- - w
  - 人在前：V + sb. + sth.     或     物在前：V + sth. + to / for + sb.
- - w
  - Leo gave me a nice pen. = Leo gave a nice pen TO me.
- - s
  - Leo gave me a nice pen. Leo gave a nice pen to me.
  - 里奥给了我一支好看的笔。
  - gave
- - w
  - IO
- - w
  - DO
- - w
  - DO
- - w
  - to + 人
- - n
  - to 指向：把现成的东西单向递过去，像一支箭头，就用 to。
- - s
  - Leo gave me a nice pen. Give it to me.
  - 里奥给了我一支好看的笔。把它给我。
  - Leo nice pen give to
- - w
  - to 派：give / show / send / pass / lend / teach / tell
- - s
  - Give, show, send, pass, lend, teach, tell. Please tell me a story.
  - 给、展示、寄、递、借给、教、讲。请给我讲个故事。
  - show send pass lend teach tell
