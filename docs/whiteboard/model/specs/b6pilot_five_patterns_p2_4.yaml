  objects:
    - { name: "例句 Leo gave me a nice pen.", kind: "例句", states: "本幕双宾原式：主语 Leo、动词 gave、间接宾语 me 为 IO 人、a nice pen 为直接宾语 DO 物；等值改写为 Leo gave a nice pen to me." }
    - { name: "to 派动词词表", kind: "词表", states: "本幕点名 give / show / send / pass / lend / teach / tell；锚例句 Please tell me a story." }
    - { name: "to（指向）", kind: "语法对象", states: "本幕定义：把现成的东西单向递过去时用 to；物在前时人前面写作 to + 人" }
  invariants:
    - "双宾两种语序等值：人在前为 V + sb. + sth.，物在前为 V + sth. + to / for + sb.，变形对象恒为同一递交事件（本幕上屏公式）"
    - "物放前面时，人前面必须加 to 或 for，不得裸接（本幕开场判据）"
    - "双宾骨架是五大基本句型之一：主谓双宾（模型主张 st-cl-five-patterns）；双宾模具自带『让某人收到某物』的意思（模型主张 dom-constructions）"
