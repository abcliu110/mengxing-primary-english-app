title: 📘 G31 底层原理 · 第2幕
items:
- - w
  - G31 底层原理
- - w
  - 特殊疑问词全家福 (5W1H 精准分工) —— what / who / whose / where / when / why / which / how
    —— 缺什么信息就派谁站句首！
- - w
  - 【为什么英语疑问词几乎都以 wh- 开头，而且必须放在句首第一个词？】
- - w
  - 英语把疑问词放在句首第一位（焦点前置），就像给听话人大脑发送一条检索指令：“请立刻去搜索【地点 Where / 时间 When / 人物 Who / 原因
    Why】！”
- - w
  - 🔬 Where 哪里 · When 何时 · What time 几点
- - w
  - When 问任何时间；What time 专问钟表上的几点几分
- - w
  - 例：Where are you going, and when will you come back?
- - s
  - Where are you going, and when will you come back?
  - 你要去哪里？什么时候回来？
- - w
  - 常错：Where is your birthday? ✗ → When is your birthday? ✓ — It's in May.
- - s
  - When is your birthday? It's in May.
  - 你的生日是什么时候？在五月。
- - w
  - G31 第2幕
- - n
  - 🎵 口诀：什么 what 谁是 who，谁的东西用 whose；哪里 where 何时 when，哪一个用 which 选；为什么 why 用 because
    答，怎样程度全归 how！
