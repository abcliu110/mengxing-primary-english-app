title: 🔬 规律 11 · 词变长，元音变短：south → southern
items:
- - n
  - 一个词加了尾巴变长以后，前面的长元音常常变短。south 读 /aʊ/，southern 却读 /ʌ/。
- - w
  - 🔬 规律 11：派生音变（元音变短）
- - w
  - 📜 有出处 ✂️ 简化说法
- - s
  - Look to the south.
  - 往南边看。
  - south
- - w
  - south /aʊ/ → southern /ʌ/ 南方的
- - s
  - South, southern.
  - south、南方的 southern。
- - w
  - shade /eɪ/ → shadow /æ/ 影子
- - s
  - Shade, shadow.
  - shade、shadow。
- - w
  - pronounce /aʊ/ → pronunciation /ʌ/ 发音
- - s
  - Pronounce, pronunciation.
  - pronounce、pronunciation。
- - n
  - 这个变化在中古英语时就发生了，比元音大转移还早，所以今天一对词的元音差得很远。
- - w
  - ✂️ 中古英语时元音变短，后来大转移又拉开距离
- - n
  - 出处：southern、shadow 的来历见 Etymonline 和 Wiktionary；例词和说法见 Wikipedia「Trisyllabic laxing」。
- - w
  - 出处：Etymonline · Wiktionary · Wikipedia
facts:
  objects:
    - { name: "south / southern", kind: "单词", states: "本幕对照：south 读 /aʊ/，southern 读 /ʌ/，义为南方的；例句 Look to the south." }
    - { name: "shade / shadow", kind: "单词", states: "本幕对照：shade 读 /eɪ/，shadow 读 /æ/，义为影子" }
    - { name: "pronounce / pronunciation", kind: "单词", states: "本幕对照：pronounce 读 /aʊ/，pronunciation 读 /ʌ/，义为发音" }
  invariants:
    - "本幕三对对照的读音差恒如台词所标：south 对 southern、shade 对 shadow、pronounce 对 pronunciation，加尾巴变长后前面的元音变短（本幕判据，上屏音标与规律 11）"
    - "本幕说法自带限定：规律 11 在标题卡标为『✂️ 简化说法』，不得讲成无例外的全称定律（本幕判据）"
