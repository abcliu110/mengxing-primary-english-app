# 按模型 ph-cl-doubling 改写：双写是 tendency 不是铁律——「多半」入词；
# 守门员画面换成模型 mnemonic 的「双岗哨」（ph-cl-doubling-picture）并标帮记画面；
# 例外入词：重音不在末音节不双写（visit/open）、w/x/y 结尾不双写（fix/snow）。
