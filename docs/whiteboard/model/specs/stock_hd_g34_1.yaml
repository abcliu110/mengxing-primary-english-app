  - G34 底层原理
- - w
  - 感叹句双雄：What (a/an) vs How 秒判法则 —— 与疑问句原理完全相通：感叹“名词事物”用 What，感叹“形容词/副词程度”用 How！
- - w
  - 【为什么感叹句也是 What 和 How 两大家族？】跟疑问句底层逻辑一模一样！
- - w
  - What 管名词（What a nice day! 核心落脚点是名词 day）；
- - w
  - How 管形容词/副词（How nice the day is! 被感叹的是形容词 nice）！
- - w
  - 🔬 两步秒判：先遮住主谓，再看剩下的核心词
- - w
  - 🟦 What a
- - w
  - clever
- - w
  - boy (核心是名词!)
- - w
  - '[he is 遮住主谓] !'
- - w
  - ➔ 去掉主谓 he is，尾巴核心词是名词 boy，所以派代词 What a!
- - w
  - 🔶 How
- - w
  - clever (核心是形容词!)
- - w
  - '[the boy is 遮住] !'
- - w
  - ➔ 去掉主谓 the boy is，只剩形容词 clever，所以派副词 How!
- - s
  - What a clever boy he is! How clever the boy is!
  - 他是多么聪明的一个男孩啊！这个男孩多聪明啊！
