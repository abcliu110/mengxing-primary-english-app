  - 上周日，我和家人坐车去了乡下。
- - n
  - 过去式：已经发生的事，动词要变样：is→was，go→went，take→took。
- - n
  - 全文动词都锁定过去式：was, went, picked, fed, took, had，一个都不能漏！
- - n
  - Tired as we were：「虽然我们很累」。结尾再用感叹句，像画龙点睛，一下子亮起来。
