    - { name: "代词变格表", kind: "词表", states: "本幕全表：主语 I、he、she、we、they；宾语 me、him、her、us、them；带名词 my、his、her、our、their；单独用 mine、his、hers、ours、theirs" }
    - { name: "例句 I like him. He likes me.", kind: "例句", states: "本幕主宾对照锚例：我喜欢他，他喜欢我" }
    - { name: "例句 This is my book. The book is mine.", kind: "例句", states: "本幕物主对照锚例：带名词用 my，单独用用 mine" }
  invariants:
    - "人称代词按位置变身：站在动词前作主语用主格，站在动词或介词后面作宾语用宾格（grammar.yaml g07-case-position；本幕判据）"
    - "物主代词看后面有没有名词：有名词用 my 一类，没名词单独用 mine 一类（grammar.yaml g08-possessive-pair；本幕口诀同口径）"
    - "名物代大多是形物代的独立版，但 his 形物两用同形要单独记；『mine = my book』只是帮记的钩子，不是拼法公式（vocab_fixes.yaml VF-014）"
