  - ① 典型语境：The old turtle walks slowly, but the rabbit runs fast.
- - w
  - 老乌龟走得很慢，但兔子跑得很快。孩子们在公园里快乐地玩耍。她总是很有礼貌，而且经常帮助别人。
- - w
  - ② 核心结构规律：① 方式副词：一般形容词加 -ly（quietly, carefully, happily），放在实义动词后
- - w
  - ③ 进阶要点：② 不加 -ly 特例：fast, early, late, hard 形副同形；
