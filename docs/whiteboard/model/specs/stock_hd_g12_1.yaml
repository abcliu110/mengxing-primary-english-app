  - G12 底层原理
- - w
  - 副词修饰动作与频率副词位置 (fast / happily / always) —— 形容词管名词，副词管动作！频率副词站在“be后实前”！
- - w
  - 【为什么“快乐地唱歌”是 sing happily？】英语先亮出动作 sing（唱），再补充是怎么唱的 happily（快乐地）；
- - w
  - 而表示频率的 always/often 紧贴在实义动词前面（often sing）或 be 动词后面（is always happy）！
- - s
  - I often sing. She is always happy.
  - 我经常唱歌。她总是很开心。
- - w
  - 🔬 G12 · 副词修饰动作与频率副词位置 (fast / happily / always) 底层结构拆解与汉英思维对比
- - w
  - ① 典型语境：The old turtle walks slowly, but the rabbit runs fast.
- - w
  - 老乌龟走得很慢，但兔子跑得很快。孩子们在公园里快乐地玩耍。她总是很有礼貌，而且经常帮助别人。
- - s
  - The children play happily in the park.
  - 孩子们在公园里快乐地玩耍。
- - s
  - She is always polite, and she often helps others.
  - 她总是很有礼貌，而且经常帮助别人。
  - be
- - w
  - ② 核心结构规律：① 方式副词：一般形容词加 -ly（quietly, carefully, happily），放在实义动词后
- - s
  - Quietly, carefully, happily.
  - 安静地、仔细地、快乐地。
  - ly
- - w
  - ③ 进阶要点：② 不加 -ly 特例：fast, early, late, hard 形副同形；
- - s
  - Fast, early, late, hard.
  - 快、早、晚、努力。
- - w
  - good 变副词是 well（play football well）！
- - s
  - Good becomes well.
  - good 的副词形式是 well。
- - s
  - I play football well.
  - 我踢足球踢得很好。
- - w
  - G12 第1幕
- - s
  - The old turtle walks slowly, but the rabbit runs fast.
  - 老乌龟走得很慢，但兔子跑得很快。
- - n
  - 🎵 口诀：形容词变副词，词尾常加 -ly（slow→slowly, happy→happily）；fast/hard/early/late/high/well
    形副同形或特殊记！频率副词站哪里？be动词后、实义动词前！
