scene: gen_stock_wo_grimm_verner_1
template: wo_grimm_verner_1.js
title: 🔤 维尔纳定律 · 格林定律的例外
items:
- - n
  - 格林定律说：老祖宗的 t 到了英语这一支变成 th。可有些词偏偏变成了 d。这个谜，丹麦语言学家维尔纳在 1875 年解开了。
- - w
  - 🔤 维尔纳定律：格林定律的例外
- - s
  - Verner's law.
  - 维尔纳定律。
- - w
  - 📜 有出处 ⚠️ 简化说法
- - n
  - 秘密在重音：在老祖宗语言里，如果重音不在前面那个音节上，f、th、s 这些音就会变浊。
- - w
  - 重音不在前面 → 变浊：th → d，s → z → r
- - n
  - 看这对兄弟：brother 和 father。brother 的重音在前，t 照常变成 th；father 的重音在后，t 变成了 d。
- - w
  - brother：重音在前 → th（照规矩）
- - w
  - father：重音在后 → d（古英语 fæder）
- - s
  - Father, fæder.
  - father、古英语 fæder。
- - s
  - My father and my brother are at home.
  - 我的爸爸和哥哥在家。
  - father
- - n
  - 那为什么今天写 father，又是 th 呢？这是后来的事：中古英语时期，很多词里的 der 改读成了 ther，十五世纪起拼写也跟着改成 th；mother
    也一样。
- - w
  - ⚠️ 今天的 th 是后来改的：fæder → father（拼写 15 世纪起）
- - w
  - mother：古英语 modor → mother
- - s
  - Mother, modor.
  - mother、古英语 modor。
- - n
  - 第二对：was 和 were。s 变浊成了 z，后来又变成 r。
- - w
  - s → z → r：was ↔ were
- - s
  - I was happy.
  - 我很开心。
  - was
- - s
  - We were happy.
  - 我们很开心。
  - were
- - n
  - 第三对：lose 和 forlorn。forlorn 意思是孤零零、被丢下的，里面藏着 lose 的另一个样子 lorn。
- - w
  - lose ↔ forlorn（孤零零的）里的 lorn
- - s
  - Lose, forlorn, lorn.
  - lose、forlorn、lorn。
- - s
  - Don't lose your key.
  - 别弄丢你的钥匙。
  - lose
- - n
  - 出处：维尔纳定律和 was、were 见 Etymonline；father 和 brother、lose 和 forlorn 见 Wikipedia「Verner's
    law」。
- - w
  - 出处：Etymonline · Wikipedia（Verner's law）
