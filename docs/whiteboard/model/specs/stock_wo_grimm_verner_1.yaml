  invariants:
    - "本幕前提恒为格林定律的 t 变 th（本幕台词；scene_fixes.yaml sf-020 定稿口诀逐字含『t 变 th』）"
    - "be 动词过去式对应恒为：am、is 变 was，are 变 were（grammar.yaml g17-be-past；本幕例句 I was happy. 与 We were happy. 与之同型）"
