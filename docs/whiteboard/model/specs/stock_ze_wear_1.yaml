  objects:
    - { name: "wear / put on", kind: "单词", states: "本幕穿组：wear 为穿着（状态），例句 She wears a red dress.；put on 为穿上（动作），例句 Put on your coat, please!" }
    - { name: "take / bring", kind: "单词", states: "本幕带组：take 为带走（离开我），bring 为带来（到我这里），各有一句锚例" }
    - { name: "teach / learn", kind: "单词", states: "本幕教学组：teach 为教别人，例句 Miss Li teaches us English.；learn 为自己学，例句 We learn English from her." }
    - { name: "Miss Li", kind: "人物", states: "本幕台词点名的人物：teach 例句的主语，李老师" }
  invariants:
    - "穿恒分状态与动作：穿着用 wear，穿上用 put on（本幕判据，口诀）"
    - "带恒看方向：东西离开我这边用 take，朝我这边来用 bring（本幕判据，口诀；预测题 Bring your photos to me. 同此判）"
    - "教与学恒分施受：教别人用 teach，自己学用 learn；二者是对转词，不是反义词（vocab_fixes.yaml VF-042；本幕判据同口径）"
