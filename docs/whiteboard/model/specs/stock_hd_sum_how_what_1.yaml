title: 🔍 How vs What 原理 · 第1幕 有介词 like 必用 What
items:
- - w
  - How vs What 原理
- - w
  - What 是【疑问代词】专门填补名词/宾语坑位；How 是【疑问副词】专门当激光尺测量形容词/方式！
- - w
  - 看中央实验台：为什么 What is it like 用 What（填介词 like 的宾语坑），How old/tall 用 How（副词量形容词）！
- - s
  - What is it like? How tall are you?
  - 它像什么样？你多高？
- - w
  - 🔬 深度机制 1：为什么有介词 like 必用 What？（代词填补宾语空缺）
- - w
  - The weather is like (介词:像)
- - w
  - 【缺介词宾语(名词坑)】
- - w
  - 🟦 WHAT (代词填坑)
- - w
  - ❌ How 是副词，不能当介词 like 的宾语！
- - w
  - ✅ 结论：What is the weather like? (有 like 必用代词 What 当宾语)
- - w
  - 原理第1幕
- - s
  - What is the weather like? = How is the weather? How old are you?
  - 底层铁律：句中缺名词或介词 like 缺宾语必用 What；修饰形容词(old/tall/many)或问方式必用 How！
facts:
  objects:
    - { name: "What（疑问代词）", kind: "语法对象", states: "本幕定义为专门填补名词与宾语坑位；例句 What is the weather like? 中填介词 like 的宾语坑" }
    - { name: "How（疑问副词）", kind: "语法对象", states: "本幕定义为专门测量形容词与方式；与 How old 与 How tall 中的形容词搭配呈现" }
    - { name: "The weather is like（介词 like 缺宾语）", kind: "句型", states: "台词标注 like 为介词『像』，其后缺介词宾语即名词坑，并标明 How 是副词不能当此宾语" }
    - { name: "例句对 What is the weather like? = How is the weather? How old are you?", kind: "例句", states: "本幕结尾例句对；有 like 时用 What 当宾语，无 like 问天气状态时用 How，问年龄用 How old" }
  invariants:
    - "缺的是东西就用 What：What 是替身名词，去站名词空缺的位置，like 后面必须跟一个东西，What 就去当这个东西（模型同源主张 g32-how-what）"
    - "问程度、状态、方式用 How：How 后跟形容词问到什么程度，如 How old 与 How is the weather；How many 与 How much 问的是数量这个程度，仍归 How 家族（模型同源主张 g32-how-what）"
    - "How 是副词，不能当介词 like 的宾语；句中缺名词或介词 like 缺宾语必用 What（本幕判据）"
