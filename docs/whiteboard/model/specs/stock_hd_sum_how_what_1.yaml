  - What 是【疑问代词】专门填补名词/宾语坑位；How 是【疑问副词】专门当激光尺测量形容词/方式！
- - w
  - 看中央实验台：为什么 What is it like 用 What（填介词 like 的宾语坑），How old/tall 用 How（副词量形容词）！
- - w
  - 🔬 深度机制 1：为什么有介词 like 必用 What？（代词填补宾语空缺）
- - w
  - The weather is like (介词:像)
- - w
  - 【缺介词宾语(名词坑)】
- - w
  - 🟦 WHAT (代词填坑)
- - w
  - ❌ How 是副词，不能当介词 like 的宾语！
- - w
  - ✅ 结论：What is the weather like? (有 like 必用代词 What 当宾语)
- - w
  - 原理第1幕
- - s
  - What is the weather like? = How is the weather? How old are you?
  - 底层铁律：句中缺名词或介词 like 缺宾语必用 What；修饰形容词(old/tall/many)或问方式必用 How！
