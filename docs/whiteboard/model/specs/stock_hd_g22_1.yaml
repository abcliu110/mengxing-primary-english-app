  invariants:
    - "不规则过去式不加 -ed、整个词换样：goed 与 eated 是本幕点名的错误形式（本幕判据）"
    - "高频老词的过去式没有总规律，分组逐个记：换元音组、换词组（go → went）、带音变的弱变化组（buy → bought、have → had、teach → taught）、同形组（put、cut、hurt、read，拼写不变，read 读音变）（g22-irregular-past）"
    - "分组只是为了好背，不是规律：分组不代表这些词有共同的词源或统一的规律（g22-groups-mnemonic）"
    - "旧讲法『完整保留变换内部元音的传统』已撤：元音变换只覆盖一组，不得据此反推生僻词都规则（g22-irregular-past 的 boundary）"
