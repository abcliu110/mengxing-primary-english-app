title: 📘 G24 底层原理
items:
- - w
  - G24 底层原理
- - w
  - 一般将来时：be going to + 动词原形 —— 表示心里已经想好的“计划、打算”，或眼看就要发生的迹象
- - w
  - 【为什么 be going to 能表打算？】想象你已经走在路上（I am going to...），下一步自然就是要去做那件事！
- - w
  - 所以用 be going to + 动词原形 表达“计划打算做某事”！
- - w
  - ① 计划：早就想好
- - p
  - 📅
- - w
  - 心里已经决定、安排好了的事：We are going to have a picnic this Sunday.
- - s
  - We are going to have a picnic this Sunday.
  - 这个星期天我们打算去野餐。
- - w
  - ② 迹象：眼看要发生
- - p
  - 🌧️
- - w
  - 看到证据、马上要发生的事：Look at the black clouds! It is going to rain.
- - s
  - Look at the black clouds! It is going to rain.
  - 看那些乌云！要下雨了。
- - w
  - 对比 will：说话时临时决定用 will——The phone is ringing. I will get it.
- - s
  - The phone is ringing. I will get it.
  - 电话响了，我去接。
- - w
  - 常错：I going to... ✗（漏 be）；I will going to... ✗（will 和 be going to 二选一）
- - w
  - 🗣️ 语境实证：Tomorrow is Saturday. I am going to visit my grandparents.
- - w
  - 🎵 口诀：be going to 表打算，计划安排早做好；be 随主语变 am/is/are，to
- - w
  - G24 第1幕
- - s
  - Tomorrow is Saturday. I am going to visit my grandparents.
  - 明天是周六，我打算去看望祖父母。
- - n
  - 🎵 口诀：be going to 表打算，计划安排早做好；be 随主语变 am/is/are，to 后永远接原形！
facts:
  objects:
    - { name: "be going to", kind: "句型", states: "本幕定义：be going to + 动词原形；be 随主语变 am、is、are，to 后接原形" }
    - { name: "例句 We are going to have a picnic this Sunday.", kind: "例句", states: "用法一『计划』的例句：心里已经决定、安排好了的事" }
    - { name: "例句 Look at the black clouds! It is going to rain.", kind: "例句", states: "用法二『迹象』的例句：看到证据、马上要发生的事" }
    - { name: "例句 The phone is ringing. I will get it.", kind: "例句", states: "对比项：说话时临时决定用 will，本幕仅作对比列出" }
    - { name: "例句 Tomorrow is Saturday. I am going to visit my grandparents.", kind: "例句", states: "语境实证句：be going to 表打算的完整例句对" }
  invariants:
    - "早想好的打算，用 be going to：表心里已经想好的计划、打算，或根据眼前迹象判断就要发生的事；be 随主语变，to 后接原形（g24-going-to）"
    - "be going to 与 will 的临时决定分工是倾向，小学阶段只点一句，不细抠（g24-going-to 的 boundary）"
    - "be going to 的来历是真实的语法化：本是『走在去做某事的路上』，但今天用它时不再含『走路』义，不要据此推它只能用于要出门的事（g24-etym 的 boundary）"
    - "本幕常错：I going to 漏 be、I will going to 把 will 与 be going to 叠用，二者须二选一（本幕判据）"
