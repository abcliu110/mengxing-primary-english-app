- - s
  - How old are you? I am ten years old.
  - 你多大了？我十岁了。
- - s
  - How tall are you? I am 1.65 metres tall.
  - 你多高？我 1.65 米高。
- - s
  - How much is it? Fifty yuan.
  - 多少钱？五十元。
- - s
  - How many books are there?
  - 有多少本书？
- - w
  - 💡 原理：副词修饰形容词！凡是测量高矮/老少/多少/远近，必用副词 How！
- - w
  - 📏 HOW + much
- - w
  - 📏 HOW + tall
- - w
  - G32 第2幕
- - s
  - 【原理对比1】How is the weather? (无 like，问状态形容词) = What is the weather like? (有介词 like，缺名词宾语用
    What!)
  - 天气怎么样？（无 like 用 How = 有 like 用 What）
- - n
  - 🎵 口诀：What 是代词替名词，追问事物与名称（What colour / What time / What...like）；How 是副词探状态，追问方式与程度！How
    加形容词问高低（How old/tall/heavy/long/far），How many 数复数，How much 问价钱和不可数！
