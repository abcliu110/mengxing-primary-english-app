title: 📘 G32 底层原理 · 第2幕
items:
- - w
  - G32 底层原理
- - w
  - 深度原理突破：How 与 What 到底怎么选？ —— 告别死记硬背！看懂「What 是代词（追问事物/名词）vs How 是副词（追问方式/状态/形容词程度）」
- - w
  - 【核心原理揭秘：为什么同样问天气，一句话是 How is the weather? 另一句话却是 What is the weather like?】
- - w
  - • What 的本质是【疑问代词（替身名词）】：填补名词空缺！
- - w
  - 在 What is the weather like? 里，like 是介词“像……”，后面缺一个宾语名词，所以必须派代词 What 去当 like 的宾语！
- - w
  - • How 的本质是【疑问副词（方式与程度探针）】：修饰动词（问方式 How do you go?）或修饰形容词/副词（问状态程度 How is the weather?
    / How old / How tall）！
- - s
  - How do you go?
  - 你怎么去？
- - w
  - 没有介词 like 时，直接问状态形容词，必须派副词 How 出场！
- - w
  - 🔬 深度机制 2：为什么 old/tall/many 前必用 How？（副词游标卡尺量程度）
- - w
  - 📏 HOW + old
- - w
  - '刻度: 1.65 m'
- - w
  - tall (高的)
