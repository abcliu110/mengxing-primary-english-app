title: 📘 G32 底层原理 · 第1幕
items:
- - w
  - G32 底层原理
- - w
  - 深度原理突破：How 与 What 到底怎么选？ —— 告别死记硬背！看懂「What 是代词（追问事物/名词）vs How 是副词（追问方式/状态/形容词程度）」
- - w
  - 【核心原理揭秘：为什么同样问天气，一句话是 How is the weather? 另一句话却是 What is the weather like?】
- - w
  - • What 的本质是【疑问代词（替身名词）】：填补名词空缺！
- - w
  - 在 What is the weather like? 里，like 是介词“像……”，后面缺一个宾语名词，所以必须派代词 What 去当 like 的宾语！
- - w
  - • How 的本质是【疑问副词（方式与程度探针）】：修饰动词（问方式 How do you go?）或修饰形容词/副词（问状态程度 How is the weather?
    / How old / How tall）！
- - w
  - 没有介词 like 时，直接问状态形容词，必须派副词 How 出场！
- - w
  - 🔬 深度机制 1：为什么有介词 like 必用 What？（代词填补宾语空缺）
- - w
  - The weather is like (介词:像)
- - w
  - 【缺介词宾语(名词坑)】
- - w
  - 🟦 WHAT (代词填坑)
- - w
  - ❌ How 是副词，不能当介词 like 的宾语！
- - w
  - ✅ 结论：What is the weather like? (有 like 必用代词 What 当宾语)
- - w
  - G32 第1幕
- - s
  - 【原理对比1】How is the weather? (无 like，问状态形容词) = What is the weather like? (有介词 like，缺名词宾语用
    What!)
  - 天气怎么样？（无 like 用 How = 有 like 用 What）
- - n
  - 🎵 口诀：What 是代词替名词，追问事物与名称（What colour / What time / What...like）；How 是副词探状态，追问方式与程度！How
    加形容词问高低（How old/tall/heavy/long/far），How many 数复数，How much 问价钱和不可数！
facts:
  objects:
    - { name: "例句对 How is the weather? = What is the weather like?", kind: "例句", states: "本幕原理对比一：无 like、问状态用 How；有介词 like、缺名词宾语用 What" }
    - { name: "What", kind: "语法对象", states: "本幕定义为疑问代词（替身名词）：填补名词空缺，在 What is the weather like? 中当介词 like 的宾语" }
    - { name: "How", kind: "语法对象", states: "本幕定义为疑问副词：修饰动词问方式，或修饰形容词、副词问状态程度，如 How is the weather?、How old、How tall" }
  invariants:
    - "缺名词用 What，问程度用 How：What 是替身名词，去站名词空缺的位置；How 后跟形容词问『到什么程度』，How many、How much 问的是数量这个程度，仍归 How 家族（g32-how-what）"
    - "How many、much 后跟名词不推翻本条——它们问的是数量（g32-how-what 的 boundary）"
    - "How 是副词，不能当介词 like 的宾语（本幕判据）"
