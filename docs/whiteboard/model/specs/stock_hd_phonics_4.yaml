  invariants:
    - "四条拼写暗规则恒为口诀所列：v 不站词尾，i 让给 y；c 与 g 遇 e、i、y 变软；q 和 u 手拉手（本幕判据口诀原话）"
    - "y 变 i 只限辅音后面的 y 加词尾时（本幕规则二台词原话限定）"
    - "c 与 g 软音只是『常常』：g 的软音例外很多，get、give、girl 里的 g 仍读硬音 /g/（本幕台词明示例外）"
    - "q 带 u 的例外只在少数外来名字里，如 Iraq；小学课本里的 q 都带着 u（本幕台词明示边界）"
