title: 📘 G21 底层原理
items:
- - w
  - G21 底层原理
- - w
  - 一般过去时规则变化 (-ed 变形与发音) —— 给过去发生的动作盖上“-ed 历史印章”
- - w
  - 【为什么英语要把过去动词加上 -ed？】
- - w
  - 英语把过去时间信息直接编码在谓语动词身上（play ➔ played），让听话人一听到词尾 -ed 就知道这是过去的故事！
- - w
  - 🔬 -ed 四条加法
- - w
  - 一般 +ed：play → played
- - w
  - 不发音的 e 结尾 +d：live → lived
- - s
  - Live, lived.
  - live、lived。
- - w
  - 辅音字母 + y：变 y 为 i 加 ed：study → studied
- - s
  - Study, studied.
  - study、studied。
- - w
  - 重读闭音节、末尾只有一个辅音字母：双写再加 ed：stop → stopped
- - s
  - Stop, stopped.
  - stop、stopped。
- - w
  - 读音：清辅音后读 /t/（washed）；浊辅音和元音后读 /d/（played）；t、d 后读 /ɪd/（wanted）
- - s
  - I washed my hands. She played the piano. We wanted a cake.
  - 我洗了手。她弹了钢琴。我们想要一个蛋糕。
  - ed
- - w
  - 💡 为什么这样读？清配清、浊配浊，嘴巴最省力——见「第一性原理 · 经济原则」
- - w
  - 常错：stoped ✗ → stopped ✓；studyed ✗ → studied ✓
- - w
  - 🗣️ 语境实证：Yesterday I cleaned my room and washed my clothes.
- - w
  - 🎵 口诀：一般过去表从前，规则动词加 ed；有 e 直接加个 d（lived），辅音加 y 变 i
- - w
  - G21 第1幕
- - s
  - Yesterday I cleaned my room and washed my clothes.
  - 昨天我打扫了房间，洗了衣服。
- - n
  - 🎵 口诀：一般过去表从前，规则动词加 ed；有 e 直接加个 d（lived），辅音加 y 变 ied（studied），辅元辅要双写加 ed（stopped）！
facts:
  objects:
    - { name: "例句 I washed my hands. She played the piano. We wanted a cake.", kind: "例句", states: "三句同组呈现 -ed 例句：washed、played、wanted 三个规则过去式在场" }
    - { name: "-ed 四条加法", kind: "规则", states: "一般加 ed（play 变 played）；不发音的 e 结尾加 d（live 变 lived）；辅音字母加 y 变 y 为 i 加 ed（study 变 studied）；重读闭音节双写再加 ed（stop 变 stopped）" }
    - { name: "例句 Yesterday I cleaned my room and washed my clothes.", kind: "例句", states: "语境实证句：Yesterday 标志过去，cleaned 与 washed 均为规则动词过去式" }
  invariants:
    - "规则动词的过去式加 -ed 恒分四路：一般直接加、以 e 结尾加 -d、辅音加 y 变 i 加 -ed、重读闭音节双写尾字母加 -ed（g21-ed）"
    - "-ed 发音恒分三读：清辅音后读 /t/，浊辅音和元音后读 /d/，/t/、/d/ 后读 /ɪd/（g21-ed）"
    - "常错订正恒定：stoped 须作 stopped，studyed 须作 studied（本幕判据：常错卡）"
    - "边界：-ed 只管规则动词，高频老词的不规则变法在 G22，不要拿 -ed 去套它们（g21-ed 的 boundary）"
