title: 🧱 五大基本句型 · ⑤ SVOC 魔法赋能型 · 第 2 节
items:
- - n
  - 形容词作宾补：make / keep + 宾语 + 形容词，不能写成 -ly 的 happily。
- - w
  - makes me happily
- - s
  - Happily, ly. They play happily.
  - 快乐地（-ly 副词）。他们玩得很开心。
  - happily ly
- - n
  - 使役动词：make、let、have，意思是「让某人做某事」。后面的动词要脱掉 to。
- - w
  - Our teacher asks us to read aloud, and she lets us play games!
- - s
  - Our teacher asks us to read aloud, and she lets us play games!
  - 老师让我们大声朗读，还让我们玩游戏！
- - w
  - V
- - w
  - O
- - w
  - OC
- - w
  - V
- - w
  - O
- - w
  - OC
- - s
  - Our teacher asks us to read aloud, and she lets us play games!
  - 老师让我们大声朗读，还让我们玩游戏！
  - Our teacher asks to read aloud she lets play games ask us to read
- - n
  - 动词原形：动词本来的样子，不加 to、-s、-ed、-ing，比如 play、laugh。
- - s
  - Played, playing. Ed, ing.
  - 玩了、正在玩。-ed、-ing。
  - ed ing
