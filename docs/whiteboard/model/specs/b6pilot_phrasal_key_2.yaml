  - 我们来编个故事吧！
  - make up story
- - s
  - Mum and I make a cake.
  - 妈妈和我做蛋糕。
  - make a cake mum
- - n
  - 组合区：下面的「🎬 组合区」有 6 个动词 × 6 个方向 = 36 个动画：take、put、get、turn、look、give 配 on、off、up、down、in、out，点一下就演给你看。
