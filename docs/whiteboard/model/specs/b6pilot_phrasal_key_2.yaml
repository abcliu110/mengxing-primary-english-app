- - s
  - Take, put, get, turn, look, give. On, off, up, down, in, out.
  - 拿、放、得到、转、看、给。贴上、离开、向上、向下、向里、向外。
  - take put get turn look give in
- - w
  - 👇 点页签上方「🎬 组合区」试试！
- - n
  - 预测：put 是「放」，out 是「向外」——消防员 put out the fire 是在做什么？先想 3 秒！
