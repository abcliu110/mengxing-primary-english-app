- - n
  - take：核心画面是「抓住、拿走」。
- - w
  - take ✋ 拿走
- - w
  - take off 脱下；起飞 · take out 拿出来
- - n
  - put：核心画面是「放到某个位置」。
- - w
  - put 🫳 放到位置
- - w
  - put on 穿上 · put down 放下 · put away 收起来
- - s
  - Take out your book. The plane takes off.
  - 把书拿出来。飞机起飞了。
  - take out take off plane takes off
- - s
  - Put down your bag. Put away your toys. Put on your hat.
  - 放下书包。把玩具收起来。戴上帽子。
  - put down put away put on bag toys hat
- - n
  - get：核心画面是「进入一个新位置或新状态」。
- - w
  - get 🧲 进入新位置 / 新状态
- - w
  - get up 起床 · get on 上车 · get off 下车 · get back 回来
- - s
  - I get up at seven.
  - 我七点起床。
  - get up seven
- - s
  - Get on the bus. Get off the bus. I get back home at five.
  - 上公交车。下公交车。我五点回到家。
  - get on get off get back bus home five
- - w
  - get + 方向 = 让自己「到」那个方向去
- - n
  - make：核心画面是「做出来、让东西出现」。
- - w
  - make 🛠 做出来
- - w
  - make up a story 编故事 · make a cake 做蛋糕
- - n
  - ✂️ 注意：make up 还有「化妆」「和好」等意思，小学先记「编出来」。
- - w
  - ✂️ 简化
- - s
