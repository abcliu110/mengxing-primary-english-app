  invariants:
    - "can 后面动词用原形，谁来都不变：can 表能力（会、能）或许可（可以），不随主语变化，后面紧接动词原形；否定直接变 can't，疑问把 Can 提到句首（g26-can）"
    - "『保护伞』只类比『后接原形』这一条；can 的过去式 could 的用法留待后续，不在此推（g26-can 的 boundary）"
    - "本幕常错：He can swims 与 Can you to swim 均为错式，can 后不加 s、不加 to（本幕判据）"
