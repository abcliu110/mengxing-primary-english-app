title: 🤖 构词剧场 ③ 后缀转换词性套装
items:
- - w
  - 构词法三大原理
- - w
  - 英语单词像乐高积木：① 合成词(1+1合体) ② 前缀(戴头顶改方向/正反) ③ 后缀(挂词尾换词性)！
- - w
  - 看中央实验台：理解词根词缀如何让词汇量翻 5 倍！
- - w
  - 🎨 机制 3：后缀挂词尾 —— 自由切换名词/形容词/副词衣服
- - w
  - 🌱 词根 care (关心) 的四件词性衣服：
- - w
  - +ful ➔ careful (adj.细心的) ｜ +less ➔ careless (adj.粗心的) ｜ +fully ➔ carefully (adv.)
- - s
  - Careful, careless, carefully.
  - careful、careless、carefully。
  - care ful less fully ly
- - w
  - 🎨 高频词性后缀：动词+er/or=人(teacher/doctor) ｜ 天气名词+y=形容词(sunny/rainy)
- - s
  - Teacher, doctor, sunny, rainy.
  - teacher、doctor、sunny、rainy。
- - w
  - ⚠️ 防坑特例：形容词+ly=副词(slowly)，但【名词+ly=形容词(friendly 友好的 / lovely 可爱的)】！
- - s
  - Slowly, friendly, lovely.
  - slowly、friendly、lovely。
- - w
  - 构词第3幕
- - s
  - sunflower, unhappy, careful, carefully, friendly
  - 构词法公式：前缀改变词义方向，后缀决定词性角色！
facts:
  objects:
    - { name: "词根 care（关心）", kind: "单词", states: "本幕词根主例：加 -ful 变 careful 细心的、加 -less 变 careless 粗心的、加 -fully 变 carefully，三件后缀衣服加词根共四形" }
    - { name: "人称后缀 -er / -or", kind: "规则", states: "动词加 -er 或 -or 表人：teacher、doctor（本幕台词）" }
    - { name: "形容词后缀 -y", kind: "规则", states: "天气名词加 -y 变形容词：sunny、rainy（本幕台词）" }
    - { name: "friendly（友好的）", kind: "单词", states: "本幕防坑特例：名词加 -ly 得形容词 friendly，同类 lovely 可爱的；与形容词加 -ly 得副词 slowly 对照" }
  invariants:
    - "后缀挂词尾切换词性角色，前缀只改词义方向（本幕判据；收尾原话『前缀改变词义方向，后缀决定词性角色』）"
    - "名词加 -ly 是形容词不是副词：friendly 与 lovely 不得当副词用（本幕防坑判据；模型同源旁证 g12-adverb-form 的失效边界明示 friendly 等 -ly 词是形容词）"
    - "形容词加 -ly 才是常例副词造法：slowly（本幕台词；模型同源主张 g12-adverb-form）"
