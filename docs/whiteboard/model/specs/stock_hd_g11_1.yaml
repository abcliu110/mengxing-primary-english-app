    - { name: "形容词定语位置", kind: "规则", states: "修饰普通名词放在前面（a red apple）；修饰 something / anything / nothing 必须放在后面（something new）（本幕核心结构规律①）" }
    - { name: "系动词搭桥表", kind: "词表", states: "be 与五大感官系动词 look / sound / smell / taste / feel 后接形容词作表语（本幕进阶要点②）" }
  invariants:
    - "形容词作定语放在名词前面，但修饰 something、anything、nothing 时放在后面；作表语不能单独连主语，必须由 be 或感官系动词搭桥（g11-adj-position）"
