# for 只从 spacetime.yaml 的 sp-cl-for 组装（三站：为了谁 / 奔着哪儿 / 持续多久）；
# 旧「for 心里想着它」一支联想按 superseded 与 scene_fixes sf-021/sf-022 废止，讲解句用 sf-022 定稿句；
