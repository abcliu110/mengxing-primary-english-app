# 边界入词：change for 交换、vote for 支持不在三站内，后续再扩（sp-xc-for-other）；
# 旧幕 look 三兄弟段删除：look for / wait for 不在模型三站内，旧幕以其充当 for 的唯一图景，与三站口径冲突（见 T11d.done）。
