  invariants:
    - "切分不产生新的整只：一个苹果只能得到两半"
    - "-s 只落在单位/容器词（pieces / bowls / cups）上，永不落在物质词上"
    - "计数徽章只由容器产生；物质本身无徽章"
    - "先借单位，后计数（因果顺序）"
