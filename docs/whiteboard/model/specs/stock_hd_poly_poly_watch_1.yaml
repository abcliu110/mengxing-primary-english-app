  objects:
    - { name: "目标词 watch /wɑːtʃ/", kind: "单词", states: "总卡义项清单：【v./n.】观看，注视（电视、比赛等动态画面）/ 手表；本幕为多义第1幕，立本义『观看，注视』" }
    - { name: "义项①：观看，注视", kind: "义项", states: "本义具象：v. 观看，注视（电视、比赛等动态画面）；台词另举 watch a game 为动态画面搭配" }
    - { name: "例句 We watch TV on Sunday.", kind: "例句", states: "本幕锚例句：watch 取本义『观看』，对应第一幕【核心本义·专注注视】" }
    - { name: "义项③：手表", kind: "义项", states: "引申新义（台词讲法）：n. 手表（戴在手腕上随时『看』时间的工具）；本幕仅在总卡与路线图并列列名，例句 My father has a new watch. 已亮相但未作本幕讲解锚，展开在第3幕；该讲法已被模型裁定订正，见 invariants" }
  invariants:
    - "两义项在本幕台词中由纽带『持续专注地盯着看』贯连（本幕台词自述纽带）；但其中手表一链的贯连讲法不成立，见下条裁定"
    - "本幕台词把手表义讲成『随时看时间的工具』，与模型裁定冲突：手表义须经『守夜』中转，不得由『注视观看』直接引申（vocab_fixes.yaml VF-001、VF-002；frameworks_fixes.yaml T07）"
    - "裁定后的正确链条恒为：watch 最早是『守夜、保持清醒』，最早的手表是能把人叫醒的小闹钟，它替你『守夜』故继承 watch 之名，后来越做越小戴上手腕（vocab_fixes.yaml VF-001 corrected）"
