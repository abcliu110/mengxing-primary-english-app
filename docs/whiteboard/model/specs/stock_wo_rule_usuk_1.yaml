title: 🔬 规律 15 · 英式和美式拼写为什么不一样
items:
- - n
  - colour 和 color、centre 和 center，都对，只是英国和美国的写法不同。
- - w
  - 🔬 规律 15：英式拼写 ↔ 美式拼写
- - w
  - 📜 有出处 ⚠️ 两种都对
- - w
  - colour（英）↔ color（美）
- - s
  - Colour, color.
  - colour（英）、color（美）。
- - w
  - centre（英）↔ center（美）
- - s
  - Centre, center.
  - centre（英）、center（美）。
- - s
  - What color is it?
  - 它是什么颜色？
  - color
- - n
  - 美国的写法很多来自词典编者诺亚·韦伯斯特：他主张改革拼写，美国的写法就这样固定下来。英国的标准则跟着约翰逊 1755 年的词典走。
- - w
  - 美式：韦伯斯特的词典 ｜ 英式：约翰逊 1755 年的词典
- - n
  - 考试时跟着课本用一种，别混着写。
- - w
  - ⚠️ 一篇文章里只用一种
- - n
  - 出处：Wiktionary 列了两种拼写；历史见 Wikipedia「American and British English spelling differences」。
- - w
  - 出处：Wiktionary · Wikipedia
