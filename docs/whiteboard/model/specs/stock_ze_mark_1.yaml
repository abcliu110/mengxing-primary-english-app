    - { name: "go / went", kind: "单词", states: "本幕对照：go 的过去式为 went；例句 I went to school yesterday." }
    - { name: "like / likes", kind: "单词", states: "本幕对照：She likes cats. 中三单动词 like 加 -s，与 I like cats. 对照" }
