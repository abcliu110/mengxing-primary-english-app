title: 💬 交际句型地图 · ① 礼貌阶梯
items:
- - n
  - 这一幕：同一件事，英语可以说得很直接，也可以说得很客气。我们爬一爬「礼貌阶梯」。
- - w
  - 礼貌阶梯：从直接到客气
- - w
  - ✂️ 简化说法
- - n
  - 第一级：直接下命令。对很熟的家人可以，对别人会显得没礼貌。
- - w
  - ① 命令：Give me ...
- - s
  - Give me the pen.
  - 把笔给我。
  - give
- - n
  - 第二级：加上 please，马上客气一点。
- - w
  - ② 加 please
- - s
  - Please give me the pen.
  - 请把笔给我。
  - please
- - n
  - 第三级：改成问句，让对方可以说「不」。
- - w
  - ③ Can you ...?
- - s
  - Can you give me the pen?
  - 你能把笔给我吗？
  - can
- - n
  - 第四级：用 could。could 是 can 的过去式，「往后退一步」就更客气。
- - w
  - ④ Could you ..., please?
- - s
  - Could you give me the pen, please?
  - 您能把笔给我吗？
  - could
- - n
  - 第五级：Would you mind ...? 意思是「您介意……吗」，最客气。
- - w
  - ⑤ Would you mind ...ing?
- - s
  - Would you mind giving me the pen?
  - 您介意把笔给我吗？
  - mind
- - n
  - 要小心：别人问 Would you mind，你愿意帮忙，要说「不介意」：Not at all.
- - w
  - ⚠️ 答应要说 Not at all.（不介意）
- - s
  - Not at all.
  - 一点也不介意。
  - not
- - n
  - 再分清两个小词：打扰别人之前说 Excuse me，做错事之后说 Sorry。
- - w
  - 打扰之前：Excuse me 做错之后：Sorry
- - s
  - Excuse me, can I sit here?
  - 打扰一下，我可以坐这儿吗？
  - excuse
- - s
  - Sorry, I am late.
  - 对不起，我迟到了。
  - sorry
- - n
  - 口诀：命令最直接，please 软一点；can 变 could 更礼貌，would you mind 最客气。
- - w
  - 🎵 命令最直接，please 软一点；
- - w
  - can 变 could 更礼貌，
- - w
  - would you mind 最客气！
facts:
  objects:
    - { name: "例句 Give me the pen. 的五级变体", kind: "例句", states: "同一请求逐级变客气：Give me the pen. → Please give me the pen. → Can you give me the pen? → Could you give me the pen, please? → Would you mind giving me the pen?" }
    - { name: "例句 Not at all.", kind: "例句", states: "回应 Would you mind 提问：愿意帮忙时答此句，义为一点也不介意" }
    - { name: "Excuse me 与 Sorry 对照例句", kind: "例句", states: "打扰之前用 Excuse me：Excuse me, can I sit here?；做错事之后用 Sorry：Sorry, I am late." }
  invariants:
    - "礼貌阶梯顺序恒定：命令最直接，please 软一点，can 变 could 更礼貌，would you mind 最客气（本幕口诀）"
    - "could 在本幕讲为 can 的过去式、以『往后退一步』使请求更客气（本幕判据）"
    - "对 Would you mind 的提问，愿意帮忙须答『不介意』：Not at all.，不能按字面答错方向（本幕⚠️判据）"
    - "Excuse me 用在事前打扰、Sorry 用在事后做错（本幕判据；模型同源记录 expressions_fixes EXP_005：事前打扰问路用 Excuse me、事后做错道歉用 I'm sorry）"
