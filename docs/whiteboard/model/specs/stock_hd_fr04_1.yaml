    - { name: "穿戴变化小剧场（Wearing & Dressing）", kind: "框架", states: "本幕所属框架：同一客观事件，切换主语视角即切换动词；本幕为视角 1" }
    - { name: "put on（穿上的瞬间动作）", kind: "语法对象", states: "本幕定义为从没穿到动手往身上套的瞬间动作，台词自注三秒完成；公式为 Wearer + put on + Clothing" }
  invariants:
    - "put on 只管穿上的动作瞬间，不管穿好之后持续的状态：状态一侧由 wear 承担（本幕判据；与 stock_hd_fr04_2 对照）"
    - "put on 与 take off 互为反义一对：穿上与脱下同为瞬间动作，方向相反（本幕家族判据；stock_hd_fr04_3 台词自述 take off 是 put on 的反义词）"
    - "put on 的公式恒为 Wearer + put on + Clothing：穿的动作必须带出所穿衣物（本幕判据公式）"
