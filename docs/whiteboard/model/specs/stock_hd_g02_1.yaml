  - 两个男人和三个女人在公园里。
- - n
  - 🎵 口诀：男女脚牙鹅变 e（man→men, foot→feet, tooth→teeth）；老鼠 mouse 变 mice；孩子 child 变 children；绵羊
    sheep 小鹿 deer 小鱼 fish 单复数长一样！
