  - G02 底层原理
- - w
  - 名词不规则复数变形记 (children / feet / sheep) —— 不按常理加 s 的 8 个高频“变身小精灵”
- - w
  - 【为什么这几个词不加 -s？】
- - w
  - 它们是古英语里每天挂在嘴边的最高频词（人、孩子、脚、牙、羊、鱼、老鼠），保留了古老的“内部元音变音”或“原形不变”习惯，加了 s 反而算错！
- - w
  - 🔬 G02 · 名词不规则复数变形记 (children / feet / sheep) 底层结构拆解与汉英思维对比
- - w
  - ① 典型语境：Two men and three women are in the park.
- - w
  - 两个男人和三个女人在公园里。五个孩子正在洗脚、刷牙。看！十只白绵羊和六条鱼！
- - w
  - ② 核心结构规律：① 元音大变身：man ➔ men, woman ➔ women (/ˈwɪmɪn/), foot ➔ feet, tooth ➔ teeth,
    goose ➔ geese
- - w
  - ③ 进阶要点：② 特殊变形：child（孩子）➔ children, mouse（老鼠）➔ mice
