- - w
  - ⑤ 感叹句
- - n
  - 感叹句：表达「多么……啊！」的句子，句末用感叹号。
- - w
  - What beautiful photos she is taking! / How happy she is!
- - s
  - What beautiful photos she is taking!
  - 她拍的照片多漂亮啊！
- - n
  - What 和 How：感叹名词（photos）用 What 开头；感叹形容词（happy）用 How 开头。
- - w
  - What + 形容词 + 名词 + 主谓！   How + 形容词 + 主谓！
