    - { name: "不及物动词词表", kind: "词表", states: "本幕点名 rise / fly / sleep / run / smile：主语自己就能完成的动作，后面不用接对象；锚例句 Babies sleep. 与 Kids run and smile." }
    - { name: "例句 Birds fly happily in the blue sky.", kind: "例句", states: "本幕金句：Birds fly 是骨架，happily 是副词挂件，in the blue sky 是地点挂件，后面的部分全是挂件" }
    - { name: "例句 Please listen to the teacher and look at the blackboard!", kind: "例句", states: "本幕挂钩例：listen 与 look 是不及物动词，靠介词钩 to、at 接上对象" }
  invariants:
    - "不及物动词恒不能直接接宾语：想接对象，先在动词后挂介词钩 to、at、for、with 等（本幕判据）"
    - "挂件不改变骨架：副词挂件与地点挂件增删后，骨架仍是主语 + 不及物动词（本幕台词）"
