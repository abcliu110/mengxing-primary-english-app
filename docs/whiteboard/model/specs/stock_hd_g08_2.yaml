title: 📘 G08 底层原理 · 第2幕
items:
- - w
  - G08 底层原理
- - w
  - 形容词性物主代词 vs 名词性物主代词 (my vs mine) —— my 是“粘人精”（后面必带名词），mine 是“独行侠”（自带名词光环）！
- - w
  - 【为什么有了 my 还要发明 mine？】为了避免啰嗦重复！
- - w
  - 当别人问 Whose book is this? 直接把 my book 合体浓缩成一个词 mine（我的书），既简洁又有力！
- - s
  - Whose book is this? It is my book.
  - 这是谁的书？是我的书。
- - w
  - 🔬 深度机制 2：『形物代 + 名词 = 名词性物主代词』吞噬合体实验
- - w
  - 💎 mine / hers (名物代词)
- - w
  - 已把 book 吞进肚里，后面绝不再接名词！
- - w
  - 📐 黄金等式：my + book = mine ｜ your + pen = yours ｜ her + bag = hers
- - s
  - My book is mine. Your pen is yours. Her bag is hers.
  - 我的书是我的。你的钢笔是你的。她的包是她的。
- - w
  - 做题口诀：空格后有名词选 my/your/her；空格后无名词选 mine/yours/hers！
- - w
  - my / her (形物)
- - w
  - 带钩子，必接名词
