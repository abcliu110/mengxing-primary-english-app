scene: gen_stock_oral_func_2
template: oral_func_2.js
title: 💬 交际句型地图 · ② 五大交际功能
items:
- - n
  - 这一幕：生活里最常用的五件事，每件只要记三句核心句型。
- - w
  - 五大交际功能 · 每个三句
- - n
  - 第一件：问路。先说 Excuse me，再问在哪儿、怎么走。
- - w
  - 🧭 问路
- - s
  - Excuse me, where is the library?
  - 打扰一下，图书馆在哪儿？
  - where
- - s
  - How can I get to the zoo?
  - 我怎么去动物园？
  - how
- - s
  - Go straight and turn left.
  - 一直走，然后左转。
  - turn
- - n
  - 第二件：购物。问价钱、试一试、决定买。
- - w
  - 🛍️ 购物
- - s
  - How much is this T-shirt?
  - 这件 T 恤多少钱？
  - much
- - s
  - Can I try it on?
  - 我可以试穿吗？
  - try
- - s
  - I'll take it.
  - 我买了。
  - take
- - n
  - 第三件：打电话。英语电话里介绍自己说 This is，不说 I am。
- - w
  - 📞 打电话 ⚠️ 说 This is ...
- - s
  - Hello, this is Amy.
  - 你好，我是埃米。
  - this
- - s
  - May I speak to Tom, please?
  - 请问汤姆在吗？
  - speak
- - s
  - Hold on, please.
  - 请稍等。
  - hold
- - n
  - 第四件：请求许可。用 May I 或 Can I，回答 Sure。
- - w
  - 🙋 请求许可
- - s
  - May I come in?
  - 我可以进来吗？
  - may
- - s
  - Can I use your pencil?
  - 我可以用你的铅笔吗？
  - use
- - s
  - Sure, go ahead.
  - 当然，用吧。
  - sure
- - n
  - 第五件：道歉和回应。别人道歉，你可以说 That's OK 或 Never mind。
- - w
  - 🙇 道歉与回应
- - s
  - I'm sorry I'm late.
  - 对不起，我迟到了。
  - sorry
- - s
  - That's OK.
  - 没关系。
  - OK
- - s
  - Never mind.
  - 别在意。
  - never
- - n
  - 记住：每件事都从礼貌的一句开始，Excuse me、May I、Could you，都是好帮手。
- - w
  - 💡 先礼貌，再说事
facts:
  objects:
    - { name: "问路三句", kind: "句型", states: "Excuse me, where is the library? 问在哪儿；How can I get to the zoo? 问怎么走；Go straight and turn left. 为指路句" }
    - { name: "购物三句", kind: "句型", states: "How much is this T-shirt? 问价钱；Can I try it on? 问试穿；I'll take it. 为决定买下" }
    - { name: "打电话三句", kind: "句型", states: "Hello, this is Amy. 为电话中介绍自己；May I speak to Tom, please? 为请人听电话；Hold on, please. 为请稍等" }
    - { name: "请求许可三句", kind: "句型", states: "May I come in? 与 Can I use your pencil? 为请求许可；Sure, go ahead. 为应允回答" }
    - { name: "道歉与回应三句", kind: "句型", states: "I'm sorry I'm late. 为道歉；That's OK. 与 Never mind. 为回应道歉" }
  invariants:
    - "本幕结构恒定：生活里最常用的五件事——问路、购物、打电话、请求许可、道歉与回应——每件记三句核心句型（本幕开场判据）"
    - "打电话介绍自己说 This is、不说 I am（本幕⚠️判据）"
    - "每件事都从礼貌的一句开始：Excuse me、May I、Could you 都是开场好帮手（本幕收束判据：先礼貌，再说事）"
    - "购物问价与试穿的角色分工有模型同源记录：顾客问 How much、问 Can I try it on?，店员应允（expressions_fixes ORAL_SCENE_5）"
    - "道歉的回应是 That's OK 一类原谅方的话、问路的事前打扰用 Excuse me、敲门许可说 May I come in?（expressions_fixes EXP_004、EXP_005、EXP_007）"
