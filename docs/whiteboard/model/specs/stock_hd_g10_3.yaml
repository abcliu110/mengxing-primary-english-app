title: 📘 G10 底层原理 · 第3幕
items:
- - w
  - G10 底层原理
- - w
  - 不定代词 some 与 any 的地盘分工 —— some 住肯定句和热情邀请屋；any 住否定句和普通疑问屋！
- - w
  - 【为什么疑问句和否定句要把 some 换成 any？】some 默认“肯定有这么一些”；而在疑问或否定句里换上表示“任何一点”的 any！
- - w
  - 但如果你端着蛋糕热情邀请别人 Would you like some cake?，你真心希望对方说 Yes，所以保留 some！
- - s
  - Would you like some cake? Yes, please.
  - 你想吃点蛋糕吗？好的，谢谢。
- - w
  - 🔬 黄金特例：邀请、请求的问句仍用 some（盼着对方说 Yes）
- - w
  - 邀请：Would you like some juice?
- - w
  - 请求：Can I have some bread, please?
- - s
  - Would you like some juice? Can I have some bread, please?
  - 你想喝点果汁吗？请问我能吃点面包吗？
- - w
  - 辨析：Can I have some water, Mum?（盼着对方答应，用 some）；Can I have any water, Mum? 语法成立，只是语气中性、疏远，不显期待
- - s
  - Can I have some water, Mum?
  - 妈妈，我能喝点水吗？
- - w
  - 对比：There isn't any milk in the fridge. Would you like some tea instead?
- - s
  - There isn't any milk in the fridge. Would you like some tea instead?
  - 冰箱里没有牛奶了。你想喝点茶吗？
- - w
  - G10 第3幕
- - n
  - 🎵 口诀：some 和 any 都表“一些”，可数复数不可数都能接；肯定句里用 some，否定疑问换 any；唯有邀请和请求（Would you like
    / Can I have），满怀诚意还用 some！
facts:
  objects:
    - { name: "例句 Would you like some juice? Can I have some bread, please?", kind: "例句", states: "邀请问句与请求问句都保留 some，本幕称黄金特例" }
    - { name: "例句 There isn't any milk in the fridge. Would you like some tea instead?", kind: "例句", states: "前半否定句用 any，后半邀请问句用 some，同组对比默认分工与特例" }
    - { name: "例句 Can I have some water, Mum?", kind: "例句", states: "常错句 Can I have any water, Mum? 在本幕被订正为 some；Mum 为台词点名的称呼" }
  invariants:
    - "黄金特例：邀请、请求的问句仍用 some，盼着对方说 Yes（本幕判据）"
    - "请求与邀请问句用 some 是强偏好不是铁律：用 any 并非语法错误，只是语气中性、疏远；不得把 any 版请求句设为改错题的错句（g10-request-some；xc-g10-any-ok）"
    - "默认分工恒为肯定句用 some，否定句与一般疑问句用 any，特例只限邀请与请求问句（g10-basic-split）"
