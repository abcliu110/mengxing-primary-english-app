title: 🔬 规律 4 · 元音递变：sing sang sung
items:
- - n
  - 为什么 sing 的过去式是 sang，过去分词是 sung？这叫元音递变：同一个词根，换一个元音，就换一种时间。
- - w
  - 🔬 规律 4：元音递变（ablaut）· 强动词
- - w
  - 📜 有出处 ⚠️ 只管一部分老动词
- - s
  - I sing a song.
  - 我唱一首歌。
  - sing
- - w
  - sing → sang → sung
- - s
  - Ablaut, sing, sang, sung.
  - 元音递变 ablaut：sing、sang、sung。
- - w
  - song 也是一家人：来自 sing
- - s
  - I can ride a horse.
  - 我会骑马。
  - ride
- - w
  - ride → rode → ridden
- - w
  - 古英语 rīdan → 过去式 rād → 过去分词 riden
- - s
  - Ride, rode, ridden. Rīdan, riden.
  - ride、rode、ridden。古英语 rīdan、riden。
- - n
  - 这类动词叫强动词，是从老祖宗那里传下来的老办法；后来大多数新动词改用加 ed。
- - w
  - ⚠️ 新动词多半加 -ed；换元音的是老动词
- - s
  - New verbs add -ed.
  - 新动词加 -ed。
- - n
  - 出处：sing、song、ride 的来历见 Etymonline 和 Wiktionary；强动词说法见 Wikipedia「Germanic strong
    verb」。
- - w
  - 出处：Etymonline · Wiktionary · Wikipedia
facts:
  objects:
    - { name: "sing", kind: "单词", states: "本幕元音递变链：sing → sang → sung；song 台词称为同一家人、来自 sing；例句 I sing a song." }
    - { name: "ride", kind: "单词", states: "本幕元音递变链：ride → rode → ridden；台词给出古英语链：rīdan → 过去式 rād → 过去分词 riden；例句 I can ride a horse." }
  invariants:
    - "sing → sang 恒属换元音组：高频老词的过去式没有总规律、分组逐个记，换元音是其中一组（grammar.yaml g22-irregular-past 逐字列 sing→sang）"
    - "规则动词过去式加 -ed 与换元音的老动词分工恒定：新动词多半加 -ed，换元音的是老动词（本幕判据；grammar.yaml g21-ed 管规则动词加 -ed，g22-irregular-past 管高频老词的不规则变法）"
