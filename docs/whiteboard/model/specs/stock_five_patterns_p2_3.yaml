- - n
  - 画蛇添足：多此一举。及物动词后面乱加介词，就像给蛇画脚，反而画错了。
- - w
  - 直接接宾语，不加介词：
- - w
  - discuss the plan · marry her · enter the room
- - s
  - Discuss the plan. Marry her. Enter the room.
  - 讨论计划。娶她。进入房间。
  - discuss the plan marry her enter room
- - n
  - 宾语穿制服：两个动词连用时，第二个要换成 to do 或 doing，才能当宾语。
- - w
  - I want to buy a dictionary, and I enjoy reading stories.
- - s
  - I want to buy a dictionary, and I enjoy reading stories.
  - 我想买一本词典，我也喜欢读故事。
