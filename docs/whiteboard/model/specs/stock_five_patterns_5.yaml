facts:
  objects:
    - { name: "例句 Good music makes us happy.", kind: "例句", states: "本幕金句：Good music 是主语，makes 是使役谓语，us 是宾语，happy 是宾补；变式 It makes us relax." }
    - { name: "例句 Reading books makes me clever and keeps my mind open.", kind: "例句", states: "本幕并列两组 SVOC：makes + me + clever 与 keeps + my mind + open" }
    - { name: "宾语补足语 OC（happy / relax 等）", kind: "语法对象", states: "本幕定义：补充说明宾语的状态或动作，简称宾补；宾语 + 宾补连起来像一个小句子，如 us happy" }
  invariants:
    - "SVOC 恒在宾语后加宾补才把话说完：只说 Good music makes us 是话还没说完（本幕开场判据）"
    - "宾补说的是宾语的状态或动作：宾语 + 宾补构成『小主谓』（本幕判据）"
    - "主谓宾补是五大基本句型骨架之一（模型主张 st-cl-five-patterns）"
