title: 🌳 汉英语序对比 · 第2幕 先地点后时间、从小到大、长定语后置
items:
- - w
  - 汉英语序对比
- - w
  - 汉语先铺垫时间地点背景最后出动作；英语先说谁做了什么，地点时间排后面（句尾一般先地点后时间，反过来也对），从小到大！
- - w
  - 看中央实验台：直观观察汉英火车车厢跨轨重组与三大形态铁律！
- - w
  - 🔬 语序铁律 2：时空缩放『从小到大』& 长定语后置（the book on the desk）
- - w
  - 🎯 英语时空从小到大：at 8:00 (小点) ➔ on May 1st (某天) ➔ in 2026 (大年)
- - s
  - It is May 1st.
  - 今天是 5 月 1 日。
- - w
  - 班级年级也是从小到大：Class 2 (小班), Grade 5 (大年级)
- - s
  - I am in Class 2, Grade 5.
  - 我在 5 年级 2 班。
- - w
  - 🔄 介词短语定语后置：汉语说『【桌子上的】书』 ➔ 英语说『the book 【on the desk】』
- - w
  - 先把核心名词 the book 亮出来，再挂介词短语 on the desk！
- - w
  - 语序第2幕
- - s
  - I played football in the park yesterday. Look at the book on the desk.
  - 远离中式英语：先把谁做了什么(SVO)说完，再放地点时间；长定语一律后置！
facts:
  objects:
    - { name: "时间介词从小到大链 at—on—in", kind: "规则", states: "本幕呈现 at 配 8 点钟点、on 配 May 1st 某一天、in 配 2026 大年" }
    - { name: "班级年级序 Class 2, Grade 5", kind: "词表", states: "本幕标注班级与年级也是从小到大：小班 Class 2 在前，大年级 Grade 5 在后" }
    - { name: "例句短语 the book on the desk", kind: "句型", states: "本幕对照汉语桌子上的书：英语先亮核心名词 the book，再挂介词短语 on the desk；结尾例句为 Look at the book on the desk." }
  invariants:
    - "时间介词是空间图式的借用且属倾向：长时段用 in、具体某一天用 on、钟点用 at（模型同源主张 g14-time-borrow）"
    - "借用不是百分百对齐：at night、被某天锁定的 on Sunday morning、英式 at the weekend 等老习惯须单独记（模型同源主张 g14-time-borrow 的例外 xc-g14-at-night、xc-g14-on-morning、xc-g14-at-weekend）"
    - "本幕所讲后置的只是介词短语定语：先亮核心名词，再挂介词短语（本幕判据）；短形容词定语仍在名词之前，不在此后置之列（模型同源主张 g11-adj-position）"
    - "时空与班级年级从小到大排列（本幕判据）"
