  invariants:
    - "疑问句把助动词提到最前面，怎问怎答：有 be 或情态动词就提它们，没有就请 Do、Does、Did 站句首，实义动词随之恢复原形；简短回答与问句用同一个助动词，答句主语用人称代词（g30-yesno）"
    - "一、二人称互换（I、we ↔ you）（g30-yesno）"
    - "本条讲的是陈述句变一般疑问句的常规变法；答句主语用代词是为避免重复原名词，不延伸到其他句型（g30-yesno 的 boundary）"
    - "本幕常错：Do you are 与 Does she likes 均为错式（本幕判据）"
