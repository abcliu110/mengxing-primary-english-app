title: 📘 G30 底层原理
items:
- - w
  - G30 底层原理
- - w
  - 一般疑问句与“怎问怎答”铁律 —— 用 Yes / No 回答的问句：谁打头提问，就用谁收尾回答！
- - w
  - 【英语一般疑问句为什么要把助动词/be动词提到最前面？】
- - w
  - 英语采用“句首信号灯倒装法”——一开口先把 Is / Are / Can / Do / Does / Did 亮在句首第一个词，听话人立刻知道这是一个需要回答
    Yes 或 No 的问题！
- - w
  - 🔬 句首信号灯：把 be / can / do 提到最前面
- - w
  - 有 be 提 be：You are from China. → Are you from China?
- - w
  - 有 can 提 can：He can swim. → Can he swim?
- - s
  - Can he swim?
  - 他会游泳吗？
- - w
  - 都没有就请 do / does / did：She likes cats. → Does she like cats?
- - s
  - Did she like cats? Yes, she did.
  - 她喜欢猫吗？是的，她喜欢。
- - s
  - Does she like cats? Yes, she does.
  - 她喜欢猫吗？是的，她喜欢。
- - w
  - 怎问怎答：Can he swim? — Yes, he can. / No, he can't.
- - s
  - Can he swim? Yes, he can. No, he can't.
  - 他会游泳吗？是的，他会。不，他不会。
- - w
  - 常错：Do you are...? ✗；Does she likes...? ✗
- - w
  - 🗣️ 语境实证：— Are you from China? — Yes, I am.
- - w
  - 🎵 口诀：一般疑问不用“吗”，句首信号提前挂：有 be 提 be，有 can 提 can，实义动词
- - w
  - G30 第1幕
- - s
  - — Are you from China? — Yes, I am.
  - — 你来自中国吗？— 是的。
- - n
  - 🎵 口诀：一般疑问不用“吗”，句首信号提前挂：有 be 提 be，有 can 提 can，实义动词借 Do/Does/Did 站排头！一二人称要互换，谁问就用谁回答！
