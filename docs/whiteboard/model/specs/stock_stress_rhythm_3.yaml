title: 🎯 重音与弱读 · 3
items:
- - n
  - 为什么老外说话像「吞字」，听不清？秘密在节拍和弱读！
- - w
  - 重音与弱读
- - w
  - 法则 C  弱读 /ə/ 与连读
- - n
  - 节拍：说话的轻重快慢，像音乐里的鼓点。汉语和英语的节拍不一样。
- - w
  - 汉语：音节计时
- - w
  - 我
- - w
  - 会
- - w
  - 游
- - w
  - 泳
- - n
  - 音节计时语言：每个字用力一样，像机关枪：哒、哒、哒、哒。
- - w
  - 像机关枪：哒哒哒哒，每个字一样用力
- - w
  - 英语：重音计时
- - w
  - I
- - w
  - kən
- - w
  - ˈSWIM
- - n
  - 重音计时语言：重要的词读得又响又长，中间的小词飞快带过，像打鼓：咚—嗒—咚。
- - w
  - 像打鼓：重的拉长，轻的一带而过
- - n
  - 实词 / 虚词：实词是有实在意思的词（swim、tea）；虚词是小帮手（to、of、can）。
- - w
  - /ə/
- - w
  - 懒元音 Schwa：嘴巴放松，轻轻「呃」一下
- - s
  - Schwa is a lazy vowel.
  - schwa 是个懒元音。
  - schwa
- - w
  - to · for · of · and · can 这些虚词，常常压成 /ə/
- - s
  - To, for, of, and, can.
  - to、for、of、and、can。
  - to for of and can
- - n
  - 弱读 /ə/：虚词读得又轻又短，元音变成懒洋洋的 /ə/，这就是弱读。
- - n
  - 肯定句 / 否定句：肯定句说「会、是」；否定句带 not，说「不会、不是」。
- - w
  - can /kən/ vs can't /ˈkɑːnt/
- - w
  - I kən ˈSWIM.  vs  I ˈKɑːNT ˈSWIM.
- - n
  - can 弱读：肯定句里 can 轻读成 /kən/，重音给 swim；can't 要重读、张大嘴！
- - w
  - can 很轻 = 会游；can't 重读张大嘴 = 不会游
- - s
  - I can swim. I can't swim.
  - 我会游泳。我不会游泳。
  - can swim can't
- - n
  - of 弱读：a cup of tea 里 of 只剩一个 /ə/，连起来听像 cuppa tea。
- - w
  - of ➔ /ə/
- - w
  - a cup of tea ➔ cuppa tea
- - w
  - lots of ➔ /ˈlɒtsə/ ｜ kind of ➔ /ˈkaɪndə/
- - s
  - A cup of tea. A cuppa tea.
  - 一杯茶。一杯茶（口语）。
- - s
  - Lots of cups, kind of sweet.
  - 很多杯子，有点甜。
- - n
  - 缩读：口语里几个词缩成一个：want to → wanna，going to → gonna。
- - w
  - to ➔ /tə/ · wanna · gonna
- - w
  - want to ➔ wanna ｜ going to ➔ gonna
- - w
  - I'm gonna (going to) visit my grandpa tomorrow.
- - s
  - I want to visit my grandpa. I wanna visit my grandpa.
  - 我想去看望爷爷。我想去看望爷爷（口语）。
- - s
  - I'm going to visit my grandpa tomorrow. I'm gonna visit my grandpa tomorrow.
  - 我明天要去看望爷爷。我明天要去看望爷爷（口语）。
- - n
  - 连读：前一个词的尾巴是辅音，后一个词以元音开头，就粘成一个音节读。
- - w
  - 辅音 + 元音  丝滑连读
- - w
  - look at it ➔ /ˈlʊ-kæ-tɪt/
- - w
  - put it on ➔ /ˈpʊ-tɪ-tɒn/ ｜ an apple ➔ /ə-ˈnæ-pl/
