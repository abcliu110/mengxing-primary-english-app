  - Put it on.
  - 把它穿上。
- - s
  - An apple.
  - 一个苹果。
- - n
  - 看橙色小桥：k 粘上 a，t 粘上 i，look at it 读成一口气。
- - n
  - 最后读一读：每个词都和后面的元音粘在一起！
- - w
  - Look at it (/lʊ-kæ-tɪt/)! Pick it up (/pɪ-kɪ-tʌp/)!
- - w
  - 看它！把它捡起来！  实词重读拉长，虚词弱读成 /ə/，辅音元音粘一起。
- - s
  - Look at it! Pick it up!
  - 看它！把它捡起来！
  - look at it
- - n
  - 口诀：重的拉长像打鼓，轻的变 /ə/ 一带过，辅音元音手拉手。
