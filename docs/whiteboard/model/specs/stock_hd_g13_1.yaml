  - 基数词与序数词变形黄金口诀 (one→first, twelve→twelfth) —— 基数词表“有几个”，序数词表“第几个”（前面常戴 the 小帽）
- - w
  - 【为什么楼层、日期、生日要用序数词？】
- - w
  - 因为一月一日、三楼、第十二个生日都是排在序列里的“第1、第3、第12个位置”，所以必须用序数词（the first / the third / the twelfth）！
- - w
  - 🔬 G13 · 基数词与序数词变形黄金口诀 (one→first, twelve→twelfth) 底层结构拆解与汉英思维对比
- - w
  - ① 典型语境：There are twelve months in a year, and December is the twelfth month.
- - w
  - 一年有十二个月，十二月是第十二个月。我们的美术室在三楼。今天是十月二十一日。
- - w
  - ② 核心结构规律：① 1~3 独立变形：one ➔ first (1st), two ➔ second (2nd), three ➔ third (3rd)
- - w
  - ③ 进阶要点：② 易错四大金刚：five ➔ fifth, eight ➔ eighth, nine ➔ ninth（去e！）, twelve ➔ twelfth（ve变f！）
