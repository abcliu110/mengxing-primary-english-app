  - There are twelve months in a year, and December is the twelfth month.
  - 一年有十二个月，十二月是第十二个月。
- - n
  - 🎵 口诀：基变序，有规律：一二三特殊记（first/second/third）；八去t（eighth），九去e（ninth）；ve要用f替（fifth/twelfth）；整十y变ie再加th（twentieth）；若是遇到几十几，只变个位就可以（twenty-first）！
