title: 🔬 规律 9 · 农场里的动物，餐桌上的肉
items:
- - n
  - 英语里活的动物和它的肉，常常是两个词：动物用古英语留下来的词，肉用从法语借来的词。
- - w
  - 🔬 规律 9：本族词 ↔ 法语借词（两层词汇）
- - w
  - 📜 有出处 ⚠️ 不是每种动物都这样
- - w
  - cow ← 古英语 cū ｜ beef ← 古法语 buef（牛）
- - w
  - sheep ← 古英语 scēap ｜ mutton ← 古法语 moton（羊）
- - w
  - pig ｜ pork ← 古法语 porc（猪）
- - s
  - We eat beef and pork.
  - 我们吃牛肉和猪肉。
  - beef
- - n
  - 有意思的是：在法语里，这些词原本就是动物本身；到了英语里，才专门指肉。
- - w
  - 💡 法语里是动物，英语里变成了肉
- - n
  - 日常的问话也有两层：ask 是本族词，question 来自拉丁语 quaerere。
- - w
  - ask（本族词）↔ question（拉丁语 quaerere）
- - n
