title: 📘 G08 底层原理 · 第1幕
items:
- - w
  - G08 底层原理
- - w
  - 形容词性物主代词 vs 名词性物主代词 (my vs mine) —— my 是“粘人精”（后面必带名词），mine 是“独行侠”（自带名词光环）！
- - w
  - 【为什么有了 my 还要发明 mine？】为了避免啰嗦重复！
- - w
  - 当别人问 Whose book is this? 直接把 my book 合体浓缩成一个词 mine（我的书），既简洁又有力！
- - s
  - Whose book is this? It is my book.
  - 这是谁的书？是我的书。
- - w
  - 🔬 粘人精 vs 独行侠
- - w
  - 粘人精 my / your / her / our / their：后面必须跟名词
- - w
  - 独行侠 mine / yours / hers / ours / theirs：后面不再接名词
- - s
  - My book, your book, her book, our book, their book.
  - 我的书、你的书、她的书、我们的书、他们的书。
- - s
  - Mine, yours, hers, ours, theirs.
  - 我的、你的、她的、我们的、他们的。
- - w
  - 对比：This is my bag. ｜ That red one is yours (= your bag).
- - s
  - This is my bag. That red one is yours.
  - 这是我的包。那个红色的是你的。
- - w
  - 对比：Her dress is blue, and mine (= my dress) is yellow.
- - s
  - Her dress is blue, and mine is yellow.
  - 她的连衣裙是蓝色的，我的是黄色的。
- - w
  - G08 第1幕
- - n
  - 🎵 口诀：形物代(my/your/her/our/their)是粘人精，后面必须跟名词；名物代(mine/yours/hers/ours/theirs)是独行侠，句尾单干不带名！牢记公式：形物代
    + 名词 = 名物代！
