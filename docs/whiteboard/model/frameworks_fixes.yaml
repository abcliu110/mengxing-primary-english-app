    fixed: 分层重标：词族押韵（真）——what / that 押 -at 词尾，词干仍是两家（hw- 问词家族 vs þ- 指示家族，框架见 ROYAL T05-accurate）；「wh-提问 ➔ th-回答」的变身式箭头删除，避免读成构词律。答语搭档义（问什么→用 that 指答）归入功能配对理解。
    fix_type: 分层标注
    source: 报告概念层 C-2、C-6（与 T05 同一伪构词律问题在 RADAR 侧的投影）

