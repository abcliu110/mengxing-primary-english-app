    field: badge + essence
    original: badge「⚖️ 状态天平型 · 绝不用副词」；essence「⚠️ 铁律：系动词后面永远接**形容词**说明主语的状态，绝不能接 `-ly` 副词！」（而同条 formula 自列名词/介词短语亦可作表语，自相矛盾）
    fixed: badge 改「⚖️ 状态天平型 · 表语多用形容词」；essence 的铁律收紧为「形容词作表语时不用 -ly 副词形式（tastes sweet，不说 tastes sweetly）」；并注：表语不止形容词——名词、介词短语可以作表语（formula 原文已列），副词性小品词也可以（The meeting is over. / He is out.）。
