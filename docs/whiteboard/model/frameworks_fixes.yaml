    field: pair_secret
    original: wh + en ➔ when ↔ th + en ➔ then (那时)!
    fixed: 拆字式表述删除，改标词族押韵（真）：when / then 押 -en 词尾，词干是 hw- 与 þ- 两家（框架见 ROYAL T05-accurate）。
    fix_type: 分层标注
    source: 报告概念层 C-2、C-6

