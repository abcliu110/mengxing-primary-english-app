    field: why_rule（真词源彩蛋，讲法升级）
    original: Whose 条 why_rule「由 who + 所有格演变而来，注意切勿和 Who's (Who is) 混淆！」（实质正确但未点名）；Why 条 why_rule 仅「追问事件背后的原因。」
    fixed: 两条升级为「侦探彩蛋」真词源并点名：whose 就是古英语 hwā 的属格 hwæs（「谁的」），所以它和 who's（who is 的缩写）只是同音、不是亲戚；why 是古英语 hwȳ，what 的古「工具格」（「凭什么」），所以 why 长得不像 what 却是一家人。比含混的 pair_secret 更能建立词族直觉，生活版押韵钩子保留在 T05 口诀条。
    fix_type: 讲法升级
    source: 报告内容层 RADAR 条（whose 即 hwā 属格 hwæs，可保留并在准确版中点名）；讲法清单 §4.6；Mitchell & Robinson（hwæs 属格、hwȳ 工具格）

  - db: INTERROGATIVE_RADAR_DB
    id: When
    field: why_rule（跨库口径统一注）
    original: when 既可问日期也可问钟点；而 What time 专问几点几分。
    fixed: 原文保留（符合真实用法，比「问钟点只能用 What time」的坊间过度规则更准确），统一跨库口径为「What time 专问时刻，when 问时间（宽：日期、时候、钟点都可）」；ROYAL_TRUMPS T11 的「What time 问钟点」不得读成排他规则，两库互注。
    fix_type: 口径对齐
    source: 报告内容层 RADAR 条（与 ROYAL T11 的排他暗示存在跨库口径张力，宜统一为上述口径）

  # ================= ZH_EN_SYNTAX_CONTRAST_DB =================
  - db: ZH_EN_SYNTAX_CONTRAST_DB
    id: 维度5
    field: dim + en_rule
    original: dim「5. 可数名词『要加冠词』铁律（冠词/复数）」；en_rule「🇬🇧 英语：单数可数名词绝要加冠词！要么戴冠词帽 (a cat)，要么变复数 (cats)！例：I like cats. / This is a book.」
    fixed: 改写为与零冠词内容一致的表述：dim 改「5. 可数名词单数要『亮明身份』（冠词/复数）——但当『做的事』时可以光着身子」；en_rule 改「指称具体事物时，单数可数名词要亮明身份：一个 (a cat)、特指那个 (the cat)、或变复数 (cats)。但是当名词读作『在做这件事』（功能/活动读法）时零冠词：go to school（去上学）、in bed（睡下了）、by bus（乘车方式）、play football——这时 school/bed 指的不是一栋建筑、一张床，而是那件事本身。」与 boundedness 模型 cl-zero-func（零冠词功能读法）及 cl-a-first 互相引用，跨库只此一套口径（互引注：cl-zero-func 登记的是机构名词的活动读法，play football 的球类零冠词是与之并列的另一类别，两类并列、不合并）。删除「绝要」「铁律」。
    fix_type: 口径对齐
    source: 报告内容层 ZH_EN 条（维度 5 与本 App 自家零冠词内容 go to school / in bed / by bus 直接自相矛盾，须收紧适用范围为「指称具体事物时」并与零冠词条目互相引用）；boundedness.yaml cl-zero-func 及其例外登记 xc-piano、xc-hospital-us

  - db: ZH_EN_SYNTAX_CONTRAST_DB
    id: 维度2
    field: en_rule 例词
    original: 🇬🇧 英语：从小到大（先精准靶心，再往外扩）例：at 8:00 on May 1st in 2026 / Class 2, Grade 5
    fixed: 日期例保留（at 8:00 on May 1st in 2026 正确）；「Class 2, Grade 5」是汉语校名结构的直译，不是英语国家惯常说法，替换为「Grade 5（美式口语 fifth grade）」作「从小到大」的例证，或注「班级牌写法是中式直译，英语里说 Grade 5」。
    fix_type: 内容订正
    source: 报告内容层 ZH_EN 条（Class 2, Grade 5 不地道；同维度日期例正确）

  - db: ZH_EN_SYNTAX_CONTRAST_DB
    id: 维度1
    field: en_rule + why_reason（讲法升级）
    original: en_rule「🇬🇧 英语：焦点先行（主谓宾 SVO 先上车），先地点后时间放句尾！例：I played football.」why_reason 为「拍电影特写」式讲法。
    fixed: 改「默认＋可移动」表述：英语默认把新消息放句尾（end-focus），状语的常规位置是主干之后（先地点后时间只是常见倾向，不是定律）；状语可以搬家，搬到句首就变成强调/先交代背景：Yesterday, I played football in the park.（先立时间背景）。同一事实、两种摆法，学的是信息结构而不是死顺序。原「焦点先行」四字删除（该自造标签另在 GRAMMAR G28 有同名问题，统一废止以 grammar 包 G28 裁定为准，本条为执行改写）。
    fix_type: 讲法升级
    source: 报告内容层 ZH_EN 条（「先地点后时间放句尾」是倾向而非定律，宜改标倾向并给前置例）；讲法清单 §4.7（Quirk et al. 句尾焦点与状语位置；Halliday given/new 信息结构）

  # ================= PITFALLS_DB =================
  - db: PITFALLS_DB
    id: 天坑03
    field: desc（fish）
    original: 绵羊 sheep、鱼 fish（条数）、鹿 deer 单复数同形绝不加 s！土豆 potato、西红柿 tomato 变复数必须加 -es。kangaroo 和 photo 只加 -s。脚 foot➔feet，老鼠 mouse➔mice。
    fixed: fish 一项改「通常单复数同形（数条数时不加 s）；但指『好几种鱼类/品种』时可以加 -es 说 fishes」；「绝不加 s」删除。potato/tomato/kangaroo/photo 一段与 ROYAL T02 名单口径对齐（o 结尾加 -es 的是封闭小名单）。与 boundedness 模型口径一致：可数性看「怎么看它」，fish 的种类读法正是换一种看法。
    fix_type: 全称降格
    source: 报告内容层 PITFALLS 条（fishes 指多个种类/品种时存在；「鱼（条数）」括注含义含混；改为「通常同形；指种类时可 fishes」）；boundedness.yaml 例外登记口径

  - db: PITFALLS_DB
    id: 天坑05
    field: desc（play the piano）
    original: play + 球类/棋类 绝不加 the（play football / badminton）；play + 西洋乐器 必须加 the（play the piano）；by + 交通工具 中间零冠词（by subway/bus）！
    fixed: 乐器一项降为倾向：「play + 西洋乐器多加 the（play the piano）——这是英式/考试英语的稳妥写法，美式口语常省 the（play piano 也对）」。与 boundedness 模型例外登记 xc-piano 口径对齐（本 App 已把 play the piano 登记为例外型倾向，此处不得再写「必须」）。球类零冠词与 by+交通工具零冠词两项原文核对无误，保留。
    fix_type: 全称降格
    source: 报告内容层 PITFALLS 条（play the piano 是倾向，美式口语常省 the；与自家模型口径不一致须降为倾向并注美式例外）；boundedness.yaml xc-piano

  - db: PITFALLS_DB
    id: 天坑08
    field: desc + 讲法
    original: 只要句中出现 yesterday / last weekend / last night / ago，哪怕中文没写“了”，英语动词也必须强制变成过去式（cleaned / slept / bought）！
    fixed: 「必须强制」改「默认」：句中出现 yesterday / last weekend / last night / ago，动词默认变过去式。分两层呈现：应试版照此执行；真实版拓展一句——讲故事时英语可以用「历史现在时」故意用现在时演过去（Yesterday, this man walks up and says…），那是讲故事的手法，小学阶段知道有这回事即可，不用于考试。呈现升级为两步判据：「先找时间锚 → 再给动词穿对应盔甲；找不到锚，先想『结果关不关乎现在』（关乎现在→完成时）。」
    fix_type: 全称降格
    source: 报告内容层 PITFALLS 条（历史现在时叙事为合法反例，「强制」宜改「默认」）；讲法清单 §4.8（每条天坑改「最小对立＋一句判据」，应试版/真实版两层标注）

  # ================= STRESS_AND_SCHWA_DB =================
  - db: STRESS_AND_SCHWA_DB
    id: 法则C
    field: principle（节奏二分）
    original: 汉语是『音节计时语言（每个字用力均匀，像机关枪哒哒哒）』；英语是『重音计时语言（实词重读拉长，夹在中间的虚词 to/for/of/and/can 全部压缩成极轻极短的懒元音 /ə/）』！
    fixed: 改连续统表述：「节奏是一条光谱：汉语的音节用力比较均匀（机关枪听感），英语把重音拉得更开、把夹在中间的虚词（to/for/of/and/can）压得更扁更轻（弱读成懒元音 /ə/)——不是两种计时机器，是『重音突显程度』不同。」生活版比喻（机关枪 vs 橡皮筋）保留作听感钩子，定论式二分删除；本条改标 tendency（倾向）型，与本库自带对冲的体例一致。
    fix_type: 全称降格
    source: 报告概念层 C-8（节奏类型学的严格等时性假说已被修正为连续统倾向：Dauer 1983 再分析；Grabe & Low 2002 节律测量研究）；讲法清单 §4.9

  - db: STRESS_AND_SCHWA_DB
    id: 法则C
    field: items[0]「can /kən/ vs can't /ˈkɑːnt/」音标口径
    original: 否定句里 can't 重读且张大嘴读 /ˈkɑːnt/（未注口音）
    fixed: 并注口音：can't 英式读 /ˈkɑːnt/，美式读 /kænt/；can 的弱读 /kən/ 两式相同。教材取哪一式须与全 App 音标口径统一（联动 vocab 音标口径条）。
    fix_type: 内容订正
    source: 报告内容层 STRESS 条（can't 给音 /ˈkɑːnt/ 为英式，美式为 /kænt/，须改或并注）

  - db: STRESS_AND_SCHWA_DB
    id: 法则A
    field: principle（数字）
    original: present、record、desert、export 这样的成对词……（词典里至少有 170 对）
    fixed: 无出处数字模糊化：「（词典里有一百多对这样的成对词）」。原条的适用范围声明与「比喻不是真正的原因」自注全部保留——该体例（自带例外清单＋明说边界）经审查认定为全库范本，其他库修订照此办理。
    fix_type: 内容订正
    source: 报告内容层 STRESS 条（「至少有 170 对」无出处，通行说法为 150 对上下，数字宜模糊化）；讲法清单 §4.9（本库体例立为全库模板）

  # ================= METAPHOR_CODES_DB =================
  - db: METAPHOR_CODES_DB
    id: （库级）
    field: 「密码」体例分层标注
    original: 四组材料统一命名为「密码」（密码一人体部位／密码二色彩／密码三动物谚语／密码四空间方向），暗示凡习语皆可按同一套解码律推导。
    fixed: 库名趣味性保留，但每卡标注类型，三类分开：①概念隐喻（身体图式、UP/DOWN、TIME IS MONEY——有映射系统性，须写失效边界）；②文化习语/借喻（black tea、white lie、green hand——文化约定俗成，不可推导，整卡标「约定俗成、背下来」）；③明喻与谚语（as brave as a lion、early bird——修辞格式，不是隐喻映射）。讲法统一三步：「像什么→像在哪（对应点逐条列）→哪里不像（失效边界）」，失效边界示例随卡给出：身体图式有 foot of the mountain 却不能自造 *waist of the mountain（英语用 slope/ridge）；UP 只管数量与情绪方向，不管好坏（prices go up 涨价不是好事）；TIME IS MONEY 可 spend/save/waste time，却不能 *borrow time；颜色类最不可迁移（white 在中国传统语境关联丧葬，在英语主表纯洁）。
    fix_type: 分层标注
    source: 报告概念层 C-5（四组实为三类不同对象，统一命名为「密码」会让孩子以为凡习语皆可解码）；讲法清单 §4.2（Boers 2000, Applied Linguistics 21(4) 按概念隐喻分组呈现的保持实证；Beréndi, Csábi & Kövecses 2008；Lakoff & Johnson 1980，库内第四组已自引；Kövecses 2010）

  - db: METAPHOR_CODES_DB
    id: 密码一 HAND 卡
    field: metaphors（second-hand 归类）
    original: hour/minute hand (时针/分针) · give me a hand (搭把手帮忙) · armchair (扶手椅) · second-hand (二手的)
    fixed: second-hand 移出本组：此 hand 是第四义「经手（所有权传递）」——second-hand ＝过了第二手的，与指针（hour hand）、帮手（give me a hand）、扶手（armchair）三个义项都不同组。改置：从 HAND 卡 metaphors 中删除 second-hand，另起一行单注「hand 的第四义：经手——second-hand（二手的，经别人手转过来的）」，或移入文化习语组并标类型②。
    fix_type: 内容订正
    source: 报告内容层 METAPHOR 条（second-hand 中的 hand 指经手、所有权传递，与同组三义不同组，孩子必然映射错位；须移出该组或单独注明「hand 的第四义：经手」）

  - db: METAPHOR_CODES_DB
    id: 密码二 WHITE & GOLDEN 卡
    field: metaphors（golden autumn）
    original: a white lie (善意的谎言，不伤人) · golden opportunity (千载难逢的黄金良机) · golden autumn (金秋)
    fixed: golden autumn 降为拓展例并注「这是汉语『金秋』的直译式说法」：英语母语语料中它远不如 golden opportunity 典型，核心例词改以 golden age 充实 GOLDEN 一侧（golden autumn 只作拓展，不作核心例词），防地道性风险。
    fix_type: 内容订正
    source: 报告内容层 METAPHOR 条（golden autumn 更像「金秋」直译回输，作核心例词有地道性风险，建议换 golden age / golden hour 或降为拓展例）

  - db: METAPHOR_CODES_DB
    id: 密码三 骏马卡
    field: metaphors 中文注
    original: as strong as a horse (健壮如牛/力大无穷)
    fixed: 中文注改为「健壮如马（汉语习惯说『健壮如牛』，喻体动物不同，翻译时换了动物）」——把中英喻体转换说明白，避免注文与英文喻体（horse 马）不一致让低龄读者困惑。
    fix_type: 内容订正
    source: 报告内容层 METAPHOR 条（注文与英文喻体动物不一致，马≠牛，应注「健壮如马（汉语习惯说如牛）」）

  # ================= FRAME_SEMANTICS_DB =================
  - db: FRAME_SEMANTICS_DB
    id: FR09
    field: quizzes[1].explain
    original: 步行固定用 on foot（因为用双脚踩在地面上接触用 on），千万不能说 by foot！
    fixed: 删除伪因果注脚：改注「步行固定说 on foot（固定习语，历史上与 on horseback『骑马』成对），不能说 by foot——这类搭配背下来就行，不用编理由」。on foot 的固定搭配结论与测验答案不变，只删「因为…接触用 on」的事后附会因果。
    fix_type: 伪因果删除
    source: 报告内容层 FRAME 条（on foot 是固定习语，此「因为」是事后附会的伪因果；例句与搭配本身全对，仅注脚须改标为联想或删去因果措辞）

  - db: FRAME_SEMANTICS_DB
    id: （库级）
    field: 讲法补注（新增 explain 工具）
    original: 现有「小剧场＋换主角换动词」讲法（经审查认定即 Fillmore 本人讲法，FR01 与 FrameNet Commerce_buy 框架逐项吻合，无须换法）
    fixed: 只加两件工具：①每学一个动词追问「还有谁也在场、只是这句话没点名？」（cost 的句子里买家没出现但一直在场）——FrameNet「每个词只点亮场景的一部分角色」的儿童版，可直接生成测验题；②同一场景四句并置（buy/sell/pay/cost），只变主语不变场景，让孩子自己说出「镜头对准了谁」。失效边界：框架讲法只管同一场景内的词，不负责跨场景引申义（cost 的「代价」义作第二层拓展）。FR01–FR10 其余句型、搭配、测验答案与解析经逐项核对无误，不作修正。
    fix_type: 讲法升级
    source: 报告讲法清单 §4.1（Fillmore 1977, 1982 Frame Semantics；Berkeley FrameNet Commerce_buy：Buyer/Seller/Goods/Money 与 perspectivization）

  # ================= MINIMAL_PAIRS_DB =================
  - db: MINIMAL_PAIRS_DB
    id: （库级）
    field: 讲法补注
    original: 现有「口型提示＋最小对立对」呈现（四组对立 /ɪ/-/iː/、/æ/-/e/、/æ/-/ʌ/、/θ/-/s/ 的音标、例词、中文注经逐项核对全部无误，无内容修正）
    fixed: 唯一升级：每对补一个语境句对（如 It's a ship. / It's a sheep.），把听辨从单词层推进到句子层，防止「单练会、连句废」。除此之外本库不作任何修正。
    fix_type: 讲法升级
    source: 报告逐库裁定总表（MINIMAL_PAIRS 概念、内容双「成立」，无问题条目）；讲法清单 §4.10（Celce-Murcia, Brinton & Goodwin, Teaching Pronunciation 的最小对立训练传统）

pending_doubts:
  - item: ROYAL_TRUMPS_DB T13 同音/反义的确切对数
    detail: 原标题「同音词 16 组与反义词 24 对」与条目数对不上；报告称文件内为同音 A、B 两组共 10 对＋反义约 8 对，但对数系嵌在 desc 文本中、无结构化字段可逐对复核。本包处理为删除标题数字，不以未复核数字替换；确切对数待 T9 补丁阶段逐对点数后另行登记。
  - item: METAPHOR_CODES_DB golden hour 的小学适龄性
    detail: 报告建议以 golden age / golden hour 替换 golden autumn 作核心例词；golden hour 本义为摄影/医学术语（黄金时段），其作「宝贵时光」的课堂呈现方式报告未给实据。本包只落实「golden autumn 降为拓展例＋golden age 作核心例」，golden hour 是否入核心例存疑待定，不擅自写入核心例词。
  - item: ROYAL_TRUMPS_DB T04 expect 的归类
    detail: 报告讲法清单将 expect 与 respect、special 同列「只剩考古线索」队，内容层则仅点名 office、difficult 两词不透明。本包按内容层口径只对 office、difficult 标注考古队；expect（ex- 向外 + spect 看→「向外看→期待」）透明度介于两队之间，报告两处口径不一，存疑待裁，不擅自归队。
