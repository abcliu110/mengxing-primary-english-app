    fixed: 拆字表述删除（here 不是词缀基底，该拆分不成立）。分层重标：词族押韵（真）——where / there 押同一词尾 -ere，但真实关系是三个词干共用词尾：疑问词干 hw-（源自印欧 *kʷo-）、指示词干 þ-（源自 *to-）、近指词干 h-（*ḱe-，here 与 he 同源）；why_rule 相应改「where 问哪里、there 那里、here 这里：词尾押韵好记，词干却是三家人，框架详见 ROYAL T05 两大家族记录」。答语搭档：— It's over there!（功能配对，保留在 ex_en）。
    fix_type: 分层标注
    source: 报告概念层 C-2、C-6（民间拆字构词上不成立；真实关系是 hw-/þ-/h- 三个词干共用词尾）；Mitchell & Robinson。与 ROYAL_TRUMPS T05-accurate 共用同一框架记录，不双写。

