    original: rule「不是乱变，而是成群结队按元音规律换装：」；items 如「oo ➔ ee 复数家族：把中间的两个 o 换成两个 e 秒变复数」「i ➔ a / o 过去式旋律：把动词中间的 i 换成 a 或 o 秒变过去式」
    fixed: 讲法升级为真词源版（「换装」保留为外壳比喻，机制换成真的）：foot/feet、man/men、mouse/mice 是古英语的 i-变音（i-mutation）——一千多年前复数词尾里藏着一个 i，它把前面元音的口型偷偷带偏，后来词尾掉了、变了的元音留下来当复数记号；sing/sang、drink/drank 是更古老的元音交替（ablaut）——换个元音换个时间的老旋律。像/不像须写明：像「换装」在「成群结队」一点上；不像在：变的不是字母，而是发音。
    fix_type: 讲法升级
    source: 报告讲法清单 §4.3（i-mutation 与 ablaut 的标准历史语言学记述：Mitchell & Robinson, A Guide to Old English；Hogg, A Grammar of Old English）

