    fixed: "新增记录「两大家族真框架」：英语的问词和指示词是两大家族——问词家族姓 *kʷ-（古英语写 hw-：hwā 谁、hwæt 什么、hwǣr 哪里、hwonne 何时），指示词家族姓 *to-（古英语写 þ-：þæt 那个、þǣr 那里、þonne 那时）；近指 here 一家姓 *ḱe-（与 he 同源）。两家在同一批词尾（-ere, -en, -at）上对仗了一千多年，所以看起来像「换个字母」——其实是两个家族穿了同款词尾。彩蛋（真词源）：why 是疑问代词 hwā/hwæt 的古「工具格」hwȳ（凭什么），whose 是 who 的古属格 hwæs（谁的）——它们长得不像问词家人，却是真一家人。"
    fix_type: 新增记录
    source: 报告讲法清单 §4.3（Mitchell & Robinson, A Guide to Old English：hwā/hwæt 范式、hwæs 属格、hwȳ 工具格；印欧 *kʷo-／*to- 词干与 Grimm 定律 kʷ→hw 的标准历史语言学记述）。联动：INTERROGATIVE_RADAR_DB 的 Where/When/Whose 各条与本记录共用同一框架，不另写第二套说法。

