  # ================= TENSE_ASPECT_MATRIX_DB =================
  - db: TENSE_ASPECT_MATRIX_DB
    id: （库级）
    field: 库名/矩阵定性
    original: 「时间轴 × 体透镜」矩阵将 will 将来与一般/进行/完成并列为「体」，3×N 网格暗示时态体系完备；⑤现在完成时被标为「拔高」外挂。
    fixed: 矩阵更名为「常用时态速查网格（节选）」：英语只有过去/非过去两个形态时态，「将来」是情态/迂回表达（will、be going to），不是「体」；体（一般/进行/完成）可与每个时间交叉，网格只收小学常用格，不暗示「时态全集」。⑤的「拔高」标签改为「进阶」中性表述。
    fix_type: 命名降格
    source: 报告概念层 C-4

  - db: TENSE_ASPECT_MATRIX_DB
    id: （库级）
    field: 五条目统一讲法（新增 explain 基线）
    original: 五条目各用零散比喻（档案照/录像机/老照片/望远镜/攥着结果），未成体系，部分 whySecret 以讲法冒充「第一性原理」。
    fixed: "五条目统一到 Langacker 识解（construal）「镜头-看法」框架，一套镜头语言贯穿：一般时＝把整件事看成一张完整的全景照片（习惯与真理是『整段生活』的看法）；进行时＝镜头钻进事件内部，只看中间一段（所以看不见头尾）；完成时＝镜头对准『事情留给现在的痕迹/结果』（钥匙丢了→现在进不了门）；过去时＝镜头拉远，与现在切断。说话人选哪个时态，就是选哪种看法——同一件事，看法不同，时态不同。最小对立锚例：I lost my key yesterday.（报告旧事）／I have lost my key!（盯着现在的后果）。失效边界：镜头讲法解释『为什么选这个时态』，不替代形式规则（三单 -s、-ing 拼写走拼读口诀包）。"
    fix_type: 讲法升级
    source: 报告讲法清单 §4.4（Langacker 认知语法 construal/profile；Drożdż 2011 用认知语法工具教现在完成时；Journal of Researches in Linguistics 16(2), 2024 准实验：认知解释组在一般现在时 vs 进行时判断上显著优于任务组与控制组）

  - db: TENSE_ASPECT_MATRIX_DB
    id: future_simple
    field: aspectLens
    original: 🔭 将来体·未来望远镜镜头 (will + V原 / be going to + V原)
    fixed: 🔭 将来表达·未来望远镜镜头 (will + V原 / be going to + V原)——注：将来不是一种「体」，will 是情态动词、be going to 是迂回表达，英语靠它们谈未来（与库级更名一致）。
    fix_type: 命名降格
    source: 报告概念层 C-4（「将来体」不是体）

  - db: TENSE_ASPECT_MATRIX_DB
    id: future_simple
    field: whySecret
    original: 为什么将来时有两种说法？① will 原义是『意志、决心』……② be going to 的物理画面是『人已经走在去往某事的路上了』……
    fixed: 内容保留、定性改标为词源型解释（两条均为真实语法化史）：will 源于古英语 willan「想要」（意愿义→将来），be going to 源于「走在去往某事的路上」的运动义语法化（计划/迹象义→将来）。标题词「第一性原理」改「词源故事」。
    fix_type: 分层标注
    source: 报告概念层 C-4（两条是真实的语法化史，可保留为词源型解释）；Bybee, Perkins & Pagliuca (1994) 语法化记述

  - db: TENSE_ASPECT_MATRIX_DB
    id: present_prog
    field: whySecret
    original: ……因为『V-ing』本身只是个形容词性的动态画面（正在踢球的...），必须靠『am/is/are』充当句子的谓语发动机，把此刻的时间锚定在『现在』！
    fixed: 改标为联想式讲法，删除「第一性原理」冠名：可保留「V-ing 像一幅动态画面、be 是把画面钉在『现在』的图钉」帮助记忆，但须注明这是帮记的比方，不是语法理据；准确说法：进行时由 be + V-ing 共同构成，缺一不可。正文统一讲法以库级「镜头-看法」框架为准（镜头钻进事件内部）。
    fix_type: 分层标注
    source: 报告概念层 C-4（该 whySecret 是为讲法虚构的理据，须改标为联想式讲法，不得称「第一性原理」）

  - db: TENSE_ASPECT_MATRIX_DB
    id: present_prog
    field: trapAlert
    original: 🚨 考场头号陷阱：像 like(喜欢)、know(知道)、want(想要)、have(拥有) 这类『心理状态词』不能放进录像机拍慢动作，通常不用进行时！
    fixed: 🚨 考场头号陷阱：like(喜欢)、know(知道)、want(想要) 这类状态词通常不用进行时；have 要分开：have 表『拥有』时不用进行时（I have a bike.），但 have 的动态用法可以（We are having lunch. / They are having a party.）。删除「have 是心理状态词」的归类（have 非心理动词）。
    fix_type: 内容订正
    source: 报告内容层 TENSE 条（have 非心理动词；其状态义不用进行体，动态义可以）

  - db: TENSE_ASPECT_MATRIX_DB
    id: present_perfect
    field: whySecret
    original: ……其实看字面就秒懂：have/has 是『现在手里攥着』，done(过去分词) 是『已经完成的成果』——合起来就是：我此刻手里正拥有着之前做某事留下的结果！比如 I lost my key 只说明昨天丢了（现在找没找到不知道）……
    fixed: 两处收紧：①「攥着结果」画面改标为「帮你想通的画面（来历故事）」——完成体在历时上确源于所有格结果结构（"I have the letter written"式），可放心讲来历，但它不是 have 的词义本身，删除「看字面就秒懂」的定性；②对立注收紧：I lost my key 的关键不在「昨天」（lost 不限于昨天），真正的对立点是——过去时点名/默认一个过去时间、与现在切断，完成时不点名过去时间、只谈结果是否关乎现在（I have lost my key ＝现在进不了门）。与库级识解讲法（完成时＝镜头对准留给现在的痕迹）对齐。
    fix_type: 内容订正
    source: 报告内容层 TENSE 条（have 字面解须改标；lost 注过窄，对立点应据「是否点名过去时间／结果是否关乎现在」收紧）；Bybee, Perkins & Pagliuca (1994) 所有格结果体源头

  # ================= FIVE_SENTENCE_PATTERNS_DB =================
  - db: FIVE_SENTENCE_PATTERNS_DB
    id: （库级）
    field: 讲法基线（新增 explain）
    original: 现讲法只有「动词决定句型」一层。
    fixed: 叠加 Goldberg 论元结构构式讲法：句型模具本身携带意义——双宾模具自带「让某人收到某物」义，所以 He baked her a cake. 里 bake 本无「给」义、句子却有；反过来 explain 进不了这个模具（*explain me this 不成立，只能 explain this to me）。一个模具同时解释双宾转换与 to 式专属动词两件事。课堂活动可用句子分类游戏（按动词分 vs 按句型分，发现「句型也在说话」）。失效边界：构式讲法管「模具义」，不管 -ly 副词等形式细节。句型②「等号桥」讲法与构式观兼容，保留。
    fix_type: 讲法升级
    source: 报告讲法清单 §4.5（Goldberg 1995, Constructions；Bencini & Goldberg 2000, Journal of Memory and Language 43, 640–651）

