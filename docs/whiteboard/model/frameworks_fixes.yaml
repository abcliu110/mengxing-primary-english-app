    fixed: 补边界注：不是所有「给」类动词都能进双宾模具——explain、say、donate 只能用 to 式（explain this to me，不能说 *explain me this）。这正好用库级构式讲法解释：双宾模具自带「让某人收到」义，进不去的动词只能走 to 短语。箭头/爱心画面保留作倾向级记忆法。
    fix_type: 例外登记
