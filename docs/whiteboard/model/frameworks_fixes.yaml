  # ================= INTERROGATIVE_RADAR_DB =================
  - db: INTERROGATIVE_RADAR_DB
    id: （库级）
    field: pair_secret 栏体例
    original: pair_secret 一栏混装三种不同性质的东西：真范式押韵（where↔there）、纯答语配对（who ↔ he/she/they）、民间拆字（w + here ➔ where）。
    fixed: 该栏拆为两栏：「词族押韵（真）」只放词形/词干层面的真实关系（押韵对子＋两大家族框架）；「答语搭档（功能配对）」放答语层面的配对。拆字式表述整栏删除。各条具体改法见下。
    fix_type: 分层标注
    source: 报告概念层 C-6（同栏三物不同质，孩子会误以为三者是同一种「秘密」）

  - db: INTERROGATIVE_RADAR_DB
