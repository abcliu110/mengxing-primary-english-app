    fixed: 删除无出处伪统计「80%」：改「很多英语动词是『及物动词 (Vt)』——动作像射出去的箭，要直接击中后面的『宾语靶心 (Object)』句子才完整（另有不少动词及物、不及物两种用法都行，如 read, sing，不必贴死标签）」。
    fix_type: 内容订正
    source: 报告内容层 FIVE 条（80% 无出处伪统计，且大量动词兼具及物/不及物用法，删除数字改「很多动词」）

  - db: FIVE_SENTENCE_PATTERNS_DB
