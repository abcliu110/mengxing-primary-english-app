    fixed: 软化全称：listen、look、arrive 在小学常考的用法里是不及物，接对象要加挂钩（listen TO / look AT / arrive IN/AT）；wait 的常考用法也是 wait FOR，但它有个及物用法（wait tables 当服务员），知道即可。删除「全是」与「铁律」冠名，改「必考提醒」。
    fix_type: 全称降格
    source: 报告内容层 FIVE 条（wait 有及物用法 wait tables，小学语境结论可用，措辞「全是」可软化）

