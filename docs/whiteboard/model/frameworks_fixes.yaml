    original: formula「Subject (主语) + Vi (不及物动词) [+ 副词/介词短语挂件]」，通篇把介词短语处理为可有可无的「挂件」
    fixed: 句型①下补边界注：大多数地点/时间短语是可省的挂件，但有一类动词把地点短语当「必需搭档」——He lives in Beijing. 的 in Beijing 删掉就成残句，arrive 类同理（标准句型分类里这叫 SVA 型，本库删繁未单列，小学阶段并入①并在此注名）。挂件讲法只对可省短语成立。
