    id: Why
    field: pair_secret
    original: Why 提问 ➔ 必用 Because (因为) 回答！
    fixed: 改「Why 提问 ➔ 多用 Because 回答，也可以答目的」：答语栏三答并置——Because I was ill.（原因）/ To see a doctor.（目的）/ For my health.（目的）。删除「必用」。与 ROYAL_TRUMPS T11 同步同口径，以 T11 条为准。
    fix_type: 全称降格
    source: 报告内容层 RADAR 条（「Why 必用 Because」同 T11 条，须改）；讲法清单 §4.6（三答并置，废除「必用 Because」）

