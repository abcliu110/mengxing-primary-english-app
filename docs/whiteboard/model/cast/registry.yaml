registry: cast-bitmap-frames
version: 1
updated: '2026-11-01'
about: 位图卡司注册表（T16 P1 人物侧）：用户裁定人物保留位图、不换矢量，本表即人物侧终局登记——语义以帧的真实内容为准（动词+姿态），名实不符者逐条订正，供模板替换车道按语义选角、供动作基元查手/视线/落点锚点。与
  CAST_V5.md（联排生产登记：帧从哪张联排图切出）互补不替代；与 LAYOUT_QA_PLAN 规划的 v5/sprites/CAST.md 同一用途，本表为其 YAML 落地（勿另建冲突登记）。
conventions:
  coords: 锚点为帧内归一化坐标 [x, y]，原点左上，x 向右、y 向下，0–1（帧图已按 alpha 紧裁，底边≈落点）。
  hands: hand_left / hand_right 指画面左 / 画面右出现的那只手（画面平面，非人物解剖左右）。
  gaze: angle_deg：0=画面右、90=下、180=左、270=上，顺时针；正面注视观众 angle_deg=null。
  feet: feet=[支撑中心 x, 鞋底基线 y]；feet_alpha_x 为 alpha 底部 4% 带质心 x（实测复核）；半身/动物帧 feet=null 并在 note 说明。
  refs口径: scenes_canonical=558 规范幕中引用该帧的幕数（精修口径：带前缀帧名按文本命中计；裸英文词帧名（bus/flag/twins 等）须文本命中且场景导入的精灵库含此帧才计，以剔除台词文本误命中）；scenes_all_files=880
    文件口径同法；lib_linked_scenes=导入了含此帧精灵库的规范幕数（可用上界）。
  name_check: ok=名实一致；mismatch=名实不符（name_note 给实际内容）；watch=名可用但有内容/切帧/双轨等注意事项（name_note）。
  content_check: 目测核验 2026-11-01 = 本次已逐帧看图；CAST 登记 = 语义据 CAST_V5.md 联排登记，未逐帧目测，内容按「未核验」对待。
