# 动作事实卡 · 倒（液体倾倒 pour）
# 依据 REWRITE_TECH_PLAN §4 / §8.5：事实卡是原语的实现约束 + 验证层第 5 项（参照对比审查）的核对表。
# 本卡吸收 boundedness_1 既有教训（咖啡壶事件两轮修正）并泛化到一切带出口的容器（壶/瓶/杯/罐）。

id: refcard-pour
action: pour
title: "倒：液体从容器出口倾倒而出"
version: 1
updated: 2026-11-01
primitive: pour        # 白板原语名；spec 的 invariants 引用本卡 id

