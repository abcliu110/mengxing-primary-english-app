facts:
  - id: pour-f1
    statement: "出口唯一：液体只能从容器的出口（壶嘴尖、瓶口、杯沿最低点）离开容器；壶腹、壶身侧面、底部在任何倾斜姿态下都不出液。"
    assertion: "出流原点与「出口」语义标签的距离 ≤10px；出流期间容器轮廓其他位置不得出现液柱或液滴源"
    basis: [pour-photo-1, pour-photo-2, pour-text-1]
  - id: pour-f2
    statement: "出口朝下才出流：必须先把容器倾斜到出口轴线（壶嘴/瓶口的指向）低于水平、且容器内液面高于出口，液体才开始离开出口；轴线仍朝上或水平时，再倾斜也不出流。（咖啡壶事件教训：🫖 字形壶嘴天然上翘约 50°，倾角不够时壶嘴仍朝上，出流即为假。）"
    assertion: "出流起始帧：出口轴线与水平面夹角 <0（朝下）；倾斜未到位期间的每一帧都不得有液柱"
    basis: [pour-photo-1, pour-photo-2]
  - id: pour-f3
    statement: "先后顺序不可换：倾斜到位 → 出流开始 → 出流停止 → 容器才开始回正；回正途中与回正后都不能再有液柱。停流瞬间出口处可留一滴残滴。"
    assertion: "stream_start ≥ tilt_settled_frame；stream_end ≤ return_start_frame（回正首帧之前液流已断）"
    basis: [pour-photo-1]
  - id: pour-f4
    statement: "液柱轨迹：液柱离开出口时先沿出口轴线方向短距射出，随即被重力拉成近竖直下落，落点位于出口正下方附近；下落中因加速拉伸，液柱自上而下变细，不横飘、不上弯。"
    assertion: "液柱下段与竖直方向夹角 ≤10°；液柱宽度沿下落方向单调不增；落点水平偏差 ≤ 出口直径量级"
    basis: [pour-photo-1, pour-photo-2, pour-text-2]
  - id: pour-f5
    statement: "量守恒与结束状态：出流期间源容器液面只降、目标容器（或地面液摊）只增；容器回正后源容器内液面恢复水平。慢速收尾时最后一股液体可能贴出口下方的外壁淌下（茶壶效应），但贴壁流也只能出现在出口正下方的外壁上。"
    assertion: "源液面高度单调不增、目标液面/液摊面积单调不减；回正末帧源容器液面为水平线；贴壁流若出现，其路径 ⊆ 出口正下方外壁"
    basis: [pour-text-1, pour-text-2, pour-photo-2]

invariants:
  # 实例化注记（boundedness_1，2026-11-01 三修实测）：Noto 🫖 字形壶嘴轴线高出水平 65.9°（400px 栅格 alpha 实测），该幕全倾角定为 1.72 rad —— 出流全程轴线低于水平 ≈32.6°，满足 pour-f2 且达到 ≥30° 的可测口径；旧值 1.15 rad 时轴线恰为水平（0°），系二修「轴线 50°」误测所致。
  # 四修（2026-11-01）：该幕茶壶已弃用 emoji 字形，立为元素库道具 teapot（定义 model/props/teapot.yaml，渲染与断言在共享模块 v5/props/props.js）——壶嘴轴线为参数定义量（仰角设计 38°、路径锚点实算 38.0°），全倾角由参数反算 73°、净下倾 35°，构建期断言 assertPourWindow 按定义采样核算（<30° 停建）；字形实测口径自此退役，见 model/updates/PROP_lib_teapot.fixed。
  - "倒液必须从出口出：出流原点贴出口尖端（壶嘴尖/瓶口/杯沿最低点）"
  - "出流前容器须倾斜到出口轴线朝下，停流之后容器才回正"
  - "倾斜未到位与回正途中不得出流"
  - "液柱出流后转为近竖直下落，落点在出口正下方"
  - "源容器液面只降不升、目标液面只升不降（出流量守恒）"

