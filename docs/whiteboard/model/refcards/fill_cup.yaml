facts:
  - id: fill-f1
    statement: "入口在上方：被装材料只能从杯口上方落入，落点全程位于杯口轮廓之内；不得穿过杯壁从侧面进入，也不得在杯口之外凭空出现于杯内。"
    assertion: "装填流（颗粒束/液柱）的水平位置 ⊆ 杯口内径范围；杯内填充量增长的首帧 ≥ 装填流到达杯内的帧"
    basis: [fill-photo-1, fill-ref-1]
  - id: fill-f2
    statement: "颗粒堆丘：颗粒先落到杯底（空杯）或已有料面上，以落点为顶堆成锥形小丘；丘坡不超过休止角（约 25–40°），过陡处颗粒滚落摊平。杯中料面永远是『中高边低』的丘形，不是平面、不是凹坑。"
    assertion: "任一帧料面轮廓为单峰丘形且坡度 ≤40°；料面高度只升不降（装填期间）"
    basis: [fill-photo-1, fill-text-1]
  - id: fill-f3
    statement: "液体成平面：液体装杯时表面始终保持水平，随装入单调上升；同为『装满』，液体面平、颗粒面丘——两种形态不可混画。"
    assertion: "液体液面在每一帧为水平线段；液面高度单调不减（装填期间）"
    basis: [fill-ref-1]
  - id: fill-f4
    statement: "满与溢的判据不同：颗粒可堆出杯口以上成丘（丘坡仍 ≤ 休止角）；液体升到与杯口齐平即满，再继续注入必然沿杯口外壁溢出，不可能出现『液面高出杯口成丘』。源头停止（源容器回正/移开）在先，流入停止在后。"
    assertion: "液体液面高度 ≤ 杯口平面，除非同帧画有外壁溢流；颗粒丘顶可高于杯口但坡角 ≤40°；流入停止帧 ≥ 源容器停止动作的帧"
    basis: [fill-photo-1, fill-text-1, fill-ref-1]
  - id: fill-f5
    statement: "结束状态稳定：装填结束后杯中量只增不减、形态冻结（颗粒丘不自行塌成平面，液面保持水平）；杯中物减少只能经由『倒』（refcard-pour）或舀取等另一动作发生，不得凭空消失。"
    assertion: "装填结束帧之后，杯内填充高度与轮廓逐帧不变（直至另一动作原语介入）"
    basis: [fill-photo-1, fill-text-1]

invariants:
  - "装填物只从杯口上方进入，落点在杯口之内"
  - "颗粒成丘（坡角 ≤ 休止角约 40°），液体成平面（液面水平），两种形态不混画"
  - "液体齐杯口即满，再注必溢；颗粒可堆出杯口成丘"
  - "装填期间杯内量只增不减，结束后形态冻结"

