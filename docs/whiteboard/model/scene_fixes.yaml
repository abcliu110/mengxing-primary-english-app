    original: "【英语为什么非要给三单动词加 -s？】复数主语名词自带了 -s（The boys like...），而单数第三人称主语没带 -s（The boy...），于是英语把 -s 勋章贴到动词上（The boy likes...），用来精密锁定主语是单数第三人称！"
