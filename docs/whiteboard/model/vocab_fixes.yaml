- id: VF-003
  report_ref: W-02
  db: MH_VOCAB_DB
  entry_id: G4_157
  word: light
  field: etymology
  type: 概念错误
  severity: 高
  original: 💡 追光 -ight 家族领头羊：有光的地方既明亮，又轻盈，颜色又清浅！
  corrected: 💡 light 其实是两个长得一模一样的"陌生人"：一个 light 是"光"（light a candle），一个 light 是"轻"（light as a feather）。它们祖上不是一家，只是后来拼写撞衫了。判断方法：看搭配——跟 lamp、sun 一组的是"光"，跟 heavy 相反的是"轻"。（类比边界："撞衫"只指外形同、来源异；日常使用仍须按语境选义。）
  basis: Etymonline/OED：light"光"源自印欧根 *leuk-（发光），light"轻"源自印欧根 *legʷʰ-（轻），古英语中为两个词（lēoht / lēoht），仅拼写趋同。报告 ④ L-03 讲法。
- id: VF-004
  report_ref: W-03
  db: MH_VOCAB_DB
  entry_id: G3_130
  word: friend
  field: etymology
  type: 事实错误
  severity: 高
  original: 👫 一辈子在一起直到最后（end）也不分开的人，就是好朋友 friend！
  corrected: 👫 真身世：friend 的老祖宗是古英语 frēond，意思是"爱着你的人"（来自 frēon"去爱"）——朋友的本质是"爱你的人"，这才是它真正的来历。（拼写小钩子另见巧记栏：fri+end 只帮记拼写，不是来历。）
  basis: Etymonline/OED：friend < 古英语 frēond（frēon"爱"的现在分词），与 end 无任何关系。报告 ④ L-04 讲法。注：VOCAB_DB G3_130 spelling_alert 将同一故事明确标作"巧记"，属合法记忆术，不改；错只在 MH 把它写进 etymology 当身世。
  linked:
  - VF-016
  note: 复核注（L-5）：linked 原误指 VF-031（VOCAB book 义项补齐，与本条无关），已改正为 VF-016——本条“身世≠巧记”的定性依据正是 VF-016 确立的三栏方案；VOCAB_DB G3_130 spelling_alert 的同一故事为合法“巧记”、无修正记录，故不设跨库修正联动。
- id: VF-005
  report_ref: W-04
  db: MH_VOCAB_DB
  entry_id: G6_278
  word: scientist
  field: etymology
  type: 事实错误
  severity: 中
  original: 🧑‍🔬 把科学（science）末尾的 ce 换成专家尾巴 -tist，探索宇宙奥秘的人就是科学家 scientist！
  corrected: 🧑‍🔬 scientist 是个"发明出来的词"，出生还不到两百年：1833 年，英国学者 Whewell 觉得研究科学的人没有统一称呼，就仿照 artist（艺术家）的样子，给 science 安上"做这行的人"的尾巴 -ist，造出了 scientist。它不是从 science 里"换零件"变出来的，是照着 artist 的样子新造的。（提醒：-ist 不是万能尾巴，不能类推造词。）
  basis: OED：scientist 首证 1834 年 Whewell 书评，1833 年由其仿 artist 类推新造（"by analogy with artist"）；构词为词干 scient- + 后缀 -ist，不存在"ce 换 -tist"一步，"-tist"非后缀。报告 ④ L-08 讲法。同条 affix_root"sci（知晓）"本身正确（拉丁 scīre），不改；WORD_FORMATION_DB
    后缀表"science ➔ scientist（加 -ist）"口径正确，与本条修正后一致（消除报告 C-06 的跨库矛盾）。
- id: VF-006
  report_ref: W-07
  db: MH_VOCAB_DB
  entry_id: G1_001
  word: bag
  field: affix_root
  type: 分型错误
  severity: 中
  original: 🧩 基础词根 bag ➔ schoolbag (书包) · handbag (手提包)
  corrected: 🧩 复合词：bag 本身就是一个完整的词（不是词根），schoolbag = school + bag（书包）、handbag = hand + bag（手提包）——两个现成的词拼成新词，叫复合词。
  basis: 构词学常识：bag 为自由语素（独立单词），schoolbag、handbag 为复合词而非词根派生；原标签"词根"会污染词根/复合的区分（报告 W-07）。
- id: VF-007
  report_ref: W-08
  db: MH_VOCAB_DB
  entry_id: G1_002
  word: book
  field: etymology
  type: 事实错误
  severity: 中
  original: 📖 古人把字写在桦树皮木片（book）上订成册，后来既指书本，又指登记预订！
  corrected: 📖 一种主流说法：book 和"山毛榉树"（beech）是亲戚——日耳曼人把文字刻在山毛榉木片上订成册（这是学界主流假说，不是百分百定论）。后来"书"又引申出"登记入册"，所以 book 还能当"预订"讲。
  basis: Etymonline：book 与 beech（山毛榉）的关联为词源学界主流假说；原文"桦树皮"树种错误（桦树 = birch）。报告 W-08。
