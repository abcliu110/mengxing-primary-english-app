  corrected: （本条 syntax_contrast 清空：原内容是与 dictionary 无关的将来时规则，属字段内容错位，已移出本词条。该规则本身亦需降格——"有计划打算常用 be going to，will 也可以"，归语法库将来时条目处理。）
  basis: 报告 W-12 后半：dictionary 条的 syntax_contrast 与本词无关；且"含 tomorrow 就用 be going to"过头（will 同样可以）。本条 etymology/affix_root 的 dict 词根内容成立，保留。
