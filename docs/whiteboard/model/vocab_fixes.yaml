  word: orange
  field: affix_root
  type: 分型错误
  severity: 中
  original: 🧩 or-ange（注意元音音素 /ɔː/ 开头，一个橙子必用 an orange）
  corrected: （本条 affix_root 清空：orange 不可这样拆——它源自梵语 nāraṅga 经波斯语、阿拉伯语、法语辗转而来，"or-ange"是为发音硬切的假块。发音提醒"以元音音开头、用 an orange"移入拼读提示栏。）
  basis: Etymonline：orange < 梵语 nāraṅga，经波斯语 nārang、阿拉伯语 nāranj、法语 orenge 传入，切分点在历史中不存在（报告 W-10）。本条 etymology"先有水果名、后有颜色名"成立，保留不改。
- id: VF-010
  report_ref: W-05 / L-05
  db: MH_VOCAB_DB
  entry_id: G2_0489
  word: play
  field: syntax_contrast
  type: 全称降格
  severity: 中
  original: 【The 的生死线】play + 球类/棋类 绝不加 the；play + 西洋乐器 必须加 the！
  corrected: 【play 的冠词习惯】play 后面跟球类、棋类：不加 the（play football）；跟乐器：一般加 the（play the piano）——不分西洋还是民族乐器（play the erhu 也一样）。小口袋再装一条：美国人口语里乐器前的 the 常常省掉，听到 play piano 别奇怪，那不是错。"一般"二字不许删。
  basis: 报告 W-05 / L-05：主干规则成立，但"绝不/必须"双全称过头——美式口语 play piano 省 the 常见；规则对象应为"乐器类"而非"西洋乐器"。
- id: VF-011
  report_ref: W-06 / L-06
  db: MH_VOCAB_DB
  entry_id: G1_017
  word: fish
  field: syntax_contrast
  type: 全称降格
  severity: 中
  original: 【单复数同形三剑客】sheep（绵羊）、deer（鹿）、fish（鱼条数）复数绝不加 s！
  corrected: 【单复数同形三剑客】sheep（绵羊）、deer（鹿）复数永远是原形；fish 有个小机关：看一群鱼用 fish 不变（three fish），数"有多少种鱼"时可以加 -es 变 fishes。
  basis: 牛津/剑桥词典：fishes 为合法复数（指种类或多条个体，如 the fishes of the Pacific）。与 VOCAB_DB G3_127 fish spelling_alert"指种类时才加 es"对齐——消除报告 W-06 指出的 MH 与 VOCAB 自相矛盾。报告 ④ L-06 讲法（镜头框架）。
- id: VF-012
  report_ref: W-11
  db: MH_VOCAB_DB
  entry_id: G1_055
  word: water
  field: syntax_contrast
  type: 全称降格
  severity: 低
  original: 【不可数名词铁律】water 绝不能加 a 或 s，谓语配单数 Water is important。
  corrected: 【不可数名词主干规则】water 一般不加 a 或 s，谓语配单数（Water is important）；但指"水域、水体"时有 waters 的用法（如 territorial waters 领海）——"一般"指日常喝的水那种情形。
  basis: 词典例证：waters"水域"为标准用法（报告 W-11）。
- id: VF-013
  report_ref: W-12
  db: MH_VOCAB_DB
  entry_id: G3_Q08
  word: how / how many / how much
  field: syntax_contrast
  type: 全称降格
  severity: 中
  original: 【可数与不可数提问铁律】How many 后必须紧跟可数名词复数；How much 问不可数或金钱价格。
  corrected: 【可数与不可数提问规则】How many 后面跟被问的那个可数名词、用复数（How many books?）；上文已经很清楚时，名词可以省掉（How many are there?）。How much 问不可数的量或金钱价格。
  basis: 报告 W-12：名词承前省略（How many are there?）为合法反例，"必须紧跟"不成立。
- id: VF-014
  report_ref: C-02
  db: MH_VOCAB_DB
  entry_id: G1_P01
  word: I / me / my / mine
  field: syntax_contrast
  type: 全称降格
  severity: 中
  original: 【代词变格铁律】英语代词必须随句中位置变格，且名物代 = 形物代 + 名词（mine = my book）。
  corrected: 【代词变格规则】英语代词随句中位置变格。名物代大多是"形物代的独立版"：my→mine、your→yours、her→hers、our→ours、their→theirs（多在尾巴上加 -s 或换尾）；但 his 主格形物两用同形、its 几乎不当名物代用——这两个要单独记。"mine = my book"只是帮记的钩子，不是拼法公式。
  basis: 报告 C-02：hers 并非"her + 名词"的简单拼接（需加 -s），its 亦为例外；原式立为"铁律"不成立，降格为倾向 + 例外清单。
- id: VF-015
