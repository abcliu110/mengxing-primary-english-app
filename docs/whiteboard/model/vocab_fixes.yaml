  type: 事实错误
  severity: 高
  original: ⌚ 戴在手腕上随时低头"注视（watch）"时间的小机器，就叫手表 watch！
  corrected: ⌚ watch 这个词最早是"守夜、保持清醒"的意思。最早的"手表"其实是能把人叫醒的小闹钟——它替你"守夜"，到点喊你起床，所以继承了 watch 这个名字；后来它越做越小，戴上了手腕。
  basis: Etymonline：watch（名词"表"义）源自古英语 wæcce"守醒、守夜"，表义（1580年代）由"能唤醒睡者的闹钟"义发展而来；词源学家 Ayto：手表得名"probably not because you look at it, but because originally it woke you up"。报告 ④ L-02 讲法。
