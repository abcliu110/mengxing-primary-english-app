  # ─────────────────────────────────────────────
  - id: dom-metaphor
    domain: "隐喻与文化"
    coreView: "人确实习惯用熟悉的领域去想陌生的领域（概念隐喻：'多就是上'、'争论是战争'，Lakoff & Johnson)，这类映射是真的思维习惯，可以讲、且必须写明'像在哪、哪里不像'；但大量习语、谚语不是推出来的，是文化里约定俗成的存货——三类（概念隐喻 / 文化习语 / 明喻谚语）必须分开标注：能推的讲映射，不能推的明说'背下来'，不许用一个'密码'故事把三类混装成一套可推导的系统。"
    unifies:
      - "frameworks_fixes METAPHOR_CODES_DB：密码一 HAND 卡（second-hand 归类订正：hand 第四义'经手')、密码二 WHITE & GOLDEN 卡（golden autumn 降为拓展例并注明直译回输风险）、密码三 骏马卡（注文订正）、库级体例分层（三类标注 + 每卡失效边界）"
      - "scene_fixes：sf-045（forward '总是朝将来'降格：时间义多半 + 空间义补充）"
    conflicts:
      - "旧'密码'体例把概念隐喻、文化习语、明喻谚语混装成'可破译的密码'：裁决——体例保留趣味名，但每卡强制三类标注，习语整卡标'约定俗成、不可推导'。"
      - "旧 HAND 卡把 second-hand 归入'指针/帮手'义组：裁决——归类错误，此 hand 是'经手（所有权传递）'义，移出并单注。"
    basis: "Lakoff & Johnson 概念隐喻理论（理论本身真实，经审查判'基本成立、包装过度简化')；Boers 2000 / Beréndi et al. 2008 隐喻意识教学（按隐喻组织词汇 + 类比三步）；Gentner 结构映射与 Glynn 类比失效边界（方法研究规则 10：只映射关系结构、专设一句'哪里不成立')。"

  # ──────────────────────────────────────────────
  - id: dom-contrast-pitfalls
    domain: "易错与对比（中英差异）"
    coreView: "孩子的错大多不是粗心，是汉语的系统在替英语做决定：汉语没有冠词、没有时态变形、没有复数与三单标记、介词系统也不同——错误就集中在这些'汉语没有或不一样'的地方（中国学生自由写作语料中冠词错误居首，时态形式、复数、三单 -s、介词次之）。所以本域按'中英系统差异点'组织（不是随机错题集），讲法明示'中文不是这样'；同时每条'铁律'都要还原成带例外的倾向——把倾向说成铁律，本身就是本域最大的易错源。"
    unifies:
      - "frameworks_fixes ZH_EN_SYNTAX_CONTRAST_DB：维度 5（冠词铁律改写，与 dom-countability-articles 互引）、维度 2（中式直译例 Class 2, Grade 5 订正）、维度 1（状语位置律改倾向 + end-focus）"
