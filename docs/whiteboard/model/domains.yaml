  # ──────────────────────────────────────────────
  - id: dom-frames
    domain: "词义与框架"
    coreView: "理解一个词，就是想起它出场的那一幕生活场景、和场景里有哪几个角色（Fillmore 框架语义）：buy、sell、pay、cost 不是四个孤立的词，是同一幕'买卖戏'换了镜头对准谁——对准买家是 buy、对准卖家是 sell、对准钱是 pay、对准货物是 cost。学词 = 先认戏，再认每个词站在哪个机位。（本域自词汇域拆出：框架是独立的真机制，与词源史分属两条线，混编会重蹈'一个故事包打一切'的旧病。）"
    unifies:
      - "frameworks_fixes FRAME_SEMANTICS_DB：FR09（on foot 伪因果注脚删除，改注固定习语）"
      - "frameworks_fixes FRAME_SEMANTICS_DB（库级）讲法补注：'隐形角色追问'（FrameNet profiling 儿童版）+ buy/sell/pay/cost 四句并置看机位"
