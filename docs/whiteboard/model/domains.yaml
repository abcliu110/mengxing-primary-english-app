    basis: "Mitchell & Robinson《A Guide to Old English》（hw- 词族形态：hwæs 属格、hwȳ 工具格）；印欧词干 *kʷo- / *to- / *ḱe- 通行词源学；Quirk 信息结构（end-focus）；审查报告 report_frameworks.md T05/INTERROGATIVE 条与 report_grammar.md G28/G31 条。"

  # ──────────────────────────────────────────────
  - id: dom-phonetics
    domain: "语音与拼读"
    coreView: "本领域无单一机制，按三条真依据组织（不编统一律）：①字母—读音对应是统计倾向不是定律——系统拼读先学最稳的对应（这是全领域最硬的教学证据，NRP 元分析 d=0.41)，其余按'变脸名单'逐个单记；②重音与弱读是真现象：schwa /ə/ 是英语最常见的元音，节奏是'重音突显程度'的连续统，不是'音节计时 vs 重音计时'的二选一；③发音的'为什么'大多在历史里：格林定律、i-变音、元音大推移都是可查的真实音变，可以讲成真历史故事，不必编口诀冒充原因。"
    unifies:
      - "frameworks_fixes ROYAL_TRUMPS T01（ea 分组订正、-er 重读 /ɜːr/ 与词尾弱读 /ə/ 拆分，与 STRESS 库 schwa 口径打通）、T03（i-变音/ablaut 真历史替换'换装'假说）"
      - "frameworks_fixes STRESS_AND_SCHWA_DB：法则 C（节奏改连续统表述）、法则 C can't 音标并注英美、法则 A（无出处数字模糊化）"
