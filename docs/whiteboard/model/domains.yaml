  # ──────────────────────────────────────────────
  - id: dom-writing
    domain: "写作"
    coreView: "写作是请读者到你脑子里看一幅画：第一步把画说清楚（谁、在哪、做什么），第二步加细节，第三步把几幅画按顺序排好。公式和句型是帮你把画搭稳的支架（功能目的），不是把分数'炼'出来的炼金术——句子变长不是目的，让读者看得见、跟得上才是；任何'保分/满分'承诺都无来源，禁止出现。"
    unifies:
      - "expressions_update.md 第二节 WRITING 改写全套：总标题与导语诚实版文案、公式标签去分数化、衔接词链重新归类（C-6:Although 移出改'句型升级：让步句')、三大母题更名、三条范句订正（W-1 insist on 误用、W-4 not only 并列不对齐、W-5 open my mind 搭配）"
      - "讲法 L-1（'炼金术'→功能目的式'请读者看一幅画' + 乐高类比三步，失效边界：感叹句是调料、公式不保分数）、L-7（Although/but'一河一桥' + 考场安全规则边界）"
      - "scene_fixes：sf-042（白板'60 分秒变 100 分'口号删除，口号明示为口号）"
      - "frameworks_fixes ROYAL_TRUMPS T15（'任何题套用稳拿满分'→'打底支架'；跨域联动：保分话术全 App 清零，以本域口径为准）"
    conflicts:
