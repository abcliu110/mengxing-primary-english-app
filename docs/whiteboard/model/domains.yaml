# 知识模型 · 领域纲领 v1（Domain Insights，TECH_PLAN §3.0）
# 通宵任务 T7 产出。依据：grammar.yaml 纲领草案（校订收编）、boundedness.yaml、
# 五个修正包（T2–T6：grammar/vocab/expressions/scenes/frameworks fixes + updates）、
# 五份审查报告（content-audit/report_*.md）概念层结论、方法研究综合笔记（分域结论）。
# 规范：每条纲领含 id / domain / coreView / unifies（真实记录 ID）/ conflicts（旧库说法 + 裁决）/ basis（来源）。
# 质量纪律：coreView 只写有来源支撑的真机制；无单一机制的领域如实声明组织方式，绝不编造统一律。
# 入模顺序：纲领 → 概念 → 主张；挂不上任何纲领的数据先停待裁区。

domains:

  # ──────────────────────────────────────────────
  - id: dom-vocab-etymology
    domain: "词汇与词源"
    coreView: "词的形式和意义都有真实的历史：词根词缀是历史上真发生过的拼合，词义是用法在时间里长出来的。所以'讲来历'必须可溯源——查得到的讲真词源（etymology），查不到的只能标成帮记的联想（mnemonic）；联想可以帮记忆，但永远不许冒充来历。真词源精细加工对记忆有实证支持（Boers），假词源则同时污染历史与机制两层。"
    unifies:
      - "VF-001–VF-046（vocab_fixes.yaml 词汇修正全量 46 条：VOCAB_DB + MH_VOCAB_DB + WORD_FORMATION_DB + WORD_RELATIONS_DB + HOMOPHONES_DB）"
      - "VF-001、VF-002（watch：'手表'义经'守夜/值更'中转，非'注视'直接引申——MH 与 VOCAB 跨库联动订正）"
      - "VF-003（light：'光' *leuk- 与'轻' *legʷʰ- 同形异源，拆分登记；与 frameworks T07、scene sf-003/sf-005 三处同题，以本条为准）"
      - "VF-036（pre- 前缀）、VF-037（auto- 前缀）、VF-038（mis- 前缀）、VF-039（vis/vid 词根透明度分级）、VF-035（newspaper 复合词）——构词类修正"
      - "ROYAL_TRUMPS T04 修正（frameworks_fixes：vis/vid/spect 家族由'全都和看有关'降为倾向 + 透明度分级）"
    conflicts:
      - "旧 MH_VOCAB etymology 字段被联想系统性殖民（watch=注视、friend 拆字、news=N/E/W/S 方位缩写等）：裁决——无词源学来源的'来历故事'一律降格 mnemonic 并标 linkedClaim，真词源以 Etymonline/OED 为准。"
      - "旧库全称量词滥用（fish 绝不加 s、play+乐器必须 the 类表述散见于词汇字段）：裁决——降格 tendency 并登记例外，口径与 boundedness 模型对齐。"
      - "旧库约 20 条 func_info 为模板套话冒充语法注、sight_type 分类半途而废（52% 为空）、英美音标混标（water 拼合式音标）：裁决——套话删除或改注，音标并注英美双式，全 App 统一（见 frameworks_update 联动表）。"
    basis: "审查报告 report_vocab.md（354 单元全查，Etymonline/OED 逐条核对）；方法研究：Boers 词源精细加工（双重编码 + 加工水平；成人证据为主，对儿童属方向性借鉴，已在研究 D 节标注）；TECH_PLAN §3.2 分型规则。"

  # ──────────────────────────────────────────────
  - id: dom-grammar
    domain: "语法（形态与句法）"
    coreView: "语法不是背下来的规矩清单，而是说话人为了让听话人准确接收信息而形成的标记系统：形式跟着功能走——数、人称、时、指称、连接，每一种形式变化都在替听话人传递一条信息（几个？谁做的？何时？指哪一个？两句是什么关系？）。儿童学语法 = 学每个形式在'干什么活'。（由 grammar.yaml 纲领草案校订收编）"
    unifies:
      - "grammar.yaml 全部 21 个概念：c-noun-plural、c-measure-units、c-possessive、c-articles、c-pronouns、c-some-any、c-adj-adv、c-numbers、c-prep-schema、c-connectors、c-agreement、c-tense、c-future、c-modals、c-sentence-order、c-negation、c-questions、c-sentence-types、c-there-be、c-comparison、c-verb-complement"
      - "主谓一致组：g16-be-present、g17-be-past、g19-third-s、g19-s-history（复数 -s g01-plural-default 与三单 -s 同为向主语对齐的标记；-s 的来历是两条独立源流，见 g19-s-history）"
      - "指称管理组：g05-sound-rule、g06-the-known、g06-zero-activity、g06-instrument、g07-case-position、g07-polite-order、g08-possessive-pair、g09-demonstratives（冠词/指示/物主代词细节与 dom-countability-articles 共管）"
      - "时态标记组：g18-present-meaning、g20-progressive、g21-ed、g22-irregular-past、g22-groups-mnemonic、g23-did、g24-going-to、g24-etym、g25-will、g25-etym（'时态全句只标记一次'统摄 g23-did 的 did/does 回原形；时态的看法维度与 dom-tense-aspect 共管）"
      - "连接与立场组：g10-basic-split、g10-request-some、g15-because-so、g15-and-or、g29-two-tracks、g29-some-any-neg（some/any、because/so 是说话人的立场与连接选择，不是铁律）"
      - "信息包装组：g28-svo-order、g28-place-time（语序 = 先给事件、后给背景；与 dom-questions-info 共管）"
    conflicts:
      - "旧库六处假机制——G03 物理形状论、G19 三单 -s '补偿/勋章转移'叙事、G28 '焦点先行思维'自造标签、G15 '语法树会断'伪结构学、G04 '最重要的放前面'伪机制、G22 不规则过去式'一律内部元音变'：裁决——全部改判，机制只认功能与可查的历史事实（逐点对照见 grammar_update.md）。"
      - "旧库八点绝对化措辞（G01'多数变 ves'、G03、G04、G06、G10、G14、G29、G31 的一律/绝不/必用类）：裁决——全部降格 tendency 并强制自带例外注记；G01 规则⑤、G07 规则③、G35 规则②'主动声明口诀不是真规则'的诚实体例立为全库范式。"
      - "旧 G28 填空题把合乎语法的 'last night at home' 设为错误选项、G08 把 second floor 译作'一楼'：裁决——内容层已订正，测验答案今后独立复算（SOP 工序 2）。"
    basis: "审查报告 report_grammar.md（G01–G40 全查，概念层：成立 4 / 基本成立 30 / 过度简化 5 / 错误 1）；基准来源 Quirk《英语语法大全》、CGEL、Swan《Practical English Usage》；grammar.yaml insight 草案。"

  # ──────────────────────────────────────────────
  - id: dom-countability-articles
    domain: "可数性与冠词"
    coreView: "英语数东西之前，先决定把东西看成一个个的个体，还是一摊料、一类事——形式跟着说话人的看法（识解 construal）走，不跟着物体的物理形状走；看法定了，数法（直接数 / 借单位数）和冠词（第一次提 a、双方都知道是哪一个 the、做那件事时零冠词）跟着定。汉语量词是现成的正迁移资源：'一碗饭'的碗，就是英语借单位的老办法。（与 boundedness 模型 cl-packaging 同源同义）"
    unifies:
      - "boundedness.yaml 概念：c-countability、c-definiteness、c-zero-article、c-whole-material"
      - "boundedness.yaml 主张：cl-packaging（识解总框架）、cl-cut-test（演示法 mnemonic)、cl-container（借单位）、cl-a-first、cl-the-known、cl-a-etym（a/an ← ān、the ← 指示词系）、cl-zero-func（机构名词功能读法）、cl-whole-material（双生活名词）"
      - "boundedness.yaml 例外登记：xc-dual-life、xc-rice-grains、xc-homework-uncuttable、xc-bottle-water、xc-two-coffees、xc-generic-the、xc-piano、xc-hospital-us、xc-some-fish"
      - "grammar.yaml 共管条：g03-construal（G03 改判后的识解口径）、g03-measure、g05-sound-rule、g06-the-known、g06-zero-activity、g06-instrument"
      - "scene_fixes：sf-010（hd_g03_1 可数性台词换识解口径）、sf-029（双栖词移出必背不可数名单）、sf-031（冠词总口诀按听话人可识别性重写，含联动行 [255]）"
      - "frameworks_fixes：ZH_EN_SYNTAX_CONTRAST 维度 5 修正（冠词铁律改写，与 cl-zero-func 互引）"
    conflicts:
      - "旧'第一性原理 ③ 物理边界感统摄律'及 GRAMMAR_DB G03、旧 boundedness、白板 hd_g03_1 三份拷贝的'没有固定形状，所以不能加 a 或 -s'：裁决——理论错误，识解说取代物理判据（反例：rice 颗粒分明不可数、furniture 件件有形不可数、cake/paper 双面）；三份拷贝已全部有修正文（boundedness 重写 + T2 + sf-010）。"
      - "ZH_EN 对比库'单数可数名词绝要加冠词铁律'与自家零冠词内容（go to school / in bed / by bus）跨库自相矛盾：裁决——以本纲领为准，铁律改写为'指称具体事物时亮明身份，功能/活动读法零冠词'。"
      - "旧'一刀切'演示被讲成定义/定律：裁决——降格 mnemonic（cl-cut-test)，对颗粒物与抽象名词失效，例外 xc-rice-grains、xc-homework-uncuttable 已登记。"
    basis: "Langacker 认知语法识解说（bounded 是呈现方式而非物体属性；Nicolas 批评：有界既非必要也非充分）；Taylor 2002；方法研究 B 域结论（儿童讲法 = 照相机取景/镜头；汉语量词正迁移；冠词按 hearer identifiability，参 Gundel 共知层级、Ionin 波动假说揭示的 specificity 误用）；THEORY_AUDIT 对 ③ 家族的裁定。"

  # ──────────────────────────────────────────────
  - id: dom-tense-aspect
    domain: "时态与体"
    coreView: "时态是两件事的组合，不是十二个格子：时间（过去 / 非过去，英语只有这两个形态时态）× 看法（体）——说话人把镜头放在哪里：全景看整件事（一般体）、钻进事件内部只看中间（进行体）、对准事情留给现在的痕迹（完成体）。将来不是一种'体'，是借 will（意愿的语法化）和 be going to（'走在路上'的语法化）谈未来。同一件事，选哪种看法，就选哪个时态。"
    unifies:
      - "frameworks_fixes TENSE_ASPECT_MATRIX_DB：库级更名（'常用时态速查网格（节选）'、'将来体'订正）、五条目统一'镜头-看法'讲法基线、future_simple（aspectLens + whySecret 词源定性）、present_prog（whySecret 改标联想、trapAlert 中 have 归类订正）、present_perfect（whySecret 收紧：对立点 = 是否点名过去时间 / 结果是否关乎现在）"
      - "grammar.yaml 共管条：g18-present-meaning、g20-progressive、g21-ed、g22-irregular-past、g22-groups-mnemonic、g23-did、g24-going-to、g24-etym、g25-will、g25-etym（将来两条的语法化史在此登记为 etymology 型）"
      - "scene_fixes：sf-037、sf-038（现在完成时口诀由'过去做完'换为'和现在有关系'，同幕两行合并一份）"
      - "frameworks_fixes PITFALLS_DB 天坑 08（'必须强制变过去式'→'默认' + 历史现在时注 + 两步判据讲法）"
      - "frameworks_fixes ROYAL_TRUMPS T10（'路标严格锁定'降格，时刻表现在时 The train leaves tomorrow 等例外同级登记）"
    conflicts:
      - "旧矩阵'时间轴 × 体透镜'把 will 列为'将来体'、3×N 网格暗示体系完备：裁决——'将来体'命名错误，网格更名'节选'，不暗示完备性（概念层 C-4）。"
      - "旧现在完成时口诀'过去做完'（白板 tense_matrix_5 两行 + 旧库多处）：裁决——遗漏持续义与现时相关性，换 Comrie 口径'当前相关性'（sf-037/sf-038）；方法研究同步禁用'时间轴点位'讲完成时。"
      - "旧 present_perfect'攥着结果'字面解、present_prog'谓语发动机'被冠以'第一性原理'：裁决——前者改标'来历故事'（完成体确源于所有格结果结构，Bybee et al. 1994，但不是 have 的词义本身），后者改标联想式讲法，摘冠名。"
    basis: "Langacker 识解框架（Drożdż 2011 以认知语法工具教现在完成时；2024 JRL 准实验认知解释组胜出）；Comrie 1976 完成体定义；Bybee, Perkins & Pagliuca 1994 语法化；方法研究：tense×aspect 两维组合式讲法降低初学负荷（ERIC EJ1511004）；证据诚实标注——时态 CL 教学证据内部不一致（Bielak & Pawlak 2011 仅与传统相当），属'方向有据、低龄待验'。"

  # ──────────────────────────────────────────────
  - id: dom-prepositions
    domain: "介词"
    coreView: "每个介词有一个原型场景，其余用法都是从原型一步步推出来的亲戚（principled polysemy)：in = 在容器里面，on = 贴在面上、有接触和支撑，at = 当作一个点。时间用法是把同一张图借到时间上（in the morning 是'泡在一段时间里'，at night 是'日程表上的一个点'，on Monday 是'贴在那一天上面')——所谓'例外'大多是没看出借的是哪张图。"
    unifies:
      - "frameworks_fixes ROYAL_TRUMPS T09（时长轴定义整段删除，换 Tyler & Evans 原型图式；'in 大 on 中 at 小'口诀保留为图式的顺口溜版）"
      - "grammar.yaml：g14-schema（空间三图式）、g14-time-borrow（时间借用 + 例外老习惯登记）"
      - "scene_fixes：sf-013（介词'原封不动映射'改'原型图第一猜测 + 约定例外单记')、sf-021（for 三站：为了谁/奔着哪儿/持续多久）、sf-022（for 讲解句与三站口径对齐）"
    conflicts:
      - "旧 T09 以时长定介词（>1 天 in、=1 天 on、<1 天 at)：裁决——伪规则，被自家例词 in the morning / at night 当场推翻，整段删除，换原型图式。"
      - "旧白板'介词从空间原封不动映射到时间'：裁决——过度简化，改为'原型图是第一猜测，约定俗成的例外（如 at night）单记'（sf-013）。"
      - "旧中文对译清单式讲法（一介词对一串中文义项）：裁决——方法研究明令禁用，改原型 + 系统性引申网络（Hung et al. 2018 准实验：CL 讲法组胜出）。"
    basis: "Tyler & Evans 2003《The Semantics of English Prepositions》principled polysemy（proto-scene + 引申网络）；Tyler et al. 2011 多义网络教法延迟后测胜出；方法研究 B 域介词结论。"

  # ──────────────────────────────────────────────
  - id: dom-constructions
    domain: "句型构式"
    coreView: "句型不只是单词的排队：模具本身带意思（构式义）。双宾模具自带'让某人收到某物'的意思，所以 bake 填进去能长出'给'义（He baked her a cake.)，而 explain 进不了这个模具（*explain me this 不成立）——一个模具同时解释'为什么能变'和'为什么有的不能变'。动词决定大半，但模具也在说话；孩子学句型 = 学每个模具自带的戏（谁给谁、谁变样、谁在哪儿）。"
    unifies:
      - "frameworks_fixes FIVE_SENTENCE_PATTERNS_DB：库级 Goldberg 构式讲法基线（新增 explain)、句型③ SVO（伪统计删除）、句型② SVP（表语范围订正 + 虚构分工注删除）、句型① SV（SVA 边界登记）、句型④ SVOO（explain/say/donate 只能 to 式边界）"
      - "scene_fixes：sf-015（谓语'国王'范围收窄到简单句/分句）、sf-043（副词改功能定义，-ly 只作识别提示）、sf-019（to/-ing 由二分口诀改'动词决定搭配')、sf-028（动名词/现在分词'两件马甲'拆清）、sf-035、sf-036（G40 like/love 双搭配订正）"
      - "grammar.yaml 共管条：g35-proximity、g36-there-vs-have（There be 存现构式）、g40-one-finite、g40-to-vs-ing（一个分句一个限定动词）"
    conflicts:
      - "旧句型③'80% 动词及物'伪统计：裁决——无来源数字删除，改'很多动词'。"
      - "旧句型②虚构分工注'turn 管颜色、get 管天气'：裁决——编造，删除（It turned cold. / get red 均成立）。"
      - "旧讲法只有'动词决定句型'一层：裁决——不完整，叠加构式义一层；但构式讲法管'模具义'不管形式细节，失效边界已在 fixes 中写明。"
    basis: "Goldberg 1995《Constructions》论元结构构式；Bencini & Goldberg 2000 句子分类实验（学习者按构式而非动词分类）；方法研究 B 域句型结论（禁用语序平移论）。"

  # ──────────────────────────────────────────────
  - id: dom-questions-info
    domain: "疑问与信息结构"
    coreView: "问句是按'缺哪一块信息'分工的：疑问词各管一块拼图（谁、什么、何时、哪里、为何、怎样），它们的词形有真实出身——印欧疑问词系 *kʷo-（古英语 hw-）与指示词系 *to-（þ-）是两大家族，押韵只是表面热闹。句子层面的另一半是信息包装：先给主干事件，新信息和焦点常落在句尾（end-focus)，状语前置是变强调——都是'帮听话人排信息'的选择，不是神秘的'先行思维'。"
    unifies:
      - "frameworks_fixes INTERROGATIVE_RADAR_DB：Where、Who、What、When、Why、Whose/Why 各条（pair_secret 分层：词族押韵 vs 答语搭档；拆字式表述删除；whose=hwæs 属格、why=hwȳ 工具格真词源点名）"
      - "frameworks_fixes ROYAL_TRUMPS T05（伪构词律降格 mnemonic)、T05-accurate（新增真框架记录：*kʷo- / *to- / *ḱe- 三词干家族）、T11（Why'必用 Because'降格，三答并置）"
      - "grammar.yaml：g28-svo-order、g28-place-time、g30-yesno、g31-wh-words、g31-why-answer、g32-how-what"
      - "frameworks_fixes ZH_EN_SYNTAX_CONTRAST 维度 1（'先地点后时间'由定律改倾向 + end-focus 讲法；'焦点先行'标签废止）"
      - "scene_fixes：sf-027（疑问词'总是第一'限定化，补从句居中例）"
    conflicts:
      - "旧 T05'wh- 换 th-/h- 即得回答词'伪构词律：裁决——错误，疑问词干 hw-（*kʷo-）与指示词干 þ-（*to-）从未互相派生，here 与 he 同属近指 *ḱe- 系、更非 where 减 w；整条降格押韵口诀，真框架由 T05-accurate 承载。"
      - "旧 G28'焦点先行思维'自造标签（且传染到 ZH_EN 维度 1)：裁决——两处统一废止，改 end-focus/信息结构表述，以 grammar 包 G28 裁定为准。"
