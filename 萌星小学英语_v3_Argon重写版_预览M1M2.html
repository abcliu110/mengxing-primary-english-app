  <style>
    :root {

      --pillar-words-soft: #EFF6FF;

    .banner-desc {

    /* === &#21477;&#23376;&#25104;&#20998;&#22266;&#23450;&#33394;&#22359;&#26679;&#24335; (Syntax Role Chips) === */
    .syntax-bar {

      align-items: center;

      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .syn-chip small {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 2px;
    }

    .syn-SUBJ { color: var(--syn-subj-fg); background: var(--syn-subj-bg); border-color: var(--syn-subj-border); }
    .syn-VERB { color: var(--syn-verb-fg); background: var(--syn-verb-bg); border-color: var(--syn-verb-border); }
    .syn-OBJ  { color: var(--syn-obj-fg);  background: var(--syn-obj-bg);  border-color: var(--syn-obj-border); }
    .syn-ADV  { color: var(--syn-adv-fg);  background: var(--syn-adv-bg);  border-color: var(--syn-adv-border); }
    .syn-WH   { color: var(--syn-wh-fg);   background: var(--syn-wh-bg);   border-color: var(--syn-wh-border); box-shadow: 0 0 12px rgba(245, 158, 11, 0.35); }

    /* === &#25353;&#38062;&#19982;&#20132;&#20114;&#25511;&#20214; === */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-main);

    .btn-primary { background: var(--pillar-words); color: #FFFFFF; border-color: var(--pillar-words); }

    .btn-green { background: var(--pillar-practice); color: #FFFFFF; border-color: var(--pillar-practice); }

    .modal-backdrop {

      overflow-y: auto;

    /* &#38450;&#36807;&#36733;&#26102;&#24207;&#33310;&#21488; */
    .stage-canvas-wrap {
      position: relative;
      background: #1E293B;
      border-radius: var(--radius-md);
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 12px 0;
    }
  

    /* === [M2 新增] 主题总览页 (Theme Overview) 与词卡组件样式 === */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;

    @media (max-width: 768px) {

      border-radius: var(--radius-md);

      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;

      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      margin-bottom: 16px;

      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));

    }

      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);

      box-shadow: var(--shadow-card);
    }

    .word-tile.status-mastered {
      border-color: #86EFAC;
      background: #F0FDF4;
    }

    .word-tile.status-mistake {
      border-color: #FDA4AF;
      background: #FFF1F2;

    .psy-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-subtle);
      color: var(--text-secondary);

      color: #1D4ED8;
    }

    .psy-tag.hybrid-cue {

  <!-- &#39030;&#26639;&#65306;&#21697;&#29260;&#12289;&#24180;&#32423;&#19977;&#26723;&#24320;&#20851;&#12289;&#25171;&#21345;/&#26143;&#26143;/&#36328;&#26085;&#27169;&#25311;&#12289;TTS&#35299;&#38145;&#12289;&#23478;&#38271;&#38376;&#31105; -->

  <script>
    /* ============================================================================

    const DESIGN_TOKENS = {

    /**
     * 数据层核心服务 (DataService)
     * 负责：
     *   1. 兼容解析 02a/02b 数组行或 JSON 对象，执行字段校验与去重
     *   2. 用 concreteness (1-5) 决定 render_strategy (>=4.0 Visual_Direct, <3.0 Scenario_Contrast, 其余 Hybrid_Cue)
     *   3. 用 yle_level (S/M/F) 与 aoa (习得年龄) 联合映射学段分级 (G1_2 / G3_4 / G5_6)
     *   4. 宏主题与子主题归一化索引
     */
    const DataService = {
      isNormalized: false,
      validationReport: { totalLoaded: 0, droppedInvalid: 0, directCount: 0, contrastCount: 0, hybridCount: 0 },
      themeTree: {}, // macro -> { subThemeName -> [wordObj, ...] }

      /**
       * 根据 Brysbaert 具象度 (concreteness: 1~5) 计算多模态渲染策略[cite: 2]
       *   >= 4.0 -> 'Visual_Direct' (直接视觉映射，0-2s内禁用中文释义干扰)
       *   <  3.0 -> 'Scenario_Contrast' (多格情境对比微动画)
       *   3.0~3.99 或 null -> 按功能词/抽象度兜底或标记为 'Hybrid_Cue'
       */
      computeRenderStrategy(concreteness, subTheme, isFunc) {
        const c = (concreteness !== null && concreteness !== undefined && !isNaN(concreteness))
          ? Number(concreteness) : null;
        if (c !== null) {
          if (c >= 4.0) return 'Visual_Direct';
          if (c < 3.0)  return 'Scenario_Contrast';
          return 'Hybrid_Cue';
        }
        // 当 concreteness 为 null 时的诚实启发式回退：语法功能词与情绪特征走情境对比，其余实物走视觉直映
        if (isFunc || subTheme === '语法功能与指代' || subTheme === '个人特征与情绪') {
          return 'Scenario_Contrast';
        }
        return 'Visual_Direct';
      },

      /**
       * 根据剑桥少儿英语等级 yle_level ('S'|'M'|'F') 与 Kuperman 习得年龄 aoa (岁) 判定所属年级档位
       * 优先级：yle_level 联合 aoa -> 单一 yle/aoa -> 课标 kebiao_level / 原始 grade 字段
       */
      computeGradeBand(yle_level, aoa, rawGrade, kebiao_level, idStr) {
        const yle = typeof yle_level === 'string' ? yle_level.trim().toUpperCase() : null;
        const age = (aoa !== null && aoa !== undefined && !isNaN(aoa)) ? Number(aoa) : null;

        // 1. 若有 YLE 等级 (S=Starters, M=Movers, F=Flyers)，结合 AoA 微调
        if (yle === 'S') {
          return (age !== null && age > 7.5) ? 'G3_4' : 'G1_2';
        }
        if (yle === 'M') {
          if (age !== null && age <= 5.0) return 'G1_2';
          if (age !== null && age > 9.0)  return 'G5_6';
          return 'G3_4';
        }
        if (yle === 'F') {
          return (age !== null && age <= 6.8) ? 'G3_4' : 'G5_6';
        }

        // 2. 若无 YLE，但有真實 AoA 习得年龄 (岁)
        if (age !== null) {
          if (age <= 5.8) return 'G1_2';
          if (age <= 8.2) return 'G3_4';
          return 'G5_6';
        }

        // 3. 回退至原始 grade (1-6) 或从 ID 提取 (如 "G3_107") 或 kebiao_level[cite: 4, 5]
        let gNum = typeof rawGrade === 'number' ? rawGrade : null;
        if (!gNum && typeof idStr === 'string') {
          const m = idStr.match(/^G(\d)_/i);
          if (m) gNum = parseInt(m[1], 10);
        }
        if (!gNum && typeof kebiao_level === 'number') {
          gNum = kebiao_level <= 1 ? 2 : (kebiao_level === 2 ? 4 : 6);
        }
        if (gNum !== null) {
          if (gNum <= 2) return 'G1_2';
          if (gNum <= 4) return 'G3_4';
          return 'G5_6';
        }
        return 'G3_4'; // 默认中年级段 (如 POLY_* 或 V6_* 无年级标记词)[cite: 4, 5]
      },

      // 为缺少专属 emoji 的词条分配主题默认视觉图标
      inferEmoji(word, subTheme) {
        const w = (word || '').toLowerCase();
        const exactMap = {
          bag: '👜', schoolbag: '🎒', book: '📖', pen: '🖊️', pencil: '✏️', ruler: '📏',
          apple: '🍎', banana: '🍌', cake: '🎂', milk: '🥛', water: '💧',
          where: '📍', what: '❓', whose: '🕵️', who: '👤', when: '⏰', why: '💡'
        };
        if (exactMap[w]) return exactMap[w];
        const subEmoji = {
          '学校与学习': '📚', '身体与健康': '🫀', '食物与饮品': '🍱', '玩具与爱好': '🪁',
          '服装与穿戴': '👕', '语法功能与指代': '🧲', '家庭与亲友': '👨‍👩‍👧', '个人特征与情绪': '😊',
          '日常作息与动作': '🏃', '居家与生活': '🏠', '城市与场所': '🏛️', '职业与社会': '🧑‍⚕️',
          '动物大世界': '🐾', '天气与四季': '🌤️', '交通与出行': '🚌', '数字与计量': '🔢',
          '节日与时间': '🏮', '自然与地理': '⛰️', '色彩与空间方位': '🎨', '交际与礼仪': '🤝'
        };
        return subEmoji[subTheme] || '🌟';
      },

      // 归一化单条词汇数据（兼容数组行与对象）
      normalizeVocabEntry(raw, idx) {
        if (!raw) return null;
        let obj = {};
        if (Array.isArray(raw)) {
          // 兼容 02a/02b 行格式: [id, word, cn, phonetic, macro, sub, grade, concreteness?, aoa?, zipf?, yle_level?, kebiao_level?][cite: 4, 5]
          obj = {
            id: raw[0] || `v_auto_${idx}`,
            word: raw[1],
            cn: raw[2],
            phonetic: raw[3] || '',
            macro: raw[4] || '人与自我',
            sub: raw[5] || '日常作息与动作',
            grade: raw[6] !== undefined ? raw[6] : null,
            concreteness: raw[7] !== undefined ? raw[7] : null,
            aoa: raw[8] !== undefined ? raw[8] : null,
            zipf: raw[9] !== undefined ? raw[9] : null,
            yle_level: raw[10] !== undefined ? raw[10] : null,
            kebiao_level: raw[11] !== undefined ? raw[11] : null
          };
        } else if (typeof raw === 'object') {
          obj = { ...raw };
        } else {
          return null;
        }

        const wordStr = (obj.word || obj.lemma || '').trim();
        const meaningStr = (obj.cn || obj.meaning || '').trim();
        if (!wordStr || !meaningStr) return null;

        // 1. 子主题别名合并 (V6_SUB_REMAP)[cite: 3]
        let normSub = (obj.sub || obj.theme_sub || '日常作息与动作').trim();
        if (V6_SUB_REMAP[normSub]) {
          normSub = V6_SUB_REMAP[normSub];
        }

        // 2. 宏主题归并（将 v6扩展词库 及 语法功能与指代 精准汇入四宏）[cite: 3, 4]
        let normMacro = (obj.macro || obj.theme_macro || '人与自我').trim();
        if (normSub === '语法功能与指代' || obj.is_function_word) {
          normMacro = '造句黏合剂';
        } else if (normMacro === 'v6扩展词库' || !MACRO_THEME_META[normMacro]) {
          normMacro = SUB_TO_MACRO_MAP[normSub] || '人与自我';
        }

        // 3. 心理语言学特征清洗与策略计算[cite: 2]
        const conc = (obj.concreteness !== null && obj.concreteness !== undefined && obj.concreteness !== '')
          ? Number(obj.concreteness) : null;
        const aoa = (obj.aoa !== null && obj.aoa !== undefined && obj.aoa !== '')
          ? Number(obj.aoa) : null;
        const zipf = (obj.zipf !== null && obj.zipf !== undefined && obj.zipf !== '')
          ? Number(obj.zipf) : null;
        const yle = obj.yle_level || null;
        const kebiao = obj.kebiao_level !== undefined ? obj.kebiao_level : null;

        const isFunc = Boolean(obj.is_function_word || normMacro === '造句黏合剂');
        const renderStrategy = obj.render_strategy || this.computeRenderStrategy(conc, normSub, isFunc);
        const assignedGradeBand = this.computeGradeBand(yle, aoa, obj.grade, kebiao, obj.id);

        // 生成默认简短例句（若原始行未自带例句）
        const cleanLemma = wordStr.split('/')[0].trim();
        const defaultEn = isFunc
          ? `Look at how we use "${cleanLemma}".`
          : `I can see a ${cleanLemma} right here.`;

        return {
          id: String(obj.id || `v_${idx}`),
          word: wordStr,
          lemma: cleanLemma,
          meaning: meaningStr,
          cn: meaningStr,
          phonetic: obj.phonetic || '',
          syllables: obj.syllables || cleanLemma,
          pos: obj.pos || '',
          emoji: obj.emoji || this.inferEmoji(cleanLemma, normSub),
          theme_macro: normMacro,
          theme_sub: normSub,
          grade: obj.grade ?? null,
          gradeBand: assignedGradeBand,
          concreteness: conc,
          aoa: aoa,
          zipf: zipf,
          yle_level: yle,
          kebiao_level: kebiao,
          render_strategy: renderStrategy,
          is_function_word: isFunc,
          sight_type: obj.sight_type || (isFunc || (zipf && zipf >= 5.5) ? 'high_freq' : null),
          example_en: obj.example_en || defaultEn,
          example_zh: obj.example_zh || meaningStr.split('；')[0],
          affix_root: obj.affix_root || null,
          syntax_contrast: obj.syntax_contrast || (cleanLemma === 'whose' ? 'ERR_WHOSE_WHOS' : (cleanLemma === 'where' || cleanLemma === 'what' ? 'ERR_WH_MOVEMENT' : (cleanLemma === 'he' || cleanLemma === 'she' ? 'ERR_PRON_GENDER' : null)))
        };
      },

      // 初始化载入、校验与构建主题索引树
      normalizeThemeDB() {
        if (this.isNormalized) return;

        // 支持直接注入数组或带 { rows: [...] } 的 JSON 对象[cite: 5]
        const rawVocabList = Array.isArray(RAW_DATA_SOURCE.vocab)
          ? RAW_DATA_SOURCE.vocab
          : (RAW_DATA_SOURCE.vocab && Array.isArray(RAW_DATA_SOURCE.vocab.rows) ? RAW_DATA_SOURCE.vocab.rows : []);

        const seenIds = new Set();
        DB.VOCAB_DB = [];
        DB.VOCAB_MAP = {};
        this.themeTree = { '人与自我': {}, '人与社会': {}, '人与自然': {}, '造句黏合剂': {} };
        this.validationReport = { totalLoaded: 0, droppedInvalid: 0, directCount: 0, contrastCount: 0, hybridCount: 0 };

        rawVocabList.forEach((rawItem, idx) => {
          const norm = this.normalizeVocabEntry(rawItem, idx);
          if (!norm || seenIds.has(norm.id)) {
            this.validationReport.droppedInvalid += 1;
            return;
          }
          seenIds.add(norm.id);
          DB.VOCAB_DB.push(norm);
          DB.VOCAB_MAP[norm.id] = norm;
          this.validationReport.totalLoaded += 1;

          if (norm.render_strategy === 'Visual_Direct') this.validationReport.directCount += 1;
          else if (norm.render_strategy === 'Scenario_Contrast') this.validationReport.contrastCount += 1;
          else this.validationReport.hybridCount += 1;

          if (!this.themeTree[norm.theme_macro]) {
            this.themeTree[norm.theme_macro] = {};
          }
          if (!this.themeTree[norm.theme_macro][norm.theme_sub]) {
            this.themeTree[norm.theme_macro][norm.theme_sub] = [];
          }
          this.themeTree[norm.theme_macro][norm.theme_sub].push(norm);
        });

        // 校验并载入语法与口语库
        DB.GRAMMAR_DB = (Array.isArray(RAW_DATA_SOURCE.grammar) ? RAW_DATA_SOURCE.grammar : []).filter(g => g && g.id && g.title);
        DB.DAILY_EXPRESSIONS_DB = (Array.isArray(RAW_DATA_SOURCE.expressions) ? RAW_DATA_SOURCE.expressions : []).filter(e => e && e.id && e.en);

        this.isNormalized = true;
      },

      // 根据当前年级档位对英文例句执行认知负荷熔断（G1_2 <=5词, G3_4 <=8词, G5_6 <=12词）[cite: 1, 2]
      adaptSentenceForGrade(sentenceEn, gradeBandId = appState.gradeBand) {
        const band = DESIGN_TOKENS.GRADE_BANDS[gradeBandId] || DESIGN_TOKENS.GRADE_BANDS.G3_4;
        const words = (sentenceEn || '').trim().split(/\s+/).filter(Boolean);
        if (words.length <= band.maxSentenceWords) {
          return { text: sentenceEn, truncated: false, wordCount: words.length, limit: band.maxSentenceWords };
        }
        const sliced = words.slice(0, band.maxSentenceWords).join(' ').replace(/[.,!?]*$/, '') + '...';
        return { text: sliced, truncated: true, wordCount: words.length, limit: band.maxSentenceWords };
      },

      // 判断某词条是否适合当前选定的年级档位（用于�本学段推荐�过滤）
      isWordSuitableForBand(wordObj, targetBand = appState.gradeBand) {
        const order = { G1_2: 1, G3_4: 2, G5_6: 3 };
        return (order[wordObj.gradeBand] || 2) <= (order[targetBand] || 2);
      },

      getStatsSummary() {
        this.normalizeThemeDB();
        return {
          vocabCount: DB.VOCAB_DB.length,
          grammarCount: DB.GRAMMAR_DB.length,
          oralCount: DB.DAILY_EXPRESSIONS_DB.length,
          themeSummaryCount: Object.keys(DB.THEME_SUMMARY_DB).length,
          l1RulesCount: Object.keys(L1_INTERFERENCE_RULES).length,
          legoCount: DB.LEGO_MORPHEME_DB.length,
          report: this.validationReport
        };
      }
    };

     * ============================================================================ */

    const STORAGE_KEY = 'MENGXING_V3_STATE';

    function createDefaultAppState() {
      return {
        version: '3.0.0-M1',

        wordRecords: {},

        themeStars: {},
        // &#27721;&#35821;&#36127;&#36801;&#31227;&#24453;&#20462;&#34917;&#24494;&#32451;&#20064;&#38431;&#21015;: [{ ruleTag, triggerItemId, timestamp }]
        l1RemediationQueue: [
          { ruleTag: 'ERR_WH_MOVEMENT', triggerItemId: 'v_seed_where', note: '&#28436;&#31034;&#65306;&#30097;&#38382;&#35789;&#32622;&#23614;&#36127;&#36801;&#31227;&#24453;&#32451;' }
        ]
      };
    }

    let appState = loadAppState();

    function loadAppState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultAppState();
        const parsed = JSON.parse(raw);
        return Object.assign(createDefaultAppState(), parsed);
      } catch (e) {
        console.warn('&#35835;&#21462; localStorage &#22833;&#36133;&#65292;&#20351;&#29992;&#40664;&#35748;&#29366;&#24577;:', e);
        return createDefaultAppState();
      }
    }

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('&#20889;&#20837; localStorage &#22833;&#36133;:', e);
      }
    }

    // &#33719;&#21462;&#21547; dayOffset &#20559;&#31227;&#30340;&#34394;&#25311;&#20170;&#26085;&#32034;&#24341;&#65288;&#22825;&#65289;&#19982;&#26085;&#26399;&#23383;&#31526;&#20018;
    function getVirtualTodayInfo() {
      const now = new Date();
      now.setDate(now.getDate() + (appState.dayOffset || 0));
      const dateStr = now.toISOString().slice(0, 10);
      const epochDay = Math.floor(now.getTime() / 86400000);
      return { dateStr, epochDay };
    }

    /**
     * &#21547;&#21453;&#24212;&#26102; (RT) &#30340;&#31616;&#21270; FSRS &#35760;&#24518;&#35843;&#24230;&#22120;&#19982;&#36328;&#22825;&#25484;&#25569;&#29366;&#24577;&#26426;
     * &#31639;&#27861;&#35828;&#26126;&#65306;
     *   1. &#23558;&#27491;&#35823;&#19982;&#31572;&#39064;&#21453;&#24212;&#26102; (rtMs) &#26144;&#23556;&#20026;&#22235;&#26723;&#35780;&#20998;&#65306;Again(1), Hard(2), Good(3), Easy(4)
     *   2. &#26356;&#26032;&#35760;&#24518;&#31283;&#23450;&#24615; S (Stability&#65292;&#21363;&#19979;&#27425;&#22797;&#20064;&#38388;&#38548;&#22825;&#25968;) &#19982;&#38590;&#24230; D (1~10)
     *   3. &#36328;&#22825;&#32047;&#35745;&#25484;&#25569;&#35268;&#21017;&#65306;&#24517;&#39035;&#22312;&#19981;&#21516;&#26085;&#26399; (streakDays.length >= 2) &#36830;&#32493;&#31572;&#23545;&#65292;&#25165;&#21319;&#20026; mastered
     */
    const SpacedRepetitionEngine = {
      gradeWithRT(isCorrect, rtMs) {
        if (!isCorrect) return { grade: 1, label: 'Again (&#37325;&#26469;)', multiplier: 0.3, diffDelta: +1.0 };
        if (rtMs <= DESIGN_TOKENS.RT_THRESHOLDS.EASY_MAX_MS) {
          return { grade: 4, label: 'Easy (&#31186;&#31572;)', multiplier: 3.2, diffDelta: -0.3 };
        }
        if (rtMs <= DESIGN_TOKENS.RT_THRESHOLDS.GOOD_MAX_MS) {
          return { grade: 3, label: 'Good (&#29087;&#32451;)', multiplier: 2.2, diffDelta: 0.0 };
        }
        return { grade: 2, label: 'Hard (&#36831;&#30097;&#24515;&#35793;)', multiplier: 1.2, diffDelta: +0.3 };
      },

      recordAttempt(domain, itemId, isCorrect, rtMs, l1ErrorTag = null) {
        const storeMap = domain === 'grammar' ? appState.grammarRecords
                       : domain === 'oral' ? appState.oralRecords
                       : appState.wordRecords;
        const { dateStr, epochDay } = getVirtualTodayInfo();

        const rec = storeMap[itemId] || {
          status: 'unlearned',
          streak: 0,
          streakDays: [],
          wrongCount: 0,
          stability: 0.5,
          difficulty: 5.0,
          nextReviewDay: epochDay,
          lastRtMs: null,
          lastGrade: null,
          l1ErrorTags: {}
        };

        const evalRes = this.gradeWithRT(isCorrect, rtMs);
        rec.lastRtMs = Math.round(rtMs);
        rec.lastGrade = evalRes.label;
        rec.difficulty = Math.min(10, Math.max(1, +(rec.difficulty + evalRes.diffDelta).toFixed(2)));

        if (isCorrect) {
          rec.streak += 1;
          if (!rec.streakDays.includes(dateStr)) {
            rec.streakDays.push(dateStr);
          }
          rec.stability = +(Math.max(1, rec.stability * evalRes.multiplier)).toFixed(1);
          rec.nextReviewDay = epochDay + Math.round(rec.stability);
          // &#36328;&#22825;&#31572;&#23545;&#25165;&#26187;&#21319; mastered
          rec.status = rec.streakDays.length >= 2 ? 'mastered' : 'learning';
          appState.stars += 1;
        } else {
          rec.streak = 0;
          rec.wrongCount += 1;
          rec.stability = 0.5;
          rec.nextReviewDay = epochDay; // &#20170;&#26085;&#31435;&#21363;&#37325;&#32451;
          rec.status = 'mistake';
          if (l1ErrorTag && L1_INTERFERENCE_RULES[l1ErrorTag]) {
            rec.l1ErrorTags[l1ErrorTag] = (rec.l1ErrorTags[l1ErrorTag] || 0) + 1;
            appState.l1RemediationQueue.unshift({
              ruleTag: l1ErrorTag,
              triggerItemId: itemId,
              note: `&#22240;&#35302;&#21457; ${l1ErrorTag} &#25554;&#20837;&#21069;&#32622;&#24494;&#32451;&#20064;`
            });
          }
        }

        storeMap[itemId] = rec;
        saveAppState();
        return { rec, evalRes };
      }
    };

    function renderWordsPillarView(activeScreen) {

    // M2 核心：主题大世界总览页 (4宏主题 -> 归一化子主题 -> 分级/策略筛选 -> 词卡网格)[cite: 3, 4]
    function renderVocabThemeOverview() {
      const macros = Object.keys(MACRO_THEME_META);
      if (!themeViewState.selectedMacro || !DataService.themeTree[themeViewState.selectedMacro]) {
        themeViewState.selectedMacro = '人与自我';
      }
      const subMap = DataService.themeTree[themeViewState.selectedMacro] || {};
      const subKeys = Object.keys(subMap);
      if (!themeViewState.selectedSub || !subMap[themeViewState.selectedSub]) {
        themeViewState.selectedSub = subKeys[0] || null;
      }

      const rawSubWords = (themeViewState.selectedSub && subMap[themeViewState.selectedSub])
        ? subMap[themeViewState.selectedSub] : [];

      // 过滤：年级分级 + 渲染策略 + 搜索关键词
      const filteredWords = rawSubWords.filter(w => {
        if (themeViewState.onlyCurrentBand && !DataService.isWordSuitableForBand(w, appState.gradeBand)) {
          return false;
        }
        if (themeViewState.strategyFilter !== 'ALL' && w.render_strategy !== themeViewState.strategyFilter) {
          return false;
        }
        if (themeViewState.searchQuery) {
          const q = themeViewState.searchQuery;
          return w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q) || w.id.toLowerCase().includes(q);
        }
        return true;
      });

      // 按习得年龄 (aoa) 与词频 (zipf) 排序：先学低龄高频词
      filteredWords.sort((a, b) => {
        const aoaA = a.aoa ?? 6.0, aoaB = b.aoa ?? 6.0;
        if (aoaA !== aoaB) return aoaA - aoaB;
        return (b.zipf ?? 4.0) - (a.zipf ?? 4.0);
      });

      const currentSummary = DB.THEME_SUMMARY_DB[themeViewState.selectedSub];
      const starObj = appState.themeStars[themeViewState.selectedSub] || { stars: 0 };
      const starIcons = '⭐'.repeat(starObj.stars || 0) + '☆'.repeat(3 - (starObj.stars || 0));

      return `
        <!-- 1. 四大宏主题切换卡 -->
        <div class="macro-grid">
          ${macros.map(m => {
            const meta = MACRO_THEME_META[m];
            const subObj = DataService.themeTree[m] || {};
            const subCount = Object.keys(subObj).length;
            const wordTotal = Object.values(subObj).reduce((acc, arr) => acc + arr.length, 0);
            const isActive = themeViewState.selectedMacro === m;
            return `
              <div class="macro-card ${isActive ? 'active' : ''}" onclick="selectMacroTheme('${m}')">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span style="font-size:24px;">${meta.icon}</span>
                  <span class="badge" style="background:var(--bg-subtle);">${subCount} 子主题 � ${wordTotal} 词</span>
                </div>
                <div style="font-size:16px; font-weight:800; color:${meta.color};">${m}</div>
                <div style="font-size:11px; color:var(--text-secondary);">${meta.desc}</div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- 2. 子主题横向胶囊栏 -->
        <div class="subtheme-strip">
          ${subKeys.length > 0 ? subKeys.map(sub => {
            const count = subMap[sub].length;
            const active = themeViewState.selectedSub === sub;
            return `
              <button class="subtheme-chip ${active ? 'active' : ''}" onclick="selectSubTheme('${sub}')">
                <span>${sub}</span>
                <span class="badge" style="background:${active ? 'rgba(255,255,255,0.2)' : 'var(--bg-subtle)'}; color:${active ? '#fff' : 'var(--text-secondary)'};">
                  ${count}
                </span>
              </button>
            `;
          }).join('') : `<div style="font-size:13px; color:var(--text-secondary);">该宏主题下暂无子主题数据，请在 VOCAB_DB_START 注入完整词表。</div>`}
        </div>

        <!-- 3. 当前子主题黄金规律横幅 (为 M3 主题大世界预留三星与脑图入口) -->

          <div class="section-banner" style="padding:16px 20px; margin-bottom:14px;">
            <div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span class="banner-title" style="margin:0;">🏷️ ${themeViewState.selectedSub}</span>
                <span class="badge badge-m">通关星级：${starIcons}</span>
                ${currentSummary ? `<span class="badge badge-grade">💡 ${currentSummary.coreRuleTitle}</span>` : ''}
              </div>
              <div class="banner-desc" style="margin-top:4px;">
                ${currentSummary
                  ? `一句童趣规律：<strong>${currentSummary.kidRuleOneLiner}</strong>`
                  : '点击下方任意词卡即可启动「0.0s 视觉动画 → 0.5s 语音 → 2.0s 单词色块」防过载学习（M3 将在此展开意群脑图与三星闯关舱）。'}
              </div>
            </div>
            <div style="font-size:12px; color:var(--text-secondary);">
              共 <strong>${filteredWords.length}</strong> / ${rawSubWords.length} 词
            </div>
          </div>
        ` : ''}

        <!-- 4. 心理语言学策略与年级分级筛选工具栏 -->
        <div class="filter-toolbar">
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <button class="btn ${themeViewState.onlyCurrentBand ? 'btn-primary' : ''}" onclick="toggleBandFilter()">

                    title="concreteness >= 4.0：直接视觉映射，0-2s禁用中文释义">

            </button>
            <button class="btn ${themeViewState.strategyFilter === 'Scenario_Contrast' ? 'btn-primary' : ''}" onclick="setStrategyFilter('Scenario_Contrast')"
                    title="concreteness < 3.0：多格情境对比微动画">
              🎭 情境对比 (<3.0)
            </button>
          </div>
          <div>
            <input type="search" placeholder="🔍 搜索单词 / 中文 / ID..."
                   value="${themeViewState.searchQuery}"
                   oninput="handleThemeSearchInput(this.value)"
                   style="padding:7px 12px; border:1px solid var(--border-light); border-radius:8px; font-size:13px; width:210px;" />
          </div>
        </div>

        <!-- 5. 词卡网格 -->
        <div class="word-grid">
          ${filteredWords.map(w => renderWordTileHTML(w)).join('')}

      `;

    function renderWordTileHTML(w) {
      const rec = appState.wordRecords[w.id];
      const statusClass = rec ? `status-${rec.status}` : '';
      const statusBadge = rec

          <div style="display:flex; gap:4px; flex-wrap:wrap; border-top:1px dashed var(--border-light); padding-top:6px;">
            <span class="psy-tag">${w.gradeBand.replace('G', '').replace('_', '-')}年级</span>

      const now = performance.now();
      const measuredRt = Math.max(400, now - (themeViewState.wordRevealTs || now - 2000));
      const finalRt = overrideRtMs !== null ? overrideRtMs : measuredRt;
      SpacedRepetitionEngine.recordAttempt('vocab', wordId, isCorrect, finalRt, l1Tag || null);

      renderCurrentView();

    }

            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span><strong>&#26391;&#35835;&#35821;&#36895; (Speech Rate)&#65306;</strong></span>
              <input type="range" min="0.6" max="1.2" step="0.1" value="${appState.speechRate}"
                     onchange="appState.speechRate=parseFloat(this.value); saveAppState();" />
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span><strong>&#35843;&#35797;&#24037;&#20855; � &#27169;&#25311;&#36328;&#26085;&#65306;</strong></span>
              <button class="btn" onclick="simulateNextDay(); closeGlobalModal();">&#128197; &#31435;&#21363;&#36328;&#26085; (+1&#22825;)</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span><strong>&#37325;&#32622;&#26412;&#22320;&#23398;&#20064;&#35760;&#24405;&#65306;</strong></span>
              <button class="btn" style="color:var(--danger-rose); border-color:var(--danger-rose);"
                      onclick="if(confirm('&#30830;&#23450;&#28165;&#31354;&#26412;&#22320;&#36827;&#24230;&#21527;&#65311;')){localStorage.removeItem('${STORAGE_KEY}'); location.reload();}">
                &#128465;&#65039; &#24674;&#22797;&#20986;&#21378;&#29366;&#24577;
              </button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('globalModalBackdrop').classList.add('open');
    }

    function verifyParentGate(expected) {
      const val = parseInt(document.getElementById('parentGateInput').value, 10);
      if (val === expected) {
        document.getElementById('parentSettingsBody').style.display = 'block';
      } else {
        alert('&#31572;&#26696;&#19981;&#23545;&#21734;&#65292;&#35831;&#23478;&#38271;&#21327;&#21161;&#36755;&#20837;&#65281;');
      }
    }

    function closeGlobalModal() {
      AnimEngine.stopAll();
      document.getElementById('globalModalBackdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'globalModalBackdrop') {
        closeGlobalModal();
      }
    }


    /* ============================================================================
     * [ANIM]
     * &#27169;&#22359;&#22235;&#65306;&#38450;&#36807;&#36733;&#22810;&#23186;&#20307;&#26102;&#24207;&#25773;&#25918;&#22120;&#12289;Canvas &#36731;&#37327;&#21160;&#30011;&#24341;&#25806; (&#20999;&#39029;&#33258;&#21160;&#38144;&#27585; rAF)&#12289;TTS &#23553;&#35013;
     * ============================================================================ */

    const TTSService = {
      speak(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = appState.accent || 'en-US';
          utter.rate = appState.speechRate || 0.9;
          utter.volume = appState.volume || 1.0;
          window.speechSynthesis.speak(utter);
          appState.ttsUnlocked = true;
          saveAppState();
        } catch (e) {
          console.warn('TTS &#25773;&#25918;&#24322;&#24120;:', e);
        }
      },

      unlockAndTest() {
        this.speak('Hello, Mengxing English!');
        renderHeader();
      }
    };

    const AnimEngine = {
      activeRafIds: [],
      activeTimerIds: [],

      // &#27880;&#20876;&#23450;&#26102;&#22120;&#19982; rAF&#65292;&#20379;&#20999;&#39029;&#26102;&#19968;&#38190;&#28165;&#29702;
      setTimer(fn, delayMs) {
        const id = setTimeout(fn, delayMs);
        this.activeTimerIds.push(id);
        return id;
      },

      stopAll() {
        this.activeRafIds.forEach(id => cancelAnimationFrame(id));
        this.activeRafIds = [];
        this.activeTimerIds.forEach(id => clearTimeout(id));
        this.activeTimerIds = [];
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      },

            /**
       * [M2 升级] 防过载三阶段时序播放器（按 render_strategy 分流视觉呈现）：[cite: 1, 2]
       *   - Visual_Direct (concreteness >= 4.0)：单焦点 100% 高饱和实物呼吸特写，背景 30% 去饱和，0~2s 严禁文字
       *   - Scenario_Contrast (concreteness < 3.0)：左右双格情境对比微动画（如男蓝光他 vs 女粉光她 / 疑问词探测）
       */
      runAntiOverloadWordSequence(wordObj) {
        this.stopAll();
        const badge = document.getElementById('stagePhaseBadge');
        const revealZone = document.getElementById('wordRevealZone');
        const canvas = document.getElementById('wordCardCanvas');
        if (!canvas || !badge || !revealZone) return;

        revealZone.style.opacity = '0';
        revealZone.style.transform = 'translateY(8px)';
        const isContrast = wordObj.render_strategy === 'Scenario_Contrast';
        badge.textContent = isContrast
          ? '阶段 1/3 (0.0s)：多格情境对比微动画（无文字干扰）'
          : '阶段 1/3 (0.0s)：高具象直接视觉映射（禁用中文释义）';

        const ctx = canvas.getContext('2d');
        const startTs = performance.now();

        const renderFrame = (now) => {
          const elapsed = (now - startTs) / 1000;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (isContrast) {
            // === 模式 B: Scenario_Contrast (concreteness < 3.0) 左右双格情境对比舞台 ===[cite: 2]
            const midX = canvas.width / 2;
            // 左格：对照情境 (去饱和暗色)
            ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
            ctx.fillRect(20, 35, midX - 30, 135);
            // 右格：目标高亮情境 (呼吸边框)
            ctx.fillStyle = 'rgba(59, 130, 246, 0.18)';
            ctx.fillRect(midX + 10, 35, midX - 30, 135);
            ctx.strokeStyle = '#F59E0B';
            ctx.lineWidth = 3;
            ctx.strokeRect(midX + 10, 35, midX - 30, 135);

            // 视觉符号对比（无文字干扰）
            ctx.font = '44px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const bounce = Math.sin(elapsed * 4) * 5;
            ctx.fillText('❔', midX / 2, 102);
            ctx.fillText(wordObj.emoji || '🎯', midX + (midX / 2), 102 + bounce);
          } else {
            // === 模式 A: Visual_Direct (concreteness >= 4.0) 信号凸显单焦点舞台 ===[cite: 2]
            ctx.fillStyle = 'rgba(148, 163, 184, 0.10)';
            ctx.beginPath();
            ctx.arc(85, 100, 38, 0, Math.PI * 2);
            ctx.arc(415, 100, 44, 0, Math.PI * 2);
            ctx.fill();

            const pulse = 1 + Math.sin(elapsed * 4) * 0.09;
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 + 6);
            ctx.scale(pulse, pulse);

            ctx.strokeStyle = '#3B82F6';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, 52, 0, Math.PI * 2);
            ctx.stroke();

            ctx.font = '56px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(wordObj.emoji || '🌟', 0, 2);
            ctx.restore();
          }

          const rafId = requestAnimationFrame(renderFrame);
          this.activeRafIds = [rafId];
        };
        this.activeRafIds.push(requestAnimationFrame(renderFrame));

        // 阶段 2：0.5s 触发纯语音输入（此时仍不出现文字）[cite: 1, 2]
        this.setTimer(() => {
          if (badge) badge.textContent = '阶段 2/3 (0.5s)：地道语音输入（纯听觉通道）';
          TTSService.speak(wordObj.lemma || wordObj.word);
        }, DESIGN_TOKENS.TIMING.AUDIO_START_MS);

        // 阶段 3：2.0s 浮现英文单词与色块[cite: 1, 2]
        this.setTimer(() => {
          if (badge) badge.textContent = '阶段 3/3 (2.0s)：浮现英文单词与句法色块！';
          if (revealZone) {
            revealZone.style.opacity = '1';
            revealZone.style.transform = 'translateY(0)';
          }
        }, DESIGN_TOKENS.TIMING.WORD_REVEAL_MS);
      },

      // &#25773;&#25918;&#30097;&#38382;&#35789;&#21069;&#31227; (Wh- Movement) &#21160;&#30011;&#65306;&#23558;&#40644;&#37329;&#30097;&#38382;&#35789;&#20174;&#21477;&#23614;&#24179;&#28369;&#39134;&#36291;&#33267;&#21477;&#39318;&#25490;&#22836;
      playWhMovementDemo() {
        const stage = document.getElementById('whSyntaxStage');
        const chipWh = document.getElementById('chipWh');
        const chipVerb = document.getElementById('chipVerb');
        const statusText = document.getElementById('whDemoStatusText');
        if (!stage || !chipWh || !chipVerb) return;

        // &#35760;&#24405;&#21021;&#22987;&#20301;&#32622; (FLIP &#21160;&#30011;&#25216;&#26415;)
        const firstRect = chipWh.getBoundingClientRect();
        stage.insertBefore(chipWh, stage.firstElementChild);
        // &#21161;&#21160;&#35789; are &#32039;&#38543;&#30097;&#38382;&#35789;&#21069;&#31227;&#21040;&#20027;&#35821;&#21069;
        chipVerb.innerHTML = 'are <small>&#21160;&#35789;(&#25552;&#21069;)</small>';
        stage.insertBefore(chipVerb, document.getElementById('chipSubj'));

        const lastRect = chipWh.getBoundingClientRect();
        const deltaX = firstRect.left - lastRect.left;

        chipWh.style.transition = 'none';
        chipWh.style.transform = `translateX(${deltaX}px) scale(1.15)`;

        requestAnimationFrame(() => {
          chipWh.style.transition = `transform ${DESIGN_TOKENS.TIMING.WH_FLY_DURATION_MS}ms cubic-bezier(0.34, 1.56, 0.64, 1)`;
          chipWh.style.transform = 'translateX(0) scale(1)';
        });

        if (statusText) {
          statusText.innerHTML = '&#10024; <strong>&#12304;&#33521;&#25991;&#21477;&#39318;&#25490;&#22836;&#36798;&#25104;&#12305;</strong> &#40644;&#37329;&#30097;&#38382;&#35789; <code>Where</code> &#24050;&#39134;&#36291;&#33267;&#21477;&#39318;&#31532;&#19968;&#25490;&#65306;<strong>Where are you going today?</strong>';
        }
        TTSService.speak('Where are you going today?');
      },

      resetWhMovementDemo() {
        renderCurrentView();
      }
    };

    // &#21551;&#21160;&#24212;&#29992;
    window.addEventListener('DOMContentLoaded', () => {
      try { DataService.normalizeThemeDB(); } catch (e) { console.error('normalizeThemeDB failed', e); }
      renderCurrentView();
    });
  </script>
