<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>萌星小学英语 v6.0 宗师完全体 · 1200+全词库 + 真物理动画剧场 + 十五大王炸实装</title>
<style>
  :root {
    --bg-main: #f0f5ff;
    --card-bg: #ffffff;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --secondary: #7c3aed;
    --secondary-light: #ede9fe;
    --success: #059669;
    --success-light: #d1fae5;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --text-main: #0f172a;
    --text-sub: #475569;
    --border-color: #cbd5e1;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 12px 32px rgba(37, 99, 235, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg-main); color: var(--text-main); line-height: 1.55;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  button:active { transform: scale(0.95); }

  #confettiCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 9999;
  }

  /* Sticky Top Header */
  .top-header {
    position: sticky; top: 0; z-index: 200;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px);
    border-bottom: 2px solid #e2e8f0; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: var(--shadow-sm);
  }
  .brand-box { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.18rem; color: var(--primary-dark); cursor: pointer; }
  .brand-badge {
    background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777); color: #fff;
    font-size: 0.75rem; padding: 4px 11px; border-radius: 999px; font-weight: 800;
    box-shadow: 0 3px 10px rgba(124, 58, 237, 0.3);
    animation: pulseGlow 2.5s infinite ease-in-out;
  }
  .stats-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    font-weight: 800; font-size: 0.85rem; background: #f8fafc; border: 1.5px solid var(--border-color);
  }
  .stat-pill.streak { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
  .stat-pill.stars { background: #fefce8; border-color: #fef08a; color: #a16207; }
  .parent-gate-btn {
    padding: 7px 12px; border-radius: 999px; background: #f1f5f9; color: #334155;
    font-weight: 800; font-size: 0.84rem; border: 1.5px solid #cbd5e1;
  }

  /* Sub Navbar */
  .sub-navbar {
    position: sticky; top: 58px; z-index: 190;
    background: #ffffff; border-bottom: 2px solid #e2e8f0; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    box-shadow: 0 4px 12px rgba(15,23,42,0.04);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 12px;
    font-weight: 800; font-size: 0.9rem;
  }
  .nav-btn.home { background: var(--primary-light); color: var(--primary-dark); border: 1.5px solid #93c5fd; }
  .nav-btn.tab { background: #f8fafc; color: #334155; border: 1.5px solid #cbd5e1; }
  .nav-btn.tab.active { background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border-color: transparent; }

  .container { max-width: 1260px; margin: 0 auto; padding: 18px 16px 90px; }

  /* Hero Banner */
  .hero-banner {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 52%, #4c1d95 100%);
    color: #fff; border-radius: 26px; padding: 24px 28px; margin-bottom: 22px;
    box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    position: relative; overflow: hidden;
  }
  .hero-banner h1 { margin: 0 0 6px; font-size: 1.62rem; font-weight: 900; }
  .hero-banner p { margin: 0; opacity: 0.92; font-size: 0.95rem; }
  .tts-btn {
    background: linear-gradient(135deg, #10b981, #059669); color: #fff;
    padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 0.88rem;
    box-shadow: 0 6px 16px rgba(16, 185, 129, 0.28); display: inline-flex; align-items: center; gap: 6px;
  }
  .tts-btn:hover { filter: brightness(1.06); transform: translateY(-2px); }

  /* Home Portals Grid */
  .home-portal-grid-2x2 {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 20px; margin-bottom: 26px;
  }
  .portal-card-v5 {
    background: var(--card-bg); border-radius: 24px; padding: 22px;
    border: 3px solid transparent; box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; transition: all 0.22s ease; min-height: 265px; position: relative; overflow: hidden;
  }
  .portal-card-v5:hover { transform: translateY(-5px); box-shadow: 0 14px 34px rgba(15,23,42,0.15); }
  .portal-card-v5.vocab { border-color: #93c5fd; background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%); }
  .portal-card-v5.grammar { border-color: #c4b5fd; background: linear-gradient(180deg, #ffffff 0%, #f5f3ff 100%); }
  .portal-card-v5.oral { border-color: #6ee7b7; background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%); }
  .portal-card-v5.master { border-color: #fcd34d; background: linear-gradient(180deg, #ffffff 0%, #fef3c7 100%); }
  .portal-icon { font-size: 3rem; margin-bottom: 8px; }
  .portal-title { font-size: 1.45rem; font-weight: 900; margin: 0 0 6px; color: #0f172a; }
  .portal-sub { font-size: 0.9rem; color: var(--text-sub); font-weight: 700; margin-bottom: 12px; }
  .portal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .portal-tag {
    font-size: 0.76rem; font-weight: 800; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,0.92); border: 1px solid #cbd5e1; color: #334155;
  }
  .portal-enter-btn {
    width: 100%; padding: 12px; border-radius: 14px; font-weight: 900; font-size: 0.98rem;
    color: #fff; text-align: center; display: flex; align-items: center; justify-content: center;
  }
  .portal-card-v5.vocab .portal-enter-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
  .portal-card-v5.grammar .portal-enter-btn { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
  .portal-card-v5.oral .portal-enter-btn { background: linear-gradient(135deg, #059669, #047857); }
  .portal-card-v5.master .portal-enter-btn { background: linear-gradient(135deg, #d97706, #b45309); }

  /* Sections & Cards */
  .section-card {
    background: var(--card-bg); border-radius: 24px; padding: 22px;
    border: 2px solid #e2e8f0; box-shadow: var(--shadow-sm); margin-bottom: 22px;
  }
  .section-title {
    font-size: 1.22rem; font-weight: 900; margin: 0 0 16px; color: #0f172a;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    border-bottom: 2px solid #f1f5f9; padding-bottom: 12px;
  }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
  @media (max-width: 680px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .axiom-card {
    border-radius: 18px; padding: 16px; border: 2.5px solid #93c5fd;
    background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
    position: relative; overflow: hidden;
  }
  .axiom-card.verb { border-color: #fca5a5; background: linear-gradient(180deg, #ffffff 0%, #fef2f2 100%); }
  .axiom-card.order { border-color: #6ee7b7; background: linear-gradient(180deg, #ffffff 0%, #ecfdf5 100%); }
  .axiom-card.gold { border-color: #fcd34d; background: linear-gradient(180deg, #ffffff 0%, #fefce8 100%); }
  .axiom-badge {
    display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 0.75rem;
    font-weight: 900; margin-bottom: 6px; background: #1e3a8a; color: #fff;
  }

  .speak-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #eff6ff; color: #1d4ed8; border: 1.5px solid #bfdbfe;
    padding: 5px 10px; border-radius: 9px; font-weight: 800; font-size: 0.84rem;
    margin: 3px; cursor: pointer; transition: all 0.18s ease;
  }
  .speak-chip:hover { background: #dbeafe; transform: translateY(-2px) scale(1.03); }

  /* ==================== ANIMATION KEYFRAMES ==================== */
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.45); }
    50% { box-shadow: 0 0 0 8px rgba(124, 58, 237, 0); }
  }
  @keyframes wheelSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes steamRise {
    0% { transform: translateY(0) scale(0.5); opacity: 0.85; }
    100% { transform: translateY(-38px) translateX(-16px) scale(1.65); opacity: 0; }
  }
  @keyframes chugBounce { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
  @keyframes scissorFlyIn {
    0% { transform: translate(60px, -50px) rotate(-35deg) scale(0.5); opacity: 0; }
    45% { transform: translate(0px, 0px) rotate(0deg) scale(1.2); opacity: 1; }
    70% { transform: translate(-8px, 4px) rotate(-25deg) scale(1.25); opacity: 1; }
    100% { transform: translate(-25px, -30px) rotate(0deg) scale(0.8); opacity: 0; }
  }
  @keyframes tailCutDrop {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    30% { transform: translate(8px, -6px) rotate(8deg); background: #fee2e2; border-color: #ef4444; }
    100% { transform: translate(42px, 95px) rotate(35deg) scale(0.65); opacity: 0; }
  }
  @keyframes rocketFlyIn {
    0% { transform: translateY(-45px) scale(0.3); opacity: 0; }
    70% { transform: translateY(5px) scale(1.12); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes radarScan {
    0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); transform: scale(1.05); }
    50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); transform: scale(1.1); }
  }
  @keyframes floatBob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
  @keyframes letterDropOut {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(52px) rotate(42deg) scale(0.3); opacity: 0; }
  }
  @keyframes suffixPopIn {
    0% { transform: translateX(40px) scale(0.2); opacity: 0; }
    70% { transform: translateX(-4px) scale(1.18); opacity: 1; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }
  @keyframes waterDropAnim {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(36px); opacity: 0; }
  }
  @keyframes carSlideIn {
    0% { transform: translateX(-90px); }
    100% { transform: translateX(0); }
  }
  @keyframes featherFloat {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-16px) rotate(8deg); }
  }

  /* Train & Cinema Styles */
  .train-stage-card {
    background: linear-gradient(180deg, #e0f2fe 0%, #f0fdf4 75%, #dcfce7 100%);
    border: 2.5px solid #60a5fa; border-radius: 22px; padding: 18px; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .train-track-bed {
    position: relative; min-height: 118px; padding: 20px 12px 24px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 6px solid #475569;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent 22px, #94a3b8 22px, #94a3b8 30px);
    background-size: 100% 8px; background-position: bottom; background-repeat: repeat-x;
  }
  .locomotive-wrap {
    display: inline-flex; align-items: center; margin-right: 4px; position: relative;
    animation: chugBounce 0.65s infinite ease-in-out; font-size: 2.5rem;
  }
  .carriage-node {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 15px; min-width: 96px; cursor: pointer; position: relative; font-weight: 900; font-size: 0.94rem;
    box-shadow: 0 6px 14px rgba(15, 23, 42, 0.12);
    transition: all 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .carriage-node::before {
    content: ""; position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 6px; background: #334155; border-radius: 3px;
  }
  .carriage-wheels { display: flex; justify-content: space-between; width: 76%; margin-top: 5px; }
  .mini-wheel {
    width: 12px; height: 12px; border-radius: 50%; background: #1e293b; border: 2px solid #cbd5e1;
    animation: wheelSpin 1.4s linear infinite; display: inline-block;
  }
  .role-S { background: #dbeafe; color: #1e3a8a; border: 3px solid #2563eb; border-radius: 12px; }
  .role-V { background: #fee2e2; color: #991b1b; border: 3px solid #dc2626; border-radius: 999px; }
  .role-O { background: #fef3c7; color: #92400e; border: 3px solid #d97706; border-radius: 16px 4px 16px 4px; }
  .role-A { background: #d1fae5; color: #065f46; border: 3px solid #059669; border-radius: 6px 18px 6px 18px; }

  .excl-stage-card {
    background: #ffffff; border: 2.5px solid #cbd5e1; border-radius: 18px; padding: 16px; margin-bottom: 14px;
  }
  .excl-sentence-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 64px; padding: 12px 16px;
    background: #f1f5f9; border-radius: 16px; margin: 10px 0; position: relative;
  }
  .excl-blank-slot {
    min-width: 108px; height: 42px; border: 2.5px dashed #64748b; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.05rem;
    color: #64748b; background: #fff; padding: 0 14px;
  }
  .excl-blank-slot.filled {
    border-style: solid; border-color: #2563eb; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
    animation: rocketFlyIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .excl-core-word { padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 1.02rem; background: #fff; border: 2px solid #cbd5e1; }
  .excl-tail-focus { padding: 8px 14px; border-radius: 10px; font-weight: 900; font-size: 1.05rem; background: #fff; border: 2px solid #cbd5e1; }
  .excl-tail-focus.scanned { background: #ecfdf5; border-color: #059669; color: #065f46; animation: radarScan 1.2s infinite ease-in-out; }
  .excl-cut-zone {
    display: inline-flex; align-items: center; position: relative; padding: 8px 14px; border-radius: 10px;
    background: #fee2e2; border: 2px dashed #ef4444; color: #991b1b; font-weight: 800; font-size: 1rem;
  }
  .excl-cut-zone.cutting { animation: tailCutDrop 0.95s forwards; }

  .cinema-box {
    background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%); color: #fff; border-radius: 22px; padding: 20px;
    border: 3px solid #6366f1; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.35); margin-bottom: 18px;
  }
  .cinema-screen {
    background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%); border-radius: 16px; border: 2px solid #334155;
    min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; position: relative; overflow: hidden;
  }
  .cinema-stage-svg { width: 100%; max-width: 440px; height: 165px; overflow: visible; }
  .cinema-subtitle-bar {
    margin-top: 10px; text-align: center; background: rgba(15, 23, 42, 0.9); padding: 11px 16px; border-radius: 12px;
    border: 1px solid #475569; width: 100%; font-size: 0.95rem; font-weight: 800; color: #fde047;
  }
  .cinema-timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .cinema-step-btn {
    padding: 10px 12px; border-radius: 12px; background: #1e293b; color: #94a3b8; border: 2px solid #334155;
    font-weight: 800; font-size: 0.85rem; text-align: center;
  }
  .cinema-step-btn.active {
    background: linear-gradient(135deg, #4f46e5, #db2777); color: #fff; border-color: #f472b6;
    box-shadow: 0 0 16px rgba(219, 39, 119, 0.45);
  }

  .morph-stage { background: #0f172a; color: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 2px solid #38bdf8; }
  .letter-tile {
    display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 54px; padding: 0 10px; margin: 0 3px;
    border-radius: 12px; font-size: 1.5rem; font-weight: 900; background: #1e293b; border: 2.5px solid #60a5fa; color: #f8fafc;
  }
  .letter-tile.drop-e { background: #dc2626; border-color: #f87171; animation: letterDropOut 0.75s forwards ease-in; }
  .letter-tile.clone-pop { background: #f59e0b; border-color: #fde047; color: #0f172a; animation: suffixPopIn 0.6s forwards; }
  .letter-tile.suffix-tile { background: #10b981; border-color: #6ee7b7; color: #fff; animation: suffixPopIn 0.65s forwards; }

  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .word-card {
    background: #fff; border-radius: 16px; padding: 14px; border: 2px solid #e2e8f0;
    cursor: pointer; transition: all 0.18s ease; display: flex; flex-direction: column; justify-content: space-between;
  }
  .word-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-3px); }
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .search-input {
    flex: 1; min-width: 210px; padding: 10px 14px; border-radius: 12px;
    border: 2px solid #cbd5e1; font-size: 0.94rem; font-weight: 700;
  }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15,23,42,0.68); backdrop-filter: blur(5px);
    z-index: 600; display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: #fff; border-radius: 26px; max-width: 820px; width: 100%;
    padding: 24px; max-height: 92vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .cat-pill {
    padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: 0.82rem;
    background: #f1f5f9; color: #334155; border: 1.5px solid #cbd5e1; cursor: pointer;
  }
  .cat-pill.active { background: #2563eb; color: #fff; border-color: #1d4ed8; }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<header class="top-header">
  <div class="brand-box" onclick="goHome()">
    <span style="font-size:1.6rem; display:inline-block; animation:floatBob 2.2s infinite ease-in-out;">🚂</span>
    <span>萌星小学英语</span>
    <span class="brand-badge">v6.0 宗师完全体 · 1200+全词库 & 真动画</span>
  </div>
  <div class="stats-bar">
    <div class="stat-pill streak">🔥 连续打卡 <span id="uiStreakDays">7</span> 天</div>
    <div class="stat-pill stars">⭐ 智慧星 <span id="uiStarCount">50</span></div>
    <button class="parent-gate-btn" onclick="openParentGateChallenge()">⚙️ 存档备份</button>
  </div>
</header>

<nav id="globalSubNav" class="sub-navbar" style="display:none;">
  <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <button class="nav-btn home" onclick="goHome()">🏠 首页</button>
    <button class="nav-btn tab" id="navTabVocab" onclick="navigateTo('vocab')">🎬 1. 1200+微电影词库</button>
    <button class="nav-btn tab" id="navTabGrammar" onclick="navigateTo('grammar')">🚂 2. 句法真火车&代词</button>
    <button class="nav-btn tab" id="navTabOral" onclick="navigateTo('oral')">✂️ 3. 剪刀切尾&小作文</button>
    <button class="nav-btn tab" id="navTabMaster" onclick="navigateTo('master')">👑 4. 十五大王炸&闯关</button>
  </div>
  <div id="uiBreadcrumb" style="font-weight:800; color:var(--primary-dark); font-size:0.88rem;"></div>
</nav>

<main class="container">
  <div id="appViewRoot"></div>
</main>

<!-- 单词详情与一词多义弹窗 -->
<div id="wordModal" class="modal-backdrop" onclick="if(event.target===this)closeWordModal()">
  <div class="modal-box" id="wordModalContent"></div>
</div>

<!-- 家长门弹窗 -->
<div id="parentGateModal" class="modal-backdrop" onclick="if(event.target===this)document.getElementById('parentGateModal').style.display='none'">
  <div class="modal-box" id="parentGateContent" style="max-width:540px;"></div>

<script>
// ==================== 1. 双语语音合成引擎 (支持美音朗读 + 中文故事解说) ====================
function speakText(text, lang = 'en-US') {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = lang === 'zh-CN' ? 0.95 : 0.85;
  window.speechSynthesis.speak(utter);
}

function speakBilingual(enText, zhText) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const uZh = new SpeechSynthesisUtterance(zhText);
  uZh.lang = 'zh-CN';
  uZh.rate = 0.96;
  const uEn = new SpeechSynthesisUtterance(enText);
  uEn.lang = 'en-US';
  uEn.rate = 0.85;
  window.speechSynthesis.speak(uZh);
  window.speechSynthesis.speak(uEn);
}

function addStar(pts = 2) {
  const el = document.getElementById('uiStarCount');
  if (el) {
    const cur = parseInt(el.textContent || '50', 10) + pts;
    el.textContent = cur;
    localStorage.setItem('mx_stars_v6', cur);
  }
}

// 礼花物理粒子引擎
const confettiParticles = [];
let confettiAnimId = null;
function fireConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#2563eb', '#7c3aed', '#10b981', '#f59e0b', '#ec4899', '#ef4444', '#06b6d4'];
  for (let i = 0; i < 65; i++) {
    confettiParticles.push({
      x: canvas.width * 0.5 + (Math.random() - 0.5) * 180,
      y: canvas.height * 0.45,
      vx: (Math.random() - 0.5) * 16,
      vy: -Math.random() * 14 - 5,
      size: Math.random() * 8 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 14,
      alpha: 1
    });
  }
  if (!confettiAnimId) renderConfettiLoop();
}
function renderConfettiLoop() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = confettiParticles.length - 1; i >= 0; i--) {
    const p = confettiParticles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.42; p.rot += p.vrot; p.alpha -= 0.013;
    if (p.alpha <= 0 || p.y > canvas.height + 30) { confettiParticles.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rot * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
    ctx.restore();
  }
  if (confettiParticles.length > 0) confettiAnimId = requestAnimationFrame(renderConfettiLoop);
  else { confettiAnimId = null; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}
