, "beats": [{"beat": "一张卡片点名", "kid": "把英语全部词尾请到一张卡片上点名：复数、所有格、三单、过去、完了形、进行、比较、最高——正好八个，一个不多。", "adult": "跨语言对照即支撑：俄语、德语保留数十个屈折词尾，英语的八个在类型学上属极简端；语法负载随之转移到语序、助动词与介词。"}, {"beat": "少而必标", "kid": "词尾虽少，却个个必标：中国孩子漏的，恰好就是这八个里的几个——三单 -s、过去 -ed、复数 -s，漏一个就露馅。", "adult": "中国学习者的屈折错误集中在这八个中的几个（见 GR-22）——「少而必标」正是迁移难点所在，反证这八个是英语形态教学的完整靶心。"}], "statement": "现代英语的屈折只剩八个功能位（Yule 2010 通行盘点）：名词——复数 -s、所有格 -'s；动词——三单 -s、过去式 -ed、过去分词 -en、现在分词 -ing；形容词——比较级 -er、最高级 -est；且八个全是后缀。这是分析语化（GR-26）在形态层的点名清单。", "sources": ["George Yule《The Study of Language》第 4 版（2010，CUP，pp.69–70）；Fromkin et al.《An Introduction to Language》——接触等级：章节预览级（Yule 原书形态学章 pp.67–70 经原文转载核对；Fromkin 为二手引文印证）"], "boundary": "计数口径必须标注（功能位 vs 形状，见 claim 范围）；八个只数屈折，不含派生词缀。"}, {"id": "GR-28", "headline": "不规则复数不住单间，住家族宿舍：零复数、变音、-en、外来复数，各是一小家", "kid": "大部分词变复数加 -s，但有几个小家族不走大路：认出它是哪家人，就知道它的复数怎么变", "beats": [{"beat": "六个小宿舍", "kid": "不规则复数不住单间，住六个小宿舍：不变样的、换元音的、用 -en 的、-f 变声的、外国来的、只有复数的。进门先认宿舍。", "adult": "与 GR-06（不规则过去式家族）完全同构：封闭小类靠高频保命（GR-19），新词不再入住。儿童与二语者的错误形态（家族外误用 -s 与家族内过度类推并存）证明学习者大脑同样按类组织这些形式。"}, {"beat": "外国宿舍的双门牌", "kid": "cactus 的复数 cacti 和 cactuses 都在词典里：学术场合多用外国式，日常多用 -s 式——不是谁错，是场合分工。", "adult": "词典对外来复数双形的并列著录是语域分工说的一手证据；data 在通用语域日益作不可数单数处理，与学术语域的复数处理并存。"}], "statement": "不规则复数是古英语与外来借词留下的若干封闭小类：①零复数（sheep、deer、fish 等单复数同形）；②元音变音——全英语只剩七个名词（man、woman、foot、tooth、goose、mouse、louse）及其复合词；③-en 家族（ox/oxen，及双重标记化石 children、brethren）；④-f 浊化小家族（knife/knives 等，成员资格不齐，半规则）；⑤外来复数（拉丁 -us→-i、-um→-a，希腊 -is→-es、-on→-a，双形并立按语域分工）；⑥只有复数（scissors、trousers 等，计数靠 a pair of）。家族全是封闭类，只收老成员，新词一律走 -s。", "sources": ["参考语法与形态学教学传统通行分类；v5 回写销项：LSGSWE 第 4 章教学单元、形态学讲义、Huddleston & Pullum 学生版讲义三处互证——接触等级：二手系统论述级"], "boundary": "家族全是封闭类，名单有限、可穷尽，这正是它可教的原因。变动带如实说：fish 指种类时可 fishes；data 的单复数地位仍在变动；hoof、scarf 等 -f 家族成员两可。"}], "opp": null, "oppLink": null, "note": "计数口径（GR-29）：只数独立成条的形 + verb_form_of 链登记，不是该功能位的全库词数。本页形条目 21 条，拼写注（y→i、f→v、-o 两档）见各词卡注记。", "glosses": [], "sections": null, "words": ["V6_MORPH_16", "ADD_0335", "G4_0971", "G4_175", "V6 : "in- 后面跟 p、b、m 就变成 im-（impossible），跟 l 变 il-（illegal），跟 r 变 ir-（irregular）。不是它们想变，是嘴巴偷懒，说起来更顺——看懂这条，双写字母就不用死记了", "beats": [{"beat": "嘴巴偷懒", "kid": "in- 的尾巴 /n/ 碰到嘴唇音（p、b、m），自己先变成 /m/，写出来就是 im-；碰到 l、r，就变得和后面一模一样，还多写一个——双写字母就是这么来的。", "adult": "同化只解释前缀末尾一格的变化，词根内部的双写（如 accommodate 中段）另有来源，不可一例推全词。发音事实可验证：in- 的鼻音在唇音前实际读作 /m/（input 口语中即如此）。"}], "statement": "拉丁前缀末尾辅音向后接词根的首辅音同化（顺同化），拼写把发音妥协固定下来：in-→im-（唇音前）/il-（l 前）/ir-（r 前），con-→com-/col-/cor-/co-，ad-→ac-/af-/ag-/al-/an-/ap-/ar-/as-/at-，sub-→suc-/suf-/sug-/sum-/sup-/sur-/sus-，dis-→dif-，ob-→oc-/of-/op-，ex-→ef-/e-；同化处几乎都产生双写字母，是英语双辅音拼写的一大来源", "sources": ["Monmouth College 古典学课程讲义；Stone《Morphology Masterclass》；RSIS Morphology Scope and Sequence『assimilated prefixes』专节"], "boundary": "历史化石非活规则（input 保 n）；同形 in- 两职须先辨；同化只解释前缀末格"}], "opp": null, "oppLink": null, "note": "成员口径：挂接表 V-34 引用（按词形回链词库）＋扩充出处 V-34，合并去重；变体形与双写留痕见各词卡的注与 gloss。", "glosses": [], "sections": [{"head": "ad- 系", "words": ["ADD_0393", "ADD_0394", "ADD_0398", "ADD_0399", "ADD_0401", "ADD_0402", "ADD_0403", "ADD_0408", "ADD_0409", "G6_0472", "ADD_0411", "ADD_0412", "ADD_0414", "V6_交通_56", "ADD_0417", "ADD_0418", "ADD_0419", "ADD_0420"]}, {"head": "in- 系", "words": ["ADD_0530", "ADD_0531", "ADD_0533", "ADD_0534", "G6_0476", "ADD_0159", "ADD_0547", "ADD_0548", "ADD_0549"]}, {"head": "sub- 系", "words": ["ADD_0664", "ADD_0665", "ADD_0667", "ADD_0669", "ADD_0670", "ADD_0672", "ADD_0673", "G6_0682", "ADD_0674", "ADD_0675", "ADD_0676", "ADD_0677"]}, {"head": "con- 系", "words": ["ADD_0455", "G5_0521", "ADD_0456", "ADD_0459", "ADD_0464", "ADD_0465"]}, {"head": "ob- 系", "words": ["ADD_0589", "ADD_0591", "ADD_0592"]}, {"head": "ex- 系", "words": ["ADD_0493", "ADD_0494", "ADD_0495", "ADD_0502", "ADD_0099"]}, {"head": "per- 系", "words": ["G5_0675"]}, {"head": "其他变体", "words": ["ADD_0416", "ADD_0454", "ADD_0463", "ADD_0479", "ADD_0077", "G5_0342", "ADD_0078", "ADD_0481", "G6_0519", "ADD_0096", "ADD_0545", "ADD_0237", "G6_0469"]}], "words": [], "pending": null, "quiz": [{"s 』与『可组合解义』是两个独立判断（与 V-10 透明性谱、V-15 拆词纪律同轴）。词源动机无定论处须保持 perhaps 级措辞。"}], "statement": "三型病理：①伪词缀——butter 源于希腊语 boútyron 经拉丁语借入，-er 是借词词干的一部分，与施事 -er 无关；river 经古法语上溯拉丁语 rīpa（河岸），-er 同为词干残段。②可分割而不可组合——butterfly 分割成立（古英语 buttorflēoge = butter + fly），但命名动机晦暗无定论。③古义残留——understandan 确由 under + standan 构成，但前缀取古义『在……之间』，现代义无法由今义拼出", "sources": ["Collins / AHD / Random House 词典著录；Etymonline butterfly 条；OED 观点经 Language Log 转述"], "boundary": "不许硬拆≠不许联想（助记与词源分开标）；动机无定论处保持 perhaps 级措辞"}, {"id": "V-15", "headline": "词的可分析性从全透明到全不透明是一条连续谱：透明的真拆，不透明的整记，半透明的注明『只是帮记』；假分析会给记忆挂上错误的故事", "kid": "有些词是真积木，能拆开看；有些词看着像积木，其实是一整块石头，硬拆会拆错——拆之前先确认它真的是积木", "beats": [{"beat": "透明度谱", "kid": "拆词前先看它站在谱的哪一头：一看就懂的真积木，放心拆；半懂不懂的，拆开只是帮记，要说清；完全是石头的，整块记住它。", "adult": "透明度谱的量化分布见 V-32（SEM 0–5）；本条立拆词纪律，与 V-10、V-38 同轴。"}], "statement": "形态透明度决定『分析』是否有助于记忆：真构词的分析接通词族网络，假分析污染词义与历史两层；教学动作随词在谱上的位置而变", "sources": ["Nation (2001) word parts 章；Bauer & Nation (1993) IJL 6(4): 253–279，DOI 10.1093/ijl/6.4.253（书目 2026-11-01 补核）"], "boundary": "分级表基于成人学术语料，儿童清单须裁剪"}], "opp": null, "oppLink": null, "note": "", "glosses": [], "sections": null, "words": [], "pending": [{"word": "bishop", "bank_id": "ADD_0430", "candidate": "bi- + shop", "reason": "假拆：bishop 源古英语 biscop（主教），与 bi-/shop 均无关", "ref": "V-38"}, {"word": "coach", "bank_id": "G6_274", "candidate": "co- + ach(e)", "reason": "假拆：coach 源匈牙利语地名 Kocs 的马车词，与 co- 无关", "ref": "V-38"}, {"word": "email", "bank_id": "G3_K31", "candidate": "e- + mail", "reason": "e-（electronic）为现代首字母缩合件，不在 V-33 二十前缀与目录词干清单内，口径待裁", "ref": "V-20"}, {"word": "improv", "bank_id": "ADD_0361", "candidate": "im- + prove", "reason": "实为 improvisation 的截短（V-20 截短机），非 im- 前缀", "ref": "V-20"}, {"word": "person", "bank_id": "V6_家庭_28", "candidate": "per- + son", "reason": "假拆：person 源拉丁 persōna（面具），son 为巧合子串", "ref": "V-38"}, {"word": "present", "bank_id": "G4_0993", "candidate": "pre- + sent", "reason": "词源为拉丁 prae-esse「在面前」，sent 非「感觉」根的此处形，教学拆易误导，待裁", "ref": "V-38"}, {"word": "regal", "bank_id": "ADD_06         const zero = p.count===0;
        h += '<button class="chip'+(zero?' zero':'')+'" data-page="'+pid+'">'+esc(p.label)
           + '<span class="bdg">'+(zero? '0 · 待补词' : p.count)+'</span></button>';
      });
      h += '</div>';
    });
    h += '</div>';
  });
  h += '<div class="card"><h2>练习口径（V-30）</h2>'+ lawBlock(DATA.practice, '零件＋语境，双通道') +'</div>';
  v.innerHTML = h;
}
function quizHTML(p){
  if(!p.quiz || !p.quiz.length) return '';
  let h = '<div class="sec">✏️ 练习（拆词题）</div><div class="qprog" style="color:#7386a0;font-size:13.5px">已答对 <span class="qdone-n">0</span> / '+p.quiz.length+' 题</div>';
  p.quiz.forEach((q, i)=>{
    h += '<div class="qbox" data-q="'+i+'"><div class="stem">第 '+(i+1)+' 题 · '+esc(q.stem)+'</div>';
    q.options.forEach((o, j)=>{ h += '<button class="qopt" data-q="'+i+'" data-o="'+j+'">'+esc(o)+'</button>'; });
    h += '<div class="qhint">'+esc(q.hint)+'</div></div>';
  });
  h += '<div class="qfin hidden qdone">🎉 全部答对。答错时只提示回讲解，这正是 V-30 的学法：零件先行，语境补强。</div>';
  return h;
}
function openPage(pid){
  savedScroll = window.scrollY || document.documentElement.scrollTop;
  const p = P[pid]; curQuiz = {p: p, done: new Set()};
  const v = document.getElementById('view-detail');
  let h = '<button class="backbtn" id="btn-back">← 返回面板</button>';
  h += '<h2 class="ptitle">'+esc(p.label)+'</h2><div class="countline">本页共 '+p.count+' '+(p.pending? '个登记词' : '个词')+' · 讲解原文出处见各段标注</div>';
  if(p.note) h += '<div class="note" style="margin-top:12px">'+esc(p.note)+'</div>';
  if(p.glosses && p.glosses.length) h += '<div style="margin-top:12px"><b>义项分工（词卡数据原文）：</b><br>'+p.glosses.map(g=>'<span class="gloss">'+esc(g)+'</span>').join('')+'</div>';
  h += '<div class="sec">📖 讲解（原文引用）</div>';
  p.laws.forEach(l=>{ h += lawBlock(l); });
  if(p.opp){
    h += '<div class="sec">⚔️ 易混对手</div>' + lawBlock(p.opp, '对手规律 '+p.opp.id);
  }
  if(p.oppLink) h += '<button class="navchip" data-page="'+p.oppLink[0]+'">→ '+esc(p.oppLink[1])+'</button>';
  if(p.pending){
    h += '<div class="sec">🚫 假拆名单（每条附裁定理由）</div><div class="grid">';
    p.pending.forEach(it=>{
      h += '<div class="pend" data-word="'+esc(it.word)+'"><span class="w">'+esc(it.word)+'</span>'
         + '<div class="cand">✗ 想拆成：'+esc(it.candidate)+'</div>'
         + '<div class="rsn">'+esc(it.reason)+'</div>'
         + '<div class="src">裁定出处：'+esc(it.ref)+' · 词库编号 '+esc(it.bank_id)+'</div></div>';
    });
    h += '</div>';
  } else if(p.sections){
    p.sections.forEach(s=>{
      h += '<div class="sec">'+esc(s.head)+' · '+s.words.length+' 词</div><div class="grid">' + s.words.map(wordCard).join('') + '</div>';
    });
  } else if(p.words && p.words.length){
    h += '<div class="sec">👨‍👩‍👧 家族全词表（A–Z）</div><div class="grid">' + p.words.map(wordCard).join('') + '</div>';
  }
  h += quizHTML(p);
  v.innerHTML = h;
  document.getElementById('view-index').classList.add('hidden');
  v.classList.remove('hidden');
  window.scrollTo(0, 0);
  document.getElementById('btn-back').addEventListener('click', back);
}
function back(){
  document.getElementById('view-detail').classList.add('hidden');
  const v = document.getElementById('view-index');
  v.classList.remove('hidden');
  window.scrollTo(0, savedScroll);
}
document.addEventListener('click', function(e){
  const sp = e.target.closest('[data-say]');
  if(sp){ speak(sp.getAttribute('data-say')); return; }
  const ch = e.target.closest('[data-page]');
  if(ch && !ch.classList.contains('qopt')){ openPage(ch.getAttribute('data-page')); return; }
  const qo = e.target.closest('.qopt');
  if(qo && curQuiz){
    const qi = +qo.getAttribute('data-q'), oi = +qo.getAttribute('data-o');
    const q = curQuiz.p.quiz[qi];
    const box = qo.closest('.qbox');
    if(curQuiz.done.has(qi)) return;
    if(oi === q.answer){
      qo.classList.add('ok'); curQuiz.done.add(qi);
      box.querySelector('.qhint').style.display = 'none';
      const dv = document.querySelector('#view-detail');
      dv.querySelector('.qdone-n').textContent = curQuiz.done.size;
      if(curQuiz.done.size === curQuiz.p.quiz.length) dv.querySelector('.qfin').classList.remove('hidden');
    } else {
      qo.classList.add('bad');
      box.querySelector('.qhint').style.display = 'block';
    }
  }
});
renderIndex();
</script>
</body>
</html>
