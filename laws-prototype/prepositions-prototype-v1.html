function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function phOf(b) { return b[4] || b[1] || ''; }
function speakWord(t) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-GB'; u.rate = 0.85;
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]GB/i.test(v.lang));
    if (vs.length) u.voice = vs[0];
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener('click', e => {
  const spk = e.target.closest ? e.target.closest('.spk') : null;

  const nav = e.target.closest ? e.target.closest('[data-unit],[data-home],[data-table]') : null;

}, true);

  h += '<div class="sub">' + u.id + ' · 小系统区 · 介词</div>';
  h += '<div class="lawbox"><div class="kid">📖 ' + esc(u.kid) + '</div><div class="src">讲解取自规律模型原文（' + u.id + '）</div></div>';
  h += '<h3 class="sec">🧩 机制：这张图怎么长</h3>';
  u.beats.forEach(b => {
    h += '<div class="beat"><div class="bt">' + esc(b.beat) + '</div><div class="bk">' + esc(b.kid) + '</div>' +
         (b.vis ? '<div class="bv">示意：' + esc(b.vis) + '</div>' : '') + '</div>';
  });
  h += '<h3 class="sec">📝 例句（点词卡上的小喇叭听单词）</h3>';
  u.exs.forEach(ex => {
    h += '<div class="ex"><div class="s">' + esc(ex.s) + ' <button class="spk" type="button" data-t="' + esc(ex.s) + '" aria-label="读整句">🔊</button></div>' +
         (ex.note ? '<div class="note">' + esc(ex.note) + '</div>' : '') + '<div class="ws">' +
         ex.w.map(wid => { const b = DATA.bank[wid]; return b ? '<span class="wchip">' + esc(b[0].split(' / ')[0]) + '<button class="spk" type="button" data-t="' + esc(b[0].split(' / ')[0]) + '">🔊</button></span>' : ''; }).join('') +
         '</div></div>';
  });
  h += '<p><span class="badge">本单元词表 · 共 ' + u.words.length + ' 词 · 全部来自词库</span></p>';
  h += '<div class="grid">' + [...u.words].sort(cmpW).map(wordCard).join('') + '</div>';
  if (u.errs.length) {
    h += '<h3 class="sec">🏥 病句医院</h3>';
    u.errs.forEach(c => { h += '<div class="errbox">' + esc(c.t) + (c.wrong ? '：❌ ' + esc(c.wrong) : '') + (c.right ? ' → ✅ ' + esc(c.right) : '') + '</div>'; });
  } else {
    h += '<div class="errbox">🏥 病句医院：病例待补' + (u.pend && u.pend.length ? '（易错类型已登记：' + esc(u.pend.join('、')) + '；逐字病例待真实错例补录后上线）' : '') + '</div>';
  }
  if (u.quiz.length) {
    h += '<div class="quiz"><h3>🧪 练一练（题目取自规律模型）</h3><div id="quiz"></div>' +
         '<div class="hint" id="hint"></div></div>';
  }
  app.innerHTML = h;
  window.scrollTo(0, 0);
  if (u.quiz.length) runQuiz(u);
}

function runQuiz(u) {
  const qz = document.getElementById('quiz');
  const hint = document.getElementById('hint');
  let qi = 0, score = 0;
  function ask() {
    if (qi >= u.quiz.length) { qz.innerHTML = '<p>🎉 练习完成：对了 ' + score + ' / ' + u.quiz.length + '。不懂的地方回到上面的机制图再看看。</p>'; return; }
    const q = u.quiz[qi];
    const opts = q.opts.slice();
    for (let i = opts.length - 1; i > 0; i--) { const j = (i * 7 + qi + u.ord) % (i + 1); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
    qz.innerHTML = '<p>第 ' + (qi + 1) + ' / ' + u.quiz.length + ' 题：' + esc(q.q) + '</p><div class="opts">' +
      opts.map(o => '<button class="opt" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
    qz.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.o === q.ans) { btn.classList.add('ok'); score++; qi++; setTimeout(ask, 450); }
      else {
        btn.classList.add('no');
        let ht = '再想想：回到上面的讲解和机制图看看。👆';
        const m = /^mechanism\[(\d+)\]$/.exec(q.hint || '');
        if (m && u.beats[+m[1]]) ht = '提示（' + esc(u.beats[+m[1]].beat) + '）：' + esc(u.beats[+m[1]].kid);
        hint.textContent = ht; hint.style.display = 'block';
      }
    }));
  }
  ask();
}

function tablePage() {
  let h = '<a class="back" data-home="1">← 返回单元菜单</a>';
  h += '<div class="big">介词总表</div>';
  h += '<div class="sub">词库中词性含「介词」的全部词 · 按字段现算 · A–Z</div>';
  h += '<p><span class="badge">共 ' + DATA.prep.length + ' 词 · 全部来自词库</span></p>';
  h += '<div class="grid">' + [...DATA.prep].sort(cmpW).map(wordCard).join('') + '</div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
home();
</script>
