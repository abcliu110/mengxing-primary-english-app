h += '<h3 style="margin:8px 0 4px">模型里用到它的句子</h3>' + p.examples.map(ex =>
'<div class="exrow"><span class="sent">' + hl(ex.s, cur) + '</span><button class="spk" data-say="' + esc(ex.s) + '" aria-label="朗读整句">🔊</button>' +
'<div class="note">出处：' + esc(ex.law) + (ex.note? '｜' + esc(ex.note): '') + '</div></div>').join('');
}
sec.innerHTML = h + '</div>';
return;
}
sec.innerHTML = p.groups.map(g =>
'<details class="grp"' + (g.domain === '空间'? ' open': '') + '><summary>' + esc(g.label) + '（' + g.nodes.length + '）</summary>' +
g.nodes.map(n => nodeHTML(n, cur)).join('') + '</details>').join('');
}
function renderErrors() {
const p = DATA.pages[cur];
const errs = p.family? (p.errors || []): [];
if (!errs.length) { $('errSec').innerHTML = ''; return;}
$('errSec').innerHTML = '<h2 class="sec">病句医院</h2>' + errs.map(e =>
'<div class="err"><b>' + esc(e.type) + '</b> <span class="badge gray">' + esc(e.status) + '</span>' +
'<div class="note" style="margin-top:4px">' + esc(e.note) + '（' + esc(e.law) + '）</div></div>').join('');
}
/* 练习：就地作答，一次一题 */
function quizEngine(box, quizzes, label) {
if (!quizzes ||!quizzes.length) { box.innerHTML = ''; return;}
let qi = 0, score = 0;
function ask() {
if (qi >= quizzes.length) {
box.innerHTML = '<div class="quiz">🎉 ' + label + '完成：对了 ' + score + ' / ' + quizzes.length + ' 题。</div>';
return;
}
const q = quizzes[qi];
box.innerHTML = '<div class="quiz"><div class="src">练习 · 出自 ' + esc(q.law) + ' 号规律 · 第 ' + (qi + 1) + ' / ' + quizzes.length + ' 题</div>' +
'<p style="font-size:15.5px;margin:8px 0">' + esc(q.q) + '</p>' +
q.options.map(o => '<button class="opt" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') +
'<div class="hint"></div></div>';
box.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
if (btn.dataset.o === q.answer) {
btn.classList.add('ok'); score++; qi++;
setTimeout(ask, 480);
} else {
btn.classList.add('no');
const hint = box.querySelector('.hint');
hint.style.display = 'block';
hint.textContent = '再想想（机制原话）：' + (q.hint || '');
}
}));
}
ask();
}
function renderQuiz() {
const p = DATA.pages[cur];
quizEngine($('quizSec'), p.family? (p.quizzes || []): [], '「' + cur + '」的练习');
}
function renderAdult() {
const p = DATA.pages[cur];
const ad = $('adultSec');
const items = p.family? (p.adult || []): [];
if (!items.length) { ad.style.display = 'none'; ad.innerHTML = ''; return;}
ad.style.display = '';
ad.innerHTML = '<summary>成人层 · ' + esc(cur) + ' 的边界与出处（' + items.length + ' 条规律）</summary>' +
items.map(a => '<div style="margin:10px 0"><b>' + esc(a.law) + '</b>' + (a.teacher? '（教师侧）': '') +
(a.boundary? '<div>边界：' + esc(a.boundary) + '</div>': '') +
(a.beats || []).map(t => '<div>· ' + esc(t) + '</div>').join('') +
(a.sources && a.sources.length? '<div class="src">出处：' + a.sources.map(esc).join('；') + (a.grade? '（' + esc(a.grade) + '）': '') + '</div>': '') + '</div>').join('');
}
/* ---------- 方法节（页面底部，常驻折叠） ---------- */
(function renderMethod() {
const m = DATA.method;
$('methodSec').innerHTML = '<summary>📖 介词是这样学的（方法四条）</summary>' +
m.map(x => '<div class="node"><span class="law">' + esc(x.law) + '</span><div class="head">' + esc(x.headline) + '</div>' +
(x.beats || []).map(b => '<div class="beat"><b>' + esc(b.beat) + '</b>｜' + esc(b.text) + '</div>').join('') + '</div>').join('') +
'<div id="methodQuiz"></div>';
const qs = [];
m.forEach(x => (x.quiz || []).forEach(q => qs.push(Object.assign({ law: x.law}, q))));
quizEngine($('methodQuiz'), qs, '方法练习');
})();
/* ---------- 交互：三视图 ---------- */
function renderQS() {
const p = DATA.pages[cur];
const opps = p.family? (p.opponents || []): [];
$('qsCard').style.display = opps.length? '': 'none';
$('qsRow').innerHTML = opps.map(o =>
'<button class="opp" data-qs="' + esc(o.word) + '"><b>' + esc(o.word) + '</b> <small style="color:#93a3b5">共 ' + o.laws.length + ' 条规律</small></button>').join('');
}
function renderDetail() { renderHead(); renderDetailStage(); renderQS(); renderOpps(); renderChain(); renderErrors(); renderQuiz(); renderAdult();}
function showView(v) {
view = v;
$('view-index').style.display = v === 'index'? '': 'none';
$('view-detail').style.display = v === 'detail'? '': 'none';
$('view-compare').style.display = v === 'compare'? '': 'none';
window.scrollTo(0, 0);
}
function goDetail(w) { cur = w; markStrip(); renderDetail(); showView('detail');}
function pickFromPanel(w) {
if (!cmpOn) { goDetail(w); return;}
if (w === cmpA) { cmpA = cmpB; cmpB = null;}
else if (w === cmpB) { cmpB = null;}
else if (!cmpA) cmpA = w;
else cmpB = w;
syncCmpUI(); markStrip();
}
$('panels').addEventListener('click', e => {
const c = e.target.closest('[data-w]');
if (c) pickFromPanel(c.dataset.w);
});
$('cmpToggle').addEventListener('click', () => {
cmpOn = !cmpOn;
if (!cmpOn) { cmpA = null; cmpB = null;}
syncCmpUI(); markStrip();
});
$('cmpBar').addEventListener('click', e => {
if (e.target.id === 'cmpGo' && cmpA && cmpB) { renderCompareStage(); showView('compare');}
if (e.target.id === 'cmpClear') { cmpA = null; cmpB = null; syncCmpUI(); markStrip();}
});
$('qsRow').addEventListener('click', e => {
const o = e.target.closest('[data-qs]');
if (o) goDetail(o.dataset.qs);
});
$('oppRow').addEventListener('click', e => {
const o = e.target.closest('[data-opp]');
if (o) goDetail(o.dataset.opp);
});
$('backBtn').addEventListener('click', () => showView('index'));
$('backBtnC').addEventListener('click', () => showView('index'));
document.addEventListener('click', e => {
const sp = e.target.closest? e.target.closest('[data-say]'): null;
if (sp) { e.stopPropagation(); speak(sp.getAttribute('data-say'));}
});
syncCmpUI();
markStrip();
renderDetail();
showView('index');

</script>
</body>
</html>
