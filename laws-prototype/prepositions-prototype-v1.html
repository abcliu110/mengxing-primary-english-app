const app = document.getElementById('app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function boldPreps(sentence){
  let out = esc(sentence);
  const words = DATA.prepset.slice().sort((a,b)=>b.length-a.length);
  for (const w of words) {
    const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'gi');
    out = out.replace(re, m => '<b class="prep">' + m + '</b>');
  }
  return out;
}
function boldOne(sentence, prep){
  const out = esc(sentence);
  const re = new RegExp('\\b' + prep.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'i');
  return out.replace(re, m => '<b class="prep">' + m + '</b>');
}

    + '<path id="upArrow" class="arrow" d="M238 152 V66 M224 86 L238 60 L252 86" style="display:none"/>' + M + '</svg>';
  if (mode === 'time') return '<svg viewBox="0 0 320 200">'
    + '<g data-hl="in"><rect class="tband" x="25" y="28" width="270" height="32" rx="16"/></g>'
    + '<g data-hl="on"><rect class="tcell" x="25" y="80" width="86" height="56"/>'
    + '<line class="tgrid" x1="54" y1="80" x2="54" y2="136"/><line class="tgrid" x1="83" y1="80" x2="83" y2="136"/><line class="tgrid" x1="25" y1="108" x2="111" y2="108"/></g>'
    + '<g data-hl="at"><line class="tline" x1="150" y1="148" x2="296" y2="148"/><circle class="tpoint" cx="222" cy="148" r="6"/></g>'
    + M + '</svg>';
  if (mode === 'point3') return '<svg viewBox="0 0 320 200">'
    + '<line class="ground" x1="8" y1="170" x2="312" y2="170"/>'
    + '<g data-hl="to"><rect class="panelbox" x="18" y="34" width="76" height="122" rx="8"/>'
    + '<rect class="bldg" x="40" y="52" width="34" height="88"/><path class="arrow" d="M8 148 H40"/></g>'
    + '<g data-hl="for"><rect class="panelbox" x="122" y="34" width="100" height="122" rx="8"/>'
    + '<rect class="surf" x="146" y="88" width="52" height="34"/><line class="tgrid" x1="172" y1="88" x2="172" y2="122"/><line class="tgrid" x1="146" y1="105" x2="198" y2="105"/></g>'
    + '<g data-hl="at"><rect class="panelbox" x="238" y="34" width="72" height="122" rx="8"/>'
    + '<circle class="ring" cx="266" cy="98" r="24"/><circle class="ring" cx="266" cy="98" r="13"/><circle class="dotpt" cx="266" cy="98" r="4"/></g>'
    + M + '</svg>';
  if (mode === 'particle') return '<svg viewBox="0 0 320 200">'
    + '<line class="ground" x1="8" y1="170" x2="312" y2="170"/>'
    + '<rect id="fill" class="water" x="36" y="150" width="88" height="14" style="display:none"/>'
    + '<path class="boxw" d="M30 72 V170 H130 V72 H119 V158 H41 V72 Z"/>'
    + '<line class="tline" x1="246" y1="86" x2="246" y2="170"/><circle id="lampBall" class="lamp" cx="246" cy="62" r="17"/>' + M + '</svg>';
  if (mode === 'path') return '<svg viewBox="0 0 320 200">'
    + '<line class="ground" x1="8" y1="170" x2="312" y2="170"/>'
    + '<path class="river" d="M158 0 q16 50 0 100 q-16 50 0 100"/>'
    + '<path class="boxw" d="M235 102 V170 H300 V102 H290 V158 H245 V102 Z"/>'
    + '<circle class="dotpt" cx="52" cy="140" r="4"/>'
    + '<path id="arc" class="arc" d="M52 132 Q140 60 208 128" style="display:none"/>' + M + '</svg>';
  return '';
}
function setStage(u, prep){
  const c = u.chips.find(x => x.w === prep);
  document.querySelectorAll('.chip').forEach(el => el.classList.toggle('on', el.dataset.prep === prep));
  const pos = (POS[u.mode] || {})[prep];
  const mover = document.getElementById('mover');
  if (mover) {
    if (pos) {
      mover.style.display = '';
      mover.setAttribute('transform', 'translate(' + pos[0] + ',' + pos[1] + ')');
      const ball = mover.querySelector('circle');
      if (ball) ball.setAttribute('r', pos[2] || 11);
    } else mover.style.display = 'none';
  }
  const arc = document.getElementById('arc');
  if (arc) arc.style.display = (prep === 'over' || prep === 'across') ? '' : 'none';
  const water = document.getElementById('water');
  if (water && u.mode === 'rise') { water.setAttribute('y', prep === 'up' ? 82 : 138); water.setAttribute('height', prep === 'up' ? 82 : 26); }
  const upArrow = document.getElementById('upArrow');
  if (upArrow) upArrow.style.display = prep === 'up' ? '' : 'none';
  const fill = document.getElementById('fill');
  if (fill && u.mode === 'particle') fill.style.display = prep === 'up' ? '' : 'none';
  const lamp = document.getElementById('lampBall');
  if (lamp && u.mode === 'particle') lamp.setAttribute('class', prep === 'off' ? 'lamp off' : 'lamp');
  document.querySelectorAll('g[data-hl]').forEach(g => g.classList.toggle('on', g.dataset.hl === prep));
  const sent = document.getElementById('stageSent'), note = document.getElementById('stageNote'),
        gloss = document.getElementById('stageGloss');
  if (c && sent) {
    gloss.textContent = prep + ' · ' + c.meaning;
    if (c.sent) { sent.innerHTML = boldOne(c.sent, prep); note.textContent = c.note || ''; }
    else { sent.textContent = '（本单元的例句里还没有用到 ' + prep + ' 的句子）'; note.textContent = ''; }
  }
}

/* ---------- 视图 ---------- */
function home(){
  let h = '<h1>介词：先看图，再记词</h1>'
    + '<div class="sub">介词讲的是<b>空间关系</b>：换一个介词，图里的位置和整句话的意思就一起变。共 19 个单元，内容取自小系统模型 P 组。</div>';
  for (const u of DATA.units) {
    h += '<button class="unit-link" data-unit="' + u.id + '"><div class="t">' + u.id + ' · ' + esc(u.headline) + '</div>'
      + '<div class="m">' + u.chips.length + ' 个介词主角 · ' + u.examples.length + ' 句例句 · ' + u.quiz.length + ' 道练习</div></button>';
  }
  h += '<button class="unit-link" data-table="1"><div class="t">介词总表</div>'
    + '<div class="m">词库里全部 ' + DATA.table.length + ' 个介词（词形 + 中文义）</div></button>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function tableView(){
  let h = '<button class="back" data-home="1">← 返回</button><h1>介词总表</h1>'
    + '<div class="sub">由词库字段现算：词性含「介词」的共 ' + DATA.table.length + ' 个，按字母排序。</div>'
    + '<div class="card"><table class="prep">';
  for (const r of DATA.table) h += '<tr><td class="w">' + esc(r.w) + '</td><td>' + esc(r.meaning) + '</td></tr>';
  h += '</table></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function unitView(id){
  const u = DATA.units.find(x => x.id === id);
  if (!u) return home();
  let h = '<button class="back" data-home="1">← 返回</button>'
    + '<h1>' + u.id + ' · ' + esc(u.headline) + '</h1>';
  h += '<div class="card"><h3 class="sec">本单元主角（介词）</h3><div class="chips">'
    + (u.chips.length ? u.chips.map(c => '<button class="chip" data-prep="' + esc(c.w) + '">' + esc(c.w) + '</button>').join('')
                      : '（本单元没有单独的主角介词，看下面的讲解和例句）')
    + '</div><div class="kid">' + esc(u.kid) + '</div></div>';
  h += '<div class="card"><h3 class="sec">场景舞台：点一个介词，看位置和句子怎么变</h3><div class="stage">';
  if (u.mode === 'contrast') {
    for (const b of u.beats) h += '<div class="beat"><span class="b">' + esc(b.beat) + '</span>｜' + esc(b.text)
      + (b.visual ? '<div class="v">图式注：' + esc(b.visual) + '</div>' : '') + '</div>';
    if (u.chips.length) h += '<div class="sent" id="stageSent"></div><div class="note" id="stageNote"></div><div class="gloss" id="stageGloss"></div>';
  } else {
    h += sceneSVG(u.mode);
    h += '<div class="sent" id="stageSent"></div><div class="note" id="stageNote"></div><div class="gloss" id="stageGloss"></div>';
  }
  h += '</div></div>';
  if (u.mode !== 'contrast') {
    h += '<div class="card"><h3 class="sec">为什么是这个图（机制）</h3>';
    for (const b of u.beats) h += '<div class="beat"><span class="b">' + esc(b.beat) + '</span>｜' + esc(b.text)
      + (b.visual ? '<div class="v">图式注：' + esc(b.visual) + '</div>' : '') + '</div>';
    h += '</div>';
  }
  h += '<div class="card"><h3 class="sec">例句（点小喇叭听整句）</h3>';
  u.examples.forEach((x, i) => {
    h += '<div class="ex"><span class="s">' + boldPreps(x.sentence) + '</span>'
      + '<button class="sentbtn" data-sent="' + i + '">🔊 整句</button>'
      + (x.note ? '<div class="n">' + esc(x.note) + '</div>' : '') + '</div>';
  });
  h += '</div>';
  h += '<div class="card"><h3 class="sec">病句医院</h3>';
  for (const er of u.errors) {
    h += '<div class="pending"><b>病例待补</b>（易错类型已登记：' + esc(er.type) + '）<br>' + esc(er.note) + '</div>';
  }
  h += '</div>';
  u.quiz.forEach((q, qi) => {
    h += '<div class="card"><h3 class="sec">练习</h3><div style="font-size:16.5px">' + esc(q.q) + '</div><div id="quiz-' + qi + '">'
      + q.options.map(o => '<button class="opt" data-quiz="' + qi + '" data-opt="' + esc(o) + '">' + esc(o) + '</button>').join('')
      + '</div><div id="hint-' + qi + '"></div></div>';
  });
  app.innerHTML = h;
  window.scrollTo(0, 0);
  app.dataset.unit = u.id;
  if (u.chips.length) setStage(u, u.chips[0].w);
}
function answer(qi, optEl){
  const u = DATA.units.find(x => x.id === app.dataset.unit);
  const q = u.quiz[qi];
  const box = document.getElementById('quiz-' + qi), hint = document.getElementById('hint-' + qi);
  if (optEl.dataset.opt === q.answer) {
    box.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.dataset.opt === q.answer) o.classList.add('right'); });
    hint.innerHTML = '<div class="hint">✅ 答对了。</div>';
  } else {
    optEl.classList.add('wrong'); optEl.disabled = true;
    const b = u.beats[q.hint_idx] || u.beats[0];
    hint.innerHTML = '<div class="hint">再想想——回到机制看这一句：<b>' + esc(b.beat) + '</b>｜' + esc(b.text) + '</div>';
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-unit],[data-table],[data-home],[data-prep],[data-sent],[data-quiz]');
  if (!t) return;
  if (t.dataset.unit) unitView(t.dataset.unit);
  else if (t.dataset.table) tableView();
  else if (t.hasAttribute('data-home')) home();
  else if (t.dataset.prep) {
    const u = DATA.units.find(x => x.id === app.dataset.unit);
    if (u) setStage(u, t.dataset.prep);
  }
  else if (t.hasAttribute('data-sent')) {
    const u = DATA.units.find(x => x.id === app.dataset.unit);
    if (u) speak(u.examples[Number(t.dataset.sent)].sentence);
  }
  else if (t.hasAttribute('data-quiz')) answer(Number(t.dataset.quiz), t);
}, true);
home();
</script>
