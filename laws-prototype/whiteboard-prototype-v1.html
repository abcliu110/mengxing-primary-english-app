  #predict .hint { margin-top:9px; color:#d23c2a; font-size:16px; min-height:20px; }
  .shake { animation:shk .4s; } @keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  #capBar { margin-top:12px; background:#fffef9; border:2.5px solid #d8d2c0; border-radius:14px; padding:12px 18px; min-height:96px; }
  #cap { font-size:21px; line-height:1.5; }

  .wb2 .capBar { margin-top:12px; background:#fffef9; border:2.5px solid #d8d2c0; border-radius:14px; padding:12px 18px; min-height:96px; }
  .wb2 .cap { font-size:21px; line-height:1.5; }
  .wb2 .sentBar { margin-top:8px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

<script>
"use strict";
const $  = s => document.querySelector(s);

                pc6:[1270,620], pc7:[350,815], pc8:[655,815], pc9:[960,815] };
function roundedRect(x,y,w,h,r){
  return `M${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h} L${x+r} ${y+h} Q${x} ${y+h} ${x} ${y+h-r} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} Z`;
}

}
const spokesG = $('#gSpokes');
for (const id in SLOTS){
  const [x,y] = SLOTS[id];

  ln.setAttribute('d', `M800 512 L${x+150} ${y+86}`);

  hl.setAttribute('fill','none'); hl.setAttribute('stroke','#f08c1e'); hl.setAttribute('stroke-width','4');

/* ---------- clone the sitting cat into placeholder groups ---------- */
for (const gid of ['catC','catA2','catC2','catWatch','catCard']){
  const src = $('#catA'), dst = document.getElementById(gid);
  for (const ch of Array.from(src.children)) dst.appendChild(ch.cloneNode(true));
}

/* ---------- prep: dash-draw + dashed-wipe ---------- */
const penG = $('#penG');
function prep(){
  $$('.dp').forEach(el=>{
    const L = el.getTotalLength();
    el.dataset.len = L;
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
  });
  $$('.dw').forEach((el,i)=>{
    const bb = el.getBBox();
    const cp = document.createElementNS(NS,'clipPath');
    cp.setAttribute('id','cp'+i); cp.setAttribute('clipPathUnits','userSpaceOnUse');
    const r = document.createElementNS(NS,'rect');
    const vert = el.dataset.dir === 'v';
    r.setAttribute('x', bb.x-6); r.setAttribute('y', bb.y-6);
    r.setAttribute('width', vert ? bb.width+12 : 0);
    r.setAttribute('height', vert ? 0 : bb.height+12);
    cp.appendChild(r); svg.querySelector('defs').appendChild(cp);
    el.setAttribute('clip-path', `url(#cp${i})`);
    el._clip = { r, bb, vert };
  });
}
function penTo(el, p){
  try{
    const L = el.getTotalLength();
    const pt = el.getPointAtLength(L*Math.min(Math.max(p,0),1));
    const m = el.getCTM();
    if (!m) return;
    const x = m.a*pt.x + m.c*pt.y + m.e, y = m.b*pt.x + m.d*pt.y + m.f;
    penG.setAttribute('transform', `translate(${x} ${y})`);
  }catch(e){}
}
function penShow(v){ penG.setAttribute('opacity', v?1:0); }

/* ---------- animation primitives (all take instant flag) ---------- */
const raf = () => new Promise(r=>requestAnimationFrame(r));
function tween(dur, fn){
  if (dur<=0){ fn(1); return Promise.resolve(); }
  return new Promise(res=>{
    const t0 = performance.now();
    (function step(t){
      const p = Math.min((t-t0)/dur, 1);
      fn(p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2);
      if (p<1) requestAnimationFrame(step); else res();
    })(t0);
  });
}
function drawEl(el, dur, inst){
  if (!el) return Promise.resolve();
  const L = parseFloat(el.dataset.len);
  if (inst){ el.style.strokeDashoffset = 0; return Promise.resolve(); }
  penShow(true);
  return tween(dur, p=>{ el.style.strokeDashoffset = L*(1-p); penTo(el,p); }).then(()=>penShow(false));
}
function eraseEl(el, dur, inst){
  if (!el) return Promise.resolve();
  const L = parseFloat(el.dataset.len);
  if (inst){ el.style.strokeDashoffset = L; return Promise.resolve(); }
  penShow(true);
  return tween(dur, p=>{ el.style.strokeDashoffset = L*p; penTo(el,1-p); }).then(()=>penShow(false));
}
function drawAll(els, total, inst){
  els = els.filter(Boolean);
  const sum = els.reduce((a,e)=>a+parseFloat(e.dataset.len||1),0) || 1;
  let chain = Promise.resolve();
  els.forEach(el=>{ chain = chain.then(()=>drawEl(el, inst?0:Math.max(total*parseFloat(el.dataset.len||1)/sum, 40), inst)); });
  return chain;
}
function eraseAll(els, total, inst){
  els = els.filter(Boolean).slice().reverse();
  let chain = Promise.resolve();
  els.forEach(el=>{ chain = chain.then(()=>eraseEl(el, inst?0:Math.max(total/els.length,30), inst)); });
  return chain;
}
function wipeEl(el, dur, inst, dirn){
  if (!el || !el._clip) return Promise.resolve();
  const { r, bb, vert } = el._clip;
  const full = (vert ? bb.height : bb.width) + 12;
  const from = dirn<0 ? full : 0, to = dirn<0 ? 0 : full;
  if (inst){ r.setAttribute(vert?'height':'width', to); return Promise.resolve(); }
  penShow(true);
  return tween(dur, p=>{
    r.setAttribute(vert?'height':'width', from+(to-from)*p); penTo(el,p);
  }).then(()=>penShow(false));
}
function showEls(els, inst){ els.filter(Boolean).forEach(e=>{ e.style.transition = inst?'none':''; e.style.opacity = 1; }); }
function hideEls(els){ els.filter(Boolean).forEach(e=>{ e.style.opacity = 0; }); }
function sceneDrawables(g){
  return { dp: $$('.dp',g), dw: $$('.dw',g), fx: $$('.fx',g), tx: $$('.tx',g) };
}
function eraseScene(sel, total, inst){
  const g = $(sel); if (!g) return Promise.resolve();
  const d = sceneDrawables(g);
  hideEls(d.fx.concat(d.tx));
  let chain = eraseAll(d.dp, total*0.7, inst);
  d.dw.forEach(el=>{ chain = chain.then(()=>wipeEl(el, inst?0:total*0.3/d.dw.length, inst, -1)); });
  return chain;
}
function travel(arcEl, mover, dur, inst){
  const L = arcEl.getTotalLength();
  const setP = p=>{
    const pt = arcEl.getPointAtLength(L*p);
    const pt2 = arcEl.getPointAtLength(L*Math.min(p+0.012,1));
    const ang = Math.atan2(pt2.y-pt.y, pt2.x-pt.x)*180/Math.PI*0.45;
    mover.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${ang})`);
  };
  if (inst){ mover.setAttribute('opacity',0); setP(1); return Promise.resolve(); }
  mover.setAttribute('opacity',1);
  return tween(dur, setP).then(()=>{ mover.setAttribute('opacity',0); });
}
function camTo(name, inst){
  const tgt = CAMS[name];
  if (inst){ camCur = tgt.slice(); svg.setAttribute('viewBox', camCur.join(' ')); return Promise.resolve(); }
  const from = camCur.slice();
  return tween(750, p=>{
    camCur = from.map((v,i)=>v+(tgt[i]-v)*p);
    svg.setAttribute('viewBox', camCur.join(' '));
  });
}

/* ---------- narration / sentence / speech ---------- */
let curSent = '';
function setCap(t){ $('#cap').textContent = t; }
function setSent(html, plain){
  curSent = plain;
  if (!plain){ $('#sentBar').hidden = true; return; }
  $('#sent').innerHTML = html; $('#sentBar').hidden = false;
}
$('#speakBtn').addEventListener('click', ()=>{
  if (!curSent) return;
  try{
    const u = new SpeechSynthesisUtterance(curSent);
    u.lang = 'en-GB'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('en-gb'));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
});

/* ---------- prediction pauses ---------- */
const predBox = $('#predict');
let predOpen = false;
function predict(spec, inst){
  if (inst) return Promise.resolve();
  return new Promise(res=>{
    predOpen = true;
    predBox.querySelector('.q').textContent = spec.q;
    predBox.querySelector('.hint').textContent = '';
    const opts = predBox.querySelector('.opts'); opts.innerHTML = '';
    spec.opts.forEach(o=>{
      const b = document.createElement('button');
      b.textContent = o.t;
      b.addEventListener('click', ()=>{
        if (o.ok){
          predBox.classList.remove('shake'); predBox.hidden = true; predOpen = false; res();
        } else {
          b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
          predBox.querySelector('.hint').textContent = spec.hint;
        }
      });
      opts.appendChild(b);
    });
    predBox.hidden = false;
  });
}

/* ---------- reset ---------- */
function resetAll(){
  $$('.dp').forEach(el=>{ el.style.strokeDashoffset = el.dataset.len; });
  $$('.dw').forEach(el=>{ if (el._clip) el._clip.r.setAttribute(el._clip.vert?'height':'width', 0); });
  $$('.fx,.tx').forEach(el=>{ el.style.opacity = 0; });
  $('#gCore').setAttribute('opacity',0);
  $('#gCore').style.transform = '';
  $('#catLeap').setAttribute('opacity',0);
  $('#markerG').setAttribute('transform','translate(640,0)');
  predBox.hidden = true; predOpen = false;
  camCur = CAMS.hook.slice(); svg.setAttribute('viewBox', camCur.join(' '));
  setSent('', '');
}

<script>
"use strict";
/* ================= BEATS ================= */
const D  = (sel,total)=>inst=>drawAll($$(sel), total, inst);
const D1 = (sel,dur)=>inst=>drawEl($(sel), dur, inst);
const DS = (sel,from,to,total)=>inst=>drawAll($$(sel).slice(from,to), total, inst);
const W  = (sel,dur)=>inst=>wipeEl($(sel), dur, inst, 1);
const WE = (sel,dur)=>inst=>wipeEl($(sel), dur, inst, -1);
const SH = sel=>inst=>{ showEls($$(sel), inst); return Promise.resolve(); };
const DL = ms=>inst=>inst?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const SQ = (...fns)=>inst=>fns.reduce((p,f)=>p.then(()=>f(inst)), Promise.resolve());
const CM = name=>inst=>camTo(name, inst);
const ES = (sel,total)=>inst=>eraseScene(sel, total, inst);
const CATGO = (arcSel, sitSel, dur)=>inst=>
  travel($(arcSel), $('#catLeap'), inst?0:dur, inst).then(()=>drawAll($$(sitSel+' .dp'), inst?0:450, inst));
function pcShow(id){
  return inst=>{
    const g = $('#'+id);
    let chain = drawAll($$('.dp',g), inst?0:850, inst);
    $$('.dw',g).forEach(el=>{ chain = chain.then(()=>wipeEl(el, inst?0:320, inst, 1)); });
    chain = chain.then(()=>{ showEls($$('.fx',g).concat($$('.tx',g)), inst); });
    return chain;
  };
}
function buildCard(inst){
  const core = $('#gCore');
  const finish = ()=>{
    $('#arcGhost').setAttribute('opacity',0); $('#arcGhost').removeAttribute('transform');
    core.setAttribute('opacity',1);
    $('#coreFrame').style.strokeDashoffset = 0;
    wipeEl($('#coreArc'), 0, true, 1);
    showEls($$('#gCore .fx').concat($$('#gCore .tx')), true);
    return Promise.resolve();
  };
  if (inst) return camTo('full', true).then(finish);
  return camTo('full', false).then(async ()=>{
    const ghost = $('#arcGhost'), a = $('#arcMain'), c = $('#coreArc');
    const b1 = a.getBBox(), b2 = c.getBBox();
    const sx = b2.width/b1.width, sy = b2.height/b1.height;
    const tx = b2.x - sx*b1.x, ty = b2.y - sy*b1.y;
    ghost.setAttribute('opacity',1);
    await tween(950, p=>{
      ghost.setAttribute('transform', `translate(${tx*p} ${ty*p}) scale(${1+(sx-1)*p} ${1+(sy-1)*p})`);
    });
    ghost.setAttribute('opacity',0); ghost.removeAttribute('transform');
    core.setAttribute('opacity',1);
    await drawEl($('#coreFrame'), 650, false);
    await wipeEl($('#coreArc'), 650, false, 1);
    showEls($$('#gCore .fx').concat($$('#gCore .tx')), false);
  });
}
function moveCardCenter(inst){
  const core = $('#gCore');
  core.style.transformBox = 'fill-box'; core.style.transformOrigin = 'center';
  core.style.transition = inst ? 'none' : 'transform .95s ease';
  core.style.transform = 'translate(-575px,385px) scale(1.12)';
  return inst ? Promise.resolve() : DL(1000)(false);
}
const PC_SENTS = {

/* ================= ENGINE ================= */
let cur = -1, playing = false, chainToken = 0;
const nextBtn = $('#nextBtn'), prevBtn = $('#prevBtn');
async function runBeat(i, inst){
  const b = beats[i];
  setCap(b.cap);
  if (b.sent) setSent(b.sentHtml, b.sent);
  for (const a of b.acts || []) await a(inst);
  if (b.predict) await predict(b.predict, inst);
  cur = i; updateUI();
}
function updateUI(){
  $('#prog').textContent = cur < 0 ? `共 ${beats.length} 拍` : `第 ${cur+1} / ${beats.length} 拍`;
  prevBtn.disabled = playing || cur <= 0;
  nextBtn.disabled = playing || predOpen || cur >= beats.length-1;
  nextBtn.textContent = cur >= beats.length-1 ? '🎉 学完啦' : '下一拍 ▶';
  $$('.dot').forEach((d,i)=>{
    d.classList.toggle('done', i < cur);
    d.classList.toggle('now', i === cur);
  });
}
async function gotoBeat(n){
  if (playing) return;
  playing = true; updateUI();
  resetAll(); cur = -1;
  for (let i = 0; i <= n && i < beats.length; i++) await runBeat(i, true);
  playing = false; updateUI();
}
async function chainPlay(from, to){
  const tk = ++chainToken;
  playing = true; updateUI();
  for (let i = from; i <= to && i < beats.length; i++){
    if (tk !== chainToken) break;
    await runBeat(i, false);
    if (tk !== chainToken) break;
    if (i < to) await DL(650)(false);
  }
  playing = false; updateUI();
}
nextBtn.addEventListener('click', ()=>{
  if (playing || predOpen || cur >= beats.length-1) return;
  if ($('#autoChk').checked){ chainPlay(cur+1, beats.length-1); return; }
  playing = true; updateUI();
  runBeat(cur+1, false).then(()=>{ playing = false; updateUI(); });
});
prevBtn.addEventListener('click', ()=>{ if (cur > 0) gotoBeat(cur-1); });
$('#senseBtn').addEventListener('click', ()=>{
  if (playing || cur < 0) return;
  const s = beats[cur].sense;
  let start = cur; while (start > 0 && beats[start-1].sense === s) start--;
  let end = cur; while (end < beats.length-1 && beats[end+1].sense === s) end++;
  (async ()=>{
    playing = true; resetAll(); cur = -1;
    for (let i = 0; i < start; i++) await runBeat(i, true);
    playing = false; updateUI();
    chainPlay(start, end);
  })();
});
$('#autoChk').addEventListener('change', e=>{ if (!e.target.checked) chainToken++; });
document.addEventListener('keydown', e=>{
  if (e.code === 'Space' && !predOpen && !playing){ e.preventDefault(); nextBtn.click(); }
});

/* big recap check-mark (drawn in the final beat) */
const chk = document.createElementNS(NS,'path');
chk.setAttribute('id','bigCheck'); chk.setAttribute('class','dp acc');
chk.setAttribute('stroke-width','15'); chk.setAttribute('d','M716 700 L786 762 L894 636');
$('#gSpokes').appendChild(chk);

/* init */
prep();
resetAll();
const dotsBox = $('#dots');
beats.forEach((b,i)=>{
  const d = document.createElement('button');
  d.className = 'dot'; d.title = '第 '+(i+1)+' 拍';
  d.addEventListener('click', ()=>gotoBeat(i));
  dotsBox.appendChild(d);
});
updateUI();
window.__wb = { gotoBeat, next: ()=>nextBtn.click(), cur: ()=>cur, total: ()=>beats.length,
                playing: ()=>playing, predOpen: ()=>predOpen };
</script>
<script>
"use strict";
/* ======== generic whiteboard factory: scoped clone of the over engine ======== */
const WB_LESSONS = {};
function WB(root, cfg){
  const $  = s => root.querySelector(s);
  const $$ = (s,r) => Array.from((r||root).querySelectorAll(s));
  const svg = root.querySelector('svg.board');
  const NS = 'http://www.w3.org/2000/svg';
  const CAMS = { hook:[0,0,1250,920], full:[0,0,1600,1000] };
  let camCur = CAMS.hook.slice();

  function roundedRect(x,y,w,h,r){
    return `M${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h} L${x+r} ${y+h} Q${x} ${y+h} ${x} ${y+h-r} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} Z`;
  }
  /* postcard frames + spokes + highlights (generated, like over) */
  const spokesG = $('.gSpokes');
  const pcEls = {};
  $$('.pc').forEach(g=>{
    const id = g.dataset.pc; pcEls[id] = g;
    const f = document.createElementNS(NS,'path');
    f.setAttribute('stroke-width','3');
    f.setAttribute('d', roundedRect(3,3,294,169,14));
    if (g.dataset.dash){ f.setAttribute('class','fx gry'); f.setAttribute('stroke-dasharray','7 6'); }
    else f.setAttribute('class','dp gry');
    g.insertBefore(f, g.firstChild);
    const [x,y] = cfg.slots[id];
    const ln = document.createElementNS(NS,'path');
    ln.setAttribute('class','dp acc'); ln.setAttribute('stroke-width','2.5'); ln.setAttribute('opacity','.65');
    ln.setAttribute('d', `M800 512 L${x+150} ${y+86}`);
    spokesG.appendChild(ln);
    const hl = document.createElementNS(NS,'path');
    hl.setAttribute('class','fx hl'); hl.dataset.hl = id;
    hl.setAttribute('d', roundedRect(x-4,y-4,308,183,16));
    hl.setAttribute('fill','none'); hl.setAttribute('stroke','#f08c1e'); hl.setAttribute('stroke-width','4');
    spokesG.appendChild(hl);
  });
  const chk = document.createElementNS(NS,'path');
  chk.setAttribute('class','dp acc bigCheck'); chk.setAttribute('stroke-width','15');
  chk.setAttribute('d','M716 700 L786 762 L894 636');
  spokesG.appendChild(chk);

  /* prep: dash-draw + dashed-wipe, clip ids unique per lesson */
  const penG = $('.penG');
  function prep(){
    $$('.dp').forEach(el=>{
      const L = el.getTotalLength();
      el.dataset.len = L;
      el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
    });
    $$('.dw').forEach((el,i)=>{
      const bb = el.getBBox();
      const cp = document.createElementNS(NS,'clipPath');
      cp.setAttribute('id','xcp-'+cfg.key+'-'+i); cp.setAttribute('clipPathUnits','userSpaceOnUse');
      const r = document.createElementNS(NS,'rect');
      const vert = el.dataset.dir === 'v';
      r.setAttribute('x', bb.x-6); r.setAttribute('y', bb.y-6);
      r.setAttribute('width', vert ? bb.width+12 : 0);
      r.setAttribute('height', vert ? 0 : bb.height+12);
      cp.appendChild(r); svg.querySelector('defs').appendChild(cp);
      el.setAttribute('clip-path', `url(#xcp-${cfg.key}-${i})`);
      el._xclip = { r, bb, vert };
    });
  }
  function penTo(el, p){
    try{
      const L = el.getTotalLength();
      const pt = el.getPointAtLength(L*Math.min(Math.max(p,0),1));
      const m = el.getCTM();
      if (!m) return;
      const x = m.a*pt.x + m.c*pt.y + m.f, y = m.b*pt.x + m.d*pt.y + m.f;
      penG.setAttribute('transform', `translate(${x} ${y})`);
    }catch(e){}
  }
  function penShow(v){ penG.setAttribute('opacity', v?1:0); }

  const raf = () => new Promise(r=>requestAnimationFrame(r));
  function tween(dur, fn){
    if (dur<=0){ fn(1); return Promise.resolve(); }
    return new Promise(res=>{
      const t0 = performance.now();
      (function step(t){
        const p = Math.min((t-t0)/dur, 1);
        fn(p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2);
        if (p<1) requestAnimationFrame(step); else res();
      })(t0);
    });
  }
  function drawEl(el, dur, inst){
    if (!el) return Promise.resolve();
    const L = parseFloat(el.dataset.len);
    if (inst){ el.style.strokeDashoffset = 0; return Promise.resolve(); }
    penShow(true);
    return tween(dur, p=>{ el.style.strokeDashoffset = L*(1-p); penTo(el,p); }).then(()=>penShow(false));
  }
  function eraseEl(el, dur, inst){
    if (!el) return Promise.resolve();
    const L = parseFloat(el.dataset.len);
    if (inst){ el.style.strokeDashoffset = L; return Promise.resolve(); }
    penShow(true);
    return tween(dur, p=>{ el.style.strokeDashoffset = L*p; penTo(el,1-p); }).then(()=>penShow(false));
  }
  function drawAll(els, total, inst){
    els = els.filter(Boolean);
    const sum = els.reduce((a,e)=>a+parseFloat(e.dataset.len||1),0) || 1;
    let chain = Promise.resolve();
    els.forEach(el=>{ chain = chain.then(()=>drawEl(el, inst?0:Math.max(total*parseFloat(el.dataset.len||1)/sum, 40), inst)); });
    return chain;
  }
  function eraseAll(els, total, inst){
    els = els.filter(Boolean).slice().reverse();
    let chain = Promise.resolve();
    els.forEach(el=>{ chain = chain.then(()=>eraseEl(el, inst?0:Math.max(total/els.length,30), inst)); });
    return chain;
  }
  function wipeEl(el, dur, inst, dirn){
    if (!el || !el._xclip) return Promise.resolve();
    const { r, bb, vert } = el._xclip;
    const full = (vert ? bb.height : bb.width) + 12;
    const from = dirn<0 ? full : 0, to = dirn<0 ? 0 : full;
    if (inst){ r.setAttribute(vert?'height':'width', to); return Promise.resolve(); }
    penShow(true);
    return tween(dur, p=>{
      r.setAttribute(vert?'height':'width', from+(to-from)*p); penTo(el,p);
    }).then(()=>penShow(false));
  }
  function showEls(els, inst){ els.filter(Boolean).forEach(e=>{ e.style.transition = inst?'none':''; e.style.opacity = 1; }); }
  function hideEls(els){ els.filter(Boolean).forEach(e=>{ e.style.opacity = 0; }); }
  function sceneDrawables(g){
    return { dp: $$('.dp',g), dw: $$('.dw',g), fx: $$('.fx',g), tx: $$('.tx',g) };
  }
  function eraseScene(sel, total, inst){
    const g = $(sel); if (!g) return Promise.resolve();
    const d = sceneDrawables(g);
    hideEls(d.fx.concat(d.tx));
    let chain = eraseAll(d.dp, total*0.7, inst);
    d.dw.forEach(el=>{ chain = chain.then(()=>wipeEl(el, inst?0:total*0.3/Math.max(d.dw.length,1), inst, -1)); });
    return chain;
  }
  function travel(arcEl, mover, dur, inst){
    if (!arcEl || !mover) return Promise.resolve();
    const L = arcEl.getTotalLength();
    const setP = p=>{
      const pt = arcEl.getPointAtLength(L*p);
      const pt2 = arcEl.getPointAtLength(L*Math.min(p+0.012,1));
      const ang = Math.atan2(pt2.y-pt.y, pt2.x-pt.x)*180/Math.PI*0.45;
      mover.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${ang})`);
    };
    if (inst){ mover.setAttribute('opacity',0); setP(1); return Promise.resolve(); }
    mover.setAttribute('opacity',1);
    return tween(dur, setP).then(()=>{ mover.setAttribute('opacity',0); });
  }
  function camTo(name, inst){
    const tgt = CAMS[name];
    if (inst){ camCur = tgt.slice(); svg.setAttribute('viewBox', camCur.join(' ')); return Promise.resolve(); }
    const from = camCur.slice();
    return tween(750, p=>{
      camCur = from.map((v,i)=>v+(tgt[i]-v)*p);
      svg.setAttribute('viewBox', camCur.join(' '));
    });
  }
  function moveTo(sel, x, y, dur, inst){
    const el = $(sel); if (!el) return Promise.resolve();
    if (inst){ el.setAttribute('transform', `translate(${x} ${y})`); return Promise.resolve(); }
    const m = /translate\(([-\d.]+)[ ,]([-\d.]+)\)/.exec(el.getAttribute('transform')||'');
    const fx = m?+m[1]:0, fy = m?+m[2]:0;
    return tween(dur, p=>el.setAttribute('transform', `translate(${fx+(x-fx)*p} ${fy+(y-fy)*p})`));
  }
  function shrinkTo(sel, cx, cy, s, dur, inst){
    const el = $(sel); if (!el) return Promise.resolve();
    const setS = v=>el.setAttribute('transform', `translate(${cx} ${cy}) scale(${v}) translate(${-cx} ${-cy})`);
    if (inst){ setS(s); return Promise.resolve(); }
    return tween(dur, p=>setS(1+(s-1)*p));
  }

  /* narration / sentence / speech */
  let curSent = '';
  function setCap(t){ $('.cap').textContent = t; }
  function setSent(html, plain){
    curSent = plain;
    if (!plain){ $('.sentBar').hidden = true; return; }
    $('.sent').innerHTML = html; $('.sentBar').hidden = false;
  }
  $('.speakBtn').addEventListener('click', ()=>{
    if (!curSent) return;
    try{
      const u = new SpeechSynthesisUtterance(curSent);
      u.lang = 'en-GB'; u.rate = 0.85;
      const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('en-gb'));
      if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  });

  /* prediction pauses */
  const predBox = $('.predict');
  let predOpen = false;
  function predict(spec, inst){
    if (inst) return Promise.resolve();
    return new Promise(res=>{
      predOpen = true;
      predBox.querySelector('.q').textContent = spec.q;
      predBox.querySelector('.hint').textContent = '';
      const opts = predBox.querySelector('.opts'); opts.innerHTML = '';
      spec.opts.forEach(o=>{
        const b = document.createElement('button');
        b.textContent = o.t;
        b.addEventListener('click', ()=>{
          if (o.ok){
            predBox.classList.remove('shake'); predBox.hidden = true; predOpen = false; res();
          } else {
            b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
            predBox.querySelector('.hint').textContent = spec.hint;
          }
        });
        opts.appendChild(b);
      });
      predBox.hidden = false;
    });
  }

  /* postcards / schema card / recap */
  function pcShow(id){
    return inst=>{
      const g = pcEls[id]; if (!g) return Promise.resolve();
      let chain = drawAll($$('.dp',g), inst?0:850, inst);
      $$('.dw',g).forEach(el=>{ chain = chain.then(()=>wipeEl(el, inst?0:320, inst, 1)); });
      chain = chain.then(()=>{ showEls($$('.fx',g).concat($$('.tx',g)), inst); });
      return chain;
    };
  }
  function flyToCard(stageSel, inst){
    const stageG = $(stageSel), cardG = $('.gCore'), cardSchema = $('.cardSchema', cardG);
    const finish = ()=>{
      stageG.style.opacity = 0; stageG.removeAttribute('transform');
      cardG.setAttribute('opacity',1);
      if (inst){
        $$('.dp',cardG).forEach(el=>{ el.style.strokeDashoffset = 0; });
        $$('.dw',cardG).forEach(el=>wipeEl(el,0,true,1));
        showEls($$('.fx',cardG).concat($$('.tx',cardG)), true);
        return Promise.resolve();
      }
      return drawAll($$('.dp',cardG), 850, false).then(()=>{
        let c = Promise.resolve();
        $$('.dw',cardG).forEach(el=>{ c = c.then(()=>wipeEl(el, 420, false, 1)); });
        return c.then(()=>{ showEls($$('.fx',cardG).concat($$('.tx',cardG)), false); });
      });
    };
    if (inst) return camTo('full', true).then(finish);
    return camTo('full', false).then(async ()=>{
      const b1 = stageG.getBBox(), b2 = cardSchema.getBBox();
      const sx = b2.width/b1.width, sy = b2.height/b1.height;
      const tx = b2.x - sx*b1.x, ty = b2.y - sy*b1.y;
      await tween(950, p=>{
        stageG.setAttribute('transform', `translate(${tx*p} ${ty*p}) scale(${1+(sx-1)*p} ${1+(sy-1)*p})`);
      });
      return finish();
    });
  }
  function moveCardCenter(inst){
    const core = $('.gCore');
    core.style.transformBox = 'fill-box'; core.style.transformOrigin = 'center';
    core.style.transition = inst ? 'none' : 'transform .95s ease';
    core.style.transform = 'translate(-575px,385px) scale(1.12)';
    return inst ? Promise.resolve() : new Promise(r=>setTimeout(r,1000));
  }
  function recapTour(lastSceneSel){
    return inst=>
      eraseScene(lastSceneSel, inst?0:600, inst)
      .then(()=>moveCardCenter(inst))
      .then(()=>drawAll($$('.gSpokes .dp:not(.bigCheck)'), inst?0:1100, inst))
      .then(async ()=>{
        for (const id of cfg.tour){
          const hl = $(`.hl[data-hl="${id}"]`);
          showEls([hl], inst);
          if (!inst){ const s = cfg.sents[id]; if (s) setSent(s[0], s[1]); await new Promise(r=>setTimeout(r,1050)); }
          hideEls([hl]);
        }
        if (inst) setSent('','');
      });
  }

  /* reset (root-scoped; never touches the over lesson) */
  function resetAll(){
    $$('.dp').forEach(el=>{ el.style.strokeDashoffset = el.dataset.len; });
    $$('.dw').forEach(el=>{ if (el._xclip) el._xclip.r.setAttribute(el._xclip.vert?'height':'width', 0); });
    $$('.fx,.tx').forEach(el=>{ el.style.opacity = 0; });
    const core = $('.gCore');
    core.setAttribute('opacity',0); core.style.transform = '';
    $$('.actorLeap').forEach(e=>e.setAttribute('opacity',0));
    $$('.ghost').forEach(e=>e.remove());
    $$('[data-rst]').forEach(e=>{ const b = e.dataset.base; if (b) e.setAttribute('transform', b); else e.removeAttribute('transform'); e.style.opacity=''; });
    $$('.schemaG').forEach(g=>{ g.removeAttribute('transform'); g.style.opacity=''; });
    predBox.hidden = true; predOpen = false;
    camCur = CAMS.hook.slice(); svg.setAttribute('viewBox', camCur.join(' '));
    setSent('','');
  }

  /* helpers handed to beat definitions */
  const H = {
    $, $$, svg, pcEls,
    D:  (sel,total)=>inst=>drawAll($$(sel), total, inst),
    D1: (sel,dur)=>inst=>drawEl($(sel), dur, inst),
    DS: (sel,from,to,total)=>inst=>drawAll($$(sel).slice(from,to), total, inst),
    W:  (sel,dur)=>inst=>wipeEl($(sel), dur, inst, 1),
    WE: (sel,dur)=>inst=>wipeEl($(sel), dur, inst, -1),
    SH: sel=>inst=>{ showEls($$(sel), inst); return Promise.resolve(); },
    DL: ms=>inst=>inst?Promise.resolve():new Promise(r=>setTimeout(r,ms)),
    SQ: (...fns)=>inst=>fns.reduce((p,f)=>p.then(()=>f(inst)), Promise.resolve()),
    CM: name=>inst=>camTo(name, inst),
    ES: (sel,total)=>inst=>eraseScene(sel, total, inst),
    travel: (arcSel,moverSel,dur)=>inst=>travel($(arcSel), $(moverSel), inst?0:dur, inst),
    catGo: (arcSel,sitSel,dur)=>inst=>travel($(arcSel), $('.actorLeap'), inst?0:dur, inst).then(()=>drawAll($$(sitSel+' .dp'), inst?0:450, inst)),
    moveTo, shrinkTo, pcShow,
    buildCard: sel=>inst=>flyToCard(sel, inst),
    recapTour,
    drawEls: (els,total)=>inst=>drawAll(els,total,inst),
    eraseEls: (els,total)=>inst=>eraseAll(els,total,inst),
    showEls, hideEls, tween
  };
  const beats = cfg.beatsFn(H);

  /* engine (same contract as over) */
  let cur = -1, playing = false, chainToken = 0;
  const nextBtn = $('.nextBtn'), prevBtn = $('.prevBtn');
  async function runBeat(i, inst){
    const b = beats[i];
    setCap(b.cap);
    if (b.sent) setSent(b.sentHtml, b.sent);
    for (const a of b.acts || []) await a(inst);
    if (b.predict) await predict(b.predict, inst);
    cur = i; updateUI();
  }
  function updateUI(){
    $('.prog').textContent = cur < 0 ? `共 ${beats.length} 拍` : `第 ${cur+1} / ${beats.length} 拍`;
    prevBtn.disabled = playing || cur <= 0;
    nextBtn.disabled = playing || predOpen || cur >= beats.length-1;
    nextBtn.textContent = cur >= beats.length-1 ? '🎉 学完啦' : '下一拍 ▶';
    $$('.dot').forEach((d,i)=>{
      d.classList.toggle('done', i < cur);
      d.classList.toggle('now', i === cur);
    });
  }
  async function gotoBeat(n){
    if (playing) return;
    playing = true; updateUI();
    resetAll(); cur = -1;
    for (let i = 0; i <= n && i < beats.length; i++) await runBeat(i, true);
    playing = false; updateUI();
  }
  async function chainPlay(from, to){
    const tk = ++chainToken;
    playing = true; updateUI();
    for (let i = from; i <= to && i < beats.length; i++){
      if (tk !== chainToken) break;
      await runBeat(i, false);
      if (tk !== chainToken) break;
      if (i < to) await new Promise(r=>setTimeout(r,650));
    }
    playing = false; updateUI();
  }
  nextBtn.addEventListener('click', ()=>{
    if (playing || predOpen || cur >= beats.length-1) return;
    if ($('.autoChk').checked){ chainPlay(cur+1, beats.length-1); return; }
    playing = true; updateUI();
    runBeat(cur+1, false).then(()=>{ playing = false; updateUI(); });
  });
  prevBtn.addEventListener('click', ()=>{ if (cur > 0) gotoBeat(cur-1); });
  $('.senseBtn').addEventListener('click', ()=>{
    if (playing || cur < 0) return;
    const s = beats[cur].sense;
    let start = cur; while (start > 0 && beats[start-1].sense === s) start--;
    let end = cur; while (end < beats.length-1 && beats[end+1].sense === s) end++;
    (async ()=>{
      playing = true; resetAll(); cur = -1;
      for (let i = 0; i < start; i++) await runBeat(i, true);
      playing = false; updateUI();
      chainPlay(start, end);
    })();
  });
  $('.autoChk').addEventListener('change', e=>{ if (!e.target.checked) chainToken++; });

  prep();
  resetAll();
  const dotsBox = $('.dots');
  beats.forEach((b,i)=>{
    const d = document.createElement('button');
    d.className = 'dot'; d.title = '第 '+(i+1)+' 拍';
    d.addEventListener('click', ()=>gotoBeat(i));
    dotsBox.appendChild(d);
  });
  updateUI();
  const api = { gotoBeat, next: ()=>nextBtn.click(), cur: ()=>cur, total: ()=>beats.length,
                playing: ()=>playing, predOpen: ()=>predOpen,
                caps: ()=>beats.map(b=>b.cap),
                rebuild: ()=>{ if (cur < 0){ resetAll(); updateUI(); } else gotoBeat(cur); } };
  WB_LESSONS[cfg.key] = api;
  window.__wbLessons = WB_LESSONS;
  return api;
}

/* ======== lesson picker + space-key router ======== */
window.__activeLesson = 'over';
(function(){
  const picker = document.getElementById('lessonPicker');
  if (!picker) return;
  function showLesson(k){
    window.__activeLesson = k;
    document.querySelectorAll('.lesson').forEach(d=>{ d.hidden = d.id !== 'lesson-'+k; });
    picker.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.lesson === k));
    if (WB_LESSONS[k]) WB_LESSONS[k].rebuild();
  }
  picker.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ showLesson(b.dataset.lesson); b.blur(); }));
  document.addEventListener('keydown', e=>{
    if (e.code !== 'Space' || window.__activeLesson === 'over') return;
    const L = WB_LESSONS[window.__activeLesson];
    e.preventDefault(); e.stopPropagation();
    if (L && !L.predOpen() && !L.playing()) L.next();
  }, true);
})();
</script>
