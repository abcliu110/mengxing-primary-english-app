const PATS = {}; DATA.patterns.forEach(p => PATS[p.id] = p);
const app = document.getElementById('app');
// 合并菜单：同一（字素，音素）的子模式合并为一个入口（顺序按 DATA 首现）
const GKEY = p => p.g + '|' + p.ph;
const GROUPS = {}; const GORDER2 = [];
DATA.patterns.forEach(p => {
  const k = GKEY(p);
  if (!GROUPS[k]) { GROUPS[k] = {key: k, g: p.g, ph: p.ph, ps: [], n: 0}; GORDER2.push(k); }
  GROUPS[k].ps.push(p); GROUPS[k].n += p.n;
});
(function(){
  const st = document.createElement('style');
  st.textContent = '.spk{margin-left:6px;border:1px solid #d8cfc0;background:#fff8ec;border-radius:8px;cursor:pointer;font-size:14px;padding:1px 6px}' +
    '.subsec{border-top:2px dashed #e5dcc8;margin-top:22px;padding-top:14px}' +
    '.optrow{display:inline-flex;align-items:center;margin:2px}' +
    'button.chip{font:inherit;text-align:left;cursor:pointer}' +
    'button.back{font:inherit;cursor:pointer;background:none;border:none;color:#8a6d3b;text-decoration:underline;padding:0}' +
    '.shorttag{display:inline-block;background:#efe6cf;border-radius:6px;padding:0 7px;margin-left:8px;font-size:13px;color:#7a5c14}';
  document.head.appendChild(st);
})();

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function speak(t) {
  try {
    if (!('speechSynthesis' in window)) return;
    const ss = window.speechSynthesis;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(String(t).split('/')[0].trim());
    u.lang = 'en-GB'; u.rate = 0.85;
    const vs = ss.getVoices ? ss.getVoices() : [];
    const gb = vs.find(v => (v.lang || '').toLowerCase().indexOf('en-gb') === 0);
    if (gb) u.voice = gb;
    ss.speak(u);
  } catch (e) {}
}
function sortedWords(p) {
  return p.w.slice().sort((a, b) => {
    const fa = (DATA.bank[a] ? DATA.bank[a][0] : a).toLowerCase();
    const fb = (DATA.bank[b] ? DATA.bank[b][0] : b).toLowerCase();
    return fa < fb ? -1 : fa > fb ? 1 : (a < b ? -1 : a > b ? 1 : 0);
  });
}
function wordCard(wid, p) {
  const b = DATA.bank[wid]; if (!b) return '';
  let w = esc(b[0]);
  const spans = (p.occ[wid] || []);
  if (spans.length) {
    let out = '', last = 0;
    spans.forEach(sp => { out += esc(b[0].slice(last, sp[0])) + '<span class="hl">' + esc(b[0].slice(sp[0], sp[1])) + '</span>'; last = sp[1]; });
    out += esc(b[0].slice(last)); w = out;
  }
  return '<div class="wc"><span class="em">' + esc(b[3]) + '</span><div class="w">' + w +
         '<button class="spk" data-say="' + esc(b[0]) + '" aria-label="朗读">🔊</button></div>' +
         '<div class="ph">' + esc(b[1]) + '</div><div class="mn">' + esc(b[2]) + '</div></div>';
}

function home() {
  let h = '';
  DATA.gorder.forEach(g => {
    const ps = DATA.patterns.filter(p => p.grp === g && p.n > 0); // zero-word patterns stay in the data, off the menu
    const seen = []; const gks = [];
    ps.forEach(p => { const k = GKEY(p); if (seen.indexOf(k) < 0) { seen.push(k); gks.push(GROUPS[k]); } });
    const tot = ps.reduce((a, p) => a + p.n, 0);
    h += '<section class="gsec"><h2>' + DATA.groups[g] + '</h2>' +
         '<div class="meta">' + gks.length + ' 个菜单入口 · 共 ' + tot + ' 词次（全部来自词库）</div><div class="chips">';
    gks.forEach(gr => {
      h += '<button class="chip" data-grp="' + esc(gr.key) + '"><b>' + esc(gr.g) + '</b> → ' + esc(gr.ph) + '<span class="cnt">' + gr.n + ' 词</span></button>';
    });
    h += '</div></section>';
  });
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function patternPage(id) {
  const p = PATS[id]; if (!p) { home(); return; }
  openGroup(GKEY(p), id);
}

function openGroup(key, focusPid) {
  const gr = GROUPS[key]; if (!gr) { home(); return; }
  let h = '<button class="back" data-nav="home">← 返回模式菜单</button>';
  h += '<div class="big"><b>' + esc(gr.g) + '</b> → ' + esc(gr.ph) + '</div>';
  if (gr.ps.length === 1) {
    h += '<div class="sub">' + esc(gr.ps[0].name) + (gr.ps[0].menu ? ' · 长音 ' + esc(gr.ps[0].menu) + ' 的一条路' : '') + '</div>';
  } else {
    h += '<div class="sub">同一组字母、同一个音，有 ' + gr.ps.length + ' 种用法——下面分区看。</div>';
  }
  h += '<p><span class="badge">共 ' + gr.n + ' 词 · 全部来自词库</span></p>';
  const pools = {};
  gr.ps.forEach(p => {
    h += '<section class="subsec" id="sec-' + p.id + '">';
    h += '<h3>' + esc(p.name) + (p.short ? '<span class="shorttag">' + esc(p.short) + '</span>' : '') + '</h3>';
    h += '<div class="lawbox"><div class="kid">📖 ' + esc(p.kid || p.name) + '</div>' +
         '<div class="src">所属规律：' + p.laws.join('、') + (p.lawTitle ? '——' + esc(p.lawTitle) : '') + '（讲解取自规律清单定版文本）</div></div>';
    if (p.face) {
      const sibs = DATA.patterns.filter(q => q.face && q.face === p.face && q.id !== p.id && q.n > 0);
      if (sibs.length) {
        h += '<div class="facebox">🎭 变脸一家：<b>' + esc(p.g) + '</b> 有好几个读法——';
        sibs.forEach(q => { h += ' <button class="spk" data-pat="' + q.id + '">' + esc(q.ph) + '（' + q.n + ' 词）</button>'; });
        h += '。本区只收读 ' + esc(p.ph) + ' 的词。</div>';
      }
    }
    h += '<p><span class="badge">本区 ' + p.n + ' 词</span></p>';
    const sw = sortedWords(p);
    h += '<div class="grid">' + sw.map(wid => wordCard(wid, p)).join('') + '</div>';
    const pool = sw.filter(wid => DATA.bank[wid] && DATA.bank[wid][0].length >= 3).filter((wid, i, a) => a.findIndex(x => DATA.bank[x][0] === DATA.bank[wid][0]) === i); // dedupe quiz pool by display form: two bank entries may share one form (who), options must differ visibly
    pools[p.id] = pool;
    if (pool.length >= 3) {
      h += '<div class="quiz"><h3>🧩 拼一拼：哪个词对得上？（题目全部用本规律的词）</h3><div id="quiz-' + p.id + '"></div>' +
           '<div class="hint" id="hint-' + p.id + '">再想想：回到上面的讲解看看，或者在词表里找一找这个音。👆</div></div>';
    }
    h += '</section>';
  });
  h += '<div class="psc">📝 伪词检查（PSC 式 · 占位）：正式版共 <b>40 个词</b>（真词与像词的「假词」各一半），读对 <b>32 个</b>算达标——假词没见过，只能靠规律拼，所以最能看出规律有没有真学会。本原型先占位，题目待入模后上线。</div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
  gr.ps.forEach(p => { if (pools[p.id] && pools[p.id].length >= 3) runQuiz(p, pools[p.id]); });
  if (focusPid) {
    const el = document.getElementById('sec-' + focusPid);
    if (el) el.scrollIntoView();
  }
}

function runQuiz(p, pool) {
  const qz = document.getElementById('quiz-' + p.id);
  if (!qz) return;
  let qi = 0, score = 0;
  const total = Math.min(5, pool.length);
  function ask() {
    if (qi >= total) { qz.innerHTML = '<p>🎉 拼读练习完成：对了 ' + score + ' / ' + total + '。这个规律的词都在上面词表里，可以随时回来练。</p>'; return; }
    const target = pool[qi];
    const others = pool.filter(w => w !== target);
    const start = qi % others.length;
    const opts = [target, others[start], others[(start + 1) % others.length]];
    for (let i = opts.length - 1; i > 0; i--) { const j = (i * 7 + qi) % (i + 1); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
    const b = DATA.bank[target];
    qz.innerHTML = '<p>第 ' + (qi + 1) + ' / ' + total + ' 题：' + esc(b[3]) + ' ' + esc(b[1]) + ' ' + esc(b[2]) + ' —— 是哪个词？</p><div class="opts">' +
      opts.map(wid => '<span class="optrow"><button class="opt" data-w="' + wid + '">' + esc(DATA.bank[wid][0]) + '</button><button class="spk" data-say="' + esc(DATA.bank[wid][0]) + '" aria-label="朗读">🔊</button></span>').join('') + '</div>';
    qz.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.w === target) { btn.classList.add('ok'); score++; qi++; setTimeout(ask, 450); }
      else { btn.classList.add('no'); const hint = document.getElementById('hint-' + p.id); if (hint) hint.style.display = 'block'; }
    }));
  }
  ask();
}

document.addEventListener('click', ev => {
  const say = ev.target.closest ? ev.target.closest('[data-say]') : null;
  if (say) { ev.stopPropagation(); speak(say.getAttribute('data-say')); return; }
  const pat = ev.target.closest ? ev.target.closest('[data-pat]') : null;
  if (pat) { patternPage(pat.getAttribute('data-pat')); return; }
  const grp = ev.target.closest ? ev.target.closest('[data-grp]') : null;
  if (grp) { openGroup(grp.getAttribute('data-grp')); return; }
  const nav = ev.target.closest ? ev.target.closest('[data-nav="home"]') : null;
  if (nav) { home(); return; }
});

home();

/* ---------------- 词链 ---------------- */
const CHAINST = {};
function chainHTML(p) {
  const chs = X2.chains[p.id];
  if (!chs || !chs.length) return '';
  if (!CHAINST[p.id]) CHAINST[p.id] = { ci: 0, step: 0 };
  const st = CHAINST[p.id];
  const ch = chs[st.ci % chs.length];
  const wid = ch.w[Math.min(st.step, ch.w.length - 1)];
  const ent = (X2.drill[p.id] || []).find(e => e[0] === wid);
  const b = DATA.bank[wid];
  let tiles, phons;
  if (ent) { tiles = ent[1]; phons = ent[2]; }
  else { tiles = [b[0]]; phons = [b[1]]; }
  let cls = tiles.map(() => '');
  if (st.step > 0) {
    const pos = ch.steps[st.step - 1].pos;
    cls = tiles.map((t, i) => i === pos ? 'new' : '');
  }
  const dots = ch.w.map((w, i) => '<span class="dot' + (i <= st.step ? ' on' : '') + '"></span>').join('');
  const changeNote = st.step > 0
    ? '刚才换掉了一个音：<b>' + esc(ch.steps[st.step - 1].from) + '</b> → <b>' + esc(ch.steps[st.step - 1].to) + '</b>，词就变了。'
    : '下面的词只差一个音。点「换一个音」，看它怎么一点点变。';
  return '<div class="chainbox" id="chain-' + p.id + '"><h3>🔗 词链：只换一个音</h3>' +
    '<div class="bcard"><span class="be">' + esc(b[3]) + '</span><div><span class="bw">' + esc(b[0]) +
    '</span> <button class="spk" data-say="' + esc(b[0]) + '" aria-label="朗读">🔊</button>' +
    '<div class="bp">' + esc(b[1]) + '</div><div class="bm">' + esc(b[2]) + '</div></div></div>' +
    '<div class="chainword">' + tiles.map((t, i) => '<span class="ctile ' + cls[i] + '">' + esc(t) + '<small>' + esc(phons[i] || '') + '</small></span>').join('') +
    '<span class="dots">' + dots + '</span></div>' +
    '<div class="bmsg soft">' + changeNote + '</div>' +
    '<div class="bbtns">' +
    (st.step < ch.w.length - 1
      ? '<button class="bbtn primary" data-cact="next" data-pid="' + p.id + '">换一个音 →</button>'
      : '<button class="bbtn primary" data-cact="restart" data-pid="' + p.id + '">🎉 链走完了！从头再来</button>') +
    (chs.length > 1 ? '<button class="bbtn" data-cact="other" data-pid="' + p.id + '">换一条链</button>' : '') +
    '</div></div>';
}

/* ---------------- 练习 v2：答错降阶 + 听音拼词 ---------------- */
runQuiz = function (p, pool) {
  const qz = document.getElementById('quiz-' + p.id);
  if (!qz) return;
  const drill = X2.drill[p.id] || [];
  const total = 5;
  let qi = 0, score = 0;
  const usedChoice = {};
  function choiceTarget() {
    // 与 v1 同口径：按题序轮取词表池
    let idx = qi % pool.length;
    let guard = 0;
    while (usedChoice[pool[idx]] && guard < pool.length) { idx = (idx + 1) % pool.length; guard++; }
    usedChoice[pool[idx]] = true;
    return pool[idx];
  }
  function finish() {
    DONESET.add(p.g + '|' + p.ph);
    qz.innerHTML = '<p>🎉 拼读练习完成：一次答对 ' + score + ' / ' + total + '。' +
      '（答错先练一练再答对的，不算「一次答对」——练会了更要紧。）这个规律在「学习主线」里已点亮 ✓。</p>';
  }
  function ask() {
    if (qi >= total) { finish(); return; }
    const useListen = (qi % 2 === 1) && drill.length > 0;
    if (useListen) askListen(drill[qi % drill.length]);
    else askChoice(choiceTarget(), false);
  }
  function askChoice(target, afterDrill) {
    const others = pool.filter(w => w !== target);
    const start = qi % others.length;
    const opts = shuffleDet([target, others[start], others[(start + 1) % others.length]], qi + target.length);
    const b = DATA.bank[target];
    qz.innerHTML = '<p>第 ' + (qi + 1) + ' / ' + total + ' 题：' + esc(b[3]) + ' ' + esc(b[1]) + ' ' + esc(b[2]) +
      ' —— 是哪个词？</p><div class="opts">' +
      opts.map(wid => '<span class="optrow"><button class="opt" data-w="' + wid + '">' + esc(DATA.bank[wid][0]) +
        '</button><button class="spk" data-say="' + esc(DATA.bank[wid][0]) + '" aria-label="朗读">🔊</button></span>').join('') + '</div>' +
      '<div class="qdrill"></div>';
    qz.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.w === target) {
        btn.classList.add('ok');
        if (!afterDrill) score++;
        qi++; setTimeout(ask, 450);
      } else {
        btn.classList.add('no');
        stepDown(target, () => askChoice(target, true));
      }
    }));
  }
  function stepDown(target, back) {
    const box = qz.querySelector('.qdrill');
    if (!box || box.dataset.on) return;
    box.dataset.on = '1';
    const b = DATA.bank[target];
    const ent = drill.find(e => e[0] === target) ||
      drill.find(e => DATA.bank[e[0]] && DATA.bank[e[0]][0] === b[0]);
    let inner = '<div class="drillbox"><h4>🧱 先练一练，再回来答这一题</h4>' +
      '<div class="bmsg soft">刚才那个不对——不急。把这个词亲手拼一遍，就知道它是哪个了：' +
      esc(b[3]) + ' ' + esc(b[1]) + ' ' + esc(b[2]) + '</div>';
    if (ent) {
      const tiles = ent[1], phons = ent[2];
      const order = shuffleDet(tiles.map((t, i) => i), target.length + 3);
      inner += '<div class="slotrow">' + tiles.map((t, i) => '<span class="slot" data-slot="' + i + '">？</span>').join('') + '</div>' +
        '<div class="palette">' + order.map(i => '<button class="tile" data-dtile="' + i + '">' + esc(tiles[i]) + '</button>').join('') + '</div>' +
        '<div class="bmsg" data-dmsg></div></div>';
      box.innerHTML = inner;
      let placed = 0;
      box.querySelectorAll('[data-dtile]').forEach(btn => btn.addEventListener('click', () => {
        const i = +btn.dataset.dtile;
        if (i === placed) {
          btn.classList.add('used');
          const slot = box.querySelector('[data-slot="' + placed + '"]');
          slot.classList.add('filled');
          slot.innerHTML = esc(tiles[placed]) + '<small>' + esc(phons[placed]) + '</small>';
          placed++;
          if (placed >= tiles.length) {
            box.querySelector('[data-dmsg]').innerHTML = '🎉 拼出来了：<b>' + esc(b[0]) + '</b>。回到上面的题再选一次。';
            speak(b[0]);
            setTimeout(back, 900);
          }
        } else {
          btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 550);
        }
      }));
    } else {
      // 没有整齐拆法的词：用字母砖自由拼出目标词
      const letters = shuffleDet(b[0].toLowerCase().split(''), target.length + 5);
      inner += '<div class="brow" data-drow><span class="ph-lbl">点字母砖，拼出这个词。</span></div>' +
        '<div class="palette">' + letters.map((l, i) => '<button class="tile" data-dlet="' + i + '">' + l + '</button>').join('') + '</div>' +
        '<div class="bbtns"><button class="bbtn" data-dclear>清空</button></div><div class="bmsg" data-dmsg></div></div>';
      box.innerHTML = inner;
      let units = [];
      const render = () => {
        const row = box.querySelector('[data-drow]');
        row.innerHTML = units.length ? units.map(u => '<span class="tile placed">' + esc(u) + '</span>').join('')
          : '<span class="ph-lbl">点字母砖，拼出这个词。</span>';
        if (units.join('') === b[0].toLowerCase()) {
          box.querySelector('[data-dmsg]').innerHTML = '🎉 拼出来了：<b>' + esc(b[0]) + '</b>。回到上面的题再选一次。';
          speak(b[0]);
          setTimeout(back, 900);
        }
      };
      box.querySelectorAll('[data-dlet]').forEach(btn => btn.addEventListener('click', () => {
        if (btn.classList.contains('used')) return;
        btn.classList.add('used');
        units.push(btn.textContent);
        render();
      }));
      box.querySelector('[data-dclear]').addEventListener('click', () => {
        units = [];
        box.querySelectorAll('[data-dlet]').forEach(x => x.classList.remove('used'));
        render();
      });
    }
  }
  function askListen(ent) {
    const wid = ent[0], tiles = ent[1];
    const b = DATA.bank[wid];
    const extra = [];
    (drill || []).forEach(e => e[1].forEach(t => { if (tiles.indexOf(t) < 0 && extra.indexOf(t) < 0) extra.push(t); }));
    // 构造：目标砖 + 干扰砖（同规律其他词的字素）
    const items = [];
    tiles.forEach(t => items.push({ t: t, need: true }));
    extra.slice(0, 3).forEach(t => items.push({ t: t, need: false }));
    const shuffled = shuffleDet(items, qi + tiles.length + 1);
    let units = [], wrongs = 0;
    qz.innerHTML = '<p>第 ' + (qi + 1) + ' / ' + total + ' 题（听音拼词）：听一听，把这个词拼出来。' +
      '<button class="spk" data-say="' + esc(b[0]) + '" aria-label="再听一次">🔊 再听一次</button></p>' +
      '<div class="brow" data-lrow><span class="ph-lbl">' + esc(b[3]) + ' ' + esc(b[2]) + '——点下面的音块拼词。</span></div>' +
      '<div class="palette">' + shuffled.map((it, i) => '<button class="tile" data-ltile="' + i + '">' + esc(it.t) + '</button>').join('') + '</div>' +
      '<div class="bbtns"><button class="bbtn" data-lclear>清空</button>' +
      '<button class="bbtn primary" data-lcheck>拼好了 ✓</button></div><div class="bmsg" data-lmsg></div>';
    speak(b[0]);
    const render = () => {
      const row = qz.querySelector('[data-lrow]');
      row.innerHTML = units.length ? units.map(u => '<span class="tile placed">' + esc(u.t) + '</span>').join('') +
        (units.some(u => u.t.indexOf('-e') > 0 && u.t.length === 3) ? '<span class="tile ghoste">e</span>' : '')
        : '<span class="ph-lbl">' + esc(b[3]) + ' ' + esc(b[2]) + '——点下面的音块拼词。</span>';
    };
    qz.querySelectorAll('[data-ltile]').forEach(btn => btn.addEventListener('click', () => {
      if (btn.classList.contains('used')) return;
      btn.classList.add('used');
      units.push(shuffled[+btn.dataset.ltile]);
      render();
    }));
    qz.querySelector('[data-lclear]').addEventListener('click', () => {
      units = [];
      qz.querySelectorAll('[data-ltile]').forEach(x => x.classList.remove('used'));
      render();
    });
    qz.querySelector('[data-lcheck]').addEventListener('click', () => {
      const msg = qz.querySelector('[data-lmsg]');
      if (assembleStr(units) === b[0].toLowerCase()) {
        score++;
        msg.className = 'bmsg good';
        msg.innerHTML = '🎉 拼对了：<b>' + esc(b[0]) + '</b> ' + esc(b[1]);
        qi++; setTimeout(ask, 800);
      } else {
        wrongs++;
        msg.className = 'bmsg soft';
        if (wrongs === 1) {
          msg.textContent = '还差一点。它读 ' + b[1] + '——一共有 ' + tiles.length + ' 块音，清空再试试。';
        } else {
          msg.innerHTML = '看一眼它的拼法：<b>' + tiles.map(esc).join(' · ') + '</b>（' +
            ent[2].map(x => '/' + esc(x) + '/').join(' ') + '），记住了再拼一次。';
        }
      }
    });
  }
  ask();
};

/* ---------------- v2 点击委托 ---------------- */
document.addEventListener('click', ev => {
  const c = ev.target.closest ? ev.target : null;
  if (!c || !c.closest) return;
  const x2 = c.closest('[data-x2]');
  if (x2) {
    if (x2.dataset.x2 === 'spine') spineView();
    else if (x2.dataset.x2 === 'hearts') heartIndex();
    return;
  }
  const hb = c.closest('[data-heart]');
  if (hb) { heartPage(+hb.dataset.heart); return; }
  const tb = c.closest('[data-btab]');
  if (tb && !tb.disabled) {
    const p = PATS[tb.dataset.pid]; const st = boardState(p);
    st.mode = tb.dataset.btab;
    const sec = document.getElementById('board-' + p.id);
    sec.querySelectorAll('.btab').forEach(x => x.classList.toggle('on', x === tb));
    document.getElementById('bbuild-' + p.id).style.display = st.mode === 'build' ? '' : 'none';
    document.getElementById('bsplit-' + p.id).style.display = st.mode === 'split' ? '' : 'none';
    return;
  }
  const tl = c.closest('[data-tile]');
  if (tl) {
    const p = PATS[tl.dataset.pid]; const st = boardState(p);
    st.units.push({ t: tl.dataset.tile });
    refreshBuild(p);
    return;
  }
  const ba = c.closest('[data-bact]');
  if (ba) {
    const p = PATS[ba.dataset.pid]; const st = boardState(p);
    if (ba.dataset.bact === 'back') { st.units.pop(); refreshBuild(p); }
    else if (ba.dataset.bact === 'clear') { st.units = []; refreshBuild(p); }
    else if (ba.dataset.bact === 'splitnext') {
      const drill = X2.drill[p.id] || [];
      st.splitIdx = (st.splitIdx + 1) % Math.max(drill.length, 1);
      st.placed = 0; st.used = {}; st.seq = [];
      refreshSplit(p);
    } else if (ba.dataset.bact === 'splitreset') { st.placed = 0; st.used = {}; refreshSplit(p); }
    return;
  }
  const stl = c.closest('[data-stile]');
  if (stl) {
    const p = PATS[stl.dataset.pid]; const st = boardState(p);
    const drill = X2.drill[p.id];
    const ent = drill[st.splitIdx % drill.length];
    const idx = +stl.dataset.stile;
    if (idx === st.placed) {
      st.used = st.used || {}; st.used[idx] = true; st.placed++;
      refreshSplit(p);
      if (st.placed >= ent[1].length) speak(DATA.bank[ent[0]][0]);
    } else {
      stl.classList.add('shake'); setTimeout(() => stl.classList.remove('shake'), 550);
    }
    return;
  }
  const ca = c.closest('[data-cact]');
  if (ca) {
    const p = PATS[ca.dataset.pid]; const st = CHAINST[p.id];
    const chs = X2.chains[p.id];
    if (ca.dataset.cact === 'next') st.step++;
    else if (ca.dataset.cact === 'restart') st.step = 0;
    else if (ca.dataset.cact === 'other') { st.ci = (st.ci + 1) % chs.length; st.step = 0; }
    refreshChain(p);
    return;
  }
});

home();  // 重绘首页，带上 v2 横幅

</script>
