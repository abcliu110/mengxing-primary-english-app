    - beat: th 清浊分班
      text_adult: 虚词与指示词读浊 /ð/——the, this, that, these, those, they, them, their, then, than, there, thus, though 一队；实词读清 /θ/——think, three, month, tooth；词中 -th- 在本族词里常浊化（father, weather, either）；例外：人名、地名与个别希腊词的 th 读 /t/（Thomas, Thames, thyme）。
