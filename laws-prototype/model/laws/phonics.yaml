      text_kid: 英语的音节一共装六种盒子：关门盒（closed，元音被辅音关在里面，读短音：cat、fish）、开门盒（open，元音在门口，读长音：me、go)、魔术 e 盒（cake)、组队盒（两个字母合读一个音：boat、boy)、r 老板盒（元音被 r 管住：car、bird）和 -le 盒（table、little）。遇到长词先找元音、再分盒子；两个元音只夹着一个辅音时（tiger、river 这种），先按「老虎切法」把辅音划给后一盒（ti-ger，元音读长），读出来不像词，再换「骆驼切法」划给前一盒（riv-er，元音读短）。
    - beat: 切分操作（压制序）
      text_adult: 见到长词先标元音、看辅音个数定策略——两元音间夹两个辅音 → 从中间切（VC/CV「兔子切法」:rab-bit、nap-kin,digraph 与 blend 不拆）；夹一个辅音（VCV）→ 先试 V/CV（老虎切法，开音节、长元音），不成立再试 VC/V（骆驼切法，闭音节、短元音）——robot 先 ro-bot 一次成功，river 先 ri-ver 读着不像词、改 riv-er 成功，camel、lemon、finish 同理（骆驼词）；夹零个（两元音相邻又不成组合）→ 两元音间切（V/V:li-on、di-et)。「先开后闭」是概率排序：教学传统通称 VCV 词约 75% 归老虎切法（见待补），所以先试命中率高的切法、失败再换，是一次「带回退的猜测」，不是判定程序。
