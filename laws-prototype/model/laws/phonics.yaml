    disputes:
    - 清点口径之争（5/7/8/9 职）本身说明这组「职责」是教学用的事后归纳，不是语言学家公认的历时成因清单——历时地看，词尾 e 大面积来自中古英语屈折词尾的脱落与印刷定型，各「职」是后人对存留格局的功能解释。教学界（LoE/OG）认为功能解释对儿童最有用；正字法研究（如 Venezky 的结构分析）则更愿意把它描述为「位置与形态条件下的拼写格局」而非一条条目的规则。两说并存登记，本条按教学可用性取功能说，但标题句已标明节选性质。
