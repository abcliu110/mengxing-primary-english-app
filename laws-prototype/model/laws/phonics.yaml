  headline: 小词有两副嗓子：a、the、to、can 这些功能词，单独念读强式，放进句子里多半读弱式
  headline_kid: 小词单独站着时念得清清楚楚，钻进句子里就变小声、变短了——这不是读错，是英语的规矩。
