- id: S-29
  zone: 拼读
  group: S
  order: 29
  headline: 拼写可预测性有实测账本：纯按声音规则只能拼对一半词，放宽到「只错一个音」是 84%，再算上词形与词源只剩约 4% 真不规则——高于这个账本的百分比（如 98%）都是未经独立验证的宣传数
  headline_kid: 英语单词里，一半光靠「听音拼字」就能拼对；再算上「只拼错一个音」的，十个里有八个多能拼对；真正捣乱的只有一小撮，我们把它们单独记住。
  claim:
    type: rule
    statement: 拼写可预测性实测账本（Hanna et al. 1966，17,310 词）：纯音位—字素规则全对 49.9%、错一处 36.4%（合计约 84% 大体可预测）；再计入词形与词源规则，只剩约 4% 真不规则。
    evidence:
    - 'Hanna, Hanna, Hodges & Rudorf (1966)《Phoneme-Grapheme Correspondences as Cues to Spelling Improvement》, U.S. Office of Education（ERIC 摘要：https://eric.ed.gov/?id=ED028169 ，载 17,310 词样本）；复述见 Bowers & Bowers (2017) 52(2): 124–141 与 Joshi, Treiman, Carreker & Moats (2008)《American Educator》。接触等级：二手互证（1966 原报告全文未打开）。'
    - 支撑：辅音一致性远高于元音：辅音词首 96%、词尾 91% 一致，元音孤立看仅约 52%（Treiman et al. 1995）——「变脸」几乎全发生在元音区，与 S-30 辅音可靠区互证。
    scope: 一切百分比引用必须带口径（样本、方向、计不计条件规则）；高于本账本的百分比（如 98%）多为未经独立验证的宣传数，不入结论。
    exceptions: []
  mechanism:
    beats:
    - beat: Hanna 账本三段
      text_adult: Hanna、Hanna、Hodges & Rudorf（1966）把 17,310 个词交给只懂音位—字素对应规则的计算机程序拼写：全对 49.9%，错一处 36.4%，错两处 11.4%，错三处 2.3%。教育界通行概括是「约 50% 完全可预测 + 34% 只差一个音 ≈ 84% 大体可预测；再计入词形与词源，只剩约 4% 真不规则」（Joshi et al. 2008）。对应规模本身很大：40 余个音位对应 250 多个字素（Moats 综述口径），所以「可预测」靠的是位置、重音、词形等条件规则网，而非一对一。对应教学三段：系统拼读主线（可预测的一半）、近规则词（错一处的一批，错处多在元音）、变脸名单（真不规则的 4%）。
      anchors: []
      text_kid: 英语单词里，一半光靠「听音拼字」就能拼对；再算上「只拼错一个音」的，十个里有八个多能拼对；真正捣乱的只有一小撮，我们把它们单独记住。
