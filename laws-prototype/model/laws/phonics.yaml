    boundary: ①两张表是美国 L1 初学读者的工具，中国 EFL 学习者应按自家课标词表与分级读物重排高频序，不直接进口名单。②直认快线只服务最高频的一小批词，它是拼读主线的并行件不是替代品：把 220 词全做成闪卡背形状、挤掉拼读教学，正是阅读科学批评的老做法（Dolch 本人是 look-say 主张者，此历史立场与现代机制说明的张力如实并存于本条）。③「覆盖 50–75%」等数字是课程界通行说法，引用时不得当作精确统计结论（见纠正记录）。
