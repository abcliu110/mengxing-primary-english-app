  adult:
    sources:
    - Clymer (1963)（数字经 Johnston 2001、Krashen 2002、PIRLS phonics 评论章三处学术来源互证；Johnston 2001 大学存档 PDF 本轮打开）；Bailey (1967)。接触等级：学术二手系统论述级（数字三方互证，原文未直开）。
    boundary: 词表年代与范围：2,600 词是初级读物词表，结论对小学低年级词汇最直接；词表换成成人词典，数字会变（方向不会逆转，聚合规则先天受制于成员异质性）。「final e 规则 63%」与另一表述方向（先长音则 e 静音）计得 60% 的版本差异属概括措辞差，登记不裁。
    disputes:
    - Clymer 的结论在阅读战争中被双方武器化：全语言派引它证明「拼读规则大多不可靠」；拼读派（Johnston、Adams 1990 的再分析）指出 Clymer 的样本是已教给低年级儿童的词、且把异质组合聚合计算，拆开看多数具体格局可靠、值得教。本清单立场（与 S-01/S-06 一致）：规则按「有条件＋标可靠度」的方式教，聚合型顺口溜下架——两派的交集（别教这句顺口溜）是确定的，分歧只在对拼读教学整体的推论上，登记原样。
    evidence_grade: 学术二手系统论述级
