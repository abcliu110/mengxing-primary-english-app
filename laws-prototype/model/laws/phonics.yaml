    - beat: 加后缀时的 k 插入（本条最重要的操作面）
      text_adult: 以 c 结尾的词加 -ing/-ed/-y 等以 e、i 开头的后缀时，要在 c 后插入 k 保住 /k/：panic→panicking/panicky、picnic→picnicking、traffic→trafficked、mimic→mimicking、frolic→frolicking——不插 k，ci 就会被读软。这是本条在写作中最常被用错的一点（中国学生常写 *paniced)。
