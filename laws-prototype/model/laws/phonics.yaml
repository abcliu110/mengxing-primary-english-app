  error_cases: []
  probes: []
  quiz: []
  relatives:
  - id: S-06
    rel: 同族
  - id: S-30
    rel: 同族
  - id: S-42
    rel: 同族
  prereq: []
  pain_points:
  - 错不完
  adult:
    sources:
    - Hanna et al. (1966), U.S. Office of Education, ERIC ED028169；Bowers & Bowers (2017)；Joshi et al. (2008)；Venezky (1970)《The Structure of English Orthography》、(1999)《The American Way of Spelling》；Treiman et al. (1995)。接触等级：二手互证。
    boundary: 纠正任务书两处（详见纠正记录）：「166 条 GPC」不得挂 Hanna 名下；归于 Venezky 的「75%」「85–87%」无可核出处，两数一律不入结论。Venezky 的贡献是结构性的，本人从未给出此类百分比。
    disputes:
    - Logic of English（Eide 2011/2012）宣称「74/75 个 phonogram + 30/31 条规则可解释 98% 的词」——出版方自述且不同版本数字互不一致，独立评测亦明言该数是「出版者自己的说法，而非独立发现」；本清单只登记为营销级主张。另一侧的学术估计同样有散布：Kreiner (1992) 估约 60% 的词对拼写而言不规则，Crystal (2003) 估纯语音规则可预测 56%——方向与口径不同则数字不同，引用时必须带口径。
    evidence_grade: 二手互证（同行评审复述 + ERIC 官方摘要）
    pending:
    - （2026-11-02 终局登记）「166」出处一项关闭：Carney (1994)《A Survey of English Spelling》(Routledge, 535 页）确为实有其书且含逐音位穷尽式统计清点（Google Books 著录与拼写学学位论文对其体系的专述互证），但「58 + 108 = 166 个与辅音有关字素」这一具体表数未能在任何可及来源中定位坐实——归属 Carney 维持「疑似」终局登记，不升为定版；「不得挂 Hanna 名下」的纠正不变。
  corrections:
  - 任务书称 Hanna 等「系统算出 166 条 GPC」——Hanna 研究的各家复述中均无此数字，不得再挂 Hanna 名下（疑为 Carney 1994——2026-11-02 复核未能坐实，归属维持「疑似」终局登记，见 adult.pending）。
  - 任务书归于 Venezky 的「约 75% 可规则预测」「算上形态与重音可到 85–87%」均无可核出处，不入结论；Chomsky & Halle (1968) 对拼写的评价是定性的，从未给出百分比。
