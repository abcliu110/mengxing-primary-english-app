    statement: 双元音组分布：oi（词中）/oy（词尾）→/ɔɪ/；ou（词中）/ow→/aʊ/，ow 兼读 /əʊ/（两读只有倾向、无完备规则）；au（词中）/aw（词尾）与 a+ll→/ɔː/（中尾分工是倾向）。
    evidence:
    - Letters and Sounds Phase 3 的 oi、ow、au 等 GPC 与 Phase 5 中 oy、ou、aw 等替代拼法表（课程文件级，开页核对）；例词读音按剑桥词典核对（词典级）：calm /kɑːm/、half /hɑːf/、oyster /ˈɔɪstə/ 经核。
    - 支撑：「中尾分工」（oi/oy、ai/ay、au/aw）在 Spalding、Logic of English 与 Letters and Sounds 三家体系中口径一致，是拼法菜单里少数接近规则的位置规律；ow 两读在所有课程中均被点名为「见词定读」的典型。
    scope: ow 两读按词成组记，不编口诀；中尾分工是倾向（oy 偶在词中）。本条与 SR-05「ow 两读分布」条互挂。
    exceptions:
    - ow 两读分布只有倾向：词尾多 /əʊ/（snow、window），但 how、now 读 /aʊ/；词中 bowl 读 /əʊ/、down 读 /aʊ/——无完备规则
    - oy 偶在词中：oyster、royal
    - al 两分：talk/walk/ball 组 a 读 /ɔː/，calm、palm、half、father 组 a 读 /ɑː/（l 同样不发音）——同是 a+l 静音，读音分家
    - au 个别词读他音：aunt 英 /ɑːnt/、美 /ænt/，单记
