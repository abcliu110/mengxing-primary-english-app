- id: SR-06
  zone: 拼读
  group: SR
  order: 6
  headline: 词尾音节有「合同价」：-tion 与 -cian 恒读 /ʃən/，-sion 看前邻居分 /ʒən/ 与 /ʃən/，-ate 看词类分 /eɪt/ 与 /ət/
  headline_kid: 长词的尾巴有一批「批发价」读音，认准尾巴就能读对一大串：-tion 和 -cian 都读「shun」(/ʃən/)；-sion 有两种价——前面是元音就读「zhun」(/ʒən/，vision)，前面是辅音就读「shun」(tension)；-ture 读「cher」(/tʃər/，picture)；-age 轻轻读 /ɪdʒ/(village)；-ous 轻轻读 /əs/(famous)；最妙的是 -ate：当动词读 /eɪt/(separate 是动词时），当名词、形容词就缩成 /ət/——同一个词，身份变了，尾巴的价就变了。
  claim:
    type: rule
    statement: 词尾音节合同价：-tion 与 -cian 恒读 /ʃən/；-sion 前接元音读 /ʒən/、前接辅音读 /ʃən/（接 r 游移）；-ture（非重读）读 /tʃər/；-age（非重读本土老词）读 /ɪdʒ/；-ous 读 /əs/；多音节拉丁词的 -ate 动词形读 /eɪt/、名词/形容词形弱化为 /ət/。共同成因是非重读尾音节的弱化定型。
    evidence:
    - The Reading League《Teaching Reading in Brief》Vol. 3 No. 6「-tion, -sion, -cian」专文（本轮打开课程 PDF，含 “ti before a vowel often says /sh/… -tion /ʃən/; si can say /zh/ (vision) or /sh/ (tension); ci before a vowel says /sh/” 的原表）；-sion 的元音/辅音分工经发音教学来源（Learn English Sounds 词尾专题、Really Learn English 拼写规则课）互证；-ate 双读经语音学课程讲义（英语语音学 stress 讲义附 animate/estimate/graduate/separate 完整对照表）与 Cambridge 词典注音互证。接触等级：课程文件级＋多源转述互证级。
    - 支撑：这组「合同价」是多音节词解码的最高杠杆之一：小学高年级起 -tion 家族是学术词汇的门牌（information、education），认尾即读对的覆盖面随年级陡增（与 V-30 拉丁词根条互为表里）。-ate 双读还有语法收益：读对尾巴即标出词类，是「重音/弱读承担语法信息」的儿童可感实例（与 GR 组 record/present 型重音对立同族，但那是重音移位，这是尾元音弱化，别混）。
    scope: -ate 射程仅限多音节词的拉丁后缀 -ate（单音节 gate、plate、fate 是 VCe 格局，归 SR-01 第①职）；-age 合同价只管非重读的本土老词；-sion 前接 r 的词（version 等）英美读音未统一，儿童面按所在教材注音教，不裁决。
    exceptions:
    - -stion 小簇破价：question、suggestion、digestion、combustion 的 -tion 读 /tʃən/ 系（suggestion 英式还可读 /dʒ/)——ti 前有 s 时腭化路径不同，单列一小串；Christian 的 ti 读 /tʃ/ 同属 -sti- 小簇
    - -age 的法语新借词不按合同价：garage（英式 /ˈɡærɑːʒ/)、mirage、camouflage 读 /ɑːʒ/；重读的 -age 读 /eɪdʒ/(engage、outrage)
    - -ate 名词侧真例外小名单：mandate（名词亦读 /ˈmændeɪt/)、primate（名词 /ˈpraɪmeɪt/)、化学盐类名词（nitrate、sulfate 作名词常读 /eɪt/)
  mechanism:
    beats:
    - beat: 合同价七项
      text_adult: 这组读音的共同成因是非重读尾音节的弱化定型：拉丁来源的后缀进入英语后，在非重读位置上被压成固定的弱读形，拼写保留、读音打包出售。逐项定版：①-tion → /ʃən/(action、nation、motion、education)，近乎无例外；②-cian → /ʃən/(musician、magician、electrician、politician——专表「做…的人」)，无例外；③-sion 分工：前接元音 → /ʒən/(vision、decision、occasion、explosion、confusion)；前接辅音（多为 n、l）→ /ʃən/(tension、pension、extension、compulsion)；前接 r 时游移（version、conversion 英美与个人变体并存，词典双注）；④-ture → /tʃər/(picture、nature、future、culture、creature)，限非重读；⑤-age → /ɪdʒ/(village、cabbage、manage、message)，限非重读且已本土化的词；⑥-ous → /əs/(famous、nervous、dangerous、jealous)，恒非重读；⑦-ate 词类双读：多音节拉丁词中，动词形的 -ate 带次重音读 /eɪt/(animate、separate、graduate、estimate、moderate 作动词时），名词/形容词形不重读、弱化为 /ət/（或 /ɪt/)(animate、separate、graduate、estimate、moderate 作名/形时）——同一拼写、两种读音、词类是开关。拉丁层 -ti-/-ci-/-si- 定音（与 -tion 同源的词中版）：元音前的 ti、ci 多读 /ʃ/(nation、patient、special、crucial、ancient)，元音后的 si 读 /ʒ/(vision、usual 的 su 同理）——这是「词源层决定读音」的招牌例，与 V-19 三地层（拉丁层）互挂。
