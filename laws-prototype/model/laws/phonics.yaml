- id: SR-01
  zone: 拼读
  group: SR
  order: 1
  headline: 词尾那个不出声的 e 不是来混日子的：它一口气干五份工——但「五」只是教学节选，传统原表有九项
  headline_kid: 单词最后那个不读出声的 e，其实是个大忙人：它能让前面的元音读长（tap→tape）、能让 c 和 g 变软（ice、cage）、能站在词尾「扶住」v 和 u 不让它们当最后一个字母（have、blue）、能给 th 定清浊（bath 洗澡水 → bathe 洗澡）、还能给 -le 音节凑一个元音（little、table）。看见词尾的 e，先问它在干哪份工。
  claim:
    type: rule
    statement: 词尾静音 e 有五项功能最明确的职责：①长音化（VCe 标记前元音读长音）②软化（使紧邻的 c 读 /s/、g 读 /dʒ/）③词尾护栏（本土词不以 I、U、V、J 收尾）④th 清浊标记（名词清 /θ/ 不带 e、动词浊 /ð/ 带 e）⑤-le 凑音节；其中只有①改变元音读音，其余四职都是拼写合法性标记。「五职」是教学节选口径，Eide 原表共 9 项理由。
    evidence:
    - Denise Eide《Uncovering the Logic of English》(Logic of English, 2012）对 silent final e 的理由清点——本轮未打开原书，经三种独立转述（Pride Reading Program 的 7 职版、Literacy Learn 明确注明取材 Eide 的 9 职版、多个 OG 系教师材料）逐项互证，五职的例词与表述三方一致；「词尾禁收尾字母」在 Eide 体系的规范表述为 “English words do not end in I, U, V or J”（LoE 课程规则页转述一致）。接触等级：多源转述互证级（原书未直开）。
    - 支撑：第①职的实测坐标——Clymer (1963）对小学词表的检验中，「词尾有 e 时首元音读长、e 不发音」这条概括的命中率只有 63%，所以第①职是五职里最需要配合变脸名单使用的一职（详见 SR-08）。第③职的近孤例：Hickey 教学法的规则卡片直言词尾 v 规则「英语中唯一的例外是 spiv（英式俚语）」——可见其在本土词层面的覆盖率。
    scope: 第③职只对本土核心词近乎无例外（外来词与截短词可破，见例外）；第④职适用面很小，仅限 bath/bathe 等少数同源词对与 -the 结尾的动词族；被本条略去的另三职（防像复数、给短词凑长度、无职之 e）登记在成人层边界，不作本条 claim。
    exceptions:
    - 第③职的外来/截短破例：u 收尾——menu、emu、guru、haiku、tofu、flu（influenza 的截短）；v 收尾——improv、rev（截短）、chav、maglev；词尾 v 规则在本土词层面的近孤例为 spiv（英式俚语）
    - 第④职不可反推：名词侧 wreath、sheath 的动词 sheathe 才带 e；lithe、blithe 本身即读 /ð/ 且无对立名词——「带 e 必浊」不成立于其他 th 词
