      - bachelor
      text_kid: 短元音是个「小个子」，后面的辅音要穿厚一点保护它：back 不写 bak，要写 ck；catch 写 tch；bridge 写 dge。还有些字母是「哨兵」：站在词里但不出声——kn 的 k、wr 的 w、lamb 的 b，都是哨兵。
    - beat: 哑字母组合清单
      text_adult: kn- 读 /n/（knee, knife, know）；wr- 读 /r/（write, wrong, wrist）；词尾 -mb 读 /m/（lamb, thumb, climb；但词中的 timber, number 的 b 要响）；gn 读 /n/（sign, gnome, gnaw；但词中 signal, signature 的 g 要响——拼写为词形家族守恒，见 S-21）；词尾 -mn 读 /m/（hymn, autumn）；词首 ps- 读 /s/（psychology, psalm）、pn- 读 /n/（pneumonia）、pt- 读 /t/（ptarmigan）、mn- 读 /n/（mnemonic）。本条只做清单与识别，「为什么哑」见 S-19。
