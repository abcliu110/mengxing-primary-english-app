    exceptions:
    - VCV 位置的读法不由类型单独判定：tiger 开（长）、camel 闭（短），须两试（压制序见 SR-09）。
  mechanism:
    beats:
    - beat: 六型与默认读法
      text_adult: Orton-Gillingham 传统把英语音节归为六型，作为「元音读法预测表」：①闭音节（Closed）——元音被辅音封住，读短元音（cat、rabbit 的两节皆闭）；②开音节（Open）——以元音结尾，读长元音（go、music 的首节）；③VCe 音节——尾 e 不发音、前元音读长（cake、compete）；④元音组合音节（Vowel Team）——两个元音字母合拼一个音（boat、teacher）；⑤r 控音节（R-controlled）——元音+r 合成特殊音（car、corner），判定优先级最高（war 按 r 控读）；⑥辅音-le 音节——词尾辅音+le 自成一节（table、apple），其中的 e 不发音、节内带弱化元音。六型与音节切分规则配套：先切分、按型定元音、再拼合整词。助记序 REVLOC/CLOVER 记六型的「压制顺序」。
