- id: SR-08
  zone: 拼读
  group: SR
  order: 8
  headline: 辟谣位：「两个元音手拉手，第一个开口」——实测只对 45%，而且错在「把一队人当一个人」
  headline_kid: 有句顺口溜说：两个元音字母手拉手走路时，第一个开口说话、第二个不出声（meat、rain、boat 好像是这样）。可是有人把小学课本里的词一个个查过：这句话只对 45%——比瞎猜强不了多少。bread、head、said、great、friend 全是反例。真相是：每个元音组合（ai、ea、ee、oa、oo、ou……）都有自己的脾气，要一个一个认，不能靠一句顺口溜全搞定。
  claim:
    type: rule
    statement: 实测裁决（Clymer 1963，2,600 词小学词表）：聚合口诀「两个元音相邻时第一个读长音、第二个不发音」的符合率只有 45%，其近亲「词尾 e 规则」只有 63%，均低于 Clymer 设定的 75%「值得教」门槛（45 条概括仅 18 条过线）；错误根源是聚合错误——把格局完全不同的组合打包成一条规则。对照：辅音类概括几乎全部 ≥95%。教学替代是逐个组合教、按组合标可靠度。
    evidence:
    - 'Theodore Clymer, “The Utility of Phonic Generalizations in the Primary Grades,” The Reading Teacher 16(4): 252–258 (1963)；1996 年重刊于 The Reading Teacher 50: 182–187。本轮未直开原文，45% 与 63% 两数字经三处学术来源互证一致（Johnston 2001 的再检验长文（The Reading Teacher 55(2): 132–143，本轮打开其大学存档 PDF 的文本）、Krashen (2002）综述、PIRLS phonics 评论章）。后续检验：Bailey (1967）把同一批概括扩检到 1–6 年级词表，结论方向一致。接触等级：学术二手系统论述级（数字三方互证）。'
    - 支撑：Johnston (2001）的再检验给本条留了必要的另一面：把聚合拆开看，单个组合的可靠度天差地别——ay、ee 近乎无例外地服从「第一字母长音」式读法，aw、oy、oi 则稳定地读它们自己的双元音（只是不符合顺口溜的字面而已）。所以正确的教学替代不是「元音组合不可教」，而是「逐个组合教、按组合标可靠度」——这正是 S-33 拼法菜单的存在理由，本条为它提供证据基座。
    scope: 45% 的口径：它是「全部相邻元音对」在 1960 年代小学词表（四套小学基础读本＋Gates 初级词表，2,600 词）上的整体符合率（含 oo、ou、oi 等根本不该由该顺口溜管辖的组合）；用它去否定某个具体组合（如 ee）的教学价值，是拿聚合数字打单点。本条只辟「两元音同行」这一句；不适用于评价 VCe（SR-01)、位置规则（SR-05）等有条件限定的格局。
    exceptions:
    - 口诀的反例组（给孩子看的）：bread、head、said、great、friend——ea、said 等不在「第一元音长读」的格局内
  mechanism:
    beats:
    - beat: 聚合错误与实测
      text_adult: 被辟的概括是 “When two vowels go walking, the first one does the talking”（正规表述：两个元音相邻时，第一个读长音、第二个不发音）。它的错误是聚合错误：把读音格局完全不同的组合（读长音的 ai/ea/oa、读双元音的 oi/ou、两读的 oo/ow/ea、读短音的 ea in bread 等）打包成一条规则，于是命中率被低格局成员拖垮。实测（Clymer 1963）：在由四套小学基础读本＋Gates 初级词表组成的 2,600 词分析表上，这条概括的符合率是 45%；同一研究中，它的近亲「词尾 e 规则」（cake 型表述）也只有 63%——两者都低于 Clymer 设定的「值得教」门槛（概括须在至少 75% 的适用场合成立才算有用）。Clymer 共检验 45 条教学概括，仅 18 条过线；值得注意的对照是：辅音类概括几乎全部 ≥95%（如 kn- 的 k 不发音 100%、ch 只发一音 100%）——英语拼读的可靠区在辅音、不在元音聚合规则（与 S-06 的统计观完全同构）。
      anchors:
      - meat
      - rain
      - boat
      - bread
      - head
      - said
      - great
      - friend
      text_kid: 有句顺口溜说：两个元音字母手拉手走路时，第一个开口说话、第二个不出声（meat、rain、boat 好像是这样）。可是有人把小学课本里的词一个个查过：这句话只对 45%——比瞎猜强不了多少。bread、head、said、great、friend 全是反例。真相是：每个元音组合（ai、ea、ee、oa、oo、ou……）都有自己的脾气，要一个一个认，不能靠一句顺口溜全搞定。
