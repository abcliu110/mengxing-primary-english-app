- id: S-14
  zone: 拼读
  group: S
  order: 14
  headline: 中国孩子发音的难点不在「舌头笨」，在汉语的音系清单和英语不一样：没有的音、没有的弱读、没有的词尾辅音群，要专门补
  headline_kid: 有些英语声音，汉语里根本没有，所以嘴巴没学过——不是你不聪明，是要单独练这几个新动作。
  claim:
    type: tendency
    statement: 中国学习者的发音难点可由汉英音系对比系统预测：汉语没有 /θ ð v/、没有词尾辅音丛、元音不弱化，学习者以最近邻汉语音顶替并带入平均用力的节奏。
    evidence:
    - 王桂珍（广东外语外贸大学教授，国家级教学名师）汉英语音对比研究与教学体系：论文《汉英音幅与基频模式的特点及其对英语语音教学的启示》、教材《英语语音教程》（高等教育出版社，国家级规划教材；《英语语音》课程 2005 年国家精品课程）。https://onlinenew.enetedu.com/sysu/Course/TeacherDetail?tid=870
    - 支撑：对比分析与语音习得研究一致表明，L1 音系差异点能系统预测发音困难分布。
    scope: 群体预测口径：预测不等于判决，个体差异（听辨敏感度、模仿意愿、输入量）使同一难点程度悬殊；清单用于排教学优先级，不用于给孩子的发音贴标签。组合层逐项落地见 S-43。
    exceptions:
    - 个体差异可使同一预测难点在不同孩子身上程度悬殊。
  mechanism:
    beats:
    - beat: 母语语音系统过滤
      text_adult: 语音习得受母语语音系统过滤：汉语没有 /θ ð v/、没有词尾辅音丛、音节结构简单且元音不弱化，学习者会不自觉地用最接近的汉语音去顶替（think→sink/fink、word 尾巴吞音），并把「每音节平均用力」的节奏带入英语；难点清单可以按汉英音系对比逐项列出、逐项击破，而不是笼统说「发音不准」。
      anchors:
