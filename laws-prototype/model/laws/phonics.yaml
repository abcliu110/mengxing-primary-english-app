    rel: 同族
  - id: S-42
    rel: 同族
  prereq: []
  pain_points:
  - 听不懂
  - 读不快
  adult:
    sources:
    - Usha Goswami & Peter Bryant (1990), Erlbaum。https://www.academia.edu/67386986/Phonological_Skills_and_Learning_to_Read
    boundary: 韵脚类比只覆盖拼法一致的词族；英语有大量同音异形与异读韵脚（如 -ea 家族），类比到这些词上会出错，须与变脸名单教学配合。
    disputes:
    - Goswami 学派强调大单位（韵脚）路径，Ehri/NRP 一线强调音素级映射是熟词形成的必经之路；主流共识已调和（韵脚意识是前奏与辅助，音素意识是解码的必需条件），但两条路径的课时配比仍无定论。
    evidence_grade: 一手专著
