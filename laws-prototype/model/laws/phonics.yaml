  adult:
    sources:
    - 美国国家阅读委员会（National Reading Panel）2000 年报告《Teaching Children to Read》字母学分报告；Ehri, Nunes, Stahl & Willows (2001), Review of Educational Research 71(3)。https://psycnet.apa.org/record/2002-18026-002
    boundary: 对含认知障碍的低成就读者未见显著收益；拼读管「认词」不管「读懂」，不能替代语言理解教学（见 S-07 的分歧说明）。
    disputes:
    - NRP 报告的方法学长期受批评（如取样与编码口径之争），但「系统拼读优于非系统/无拼读」的方向性结论在后续综述（Torgerson et al. 2006；Castles et al. 2018）中被反复确认，争的是效应大小不是方向。
    evidence_grade: 一手元分析（期刊原文著录）
