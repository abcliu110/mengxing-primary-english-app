- id: S-31
  zone: 拼读
  group: S
  order: 31
  headline: c 和 g 碰到 e、i、y 就「变软」：c 变 /s/、g 变 /dʒ/；但一小队老词死活不软——get、girl、give、gear、geese 全读硬 g，这队例外可以整队记住
  headline_kid: 字母 c 和 g 是看人下菜的：后面站着 e、i、y，它们就换上软声音；后面是 a、o、u，就保持硬声音。有几个老词脾气倔，怎么都不软，我们把它们编成一队一起记。
  claim:
    type: rule
    statement: c、g 紧跟 e、i、y 时软化（c→/s/、g→/dʒ/），后接 a、o、u 时读硬音；不在罗曼语软化波及范围内的词保留硬 g，例外成队可记。
    evidence:
    - Wiktionary 附录 “English words where G is pronounced exceptionally”, https://en.wiktionary.org/wiki/Appendix:Glossary_of_English_words_where_G_is_pronounced_exceptionally ；拼读教材例外表互证；历史来源见 Baugh & Cable《A History of the English Language》。接触等级：二手互证。
    - 支撑：本条与 S-30 的 j 分工互锁：/dʒ/ 在 a/o/u 前只能写 j（jam），在 e/i/y 前多写 g（gem），词尾写 -ge / -dge（age, badge，见 S-33）——一张「/dʒ/ 拼法地图」由此成形。
    scope: 规则只管「c/g 紧跟 e、i、y」的单字母位置：gg（egg）不软，词尾 -ge 的处理另有规则条承接。例外队的共同点是「不在罗曼语软化波及范围内」，来源不止本族一途，不可把名单讲成「全是老英语词」（见纠正记录）。
    exceptions:
    - 硬 g 例外队：get、give、girl、gift、gear、geese、giggle、girdle、gill（鱼鳃）、begin、together；借词：geyser（冰岛语）、gecko（马来语拟声）、ginkgo
    - gill 一词两读：鱼鳃读 /ɡ/、量器读 /dʒ/
    - c 的例外：sceptic（英式读 /sk/）、Celtic（学界多读 /k/、足球俱乐部名读 /s/，两种读法都有）、意大利语层 cello、concerto 里 c + e 读 /tʃ/
  mechanism:
    beats:
    - beat: 软化机制
      text_adult: 软化是罗曼语层带进来的读法：拉丁语晚期与法语里 /k/、/g/ 在前元音（e/i）前腭化，诺曼法语借词把「c = /s/、g = /dʒ/」的对应搬进英语（cent, city, cycle；gem, giant, gym）。不在这波腭化范围内的词保留硬音。
      anchors:
      - cent
      - city
      - cycle
      - gem
      - giant
      - gym
      - egg
      text_kid: 字母 c 和 g 是看人下菜的：后面站着 e、i、y，它们就换上软声音；后面是 a、o、u，就保持硬声音。有几个老词脾气倔，怎么都不软，我们把它们编成一队一起记。
  examples:
  - level: 1
    group: 软化正例
    words:
    - cent
    - city
    - cycle
    - gem
    - giant
    - gym
    supports: claim
  - level: 2
    group: 硬 g 例外队
    words:
    - get
    - give
