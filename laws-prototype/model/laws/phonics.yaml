  adult:
    sources:
    - Scripps National Spelling Bee 竞赛规则（2024 年版）与《Suggested Rules for Spelling Bees》(2025)；《Spell It!》(2012 年版）。比赛的官方词典为 Merriam-Webster 第三版国际词典。接触等级：机构传统级。
    boundary: ①规则给的是「语言来源」，不是完整词源链——更不是词根：把比赛打法说成「问词源/问词根」是转述夸大（见纠正记录）。②地层拼写是倾向系统，选手靠多线索交叉。③赛事词表不迁移，只迁移问法与分层法。④证据等级天花板：机构传统与方法论条目，无对照实验证明它比别的拼法教学更有效。
    disputes:
    - 拼字比赛在教育界有保留意见：批评方认为赛事激励的是表演性记忆与淘汰赛焦虑，其词表与日常读写需求脱节；主办与参与方以参与规模与词汇意识收益回应。清单口径：赛事形态不搬，选手的「按来源追问」方法搬；方法与赛事的利弊之争互不绑定。
    evidence_grade: 机构传统级（规则原文核对）
    pending: []
  corrections:
  - 任务书「选手可问词根」不确：按现行竞赛规则选手可问语言来源，但发音员明确不受理「词根信息」请求（“The pronouncer does not entertain root word questions”）；本条已按规则原文纠正。
