- id: S-02
  zone: 拼读
  group: S
  order: 2
  headline: 认词不是把词形拍成照片存起来，而是把拼写、读音、词义在脑子里「焊」成一个整体
  headline_kid: 记住一个词，不是把它当图画背，而是把每个字母和它的声音对上号，对上号的词才记得牢。
  claim:
    type: rule
    statement: 熟词的形成机制是正字法映射：用字母—音素连接把拼写逐段绑定到读音，词以「拼写—读音—意义」三位一体进入长时记忆。
    evidence:
    - 'Linnea C. Ehri (2014)《Orthographic Mapping in the Acquisition of Sight Word Reading, Spelling Memory, and Vocabulary Learning》, Scientific Studies of Reading 18(1): 5–21。'
    - 支撑：映射说解释了为什么「看词卡背整词」效率低、而会拼读的孩子见过几遍生词就能自认——与 S-04 自我教学机制互为表里。
    scope: 以音素分割能力和字母知识为前提；不规则词中只有个别字母不合规，其余部分照样可映射。
    exceptions: []
  mechanism:
    beats:
    - beat: 正字法映射
      text_adult: Ehri 的正字法映射（orthographic mapping）：当孩子用字母—音素连接把拼写逐段绑定到读音上时，词就以「拼写—读音—意义」三位一体的方式进入长时记忆，成为一眼认出的熟词；只看外形记的词换了字体、大小写就认不出。
      anchors:
      - sword
      text_kid: 记住一个词，不是把它当图画背，而是把每个字母和它的声音对上号，对上号的词才记得牢。
  examples:
  - level: 1
    group: 不规则词的部分映射
    words:
    - sword
    supports: claim
