    boundary: ①地图是群体倾向，不是个人判决：方言背景会改写难点谱（见 claim 例外），年龄与输入量亦然；地图只用于排教学优先级，不用于给孩子的发音贴标签（与 S-14 边界一致）。②实证锚的样本多为青少年与成人：向小学低龄迁移时，错误类型可借、错误率不可搬（Huang 样本的「逾 40%」只限该样本）。③处方是教学传统与干预研究支持的练习方向，不是临床言语治疗；持续性发音障碍须转介专业评估。
