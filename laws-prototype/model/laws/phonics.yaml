  order: 22
  headline: 六种音节各管一段元音读法：闭、开、e 结尾、元音搭档、r 当家、-le 收尾
  headline_kid: 长词不用怕，先把它切成小块。每一小块（音节）长什么样，里面的元音就怎么读：后面被辅音「关门」的读短音（cat），敞着口的读长音（go），末尾有个不出声的 e，前面元音读长音（cake），两个元音手拉手读一个音（boat），元音后面跟着 r，就归 r 管（bird），最后是辅音加 -le 的小块，单独收尾（table 里的 -ble）。先认出是哪一种，再开口读。
  claim:
    type: tendency
    statement: 六种音节类型各给出元音的默认读法（闭=短、开=长、VCe=长、元音组合、r 控、辅音-le）；类型是可操作查表流程，给的是默认而非铁定。
    evidence:
    - Orton-Gillingham（OG）多感官结构化语言教学传统（源出 Samuel Orton 与 Anna Gillingham 等人；经 IMSLEC 认证课程体系传承）——六型名单与例词经多份 OG 认证课程文件交叉核对一致。接触等级：传统文献级/二手系统论述级（未打开 Gillingham 原始手册）。
