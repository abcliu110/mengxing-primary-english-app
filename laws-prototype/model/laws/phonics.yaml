  adult:
    sources:
    - Peter Roach《English Phonetics and Phonology》(CUP）复杂词重音章（Roach 1991, p. 96 经多家讲义转述）；Erik Fudge《English Word-Stress》(1984)；photograph 例链转写经课程讲义逐词核对。接触等级：二手系统论述级。
    boundary: ①前拉班有成串例外须进名单（见 claim.exceptions）；口径为「强规则 + 例外名单」，与 S-06/S-20 同。②-graphy 类的位置在不同教材里归类不一，本条按「倒数第三音节」变体著录，引用时注明。③分类管派生词的默认重音，语用因素可临时覆盖。④对中国学生，听辨重音落点未过关时，本条只能作教师知识（与 V-37 双写规则的重音前提同理）。
    disputes:
    - 重音规则的理论地位有真分歧：规则派（生成音系学传统）主张后缀的词汇分层（Level 1 拉重音 / Level 2 中性）是音系系统的内在结构；使用派/范例派主张重音多由词族类推与频率决定、规则只是事后概括。教学层两派结论近似，理论层不合并。另：Roach 三分与 Fudge 的类别边界细节（如 -ette、-esque 的归属）偶有出入，本条从 Roach 三分著录。
