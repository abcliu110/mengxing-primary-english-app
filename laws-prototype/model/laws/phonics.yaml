  headline: buses、watches 里多出来的一个音节不是随便加的：两个「嘶嘶声」不能紧挨着，中间必须垫一个元音
  headline_kid: s、sh 这类嘶嘶声，两个碰在一起舌头打架，英语就在中间垫一个小声音，把它们隔开。
  claim:
    type: rule
    statement: 词尾是嘶声（/s z ʃ ʒ tʃ dʒ/）时，后缀 /s z/ 前插入 /ɪ/（拼写 -es）；同理 -ed 在 /t d/ 后读 /ɪd/。决定读法的是词尾的音，不是字母。
    evidence:
    - Gimson/Cruttenden 语音学传统对 -s 与 -ed 尾缀三读法的标准描写（形态音位学）；纲领 basis 引 Bauer 形态音位为据。https://www.scribd.com/document/527179562/Peter-Roach-English-Phonetics-and-Phol
    - 支撑：三读法（/s/、/z/、/ɪz/ 与 /t/、/d/、/ɪd/）的分布由词尾音的清浊与类别机械决定，是语音学教材的确定性描写，无经验争议。
    scope: 决定读法的是词尾的音不是字母（judged 拼 -ed 读 /d/、horses 拼 -s 读 /ɪz/）；个别词有历史读音（如 naked 作定语读两音节），属词汇例外。
