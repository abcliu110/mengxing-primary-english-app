- id: SR-02
  zone: 拼读
  group: SR
  order: 2
  headline: 短元音后面站着 f、l、s、z，词尾就站双份：Floss 双写律——外加一份高频例外小名单
  headline_kid: 一音节的短词里，短元音后面如果是 f、l、s、z 收尾，这个字母要写两遍：hill、mess、buzz、off。就像短元音太「轻」，需要双份字母把它压住。例外只有一小把：if、us、bus、gas、yes、this、plus，还有 s 读成 /z/ 的那几个（is、has、was）——s 一旦读「滋」的音，就从来不双写。
  claim:
    type: rule
    statement: Floss 双写律（FLoSS(Z)，亦称 1-1-1 规则）：单音节（或重读末音节）、只有一个短元音、f/l/s/z 紧贴在短元音之后、位于词尾——四条件同时成立则双写；词尾 -s 若读 /z/ 则结构性不双写（规则内置条款，非例外）。
    evidence:
    - All About Spelling（All About Learning Press）第 1 册第 17 课原文（本轮打开其官方课时 PDF，全文核对了条件与例外名单）；Reading Universe（WETA/Barksdale Reading Institute/First Book 合作项目）的「FLoSS(Z) Rule」技能说明页；两源的例外名单逐项一致（if、gas、yes、this、us、bus 等）。接触等级：课程文件级。
    - 支撑：规则的另一面在阅读方向同样成立：看见词尾双写的 f/l/s/z，即可反推前元音为短元音——解码与拼写共用同一格局。多家课程（蒙台梭利系、OG 系）都把 Floss 列为儿童最早学到的拼写概括之一，因为它的条件可当场逐项核对（数音节、听元音、看词尾），是「规则感」的入门样本。
    scope: 规则只管 f/l/s/z 四个字母；重读末音节的推广（如 BrE 的 compel 型）属加后缀双写问题，归 V-37 处理，不在本条射程。例外须分三类登记，不得混作一堆（见 claim 例外与机制）。
    exceptions:
    - 词源型例外（截短与借词）：bus（omnibus/autobus 的截短）、gas（gasoline 的截短）、chef 与 clef（法语借词）、pal、gal（俚语词）——它们不是「不听话」，是没经历本土词的定型过程；zz 一支的例外 quiz（与 whiz 的单 z 拼法）
    - 高频小名单（两源名单逐项一致）：if、us、bus、gas、yes、this、plus——儿童面先行直记
    - 射程外零星双写（不归 Floss 管、也不作反例）：add、egg、odd、ebb、inn、mitt、putt
  mechanism:
    beats:
    - beat: 判据四条件与例外三类
      text_adult: Floss 规则（亦称 FLoSS(Z) 或 1-1-1 规则：1 个音节、1 个短元音、词尾 1 个 f/l/s/z）的准确适用条件是四个同时成立：①单音节（或重读末音节）；②只有一个元音且是短元音；③f/l/s/z 紧贴在短元音之后（中间隔着其他辅音不算）；④位于词尾。成立则双写：ff（off、stiff、staff、cuff）、ll（hill、sell、spell、will）、ss（miss、class、grass、pass）、zz（buzz、fizz、jazz、fuzz）。其功能与 SR-03 的 ck/tch/dge 同族：用「加厚的词尾」标记前面的元音是短元音。词尾 -s 若读 /z/ 则结构性不双写（as、is、has、was、his）——因为 ss 在词尾恒读 /s/，双写会改音，故这一支不是「例外」而是规则的内置条款。例外三类：①词源型（见 claim 例外）；②条件不成立型（伪例外）：self、wolf、shelf、gulf 里 f/l 前面隔着辅音，不满足「紧贴短元音」；until、peel 分别不满足单音节/单短元音——根本不在规则射程内，教学中要防止把它们误标为例外而稀释规则；③射程外延型（见 claim 例外）。
