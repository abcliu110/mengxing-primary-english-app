- id: S-33
  zone: 拼读
  group: S
  order: 33
  headline: 短元音后面站岗的辅音要「加厚」：/k/ 写 ck、/tʃ/ 写 tch、/dʒ/ 写 dge；kn、wr、mb、gn 这批组合里有个字母只站岗不发声——认得出它们，就不会读错、拼错
  headline_kid: 短元音是个「小个子」，后面的辅音要穿厚一点保护它：back 不写 bak，要写 ck；catch 写 tch；bridge 写 dge。还有些字母是「哨兵」：站在词里但不出声——kn 的 k、wr 的 w、lamb 的 b，都是哨兵。
  claim:
    type: rule
    statement: 紧跟在单个短元音之后：/k/ 写 ck、词尾 /tʃ/ 写 tch、/dʒ/ 写 dge（规则本体入模于 SR-03，本条为清单版）；哑字母组合按位置识别（kn-/wr-/-mb/gn 等）；gu 后接 e/i 时 u 不发音、只保 g 的硬音。
    evidence:
    - ck/tch/dge 的分布与四词例外：Reading Universe 的 -tch 规则解说，https://readinguniverse.org/skill-explainer/phonics-patterns/trigraphs-tch-skill-explainer/overview-of-the-tch-spelling-rule ，及多家拼读课程规则表互证；哑字母组合清单以 Roach / Cruttenden 对应表与 S-19 已收史述对齐；「守门员 u」是 Orton-Gillingham / Spalding 传统的通行讲授口径。接触等级：二手互证。
    - 支撑：本条与 S-22 六音节类型直接咬合：ck/tch/dge 都是闭音节短元音的拼写标记，读到它们应当反推前面的元音读短——阅读与拼写共用同一张表。
    scope: ck/tch/dge 的适用域是「紧跟在单个短元音之后」：前面是长元音、双元音或辅音时一律回到 ch / ge / k（beach, age, milk），把规则讲成「词尾一律加厚」是常见误教。-mb、gn 的哑与响取决于位置与切分（词尾哑、词中响）。gu 的例外（guano 等）是借词，数量极少。
    exceptions:
    - 短元音后仍写 ch 的高频四词：much、such、rich、which（多音节的 attach、detach、bachelor 亦写 ch）
    - gu 的 u 读 /w/ 的借词例外：guano、guava
  mechanism:
    beats:
    - beat: 短元音后加厚
      text_adult: 单音节词里短元音后的 /k/ 写 ck（back, duck），前面是长元音或辅音时只写 k（beak, milk）；词尾 /tʃ/ 写 tch（catch, pitch），/dʒ/ 写 dge（badge, bridge, judge）。三者的共同逻辑：用加厚的拼写锁住前面的短元音、防它被误读成长元音（与 S-22 闭音节互为表里）。例外整队记：much, such, rich, which 四个高频词在短元音后仍写 ch；多音节的 attach, detach, bachelor 亦写 ch。
      anchors:
      - back
      - duck
      - beak
      - milk
      - catch
      - pitch
      - badge
      - bridge
      - judge
      - much
      - such
      - rich
      - which
      - attach
