- id: S-34
  zone: 拼读
  group: S
  order: 34
  headline: 短元音是闭音节的默认读法：a、e、i、o、u 各守一个短音，u 另有一小队读 /ʊ/，字母 y 在多音节词里顶替短 i
  headline_kid: 元音字母被辅音「关」在音节里时，读短音：a 是小口 /æ/、e 是 /e/、i 是 /ɪ/、o 是 /ɒ/、u 是 /ʌ/；只有一小队 u 字词例外，读短短的 /ʊ/（put 那一队），要成组记。
  claim:
    type: tendency
    statement: 重读闭音节中 a、e、i、o、u 默认读短音 /æ e ɪ ɒ ʌ/；u 有一小队读 /ʊ/（唇音后环境只是倾向，只能整组记）；y 在多音节词中顶替短 i（词中 /ɪ/、词尾 /i/）。
    evidence:
    - Gimson/Cruttenden《Gimson's Pronunciation of English》元音系统与 FOOT–STRUT 分裂的标准描写（书目级）；Letters and Sounds Phase 2–3 短元音 GPC 表（课程文件级，开页核对）；剑桥词典音标口径逐词核对（词典级）。
    - 支撑：五短音是全部拼读课程共同的第一课内容（Letters and Sounds Phase 2 的首批 GPC 即以闭音节短元音为骨架）；/ʊ/ 小队在各家课程中均以「例外组」形式整组呈现。
    scope: 只管重读闭音节；非重读音节的元音弱化归 S-08（schwa）。o 的短音英 /ɒ/ 美 /ɑː/，是同一词位的不同标音，非变脸。标音取英式（RP/SSBE 词典口径）。
    exceptions:
    - /ʊ/ 小队（整组记）：put、pull、full、bull、push、bush、cushion、pudding、wolf、woman、sugar、butcher——唇音后环境只是倾向：pun 与 put 同为唇音开头却读 /ʌ/
    - happy 词尾的 y 现代英式词典标 /i/（happy-tensing），与 gym 的 /ɪ/ 不是同一个音：教拼写时可合并、教听辨时须分开
  mechanism:
    beats:
    - beat: 五短音默认与 u 的分裂
