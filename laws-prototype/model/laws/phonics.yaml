  headline: 双元音组：oi/oy 读 /ɔɪ/、ou/ow 读 /aʊ/（ow 兼读 /əʊ/）、au/aw 与 a+ll 读 /ɔː/
  headline_kid: 四个双元音小组：coin 的 oi 和 boy 的 oy 读 /ɔɪ/（一个站中间、一个站尾巴）；out 的 ou 和 down 的 ow 读 /aʊ/，但 ow 在 snow 里读 /əʊ/，一个人两个嗓子；August 的 au、saw 的 aw 和 ball 里的 a+ll 都读 /ɔː/。
