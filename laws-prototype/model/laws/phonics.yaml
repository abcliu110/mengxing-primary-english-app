- id: S-15
  zone: 拼读
  group: S
  order: 15
  headline: 字母名和单词读音对不上，是因为拼写先被印刷固定下来、读音随后大搬了家——「元音大推移」
  headline_kid: 很久以前字母的读法和现在不一样；书印出来以后，读法又慢慢变了，所以现在字母的名字和它在词里的声音对不上。
  claim:
    type: etymology
    statement: 约 1350–1700 年间英语全部长元音发生链式抬升（元音大推移），而拼写已先被印刷标准化固定，造成字母名与词内读音的系统错位。
    evidence:
    - Otto Jespersen (1909)《A Modern English Grammar on Historical Principles》Part I——首次系统描述并命名 the great vowel-shift；此后为一切英语史教材（如 Baugh & Cable《英语史》）的标准章节。https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/great-vowel-shift
    - 支撑：链式推移有中古英语押韵、拼写变体、私人信件误拼等多重文献证据，是历史语言学共识。
    scope: 推移主要动长元音；短元音与推移后借入的词（如 police）不在内；个别词未跟上链条（father、broad）。
    exceptions: []
    source: Jespersen (1909)《A Modern English Grammar on Historical Principles》Part I 命名并系统描述 the great vowel-shift。
  mechanism:
    beats:
    - beat: 元音大推移
      text_adult: 约 1350–1700 年间，英语全部长元音发生链式抬升（高位元音双元音化），而 15–16 世纪印刷与拼写标准化把旧读音对应的拼写先固定了下来；结果今天字母 a/e/i 的「名字音」其实是推移后的新音，拼写保留的却是推移前的旧格局——字母—音对应的「不规则」有一大块是这场时间差造成的。
      anchors:
      - police
      - father
      - broad
      text_kid: 很久以前字母的读法和现在不一样；书印出来以后，读法又慢慢变了，所以现在字母的名字和它在词里的声音对不上。
  examples:
  - level: 1
    group: 推移外/未跟链例
    words:
    - police
    - father
    - broad
    supports: claim
  error_cases: []
  probes: []
  quiz: []
