    sources:
    - Linnea C. Ehri (1995)；Ehri & McCormick (1998)。https://ufli2.education.ufl.edu/wp-content/uploads/2022/01/EhriPhases.pdf
    boundary: 阶段按「主导连接类型」划分，同一孩子可同时用多种策略；对汉语背景儿童，拼音经验会改变早期阶段的表现形态，具体迁移形态本条未展开。
    disputes:
    - （轻度）Share 的自我教学说主张发展是「逐词条」的连续积累而非阶段跳跃（见 S-04），两说在「有没有阶段」上有张力，在教学结论上基本兼容。
