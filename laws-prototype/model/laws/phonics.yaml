- id: SR-07
  zone: 拼读
  group: SR
  order: 7
  headline: 「i before e except after c」的真实成色：管 /iː/ 时大体可用;"except after c" 在词表计数上是反的——官方结论是「别教口诀，把那几个 cei 词当名单背」
  headline_kid: 有首儿歌说「i 在 e 前面，除非前面是 c」。这首歌只说对了一半：碰到读 /iː/ 的词（believe、field、receive），先猜 ie 通常没错，c 后面那几个 ei 词（receive、ceiling）把它们当一份小名单背下来就行；但碰到不读 /iː/ 的词（their、height、eight、foreign），这首歌完全不管用——先听声音，再谈拼法。
  claim:
    type: tendency
    statement: 裸口诀不值得教（英国教育部官方结论）；带 /iː/ 限定的版本基本正确：读 /iː/ 时默认 ie，c 后读 /iː/ 的 ei 只有一份封闭小名单（receive、conceive、deceive、perceive、ceiling 及 receipt、conceit、deceit）；「except after c」在词条计数上是反的（cie 约为 cei 的 3 倍）。
    evidence:
    - '英国教育部（DCSF）《Support for Spelling》(2009）附录原话——"The i before e except after c rule is not worth teaching… it is easier to learn the specific words: receive, conceive, deceive (+ receipt, conceit, deceit), perceive and ceiling"（本轮经 LINGUIST List 存档的原文引文 p.106 逐字核对，并经 Language Log (Pullum 2009）长文分析互证）；Fowler (1926）已给出「when the sound is ee」的限定，Pullum (2009）的裁定是带 /iː/ 限定的版本「基本正确」；Cunningham 对 35 万词的词表分析经 Reader''s Digest 报道与多方转引（cie:cei ≈ 3:1、ie 总占比 ≈75%，Cunningham 原始博客未直开）；COCA 前 5050 高频词加权分析为 Engaging Data 的可视化数据页（81% 按词条 / 约 60% 按词次，本轮打开原页核对）。接触等级：官方文件引文级（经学术转引逐字核实）＋数据分析二手报道级。'
    - 支撑：历史纵深：该口诀至少见于 Laurie《Manual of English Spelling》(1866)；早在 1932 年，Leonard B. Wheat 的〈Four Spelling Rules〉就建议把口诀缩减为「I usually comes before e」或干脆弃用——「口诀好记≠口诀有用」的批评有九十年历史。QI 节目流传的「923 个 cie 词对约 40 个 cei 词」是电视口径的类型计数（含派生与复数），与 Cunningham 的 3:1 方向一致、倍率更夸张，媒体转述级登记，不作定版数字。
    scope: 本条裁决的是裸口诀不值得教，不是「ie/ei 没有格局」——/iː/ 限定的版本 + cei 小名单 + ei 的 /eɪ/ 格局，三者合起来才是完整的教学内容，归 S-33 清单细化。either/neither 读音因人而异，按教材注音处理。口诀不管 ie/ei 分属两个音节的词（diet、quiet）——那是音节问题（SR-09）。
    exceptions:
    - (a) ei 读 /iː/ 却不在 c 后（真例外名单）：seize、protein、caffeine、codeine（词源与借词各有来历）
    - (c) ei 不读 /iː/ 的大队（射程外、非例外）：their、eight、neighbour、vein、height、foreign、leisure、forfeit——服从的是别的格局（/eɪ/ 的 ei 拼法等），用口诀去套是射程误用
    - weird 的元音是 /ɪə/（英）/ɪr/（美），不在 /iː/ 的范围内——它只是那句不带条件的口诀的反例，不是带上限定条件的完整版口诀的反例
  mechanism:
    beats:
    - beat: 三层验货
      text_adult: ①裸口诀层（不加任何声音条件）：命中率取决于计数口径——按词条（type）计，Warwick 大学统计学者 Nathan Cunningham 对 35 万词的词表分析显示，ie/ei 相邻的词中约 75% 是 ie 在前（第一句大体成立）；但第二句「c 后面 ei」在词条计数上是反的：cie 的词约为 cei 的 3 倍（science、sufficient、society、-cies 复数等把 cie 撑得很大）。按词次（token）计（COCA 前 5050 高频词的可视化分析），高频例外 their、being 太常用，加权后裸口诀的符合率降到约 60%。②加限定层：口诀的原始完整版带声音条件——Fowler (1926）已给出「when the sound is ee」的限定，Pullum (2009, Language Log）的裁定是：带 /iː/ 限定的版本「基本正确」——读 /iː/ 时默认 ie（believe、field、chief、piece)，c 后读 /iː/ 的 ei 只有一份封闭小名单：receive、conceive、deceive、perceive、ceiling 及同族的 receipt、conceit、deceit。③例外分层（加限定后仍破的）：(a) ei 读 /iː/ 却不在 c 后：seize、protein、caffeine、codeine；(b) cie 不读 /iː/ 的：science、ancient、sufficient 系的 ci 读 /ʃ/ 或分属两音节，本就不在 /iː/ 规则射程内（Oxford 词典官网同此说明）；(c) ei 不读 /iː/ 的大队（见 claim 例外）。
