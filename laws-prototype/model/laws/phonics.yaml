- id: S-43
  zone: 拼读
  group: S
  order: 43
  headline: 中国孩子的卡点不是随机错单，是汉语的音节模具逐项压出来的：没有的音被最近邻顶替、不许的词尾被削掉、每个音节被平均用力——难点能逐项落回 GPC 表
  headline_kid: 有些英语声音，汉语里压根没有，嘴巴就会拿最像的汉语声音顶上：three 变 sree、very 变 wery、pig 读完尾巴变轻了、blue 中间多塞一个音、banana 三个音节一样响。这些都不是粗心，是嘴巴在拿老地图走新路。把地图上缺的这几处专门补练，地就通了。
  claim:
    type: tendency
    statement: 中国学习者的 GPC 难点是汉语的音节模具逐项压出来的、可预测的九项（th 顶替、v/w、i 长短、æ 开口、schwa 缺席、词尾浊音与尾辅音、-ng/-n、辅音丛插元音、拼写面哑字母与双写），每项能落回 GPC 表并给出处方；地图是带优先级的群体倾向清单。
    evidence:
    - 对比分析底座为 S-14（王桂珍汉英语音对比体系）。实证锚：Deterding (2006)《The pronunciation of English by speakers in China》；Yeldham (2023–2024) 华裔学习者难音干预研究；《A Review of Pronunciation Challenges Faced by ESL Learners from Different Varieties of Chinese》(ICILLP 2025)；Huang (2026, Journal of Applied Linguistics and Literacy）重庆 55 名高中生样本（数字仅限该样本口径，不外推）。接触等级：二手系统论述级。
    - 支撑：汉语清单上缺席的音位与结构与实证研究中错误集中区高度重合——清单先预测、语料后验证，与 S-14 互为表里。Huang 样本中元音错误与可懂度的相关高于辅音错误（r=−.48），提示处方排序应给元音三项（长短、开口、弱读）更高权重。
    scope: 群体倾向，不是个人判决：方言背景会改写难点谱；实证锚样本多为青少年与成人，向低龄迁移时错误类型可借、错误率不可搬；处方是练习方向，不是临床言语治疗。涉及弱读产出的处方已按裁定 A 定版（2026-11-02）：弱读产出认识即可，不作产出要求。
    exceptions:
    - 方言谱改写：粤语保留 -p/-t/-k 入声韵尾，其学习者词尾塞音反而不难，难点另在别处；吴语、闽语各有自己的迁移谱
  mechanism:
    beats:
    - beat: 音段顶替四项（th / v-w / i 长短 / æ 开口）
      text_adult: ① th（/θ ð/）：汉语无齿间擦音，顶替谱以 /s/ 最常见（three→sree），另有 /f/ 顶 /θ/、/t d/ 顶 /ð/ 等路径；/θ/ 属错误最集中、且最伤可懂度的音。处方：咬舌动作可视化（舌尖探出齿缝、镜面对照），手背试气流，先练清 /θ/ 后练浊 /ð/；the、this、that 等功能词的 /ð/ 单列先行。② v/w：汉语有 /w/ 无 /v/，very→wery 为典型顶替，偶见反向矫枉。处方：上齿咬下唇的唇齿摩擦定位，v/w 最小对（vest/west、vine/wine）镜面练习。③ i 的长短（/ɪ iː/）：汉语 /i/ 一类独大，ship/sheep 合流；与 /θ/ 同列错误最集中之组。处方：时长手势与舌位高低双线索并讲，听辨先行。④ a 的开口（/æ e/）：汉语无 /æ/，向 /e/ 漂移使 bad→bed，或向 /a/ 靠拢。处方：开口度阶梯（beat-bit-bait-bet-bat 对照链，下巴逐级下落）。
      anchors:
      - three
      - the
      - this
      - that
      - very
      - vest
      - west
      - vine
      - wine
      - ship
      - sheep
      - bad
      - bed
      - beat
      - bit
      - bait
      - bet
      - bat
      text_kid: 有些英语声音，汉语里压根没有，嘴巴就会拿最像的汉语声音顶上：three 变 sree、very 变 wery、pig 读完尾巴变轻了、blue 中间多塞一个音、banana 三个音节一样响。这些都不是粗心，是嘴巴在拿老地图走新路。把地图上缺的这几处专门补练，地就通了。
    - beat: 弱读、词尾与音节结构四项（schwa / 词尾 / -ng / 辅音丛）
      text_adult: ⑤ schwa 与弱读：英语弱读音节被「平均用力」读成全元音——banana 三拍全重；Deterding (2006) 的中国英语语料中弱读元音 /ə/ 系统性缺席、以全元音代之。处方：节拍敲击标出重音，弱读音节「小声、快速滑过」，先在词内（ba-NA-na）练，再推到句中功能词的弱读。⑥ 词尾浊音与尾辅音：英语词尾浊塞音、浊擦音被清化或吞掉：bed→bet（词尾 /d/ 清化，难度高于词尾 /t/），cat、map 的尾塞音脱落亦见于综述著录；词尾 /z v ð/ 同属干预研究锁定的目标难音。处方：词尾「咬住不放」，并教反向线索「浊尾前面的元音更长」（bead 的元音长于 beat）。⑦ -ng 读成 -n：不少汉语方言区普通话自身即 -n/-ŋ 不分，迁移到英语 sing→sin。处方：鼻腔共鸣感知（发 /ŋ/ 时捏鼻），-ng 词尾「嗡嗡尾」延长练习，与汉语 in/ing 辨正同步做。⑧ 辅音丛插元音：汉语无辅音丛，词首丛被塞入元音拆散（blue→buh-loo）；词尾单个辅音后加附加 schwa 亦被专项著录（Deterding 2006）。处方：由尾及首的反向「连滑」搭建（ue→lue→blue），慢速无缝连读，丛中不许停顿、不许加塞。
      anchors:
      - banana
      - bed
      - bet
      - bead
      - beat
      - cat
      - map
      - sing
      - sin
      - blue
      - pig
    - beat: 拼写面一项
      text_adult: ⑨ 拼写面：哑字母（knight 的 k、gh）、双写（hopping 与 hoping 之别）、词尾 -e 的多职，在 GPC 层表现为「读对了也写错」；这批点的「为什么」由 S-19（哑字母的历史成因）与 SR 规则条供给，处方是把它们当历史＋规则讲，而不是当例外罚抄。
      anchors:
      - knight
      - hopping
      - hoping
