- id: SR-04
  zone: 拼读
  group: SR
  order: 4
  headline: 拼 /k/ 先看下一站是谁：e、i、y 前用 k，a、o、u 前用 c，短元音收尾用 ck，多音节词尾用 c
  headline_kid: 听到 /k/ 开头的词，先看紧跟它的字母：后面是 a、o、u 就写 c（cat、cot、cup）；后面是 e、i、y 就写 k（kettle、king、sky 里的 k 逻辑相同）——因为 c 碰到 e、i、y 会变软读成 /s/，只好请 k 来顶班。/k/ 在词尾时再看前面：短元音后面写 ck（back），其他情况写 k（milk、book），两个音节以上的词收尾多半写 c（music、picnic）。
  claim:
    type: rule
    statement: /k/ 的拼法是由位置完全分工的系统（Cat/Kite 规则）：词首/音节首后接 a、o、u 或辅音用 c、后接 e、i、y 用 k；词尾紧跟短元音后用 ck、其余用 k、VCe 中用 ke；多音节词的非重读末音节 /ɪk/ 用 c。统一解释：c 是 /k/ 的默认字母，凡 c 会被软化或误读的位置系统才换人。
    evidence:
    - LETRS 培训材料（Moats 的 LETRS 拼写教学 slide 集《How English Spelling Works》，本轮打开课程文件，含「Words use c for /k/ before a, o, u… k before e, i, y… ck after an accented short vowel」的原表述与例外栏）；Joshi 等《Science of Reading》课程讲义 slide 同表述互证。接触等级：课程文件级。
    - 支撑：这套分工在儿童最早的拼读词里覆盖率极高：初级词表中 /k/ 的拼法几乎可由位置百分之百判定，是 Clymer (1963）检验中属于「辅音类概括可靠度 ≥95%」阵营的典型（对比元音类概括的低可靠度，见 SR-08）——这也是教学序列把 Cat/Kite 放在元音规则之前的原因。
    scope: 儿童面只取词首+词尾两段，教师层存完整版（含多音节 c 与加后缀 k 插入）。c 的反向例外（soccer、sceptic、Celtic）归软 c 条（S-31）处理，此处只登记。
    exceptions:
    - 借词例外成串：kangaroo、koala、karate、kayak、karma 等借词把 k 带到了 a/o/u 之前（LETRS 材料直标 “Exceptions due to etymology”）——违反的是词首分工，须按词源整词记
    - c 的反向例外（正好相反的一组）：soccer（cc 在 e 前读 /k/）、sceptic（英式，/ˈskeptɪk/）、Celtic（常读 /ˈkeltɪk/）是 c 在软化区仍读 /k/ 的小名单
    - 边缘变体：arcing（arc 的 -ing 形式，两种拼法并存），这里不展开
  mechanism:
    beats:
    - beat: /k/ 的位置分工系统
      text_adult: ①词首/音节首：后接 a、o、u 或辅音 → c（cat、cot、cup、class、cream）；后接 e、i、y → k（kept、kettle、king、kiss、Kyle）——动因是软硬 c 规则（c+e/i/y 读 /s/，见 S-31），/k/ 在软化区必须改由 k 承担。②词尾：紧跟短元音后 → ck（SR-03）；紧跟辅音、长元音或元音组合后 → k（milk、pink、book、week、peak）；VCe 结构中 → ke（cake、like、smoke——因为 ce 会读 /s/，/k/ 只能用 k 再加 e 标长音）。③多音节词的非重读末音节 /ɪk/ → c（music、garlic、picnic、tonic、magic）。
