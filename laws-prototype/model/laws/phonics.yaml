- id: S-28
  zone: 拼读
  group: S
  order: 28
  headline: 「英语 44 个音」是按英国 RP 口径数出来的：24 个辅音 + 20 个元音（12 单元音 + 8 双元音）；换美国 GA 口径，元音先缩水，总数随分析浮动——44 是教学坐标，不是自然常数
  headline_kid: 英语一共有 44 个「声音积木」：24 个辅音、20 个元音。美国小朋友的版本会少几个元音，所以听到别的数字不用慌——先问他数的是哪个国家的口音。
  claim:
    type: rule
    statement: 按 RP 口径，英语音位为 44 个：24 个辅音 + 20 个元音（12 单元音：短 7 含 /ə/、长 5；8 双元音）。GA 口径元音约 14–16 个、总数约 40（38–42 随分析浮动）。44 是教学坐标，不是自然常数。
    evidence:
    - Peter Roach《English Phonetics and Phonology》(CUP, 4th ed. 2009) 的 RP 音位表（24 + 20）；Alan Cruttenden《Gimson's Pronunciation of English》(8th ed. 2014) 同口径；GA 元音 14–16、总数约 40 见语音学教材通行综述（如 Yavaş《Applied English Phonology》）。接触等级：教材口径·二手互证。
    - 支撑：44 是 EFL 教材与本清单 S 组的默认坐标：S-01 的系统拼读、S-22 的六音节都以「先有音位清单、再谈对应」为前提，后续 GPC 各条的行数都由它决定。
    scope: App 选定一种口径后，本表须按该口径单列，英美不许混编；「r 控元音」是美国课堂的教学分类（元音 + r 的读法），不是 RP 的音位类目，不得混入 RP 元音拆分。
    exceptions: []
  mechanism:
    beats:
    - beat: RP 44 的构成
      text_adult: 音位清单取决于参考口音与分析取舍。RP 的经典描写（Roach）给出 24 辅音 + 20 元音 = 44，其中元音 = 12 个单元音（短 7：/ɪ e æ ʌ ɒ ʊ ə/，含 schwa；长 5：/iː ɑː ɔː ɜː uː/）+ 8 个双元音（/eɪ aɪ ɔɪ aʊ əʊ ɪə eə ʊə/）。GA 是儿化口音：没有独立的 /ɒ/（并入 /ɑ/），没有 /ɪə eə ʊə/ 这组向心双元音，/eɪ oʊ/ 计不计双元音各家不一，再叠加许多地区的 cot–caught 合并再减一个——GA 元音常描写为 14–16 个，总数落在 40 左右。所以英美之差主要不在总数的小差，而在元音系统的切法不同。
      anchors: []
      text_kid: 英语一共有 44 个「声音积木」：24 个辅音、20 个元音。美国小朋友的版本会少几个元音，所以听到别的数字不用慌——先问他数的是哪个国家的口音。
