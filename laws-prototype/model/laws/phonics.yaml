    - 难点排序之争：以可懂度为纲的研究（Huang；LFC 传统）主张按「伤不伤理解」排优先级——/θ/ 与元音居前；以准确度为纲的传统语音教学则按音位清单顺序平均推进。本条按可懂度排序著录；语音产出取向已经裁定 A 定版（2026-11-02）：听辨全教、产出只要求 LFC 核心、弱读产出认识即可，本条排序与弱读处方按此口径落定。
