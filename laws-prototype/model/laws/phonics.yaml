- id: S-06
  zone: 拼读
  group: S
  order: 6
  headline: 字母和声音的对应是「多半如此」的统计倾向，不是定律：先教最稳的一批，剩下的进变脸名单逐个记
  headline_kid: 字母的发音大多数时候算数，但有些词会「变脸」；变脸的词我们一个一个单独记住。
  claim:
    type: tendency
    statement: 字母—声音对应是统计倾向而非定律：高一致性对应做系统拼读主线，低一致性项目（如 ea、ough、词尾 -er）做显性「变脸名单」逐个记。
    evidence:
    - 'Marilyn Jager Adams (1990)《Beginning to Read: Thinking and Learning about Print》(MIT Press)；Castles, Rastle & Nation (2018)《Ending the Reading Wars》, Psychological Science in the Public Interest 19(1)。https://eric.ed.gov/?id=ED317950'
    - 支撑：Adams 的综述确立「熟练阅读 = 正字法、语音、语义三系统协同」；Castles 等综合 300 余项研究，确认拼读是核心但非全部。
    scope: 统计倾向随年级而变：低年级文本对应一致性高，高年级学术词词源层变多；变脸名单须随学段滚动更新（注：产品不分学段，此处指随学习进程滚动更新）。
    exceptions:
    - 低一致性项目整类为例外域：ea、ough、词尾 -er 等进变脸名单（全谱与排序见 S-42）。
  mechanism:
    beats:
    - beat: 多层历史造成的统计格局
      text_adult: 英语拼写保存了多层历史（盎格鲁-撒克逊、诺曼法语、拉丁希腊借词各带一套对应），同一字母组合在不同词源层里读法不同；教学上把高一致性对应做系统拼读主线、低一致性项目做显性「例外名单」，比编造统一口诀更符合语言事实。
      anchors: []
      text_kid: 字母的发音大多数时候算数，但有些词会「变脸」；变脸的词我们一个一个单独记住。
  examples: []
