- id: S-32
  zone: 拼读
  group: S
  order: 32
  headline: 两字母抱团发一个音：辅音二合字母大多守规矩，只有 ch 有三个音、th 分清浊两班——而这两位的分班依据都是「词从哪来、词是干什么的」
  headline_kid: 两个字母抱团发一个音，叫组合音。大多数组合很乖，只有 ch 是三面派，th 分清嗓和浊嗓两班：分班不看词长短，看词是干什么的——the、this、they 这类虚词和指示词读浊班 /ð/，think、three 这类实词多读清班 /θ/（three 很短也是清班，although 很长也是浊班）。
  claim:
    type: rule
    statement: 辅音二合字母的读音按地层与词类分工：sh 恒 /ʃ/；ch 三音（本族 /tʃ/、希腊源 /k/、法语源 /ʃ/）；th 清浊按词类（虚词浊 /ð/、实词清 /θ/）；ph 为希腊层 /f/；wh 多并入 /w/；ng /ŋ/、qu /kw/ 各有分工细则。
    evidence:
    - 各组合读法与例词以 Roach (2009)、Cruttenden (2014) 的拼写—音位对应章及 Cambridge Dictionary 注音口径为准；词源分工（ch 三音、ph 希腊层）与词汇三地层互证。接触等级：教材口径·二手互证（例词逐组按词典通行注音核过）。
