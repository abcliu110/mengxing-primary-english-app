      text_adult: 词尾静音 e（silent final e）在拼写教学传统中被系统清点过职责。本条收录其中功能最明确的五职：①长音化——VCe 结构中标记前元音读长音/名字音（tap→tape、pin→pine、rob→robe、tub→tube）；②软化——使紧邻的 c 读 /s/、g 读 /dʒ/（ice、dance、cage、page），因为 c/g 在 e 前本来就软，e 是把软音「固定下来」的标记；③词尾护栏——英语本土词不以 v 或 u 收尾（Eide 的完整表述是 I、U、V、J 四个字母都不收尾，见成人层边界），故 /v/ 尾词一律加 e（have、give、love、live），/uː/ 尾词写作 ue（blue、true、clue、glue）；④th 清浊标记——名词/形容词的清 /θ/ 不带 e（bath、breath、cloth），对应动词的浊 /ð/ 带 e（bathe、breathe、clothe），另有 teethe、soothe、loathe 一族；⑤-le 凑音节——每个音节须有一个书写元音，辅音+le 结尾的音节靠这个 e 成立（little、table、apple、bubble、puzzle）。机制要点：这五职里只有第①职改变元音读音，其余四职都是「拼写合法性」标记。
