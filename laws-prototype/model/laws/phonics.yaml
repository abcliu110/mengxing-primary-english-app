- id: S-17
  zone: 拼读
  group: S
  order: 17
  headline: foot 的复数是 feet 不是 foots：一个早就消失的词尾 -i，在消失前把前面的元音「传染」变了样——i-变音
  headline_kid: 很久以前 feet 的祖先词尾巴上有个小小的 i，这个 i 把前面的 o 拉变了声，然后自己消失了——所以脚变复数要换中间的元音。
  claim:
    type: etymology
    statement: 古英语前史期，后音节 /i/ 或 /j/ 使前音节元音前化/高化（i-变音），触发音随后消失，变了样的元音成为复数标记；现代英语仅存七组变格复数。
    evidence:
    - i-mutation（i-变音 / i-umlaut）为英语史标准条目：Quirk & Wrenn《古英语语法》§206–208 的经典表述；Grimm 首创 Umlaut 术语。https://www.thoughtco.com/mutation-language-term-1691332
    - 支撑：哥特语等亲属语言保留了触发环境，可复原变音全过程；七词均为高频词，高频正是它们抗拒被 -s 规则同化的原因（频率保形效应）。
    scope: i-变音在现代英语已不是能产规则，不能类推到新词（computer 的复数只能 computers）；定位为「给七个怪词一个真来历」，不是一条要用的规则。
    exceptions: []
    source: i-mutation 为英语史标准条目：Quirk & Wrenn《古英语语法》§206–208；Grimm 首创 Umlaut 术语。
  mechanism:
    beats:
    - beat: i-变音
      text_adult: 古英语前史时期，后一音节的 /i/ 或 /j/ 使前音节元音前化/高化（同化预演），随后触发音消失，只留下变了样的元音充当复数标记；现代英语仅存七组这样的变格复数（man/men、foot/feet、goose/geese、tooth/teeth、mouse/mice、louse/lice、woman/women），另影响 strong/strength 等派生词元音交替。
