- id: S-04
  zone: 拼读
  group: S
  order: 4
  headline: 每自己拼对一个生词，孩子就给自己上了一课——解码是阅读的「自我教学」机器
  headline_kid: 你自己拼出一个新词，就等于自己教会了自己这个词；拼得越多，认识的词越多。
  claim:
    type: rule
    statement: 成功解码一次生词即在记忆里钉下该词的拼写细节；几次成功相遇后词转为熟词——解码能力是词汇自扩的引擎。
    evidence:
    - 'David L. Share (1995)《Phonological Recoding and Self-Teaching: Sine Qua Non of Reading Acquisition》, Cognition 55(2): 151–218；源头 Jorm & Share (1983)。https://psycnet.apa.org/record/1996-90411-001'
    - 支撑：Share 的假词实验显示，读过含假词短文的二年级儿童，三天后对目标拼写的辨认、命名速度与拼写都显著优于只看不读的对照。
    scope: 解码技能只提供自我教学的「机会」，是否利用取决于阅读量和对拼写细节的注意。
    exceptions: []
  mechanism:
    beats:
    - beat: 自我教学机制
      text_adult: 成功解码一次生词，就在记忆里钉下该词的拼写细节；几次成功相遇后词转为熟词。生词在阅读量面前多到不可能逐个教，只能靠这个自转机制——这就是拼读必须教到「能独立拼」的深层理由。
      anchors: []
      text_kid: 你自己拼出一个新词，就等于自己教会了自己这个词；拼得越多，认识的词越多。
