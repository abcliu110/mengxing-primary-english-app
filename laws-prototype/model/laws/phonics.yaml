    exceptions:
    - th 读 /t/：人名、地名与个别希腊词——Thomas、Thames、thyme
    - qu 的法语层例外读 /k/ 系：queue、quay、quiche、liquor、conquer
    - Chicago 的 ch 读 /ʃ/ 是地名特例，不作法语层通例
  mechanism:
    beats:
    - beat: sh 与 ch 三音
      text_adult: sh /ʃ/：ship, wish，全层稳定。ch 三音按地层分工：本族词 /tʃ/（chair, lunch）；希腊源 /k/（school, chorus, chemistry, anchor, stomach, character）；法语源 /ʃ/（chef, machine, champagne, Chicago）。
