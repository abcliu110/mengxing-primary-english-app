- id: S-26
  zone: 拼读
  group: S
  order: 26
  headline: 拼字比赛的打法：开口先问「这词从哪国来」，因为出身决定拼法——地层拼写法是选手的真功夫
  headline_kid: 美国拼字大赛的选手有个秘密武器：拼一个词之前，他们可以提问——「这个词是什么意思？」「它从哪种语言来？」知道出身，拼法就有路了：希腊来的词爱用 ph 表示 f 音（phone）、ch 表示 k 音（chorus）；法语来的词尾巴常不出声（ballet）、爱用 -age（garage）；德语来的词有 sch-（schnitzel）。所以高手拼的不是记性，是「按出身查拼法」的方法。萌星玩法照搬：先问出身，再下笔。
  claim:
    type: tendency
    statement: 拼写按来源地层分系统：判定一个词属于哪套来源系统（希腊/法语/德语/拉丁/古英语等），再套用该层的拼写习惯，未见词的可拼性由此而来（地层拼写法）。
    evidence:
    - Scripps National Spelling Bee 竞赛规则（2024 年版 Contest Rules）与官方《Suggested Rules for Spelling Bees》(2025)——选手可问定义、词性、例句、语言来源与其他读音；规则原文明确发音员不受理「词根信息」请求。官方学习册《Spell It!》（Scripps 与 Merriam-Webster 合编，2012 年版）约 1150 个学习词按语言来源分章。接触等级：机构传统级（规则与官方学习材料原文核对）。
    - 支撑：制度存续与规模即传统的存续证据（美国运行近一个世纪的全国性教育赛事）；选手在直播中先问来源再拼对未见词，是可观察的常规行为模式，与地层拼写观互证。
    scope: 地层拼写是倾向系统：法语层也有不沉默的尾巴、希腊层也有例外，靠的是「来源 + 定义 + 词性」的多线索交叉，不是单线索通杀。赛事词表难度远超中国小学课标，迁移的是问法与分层法，不是词表本身。本条证据性质为机构传统与方法论，无对照实验证明其优于别的拼法教学。
    exceptions:
    - 法语层也有不沉默的词尾、希腊层也有例外——地层只是倾向，不是单线索通杀。
  mechanism:
    beats:
    - beat: 地层拼写法
      text_adult: 官方学习册《Spell It!》把约 1150 个学习词按语言来源分章（拉丁、法语、德语、古英语、阿拉伯、亚洲语言、人名来源等），每章配该语言的拼写脾气提示：如希腊层 /f/ 音几乎总是 ph（amphibious、metaphor、phenomenon）、法语层词尾辅音常沉默（ballet、depot）、-age/-ette 型尾巴、德语层 sch- 与 w 读 /v/（waltz）等。其认知逻辑与地层观（V-19 三地层、S-21 拼写三圈）同构：英语拼写是几套来源系统叠在一起；先判定一个词属于哪套系统，再套那套的拼写习惯。
      anchors:
      - phone
      - chorus
      - ballet
      - garage
      - schnitzel
      - amphibious
      - metaphor
      - phenomenon
      - depot
      - waltz
      text_kid: 美国拼字大赛的选手有个秘密武器：拼一个词之前，他们可以提问——「这个词是什么意思？」「它从哪种语言来？」知道出身，拼法就有路了：希腊来的词爱用 ph 表示 f 音（phone）、ch 表示 k 音（chorus）；法语来的词尾巴常不出声（ballet）、爱用 -age（garage）；德语来的词有 sch-（schnitzel）。所以高手拼的不是记性，是「按出身查拼法」的方法。萌星玩法照搬：先问出身，再下笔。
