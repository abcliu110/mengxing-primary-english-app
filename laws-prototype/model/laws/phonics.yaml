- id: SR-09
  zone: 拼读
  group: SR
  order: 9
  headline: 六种音节是六种「盒子」，切长词先试老虎、再试骆驼：音节类型的内容物与 VCV 切分的压制序
  headline_kid: 英语的音节一共装六种盒子：关门盒（closed，元音被辅音关在里面，读短音：cat、fish）、开门盒（open，元音在门口，读长音：me、go)、魔术 e 盒（cake)、组队盒（两个字母合读一个音：boat、boy)、r 老板盒（元音被 r 管住：car、bird）和 -le 盒（table、little）。遇到长词先找元音、再分盒子；两个元音只夹着一个辅音时（tiger、river 这种），先按「老虎切法」把辅音划给后一盒（ti-ger，元音读长），读出来不像词，再换「骆驼切法」划给前一盒（riv-er，元音读短）。
  claim:
    type: tendency
    statement: 六种音节类型（Closed/Open/VCe/Vowel Team/R-controlled/Consonant-le）各有判定定义；VCV 切分的压制序是「先试老虎切法（V/CV，长元音）、不成立再试骆驼切法（VC/V，短元音）」的概率排序——教学传统通称 VCV 约 75% 归老虎切法，但该数字未定位到一手语料计量研究（待核），故本条立倾向档。
    evidence:
    - Orton-Gillingham 传统的音节教学核心（REVLOC/CLOVER 系谱系，框架层见 S-22）；本轮核实的课程文件：HMH《Into Reading》二年级 Module 9 教师材料（本轮打开课程 PDF:Tiger Rule「divide after the first vowel, first syllable is open, long vowel」与 Camel Rule「if Tiger does not work, divide after the consonant」的操作程序、例词 tiger/camel/lemon/finish/model 表述完整）；ALP Upstate 的音节类型与切分规则表（六型定义表＋「first divide after the vowel… if the word does not make sense, divide after the consonant」的压制序原文）互证。接触等级：课程文件级。
    - 支撑：切分压制序与儿童的「set for variability」（读错后按词义自我纠正）研究相衔接：老虎→骆驼的回退本质是教儿童把第一次解码当假设、用已知词校验——这也是为什么 VCV 是六型教学里唯一明确教「试错顺序」的格局。六型对中国孩子的直接收益点在 closed/open 对立：汉语无「元音被辅音关住就变短」的对应格局，ship/sheep 式长短误读（S-14 难点地图）的词内版本就是 open/closed 不分。
    scope: 与 S-22 的分工：S-22 立框架并登记「音节类型标签是否必要」的分歧，本条只给内容物与操作、不重开分歧——但操作层吸收分歧的合理内核：切分服务于读出词义，读出后不强求儿童复述类型名。教学切分≠词典音节，两套并行、各管一段。-le 盒只收词尾的辅音+le。
    exceptions:
    - VCV 例外形态：第一元音是 a 且读 /ə/ 弱化的一批词、equal 型（e-qual 开切但元音读 /iː/ 长音却非名字音 e）等零星形态，按词直记；seven 的 sev-en 是骆驼词但 e 不弱化
  mechanism:
    beats:
    - beat: 六型的内容物
      text_adult: Closed——音节以辅音结尾、元音为单个字母且读短音（cat、fish、rab-bit 的 rab);Open——音节以元音结尾、读长音（me、go、ti-ger 的 ti、ro-bot 的 ro);VCe（魔术 e 型）——元音＋辅音＋不发音 e，元音读长音（cake、com-pete);Vowel Team——两个及以上字母合表一个元音音（boat、rain、boy、town；含双元音在内，这是 OG 传统把 vowel digraph 与 diphthong 合并的教学口径）；R-controlled——元音后紧跟 r，元音被 r 改色（car、her、bird、fork、nurse);Consonant-le——词尾辅音＋le 自成一音节、e 只为凑元音（table、little、apple、uncle)，且该音节恒在词尾、重音永不在它身上。
