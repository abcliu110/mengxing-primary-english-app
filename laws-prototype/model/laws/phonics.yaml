- id: S-23
  zone: 拼读
  group: S
  order: 23
  headline: 学拼写的活动形态是「分堆」：按音、按形、按义把词归类，顺着发展阶段走
  headline_kid: 给你一堆词卡，不要背，先分堆：哪些词的中间发音一样？哪些词长得像一家人？哪些词是同一个零件拼的？分着分着，拼写的规律自己就浮出来了。每个小朋友分堆的水平不一样——刚开始按声音分，后来按长相分，再后来按意思分；你在哪一层，就玩哪一层的分堆。
  claim:
    type: tendency
    statement: 儿童拼写知识沿可预测的五阶段推进；教学核活动是 word sort（按音、按形、按义分类），先由拼写量表测定位、按「正在用但用错」的层施教。
    evidence:
    - 'Donald R. Bear、Marcia Invernizzi、Shane Templeton、Francine Johnston《Words Their Way: Word Study for Phonics, Vocabulary, and Spelling Instruction》(Pearson；2012 年第 5 版及其后多次再版）——五阶段命名、分类活动与定位经 Pearson 官方书介材料与学区采用文件、课程讲义交叉核对一致。接触等级：目录+官方书介级（未打开原书正文）。'
    - 支撑：该体系源出 Henderson 等人的发展性拼写研究传统（儿童「自创拼写」错误形态可预测地分期），课程存续二十余年；与 S-03 的认词四台阶在发展次序上大致平行（两套独立传统互证阶段观）。
    scope: 五阶段是美国本土儿童（L1）的发展序列；中国儿童的对应与年龄带不可直接平移，只能借「先测定位、按层施教、用但混即教学区」的程序骨架，阶段细节须以中国学生的拼写样本重新校准——入模前的必要适配，不许整表照搬。年龄带本身也只是常模近似，个体跨度大。
    exceptions:
    - 年龄/阶段带为常模近似，个体跨度大；阶段对应不可直接平移到中国儿童。
  mechanism:
    beats:
    - beat: 发展性词研究五阶段
      text_adult: 《Words Their Way》体系：儿童的拼写知识沿五阶段推进——①萌芽期（Emergent）②字母名—字母期（Letter Name-Alphabetic）③词内模式期（Within Word Pattern）④音节与词缀期（Syllables and Affixes）⑤派生关系期（Derivational Relations）。教学的核活动是 word sort（单词分类）——学生亲手把词按音、按形、按义的特征归类比较，在归类中自己撞见正字法规律；配套件是拼写量表先测定位、按「正在用但用错（use but confuse）」的层施教。正字知识相应分三层：字母层（音）→模式层（形）→意义层（义）。
