- id: S-21
  zone: 拼读
  group: S
  order: 21
  headline: 拼写同时在记三件事：声音、意义、来历——「拼写深处有道理」与「变脸名单」之争
  headline_kid: 英语拼写不只记发音。sign（签名）和 signal（信号）是亲戚，所以 sign 里那个不发音的 g 要留着——它像家族合影，证明这两个词是一家人。拼写还记着词从哪儿来。所以很多「奇怪」的拼写不是捣乱，是在替我们记着词的身世。
  claim:
    type: etymology
    statement: 英语正字法是音位—词素双层系统：拼写同时编码语音、意义（同一词素在亲戚词里保持同一写法）与词源；「例外」中有相当部分是只看声音时才显得无理。
    evidence:
    - 'Richard L. Venezky (1967)《English orthography: Its graphical structure and its relation to sound》, Reading Research Quarterly 2: 75–105；(1970)《The Structure of English Orthography》(Mouton)；(1999)《The American Way of Spelling》(Guilford), p. 4。教学化：Bowers & Kirby (2010)；Bowers & Bowers (2017), Educational Psychologist 52(2): 124–141。接触等级：Bowers & Bowers 2017 与 Bowers 2021 公开信为章节预览级；Venezky 三种原书未打开，为二手转引。'
    - 支撑：Bowers & Kirby (2010) 的课堂干预显示 SWI 组在词汇与形态分析任务上有增益；词素拼写恒常（sign 的 g）在语料中成系统存在，是描写层面的硬事实。
    scope: 三圈论是描写语言学共识层面的成立（正字法确为双层系统），与「因此课堂应以探究法为主线」是两步推论，第二步证据远弱于第一步；SWI 本身的干预研究迄今稀少且多出自倡导者团队。词和须用真构件。
    exceptions: []
    source: 'Venezky (1967) Reading Research Quarterly 2: 75–105；(1970)《The Structure of English Orthography》；(1999)《The American Way of Spelling》。'
  mechanism:
    beats:
    - beat: 音位—词素双层系统
      text_adult: 英语正字法是音位—词素双层系统——拼写同时编码语音、意义（同一词素在亲戚词里保持同一写法，哪怕读音变了：sign/signal、heal/health、please/pleasant）与词源（不同来源层留下不同拼法习惯）。Venezky 的定版表述（1967）：现行正字法不只是一套满是毛病的字母—声音系统，而是一种更复杂、也更规则的关系，其中音位与词素同居主角之位。
      anchors:
      - sign
      - signal
      - heal
      - health
      - please
      - pleasant
      text_kid: 英语拼写不只记发音。sign（签名）和 signal（信号）是亲戚，所以 sign 里那个不发音的 g 要留着——它像家族合影，证明这两个词是一家人。拼写还记着词从哪儿来。所以很多「奇怪」的拼写不是捣乱，是在替我们记着词的身世。
    - beat: 结构化文字探究（SWI）与词和
      text_adult: Bowers 的结构化文字探究（SWI）把这一语言学图景做成课堂流程：学生对拼写提出并检验假设，工具是词和（word sum）——把词写成构件的加法式来验证结构（如 do + es → does），与词矩阵（matrix，一族词的构件拼图）。招牌追问如：two 里为什么有 w、too 里为什么没有（答：w 是与 twice、twin、twenty 同族的标记）。
      anchors:
      - two
      - too
      - twice
      - twin
      - twenty
      - does
  examples:
  - level: 1
    group: 词素恒常词族
    words:
    - sign
    - signal
    - heal
    - health
    - please
    - pleasant
    supports: claim
  - level: 2
    group: 词和/族标记例
    words:
    - two
    - too
    - twice
    - twin
    - twenty
    - does
    supports: claim
  error_cases: []
  probes: []
  quiz: []
  relatives:
  - id: S-06
    rel: 对照
  - id: S-33
    rel: 同族
  prereq: []
  pain_points:
  - 错不完
  - 记不住
  adult:
    sources:
    - 'Venezky (1967) RRQ 2: 75–105；(1970) Mouton；(1999) Guilford；Bowers & Kirby (2010)；Bowers & Bowers (2017) 52(2): 124–141。'
    boundary: ①实证等级必须如实标：针对 SWI 本身的干预研究迄今稀少（倡导方文献综述自承仅三项左右），且多出自倡导者团队，独立复制有限；形态教学（大概念）的证据多于 SWI（具体方案）的证据，两者不得混报。②词和须用真构件：does 的 do + es 分析属 SWI 课堂通例，措辞已经 Bowers 本人博士论文（2012）逐字核对（2026-11-02，见 adult.pending 销项）。
    disputes:
    - 甲方（S-06 立场）：字母—声音对应是统计倾向，先教最稳的一批做系统拼读主线，其余进「变脸名单」逐个记，后盾是系统合成拼读的大规模试验与综述传统（Castles, Rastle & Nation 2018 等），证据等级：高。乙方（SWI/Bowers）：「变脸」多半是只按声音看才显得无理；把意义与来历算进来，大量「例外」自有结构，逐个死记浪费了系统的逻辑，且 SWI 同样显性教 GPC——其后盾主要是语言学描写共识 + 小规模干预，证据等级：有限。丙方观察：两方争的是课堂主线的配比与「例外」的记账方式，不是拼写有没有结构。清单处理：S-06 与本条并存登记，低段主线从 S-06，高段词族教学可引入本条的词和与追问法，不合并成一条假共识。
    evidence_grade: 章节预览级（Bowers 系）+ 二手转引（Venezky 原书）
    pending:
    - （2026-11-02 销项）词和 does 的 do + es 分析已经作者本人原始文献逐字核对：Peter Bowers 博士论文（2012，Queen's University，WordWorks Kingston 公开版）原文——“teachers can use words like does or business to explain how their spelling system works (do + es → does; busy/i + ness)”，且同文明言词基 <do> 在 do/doing 中读 /du:/、在 does/done 中读 /dʌ/。措辞级出处就此定版。
