- id: S-20
  zone: 拼读
  group: S
  order: 20
  headline: 重音会「报身份」：复合词重音在前（BLACKbird），短语重音在后（black BIRD）
  headline_kid: 同样两个词，读法不一样意思就不一样：重音落在前面（BLACKbird），说的是一种鸟的名字；重音落在后面（black BIRD），说的只是一只「黑色的鸟」。耳朵先听重音，就能猜出这两个词是「一个词」还是「两个词」。
  claim:
    type: tendency
    statement: 复合词的主重音落在左构件（复合词重音规则），短语的主重音落在最后一个实词（核心重音规则）；重音位置是判断「复合词还是短语」的首要听辨线索。
    evidence:
    - Ingo Plag《Word-Formation in English》(CUP, 2003) §6.1.3 “Stress in compounds”, pp. 137–139；规则源头为 Chomsky & Halle《The Sound Pattern of English》(1968) 的 Compound Stress Rule。接触等级：二手系统论述级。
    - 支撑：词典对复合词的注音系统性地标左重，与短语注音分工稳定；blackbird/black bird 是引用最广的最小对立对，母语者判断一致性高。
    scope: 强倾向、非铁律；对比焦点会临时翻转重音（语用重音），不推翻词汇重音的默认分工。本条只主张「重音是首要听辨线索」，不主张「凭重音一票定案」。
    exceptions:
    - 并列复合词右重：geologist-astronomer
    - 若干食物与材料类复合词右重：apple pie；街道名如 Madison Avenue 亦然
    - 复合形容词多为双重音或后重：blue-green、easy-going、icy cold
    - black market：意义已 lexicalized、中间不可插入，却带短语式后重音（判据互相打架的实例，见成人层分歧）
  mechanism:
    beats:
    - beat: 两条重音规则分工
      text_adult: 英语有两条重音规则在分工（Chomsky & Halle 1968 以来的经典表述）：复合词重音规则——复合词的主重音落在左构件上；核心重音规则——短语的主重音落在最后一个实词上。因此重音位置成了判断「复合词还是短语」的语音线索，与另外两条线索（两成分之间不能插入其他词、整体意义 lexicalized 不可完全由部分推出）合称复合词的身份判据群（Lieber 的判据讨论；Plag 2003 §6.1.3, pp. 137–139）。N+N 组合最典型：BLACKbird（一种鸟）、GREENhouse（温室）对 black BIRD（一只黑鸟）、green HOUSE（一栋绿房子）。
      anchors:
      - blackbird
      - greenhouse
      text_kid: 同样两个词，读法不一样意思就不一样：重音落在前面（BLACKbird），说的是一种鸟的名字；重音落在后面（black BIRD），说的只是一只「黑色的鸟」。耳朵先听重音，就能猜出这两个词是「一个词」还是「两个词」。
  examples:
  - level: 1
    group: 复合词（左重）
    words:
    - blackbird
    - greenhouse
    supports: claim
  - level: 2
    group: 系统性例外（右重/双重音）
    words:
    - apple pie
    - blue-green
    - easy-going
    - icy cold
    supports: claim
  error_cases: []
  probes: []
  quiz: []
  relatives:
  - id: S-11
    rel: 对照
  - id: S-06
    rel: 同族
  prereq: []
  pain_points:
  - 听不懂
  adult:
    sources:
    - Ingo Plag《Word-Formation in English》(CUP, 2003) §6.1.3, pp. 137–139；Chomsky & Halle《The Sound Pattern of English》(1968)。接触等级：二手系统论述级（Bauer 批评文为原文转载章节预览级）。
    boundary: 这是强倾向、非铁律，Plag 本人即列系统性例外（见 claim.exceptions）。教学口径：先教默认规则认词，例外随词逐个认（与 S-06 的统计倾向口径一致）。
    disputes:
    - Bauer 在《Adjectives, Compounds, and Words》中指出：black market 意义已 lexicalized、中间不可插入，却带短语式后重音，是「线索互相打架」的实例；他的结论是重音对复合词身份既非必要、也非充分，只是强线索之一。清单口径：本条只主张「重音是首要听辨线索」，不主张「凭重音一票定案」。
    evidence_grade: 二手系统论述级
