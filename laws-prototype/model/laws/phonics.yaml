- id: S-12
  zone: 拼读
  group: S
  order: 12
  headline: 连读不是「读得快糊在一起」，是音节在重新组队：前一个词的尾巴辅音会跑去当后一个词的开头
  headline_kid: 两个词挨在一起时，前一个词最后的辅音会「搬家」，和后面词的第一个元音连成一家人来读。
  claim:
    type: tendency
    statement: 连贯语流中词尾辅音优先归入后一音节作首音（重新音节化），并伴随同化、省音等省力过程；这是自然语流的默认倾向。
    evidence:
    - Roach《English Phonetics and Phonology》连贯语流章节；Gimson/Cruttenden 传统同口径；王桂珍《英语语音教程》连读部分。
    - 支撑：语音学对语流过程（连读、同化、省音、弱化）的描写是 Gimson 以来教材的固定章节。
    scope: 停顿、强调、慢读时不发生；教孩子先解决「听得出边界」，低段不要求产出时处处连读。
    exceptions:
    - 停顿、强调、慢读场合不连读。
  mechanism:
    beats:
    - beat: 重新音节化
      text_adult: 英语音节倾向「有头无尾」（辅音优先归入后一音节作首音），词尾辅音 + 词首元音在语流中重新切分（an apple 听感近 a-napple）；加上同化、省音等省力过程，连贯语流的音串和单词逐个念必然不同——这是听力断句困难的结构性原因。
      anchors:
      - an
      - apple
