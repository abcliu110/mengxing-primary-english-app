- id: S-30
  zone: 拼读
  group: S
  order: 30
  headline: 单字母辅音里有一批「老实人」：b d f h k l m n p r t v w z 基本一个字母一个音，先教最稳；真正的双面角色只有 s 和 x，j 则近乎专职替软 g 站岗
  headline_kid: 辅音字母里有一队「说什么就是什么」的老实字母，先跟它们做朋友。s 和 x 是小演员：s 有时读清的 /s/、有时读浊的 /z/；x 是两个音捆在一起卖的。
  claim:
    type: rule
    statement: 单字母辅音可靠名单实点 14 个（b d f h k l m n p r t v w z），各只有一个主读音、词首位置近乎无例外；j 近乎专职读 /dʒ/；只有 s（清浊由邻居决定）与 x（打包音）是双面角色。
    evidence:
    - 读音与分布以 Roach (2009)、Cruttenden (2014) 的音位—拼写对应表为准；-s 的清浊同化属标准音系描写，与 S-18 互证；x 的 /ɡz/ 环境与希腊词首 /z/ 见 Cambridge/OED 词典注音口径。接触等级：教材口径·二手互证。
    - 支撑：S-29 的统计说辅音词首一致性 96%——本条就是那 96% 的内容物；主流课程序列（如 Letters and Sounds Phase 2 以 s a t p i n 打头）正是先用这批可靠字母最快拼出真词。
    scope: 「可靠」限于单字母的词首/词中位置；t 在 -ture、-tion 组合里、n 在词尾 -mn 里、k 在 kn- 里都会变脸，但那是组合层的事，归 S-32/S-33。
    exceptions:
    - h 在 hour、honest、heir 里不发音
    - w 在 two、sword、answer 里缺席
    - 按 RP 的读法，r 只在元音前发音（car 词尾不响，GA 则响）
    - this 的 s 是清的、is 的 s 是浊的（高频词逐词认）
  mechanism:
    beats:
    - beat: 可靠名单 14 + j
      text_adult: 可靠名单实点 14 个——b /b/、d /d/、f /f/、h /h/、k /k/、l /l/、m /m/、n /n/、p /p/、r /r/、t /t/、v /v/、w /w/、z /z/，各只有一个主读音，词首位置近乎无例外。j 紧随其后：词首几乎必读 /dʒ/（jam, job, jump），正好与软 g 分工（见 S-31）——g 在 a/o/u 前守硬音，这些位置的 /dʒ/ 由 j 顶上。
      anchors:
      - jam
      - job
      - jump
      text_kid: 辅音字母里有一队「说什么就是什么」的老实字母，先跟它们做朋友。s 和 x 是小演员：s 有时读清的 /s/、有时读浊的 /z/；x 是两个音捆在一起卖的。
    - beat: s 的清浊
      text_adult: s 的清浊由邻居决定：词尾的 s 在清辅音后读 /s/（cats）、在浊辅音与元音后读 /z/（dogs, is, was），与嘶音相撞时垫一个 /ɪ/（buses，见 S-18）；少数高频词须逐词认：this 的 s 是清的、is 的 s 是浊的。
      anchors:
      - cats
      - dogs
      - is
      - was
      - buses
      - this
    - beat: x 是打包音
      text_adult: x 默认 /ks/（fox, six），夹在元音之间且重音在后时浊化为 /ɡz/（exam, exact, exist），词首在希腊词里只读 /z/（xylophone）。
      anchors:
      - fox
      - six
      - exam
      - exact
      - exist
      - xylophone
