    - beat: gu 的守门员 u
      text_adult: gu 后接 e/i 时 u 不发音，只负责保住 g 的硬音（guess, guest, guide, guitar, guard, guilt）——没有这个 u，g 就要按 S-31 变软；例外是 guano, guava 的 u 读 /w/。
