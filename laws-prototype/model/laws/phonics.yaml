- id: SR-05
  zone: 拼读
  group: SR
  order: 5
  headline: y 是个三面手，位置还替双元音投票：ay/oy 守词尾、ai/oi 守词中——ow 的两副面孔只有倾向、没有定律
  headline_kid: 字母 y 有三份工作：在一个音节的词尾读 /aɪ/（my、fly）；在长词的词尾轻轻读 /ɪ/（happy、baby）；在词中间也读 /ɪ/（gym、system）。还有一条选拼法的窍门：/eɪ/ 和 /ɔɪ/ 这两个音，站在词中间时写 ai、oi（rain、coin），站在词尾时写 ay、oy（day、boy）——y 喜欢站在队尾。ow 有两副面孔（snow 的 /əʊ/ 和 cow 的 /aʊ/)，只能边读边认，没有铁律。
  claim:
    type: tendency
    statement: y 的元音三职按「位置＋重音」判定（词尾重读→/aɪ/、词尾非重读→/i/、词中闭音节→/ɪ/）；/eɪ/ 与 /ɔɪ/ 的拼法按音节位置分工（ai、oi 居音节首中，ay、oy 居音节/词尾）；ow 两读只有分布倾向、不存在可教的位置定律。
    evidence:
    - Orton-Gillingham 系材料（“ai … beginning or middle; ay … end of words; oy … usually at the end, with a few exceptions”）与 Reading Universe（WETA 等机构）元音组合技能说明（明确给出 oy 的例外句 “The royal loyal oyster took a voyage”）逐项互证；UFLI Foundations 对齐材料同表述（ai/oa 居中、ay/oy/ow 居尾）。y 三职为各课程音节/字母多音教学的通行表述。接触等级：多源转述互证级（位置规则与 y 三职）；ow 分布倾向为传统通称级（无计量来源）。
    - 支撑：位置规则是元音组合拼法中罕见的「高产出」概括：它让 /eɪ/、/ɔɪ/ 的拼法选择从背词变成看位置，与 SR-04（/k/ 的位置分工）构成同一教学思想（位置决定拼法）的两个实例。oy 的例外被课程传统编成整句记忆（royal、loyal、oyster、voyage——四词的 oy 都出现在词中，因为其后还有音节），说明例外是成小串、可枚举的。
    scope: 位置规则的表述单位是音节不只是词（employ、destroy 的 oy 在词尾音节）；ow 两读教学正道是「先试一个音，不对换另一个」（flex 读法），讲成定律是过度承诺；au/aw 一对与本条同构，归 S-41/S-33 清单，此处只挂名。
    exceptions:
    - oy 居中例外小串（课程传统整句）：royal、loyal、oyster、voyage——oy 出现在词中，因其后还有音节
    - ay 的异类：says（读 /sɛz/，拼 ay 却不在词尾）、quay（读 /kiː/)，两个高频怪词单记
    - oi 几乎不出现在词尾（个别借词 koi 除外）
  mechanism:
    beats:
    - beat: 三层机制
      text_adult: ①y 的元音三职，准确的判据是「位置＋重音」：词尾且重读 → /aɪ/（my、by、fly、try，以及双音节动词的重读末音节 apply、reply、deny、July）；词尾且非重读 → /i/（happy、baby、city、family）；词中（闭音节）→ /ɪ/（gym、myth、system、rhythm、bicycle 的第一音节）。另有 y 作辅音 /j/（yes、yellow、beyond）是另一职，属字母本行、不在本条三职内。②位置选拼（position rule)：/eɪ/ 与 /ɔɪ/ 各有一对拼法，按所在音节的位置分工——ai、oi 用于音节的开头与中间（ail、rain、train;oil、coin、boil)，ay、oy 用于音节/词的末尾（day、play、tray;boy、toy、employ、destroy）。动因与 SR-01 互挂：英语词不用 i 收尾（Eide 的 I/U/V/J 条），故词尾位置由带 y 的拼法接管。③ow 两读的分布倾向：词尾（及重读末音节）的 ow 以 /əʊ/ 为主（snow、blow、grow、low、show、window)，但有一小族高频 /aʊ/ 词（cow、how、now、brow、vow、plow）；词中的 ow 以 /aʊ/ 常见（down、town、brown、power、flower)，但在 n、l 之前也有 /əʊ/（own、bowl、growth 的 ow 在词尾音节）。本层只能称倾向——本轮未检索到对 ow 两读做全词表计量的可靠研究，任何百分比数字都不许编（见待补）。
