- id: SR-03
  zone: 拼读
  group: SR
  order: 3
  headline: /k/、/tʃ/、/dʒ/ 站在短元音身后要穿「加厚装」:ck、tch、dge——判据不是音节数，是「紧跟在短元音之后」
  headline_kid: 短元音后面的 /k/ 不写 k、写 ck（back、duck）；短元音后面的 /tʃ/ 不写 ch、写 tch（catch、witch）；短元音后面的 /dʒ/ 写 dge（bridge、judge）。这三个「加厚装」只跟在短元音屁股后面；元音一长，立刻换回单件：长音后面是 k、ch、ge（bake 型另有 e 帮忙、beach、age）。
  claim:
    type: rule
    statement: ck/tch/dge 加厚规则：在单音节词（或重读末音节）里，/k/、/tʃ/、/dʒ/ 若紧跟在一个（重读的）短元音之后，拼写必须加厚为 ck、tch、dge；长元音/双元音之后、辅音之后用单件 k、ch、ge；判据是「紧跟短元音之后」，不以单音节为限。
    evidence:
    - OG/LETRS 系拼写模式教学的通行表述（LETRS 培训 slide 集《How English Spelling Works》明列 “ck, dge, tch … act as double consonants after short vowels”，并给出 ck 的例外为词源型 flak 等）；小学拼写规则汇编（如多家学区规则表）对 tch 的例外名单（such、much、rich、which）表述一致。接触等级：课程文件级（LETRS slide 集）＋多源转述互证级（例外名单）。
    - 支撑：这组规则与 SR-02 Floss 在教学序列中通常同段出现（短元音词尾加厚家族），且在解码方向近乎无例外地可靠：儿童读到 ck/tch/dge 即可断定前元音为短音。tch 还有一个两音节的常见落点：非重读的第二音节（kitchen、pitcher、hatchet、butcher）——仍是「tch 紧跟短元音」，不违例。
    scope: 本条只管词尾位置；词中（如 chicken 的 ck、dodger 的 dg）在 S-33 清单与词族教学中处理。非重读末音节的 /ɪdʒ/ 不用 dge 而用 -age/-ege（village、college、privilege——其中 -age 的读音合同价见 SR-06）。
    exceptions:
    - tch 真例外小名单：rich、much、such、which（高频、须直记），外加法语来源的 attach、detach 用 -ach 收尾
    - ck 的例外是借词：trek（南非荷兰语源）、flak（德语 Flak 的缩略）等，属词源型例外，与 SR-02 的 bus/gas 同类
  mechanism:
    beats:
    - beat: 加厚判据与单件面
      text_adult: 三个拼法是同一个格局的三张面孔：在单音节词（或重读末音节）里，/k/、/tʃ/、/dʒ/ 若紧跟在一个短元音之后，拼写必须「加厚」——ck（back、neck、sick、lock、duck）、tch（catch、fetch、itch、notch、hutch）、dge（badge、edge、bridge、dodge、judge、fudge）。加厚的理由与 Floss（SR-02）相同：单个 k/ch/ge 紧跟短元音会让读者拿不准元音长短，加厚拼法把「前面是短元音」写死在词形里。反之：长元音/双元音之后用 k（book 是 oo、week）、ch（beach、coach）、ge（age、page、huge）；辅音之后用 k（milk、bank）、ch（branch、mulch）、ge（large、hinge）；多音节词的非重读末音节 /k/ 用 c（music、picnic、garlic，见 SR-04）。
