- id: S-03
  zone: 拼读
  group: S
  order: 3
  headline: 孩子认词要走四个台阶：看图猜词 → 只用首尾字母 → 逐字母全拼 → 成块认词
  headline_kid: 认词像上楼梯：先是看样子猜，再是认头一个字母，然后每个字母都能拼，最后看到词块一下就认出来。
  claim:
    type: tendency
    statement: 认词发展按主导连接类型分四阶段（前字母期 / 部分字母期 / 完全字母期 / 巩固字母期）渐进重叠推进，每阶段补对应的知识。
    evidence:
    - Linnea C. Ehri (1995)《Phases of Development in Learning to Read Words by Sight》；Ehri & McCormick (1998) 教学含义阐发。来源：https://ufli2.education.ufl.edu/wp-content/uploads/2022/01/EhriPhases.pdf
    - 支撑：阶段论给教学排了序：哪个阶段补哪种知识（音素意识、字母、全对应、词块）有明确对应，是 decodable 文本分级设计的理论依据之一。
    scope: 阶段按「主导连接类型」划分；同一孩子可同时用多种策略；对汉语背景儿童，拼音经验会改变早期阶段的表现形态（具体迁移形态本条未展开）。
    exceptions:
    - 阶段是渐进重叠的，不是某天突然跳级；同一孩子可同时用多种策略。
  mechanism:
    beats:
    - beat: 四阶段与连接类型
      text_adult: 每个台阶由当时掌握的字母知识类型决定——连接是部分的就只能部分解码（首字母+上下文猜），连接完整才能全词映射，连接成块（词族、词缀、音节）才能处理多音节词；台阶是渐进重叠的，不是某天突然跳级。
      anchors: []
      text_kid: 认词像上楼梯：先是看样子猜，再是认头一个字母，然后每个字母都能拼，最后看到词块一下就认出来。
