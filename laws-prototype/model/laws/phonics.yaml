      text_adult: /əʊ/ though、dough、although；/uː/ through；/ʌf/ rough、tough、enough；/ɒf/ cough、trough；/ɔː/ thought、bought、ought、fought；/aʊ/ bough、plough、drought；/ə/ thorough、borough（英式词尾）；/ʌp/ hiccough（该词今多写作 hiccup）。罕见 2 读：/ɒk/ hough（今多作 hock）、/ɒx/ lough（爱尔兰语「湖」词）。成因：中古时期 ough 本读带 /x/ 的长元音，/x/ 在各方言中或脱落、或变 /f/，元音又经大推移分头演变。内部秩序：-ought 一组内部极整齐（bought、thought、fought、sought、ought 全读 /ɔːt/），变脸发生在组与组之间——对策是按词族分组记，不是逐词死记。
