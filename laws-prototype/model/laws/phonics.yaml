- id: S-10
  zone: 拼读
  group: S
  order: 10
  headline: 语言的节奏没有「两种」，只有一条连续带：英语偏向「重音说了算」的一端，汉语偏向「音节平均」的一端
  headline_kid: 英语说话像踩鼓点，重要的词踩重拍；汉语像排队走，每个字差不多一样长。两种节奏之间是一条长长的带子，不是两个格子。
  claim:
    type: rule
    statement: 语言节奏是连续统而非二分：英语偏重音计时一端、汉语偏音节计时一端，位置由元音弱化、音节结构复杂度、重音时长差等性质叠加决定，并可由 PVI 等指标测量。
    evidence:
    - Rebecca Dauer (1983)《Stress-timing and Syllable-timing Reanalyzed》, Journal of Phonetics；Esther Grabe & Ee Ling Low (2002) 成对变异指数（PVI）。https://ejournals.lib.auth.gr/thal/article/download/5522/5427
    - 支撑：Roach 等人的实测早已证伪严格等时性（重音间隔时长并不恒定）。
    scope: 连续统是描述工具，不直接给练习法；同一个人的语速、文体都会让位置滑动，不能给孩子贴「你就是音节计时」的标签。
    exceptions: []
  mechanism:
    beats:
    - beat: 节奏连续统
      text_adult: 节奏差异来自一串语音性质的叠加（有没有元音弱化、音节结构能多复杂、重音是否拉开时长差），不是某种神秘的「等时性」；实测（相邻元音段时长变异度 PVI）显示语言在这条带上连续分布，英语与汉语分处偏两端的位置——中国孩子「每个音节一样用力」读英语，正是把汉语的位置带进了英语。
      anchors: []
