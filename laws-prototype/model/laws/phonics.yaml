  adult:
    sources:
    - Peter Roach (CUP, 4th ed. 2009)；Alan Cruttenden《Gimson's Pronunciation of English》(8th ed. 2014)；Yavaş《Applied English Phonology》。GA/RP 并列表：https://www.academia.edu/35182463/How_Many_Phonemes_Does_the_English_Language_Have 。接触等级：教材口径·二手互证。
    boundary: 纠正任务书：任务书把 20 个元音拆成「6 短元音、5 长元音、5 r 控、双元音若干」——RP 描写里没有这个拆法：短元音是 7 个（含 /ə/），且「r 控元音」是美国课堂的教学分类、不是 RP 的音位类目；混编会让孩子以为英音里也有五个「儿化元音」。任务书「英美口径差 1–3 个」亦低估。App 选定一种口径后，本表须按该口径单列，英美不许混编。
    disputes:
    - 44 并非定案：有学者主张双元音与三元音组合不应计为单位音位，重算后英语只有 35 个音位（IJSELL 2017 的再分析，属少数派）；当代英音研究者（如 Geoff Lindsey）另指出 SSB 元音已漂移（/ʊə/ 近乎消失、双元音质量改变），44 实为二十世纪 RP 的快照。教学处理：数字照用 44，分歧只进教师层。
    evidence_grade: 教材口径·二手互证
    pending: []
  corrections:
  - 任务书「20 元音 = 6 短 + 5 长 + 5 r 控 + 双元音若干」的拆法作废：RP 短元音为 7（含 /ə/），r 控不是 RP 音位类目；任务书「英美口径差 1–3 个」低估（元音名目差 4–6 个）。
