- id: S-24
  zone: 拼读
  group: S
  order: 24
  headline: 记拼写的标准循环是「看—说—盖—写—查」，而听写有两种、目的不能混
  headline_kid: 记一个词的拼写，有个老办法：一看（看清哪儿最容易错）、二说（把这个词念出来，难念的地方故意念出声，像 Wed-nes-day）、三盖（把词盖住）、四写（凭记忆默写）、五查（一个字母一个字母对）。写错了就再来一轮。还有，老师听写你的时候，心里要清楚这次考的是「耳朵听没听清」还是「手会不会拼」——这是两场不同的考试。
  claim:
    type: rule
    statement: 拼写自学标准循环为 Look–Say–Cover–Write–Check；听写须按目的分层（听辨型记声音、拼写型记字母），混用必误诊。
    evidence:
    - LSCWC 的步骤与命名经多份英国小学官方拼写政策/家长指导文件核对一致（通称 “the method used to practise spellings in most primary schools”）；其普及与英国国家读写战略年代的拼写教学材料同代。接触等级：传统通称级——未定位到单一发明人或原始文献，按「英国小学教学传统标准件」著录。
    - 支撑：LSCWC 在英国学校文件中的一致表述与长期沿用是其「标准件」地位的证据（传统存续，非实验定版）；其提取成分与学习科学的提取练习证据方向一致。听写分层部分为基于 S-09/S-14 的教学设计推论，无独立经典出处，已标明、不冒充经典条目。
    scope: LSCWC 是整词记忆 routine：完全合规则的词用它逐词背是浪费（那些词该由拼读规则生成）；最佳用法是攻词的「难记部件」。每轮词数宜少、隔日复现。
    exceptions: []
  mechanism:
    beats:
    - beat: 看—说—盖—写—查（LSCWC）
      text_adult: Look–Say–Cover–Write–Check：其设计逻辑是多感官协同（看＝视觉、说＝听觉、写＝动觉）+「盖住后凭记忆写」把再认改造成提取——写错则在 Check 步得到逐字母的即时反馈纠正。常见六步变体在 Write 后再加一 Say；战略年代教师材料另有 Look–Think–Cover–Write–Check 变体。例：Wednesday 以 Wed-nes-day 式拼读发音攻难记部件。
      anchors:
      - Wednesday
      text_kid: 记一个词的拼写，有个老办法：一看（看清哪儿最容易错）、二说（把这个词念出来，难念的地方故意念出声，像 Wed-nes-day）、三盖（把词盖住）、四写（凭记忆默写）、五查（一个字母一个字母对）。写错了就再来一轮。还有，老师听写你的时候，心里要清楚这次考的是「耳朵听没听清」还是「手会不会拼」——这是两场不同的考试。
    - beat: 听写分层
      text_adult: 听写按目的分两型，混用必误诊：①听辨型听写，测把连读语音流切开并听出弱式的能力，记分看「听没听对声音」；②拼写型听写，测已教拼写模式的正字回忆，记分看字母对错。拿未教过的拼写去考听力、或按拼写错误扣听辨的分，都把两种能力搅成一笔糊涂账。
      anchors: []
