    sources:
    - 英国小学官方拼写政策/家长指导文件（多份核对一致）；英国国家读写战略年代教师材料。接触等级：传统通称级。
    boundary: LSCWC 是整词记忆 routine：对完全合规则的词，用它逐词背是浪费（那些词该由拼读规则生成，见 S-01）；它的最佳用法是攻词的「难记部件」（与 S-25 的 heart part 逻辑合流）。每轮词数宜少、隔日复现。听写分层同理：分层是为了诊断清楚，不是取消综合听写——高段的篇章听写本就同时调用两能，但记分与讲评须分开归因。
    disputes:
