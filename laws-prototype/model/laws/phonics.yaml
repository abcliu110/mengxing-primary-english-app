  headline: knight 里的 k 和 gh 不发音，不是拼写在捣乱：它们曾经真的发音，是声音先消失、字母留了下来
  headline_kid: 有些词里藏着「不出声的字母」，它们以前是出声的，后来声音退休了，字母还留在岗位上。
  claim:
    type: etymology
    statement: 一批沉默字母源于音变消失：古英语 knight 读 /knixt/，/x/（gh）消失、词首 kn- 的 k 脱落，而拼写在印刷标准化时被固定。
    evidence:
    - 英语史标准叙述：元音大推移时期的辅音变化部分（见 S-15 出处）；Jespersen《历史原则现代英语语法》第 I 卷 Sounds and Spellings。https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/great-vowel-shift
    - 支撑：中古英语文本（乔叟押韵）与早期拼写变体直接记录了 /x/ 的存在与消失过程。
    scope: 不是所有不发音字母都源于音变消失——有些是文艺复兴时期学者按拉丁语「正字」硬塞回去的（如 debt 的 b），两类成因要分清。
