    statement: 发音练习时间应按「对可懂度的影响」排序：多数辅音、元音长短对比、核重音为核心（LFC）；/θ ð/ 精确舌位、词重音、弱式对可懂度影响小。
    evidence:
    - Jennifer Jenkins (2000)《The Phonology of English as an International Language》(Oxford University Press)，提出 Lingua Franca Core。https://www.britishcouncil.org/voices-magazine/how-teach-english-lingua-franca-elf
    - 支撑：LFC 的数据来源是非母语者之间真实交际的失误记录，使「可懂度优先于母语化」成为可核查的清单。
    scope: 适用场景是「以国际交际为目标」；目标包含国内考试听力与朗读评分时，标准音特征仍在评分范围内，两条标准分开声明。与 S-09 的取舍已经裁定 A 定版（2026-11-02）：听辨全教、产出只要求 LFC 核心、弱读产出认识即可。
    exceptions:
    - 考试听力与朗读评分场景下，标准音特征（含弱式等）仍在评分范围内，不按本条降格。
  mechanism:
    beats:
    - beat: 通用语核心（LFC）
      text_adult: 交际失败的实证记录显示，真正导致听不懂的发音问题集中在一小撮特征上（多数辅音是否到位、元音长短对比、核重音）；而若干传统苦练项（如 /θ ð/ 的精确舌位、词重音、弱式）对可懂度影响小。把练习时间按「对听懂的影响」排序，是发音教学的理性分配。
      anchors: []
