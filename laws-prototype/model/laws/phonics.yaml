- id: S-05
  zone: 拼读
  group: S
  order: 5
  headline: 听觉上先有「块」再有「个」：孩子先听得出押韵和词块（首音—韵脚），然后才听得出单个音素
  headline_kid: 耳朵学声音是先听出大块（哪个词和哪个词押韵），再听出小块（每个小声音）。
  claim:
    type: tendency
    statement: 语音意识的发展次序是先大单位（押韵、首音—韵脚）后小单位（音素）；学前押韵敏感度预测后来的阅读成绩。
    evidence:
    - Usha Goswami & Peter Bryant (1990)《Phonological Skills and Learning to Read》(Erlbaum)；实验根基为 Bradley & Bryant 的押韵怪词研究。https://www.academia.edu/67386986/Phonological_Skills_and_Learning_to_Read
    - 支撑：纵向研究显示学前押韵敏感度在控制智力与词汇后仍预测后来的阅读成绩；Goswami 的线索词实验证明初学者自发用韵脚类比读生词。
    scope: 韵脚类比只覆盖拼法一致的词族；同音异形与异读韵脚（如 -ea 家族）类比会出错，须与变脸名单教学配合。
    exceptions:
    - 韵脚类比用于拼法不一致的词族（如 -ea 家族）会出错。
  mechanism:
    beats:
    - beat: 首音—韵脚与类比阅读
      text_adult: 音节天然分成首音（onset）和韵脚（rime）；学前儿童对韵脚的敏感先于音素意识出现，并能凭「同韵脚同拼法」的类比读新词（会 beak 就能试 peak）。所以拼读教学前面要先有押韵、头韵等大单位的听辨游戏打底。
      anchors:
      - beak
      - peak
      text_kid: 耳朵学声音是先听出大块（哪个词和哪个词押韵），再听出小块（每个小声音）。
  examples:
  - level: 1
    group: 韵脚类比
    words:
    - beak
    - peak
    supports: claim
  error_cases: []
  probes: []
  quiz: []
  relatives:
