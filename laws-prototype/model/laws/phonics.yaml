- id: S-42
  zone: 拼读
  group: S
  order: 42
  headline: 变脸榜：ough 以八至十读居首，ea、ou、a、y、oo 依次——读法越多越要整组记，本榜是 S-06 变脸名单的排序与内容依据
  headline_kid: 有几个字母组合是「变脸大王」：ough 一个组合有八到十种读法，ea 有四种（带上 ear 家族有七种），ou 有六七种——这些组合没有规则可猜，办法是把每个组合的词按读法分组，一组一组记住。本榜就是变脸名单的正式版。
  claim:
    type: rule
    statement: 变脸榜按「读法数 × 不可预测度」加权排序（英式口径）：第 1 名 ough（常用 8 读、全谱 10 读）、第 2 名 ea 及 ear 家族（本体 4 读、家族 7 读）、第 3 名 ou（重读 6 读、全谱 7 读）、第 4 名 a（重读 6 读、全谱 8 读）、第 5 名 y（4 读）、第 6 名 oo（3 读，附 oo+r 一读）。对策是按词族分组记。
    evidence:
    - 'Wikipedia「Ough (orthography)」条读音表与计数口径（开页核对）https://en.wikipedia.org/wiki/Ough_(orthography) ；剑桥词典官方博客《Ghosts, coughs and daughters: how to pronounce ''gh'' in English》（开页核对）http://dictionaryblog.cambridge.org/2018/09/19/ghosts-coughs-and-daughters-how-to-pronounce-gh-in-english/ ；Teflpedia ⟨ough⟩ 条九读表（二手核对）；ea、ou、a、y、oo 各组例词读音按剑桥词典音标逐词核对（词典级）。'
    - 支撑：九读例证句（Wikipedia 引）："The wind was rough along the lough as the ploughman fought through the snow, and though he hiccoughed and coughed, his work was thorough."——rough /ʌf/、lough /ɒx/、plough /aʊ/、fought /ɔː/、through /uː/、though /əʊ/、hiccoughed /ʌp/、coughed /ɒf/、thorough /ə/，一句九读俱全。
    scope: 计数封顶于「常用词 + 两个有词典登记的罕见项」，不收专名与苏格兰方言读法；本榜只收元音区（辅音区两三读组合归 S-30–S-33）；词例以小学至初中高频词为准绳。
    exceptions:
    - slough 一词三读（/slʌf/ 蜕皮、/sluː/ 泥沼（主美）、/slaʊ/），是单字层面的变脸，不重复计入组合读法数
