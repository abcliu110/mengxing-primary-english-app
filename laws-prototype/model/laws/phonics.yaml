entries:
- id: S-01
  zone: 拼读
  group: S
  order: 1
  headline: 先系统地学字母—声音对应、而且越早开始收益越大，这是全领域证据最硬的一条教学结论
  headline_kid: 先把字母和声音一对一对学清楚，越早学会拼，后面读得越顺。
  claim:
    type: rule
    statement: 字母—声音对应必须按计划显性、系统地教完；越早开始（幼儿园/一年级），收益越大。
    evidence:
    - 美国国家阅读委员会（NRP）2000 年报告《Teaching Children to Read》字母学分报告；期刊版：Ehri, Nunes, Stahl & Willows (2001)《Systematic Phonics Instruction Helps Students Learn to Read》, Review of Educational Research 71(3)，38 项实验、66 组对照的元分析。链接：https://psycnet.apa.org/record/2002-18026-002
    - 支撑：元分析总效应 d=0.41，幼儿园/一年级开始 d=0.55，效果在教学结束后仍保持，对解码、认词、拼写、理解均有收益。
    scope: 解码教学层；拼读管「认词」不管「读懂」，不能替代语言理解教学（见 S-07）。
    exceptions: []
  mechanism:
    beats:
    - beat: 系统拼读的必要性
      text_adult: 英语拼写是「深正字法」，对应关系成百上千；只有把对应关系按计划显性教完，孩子解码新词时才有可调用的规则库存，而不是靠猜图猜上下文。
      anchors: []
      text_kid: 先把字母和声音一对一对学清楚，越早学会拼，后面读得越顺。
