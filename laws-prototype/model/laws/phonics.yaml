- id: S-16
  zone: 拼读
  group: S
  order: 16
  headline: 英语里 f 对拉丁语 p、th 对 t 这类「对不上的对应」，是一次成系统的辅音大搬家留下的——格林定律
  headline_kid: 很久以前，英语的祖先把一批辅音整体换了个位置，所以亲戚语言里对得上的词，辅音看起来总是差一格。
  claim:
    type: etymology
    statement: 原始印欧语塞音在日耳曼语族发生链式移位（格林定律），形成拉丁语 p↔英语 f、t↔th 等系统对应；保留旧音的多为移位之后借入的词。
    evidence:
    - Jacob Grimm (1822)《Deutsche Grammatik》（第 2 版）系统表述日耳曼语辅音推移；先行观察有 Rask 1818。https://menonimus.org/the-great-consonant-shift/
    - 支撑：格林定律是比较语言学的范式案例，其例外后来被 Verner 定律（1875）以重音位置解释大半。
    scope: 只针对原始印欧语→原始日耳曼语这一段，不适用于后来各日耳曼语言内部的变化；小学段只取「辅音差一格认亲戚」的识别功能，不展开三组对应表。
    exceptions: []
    source: Jacob Grimm (1822)《Deutsche Grammatik》第 2 版系统表述日耳曼语辅音推移（先行观察有 Rask 1818）。
  mechanism:
    beats:
    - beat: 格林定律
      text_adult: 原始印欧语的塞音在日耳曼语族里发生链式移位（清塞音变擦音、浊塞音变清塞音等），于是拉丁语 piscis 对英语 fish、tres 对 three、canis 对 hound；掌握对应方向，就能认出大批「长得不像的亲戚词」，也能识别哪些词是移位之后借进来的（保留 p 的多为后借词）。
      anchors:
