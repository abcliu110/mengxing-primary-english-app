  error_cases:
  - wrong: three → sree
    right: three /θriː/（舌尖探出齿缝）
    error_type: 母语顶替
    source_type: 真实语料错型
    diagnosis: 汉语无齿间擦音 /θ/，以 /s/ 顶替（Deterding 2006 与 ICILLP 2025 综述著录）；回指机制小节「音段顶替四项」①。
    diagnosis_kid: "汉语里没有 /θ/ 这个齿间音，所以容易拿 /s/ 来顶替。three 要让舌尖探出齿缝来读。"
  - wrong: very → wery
    right: very /ˈveri/（上齿咬下唇）
    error_type: 母语顶替
    source_type: 真实语料错型
    diagnosis: 汉语有 /w/ 无 /v/，以 /w/ 顶替 /v/；回指机制小节「音段顶替四项」②。
    diagnosis_kid: "汉语有 /w/ 无 /v/，以 /w/ 顶替 /v/；回指机制小节「音段顶替四项」②。"
  - wrong: ship / sheep 读成一个音
    right: ship /ʃɪp/ 短而紧、sheep /ʃiːp/ 长而松
    error_type: 长短合流
    source_type: 真实语料错型
    diagnosis: 汉语 /i/ 一类独大，紧松对立与时长线索双缺；回指机制小节「音段顶替四项」③，处方听辨先行。
    diagnosis_kid: "汉语 /i/ 一类独大，紧松对立与时长线索双缺；回指机制小节「音段顶替四项」③，处方听辨先行。"
  - wrong: banana 三个音节一样响
    right: ba-NA-na（弱读音节读 /ə/、小声快速滑过）
    error_type: 弱读缺席
    source_type: 真实语料错型
    diagnosis: 汉语音节元音不弱化，弱读 /ə/ 系统性缺席、以全元音代之（Deterding 2006 著录）；回指机制小节「弱读、词尾与音节结构四项」⑤。
    diagnosis_kid: "banana 的三个音节不是一样响：中间的弱读音节要读 /ə/，小声快速滑过。汉语的音节元音不弱化，容易把弱读的 /ə/ 读成满满的全元音。"
  - wrong: bed → bet；cat、map 尾音脱落
    right: bed /bed/（浊尾咬住，前面元音更长）；cat、map 尾塞音收住
    error_type: 词尾削减
    source_type: 真实语料错型
    diagnosis: 汉语韵尾只有 -n、-ng，词尾浊塞音被清化、尾塞音被吞掉；回指机制小节「弱读、词尾与音节结构四项」⑥。
    diagnosis_kid: "汉语韵尾只有 -n、-ng，词尾浊塞音被清化、尾塞音被吞掉；回指机制小节「弱读、词尾与音节结构四项」⑥。"
  - wrong: blue → buh-loo（丛中塞元音）
    right: blue（由尾及首连滑 ue→lue→blue，丛中不停顿不加塞）
    error_type: 丛中插元音
    source_type: 真实语料错型
    diagnosis: 汉语无辅音丛，词首丛被塞入元音拆散（Deterding 2006 附加元音著录）；回指机制小节「弱读、词尾与音节结构四项」⑧。
    diagnosis_kid: "汉语里没有辅音丛，词首两个辅音连在一起时，容易往中间塞一个元音，把 blue 拆成 buh-loo。练法：由尾及首连着滑，ue→lue→blue，中间不停顿、不加塞。"
  - wrong: sing → sin
    right: sing /sɪŋ/（鼻腔共鸣、嗡嗡尾延长）
    error_type: 母语顶替
    source_type: 教学文献登记错型
    diagnosis: 部分汉语方言区普通话自身 -n/-ŋ 不分，迁移至英语 -ng；回指机制小节「弱读、词尾与音节结构四项」⑦。
    diagnosis_kid: "有些汉语方言区的人，普通话里 -n 和 -ŋ 本来就不分，这个习惯带到英语里，sing 的 -ng 就读成了 -n。sing 要读出鼻腔共鸣，把嗡嗡的尾巴延长。"
