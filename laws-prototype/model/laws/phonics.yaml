- id: S-25
  zone: 拼读
  group: S
  order: 25
  headline: 高频小词走「直认快线」：Dolch 220 与 Fry 1000——但直认的是词，不是词形照片
  headline_kid: 有些词在每一页书里都会出现（the、you、said、was……），它们太常来了，等你一个个拼完，黄花菜都凉了。这些词要练到「眼睛一扫就认得」。但记住：要认的是整个词（它的声音和意思），不是背一张「词的照片」——词里大部分字母其实还是讲规则的，只有一小截不讲规矩，那一小截用心记住就行。
  claim:
    type: rule
    statement: 最高频的一小批词走直认快线；直认的机制是正字法映射（音—形焊接）而非记词形轮廓；只有一小截不规则的词按 heart words 处理——规则部分照常拼读，只背不规则截段。
    evidence:
    - Dolch 词表：Edward William Dolch 1936 年发表 220 个「服务词」，《Problems in Reading》定版通行；Fry 词表：Edward B. Fry 的 Instant Words，1957 年先出 100 词，1980 年扩至 1000 词；heart words 的定义与 said 例经结构化读写教学圈通行表述核对；正字法映射机制与 S-02 同源（Ehri）。接触等级：二手系统论述级。
    - 支撑：高频词的文本覆盖率分布（少数词占文本大头）与词频原理一致，两表长达数十年的课程存续是其可用性的传统证据。
    scope: 两张表是美国 L1 初学读者（1930s–1980s 语料）的工具，中国 EFL 学习者应按自家课标词表与分级读物重排高频序，不直接进口名单。直认快线只服务最高频的一小批词，是拼读主线的并行件不是替代品。
    exceptions: []
  mechanism:
    beats:
    - beat: 两张高频清单
      text_adult: Dolch 词表——1936 年发表 220 个「服务词」（代词、动词、介词、连词、形容词、副词等功能词；另附 95 个常用名词单表），选词逻辑是儿童读物高频统计。Fry 词表——1957 年先出 100 词，1980 年扩至 1000 词，按频率排序、每 100 一组。两表高度重叠（Fry 1000 几乎含全部 Dolch 词）。
      anchors:
      - the
      - you
      - said
      - was
      text_kid: 有些词在每一页书里都会出现（the、you、said、was……），它们太常来了，等你一个个拼完，黄花菜都凉了。这些词要练到「眼睛一扫就认得」。但记住：要认的是整个词（它的声音和意思），不是背一张「词的照片」——词里大部分字母其实还是讲规则的，只有一小截不讲规矩，那一小截用心记住就行。
    - beat: 正字法映射与 heart words
      text_adult: 所谓 sight word 的正解是「任何已存入长期记忆、能瞬间认出的词」，认储靠的是正字法映射——把词的读音逐音与字母焊接，而非记词形轮廓；盘点两表会发现：相当一部分词其实完全合拼读规则（in、and、red、jump），另一些只有一小截不规则（如 said 只有 ai 读 /e/ 不合常规）——现行折中教法称后者为 heart words（用心词）：规则部分照常拼读，只把不规则的那一小截「用心记住」，要背的量由此缩到最小。
