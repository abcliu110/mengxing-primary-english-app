    boundary: 推移主要动长元音，短元音与大量借词（推移后进入的 police 等）不在内；个别词未跟上链条（father、broad），讲故事时不能说「所有词都变了」。
    disputes:
    - （学术内部）推移是「推链」还是「拉链」（Jespersen 本人持拉链说）至今有争论；这是成人学术层分歧，不影响对儿童的机制表述（链条确实整体移动过）。
