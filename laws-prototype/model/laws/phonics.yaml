- id: S-27
  zone: 拼读
  group: S
  order: 27
  headline: 后缀分两班：一班会把重音拽走（-ic/-ion/-ity/-ial），一班站着不动（-ness/-ful/-less/-ly）——认出后缀，就能预言重音
  headline_kid: 给词加重音像排座位：有些后缀是「大嗓门」，一来就把重音拉到自己家门口：PHOtograph 加上 -y 变 phoTOgraphy，再加 -ic 变 photoGRAphic，重音一路往后跑。有些后缀是「安静邻居」：happy 加 -ness 变 HAppiness，重音纹丝不动。规律是：-ic、-ion、-ity、-ial 这一班爱拽重音（重音总落在它们前一格）；-ness、-ful、-less、-ly 那一班从不拽。重音一跑，原来不重读的元音就会含糊成 schwa——这就是词越变越「读不准」的机关。
  claim:
    type: tendency
    statement: 后缀按对重音的效应分班：前拉班（-ic/-ion/-ity/-ial/-ious/-ian 等）使主重音落在后缀前一音节；自重班（-ee/-eer/-ese/-esque/-ette）自带主重音；中性班（-ness/-ful/-less/-ly/-ment/-er/-ing/-ish 及绝大多数前缀）不改变词干重音。先由后缀预言重音，再由重音预言哪些元音弱化为 schwa。
    evidence:
    - Peter Roach《English Phonetics and Phonology》(CUP）复杂词重音章——词缀对重音的三种效应（多家大学语音学讲义以 Roach 1991, p. 96 逐点转述核对一致）；Erik Fudge《English Word-Stress》(Allen & Unwin, 1984)。photograph 例链转写经课程讲义逐词核对。接触等级：二手系统论述级（Roach 原书该章未直接打开）。
    - 支撑：给从未见过的 -ity/-ic 结尾长词（如 echogenicity），母语者与受训学习者能一致地把重音放在后缀前一格——规则在新词上成立；词典注音对该类词的重音著录高度一致。
    scope: 分类管的是派生词的默认重音；对比焦点、语调节律等语用因素可临时覆盖默认。对中国学生，本条的前提是能听辨重音落点——听辨未过关时本条只能作教师知识。注：标题句作「两班」，机制实为三班（自重/前拉/中性），claim 以机制三班为准（见组建模文档取舍登记）。
    exceptions:
    - -ic 的例外串：Arabic、lunatic、politics、heretic 等不拉（重音在首）
    - -ity 偶有不移者
    - -graphy/-logy 型把重音拉到倒数第三音节位（photograph→photography），是前拉班的变体；个别教材单列「混合班」（-ation、-graphy），归类不一
  mechanism:
    beats:
    - beat: 自重班
      text_adult: 后缀自己扛起主重音：-ee（employEE）、-eer（engineer）、-ese（JapanESE）、-esque（picturesque）、-ette（cigarette）。
      anchors:
      - employee
      - engineer
      - Japanese
      - picturesque
      - cigarette
      text_kid: 给词加重音像排座位：有些后缀是「大嗓门」，一来就把重音拉到自己家门口：PHOtograph 加上 -y 变 phoTOgraphy，再加 -ic 变 photoGRAphic，重音一路往后跑。有些后缀是「安静邻居」：happy 加 -ness 变 HAppiness，重音纹丝不动。规律是：-ic、-ion、-ity、-ial 这一班爱拽重音（重音总落在它们前一格）；-ness、-ful、-less、-ly 那一班从不拽。重音一跑，原来不重读的元音就会含糊成 schwa——这就是词越变越「读不准」的机关。
    - beat: 前拉班
      text_adult: 主重音落在后缀前一音节：-ic（economy→economic）、-ion（inform→information）、-ity（stupid→stupidity）、-ial（commerce→commercial）、-ious/-eous（courage→courageous）、-ian；-graphy/-logy 型则把重音拉到倒数第三音节位（photograph→photography），是前拉班的变体。
      anchors:
      - economy
      - economic
      - inform
      - information
      - stupidity
      - commerce
      - commercial
      - courage
      - courageous
      - photograph
      - photography
    - beat: 中性班与弱化桥
      text_adult: 加缀如没加，词干重音原样保留：-ness、-ful、-less、-ly、-ment、-er、-ing、-ish，以及绝大多数前缀（un-、re-、dis- 等皆中性）。招牌例链：PHOtograph /ˈfəʊ.tə.ɡrɑːf/ → phoTOgraphy /fəˈtɒɡ.rə.fi/ → photoGRAphic /ˌfəʊ.təˈɡræf.ɪk/。重音移位必然伴随元音弱化：失去重音的元音多读作 schwa /ə/——先由后缀预言重音，再由重音预言哪些元音会弱化，长词的读音就可推导而非逐词背。
      anchors:
      - happiness
      - photograph
      - photography
      - photographic
