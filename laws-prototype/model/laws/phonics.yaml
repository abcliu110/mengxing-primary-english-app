    - 框架层分歧见 S-22（不在此重述）。操作层另有一个小分歧登记：部分课程（如某些州课程文件）把 VCV 的默认切法按词频词表排序（先开后闭），另一部分语音学取向的材料主张直接按发音切（听到短元音即闭切）——前者是给未识词的解码策略、后者是给已识词的标注方法，对象不同，不构成真冲突，本条按解码策略立条。
    evidence_grade: 课程文件级
    pending:
    - （2026-11-02 终局登记）VCV 约 75% 归老虎切法：经复检仍未定位到一手语料计量研究——该数字的出处链止于 OG 教学文献（Science of Reading 教学指南引作 “(Moats, 2020)” 口径），市面另有 60%–75%、60% 等变体并行。定版为教学共同体通称、非实测结果，不作实测结论引用，不再挂开放待核。
