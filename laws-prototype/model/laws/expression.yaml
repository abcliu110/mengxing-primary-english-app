    sources:
    - Halliday & Hasan (1976)《Cohesion in English》, Longman（ISBN 0-582-55041-6）
    - 出版社目录：https://www.routledge.com/Cohesion-in-English/Halliday-Hasan/p/book/9780582550414
    - 书目记录：https://openlibrary.org/books/OL4610807M/Cohesion_in_English
    boundary: 隐性连贯（靠内容顺序自然衔接）在叙事文里完全成立，不是每句都要路标；儿童写作中路标宁少勿错。
    disputes: 无
