  adult:
    sources:
    - Pawley & Syder (1983)，同 NE-01
    - 综述转述：https://ukdiss.com/examples/formulaicity-second-language-acquisition.php
    boundary: 句干多为「半固定」——留有可替换的槽位，并非整句死背；流利还受发音自动化、话语规划等因素影响，句干库存是必要条件而非全部解释。库存规模数字是估计，不得当作实测统计引用。
    disputes: 无主流分歧；分歧在库存单位的粒度与计数方法（与 NE-03 的识别问题同源）。
    evidence_grade: 二手互证级
