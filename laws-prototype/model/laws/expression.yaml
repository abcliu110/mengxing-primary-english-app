- id: E-14
  zone: 表达写作
  group: E
  subgroup: C 能力构成与教学
  audience: 教师/设计层
  headline: 没注意到的东西学不会：语用规矩藏在语境中，不把孩子的注意力引过去，他听一百遍也可能没看见
  headline_kid: 耳朵听到了，不等于脑子记下了；要有人指给你看「这里有个规矩」，你才能学会它。
  claim:
    type: tendency
    statement: 输入只有被有意识地「注意到」（noticing），才可能转化为摄入（intake）进而被习得（弱式口径：注意到越多，学得越多）；语用信息比语音语法更隐蔽，语用教学的核心动作是设计「让学生注意到规矩」的对比与提示，而不是增加浸泡时长。
    evidence:
    - 'Richard Schmidt (1990) “The Role of Consciousness in Second Language Learning”, Applied Linguistics 11(2): 129–158——注意假说原典；语用方向引介见 Kasper & Schmidt (1996) 及 Kasper & Rose (2002)（二手论述级）'
    - 注意假说是二语习得认知转向的枢纽假说，与 Swain「注意到缺口」（W-07）互为输入/输出两面
    scope: 语用与一般二语教学的注意力设计原则
    exceptions:
    - note: 对低龄儿童，「注意」靠情境对比与戏剧化呈现引出，不靠讲解术语
      word_ids: []
  mechanism:
  - beat: 听见≠看见
    text_kid: 耳朵听到了，不等于脑子记下了。
    text_adult: 注意假说：输入须先过「注意」这一关才可能变摄入；语用规矩（谁对谁该怎么说）藏在语境里，听一百遍也可能没看见。
    visual: 耳朵与眼睛双图标：声波穿过，聚光灯未打处一片灰
    anchors: []
  - beat: 把注意力引过去
    text_kid: 要有人指给你看「这里有个规矩」，你才能学会它。
    text_adult: 教学动作 = 设计对比与提示（输入强化、情境对比、戏剧化呈现），把隐蔽的规矩变成可注意的对象，而不是单纯加时长。
    visual: 聚光灯图：对比呈现把光打在规矩处
    anchors: []
  examples: []
