    visual: 出生证图：两条规矩各挂一张写着年份与出处的牌子
    anchors: []
  - beat: 简易测试
    text_kid: 一条规矩要是逼得你把话说得别扭，它多半是假的。
    text_adult: 语言学家常用的判别法：真规则顺着说自然，假规则守着说别扭；英语不定式两截、介词可悬空，都是日耳曼语的自家结构。
