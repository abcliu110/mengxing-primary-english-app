  audience: 教师/设计层
  headline: 英语已经不归母语者管了：三圈世界与「说给全世界听」的目标
  headline_kid: 全世界说英语的人里，老家就说英语的反而是少数——大多数是像我们这样把英语当外语的人。学英语是为了跟全世界说话，不是为了装成英国人或美国人。
  claim:
    type: tendency
    statement: 三圈模型：内圈（以英语为母语，提供规范）、外圈（以英语为官方第二语言，发展自己的规范）、扩展圈（以英语为外语，依赖规范）。非母语使用者总数数倍于母语者，英语交际有很大一部分发生在非母语者与非母语者之间——英语的「重心」正在离开母语国家，学习目标应从「像某个母语者」转为「在国际场合被广泛理解」。
    evidence:
    - Braj Kachru 三圈模型（1982/1985 提出，见其编《The Other Tongue》, 1992）；David Crystal《English as a Global Language》(Cambridge University Press, 1997；第 2 版 2003) 第 60 页对三圈的转述与评论（二手论述级）
    - Graddol 的估计：21 世纪初英语使用的「重心」正转向二语使用者
    scope: 学习目标定位（模型为 1980 年代的社会语言学快照，国家归类会随时代变化）
    exceptions:
    - note: 小学教学仍需选定一两个参照口音作输入样本：三圈说否定的是「唯一正确」，不是「不需要参照」
