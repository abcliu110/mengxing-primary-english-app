- id: NE-03
  zone: 表达写作
  group: NE
  subgroup: 地道与流利
  audience: 双层
  headline: 学英语的起步单位是整块，不是单词加规则
  headline_kid: 先把整句话、整块话囤进脑子里（像囤现成的积木套装），用熟了，再慢慢看懂里面是怎么搭的。
  claim:
    type: tendency
    statement: 由地道选择与流利两谜题合得的教学结论：学习不该只走「单词 + 规则现拼」一条路，而应整存整取与拆解分析并行——先把高频整句、半固定句干作为单位学会、用熟（获得地道与流利），再在反复使用中析出可变槽位与规律（获得创造性）；心理词库本身即多粒度混存。
    evidence:
    - 机制源头 Pawley & Syder (1983)，同 NE-01；Wray 的多粒度词库说见 Alison Wray《Formulaic Language and the Lexicon》(CUP, 2002) 的系统综述转述（二手互证级）
    - Erman & Warren (2000) 人工分析抽样：预制语串约占口语文本 58.6%、书面语 52.3%（该研究的计数口径，定义不同则比例在约三分之一到八成之间浮动）
    - Sinclair 的语料研究从另一方向得到同一结论（idiom principle 为默认，见 CB-01）
    scope: 起步阶段以整块为主、拆解随识字与元语言意识增长逐步加重
    exceptions:
    - note: 只囤不拆，遇到没背过的场合就卡壳；只拆不囤，则永远对而不地道、慢而不流利
      word_ids: []
  mechanism:
  - beat: 先囤整块
    text_kid: 先把整句话、整块话囤进脑子里，用熟了再说。
    text_adult: 整存整取路线先行：高频整句与句干作为单位学会、用熟，先拿到地道与流利——这是起步单位的选择，不是终点。
    visual: 积木套装图：整套先入库，搭熟后再拆看结构
    anchors: []
  - beat: 再慢慢拆
    text_kid: 用熟了，再慢慢看懂里面是怎么搭的。
    text_adult: 拆解分析随后跟上：在反复使用中析出槽位与规律，获得创造性；两条路线并行配比随年龄与识字进程调整。
    visual: 放大镜图：用熟的整句被放大，槽位与规律显形
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_0564
    - G2_K01
    sentence: Good morning! What is your name?
    scene_note: 先整块用熟的见面话：还没拆开分析，先会用（自建例句）
    supports: claim
  - level: 1
    word_ids:
    - V6_天气_33
    sentence: How are you? — I am fine, thank you. And you?
    scene_note: 整句对整句囤：问答成对存入，用熟后再析出里面的词（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G1_004
    sentence: Can I have a pencil, please? — Sure. Here you are.
    scene_note: 一整块请求加一整块回应：先囤现成的积木套装（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: NE-01
    rel: 同族
  - id: NE-02
    rel: 同族
  - id: E-04
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: "积木套装「Good morning! What is your name?」", kind: 词卡套装, states: [整套入库先会用, 用熟后被放大看清结构]}
        - {name: "问答套装「How are you? — I am fine, thank you. And you?」", kind: 词卡套装, states: [问答成对整块存入, 用熟后析出里面的词]}
        - {name: "请求回应套装「Can I have a pencil, please? — Sure. Here you are.」", kind: 词卡套装, states: [一整块请求配一整块回应, 先囤着用]}
        - {name: 放大镜, kind: 场景道具, states: [挂在套装旁边, 移到用熟的套装上显出槽位]}
      invariants: "先整块囤、用熟，再慢慢拆看结构，两条路要并行；只囤不拆换个场合就卡住，只拆不囤则对而不快"
    beats:
      - "设置：三套积木套装整套整套搬进小仓库，见面套装、问答套装、请求回应套装都还没拆开（旁白：「先把整句话整套搬回家，用起来再说。」）"
      - "变形：孩子在见面场景里整套用出「Good morning! What is your name?」，又整套对答问答套装，一句不拆也说得顺（旁白：「还没拆开看，先整套会用，就已经能说话了。」）"
