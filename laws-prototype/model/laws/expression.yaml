        - {name: 长句积木「The tall boy is my brother.」, kind: 台词卡, states: [不存在, 意思不变地拼成]}
        - {name: 扣件 so 与 who, kind: 场景道具, states: [放在一旁, 把两句扣住或嵌进去]}
        - {name: 短句组「It rained.」「We stayed at home.」, kind: 词卡, states: [两句分开, 用 so 扣成一句]}
      invariants: "拼合时意思不变，只换句子的搭法，不用先背术语、动手拼就会；句子长不是目的，读者看得见跟得上才是，内容和结构不会靠拼句自动变好"
