- id: NE-20
  zone: 表达写作
  group: NE
  subgroup: 悉尼学派
  audience: 教师/设计层
  headline: Reading to Learn：把支架加厚到句子层——让全班读同一篇难文本，而不是给差生降难度
  headline_kid: 不给「简单版课文」糊弄你——老师陪你把难课文一句一句嚼碎，吃透之后你自己也能写出这样的文章。
  claim:
    type: tendency
    statement: Reading to Learn（R2L）在教学循环上再嵌两层支架（段落层、句子/拼写层）：核心招式「精细阅读」以『先给意义提示 → 让学生指出原文词句 → 确认和展开』的互动循环，带每一个学生读懂超出其独立阅读水平的文本——公平设计与分级读物相反：不降低文本难度，而是加厚互动支架，让全班共读同一篇高水准文本。
    evidence:
    - Rose & Martin (2012)《Learning to Write, Reading to Learn》的六阶段口径与三层支架结构，见 R2L 研究综述（二手论述级）
    - R2L 在澳大利亚原住民与弱势学生项目、瑞典斯德哥尔摩学校系统均有实施评估，报告称其能同时加速弱势学生与全体学生的读写进步；印尼 EFL 初中叙事写作干预提供了离开母语环境后的可行性证据
    scope: 精读设计（前提：学生能跟着指读；低年级须与系统拼读教学配合，不能替代它）
    exceptions:
    - note: R2L 对教师备课的要求极高：精细阅读要逐句预设提示与追问，教师培训不到位时容易退化成教师讲学生听
      word_ids: []
    - note: 中国大班额下逐句互动的覆盖面是硬约束
      word_ids: []
  mechanism:
  - beat: 不降难度，加厚支架
    text_kid: 不给简单版糊弄你：课文不换，老师的帮法加厚。
    text_adult: 三层嵌套：整篇（读前准备→共建→独立）/段落（精细阅读→共同改写→个人改写）/句子（造句、拼写、改写）——支架厚度随文本难度上调，而非反向削文本。
    visual: 三层同心图：文本居中，支架一层层加厚
    anchors: []
  - beat: 精细阅读三步
    text_kid: 先给提示，再让你自己找出那句，最后大家一起说透。
    text_adult: 互动循环的每一步都有分工：提示降门槛、指认保参与、确认与展开把理解钉牢——弱势学生在这套循环里不会掉队成旁观者。
    visual: 三步循环箭头图：提示 → 指认 → 展开
