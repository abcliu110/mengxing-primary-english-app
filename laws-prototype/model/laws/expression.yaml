    text_kid: 这个办法有用，但不是对谁、在哪儿都有用。
    text_adult: 阳性结果带三条限定：学段（母语八年级）、人群（强者受益多）、教师（元语言知识中介）——引用本条时三条限定必须同行（见分歧中的小学复制问题）。
    visual: 条件标签图：效应量数字旁挂三枚限定标签
    anchors: []
  examples:
