    text_adult: 推荐序：①写作过程教学（强证据）②基本功流利度（中等证据）③天天写 ④写作共同体；推荐 2 的细则（显性教各环节策略、逐步放手、教学生选策略）可直接转成 App 的写作教学序列。
    visual: 领奖台图：四条推荐按证据强度站台阶
    anchors: []
