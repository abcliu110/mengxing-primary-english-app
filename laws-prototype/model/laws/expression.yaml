- id: W-08
  zone: 表达写作
  group: W
  subgroup: C 证据清单与诚实边界
  audience: 教师/设计层
  headline: 对小学生怎么写才有效，有官方级的证据清单：天天写、教过程、练基本功、建写作圈——四件事按证据强度排好了队
  headline_kid: 每天都写一点、学会想—写—改的办法、把字和句子练顺、和小伙伴互相读作文——这四件事是被很多研究证明有用的。
  claim:
    type: tendency
    statement: 美国教育科学研究院（IES）实践指南按证据等级评审小学写作研究，给出四条推荐：写作过程教学（强证据）、基本功流利度（中等证据）居前，天天写与写作共同体（证据较弱但方向一致）为基本面——这是小学段少有的「推荐 + 证据等级」成套口径。
    evidence:
    - 'Steve Graham 等 (2012)《Teaching Elementary School Students to Be Effective Writers: A Practice Guide》（NCEE 2012-4058），美国教育部教育科学研究院（IES）——Graham 为专家组组长（官方原文级：IES 官方 PDF）'
    scope: 小学段写作课程设计（与本 App 学段精确对应的唯一一份此规格循证指南）
    exceptions:
    - note: 证据多来自英语母语课堂：外语环境下「每天一小时写作」的时间配比不可照搬，需按中国小学课时压缩适配
