    - 'Myhill & Watson (2014), Child Language Teaching and Therapy 30(1): 41–62'
    boundary: 这是母语写作课的立场迁移提示——中国小学生英语词汇与句型存量远小于母语儿童，「可选的仓库」本身很小，选择教学必须等存量积累到一定程度才有东西可选；低年级更现实的做法是先在口头与仿写中积累型式，再谈选择。另外「选择」不等于「没有对错」：EFL 阶段大量形式仍在建立中，准确性目标不能被修辞话语冲掉。
    disputes: 英语国家内部对语法教学价值长期分裂——多项元分析（如 Andrews et al. 的系统综述传统）发现传统语法教学对写作无益甚至有害，Myhill 的回应不是「语法有用」，而是「只有换一种语法观（选择/效果）并嵌入写作才有用」；这一区分本身就是分歧的焦点，不得简化为「研究证明教语法有效」。
    evidence_grade: 二手论述级
