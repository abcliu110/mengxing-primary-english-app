        - {name: 作文纸「I got up. I ate breakfast. I went to school. I played with my friends.」, kind: 台词卡, states: [空白, 一件件顺次写满]}
        - {name: 内容气泡与读者气泡, kind: 标签组, states: [各说各的, 来回对话]}
        - {name: 补了原因的句子卡「I was tired this morning because I went to bed late.」, kind: 台词卡, states: [只有事情本身, 写时把为什么也想清写出]}
      invariants: "一件件顺次写下来是低龄孩子的正常讲述样子，不是偷懒；一边写一边想出为什么，是慢慢长出来的本事，简单记录时顺次写也完全够用"
