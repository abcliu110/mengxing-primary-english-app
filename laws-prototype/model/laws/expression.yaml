- id: NE-17
  zone: 表达写作
  group: NE
  subgroup: Myhill：语法即选择
  audience: 教师/设计层
  headline: 语法要嵌在写作里教才有效：Exeter 随机对照试验给出的是「有条件的有效」
  headline_kid: 一边写故事一边学怎么把句子写好，才学得进去；把语法单独拎出来做练习，写作文时还是用不上。
  claim:
    type: tendency
    statement: 把与该语类写作真正相关的语法点嵌进写作单元里教（嵌入式），写作进步显著优于孤立操练：机制不在「讲了语法」，而在每个语法点都与一个当下要做的写作决定相连（Exeter 母语八年级整群 RCT：干预组效应量 0.21）。效应有条件——见 exceptions 与分歧。
    evidence:
    - 'Jones, Myhill & Bailey (2013) “Grammar for writing?”, Reading and Writing 26: 1241–1263（干预组效应量 e = 0.21, p < .001）；项目总报告 Myhill et al. (2012)（二手论述级；证据强度为 RCT 级）'
    - 整群随机对照试验：700 余名八年级学生、31 所学校（EEF 汇总口径），干预组写作进步约为对照组的两倍（项目报告口径）——英语语法教学研究中罕见的严格因果证据
    scope: 方向性结论（嵌入优于孤立）可迁移；效应量不可搬用——被试是母语八年级（约 13 岁）学生，不是小学生、更不是 EFL 学习者
    exceptions:
    - note: 效应不均匀：写作能力强的学生受益更多，弱的学生受益较少——嵌入式语法不是自动扶贫的
      word_ids: []
    - note: 教师元语言知识是中介变量：教师自己讲不清形式与效果的关系时，干预效应打折
      word_ids: []
  mechanism:
  - beat: 嵌在决定里
    text_kid: 一边写故事一边学句子：每个语法点都正好是现在要做的决定。
    text_adult: 三个写作单元（叙事、议论、诗歌）各嵌该语类真正用到的语法点（如叙事单元教人称如何制造叙述声音、长短句如何制造节奏）；对照组同教材同成品、无嵌入课案。
    visual: 齿轮图：语法齿轮嵌进写作齿轮，咬合转动
    anchors: []
