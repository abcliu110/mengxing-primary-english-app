- id: E-07
  zone: 表达写作
  group: E
  subgroup: B 得体与礼貌
  audience: 孩子层
  headline: 请求、打扰、拒绝越「压人」，英语越要加缓冲：礼貌是替对方的「面子」留余地，客气程度随关系远近和事的大小滑动
  headline_kid: 要请别人帮越大的忙，说话就要越客气：先垫一句话、把命令改成商量，给人家留个台阶。
  claim:
    type: tendency
    statement: 请求类行为天然威胁听者的消极面子（不被打扰的自由）；说话人按社交距离 D、权力差 P、事情大小 R 估算威胁权重，权重越大越用间接、商量、致歉开场等补偿策略——英语情态问句成为默认请求式，是这套权衡的规约化结果。
    evidence:
    - 'Penelope Brown & Stephen C. Levinson (1987)《Politeness: Some Universals in Language Usage》（Cambridge University Press；初版 1978）——礼貌理论奠基作，面子概念承 Goffman (1967)（二手论述级）'
    - D+P+R 权重公式给了「客气程度随场合滑动」一个可教的判断模型，支撑请求、道歉、拒绝类表达的分级教学
    scope: 请求、打扰、拒绝类表达的客气分级
    exceptions:
    - note: 亲密关系中过度客气反而疏远（何自然 1997 所举 could/would 对好朋友见外的例子）
      word_ids: []
    - note: 三变量的估算方式因文化而异：中国文化中年龄、辈分权重更高；公式是启发模型，不是计算器
      word_ids: []
  mechanism:
  - beat: 面子与威胁
    text_kid: 请人帮忙，就是去打扰人家；忙越大，打扰越大。
    text_adult: 面子理论：请求威胁听者的消极面子；说话人先估算威胁，再决定补偿多少——垫话、商量口吻、致歉开场都是补偿策略。
    visual: 天平图：一端「事情大小」，一端叠加缓冲垫
    anchors: []
  - beat: 滑动标尺
    text_kid: 请同桌递个橡皮，和请陌生人帮大忙，客气程度不一样。
    text_adult: D（距离）+P（权力差）+R（事情大小）三变量滑动，决定用直接式还是情态问句式；Could you...? / Would you mind...? 是规约化的高缓冲请求式。
    visual: 滑杆图：三根滑杆推高 → 请求式逐级变客气
    anchors:
    - ADD_0192
  examples:
  - level: 1
    word_ids:
    - G3_KA10
    - G1_P02
    sentence: Could you ...?
    scene_note: 默认请求式：情态问句作缓冲（清单登记式）
    supports: claim
  - level: 2
    word_ids:
    - G3_KA11
