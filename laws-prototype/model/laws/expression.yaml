    - 本 App 审查实证：29 条表达错误中 26 条源于脱离语境的机械收尾，正是语用层失误的库内实证
    scope: 表达教学的优先级论证（得体值得专门学）
    exceptions:
    - note: 归因差异是倾向不是铁律：正式场合的语法错误同样可能被严肃看待
      word_ids: []
  mechanism:
  - beat: 两种归因
    text_kid: 词用错了，大家知道你在学；场合说错了，别人会以为你没礼貌。
    text_adult: 同一错误、两种归因：语法错误归因于能力（可谅解），语用失误归因于态度与人品（不真诚、没教养）——伤害量级完全不同。
    visual: 双路标图：语法错 → 「在学」标签；场合错 → 「没礼貌」标签
    anchors: []
  - beat: 没有报错信号
    text_kid: 场合说错了，还不会有人告诉你错在哪。
    text_adult: 语用失误不像语法错误那样有明显的报错信号，学习者长期不自知；这是得体必须被显性教（E-12）的直接原因。
    visual: 静默警报图：语法错亮红灯，场合错无灯但对方脸色已变
