    sentence: The wind blew. The rain came down. Night fell on the little town.
    scene_note: 叙事单元的嵌入标本：正写故事时学短句——短句排队制造紧张，每个语法点都连着一个当下的写作决定（教师层标本）（自建例句）
    supports: claim
