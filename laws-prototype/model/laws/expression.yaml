- id: NE-22
  zone: 表达写作
  group: NE
  subgroup: Clay：早期读写观察
  audience: 教师/设计层
  headline: 印刷概念（Concepts About Print）：开始读之前，孩子先要搞懂「书是怎么运作的」
  headline_kid: 读书之前先要懂书的规矩：从哪页开始、从左往右读、一个词是一个词、字母和画儿不是一回事。这些「规矩」不懂，认字认得再多也读不成句。
  claim:
    type: tendency
    statement: 印刷概念是一组可观察、可测量的先行组织框架：书有正反面与页序；阅读方向（从左到右、从上到下、回行扫读）；文字（而非图画）承载故事内容；词与词之间有界、词由字母按序构成；首尾字母与标点的作用等。孩子必须先把口头语言与页面符号的对应关系建起来，解码与理解才有地方安放；教学路径是先逐个观察记录、再据此教学。
    evidence:
    - Marie Clay《Concepts About Print》（Heinemann, 2000，Observation Survey 配套分册）；其理论表述 “Concepts about print in English and other languages”, The Reading Teacher 42(4), 1989, pp. 268–272；体系化于《Literacy Lessons
      Designed for Individuals》(2005；第 2 版）的 literacy processing 理论（二手论述级）
    - CAP 观察任务是英语国家使用最广的早期读写评估工具之一，其预测效度（入学初 CAP 得分预测后续阅读成就）在多项研究中得到支持
    scope: 早期读写评估与教学（按英语字母文字、左起横排提炼；施测材料与常模不能直接套用新西兰版本）
    exceptions:
    - note: CAP 测的是「懂不懂书的规矩」，不是阅读能力本身，高分不保证会读
      word_ids: []
  mechanism:
  - beat: 书的规矩
    text_kid: 读书之前先要懂：从哪页开始、往哪边读、一个词是一个词。
    text_adult: 印刷概念清单逐项可观察：方向、页序、图文分工、词界、字母序、标点——每一项都是孩子在页面上实际做出来的行为，不是背出来的定义。
    visual: 书页图：方向箭头、词界空格、图文分区逐项点亮
    anchors: []
  - beat: 先观察，再教学
    text_kid: 老师先看孩子以为书是怎么读的，再决定教什么。
    text_adult: Clay 的方法论：不先用成人预设的缺陷清单套孩子，而是用标准化观察任务记录孩子实际在做什么——评估观独立于任何具体教学法。
    visual: 观察表图：教师逐项记录孩子翻书指读的行为
    anchors: []
  examples: []
  error_cases: []
