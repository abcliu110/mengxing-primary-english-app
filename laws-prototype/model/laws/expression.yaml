  audience: 教师/设计层
  headline: Derewianka：给小学教师的语法书按「语言的四种活儿」组织，不按词类清单组织
  headline_kid: 语法不按「名词、动词、形容词」排队，而是按语言要干的活儿排队：说清楚发生了什么、把意思连起来、跟人打交道、把文章织成一片。
  claim:
    type: tendency
    statement: 整套语法系统可按功能组织为四大块：表达经验（世界里谁在做什么）、连接思想（句与句的逻辑纽带）、与人互动（提问、命令、态度与评价）、织造成文（衔接与信息流）；教学含义是备课先问「这篇文本要干哪种活儿」，再选要教的语法点——学生学到的语法知识天然带着用途标签。此立场定位为教师知识组织的参照（与 NE-16 的 Myhill『语法是可供选择的资源阵列』互证）。
    evidence:
    - Beverly Derewianka《A New Grammar Companion for Teachers》（第 3 版，PETAA，2022）——全书按 expressing ideas / connecting ideas / interacting with others / creating cohesive texts 组织（出版社页级）
    - 该书是澳大利亚教师专业组织 PETAA 的常销教师参考书，与澳大利亚全国英语课程对接、再版至第 3 版；其更早的《Exploring How Texts Work》(1990；第 2 版 2020）把语类教学带进小学课堂（2–6 年级案例）
    scope: 教师知识组织的参照（可借的是组织思路与教师参考书的存在形态；术语层面只能选择性吸收）
    exceptions:
    - note: 功能语法（Halliday 系统功能语法）自有术语（参与者、过程、环境成分等），与国内语法教学通用的传统术语（主谓宾、时态语态）并不重合；整套搬入会造成术语双轨混乱
      word_ids: []
  mechanism:
  - beat: 四种活儿
    text_kid: 语法按语言要干的活儿排队，不按词类排队。
