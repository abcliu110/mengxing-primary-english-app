  headline: 模仿段的发动机：故事地图 + 全身动作——把文本变成可以指着演的图，记忆才托得住语言
  headline_kid: 把故事画成一张地图，每个转弯配一个动作。手指着地图、身体做着动作，嘴巴就把整篇故事说出来了——眼睛和身体一起帮嘴巴记。
  claim:
    type: tendency
    statement: 模仿段的技术是多通道编码：范文被压缩成一幅手绘故事地图（图标与箭头标出文本的阶段与关键连接词），全班边指地图边用统一动作复述——听觉、视觉、动觉三路同时编码同一语言材料。地图把范文的结构外化了：指着地图复述练的不只是词句，还有「故事走到哪一步了」的阶段感；到创新段，改地图就是改结构。
    evidence:
    - text map 与动作在模仿段中的用法、创新段衔接，见 St Philip's 学校的 Talk for Writing 定版说明（实践框架级）
    - 该技术与双重编码（言语 + 图像/动作双通道，见 LS 簇 Paivio 条）与具身认知研究相容；其实践证据形态同 NE-27（广泛采用 + 个案），本条不单独主张效应量
    scope: EFL 低年级最合用的场景（词汇少、需要身体带着嘴走）；地图必须由孩子参与绘制才有图式价值
    exceptions:
    - note: 教师要自己先会「演」范文——教师示范意愿与英语口头流利度是前置条件；班额大时全班动作复述的纠错覆盖有限，可用同桌互演 + 抽查替代全班齐演
