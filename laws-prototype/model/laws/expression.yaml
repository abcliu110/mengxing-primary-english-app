- id: W-14
  zone: 表达写作
  group: W
  subgroup: C 证据清单与诚实边界
  audience: 孩子层
  headline: 衔接词是给读者的路标，不是作文的装饰品：路标必须对准真实的逻辑关系，贴错地方比没有更糟
  headline_kid: first、then、because 这些词是路上的牌子，告诉读者往哪走；牌子指错方向，读者就会迷路。
  claim:
    type: tendency
    statement: 连贯来自内容逻辑本身，衔接词只是把逻辑显性化：时序用 then、因果用 because、转折用 but/however——词与逻辑对位，读者跟得顺；为凑「高级感」硬塞 although、moreover 而逻辑不对位，等于指错路标，比没有更糟。
    evidence:
    - Halliday, M. A. K. & Hasan, Ruqaiya (1976)《Cohesion in English》（Longman）——衔接理论原典，第 2–6 章即五类衔接手段（指称/替代/省略/连接/词汇衔接）；出处已于 2026-11-01 经出版社目录与书目记录补核（书目核对级）
    - 衔接分析是语篇语言学的标准工具；写作评分量表普遍把「衔接的准确性」与「衔接词数量」分开计分，后者堆砌不加分
    - 本 App 旧库把 Although 混进「衔接词链」的裁定（C-6）即违反本条
    scope: 衔接教学口径（儿童写作中路标宁少勿错）
    exceptions:
    - note: 隐性连贯（靠内容顺序自然衔接）在叙事文里完全成立，不是每句都要路标
      word_ids: []
  mechanism:
  - beat: 路标对位
    text_kid: 这些词是路上的牌子：往哪走，牌子就指哪。
    text_adult: 五类衔接手段中儿童最先用的是连接类：时序（first/then）、因果（because）、转折（but）、让步（although）各有逻辑岗位，词必须与岗位对位。
    visual: 路口图：四块路标分别指向时序/因果/转折/让步四条路
    anchors:
    - G5_244
    - G4_0597
    - V6_核心_60
    - ADD_0005
    - ADD_0527
    - ADD_0579
  - beat: 贴错更糟
    text_kid: 牌子指错方向，读者就会迷路——还不如没有牌子。
    text_adult: 为凑「高级感」硬塞 although、moreover 而逻辑不对位，是负分操作；评分量表对衔接准确性与数量分开计分（however、moreover 已入词库 ADD_0527/ADD_0579）。
    visual: 迷路图：错误路标把读者引进岔路
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G5_244
    - G4_0597
    sentence: first / then
    scene_note: 时序路标：先做什么、再做什么（清单登记词）
    supports: claim
  - level: 2
    word_ids:
    - V6_核心_60
    - V6_核心_58
    - ADD_0005
    sentence: because / but / although
    scene_note: 因果、转折、让步路标各就各位：although 表让步，不进时序链（清单登记词）
    supports: claim
  error_cases: []
  relatives:
  - id: E-10
    rel: 同族
  - id: W-01
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 时序路标牌 first / then, kind: 标签组, states: [还没立, 立在先做再做之间]}
        - {name: 道理路标牌 because / but / although, kind: 标签组, states: [各在一旁, 各自对上因果、转折、让步]}
        - {name: 读者小人, kind: 人物, states: [顺着路往前走, 被错牌带进岔路]}
      invariants: "连贯先在事情本身的道理里，路标只是把道理指出来；牌子对上道理读者就顺，指错方向比没有牌子更糟，有的故事靠顺序自己就顺，不用每句都挂牌"
    beats:
      - "设置：一个路口立着空牌杆，读者小人等着往前走，first、then、because、but、although 五块牌子放在一旁（旁白：「这些词是路上的牌子，告诉读者往哪走。」）"
      - "变形：first 和 then 立进时序路上，because 立进因果路上，but 和 although 各自对上转折与让步，读者小人顺顺当当走过去（旁白：「往哪走，牌子就指哪，读者就不会迷路。」）"
      - "预测停顿：一块新牌子还没挂上先停住（旁白：「先猜一猜：这块牌子该指哪条路？」）"
      - "边界对照：一块牌子被故意指错方向，读者小人走进岔路绕不出来，牌子摘掉反而能顺着故事走；另一段故事没挂牌，靠事情顺序自己也走得顺（旁白：「牌子指错还不如没有；有的路不用牌子也走得通。」）"
    beats_ref: claim
    lines_owner: W-14
  quiz:
  - stem: 「我摔倒了，____ 就哭了起来。」该填哪个路标？
    options:
