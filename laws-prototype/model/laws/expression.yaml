  headline: 语法错了，人家笑你「说得不好」；场合错了，人家觉得你「人不好」——语用失误比语法错误更伤人，而且更难被察觉
  headline_kid: 词用错了没关系，大家知道你在学；场合说错了，别人会以为你没礼貌，还不会告诉你错在哪。
  claim:
    type: tendency
