        - {name: 接法插座「ask + 人 + to do」, kind: 场景道具, states: [空着待插, 插对后亮绿]}
        - {name: 正例卡「I asked him to come.」, kind: 台词卡, states: [零件散着, 按接法拼成完整句]}
        - {name: 错位句卡「I proposed him to come.」, kind: 台词卡, states: [插头伸向 ask 的插座, 插不进被弹回]}
