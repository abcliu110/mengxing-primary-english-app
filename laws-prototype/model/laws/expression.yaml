- id: W-01
  zone: 表达写作
  group: W
  subgroup: A 读者与过程
  audience: 孩子层
  headline: 写作和说话最大的不同：读者不在你面前，看不见你脑子里的画——每个信息都要用文字亲手交到读者眼前
  headline_kid: 写作文的时候，读者看不见你心里想的画面；你不写出来，他就不知道。
  claim:
    type: tendency
    statement: 口头交际有表情、手势、现场实物兜底，写作全部撤掉、只剩文字：指代要交代清、顺序要排好、因果要说出声；初学者的典型毛病是「以写者为中心」（writer-based prose）——自己懂、读者懵。纲领「请读者看一幅画」即此机制的儿童化表述。
    evidence:
    - 'Linda Flower (1979) “Writer-Based Prose: A Cognitive Basis for Problems in Writing”, College English 41(1)——writer-based / reader-based 之分；Flower & Hayes (1981) 将读者意识纳入写作过程模型（见 W-02）（二手论述级）'
    - 读者意识是写作研究中区分新手与熟手的最稳定变量之一，也是 Graham 实践指南「扩展学生的读者概念」一条的理论来源
    scope: 写作教学的第一性区分（纲领「请读者到你脑子里看一幅画」的学理面）
    exceptions:
    - note: 日记、私人记录类写作不适用本条；低龄孩子的读者先具体到老师与家长，再抽象到「不在场的读者」
      word_ids: []
  mechanism:
  - beat: 兜底撤掉
    text_kid: 说话时有手势、有现场的东西帮忙；写下来，就只剩文字了。
    text_adult: 口头交际的兜底（表情、手势、实物指认）在写作中全部撤除：谁、哪一个、先后、为什么，都必须用文字亲手交到读者眼前。
    visual: 对照图：左·当面说话有手势实物，右·纸面只剩文字
    anchors: []
  - beat: 以写者为中心
    text_kid: 自己心里清楚，不等于读者清楚；你不写出来，他就不知道。
    text_adult: writer-based prose：新手按自己的思路顺序倒出信息，不为读者重组——读者懵的根源不是词不够，是交接没做。
    visual: 两幅画图：写者脑中的画完整，读者收到的画缺角
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G2_0489
    sentence: I went there with him, and we played.
    scene_note: 以写者为中心的标本：there 是哪儿、him 是谁，读者全不知道——自己懂，读者懵（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_082
    - G3_130
    - G3_124
    sentence: Yesterday I went to the zoo with my friend. We saw the pandas there.
    scene_note: 交代清楚的写法：何时、去哪儿、和谁、看见什么，一样样亲手交到读者眼前（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: W-02
    rel: 同族
  - id: W-14
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 写者脑中的画, kind: 场景道具, states: [完整清楚, 只剩文字传出去]}
        - {name: "句子卡「I went there with him, and we played.」", kind: 台词卡, states: [写者自己懂, 读者不知道 there 是哪儿、him 是谁]}
        - {name: 交代清楚的句子卡, kind: 台词卡, states: [缺何时、去哪、和谁, 一样样补齐到读者眼前]}
      invariants: "说话时的手势和现场东西全撤掉，只剩文字；读者看不看得懂，全看写的人有没有把何时、去哪、和谁亲手交代出来"
    beats:
      - "设置：左边一个孩子当面说话，手比划着、手指着现场的东西；右边同一句话落到纸上，手势和实物都消失了，只剩句子卡（旁白：「当面说话有人帮，一写到纸上，就只剩字啦。」）"
      - "变形：句子卡「I went there with him, and we played.」飘到读者眼前，there 和 him 上方亮起大问号，读者脑中的画缺了两角（旁白：「他自己全懂，可我连去哪儿、跟谁都不知道。」）"
      - "变形：句子卡换成「Yesterday I went to the zoo with my friend. We saw the pandas there.」，何时、去哪、和谁、看见什么一样样点亮，读者脑中的画补完整（旁白：「一样样说清楚，我眼前就有画面啦。」）"
      - "预测停顿：新句子卡只写了一半先停住（旁白：「先猜一猜：还缺哪一样，读者就又要猜谜了？」）"
      - "边界对照：画面一角的日记本合上，贴上「写给自己看」的标签，不用按这套交代；另一边低龄孩子的读者头像先是老师和家长，再慢慢变成不在场的人（旁白：「日记是写给自己的，不算；写给别人看，就要说清楚。」）"
    beats_ref: claim
    lines_owner: W-01
  quiz:
  - stem: 写作文和当面说话最大的不同是？
    options:
    - 要用笔写
    - 读者不在面前，看不见你脑子里的画
    - 要写得更长
    answer: 读者不在面前，看不见你脑子里的画
    hint_ref: mechanism『兜底撤掉』
  probes: []
  prereq: []
  order: 16
  pain_points:
  - 写不长
  adult:
    sources:
    - Linda Flower (1979), College English 41(1)
    - Flower & Hayes (1981)，出处见 W-02
    - 来源页：https://writingcommons.org/section/writing-process/problem-solving-strategies/
    boundary: 低龄孩子的读者起初就是老师与家长，先有「写给具体某个人看」的经验，再抽象到「不在场的读者」；日记、私人记录类写作不适用本条。
    disputes: 无
