- id: NE-16
  zone: 表达写作
  group: NE
  subgroup: Myhill：语法即选择
  audience: 教师/设计层
  headline: 语法是「选择的仓库」：学语法是为了写作时多一条可选的路，不是为了少犯一个错
  headline_kid: 学语法像学调色——多认识一种颜色，画画时就多一种选法；不是为了「涂不错」。
  claim:
    type: tendency
    statement: 语法是可供选择的资源系统：同一种意思总有几种说法（长句/短句、主动/被动、第一人称/第三人称），每种选择产生不同的意义效果与读者感受；语法教学的目标不是贴标签、纠错误，而是让学生看见「有哪些选法、各有什么效果」，并在元语言谈话（metatalk）中把选择说出口。
    evidence:
    - 'Debra Myhill 团队：Myhill, Watson & Newman (2020), Bellaterra Journal of Teaching & Learning Language & Literature 13(2)——汇编「Grammar as Choice」的国际表述；理论综述见 Myhill & Watson (2014), Child Language Teaching
      and Therapy 30(1): 41–62（二手论述级）'
    - Myhill 团队十余年系列研究的一致发现：脱离写作的语法操练与写作质量无关，而「在写作中谈选择」能发展学生的元语言理解
    scope: 母语写作课的立场向 EFL 的迁移提示（选择教学须待词汇句型存量积累到一定程度才有东西可选；低年级先在口头与仿写中积累型式）
    exceptions:
    - note: 「选择」不等于「没有对错」：EFL 阶段大量形式仍在建立中，准确性目标不能被修辞话语冲掉
