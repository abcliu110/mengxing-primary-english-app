- id: W-06
  zone: 表达写作
  group: W
  subgroup: B 支架、模仿与产出
  audience: 孩子层
  headline: 内容要创造，语言要模仿：新意放在想什么上，句子的说法先借现成的——反过来就会写出「想法平庸、句子奇葩」
  headline_kid: 写作文的时候，主意要自己想，句子可以先学别人的说法；两样都自己发明，太难了。
  claim:
    type: tendency
    statement: 初学者的认知资源有限，内容生成与语言编码同时创新必然互相抢资源；把语言一头「托管」给已内化的范文句式，资源全留给内容（写什么、怎么展开），是有效外语教学的分工原则，与「整块存取」（E-04）在认知机制上同构。
    evidence:
    - 王初明 (2014)《内容要创造 语言要模仿——有效外语教学和学习的基本思路》（外研社学者介绍页所列代表性论文）（二手论述级）
    - 与二语写作研究中「范文支架 + 自由内容」的干预效果一致；也是对旧库「句型公式万能论」的釜底修正——句型是借用的资源，不是套作保分的模具
    scope: 写作任务的认知资源分工原则
    exceptions:
    - note: 模仿是过渡态不是终点：长期只借不化会形成腔调依赖，高年级须逐步要求改写、重组与个人表达；考试中大段套写范文另有评分风险，不在本条讨论内
      word_ids: []
  mechanism:
  - beat: 资源分工
    text_kid: 主意要自己想，句子可以先学别人的说法。
    text_adult: 内容与语言两头同时创新会互相抢占有限的认知资源；分工——内容创新、语言托管——是初学者的最优配置。
    visual: 双手图：一手托内容（自创），一手托句式（借用）
    anchors: []
  - beat: 反过来的样子
    text_kid: 两样都自己发明，太难了；只借主意不借说法，又会想法平庸。
    text_adult: 反向分工（内容抄现成、句子全自创）的典型产物是「想法平庸、句子奇葩」；句型在本条中的定位是资源而非模具。
    visual: 对照卡：正分工 vs 反分工两篇作文的评语
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G2_K02
    - V6_节日_5
    - G3_0401
    sentence: My favourite day is Sunday, because I can play football with my friends.
    scene_note: 句子的说法先借现成框架（My favourite ... is ... because ...），内容是自己的（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G1_0564
    - G4_186
    sentence: In the morning, I get up at seven. Then I have breakfast with Mum and Dad.
    scene_note: 说法借现成（日常句型整块取用），写的是自己的早上（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: W-05
    rel: 同族
  - id: E-04
    rel: 同族
  - id: W-10
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 主意篮子, kind: 场景道具, states: [空着, 装满自己想的内容]}
        - {name: 借来的句框卡「My favourite ... is ... because ...」, kind: 词卡, states: [从范文处借来, 托住自己的句子]}
        - {name: 自己的句子卡, kind: 台词卡, states: [只有想法, 借框写成完整的句子]}
      invariants: "力气只有一份：内容自己想、说法先借现成的，两头不打架；两头都自己发明太难，借说法只是过渡，高年级要慢慢改成自己的说法"
    beats:
      - "设置：一只手托着主意篮子，一只手托着借来的句框卡，两边都稳稳的（旁白：「主意自己想，说法可以先借别人的。」）"
      - "变形：句框「My favourite day is Sunday, because I can play football with my friends.」托住自己的内容落成整句；另一张「In the morning, I get up at seven. Then I have breakfast with Mum and Dad.」同样借现成说法写自己的早上（旁白：「框是借的，里面装的全是我的事。」）"
      - "预测停顿：新句框只露出前半截先停住（旁白：「先猜一猜：借这个框，能装下你的哪件事？」）"
      - "边界对照：左边孩子两头都自己发明，累得写不下去；右边孩子一直只借不改，到了高年级句框被要求拆开重组（旁白：「借是暂时的，长大了要慢慢写出自己的说法。」）"
    beats_ref: claim
    lines_owner: W-06
  quiz:
