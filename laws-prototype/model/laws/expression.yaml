- id: NE-23
  zone: 表达写作
  group: NE
  subgroup: Clay：早期读写观察
  audience: 教师/设计层
  headline: Reading Recovery：最早、最贵的一对一干预——短期效应有据，长期效果正被新证据改写
  headline_kid: 班上读得最吃力的几个孩子，每天单独跟老师上 30 分钟小课，连上几个月。起步确实快，但这条路到底值不值，专家们还在吵。
  claim:
    type: tendency
    statement: Reading Recovery 是为一年级阅读最困难儿童设计的早期干预（专门培训教师、每天一对一 30 分钟、持续 12–20 周），目标是帮孩子建成「自我延伸系统」从而脱离干预。一年级即时效应有强证据（i3 全国推广随机试验）；长期效果未定论——新追踪研究出现负效应（见分歧全文）。本条只立『短期有据、长期未定论』，App 不得引用 RR 作为「一对一辅导有效」的无条件证据。
    evidence:
    - 'Marie Clay《Literacy Lessons Designed for Individuals》(2005；第 2 版）与《Reading Recovery: A Guidebook for Teachers in Training》（二手论述级）'
    - 短期效应：美国 i3 全国推广随机试验（1,222 所学校、6,888 名学生）确认一年级即时效应显著为正（Sirinides, Gray & May 2018)；WWC 曾给予正面评级
    - '长期新证据：May, Blakeney, Shrestha, Mazal & Kennedy (2024), Journal of Research on Educational Effectiveness 17(3): 433–458（断点回归追踪至三、四年级）'
    scope: 可迁移的只是设计原则（困难出现的第一年就干预、干预基于逐日观察记录、干预目标是让孩子脱离干预）；RR 服务的是母语儿童中阅读起步困难者，与中国孩子「外语阅读困难」的成因结构（先缺口语与词汇量）完全不同
    exceptions:
    - note: RR 的成本结构（一对一 + 教师长训）在中国公立小学几乎不可能复制；中国的对应物更可能是小组化、短周期的课堂内补救，而不是 RR 本身
      word_ids: []
  mechanism:
  - beat: 早、密、个别化
    text_kid: 读得最吃力的孩子，每天单独上 30 分钟小课，连上几个月。
    text_adult: 课的结构固定：重读熟悉书 → 跑读记录 → 字母/词的工作 → 写一句自己编的话并剪开重组 → 读一本精心选梯度的新书；设计时机压在一年级，困难刚出现就介入。
