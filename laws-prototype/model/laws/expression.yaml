    sources:
    - Pauline Gibbons (2002)《Scaffolding Language, Scaffolding Learning》, Heinemann（ISBN 0-325-00366-1）；第 2 版 2015（书目经 2026-11-02 核查定版：初版 Heinemann, Portsmouth NH, 2002, ix + 165 页，WorldCat 与 Internet Archive 馆藏记录互证；第 2 版 Heinemann 2015, ISBN 9780325056647，副题改为 Teaching English Language Learners in the Mainstream Classroom——初版副题为 Teaching Second Language Learners…，本条著录与初版对应无误）
    - ERIC 书目记录：https://eric.ed.gov/?id=ED463654
    - WorldCat 书目：https://search.worldcat.org/title/Scaffolding-language-scaffolding-learning-:-teaching-second-language-learners-in-the-mainstream-classroom/oclc/48517687
    boundary: Gibbons 笔下的二语孩子身处英语沉浸环境（全天各科都用英语），支架撤除后仍有海量输入托底；中国孩子一周只有几节英语课，支架设计必须更珍惜——同一句框要在多课复现，且「从口头到书面」的连续体在小学阶段多数只能走到前半段，不宜按原书的学科写作终点要求低年级。另一个差异：原书假设教师是母语者、中国教师自身是英语学习者，教师示范文本的质量控制（录音、范文来源）要额外设计。
    disputes: 支架概念本身在学界有「被滥用成任何帮助」的批评（概念稀释）；Gibbons 的版本以「设计性 + 指向独立」设防——支架的检验标准是最终能撤掉。本条入模时须连同这一检验标准使用，不得把「给了句框」一概登记为支架。
    evidence_grade: 二手论述级
