- id: NE-19
  zone: 表达写作
  group: NE
  subgroup: 悉尼学派
  audience: 教师/设计层
  headline: 教学循环：先全班拆一篇 → 再全班合写一篇 → 最后才轮到你自己写（Teaching-Learning Cycle）
  headline_kid: 学写一种文章分三步：先跟老师一起把范文拆开看；再全班一起写一篇新的；最后自己独立写。不会游泳的人不是被直接推下水的。
  claim:
    type: tendency
    statement: 教学循环共四环：建立语境/语场（把要写的话题聊透、做足共同经验）→ 解构（带全班分析范文的阶段结构与关键语言特征，用共享元语言指认）→ 共同建构（全班在教师执笔下口头共商写出一篇新文本）→ 独立建构（学生自己写，教师退后）。支撑量沿循环递减：能力先在集体层面出现，再内化为个体能力。
    evidence:
    - Teaching-Learning Cycle 由 Rothery 等人在悉尼学派项目中设计、Martin 与 Rose 定型；阶段与功能见 Accurso, Gebhard & Selden 的教师教育章节对 Martin 团队循环的转述（二手论述级）
    - 该循环是悉尼学派四十年课堂实践的标准操作系统，被 Gibbons 等二语教育者直接引入 ESL 课堂（见 NE-29），其设计理据与认知学徒制、支架理论同源
    scope: 单元顺序设计（中国小学英语课时少、班额大：『全班共同建构』须用小组共写、句框接龙等方式改造参与结构；『建立语场』一环在中国要额外承担词汇与理解的前置教学）
    exceptions:
    - note: 母语学生解构范文时语言本身不是障碍，EFL 学生连范文都可能读不懂——循环的起点条件不同
      word_ids: []
  mechanism:
  - beat: 四环递减
    text_kid: 先一起拆，再一起写，最后自己写——扶着的手一步步松开。
    text_adult: 四环的支撑量递减是设计出来的：语场（经验）→解构（地图）→共构（实作）→独立（验收），与支架撤除原则（W-10）是同一逻辑的课程版。
    visual: 扶手图：四级台阶扶手逐级变矮
    anchors: []
  - beat: 共构是枢纽
    text_kid: 全班一起写的那一篇最要紧：每个决定都被当场说出来。
    text_adult: 共同建构把写作决定公开化：写什么、为什么这样写，在教师执笔下被全班讨论——这是个体内化前能力在集体层面的预演。
    visual: 讲台图：大纸居中，全班口头出招、教师执笔
    anchors: []
  examples: []
  error_cases: []
  relatives:
  - id: NE-18
    rel: 同族
  - id: NE-29
    rel: 同族
  - id: W-10
    rel: 同族
  scene_spec: "不设（终态登记：教师/设计层条目：内容为教学循环四环的单元顺序设计，属教学方法论主张）"
  quiz:
  - stem: 学写一种新文章，顺序应该是？
    options:
    - 直接自己写，写完再讲
    - 先拆范文 → 全班合写一篇 → 最后自己独立写
    - 先考试，不会再教
    answer: 先拆范文 → 全班合写一篇 → 最后自己独立写
    hint_ref: mechanism『四环递减』
  probes: []
  prereq:
  - NE-18
  order: 49
  pain_points:
  - 写不长
  adult:
    sources:
    - Accurso, Gebhard & Selden 教师教育章节（Martin 团队循环转述）：https://people.umass.edu/~mgebhard/Gebhard%20Publication%20PDFs/2016%20-%20Accurso%20Gebhard%20Selden%20L2%20writing.pdf
    - 四阶段口径：https://www.researchgate.net/figure/Reading-to-Learn-cycle_fig4_255652356
    boundary: 循环跑完一个语类在母语课堂通常要数周；中国小学英语课时少（每周 2–4 节）、班额大（40 人以上），「全班共同建构」时真正开口参与的比例会远低于澳洲小班——需要用小组共写、句框接龙等方式改造参与结构。另一个差异：母语学生解构范文时语言本身不是障碍，EFL 学生连范文都可能读不懂，所以「建立语场」一环在中国要额外承担词汇与理解的前置教学。
    disputes: 与 NE-18 同源的「显性教学 vs 过程写作」之争：过程写作传统批评语类循环过于教师主导；悉尼学派反批评过程写作对弱势学生是「看不见的 pedagogics」（Bernstein 语）——把要求藏起来，看似自由，实则只奖励早就会的孩子。此分歧是两种公平观的冲突，入模时两边都要呈现。
    evidence_grade: 二手论述级
