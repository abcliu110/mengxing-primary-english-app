  audience: 双层
  headline: Talk for Writing 三段：模仿 → 创新 → 发明——写作教学的顺序是「先有文本存量，再有个人创作」
  headline_kid: 学写故事像学唱歌：先把一首好歌唱熟（模仿），再换上自己的歌词（创新），最后自己作曲（发明）。没听过几首歌的人，作不出曲子。
  claim:
    type: tendency
    statement: 儿童不可能凭空写出一个他从未在口头上拥有过的文本类型：单元教学分三段推进——模仿（全班以故事地图与动作把范文背诵内化，并以读者与作者双身份读）→ 创新（在范文骨架上做受控替换，改地图、口头排练、分段共写）→ 发明（独立写同一类型的新文本）；单元前后以 cold task 与 hot task 对照评估。理论赌注：口头语言是书面语言的排练场——能说出来的，才能写出来。
    evidence:
    - Pie Corbett 的 Talk for Writing 框架：三阶段与各阶段做法见学校定版说明与框架体系转述（实践框架级：采用广度证据，无 RCT）
    - 其机制支点（口头排练先行、范文内化、受控创新）分别与 Mercer 的谈话研究、悉尼学派的共同建构、记忆与图式研究相容合，不是孤立发明
    scope: 本簇与中国小学英语适配度最高的一条（三段顺序直接可用）；中国课时下三段要压缩，范文长度必须大幅缩短（低年级可至百词内）；低年级（1–2 年级）应停留在口头三段（说熟 → 换说 → 编说），不必落到书面发明
    exceptions:
    - note: 模仿段在 EFL 课堂极易滑成机械背诵课文：Corbett 的模仿从来是带动作、带地图、带理解讨论的「内化」，不是默写
