    text_kid: 小组说话有三种样子：抢着吵、跟着点头、一起想。
    text_adult: 三型的判别点在『想法如何被对待』：争执型比胜负、累积型只堆叠、探索型要理由并检验——型式可观察、可命名，孩子能自评本组刚才属于哪型。
