    sources:
    - Marie Clay《Concepts About Print》(Heinemann, 2000, ISBN 9780325002378)：https://www.abebooks.com/servlet/BookDetailsPL?bi=31033599603
    - 'Clay (1989), The Reading Teacher 42(4): 268–272'
    boundary: 印刷概念是按英语（字母文字、左起横排）提炼的；汉语儿童对汉字的方向与分词直觉不同，中国孩子学英语时恰好要新建一整套「英语印刷品规则」，这正是本条对 EFL 的价值所在——但也意味着施测材料与常模不能直接套用新西兰版本。另注意：CAP 测的是「懂不懂书的规矩」，不是阅读能力本身，高分不保证会读（见 NE-23 的分歧语境）。
    disputes: 无针对 CAP 本身的主流分歧；分歧集中在 Clay 体系的另一部分——Reading Recovery 的教学取向与长期效果（NE-23)，不得把对 RR 的批评转嫁到印刷概念这一观察框架上，也不得反过来用 CAP 的公认地位为 RR 背书。
