  audience: 双层
  headline: 只用三千个已知词，就能解释一切新词
  headline_kid: 好的儿童词典有个秘密：它解释每个难词时，只用你已经认识的那几千个简单词——这样你查哪个词都看得懂，不会查着查着又卡在另一个生词上。
  claim:
    type: tendency
    statement: 学习者词典给全部词条写释义时，遣词被限制在一张约 3000 个高频常用词的清单之内（受控释义词汇，现行各版口径均在 3000 上下）：释义用词必须比被释词更浅易，词典因此成为自足系统——掌握这 3000 词，就等于拿到解读整部词典、进而解读语言的钥匙。这是「核心词汇先行」在工具层面的最早完整实现。
    evidence:
    - A. S. Hornby 主编《Idiomatic and Syntactic English Dictionary》(Kaitakusha，东京，1942)，1948 年由牛津大学出版社重印为学习者词典，后发展为《Oxford Advanced Learner's Dictionary》；释义词汇规模见 OALD 第 4 版出版说明（“definitions using a carefully
      chosen defining vocabulary of 3,000 words”）（二手互证级）
    - 该传统被后世各大学习者词典沿袭（Longman、Macmillan 等均设自家释义词汇表），牛津另以 Oxford 3000 词表把「最该先学的词」显性化
    scope: 工具设计与核心词先行口径（3000 是约数且随版次浮动，引用须注明版次口径）
    exceptions:
    - note: 受控释义的代价是部分释义需绕行表达、精确度受限，高阶学习者仍需普通词典补充
      word_ids: []
  mechanism:
  - beat: 受控释义
    text_kid: 词典解释难词时，只用你已经认识的简单词。
    text_adult: 受控释义词汇：全部释义的遣词被锁在一张高频词清单内，查词不会在释义里再撞上生词——系统自足的关键设计。
    visual: 钥匙图：3000 个简单词是一把能开全词典的钥匙
    anchors: []
  - beat: 核心先行
    text_kid: 先把那几千个最有用的词学好，别的词都能靠它们弄懂。
