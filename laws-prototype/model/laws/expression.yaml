    boundary: 香港案例同时提示改造点：EFL 儿童用英语执行「给理由、质疑」需要语言支架与任务设计配合，否则规则会空转成中文讨论或沉默。中国大班额下 Talk Lessons 本身要占课时——其定位应是学期初的少量投资（先立规矩），而不是每课都上。对低年级（一、二年级）儿童，八条规则要减量并图示化。
