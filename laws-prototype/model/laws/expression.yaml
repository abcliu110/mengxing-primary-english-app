- id: E-13
  zone: 表达写作
  group: E
  subgroup: C 能力构成与教学
  audience: 孩子层
  headline: 对话是两个人轮流搭的：一问一答是绑在一起的「对子」，上一句长什么样，就预定了下一句的活
  headline_kid: 聊天像打乒乓球，一个人发球，另一个人要接；问题发出去，回答就要跟回来。
  claim:
    type: tendency
    statement: 对话由话轮按可预测的规则交接，话语常成相邻对出现（问候—问候、提问—回答、邀请—接受/婉拒）；第一部分一出现，就对第二部分形成「条件相关」——该答不答本身就成了信息。
    evidence:
    - 'Harvey Sacks, Emanuel A. Schegloff & Gail Jefferson (1974) “A Simplest Systematics for the Organization of Turn-Taking for Conversation”, Language 50(4): 696–735——会话分析（CA）奠基论文，该刊历史上被引最多的文章之一（二手论述级）'
    - 话轮与相邻对是 CA 五十年研究的核心构件；本 App 审查中 ORAL_SCENE「压扁对话」的订正（拆轮次、补答句）即按本条结构直觉执行
    scope: 教材对话的结构规范（对话数据逐轮复核的学理面）
    exceptions:
    - note: 相邻对是「预期」不是死法：拒答、岔开、反问都是带着含义的合法第二部分；须先掌握默认对型，才谈得上偏离的含义
