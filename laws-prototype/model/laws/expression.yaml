  quiz:
  - stem: 讨论的规矩怎样来，最能让大家真的照着做？
    options:
    - 老师定好贴在墙上
    - 全班一起谈出来、共同约定
    - 班长一个人定
    answer: 全班一起谈出来、共同约定
    hint_ref: mechanism『先约法，后讨论』
