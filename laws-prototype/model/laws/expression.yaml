  - id: NE-23
    rel: 同族
  scene_spec: "不设（终态登记：教师/设计层条目：内容为印刷概念的观察记录与测量框架，属教师评估口径，无儿童场景）"
  quiz:
  - stem: 开始读书之前，孩子先要搞懂什么？
    options:
    - 所有单词的意思
    - 书是怎么运作的（从哪读、往哪读、词和画的区别）
    - 作者的名字
    answer: 书是怎么运作的（从哪读、往哪读、词和画的区别）
    hint_ref: mechanism『书的规矩』
  probes: []
  prereq: []
