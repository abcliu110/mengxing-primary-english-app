- id: W-02
  zone: 表达写作
  group: W
  subgroup: A 读者与过程
  audience: 孩子层
  headline: 写好作文不是一口气从头写到尾：想（计划）、写（落笔）、改（回看）三件事是来回切换的，不是一条直线
  headline_kid: 写作文不是先想完再写、写完再改；是边想边写边改，转来转去。
  claim:
    type: tendency
    statement: 真实写作中计划、转化（把想法变成文字）、回顾三过程在「监控器」调度下任意互相嵌入：写着写着冒出新想法就回去改计划，改着改着重写整段；把写作教成「先列提纲→抄正→交卷」的流水线，恰恰砍掉了熟手最核心的回环。
    evidence:
    - 'Linda Flower & John R. Hayes (1981) “A Cognitive Process Theory of Writing”, College Composition and Communication 32(4): 365–387——写作认知过程模型的奠基论文（二手论述级）'
    - 该模型直接催生了「过程写作法」，并被 Graham & Perin (2007) 元分析列为有效要素之一（见 W-09）
    scope: 写作过程教学的模型依据
    exceptions:
    - note: 回环不等于没计划：高手的回环是带着目标切换，新手的回环常是无目标乱改；要教的是每个环节可用的小策略，而非只宣布「可以来回改」
      word_ids: []
  mechanism:
  - beat: 三过程回环
    text_kid: 写作文是边想边写边改，转来转去，不是一条直线。
    text_adult: 出声思维实验显示：计划、转化、回顾在监控器调度下任意互相嵌入——回环是熟手写作的常态结构，不是返工。
    visual: 三角回环图：计划⇄落笔⇄回看，箭头双向
    anchors: []
  - beat: 流水线之害
    text_kid: 先列提纲、再抄正、然后交卷——这样教，把最重要的本事砍掉了。
    text_adult: 把写作教成一次性流水线，学生练不到「写着改计划、改着重写段」的调度能力；教学要给每个环节配小策略。
    visual: 直线流水线图被打叉，回环图被圈出
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_015
    - G4_K07
    sentence: 'First, I write: I have a dog. It is cute.'
    scene_note: 落笔（转化）：先把想法变成文字，哪怕只有一句（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G3_0631
    - V6_节日_5
    sentence: 'Then I think again: not just ''cute'' — what does it do every day?'
    scene_note: 回看时冒出新想法（计划在写的中途被改）：不只写 cute，还要写它每天做什么（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_072
    - G1_015
    - G2_087
    - G1_0564
    - G1_0932
    sentence: My small dog runs to me every morning and waits at the door.
    scene_note: 改着重写出的句子：回环一圈，句子长出了细节（自建例句）
    supports: claim
