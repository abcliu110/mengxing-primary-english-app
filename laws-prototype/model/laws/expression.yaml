- id: W-07
  zone: 表达写作
  group: W
  subgroup: B 支架、模仿与产出
  audience: 孩子层
  headline: 写不出来恰恰是最有用的时刻：只有动笔输出，才知道自己缺哪一块——「注意到缺口」是进步的扳机
  headline_kid: 有很多词，听的时候都懂，一到自己写就卡住；卡住的地方，就是你要学的新东西。
  claim:
    type: tendency
    statement: 理解（听读）可以走语义捷径跳过语法细节，产出（说写）则被迫进行句法加工；学习者发现「想说的说不出/说不准」时，会注意到知识中的缺口（noticing the gap），继而在后续输入中定向捕捉、并通过试说试写检验假设——输出不只是练习，是习得的触发器。
    evidence:
    - 'Merrill Swain (1985) “Communicative Competence: Some Roles of Comprehensible Input and Comprehensible Output in Its Development”，载 Gass & Madden 编《Input in Second Language Acquisition》；三功能定型表述见 Swain
      (1995) 与 Swain & Lapkin (1995)（二手论述级）'
    - 输出三功能有大量课堂实证支持，并直接构成 POA「输出驱动」假设的理论前身（见 W-11）
    scope: 输出在习得中的功能定位（按主流中间立场表述：输入为必要条件，输出为加速与精确化机制）
    exceptions:
    - note: 输出触发注意的前提是学习者已有一定输入储备且任务难度适中；对零基础者先给足输入再谈输出，顺序不可倒置
      word_ids: []
  mechanism:
  - beat: 缺口被点亮
    text_kid: 一到自己写就卡住；卡住的地方，就是你要学的新东西。
    text_adult: 产出逼迫句法加工：理解时跳得过去的细节，产出时跳不过去——缺口在输出的那一刻才显形，这就是「注意到缺口」。
    visual: 拼图图：产出时一块缺口亮起红框
    anchors: []
  - beat: 扳机三步
    text_kid: 发现缺口以后，耳朵会自己去抓那个词、那个说法。
    text_adult: 三功能：注意缺口 → 在后续输入中定向捕捉 → 试说试写检验假设；输出因此是习得的触发器，而非习得的展示窗。
    visual: 三步箭头图：卡住 → 捕捉 → 试写检验
    anchors: []
  examples:
  - level: 1
    word_ids:
    - V6_学校_42
    - G2_0502
    sentence: Teacher, I don't know the word. It can keep the rain off me.
    scene_note: 缺口被点亮的时刻：umbrella 说不出，先绕着样子说——这个卡住的地方就是下一个要学的词（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_0492
    - G4_0451
    - G1_002
    - G3_0487
    sentence: I can read 'beautiful' in a book. When I write it, I stop and think.
    scene_note: 读时认得、写时卡住——输出把缺口照出来：接下来要学的，就是它（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: E-14
    rel: 同族
  - id: W-11
    rel: 同族
  - id: E-11
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 拼图缺口, kind: 场景道具, states: [藏着看不见, 写时亮起红框]}
        - {name: "绕着说卡「Teacher, I don't know the word. It can keep the rain off me.」", kind: 台词卡, states: [想说的词说不出, 先绕着样子说出来]}
        - {name: 词卡「beautiful」, kind: 词卡, states: [读时认得, 写时卡住停下来想]}
        - {name: 三步箭头, kind: 标签组, states: [还没走, 卡住、捕捉、试写依次亮起]}
      invariants: "听读懂不等于自己写得出，写时卡住亮出的缺口就是下一步要学的；这招要先有输入打底、难度合适，零基础时先给足输入再谈写"
    beats:
      - "设置：拼图快拼好了，孩子读词卡「beautiful」时一眼认出，拼图毫无动静（旁白：「看的时候都懂，不代表写的时候不卡。」）"
      - "变形：一动笔写，拼图上一块缺口亮起红框；另一边孩子说不出那个挡雨的词，只能绕着说「It can keep the rain off me.」，缺口同样被点亮（旁白：「卡住的地方，就是我要学的新东西。」）"
      - "变形：三步箭头依次亮起——卡住、耳朵去捕捉那个说法、再试着写出来检验（旁白：「发现缺口以后，耳朵会自己去抓它。」）"
      - "预测停顿：新词卡刚要落笔先停住（旁白：「先猜一猜：这次会卡在哪儿？」）"
      - "边界对照：一个几乎没读过什么的孩子面前拼图全是缺口，箭头被拦回输入一端先补读（旁白：「还没读够的时候，先多读，先不急着写。」）"
    beats_ref: claim
    lines_owner: W-07
  quiz:
  - stem: 写作文时卡住、发现有个词不会——这个时刻有什么用？
    options:
    - 说明学得太差
    - 正好指出接下来要学的新东西
    - 应该把那句跳过去
    answer: 正好指出接下来要学的新东西
    hint_ref: mechanism『缺口被点亮』
  probes: []
  prereq: []
  order: 22
  pain_points:
  - 写不长
  - 说不出
  adult:
    sources:
    - Merrill Swain (1985)，载《Input in Second Language Acquisition》
    - Swain (1995)；Swain & Lapkin (1995)
    - 来源页：https://www.teljournal.org/article_54568_3999fb15d34f17849a16e9f71874e91c.pdf?lang=fa
    boundary: 输出触发注意的前提是学习者已有一定输入储备且任务难度适中；对零基础者先给足输入再谈输出，顺序不可倒置（与 Krashen 输入说的分寸见分歧栏）。
    disputes: 有——Krashen 的输入假说主张可理解输入是习得的充分条件、输出只是习得的结果；Swain 以加拿大沉浸式教学数据（学生理解近母语而产出语法长期不准）反驳「输入足够论」。当前主流取中间立场，本条按中间立场表述。
    evidence_grade: 二手论述级
