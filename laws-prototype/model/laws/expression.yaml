- id: NE-10
  zone: 表达写作
  group: NE
  subgroup: 语调与口音
  audience: 双层
  headline: 说话时每时每刻在做三个决定：语调的「三 T」
  headline_kid: 说话的调调不是随便哼的：先把话切成一小块一小块，再决定哪一块里哪个词要喊重一点，最后决定这个词的声音是往下掉还是往上挑——选对了，意思和心情全在里面。
  claim:
    type: tendency
    statement: 英语语调由三个同时运作的子系统构成：调群划分（tonality，切成语调短语）、调核落点（tonicity，标出新信息/焦点，默认落在最后一个实词上、移位即改义）、调型（tone，承载态度与话语功能）；语调与词汇语法平级地表义。语调六大功能：态度、语法切分、聚焦、话语衔接、心理切块、索引身份。
    evidence:
    - 'J. C. Wells《English Intonation: An Introduction》(Cambridge University Press, 2006)，第 1 章 §1.4 “The three Ts” 原文（原文节选级：剑桥大学出版社官方节选）'
    - 三 T 框架（术语源自 Halliday 1967/1970，Wells 系统化并教材化）已成为语调教学的操作框架
    scope: 语调教学的操作框架（教学倾斜：调群划分相对不难，调核落点与调型是英语特异性所在）
    exceptions:
    - note: 三 T 是描写与教学框架，不声称穷尽语调的一切变异
      word_ids: []
  mechanism:
  - beat: 三个决定
    text_kid: 说话的调调不是随便哼的：切块、点重、选调，三件事同时在做。
    text_adult: tonality 决定话切成几块（如同书面标点分段），tonicity 决定重音核落哪个词，tone 决定核上音高往哪走——三个决定每句话都要做一遍。
    visual: 调音台图：三排推子标 tonality/tonicity/tone
    anchors: []
  - beat: 调核移位即改义
    text_kid: 哪个词喊重一点，意思就不一样。
    text_adult: 同一句 I didn't say she took it，调核落在不同词上，否认的对象完全不同——焦点是语调直接编码的意义，不是语气装饰。
