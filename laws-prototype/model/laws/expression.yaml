- id: E-15
  zone: 表达写作
  group: E
  subgroup: C 能力构成与教学
  audience: 孩子层
  headline: 说错了能自己改回来，是对话自带的功能：交际教学不该一出错就打断，先让人把「自我修复」走完
  headline_kid: 说话时自己发现说错了、马上改过来，这是聊天本来就有的本事；不用怕，也不用每次都等老师纠正。
  claim:
    type: tendency
    statement: 会话的修复组织有系统偏好：自我发起、自我完成的修复优先于他人纠正；抢先纠正既破坏交际流，也剥夺修复能力的练习机会——课堂纠错应延时，先让学习者把自我修复走完。
    evidence:
    - 'Emanuel A. Schegloff, Gail Jefferson & Harvey Sacks (1977) “The Preference for Self-Correction in the Organization of Repair in Conversation”, Language 53(2): 361–382——CA 修复研究奠基论文（二手论述级）'
    - 修复偏好是 CA 中跨语言复现最稳的结构发现之一；二语课堂研究大体支持「延时纠错、保护自我修复」的取向
    scope: 课堂纠错的时机与方式
    exceptions:
    - note: 自我修复解决的是「已经会、说错了」的问题；系统性不会的项目仍需教学介入，界限在错误是否可自我察觉
      word_ids: []
  mechanism:
  - beat: 修复偏好
    text_kid: 说话时自己发现说错了、马上改过来，是聊天本来就有的本事。
    text_adult: 修复组织（repair organization）：说话人用停顿、重说、换词在不丢话轮的情况下自救——流利交际者满是「小磕巴」却沟通顺畅，靠的正是这套自带功能。
    visual: 话流图：一处小磕巴被说话人自己绕回正轨
    anchors: []
  - beat: 先让他说完
    text_kid: 不用每次都等老师纠正，也不用怕说错。
    text_adult: 课堂处置：延时纠错、保护自我修复；抢先纠正的双重代价是打断交际流 + 拿走练习修复的机会（与 E-11 策略能力互补）。
    visual: 教师手势图：暂停牌压住纠正冲动，等话说完再亮
    anchors: []
