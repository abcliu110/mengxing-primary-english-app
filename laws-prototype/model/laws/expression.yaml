- id: E-12
  zone: 表达写作
  group: E
  subgroup: C 能力构成与教学
  audience: 教师/设计层
  headline: 得体不会自己长出来：语法学得再好的人也会说错场合的话——语用必须专门教、把规矩讲在明处
  headline_kid: 光把句子学对，不会自动学会「什么时候说什么」；场合的规矩要专门学。
  claim:
    type: tendency
    statement: 语用发展不随语法水平自动跟进：高水平学习者在无语用教学时，请求、道歉等行为的得体程度仍显著偏离目标语习惯；接受显性语用教学（把场合规矩讲明 + 情境练习）者进步显著快于只靠浸泡者。
    evidence:
    - Gabriele Kasper & Kenneth R. Rose (2002)《Pragmatic Development in a Second Language》（Blackwell / Language Learning 专刊）——结论「语用可教且需显性教」；Kathleen Bardovi-Harlig (2001) 专章论证教学必要性（二手论述级）
    - 后续元分析与综述（Taguchi 2011、2015）确认语用教学效应稳健、显性教学优于隐性接触
    scope: 语用教学的必要性论证（本 App 表达域坚持「逐句过三问 + 显性讲场合」的证据基础）
    exceptions:
    - note: 可教的是规约与判断框架，不是把每个场合都列成规则背；语用规范本身随时代与群体变化，教材口径需定期复核
