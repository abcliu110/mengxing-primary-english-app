        - {name: 句子气泡「I go — I went to the park yesterday.」, kind: 台词卡, states: [前半句说错了, 后半句自己改对]}
        - {name: "句子气泡「This is my sister — I mean, my brother.」", kind: 台词卡, states: [称呼说岔了, 用小词自己换回来]}
        - {name: 老师的暂停牌, kind: 场景道具, states: [举着压住抢着纠正的手, 等话说完才放下]}
      invariants: "话的意思不变，变的是说话人自己发现小错、自己绕回来；自己能察觉的错先自己改，根本不会的东西才需要有人来教"
    beats:
