  mechanism:
  - beat: 不自动跟进
    text_kid: 光把句子学对，不会自动学会「什么时候说什么」。
    text_adult: 语际语用学证据：语法水平与语用水平脱钩——请求、道歉的得体程度在无教学时长期偏离目标语习惯，浸泡时长补不上这一课。
