- id: NE-09
  zone: 表达写作
  group: NE
  subgroup: 学习者词典
  audience: 教师/设计层
  headline: 先有情景，再有句型：Hornby 的情景法遗产
  headline_kid: 学一句话，先演一出小情景：谁、在哪儿、想干什么——情景对了，句子自然就说对了、用对了地方。
  claim:
    type: tendency
    statement: 新的语言结构必须放进有意义的情景中呈现与操练：先有场合与交际意图，再有句型，操练围绕情景中的真实表达需要展开（情景法）。本条只取其「情景先行」的呈现原则——与本 App「机制先于形式」同构；操练环节须换成有信息差、有真实表达目的的任务。
    evidence:
    - A. S. Hornby 情景法的历史定位见《ELT Journal》2012 年 Hornby 专题论文；其著作序列（1954 句型指南、1959–1966 结构词与句型教学四卷）同见该文（二手论述级）
    - 情景法主导了战后英国 EFL 教材一代人的体例（情景对话 + 结构操练），其「呈现—操练」骨架至今仍存活于各国小学教材的单元结构中
    scope: 句型呈现顺序（呈现原则引用，不作完整教学法背书）
    exceptions:
    - note: 情景法的历史局限同样明确：操练偏机械、真实交际不足，这正是交际法取而代之的原因
      word_ids: []
