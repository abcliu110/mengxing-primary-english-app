    rel: 同族
  - id: E-04
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 句子卡组, kind: 台词卡组, states: [一百种没说错的讲法铺满台面, 漏斗筛后只剩两三张被高亮]}
        - {name: 句子卡「I want to marry you.」, kind: 台词卡, states: [未定性, 打勾会这样说]}
        - {name: 句子卡「It is my wish to become married to you.」, kind: 台词卡, states: [未定性, 打问号很少有人这样说]}
        - {name: 漏斗, kind: 场景道具, states: [架在句子卡组上方, 筛完停住]}
      invariants: "两张卡都合语法，变的是哪一张是大家真的会说的；地道是大家的习惯，没有离开场合的唯一一张对味卡"
    beats:
      - "设置：台面上铺满没说错的句子卡，其中两张并排放在最前面，一张写着「I want to marry you.」，一张写着「It is my wish to become married to you.」（旁白：「这两句都没说错，可人们平时只爱说其中一种——是哪一种呢？」）"
      - "变形：一百张卡一起漏过漏斗，绝大多数落进暗格，只剩两三张留在亮处；镜头回到前面两张卡，一张亮起勾，另一张亮起问号（旁白：「都没错，可他们翻来覆去用的，就那两三种。」）"
      - "预测停顿：勾和问号先被小手遮住，只留两张卡（旁白：「先猜一猜：哪张是他们真的会说的，哪张只是没说错？」）"
      - "边界对照：同一张勾选卡被挪到不同场合的牌子下，勾的光一会儿亮一会儿暗（旁白：「换个场合，对味的说法也可能换——没有一张卡到哪儿都最对味。」）"
