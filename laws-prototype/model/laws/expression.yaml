    boundary: 假说的主张强度有版本之分（Schmidt 本人后期亦用弱式表述：注意到越多学得越多）；对低龄儿童，「注意」靠情境对比与戏剧化呈现引出，不靠讲解术语。
    disputes: 有——Truscott 等批评强式注意假说（无意识学习是否存在之争）；弱式表述已是主流折衷，本条按弱式采用。
