- id: NE-25
  zone: 表达写作
  group: NE
  subgroup: Mercer 与 Alexander：课堂谈话
  audience: 教师/设计层
  headline: Thinking Together：先全班约法（ground rules），再放小组讨论——规矩是谈出来的，不是贴出来的
  headline_kid: 讨论之前，全班先一起定规矩：人人都要开口；说想法要带理由；可以不同意，但要好好说；最后一起做决定。规矩定好了，小组说话才真的有用。
  claim:
    type: tendency
    statement: 小组谈话规范须先由师生共同协商（ground rules：共享相关信息、主张给理由、欢迎质疑与讨论、决定前认真考虑其他方案、人人受邀发言、发言受尊重、力求达成一致并共同负责），再把这套规则用到各学科的小组任务里，并周期性回头反思。机制要点：规则必须是共建的而非教师颁布的纪律；规则把「怎样才算想清楚了」的标准外化成可操作的社会规范。
    evidence:
    - Mercer、Lyn Dawes 与 Rupert Wegerif 的 Thinking Together 项目：ground rules 清单与做法见《Dialogic Education》（Phillipson & Wegerif 编）所收章节摘录；使用方式与证据综述见 Liang & Fung (2020)（原文级：PMC 全文）
    - 原始干预研究（Wegerif, Mercer & Dawes 1999)：60 名 9–10 岁儿童学习谈话规则后，关键推理语言特征出现频率增至约四倍，个人非语言推理测验（Raven）成绩相对对照组提升；Mercer, Dawes, Wegerif & Sams (2004）在小学科学课复制出双收益
    - 该方法已在香港小学英语课堂完整实施并评估（Liang & Fung 2020，125 名小学生）——离开英国母语环境、进入东亚 EFL 课堂的直接可行性证据
    scope: 学期初的少量投资（先立规矩），而不是每课都上；对低年级儿童，八条规则要减量并图示化
    exceptions:
    - note: EFL 儿童用英语执行「给理由、质疑」需要语言支架（because…/I think…because… 等句框）与任务设计配合，否则规则会空转成中文讨论或沉默
      word_ids:
      - V6_核心_60
      - G3_0631
  mechanism:
  - beat: 先约法，后讨论
    text_kid: 讨论之前，全班先一起把规矩谈出来。
    text_adult: Talk Lessons（谈话课）专门用于共建规则：规则出自全班之口，孩子执行的是自己的约定——这是它与教师颁布纪律的根本区别。
    visual: 圆桌图：全班围着一张共同写下的规矩纸
    anchors: []
  - beat: 用规则，照镜子
    text_kid: 规矩定好了，还要时不时回头看看：我们刚才那样说话，合格吗？
    text_adult: 周期反思把规则从墙上的字变成自评工具；规则的实质作用是把推理标准外化成集体习惯，使推理从个人品质变成集体规范。
    visual: 镜子图：小组讨论后对着规矩清单逐项打勾
