    - 来源页（外研社学者介绍页）：https://heep.fltrp.com/contents/306233777322070016?type=1
    boundary: 模仿是过渡态不是终点：长期只借不化会形成腔调依赖，高年级须逐步要求改写、重组与个人表达；考试中大段套写范文另有评分风险，不在本条讨论内。
