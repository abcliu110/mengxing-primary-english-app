    - 'A. S. Hornby (1942)，同 NE-07；《A Guide to Patterns and Usage in English》(OUP, 1954) 为其句型体系的专书展开；核对来源：Patrick Hanks 的 EURALEX 2008 主旨讲演《Lexical Patterns: From Hornby to Hunston and Beyond》（二手论述级）'
    - OALD 此后各版（Cowie 编第 4 版起）把句型组织越做越细，成为学习者词典的标准配置
    scope: 动词条目的呈现口径（小学阶段只需最高频的几个基本句型：S+V、S+V+O、S+V+O+O、S+V+O+to do；25 型全表属教师备查工具）
    exceptions:
    - note: 句型表是教学归纳，不是语言的完备描写：同一动词在不同义项下句型不同，必须按义项查
      word_ids: []
  mechanism:
  - beat: 动词是枢纽
    text_kid: 查动词要看它后面怎么接，接法学会，句子就不会搭错。
    text_adult: 动词决定句子的骨架：能接什么、不能接什么，是每个动词自带的属性；把它随词条编码，查词即查用法。
    visual: 枢纽图：动词居中，后接槽位像插座一样标明可插类型
    anchors:
    - V6_学校_69
  - beat: 假类推
    text_kid: 仿着一个动词的接法去用另一个，就会造出怪句子。
    text_adult: 句型假类推是造句错误的主型：问法（ask）成立的接法，提议（propose）不成立——错误不在词义，在接法（见 error_cases）。
    visual: 错位插头图：propose 的插头插不进 ask 的插座
