    text_adult: 顺序倒置是关键：传统备课从词类清单挑点，功能组织从文本目的挑点——学生学到的语法天然带用途标签，不必另做『学了干嘛』的补丁。
    visual: 备课流程图：文本目的 → 活儿 → 语法点
