- id: NE-05
  zone: 表达写作
  group: NE
  subgroup: 描写立场
  audience: 教师/设计层
  headline: 好些「语法铁律」是两三百年前照着拉丁语发明的
  headline_kid: 有人说「句子最后不能放介词」「to 和动词中间不能插词」——这两条不是英语生来就有的，是以前的人觉得拉丁语高级，硬给英语定的；英语不是拉丁语，不用守拉丁语的规矩。
  claim:
    type: etymology
    statement: 「句末不能放介词」「不能分裂不定式」两条名规矩并非英语固有：英语是日耳曼语，句末介词自古英语以来即为常态，英语不定式本就是 to + 动词两截、自 13 世纪起 Chaucer、Shakespeare 等作家一直在使用分裂不定式；两条禁忌源于 18–19 世纪以拉丁语为模型的规定主义。判别测试：一条「规则」若逼得你把话说得别扭不自然，它多半就是假的。
    evidence:
    - 史实梳理见 Smithsonian Magazine 对语法神话的考据（Lowth 1762 与 Alford 1864 的归属）（二手互证级）
    - Fowler 兄弟早在 1907 年已警告：对分裂不定式的「迷信」本身才是要纠正的毛病（转引同 Smithsonian 文）
    - Crystal 对这一规定主义传统的系统批判见 NE-04
    scope: 假规则的鉴别（教师侧）；正式考试作文中避开二者是文体策略问题，可教「正式场合可以绕开」，但不得把策略讲成语言对错，更不得据此判错口语与日常写作
    exceptions: []
    source: 规则来源史：Robert Lowth《A Short Introduction to English Grammar》(1762) 以拉丁语为模型贬斥句末介词（preposition stranding）；分裂不定式禁忌主要由 Henry Alford《A Plea for the Queen's English》(1864) 推广——理由都是拉丁语里介词不能悬空、不定式是一个不可分的词
