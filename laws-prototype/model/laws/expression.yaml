    - EFL 应用（Emilia & Martin 团队报告）：https://dosen.ikipsiliwangi.ac.id/wp-content/uploads/sites/6/2021/02/From_storytelling_to_story_writing_2017.pdf
    boundary: R2L 对教师备课的要求极高——精细阅读要逐句预设提示与追问，教师培训不到位时容易退化成教师讲学生听。中国大班额下逐句互动的覆盖面是硬约束；且 EFL 小学生的解码能力（拼读）尚在建立中，「共读难文本」的前提——学生能跟着指读——在低年级未必成立，需与系统拼读教学配合，不能替代它。
