    text_kid: 好的课堂说话要过五关：一起搭、互相听、不笑话、往上垒、有目的。
    text_adult: 五原则是诊断工具：拿它量一节课的问答，能分出哪些是真对话、哪些只是轮流发言——尤其看贡献有没有被接续搭建（累积）。
    visual: 接力积木图：五块积木标集体/互惠/支持/累积/目的
