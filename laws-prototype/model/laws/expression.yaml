  quiz:
  - stem: 两句话都合语法，学英语要学的是哪种？
    options:
    - 更长的那种
    - 母语者真的会说的那种
    - 生词最多的那种
    answer: 母语者真的会说的那种
    hint_ref: mechanism『学对味的那种』
  probes: []
  prereq: []
  order: 31
  pain_points:
  - 说不出
  adult:
    sources:
    - Pawley & Syder (1983), in《Language and Communication》(Longman), pp. 191–226
    - 综述与引文核对：https://www.taalhammer.com/formulaic-sequences-language-consists-of-chunks-2005/
    boundary: 地道选择是社群惯例，有语域与地域差异，不存在脱离场合的唯一地道说法；对小学阶段，目标是高频场景的惯例说法，不是追求成人母语者的全部惯例库。
    disputes: 无主流分歧；「地道」的判定最终靠母语者直觉与语料频率互证，二者的权重在语块研究内部有讨论（见 NE-03 的识别问题）。
    evidence_grade: 二手互证级
    pending:
    - （2026-11-02 销项）Pawley & Syder (1983) 页码已核：起始页 p. 191 经多家独立著录一致；终页存异文——Schmitt & Rodgers 编《An Introduction to Applied Linguistics》书目作 pp. 191–225，剑桥《Language Teaching》刊参考文献表作 pp. 191–226。本条维持 191–226 著录并登记异文，不再挂开放待核；1983 年原书扫描页仍未亲见，接触等级维持二手互证级
