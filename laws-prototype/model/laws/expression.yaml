    statement: 发音教学的目标是可懂度（intelligibility），不是像母语者——没有证据表明母语口音比非母语口音更易懂。推论：①口音与可懂度分开评，反馈谈「听者懂不懂」不谈「对不对」；②音位教学的实质是保持区别（区别在，可懂度就在）；③真语流的连读、弱读、省音、同化是听力理解的主要门槛，须专门教听辨，产出端不强求全套复制。发音教学由四 M 构成：肌肉、思维、意义、记忆。
