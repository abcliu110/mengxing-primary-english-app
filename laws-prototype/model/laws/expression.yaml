- id: E-01
  zone: 表达写作
  group: E
  subgroup: A 言语行为与会话机制
  audience: 孩子层
  headline: 说话就是做事：每句话在传递信息之外，都在执行一个动作——请求、道歉、承诺、感谢、邀请
  headline_kid: 说话不只是说出声音，还在「做一件事」：说对不起是在道歉，说请是在请求。
  claim:
    type: tendency
    statement: 一句话除了传递信息，还在执行一个动作（请求、道歉、承诺、感谢、邀请）；判断一句话先看它做的事成没成、合不合场合，其次才是语法对错。同一形式可做不同的事，所做之事靠语境判定。
    evidence:
    - J. L. Austin (1962)《How to Do Things with Words》（牛津大学出版社；1955 年哈佛 William James 讲座）——言语行为理论奠基作；John Searle (1969)《Speech Acts》（剑桥大学出版社）将其系统化（二手论述级，经 numberanalytics 综述页转述）
    scope: 表达域总纲：一切对话数据的分类与判断口径（本 App 表达库分类已据此从「场景类型」改为「一句话干什么活」）
    exceptions:
    - note: 同一句话的言外之力可以多解，不得给句子贴死标签；教孩子的是「先问这句在干什么活」
      word_ids: []
  mechanism:
  - beat: 言内与言外
    text_kid: 说话不只是发出声音，还在做一件事：说对不起是在道歉，说请是在请求。
    text_adult: Austin 区分「说出话语」（言内）与「以言行事」（言外之力）：同一句子形式可做不同的事——It's cold here. 可以是陈述、抱怨，也可以是请人关窗的请求。
    visual: 一句话气泡配三枚动作标签（陈述/抱怨/请求），随场景切换高亮
    anchors:
    - G2_096
  - beat: 先问做什么
    text_kid: 听到一句话，先想一想：他这是在请人帮忙，还是在道歉，还是在邀请？
    text_adult: 判断顺序：先定言语行为类别，再看形式是否配得上场合；语法判断排在所做之事的判断之后。
    visual: 判断流程条：听句子 → 问「在干什么活」→ 再看说法
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G2_P05
    - G2_096
    - G2_0595
    sentence: It's cold here.
    scene_note: 教室窗边的一句话：可以是陈述、抱怨，也可以是请人关窗（清单登记例）
    supports: claim
  - level: 2
    word_ids:
    - V6_情感_17
    - G4_K01
    - G1_0852
    sentence: Sorry. / Please. / Thank you.
    scene_note: 道歉、请求、感谢三个动作各有现成说法（儿童版登记的三个动作）
    supports: claim
  error_cases: []
  relatives:
  - id: E-02
    rel: 同族
  - id: E-08
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 句子气泡「It's cold here.」, kind: 台词卡, states: [未定性, 被认出在干什么活]}
        - {name: 教室窗户, kind: 场景道具, states: [开着（风吹进来）, 被关上]}
        - {name: 动作标签（道歉/请求/感谢）, kind: 标签组, states: [未贴, 贴到对应句子上]}
      invariants: "同一句话形式不变，变的是场景与它在干的活；判定靠场景，不靠句子长相"
    beats:
      - "设置：教室窗边，窗户开着，风吹进来，一个孩子抱着胳膊说出气泡句「It's cold here.」（旁白：「他只说了一句话——你听，他到底想干什么？」）"
      - "变形：同一气泡句先后飘到三个场景——报告天气（窗外在下雨）、抱怨（同桌开的窗）、请人关窗（望向同桌），每到一处亮起对应的动作标签（旁白：「句子一个字没改，干的活却变了。」）"
      - "预测停顿：气泡句飘向第四个场景——奶奶在厨房喊冷，先停住（旁白：「先猜一猜：他这句话，是在干什么活？」）"
      - "边界对照：Sorry. / Please. / Thank you. 三个现成说法依次出场，各自的活一眼可认——对照出有的句子把活写在脸上，有的要看场景才知道（旁白：「别给句子贴死标签，先看它在哪儿、想干什么。」）"
    beats_ref: claim
    lines_owner: E-01
  quiz:
  - stem: 同学说「It's cold here.」，他可能在做什么？
    options:
    - 只是在报告天气
    - 请人把窗关上
    - 在背课文
    answer: 请人把窗关上
    hint_ref: mechanism『言内与言外』
  probes: []
  prereq: []
  order: 1
  pain_points:
  - 说不出
  adult:
    sources:
    - J. L. Austin (1962)《How to Do Things with Words》, Oxford University Press
    - John Searle (1969)《Speech Acts》, Cambridge University Press
    - 来源页：https://www.numberanalytics.com/blog/speech-acts-theory-applications
    boundary: 言外之力靠语境判定，同一句话的「所做之事」可以多解；教孩子是教他「先问这句在干什么活」，不是给句子贴死标签。
    disputes: 无（Searle 分类细节有后世修订，不影响本条）
    evidence_grade: 二手论述级
    pending: []
  config_gates: null
  status: 入模中
  version: '1.0'
  pending:
  - 探针待补写（PRB-E01-* 预留，探针库 v1 未覆盖本区）
  - error_cases 待补：清单未登记具体病例
- id: E-02
  zone: 表达写作
  group: E
  subgroup: A 言语行为与会话机制
  audience: 孩子层
  headline: 很多话不能按字面听：「你能把盐递给我吗」问的不是能力，是请求——意思要过「他想让我做什么」这一关
  headline_kid: 有人问「你能开窗吗」，他不是在考你有没有本事，是在请你开窗。听话要听他想让你做什么。
  claim:
    type: tendency
    statement: 请求常以询问能力、陈述状态的外壳间接表达；听话要过「他想让我做什么」这一关，字面对不等于用意对，反之亦然。
    evidence:
    - John Searle 间接言语行为理论（1975 年论文，后收入《Expression and Meaning》, 1979，剑桥大学出版社），承 Austin (1962) 框架（二手论述级）
    - 间接请求是跨文化请求研究（CCSARP 传统）中形式最规约化的一类言语行为，也是中国学生最常「字面理解」的失误点
    scope: 请求类言语行为的听辨与回应；间接程度随关系与场合滑动（与 E-07 礼貌权重联动）
    exceptions:
    - note: 间接不是永远更好：紧急场合、亲密关系、明确指令场合，直接表达才得体
      word_ids: []
  mechanism:
  - beat: 外壳与里子
    text_kid: 有人问「你能开窗吗」，他不是在考你有没有本事，是在请你开窗。
    text_adult: 间接言语行为：说话人用一种行为的外壳（询问能力）包装另一种行为（请求），听者靠共享的会话逻辑推断真实意图；英语请求系统高度依赖这种间接性。
    visual: 洋葱式分层图：外层「问能力」，里层「请你做」
    anchors:
    - G4_0818
  - beat: 听用意
    text_kid: 听话要听他想让你做什么，别只听字面。
    text_adult: 教学落点：听到 Can you...? 先判定意图再行动；只按字面回答（Yes, I can.）是登记在案的典型失误型（见 error_cases）。
    visual: 双气泡对照：字面答 vs 行动答
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_K03
    - G4_0639
    - G4_0818
    sentence: Can you pass me the salt?
    scene_note: 餐桌上请人递盐：问的是「能」，要的是「递」（清单标题登记例）
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_10
    - G4_159
    sentence: Can you open the window?
    scene_note: 教室里请人开窗（儿童版登记例）
    supports: claim
  error_cases:
  - wrong: （被问 Can you open the window? 后只答）Yes, I can.
    right: （起身把窗打开）Yes. / Sure.
    error_type: 字面理解间接请求
    source_type: 教学文献登记错型
    diagnosis: 把询问能力的外壳按字面回答，没过「他想让我做什么」这一关（回 mechanism『听用意』）
  relatives:
  - id: E-01
    rel: 同族
  - id: E-07
    rel: 对照
  scene_spec:
    facts:
      objects:
        - {name: "洋葱句卡「Can you open the window?」", kind: 台词卡, states: [只剩外层问句, 剥开露出里层请求]}
        - {name: 教室窗户, kind: 场景道具, states: [关着, 被打开]}
        - {name: 餐桌盐瓶, kind: 场景道具, states: [在对面够不着, 被递到手边]}
        - {name: "回答气泡「Yes, I can.」", kind: 台词卡, states: [只答字面停在原地, 变成起身去做]}
      invariants: "句子外壳不变，变的是听的人有没有听出里层想让他做的事；字面对上不算听懂，做到了才算"
    beats:
      - "设置：教室里有点闷，一个孩子看着同桌说「Can you open the window?」，同桌只回「Yes, I can.」坐着不动（旁白：「他答对了，可窗户怎么还关着？」）"
      - "变形：句卡像洋葱一样剥开——外层写着问本事，里层亮出请你开窗；同桌起身把窗打开（旁白：「原来他不是在考试，是在请人帮忙。」）"
      - "变形：同一招换到餐桌，「Can you pass me the salt?」剥开外层，里层还是请你递一递，盐瓶被递到手边（旁白：「问的是能不能，要的是递过来。」）"
      - "预测停顿：句卡再剥一半就停住，只露出外层的问句（旁白：「先猜一猜：里层藏着请他做什么？」）"
      - "边界对照：画面切到着急的时刻，火警铃响起，一句直直的命令喊出来，大家立刻行动——着急时不用绕弯，直接说才对（旁白：「越着急，越要直说；绕弯也要看时候。」）"
    beats_ref: claim
    lines_owner: E-02
  quiz:
  - stem: 老师问「Can you open the window?」，最得体的反应是？
    options:
    - 答 Yes, I can 然后坐着不动
    - 起身把窗打开
    - 答 No, I can't
    answer: 起身把窗打开
    hint_ref: mechanism『听用意』
  probes: []
  prereq:
  - E-01
  order: 2
  pain_points:
  - 说不出
  adult:
    sources:
    - John Searle (1975) 间接言语行为论文；《Expression and Meaning》(1979), Cambridge University Press
    - 来源页：https://www.thoughtco.com/locutionary-act-speech-1691257
    boundary: 间接不是永远更好——紧急场合、亲密关系、明确指令场合直接表达才得体；间接程度要看关系与场合。
    disputes: 无
    evidence_grade: 二手论述级
    pending: []
  config_gates: null
  status: 入模中
  version: '1.0'
  pending:
  - 探针待补写（PRB-E02-* 预留，探针库 v1 未覆盖本区）
- id: E-03
  zone: 表达写作
  group: E
  subgroup: A 言语行为与会话机制
  audience: 孩子层
  headline: 对话能进行下去，靠双方默认「我还在配合你」：答非所问往往不是乱答，是在用绕弯的方式回答
  headline_kid: 聊天时大家心里都答应了要好好配合；有人好像没回答你的问题，可能是在用另一种方式回答你。
  claim:
    type: tendency
    statement: 交谈靠双方默认合作运行（量、质、关系、方式四准则）；表面违反某准则时，听者反推言外之意（会话含义），而不是判对方不合作——理解「话里有话」靠这台推理机。
    evidence:
    - 'H. P. Grice (1975) “Logic and Conversation”，载 Cole & Morgan 编《Syntax and Semantics 3: Speech Acts》（Academic Press），源自 1967 年哈佛 William James 讲座；后收入 Grice (1989)《Studies in the Way of Words》（二手论述级）'
    - 合作原则与会话含义为语用学教材标准章节（Levinson 1983《Pragmatics》系统化）
    scope: 对话理解的推理框架（启蒙口径）；与 E-08「回应合不合看上文」的判断同向
    exceptions:
    - note: 四准则的权重与解读方式有文化差异，不能把英美交谈习惯说成普世理性
      word_ids: []
  mechanism:
  - beat: 默认配合
    text_kid: 聊天时大家心里都答应了要好好配合，话才接得下去。
    text_adult: 合作原则：双方默认发言满足量（信息够）、质（说真话）、关系（切题）、方式（清楚）四准则，这是对话能进行的底层约定。
    visual: 两人搭桥图：四块桥板标量/质/关系/方式
    anchors: []
  - beat: 违反即信号
    text_kid: 有人好像没回答你的问题，可能是在用另一种方式回答你。
    text_adult: 表面违反准则时听者不判定「不合作」，而是反推言外之意；答非所问往往是绕弯的回答，不是乱答。
    visual: 问句气泡旁浮现「真正的意思」小标签
    anchors: []
  examples:
  - level: 1
    word_ids:
    - V6_运动_27
    - G3_0754
    sentence: — Is the film good? — The popcorn is very good.
    scene_note: 问电影好不好，回答爆米花很好吃——绕弯的回答：言外之意是电影不怎么样（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_061
    - G2_081
    - V6_家庭_34
    sentence: — Where is your brother? — He is at school, or at home.
    scene_note: 问哥哥在哪儿，答「在学校，或者在家」——信息给得不够准，言外之意是：我也不能确定（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: E-08
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 对话桥, kind: 场景道具, states: [四块桥板齐全能接话, 一块桥板错位话接偏]}
        - {name: "问句气泡「Is the film good?」", kind: 台词卡, states: [等着正面回答, 等着听出话里的话]}
        - {name: 答句气泡「The popcorn is very good.」, kind: 台词卡, states: [像在答非所问, 浮出真正意思的小标签]}
        - {name: "答句气泡「He is at school, or at home.」", kind: 台词卡, states: [信息不够准, 露出不确定的意思]}
      invariants: "两人还想好好聊下去这一点不变；答句偏离问题时，先顺着偏离反推他真正想说的话，不要急着判他没好好说话"
    beats:
      - "设置：两个孩子搭起一座对话桥，四块桥板一块不少，问一句答一句，话顺顺当当接过去（旁白：「聊天能聊下去，是因为大家心里都想好好配合。」）"
      - "变形：有人问「Is the film good?」，答句却是「The popcorn is very good.」，答句旁边慢慢浮出一枚小标签——电影不怎么样（旁白：「他没直说不好，可你听出来了吗？」）"
      - "变形：换一问「Where is your brother?」，答句「He is at school, or at home.」晃了晃，浮出另一枚小标签——他自己也拿不准（旁白：「话说得不够准，也是在告诉你一件事。」）"
      - "预测停顿：新的问句刚发出去，答句飘到半空先停住，小标签还藏着（旁白：「先猜一猜：他嘴上说的，和心里想说的，一样吗？」）"
      - "边界对照：桥板标尺在不同地方轻轻挪动——有的地方说话爱绕弯，有的地方爱直说，挪到哪边都还是想好好聊（旁白：「哪里的人说话习惯都不一样，别把一种习惯当成唯一对的。」）"
    beats_ref: claim
    lines_owner: E-03
  quiz:
  - stem: 朋友被问「电影好看吗」，他答「爆米花不错」。按合作原则，他多半是说？
    options:
    - 电影非常好看
    - 电影不怎么样
    - 他没听见问题
    answer: 电影不怎么样
    hint_ref: mechanism『违反即信号』
  probes: []
  prereq: []
  order: 3
  pain_points:
  - 说不出
  adult:
    sources:
    - H. P. Grice (1975) “Logic and Conversation”；Grice (1989)《Studies in the Way of Words》
    - 来源页：https://faculty.goucher.edu/eng211/H_P_Grice_Maxims.htm
    boundary: 四准则的权重与解读方式有文化差异（有的文化重含蓄、有的重直率），不能把英美交谈习惯说成普世理性；对儿童只取「听话时想想他为什么这样说」的推理习惯。
    disputes: 有——后世关联理论（Sperber & Wilson）主张用单一「关联」原则替代四准则，礼貌研究者亦批评合作原则偏理性化；教学取向的差异不影响本条作启蒙框架使用，但勿表述为「语言学界一致定论」。
    evidence_grade: 二手论述级
    pending: []
  config_gates: null
  status: 入模中
  version: '1.0'
  pending:
  - 探针待补写（PRB-E03-* 预留，探针库 v1 未覆盖本区）
  - error_cases 待补：清单未登记具体病例
- id: E-04
  zone: 表达写作
  group: E
  subgroup: A 言语行为与会话机制
  audience: 孩子层
  headline: 日常句子是整块从记忆里取出来的，不是逐词现拼的：问候、点餐、道别靠的是「现成块」
  headline_kid: 说「生日快乐」「请给我一杯水」时，我们是把整块句子一下子拿出来用的，不是一个词一个词拼的。
  claim:
    type: tendency
    statement: 母语者的日常表达以程式化序列整存整取（省加工、保地道）；学习者凡事逐词拼装，既慢又容易拼出语法没错但母语者不说的句子。日常表达教学应以整句整块为单位存入、以替换个别槽位为扩展方式。
    evidence:
    - Alison Wray (2002)《Formulaic Language and the Lexicon》（Cambridge University Press）——程式化序列通行定义与异质词库模型，该领域引用最广的专著（原文节选级：CUP 官方 frontmatter）
    - 语料库与心理语言学实验（Conklin & Schmitt 2008 等）证实程式语的加工速度优势；词汇法（Lewis 1993）教学传统与之同向
    scope: 问候、点餐、道别等日常程式表达的存入与扩展方式
    exceptions:
    - note: 整块存取解决流利与地道，不解决创造性表达；块内结构最终仍需分析，只背整块不拆槽位会卡在原句上
