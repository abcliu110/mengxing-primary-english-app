  audience: 教师/设计层
  headline: Alexander 的对话式教学五原则：集体、互惠、支持、累积、目的——缺了「累积」，热闹不是对话
  headline_kid: 好的课堂说话像接力搭积木：一起搭（集体）、互相听（互惠）、说错了不笑话（支持）、一块压一块往上垒（累积）、心里知道要搭成什么（目的）。
  claim:
    type: tendency
    statement: 对话式教学五原则：集体（师生作为共同体面对任务）、互惠（互听、分享、认真考虑异见）、支持（自由表达不成熟想法而不怕出丑）、累积（在自己与他人的想法上接续搭建成连贯探究链）、目的（谈话由教师按明确教育目标设计与掌舵）。多数课堂问答是「伪开放」的背诵式问答；五原则是一把检验尺，其中累积性最难做到，也最能区分真对话与轮流发言。
    evidence:
    - 'Robin Alexander《Towards Dialogic Teaching: Rethinking Classroom Talk》（初版 2004；第 4 版 2016, Dialogos）五原则原文表述（二手论述级）'
    - 该框架出自 Alexander 对英、法、俄、印、美五国小学课堂话语的比较研究（《Culture and Pedagogy》, 2000)——「累积性缺失」是跨国课堂的普遍现象；其后 EEF 资助了基于该框架的教师发展项目与随机试验（2017 年中期报告）
    scope: 中国小学英语课在「短回合、高支架」的片段里使用五原则（如 3–5 分钟共读后讨论），并允许汉语承担元谈话；班级规模下小组层面的对话规范（NE-25）是它的必要补充而非替代
    exceptions:
    - note: 五原则描述的是母语课堂整节课的话语生态；学生能调动的英语有限时，全英对话链条（累积）很难拉长
      word_ids: []
