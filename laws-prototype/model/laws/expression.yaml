- id: W-05
  zone: 表达写作
  group: W
  subgroup: B 支架、模仿与产出
  audience: 孩子层
  headline: 最省力的写作进步法是「接着写」：先读一段好文章，再顺着它的势往下写——理解会把产出「拉平」到更高水平
  headline_kid: 先读一段写得好的故事，再接着往下编；读过的句子会悄悄跑到你的笔下，文章就变好了。
  claim:
    type: tendency
    statement: 人的理解能力天然高于产出能力；续写任务迫使产出与刚读到的文本在内容与语言上对齐，理解便把产出往上拉（协同/拉平效应）。语言必须伴着恰当语境一起学、用（学伴用随）——孤立背的句型在写作时调不出来，续写让语言粘着语境进入产出。
    evidence:
    - '王初明（广东外语外贸大学教授）(2012)《读后续写——提高外语学习效率的一种有效方法》，《外语界》2012(5): 2–7；前件 (2009)《学相伴用相随》与 (2016)《以“续”促学》，《现代外语》；互动协同框架借自 Pickering & Garrod (2004)（二手论述级）'
    - 续写的协同效应有系列实证（王敏、王初明 2014 等），并已进入高考英语新题型设计；2021 年任伟、吕晓轩对续写协同作用做过元分析
    scope: 读写结合的写作训练（小学段用简化形态：看图 + 短文起头续写几句；完整读后续写是中学以上形态）
    exceptions:
    - note: 效果依赖原文难度与学生水平匹配：原文太难则协同无从发生
      word_ids: []
  mechanism:
  - beat: 拉平效应
    text_kid: 先读一段写得好的故事，再接着往下编，文章就变好了。
    text_adult: 协同（alignment）：产出被迫与刚理解的文本对齐，理解的高水位把产出的低水位拉平——读过的句式会悄悄跑到笔下。
    visual: 水位图：理解水位高，产出水位被拉着上升
