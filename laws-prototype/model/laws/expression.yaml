- id: NE-01
  zone: 表达写作
  group: NE
  subgroup: 地道与流利
  audience: 双层
  headline: 合语法不等于地道：母语者只说「惯例会说的那一种」
  headline_kid: 一句话有一百种「没说错」的讲法，可英国人美国人翻来覆去只用那两三种——学英语要学的是「他们真的会说的那种」。
  claim:
    type: tendency
    statement: 语法允许的正确说法几乎无穷多，但母语者能稳定地只选其中少数自然、地道的说法；这种「知道哪个才对味」的知识（地道选择，nativelike selection）不在语法规则里，而在对惯例化表达的掌握里——学习者的典型状态是「每句都对，但每句都不像他们会说的」。
    evidence:
    - 'Andrew Pawley & Frances Hodgetts Syder, “Two puzzles for linguistic theory: Nativelike selection and nativelike fluency”，载 Richards & Schmidt 编《Language and Communication》(Longman, 1983), pp. 191–226（二手互证级：综述与引文核对；2026-11-02 核查：起始页 191 各源一致，终页有 225 与 226 两说——Schmitt & Rodgers 编《An Introduction to Applied Linguistics》书目作 191–225，剑桥《Language Teaching》参考文献表作 191–226，本条维持 191–226 并登记异文）'
    - Beatrice Warren 的地道性（idiomaticity）模型直接以此为第一定义：地道性 = 母语式选择
    scope: 地道性判断（对小学阶段，目标是高频场景的惯例说法，不是成人母语者的全部惯例库）
    exceptions:
    - note: 地道选择是社群惯例，有语域与地域差异，不存在脱离场合的唯一地道说法
      word_ids: []
  mechanism:
  - beat: 一百种对的说法
    text_kid: 一句话有一百种「没说错」的讲法，可他们翻来覆去只用那两三种。
    text_adult: 地道选择：合语法只是入场券；母语者的大脑里有一张「这个场合钦定哪种说法」的惯例表，稳定地只取其中少数。
    visual: 漏斗图：一百个合语法句子漏下只剩两三句被高亮
    anchors:
    - V6_日常_66
  - beat: 学对味的那种
    text_kid: 学英语要学的是「他们真的会说的那种」。
    text_adult: 教学含义：例句与句型库存优先收惯例化表达，而不是语法上成立的一切说法（与 E-04 整块存取同向）。
    visual: 双句对照卡：一句打勾「会这样说」，一句打问号
    anchors:
    - ADD_0187
  examples:
  - level: 1
    word_ids:
    - V6_日常_66
    - ADD_0187
    - G1_P02
    sentence: I want to marry you.
    scene_note: 母语者会选的说法（清单登记对照例）
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_62
    - ADD_0018
    - ADD_0187
    sentence: It is my wish to become married to you.
    scene_note: 同样合语法，母语者不这么说（清单登记对照例，与上一级同屏）
    supports: claim
  error_cases: []
