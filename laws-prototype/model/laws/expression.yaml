- id: NE-29
  zone: 表达写作
  group: NE
  subgroup: Gibbons：支架设计
  audience: 教师/设计层
  headline: 支架是设计出来的，不是随口帮一句：语言支架与学习支架要同时搭在内容课里
  headline_kid: 好老师不是把答案喂给你，而是提前把台阶修好：先一起说、先看例子、先练关键词——你踩着台阶，自己爬到原本够不着的地方。
  claim:
    type: tendency
    statement: 对在主流课堂里用第二语言学学科内容的孩子，帮助不能靠临场善意，必须预先设计：planned scaffolding（课前设计：选什么文本、预教哪些语言、把任务切成什么步骤、给什么句框与示范）与 interactional scaffolding（课中互动：即时放大、重铸、追问）双管齐下；语言不单独设课时补习，而在内容学习中同步教。其检验标准是最终能撤掉、指向独立——不合此标准的不登记为支架。
    evidence:
    - 'Pauline Gibbons《Scaffolding Language, Scaffolding Learning: Teaching Second Language Learners in the Mainstream Classroom》（Heinemann, 2002，165 页，ISBN 0-325-00366-1；第 2 版 2015）（二手论述级）'
    - 该书是二语教育领域被引最广的实践著作之一，读者正是「没有 ESL 培训的主流课堂教师」——与中国小学英语教师的处境结构最接近；它可视作教学循环（NE-19）在二语课堂的操作化伴侣
    scope: 中国课堂支架须更珍惜：同一句框要在多课复现；「从口头到书面」的语式连续体在小学阶段多数只能走到前半段（口头报告、短句写作），不宜按原书的学科写作终点要求低年级；教师示范文本的质量控制（录音、范文来源）要额外设计
    exceptions:
    - note: 原书假设教师是母语者，中国教师自身是英语学习者——条件差异须在设计中显式处理
      word_ids: []
  mechanism:
  - beat: 设计性支架
    text_kid: 好老师提前把台阶修好：先一起说、先看例子、先练关键词。
    text_adult: planned scaffolding 在课前完成：文本选择、语言预教、任务切分、句框与示范都预先排定；临场才想起的帮法不稳定、不可复制。
    visual: 施工图：台阶在上课前已按图纸砌好
    anchors: []
  - beat: 撤掉才算数
    text_kid: 踩着台阶爬上去以后，台阶是要拆掉的。
    text_adult: Gibbons 以『设计性 + 指向独立』为支架设防：语式连续体（从日常口语到学科书面语）是进阶标尺，每一步配语言示范与练习，终点是学生独立完成。
    visual: 连续体图：口头边做边说 → 口头报告 → 短句写作，支架逐段变薄
    anchors: []
