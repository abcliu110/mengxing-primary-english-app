    sentence: I go — I went to the park yesterday.
    scene_note: 自我修复标本：go 说出了口，马上自己改成 went——话没断，修复走完（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_066
    - G2_061
    - ADD_0569
    sentence: This is my sister — I mean, my brother.
    scene_note: 说错了自己换回来：I mean 是修复时常用的小词（自建例句）
    supports: claim
