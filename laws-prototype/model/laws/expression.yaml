  headline: 句子是攒出来的：把两个短句合成一个长句的练习（句子合并），是实测能提升写作质量的少数单项训练
  headline_kid: 把两个小句子拼成一个大句子，像搭积木一样练，句子就会越写越长、越写越顺。
  claim:
    type: tendency
    statement: 句子合并迫使学习者在保持意思不变的前提下操练从句、并列、修饰等句法工具，句法成熟度随之上升；它绕开「讲语法术语」的路径，用产出操作直接练句法——在 Writing Next 元分析中与策略教学、范文研读同列有效素，是少数可单独成课的微技能训练。
    evidence:
    - Graham & Perin (2007)《Writing Next》11 有效素之「句子合并」（出处同 W-09）；小学段对应训练在 Graham 等 (2012) 指南推荐 3 的「句子构造」细则中（二手论述级）
    - 句子合并的正效应在多项实验中重复出现（Saddler 等针对困难学生的研究在内），是写作干预里证据最干净的单项之一
    scope: 句法微技能训练（单独成课）
    exceptions:
    - note: 合并练的是句法操作，不自动改善内容与结构；长句不是目的——让读者看得见、跟得上才是，练习须与读者意识（W-01）配套
      word_ids: []
  mechanism:
  - beat: 攒句子
    text_kid: 把两个小句子拼成一个大句子，像搭积木一样练。
    text_adult: 保持意思不变、只改组装方式：并列、从句、修饰三种工具在反复合并中被操练成可用技能。
    visual: 积木图：两块短句积木拼成一块长句积木
    anchors: []
  - beat: 不讲术语练句法
    text_kid: 不用先背「什么是从句」，动手拼，拼着拼着就会了。
    text_adult: 句子合并绕开元语言讲解，直接用产出操作练句法——这是它对低龄学习者尤其可用的原因。
