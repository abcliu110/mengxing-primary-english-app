- id: NE-02
  zone: 表达写作
  group: NE
  subgroup: 地道与流利
  audience: 双层
  headline: 说话快得不像现编的：大脑里整存着一座「句干仓库」
  headline_kid: 大人说话像流水一样快，不是因为他们拼句子拼得快，是因为脑子里存了好多好多现成的半句、整句，拿出来就能用。
  claim:
    type: tendency
    statement: 母语者实时说出长串连贯话语的速度，超过「边想边按规则拼装新句」的加工上限；解法是整存的大量词汇化句干（长度在一个小句以上、形式与词汇大部固定的现成单位）——流利产出 = 整取句干、稍加改装拼接。句干库存「以数十万计」是二氏的理论估计口径，无法逐条实测清点，引用时须注明是估计。
    evidence:
    - Pawley & Syder (1983)，同 NE-01；估计口径见对其学说的综述转述（二手互证级，估计已显性标注）
    - 加工证据：母语与非母语读者对语块序列的阅读速度显著快于同类新造短语（Conklin & Schmitt, 2008）；受训注意语块的学习者被盲评为口语更流利（Boers et al., 2006）
    scope: 流利度的库存解释（句干多为半固定、留有可替换槽位）
    exceptions:
    - note: 流利还受发音自动化、话语规划等因素影响，句干库存是必要条件而非全部解释
      word_ids: []
    - note: 库存规模数字是估计，不得当作实测统计引用
      word_ids: []
  mechanism:
  - beat: 句干仓库
    text_kid: 脑子里存了好多好多现成的半句、整句，拿出来就能用。
    text_adult: 词汇化句干（lexicalized sentence stems）：整存整取、像大词一样被调用，省去逐词编码的成本——这是流利的速度来源。
    visual: 仓库图：货架上整排半句整句，伸手即取
    anchors: []
  - beat: 半固定不是死背
    text_kid: 现成的句子里留着小格子，可以换词。
    text_adult: 句干大部固定、小部可变：槽位让库存既能快速取用，又能适配新场合；教学上整块存入后要析出槽位（与 NE-03 并行路线同）。
    visual: 句干卡图：固定段实线、槽位段虚线
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_055
    sentence: Can I have some water, please?
    scene_note: 整存的句干：不用现拼，张口就来——流利的速度来源（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G2_080
    sentence: What about going to the park this Sunday?
    scene_note: 句干留着槽位：What about ...? 后面换什么都行——半固定，不是死背（自建例句）
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_17
    - G6_267
    sentence: See you tomorrow!
    scene_note: 告别句干：整块取用（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: NE-01
    rel: 同族
  - id: NE-03
    rel: 同族
  scene_spec:
    facts:
      objects:
        - {name: 句干仓库货架, kind: 场景道具, states: [货架上整排存着半句和整句, 伸手即取]}
        - {name: "句干卡「Can I have some water, please?」", kind: 台词卡, states: [整张存在货架上, 整张被取出来直接说出]}
        - {name: "句干卡「What about going to the park this Sunday?」", kind: 台词卡, states: [固定段是实线, 槽位段是虚线可换]}
        - {name: 句干卡「See you tomorrow!」, kind: 台词卡, states: [整块躺在货架上, 整块被取走用掉]}
      invariants: "说得快靠整张取卡再稍加改装，不靠一个词一个词现拼；卡是半固定的，留着可换的小格子；库存有多少是估计数，不是数出来的账"
    beats:
      - "设置：一个大仓库，货架上整排整排存着现成的半句和整句，一个孩子站在货架前（旁白：「说话像流水一样快的人，脑子里有个小仓库。」）"
      - "变形：孩子伸手整张抽出「Can I have some water, please?」，不用拼，张口就说完整句；接着抽出「See you tomorrow!」，也是整块取走就用（旁白：「整句存好，拿出来就能用，不用现拼。」）"
      - "变形：镜头推近「What about going to the park this Sunday?」这张卡，前半截是实线、后半截变成虚线小格子，格子轻轻晃动示意能换（旁白：「现成的卡里留着小格子，格子里的词可以换——不是整句背死。」）"
      - "预测停顿：货架上一张卡被布盖住，只露出取卡的手（旁白：「先猜一猜：他是整张拿出来说，还是一个词一个词拼？」）"
      - "边界对照：仓库旁边亮起两块小牌，一块画着嘴巴发音，一块画着先想好要说什么，仓库的灯没有独占画面（旁白：「有仓库还不够，嘴巴熟不熟、有没有想好要说什么，也管着说得快不快。」）"
    beats_ref: claim
    lines_owner: NE-02
  quiz:
  - stem: 母语者说话像流水一样快，主要靠什么？
    options:
    - 拼句子拼得特别快
    - 脑子里整存着大量现成句干
    - 认识的单词特别多
    answer: 脑子里整存着大量现成句干
    hint_ref: mechanism『句干仓库』
  probes: []
  prereq:
  - NE-01
  order: 32
  pain_points:
