- id: NE-12
  zone: 表达写作
  group: NE
  subgroup: 发音是身体的事
  audience: 双层
  headline: 发音先练肌肉：找到嘴里的四个「按钮」
  headline_kid: 发音不是用脑子想的，是用嘴练的：舌头前后、嘴唇开合、下巴上下、嗓子开和关——四个开关拨对了，声音自己就对了。先用手摸着下巴感受，再听声音。
  claim:
    type: tendency
    statement: 发音是语言的身体维度：学习者须先经由本体感觉（proprioception）接通自己的发音肌肉，才能改它们——具体化为四个「肌肉按钮」：舌（前后）、唇（展收/圆推）、下颌+舌（上下）、嗓音（开/关，清浊之别）。教学顺序因此倒转：感受肌肉—自己试出声音—再对照目标，而不是听—模仿—纠错。
    evidence:
    - Adrian Underhill《Sound Foundations》（初版 Heinemann, 1994；第 2 版 Macmillan, 2005）——发音身体论的代表作；其牛津教师研讨会讲义《Making pronunciation physical》自述四组肌肉练习（二手论述级）
    - Underhill 主编 Macmillan Books for Teachers 系列并以此法做全球师训；其实证取向已被对照教学研究采用为实验组方法（见 NE-13）
    scope: 单个音的产出教学（身体路线的主场）
    exceptions:
    - note: 身体路线擅长攻克单个音的产出，对语流中的弱读、连读与语调（听辨与话语层面）仍需专门处理（见 NE-14）
      word_ids: []
    - note: 肌肉类比是教学脚手架，不声称四个按钮穷尽发音器官的全部协同
      word_ids: []
  mechanism:
  - beat: 四个按钮
    text_kid: 舌头前后、嘴唇开合、下巴上下、嗓子开关——拨对了，声音自己就对了。
    text_adult: 四组肌肉按钮把抽象的发音动作变成可感受、可控制的身体开关；手指抵下巴在 /iː/ 与 /ɑː/ 间滑动，触觉直接证明显下颌开合即可产生一串不同元音。
    visual: 控制面板图：舌/唇/下颌/嗓音四枚按钮
    anchors: []
  - beat: 顺序倒转
    text_kid: 先用手摸着下巴感受，再听声音。
    text_adult: 传统顺序（听—模仿—纠错）跳过了本体感觉这一环：不知道肌肉在做什么，就改不动它；身体路线先接通感觉，再谈目标音。
    visual: 顺序图：感受肌肉 → 试出声音 → 对照目标
    anchors: []
