- id: E-06
  zone: 表达写作
  group: E
  subgroup: B 得体与礼貌
  audience: 教师/设计层
  headline: 语用失误分两种，治法完全不同：一种是「现成说法用错了」，一种是「不懂这个场合的规矩」
  headline_kid: 说错话有两种：一种是句子本身拿错了，一种是句子没错、但这个场合不该这么说。
  claim:
    type: tendency
    statement: 语用失误分两类：语用-语言失误（力图与形式配错，可通过教规约化用法纠正）与社交-语用失误（对场合的权衡判断错了，根子在文化价值判断，纠正靠解释场合逻辑而非给公式）。分类是诊断工具：先分清错类，再选治法。
    evidence:
    - Jenny Thomas (1983)（出处同 E-05）；两分术语源自 Geoffrey Leech (1983)《Principles of Pragmatics》（Longman）（二手论述级）
    - 两分法为语际语用学沿用至今的分析框架，中国学习者语用失误的本土调查研究均以此分类统计
    scope: 语用失误的诊断分类（教师侧工具）
    exceptions:
    - note: 两类在真实失误中常交织（一句话既配错形式又判错场合）；分类不是给孩子的错误贴的判决标签
      word_ids: []
  mechanism:
  - beat: 两分法
    text_kid: 说错话有两种：句子拿错了，或者句子没错但场合不对。
    text_adult: 语用-语言失误 = pragmalinguistic（形式与力图配错，如把汉语请求方式直译）；社交-语用失误 = sociopragmatic（场合权衡判断错，如对谁该多客气判断失误）。
    visual: 分诊台图：一句错话分流到「换说法」与「讲场合」两条通道
    anchors: []
  - beat: 对症治法
    text_kid: 拿错句子，换个对的说法；场合判断错了，要有人把场合的道理讲给你听。
    text_adult: 前者教规约化用法即可纠正；后者要解释场合逻辑与文化价值判断，给公式无效。
    visual: 两条通道末端分别标「给公式」与「讲逻辑」
    anchors: []
