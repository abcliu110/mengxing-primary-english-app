  headline: 谈话有三型：吵架型、附和型、探索型——只有探索型谈话里，思考是公开进行的
  headline_kid: 小组说话有三种样子：抢着吵（谁也不听谁）、跟着点头（你说啥都对）、一起想（我说个想法，你问为什么，咱们把想法越聊越清楚）。第三种才真的在动脑子。
  claim:
    type: tendency
    statement: 学生小组谈话分三型：争执型（断言对断言、个人化胜负）、累积型（靠重复、附和、补充堆叠，但不质疑、不检验）、探索型（批判而建设性地处理彼此想法，质疑必须附理由，替代方案摆上桌，知识对全组公开负责）。谈话不只是思维的出口，谈话的型式本身就是思维的型式；未经教导的小组谈话中探索型占比很低，争执型与累积型是默认状态。
    evidence:
    - Neil Mercer 的谈话三分类（源自 Mercer 1995，后由 Wegerif & Mercer 1997 定型）与探索型谈话的定义，见同行评审综述 Liang & Fung (2020), Thinking Skills and Creativity（原文级：PMC 全文系统转述）
    - 三分类来自对英国小学课堂小组活动的长期录音分析，不是思辨分类
    scope: 先借「型式可命名、可自评」（让孩子分辨自己组刚才是在吵、附和还是真讨论），比直接要求探索型谈话更可行
    exceptions:
    - note: 中国课堂有自身的发言规范（举手、齐答、师道权威），「质疑同伴」在低年级需要先解决面子与安全感问题
