- id: NE-18
  zone: 表达写作
  group: NE
  subgroup: 悉尼学派
  audience: 教师/设计层
  headline: 语类是「分阶段、奔着社会目的去的做事方式」：故事、报告、说明各有各的台阶
  headline_kid: 每种文章都有自己的「过关路线」——故事要先铺垫、再出事、再解决；说明书要一步一步来。先看清路线图，再自己上路。
  claim:
    type: tendency
    statement: 语类（genre）是「分阶段的、目标导向的社会过程」（Martin, 1999）：文本的样子由它在文化中承担的社会目的决定，达成目的要走几个可辨认的阶段（如叙事的 Orientation → Complication → Resolution；报告的分类 → 分面描述）；阶段与阶段的语言特征都可分析、可命名——「好文本」由此从玄学变成一张可以摆上桌面的地图，弱势学生不必靠家庭文化资本去猜。
    evidence:
    - J. R. Martin 的语类理论，定版于 Rose & Martin (2012)《Learning to Write, Reading to Learn》（Equinox）；「staged, goal-oriented social process」定义（Martin, 1999）（二手论述级；该文完整出处已经 2026-11-02 核查补齐，见 adult.pending 销项）
    - 该理论出自 1980 年代悉尼学派在小学与移民教育中的实地项目（Language and Social Power、Write it Right）：逐篇分析学校里真正要写的文本，绘出各学科语类的阶段结构与语言特征——是田野描写工作，不是书斋分类
    scope: 借的是「先给文本地图再让学生写」这一机制，而不是整套语类目录照搬；中国课标语境下文本类型有限（自我介绍、看图写话、简单通知等），阶段图要按本地任务重绘
    exceptions:
    - note: 语类图是脚手架不是模具（见分歧）
      word_ids: []
  mechanism:
  - beat: 过关路线
    text_kid: 每种文章都有自己的过关路线，先看清路线图再上路。
    text_adult: 阶段是语类的骨架：叙事走铺垫→出事→解决，报告走分类→分面描述，程序走步骤序——阶段可命名，教学才有着力点。
    visual: 路线图：三种文本三条路线，关卡逐个标名
    anchors: []
  - beat: 把地图摆上桌面
    text_kid: 好文章长什么样，不用猜——地图就摆在桌上。
    text_adult: 公平性论证：显性教语类，是为了让没有接触过学校文本文化的孩子也能拿到地图，而不是靠家庭文化资本暗中通关。
    visual: 桌面地图图：全班围着同一张阶段图
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_0564
    - G1_016
    - G5_232
    - G2_089
    sentence: One morning, a little duck went to the river to swim.
    scene_note: 语类阶段标本·铺垫（Orientation）：谁、何时、何地先摆好（教师层标本）（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - ADD_0666
    - V6_日常_19
    - G2_065
    sentence: Suddenly, it could not find its mother!
    scene_note: 语类阶段标本·出事（Complication）：平静被打破，故事动起来（自建例句）
    supports: claim
  - level: 2
    word_ids:
    - G3_0527
    - V6_家庭_24
    - G3_0442
    - V6_交通_30
    - V6_家庭_34
    sentence: At last, a kind girl helped it find the way home.
    scene_note: 语类阶段标本·解决（Resolution）：问题收束——三阶段走完，故事成篇（自建例句）
    supports: claim
  error_cases: []
  relatives:
  - id: NE-19
    rel: 同族
  - id: NE-20
    rel: 同族
  - id: NE-21
    rel: 同族
  scene_spec: "不设（终态登记：教师/设计层条目：机制是语类阶段的分类口径与课程迁移设计，属纯分类学/课程设计）"
  quiz:
  - stem: 动笔写故事之前，先看清什么？
    options:
    - 字数要求
    - 故事的过关路线（先铺垫、再出事、再解决）
    - 别人的分数
    answer: 故事的过关路线（先铺垫、再出事、再解决）
    hint_ref: mechanism『过关路线』
  probes: []
  prereq: []
  order: 48
  pain_points:
  - 写不长
  adult:
    sources:
    - Rose & Martin (2012)《Learning to Write, Reading to Learn》, Equinox
    - Martin & Rose (2005) Reading to Learn 模型与 Halliday 系统功能语言学的承继关系：https://www.researchgate.net/figure/Reading-to-Learn-cycle_fig4_255652356
    boundary: 语类清单是英语文化与澳大利亚课程的产物（如 recount/report/procedure 的分法），迁移到中国小学英语时要选的是「先给文本地图再让学生写」这一机制，而不是整套语类目录照搬；中国课标语境下小学生要写的文本类型有限，阶段图要按本地任务重绘。另外语类图是脚手架不是模具（见分歧）。
    disputes: 语类教学法自诞生起就有「公式化」批评——担心阶段图把写作变成填空、压制创造性；悉尼学派的回应是：显性图式恰恰是创新的前提（先知道常规才谈得上破规），且教学循环的最后阶段就是独立建构。此争论在澳大利亚与英国文学教育界至今未息，入模须登记。
    evidence_grade: 二手论述级
    pending:
    - '（2026-11-02 销项）Martin (1999) 完整出处已补齐：J. R. Martin, “Mentoring semogenesis: ‘genre-based’ literacy pedagogy”，载 F. Christie 编《Pedagogy and the Shaping of Consciousness: Linguistic and Social Processes》(Continuum, 1999), pp. 123–155（经 Sprogforum 63 (2016) 语类教学法史述的参考文献表核对）；语类定义「staged, goal-oriented social process」即出该文。项目源流经 Martin & Rose (2008)《Genre Relations》前言自述核对：Writing Project 1980–1987；Language and Social Power Project 1986–1990（弱势学校计划，小学段）；Write it Right 1990–1995'
