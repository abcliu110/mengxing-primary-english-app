        - {name: "续写纸「Day after day, it tried and tried. One morning, it flew up to a tree.」", kind: 台词卡, states: [空白, 读过的说法跑进笔下]}
      invariants: "理解本来就比产出高，续写时刚读到的词句粘着故事一起被取用，把产出往上拉；原文太难，拉平就发生不了"
    beats:
      - "设置：小鸟的原文起头卡摆在桌上，水位图里理解的水位高高的，产出的水位矮一截（旁白：「读懂的，总比自己能写出来的多。」）"
      - "变形：孩子接着往下编，续写纸上出现「Day after day, it tried and tried. One morning, it flew up to a tree.」，读过的 fly 和 looked at 的说法悄悄跑进笔下，产出水位被拉高（旁白：「刚读过的句子，悄悄来帮我写啦。」）"
      - "预测停顿：续写纸写到一半先停住（旁白：「先猜一猜：原文里哪个说法，会跑到下一句里？」）"
      - "边界对照：换上一段难得多的原文，水位怎么拉都拉不动，协同的绳子松掉（旁白：「原文太难，就拉不动啦，要换合适的来读。」）"
