- id: W-03
  zone: 表达写作
  group: W
  subgroup: A 读者与过程
  audience: 孩子层
  headline: 孩子写作文「想到什么写什么」不是偷懒，是发展阶段：从「知识讲述」长到「边写边想清楚」需要很多年
  headline_kid: 把知道的事情一件件写下来，是小朋友写作文的正常样子；一边写一边想出新主意，是长大以后慢慢学会的本事。
  claim:
    type: tendency
    statement: 儿童与新手的默认写作模式是知识讲述（检索记忆、顺次写下、不回头加工，低负荷）；知识转化要在「内容空间」与「修辞空间」之间反复协商、写作本身改变想法，需多年发展。教学急不得：先让讲述流畅，再逐步引入「回看时问读者懂不懂」的转化动作。
    evidence:
    - Carl Bereiter & Marlene Scardamalia (1987)《The Psychology of Written Composition》（Erlbaum）——儿童写作发展研究的总结性专著，双模型出自该书（二手论述级）
    - 双模型被 Kellogg (2008) 扩展为三阶段（讲述→转化→精工），是写作发展心理学的主流框架；它解释了中国小学生作文「流水账」的认知根源——不是态度问题，是阶段问题
    scope: 写作发展的阶段口径（评价儿童作文的标尺）
    exceptions:
    - note: 讲述模式在简单任务（记录、说明）中对成人也是合适策略，不是「低级」的代名词；本条反对的是拿转化标准去苛责低龄儿童，而非取消高年级的目标
      word_ids: []
  mechanism:
  - beat: 知识讲述
    text_kid: 把知道的事情一件件写下来，是小朋友写作文的正常样子。
    text_adult: 知识讲述：想到什么写什么、顺次倒出、不回头加工——负荷低，是儿童与新手的默认模式，「流水账」是它的典型外观。
    visual: 传送带图：记忆里的事一件件顺次落到纸上
    anchors: []
  - beat: 知识转化
    text_kid: 一边写一边想出新主意，是慢慢学会的本事。
    text_adult: 知识转化：写作不只是倒出想法，写作本身改变想法——在「想说什么」与「读者需要什么」之间反复协商；引入路径是回看时多问一句「读者懂不懂」。
