- id: W-15
  zone: 表达写作
  group: W
  subgroup: C 证据清单与诚实边界
  audience: 教师/设计层
  headline: 任何「套这个公式保满分」的承诺都没有研究支持：能涨分的只有策略、练习量与反馈的组合——这是写作域的诚实底线
  headline_kid: 没有哪个万能公式能保证满分；真正有用的是学会方法、多写、有人告诉你哪里可以更好。
  claim:
    type: tendency
    statement: 写作干预的效应全部来自「显性策略 + 足量练习 + 形成性反馈」的复合投入，且效应量是统计意义上的平均提升；把支架（句型、结构图）宣传为保分工具，是把教学手段冒充效果因果——任何「保 X 分」式断言在正规元分析的表述传统中不存在。
    evidence:
    - Graham & Perin (2007) 与 Graham 等 (2012) 的证据体系（出处同 W-08/W-09）——两份文献通篇以效应量与证据等级表述，无一处分数承诺（二手论述级）
    - 本 App 审查对旧 WRITING 框架「95% 考场作文逃不出三大母题」等伪统计与保分话术的裁定（report_expressions C-1）与此互证
    scope: 写作域的诚实底线：针对一切「保证性承诺」话术
    exceptions:
    - note: 本条针对的是「保证性承诺」，不是说结构支架无用——支架作为功能支持的价值见 W-10
      word_ids: []
    - note: 应试技巧（审题、时间分配）有其正当位置，但须如实标注为技巧而非规律
      word_ids: []
  mechanism:
  - beat: 效应从哪来
    text_kid: 真正有用的是三样东西凑在一起：学会方法、多写、有人反馈。
    text_adult: 元分析报告的只有效应量与置信区间——平均意义上的提升；从「平均提升」跳到「保证某个孩子满分」，中间没有任何研究设计能搭桥。
