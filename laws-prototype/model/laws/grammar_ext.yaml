  quiz:
  - q: "故事讲到最紧张的地方：So he opens the door and sees a big dog! 这里的 opens 是现在时——是说错了，还是故意的？ A. 说错了，过去的故事必须全用过去时  B. 故意的：把过去的事拉到眼前「演」给大家看"
    answer: "B. 故意的：把过去的事拉到眼前「演」给大家看——历史现在时是叙事手法：把事件放进虚拟的说话现在，提高临场感；它出现在故事高潮段，不是时态错误。（来源：本单元例句）"
    hint: "回机制第 1 节「演与说」：讲到最紧张的地方改成现在时，是故意拉近"
  - q: "He walked into the room. Suddenly, he hears a noise! 第二句的 hears 混在过去故事里，为什么不算「时态漂移」病例？ A. 因为 hears 是过去式  B. 因为这是高潮处故意的切换：过去时铺垫、现在时直播，切换本身就是分段标记  C. 因为 noise 是单数"
    answer: "B. 因为这是高潮处故意的切换：过去时铺垫、现在时直播，切换本身就是分段标记——病例里的漂移是无意识地丢了过去基调（见 TA-15 病例）；历史现在时是叙事者在高潮点主动换镜头——一个是失手，一个是手法。（来源：本单元例句）"
    hint: "回机制第 1 节「演与说」：讲到最紧张的地方改成现在时，是故意拉近"
  - q: "不给时间词。听故事时，哪一句一听就是「演」出来的高潮句？ A. So he opens the door and sees a big dog!  B. He opened the door yesterday afternoon.  C. He opens the door every day at seven."
    answer: "A. So he opens the door and sees a big dog!——没有时间词帮忙，靠的是语境位置：故事高潮 + 现在时形态 = 历史现在时；第二句是老实叙述，第三句是日常习惯。（来源：本单元例句）"
    hint: "回机制第 1 节「演与说」：讲到最紧张的地方改成现在时，是故意拉近"
  - q: "把三张故事卡排成讲故事的顺序（平静铺垫 → 走进房间 → 高潮直播）："
    answer: "It was a quiet night. → He walked into the room. → Suddenly, he hears a noise!——叙事的默认是过去时铺垫（was、walked），讲到高潮才切换成现在时 hears——顺序对了，切换的分段作用才看得出来。（来源：机械操练题）"
    hint: "回机制第 1 节「演与说」：讲到最紧张的地方改成现在时，是故意拉近"
