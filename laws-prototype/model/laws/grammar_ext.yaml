- id: TA-08
  zone: 语法
  group: TA
  headline: 过去形式还管「距离」：礼貌、假设、转述，都是把事情从眼前推远
  headline_kid: 过去时不只说「以前」：想客气一点（I wondered ...）、想假设一下（If I were you），都把话往远处推一推，听起来就柔和了
  claim:
    type: tendency
    statement: 过去形式（第二形式）的通义是「距离」——把情境置于说话人即时视域之外；时间上的过去只是这一通义在时间域的投影，心理上的不确定（假设）与社交上的客气（礼貌）是同一「推远」操作在其他维度的实现。
    evidence:
    - Langacker《Foundations of Cognitive Grammar》Vol.2 (1991) §6.1 认识距离说；其 2001 现在时论文明确回指该分析
    - 〔清单 v3 回写·VB-09/VB-12〕Lewis《The English Verb》通用原则与 Palmer 的类型学观察双证：距离是第二形式的通义而非附加用法
    scope: 小学阶段只需埋下「推远 = 客气 / 假设」的种子（各一两个固定句型），系统讲解（条件句全套）不在本学段范围
    exceptions:
    - note: 过去形式最常见的用法仍是字面的过去时间叙述——「距离」是通义层解释，不否定时间用法的原型地位
      word_ids:
