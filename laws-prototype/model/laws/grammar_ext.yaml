- id: QI-06
  zone: 语法
  group: QI
  headline: 状语排队是倾向不是定律：「先地点后时间」只是常态出场顺序
  headline_kid: 状语们排队有个习惯顺序（先说事儿，再补在哪儿、什么时候），但排队不是上锁——为了强调，谁都可以站到最前面去
  claim:
    type: tendency
    statement: 英语句尾状语的常态序列（方式—地点—时间等）源于信息包装与辖域的一般倾向，而非句法硬性规则；前置状语承担场景设定/强调功能，两种语序由功能分工而非对错区分。
    evidence:
    - Quirk et al. (1985) §18.20 状语位置与 fronting 的论述（经 Duskova 的 FSP 研究转引核实）
    - 项目已裁定把旧「先地点后时间」定律与 G28 填空题错误项一并改判为倾向 + end-focus 讲法
    scope: 倾向内部仍有硬约束残部（如频度副词的中位、方式副词与动词的黏合度），教学中只放开「地点/时间」的排队等级，其余按个案处理
    exceptions:
    - note: 语料中前置时间/地点状语频率稳定可观且功能可辨（场景设定、对比）——它们是本倾向自带的合法变体，不是例外失误
      word_ids:
      - G1_0564
  mechanism:
  - beat: 排队不上锁
    text_kid: 状语排队有习惯：先说做了什么，再补在哪儿、什么时候。但队形不是锁死的：想先交代时间，就把时间搬到队头去，那叫「先给场景」。
    text_adult: 定律说无法解释前置状语的合法性，倾向 + 功能说可以——这正是本项目把旧定律降格为倾向的理由。
    visual: 状语卡排队图：地点卡与时间卡可交换位置，队头位置标「场景设定席」
  examples:
  - level: 1
    sentence: We play in the park in the morning.
    scene_note: 常态出场：事情 → 地点 → 时间
    supports: claim
    word_ids:
    - G2_0489
    - G2_080
    - G1_0564
  - level: 1
    sentence: In the morning, we play in the park.
    scene_note: 时间前置作场景设定——合法变体，不是错误（与上例同框）
    supports: claim
    word_ids:
    - G1_0564
    - G2_0489
    - G2_080
  error_cases: []
  relatives:
  - id: QI-05
    rel: 前置
  - id: QI-07
    rel: 同族
  - id: CO-15
    rel: 同族
  quiz:
  - q: 判断：In the morning, we play in the park. 把时间提到句首，就是错句。
    answer: 不对。状语排队是倾向不是定律；前置状语承担场景设定功能，是合法变体。
    hint: 回机制「排队不上锁」：想先交代时间，就把时间搬到队头，那叫先给场景。
  - q: We play in the park in the morning. 是常态出场顺序：事情之后，先补什么、再补什么？
    options:
    - 先地点，再时间
    - 先时间，再地点
    - 先人，再方式
    answer: 先地点，再时间
    hint: 回机制「排队不上锁」：常态是先说做了什么，再补在哪儿、什么时候。
  - q: 哪个说法对？
    options:
    - 状语顺序是功能分工，队形不上锁
    - 状语顺序是硬性规则，错了就是病句
    - 时间永远不许前置
    answer: 状语顺序是功能分工，队形不上锁
    hint: 回主张：两种语序由功能分工而非对错区分。
  - q: 判断：既然排队不上锁，频度副词的位置也可以随便放。
    answer: 不对。倾向内部仍有硬约束残部（如频度副词的中位）；教学中只放开地点/时间的排队等级。
