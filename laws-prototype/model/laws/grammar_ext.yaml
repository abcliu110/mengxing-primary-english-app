    hint: 回机制「模具自带『给』」：队形一站好，「给」的意思自己就来了。
  - q: 把 build 放进双宾模具：他们为我们建了一座小房子。（build 的过去式是 built）
    answer: They built us a small house.
    hint: 回机制「模具自带『给』」：动词只说清「用什么办法给」——建着给。
