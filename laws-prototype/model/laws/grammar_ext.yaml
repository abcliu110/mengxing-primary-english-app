- id: QI-05
  zone: 语法
  group: QI
  headline: 新信息爱住句尾：先说已知的，再把「新货」放在最后并重读
  headline_kid: 说话像上菜：先端上大家熟悉的，最后压轴端上新菜，还要敲一下盘子（重读）提醒大家「看这儿！」
  claim:
    type: tendency
    statement: 信息按「由低到高信息值」的线性顺序呈现是英语的常态（end-focus）：新信息（焦点）落在句尾并承载重音，已知信息在前作铺垫。
    evidence:
    - Quirk et al. (1985) p.1357 原文：it is common to process the information in a message so as to achieve a linear presentation from low to high information value（经萨拉戈萨大学学术文献转引核实）
    scope: 项目已裁定以 end-focus 取代自造标签「焦点先行思维」；本条为呈现定版口径
    exceptions:
    - note: 重音可人为前移制造对比焦点（I said GREEN, not blue)，是合法的「变强调」手段（见 QI-07），不构成反例
      word_ids:
      - G1_033
      - G1_032
  mechanism:
  - beat: 压轴上菜
    text_kid: 说话像上菜：先上大家都吃过的，最后端上新鲜的，还敲一下盘子——重读就是敲盘子，提醒大家「新货在这儿」。
    text_adult: 该原则统一解释语序常态、被动选择（CO-08）、分裂句与 there 存现（CO-07）等表面无关的现象，是信息结构研究被引用最广的英语原则。
    visual: 上菜顺序图：旧菜在前、新菜压轴并带一个重音星标
  examples:
  - level: 1
    sentence: I said GREEN, not blue.
    scene_note: 例外同框：对比焦点靠重音前移——清单边界登记例
    supports: claim
    word_ids:
    - G1_033
    - G1_032
  - level: 1
    sentence: Dad bought me a new BIKE.
    scene_note: 常态：新信息（bike）在句尾并重读（重读以大写标示）
    supports: claim
    word_ids:
    - G3_0650
    - G2_0973
  - level: 2
    sentence: There is a DOG under the tree.
    scene_note: 存现句的信息安排与 end-focus 同源（引 CO-07）
    supports: claim
    word_ids:
    - G1_015
    - G2_079
  error_cases: []
  relatives:
  - id: CO-07
    rel: 同族
  - id: CO-08
    rel: 同族
  - id: QI-06
    rel: 同族
  - id: QI-07
    rel: 同族
  quiz:
  - q: Dad bought me a new BIKE. 新信息落在哪里、靠什么提醒大家「看这儿」？
    options:
    - 句尾的 BIKE，靠重读
    - 句首的 Dad，靠大写
    - 句中的 me，靠停顿
    answer: 句尾的 BIKE，靠重读
    hint: 回机制「压轴上菜」：最后端上新菜，还要敲一下盘子——重读就是敲盘子。
  - q: 判断：新货放哪儿都行，重音随便落，意思不受影响。
    answer: 不对。常态是已知在前、新信息在后：新信息落在句尾并承载重音。
    hint: 回主张：end-focus 是英语信息呈现的常态（Quirk 口径）。
  - q: I said GREEN, not blue. 这里重音跑到前面去了，为什么合法？
    options:
    - 对比焦点靠重音前移，是正当的变强调
    - 读错了，应该重读 blue
    - 因为 GREEN 是颜色词
    answer: 对比焦点靠重音前移，是正当的变强调
    hint: 回主张的例外登记：重音前移制造对比焦点，是合法手段，不构成反例。
