    right: People discovered that traffic jams were caused by narrow roads.
    error_type: 转述时态未后移
    source_type: 学习者语料病例
    diagnosis: 主句 discovered 已经站在过去，从句也要跟着往后退一步：are caused 要改 were caused。转述里把时态往过去推，正是过去形式表「距离」的用法。〔出处：田彤 2026 高一语料例；病例 VEC-028〕
