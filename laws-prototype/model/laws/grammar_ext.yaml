    type: tendency
    statement: 英语靠形式标记先确立主谓骨架再扩展（形合，「楼层建筑」式），汉语靠语义衔接线性铺展、重心在后（意合，「流水」式）；语序差异是建筑术差异的表层结果。此为统计大势而非每句必查的定律。
    evidence:
    - '连淑能《英汉对比研究》(1993) 英汉句法对比专题；论文锚：《论英汉句法的基本特征》（《厦门大学学报》1992(3): 122–126）'
    scope: 用于诊断与预防，不用于逐句判错；项目已裁定旧库据此衍生的「先地点后时间」等定律化表述一律降格倾向（见 QI-06）
    exceptions:
    - note: 英语亦有流水式口语句、汉语亦有严谨形合句——大势不覆盖每一句
