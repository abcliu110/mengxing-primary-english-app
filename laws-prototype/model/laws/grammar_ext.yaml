    scene_note: enjoy 点名 -ing（swimming 归一为 swim）
    supports: claim
    word_ids:
    - G4_0876
  - level: 2
    sentence: He stopped smoking. / He stopped to smoke.
    scene_note: 条目支撑登记的反转对：框架一换，意思翻转——选择即意义
    supports: claim
    word_ids:
