- id: TA-04
  zone: 语法
  group: TA
  headline: 一般现在时装不下「正在发生」：整件事必须和说话这一刻完全重叠
  headline_kid: 「我现在说」只有一眨眼那么短，一件完整的事塞不进这一眨眼；所以正在做的事要钻进镜头里说（进行时），一般现在时平时管的是习惯和老道理
  claim:
    type: rule
    statement: 英语现在时要求被描述的完整事件与说话时刻完全重合（full coincidence）；说话瞬间近乎一个点，有界完整事件无法装入，即时解读被阻断，故正在发生的事件必须用进行体，一般现在时天然表习惯与真理。
    evidence:
    - 'Langacker "The English Present Tense" (English Language and Linguistics 5(2), 2001, 251–272)；同论亦见《Cognitive Grammar: A Basic Introduction》(2008) p.29'
    scope: 解说、演示、历史现在时（TA-14）是受语体约束的合法例外，属识解方式切换而非规则失效
  mechanism:
  - beat: 一眨眼的现在
    text_kid: 「现在」只有一眨眼那么短。踢球、吃饭这种要花时间的事，整件塞不进一眨眼，只好钻进镜头里说：I am eating.
    text_adult: Langacker 的完全重合分析同时解释三件事：进行体为何表正在发生、一般现在时为何天然表习惯/真理、体育解说与舞台指示为何能用现在时（事件被识解为与解说同步的图式）。
    visual: 一条时间轴上一个极短的「现在」亮点，一件完整事件的方框塞不进、改用进行中的截面呈现
  - beat: 一般现在时的正职
    text_kid: 一般现在时平时管两件事：天天都做的习惯（I get up at seven）和永远对的老道理（The sun rises in the east）。
    text_adult: 习惯与真理读法是「事件与说话时刻重合」在图式层面的实现：重合的是反复发生的图式而非单次事件。
    visual: 日历上重复打勾的作息图 + 太阳升起图
  examples:
  - level: 1
    sentence: I am eating now.
    scene_note: 正在吃饭——必须钻进镜头（进行时）
    supports: claim
    word_ids:
    - V6_日常_15
    - G3_K23
  - level: 1
    sentence: I get up at seven every day.
    scene_note: 天天的习惯——一般现在时的正职
    supports: claim
    word_ids:
    - V6_日常_0
    - G3_K19
    - G1_026
  - level: 2
    sentence: The sun rises in the east.
    scene_note: 永远对的老道理——一般现在时
    supports: claim
    word_ids:
    - G2_0501
    - V6_交通_38
    - ADD_0629
  - level: 2
    sentence: Look! They are playing football now.
    scene_note: 眼前正在发生——进行时
    supports: claim
    word_ids:
    - G2_0489
    - G3_0401
    - G3_K23
  error_cases: []
