  quiz:
  - q: "昨天下午踢球，讲的是「踢到一半的画面」，不是整场比赛的结果。时间开关在过去、看法开关钻进中间——选对的句子： A. We played football in the afternoon.  B. We were playing football in the afternoon.  C. We play football in the afternoon."
    answer: "B. We were playing football in the afternoon.——两个开关组合：时间=过去、看法=钻进中间（进行），组合出过去进行时；先定开关再选样子。（来源：本单元例句）"
    hint: "回机制第 2 节「组合不是背诵」：先想「什么时候、怎么看」，再去选样子"
  - q: "把积木排成「作业做完了，痕迹是现在可以出去玩」这句话："
    answer: "I have finished my homework.——完成时的积木顺序是 have + 过去分词：先立「和现在有牵连」的帮手 have，再放 finished。（来源：本单元例句）"
    hint: "回机制第 1 节「两个开关」：两个开关一组合，时态的样子就定了"
  - q: "作业刚做完，妈妈问：「现在能出去玩了吗？」回答要盯着「现在的结果」，选： A. I finished my homework.  B. I have finished my homework.  C. I finish my homework every day."
    answer: "B. I have finished my homework.——锚点钉在现在、回头看过去留下的结果——看法开关拨到「完成」，不是单纯讲过去那一刻。（来源：本单元例句）"
    hint: "回机制第 1 节「两个开关」：两个开关一组合，时态的样子就定了"
  - q: "你站在窗边往外看：一个小男孩坐在树下读绘本，读到一半还没读完。句子里不许出现时间词，选对的说法： A. He is reading a picture book.  B. He read a picture book.  C. He reads a picture book at school."
    answer: "A. He is reading a picture book.——没有时间词，意思全靠形状扛：眼前正在发生、还没完——时间=现在、看法=钻进中间，形状是 is reading。（来源：机械操练题）"
    hint: "回机制第 1 节「两个开关」：两个开关一组合，时态的样子就定了"
  - q: "病例原文：「Tomorrow, I visited my uncle.」两个开关里有一个拨错了——错在哪儿，应该怎么改？"
    answer: "Tomorrow, I will visit my uncle.——状语 Tomorrow 把锚点放在将来，动词却用了过去形 visited：时间开关和时间词互相打架；谈将来要借 will（见 TA-02）。（来源：病例 VEC-031）"
    hint: "回机制第 1 节「两个开关」：两个开关一组合，时态的样子就定了"
