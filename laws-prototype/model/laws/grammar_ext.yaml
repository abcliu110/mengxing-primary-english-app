- id: TA-18
  zone: 语法
  group: TA
  headline: 「镜头讲法」教时态有实验支持，但证据强度要如实说：方向有据、低龄待验
  headline_kid: 把完成时讲成「看痕迹」而不是背表格，试过的大哥哥姐姐学得更好；轮到小学生行不行，还要继续看
  claim:
    type: tendency
    statement: 认知语言学式解释（以识解/镜头重述时态语义）在现在完成时等难点上显示教学优势，但现有证据内部不一致且全部来自青少年与成人学习者；用于小学属合理外推，必须标注待验，不得宣称「已被证明更优」。
    evidence:
    - Drożdż (2011), Linguistica Silesiana 32, 213–228：认知语法工具教现在完成时，阳性
    - Maghsoudi & Khodamoradi (2024), Journal of Researches in Linguistics 16(2), 29–40：准实验，认知解释组胜出
    - Bielak & Pawlak (2011), SSLLT 1(3), 365–400：结果与传统教法相当（持平）
    scope: 无 6–12 岁随机对照实验；本条是本域全部「镜头讲法」的证据边界声明
    exceptions:
