- id: QI-14
  zone: 语法
  group: QI
  headline: 疑问句是分阶段长出来的：整句模仿 → 换疑问词 → 最后才学会倒装
  headline_kid: 小朋友学提问有固定顺序：先整句背「What's this?」，再学会换前面的词，最后才学会把助动词倒过来——倒装是最后长好的本领，急不得
  claim:
    type: tendency
    statement: 二语疑问句发展呈可预测的阶段序列（不倒装的疑问词句 → 疑问词前置但无倒装 → 一般疑问倒装 → 特殊疑问全倒装）；教学输入无法跳过阶段，只能顺应阶段供料。
    evidence:
    - Ellis《The Study of Second Language Acquisition》(2008 第2版) 发展模式章对疑问句阶段研究的综述；源头为 Pienemann 过程性理论（Processability Theory, 1998）对英语疑问句发展阶段的经典分析
    scope: 阶段说基于自然/交际型学习者纵向数据；中国课堂学习者的显性知识可使书面练习提前达标，但自发口语仍多按阶段走，两者不矛盾
    exceptions:
    - note: 课堂显性教学可使书面产出提前达标——例外只及书面练习，不及自发口语的阶段顺序
      word_ids: []
  mechanism:
  - beat: 四级台阶
    text_kid: 学提问像上台阶：一级整句背，二级换词，三级学会一般问句的倒装，四级特殊问句也倒得过来。台阶要一级一级上，催也没用——但每级都有适合的练习。
    text_adult: 纵向语料中学习者疑问形式按阶段依次涌现且极少跳阶，是二语习得「发展顺序」证据最扎实的句法领域之一（过程性/可教性研究的核心结论）。
    visual: 四级台阶图，每级放一个代表问句，倒装台阶被标为最后一级
  examples:
  - level: 1
    sentence: What's this?
    scene_note: 条目儿童版登记的起点形态：整句模仿，不拆解
    supports: claim
    word_ids:
    - G3_Q01
    - G3_P08
  - level: 1
    sentence: Where the dog?
    scene_note: 阶段形态登记（学习者发展中的过渡式，非目标式）：疑问词前置但无倒装/无系动词——登记为阶段标本，不是病例错句
    supports: claim
    word_ids:
    - G3_Q03
    - G1_015
  - level: 2
    sentence: Where is the dog?
    scene_note: 目标形态：前置 + 倒装齐备——与上例构成阶段对照
    supports: claim
    word_ids:
    - G3_Q03
    - G1_015
  error_cases: []
  relatives:
  - id: QI-13
    rel: 前置
  - id: CO-10
    rel: 同族
  quiz:
  - q: Where the dog? 处在提问台阶的哪一级？
    options:
    - 过渡级——疑问词前置了，但倒装还没长好
    - 起点级——整句模仿
    - 目标级——前置加倒装齐备
    answer: 过渡级——疑问词前置了，但倒装还没长好
    hint: 回机制「四级台阶」：它登记为阶段标本，不是病例错句。
  - q: 把台阶排好序：① What's this?（整句背）② Where the dog? ③ Where is the dog?
    answer: ① → ② → ③（整句模仿 → 疑问词前置无倒装 → 前置 + 倒装齐备）
    hint: 回机制「四级台阶」：倒装是最后长好的本领，台阶一级一级上。
  - q: 判断：孩子说 Where the dog? 说明没学好，必须立刻纠正到目标式。
    answer: 不对。它是发展序列中可预测的阶段形态；教学输入无法跳过阶段，只能顺应阶段供料。
    hint: 回主张：阶段序列基于纵向数据，催也没用——但每级都有适合的练习。
  - q: 提问台阶里，哪种本领最后才长好？
    options:
    - 特殊疑问句的全倒装
    - 整句模仿
    - 换疑问词
    answer: 特殊疑问句的全倒装
    hint: 回机制「四级台阶」：顺序是整句 → 换词 → 一般问句倒装 → 特殊问句全倒装。
  probes: []
  prereq:
  - QI-13
  order: 314
