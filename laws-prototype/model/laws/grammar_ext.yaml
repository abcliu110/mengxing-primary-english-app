- id: QI-12
  zone: 语法
  group: QI
  headline: 回答否定问句，英语跟「事实」走，汉语常跟「对方的话」走
  headline_kid: — Don't you like it? 你要是真不喜欢，英语说 No（我不喜欢），按事实答；汉语常说「嗯」表示「你说得对，我不喜欢」——两边答的不是同一件事，最容易鸡同鸭讲
  claim:
    type: rule
    statement: 英语 yes/no 的锚点是答者所断言命题的极性（事实极性系统），汉语「是/嗯/不」的锚点常是与问者命题的一致性（认同系统）；系统差异在否定问句处正面相撞。
    evidence:
    - 连淑能《英汉对比研究》(1993) 英汉语用/答问方式对比；Swan《Practical English Usage》否定问句条（第3版专设 negative questions 处理）
    scope: 英语口语中对否定问句的简短回答本身也常含混（母语者亦需追问澄清）；教学口径取「按事实 + 补全句」的最稳妥形式（No, I don't. / Yes, I do.)
  mechanism:
  - beat: 两个锚
    text_kid: 英语的 Yes/No 拴在「事情本身」上：喜欢就是 Yes，不喜欢就是 No。汉语的回答常拴在「你说得对不对」上：你说对了就点头。碰上否定问句，两个锚正好相反。
    text_adult: 该错位是中国学习者跨文化交际中后果最直接的问答偏误之一（答反意思），且只需一次显性对比即可大幅纠正，是对比教学性价比的典型案例。
    visual: 两个锚图标：事实锚（拴住一个苹果）与认同锚（拴住一句话气泡），否定问句处两锚方向相反
  examples:
  - level: 1
    sentence: — Don't you like it? — No, I don't.
    scene_note: 条目儿童版登记问答型——真不喜欢，按事实答 No 并补全句
    supports: claim
    word_ids:
    - V6_日常_64
  - level: 1
    sentence: — Don't you like it? — Yes, I do.
    scene_note: 其实喜欢——按事实答 Yes（与汉语认同式点头正相反）
    supports: claim
    word_ids:
    - V6_日常_64
  error_cases: []
  relatives:
  - id: QI-01
    rel: 同族
  quiz:
  - q: — Don't you like it? 你其实不喜欢。怎么答才不鸡同鸭讲？
    options:
    - No, I don't.
    - Yes.（意思是「对，我不喜欢」）
    - Yes, I do.
    answer: No, I don't.
    hint: 回机制「两个锚」：英语的 Yes/No 拴在事情本身上——不喜欢就是 No，还要补全句。
  - q: — Don't you like it? 其实你很喜欢。怎么答？
    options:
    - Yes, I do.
    - No, I don't.
    - No.（意思是「对，我喜欢」）
    answer: Yes, I do.
    hint: 回机制「两个锚」：喜欢就是 Yes——与汉语认同式点头正相反。
  - q: 判断：回答否定问句，英语的 Yes/No 拴在「对方说得对不对」上。
    answer: 不对。那是汉语认同系统的锚。英语拴在答者断言的事实极性上：按事实答，并补全句最稳妥。
    hint: 回主张：事实极性系统 vs 认同系统，在否定问句处正面相撞。
  - q: 把答语补全：— Don't you like it? — No, ___ .
    answer: I don't（整句：No, I don't.）
    hint: 回机制「两个锚」：教学口径取「按事实 + 补全句」的最稳妥形式。
  probes: []
  prereq:
  - QI-01
  order: 312
  pain_points:
  - 说不出
  - 听不懂
  adult:
    sources:
    - 连淑能《英汉对比研究》(1993) — https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=65be754274ce561611bd9be6
    - Swan《Practical English Usage》否定问句条 — https://online.flipbuilder.com/jeru/kjhl/files/basic-html/page285.html
    boundary: 见 claim.scope。
    disputes: []
    evidence_grade: 二手互证级
    pending:
