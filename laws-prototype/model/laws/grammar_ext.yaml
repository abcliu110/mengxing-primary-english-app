    error_type: 不规则动词过去式过度规则化
    source_type: 学习者语料病例
    diagnosis: go 的过去式是 went，要整个记住，不能按规则加上 -ed 变成 goed。-ed 的规则只管规则动词，高频不规则动词的过去式是整存的。〔出处：胡晓、冯姗 2026 统计，此错点 65 例占误加类 67.7%；病例 VEC-019〕
    diagnosis_kid: "go 的过去式是 went，要整个记住，不能按规则加上 -ed 变成 goed。-ed 的规则只管规则动词。有人统计过，这个错点出现 65 例，占「乱加标记」这类错误的 67.7%。"
  - wrong: I eated an apple.
    right: I ate an apple.
    error_type: 不规则动词过去式过度规则化
    source_type: 学习者语料病例
    diagnosis: eat 的过去式是 ate，不是 eated。先把高频不规则动词的过去式用熟，-ed 的图式就不会乱套到它们头上。〔出处：胡晓、冯姗 2026；病例 VEC-020〕
    diagnosis_kid: "eat 的过去式是 ate，不是 eated。先把常用的不规则动词过去式用熟，加 -ed 的习惯就不会乱套到它们头上。"
  - wrong: He goed home early.
    right: He went home early.
    error_type: 不规则动词过去式过度规则化
    source_type: 学习者语料病例
    diagnosis: 与 goed to school 同型：go 的过去式整存为 went。〔出处：胡晓、冯姗 2026 另一学生原句；病例 VEC-021〕
    diagnosis_kid: "和 goed to school 是同一种错：go 的过去式要整个记住，是 went。"
  - wrong: The government builded more roads last year.
    right: The government built more roads last year.
    error_type: 不规则动词过去式过度规则化
    source_type: 学习者语料病例
    diagnosis: build 的过去式是 built，不是 builded。不规则动词学得零散时，大脑就拿 -ed 规则来补空——补得越勤，越说明这批词要整存整练。〔出处：田彤 2026 高一语料例；病例 VEC-022〕
    diagnosis_kid: "build 的过去式是 built，不是 builded。不规则动词学得零散时，大脑就会拿 -ed 的规则来补空。补得越勤，越说明这批词要整个记住、一起练。"
