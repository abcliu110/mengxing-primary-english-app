  headline: will 说将来带着「我预言 / 我乐意」的口气，因为它本是意愿动词变的
  headline_kid: will 以前就是「想要」：所以它说将来时，总像在拍胸脯保证，或者当场答应「好，我来！」
  claim:
    type: etymology
    statement: will 沿语法化路径「意愿 → 意图 → 预测」演变，旧义在新用法中留有残影（persistence），故 will 的将来解读天然带说话人的承诺/预测立场，而非中性的时间标记。
    evidence:
    - Bybee, Perkins & Pagliuca《The Evolution of Grammar》(1994) 将来标记来源路径 desire/volition → intention → future（pp.244, 263，经 Diewald & Wischer 2013 转引核实）
    source: 意愿动词 will（古英语 willan「想要」）语法化为将来标记；项目 g25-etym 已登记此词源定性
    scope: 残影不是全部——天气预报式 will 已高度中性化；教学中说「带着预言的味道」即可，不得宣称 will「仍然表示想要」
  mechanism:
  - beat: 旧义的残影
    text_kid: will 的老祖宗是「想要」。它变成说将来的词以后，老脾气没全改：用它说将来，像拍着胸脯说「我看准了」或者「好，我来干」。
    text_adult: 跨语言中意愿动词变将来标记反复独立发生（英语 will、希腊语 tha 等）；will 的即时决定义（I'll get the door）无法用纯时间说解释，是残影的活证据。
    visual: 一条演化路：想要 → 打算 → 预言将来，路上留着淡淡的旧脚印
  examples:
  - level: 1
