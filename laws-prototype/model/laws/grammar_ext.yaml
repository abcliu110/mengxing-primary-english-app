- id: TA-09
  zone: 语法
  group: TA
  headline: 过去完成时是「锚点搬家」：站在过去某个点上，再回头看更早的事
  headline_kid: 讲到过去的某一天时，想再说那天之前的事，就把小旗子插在那一天，再往前看——这就是过去完成时
  claim:
    type: rule
    statement: 完成体是相对时态：它只要求「事件早于参照点」；参照点在现在是现在完成时，参照点被叙事搬到过去即过去完成时，维度本身没有增加。
    evidence:
    - Comrie《Tense》(1985) 相对时态（relative tense）分析；CGEL 次级时态说互证（perfect 是叠加在主时态之上的第二层）
    scope: 叙事中事件顺序已由 before/after 或语境标明时，过去完成时常可省略，属冗余消除，不构成对机制的反例
  mechanism:
  - beat: 小旗子搬家
    text_kid: 完成时的小旗子（参照点）平时插在「现在」。讲故事讲到过去某一天，把小旗子搬过去插好，再往旗子前面看，就是过去完成时。
    text_adult: 「锚点」一解同时说明了为何过去完成时必须依附一个过去叙事点（单独出现会显得突兀），以及为何它与现在完成时共享全部四种用法。
    visual: 时间轴上一面小旗从「现在」搬到「上周二」，旗前的一段被照亮
