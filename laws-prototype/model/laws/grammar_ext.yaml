- id: CO-16
  zone: 语法
  group: CO
  headline: 构式讲法的边界：模具管「整句的戏」，词形细节归形态层管
  headline_kid: 模具告诉你这出戏谁给谁、谁变样；但戏服上的扣子——时态对不对、-s 加没加——要去隔壁形态车间检查
  claim:
    type: rule
    statement: 构式义是论元结构层的图式意义，对动词形态、一致、时态选择不作预测；把构式讲法越界用到形式细节会产生新的伪规则。任何构式类条目入模时，必须同步写明其不管辖的层面。
    evidence:
    - 项目 domains.yaml dom-constructions conflicts 定版裁定（「构式讲法管'模具义'不管形式细节，失效边界已在 fixes 中写明」）
    - Goldberg (1995) 对构式预测范围的自我限定
    scope: 本条本身即边界声明，对本组全部 CO 条目生效
  mechanism:
  - beat: 分工地图
    text_kid: 模具车间管「谁给谁、谁变样」这出戏；形态车间管扣子：时态、-s、单复数。戏演对了，扣子还得去隔壁一颗颗查。
    text_adult: 项目句型库修订中，伪统计（句型③「80% 动词及物」）与虚构分工（句型②「turn 管颜色、get 管天气」）正是讲法越界/无据的实例，已删除——本条是那次清理的成文边界。
    visual: 两个车间门牌：构式车间（戏）与形态车间（扣子），中间一条分界线
  examples:
  - level: 1
    sentence: He baked her a cake.
    scene_note: 构式层判读：双宾给义成立——这是模具车间的结论
    supports: claim
    word_ids:
    - G5_0793
    - G1_048
  - level: 1
    sentence: He bakes her a cake every Sunday.
    scene_note: 同一构式，bakes 的三单 -s 与 every Sunday 的时态选择归形态层——构式不预测也不豁免
    supports: claim
    word_ids:
    - G5_0793
    - G1_048
  error_cases: []
  relatives:
  - id: CO-01
    rel: 前置
  quiz:
  - q: He bake her a cake every Sunday. 「给」的戏演对了，这句的毛病该去哪个车间查？
    answer: 形态车间（形态层）：bake 缺三单 -s。构式只管「谁给谁」的戏，-s、时态、单复数归形态层。
    hint: 回机制「分工地图」：戏演对了，扣子还得去隔壁一颗颗查。
  - q: 判断：模具选对了，时态和 -s 就不用查了。
    answer: 不对。构式义对动词形态、一致、时态不作预测也不豁免——分工查验，缺一不可。
    hint: 回主张：把构式讲法越界用到形式细节，会产生新的伪规则。
  - q: He bakes her a cake every Sunday. 里 bakes 的 -s 与 every Sunday 决定的时态，是谁的结论？
    options:
    - 形态层
    - 构式层
    - 词汇层
    answer: 形态层
    hint: 回机制「分工地图」：同一构式，词形细节归形态车间。
  - q: 哪个问题归构式车间管？
    options:
    - 这句是谁给谁、谁变样
    - -s 加没加
    - 时态选得对不对
    answer: 这句是谁给谁、谁变样
    hint: 回机制「分工地图」：模具管整句的戏，形态管戏服上的扣子。
