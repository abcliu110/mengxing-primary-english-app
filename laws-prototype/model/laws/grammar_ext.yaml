- id: QI-07
  zone: 语法
  group: QI
  headline: 前置是「变强调」的正当手段：把谁提到句首，就是先给谁打光
  headline_kid: 平时新货放最后；可你要是特别想强调时间，就把 In the morning 提到最前面——像舞台上先给谁一束追光
  claim:
    type: rule
    statement: 成分前置（fronting/topicalization）在信息结构中承担主题衔接与对比强调功能；被前置者获得「出发点」地位，句尾焦点位置让给其余新信息，整句的信息重心随之改组。
    evidence:
    - Quirk et al. (1985) §18.20 对前置功能的表述；纲领 coreView 定版口径：「状语前置是变强调——都是'帮听话人排信息'的选择」
    - Duskova 对语料中偏离基本语序的实例分析：前置无一不与信息功能（衔接/强调）对应
    scope: 前置的修辞收益以可理解为限，初学写作中滥用会破坏 end-focus 的默认加工预期；小学阶段定位为识别与欣赏，不作产出要求
  mechanism:
  - beat: 追光给谁
    text_kid: 舞台上的追光打给谁，谁就是这一眼的主角。把时间、地点提到句首，就是先给它一束光：先让大家站到这个场景里，再听正文。
    text_adult: 前置与 QI-05 的 end-focus 是同一套信息包装的两个方向：默认把焦点留给句尾，前置则改组出发点——二者共同服务「帮听话人排信息」。
    visual: 舞台追光打在句首的 In the morning 上，句尾的新信息随后亮起
  examples:
  - level: 1
    sentence: In the morning, I read a book.
    scene_note: 条目儿童版登记例型——时间前置作场景出发点
    supports: claim
    word_ids:
    - G1_0564
    - G2_0492
  - level: 1
    sentence: In the park, children are playing.
    scene_note: 地点前置：先给地点打光，再呈现场景
    supports: claim
    word_ids:
    - G2_080
    - G2_0489
  error_cases: []
  relatives:
  - id: QI-05
    rel: 前置
  - id: QI-06
    rel: 同族
  quiz:
  - q: In the morning, I read a book. 把时间提到句首，是为了什么？
    options:
    - 先给时间打光——作场景出发点
    - 英语规定时间必须在前
    - 为了把句子拉长
    answer: 先给时间打光——作场景出发点
    hint: 回机制「追光给谁」：把谁提到句首，就是先给谁一束追光。
  - q: 判断：把时间提到句首只是换个位置，意思和重心都不变。
    answer: 不对。被前置者获得「出发点」地位，句尾焦点让给其余新信息，整句信息重心随之改组。
    hint: 回主张：前置承担主题衔接与对比强调功能。
  - q: In the park, children are playing. 追光先打给了谁？
    options:
    - 地点——in the park
    - 孩子们
    - 玩耍的动作
    answer: 地点——in the park
    hint: 回机制「追光给谁」：先让大家站到这个场景里，再听正文。
  - q: 判断：小学阶段要把前置当作产出要求，天天练。
    answer: 不对。本条定位为识别与欣赏，不作产出要求；滥用还会破坏 end-focus 的默认加工预期。
    hint: 回主张的范围：前置的修辞收益以可理解为限。
