- id: CO-15
  zone: 语法
  group: CO
  headline: 英语先立骨架再挂修饰，汉语先铺垫后点题：两种句子建筑术
  headline_kid: 英语盖房子先立柱子（谁做了什么），再往四周加房间；汉语像讲故事，先把前因后果铺好，最后一句才点出正题
  claim:
    type: tendency
    statement: 英语靠形式标记先确立主谓骨架再扩展（形合，「楼层建筑」式），汉语靠语义衔接线性铺展、重心在后（意合，「流水」式）；语序差异是建筑术差异的表层结果。此为统计大势而非每句必查的定律。
    evidence:
    - '连淑能《英汉对比研究》(1993) 英汉句法对比专题；论文锚：《论英汉句法的基本特征》（《厦门大学学报》1992(3): 122–126）'
    scope: 用于诊断与预防，不用于逐句判错；项目已裁定旧库据此衍生的「先地点后时间」等定律化表述一律降格倾向（见 QI-06）
    exceptions:
    - note: 英语亦有流水式口语句、汉语亦有严谨形合句——大势不覆盖每一句
      word_ids: []
  mechanism:
  - beat: 两种盖法
    text_kid: 英语盖句子：先咣咣立起柱子（谁、做了什么），再慢慢加房间。汉语讲事情：先把来龙去脉铺开，正题常常在最后才亮出来。
    text_adult: 该框架能预测中国学习者英语写作的成类问题（主语缺失、谓语叠床、状语堆前），是国内英语教学沿用三十年的对比分析基准表述。
    visual: 两栋在建的楼：左楼先立框架再砌墙，右楼如流水线自左向右铺展
  examples:
  - level: 1
    sentence: I read a book in my room.
    scene_note: 英语骨架先行：主谓宾立稳，地点状语挂在后面
    supports: claim
    word_ids:
    - G2_0492
    - G1_002
    - V6_家庭_36
  - level: 1
    sentence: In the morning, I walk my dog in the park.
    scene_note: 前置状语是英语内的特许变强调（QI-07），不是把汉语建筑术搬过来——与下例的汉语式铺陈区分
    supports: claim
    word_ids:
    - G1_0564
    - G2_080
    - G1_015
  error_cases: []
  relatives:
  - id: QI-06
    rel: 同族
  - id: TA-15
    rel: 同族
  quiz:
  - q: I read a book in my room. 这句先立起来的是什么？
    options:
    - 主谓宾骨架——谁读了什么
    - 地点——房间
    - 前因后果
    answer: 主谓宾骨架——谁读了什么
    hint: 回机制「两种盖法」：英语先立柱子（谁做了什么），再往四周挂修饰。
  - q: 判断：英语句子也必须先铺垫、最后才点题。
    answer: 不对。那是汉语意合「流水式」的常态；英语靠形式标记先立骨架。此为统计大势，不是逐句判错的定律。
    hint: 回主张：两种建筑术是倾向差异，语序差异是其表层结果。
  - q: In the morning, I walk my dog in the park. 把时间提到前面，是把汉语建筑术搬进英语了吗？
    options:
    - 不是——这是英语内的特许变强调
    - 是——英语不许前置
    - 是——这句是错句
    answer: 不是——这是英语内的特许变强调
    hint: 回条目登记：前置状语是英语内的变强调（见 QI-07），与汉语式铺陈要区分。
  - q: 判断：「先地点后时间」可以当定律，逐句查错。
    answer: 不对。项目已裁定这类衍生表述一律降格为倾向——用于诊断与预防，不用于逐句判错。
    hint: 回主张的范围：大势不覆盖每一句，英语亦有流水式口语句。
