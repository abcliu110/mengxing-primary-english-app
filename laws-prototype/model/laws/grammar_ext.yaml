- id: TA-11
  zone: 语法
  group: TA
  headline: be going to 是「已经在路上」：从走向某地去做某事，变成预兆与打算
  headline_kid: going to 以前真的是「走过去做某事」：人已经上路了，所以它说的将来，是「已经有苗头、已经打算好」的将来
  claim:
    type: etymology
    statement: be going to 源于移动构式「go（去某地）+ 目的不定式」的语法化：空间移动义脱落、目的义升格为意图与预测，留下「当前已有征兆/计划」的语义底色；它与 will 的分工是倾向而非铁律。
    evidence:
    - Bybee, Perkins & Pagliuca (1994)「运动 → 将来」跨语言路径；框架见 Hopper & Traugott《Grammaticalization》(2003 第2版)
    source: 移动动词 go + 目的不定式构式语法化为将来标记；项目 g24-etym 已登记此定性
    scope: going to 与 will 大量语境可互换；教学以「预兆/打算 vs 临时决定/预测」的原型对比呈现并明示重叠区
  mechanism:
  - beat: 上路的人
    text_kid: 一个人背上包往车站走——他还没到，但「要去哪儿」已经明明白白。going to 说的将来就是这种：苗头已经在眼前了。
    text_adult: Look at the clouds — it's going to rain 的「眼前有预兆」解读与 will 的中性预测形成稳定对立，是路径语义残留的活证据。
    visual: 小人背着包走在路上，前方标着要做的事；旁边一片乌云配雨滴预兆
