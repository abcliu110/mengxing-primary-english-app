    diagnosis: 到达之前他就已经离开了——站在「我到达」这个过去的点往回看，要用过去完成时 had left 把「更早」标出来。〔出处：张迪 2025 语料例；与 VEC-030 的滥用恰成一缺一滥对照；病例 VEC-029〕
    diagnosis_kid: "「我到达」是过去的一个点，他离开比这个点还要早。要站在那个点往回看，用 had left 把「更早」标出来。"
  - wrong: Last weekend, my friends and I had climbed to the top of the hill and enjoyed the beautiful view.
    right: Last weekend, my friends and I climbed to the top of the hill and enjoyed the beautiful view.
