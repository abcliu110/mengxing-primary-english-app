- id: TA-17
  zone: 语法
  group: TA
  headline: 学时态的顺序：先把高频动词的过去式用熟，再回头看系统表
  headline_kid: 先学会说 went、saw、had 这些天天用的，讲故事讲顺了，时态的大表自己会慢慢浮出来
  claim:
    type: tendency
    statement: 动词范畴从具体词例中涌现（逐词习得 → 局部图式 → 抽象系统）；频率保证高频不规则形式最先被整存并成为图式扩展的锚点，故教学顺序应是先用熟高频动词的过去式，再回头看系统表。
    evidence:
    - 'Tomasello《Constructing a Language: A Usage-Based Theory of Language Acquisition》(2003, Harvard UP) 动词岛与图式涌现说'
    - Ellis (2002) 频率调谐综述（见 GR-19）
    scope: 顺序说针对自然习得路径；高年级补系统表有显性学习效率优势，两者是先后关系而非取舍关系（见 GR-21 的适切性检查）
    exceptions:
    - note: 显性系统表在高年级/应试补课场景中有独立效率价值，不在本条否定范围——本条只裁定起始顺序
      word_ids: []
  mechanism:
  - beat: 从词到表
    text_kid: 先把 went、saw、had 一个个用熟，就像先认熟几个好朋友；朋友多了，他们之间的「规矩」自己会显出来，最后再看大表也不迟。
    text_adult: 儿童语言日记与实验研究（源于 Tomasello 1992 个案研究）显示早期动词框架互不连通、按动词逐个扩展，与「先灌系统表」的预测相反。
    visual: 三级台阶：单个动词卡（went/saw/had）→ 小圈子图式 → 完整的时态系统表
