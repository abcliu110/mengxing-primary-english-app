    answer: "When I arrived, he had already left.——小旗插在「我到达」这个过去点上，「他离开」在小旗之前，要用过去完成时 had left 把更早一层标出来（病例分类：过去完成时误用——该用未用）。（来源：病例 VEC-029）"
