    answer: swimming
    hint: 回机制「点名搭档」：enjoy 点 -ing，记动词时把搭档一起记。
  - q: 判断：He stopped smoking. 和 He stopped to smoke. 意思一样，搭档随便选。
    answer: 不一样。stop smoking 是「停下不抽了」，stop to smoke 是「停下来去抽」——框架一换，意思翻转。
    hint: 回机制「点名搭档」：stop 两个都点、但意思不一样——选择即意义。
  - q: want 点名的搭档是哪个？I want ___.
