- id: TA-13
  zone: 语法
  group: TA
  headline: 时刻表上的将来用现在时：因为时刻表把未来写成了「已定的事实」
  headline_kid: 火车时刻表是早就定死的，像事实一样摆在那儿，所以说 The train leaves at six——用现在时，是借它的「铁板钉钉感」
  claim:
    type: rule
    statement: 一般现在时的核心语义包含「图式化的、已确立的事实」；时刻表、节目单、日历把未来事件预先制度化为事实，故可借现在时编码（futurate present）。
    evidence:
    - Huddleston & Pullum (2002)《CGEL》现在时的将来指称（futurate）分析；项目 frameworks ROYAL_TRUMPS T10 已把本例外同级登记
    scope: 仅限时刻表/日程类预定事件；个人临时计划不用此式（用 going to / will），混用即错；*It rains tomorrow 不成立
