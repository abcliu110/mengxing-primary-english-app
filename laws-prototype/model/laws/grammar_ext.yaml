    answer: "I visited Beijing last year.——last year 是点名了的过去时间，完成时不能和它同现；要保留 last year，就把 have visited 换成一般过去时 visited。（来源：病例 VEC-008）"
    hint: "回机制第 1 节「两套定位打架」：完成时说「盯着现在」，点名昨天就打架"
