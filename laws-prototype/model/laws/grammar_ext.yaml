- id: CO-07
  zone: 语法
  group: CO
  headline: There be 是「出场介绍」模具：把新面孔推上舞台，所以主语多半是新客
  headline_kid: There is a dog 是把小狗第一次领上台介绍给大家；台下都认识的老朋友，就不用这样领了——所以这里很少说 There is the dog
  claim:
    type: rule
    statement: 存现构式的功能是向话语中引入新实体，其主语位置由「新信息/不确定指称」占据是功能使然（定指限制），与 have 的「领有」是两出不同的戏。
    evidence:
    - Huddleston & Pullum (2002)《CGEL》存现分句（existential clauses）分析；项目 g36-there-vs-have「There be 与 have 分工」为已入模口径
    scope: 清单列举语境可放行定指主语（There is the bus! 指等候之物到达），属语境特许，不改变原型口径
  mechanism:
  - beat: 领上台与归谁管
    text_kid: There is 是主持人领新客人上台：「有只小狗！」have 是说清东西归谁：「我有一本书」。一个管出场，一个管归属，别演混了。
    text_adult: 定指限制（the、专名作存现主语时的系统别扭感）跨语体稳定；初学者 *There has a book 类错误正源于不分「出场」与「领有」两戏。
    visual: 舞台图：主持人（There is）领新客上台；另一侧 have 的手把书放进「我的」圈里
  examples:
  - level: 1
    sentence: There is a dog under the tree.
