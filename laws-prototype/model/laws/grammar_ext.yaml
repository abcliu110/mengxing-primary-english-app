      from: TA-15 exs[1] 对照框
      slots: {}
  error_cases:
  - wrong: Last year, the government build a new subway.
    right: Last year, the government built a new subway.
    error_type: 裸动词表过去
    source_type: 学习者语料病例
    diagnosis: 句里有 last year 把时间说清了，动词却忘了跟着变过去式。汉语靠时间词交代时间、动词不变样，这习惯搬过来就会这样；英语里时间词在场，动词也必须变形。〔出处：田彤 2026 高一写作统计，此类「过去时遗漏」占过去时偏误 40% 居首位；病例 VEC-001〕
    diagnosis_kid: "句里有 last year，时间已经说清了，动词却忘了跟着变过去式。汉语靠时间词交代时间、动词不变样，这个习惯搬过来就会这样。有人统计过：这类「过去时漏变」占过去时错误 40%，居第一位。"
  - wrong: I go to Hainan last winter holiday.
    right: I went to Hainan last winter holiday.
    error_type: 裸动词表过去
    source_type: 学习者语料病例
    diagnosis: 时间词 last winter holiday 已经把事钉在过去，go 却没有变成 went。先看时间词、再给动词换过去式，是英语每句必做的动作。〔出处：杨欢腾 2025 高中写作语料例；病例 VEC-002〕
    diagnosis_kid: "时间词 last winter holiday 已经把事钉在过去，go 却没有变成 went。先看时间词，再给动词换上过去式，是英语每句必做的动作。"
  - wrong: Last month, my family go to the beach.
    right: Last month, my family went to the beach.
    error_type: 裸动词表过去
    source_type: 学习者语料病例
    diagnosis: Last month 说的是上个月的事，go 要变成 went 才对。原文统计：这类「过去时与现在时混淆」占时态错误 42.3%，是最常见的一类。〔出处：张迪 2025 三所高中 1,800 篇作文；病例 VEC-003〕
    diagnosis_kid: "Last month 说的是上个月的事，go 要变成 went。有人统计过：这类过去和现在混用的错误占时态错误 42.3%，是最常见的一类。"
  - wrong: I hang out with my friends the day before yesterday.
    right: I hung out with my friends the day before yesterday.
    error_type: 裸动词表过去
    source_type: 学习者语料病例
    diagnosis: 前天（the day before yesterday）发生的事，hang 要用过去式 hung。hang 的过去式不带 -ed，要整词记住（高频不规则动词的过去式整存，参 TA-17）。〔出处：吴金双 2025 初三作文例；病例 VEC-004〕
    diagnosis_kid: "前天发生的事，hang 要用过去式 hung。hang 的过去式不带 -ed，这类高频词的过去式要整个记住。"
  - wrong: Yesterday I watch a movie.
    right: Yesterday I watched a movie.
    error_type: 规则动词 -ed 遗漏
    source_type: 学习者语料病例
    diagnosis: Yesterday 的事，watch 少了尾巴 -ed。规则动词的过去式要靠 -ed 标出来，汉语动词没有这个尾巴，最容易漏。〔出处：胡晓、冯姗 2026 初二语料，遗漏类占其动词误用 42.0% 居首；病例 VEC-005〕
    diagnosis_kid: "Yesterday 的事，watch 少了尾巴 -ed。规则动词的过去式要靠 -ed 标出来，汉语动词没有这个尾巴，最容易漏。有人统计过，这类漏掉标记的错误占动词误用 42.0%，居第一位。"
  - wrong: They visit the museum last week.
    right: They visited the museum last week.
    error_type: 规则动词 -ed 遗漏
    source_type: 学习者语料病例
    diagnosis: 上周（last week）去参观，visit 要写成 visited。原文统计：「一般过去时形态缺失」共 141 例，占其动词误用 27.5%，是最高频的错误点。〔出处：胡晓、冯姗 2026；病例 VEC-006〕
    diagnosis_kid: "上周去参观，visit 要写成 visited。有人统计过：这类「一般过去时的样子没变出来」的错误共有 141 例，占动词误用 27.5%，是最常出现的一处。"
  - wrong: During my trip in Europe, I saw some Chinese people in bad manners. They speak and laugh loudly. They throw rubbish everywhere and some of them write their names on the buildings.
    right: During my trip in Europe, I saw some Chinese people in bad manners. They spoke and laughed loudly. They threw rubbish everywhere and some of them wrote their names on the buildings.
    error_type: 叙事时态漂移
    source_type: 学习者语料病例
    diagnosis: 讲一次过去的旅行，第一句 saw 把基调定在过去，后面的 speak、throw、write 却一个个漂回现在时。英语叙事要一句一句守住过去式，框架定了也不能松。〔出处：杨欢腾 2025 语料整段例；病例 VEC-025〕
    diagnosis_kid: "讲一次过去的旅行，第一句 saw 已经把基调定在过去，后面的 speak、throw、write 却一个个漂回了现在时。讲过去的故事要一句一句守住过去式，基调定了也不能松。"
  - wrong: Then a teenager found me and ask me for my mom's telephone number.
    right: Then a teenager found me and asked me for my mom's telephone number.
    error_type: 同句时态漂移
    source_type: 学习者语料病例
    diagnosis: found 已经是过去式，并排的 ask 也要跟着变 asked。同一个句子里，时态要从头守到尾。〔出处：赵柳棚 2026 初二语料例；病例 VEC-026〕
    diagnosis_kid: "found 已经是过去式，并排站着的 ask 也要跟着变 asked。同一个句子里，时态要从头守到尾。"
  - wrong: When I am 13 years old, I don't like to help others.
    right: When I was 13 years old, I didn't like to help others.
    error_type: 过去语境误用现在时
    source_type: 学习者语料病例
    diagnosis: 说的是 13 岁那年的事，am 和 don't 都要改成 was 和 didn't。汉语讲过去靠语境，英语讲过去靠每个动词都变形。〔出处：赵柳棚 2026 初二语料例；病例 VEC-027〕
    diagnosis_kid: "说的是 13 岁那年的事，am 和 don't 都要改成 was 和 didn't。汉语讲过去靠上下文，英语讲过去靠每个动词都变样。"
  relatives:
  - id: TA-16
    rel: 同族
  - id: QI-13
    rel: 同族
  quiz:
  - q: "病例原文（初二学生作文）：「Yesterday I watch a movie.」句中有 yesterday，动词却没换形状——错在哪儿，应该怎么改？"
    answer: "Yesterday I watched a movie.——汉语靠 yesterday 这个词就够了，英语还必须把时间放进动词形状：watch 要加上 -ed 变成 watched（病例分类：规则动词过去式 -ed 遗漏）。（来源：病例 VEC-005）"
    hint: "回机制第 1 节「时间藏在哪里」：汉语时间说成词，英语时间藏在动词形状里"
  - q: "病例原文（初二学生作文）：「They visit the museum last week.」同样的问题又出现了一次——应该怎么改？"
    answer: "They visited the museum last week.——last week 只说了时间，形状还得动词自己扛：visit → visited。汉语是词汇型表时间，英语是形态型——每个句子被迫选时、变形。（来源：病例 VEC-006）"
    hint: "回机制第 1 节「时间藏在哪里」：汉语时间说成词，英语时间藏在动词形状里"
  - q: "病例原文：「Last month, my family go to the beach.」last month 已经把时间说得清清楚楚，句子为什么还是错的？应该怎么改？"
    answer: "Last month, my family went to the beach.——英语没有「时间词在场就可以免变形」的规矩：go 必须换上过去形 went。这正是中国学习者时态错误以「形式缺失」为主的典型形态（病例分类：裸动词表过去）。（来源：病例 VEC-003）"
    hint: "回机制第 1 节「时间藏在哪里」：汉语时间说成词，英语时间藏在动词形状里"
  - q: "把 I played football yesterday. 里的 yesterday 拿走——句子还知道自己是「过去」吗？靠什么知道？ A. 靠 played 的形状  B. 靠猜  C. 不知道了，只能再加时间词"
    answer: "A. 靠 played 的形状——英语把时间藏在动词形状里：去掉时间词，played 的 -ed 还在说话；这正是它和汉语最不一样的地方。（来源：本单元例句）"
    hint: "回机制第 1 节「时间藏在哪里」：汉语时间说成词，英语时间藏在动词形状里"
  - q: "排成「明天我要去上学」这句话，并留意：谈将来，动词那一侧也要做选择，不能只扔一个 tomorrow："
    answer: "I will go to school tomorrow.——形态型语言的规矩：每个限定分句都必须选时。tomorrow 是词，will 是动词侧的选择——两边都做了，句子才完整。（来源：本单元例句）"
    hint: "回机制第 1 节「时间藏在哪里」：汉语时间说成词，英语时间藏在动词形状里"
