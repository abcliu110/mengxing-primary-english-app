  - q: 判断：记动词只记动词本身就够了，搭档用到时按总规则现推。
    answer: 不对。补足语选择是词条级的词汇属性，无总规则可推——记动词须连框架一并记。
    hint: 回主张：动词 + 框架才是记忆单位。
