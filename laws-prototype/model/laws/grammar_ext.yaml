  - q: "排成「我们吃完午饭才去玩」这句话："
    answer: "We had eaten lunch before we played.——过去完成时的积木是 had + 过去分词；这里顺序已由 before 标明，had 用了更清楚、省了也不算错（见本条范围说明）。（来源：本单元例句）"
    hint: "回机制第 1 节「小旗子搬家」：小旗子搬到过去那天，再往旗子前面看"
  - q: "不给时间词，只靠故事的先后：我回到家时，弟弟已经吃完晚饭了（吃完在先、我到家在后）。选： A. My brother had eaten dinner when I got home.  B. My brother eats dinner when I get home.  C. My brother will eat dinner when I get home."
    answer: "A. My brother had eaten dinner when I got home.——叙事点是「我到家」，吃饭在它之前——小旗插在到家这一刻，回头看的那件事用 had eaten。（来源：机械操练题）"
    hint: "回机制第 1 节「小旗子搬家」：小旗子搬到过去那天，再往旗子前面看"
