  - q: "妈妈回家时（小旗插在这里），我的作业在那之前就已经写完了——选： A. I had finished my homework when Mum came home.  B. I finish my homework when Mum comes home.  C. I have finished my homework when Mum came home."
    answer: "A. I had finished my homework when Mum came home.——小旗搬到过去（妈妈回家时），完成时跟着搬家：have finished 变 had finished，事件仍在小旗之前。（来源：本单元例句）"
