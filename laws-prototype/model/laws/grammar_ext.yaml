- id: QI-15
  zone: 语法
  group: QI
  headline: 提问要先有「真缺口」：为不知道而问，形式才记得住
  headline_kid: 假装提问练一百遍，不如真心想知道一件事问一次——心里真有个问号的时候，问句的样子记得最牢
  claim:
    type: tendency
    statement: 交际中的意义协商（澄清、确认、追问）把输入、注意与输出在真实信息差中咬合；有真实信息缺口的提问，其形式记忆与产出显著优于无缺口的机械提问。
    evidence:
    - Long 互动假说（1983/1996）与形式聚焦（1991，见 GR-18）
    - 程晓堂《义务教育英语课程标准（2022 年版）解析》(2022) 学习活动观（学习理解 → 应用实践 → 迁移创新）为本土课程框架；作者为课标编制组核心成员
    scope: 真缺口负责动机与意义锚定，形式准确仍需 GR-17 的注意触发与 GR-18 的形式聚焦补位，三者是流水线关系而非替代关系
    exceptions:
    - note: 无真缺口的机械操练并非全无价值（发音自动化、句型熟悉度），本条只裁定提问形式习得的主通道
      word_ids: []
  mechanism:
  - beat: 真问号的力量
    text_kid: 心里真有个问号时，你会竖起耳朵听答案，问句的样子也记得牢。装样子问一百遍，嘴动了、心没动，形式留不住。
    text_adult: 信息差任务（information-gap）在课堂实验中稳定提高提问产出的数量与准确性；课标把「在活动中学习语言」立为义务教育英语课程的总路径，与之一致。
    visual: 两个问号对比：实心问号（真想知道）旁配耳朵与记忆钉，空心问号（假装问）随风飘走
  examples:
  - level: 1
    sentence: Where is my key? I can't find it!
    scene_note: 真缺口场景：真丢了钥匙才问——动机与意义锚定俱在（场景为课堂信息差任务的登记型设计，非病例）
    supports: claim
    word_ids:
    - G3_Q03
    - G4_0740
  - level: 1
    sentence: What's in the box?
    scene_note: 信息差任务的标本问句：盒子里的东西只有对方知道，问题不得不真问
    supports: claim
    word_ids:
    - G3_Q01
    - G3_P08
    - G1_0994
  error_cases: []
  relatives:
  - id: QI-01
    rel: 同族
  quiz:
  - q: 哪种提问，形式记得最牢？
    options:
    - 心里真有个问号、真想知道时问的
    - 假装提问练一百遍的
    - 跟着录音读的
    answer: 心里真有个问号、真想知道时问的
    hint: 回机制「真问号的力量」：真想知道时耳朵竖起来听答案，问句的样子记得牢。
  - q: 判断：提问只是练句型，真想知道还是假装问，没区别。
    answer: 有区别。有真实信息缺口的提问，其形式记忆与产出显著优于无缺口的机械提问。
    hint: 回主张：意义协商把输入、注意与输出在真实信息差中咬合。
  - q: What's in the box? 为什么这句「不得不真问」？
    options:
    - 盒子里的东西只有对方知道——真信息差
    - 因为 box 是生词
    - 因为老师要求问
    answer: 盒子里的东西只有对方知道——真信息差
    hint: 回机制「真问号的力量」：信息差任务里，问题是真缺口逼出来的。
  - q: 判断：没有真缺口的机械操练全无价值。
    answer: 不对。机械操练对发音自动化、句型熟悉度仍有价值；本条裁定的只是提问形式习得的主通道是真缺口。
    hint: 回主张的例外登记：三者是流水线关系，不是替代关系。
  probes: []
  prereq: []
