    answer: ② → ③ → ①（整存的公式语 → 半成品框架 → 全抽象模具）
    hint: 回机制「一家三代」：背得越多、换得越多，模具越清楚。
  - q: 判断：整句背下来的不算学问，和句型模具互不相干。
    answer: 不对。它们是同一条谱系：公式语经反复变例被部分图式化，最终析出抽象构式。
    hint: 回主张：习得即沿谱系的运动——整存、框架、模具是一家。
  - q: I want ___. 站在谱系的哪一段？
