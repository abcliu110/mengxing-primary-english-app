    hint: "回机制第 1 节「重心滑动」：注意力从「信」滑到「写信这件事做过了」"
  - q: "现代句 I have written the letter. 里，重心滑到了哪里？ A. 信还在不在手里  B. 「我写过了」这件事本身  C. 信写得好不好"
    answer: "B. 「我写过了」这件事本身——重心从「物」滑到「事」：the letter 变成 write 的宾语，have 只剩助动词的工作——这正是完成时的出生过程。（来源：本单元例句）"
    hint: "回机制第 1 节「重心滑动」：注意力从「信」滑到「写信这件事做过了」"
  - q: "拼现代完成时：I have ___ the letter. 空里该放哪个形状？ A. written  B. wrote  C. writing"
    answer: "A. written——再分析之后，紧跟 have 的必须是过去分词 written；wrote 是过去式的位置，writing 是进行体的位置——来历故事解释形状，不代替现代规则（现代定义见 TA-05）。（来源：本单元例句）"
    hint: "回机制第 1 节「重心滑动」：注意力从「信」滑到「写信这件事做过了」"
