- id: QI-13
  zone: 语法
  group: QI
  headline: 英语把疑问词搬到句首，汉语让疑问词留在原地：问句最大的结构差
  headline_kid: 英语提问要把疑问词请到最前面站好；汉语的疑问词老老实实待在答案该在的位置——「你买什么？」的「什么」不用搬家
  claim:
    type: rule
    statement: 英语属 wh-移位型（疑问词前置 + 助动词倒装），汉语属原位型（in-situ，疑问词占据与答语成分相同的位置）；中国学生的疑问句错误多为把汉语的「原位 + 无倒装」整套搬进英语。
    evidence:
    - 连淑能《英汉对比研究》(1993) 英汉疑问句结构对比
    - Ellis《The Study of Second Language Acquisition》(1994 初版 / 2008 第2版, OUP, ISBN 978-0-19-442257-4) 迁移与疑问句发展综述章为习得侧锚
    scope: 英语回声问句合法地保留原位疑问词（You bought WHAT?)，教学中须与迁移错误区分标注，避免把合法形式误纠
  mechanism:
  - beat: 搬家与不搬家
    text_kid: 汉语的疑问词坐在答案的座位上不动；英语的疑问词要搬到队伍最前面，还要把助动词倒过来。学英语提问，就是学这趟搬家。
    text_adult: 学习者产出中 *You want what？（非回声语境）、*What you want？（漏倒装）两类错误呈阶段性分布，与「先迁移原位、再逐步获得前置与倒装」的路径吻合（见 QI-14）。
    visual: 左右对照：汉语侧「什么」留在原座，英语侧 what 搬到句首并带倒装箭头
  examples:
  - level: 1
    sentence: What do you want?
    scene_note: 英语正形：what 前置 + do 倒装
    supports: claim
    word_ids:
    - G3_Q01
    - V6_日常_66
  - level: 1
    sentence: You bought WHAT?
    scene_note: 结构特许：回声问句的原位疑问词是合法的（重读标示），不可误纠（见 scope）
    supports: claim
    word_ids:
    - G3_0650
    - G3_Q01
  error_cases:
  - wrong: What you want?
    right: What do you want?
    error_type: 疑问词已前置但漏倒装（原位系统残留）
    source_type: 教学文献登记错型
    diagnosis: 只搬了疑问词、没搬助动词——汉语「原位 + 无倒装」系统搬了一半（条目支撑登记此错型；回 QI-13 机制节与 QI-04 倒装节）
  - wrong: You want what?
    right: What do you want?
    error_type: 疑问词原位未前置（非回声语境）
    source_type: 教学文献登记错型
    diagnosis: 在非回声语境把汉语原位结构整套搬入英语；须与合法回声问句区分（条目支撑登记此错型）
