    scene_note: 活动——可以一直转的轮子，没有固有终点
    supports: claim
    word_ids:
    - G2_087
  - level: 2
    sentence: She painted a picture.
    scene_note: 完结——有头有尾的一段路，画完为止
    supports: claim
    word_ids:
    - G4_0787
    - G4_158
  - level: 2
    sentence: He found his key.
    scene_note: 达成——瞬间发生，啪的一下
    supports: claim
    word_ids:
    - V6_日常_19
    - G4_0740
  error_cases:
  - wrong: I am knowing the answer.
    right: I know the answer.
    error_type: 状态动词误套进行体
    source_type: 教学文献登记错型
    diagnosis: know 是状态型，没有内部过程可看，进行体的镜头套不上（回 TA-07 机制节；清单支撑登记 *I am knowing 的不可接受性）
