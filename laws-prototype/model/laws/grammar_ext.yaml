  headline: 理解句子时，大脑先认模具、后认动词
  headline_kid: 听一句话，大脑先认出「这是个给东西的句型」，再去听是哪个动词——模具比动词先被认出来
  claim:
    type: tendency
    statement: 母语者给句子分组时按构式（而非主动词）分类者占优，构式义是心理现实的表征单位；该倾向在中国、德国学习者样本中同样复现。
    evidence:
    - Bencini & Goldberg (2000) 句子分类实验（4 动词 × 4 构式 16 句：17 名被试中 7 人完全按构式分类、0 人完全按动词分类、10 人混合，pp.644–647）
    - Liang (2002，中国学习者) 与 Gries & Wulff (2005，德国学习者) 的复现同样呈构式分类倾向
    scope: 被试为成人与青少年，低龄儿童的分类行为未直接验证；教学应用属合理外推，标注待低龄验证（与 TA-18 同规）
    exceptions:
    - note: 实验中多数被试（10/17）是混合分类——构式优先是占优倾向，不是全有或全无
      word_ids: []
  mechanism:
  - beat: 先认队形
    text_kid: 就像先认出「这是排队买票的队形」，再看清排队的是谁——大脑认句子，先认出是哪种句型，再细听动词。
    text_adult: 跨母语背景学习者的两次复现（含中国学习者样本）使结论不局限于英语母语者，为「先教模具戏、再扩动词」提供了直接的心理证据。
