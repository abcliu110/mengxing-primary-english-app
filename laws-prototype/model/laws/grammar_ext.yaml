- id: CO-05
  zone: 语法
  group: CO
  headline: 结果模具：「把某物弄成某个样」——变样的意思来自模具，不在动词里
  headline_kid: paint the door red（把门刷成红色）、wipe the table clean（把桌子擦干净）——「变成什么样」这出戏，是模具安排的，动词只管用什么手法
  claim:
    type: rule
    statement: 结果构式（X causes Y to become Z）贡献「状态变化 + 终点状态」义；动词提供动作方式，结果短语提供终点，两者缺一构不成结果解读。
    evidence:
    - Goldberg (1995) resultative 构式分析（论元结构构式表：X causes Y to become Z）
    scope: 结果状态须是动作可直接达成的（*He sang the baby asleep 中的 sing 需高度语境支持才勉强成立）；小学阶段只用 paint/wipe/make 等原型动词教学
  mechanism:
  - beat: 手法加终点
    text_kid: wipe 只说「擦」，clean 才说「擦成干净的」。一个管怎么动手，一个管变成什么样——合起来才是结果模具的完整意思。
