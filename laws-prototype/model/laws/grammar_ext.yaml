  error_cases:
  - wrong: Tomorrow, I visited my uncle.
    right: Tomorrow, I will visit my uncle.
    error_type: 时态与将来时间状语不匹配
    source_type: 学习者语料病例
    diagnosis: Tomorrow 说的是明天，要借 will 来谈将来：will visit。英语没有「将来时」这个词形，过去式 visited 和 tomorrow 放在一起必然打架。〔出处：张迪 2025 语料例；病例 VEC-031〕
    diagnosis_kid: "Tomorrow 说的是明天，要用 will visit。visited 是过去的事，和 tomorrow 放在一起就打架了。"
