- id: TA-05
  zone: 语法
  group: TA
  headline: 完成体看的是「过去的事和现在的牵连」：痕迹在，事已远
  headline_kid: 完成时不是说「以前做完了」，是说「以前那件事，现在还留着印子」：钥匙丢过——所以现在进不了门
  claim:
    type: rule
    statement: 完成体（perfect）的语义是「过去情境对现在的持续相关性」（the continuing present relevance of a past situation），分结果、经历、近况、持续四种用法，统一于「与现在相连」而非「已完成」。
    evidence:
    - Comrie《Aspect》(1976) pp.52, 56–60：perfect 定义与四用法分类（result / experiential / recent past / persistent situation）
    scope: 「现时相关」是语义统一式而非每句都能直观指认痕迹——经历用法的「痕迹」是经验本身，教学时须如实说这一层，不硬编具体结果
  mechanism:
  - beat: 看痕迹不看完没完
    text_kid: 完成时盯着的是「现在留下的印子」：钥匙丢了（印子：现在进不了门）、去过北京（印子：有了这份经验）。
    text_adult: 四用法共享「锚点在现在」的分布特征（如都拒斥明确过去时间状语，见 TA-06），这是「现时相关」优于「完成」旧解的决定性证据。项目 sf-037/sf-038 已按此口径把旧口诀「过去做完」全量更换。
    visual: 地上脚印（过去的脚步 → 现在的痕迹）图式：脚步在左、痕迹在右并被圈出
  - beat: 何时必须用、何时不能用
    text_kid: 讲机制之外还要给清单：想说「印子还在」时用它；一旦点名昨天几点，就不能用它（TA-06）。
    text_adult: 〔清单 v3 回写·VB-05〕Leech《Meaning and the English Verb》为本条补「选择」操作面：完成体教学须给用法清单与选择框架，以对冲学界对「现时相关」含糊性的批评。
    visual: 两栏选择框：盯着现在结果 → 用完成体；点名过去时间 → 用过去时
  examples:
  - level: 1
    sentence: I have lost my key.
    scene_note: 钥匙丢了——印子是现在进不了门（结果用法；清单儿童版登记例）
    supports: claim
    word_ids:
    - V6_日常_72
    - G4_0740
  - level: 1
    sentence: I have been to Beijing.
    scene_note: 去过北京——印子是经验本身（经历用法；清单边界登记例）
    supports: claim
    word_ids:
    - G3_K01
  - level: 2
    sentence: I have finished my homework.
    scene_note: 作业完成——印子是现在可以玩了（结果用法）
    supports: claim
    word_ids:
    - V6_日常_26
    - G5_215
  - level: 2
    sentence: We have lived here for three years.
    scene_note: 住了三年而且还住着——持续用法，牵连一直连到现在
    supports: claim
    word_ids:
    - G3_0653
    - G2_0595
    - V6_节日_1
  error_cases: []
  relatives:
  - id: TA-06
    rel: 同族
  - id: TA-09
    rel: 同族
  - id: TA-12
    rel: 对照
  - id: TA-16
    rel: 易混
  quiz: []
  probes: []
  prereq:
  - TA-03
  order: 105
  pain_points:
  - 错不完
  adult:
    sources:
    - Bernard Comrie《Aspect》(1976), pp.52, 56–60 — 四用法转述：https://socialsci.libretexts.org/Bookshelves/Linguistics/Analyzing_Meaning_-_An_Introduction_to_Semantics_and_Pragmatics_(Kroeger)/22%3A_Varieties_of_the_Perfect/22.02%3A_Uses_of_the_perfect
    - Leech《Meaning and the English Verb》选择框架（经 VB-05 回写补入）
    boundary: 见 claim.scope。
    disputes:
    - 「现时相关」被批评过于含糊（Dahl & Hedin 2000）；Klein、McCoard（Extended Now）等提出竞争分析。本项目取 Comrie 口径为教学定版并记录分歧
    evidence_grade: 原文级
