- id: TA-03
  zone: 语法
  group: TA
  headline: 体是「看事情的方式」：同一件事，可以看全景，也可以钻进去看中间
  headline_kid: 看一件事像看录像：可以站在远处看完整件，也可以把镜头推进去，只看正在发生的中间一段——选哪种看法，就是选哪种「体」
  claim:
    type: rule
    statement: 体（aspect）是观看一个情境内部时间构成的不同方式：完成体（perfective）把情境作为不可分析的整体呈现，未完成体参照其内部结构呈现。
    evidence:
    - Comrie《Aspect》(1976, CUP) p.3 定义原文：aspects are different ways of viewing the internal temporal constituency of a situation
    scope: 镜头类比只映射「观看方式」这一关系结构，不映射物理相机属性；体的选择还受动词词义约束（见 TA-07）
  mechanism:
  - beat: 全景与特写
    text_kid: 同一件事，可以站在远处看它从头到尾（全景），也可以把镜头推近，只看中间正在动的那一段（特写）。看的方法不同，说出来的样子就不同。
    text_adult: Comrie 的经典定义是体貌类型学的共同出发点；《Aspect》被后续五十年文献标准引用，本域全部「看法」类讲法以此为锚。
    visual: 同一段踢球录像的两个画框：远景全程 vs 推近到脚触球的一瞬
  - beat: 类比的失效处
    text_kid: 镜头是比喻，不是真的照相机：有的动词天生没有「中间一段」可看（比如 know），镜头就推不进去——这是动词的形状决定的（TA-07）。
    text_adult: 类比单设失效声明：镜头可选，体貌选择受动词词义约束；用类比时须声明此边界（技术方案要求）。
    visual: know 的牌子图标旁镜头推近被挡住的示意
  examples:
  - level: 1
    sentence: They built a house.
    scene_note: 站远处看整件事：房子从无到有，一次看完（全景）
    supports: claim
    word_ids:
    - G5_0567
    - V6_家庭_35
  - level: 1
    sentence: They were building a house.
    scene_note: 把镜头推近：只看正在盖的中间一段（钻进去看）
    supports: claim
    word_ids:
    - G5_0567
  - level: 2
    sentence: He ran in the park.
    scene_note: 全景看跑步这件事
    supports: claim
    word_ids:
    - G2_087
    - G2_080
  - level: 2
    sentence: He was running when I saw him.
    scene_note: 我看见他时，他正在跑的中间一段
    supports: claim
    word_ids:
    - G2_087
  error_cases: []
  relatives:
