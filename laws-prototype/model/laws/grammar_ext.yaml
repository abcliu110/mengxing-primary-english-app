  - beat: 推远这一个动作
    text_kid: 把一句话往远处推一推：推到时间远处是「以前」，推到心里远处是「假如」，推到关系远处是「客气」。是同一个动作。
    text_adult: 认识距离（epistemic distance）统一解释时态后退（间接引语）、虚拟条件句、礼貌请求三类表面无关的「过去形」用法，且与世界语言中「过去形表非现实」的普遍对应吻合。
