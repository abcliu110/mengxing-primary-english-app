    text_kid: 还没发生的事，一旦印进火车时刻表、课程表，就像钉在墙上的事实。用现在时说它，借的就是这股「铁板钉钉」的劲儿。
    text_adult: 该用法严格限于制度化时间表语境，「事实化」解释能准确预测其分布边界（对比 *It rains tomorrow 的不可接受性）。
