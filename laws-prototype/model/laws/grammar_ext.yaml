- id: CO-09
  zone: 语法
  group: CO
  headline: 主语是「镜头主角」，不保证是动作的发出者
  headline_kid: 主语是站在舞台正中间的那位：可以是做事的人，也可以是门自己开了（The door opened）时被看的那扇门
  claim:
    type: rule
    statement: 主语是编码 trajector（关系中的首要焦点参与者）的名词，宾语编码 landmark（次要焦点）；施事只是 trajector 的原型而非定义，故中动、存现等句型的主语无需「发出动作」。
    evidence:
    - 'Langacker《Cognitive Grammar: A Basic Introduction》(2008) p.364 图式定义（a nominal that codes the trajector of a profiled relationship）；讲义《The Functional Organization of English Clauses》§8、§21 同一定式'
    scope: 「主角」是注意力概念，不能反推语义角色；判读 The key opened the door 时仍需结合动词与语境区分施事/工具/主题
