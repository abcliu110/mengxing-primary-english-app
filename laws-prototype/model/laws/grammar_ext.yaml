    answer: "B. I wondered if you could help me.——wondered 不是在讲过去，是把请求往远处推——距离感带来礼貌，和时间无关。（来源：本单元例句）"
    hint: "回机制第 1 节「推远这一个动作」：往远处推一推：时间远、心远、关系远，是同一个动作"
  - q: "If I were you, I would say sorry. 这里的 were 在干什么？ A. 在讲昨天的事  B. 把事情推到「假如」的世界里  C. 在说我真的变成了你"
    answer: "B. 把事情推到「假如」的世界里——假设就是把情境推离现实：用过去形 were 标记「这不是真的」，与礼貌、转述是同一个推远动作。（来源：本单元例句）"
    hint: "回机制第 1 节「推远这一个动作」：往远处推一推：时间远、心远、关系远，是同一个动作"
  - q: "把转述句排好：他说他很忙（说话人已经把 is 推远成过去形）："
    answer: "He said he was busy.——转述时主句 said 把整个句子往过去推一格，从句的 is 跟着退成 was——时态后退也是推远。（来源：本单元例句）"
    hint: "回机制第 1 节「推远这一个动作」：往远处推一推：时间远、心远、关系远，是同一个动作"
  - q: "病例原文：「People discovered that traffic jams are caused by narrow roads.」主句已经是过去时，从句却没有跟着「退后」——错在哪儿，应该怎么改？"
    answer: "People discovered that traffic jams were caused by narrow roads.——主句 discovered 把叙事锚点放在过去，从句也要保持呼应（were caused）；are 把从句单独留在现在，时态链就断了（病例分类：时态一致性缺失）。（来源：病例 VEC-028）"
    hint: "回机制第 1 节「推远这一个动作」：往远处推一推：时间远、心远、关系远，是同一个动作"
  - q: "三句都没有时间词，哪一句里的过去形干的不是「讲过去」的活？ A. He said he was busy.  B. She has a red bag.  C. We play games after school."
    answer: "A. He said he was busy.——was 在这里是被 said 推远的转述后退，不是在讲「过去某个时候很忙」——没有时间词也能认出推远的用法。（来源：本单元例句）"
    hint: "回机制第 1 节「推远这一个动作」：往远处推一推：时间远、心远、关系远，是同一个动作"
