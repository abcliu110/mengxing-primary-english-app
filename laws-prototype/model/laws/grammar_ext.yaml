  quiz:
  - q: "哪个动词短语是「静止的牌子」——没有过程、不会变化？ A. I know the answer.  B. The children run in the park.  C. He found his key."
    answer: "A. I know the answer.——know 是状态型：知道就是知道，没有内部过程可看；run 是能一直转的活动，found 是啪的一下的达成。（来源：本单元例句）"
    hint: "回机制第 1 节「四种形状」：形状先看清，再选镜头"
  - q: "She painted a picture. 这个短语的时间形状是哪一种？ A. 能一直转的轮子（没有终点）  B. 有头有尾的一段路（画完为止）  C. 啪的一下（瞬间）"
    answer: "B. 有头有尾的一段路（画完为止）——paint a picture 有固有终点（画完）、又要一步步来，是完结型；光说 paint 活动本身则没有这个终点。（来源：本单元例句）"
    hint: "回机制第 2 节「按短语判断」：看形状要看整个短语，不能只看一个动词"
  - q: "给两个短语配上各自的形状卡（按顺序配对）："
    answer: "run → 轮子（没有终点）；run a mile → 有终点的路——看形状要看整个短语：加上「一英里」这个有界宾语，活动就被装上了终点，变成完结型。（来源：机械操练题）"
    hint: "回机制第 2 节「按短语判断」：看形状要看整个短语，不能只看一个动词"
  - q: "哪件事可以接 for an hour 一直转下去、不用担心它自己会「到头」？ A. The children run in the park.  B. He found his key."
    answer: "A. The children run in the park.——活动型没有固有终点，可以无限延展；达成型的 find 是瞬间事件，撑不了一小时。（来源：本单元例句）"
    hint: "回机制第 1 节「四种形状」：形状先看清，再选镜头"
  - q: "不给时间词，只看形状：He found his key. 里的 find，能不能像跑步那样套上「钻进去看中间」的镜头（was + -ing）？ A. 能，瞬间的事也有很长的中间一段  B. 不能（默认），瞬间的事没有中间一段可看"
    answer: "B. 不能（默认），瞬间的事没有中间一段可看——达成型是「啪的一下」的点，没有内部过程；进行体的镜头要先有过程可看——选镜头之前先看动词的形状（与 TA-03 的失效声明同源）。（来源：本单元例句）"
    hint: "回机制第 1 节「四种形状」：形状先看清，再选镜头"
