- id: CO-14
  zone: 语法
  group: CO
  headline: to 还是 -ing，由前面的动词点名：这是搭配事实，不是自由二选一
  headline_kid: want 身后跟 to，enjoy 身后跟 -ing，像每个人点固定的搭档——记动词的时候，把它的搭档一起记下来
  claim:
    type: rule
    statement: 动词的补足语选择（complementation）是词条级的词汇属性：分布只能逐词登记再成组归纳，无总规则可推；记动词须连其框架一并记（动词 + 框架为记忆单位）。
    evidence:
    - Huddleston & Pullum (2002)《CGEL》动词补足系统章；项目 sf-019 已裁定把旧「to/-ing 二分口诀」改为「动词决定搭配」，sf-035/sf-036（like/love 双搭配）为配套订正
    scope: 存在可归纳的语义倾向群（未来指向多 to、已然活动多 -ing）可作助记，但必须标为 mnemonic/倾向，不得冒充规则
  mechanism:
  - beat: 点名搭档
    text_kid: 每个动词都有自己点名的搭档：want 点 to，enjoy 点 -ing，stop 两个都点、但意思不一样。学动词的时候，把搭档写在同一张卡上。
    text_adult: stop to do（停下来去做）与 stop doing（停下不做）的意义反转等成组事实证明选择与意义挂钩但不可由单一规则生成。
    visual: 动词卡与搭档卡配对陈列：want→to go、enjoy→-ing、stop→两张（义随框架变）
  examples:
  - level: 1
    sentence: I want to go.
    scene_note: want 点名 to——与 CO-13 同句不同焦点（彼管形式面，此管选择面）
