    rel: 前置
  quiz:
  - q: Dad promised me a new bike. 自行车现在到手了吗？
    options:
    - 还没有——这是「答应给」，意图/未来转移
    - 已经到手了
    - 永远不会给了
    answer: 还没有——这是「答应给」，意图/未来转移
    hint: 回机制「一个家族」：答应给是围着「给」转的边缘成员，还没真交到手。
  - q: 判断：只要是双宾句，就表示东西真的交到对方手里了。
    answer: 不对。双宾是多义家族：中心义是成功转移，还有意图转移、使能、阻碍、未来转移等边缘义。
    hint: 回主张：各边缘义由隐喻/实例链与中心义相连，不是同音巧合。
  - q: Mum baked us a cake. 这句在双宾家族里是哪位成员？
    options:
    - 使能转移——做给他，成品即转移物
    - 阻碍——不让他拿到
    - 纯粹状态，没有转移
    answer: 使能转移——做给他，成品即转移物
    hint: 回机制「一个家族」：做给他——给的是成品，与中心义「真给」相连。
  - q: 哪一句是家族的「大哥」（中心义：成功转移）？
    options:
