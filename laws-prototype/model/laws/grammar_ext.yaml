- id: QI-08
  zone: 语法
  group: QI
  headline: 语调是问句的第二套标记：一般疑问常升调、特殊疑问常降调——是常态，不是铁律
  headline_kid: 声音也能提问：Yes/No 问题常把尾巴翘上去，wh- 问题常把尾巴沉下来——像说话自带的标点符号
  claim:
    type: tendency
    statement: 英语以升调标示「开放/待答」、以降调标示「陈述完成」的韵律图式与句类形成统计配对：一般疑问句常升调、特殊疑问句常降调；语调与词序标记互为备份，口语中单靠语调也能构成问句（回声问句）。
    evidence:
    - Quirk et al. (1985) 语调与句类章的系统描写；Swan《Practical English Usage》问句语调条为学习者版口径（两书均为 domains.yaml 登记的基准来源）
    scope: 本条只作倾向呈现；不得据此给学生的语调判「错」
    exceptions:
    - note: 英式礼貌性升调、美式 uptalk、惊讶语境的降调 Yes/No 问句等变异普遍存在
      word_ids: []
  mechanism:
  - beat: 声音的标点
    text_kid: 句尾声音往上翘，像在说「我还没说完，等你答」；往下沉，像在说「我说完了」。Yes/No 问题爱翘尾巴，wh- 问题爱沉尾巴——但只是习惯，不是规矩。
    text_adult: 语调配对在朗读与自然会话语料中呈强统计规律；儿童听辨实验中语调是早于词序被利用的问句线索。
    visual: 两条声调曲线：升调箭头配「Are you ready?」、降调箭头配「Where are you going?」
  examples:
  - level: 1
    sentence: Are you ready? ↗
    scene_note: 一般疑问句常升调（箭头为语调标记，非句中词）
    supports: claim
    word_ids:
    - ADD_0614
  - level: 1
    sentence: Where are you going? ↘
    scene_note: 特殊疑问句常降调
    supports: claim
    word_ids:
    - G3_Q03
    - V6_日常_1
  error_cases: []
  relatives:
  - id: QI-04
    rel: 同族
  quiz:
  - q: 听读 Are you ready?——这是一般疑问句（等对方答 yes 或 no）。它的句尾最常怎么走？
    options:
    - 往上翘（升调 ↗）
    - 往下沉（降调 ↘）
    - 每个词读得一样重、一样平
    answer: 往上翘（升调 ↗）
    hint: 回机制「声音的标点」：句尾往上翘，像在说「我还没说完，等你答」；一般疑问句常升调。
  - q: 把两句问话和它们最常见的句尾配成对：① Are you ready? ② Where are you going?（句尾只有两种：升调 ↗、降调 ↘）
    answer: ① Are you ready? 配升调 ↗（一般疑问句常升调）；② Where are you going? 配降调 ↘（特殊疑问句常降调）。
    hint: 回主张：语调与句类形成统计配对——一般疑问常升调、特殊疑问常降调；这是常态配对，不是逐句硬性规定。
  - q: 判断：同学把 Are you ready? 的句尾读得往下沉，所以这句一定读错了。
    answer: 不对。本条口径明定：升降调与句类的配对是常态、不是铁律（礼貌性升调、惊讶语境的降调 Yes/No 问句等变异普遍存在），不得据语调倾向给学生的语调判「错」。
    hint: 回主张的范围：本条只作倾向呈现；不得据此给学生的语调判「错」。
  - q: 你说 I am going home. 同伴没听清，把你的话换了个人称重复一遍确认：You are going home?——句子的词序一点没变，这句话靠什么变成问句的？
    options:
    - 句尾往上翘的语调
    - 多加了一个问词
    - 把声音喊得特别大
    answer: 句尾往上翘的语调
    hint: 回主张：语调与词序标记互为备份，口语中单靠语调也能构成问句（回声问句）。
