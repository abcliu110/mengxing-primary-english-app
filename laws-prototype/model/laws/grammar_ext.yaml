- id: TA-15
  zone: 语法
  group: TA
  headline: 汉语靠词和语境表时间，英语靠动词变形：每个英语句子被迫选时
  headline_kid: 汉语说「昨天、明天」几个词就够了，时间在词里；英语把时间藏在动词的形状里，每说一句都要选一次——这就是中国孩子总漏 -ed 的原因
  claim:
    type: rule
    statement: 汉语是「词汇型」时间表达（时间词 + 了/过/着等体貌助词，无强制时态范畴），英语是「形态型」强制表达（每个限定分句必须做时态选择）；系统差异决定了时态形式是中国学习者的结构性难点而非态度问题。
    evidence:
    - 连淑能《英汉对比研究》(1993) 英汉时态表达方式对比
    - 项目 dom-contrast-pitfalls 纲领登记的错误分布（时态形式居中国学生写作错误前列）为实证侧锚
    scope: 对比的是编码位置（词 vs 动词形态）；汉语并非「没有时间表达」，讲授时须防止学生误读为「汉语落后」式表述
  mechanism:
  - beat: 时间藏在哪里
    text_kid: 汉语把时间明明白白说成词：「昨天」一出口，人人都懂。英语不说时间词也行，但动词必须换形状——形状就是它藏时间的地方。
    text_adult: 中国学习者时态错误以「形式缺失/误选」为主而非「时间概念错误」：访谈中学生能准确报告事件时间，证明缺的是形态习惯而非时间观念。
    visual: 左右对照：汉语侧时间词被圈出（昨天/明天），英语侧动词的 -ed 被圈出
  examples:
  - level: 1
    sentence: I played football yesterday.
    scene_note: 英语：时间既在 yesterday 里、更在 played 的形状里——去掉 yesterday 句子仍知是过去
    supports: claim
    word_ids:
    - G2_0489
    - G3_0401
    - G4_0415
