- id: CO-02
  zone: 语法
  group: CO
  headline: 双宾模具自带「让某人收到某物」：bake 进去，就长出「给」义
  headline_kid: 「我烤她一块蛋糕」——bake 本来只管烤，可一放进「人 + 人 + 东西」的模具，句子自己就多出「给她」的意思
  claim:
    type: rule
    statement: 双宾构式的中心义是图式化的「X causes Y to receive Z」（施事使接受者收到客体）；动词只需提供完成转移的方式，转移义由构式供给。
    evidence:
    - Goldberg (1995) 双宾构式分析（中心义与多义网络）
    scope: 构式对入模动词有语义门禁——接受者须可识解为有生接收者、施事须带意志性；纯状态/言说类动词被拒（见 CO-03）
  mechanism:
  - beat: 模具自带「给」
    text_kid: 「谁 + 谁 + 东西」这个队形一站好，「给」的意思自己就来了。动词只负责说清楚「用什么办法给」：烤着给、做着给、递着给。
    text_adult: bake、build、make 等本无「给」义的动词入模后稳定获得转移解读；母语者对新造动词（如 moop）放入双宾句也能即时读出转移义，证明意义来自模具。
    visual: 「人+人+东西」队形图式，中间浮出一个大大的「给」字，动词卡从上方插入队形
  examples:
  - level: 1
    sentence: He baked her a cake.
    scene_note: 纲领与条目共同登记的核心例——bake 长出「给」义
    supports: claim
