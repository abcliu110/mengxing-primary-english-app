  prereq:
  - QI-02
  order: 303
  pain_points:
  - 记不住
  adult:
    sources:
    - Mitchell & Robinson《A Guide to Old English》第8版 (2012), §20, p.19（2026-11-01 打开原书格变表核实）— 侧证：https://zaguan.unizar.es/record/57052/files/TAZ-TFG-2016-1839.pdf?version=1
    boundary: 见 claim.scope。
