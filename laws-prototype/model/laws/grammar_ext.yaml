- id: QI-04
  zone: 语法
  group: QI
  headline: 提问的动作 = 把助动词举到主语前面：被举到前面的，总是排第一的那个助动词
  headline_kid: 把陈述句变成问题，像把排头兵喊到队伍最前面：Has she ...? Did you ...?——被喊出来的，永远是第一个助动词
  claim:
    type: rule
    statement: 一般疑问句由助动词—主语倒装构成，倒装对象是限定动词链的首个助动词（无助动词时由 do 补位，见 GR-03）；疑问词问句在此基础上再加疑问词前置。
    evidence:
    - Swan《Practical English Usage》§509.4 原文：Questions normally have the order auxiliary verb – subject – main verb；CGEL 的主语—助动词倒装（subject-auxiliary inversion）分析与之同构
    scope: 间接疑问句不倒装（Do you know where she was?)、主语疑问句（Who came?）无倒装对象，两者是结构特许而非例外失误，须同框教学
  mechanism:
  - beat: 排头兵出列
    text_kid: 队伍里排第一的助动词被喊到最前面，问句就成了。没有助动词的时候，请 do 来当排头兵：Did you ...?
    text_adult: 该一条统摄 be/have/情态/do 四类提问形式；中国学生高频错误 *You are happy？（口语回声问句除外）与 *Does she likes 均可在此定位（后者还叠加 GR-02 的单次标记）。
    visual: 一列士兵（助动词—主语—主动词），排头兵迈步到队首，问号升起
  examples:
  - level: 1
    sentence: Has she got a pet?
    scene_note: 条目儿童版登记例型——has 是排头兵
    supports: claim
    word_ids:
    - G3_KA07
    - G2_P04
  - level: 1
    sentence: Did you see the film?
    scene_note: 条目儿童版登记例型——无助动词时 do 补位出列
    supports: claim
    word_ids:
    - V6_MORPH_24
    - G1_P02
    - V6_日常_17
  - level: 2
    sentence: Who came yesterday?
    scene_note: 结构特许：主语疑问句没有可倒装的对象，不倒装（见 scope）
    supports: claim
    word_ids:
    - G3_Q02
    - V6_日常_2
  error_cases: []
  relatives:
  - id: QI-01
    rel: 前置
  - id: QI-13
    rel: 同族
  quiz:
  - q: 改错：Does she likes apples?
    answer: Does she like apples.（does 已扛起时态，主动词须回原形）
    hint: 回机制「排头兵出列」：被举到前面的助动词扛起时态，后面的动词不落箭头、回原形。
  - q: Has she got a pet? 里被喊到队伍最前面的是谁？
    options:
    - has——排第一的助动词
    - she
    - got
    answer: has——排第一的助动词
    hint: 回机制「排头兵出列」：倒装对象总是限定动词链的首个助动词。
  - q: 没有助动词时请 do 补位：把「你看过这部电影」变成一般疑问句。（see 的过去式是 saw，问句里用原形 see）
    answer: Did you see the film?
    hint: 回机制「排头兵出列」：无助动词时 do 补位出列，并扛起过去时态。
  - q: 判断：Who came yesterday? 没有倒装，所以是错句。
    answer: 不对。主语疑问句没有可倒装的对象，是结构特许，不是失误。
    hint: 回主张的范围：间接疑问句不倒装、主语疑问句无倒装对象，须同框教学。
