- id: CO-01
  zone: 语法
  group: CO
  headline: 句型模具本身带意思：整句的意义大于动词意思之和
  headline_kid: 句型像模具：面团（动词）倒进不同的模具，出来的点心味道就不一样——多出来的味道，是模具给的
  claim:
    type: rule
    statement: 构式是形式—意义的配对体；当整体意义不能由动词与词序规则完全预测时，剩余意义由构式本身贡献——模具本身带意思。
    evidence:
    - 'Goldberg《Constructions: A Construction Grammar Approach to Argument Structure》(1995, University of Chicago Press) — 构式语法奠基专著，本域纲领 coreView 的直接来源'
    scope: 构式义解释的是论元结构层面的意义增量，不接管词形（时态、单复数）与词汇细节（见 CO-16）
  mechanism:
  - beat: 模具给味
    text_kid: 同样的面团（同一个动词），倒进星形模具出来是星星味，倒进方形模具出来是方形味。多出来的那份味道，不是面团的，是模具的。
    text_adult: 该框架能用同一机制同时解释构式的能产性（新动词入模长新义）与限制性（某些动词被拒），是传统「动词决定论」做不到的双向解释。
    visual: 一团面团分倒进三个模具，出来的点心形状各异，模具被高亮标注「味道来源」
  examples:
  - level: 1
    sentence: He baked her a cake.
    scene_note: 纲领 coreView 登记例：bake 本无「给」义，双宾模具给了它「给」味
    supports: claim
    word_ids:
    - G5_0793
    - G1_048
  - level: 1
    sentence: They painted the door red.
    scene_note: 结果模具给 paint 加上「变成红色」的结果味（详见 CO-05）
    supports: claim
    word_ids:
    - G4_0787
    - G1_0932
    - G1_034
  - level: 2
    sentence: She gave him a book.
    scene_note: 双宾模具的原型成员——转移义与模具义在此重合
    supports: claim
    word_ids:
    - V6_日常_8
    - G1_002
