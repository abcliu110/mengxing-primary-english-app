- id: CO-03
  zone: 语法
  group: CO
  headline: 有些动词进不了双宾模具：意思不合是一关，词的「长相」也是一关
  headline_kid: explain、donate 想进双宾模具会被挡在门外：它们只好走 to 的小路（explain this to me）——一个因为意思不对路，一个还因为词太长、重音不在前面
  claim:
    type: rule
    statement: 动词进入双宾构式须过两关：宽域规则要求动词义含「有意致使拥有转移」；窄域规则再按动词的语义小类与形态音位（本族单音节/首重读可入，拉丁源多音节非首重读抗拒）逐类准入，两关皆过才能进双宾，否则只能走 to 式。
    evidence:
    - Pinker《Learnability and Cognition》(1989, MIT Press) 宽/窄域规则（拉丁源限制见 p.46 的自我限定：关键在形态音位而非词源本身）
    - 'Gropen, Pinker et al. (1989), Language 65: 203–257 配套实证'
    scope: 窄域小类靠逐类习得，没有一条规则能全自动预测每个动词的去向；新动词须查证/语感积累。项目句型④定版（explain/say/donate 只能 to 式）与此一致
  mechanism:
  - beat: 两道门
    text_kid: 双宾模具门口有两位门卫：一位看意思（是不是「有心把东西给出去」），一位看长相（词短不短、重音在不在前面）。explain 意思不对路，donate 长相不过关，都被请去走 to 的小路。
    text_adult: 该分析能预测儿童与成人对真词（donate/explain）和新造词的双宾可接受性判断差异，是「语义 + 词形」双因素的经典证据。
    visual: 模具门口两道门：意思门（爱心+包裹图标）、长相门（音节秤），explain 与 donate 被引导向 to 小路
  examples:
  - level: 1
    sentence: Please explain this to me.
    scene_note: explain 走 to 小路的正形（与病例错形对照）
    supports: claim
    word_ids:
    - V6_学校_79
    - G3_P08
    - G1_P01
  - level: 1
    sentence: She gave me the book.
    scene_note: give 两关皆过——双宾正形
    supports: claim
    word_ids:
    - V6_日常_8
    - G1_002
  - level: 2
    sentence: They donated books to our school.
    scene_note: donate 拉丁源多音节、重音不在前——走 to 式
    supports: claim
    word_ids:
    - G1_002
    - G2_081
    - ADD_0484
  error_cases:
  - wrong: Explain me this.
    right: Explain this to me.
    error_type: 言说类动词误入双宾构式
    source_type: 条目成人层登记的事故例
    diagnosis: explain 不含「致使拥有转移」义，过不了宽域关；纲领 coreView 与本条目共同登记此错形（回 CO-03 机制节）
  relatives:
  - id: CO-02
    rel: 前置
  quiz: []
  probes: []
  prereq:
  - CO-02
  order: 203
  pain_points:
  - 错不完
  adult:
    sources:
    - 'Steven Pinker《Learnability and Cognition: The Acquisition of Argument Structure》(1989), MIT Press — https://en.wikipedia.org/wiki/Dative_shift ；窄域规则讨论：https://www.sid.ir/en/VEWSSID/J_pdf/87620060102.pdf'
    - 'Gropen, Pinker et al. (1989), Language 65: 203–257'
    boundary: 见 claim.scope。
    disputes:
    - Groefsema (2001) 等指出拉丁源形态音位限制的解释覆盖不足，语义因素的权重应更高；本条保留 Pinker 双层说并注明此分歧
