- id: QI-11
  zone: 语法
  group: QI
  headline: 选择问句不用 Yes / No 回答：人家给了选项，要选一个
  headline_kid: Do you want tea or juice? 是让你二选一，答 Yes 就像没听清——要选茶，还是选果汁
  claim:
    type: rule
    statement: or-问句预设答语从给定选项中选取（选择问句），与极性问句（yes-no）是两种不同的问句图式；答语形式由问句图式决定——选择问句选一项，不答 Yes/No。
    evidence:
    - Swan《Practical English Usage》问句条（or-questions 与 yes-no questions 的答语分工）；Quirk et al. (1985) 选择疑问句（alternative questions）分析同口径
    scope: 当 or 只连接修饰成分而非选项（如 Would you like tea or coffee with your meal？的歧读）时需结合语调判断图式，属教师备课注意点
  mechanism:
  - beat: 先认图式再答
    text_kid: 听到 or，先想：这是让我选一个，还是问我对不对？给选项的题，答案就是选项里的一个——说出你要的那个就行。
    text_adult: 答非所问类偏误在中国学生口语测试中稳定出现，且经「图式—答语配对」一次点破后纠正率显著，是分工说（QI-01）的直接应用证据。
    visual: 两扇门（tea / juice）图式，Yes 卡被打上「答非所问」的标记
  examples:
  - level: 1
    sentence: — Do you want tea or juice? — Juice, please.
    scene_note: 条目儿童版登记例型——从选项里选一个作答
    supports: claim
    word_ids:
    - G2_0944
    - G1_051
  - level: 1
    sentence: — Shall we walk or take a bus? — Let's walk.
    scene_note: 选项是动作时同样选一项（可带完整句）
    supports: claim
    word_ids:
    - V6_交通_52
    - G2_105
  error_cases: []
  relatives:
  - id: QI-01
    rel: 同族
  quiz:
  - q: 答非所问，改过来：— Do you want tea or juice? — Yes.
    answer: — Juice, please.（or-问句是选择图式，答语须从选项中选取）
    hint: 回机制「先认图式再答」：给选项的题，答案就是选项里的一个。
  - q: — Shall we walk or take a bus? 哪个回答对图式？
    options:
    - Let's walk.
    - Yes.
    - No.
    answer: Let's walk.
    hint: 回机制「先认图式再答」：选项是动作时同样选一项，可带完整句。
  - q: 判断：只要句子里有 or，就一定是选择问句。
    answer: 不一定。or 只连接修饰成分而非选项时可能有歧读，需结合语调判断图式（教师备课注意点）。
    hint: 回主张的范围：答语形式由问句图式决定，先认图式再答。
  - q: 老师问：Do you want tea or juice? 你要果汁。怎么答？
    answer: Juice, please.
    hint: 回机制「先认图式再答」：说出你要的那个选项就行。
  probes: []
