  headline: 英语先立骨架再挂修饰，汉语先铺垫后点题：两种句子建筑术
  headline_kid: 英语盖房子先立柱子（谁做了什么），再往四周加房间；汉语像讲故事，先把前因后果铺好，最后一句才点出正题
