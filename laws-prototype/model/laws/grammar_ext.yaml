  - q: "Our lesson starts at eight tomorrow. 明明是明天的课，starts 为什么用现在时？ A. 因为课正在上  B. 因为课程表把明天的课预先写成了已定的事实  C. 因为 starts 是过去式"
    answer: "B. 因为课程表把明天的课预先写成了已定的事实——一般现在时的核心语义包含「图式化的、已确立的事实」；日程表把未来事件制度化，借的正是这股铁板钉钉感。（来源：本单元例句）"
    hint: "回机制第 1 节「写进表里的未来」：印进时刻表的事像钉在墙上的事实，用现在时说它"
  - q: "三句里哪一句不成立？ A. The film begins at seven tonight.  B. It rains tomorrow.  C. Our lesson starts at eight tomorrow."
    answer: "B. It rains tomorrow.——天气没有被写进任何时刻表，不是已确立的事实，借不到现在时——本条范围说明登记 *It rains tomorrow 不成立；预言天气要用 will 或 going to。（来源：机械操练题）"
    hint: "回机制第 1 节「写进表里的未来」：印进时刻表的事像钉在墙上的事实，用现在时说它"
  - q: "排成节目单上的这句话——动词就用现在时，不请 will 来："
    answer: "The film begins at seven tonight.——节目单语境里，未来的开演时间是已排定的事实，动词用一般现在时 begins（三单 -s），这是 futurate present 的固定积木。（来源：本单元例句）"
    hint: "回机制第 1 节「写进表里的未来」：印进时刻表的事像钉在墙上的事实，用现在时说它"
  - q: "墙上贴着今晚的节目单，你指着它说电影几点开演——目标句里不出现 tonight，选： A. The film begins at seven.  B. The film will begin when we are ready.  C. The film began at seven."
    answer: "A. The film begins at seven.——节目单在墙上就是「事实」的来源，场景本身代替了时间词：已排定的节目用现在时 begins。（来源：机械操练题）"
    hint: "回机制第 1 节「写进表里的未来」：印进时刻表的事像钉在墙上的事实，用现在时说它"
