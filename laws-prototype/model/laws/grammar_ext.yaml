- id: TA-05
  zone: 语法
  group: TA
  headline: 完成体看的是「过去的事和现在的牵连」：痕迹在，事已远
  headline_kid: 完成时不是说「以前做完了」，是说「以前那件事，现在还留着印子」：钥匙丢过——所以现在进不了门
  claim:
    type: rule
    statement: 完成体（perfect）的语义是「过去情境对现在的持续相关性」（the continuing present relevance of a past situation），分结果、经历、近况、持续四种用法，统一于「与现在相连」而非「已完成」。
    evidence:
    - Comrie《Aspect》(1976) pp.52, 56–60：perfect 定义与四用法分类（result / experiential / recent past / persistent situation）
    scope: 「现时相关」是语义统一式而非每句都能直观指认痕迹——经历用法的「痕迹」是经验本身，教学时须如实说这一层，不硬编具体结果
  mechanism:
  - beat: 看痕迹不看完没完
    text_kid: 完成时盯着的是「现在留下的印子」：钥匙丢了（印子：现在进不了门）、去过北京（印子：有了这份经验）。
