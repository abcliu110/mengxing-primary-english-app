- id: TA-16
  zone: 语法
  group: TA
  headline: 「了 / 过」≠ 现在完成时：对得上的只有一部分
  headline_kid: 汉语的「了」是「做成了」，「过」是「经历过」；英语完成时管的是「和现在有牵连」——三个人长得有点像，但不是同一个人
  claim:
    type: tendency
    statement: 汉语「了」（情境的实现/完成）与「过」（经验体）与英语 perfect 的「现时相关」仅在结果持续与经历两处部分重叠，在持续义、近况义等处系统错位，直译对应必然产生偏误。
    evidence:
    - 连淑能《英汉对比研究》(1993) 时体对比框架；项目方法研究已登记「了/过 ≠ 现在完成时」为具体错位点（domains.yaml dom-contrast-pitfalls basis）
    scope: 错位是部分而非全无对应——教学中逐用法对比，不做整体否定
    exceptions:
    - note: 经历义对应度较高：「过」与 experiential perfect 基本对得上（I have been to Beijing），是重叠区而非错位区
      word_ids:
      - G3_K01
  mechanism:
  - beat: 三张脸对位
    text_kid: 「了」管做成没做成，「过」管经历没经历，完成时管「跟现在还有没有关系」。有的地方三人站成一队，有的地方各站各的——要一张一张脸对，不能整队搬。
    text_adult: 学习者典型错误（*I have done my homework yesterday、把「我去过北京」与「我丢了钥匙」用同一逻辑套 have done）均是错位映射的直接产物。
    visual: 三个头像（了/过/perfect）的对照表：结果、经历两行打勾同队，持续、近况两行分开站
  examples:
  - level: 1
    sentence: I have been to Beijing.
    scene_note: 「过」与经历完成时对得上的重叠区
    supports: claim
    word_ids:
    - G3_K01
    grp: 「过」对得上的地方：经历
    src:
      k: orig
  - level: 1
    sentence: She has been to the zoo.
    scene_note: 她去过动物园：这里和「过」对得上——说的是经历
    supports: claim
    word_ids: []
