  headline: 致使移动模具：喷嚏也能「打飞」一张餐巾纸
  headline_kid: sneeze 本来只是打喷嚏，放进「把某物弄到某处」的模具——Sam sneezed the napkin off the table——喷嚏就有了把餐巾纸喷下桌的本事
  claim:
    type: rule
    statement: 致使移动构式（X causes Y to move Z）自带「致使客体沿路径移动」义；不及物动词入模后由构式补足致使与路径论元，动词只提供致使的方式。
    evidence:
    - 'Goldberg (1995) 论元结构构式表中的 caused-motion 构式；sneeze 例为该书标志性例句 (1995: 29)'
    scope: 入模要求可识解的物理致使链；纯心理/状态动词不可（*He knew the ball over the fence），这是构式义与动词义相容性在起作用
