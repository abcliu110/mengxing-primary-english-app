- id: CO-13
  zone: 语法
  group: CO
  headline: 一个分句只有一台「上牌发动机」：限定动词管时态，to do / doing 是不上牌的零件
  headline_kid: 一个小句子里，只有一个动词能落上时态箭头当发动机；跟在后面的动词不落箭头，穿上 to 或 -ing 的工作服——所以 I want go 少了工作服就出厂不合格
  claim:
    type: rule
    statement: 英语分句的限定性（时态/一致）只能实现一次；非限定形式（不定式、动名/分词）不携带独立时态锚点，其时间解读依附于主分句——这一结构事实决定了动词搭配的形式面。
    evidence:
    - Huddleston & Pullum (2002)《CGEL》限定/非限定分句分析；项目 g40-one-finite「一个分句一个限定动词」为已入模口径
    scope: 本条只管形式面（第二动词穿哪件工作服由 CO-14 管）；并列谓语（come and see）是共享一台发动机的特许结构，不属违规
  mechanism:
  - beat: 箭头只落一次
    text_kid: 时态箭头一个小句子只落一次，落在第一个动词上。后面的动词不能抢箭头，要换上工作服：to 或者 -ing。
    text_adult: 该条统摄 I want to go / I enjoy swimming / He stopped to smoke 等大批用例的形式面；学生漏 to、错用原形的高频错误皆可定位为「第二动词没穿工作服」。
    visual: 一列动词卡：第一张带动词线、线中点落向下箭头，后面的分别穿 to 与 -ing 工作服
  examples:
  - level: 1
    sentence: I want to go home.
    scene_note: 条目支撑登记例——want 落箭头，go 穿 to 工作服
    supports: claim
    word_ids:
    - V6_日常_66
    - V6_日常_1
  - level: 1
    sentence: I enjoy swimming.
    scene_note: 条目支撑登记例——第二动词穿 -ing 工作服（swimming 的词元 swim 归一）
    supports: claim
    word_ids:
    - G4_0876
  - level: 2
    sentence: He stopped to smoke.
    scene_note: 条目支撑登记例——stop 落箭头，后动词 to 式
    supports: claim
    word_ids:
    - V6_交通_34
    - V6_自然_25
  error_cases: []
  relatives:
  - id: CO-14
    rel: 同族
  quiz:
  - q: 改错：I want go.
    answer: I want to go.（want 已占用唯一的限定位置，go 必须穿非限定工作服 to go）
    hint: 回机制「箭头只落一次」：时态箭头一个分句只落一次，后面的动词不落箭头、穿工作服。
  - q: I enjoy swimming. 里，落着时态箭头的是谁？穿工作服的是谁？
    options:
    - enjoy 落箭头，swimming 穿 -ing 工作服
    - swimming 落箭头，enjoy 穿工作服
    - 两个都落箭头
    answer: enjoy 落箭头，swimming 穿 -ing 工作服
    hint: 回机制「箭头只落一次」：限定性只能实现一次，非限定形式依附于主分句。
  - q: 判断：He stopped to smoke. 里 stop 和 smoke 都落着时态箭头。
    answer: 不对。一个分句的时态箭头只落一次：stop 落箭头，smoke 穿 to 工作服出现。
    hint: 回主张：非限定形式不携带独立时态锚点。
  - q: 给 go 穿上工作服，拼好整句：I want ___ home.
    answer: to go（I want to go home.）
    hint: 回机制「箭头只落一次」：want 先落箭头，go 穿 to 工作服跟随。
