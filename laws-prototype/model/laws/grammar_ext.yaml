- id: CO-17
  zone: 语法
  group: CO
  headline: 英语把「做事」交给空心动词：动词管语法，名词装事情；get 一个词收成五个构造
  headline_kid: have、take、make、give 像四个空杯子，自己没味道，倒进什么名词就是什么味：have a look 是「看一看」，take a shower 是「洗个澡」，make a decision 是「做决定」。get 是个万能插头：收到、变得、到达、被动味、说动人，五格插座
  claim:
    type: rule
    statement: 英语表达「做事」的主力模具是「空心动词 + 事件名词」：have、take、make、give、get、do 等动词词汇意义抽空、只管时态人称，语义重心在名词短语里（去词汇化）；这类结构须整块学，不背义项。get 的核心用法收成五个构造：① get + 名词 = 接收/得到；② get + 形容词 = 变得；③ get + to + 地点 = 到达；④ get + 过去分词 = 被动味（事情落在自己身上）；⑤ get + 人 + to do = 说动/使。
    evidence:
    - Collins COBUILD English Grammar (1990) p.147 空心动词（delexical verbs）描写：核心成员 give、get、keep、have、make、take、do、set，成员极少而结构极常见
    - Lewis《The Lexical Approach》(1993) 词汇法：语块为教学基本单位
    - get 五构造已逐项打开 Collins 词典 get 条核对（receive / become / arrive / get 被动 / persuade 五组释义与例句齐备，词典条目原文级）
    scope: 五构造是核心构造不是全集（get to do = 有机会做、get + -ing = 启动、get = 懂等边缘构造另有其位）；「空心」是近似说法，空心动词间仍有搭配分工残迹（shower 配 take/have、noise 配 make、speech 配 give），不可讲成完全可互换
  mechanism:
  - beat: 空杯子装事情
    text_kid: have、take、make、give 是空杯子：杯子只管端得稳（时态、人称），味道全在倒进去的名词里。have a look、take a shower、make a decision——整块端走，不拆开背。
    text_adult: 去词汇化（delexicalization）：动词的词汇意义抽空、只留语法功能，语义重心转移到名词短语。British Council LearnEnglish 的 delexical verbs 教学页与 COBUILD 描写互证。
    visual: 四个空杯子各倒进一个事件名词，杯身浮出整块短语卡
    anchors:
    - V6_日常_16
    - ADD_0070
  - beat: get 五格插座
    text_kid: get 是万能插头，看它后面插什么：插名词是「收到」，插形容词是「变得」，插地点是「到达」，插过去分词是「事情落到自己身上」，插「人 + to do」是「说动他去做」。
    text_adult: 五构造分类与 Collins 词典 get 条的义项组织逐项对应，例句均按词典原例登记（见 examples）。先立五构造，其余遇见再添。
    visual: 五格插座板，每格一个构造骨架与一枚例句牌
    anchors:
    - V6_日常_0
    - V6_P14
    - G4_0859
    - V6_家庭_34
    - ADD_0187
    - G3_0442
  examples:
  - level: 1
    sentence: Have a look!
    scene_note: 空心结构标本（Collins/COBUILD 与 British Council 教学页共同登记例）：have 管语法，look 装事情
    supports: claim
    word_ids:
    - V6_日常_16
  - level: 1
    sentence: Make a decision.
    scene_note: 同上登记例：make a decision 整块学（decision 为 CO-17 搭配构成词，已由补词波次入词库口径登记）
    supports: claim
    word_ids:
    - ADD_0070
  - level: 1
    sentence: Give me a call.
    scene_note: 规范形是 give sb a call——sb 是占位符（此处由 me 填充），不入词库、不计库外词；清单边界已纠正任务书缺宾语的 *give a call
    supports: claim
    placeholder: sb
    word_ids:
    - V6_日常_8
    - G5_K03
  - level: 2
    sentence: I got a letter yesterday.
    scene_note: 构造①（清单机制登记原例）：get + 名词 = 接收
    supports: claim
    word_ids:
    - V6_日常_0
    - V6_P14
    - G4_0415
  - level: 2
    sentence: It's getting dark.
    scene_note: 构造②（清单机制登记原例）：get + 形容词 = 变得
    supports: claim
    word_ids:
    - V6_日常_0
    - G4_0859
  - level: 2
    sentence: We got to the station at six.
    scene_note: 构造③（清单机制登记原例）：get + to + 地点 = 到达
    supports: claim
    word_ids:
    - V6_日常_0
    - G4_0517
    - G1_027
  - level: 2
    sentence: He got hit by a car.
    scene_note: 构造④（清单机制登记原例，Collins get 条同例）：get + 过去分词 = 被动味
    supports: claim
    word_ids:
    - V6_日常_0
    - ADD_0149
    - G1_043
  - level: 2
    sentence: They got married.
    scene_note: 构造④的另一登记原例（Collins）；married 归一为 marry
    supports: claim
    word_ids:
    - V6_日常_0
    - ADD_0187
  - level: 2
    sentence: I got him to help me.
    scene_note: 构造⑤（清单机制登记原例）：get + 人 + to do = 说动/使
    supports: claim
    word_ids:
    - V6_日常_0
    - G3_0442
  - level: 3
    sentence: She got angry.
    scene_note: 构造②的 Collins 登记例（get angry / get sick 组）
    supports: claim
    word_ids:
    - V6_日常_0
    - G6_280
  - level: 3
    sentence: We got home late.
    scene_note: 构造③的 Collins 登记例（get home late / get to London 组）
    supports: claim
    word_ids:
    - V6_日常_0
    - V6_家庭_34
    - G4_K05
  error_cases: []
  relatives:
  - id: CO-02
    rel: 同族
  - id: CO-12
    rel: 前置
  - id: CO-08
    rel: 同族
  quiz:
  - q: They got married. 里的 get 是哪个构造？
    options:
    - ① get + 名词 = 得到
    - ④ get + 过去分词 = 被动味（事情落在自己身上）
    - ⑤ get + 人 + to do = 说动
    answer: ④ get + 过去分词 = 被动味（事情落在自己身上）
    hint: 回五构造表——married 是什么词形？「结婚」是他们主动「得到」的，还是事情落在他们身上？
  - q: It's getting dark. 里的 get 是什么意思？
    options:
    - 得到
    - 变得（get + 形容词）
    - 到达
    answer: 变得（get + 形容词）
    hint: 回五构造表第②行——get 后面跟的是 dark，这个词是什么词性？
  - q: I got him to help me. 里 get 的活是？
    options:
    - 接收
    - 变得
    - 说动 / 使（get + 人 + to do）
    answer: 说动 / 使（get + 人 + to do）
    hint: 回五构造表第⑤行——get 后面先站了 him，又跟了 to help，这个形状对哪一行？
  probes:
  - PRB-CO17-1
  - PRB-CO17-2
  - PRB-CO17-3
  - PRB-CO17-4
  - PRB-CO17-5
  prereq:
  - CO-12
  order: 217
  pain_points:
  - 说不出
  - 记不住
  adult:
    sources:
    - Collins COBUILD English Grammar (1990), p.147（接触等级：二手转引级，经同行评审期刊论文转引核实）
    - 'Francis, Hunston & Manning《Collins COBUILD Grammar Patterns 1: Verbs》(1996), HarperCollins（接触等级：书目+综述级）'
    - Michael Lewis《The Lexical Approach》(1993), Language Teaching Publications（接触等级：二手系统论述级，经 ELT 综述与原文引文核实）
    - Collins 词典 get 条（五构造逐项核对，接触等级：词典条目原文级）；British Council LearnEnglish delexical verbs 教学页互证
    boundary: 见 claim.scope；give sb a call 的 sb 为占位符，按设计登记为 placeholder，不入词库。
    disputes:
    - 词汇法的理论地位有争论：批评者指「语块」「搭配」多为既有概念的重命名，词汇法更像大纲重心之争而非新理论（ELT Concourse 综述）；但分歧不落在「空心结构按块教」这一具体主张上，该主张在 COBUILD 描写传统与主流教材中已是共识操作
