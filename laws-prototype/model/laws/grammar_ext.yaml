- id: CO-12
  zone: 语法
  group: CO
  headline: 构式和语块是同一条谱系：从整块背下的句子，到半成品框架，到全抽象模具
  headline_kid: 背下来的整句话、能换零件的半截话、看不见摸不着的句型模具，是一家三代：背得越多，模具越清楚
  claim:
    type: tendency
    statement: 语言单位构成大小不一的图式谱系：公式语（整存）经反复变例使用被部分图式化，最终析出抽象构式；习得即沿此谱系的双向运动。
    evidence:
    - Goldberg (1995) 构式作为习得单位的主张，与 Lewis (1993) 词汇法、Wray (2002) 公式语研究在谱系两端互证（见 GR-20）
    scope: 谱系是描写框架，不预言每个学习者必经全部阶段；课堂中显性点破模具可加速图式化，不必苦等自然析出
    exceptions:
    - note: 显性教学可跳步加速——谱系描述的是自然涌现常态，不是必经之路
      word_ids: []
  mechanism:
  - beat: 一家三代
    text_kid: 整句话是爷爷（整块背）、半截话是爸爸（能换零件）、句型模具是孙子（看不见的机关）。背得越多、换得越多，孙子越清楚。
    text_adult: 儿童语言中「先整块、后析出」的个案轨迹（CO-10）与成人加工中公式语的速度优势（GR-20）分别锚定谱系的两端证据。
    visual: 三代同堂图：整句卡 → 带空格框架卡 → 抽象模具轮廓，箭头双向
