- id: CO-08
  zone: 语法
  group: CO
  headline: 被动句是「换主角」，不是「没人做主语时的救急」
  headline_kid: 同一件事，镜头对准做事的人是主动，对准被收拾的东西就是被动——The window was broken 是想让大家看窗户怎么样了
  claim:
    type: rule
    statement: 主/被动之别是焦点参与者的选择：被动把受事（landmark）提升为首要焦点（trajector）占据主语位，施事降格或隐去；事件内容不变，「戏的站位」改变。
    evidence:
    - 'Langacker 认知语法的 trajector/landmark 分析（被动 = landmark 提升为 trajector），见《Cognitive Grammar: A Basic Introduction》(2008) p.364 图式定义；CGEL 被动章的信息结构动机互证'
    scope: 小学阶段只建立「换主角」的直觉与最常用形式（be + 过去分词），by 短语的取舍、得被动（get-passive，见 CO-17 构造④）等细节后置
  mechanism:
  - beat: 谁站中间
    text_kid: 一件事里有两个人选：做事的和被收拾的。谁站到舞台正中间当主角，句子就围着谁说。被动句，就是让被收拾的那位站中间。
    text_adult: 被动在语篇中的实际分布（科技写作、新闻标题中受事为话题时高频）与「话题连续性」预测一致，远超「施事不明时才用」的旧解释所能覆盖的范围。
    visual: 舞台聚光灯在「男孩」与「窗户」之间切换，两句台词随之换主语
  examples:
