  quiz:
  - q: He baked her a cake. 里 bake 本来只有「烤」的意思，整句却多出一层意思——是哪一层？
    options:
    - 「给她」——模具多给的意思
    - 烤的火候
    - 蛋糕的味道
    answer: 「给她」——模具多给的意思
    hint: 回机制「模具给味」：多出来的味道不是面团（动词）给的，是模具给的。
  - q: 判断：They painted the door red. 里「把门变成红色」这层意思，全都装在 paint 一个词里。
    answer: 不对。paint 只管「刷」这个手法，「变成红色」是结果模具给的——red 是终点。构式义就是动词之外多出来的那份意义。
    hint: 回 CO-01 机制：整体意义不能由动词完全预测时，剩余意义由构式贡献。
  - q: 用双宾模具拼句：她给了他一本书。（give 的过去式是 gave）
    answer: She gave him a book.
    hint: 回机制「模具给味」：双宾模具是原型成员，转移义与模具义在此重合。
  - q: 同一个 bake：He baked a cake. 和 He baked her a cake. 哪一句里有人「收到」蛋糕？
    options:
    - He baked her a cake.
    - He baked a cake.
    - 两句都有
    answer: He baked her a cake.
    hint: 回机制「模具给味」：多出的「给」义来自双宾模具，不来自 bake。
