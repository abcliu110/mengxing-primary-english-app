    - 程晓堂《改什么？如何教？怎样考？——义务教育英语课程标准（2022 年版）解析》(2022), 外语教学与研究出版社 — https://flts.bnu.edu.cn/index.php/node/15082
    boundary: 见 claim.scope 与 exceptions。
