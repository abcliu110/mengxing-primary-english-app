- id: QI-10
  zone: 语法
  group: QI
  headline: How 与 What 分工：一个问「怎么样/用什么法子」，一个问「是什么东西」
  headline_kid: 想知道「是什么」派 What，想知道「怎么做、怎么样」派 How——派错了词，答案就会答非所问
  claim:
    type: rule
    statement: how 的语义辖域是方式、程度与状态（手段义源于其工具格出身，见 QI-03)，what 的辖域是事物身份与类别；What ... like?、How ... look? 等固定搭配是两辖域边界上的约定用法，须整组登记。
    evidence:
    - 项目 grammar.yaml g32-how-what「How 问方式/程度，What 问事物本身」为已入模口径；Swan《Practical English Usage》how/what 相关条目为学习者侧锚
    scope: How do you do / How are you 等礼貌套语已公式化，不按辖域分析（按语块处理，见 GR-20)
  mechanism:
  - beat: 派对侦察兵
    text_kid: What 是问「东西」的侦察兵，How 是问「办法和样子」的侦察兵。去学校「坐什么车、怎么去」是办法——派 How；「那是什么」是东西——派 What。
    text_adult: 中国学生典型偏误（*What do you go to school？ 应为 How）与两词辖域的错位精确对应，是按辖域教学优于按词翻译的直接证据。
    visual: 两个侦察兵卡：What 头顶一个问号包裹（东西），How 头顶一条路线（办法）
  examples:
  - level: 1
    sentence: How do you go to school?
    scene_note: 问办法——派 How（与病例错形对照）
    supports: claim
    word_ids:
    - G3_Q08
    - V6_日常_1
    - G2_081
  - level: 1
    sentence: What is this?
    scene_note: 问东西——派 What
    supports: claim
    word_ids:
    - G3_Q01
    - G3_P08
  - level: 2
    sentence: What is the weather like today?
    scene_note: 边界约定用法：What ... like? 问样子，整组登记，不按辖域硬拆
    supports: claim
    word_ids:
