    text_kid: 句尾声音往上翘，像在说「我还没说完，等你答」；往下沉，像在说「我说完了」。Yes/No 问题爱翘尾巴，wh- 问题爱沉尾巴——但只是习惯，不是规矩。
    text_adult: 语调配对在朗读与自然会话语料中呈强统计规律；儿童听辨实验中语调是早于词序被利用的问句线索。
