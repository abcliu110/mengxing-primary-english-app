- id: TA-07
  zone: 语法
  group: TA
  headline: 动词自带「时间形状」：有的事有终点、有的事是瞬间、有的状态没有过程可看
  headline_kid: 动词像不同形状的玩具：run 是可以一直转的轮子，build a house 是有头有尾的一段路，know 是静止的牌子——形状不对，镜头（进行时）就套不上
  claim:
    type: rule
    statement: 动词短语自带情状类型（Vendler 四型：状态 / 活动 / 完结 / 达成），由词义决定其与进行体、时间状语的兼容性：状态无内部变化、活动无固有终点、完结有终点且渐进、达成是瞬时。
    evidence:
    - Vendler "Verbs and Times" (The Philosophical Review 66(2), 1957, 143–160) — 词汇体（Aktionsart）奠基论文
    scope: 分类单位是动词短语而非孤立动词（run 与 run a mile 分属活动与完结）；语境可强迫转换（如广告式 I am loving it），教学时按短语整体判断
  mechanism:
  - beat: 四种形状
    text_kid: know 是静止的牌子（没有过程），run 是能一直转的轮子（没有终点），paint a picture 是一段有头有尾的路，find 是啪的一下（瞬间）。形状先看清，再选镜头。
    text_adult: 四型分类能系统预测 *I am knowing 的不可接受性、in an hour / for an hour 状语的配对差异，是后续体貌研究（包括 Comrie）的共同出发点。
    visual: 四个形状图标：牌子（状态）、轮子（活动）、有终点的路（完结）、闪光点（达成）
  - beat: 按短语判断
    text_kid: 同一个 run，光跑步是轮子，加上「一英里」就变成有终点的路——看形状要看整个短语，不能只看一个动词。
    text_adult: 情状类型由动词短语整体（动词 + 宾语的量化性质等）决定，这是 Vendler 分类的单位口径。
    visual: run 与 run a mile 并排，形状从轮子变成有终点的路
