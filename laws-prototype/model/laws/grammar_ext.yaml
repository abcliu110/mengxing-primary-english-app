- id: CO-06
  zone: 语法
  group: CO
  headline: 双宾模具是一个「意思家族」：从真给出去，到打算给、答应给
  headline_kid: 双宾模具像一家人：大哥是「真把东西给了他」，弟弟妹妹们是「答应给他」「做给他看」「不让他拿到」——长得像，脾气各不同，但都围着「转移」转
  claim:
    type: rule
    statement: 双宾构式义是围绕中心义组织的多义网络：成功转移为中心义，引申出意图转移、使能、阻碍、未来转移等边缘义，各义由隐喻/实例链与中心相连，而非同音巧合。
    evidence:
    - Goldberg (1995) 双宾构式的系统多义（systematically related senses）分析
    scope: 多义网络用于教师备课与释义组织；对小学生只呈现中心义与最常用的意图义（bake/make 给），边缘义随阅读自然遇见再点破
  mechanism:
  - beat: 一个家族
    text_kid: 双宾句有个大家长：「真把东西交到他手里」。其他成员像亲戚：答应给（还没给）、做给他（给的是成品）、不让他拿到（把转移挡回去）——都围着「给」转。
    text_adult: 边缘义（如 refuse him entry 的「拒绝转移」）仍唤起转移图式并能预测其句法行为，随机罗列说无法解释这种系统性。
    visual: 家族树图：中心「成功转移」居中，意图/使能/阻碍/未来四条枝向外伸展
  examples:
  - level: 1
    sentence: She gave him a book.
    scene_note: 中心义：成功转移
    supports: claim
    word_ids:
    - V6_日常_8
    - G1_002
  - level: 1
    sentence: Dad promised me a new bike.
    scene_note: 意图/未来转移：答应给，还没到手
    supports: claim
    word_ids:
    - G2_0973
    - ADD_0607
  - level: 2
    sentence: Mum baked us a cake.
    scene_note: 使能转移：做给他——成品即转移物（与 CO-02 同例不同读法，教学中并置）
    supports: claim
    word_ids:
    - G5_0793
    - G1_048
  error_cases: []
  relatives:
