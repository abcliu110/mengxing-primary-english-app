- id: TA-06
  zone: 语法
  group: TA
  headline: 现在完成时不能点名过去时间：*I have seen him yesterday 为什么错
  headline_kid: 完成时的眼睛盯着「现在」，你一旦说出「昨天几点」这种明确的过去时间，等于把它的眼睛硬掰回过去，句子就别扭了
  claim:
    type: rule
    statement: 现在完成时把参照点设在说话现在，明确的过去时间状语要求把事件定位锚回过去，两套定位互相冲突，故完成时不能与 yesterday、last night、in 2019 等明确过去时间状语同现；点名时间讲过去是一般过去时的职责。
    evidence:
    - Comrie (1976) 现时相关框架的直接推论；CGEL 次级时态分析（perfect 事件时间不与参照时间等同）
    scope: 美式口语中偶见完成时与明确过去状语的松动用法（如媒体快讯体），属语体变异，不改变教学定版判据
  mechanism:
  - beat: 两套定位打架
    text_kid: 完成时说「我盯着现在」；yesterday 说「回到昨天去」。一句话里两个命令相反，句子就坏了。想点名时间，就换过去时来讲。
    text_adult: 该对立能批量预测 since/for 可用、yesterday/last night/in 2019 不可用，是完成时教学中可证伪性最强的一条判据（domains.yaml 本域 unifies 定版对立点）。
