    right: I know the answer.
    error_type: 状态动词误套进行体
    source_type: 教学文献登记错型
    diagnosis: know 是状态型，没有内部过程可看，进行体的镜头套不上（回 TA-07 机制节；清单支撑登记 *I am knowing 的不可接受性）
