    right: Does she like apples?
    error_type: 倒装后主动词未恢复原形（时态重复标记）
    source_type: 教学文献登记错型
    diagnosis: does 已扛起时态，主动词须回原形（条目支撑登记此错型，叠加 GR-02 单次标记；回 QI-04 机制节）
  relatives:
