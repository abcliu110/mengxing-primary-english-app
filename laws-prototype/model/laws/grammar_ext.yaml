- id: QI-01
  zone: 语法
  group: QI
  headline: 疑问词各管一块拼图：问句是按「缺哪块信息」分工合作的
  headline_kid: who 找人、where 找地方、when 找时间——每个疑问词负责打听一件事，先想清楚你缺哪一块，再派哪个词去问
  claim:
    type: rule
    statement: 特殊疑问句的结构是「已知框架 + 一个空缺」；疑问词标明空缺的语义类型（人/物/时/地/因/法），答语只需填入该类型的信息，问答由此构成最小协作单元。
    evidence:
    - Quirk, Greenbaum, Leech & Svartvik《A Comprehensive Grammar of the English Language》(1985, Longman) 疑问系统章；项目 INTERROGATIVE_RADAR_DB 与 grammar.yaml g31-wh-words 的定版组织即按此分工
    scope: 修辞问句与回声问句（You did WHAT?）不服从此分工，属语用移用；小学阶段只教信息问句原型
  mechanism:
  - beat: 缺哪块派谁
    text_kid: 问句像一幅缺了一块的拼图：缺人派 who，缺地方派 where，缺时间派 when。先看清缺的是哪一块，再派对词。
    text_adult: 问答配对的类型一致性（问 when 必答时间）是会话分析与语言测试的共同基础；儿童最早的疑问词习得呈「按信息类型逐个扩展」的轨迹。
    visual: 拼图板缺一块，who/where/when/why 四块拼图在旁待选，缺口形状与答案类型对应
  examples:
  - level: 1
    sentence: Who is your teacher?
    scene_note: 缺的是「人」——派 who
    supports: claim
    word_ids:
    - G3_Q02
    - G1_007
  - level: 1
    sentence: Where is my book?
    scene_note: 缺的是「地方」——派 where
    supports: claim
    word_ids:
    - G3_Q03
    - G1_002
  - level: 2
    sentence: When is your birthday?
    scene_note: 缺的是「时间」——派 when
    supports: claim
    word_ids:
    - G5_Q04
    - G2_0413
  - level: 2
    sentence: Why are you late?
    scene_note: 缺的是「原因」——派 why（答语分工见 QI-09）
    supports: claim
    word_ids:
    - G5_Q05
    - G4_K05
  error_cases: []
  relatives:
  - id: QI-04
    rel: 同族
  - id: QI-10
    rel: 同族
  - id: QI-09
    rel: 同族
  quiz:
  - q: 你想问「你的生日是哪天」，缺的是哪块拼图、该派谁？
    options:
    - 时间——派 when
    - 地方——派 where
    - 人——派 who
    answer: 时间——派 when
    hint: 回机制「缺哪块派谁」：先看清缺的是哪一块，再派对词。
  - q: 拼问句：缺的是「地方」——「我的书在哪儿？」
    answer: Where is my book?
    hint: 回机制「缺哪块派谁」：问句是「已知框架 + 一个空缺」，where 标明空缺是地方。
  - q: Who is your teacher? 的答语要填哪种信息？
    options:
    - 人
    - 地方
    - 原因
    answer: 人
    hint: 回主张：疑问词标明空缺的语义类型，答语只需填入该类型的信息。
  - q: 判断：疑问词可以随便派，听的人会自己猜。
    answer: 不对。问答是最小协作单元：派错词，答语就填不进空缺。
    hint: 回机制「缺哪块派谁」：who 找人、where 找地方、when 找时间，各管一块。
