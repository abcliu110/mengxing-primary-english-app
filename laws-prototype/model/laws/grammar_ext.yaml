- id: QI-02
  zone: 语法
  group: QI
  headline: 疑问词与指示词是两个词族：wh- 与 th- 从未互变，「换字母得答词」是假规律
  headline_kid: where、what 是一家人，there、that 是另一家人——两家只是长得有点像，谁也不是谁变出来的
  claim:
    type: etymology
    statement: 英语疑问词继承印欧词干 *kʷo-（古英语拼作 hw-），指示词继承 *to-（古英语 þ-)，近指 here 一系另属 *ḱe- 词干；三条谱系在词源学上彼此独立，拼写相似是语音演变的表面结果——wh- 与 th- 从未互变。
    evidence:
    - 通行印欧词源学 + Mitchell & Robinson《A Guide to Old English》hw- 词族形态（domains.yaml 本域 basis 登记）
    - 古英语文献中 hw- 疑问词与 þ- 指示词的完整平行词表（hwā/hwæt 对 þā/þæt）可直接查证
    source: 疑问词 ← 印欧 *kʷo-；指示词 ← *to-；近指 ← *ḱe-。项目已裁定旧「wh- 换 th-/h- 即得回答词」为伪构词律、降格押韵口诀，真框架由 T05-accurate 承载
    scope: 押韵口诀可保留为纯助记（mnemonic 型），但必须显性标注「口诀不是词源」，与真词源分栏呈现（见 DESIGN §3.2 对 mnemonic 须挂 linkedClaim 的要求；口诀本体入模时另立 mnemonic 条并回连本条）
  mechanism:
  - beat: 两家的家谱
    text_kid: where、what、who 住在一个老院子里（hw- 家）；there、that、the 住在另一个院子（þ- 家）。两家门牌长得有点像，但谁也不是从谁家搬出来的。
    text_adult: 两套词干在更早的印欧语阶段即已分立；拼写相似源于后世语音演变，不构成派生关系。
    visual: 两棵家谱树并立：hw- 树挂疑问词，þ- 树挂指示词，中间一道「从未互变」的界线
  examples:
  - level: 1
    sentence: Where is the cat?
    scene_note: hw- 家成员出场：where 问地方
    supports: claim
    word_ids:
    - G3_Q03
  - level: 1
    sentence: The cat is there.
    scene_note: þ- 家成员作答：there——答词与问词不是一家，更不是换个字母变出来的
    supports: claim
    word_ids:
    - G2_0596
  - level: 2
    sentence: — What is that? — That is a bird.
    scene_note: what（hw- 家）与 that（þ- 家）在同一组问答里同框——像，不等于变
    supports: claim
    word_ids:
    - G3_Q01
    - G3_P08
  error_cases: []
  relatives:
  - id: QI-03
    rel: 同族
  quiz:
  - q: 判断：there 是把 where 的第一个字母换成 t 变出来的。
    answer: 不对。wh- 与 th- 是两个词族——疑问词出自 hw- 家，指示词出自 þ- 家，从未互变；长得像只是语音演变的表面结果。
    hint: 回机制「两家的家谱」：两家门牌有点像，谁也不是从谁家搬出来的。
  - q: — What is that? — That is a bird. 这组问答里，问词和答词是一家人吗？
    options:
    - 不是——两家只是长得像
    - 是——that 是 what 换字母变出来的
    - 是——there 专门由 where 变成答词
    answer: 不是——两家只是长得像
    hint: 回机制「两家的家谱」：what 在 hw- 家，that 在 þ- 家，同框出现也不互变。
  - q: The cat is there. 里的 there 属于哪一家？
    options:
    - 指示词 þ- 家
    - 疑问词 hw- 家
    answer: 指示词 þ- 家
    hint: 回主张：指示词继承 *to- 词干（古英语 þ-），与疑问词谱系独立。
  - q: 判断：有押韵口诀说「where 变 there」，所以这是真词源，可以这样教。
    answer: 不对。口诀只能保留为纯助记，且必须显性标注「口诀不是词源」，与真词源分栏呈现。
    hint: 回主张的范围：mnemonic 须挂回本条，与真词源分栏。
