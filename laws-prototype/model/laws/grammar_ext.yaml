    answer: What do you want?（只搬疑问词不够，还要把助动词倒装过来）
    hint: 回机制「搬家与不搬家」：英语提问要学这趟搬家——前置 + 倒装两件一起做。
  - q: 在普通提问（不是回声问句）里，哪句是正形？
    options:
    - What do you want?
    - You want what?
    - What you want?
    answer: What do you want?
    hint: 回机制「搬家与不搬家」：汉语原位 + 无倒装整套搬进英语，就是这两类错形。
  - q: 判断：You bought WHAT? 疑问词没搬家，所以是错句。
    answer: 不对。回声问句合法地保留原位疑问词（重读标示），须与迁移错误区分，不可误纠。
    hint: 回主张的范围：结构特许与迁移错误同框标注。
