- id: TA-14
  zone: 语法
  group: TA
  headline: 讲故事可以把过去拉到眼前：历史现在时是「演」不是「说错」
  headline_kid: 讲故事讲到紧张处，可以把过去的事当成正在发生来演——So he opens the door ...——听的人像站在现场一样
  claim:
    type: tendency
    statement: 历史现在时是叙事者切换识解方式、把过去事件置于「虚拟的说话现在」中呈现以提高临场感的语篇手段；它本身无独立意义，与过去时的交替切换才是叙事分段标记，集中出现在故事高潮段。
    evidence:
    - Wolfson "The Conversational Historical Present Alternation", Language 55(1), 1979, 168–182（项目于 2026-11-01 补核销项）；后续专著 CHP (Foris, 1982)
    - 项目 domains.yaml PITFALLS_DB 天坑 08 已登记：历史现在时注，「必须强制变过去式」改「默认」
    scope: 小学阶段只作「认得出、不误判为错误」的被动知识，不要求学生产出
    exceptions:
    - note: 正式书面叙述仍以过去时为默认——历史现在时是口头叙事的语体手段，不覆盖书面规范
      word_ids: []
  mechanism:
  - beat: 演与说
    text_kid: 平时讲故事用过去时是「说」；讲到最紧张的地方，突然改成现在时，就像演员上场「演」给大家看——这不是说错了，是故意拉近。
    text_adult: 英语口头叙事语料中历史现在时集中出现在故事高潮段，是叙事结构研究的稳定观察（项目内登记口径）。
    visual: 故事时间轴：平静段用过去时色块，高潮段突然切换成「现场直播」画框
