  error_cases:
  - wrong: He finished his homework.
    right: He has finished his homework.
    error_type: 完成体助动词遗漏
    source_type: 学习者语料病例
    diagnosis: 这句话的语境要说「已经做完了」：完成体不能只剩分词 finished，助动词 has 不能丢——has 加分词，两个零件都在才叫完成体。〔出处：胡晓、冯姗 2026 归类为助动词缺失；病例 VEC-010〕
    diagnosis_kid: "这句话要说的是「已经做完了」，要用完成时：has 加 finished，两个零件都在才行。只剩一个 finished，把 has 丢了，就不完整。"
  - wrong: The number of cars increase rapidly in recent years.
    right: The number of cars has increased rapidly in recent years.
    error_type: 该用完成时误用一般现在时
    source_type: 学习者语料病例
    diagnosis: in recent years 说的是从过去延续到现在的变化，要用完成时 has increased；只用 increase，就把这条延续线掐断在今天。〔出处：田彤 2026 高一语料例；病例 VEC-011〕
    diagnosis_kid: "in recent years 说的是从过去一直延续到现在的变化，要用 has increased。只用 increase，这条从过去连到现在的线就像被掐断在今天。"
  - wrong: I live here since 2020.
    right: I have lived here since 2020.
    error_type: 该用完成时误用一般现在时
    source_type: 学习者语料病例
    diagnosis: 从 2020 年一直住到现在，since 拉起的这条线要用完成时 have lived 才接得通。汉语的「住」不用变样，英语的持续线必须靠 have 加分词拉住。〔出处：张辉 2023 语料研究（经张迪 2025 转引）；病例 VEC-012〕
    diagnosis_kid: "从 2020 年一直住到现在，这条线要用 have lived 才接得通。汉语的「住」不用变样，英语里表示一直持续，要靠 have 加分词拉住。"
