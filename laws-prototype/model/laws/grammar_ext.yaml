  headline: to 还是 -ing，由前面的动词点名：这是搭配事实，不是自由二选一
  headline_kid: want 身后跟 to，enjoy 身后跟 -ing，像每个人点固定的搭档——记动词的时候，把它的搭档一起记下来
  claim:
    type: rule
    statement: 动词的补足语选择（complementation）是词条级的词汇属性：分布只能逐词登记再成组归纳，无总规则可推；记动词须连其框架一并记（动词 + 框架为记忆单位）。
