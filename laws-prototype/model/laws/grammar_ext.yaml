  quiz:
  - q: "病例原文：「He finished his homework.」语境是「老师问作业能不能交」，这句丢了一个关键的小帮手——错在哪儿，应该怎么改？"
    answer: "He has finished his homework.——要盯着现在的结果（能交作业了），必须用完成时；病例把助动词 has 丢了，只剩过去分词，完成时就散了架（病例分类：助动词缺失）。（来源：病例 VEC-010）"
    hint: "回机制第 1 节「看痕迹不看完没完」：完成时盯着「现在留下的印子」"
  - q: "钥匙丢了，你正站在家门口进不去——要说的重点是「现在这个结果」。选： A. I have lost my key.  B. I lose my key.  C. I lost my key at school this morning."
    answer: "A. I have lost my key.——完成时看的是过去的事留在现在的痕迹：丢钥匙的痕迹就是现在进不了门，锚点在现在。（来源：本单元例句）"
    hint: "回机制第 1 节「看痕迹不看完没完」：完成时盯着「现在留下的印子」"
  - q: "病例原文：「I live here since 2020.」从 2020 年一直住到现在——动词的形状却没把这段「连到现在」的时间说出来。应该怎么改？"
    answer: "I have lived here since 2020.——since 2020 给的是从过去连到现在的一段，完成时才接得住（持续用法）；只用 live，等于把锚点只钉在现在这一刻，断了和过去的牵连。（来源：病例 VEC-012）"
    hint: "回机制第 1 节「看痕迹不看完没完」：完成时盯着「现在留下的印子」"
  - q: "排成「住了三年，而且还住着」这句话："
    answer: "We have lived here for three years.——持续用法的积木：have + lived 把三年的线一直拉到现在，for three years 正是这条线的长度。（来源：本单元例句）"
    hint: "回机制第 1 节「看痕迹不看完没完」：完成时盯着「现在留下的印子」"
  - q: "不给时间词。北京你去过了，照片还在手机里，这份经验现在就在你身上——选： A. I have been to Beijing.  B. I go to Beijing.  C. I am going to Beijing."
    answer: "A. I have been to Beijing.——经历用法的痕迹就是经验本身：不点名任何过去时间，只说这件事和现在的你有牵连，用完成时。（来源：本单元例句）"
    hint: "回机制第 1 节「看痕迹不看完没完」：完成时盯着「现在留下的印子」"
