  - level: 2
    sentence: Yesterday I was at home.
    scene_note: 昨天：连 be 都要换成 was——藏形的地方一个都跑不掉
    supports: claim
    word_ids:
    - V6_家庭_34
    grp: 边界：be 的形也要跟着换
    src:
      k: gen
      f: was
      from: TA-15 exs[0] 对照框
      slots: {}
  - level: 2
    sentence: Tomorrow I will be at home.
    scene_note: 明天：be 要借 will 变成 will be
    supports: claim
    word_ids:
    - V6_家庭_34
    grp: 边界：be 的形也要跟着换
    src:
      k: gen
