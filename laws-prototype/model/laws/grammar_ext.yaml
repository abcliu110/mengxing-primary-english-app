    answer: 不是一堆。分堆看的是模具：它不是双宾模具，没有「谁给谁」的队形。
    hint: 回机制「先认队形」：先认队形，再看排队的是谁。
  - q: 判断：构式优先是全有或全无的——要么全按模具分，要么全按动词分。
    answer: 不对。实验中多数被试（10/17）是混合分类——构式优先是占优倾向，不是全有或全无。
    hint: 回主张的例外登记：倾向是统计占优，不是铁律。
