  - q: "排成当场承诺的这句话（will 紧贴主语，动词用原形跟在后面）："
    answer: "I will help you with your homework.——will 是借来的情态帮手，位置在主语之后；它后面的动词永远用原形 help，不加 -s、不加 -ed。（来源：本单元例句）"
    hint: "回机制第 1 节「旧义的残影」：will 老脾气没全改，像拍着胸脯说「我看准了」"
  - q: "不给时间词。朋友抱着一大摞书摇摇晃晃，你脱口而出——选： A. I will help you!  B. I helped you.  C. I help you every day."
    answer: "A. I will help you!——没有计划、没有预兆、没有时间词，凭的就是当场乐意：这是 will 意愿残影最浓的出场方式。（来源：机械操练题）"
    hint: "回机制第 1 节「旧义的残影」：will 老脾气没全改，像拍着胸脯说「我看准了」"
  - q: "判断口气：I will help you with your homework. 这句里的 will，味道最接近哪一个？ A. 人已经在路上了  B. 我乐意，我答应  C. 时刻表上定死的"
    answer: "B. 我乐意，我答应——will 的老祖宗是「想要」：承诺式的 will 把说话人的立场带进了句子；「已经在路上」是 going to 的味道（TA-11），「定死」是时刻表的味道（TA-13）。（来源：本单元例句）"
