- id: QI-09
  zone: 语法
  group: QI
  headline: Why 的回答多用 Because，但不是「必用」：问目的时 To / For 同样正宗
  headline_kid: Why 像问「为啥呀」：可以答原因（Because ...)，也可以答目的（To get some books. = 为了借书）——看问的人想知道哪一种
  claim:
    type: tendency
    statement: why 同时询问原因（reason）与目的（purpose）；答语形式随所问维度分工——because 从句答原因，不定式/介词短语答目的，二者皆为原生用法而非省略或错误。「必用 Because」是已废止的一刀切口径。
    evidence:
    - 项目三处定版裁定（INTERROGATIVE_RADAR T11、grammar.yaml g31-why-answer、expressions 包 L-3 同错三处统一）：「Because 最稳妥」由应试口径承载，「必用 Because」降格废止
    - Quirk et al. (1985) 原因/目的状语的区分是其学术侧锚
    scope: 应试场景中 Because 答句最完整稳妥；本条纠正的是「必用」的绝对化，不鼓励以碎片答语替代完整句训练
    exceptions:
    - note: 目的答语即本断言的合法另一半：Why did you go? — To see a friend. 母语语料中高频自然，测试若只认 Because 会误判合法答语（与 G28 填空题误判同类事故）
      word_ids:
      - V6_日常_17
      - G3_130
  mechanism:
  - beat: 先听清问的是哪一种
    text_kid: Why 有时问「为什么会这样」（原因），有时问「为了干什么」（目的）。先听清是哪一种，再选答法：原因用 Because，目的用 To。
    text_adult: 母语语料中目的答语高频自然；本项目已立「测验答案独立复算」之规，防止只认 Because 的评分误判。
    visual: Why 分岔路：左路牌「原因 → Because ...」、右路牌「目的 → To ...」
  examples:
  - level: 1
    sentence: — Why are you wet? — Because it rained.
    scene_note: 问原因——because 从句作答
    supports: claim
    word_ids:
    - V6_核心_60
    - G2_0502
  - level: 1
    sentence: — Why did you go there? — To see a friend.
    scene_note: 清单支撑登记例——问目的，不定式作答，同为正宗
    supports: claim
    word_ids:
    - V6_日常_17
    - G3_130
  - level: 2
    sentence: — Why did she go to the library? — To get some books.
    scene_note: 条目儿童版登记例（To get some books = 为了借书）
    supports: claim
    word_ids:
    - G4_184
    - G1_002
  error_cases: []
  relatives:
  - id: QI-01
    rel: 前置
  quiz:
  - q: — Why are you wet? 问的是原因。哪个答语对？
    options:
    - Because it rained.
    - To get some books.
    - Yes, I am.
    answer: Because it rained.
    hint: 回机制「先听清问的是哪一种」：原因用 Because 答。
  - q: — Why did she go to the library? 她是去借书的（问目的）。哪个答语正宗？
    options:
    - To get some books.
    - Because get some books.
    - Why books.
    answer: To get some books.
    hint: 回机制「先听清问的是哪一种」：目的用 To 答，同为原生用法。
  - q: 判断：Why 的回答必须用 Because 开头，不然就是错的。
    answer: 不对。why 同时问原因与目的：问目的时 To / For 答语同样正宗。「必用 Because」是已废止的一刀切口径。
    hint: 回主张：答语形式随所问维度分工，二者皆为原生用法。
  - q: 听清是哪一种：Why did you go there? 问的是目的。答：为了看一个朋友。
    answer: To see a friend.
    hint: 回机制「先听清问的是哪一种」：不定式答目的，与 because 从句答原因分工。
