  headline: 完成体的来历：从「我手里有一封写好的信」到「我已经写了信」
  headline_kid: 很久以前，I have the letter written 是说「写好的信在我手里」；说着说着，重心从「信」滑到「我写过」，完成时就这样长出来的
  claim:
    type: etymology
    statement: 完成体源于所有格结果结构（have + 宾语 + 过去分词，表持有某物的完成状态），经再分析（宾语改属动词、have 虚化为助动词）走上 resultative → anterior (perfect) → perfective 的演化链。
    evidence:
    - Bybee, Perkins & Pagliuca《The Evolution of Grammar》(1994) 完成体演化路径（经 Sakurai 的类型学综述转引核实）
    source: 所有格结果结构 have + O + 过去分词；纲领裁定同口径——完成体确源于所有格结果结构，但不是 have 的词义本身；旧「攥着结果」字面解已改标「来历故事」
    scope: 来历是历史解释，不能反推现代 have 的意义；讲述时必须定位为「祖先的故事」，与 TA-05 的现时相关定义分工，不得混作定义
