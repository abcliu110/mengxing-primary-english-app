- id: QI-03
  zone: 语法
  group: QI
  headline: whose 是 who 的「家的」，why 是「用什么」的变身：两个真词源
  headline_kid: whose 就是 who 的所有格，像 his 是 he 的所有格一样天经地义；why 的老祖宗是「凭什么工具」——问原因，就是问「靠什么造成的」
  claim:
    type: etymology
    statement: 古英语疑问词有完整的格变化：hwā（主格）的属格是 hwæs（→ whose），工具格是 hwȳ（→ why）；现代英语只剩这两件化石还保留着格词尾的痕迹。
    evidence:
    - Mitchell & Robinson《A Guide to Old English》第8版 (2012, Wiley-Blackwell, ISBN 978-0-470-67107-8) §20, p.19 的 hwā 格变表——属格 hwæs、工具格 hwȳ 均在表内（2026-11-01 打开核实）；代词范式总置于 §§15–21 (pp.18–19)
    source: hwā 属格 hwæs → whose；hwā 工具格 hwȳ → why；与 hu（how，hwū 的弱化）共同构成 hw- 词族格变残存全图
    scope: 真词源只用于满足好奇心与破除假拆字，不要求小学生记忆格变术语；讲述时只说「老时候的变形」
  mechanism:
  - beat: 两件化石
    text_kid: 很久以前，who 一家是会变形的：问「谁的」时它变成 whose，问「凭什么」时它变成 why。现在别的变形都没了，只剩这两件「化石」还在用。
    text_adult: hwæs/hwȳ 形式在古英语文本中可直接查证；domains.yaml 本域 basis 与 INTERROGATIVE_RADAR 定版均点名此二例为真词源（与 QI-02 的假规律裁定正反成对）。
    visual: hwā 的变形表化石陈列：主格 hwā、属格 hwæs → whose、工具格 hwȳ → why
  examples:
  - level: 1
    sentence: Whose book is this?
    scene_note: whose = who 的「家的」——问归属
    supports: claim
    word_ids:
    - G5_Q07
    - G1_002
  - level: 1
    sentence: Why are you crying?
    scene_note: why 的老义「凭什么（造成）」在现代问原因里留着影子
    supports: claim
    word_ids:
    - G5_Q05
    - V6_日常_58
  error_cases: []
  relatives:
  - id: QI-02
    rel: 前置
  - id: QI-10
    rel: 同族
  quiz:
  - q: Whose book is this? 里的 whose 和 who 是什么关系？
    options:
    - whose 是 who 的「家的」（所有格）
    - whose 是个跟 who 无关的新词
    - whose 是 who 的复数
    answer: whose 是 who 的「家的」（所有格）
    hint: 回机制「两件化石」：问「谁的」时，who 变成 whose，就像 his 是 he 的所有格。
  - q: 判断：why 跟 who 一点关系都没有。
    answer: 不对。why 是 who 一家的工具格化石，老义是「凭什么（造成的）」——问原因，就是问靠什么造成的。
    hint: 回机制「两件化石」：现代英语只剩 whose 与 why 两件还留着格词尾的痕迹。
  - q: his 是 he 的所有格。同理，who 的所有格是哪个？
    options:
    - whose
    - why
    - who
    answer: whose
    hint: 回机制「两件化石」：hwā 的属格是 hwæs，变成今天的 whose。
  - q: 用 whose 提问：「这本书是谁的？」
    answer: Whose book is this?
    hint: 回机制「两件化石」：whose = who 的「家的」——问归属派它。
