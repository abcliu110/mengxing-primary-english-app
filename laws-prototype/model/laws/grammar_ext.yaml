entries:
- id: TA-01
  zone: 语法
  group: TA
  headline: 时态 = 时间 × 看法两个开关，不是十二个要逐个背的格子
  headline_kid: 时态像两个开关：一个管「什么时候」，一个管「怎么看」；开关一组合，样子就出来了，不用背一大张表
  claim:
    type: rule
    statement: 英语时态是两个独立维度的组合——时态（tense）把情境定位到时间上，体（aspect）决定如何观看情境内部的时间构成；学时态是学两维的组合，不是背十二个孤立格子。
    evidence:
    - Comrie《Aspect》(1976) 与《Tense》(1985, CUP) 确立的 tense/aspect 两分框架
    - 章振邦《新编英语语法教程》(2017 第6版) 「两时两体」动词体系（国家级规划教材）
    scope: 两维图是骨架不是全图：语义上谈论未来的手段不止 will / going to（见 TA-13）
  mechanism:
  - beat: 两个开关
    text_kid: 一个开关管「什么时候」（现在还是过去），一个开关管「怎么看」（看整件、看中间、看痕迹）。两个开关一组合，时态的样子就定了。
    text_adult: tense 把情境定位到时间上，aspect 决定观看情境内部时间构成的方式；两维独立组合是英语动词系统的实际结构，而非教学简化。本域纲领 coreView 同此口径。
    visual: 两个拨动开关的图式：时间开关（现在/过去）× 看法开关（全景/进行/完成），组合格亮起
  - beat: 组合不是背诵
    text_kid: 先想「这件事在什么时候、我要怎么看它」，再去选样子——顺序反过来，表背得再熟也会选错。
    text_adult: 跨语言类型学（Comrie 调查）表明时/体两维在语言中普遍可分离；两维组合式讲法降低初学负荷（domains.yaml 本域 basis，ERIC EJ1511004）。
    visual: 同一件事（小男孩踢球）配三副不同镜头框，落在组合格的不同格子里
  examples:
  - level: 1
    sentence: I am reading now.
    scene_note: 晚饭后读绘本，正在发生——时间=现在，看法=钻进中间（进行）
    supports: claim
    word_ids:
    - G2_0492
    - G3_K23
  - level: 1
    sentence: I read a story yesterday.
    scene_note: 昨天读完的故事——时间=过去，看法=看整件（一般）
    supports: claim
    word_ids:
    - G2_0492
    - G4_0415
  - level: 2
    sentence: I have finished my homework.
    scene_note: 作业做完了，痕迹是现在可以出去玩——时间=过去的事，看法=对准现在的牵连（完成）
    supports: claim
    word_ids:
    - V6_日常_26
    - G5_215
  - level: 2
    sentence: We were playing football in the afternoon.
    scene_note: 回忆昨天下午踢球踢到一半的画面——时间=过去，看法=钻进中间（过去进行）
    supports: claim
    word_ids:
    - G2_0489
    - G3_0401
    - G2_0893
  error_cases: []
  relatives:
