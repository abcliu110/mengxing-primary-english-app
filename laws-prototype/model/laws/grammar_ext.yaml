  quiz:
  - q: "明天去看奶奶。动词自己没有「将来」这件衣裳，必须借小帮手——选对的句子： A. We visit Grandma tomorrow.  B. We visited Grandma tomorrow.  C. We will visit Grandma tomorrow."
    answer: "C. We will visit Grandma tomorrow.——动词的形态衣裳只有现在、过去两件；说明天的事要借情态帮手 will，visit 保持原形跟在后面。（来源：本单元例句）"
    hint: "回机制第 1 节「两件衣裳」：动词自己的衣裳只有两件，说将来要请小帮手"
  - q: "把借来的工具装好，排成「看乌云，要下雨了」这句话："
    answer: "Look at the clouds! It is going to rain.——going to 是整个借来的构式：be（is）不能丢，后面接动词原形 rain。（来源：本单元例句）"
    hint: "回机制第 1 节「两件衣裳」：动词自己的衣裳只有两件，说将来要请小帮手"
  - q: "看这句：We will visit Grandma tomorrow. 哪个词是「借来的小帮手」，不是动词自己的衣裳？ A. will  B. visit  C. tomorrow"
    answer: "A. will——will 与 may、might 是同一族的情态帮手，本身不随时间换词尾；动词自己的衣裳只有 visit（现在形）和 visited（过去形）。（来源：本单元例句）"
    hint: "回机制第 1 节「两件衣裳」：动词自己的衣裳只有两件，说将来要请小帮手"
  - q: "没有时间词。天上乌云密布，风把树吹得直弯腰——选对接下来会发生的事的说法： A. It is going to rain.  B. It rained a lot.  C. It rains in spring."
    answer: "A. It is going to rain.——眼前的乌云是将来下雨的预兆，英语借 going to 这个工具谈「已经有苗头」的将来，不用动词自己变出将来形。（来源：本单元例句）"
    hint: "回机制第 1 节「两件衣裳」：动词自己的衣裳只有两件，说将来要请小帮手"
  - q: "病例原文：「I go to Hainan last winter holiday.」句中有明确的时间词，动词却穿错了衣裳——应该怎么改？"
    answer: "I went to Hainan last winter holiday.——last winter holiday 把事情钉在过去，动词必须换上过去衣裳；go 的过去衣裳是 went，不是原形 go，也不是借 will。（来源：病例 VEC-002）"
    hint: "回机制第 1 节「两件衣裳」：动词自己的衣裳只有两件，说将来要请小帮手"
