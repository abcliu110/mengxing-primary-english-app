    answer: "Last weekend, my friends and I climbed to the top of the hill and enjoyed the beautiful view.——had 只在「站在过去某点回头看更早」时才出场；这里 last weekend 就是叙事点本身、没有更早一层，小旗没搬家，用一般过去时 climbed 即可（病例分类：过去完成时误用——不该用的用了）。（来源：病例 VEC-030）"
