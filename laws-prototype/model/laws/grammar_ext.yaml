    scene_note: 清单支撑登记例——问目的，不定式作答，同为正宗
    supports: claim
    word_ids:
    - V6_日常_17
    - G3_130
  - level: 2
    sentence: — Why did she go to the library? — To get some books.
    scene_note: 条目儿童版登记例（To get some books = 为了借书）
    supports: claim
    word_ids:
    - G4_184
    - G1_002
