  quiz:
  - q: "病例原文：「The number of cars increase rapidly in recent years.」in recent years 说的是「从过去几年连到现在」，动词却只用了一般现在时——错在哪儿，应该怎么改？"
    answer: "The number of cars has increased rapidly in recent years.——「近年来」的持续义正是完成时的地盘，汉语没有现成对应格，学生就漏掉了 has increased：这是「了/过」与完成时错位的一种典型形态（病例分类：该用完成时处误用一般现在时）。（来源：病例 VEC-011）"
    hint: "回机制第 1 节「三张脸对位」：「了」「过」、完成时要一张一张脸对，不能整队搬"
  - q: "「我去过北京」——这是汉语「过」的地盘，它和英语完成时对得上吗？选对的对应句： A. I have been to Beijing.  B. I have lost my key."
    answer: "A. I have been to Beijing.——经历义是重叠区：「过」和经历完成时基本对得上。但完成时不等于「过」——丢钥匙那句靠的是结果痕迹，不是经历。（来源：本单元例句）"
    hint: "回机制第 1 节「三张脸对位」：「了」「过」、完成时要一张一张脸对，不能整队搬"
  - q: "「我丢了钥匙」里的「了」，为什么在这里也能对上完成时 I have lost my key？ A. 因为「了」就等于完成时  B. 因为印子还在：钥匙丢了，现在进不了门——理由是现时相关，不是「了」  C. 因为钥匙是昨天丢的"
    answer: "B. 因为印子还在：钥匙丢了，现在进不了门——理由是现时相关，不是「了」——「了」管的是做成没做成，完成时管的是和现在有没有牵连；这句只是碰巧同向。把「了=完成时」当公式，就会在点名昨天时翻车（TA-06）。（来源：本单元例句）"
    hint: "回机制第 1 节「三张脸对位」：「了」「过」、完成时要一张一张脸对，不能整队搬"
  - q: "不给英语时间词。「我们在这儿住了三年了，到现在还住着」——汉语没有现成对应格，英语选哪个？ A. We have lived here for three years.  B. We live here for three years.  C. We lived here three years ago."
    answer: "A. We have lived here for three years.——持续义是错位最深的一格：从三年前连到现在，必须由完成时 have lived 把线拉通；只用 live，线就断在现在。（来源：本单元例句）"
    hint: "回机制第 1 节「三张脸对位」：「了」「过」、完成时要一张一张脸对，不能整队搬"
  - q: "给三张「脸」配上各自管的事（按顺序配对）："
    answer: "了 → 做成/实现；过 → 经历；perfect → 和现在有牵连——三张脸只是部分重叠：经历一行能对上，持续、近况等行各站各的——要一张一张对，不能整队搬。（来源：机械操练题）"
    hint: "回机制第 1 节「三张脸对位」：「了」「过」、完成时要一张一张脸对，不能整队搬"
