  zone: 语法
  group: QI
  headline: 语调是问句的第二套标记：一般疑问常升调、特殊疑问常降调——是常态，不是铁律
  headline_kid: 声音也能提问：Yes/No 问题常把尾巴翘上去，wh- 问题常把尾巴沉下来——像说话自带的标点符号
  claim:
    type: tendency
    statement: 英语以升调标示「开放/待答」、以降调标示「陈述完成」的韵律图式与句类形成统计配对：一般疑问句常升调、特殊疑问句常降调；语调与词序标记互为备份，口语中单靠语调也能构成问句（回声问句）。
    evidence:
    - Quirk et al. (1985) 语调与句类章的系统描写；Swan《Practical English Usage》问句语调条为学习者版口径（两书均为 domains.yaml 登记的基准来源）
    scope: 本条只作倾向呈现；不得据此给学生的语调判「错」
    exceptions:
    - note: 英式礼貌性升调、美式 uptalk、惊讶语境的降调 Yes/No 问句等变异普遍存在
