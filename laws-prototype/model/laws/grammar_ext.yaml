- id: TA-02
  zone: 语法
  group: TA
  headline: 英语形态上只有两个时态：没有「将来时」这个词形，将来是借工具谈的
  headline_kid: 英语动词变来变去，只有「现在」和「过去」两件衣裳；说将来的事，要借 will、going to 这些小帮手的力气
  claim:
    type: rule
    statement: 英语动词的形态对立只有 present / preterite 两项；will 是情态动词而非时态词尾，因此英语没有形态上的将来时，完成形式是次级时态（secondary tense）。
    evidence:
    - Huddleston & Pullum《The Cambridge Grammar of the English Language》(2002) 时态分析：只有两个 primary tenses，perfect 为 secondary tense，will 属情态
    scope: 指形态层面；功能上英语谈论将来的手段完备，本条纠正的是「将来体」这一命名，不是说英语不能谈未来
  mechanism:
  - beat: 两件衣裳
    text_kid: 动词自己能换的衣裳只有两件：现在样、过去样。说将来的事，动词要请小帮手（will、going to）来搭把手。
    text_adult: will 的行为（与 may/might 等情态同族的句法、无时态词尾的形态对立）与情态词类完全一致，与 -ed 类时态词尾的行为系统不同，故 CGEL 判定其为情态而非时态。
    visual: 衣架上两件衣服（现在/过去），旁边一排「借来的工具」：will、going to、时刻表现在时
  - beat: 分歧登记
    text_kid: 这件事老师们也有不同看法，详情放在大人看的地方；我们先按「没有将来时这件衣裳」来学。
    text_adult: Declerck（2006）主张 will + 不定式的一部分用法应分析为将来时，与 CGEL 明确对立——分歧登记于成人层，呈现口径取 CGEL。
    visual: 无（分歧只入成人层，不上儿童屏）
  examples:
  - level: 1
    sentence: We play games today.
    scene_note: 动词的「现在」衣裳
    supports: claim
    word_ids:
    - G2_0489
    - G2_0414
  - level: 1
    sentence: We played games yesterday.
    scene_note: 动词的「过去」衣裳
    supports: claim
    word_ids:
    - G2_0489
    - G4_0415
  - level: 2
    sentence: We will visit Grandma tomorrow.
    scene_note: 说将来的事要借 will——will 是帮手，不是动词自己的衣裳
    supports: claim
    word_ids:
    - G6_270
    - V6_家庭_12
    - G6_267
  - level: 2
    sentence: Look at the clouds! It is going to rain.
    scene_note: 借 going to 谈将来（此例同 TA-11 登记例）
    supports: claim
    word_ids:
    - G2_0502
  error_cases: []
