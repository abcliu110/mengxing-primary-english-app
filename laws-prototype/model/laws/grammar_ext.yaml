    sources:
    - Rod Ellis《The Study of Second Language Acquisition》(2008 第2版) — https://en.wikipedia.org/wiki/Rod_Ellis ；Pienemann (1998) Processability Theory
    boundary: 见 claim.scope 与 exceptions。
    disputes: []
    evidence_grade: 二手互证级
    pending:
    - 病例待补（阶段过渡式已登记在例证层，不另设病例）
    - 误解探针待补
