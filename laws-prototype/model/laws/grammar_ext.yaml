    text_kid: 英语盖句子：先咣咣立起柱子（谁、做了什么），再慢慢加房间。汉语讲事情：先把来龙去脉铺开，正题常常在最后才亮出来。
    text_adult: 该框架能预测中国学习者英语写作的成类问题（主语缺失、谓语叠床、状语堆前），是国内英语教学沿用三十年的对比分析基准表述。
