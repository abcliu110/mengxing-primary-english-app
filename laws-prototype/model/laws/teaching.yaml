  - id: TM-03
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "规则出场有三条路：先给规则、先看例子猜、从整篇语料里挖——没有哪条天生最优"
    headline_kid: "新句型可以老师先讲、可以让孩子先猜、也可以藏在一整段故事里让大家找出来——三种上法各有各的用处。"
    claim:
      type: tendency
      statement: "语法呈现有三条路——演绎（先给规则）、归纳（先看例子自归纳）、语篇（在整篇真实语篇中呈现，含 dictogloss）——没有哪条天生最优，选路由情境变量决定（Thornbury 的 E/A 评价框架，见 GR-21）。要教的规则本身须先过 Swan 五标准：真、有界、清晰、简单、可亲。"
      evidence: "Scott Thornbury《How to Teach Grammar》(1999) 第 3–5 章；本次打开电子书前 50 页（目录与第 1–2 章正文、第 3 章开头含 Swan 五标准原文引述）。接触等级：章节预览级（原文）+ 二手互证。"
      scope: "语法呈现方式的教师决策；dictogloss 对小学低段需大幅简化或不用。"
      exceptions:
        - "归纳路在保持与迁移上常占优，但耗时且对低龄、低水平学习者门槛高。"
    mechanism:
      - beat: "三条呈现路"
        text_adult: "from rules（演绎）：先给规则再套例子；from examples（归纳/guided discovery）：先接触例子，学习者自己归纳规则；through texts（语篇）：语法点在整篇真实语篇中呈现，配套 dictogloss（听短文、记要点、小组重写、与原文对照）与文体/语类分析。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "规则质量五标准"
        text_adult: "借 Swan 的标准给「要教的规则本身」立门槛：真（truth）、有界（limitation）、清晰（clarity）、简单（simplicity）、可亲（familiarity）——规则不达标，再好的呈现路也救不回来。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "双向克制立场"
        text_adult: "Thornbury 既反对「语法不用教、浸泡自然会」的强交际极端，也反对回到规则灌输；其底线在「不要怎么教」比「必须怎么教」更确定（见 TM-05）。"
        text_kid: null
        visual: null
        anchors: []
