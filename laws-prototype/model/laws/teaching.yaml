  - id: TM-17
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "输入强化：给目标形式「打光」——高密度重复与排版凸显，帮注意找到它"
    headline_kid: "想让孩子注意到某个形式，就让它在阅读材料里反复出现、并且长得显眼——但打光只是把眼睛引过去，学没学会还要看后面的加工。"
    claim:
      type: tendency
      statement: "输入强化以外部手段提高目标形式的知觉凸显性（正强化：把正确形式做显眼；负强化：标出错误形式示警），增加它被注意到、进而被摄入的机会。操作化两路：输入洪流（不改版式、靠超常密度抬升显著性）与文本强化（排版凸显）。与 GR-17（注意假说）是「机制—工程」配套；定位：注意的邀请函，非习得的保证书。"
      evidence: "Sharwood Smith (1993) SSLA 15(2): 165–179 命名并理论化；输入操控三路定位据 SSLLT (2016) 综述原文。接触等级：二手论述级。证据等级：同行评审研究。"
      scope: "材料设计辅助件（设计/教师层）：适合配合 TM-15 结构化任务或 TM-16 发现任务使用，不宜当独立教学法。"
      exceptions:
        - "后续元分析总体显示：文本强化对「注意到」有小而正的效果，对「学会并用对」的效应小且不稳定。"
        - "强化过度（满篇加粗）会稀释凸显本身，并可能把注意力从意义上挪走。"
        - "洪流的剂量（密度多高、持续多久）无公认参数。"
    mechanism:
      - beat: "正负强化"
        text_adult: "正强化把正确形式做显眼（加粗目标词形），负强化把错误形式标出来示警（1993, p.177）；手段清单含色彩编码、加粗、特殊重音、语调与手势、元语言提示。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "与 PI 的分工"
        text_adult: "PI 改的是加工任务（堵死省力策略，强制），强化改的是材料外观（提高被看见的概率，邀请）。"
        text_kid: null
        visual: null
        anchors: []
