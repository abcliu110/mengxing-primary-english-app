  - id: TM-10
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "阅读是两层加工的合奏：底层「认词」必须练到自动，才腾得出脑子来「懂意思」"
    headline_kid: "看英文时，脑子里有两组工人：一组负责认词，一组负责懂故事。认词组慢了，懂故事组就没人手——所以认词要练到不用想，故事才听得懂。"
    claim:
      type: tendency
      statement: "阅读 = 低层过程（快速自动的词识别、词汇-句法加工、语义命题编码）与高层过程（主旨建构、推理、理解监控、批判评价）的协调；低层必须自动化，因为工作记忆容量有限，认词每多耗一份资源，理解就少一份。阅读困难的归因必须先分层：低层卡住与高层缺失，两层的药完全不同。"
      evidence: "William Grabe《Reading in a Second Language: Moving from Theory to Practice》(2009, CUP) 全书 20 章架构；230 毫秒认一词、约每秒 5 词与「专长-教练」喻据作者研究总结讲演稿。接触等级：目录级 + 作者自述级。"
      scope: "二语阅读教学的诊断与设计框架（教师层）；与 S 组（解码侧）构成阅读的完整两半。"
      exceptions:
