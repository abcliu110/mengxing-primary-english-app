  - id: TM-15
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "加工教学：学生听岔了不是耳朵问题，是脑子用了省力策略——先改他处理句子的方式"
    headline_kid: "别先让学生说，先让学生听对：把句子设计成「不用对的形式就听不懂意思」，省力策略一失效，正确加工就被逼出来。"
    claim:
      type: tendency
      statement: "学习者理解二语句子时系统性采用省力加工策略（意义优先、第一名词原则），会系统性误读被动句、宾语前置句等非典型语序。加工教学（PI）只改输入侧：显性信息 + 策略警示 + 结构化输入活动（不处理目标形式就答不对、全程不要求产出）——奠基实验中 PI 组理解显著胜过传统产出组、产出与之打平（「双重红利」）。"
      evidence: "VanPatten《Input Processing and Grammar Instruction》(1996)；VanPatten & Cadierno (1993) MLJ 77(1): 45–57；VanPatten & Oikkenon (1996) SSLA 18: 495–510；经同行评审论文转述互证。接触等级：二手论述级。证据等级：同行评审研究（三十年实验传统）。"
      scope: "存在加工陷阱的结构（可被省力策略误读的句式）；对中国孩子最直接的落点是英语被动句与物体作主语句。"
      exceptions:
        - "PI 的胜场主要在句子层面的理解与受控产出测验；测验越接近自由交际，优势越不稳定。"
        - "DeKeyser & Sokalski (1996) 复制研究提出技能特异性反论：PI 组在产出上并未占优——「双重红利」不是无条件成立。"
        - "对不存在加工陷阱的语法点，PI 没有额外优势；结构化输入活动设计成本高。"
    mechanism:
      - beat: "省力策略"
        text_adult: "意义优先原则（先抓实词意思、跳过语法形式）与第一名词原则（把第一个名词当主语/施事）对 SVO 句无害，却系统性误读非典型语序。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "结构化输入三件套"
        text_adult: "①关于目标结构的显性信息；②关于加工策略本身的显性信息（明确告诉学生第一名词直觉会骗人）；③结构化输入活动——只需听/读作意义判断，但不处理目标形式就答不对，且全程不要求产出。VanPatten & Oikkenon (1996) 拆解显示：理解进步来自结构化输入活动本身，而非显性信息。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "活动设计守则"
        text_adult: "始终保持意义在焦点、从单句走向连贯语篇、口头与书面输入并用（Lee & VanPatten 一线）；活动分指称性（有对错答案）与情感性（表达个人意见）两类。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases:
      - wrong: "把 The cow was kicked by the horse 听成「牛踢马」"
        right: "马踢牛——was kicked by 标记被动，第一个名词是受事不是施事"
        error_type: "第一名词原则误读"
        source_type: "教学文献登记错型（VanPatten 输入加工研究中的经典误读例）"
        diagnosis: "省力策略（第一名词原则）在非典型语序上系统性翻车；回补走结构化输入活动。"
    relatives:
      - {id: TM-16, rel: 同族}
      - {id: TM-04, rel: 对照}
      - {id: TM-19, rel: 对照}
      - {id: GR-17, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 15
    pain_points: []
    adult:
      sources:
        - "Bill VanPatten, Input Processing and Grammar Instruction: Theory and Research (1996, Ablex)；VanPatten & Cadierno (1993) The Modern Language Journal 77(1): 45–57；VanPatten & Oikkenon (1996) SSLA 18: 495–510。"
      boundary: "1996 原书本次未打开；理论框架与实验设计经多篇同行评审论文原文转述互证。PI 是被复制研究最多的教学干预之一（跨语言、跨结构）。"
      disputes: "PI 阵营（VanPatten）vs 技能习得阵营（DeKeyser）：前者认为改变加工即改变习得系统本身；后者认为练习效果服从技能特异性，产出能力终须产出练习。此争未决，两说并呈；设计侧安全取舍：PI 负责「听对、读对」，产出另设产出练习。"
      evidence_grade: "二手论述级（转述互证）；证据本体为同行评审研究"
      pending:
        - "1996 原书未打开（清单登记）。"
    status: 已入模
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）", basis: "清单 v6 TM-15 原文"}
  - id: TM-16
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "意识提升任务：规则先不讲，把语料摆上桌，让学生自己找出来、说出来"
    headline_kid: "把十来个例句发下去，只给任务不给规则：分组找规律、试着用自己的话说出规律、再拿新句子验一验——规律是他们「发现」的。"
    claim:
      type: tendency
      statement: "意识提升（C-R）任务把学生注意力有意引向目标语的形式特征：给小组一份语言数据与一个要解决的语法问题，合作分析、共同产出用自己的话说出的规则，教师只组织答疑、任务后收束。其直接产物是显性知识与元语言意识（Fotos & Ellis 1991：做语法任务的学生对目标难规则的显性知识显著增长），产出练习被明确推后。"
      evidence: "Rutherford《Second Language Grammar: Learning and Teaching》(1987) 系统提出；Fotos & Ellis (1991) TESOL Quarterly 25(4): 605–628 实证（本次打开 JSTOR 全文）。接触等级：专著二手论述级 + 研究原文级。证据等级：经典方法专著 + 同行评审研究（1991 研究为探索性，效应为初步量级）。"
      scope: "语法发现式教学（教师层）；与 TM-03 归纳路相比更彻底：呈现终点是「会说清」而非「会用」。"
      exceptions:
        - "任务对元语言词汇与讨论能力有门槛：小学低段无法用英语谈语法，需改用汉语讨论、图示化数据与更小的规律单位。"
        - "数据选得不好（例外太多、规律太绕）会让学生归纳出错误规则，教师的事后收束环节不可省。"
    mechanism:
      - beat: "心理学前提"
        text_adult: "Rutherford 的前提：学习只有在待学内容能与已知内容有意义地关联时才成功（1987, p.16）；因此 C-R 程序应模拟习得本身的性质——从数据出发、形成假设、再修正假设。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "任务形态"
        text_adult: "如给一组 for/since 的句子，问「for 和 since 各跟什么样的时间？」——学生合作分析数据、讨论、共同产出一句自己的规则；「谈论语法」本身成了一种交际。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "源条目自带任务例：一组 for/since 句子，问二者各跟什么样的时间（规律由学生归纳，教师收束）。"
        supports: "claim"
    error_cases: []
    relatives:
      - {id: TM-15, rel: 同族}
      - {id: TM-03, rel: 对照}
      - {id: TM-14, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 16
    pain_points: []
    adult:
      sources:
        - "William E. Rutherford, Second Language Grammar: Learning and Teaching (1987, Longman)；Sandra Fotos & Rod Ellis (1991) Communicating About Grammar: A Task-Based Approach, TESOL Quarterly 25(4): 605–628（JSTOR 全文）。"
      boundary: "C-R 的直接产物是显性知识，能否、何时转化为隐性能力正是接口之争的现场（TM-14)，不能把「说得出规律」直接记作「会用」。"
      disputes: "接口三派并立：无接口说（Krashen）/ 弱接口说（Ellis，C-R 辩护主要站此位）/ 强接口说（技能习得理论）。另有纯发现法的效率批评（耗时、可能归纳错）长期存在——任务派的回应是把教师收束与验证环节写进任务结构。"
      evidence_grade: "二手论述级（专著）+ 原文级（1991 研究）"
