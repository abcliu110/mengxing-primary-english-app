  - id: WA-02
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "说得顺≠说得快：流利度是记忆的函数，靠的是脑子里存着的整块的现成话"
    headline_kid: "说话像流水一样顺，不是因为舌头快，而是因为脑子里存了好多「整块的现成话」——想说的时候整块拿出来，不用一个词一个词现拼。"
    claim:
      type: tendency
      statement: "流利度是记忆的函数：实时无停顿地说话，靠的是记忆中存有一库存量充足的套式「语块」；流利度的观测指标不是语速，而是两次停顿之间长段连贯输出的多少。语块充当「可靠的小岛」，把加工负荷从逐词拼装降到整块提取。"
      evidence: "Scott Thornbury, F is for Fluency,《An A–Z of ELT》(2009-12-17)，核心句经 University of Westminster 教师培训课件逐字引录核实；学术版 Thornbury (2019) Learning languages in chunks, Cambridge Papers in ELT。经典地位（清单登记）：核心句被高校教师培训课件逐字引录，作者 2019 年在剑桥系列以同题发表学术版。"
      scope: "流利度教学的机制口径（教师层）；按儿童场景取用——儿童拆解倾向弱、整块记忆强，本机制对小学阶段的适配度反而高于成人。"
      exceptions:
        - "成人学习者会把语块拆开分析再重组（Wray 2002 的批评）——记忆库存解释的是流利度的下限通道，不排斥规则加工。"
    mechanism:
      - beat: "原文核心句"
        text_adult: "“it may be that fluency is indeed a function of memory, and that the capacity to produce pause-free speech in real time is contingent on having a memorised bank of formulaic language 'chunks'.”（Westminster 课件逐字引录）"
        text_kid: null
