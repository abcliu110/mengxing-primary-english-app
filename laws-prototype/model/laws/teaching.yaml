      boundary: "本条是理论之争的登记，不是教学裁决：三派结论相反而证据共享，引用任一派须连同其余两派的位置出示（源条目边界原文口径）。"
      disputes: "即本条主题本身：无接口 / 弱接口 / 强接口三派并呈、不许拍板（用户与清单共同登记口径）。WA-09 所引 DeKeyser「陈述性拐杖」语是强接口一侧的经典表述。"
