        - "A. S. Hornby, A Guide to Patterns and Usage in English (1954, Oxford University Press)；Richards & Rodgers, Approaches and Methods in Language Teaching 第 3 章。"
      boundary: "替换表生成的是「表格之内」的正确句子；把它当整课主菜即回到听说法的老问题。"
      disputes: "无针对替换表本身的成派分歧；它随情景法/听说法整体在交际法时代被批评为机械与去语境化。辩护性回看（Richards & Rodgers）：口语法的句型选择与分级原则是教材编写学的真实遗产，不因方法退场而失效。"
