  - id: TM-06
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "练习好不好，先过五关：效度、数量、成功导向、异质性、趣味"
    headline_kid: "给孩子出的每一组练习，先自查五件事：练的是不是它说的那个本事？量够不够？是不是大多能做对？是不是好中差的孩子都能下手？有没有意思？"
    claim:
      type: rule
      statement: "练习活动按五特征验收：Validity（程序真的在练它声称的语言点）、Quantity（练习量远大于测试量）、Success-orientation（回应大多做对——自动化来自反复成功地执行）、Heterogeneity（开放到不同水平都能以各自水平作答）、Interest（趣味是有效性条件，不是装饰）。练习的定义：目标导向地把所学巩固进长时记忆、且教师支持逐步撤除的 engagement。"
      evidence: "Penny Ur《Grammar Practice Activities》(1988 初版；2009 第 2 版，CUP) Part 1「Practice」章；本次打开 CUP 官方节选 PDF，导论与第 1–2 章实质读完，五特征为作者章末小结原文。接触等级：章节预览级（出版社官方节选，原文）。"
      scope: "本 App 全部练习/测验的设计与验收标准（设计标准层登记）。"
      exceptions:
