      boundary: "PEU 四十年四版在版、被教师群体用作「用法问题第一查考」，是其问题清单命中率的市场验证；作者 2014 年获 British Council ELTons 终身成就奖。"
      disputes: "「问题观」与「体系观」之争：Swan 式条目被批评为碎片化、缺乏范畴一致性；Swan 阵营反驳学习者的问题从来不是按体系发生的。另：Swan 本人对若干教学时尚持批评立场，其条目取舍带有作者的方法论立场，引用时须知这是「一位权威作者的裁决」而非学界共识的自动汇总。"
