      sources:
        - "Geoffrey K. Pullum, Passive voice wrongly accused yet again, Language Log (2012): https://languagelog.ldc.upenn.edu/nll/?p=3897 ；同系列：The disembodied implied passive (2011) 等。"
      boundary: "博客文，证据等级为「一流专家的公开论证 + 案例存档」，非期刊论文；其结论（被动的形式判准）与 CGEL 专著完全一致，网文形态提供的是案例的新鲜度与可检索性。"
      disputes: "立场之争存在——不少写作教师认为「少用被动」作为文体启发即便术语不严也有用；Pullum 的回应是误标会反噬教学公信力。本清单取 Pullum 的判准、存启发派的存在。"
