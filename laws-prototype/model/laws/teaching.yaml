  - id: TM-26
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "自录音转写自纠：把自己说的录下来，一个字一个字写出来——错误就藏不住了"
    headline_kid: "让学生录一段自己的口头表达，再让他把录音逐字转写成文字，自己先改一遍，老师只补他没看出来的——口语里一晃而过的错误，在纸上全都站住了。"
    claim:
      type: tendency
      statement: "自转写把 Schmidt 的「注意」从输入侧搬到自己的产出侧：产出先被录音固定，事后无时间压力地逐字落纸，说话时隐形的错误（时态、词形、漏词、语序）在书面形态下变得可检查。闭环：说（录）→写（转写）→查（自纠+师补）→再说（正式版），每一环都有明确产物。Mennim (2003)：转写自纠后正式报告在语法、产出质量与内容组织上均见改进。"
      evidence: "Mennim (2003) ELT Journal 57(2): 130–138；Lynch (2001) ELT Journal 55(2): 124–132；Mennim (2012) ELT Journal 66(1): 52–61。接触等级：二手论述级。证据等级：同行评审研究（小样本课堂研究一系，效应方向一致但规模有限）。"
      scope: "值得打磨的产出（报告、演讲、复述类任务）；年龄适配：小学段只从「录一句话、听写一句话、改一句话」的微缩版起步，高段再上整段转写。"
      exceptions:
        - "成本在时间：转写五分钟录音是数十分钟的劳动，不适合日常对话练习。"
        - "学生只能自纠其现有显性知识覆盖的错误，超出其系统的错误仍需教师补检（教师反馈环节不可省）。"
        - "「再说」应换新题目或新场合，才能验出迁移而非背下修订稿。"
    mechanism:
      - beat: "为什么转写有效"
        text_adult: "口语产出转瞬即逝，说话当口监控能力几乎全被内容占用，形式错误随说随忘；录音+逐字转写把错误固定为可检查对象，促使学生把注意力投向自身输出的形式。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "Mennim 设计"
        text_adult: "正式口头报告前两周做私人彩排并录音，转写其中五分钟、自行检查订正，教师只对漏检处给反馈，两周后正式报告与彩排转写对照。同系：Lynch (2001) 以转写为通往注意之路；Mennim (2012) 报告转写练习中的同伴协商。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-27, rel: 同族}
      - {id: GR-17, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 26
    pain_points: []
    adult:
      sources:
        - "Paul Mennim (2003) Rehearsed Oral L2 Output and Reactive Focus on Form, ELT Journal 57(2): 130–138（ERIC EJ664628)；Tony Lynch (2001) ELT Journal 55(2): 124–132；Mennim (2012) ELT Journal 66(1): 52–61。"
      boundary: "自转写与 GR-17（注意）机制严丝合缝，是注意假说在口语练习上的完整落地形态；2001–2012 年间形成小型连贯研究系（Lynch、Mennim、Stillwell 等 2010）。"
      disputes: "改进的性质之争：注意派读作「形式意识提升带动系统改进」；谨慎派认为彩排—转写—重演的设计无法区分「记住了修订稿」与「能力迁移」，且学生对教师补检的依赖度高于自检。入模口径：口语自查闭环，有小样本实证支持，迁移证据未定版。"
      evidence_grade: "二手论述级；证据本体为同行评审研究（小样本）"
      pending:
        - "Mennim (2003) 原文未打开，程序与结果经后续研究论文与综述带细节转述互证（清单登记）。"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；迁移证据按未定版登记", basis: "清单 v6 TM-26 原文及入模口径"}
  - id: TM-27
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "错误本：错题不按日期排，按「错法」排——同一种错攒够了，就是要专练的靶子"
    headline_kid: "每个学生一本错误本，记错句不按时间流水账，按错型分栏；哪一栏攒得最厚，哪一栏就是他的「热门错误」，复习时只攻最厚的几栏。"
    claim:
      type: rule
      statement: "错误本程式：错误订正后不改完即弃，由学生誊入个人档案，按错误类型（而非时间）归类——每条含原错句、订正句与一句错因自述；定期回看，只复习反复出现的高频错型（hot errors），并为最厚的错型安排针对性练习。归档前先按 Edge 三分过滤：slips（已会而偶失，可自纠）不入长期追踪，errors（系统错误）才是追踪对象，attempts（未学而试）信息量最大。"
      evidence: "理论锚点：Julian Edge《Mistakes and Correction》(1989, Longman)——版权页、目录经 archive.org 全文核对，接触等级章节预览级。错误本程式本身出自教师教育与课堂实践传统，Edge 书中并未以此名目立程，已如实分开著录。证据等级：经典教师教育专著（锚点）+ 从业传统（程式）。"
      scope: "本 App 复习区「病因错题本」的设计依据（设计标准层登记）：归档键为错型而非题号，与 DESIGN §3.5 error_type 共用分类。"
      exceptions:
        - "三条失效模式：只记不复习（档案变坟墓）；slips 满本稀释信号；只记不练（回看终点必须落到针对性练习，接 TM-19 分层与 TM-06 五关）。"
        - "错误本是个人档案而非展示品，公开比较错误量会污染如实记录的意愿。"
        - "低龄段由教师代为归类，学生只负责誊抄与回看朗读；错因自述随年龄逐步移交学生。"
    mechanism:
      - beat: "Edge 三分"
        text_adult: "slips（口误/笔误，可自纠）、errors（系统错误，当前中介语的真实状态）、attempts（未学而试）三类处置完全不同；纠正的最优形态是自我纠正（Edge: the best form of correction is self-correction）。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "与中介语的配套"
        text_adult: "GR-16（错误是中介语「临时系统」的试单）是本条的理论本体——错误本就是把每个学生自己的中介语做成可见、可统计的个人档案；化石化的预警信号（同一错型长期不降）只有在这本档案里才看得出来。TM-26 自转写的订正稿是错误本最好的原料来源。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-26, rel: 同族}
      - {id: TM-19, rel: 对照}
      - {id: TM-06, rel: 对照}
      - {id: GR-16, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 27
    pain_points: []
    adult:
      sources:
        - "Julian Edge, Mistakes and Correction (1989, Longman「Keys to Language Teaching」丛书，ISBN 0-582-74626-4；1989 年初版、1997 年已第七次印刷）。"
      boundary: "错误本做法在各国中小学课堂广泛自发存在——广泛存在是实践事实，不是效果证据（源条目登记）。"
      disputes: "上游是纠错大争论：Truscott「纠错无用且有害」论 vs Ferris 等「书面纠错有效」论；错误本预设了 Ferris 侧立场，入模登记此上游分歧，不假装已定案。本清单内部取舍：纠错以自我纠正与改述为主、打断式为辅，与 E 组/TM-04 既有立场一致。"
      evidence_grade: "章节预览级（锚点书）+ 从业传统（程式）"
      pending:
        - "错误本程式本身在 Edge 书中未以此名目立程，系锚点与程式分开著录（清单待核表登记）。"
    status: 已入模
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；登记为设计标准层（复习区病因归档依据）", basis: "清单 v6 TM-27 原文"}
  - id: TM-28
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    registration_note: "高中+专属内容登记：Murphy 三册中中级（B1–B2）与高级册的完整学程形态属高段内容，登记不转技巧、不删；入模的设计标准只取「两页单元法」的单元形态本身。"
    headline: "一个知识点装进一个对开页：左页讲清、右页练完，单元自带答案与自诊入口（Murphy 两页单元法）"
    headline_kid: "学语法像查一本「一页道理、一页动手」的练习册：左边把一个小问题讲明白，右边马上做题，做完自己对答案；哪儿不会查哪课。"
    claim:
      type: rule
      statement: "单元形态标准：一个知识点 = 一个闭合单元——每单元恰好一个对开页，左页讲解与例句（用例先行、术语压到最低），右页配套练习，书后附完整答案；单元不按难度排序、按需取用；书末 Study Guide 以一组诊断题把读者分诊到真正需要的单元。五件齐备：讲解、用例、练习、答案、自诊入口；单元之间靠索引与诊断题连接，不靠线性进度硬推。"
      evidence: "Raymond Murphy《English Grammar in Use》(CUP；初版 1985，第 5 版 2019, ISBN 978-1-108-45765-1)；「145 单元、每单元对开页、Study Guide 位置（第 5 版 p.326）」据第 5 版原书凡例原文；官方定位据 CUP 产品页。接触等级：出版社官方页级 + 原书凡例/序言原文。"
      scope: "本 App 内容单元的产品形态学（设计标准层登记）；作者自陈中级册不适合初级学习者（not suitable for elementary learners），初级须用同系列 Essential 册。"
      exceptions:
        - "两页单元法是产品形态学，不是习得理论：它保证「学得完、对得上答案」，不保证迁移到自由产出（练习以句级操练为主，须与 TM-06、TM-03 配套看）。"
        - "「世界最畅销语法书」为 CUP 封面自述口径，非独立审计销量，本条只登记为出版社定位语。"
    mechanism:
      - beat: "自学闭环三件"
        text_adult: "①单元不按难度排序，按需取用；②Study Guide 先分诊、再吃药；③同系列按水平分册成梯（Essential 初级 / 本册中级 / Advanced 高级），教师口耳间以封面色称红/蓝/绿三册。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "对内容设计的含义"
        text_adult: "这是「内容单元」而非「课程章节」的产品方法学：自学为主、教师课堂补充为辅，格式服务于无教师场景——与 TM-29 的课堂教师用书生态构成根本分野。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "源条目自带例：现在完成时、定冠词等大问题拆成多个单元分装，每单元只装一个语法点。"
        supports: "claim"
    error_cases: []
    relatives:
      - {id: TM-29, rel: 对照}
      - {id: TM-30, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 28
    pain_points: []
    adult:
      sources:
        - "Raymond Murphy, English Grammar in Use (Cambridge University Press；第 5 版 2019, ISBN 978-1-108-45765-1)；CUP 官方产品页：cambridge.org/9781108457651；第 5 版凡例与作者序原文。"
      boundary: "该书自 1985 年连续修订五版、四十年在版，是「自学语法书」品类的定义性产品；两页格式被后续无数自学语法书与语法 app 的卡片式单元模仿。"
      disputes: "自学演绎路线与归纳/涌现路线（TM-05 Nurture、WA-01 Dogme）的方法论张力：批评者认为 Murphy 式单元强化「语法=规则清单」的知识观（与 TM-01 技能观相左）；辩护方指出其 Study Guide 分诊逻辑与海量用例实为「按需显性支持」，与完全显性教学不是一回事。分歧登记，不裁决。"
      evidence_grade: "出版社官方页级 + 章节预览级（原书凡例原文）"
      pending:
        - "红/蓝/绿封面色代称见清单待核表注（教师口耳惯称）。"
        - "封面「THE WORLD'S BEST-SELLING GRAMMAR BOOK」为出版社自述口径，未独立审计（清单登记）。"
    status: 已入模
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；登记为设计标准层（内容单元形态标准）；完整学程形态按高段登记不转技巧", basis: "清单 v6 TM-28 原文及用户学段裁定"}
  - id: TM-29
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "先把整张图表挂出来：语法先以「一张总表」呈现，再逐格展开（Azar 图表演示法）"
    headline_kid: "学一个时态，先看一张大表：横着是时间、竖着是样子，格子里全是例句——先看清全家长什么样，再一格一格学。"
    claim:
      type: rule
      statement: "图表演示法标准：每章以大幅语法图表开场，把一个语法域的形式-意义对应一次性以表格+时间轴+例句整体呈现，然后才逐项讲解与由受控到交际的练习序列；图表本身是该书的知识组织单位（全书图表另行抽出成独立 Chartbook 单册发售）。呈现次序为演绎、自上而下：先给系统全图，再逐格展开。"
      evidence: "Betty Schrampfer Azar《Understanding and Using English Grammar》(初版 1981，作者 TIRF 卷首自述；5 版 2017 与 Stacy A. Hagen 合著，Pearson)；Chartbook「contains all the grammar charts」据 Pearson 产品文案（多家书商页一致转载互证）。接触等级：出版社文案级 + 原书第 3 版前言与目录原文 + 书目记录级。"
      scope: "呈现法设计标准（设计层）；本条立的是其方法与产品形态，不为其具体规则表述背书（个别图表的规则概括以清单各实质条目为准）。"
      exceptions:
        - "图表把系统画得整齐，有把概率性用法（GR 组梯度观）画成二值规则的风险，课堂使用须配真实语料校正（CB 簇）。"
    mechanism:
      - beat: "与 TM-28 的谱系对照"
        text_adult: "①使用场景：Azar 是课堂教师用书生态（Student Book + Workbook + Answer Key + Teacher's Guide 全套），Murphy 是无教师自学生态；②呈现次序：Azar 先系统全图（自上而下），Murphy 先单个问题的用例（自下而上）；③分册逻辑：Azar 三级构成完整课程线，Murphy 三册是同一方法的水平切片。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "官方路线自述"
        text_adult: "Pearson 文案：以语法为起点发展全部语言技能，grammar-based approach blending direct instruction with communicative methods——图表负责「讲清」，活动负责「用上」。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "源条目自带例：时态时间轴总表、情态总表是美式语法课堂的视觉标准件；Chartbook（4 版 2009 / 5 版 2017，144 页，ISBN 9780134276281）为图表专册。"
        supports: "claim"
    error_cases: []
    relatives:
