  - id: TM-35
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "五家拼读名牌的队列与机关对照谱系：RWI、Jolly、Spalding、Sounds-Write、UFLI——拼的不是音，是「先教哪些、按什么顺序、用什么机关记住」"
    headline_kid: "学拼读有好几家「武馆」，练的是同一套字母代码，招式各不相同：选定一家、照着它的顺序学完，就是正道。"
    claim:
      type: tendency
      statement: "五家系统拼读按「队列 × 机关 × 形态」对照：RWI（Speed Sounds 三套 + Fred Talk/Fred Fingers 具身机关，商业）；Jolly Phonics（42 音分 7 组、每音配故事+动作+歌曲，多感官娱乐化，商业）；Spalding（70 张 phonogram 卡一次教全所有读音、拼写先行、反娱乐化，临床源流）；Sounds-Write（从音出发逐个展开拼法菜单，linguistic phonics）；UFLI（128 节课、序列与工具箱免费公开，非营利）。五家队列互不兼容：对照谱系的正确用途是「选定一家、忠实执行」，不是各取一段拼凑。"
      evidence: "节目规格经出版社材料与采用校官方文件交叉核对（多源一致）；证据层数字：NRP (2000) 与 Ehri, Nunes, Stahl et al. (2001) 元分析原文摘要；Torgerson, Brooks & Hall (2006) 系统综述（DfES RR711）执行摘要；UFLI 经 EdReports (2025) 评测。接触等级：二手系统论述级 + 原文摘要级 + 官方评测级。"
      scope: "拼读课程选型标准（设计标准层登记）；选课须先定口音模型（各家音位总数 42/44/45 口径不同，源于英美口音模型与计数约定之差），与 S 组口径保持一致。"
      exceptions:
        - "归属更正（源条目登记）：sound buttons（字素下打点/下划线标音数）是 Letters and Sounds 系课堂的通用标记法，不是 RWI 的装置；RWI 的标志机关是 Fred Talk 与 Fred Fingers。著录不可混（本清单原任务书曾误植）。"
        - "Sounds-Write 称英语 44 音共有约 175 种拼法——「175」是该体系的自家计数，定版为「Sounds-Write 口径」，非学界共识数字。"
        - "UFLI「免费开源」准确说的只是序列与工具箱层，教师手册本体为低价纸质书。"
        - "五家之间没有头对头随机对照试验，优劣只能以「是否满足系统拼读公认要件 + 执行支持是否完备」评。"
    mechanism:
      - beat: "五家机关速记"
        text_adult: "RWI: 布偶青蛙 Fred 只会说单个音，孩子替它拼合（Fred Talk）；拼写时一根手指代表一个音、逐个捏指计数（Fred Fingers）；每音配图画短语口令。Jolly: 42 音分 7 组（1 组 s a t i p n 起），每音配故事、动作与歌曲（如 /s/ 手如蛇行），五项技能从第一周并行。Spalding: 70 卡一次教全读音（a 卡三读、ough 卡六读），先拼写后阅读，卡上不用图画助记。Sounds-Write: 四概念（字母代表音；一音可由 1–4 字母拼；同音可异拼；同拼可异音）+ 三技能（拼合、切分、音位操纵），Initial Code 11 单元约 36 个 GPC 打底。UFLI: 128 节课、每课八步例程、两日一课约 30 分钟。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "声墙配套"
        text_adult: "声墙（Sound Wall，Mary Dahlgren/Tools 4 Reading 推广）编入本条作可视化配套：辅音墙按发音部位 × 发音方法排布、清浊成对、配真人口型照片；元音区作 vowel valley（元音谷），schwa 居谷心；未教音位以「小锁」图卡遮起。它是把 GPC 菜单做成儿童面「音位地图」的现成蓝本，与 S-43 口型处方同构。"
        text_kid: null
        visual: null
