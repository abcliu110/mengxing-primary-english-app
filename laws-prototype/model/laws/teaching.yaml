  - id: WA-06
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "没有「全世界统一的标准英语」：对错是约定俗成，编辑和老师的本事是在标尺上滑动"
    headline_kid: "英语没有一个「官府」来定对错——一句话对不对，要看在什么地方、什么场合、大家习不习惯。先学大家都接受的说法，慢慢就知道什么时候可以换种说法。"
    claim:
      type: tendency
      statement: "规定主义是一条滑动标尺（sliding scales of strictness and sense），从明智的约定维护到无理的迷信是连续谱，不存在「规定派 vs 描写派」的二元战争；英语无官方语言学院，故不存在放之四海皆准的 universal Standard English，只有地方与机构的约定；正确性最终是社会约定。编辑（以及教师）的真实技艺，是依语境在标尺上换位：知道哪条是硬约定、哪条只是偏好、哪条是已被用法淘汰的伪规则。"
      evidence: "Stan Carey, Descriptivism vs. prescriptivism: War is over (if you want it),《Sentence First》(2010-08-03)，经 Vocabulary.com / Visual Thesaurus Blog Excerpts 专栏全文摘录核实；文中引 Palmer《Grammar》与 Lyons 论断为据。经典地位（清单登记）：被 Vocabulary.com 选入 Blog Excerpts 长期展示；被教师博客称为「对两种进路最好的总结」；被英国编辑 Louise Harnby (2017) 整段征引；作者为职业编辑、《Sentence First》主理人（2009 年创刊）。"
      scope: "教师/编辑的判断框架（教师层）；儿童落点须转译为 WA-06 儿童版的态度（约定可以学、伪规则不必怕），小学阶段不教「描写主义」。"
