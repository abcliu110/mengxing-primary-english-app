      boundary: "五家队列虽互不相同，但都满足 TM-33 所述国家框架要件（明确进度、全覆盖、拼合切分并行）——这是「系统性」共识在产品层的投影。Spalding 的「全音同教」对工作记忆要求显著高于缓坡路线（LS 组可互参），其临床源流向普通班课的迁移须谨慎。"
      disputes: "合成 vs 分析 vs 嵌入式的证据层如实登记：NRP (2000)/Ehri 等 (2001) 元分析定版的是「系统性」（总效应 d=0.41；合成单项 d=0.45，但与大单元系统拼读差异不显著）；Torgerson 等 (2006) 只纳入 RCT 的综述更保守，合成 vs 分析仅 3 项 RCT、无统计显著差异——「合成优先」在 RCT 层并未定版。英国采合成优先是 Rose 审查（2006）的政策裁断（CG-13），其旗舰证据 Clackmannanshire 纵向追踪被批评为非随机分组；Bowers (2020) 对拼读元分析提出系统性质疑，学界有往返论战。英美政策温差正源于此：两边共识到「系统性」为止。"
