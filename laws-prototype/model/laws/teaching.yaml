  - id: WA-05
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "经典的网文形态：纸书被判错之后，博客是它二十年的公开勘误表"
    headline_kid: "一本书写错了不会自己改过来——好在专家们在网上盯着它，一发现错就公开写出来。规矩对不对，不看它印了多少年，要看它经不经得起查。"
