      statement: "听力课程须按六类活动做配比审计：Intensive 精听（训低层切分）、Selective 选听（训注意分配）、Interactive 互动听（听与说咬合）、Extensive 泛听（以量促自动化与语感）、Responsive 回应听（语用层加工）、Autonomous 自主听（迁移终点）。只有精听题的课程六格缺五，缺的恰是泛听与互动听。"
      evidence: "Rost《Teaching and Researching Listening》第 2 版第 9 章目录原文（六类英文名逐字著录）。接触等级：目录级。"
