  - id: TM-21
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "逆后链：长句从尾巴开始搭——先说最后几个词，再一段一段往前接"
    headline_kid: "一句话太长记不住，就从最后一小截开始练：先把句尾说顺，再往前添一段、再添一段，像倒着搭积木，最后整句一口气说完，尾巴的音调还不会塌。"
    claim:
      type: tendency
      statement: "逆后链：把长句按意群切段，先练最后一段，再逐段向前累加至整句。它针对长句产出的两个困难——工作记忆负荷（从尾建起使新增内容接在已自动化片段之前）与韵律完整（每次练习都以完整的收尾韵律结束，避免尾音塌陷）。在 TM-19 尺子上属机械操练层，专为长句口头产出设计，与 TM-20（练骨架广度）分工：一个横向选配，一个纵向成串。入模口径：技巧存、原义弃（行为主义解释不收，现代转述以工作记忆/组块立论）。"
      evidence: "听说法技巧清单标准件：Larsen-Freeman《Techniques and Principles in Language Teaching》(2000) 技巧之二 Backward Build-up (Expansion) Drill，程序经期刊文献转述核对；Richards & Rodgers 听说法章节同样著录。接触等级：二手论述级。证据等级：从业传统（无独立效果实验）。"
      scope: "小学应用限于短句、儿歌与演讲句的成串练习；长难句版本对应中学以上。它是降难度的脚手架，服务于自动化阶段（TM-06 成功导向），不服务于记忆保持目标（LS-08）。"
      exceptions:
        - "练的是一条给定长句的产出流畅，不迁移为自造句子的能力（机械层通病）。"
        - "切段必须按意群/韵律群切，在词组中间乱切会练出错误的停顿习惯。"
    mechanism:
      - beat: "倒序累加程序"
        text_adult: "教师把台词按意群切段、带学生从句尾开始逐段向前扩展至整句；程序简单、零材料成本，是方法史上少数被后世方法匿名继承的技巧（合唱与戏剧台词训练中亦有同构做法）。"
        text_kid: null
