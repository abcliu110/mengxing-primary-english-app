      disputes: "涌现 vs 建构之争：显性教学阵营批评 Nurture 式立场在应试与课时约束下不现实；本清单 GR 组的认知条目（注意、频率、重组）大体站在中间偏建构侧，与 TM-05 合看才是完整图景。"
