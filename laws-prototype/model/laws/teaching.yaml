      boundary: "本批条目中效果证据最需要泼冷水的一条（源条目原文登记）。凸显只提高被看见的概率，不保证被加工成形式-意义连接。"
      disputes: "理论层：Sharwood Smith 本人提醒强化是外部操作，能否引发内部意识提升并无保证——他因此用 input enhancement 取代自己早年的 consciousness-raising 提法。实证层：元分析结论随测验类型翻转（识别型有效、产出型多无效）。"
