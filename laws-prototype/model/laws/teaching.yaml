  - id: WA-08
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "讲故事不是读故事：先把故事拆成「骨架」装进脑子，眼睛和身体才能空出来表演"
    headline_kid: "会讲故事的人不照着书念——他把故事变成一张心里的地图，眼睛看着你，手能比划，声音能变高变低。听故事的时候你也可以加入：重复的那句话我们一起喊！"
