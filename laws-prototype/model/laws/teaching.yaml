      - {id: TM-31, rel: 对照}
      - {id: TM-03, rel: 对照}
      - {id: TM-05, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 29
    pain_points: []
    adult:
      sources:
        - "Betty Schrampfer Azar, Understanding and Using English Grammar (1981 初版；Azar & Hagen 5 版 2017, Pearson)；Chartbook ISBN 9780134276281；作者自述见 TIRF《Teaching and Learning English Grammar》卷首。"
      boundary: "该书是美国大学 ESL/IEP 体系中使用历史最长的语法教材线之一（1981 至今四十余年、五版）；「长年最畅销」类表述为 Pearson/书商文案口径，本条降格表述为「美式 ESL 课堂的长青主流教材」。"
      disputes: "Azar 与 Murphy 之争本质是「教师中介 vs 学习者自足」之争，不是对错之争。另一分歧在图表的地位：拥护者视总表为认知地图；用法基础/语料取向反对者认为频率分布图（LGSWE 式，见 TM-31）比形式总表更接近语言真相。"
      evidence_grade: "出版社文案级 + 章节预览级（第 3 版前言目录）"
      pending:
        - "Pearson 官网产品页本次未直接打开（清单待核表登记）；文案经多家书商页一致转载互证。"
    status: 已入模
