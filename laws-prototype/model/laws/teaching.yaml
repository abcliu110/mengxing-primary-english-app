  - id: WA-07
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "故事课成败先在选书：故事要对上孩子的「语言年龄」和「心智年龄」两把尺"
    headline_kid: "听故事学英语，最怕故事不对版：话太难，听不懂；故事太幼稚，又没意思。好故事是图画帮你听懂、内容正好是你这个年纪心里想的那些事。"
