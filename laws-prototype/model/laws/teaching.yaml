  - id: WA-04
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "「被动」不是一种时态，也不等于「说话含糊」：两个民间等式都不成立"
    headline_kid: "「被动」和「时态」是两回事——被动句也有现在、过去之分；被动句也能明明白白说出是谁做的，主动句也能把做事的人藏起来。别拿「含糊」给句子定罪。"
    claim:
      type: rule
      statement: "两个民间等式都不成立：①被动 ≠ 一种时态——语态（voice）与时态（tense）是正交的两个维度，被动句自有现在、过去之分；②被动 ≠ 对施事含糊——双向都不成立：被动句可带 by 短语把施事说全，主动句同样可以不点名。值得批评的「含糊推责」是修辞选择，与使用哪种语态没有必然关系。"
      evidence: "Geoffrey Pullum, Let's put it in the passive tense, Language Log (2007-05-25)，经官方旧站存档全文核实；论点属描写语法共识，内容锚定 CGEL。经典地位（清单登记）：2007 年原文至今存档于宾大官方旧站，系列论点被 NE-15 的 Chronicle 长文吸收。"
      scope: "概念边界条目（教师层）：与 CO-08「被动句是换主角」构成概念对位，一正一反锁死概念边界。"
      exceptions: []
