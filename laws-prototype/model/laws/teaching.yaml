      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；登记为设计标准层（呈现法标准）", basis: "清单 v6 TM-29 原文"}
  - id: TM-30
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "不按体系编书，按「你会卡住的问题」编书：用法词典路线（Swan）"
    headline_kid: "这本书不像课本一课一课教，它像一本「问题词典」：你写句子时卡住了，按问题去查，它专答这类问题。"
    claim:
      type: rule
      statement: "用法词典的组织标准：以学习者问题而非语法体系为组织原则——条目的立项标准不是「语法体系里有这一格」，而是「教师和学习者真的会问、真的会错」。典型条目形态：「X 还是 Y」、「这个说法错在哪」（常见错误专条）、「这个词的脾气」（单词语条）。第 4 版（2016）重组为 Part 1 主题语法（各节导言专列常见错误）+ Part 2 A–Z 词汇问题指南，在线版另配 87 项诊断测试，把「查病」升级为「先测出病、再查条目」的分诊闭环。"
      evidence: "Michael Swan《Practical English Usage》(OUP；初版 1980，第 4 版 2016, ISBN 9780194202411)；第 4 版两部分结构与 87 diagnostic tests 据 OUP 官方文案（书商页转载原文互证）；冠词条目位置（第 12 节、条目 134–143）为本清单此前核查结论。接触等级：出版社文案级 + 书目级。"
      scope: "本 App「病句医院/错点检索」形态的组织标准（设计标准层登记）；Swan 路线答「我这儿怎么了」，学程路线（TM-28）答「我该学什么」，二者互补。"
      exceptions:
        - "问题驱动的代价是体系性缺席：初学者无问题意识时无从查起，Swan 路线必须与学程路线或课程搭配，不能单独充当学习路径。"
        - "条目以英式英语为默认立场处不少；其裁决简化程度高于学术描写（以 CGEL/LGSWE 为终审，见 TM-31）。"
    mechanism:
      - beat: "与 Murphy 路线的对照"
        text_adult: "Murphy 是学程（把语法切成单元供系统学习，骨架仍是课程），Swan 是查病（把语法切成问题供按需检索，骨架是问题清单）；Swan 在本清单此前已多次作为用法裁决来源出现，本条补的是其作为方法的一层。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "源条目自带例：冠词内容在第 4 版第 12 节、条目 134–143，各节导言专列常见错误。"
        supports: "claim"
    error_cases: []
    relatives:
