  - id: TM-32
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "先讲英语从哪儿来，再讲它为什么长这样：历史视角是语法书的序章（Jespersen）"
    headline_kid: "英语以前不是这样的：词尾本来一大堆，后来慢慢掉光，意思改靠词序和介词来扛。先知道这段「家族史」，很多「为什么」一下就通了——但老先生说英语「越变越好」，这句今天的语言学家可不全同意。"
    claim:
      type: tendency
      statement: "Jespersen《Growth and Structure of the English Language》(1905) 立的是成因式理解传统：把现代英语的每条结构放回其历史成因中解释（屈折脱落、词序与功能词接管语法、词汇分层），规则不再是天条，而是某段历史的沉淀。本条定位为书房总序级：给 GR 组提供「为什么英语把语法写进词序」的出处与原始表述，并同时登记其时代局限。"
      evidence: "Otto Jespersen (1905)，获 Prix Volney；「最广为阅读的英语史入门」据 Nielsen (1989)，经 Wikipedia 条目转引核对；进步观概括据 Aitchison《Language Change: Progress or Decay?》三观框架的学术二手转述。接触等级：二手系统论述级（原书正文未打开，引文均为带出处的转引）。"
      scope: "引用本条只许用其视角与叙事框架：事实性历史叙述与价值论断必须分开取用。"
      exceptions:
        - "严禁把「分析语更进步」作为结论输送给学生；给学生讲英语史时，进步观只能作为「老先生当年这样想、今天我们不这样看了」的分歧材料出现。"
    mechanism:
      - beat: "进步观的原貌"
        text_adult: "Jespersen 主张语言由综合向分析的演变是「简化即改进」（《Progress in Language》1894 系统立论），赞美英语走在分析化最前列、机器「无声运转」（noiseless machinery)，并以「务实、阳刚、简洁、有逻辑」礼赞英语的民族性格。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "师承显式化"
        text_adult: "「历史原则」是 Jespersen 全部语法工作的纲领（七卷本语法以 on Historical Principles 名世）；本清单 GR 组的历史解释路径（分析语总叙事、词形残余的今释）与这一传统同源。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: GR-26, rel: 同族}
      - {id: TM-31, rel: 同族}
    quiz: []
    probes: []
    prereq: []
    order: 32
    pain_points: []
    adult:
      sources:
        - "Otto Jespersen, Growth and Structure of the English Language (1905；1982 年版常被引用）；Hans Frede Nielsen (1989) 评语经 Wikipedia「Otto Jespersen」条目转引；Jean Aitchison, Language Change: Progress or Decay?（三观框架）。"
      boundary: "事实性历史叙述（屈折脱落过程、借词分层）经后世历史语言学大体继承（细节多有修订）；价值论断（进步、民族性格礼赞）是二十世纪初欧洲语文学的时代产物，在现代语言学中不成立。"
      disputes: "分歧即本条核心登记项：Hjelmslev 批评其「效率/省力」概念含混、断其进步论题「远不令人信服」，但承认其表述生动、影响巨大；Aitchison 的现代共识框架取中立观（非进步亦非退化）；同代人 Schleicher 等恰以分析化为「退化」，与 Jespersen 价值方向相反而价值化方法相同。描写可以，价值裁决出局。"
      evidence_grade: "二手系统论述级"
      pending:
        - "原书正文未打开；引文均为带出处的转引，已逐处标注（清单登记）。"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；进步观按分歧材料登记，禁用作结论", basis: "清单 v6 TM-32 原文及入模口径"}
  - id: TM-33
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "国家队排的拼读队列：Letters and Sounds 六阶段——先用 19 个字母让孩子拼出第一批词，再给 44 个音逐个上门牌，最后一年转攻拼写"
    headline_kid: "学拼读像排队过关：第一关先学一小撮字母，刚够拼出 sat、pin 这些小词；后面把声音一个个补齐，再练把声音挤在一起读，最后转攻拼写。"
    claim:
      type: rule
      statement: "Letters and Sounds（DfES 2007）只规定进度与覆盖：六阶段按「解锁真词的速度」排序——Phase 1 声音游戏练耳朵不碰字母；Phase 2 以 5 组共 23 个 GPC（19 个字母）开局，第一组 s a t p 学完即可拼 at/sat/pat，解码与编码从第一天起作可逆的同一技能教，首批 tricky words 为 the/to/I/no/go；Phase 3 再教约 25 个字素至约 42 音各有代表拼法；Phase 4 不教新 GPC，专练相邻辅音与多音节词；Phase 5 转「一音多拼」（新字素 + 分裂二合字母 + 替代读法）；Phase 6 转攻拼写（-ed 与后缀加法、拼长词策略）。"
      evidence: "DfES《Letters and Sounds: Principles and Practice of High Quality Phonics》(2007，文件号 00281-2007FLR-EN)；经多家学校与地方当局转发的官方梗概交叉核对，Phase 2 五组、Phase 3 字素清单、Phase 5 字素表三处逐项一致；政策上游为 Rose 审查（CG-13）。接触等级：二手系统论述级。"
      scope: "拼读序列设计标准（设计标准层登记）；引用「Letters and Sounds」必须说清指 2007 框架还是其后代课程（见 exceptions）。"
      exceptions:
        - "它是一份框架文件，不是成套课程：2007 原件只有原则、进度与活动示例，无逐课教案、配套读物与教师培训体系。2021 年起 DfE 改行「验证 SSP 课程」名单制，2007 本身退出名单；直系后代 Little Wandle Letters and Sounds Revised（2021 经 DfE 验证）保留六阶段进度、补齐教案与读物。"
        - "进度按英格兰学制（4–7 岁母语儿童、每日课时）编排：中国孩子迁移时，阶段的内容与次序可借，时长与年龄对应不可搬（中国孩子还有 S-43 的音系包袱）。"
        - "Phase 3 字素计数有口径差：官方梗概作 25，逐项枚举得 26（oo 一形两音与 ure 的计数约定），登记为口径差。"
    mechanism:
      - beat: "排序逻辑"
        text_adult: "排序不按字母表、按产出：Set 1: s a t p；Set 2: i n m d；Set 3: g o c k；Set 4: ck e u r；Set 5: h b f ff l ll ss——第一组学完同周即有「我能读词」的成功经验。Phase 3: Set 6: j v w x；Set 7: y z zz qu；二合字母 ch sh th ng；元音字素 ai ee igh oa oo ar or ur ow oi ear air ure er；字母名在此期引入。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "教学形态"
        text_adult: "每日独立的短时拼读时段，与全天语言环境并行（Rose 的「置于丰富语言课程中」限定，见 CG-13）。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "Phase 2 首组可拼词（源条目）：at、sat、pat——第一组学完即可拼出真词。"
        supports: "claim"
      - level: 2
        word_ids: []
        sentence: null
        scene_note: "Phase 4 相邻辅音练习词（源条目）：tent、hump、champ（CVCC/CCVC）与多音节词。"
        supports: "claim"
    error_cases: []
    relatives:
      - {id: TM-34, rel: 同族}
      - {id: TM-35, rel: 同族}
      - {id: CG-13, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 33
    pain_points: []
    adult:
      sources:
        - "DfES, Letters and Sounds: Principles and Practice of High Quality Phonics (2007)；Little Wandle Letters and Sounds Revised (Wandle Learning Trust 与 Little Sutton 小学，2021 年 6 月经 DfE 验证）。"
      boundary: "队列的内证：satpin 式开局使「第一周拼出真词」成为结构事实；它与 Phonics Screening Check 互为表里（筛查词表约 24/40 含辅音丛，正是 Phase 4 的训练目标，见 TM-34）。英格兰曾有过半学校以它为拼读基础（DfE 背景材料经书商行业页转述）。"
      disputes: "框架内部的工程分歧（Phase 1 长度、个别低频 GPC 排位）教师界素有争论，属课程工程层；更大的路线分歧（合成优先是否优于其他系统拼读形态）不在本条裁决，见 TM-35 证据层与 CG-13 分歧栏。"
      evidence_grade: "二手系统论述级（官方梗概多源一致；原书 PDF 本轮未逐页打开）"
      pending:
        - "Letters and Sounds 原书 PDF 本轮未逐页打开（清单登记）。"
