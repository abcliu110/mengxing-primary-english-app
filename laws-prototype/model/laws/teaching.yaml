  - id: TM-20
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "替换表：把句型印成一张网格——纵着换主语、横着换词组，骨架不动，句子随便造"
    headline_kid: "把一个句型做成一张表：学生随便挑格拼一句，拼多少句都对——先让骨架在手里变熟。"
    claim:
      type: tendency
      statement: "替换表把句型排成表格：每一列是一个可替换槽位，列内是同类成分，学生纵横选配即可生成大量合式句子，教学意图是口头操练内化句型骨架而非背规则。在 TM-19 尺子上是机械操练层的经典器械，但槽位组合自由度使学生选配时已在做最低限度的意义选择；它就是构式「骨架+槽位」的纸质原型（与 CO 组构式槽位观呼应）。"
      evidence: "Hornby《A Guide to Patterns and Usage in English》(1954) 与 Palmer、Hornby 等人的句型分类；经 Richards & Rodgers《Approaches and Methods in Language Teaching》第 3 章原文著录核对。接触等级：二手论述级。证据等级：从业传统（方法史经典著录；无效果实验传统）。"
      scope: "新句型呈现后最初几分钟的骨架熟悉工具；随后必须按 TM-19 升层到有意义与交际操练。"
      exceptions:
        - "学生可能全程不理解自己在说什么（机械层通病）；不规则与例外只能另表处理。"
        - "训练骨架熟练度，不训练搭配的地道性与 TM-02 的「用」维得体性。"
    mechanism:
      - beat: "句型体系的沉淀"
        text_adult: "句型分类被编入第一本学习者词典（Hornby, Gatenby & Wakefield 1953）的动词句型标注；现代学习词典的动词句型标注即其直系后代——两代教材的基础设施。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
