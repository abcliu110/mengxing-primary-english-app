  - id: WA-09
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "教语法之前先给规则分三类：顺手能学会的、怎么都学不全的、和夹在中间的——老师的力气只该花在中间那一类"
    headline_kid: "学语法像学本事：有些事看几眼自己就会，有些事练很久也未必完美，最值得老师认真教的，是那些「讲一讲就通、自己摸半天也摸不透」的中间部分。"
    claim:
      type: tendency
      statement: "规则难度三分类决定显性教学的投放：(1）简单显性的规律，接触中即可自学（如 SVO 语序）；(2）复杂到在合理时间内用任何方法都学不全的规律（如英语冠词——但该类的具体落点随学习者母语而变）；(3）中间地带（如疑问句构式）——显性教学的价值恰恰只落在第三类，「五分钟的讲解能省掉在令人困惑的输入里摸索的大量挣扎」。配套：知道规则 ≠ 会用，但知道是必要起点（DeKeyser 1998「程序性掌握拄着陈述性知识的拐杖」）；「教了还错」不证明教学无用；正确性须按目的分级（妨碍理解的错误与无关紧要的错误必须分开）。"
      evidence: "Michael Swan, Why Teach Grammar?, Teaching English with Oxford（OUP 官方教师博客，2012-03-19 发表、2019-05-16 出版社更新维护），本次直接打开原文全文核实（九节问答 + 参考文献齐全）；文中实证分量来自其引用的 Norris & Ortega (2000) 与 Spada & Tomita (2010) 两项元分析。接触等级：原文级。证据等级：专家专栏（非同行评审）。"
      scope: "「该不该教、教哪一类」的总论（教师层），不提供具体教法（教法见 TM 簇）；Swan 论证的课堂原型是「每周三小时」的外语课（欧洲中学典型语境）。"
      exceptions:
        - "三分类的落点随母语而变：冠词在 Swan 笔下属「学不全」类，但对汉语母语者恰是小学阶段必教必练的项目——入模须与本清单 C 组冠词诸条对读，不许把他的分类清单直接搬给中国孩子。"
        - "“Forget Krashen” 是论战修辞，不许当作定版结论引用；本清单对 Krashen 的登记口径见 CG-14，引用本条时两条须对读。"
        - "第 (2）类的划界本身可争——「学不全」是相对于课时与目标的判断，不是语言项的内在属性；Swan 自己亦以目的分级收束，未把分类绝对化。"
    mechanism:
