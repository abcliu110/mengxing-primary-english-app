  - id: WA-01
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "课堂的真材料是学生自己说的话：教材可以放下，谈话先行（Dogme / 涌现式教学）"
    headline_kid: "课本先放一边——你今天最想说的那件事，就是这节课的课文。你试着说，老师把你的话补成漂亮的整句写在黑板上，那就是我们今天学的新句子。"
    claim:
      type: tendency
      statement: "Dogme（涌现式教学）主张三条：以谈话为驱动、轻材料、聚焦涌现的语言——不在预设的语法进度表里选句子，而是抓住学习者当场想说而说不完整的话，当场加工成目标形式。本清单取其内核机制（让教学语言从学生的真实表达中涌现并当场回铸），不取其「反教材」禁令。"
      evidence: "Scott Thornbury, D is for Dogme, 博客《An A–Z of ELT》(2010-02-28)，经 British Council 官方导读全文核实；专著版 Meddings & Thornbury《Teaching Unplugged》(Delta, 2009)，获 2010 年 ELTon 奖。经典地位（清单登记）：作者为 ELT 方法论代表人物，该博客是 ELT 界影响最大的专家博客之一；Dogme 讨论组 2000 年发起，二十余年后仍是教师培训常设议题。"
      scope: "方法论宣言与实践传统（教师层），不是实证研究结论。"
      exceptions:
        - "Dogme 强式（不用教材）在小学阶段不适用——低龄学习者恰恰需要故事、图片等材料支架（见 WA-07/WA-08）；可迁移到小学的只是其内核机制。"
        - "部分学生期待以教材为锚，据 Dogme 原则授课会让这类学生不安（源条目如实记录的教师侧保留）。"
    mechanism:
      - beat: "招牌实例"
        text_adult: "学生说出 “See..friend..no see….fifteen years!”，教师把它补写成黑板上的 “I've just seen a friend I haven't seen for fifteen years!”——进度表让位于学习者真实的表达需要，语法点从学生嘴里「长」出来（British Council TeachingEnglish 导读文实例）。"
