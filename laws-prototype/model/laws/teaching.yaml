  - id: TM-31
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "语法书本身也在进化：三代参考语法 = 三种「语法怎么写」的方法（Quirk → LGSWE → CGEL）"
    headline_kid: "给大人用的大语法书，一代比一代不一样：第一代靠大师的语感写，第二代先数四千万词的真实文章再写，第三代干脆把词类名单都改了。"
    claim:
      type: tendency
      statement: "参考语法有三代描写方法：Quirk 一代（1985，综合/传统，以专家判断为据的官方全景）、Biber 一代（LGSWE 1999，语料/分布：基于 4000 万词语料，一切结论按会话/小说/新闻/学术散文四语域给频率，语法事实长成概率形态）、Huddleston & Pullum 一代（CGEL 2002，形式/范畴改革：如把 before/after/since 等一并划入介词）。教师手里的任何「规则」都应先问出自哪一代：三者的证据形态不同，不可混引。"
      evidence: "Quirk et al. (1985, Longman)；Biber et al. (1999, Longman, ISBN 0-582-23725-4)，语料规模与语域构成据 Journal of English Linguistics 31(1) (2003) 书评（Hirst）与 TESL-EJ 书评互证；Huddleston & Pullum et al. (2002, CUP)，介词重划（pp.599–600）与自序定位（2002: xv）据 HLT Magazine 学术文章与书评、Wikipedia 互证。接触等级：学术书评级 + 二手系统论述级（三部原书正文均未打开，页码级引文为书评转引）。"
      scope: "引用裁决的代际坐标（教师/设计层）：本清单 CB 簇以 LGSWE 为核心锚点、GR 簇多处以 CGEL 为裁决来源、PR-10 中 Quirk 一派已作分歧一方出现。"
      exceptions:
        - "谱系是方法史简化：三代并非后代淘汰前代——Quirk 的可接受度分级仍有实用价值，CGEL 的范畴改革未被教材语法普遍采纳，LGSWE 的频率结论受其语料构成限制；「代际」只标证据形态与写作方法，不标真理等级。"
        - "简称撞车：Quirk 1985 与 CGEL 2002 在文献中同被缩写为 CGEL，本清单以「Quirk 1985 / H&P 2002」区分。"
    mechanism:
      - beat: "范畴手术的标本"
        text_adult: "CGEL 把传统上作从属连词、副词的 before/after/since 等一并划入介词（可带从句补语、所带短语结构与其他中心词短语平行）；determiner 在 Quirk 处是词类名、在 CGEL 处改为功能名（词类改称 determinative），两书术语恰好对调。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "谱系的无争议性"
        text_adult: "Wikipedia 与书评界对三者的前任/后继定位一致（LGSWE 是 ComGEL 1985 的 successor、CamGEL 2002 的 predecessor)，Leech 一人横跨 Quirk (1985) 与 LGSWE (1999) 两代作者席、并为 CGEL 写长篇书评 (2004)。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-29, rel: 对照}
      - {id: TM-30, rel: 对照}
      - {id: PR-10, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 31
    pain_points: []
    adult:
      sources:
        - "Quirk, Greenbaum, Leech & Svartvik, A Comprehensive Grammar of the English Language (1985, Longman)；Biber et al., Longman Grammar of Spoken and Written English (1999, Longman)；Huddleston & Pullum et al., The Cambridge Grammar of the English Language (2002, CUP, 1842 页）。"
      boundary: "本条将三代从「被引用的点」立为「谱系」：点的引用自此有了代际坐标，引用任何一代的结论时可按其证据形态自动标价。"
      disputes: "CGEL 术语改革本身即分歧现场：有书评称其分析「任意、与他书对照时制造混乱」，Leech (2004) 则称其为英语语法的新「格雷解剖学」；LGSWE 的分布描写被问「只有频率、没有范畴裁决，教师备课仍需另找答案」——三代之争的实质是「语法书该给判断、给数据、还是给体系」，无终局。"
      evidence_grade: "学术书评级 + 二手系统论述级"
      pending:
        - "三部原书正文均未打开；页码级引文为书评转引，已标注（清单登记）。"
    status: 已入模
    version: "1.0"
