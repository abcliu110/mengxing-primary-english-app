  - id: TM-13
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "口语任务的设计谱系：信息差、交际游戏、模拟、项目——任务的「条件」决定练到哪族技能"
    headline_kid: "练说话的活动分四种玩法：你知我不知的拼图式、带规则的游戏式、扮成别人演一场的模拟式、几个人一起做件真事的项目式——换玩法，就是换练的本事。"
    claim:
      type: tendency
      statement: "课堂口语活动立为四类谱系：信息差活动（双方各持对方没有的信息，必须开口才能拼全）、交际游戏（规则制造真实的信息与决策需求）、模拟（在「像真的」压力下综合运用两族技能）、项目式互动（以真实产出物为目标的长程协作）。分类的深层标准是任务条件对产出的塑造：教师选任务即是选技能。书末立场：教师即研究者，框架给的是谱系与变量，不是保证书。"
      evidence: "Bygate《Speaking》第 10 章四类活动与第 12–14 章结构（影印本目录原文）；引言方法论自白为引言原文读到。接触等级：章节预览级（目录+引言原文）。"
      scope: "口语任务设计（教师层）。"
      exceptions:
        - "四类按 1987 年的课堂形态写成，未含数字媒介互动；迁到 app 场景时分类逻辑（以任务条件分类）仍可用，活动实例须重设。"
    mechanism:
      - beat: "任务条件决定技能"
        text_adult: "同一语言点，信息差练的是协商与澄清，模拟练的是得体与管理，游戏练的是速度与自动化。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "教师即研究者"
        text_adult: "任务效果依语境而变，教师应通过小规模课堂项目（收集数据、探索口语方法）检验任务在自己班上的实际效果。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-12, rel: 同族}
    quiz: []
    probes: []
    prereq: []
    order: 13
    pain_points: []
    adult:
      sources:
        - "Martin Bygate, Speaking (1987, OUP) 第 10、12–14 章；影印本同 TM-12。"
      boundary: "模拟活动对小学儿童的角色扮演能力是加分项（儿童本就擅长假装游戏）——此点是清单的适配判断而非原书表述（源条目已标明）。"
      disputes: "任务型教学（TBLT）阵营后来把「任务」升格为整个大纲的单位，超出本书「活动谱系」的定位；本书立场是方法论的（任务是教师的工具箱），与 TBLT 的大纲主张有别——引用时勿混。"
      evidence_grade: "章节预览级（目录+引言原文）"
