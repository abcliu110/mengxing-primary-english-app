      boundary: "「第五技能」是教学论主张，不是心理语言学实证定律；证据基础以理论论证与课堂观察为主，无大规模对照实验背书。"
      disputes: "与偏认知-显性教学的立场存在张力：显性教学元分析显示讲解对测验型产出效率高；Larsen-Freeman 的反驳是测验型产出≠交际中可用——双方测的「学会」不是同一个东西，分歧实质在评价标准。"
      evidence_grade: "作者自述级 + 二手论述级"
