      boundary: "「motor-perceptive」为学界对该书生产技能的通行标签，书内第 3 章原题为 Production skills——引用时以「生产技能（motor-perceptive）」并列为妥。"
      disputes: "以准确性为先的阵营批评该框架给 facilitation/compensation 的合法性会纵容错误固化；Bygate 的回应在书内第 12 章：准确与互动是课程配比问题——与 TM-04、TM-09 同属「配比派」。"
      evidence_grade: "章节预览级（原文），一处引文二手转引"
