      sources:
        - "Mad Libs (Leonard Stern & Roger Price, 1953/1958; Price Stern Sloan)；Wikipedia 条目与 Publishers Weekly 50 周年报道 (2008)。"
      boundary: "与 TM-22 语法拍卖的区别：拍卖练完整句子的对错判断，本条只供词、不判断结构。"
      disputes: "无学术分歧可记；教育评论的保留集中在其「脱离语境练标签」的性质——与用法本位立场（类别在用法中习得）方向相反。"
      evidence_grade: "二手论述级；证据本体为通俗游戏传统"
      pending:
        - "销量数字（逾 1.1 亿册）为出版方口径，未独立核计（清单登记）。"
