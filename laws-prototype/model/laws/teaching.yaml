  - id: TM-05
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "语法课的六条戒律：到语境里教、拿去用、省着教、教有用的、留出「长出来」的空间、看人下菜"
    headline_kid: "教语法有六条别犯的错：别脱离故事讲、别光讲不用、别一股脑全倒出来、别教用不上的、别催着全学会（有些要慢慢长）、别对谁都一个教法。"
    claim:
      type: tendency
      statement: "语法教学的底线是六条戒律：语境律（在语篇语境中教）、使用律（目标是使用能力）、经济律（讲解最小化）、相关律（只教与当前水平与需求相关的）、培育律（语法能力多是「长出来的」，教学供给生长条件）、适切律（方法服从学习者条件）。六条是否决线，须整组使用；与 TM-03 的 E/A 选择器配套。"
      evidence: "Thornbury《How to Teach Grammar》第 10 章「How NOT to teach grammar」；六条文本据教师培训资料全文转载与多份二手论述互证。接触等级：章节预览级（目录原文）+ 二手全文转述。"
      scope: "语法课设计否决线（经验法则 heuristics，非实证定律）。"
      exceptions:
        - "培育律若被极端化（什么都不教、只等长出来）恰是 Thornbury 本人反对的强交际极端——它受语境/使用/相关三条约束，必须整组使用。"
        - "经济律的「短」没有量化标准，属设计检查。"
    mechanism:
      - beat: "六戒律清单"
        text_adult: "Rule of Context：孤立句呈现的是残缺的形式-意义配对；Rule of Use：规则知识只是中途站；Rule of Economy：讲解越短，练习时间越多；Rule of Relevance：只教相关的；Rule of Nurture：供给丰富的可理解输入、使用机会与注意引导；Rule of Appropriacy：服从年龄、水平、班额、期望与文化。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "涌现主义表态"
        text_adult: "Nurture 一条是 Thornbury 涌现主义倾向的明确表态：语法是复杂系统的涌现属性，教学能做的培育多于建构——「教，但教得像园丁而非工程师」。"
        text_kid: null
        visual: null
        anchors: []
