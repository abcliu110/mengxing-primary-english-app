  - id: TM-09
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "听力课要有「六种听」的配比：精听、选听、互动听、泛听、回应听、自主听"
    headline_kid: "听英语有六种听法：逐字抠的听、抓重点的听、边听边接话的听、听着玩的听、听完要表态的听、自己找来听的听——六种都练到，才叫会听。"
    claim:
