  - id: WA-03
    zone: 支撑层
    group: WA
    audience: teacher
    headline: "骂一句话之前先认准它是不是被动句：不及物动词根本没有被动形式"
    headline_kid: "想批评一句话「躲躲闪闪」，先认准它到底是不是被动句——像 ensue、happen 这类词压根变不出被动句。认错了句式，道理就白讲了。"
    claim:
      type: rule
      statement: "被动是形式范畴：由 be/get + 过去分词构成、主语对应主动句的宾语；不及物动词没有宾语，结构上不可能有被动式——把 ensue 的句子叫被动是范畴错误。误认的危害不在术语洁癖：真正想批评的「把责任说没了」是内容与归责问题，一旦错扣「被动语态」的帽子，真问题反而被放过。"
      evidence: "Geoffrey K. Pullum, Passive voice wrongly accused yet again, Language Log (2012-04-13)，打开全文核实；被动的形式判准以《The Cambridge Grammar of the English Language》(2002) 描写成果为据（清单 NE-15 同源）。经典地位（清单登记）：作者为 CGEL 联合主编，Language Log 为宾夕法尼亚大学语言学团队群体博客（2003 年创刊），案例库持续十余年。"
      scope: "教师与教材编写者纪律（教师层）：引进任何「别用被动句」类规则前，先用形式判准自检。"
      exceptions: []
    mechanism:
      - beat: "误认的源头"
        text_adult: "Orwell 名文与 Strunk & White《The Elements of Style》第 18 页的坏示范污染了几代评论者对「被动」的识别；Pullum 与 Liberman 多年在 Language Log 建起「被动误认案例库」，逐例存档（如企业文体指南把完成体 have decided、将来进行 will be implementing 误标为被动，Pullum 以「0 for N」计数法记录）。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases:
      - wrong: "《经济学人》把不及物动词 ensue 的句子斥为「被动语态」"
        right: "ensue 无宾语、无被动形式；该句的问题（若有）在内容与归责，不在语态"
        error_type: "被动误认"
        source_type: "条目成人层登记的事故例（Pullum 2012 文逐例存档）"
        diagnosis: "未用形式判准（be/get + 过去分词、主语对应主动句宾语）先行认准句式。"
      - wrong: "企业文体指南把 have decided（完成体）、will be implementing（将来进行）标为被动"
        right: "二者均为主动语态的其他时体形式，不含被动结构"
        error_type: "被动误认"
        source_type: "条目成人层登记的事故例（Language Log 案例库）"
        diagnosis: "同上：以「读起来正式/含糊」的印象代替形式判准。"
    relatives:
      - {id: WA-04, rel: 同族}
      - {id: WA-05, rel: 同族}
