  - id: TM-22
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "语法拍卖：把「判断对错」变成花钱决策——语法游戏这一路的招牌形态"
    headline_kid: "给每组发一笔假钱，逐句拍卖：这句你觉得对，就出价抢；抢错了，钱货两空——为了不亏本，全组会把每一句掰开揉碎地审。"
    claim:
      type: tendency
      statement: "语法拍卖：各组持等额虚拟货币，对真假掺半的句子逐句竞价，拍下对句得分、错句扣钱，教师逐句揭晓订正。其学习机制不在游戏本身，而在逼出的三种行为：下注前的集体审查（判断过程外化为讨论）、风险定价（元语言确信度被迫显性化）、揭晓时的高注意订正。语法收益来自它所包裹的判断与讨论行为，而非游戏形式本身。"
      evidence: "活动所属传统的资源书锚点：Rinvolucri《Grammar Games》(1984, CUP)，书目、目录五编结构经多家大学图书馆目录著录核对；拍卖变体在该书中的逐页著录未核到，作教师资源传统的通行活动著录。接触等级：目录级/传统著录。证据等级：从业者传统 + 课堂智慧（无对照实验；不许写成实证结论）。"
      scope: "小学更适合简化为举牌判断或小组投票版；拍卖全套规则更适合小学高段以上。设计时必须把「出价组说出判断理由才成交」写进规则。"
      exceptions:
        - "胜负心可能压过审句本身（为赢而赌运气），须用规则对冲。"
        - "错句须是学生真会犯的典型错；错句材料质量决定活动质量（与病句医院取材纪律一致）。"
    mechanism:
      - beat: "游戏规格传统"
        text_adult: "Rinvolucri《Grammar Games》五编——竞争性游戏、合作造句游戏、意识活动、戏剧中的语法、杂编——确立了「每个游戏锁定一个或数个语法点、并标注水平/材料/时长」的游戏规格写法；拍卖是竞争性游戏一脉中流传最广的变体之一。其判断与订正环节近 TM-16 意识提升，驱动源从任务好奇换成胜负与风险。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-16, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 22
    pain_points: []
    adult:
      sources:
        - "Mario Rinvolucri, Grammar Games: Cognitive, Affective and Drama Activities for EFL Students (1984, Cambridge University Press, ISBN 978-0-521-27773-0；1995 年已第 16 次印刷）。"
      boundary: "该书四十年间持续再版、被各国教师培训列为常备书目，其「经典」地位来自实践共同体的长期采用，而非研究文献。"
      disputes: "无成派的学术分歧；实践层保留意见主要是课堂管理派（时间成本、噪音、输赢情绪）与动机派（游戏化提升参与）之间的老争论。"
      evidence_grade: "目录级（资源书）/ 传统著录（拍卖变体）；证据本体为从业者传统"
      pending:
        - "拍卖这一具体变体在 Rinvolucri 书中的逐页著录未核到（清单待核表登记）。"
