      boundary: "三维框架是英语教师培训中引用率最高的语法分析工具之一；具体语用判断仍需语料与语境支撑（本清单 E 组即是「用」维的实例库）。"
      disputes: "无主流反对意见；争议主要在操作层面——三维在课堂时间有限时如何配比，无定论。Swan 等实用语法立场更强调规则的真与可教性（见 TM-03），与三维框架互补而非冲突。"
