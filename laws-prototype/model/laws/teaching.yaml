      statement: "故事课的选书须同时过两把尺：语言年龄与心智年龄——孩子的第二语言水平可以落后，但他们的观念与志向与发育年龄相称（“The key to successful storytelling is having the right story for the linguistic and cognitive ability of the children.”）。配套两条：图画是理解的脚手架（把听到的声音与看到的画面对位，无需翻译即可把握整体意义）；故事是跳板不是终点（准备活动—讲述中活动—后续活动的序列，一开始就告诉孩子本课的产出）。"
