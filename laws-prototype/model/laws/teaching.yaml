  - id: TM-04
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "练语法有三个不同的目标：练准、练顺、练到「重组」——混为一谈是练习失效的主因"
    headline_kid: "同一组练习，目的可能完全不同：有的是把句子说对，有的是把句子说顺，还有的是把脑子里那套旧说法换新——先说清这次练的是哪个。"
    claim:
      type: tendency
      statement: "语法练习有三个递进的靶：Accuracy（准确）、Fluency（流利）、Restructuring（重组——已有的中介语系统被新证据推翻重建）；操练只巩固已有系统，错误系统会被越练越牢，除非练习内含迫使重组的新证据与冲突。纠错推崇 reformulation（改述），时机与方式是设计变量。"
      evidence: "Thornbury《How to Teach Grammar》第 6、7、8 章（章标题与分节见全书目录原文）；接触等级：章节预览级（目录原文）+ 二手互证。restructuring 概念源于 McLaughlin 的中介语重组说。"
      scope: "练习设计检查（三靶是单元与学期尺度的设计检查表，不是课时目标——重组是周/月尺度的变化）。"
      exceptions:
        - "改述对极低水平学习者（听不出差别）效果有限，属有条件推荐。"
    mechanism:
      - beat: "三靶分工"
        text_adult: "准确靶的典型活动是受控操练；流利靶是交际任务；重组靶要求练习内含迫使系统改组的新证据与冲突，是三者中唯一触及「系统变化」的靶，也是多数课堂练习实际缺席的靶。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "改述式纠错"
        text_adult: "reformulation：教师（或同伴）把学习者的话用正确地道的形式重说一遍，学习者对照自省，而非当场打断纠错。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "课型之争即配比之争"
        text_adult: "PPP（呈现-练习-产出）与任务型替代模型的分歧，实质是三靶的配比之争（第 8 章）。"
        text_kid: null
        visual: null
        anchors: []
