  - id: TM-02
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "每个语法单位都要过三问：长什么样（形）、什么意思（义）、什么时候用（用）"
    headline_kid: "学一个新句型，先问三句：它长什么样？它说的是什么事？什么场合才轮到它出场？"
    claim:
      type: tendency
      statement: "任何语法单位同时有 form（形式）、meaning（意义）、use（使用：语境、语域、语用功能）三个维度，分别对应产出质量的准确、有意义、得体；只教形义两维的语法课在结构上必然漏掉得体性。教学设计应显式标注每个语法点的「用」维内容。"
      evidence: "Celce-Murcia & Larsen-Freeman《The Grammar Book》(1999 第 2 版；2015 第 3 版）三维框架；Larsen-Freeman 访谈自述与多份教师培训教材转述互证。接触等级：作者自述级 + 二手论述级。"
      scope: "语法教学设计与条目著录的检查维度（本 App 规律条目的形/义/用审查口径来源）。"
      exceptions:
        - "「用」维的边界随语境滑动，无法像形维那样给出封闭清单——框架给出的是检查维度，不是每维度的现成答案。"
    mechanism:
      - beat: "三维派图"
        text_adult: "三维画成一个可转动的「派」（pie），教学时可从任一维度切入并重组配比；三维各对应一种产出质量：形→准确、义→有意义、用→得体。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "用维缺失的经典例"
        text_adult: "学习者知道 house 的意思却不知道何时该说 residence/dwelling/domicile——词典给了形和义，「用」这一维（正式程度、场合）从没人教，于是产出虽对却不得体。"
        text_kid: null
        visual: null
        anchors: []
    examples:
