  - id: TM-12
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "会说话 = 两件本事：一件是「嘴跟得上」（生产技能），一件是「脑子跟得上场面」（互动技能）"
    headline_kid: "开口说英语要过两关：一关是嘴巴利索——听清、想起、按对的顺序把声音说成串；一关是脑子在线——轮到谁说、没听懂怎么问、说不下去怎么绕。两关都得练，只练一关，另一关照样卡。"
    claim:
      type: tendency
      statement: "口语技能拆为两族：生产技能（感知、提取并按正确顺序发出声音与结构，须练至近乎自动，含 facilitation 顺畅化与 compensation 补偿两个合法部件）与互动技能（套路 routines、意义协商、互动管理三件套）。知识≠技能：知道语法词汇只是知识，能在当场快速决定、顺畅执行、随意外调整，才是技能。"
      evidence: "Martin Bygate《Speaking》(1987, OUP) 第 1、3、4、5 章；本次打开 Scribd 影印本版权页、目录、引言与第 1 章原文。接触等级：章节预览级（原文），pp.20–21 引文为二手转引。"
      scope: "口语教学的技能架构（教师层；原书为成人学习者语境写成）。"
      exceptions:
        - "迁到小学须降格：互动管理对儿童简化为轮次与求助脚本；生产技能的自动化标准按儿童语速与注意跨度下调。"
    mechanism:
      - beat: "知识/技能之分"
        text_adult: "「外语教学的一个基本问题，是让学习者能够使用语言」（p.3）；书中以开车作喻：知道操纵杆的名字≠会开车。说话是实时发生的，没有回改余地，且听者就在对面——言语的加工条件与互惠条件根本不同于写作。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "补偿手段正名"
        text_adult: "facilitation（简化、省略、用熟式填充）与 compensation（换词、迂说、求助）能帮学习者开口、从而学会开口，并让他们听起来像正常的说话者（pp.20–21）——在技能框架内「绕过去」不是作弊。第 5 章交际策略分成就策略（achievement）与缩减策略（reduction），教学应奖励成就策略。"
        text_kid: null
        visual: null
        anchors: []
