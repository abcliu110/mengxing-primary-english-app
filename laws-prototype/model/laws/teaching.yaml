  - id: TM-01
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "语法不是一套要背的知识，是第五种技能：会「用形式做事」才算会语法"
    headline_kid: "知道规则像知道菜谱；会语法像会炒菜——要在说话的当口，顺手把对的词形端出来，还得端得合场合。"
    claim:
      type: tendency
      statement: "语法能力（grammaring）是继听说读写之后的第五种技能：准确、有意义、得体地使用语法结构的能力；它靠在有意义的使用中反复调动而长，不靠背静态规则系统。规则讲解至多是技能形成的一个输入口，不是学会本身。"
      evidence: "Diane Larsen-Freeman《Teaching Language: From Grammar to Grammaring》(2003) 提出 grammaring 定义；作者 ELT Journal 访谈（2007）自述与 OUP 官方介绍互证。接触等级：作者自述级 + 二手论述级。"
      scope: "语法教学的目标设定与课型设计（教师层立场条目）。"
      exceptions:
        - "显性规则讲解对测验型产出效率高——本条否认的是「讲解=学会」，不否认讲解的输入价值（作者本人立场）。"
    mechanism:
      - beat: "惰性知识问题"
        text_adult: "传统教学产出惰性知识：学生课上能填对空格，真实交际中却用不出来，因为背的是静态规则系统，而规则在真实使用中是动态、可变的。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "技能与知识的习得方式不同"
        text_adult: "技能靠在有意义的使用中反复调动而长，知识靠讲解与记忆而存；因此语法教学的目标是设计让学习者在语篇层面（不止句子层面）运用形式达成意义的活动，语法能力在运用中重构（reshuffling the pie，见 TM-02）。"
        text_kid: null
        visual: null
        anchors: []
