  - id: TM-18
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "句法启动：刚听过、用过的句式，会不自觉地再用一次——把「同句式答问」排进练习"
    headline_kid: "想让孩子开口用某个句型，先让这个句型从老师和同伴嘴里密集路过，再立刻给他一个必须自己造句的场合——他会不自觉地借用刚听到的骨架。"
    claim:
      type: tendency
      statement: "句法启动：人会显著倾向于使用刚刚接触过的句法结构（独立于词汇重复），被启动的是抽象句法框架本身。二语课堂轻量形态是「同句式答问」：先让目标句式密集路过，紧接着给出必须自己造句的产出机会，学生在意义注意中无意识完成一轮结构产出。定位是调用助推器，不是呈现工具。"
      evidence: "Bock (1986) Cognitive Psychology 18: 355–387 奠基实验；McDonough (2006) SSLA 28；McDonough & Mackey (2008) SSLA 30；Kim & McDonough (2008) Applied Linguistics 29。接触等级：二手论述级。证据等级：同行评审研究（效应稳健，单次效应量中等）。"
      scope: "「已在输入中见过、尚未能主动调用」的结构；产出机会必须紧贴密集暴露。"
      exceptions:
        - "启动是倾向不是保证：不教新结构——尚未建立表征的结构无从启动。"
        - "效应随时间衰减；若产出任务允许回避（可绕开难句式），启动收益大打折扣。"
        - "低龄学生的教学化剂量（多少遍暴露算够）无定版参数。"
    mechanism:
      - beat: "抽象框架被启动"
        text_adult: "Bock (1986)：母语者描述图片时显著倾向使用刚在无关启动句中出现过的结构（双宾 vs 介词与格、主动 vs 被动），且独立于词汇重复。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "与机械操练的区别"
        text_adult: "操练靠指令与重复，启动靠近因暴露 + 立即产出机会；学生注意力在意义上，形式被「顺手带走」。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-19, rel: 同族}
    quiz: []
    probes: []
    prereq: []
    order: 18
    pain_points: []
    adult:
      sources:
        - "J. Kathryn Bock (1986) Syntactic Persistence in Language Production, Cognitive Psychology 18: 355–387, DOI 10.1016/0010-0285(86)90004-6；Kim McDonough (2006) SSLA 28: 179–207；McDonough & Mackey (2008) SSLA 30: 31–47；Kim & McDonough (2008) Applied Linguistics 29: 149–154。"
      boundary: "Bock 原文未打开；四篇书目与核心结论经 Trofimovich et al. (2013) 与 McDonough & Mackey (2008) 原文互证。结构启动是心理语言学中重复性最好的产出现象之一（跨语言、跨年龄段均有复制）。"
      disputes: "机制解释两派：激活残留说（短时、快速衰减）vs 隐性学习说（每次启动微调长期表征、可累积，Bock & Griffin 2000 后倾向后者）——两派对教学剂量的推论不同。教学侧批评：启动产出与「真正掌握」的距离未明，关联证据是相关而非因果定案。"
      evidence_grade: "二手论述级；证据本体为同行评审研究"
