  - id: TM-14
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "背了规则会不会变成「会用」：显性/隐性知识的接口之争"
    headline_kid: "知道规则，像看得懂菜谱；会用英语，像真的会做菜。背下来的规则会不会自己变成手上的本事？专家们分成三派吵了几十年，还没吵完。"
    claim:
      type: tendency
      statement: "显性知识（会说规则）与隐性知识（会用语言）是两种知识；显性教学能否以及如何转化为隐性可用能力，是 SLA 的接口之争：无接口派、弱接口派、强接口派共享同一组事实（课堂显性教学在受控测验上有效）而结论相反。本条是理论之争的登记，不是教学裁决。"
      evidence: "Rod Ellis, Principles of Instructed Language Learning (Asian EFL Journal 2005)；DeKeyser 2007；Paradis 2004/2009；Krashen 1981。接触等级：混合（清单附二总表登记）。"
      scope: "理论登记条目：为语法教学各条提供上位分歧背景，不直接给出教学处方。"
      exceptions:
        - "三派并呈、不许拍板（源条目登记口径）；本 App 的呈现口径见裁定与各教学条目自身边界，不由本条裁决。"
    mechanism:
      - beat: "三派共享的事实"
        text_adult: "三派共享同一组事实：课堂显性教学在受控测验上有效；分歧在该效果的本体——是否、何种条件下转化为自发交际中的隐性能力。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "三派位置"
        text_adult: "无接口派（Krashen/Paradis 一线：显性知识不能变成隐性知识，只能监控）；弱接口派（R. Ellis：显性知识经练习与注意可间接促成隐性发展）；强接口派（DeKeyser 技能习得论：陈述性知识经程序化可变为自动化能力）。"
        text_kid: null
        visual: null
        anchors: []
