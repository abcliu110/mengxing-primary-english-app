  - id: TM-07
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "语法教学的稳妥配方：有系统的纲、有简化的规则、有集中的练、有真的用——且顺序不必排死"
    headline_kid: "学语法的稳妥走法：心里有张地图（先学什么后学什么）、规则讲人话版、先专心练一阵、再到真说话里用——但四步不用死排队，哪里缺补哪里。"
    claim:
      type: tendency
      statement: "Ur 的中间路线配方：系统的语法大纲有帮助；简化版显性规则有帮助（简化是刻意的教学处理，不等于规则不真）；集中的形式练习有益（须过 TM-06 五关）；更有意义的使用最重要；交际中的即时回应式教学（reactive teaching）能增益学习。且「规则→机械练→意义练→交际用」只是逻辑次序，不是必须遵守的时间顺序。总目标：掌握最重要的用法、能有效且可接受地传达意义，不是完美。"
      evidence: "Penny Ur《Grammar Practice Activities》(2009 第 2 版）导论原文。接触等级：章节预览级（出版社官方节选，原文）。"
      scope: "一般外语课堂的语法教学整体立场。"
      exceptions:
