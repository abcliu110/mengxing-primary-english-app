  - id: TM-23
    zone: 支撑层
    group: TM
    audience: teacher
    registration_note: "高中+专属内容登记：Reed-Kellogg 全套图解系统属高中+专属，登记不转技巧、不删；仅其简化形态（主干+挂枝的骨架图）登记为长句阅读理解的可视化辅助，小剂量使用并标注争议身份。"
    headline: "句子图解：把句子画成主干加挂枝——美国用了一百年，争议也吵了一百年"
    headline_kid: "长句子看不懂，就画：先找出主干（谁—做什么—什么）画一条横线，其余的词按「它在修饰谁」挂到对应的枝杈上——句子从一串词变成一棵能看的树。"
    claim:
      type: tendency
      statement: "Reed & Kellogg 句子图解（1877）把句法层级关系转码为空间图：主语与谓语置于水平主干线、竖线分隔，修饰成分写在斜线支架上挂到被修饰词之下。它画的是关系（词与词怎么连），与 TM-24 画类别互补；在美国学校风行约五六十年。其能力对象是分析（拆解已给句子），不是产出。"
      evidence: "Reed & Kellogg《Higher Lessons in English》(1877)；起源、流行与衰落史经 NPR 专题报道（2014，引 Florey 2006 图解史研究）与多家教育史著录互证。接触等级：二手论述级。证据等级：学校传统（历史实践）——流行广度是历史事实，教学效果无现代对照实验定案。"
      scope: "仅简化骨架图形态、仅服务于长句阅读理解（见 registration_note）；不引入全套符号规则。"
      exceptions:
        - "图解系统本身符号学习成本不小，对低龄与初学者可能喧宾夺主——图学会了，句子没多懂。"
        - "把它当写作教学的主力正是历史上被批评的错位。"
    mechanism:
      - beat: "主干加挂枝"
        text_adult: "主干线承载主谓（宾/补各有定位），从属结构逐层下挂——句法关系从隐形变为可指认的视觉对象，分析长难句时有图可依。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-24, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 23
    pain_points: []
    adult:
      sources:
        - "Alonzo Reed & Brainerd Kellogg, Higher Lessons in English (1877)；NPR 专题报道 (2014)；Kitty Burns Florey, Sister Bernadette's Barking Dog (2006)。"
      boundary: "支持者论据以历史与倡导性文献为主（Florey 史著为辩护性书写）；它在当代美国部分学校与家庭教育圈回潮，属实践与文化层面。"
      disputes: "本批分歧最硬的一条，两呈——批评方：1960 年《Encyclopedia of Educational Research》定评「图解所教的超不出图解本身」；1985 年 NCTE 决议将图解一类重复性语法操练定性为对学生说写能力提升的妨碍。辩护方：主张它在使句法结构可见、训练分析性阅读上不可替代，衰落是因教学目标转向而非被证伪。学界现状：主流对「图解能提升写作/产出」持否定或无证据立场。"
      evidence_grade: "二手论述级；证据本体为学校传统（历史实践）"
      pending:
        - "Reed & Kellogg 1877 原书未打开（清单登记）。"
    status: 已入模
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；作分歧条登记，全套系统按高中+专属「登记不转技巧」", basis: "清单 v6 TM-23 原文及用户学段裁定"}
  - id: TM-24
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "颜色与符号摆句：名词是黑三角、动词是红圆——低龄孩子先用手摸到词类"
    headline_kid: "每个词类配一个永远不变的颜色和形状：名词黑三角（稳如金字塔）、动词红圆（动如太阳）——孩子拿着符号给每个词「站队」，词类先变成看得见、摸得着的东西。"
    claim:
      type: tendency
      statement: "蒙台梭利语法符号给每一词类固定配一种符号（同形状表同族：三角=名词家族、圆=动词家族），儿童把符号摆在句中每个词上完成「符号化句子」，再过渡到分类、造句。其教学逻辑是具体运算期儿童的通路：抽象分类先以可拿在手里的实物符号出现，再内化为纸面标记，最后脱离符号。本清单采其「稳定符号+形状理据故事+实物先行」的设计法，用于小学低段词类意识，不宣称蒙氏体系的整体效果。"
      evidence: "蒙氏语言教育「词的功能」练习体系（Maria Montessori 设计、教师培训传统标准化）；符号集与引入顺序经多家蒙氏培训/材料机构说明互证。接触等级：二手论述级。证据等级：教育体系传统（无独立对照实验为其语法学习效果背书）。"
      scope: "小学低段（6–9 岁设计）词类意识；颜色编码只解决「分类」一维，不表达词际关系（那是 TM-23 的活）。"
      exceptions:
        - "符号是脚手架不是语法本身：孩子可能学会摆符号而不理解功能（会画≠会用）；体系要求最终撤除符号。"
        - "对色觉异常儿童需以形状为主、颜色为辅。"
        - "单摘符号而不用其配套练习序列（语法盒、农场游戏等），效果无从按原体系主张。"
    mechanism:
      - beat: "标准符号集（低段 9 种）"
        text_adult: "名词——大黑等边三角（三维黑金字塔，喻万物先有名）；冠词——小浅蓝三角；形容词——中深蓝三角；动词——红圆（红球体，喻太阳的能量与永动）；副词——小橙圆（绕动词而行）；介词——绿色桥形/月牙形（在两个名词间搭桥）；代词——紫色三角；连词——粉色条/带；感叹词——金色符号。颜色与形状的理据被编成讲给儿童的故事。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "通路次序"
        text_adult: "实物符号先行→纸面标记→脱离符号；除蒙氏体系外，稳定颜色编码词类（colour-coding）也是英语世界小学课堂的通行做法，两者同路。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-23, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 24
    pain_points: []
    adult:
      sources:
        - "蒙台梭利语言教育体系语法符号材料；Montessori Commons 的 Function of Words 课程说明、Montessori Print Shop 符号卡说明、East Bay Montessori 等学校材料介绍互证。"
      boundary: "该符号系统在全球蒙氏学校沿用逾百年且规格稳定，是「语法可视化」诸传统中低龄适配最彻底的一套；个别符号形态在不同培训谱系间有小异（介词桥形/月牙形、连词条/带之别）。"
      disputes: "无针对符号本身的成派学术分歧；保留来自两方面：蒙氏教育整体效果的实证研究结论混合（体系层争议，非本材料独有）；可视化教学通用的「脚手架滞留」批评（符号撤除时机无标准）。"
      evidence_grade: "二手论述级；证据本体为教育体系传统"
      pending:
        - "蒙台梭利原著（如其语法论述）未打开（清单登记）。"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；采设计法登记，效果表述止于可视化传统", basis: "清单 v6 TM-24 原文及入模口径"}
  - id: TM-25
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "Mad Libs：先只许报词类、不许看句子——填完读出来，全班笑翻"
    headline_kid: "故事先藏起来，只逐空问：「给我一个名词」「一个形容词」——填满后把故事读出来，荒唐的搭配就是笑点，笑完每个孩子都记住了刚才被问的是什么词类。"
    claim:
      type: tendency
      statement: "Mad Libs（一人持留空故事、只按空格标注的词类逐个索词、填毕朗读）练的是词类标签的识别与提取——在脱离句子的情况下从自己的词汇库里按类别捞词，是词类意识的游戏化操练。它不练句法产出（句子是现成的），也不教词类在句中的功能（空格位置早已决定一切）；与 TM-24 同属词类意识一路，一个练分类、一个练提取。"
      evidence: "Stern 与 Price 1953 年发明、1958 年定名出版（Price Stern Sloan），累计销量逾 1.1 亿册（出版社/维基百科口径）；发明与出版史经 Wikipedia 与《Publishers Weekly》50 周年报道 (2008) 互证。接触等级：二手论述级。证据等级：通俗游戏传统（无教学效果研究背书，教学身份是教师社区的挪用）。"
      scope: "词类标签意识 + 课堂气氛件（教师层）；功能定位必须写死，不能替代任何句法教学。"
      exceptions:
        - "笑点依赖语义错位，对词汇量小的学生供词环节会卡住，需配词墙或选项支持。"
        - "低龄中文母语学生需先把词类标签与汉语的词类概念对齐（汉语形容词/动词边界与英语不完全一致），否则游戏只剩热闹。"
    mechanism:
      - beat: "笑点机制"
        text_adult: "索词者与供词者都不知道上下文，填毕朗读时笑点来自词与语境的语义错位；错位天然制造重复玩的动力，以极低的组织成本换取高频次的词类标签调用。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases: []
    relatives:
      - {id: TM-24, rel: 同族}
      - {id: TM-22, rel: 对照}
    quiz: []
    probes: []
