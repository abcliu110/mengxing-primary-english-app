  - id: TM-08
    zone: 支撑层
    group: TM
    audience: teacher
    headline: "听者不是录音机：听懂 = 在脑子里把说话人的意思「补全并共同建构」出来"
    headline_kid: "听英语不是把声音录下来，是边听边猜、边补、边核对——听的人和说的人一起把意思搭出来，少了哪一步都会听岔。"
    claim:
      type: tendency
      statement: "听力理解是分层加工：神经层→语言层（感知、切分、词识别、句法解析）→语义层（图式、推理、听者对输入的丰富化）→语用层（意图推断、意义的共同建构），终点是低层加工自动化。听者主动补全，听力困难因此分低层切分失败与高层建构失败两种，诊断与训练方法完全不同；教学终点指标是加工自动化，而非某套题的正确率。"
      evidence: "Michael Rost《Teaching and Researching Listening》(2002 初版；2011 第 2 版，Pearson) 加工层级模型；本次打开两版全书目录，层级与 listener enrichment / co-construction of meaning 为第 2 版目录原文措辞。接触等级：目录级。"
      scope: "听力教学的诊断与设计框架（教师层）；清单据此指出听力理解应独立成域，S 组正名为「语音与解码」（结构性修正建议，源条目登记）。"
      exceptions:
        - "层级是教学诊断用的分析框架，不意味着加工在时间上严格串行（实际加工高度并行与交互）。"
        - "对小学儿童，低层（语音切分）权重通常更高——儿童的图式与推理资源尚在发育，教学配比须调整。"
    mechanism:
      - beat: "四层加工"
        text_adult: "神经层（听觉、注意、个体差异）→语言层（语音感知、单元切分、韵律、词识别、句法解析、非言语线索）→语义层（知识结构/图式、推理、listener enrichment of input、补偿策略、记忆建构）→语用层（推断说话人意图、情感卷入、组织回应；该章小结原题即 Listening as co-construction of meaning）。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "两种听力困难"
        text_adult: "低层切分失败（听不出词界）与高层建构失败（词都听到但意思没搭起来）诊断与训练方法完全不同；听力课若只有语音/拼读侧，按本模型是只训了四层中的一层半。"
        text_kid: null
        visual: null
