      - {date: 2026-11-01, change: "由清单 v6 入模（F1 波次）；登记为设计标准层（拼读序列标准）", basis: "清单 v6 TM-33 原文"}
  - id: TM-34
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "读物按「已教的代码」编、考试掺一半假词：可解码文本的选文纪律与 Phonics Screening Check 的纯解码探针"
    headline_kid: "刚学拼读时读的小书很特别：里面的词全是你学过的拼法拼得出来的。英国一年级末有个小检查：40 个词，一半真词、一半根本不存在的「外星词」——拼得出来，就证明拼读是真学会了。"
    claim:
      type: rule
      statement: "两个配套的设计标准：（1）可解码文本选文标准——文本用词受「已教 GPC 清单」约束，新词只能由已教过的音-拼对应拼合得出，不可解码的例外词只占低比例（Cheatham & Allor 2012 两条判据），把成功唯一地押在解码上；（2）Phonics Screening Check 规格——一年级末一对一朗读 40 个词（20 真词 + 20 伪词，伪词配外星人插图明示），达标线 32/40；伪词切除词汇记忆通道，量到的是代码知识 + 拼合技能这一维，而非词汇量或理解。"
      evidence: "英国 Standards and Testing Agency《Phonics screening check: assessment and reporting arrangements》(gov.uk 法定指引，本轮打开官方页面核对）；40 词构成与 32 达标线经 DfE 历年材料多源转述定版；Cheatham & Allor (2012) Reading & Writing 25(9)；Pugh, Kearns & Hiebert (2023) Reading Research Quarterly 58(4)。接触等级：官方页面级 + 二手系统论述级。"
      scope: "选文纪律与解码评估的设计标准（设计标准层登记）；迁移到中国课堂只能借其评估思想（用伪词隔离纯解码）与选文原则，不能搬词表与分数线。"
      exceptions:
        - "可解码率没有研究共识门槛：Blevins 的操作口径是过半数词可解码即算 decodable，商业读物自标 80–90% 以上者常见；「>90%」是严格一端的出版口径，不是标准；且百分比脱离具体 GPC 序列表没有意义。"
        - "筛查只测解码一维：读得出 ≠ 读得懂（CG-13 简单阅读观：解码 × 语言理解），把筛查分数当阅读总评是误用。"
        - "定版纠正（源条目登记）：任务书原稿「32 词＝20 真词＋12 伪词」系把达标线误作总题量；定版为 40 词、真伪各半、32 分达标。"
    mechanism:
      - beat: "全国追踪曲线"
        text_adult: "统一量尺使「解码教学到位没有」第一次可跨年比较：达标率 2012 年首考 58% → 2019 年 82% → 疫情后 2022 年回落至 75%（DfE 年度统计，经二手页转述）。2025 年词表 40 词有 24 词含辅音丛（Sounds-Write 拆解），与 TM-33 Phase 4 训练目标对表。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "路线对立"
        text_adult: "可解码文本与分级/可预测文本（leveled/predictable text）构成对立：后者靠句式重复、词复现与图画线索让孩子「读成功」，成功可以来自猜；前者猜无可猜。选文标准之争本质是教学路线之争落到纸面。"
        text_kid: null
        visual: null
        anchors: []
    examples: []
    error_cases:
      - wrong: "把伪词 strom 读成 storm（词汇化错误 lexicalisation）"
        right: "按 GPC 逐个拼合 strom 的实际读音；该项在筛查中按伪词计分"
        error_type: "词汇化误读"
        source_type: "教学文献登记错型（伪词之争中批评方 UKLA 等登记的典型案例）"
        diagnosis: "词感强的孩子凭词汇记忆通道抢答，在伪词项失分——批评方据此指伪词会误判一类好读者；两造共识：结果须结合教师专业判断使用，不得单凭分数处置孩子。"
    relatives:
      - {id: TM-33, rel: 同族}
      - {id: CG-13, rel: 对照}
      - {id: S-01, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 34
    pain_points: []
    adult:
      sources:
        - "Standards and Testing Agency, Phonics screening check: assessment and reporting arrangements (gov.uk)；Cheatham & Allor (2012) Reading & Writing 25(9): 2223–2246；Pugh, Kearns & Hiebert (2023) Reading Research Quarterly 58(4): 710–732。"
      boundary: "筛查词表与分数线是英格兰学制的政策产物。"
      disputes: "两场如实登记：（1）伪词之争——批评方（UKLA 及部分阅读学者）指伪词误判好读者、催生应试操练与低龄标签；支持方（DfE、Sounds-Write 等）指伪词是唯一能防「靠背词与图画线索混过筛查」的设计。（2）可解码性效应之争——Cheatham & Allor (2012) 判定隔离「可解码性本身」的独立效应证据不一致；Pugh 等 (2023) 再分析未见显著组间差异。清单口径：选文对表是合理的防猜纪律，但不许宣称其独立效应已被实验定版。"
      evidence_grade: "官方页面级（筛查规格）+ 二手系统论述级（文本研究）"
