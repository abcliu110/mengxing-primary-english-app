  - id: TM-19
    zone: 支撑层
    group: TM
    audience: design
    design_standard: true
    headline: "三级操练：一把尺子量所有练习——答案能不能预知、有没有真信息，决定它练到第几层"
    headline_kid: "拿到任一练习先问三句：学生不用懂意思也能做对吗？（机械层）必须懂意思、但答案大家都知道吗？（有意义层）答案里有说话人新带来的真实信息吗？（交际层）——一个新句型要依次走完三层才算练透。"
    claim:
      type: rule
      statement: "操练按四判据（预期终点行为、反应受控程度、所涉学习过程、应答选择标准）分三级：机械操练（反应完全受控、只有一种正确回应、不懂意思也能做对）、有意义操练（有受控的预期答案，但不理解结构与语义便做不出来）、交际操练（结构仍受控，但说出的是听者事先不知道的真实信息）。程序主张：每个句型依次走完机械→有意义→交际三级。"
      evidence: "Paulston (1970) Foreign Language Annals 4(2): 187–193 首倡（页码经 v5 回写定版：ERIC ED044701 + 三家书目互证；284–289 一说查无对应已删除）；Paulston & Bruder (1976) 定版，四判据与三级定义经 ERIC 摘要及学术文献互证，1976 书 pp.206–207 关键表述经逐字转引核对。接触等级：二手论述级。证据等级：经典方法专著。"
      scope: "练习分析与分层标准（设计标准层登记）：与 TM-06 搭档——三级是分层仪（定位练习在哪一层），五关是质检表（验这一层合不合格）。"
      exceptions:
        - "三级量的是练习的形式属性，不是效果保证：交际操练若允许回避目标结构，学生会绕开不用。"
        - "机械操练的合法性来自「走完三级」的完整序列；被批判的是单独无限重复机械级。剂量按 TM-06 五关与 TM-04 三靶约束，不按 1970 年代课时配比执行。"
    mechanism:
      - beat: "三级判据速查"
        text_adult: "机械：不用懂意思也能做对（跟读、替换、转换格式）；有意义：必须真懂才能答（看图、看实物回答）；交际：说话人加入关于真实世界的新信息（Paulston & Bruder 1976, p.207）。"
        text_kid: null
        visual: null
        anchors: []
      - beat: "连续体读法"
        text_adult: "Larsen-Freeman (1979) 将三级读作连续体：初学阶段以机械操练为主、随水平上升向交际端移动——分类的描述力穿过了交际法时代的整轮批判而存活。"
        text_kid: null
        visual: null
        anchors: []
    examples:
      - level: 1
        word_ids: []
        sentence: null
        scene_note: "机械级例（源条目）：跟读、替换、转换格式——不懂意思也能做对。"
        supports: "claim"
      - level: 2
        word_ids: []
        sentence: null
        scene_note: "有意义级例（源条目）：看图、看实物回答问题——须真正理解才能答。"
        supports: "claim"
      - level: 3
        word_ids: []
        sentence: null
        scene_note: "交际级例（源条目）：说出听者事先不知道的真实信息；对中国小学生多须由教师用信息差活动创设。"
        supports: "claim"
    error_cases: []
    relatives:
      - {id: TM-06, rel: 同族}
      - {id: TM-04, rel: 对照}
      - {id: TM-18, rel: 对照}
    quiz: []
    probes: []
    prereq: []
    order: 19
    pain_points: []
    adult:
      sources:
        - "Christina Bratt Paulston (1970) Structural Pattern Drills: A Classification, Foreign Language Annals 4(2): 187–193；Paulston & Bruder (1976) Teaching English as a Second Language: Techniques and Procedures；「依次走完三级」经 Wong (2003) 引 Paulston (1976, p.4) 核对。"
      boundary: "对中国小学生，交际级的「真实信息」多须由教师创设，不能假定自然存在；若一组练习的预期终点只是测验答对，它在分类上还没走到交际级。"
      disputes: "操练存废之争：Wong (2003) 主张纯形式机械练习对习得与流利均无必要、应予废弃；Paulston 本人是序列保留论；技能习得阵营（DeKeyser）为受控练习保留程序化阶段的理论位置。本清单口径：三级作为分析工具收录。"
      evidence_grade: "二手论述级；证据本体为经典方法专著"
