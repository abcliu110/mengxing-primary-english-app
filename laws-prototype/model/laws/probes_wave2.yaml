  - law: C-18
    reason: 已覆盖：probes.yaml 已有 PRB-C18-1，本波次不重复立条
  - law: PR-05
    reason: 类型学背景条目：claim 是人称范畴家族的维度全景（人称/数/包容/性别/敬称），教学只取背景坐标，error_cases 明示「类型学背景条目，无对应病例型」，没有学习者可误解的机制错型，不立探针
  - law: PB-01
    reason: 书目组织法条目：claim 是 Lindstromberg 按意义簇编书的教学组织法，headline_kid 明示教师侧、不上儿童屏，error_cases 为「不适用（书目组织法条目）」，不立探针
  - law: PB-02
    reason: 可描绘性是编者/教师为基本义定的检验门槛（定基本义的方法论判据），error_cases 登记的是「基本义定得画不出来」的教学侧风险，不是学习者机制错型，不立探针
  - law: PB-03
    reason: 分歧登记条目：on1/on2 切分粒度之争，error_cases 为「不适用（分歧登记条目）」；且机制明示教学剂量——小学只教 on1，on2 在短语动词单元整块出现、不立条教学，不立探针
  - law: PB-05
    reason: 源头形态登记条目：登记 Brugman/Lakoff 原始网络形态，error_cases 为「不适用（源头形态登记条目）」；本项目教学取 P-06 修订版，以源头版立探针会与现行教学口径冲突，不立探针
  - law: PB-06
    reason: 连接机制登记条目：图式变换是网络义项间的学理连接方式，mechanism 均为教师侧表述，error_cases 为「不适用（连接机制登记条目）」，不立探针
  - law: PB-07
    reason: 主分歧登记条目：义项判定两条判据的方法论之争，mechanism 均为教师侧表述，error_cases 为「不适用（主分歧登记条目）」，不立探针
  - law: PB-08
    reason: 单义架构登记条目：Herskovits 理想意义的两层框架登记，error_cases 为「不适用（单义架构登记条目）」；其偏离处理与功能判据已分别由 PB-09、PB-10 立探针，本条不重复立条
  - law: E-06
    reason: 教师侧诊断分类工具（语用-语言失误与社交-语用失误的两分与对症治法），孩子并不在产出或理解中误解这一分类本身，两类失误的可探针误读已分别由 E-07、E-09 承载
  - law: E-12
    reason: 语用教学必要性的课程论证（显性教学优于浸泡的证据基础），属设计层立场而非孩子可犯的语言机制误读，其「语法好不等于得体」的对照已由 E-05、E-10 探针承载
  - law: E-14
    reason: 注意假说是教学设计原则（如何把孩子的注意力引向语用规矩），孩子误解的对象不是英语机制而是学习方式本身，无具体的产出或听辨误读对子可测
  - law: W-08
    reason: 教师/设计层：claim 是 IES 小学写作实践指南的四条推荐与证据等级排序，属课程设计证据清单，没有孩子会误解的机制对照，不立条
  - law: W-09
    reason: 教师/设计层：claim 是青少年写作教学元分析的 11 个有效素排序，属教师选法的证据清单，向小学低段还须降阶外推，没有学习者面的机制误读可探，不立条
  - law: W-11
    reason: 教师/设计层：claim 只收 POA 的关卡排序思想（先试产出、按缺口给输入），属课堂流程设计原则，且其证据基座为中高级学习者、向小学段迁移无直接实证；其学习者面机制（注意到缺口）已由 W-07 立条，不重复立条
  - law: W-15
    reason: 教师/设计层：claim 是写作域的诚实底线——识别「套公式保满分」话术、效应来自策略加练习加反馈的复合投入，属对设计与宣传口径的裁决，没有孩子可操作的机制对照可探，不立条
  - law: NE-04
    reason: 教师侧规则鉴别立场（反规定主义、以得体替代唯一正确），是对「规则」本身的元判断，不构成孩子在产出或理解中可演示的机制误读
  - law: NE-06
    reason: 三圈模型是学习目标定位的社会语言学快照，属课程目标决策而非语言使用机制，其「不必扮成母语者」的孩子侧对照已由 NE-14 探针承载
  - law: NE-09
    reason: 情景法是句型呈现顺序的教学法遗产（教师呈现原则），孩子不误解呈现顺序本身，其「情景先行」已内含于各表达探针的任务设计，不另立探针
  - law: NE-15
    reason: 规则证据核查是教师引进规则前的鉴别纪律（手册清算与核查程序），面向成人专业判断，无孩子可犯的产出或理解误读
  - law: NE-16
    reason: 「语法是选择的仓库」是母语写作课的教学立场向 EFL 的迁移提示，属教师知识立场，低龄段尚无可选的存量，孩子层面的误读对子不成立
  - law: NE-17
    reason: Exeter 随机对照试验是课程研究证据（嵌入式语法的有条件有效），被试为母语八年级，结论与效应量均为教师与课研层信息，孩子无从误解
  - law: NE-18
    reason: 语类定义与公平性论证面向教师的文本地图设计，阶段图在孩子侧的运用已由 NE-27、NE-28（双层）的三段与故事地图探针承载，本条无独立于二者的儿童误读对子
  - law: NE-19
    reason: 教学循环是单元顺序设计（教师的支架递减安排），孩子经历的是被安排的顺序而非可误解的语言机制，无产出或理解误读可测
  - law: NE-20
    reason: Reading to Learn 是精读支架的设计方法（教师逐句预设提示与追问），其难点在教师备课与班额约束，属设计层方法而非孩子可犯的机制误读
  - law: NE-21
    reason: Derewianka 四分组织是教师知识组织的参照系（备课入口与术语取舍），孩子不接触该组织本身，无学习者侧误读对子
  - law: NE-22
    reason: 印刷概念是早期读写的观察评估框架（Clay 的观察任务清单），探针会与 CAP 施测本身重复，且中英现代书籍方向相同、迁移误读风险低，不立理解探针
  - law: NE-23
    reason: Reading Recovery 是干预项目的证据与成本评估（短期有据、长期未定论），且服务对象与成因结构与中国 EFL 儿童不同，纯属教师与政策层信息
  - law: NE-24
    reason: 谈话三型是课堂思维型式的分类学，其孩子侧用途（自评本组在吵、附和还是讨论）是课堂规范训练而非英语机制的理解误读，且 EFL 低龄段先受语言支架制约，不立英语探针
  - law: NE-25
    reason: Thinking Together 的约法机制是班级规范共建程序（教师组织流程），孩子执行的是约定而非误解某个英语机制，无独立误读对子
  - law: NE-26
    reason: 对话式教学五原则是检验教师课堂话语的诊断尺（伪开放判别等），评价对象是教师的课而非孩子的语言理解，属设计与教研层
  - law: NE-29
    reason: 支架双管（设计性加互动性）是教师课前与课中帮助的设计标准，孩子是支架的受益者而非误解者，无学习者侧机制误读可测
  - law: TM-03
    reason: 跳过：本条是语法呈现三条路（演绎、归纳、语篇）的教师选路决策加 Swan 规则质量五标准，claim 面向教师情境变量，无学习者机制对比，孩子面只是三种上法的被呈现方，无法构成判别性探针
  - law: TM-04
    reason: 跳过：本条是练习设计的三个靶（准确、流利、重组）检查表，重组是周月尺度的系统变化设计靶、纠错时机是设计变量，面向教师配比而非孩子当场可观察的误读，无具体语言机制对比与病例
  - law: TM-05
    reason: 跳过：本条是语法课设计的六条否决线（经验法则 heuristics），整组供教师取舍，培育律等条目面向教学供给而非学习者加工，无法构成判别性探针
  - law: TM-06
    reason: 跳过：本条是设计标准层的练习五关验收；效度反例里学生靠位置填对 has、have 暴露的是练习程序的漏洞，探针测到的是题不是孩子对语言机制的误解，按不自编纪律留空
  - law: TM-07
    reason: 跳过：本条是 Ur 中间路线配方的教师整体立场（大纲、简化规则、集中练、意义使用、即时回应的配比与次序），属课堂决策层，无面向学习者的单一机制对比
  - law: TM-09
    reason: 跳过：本条是听力课程六种听的配比审计分类，条目自注六类是设计分类不是发展序列，面向课程构成核对而非孩子听力加工的误读
  - law: TM-11
    reason: 跳过：本条是 Grabe 七项教学含义的阅读课程设计清单，排序是讲演呈现序、证据强度供教师分层取用，无孩子当场可判别的机制误读
  - law: TM-13
    reason: 跳过：本条是口语任务四类谱系的设计分类，深层主张是教师选任务即选技能，面向任务条件设计而非学习者误读，无法构成判别性探针
  - law: TM-14
    reason: 跳过：本条是显性与隐性知识接口之争的理论登记条目，三派并呈、不许拍板，条目自注不直接给出教学处方，无学习者机制裁决可供探针判别
  - law: TM-16
    reason: 跳过：本条是意识提升任务的教师组织形态（给数据、合作归纳、教师收束），产物是显性知识与会说清规则；学生归纳出错误规则的风险源条目归于选料与收束环节，是教师侧变量而非孩子的语言机制误读
  - law: TM-17
    reason: 跳过：本条是材料设计辅助件，条目自定位为注意的邀请函而非习得保证书、不宜当独立教学法，洪流剂量无公认参数且效应小而不稳定；注意机制本体在注意假说条目，本条做探针只能测材料凸显效果，无法判别孩子误读
  - law: TM-18
    reason: 跳过：本条是句法启动这一调用助推器的教师用法，启动是倾向不是误读——孩子没有复用刚听过的句式不等于理解错了，且未建立表征的结构无从启动，无判别性误读对比
  - law: TM-19
    reason: 跳过：本条是设计标准层的三级操练分层仪，量的是练习的形式属性（答案可否预知、有无真信息）而非孩子的理解，条目自注三级不是效果保证，无法构成判别性探针
  - law: TM-20
    reason: 跳过：本条是替换表这一机械层骨架熟悉器械的教师工具登记；学生可能全程不理解自己在说什么属条目自注的机械层通病，是器械局限而非本条主张的机制对比，探针会测表格选配而非语言误读
  - law: TM-21
    reason: 跳过：本条是逆后链这一教师降难脚手架的程序登记，入模口径自注技巧存、原义弃，练的是给定长句的产出流畅且不迁移到自造句子，无判别性的语言机制误读可测
  - law: TM-22
    reason: 跳过：本条是语法拍卖的游戏形态设计，收益来自它包裹的集体审查与讨论行为（教师设计变量），孩子的出价对错受小组讨论、胜负心与运气污染，无法判别某个孩子个人的机制误读
  - law: TM-23
    reason: 跳过：本条是句子图解这一分析工具的方法史与简化登记，能力对象是拆解已给句子而非产出，且条目自警符号学习成本可能喧宾夺主——探针测到的将是图解符号而非句法关系理解本身
  - law: TM-24
    reason: 跳过：本条是蒙台梭利语法符号的设计法登记（稳定符号加实物先行），条目自注颜色编码只解决分类一维、会摆符号不等于理解功能；探针只能测符号摆放，无法判别词类功能的机制误读
  - law: TM-25
    reason: 跳过：本条自写死功能定位——Mad Libs 只练词类标签的识别与提取，不练句法产出、也不教词类在句中的功能；按其自身边界，探针最多测标签提取与供词卡顿，不是语言机制误读
  - law: TM-26
    reason: 跳过：本条是自录音转写自纠的教师产出打磨程序（录、转写、自纠加师补、再说），Mennim 证据是程序效果而非误读对比；说话当口没察觉错误是条目所述的监控常态，且小学段只许微缩版起步，硬做探针测的是程序执行而非机制误读
  - law: TM-27
    reason: 跳过：本条是设计标准层的错误本档案程式（本 App 病因错题本的设计依据），Edge 三分是归档前的教师过滤、低龄段由教师代为归类，面向档案设计而非孩子当场的机制误读
  - law: TM-28
    reason: 跳过：本条是 Murphy 两页单元法的产品形态学登记（讲解、练习、答案、自诊入口五件），条目自注它不是习得理论、不保证迁移到自由产出，属设计标准层，无学习者机制对比
  - law: TM-29
    reason: 跳过：本条是 Azar 图表演示法的呈现设计标准（先挂总表再逐格展开），立的是方法与产品形态且自注不为其具体规则表述背书，面向教师呈现次序，无法构成判别性探针
  - law: TM-30
    reason: 跳过：本条是 Swan 用法词典的问题驱动组织标准（本 App 病句医院形态的依据），答的是查病路线而非学程与机制，属设计标准层登记，无孩子误读对比
  - law: TM-31
    reason: 跳过：本条是三代参考语法的描写方法谱系与引用裁决的代际坐标，面向教师手里规则的出处与证据形态，是方法史而非学习者机制，无法构成判别性探针
  - law: TM-32
    reason: 跳过：本条是 Jespersen 历史视角的书房总序级登记，只许取用其叙事框架且明禁把进步观作为结论输送给学生；面向教师引用纪律，无面向孩子的机制对比与病例
  - law: TM-33
    reason: 跳过：本条是 Letters and Sounds 六阶段的拼读序列设计标准，只规定进度与覆盖且迁移时只借次序不借年龄时长；解码机制本体在 S 组，本条做探针只能测孩子落在哪个阶段，不是机制误读
  - law: TM-35
    reason: 跳过：本条是五家系统拼读的课程选型对照谱系，正确用途是选定一家忠实执行，各家机关是课程装置而非孩子机制，属设计标准层登记，无法构成判别性探针
  - law: WA-01
    reason: 跳过：本条是 Dogme 涌现式教学的方法论宣言与教师实践传统，内核机制是教师抓住学生涌现语当场回铸，强式在小学不适用；面向教师取舍而非孩子的语言机制误读
  - law: WA-03
    reason: 跳过：本条是面向教师与教材编写者的被动误认纪律，两个病例都是成人文本（经济学人斥 ensue 句、企业指南误标完成体），孩子面的被动形式机制本体在 CO-08，本条做探针会把成人编辑的范畴错误硬套成孩子误读
  - law: WA-04
    reason: 跳过：本条是概念边界条目（教师层），与 CO-08 构成一正一反的概念对位，病例是广播节目的成人语态时态混淆；小学孩子面的被动学习由 CO-08 承载，本条的两个民间等式是成人话语批评的靶子，不宜硬套为孩子探针
  - law: WA-05
    reason: 跳过：本条是关于知识传播形态的元条目（博客公开勘误生态），条目自注不直接产生儿童教学内容，课堂落点只是教师侧引用纪律，无学习者机制可测
  - law: WA-06
    reason: 跳过：本条是规定主义滑动标尺的教师与编辑判断框架，条目自注儿童落点须转译为态度、小学阶段不教描写主义，且考试约定另有边界；无孩子当场可判别的机制误读
  - law: WA-07
    reason: 跳过：本条是故事课选书的两把尺（语言年龄与心智年龄）与课程整合主张，属教学法共识层、无对照实验数据，面向教师选书；图画作脚手架是选书理由而非孩子的机制误读对比
  - law: WA-08
    reason: 跳过：本条是讲述技艺层登记（故事骨架法与表演参数），主体是教师的讲述表演本体，孩子只是按年龄参与重复句式或预测核对，无面向孩子的机制误读可判别
  - law: WA-09
    reason: 跳过：本条是规则难度三分类决定显性教学投放的教师总论，不提供具体教法，且条目自警冠词一类的落点对汉语孩子须与 C 组对读、不许直接搬分类清单；无单一学习者机制对比可构成探针
  - law: LS-01
    reason: 十技巧效用评级的总纲，对象是学习技巧的系统评估与 App 练习形态设计；examples 仅为技巧名、error_cases 登记的是教学设计误用（把低效用学法当主线），儿童侧的流畅错觉已由 LS-02/LS-09 分别承载，本条无独立的儿童机制对比材料。
  - law: LS-05
    reason: 实验室测验效应向真实课堂迁移的学期证据，设计前提（小测低风险、不算分）在教师排课侧；error_cases 登记的是教师把小测做成计分考试，无儿童可演示的错误模型。
  - law: LS-07
    reason: 最优间隔的时间脊线是成人网络样本的定量结论，scope 明言儿童最优比例没有测过、只能借形状；其可教的形状（间隔随保持期变长）已由 LS-06 探针承载，本条若出题须借用未核的儿童参数，违反 grounding。
  - law: LS-12
    reason: 双重编码讲的是言语/意象两系统的表征结构与配图呈现纪律，exceptions 的核心是学习金字塔伪百分比的出处禁用（引用纪律）；儿童侧只有「词配同指图」的呈现方式，无登记错型指向儿童的错误模型。
  - law: LS-13
    reason: Mayer 五原则是动画/多媒体画面的设计检查表（删无关、信号、临近、冗余），作用对象是设计者；儿童不操作画面纪律，无儿童机制误解可测。
  - law: LS-15
    reason: Nation 四线平衡是课程设计的规范框架，scope 明言「各占四分之一」是巡检参照而非效应量；失衡与否由课程设计者判定，儿童侧无机制对比。
  - law: YL-01
    reason: 要求—支持落差是教师备课与课堂观察的动态校准框架，error_cases 登记的是教师把支持量算死或替孩子做完；落差由教师判定，儿童无可演示的错误模型。
  - law: YL-03
    reason: 主题内变化复现是课程组织方式（同一批词在故事/游戏/手工中复现），error_cases 登记的是教师原样重复同一练习；属排课侧安排，无儿童机制误解材料。
  - law: YL-04
    reason: 同伴支架讲的是结对任务中儿童协商策略的研究发现与任务设计托底（信息差、明确分工），error_cases 登记的是教师无设计地放任讨论；支架质量的判定在教师侧，无儿童错误模型。
  - law: YL-05
    reason: 家庭双语/学校外语/沉浸教育的语境三分是研究框架级的证据筛选过滤器，本条自述不直接给出课堂操作，无儿童侧机制。
  - law: YL-06
    reason: 故事教学法（真实绘本为中心、Plan-Do-Review 骨架）是教师的课程组织方法，error_cases 登记的是教师只读一遍无成果收口；儿童是方法的承受者而非机制的误解者。
  - law: YL-07
    reason: 讲述胜过朗读讲的是教师交付方式（脱离文本、以目光停顿重复调控理解），能力要求在教师侧，无儿童机制对比。
  - law: YL-08
    reason: 年龄效应结论纠正的是成人的「越小开始越好」宣称与早期项目的供给设计（接触总量、质量、连续性），error_cases 的宣称主体是成人/项目方；儿童侧无机制误解材料，其信念形态（早开始即学得好）属家长/设计层判断而非儿童对自身学习机制的模型。
  - law: YL-09
    reason: 儿童动机结构来自匈牙利课堂的长程研究，落点是教师按课堂三要素设计与诊断动机，error_cases 登记的是成人量表误用与游戏包装无聊活动；属设计/诊断层。
  - law: YL-10
    reason: 主题单元骨架与先听说后读写的技能顺序是教材与课时规划的组织原则，单活动质量仍归 YL-01 检验；无儿童侧机制。
  - law: YL-11
    reason: 外语环境里课堂/产品是主要输入来源，讲的是输入供给结构与产品体验职能，结论的行动主体是课堂与产品设计者；无儿童错误模型。
  - law: YL-12
    reason: 英语课作为整体教育组成部分是课程定位与活动体系的立书原则，error_cases 是以整体教育为名削减语言目标的教师误用；属定位层。
  - law: YL-14
    reason: 儿童参与设计与评议讲的是参与权框架与教师把持目标、自我报告须交叉验证的研究/评估规范，行动主体是成人研究者与教师；无儿童机制误解可测。
  - law: CB-03
    reason: Trust the Text 是语料证据观的方法论纲领（断言先问语料、注明代表性），约束的是研究者与编者的断言方式；儿童不做频率/搭配断言，无儿童侧对比。
  - law: CB-05
    reason: lexical bundles 由纯统计判据定义（每百万词至少 10 次、分布于至少 5 篇文本），scope 明言不等于心理整存单位、教学挑选在设计侧；无儿童可演示的误解对比。
  - law: CB-06
    reason: Dimension 1 是多维因子分析的量化骨架，error_cases 登记的是分析者用二分法套具体作品；其儿童可感的语域对比已由 CB-04 承载，本条属统计描写层。
  - law: CB-11
    reason: 词汇大纲讲的是按成人语料频率定接触顺序的课程分级，及其与儿童认知可达性的对冲（Widdowson 可教性反诘属编者裁决）；定序是设计侧动作，无儿童机制误解。
  - law: CB-12
    reason: CIA 是学习者语料库研究的基础设施与方法（ICLE/LINDSEI、两类对比、错误标签体系），明言结论须用本地语料重验；属研究方法层。
  - law: CG-02
    reason: 负迁移四脸是教师的诊断分类（回避/过剩/错误/误解各对应不同纠正办法，诊断先行）；其儿童侧可观察行为——安全的词多用、该用的回避——已由 CB-13 频率错位探针承载，本条无独立于诊断框架的儿童错误模型材料。
  - law: CG-06
    reason: 上/下与 UP/DOWN 的映射优先序是语料频率的统计倾向，scope 明言不是语法规则、不宜把名次当铁律，exceptions 禁止整表平移；状态域的儿童可感对比与 CG-05 空间隐喻同源，无独立登记错型指向儿童误解。
  - law: CG-08
    reason: Halliday 七种微功能是儿童语言发展的组织框架，落点是单元按「孩子要用英语办的事」排（教师排课原则），scope 明言不是课时表；无儿童机制误解。
  - law: CG-09
    reason: CLIL 的 4Cs 是学科英语课程的设计检查表，scope 明言按设计框架而非成效定论收录、成效依赖实施条件；行动主体是课程设计者。
  - law: CG-10
    reason: CEFR 行动导向与 can-do 是目标措辞与逆向设计的参照框架，scope 明言六级阶梯不得当作小学英语的发展定律、法定参照是课标与 CSE；属框架层，且 can-do 自评在低龄儿童中的效度无定论，不宜做儿童探针。
  - law: CG-11
    reason: 意念-功能大纲是课程组织原则（功能为纲、语法为目），其已知缺陷与内部次序裁决都在大纲设计侧；无儿童侧机制对比。
  - law: VB-01
    reason: Levin 以交替为探针的分类方法是词库研究的方法总纲，作者自限为 preliminary investigation；儿童侧的动词类对立已由 VB-02 的 break/cut 探针承载，本条无独立儿童错型。
  - law: VB-03
    reason: 动词类作为词典组织方式（48 大类共享语法档案）是词典学工具，scope 明言教学只取高频大类、全表不进课表；类推预判的儿童形态已由 VB-02 承载。
  - law: VB-04
    reason: 方式/结果互补是词根层的分类原理，digest 自述小学只取直觉层、互补只是强倾向且 climb/cut 等边缘案例学界未决；无登记儿童错型，其可教对立（break 结果端 vs cut 方式端）已由 VB-02 承载。
  - law: VB-05
    reason: 完成体「过去牵着现在」的判据与 CG-07 同题同向，探针已在 CG-07 出（同一 I have lost my key 例）；VB-05 的增量是 Leech 的用法清单与选择问题的教师呈现面，无独立于 CG-07 的儿童错型。
  - law: VB-12
    reason: 通用原则是筛除假规则的方法论戒律，scope 明言小学阶段只宜用它筛规则、不宜向孩子灌输通义本身；约束对象是规则的写法人，无儿童机制对比。
