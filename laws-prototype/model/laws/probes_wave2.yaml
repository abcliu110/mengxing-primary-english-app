  cognitive_source: 惰性知识（背的是静态规则系统，知识存住了却没有在有意义的使用中被反复调动过）
  misreading_type: 字面化
  task: 先让孩子做两道刚学过的语法点的填空（受控、无时间压力），确认能填对；紧接着给一个真实小情境（如看图说一句自己周末做了什么），必须用同一个语法点现场说一整句，不许先写、不许套刚才的填空句。观察两处的落差。
  rubric:
