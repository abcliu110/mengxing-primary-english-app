  source_ref: 波次二 · V-07
  title: 搭配能靠道理推：意思对，伙伴就能猜
  predicted_misreading: 孩子以为动词选哪个伙伴靠语义推理——do 和 make 都差不多，按「做」的意思选就行，没意识到搭配是约定、没道理可讲，于是选错还理直气壮。
  cognitive_source: 理据幻觉（把约定当规则推理，没意识到搭配由频率与约定决定、只能遇见与整记）
  misreading_type: 过度泛化
  task: 改错题：Do a decision. 再接选伙伴：洗澡是 Take a shower. 还是 Make a shower.？问这两个伙伴能不能靠意思推出来、该怎么记住？
  rubric:
    hit: 看不出错，或说伙伴靠意思推、推错无妨
    partial: 两题选对，但仍说搭配「应该有道理」
    pass: 全对且能说出「伙伴名单不是猜出来的，是大家一直这么用定下来的——学词要连伙伴一起记」
  remedy: 回第 2 步机制屏「伙伴名单」卡，再回第 4 步用条目两例（Make a decision. / Take a shower.）连伙伴成对复述复测。
  source_of_prediction: V-07 claim（搭配由频率与约定决定，无法靠推理生成）+ mechanism[伙伴名单] + error_cases 登记错型 *Do a decision（按语义推理选动词，没按约定选伙伴）
  error_form_display:
  - Do a decision.
  status: 已入模
  version: '1'
- id: PRB-V08-1
  for_law: V-08
  source_ref: 波次二 · V-08
  title: 故事越好记越好：真假无所谓
  predicted_misreading: 孩子以为词源故事只是助记手段，编得顺、记得牢就行——把 butterfly 命名那种只能说「perhaps」的猜测讲成定案来历，也不觉得假故事有什么问题。
  cognitive_source: 真值盲（把双重编码的记忆收益和故事的真实性脱钩，没意识到假来历同时污染事实层）
  misreading_type: 功能盲
  task: 两张故事卡判断：tea 的来历（福建出海，见 V-27）有据可查；butterfly 的命名动机学界无定论、只能讲「perhaps」级猜测。问哪张能当真事讲、哪张必须带着「也许」讲？再问：自己编一个好记的假来历，行不行？
  rubric:
    hit: 说两张都能当真事讲，或说编假来历没问题、好记就行
    partial: 分对两张卡，但说不出假来历的害处
    pass: 分对且能说出「来历必须是真的——假故事既污染事实又误导机制，猜测只能按猜测讲」
  remedy: 回第 2 步机制屏「双重编码」卡（出身照片这条路必须挂真照片），再回第 4 步用条目两例（tea 真来历 / butterfly 的 perhaps 边界）同屏复测。
  source_of_prediction: V-08 claim（词源诱发心像、双重编码，前提是来历必须是真的）+ mechanism[双重编码] + exceptions（编造的假词源禁止使用）+ examples（butterfly 只能讲 perhaps 级猜测）
  status: 已入模
  version: '1'
- id: PRB-V09-1
  for_law: V-09
  source_ref: 波次二 · V-09
  title: 抄十遍和造一句记得一样牢
  predicted_misreading: 孩子以为练习效果只看「见过多少遍」——抄词、读词和用词造句在他眼里等价，没意识到真需要、自己查、比较取舍的任务才把词长进脑子里。
  cognitive_source: 呈现量幻觉（把保持量归因于重复呈现次数，没意识到它由加工深度即投入量决定）
  misreading_type: 顺序倒置
  task: 两项任务排序：A. 抄写、朗读这个词（I can spell the word. 式低投入任务）；B. 用这个词造一个新句子（Make a sentence with the word.）。问过一周哪项记得牢、为什么？缺的成分是哪几个？
  rubric:
    hit: 说两项一样，或选抄写更牢且说不出理由
    partial: 选对造句更牢，但说不出需要、查找、评估三成分
    pass: 选对且能说出「造句时脑子动真格——想一想、比一比、选一选，其中把词放进新句子比较取舍贡献最大」
  remedy: 回第 2 步机制屏「三成分」卡（need / search / evaluation 逐个点亮），再回第 4 步用条目两例对照、给低投入任务补上评估成分复测。
  source_of_prediction: V-09 claim（保持量由需要加查找加评估三成分决定，evaluation 贡献最大）+ mechanism[三成分] + examples（低投入对照面 / 高投入造句任务）
  status: 已入模
  version: '1'
- id: PRB-V10-1
  for_law: V-10
  source_ref: 波次二 · V-10
  title: 越眼熟越不用查：prize 抢答成「价格」
  predicted_misreading: 孩子读到 prize 时眼睛一扫觉得眼熟，大脑直接抢答成学过的 price「价格」——整句理解跑偏却毫无察觉，查核流程根本没启动。
