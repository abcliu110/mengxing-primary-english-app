  rubric:
    hit: 说继续读，猜出来就算懂了
    partial: 说要查，但说不出猜错为什么自己察觉不到
    pass: 选验证且能说出「猜测只是假设——线索太少或被形近词误导时猜必错，查过、对过才算数」
  remedy: 回第 2 步机制屏「约束求解」卡（破案线索够不够），再回第 4 步用条目两例（高覆盖短句练习场 / 猜后验证口令）走完猜加验全程复测。
  source_of_prediction: V-12 claim（猜义是约束求解，约束不足或误导时解必错）+ mechanism[约束求解] + error_cases 登记错型（把 prize 猜成「价格」后继续往下读，猜义不验，与 V-10 同案）
  status: 已入模
  version: '1'
- id: PRB-V13-1
  for_law: V-13
  source_ref: 波次二 · V-13
  title: pay 和 cost 随便换：买卖戏不分机位
  predicted_misreading: 孩子把 buy、sell、pay、cost 当四个孤立的「买东西词」逐个背——说价钱时随手抓一个，把「书十块钱」说成用 pay 对着货物讲，分不清每个词站在哪台机位上。
  cognitive_source: 框架盲（词义脱离场景角色单点记忆，没意识到一个词激活整幕戏及其全部角色）
  misreading_type: 观看方式未分
  task: 同一幕书店戏填空：I ___ a book. She ___ books. I ___ ten yuan. The book ___ ten yuan. 四空分别填 buy、sell、pay、cost，并说出每个词对着戏里的谁在说话。
  rubric:
    hit: pay 与 cost 互换，或四空靠中文逐词翻译乱填
    partial: 填对三空，机位说不全（尤其 cost 对着货物标价说不出）
    pass: 四空全对且能说出「一幕戏四个机位——对着买的人 buy、卖的人 sell、钱 pay、货物的标价 cost」
  remedy: 回第 2 步机制屏「一幕戏四个机位」卡，再回第 4 步用条目两例（书店买卖对句 / pay 与 cost 对句）换机位轮流说复测。
  source_of_prediction: V-13 claim（词义相对于框架定义，一个词激活整幕场景及全部角色）+ mechanism[一幕戏四个机位] + examples（buy/sell 同幕两机位 / pay 对钱、cost 对标价）
  status: 已入模
  version: '1'
- id: PRB-V14-1
  for_law: V-14
  source_ref: 波次二 · V-14
