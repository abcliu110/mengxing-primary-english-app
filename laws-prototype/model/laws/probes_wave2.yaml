  status: 已入模
  version: '1'
- id: PRB-V11-1
  for_law: V-11
  source_ref: 波次二 · V-11
  title: 再看三遍最保险：怕想不起来就不敢合书
  predicted_misreading: 孩子以为记忆靠「看熟」——宁可把词表再看三遍，也不肯合上书自己调出来用一次；真到要说要写时才发现「以为会、其实不会」。
  cognitive_source: 熟悉感幻觉（把重复呈现的流畅感当掌握，没意识到固化记忆的动作是重复提取）
  misreading_type: 顺序倒置
  task: 两种复习法选一：A. 把词表再认真看三遍；B. 合上书看图说词（What is it? — It is a book.）、凭记忆复述。问过几天哪种记得牢、为什么？再问：提取时调错了怎么办？
  rubric:
    hit: 选再看三遍，或说合书自测太冒险没用
    partial: 选对提取，但说不出提取错了要配反馈纠错
    pass: 选对且能说出「词是调出来用练熟的，每次自己想起它记忆就更结实；调错了必须马上纠正，不然错的也被固化」
  remedy: 回第 2 步机制屏「提取固化」卡（走小路对看地图），再回第 4 步用条目两例（看图说词 / 合书凭记忆复述）当场各练一次复测。
  source_of_prediction: V-11 claim（成功提取重写并加固记忆痕迹，优于等时长重读）+ mechanism[提取固化] + exceptions（提取必须配反馈纠错，调错不纠同样被固化）
  status: 已入模
  version: '1'
- id: PRB-V12-1
  for_law: V-12
  source_ref: 波次二 · V-12
  title: 猜出来就算数：猜完不验，错着往下读
  predicted_misreading: 孩子把上下文猜义当终点——把 prize 猜成「价格」后心安理得继续读，整段理解跑偏；他以为猜测本身就是答案，从不回头查证。
  cognitive_source: 假设当结论（没意识到猜义是约束求解，约束被误导时解必错且不自知，猜后必须验）
