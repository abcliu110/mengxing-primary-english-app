  misreading_type: 主场·原型误植
  task: 阅读题：He won a prize. 问 prize 在这里是什么意思？再把 prize 与 price 并排，问两个词差在哪、读到眼熟词该先做什么？
  rubric:
    hit: 把 prize 答成「价格」，或说眼熟就不用核对
    partial: 答对「奖品」，但分不清 prize 与 price 的形差
    pass: 答对且能说出「越眼熟越要多看一眼——形近词先停一拍再确认」
  remedy: 回第 2 步机制屏「自动误认」卡，再回第 4 步用条目两例（prize / price 形近对 / light 多义只认熟义）逐例练习停一拍确认复测。
