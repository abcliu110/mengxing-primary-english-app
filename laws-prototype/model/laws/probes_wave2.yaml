# 探针库波次二（模型层）· S 43 + SR 9（拼读）/ V 45（词汇）/ C 20 + PR 11 + PB 13（小系统）/ E 15 + W 15 + NE 29（表达写作）/ TM 35 + WA 9（教学）/ LS·YL·CB·CG·VB 70（支撑）
# schema 与 laws/probes.yaml v1 完全同构（DESIGN §3.6）：id / for_law / source_ref / title /
#   predicted_misreading / cognitive_source / misreading_type / task / rubric / remedy / source_of_prediction。
# 派生纪律：每条探针的正解由该规律 claim + mechanism 推出，干扰项取自该条目的边界 / 例外 /
#   登记病例（error_cases）所载误读；无学习者机制对比、无边界可依者跳过并登记于 meta.not_included，不自编。
# error_form_display：探针题中故意呈现的错形，登记为展示资产——不入词库、不算例词。
# word_ids 绑定状态：同 probes.yaml，待词库收口后统一回填，本文件暂不逐条列。
