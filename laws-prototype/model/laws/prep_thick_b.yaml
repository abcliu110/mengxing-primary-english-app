- word: upon
  bank_id: ''
  meaning: 在……上面（= on，正式）
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: upon 是 on 穿西装的样子：意思一模一样，就是更正式、更像故事书里的话。
    scene:
      s: Once upon a time, there was a beautiful princess.
      note: 故事的经典开头（牛津习语原例句）
  verdict:
    type: 组装定中心
    text: 本词无中心图式可裁：目录未对 upon 与 on 的关系作任何陈述，不得由 on 的材料外推（derivation_map 明令）。定性按词典裁定：upon = on 的正式变体（OALD 义项 1：formal = on），本页是语域卷宗、不是图式卷宗；儿童产出只设 on（成人层口径）。
  chain:
  - sense: = on 的正式版
    domain: 语域
    headline: 坐在宝座上、把王冠戴在头上：写故事、写正式文章的人，爱把 on 换成 upon，显得郑重。
    example:
      s: The cat sat upon the wall.
      note: 猫坐在墙上——upon = on 的正式说法（牛津义项 1：= on, formal）
    extension:
      text: 非引申登记：这是同义换装，不是图式长出的新义——同一个意思、两种正式程度。把语域差冒充引申链正是本卷宗要防的事，故本节点 extension 只登记定性。
      basis: 组装非引证
      ref: 语域变体登记（OALD 裁定），非图式引申
  - sense: 故事开头：once upon a time
    domain: 语域
    headline: 每个英语故事几乎都从这四个词开始：Once upon a time——很久很久以前。这是 upon 最出名的一份差事。
    example:
      s: Once upon a time, there was a beautiful princess.
      note: 牛津词条原例句：很久很久以前，有一位美丽的公主
    extension:
      text: 习语整记登记：故事开头的固定门面，整块认读，不编桥——它的名气来自故事传统，不来自图式。
      basis: 组装非引证
      ref: 习语整记登记，非图式引申
  - sense: 一……又一……（叠加）
    domain: 语域
    headline: upon 还能把东西叠起来数：一里又一里、一排又一排——多得数不清，就让 upon 一层一层摞。
    example:
      s: We saw mile upon mile of dusty road.
      note: 一里又一里的土路（牛津义项 2 例句：mile upon mile of dusty road）
    extension:
      text: 从形式组装：同一个词重复出现（…upon… 格式），把数量一层层摞起来读作「多得数不清」——是格式的重复在做工，不是图式引申（OALD 义项 2）。
      basis: 组装非引证
      ref: 格式重复→数量强调（组装）
  growth: 语域卷宗，无成长序：三站是同一变体的三种出场（正式替换、故事门面、叠加格式），不构成空间→时间→抽象的展开，如实登记。
  guess:
  - usage: (almost) upon you（即将到来）
    type: 远
    reveal: 「压到头上」半可猜：夏天快到跟前了——upon 的正式感还在，义可挂到「临头」，只作认读。
    source: 卷宗未收登记（a乙）；derivation_map ③
  - usage: upon my word（旧式感叹）
    type: 止
    reveal: 旧式感叹，备查不进课堂：只登记，不揭晓展开。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点；且不得由 on 的错位材料（PB-12）外推到 upon（derivation_map 明令），如实登记为空。
    basis: 无登记（外推禁用在案）
  adult: upon = up + on（牛津词源行，受古诺斯语 upp á 影响），与 on 的差异只在语域：正式书面与固定短语（once upon a time、row upon row of seats）保留 upon。儿童产出目标只设 on，upon 只求认得、读得懂故事开头。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，upon 介词词条（义项 1–2、习语及词源行）
