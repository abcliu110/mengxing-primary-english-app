  - sense: 穿过（介质内部）
    domain: 空间
    headline: 穿过山洞、穿过森林、穿过人群：钻进一个东西的内部，再从另一头出来——through 的老家。
    example:
      s: The bird flew through the forest.
      note: 穿过森林——介质为林木群（PB-04 登记例句）
    extension:
      text: 核心图原位，且介质有三型登记：实体（tunnel）、群体（crowd）、时段（night)——后一型就是时间站的种子（簇层 TH-1）。
      basis: 引证
      ref: PB-04（Lindstromberg 路径簇：路径 + 介质内通过；介质三型）
  - sense: 隔着（看、听）
    domain: 空间
    headline: 声音和目光也会「穿」：隔着墙听见音乐、隔着雾看见人影——穿过来的不是身体，是声音和视线。
    example:
      s: We heard the music through the wall.
      note: 隔着墙听见音乐（牛津义项 2 例句为 hear their conversation through the wall）
    extension:
      text: 从核心图组装：穿过介质的换成声音与视线——介质图式的感知版。PB-04 未专列此站，标组装；义项据 OALD 义项 2。
      basis: 组装非引证
      ref: 介质图式的感知版（组装）
  - sense: 从头到尾、整段（时间）
    domain: 时间
    headline: 时间也是一种「介质」：一整夜、一场音乐会，从头穿到尾，就是 through。
    example:
      s: The baby slept through the night.
      note: 宝宝睡了整夜（牛津义项 3 例句框架：through the night）
    extension:
      text: 同一图式的时间版，有编排证据：Lindstromberg 第 9 章把 during/throughout 挂在 over 章下连带处理，是「through the night 是同一图式时间版」的目录级证据（源图 CLU 项 5 回填项）；介质三型中的「时段」型（TH-1）同指。
      basis: 引证
      ref: PB-04（时间版为同图式扩展；编排证据见源图 CLU 项 5）
  - sense: 通过（关卡、考试）
    domain: 抽象
    headline: 考试、大门、难关，都是要「穿过去」的关卡：穿过去了，就叫 get through。
    example:
      s: First I have to get through the exams.
      note: 牛津词条原例句：先得通过考试这一关
    extension:
      text: 把事件看成介质的同图式扩展：关卡排成一串，一个一个穿（卷宗成人层口径，挂 PB-04 图式）。标引证（图式扩展），措辞强度止于卷宗口径。
      basis: 引证
      ref: PB-04 图式扩展（事件即介质；卷宗成人层口径）
  - sense: 靠……、通过……（办法）
    domain: 抽象
    headline: 办法也是一条通道：靠努力、靠读书——你从这条通道里穿过去，就到达了目标。
    example:
      s: You can get better through hard work.
      note: 靠努力就能进步（牛津义项 6 例句为 achieve success through hard work，本句同构）
    extension:
      text: 从核心图组装：介质换成办法——通道从山洞换成努力这条路。PB-04 未专列此站，标组装；义项据 OALD 义项 6。
      basis: 组装非引证
      ref: 介质→办法通道（组装）
  growth: 空间（穿介质、隔着）→ 时间（整段）→ 抽象（关卡、办法），P-17 标准展开形；空间首站与时间站有 PB-04 背书（含编排证据），感知站与办法站组装。
  guess:
  - usage: Tuesday through Friday（美式 = until and including）
    type: 竞
    reveal: 「穿过整段」的图式可猜：从周二一路穿到周五、连周五一起算——揭晓点在英美分工：英式教学不产出，只认读。
    source: 卷宗未收登记（a乙）；derivation_map ③
  - usage: get through（打通电话）
    type: 远
    reveal: 线路也是一条要穿过去的通道：电话打通了，就是声音穿过去了——短语动词另条，此处只揭晓。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的专条中英错位点；已登记的分工是英语内部的路径图式分工（through 介质内 / across 面上 / over 上方，PB-04），在对手栏呈现，不冒充中英错位。
    basis: 无登记（英语内部分工见对手栏）
  adult: through 的图式 = 路径 + 介质内通过（Lindstromberg 2010 第 2 章路径簇；项目 PB-04）：路径两端在介质之外、中段在介质之内；时间义与「通过考试」都是把事件看成介质的同图式扩展。美式 through = until and including（Tuesday through Friday）是英美差异，英式教学不收（牛津义项 5 注明 North American English）。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，through 介词词条（义项 1–6）
  - Lindstromberg (2010) 路径簇（经项目 small_systems PB-04 登记，接触等级：目录 + 书评 + 作者自述级）
