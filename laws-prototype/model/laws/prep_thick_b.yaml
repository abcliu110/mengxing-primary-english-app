- word: behind
  bank_id: V6_核心_41
  meaning: 在…后面
  phonetic_gb: /bɪˈhaɪnd/
  core:
    form: 单一图式
    headline: behind 是「在后面」：躲在桌子后面、跟在队伍后面，都在后边。
    scene:
      s: The cat is behind the table.
      note: 猫躲在桌子后面——既有登记例句（PB-08/PB-09）
  verdict:
    type: 归类分账裁决
    text: PB-08 把 behind 归入投影介词组（意义需观察者坐标）；PB-09 给一条定性裁决：behind 预设邻近性（喷泉必须离市政厅不远），而这个「近」不在几何意义里，由典型性原则管辖（Herskovits 1986:148–155）——即邻近义被裁定不入几何中心。接触等级：目录 + 书评 + 引述级。义项衍生链无来源材料，以下空间站标引证（归类/分账），抽象站为组装。
  chain:
  - sense: 在……后面
    domain: 空间
    headline: 在背对着我们的那一面，常常还被挡住、看不见。
    example:
      s: The sun went behind the clouds.
      note: 太阳躲到云后面去了
    extension:
      text: 核心图原位，但要分账：几何只管「在背面、常带遮挡」（OALD 义项 1 明言 often hidden）；「离得不远」那一份不在几何里，是典型性原则管的账（PB-09 裁决）——两笔账分开，就是本词的中心裁定。
      basis: 引证
      ref: PB-08（投影介词归类）+ PB-09（邻近性分账裁决）
  - sense: 落在……后面（进度慢）
    domain: 抽象
    headline: 别人跑在前头，自己还没赶上。
    example:
      s: Tom is behind the class in reading.
      note: 汤姆的阅读落在全班后面
    extension:
      text: 从队形组装：排队的位置搬到进度条上——落位在后面，就是进度慢。来源侧不提供逐步桥梁，如实标组装。
      basis: 组装非引证
      ref: 空间队形→进度标尺（组装，来源无桥梁）
  - sense: 在背后支持
    domain: 抽象
    headline: 站在你身后撑着你，就是支持你。
    example:
      s: We are all behind you!
      note: 我们都支持你！
    extension:
      text: 从核心图组装：人站在你身后、手撑着你——「在后面」从躲藏翻成撑腰，是位置义的人际版。
      basis: 组装非引证
      ref: 位置→人际支持（组装，来源无桥梁）
  - sense: 是……幕后的人
    domain: 抽象
    headline: 事情是在后面悄悄推动的那个人办的。
    example:
      s: Who is behind the plan?
      note: 这个计划是谁在背后推动的？
    extension:
      text: 从核心图组装：藏在后面看不见的那只手——遮挡义（节点 1 的 often hidden）推到极处，就是幕后推动者。
      basis: 组装非引证
      ref: 遮挡→幕后（组装，来源无桥梁）
  growth: 空间（投影定位）→ 抽象（进度、支持、幕后）；无独立时间站——时间读法（已成过去）在猜一猜中登记。本词是 29 词里索引最完整的一个（PB-08/PB-09 双挂接）。
  guess:
  - usage: 已成过去（The exams are behind us）
    type: 远
    reveal: 时间在身后 = 已过去：走过的路落在后面——队形图搬到时间轴上，桥极清楚，可猜。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: leave behind（落下、遗留）
    type: 远
    reveal: 人往前走，东西留在后面——还是那张「在后面」的图，对象换成被落下的东西。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「背后支持、幕后的人」与英语 behind 的支持/幕后两站同向（汉语同样以「背后/幕后」编码暗中支持与推动），此二站可正迁移——此系由卷宗义项对照得出的组装注，非 PB-12 专条登记，如实标注。
    basis: 组装（卷宗义项对照）
  adult: 机制：behind 是投影介词——它的位置要靠观察者的坐标来定（PB-08），且预设离得不远、常带遮挡（PB-09 语用容差；OALD 义项 1 明言 often hidden）；边界：落后、支持、幕后都是「在后面」向进度域与社会域的映射，教学中串成一条链即可，不必逐项死记。（卷宗成人层原文）加厚注：映射的逐步桥梁无来源材料，链上抽象站已逐节点标组装，与 PB-08/PB-09 的归类/分账裁决分账呈现。
  sources:
  - Oxford Learner's Dictionaries《behind》介词条义项 1–4（2026-11-01 在线查证；义项 5「已成过去」登记未收）
  - 本项目 small_systems PB-08 / PB-09（behind 的理想意义与语用容差，既有登记，本词现有原型页 refs 已挂此二条；接触等级：目录 + 书评 + 引述级）
  refs:
  - PB-08
  - PB-09
- word: beside
  bank_id: V6_核心_43
  meaning: 在…旁边(=next to)
  phonetic_gb: /bɪˈsaɪd/
  core:
    form: 单一图式
    headline: beside 是「肩并肩」：紧挨着坐、紧挨着站，中间不留缝。
    scene:
      s: Come and sit beside me.
      note: 坐到我旁边来，紧挨着（OALD 例句 Sit here beside me 同型）
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「侧旁相邻」一图，无专著裁决；仅 Lindstromberg 第 5 章簇归属（beside/along/against 同簇，经 PB-04 登记）与习得序旁证（P-17：in/on/under/beside 先产出）。OALD 介词义项全卷仅 2 条，本页收全 2 条、不凑数。
  chain:
  - sense: 在……旁边（紧挨着）
    domain: 空间
    headline: 就在边上，伸手就够得着。
    example:
      s: He sat beside her all evening.
      note: 他一晚上都坐在她旁边
    extension:
      text: 核心图原位：古英语 be sīdan「在侧边」——侧旁相邻是全词唯一的图，后一站从它直接读出。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；簇归属 PB-04
  - sense: 跟……比起来
    domain: 抽象
    headline: 两幅画并排一放，高下立刻看出来。
    example:
      s: My painting looks childish beside yours.
      note: 我的画跟你的比起来显得很幼稚
    extension:
      text: 从核心图组装：两样东西并排摆在一起，就是为了比——「在旁边」摆久了，读成「比起来」。
      basis: 组装非引证
      ref: 并置→对照（组装）
  growth: 空间（相邻）→ 抽象（比较），全卷仅两站——OALD 介词义本来就只有 2 条，天花板如此，不凑第三义（出处纪律）。
  guess:
  - usage: beside the point（离题、不相干）
    type: 远
    reveal: 「在要点旁边 = 没挨着要点」可猜大半：挨着边儿、没碰到正题，就是离题。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: beside oneself（情绪失控）
    type: 止
    reveal: 不可推导登记：图式推不出「失控」，习语整块记，只揭晓义。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点；本词头号防混点是词形近邻 besides（多一个 s 意思全变），已在对手栏登记，属词形分工而非中英错位，不编造。
    basis: 无登记（防混点见对手栏）
  adult: 机制：beside 的图式只有「侧旁相邻」一个（古英语 be sīdan「在侧边」；Lindstromberg 第 5 章将 beside 与 along/against 同簇处理）；边界：OALD 介词义项仅此 2 条，本页按出处纪律不凑第三义；与 besides 的混淆是词典专设 Which Word? 栏的经典错点，教学中必须成对出现。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《beside》介词条全 2 义项 + Which Word? beside / besides 用法栏（2026-11-01 在线查证）
  - Lindstromberg, S. (2010) 第 5 章（beside/along/against 簇，pp. 81–88）——经本项目 small_systems PB-04 登记转引
  refs:
  - PB-04
- word: between
  bank_id: G4_0584
  meaning: 在（两者）之间
  phonetic_gb: /bɪˈtwiːn/
  core:
    form: 单一图式
    headline: between 是「夹在中间」：左边一个、右边一个，正好被夹在缝里。
    scene:
      s: The ball is between the two boxes.
      note: 球夹在两个箱子中间——两个端点，一段缝
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「两锚点夹出一段」，无专著裁决（目录侧仅习得序旁证：between 稳定产出晚于 in/on/under/beside，P-17）；全链引申为教学组装，时间站借 M-3 通用机制、仍标组装。
  chain:
  - sense: 夹在两个（端点）中间
    domain: 空间
    headline: 左右各有一个东西，我正好在它们之间。
    example:
      s: I sat between Tom and Jim.
      note: 我坐在汤姆和吉姆中间
    extension:
      text: 核心图原位：两个分明的端点先站好，中间那段才有意义——端点定界是全词的机关。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 在……和……之间（时间）
    domain: 时间
    headline: 两个时间点夹出的一段时间。
    example:
      s: Don't eat between meals.
      note: 两顿饭之间不要吃零食
    extension:
      text: 按时间借用组装（M-3 通用机制，非本词专述）：两点夹一段的图搬到时间轴上，端点换成两个时刻。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）
  - sense: 在……到……之间（数量）
    domain: 抽象
    headline: 数目落在两个数之间，不多不少。
    example:
      s: Choose a number between 1 and 10.
      note: 选一个 1 到 10 之间的数
    extension:
      text: 从核心图组装：两点夹一段搬到数轴/尺度上——端点换成两个数，被夹的是取值范围。
      basis: 组装非引证
      ref: 端点图式→尺度（组装）
  - sense: 两者之间的（关系、选择）
    domain: 抽象
    headline: 说两样东西的差别，或者在两者里挑一个。
    example:
      s: You must choose between the red pen and the blue pen.
      note: 你得在红笔和蓝笔里选一支
    extension:
      text: 从核心图组装：人站在两个端点之间，就要在两者间权衡——位置的「之间」读成关系的「之间」与选择的「之间」。
      basis: 组装非引证
      ref: 位置→关系/选择（组装）
  - sense: 两个人分、只在你我之间
    domain: 抽象
    headline: 一块蛋糕两人分；一句话只在你我之间说。
    example:
      s: Let's share the cake between the two of us.
      note: 这块蛋糕我们俩分着吃
    extension:
      text: 从核心图组装：东西落在两人围出的段里分，话落在两人之间留——「之间」从空间段变成两人圈。
      basis: 组装非引证
      ref: 空间段→两人圈（组装）
  growth: 空间（端点夹段）→ 时间（时段）→ 抽象（尺度、关系、分与保密），P-17 标准展开形；全链组装。
  guess:
  - usage: 合力完成（Between us we made a kite）
    type: 远
    reveal: 主链末站「两个人分」的近亲再走一步：东西在两人之间分着做，就是合力——可猜。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: 来往两地（trains between A and B）
    type: 远
    reveal: 车在两个端点之间来回跑——端点图的动态版，与 from…to 交通句型合学。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「之间」一词兼包 between 与 among，英语按「端点分明 vs 成群笼统」分工（OALD 义项 1 明言端点可多于两个、只要逐个分明；Oxford Guide §227.8 同口径）——分界不在数目，是本组最要紧的错位点，与 among 页互指。
    basis: 卷宗登记（OALD + Oxford Guide §227.8）
  adult: 机制：between 的图式是「两个锚点夹出一段」——空间、时间、数量、关系都靠端点定界；边界：端点可以多于两个，只要逐个分明（OALD 义项 1 明言 two or more；Eastwood《Oxford Guide to English Grammar》§227.8：between 用于 small number of separate individual items），与 among 的分界不在数目，而在「分明 vs 成群」；另注意 between 后接宾格（between you and me，OALD 同条用法注）。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《between》介词条义项 1/2/3/6/7（2026-11-01 在线查证；义项 4 分界线、5 来往、8 合力、9 诸事之间登记未收或并注）
  - Eastwood, J.《Oxford Guide to English Grammar》§227.8 Between and among
  refs: []
- word: beyond
  bank_id: ADD_0022
  meaning: 在…之外；超过
  phonetic_gb: /bɪˈjɒnd/
  core:
    form: 单一图式
    headline: beyond 是「越过那条线，在更远的那边」：过了河、过了十二点、超过手能够到的地方。
    scene:
      s: The village is beyond the river.
      note: 过了河，才是那个村子
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「越过界线到更远侧」，无专著裁决；专家层对本词零供给（源图一级真空：挂接表有行而行为空），全链引申为教学组装，逐节点标注。
  chain:
  - sense: 在……的那一边
    domain: 空间
    headline: 隔着一个东西，在它更远的那一侧。
    example:
      s: The road goes on beyond the village.
      note: 路过了村子还往前伸
    extension:
      text: 核心图原位：参照物是一条界线，人站在界线更远的那一侧——「出界」是全词的机关，与 past 的「经过」分工见成人层。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 晚于、过了（时间点）
    domain: 时间
    headline: 过了这个点儿还在继续。
    example:
      s: Don't stay up beyond nine o'clock.
      note: 别熬过九点还不睡
    extension:
      text: 按时间借用组装（M-3 通用机制）：界线搬到时间轴上，越过界线就是过了那个点儿。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）
  - sense: 够不着、太难（超出限度）
    domain: 抽象
    headline: 手伸到头够不着，题目难到做不出。
    example:
      s: The kite is just beyond my reach.
      note: 风筝就差一点儿，我够不着
    extension:
      text: 从核心图组装：界线从地方换成手能够到的范围、脑子能解的难度——出了这条线，就是够不着、做不出。
      basis: 组装非引证
      ref: 界线→限度（组装）
  - sense: 没法再……了（beyond repair）
    domain: 抽象
    headline: 坏过头了，修也修不好、管也管不住。
    example:
      s: The old bike is beyond repair.
      note: 这辆旧自行车没法修了
    extension:
      text: 从核心图组装：越界走到不可逆——东西坏出「能修」的界线之外，读作没法再修、没法再管。
      basis: 组装非引证
      ref: 越界→不可逆（组装）
  growth: 空间（远侧）→ 时间（更晚）→ 抽象（限度、不可逆），P-17 标准展开形；全链组装，本词属源图一级真空，厚度止于词典级 + 组装理据，如实登记。
  guess:
  - usage: It's beyond me（我搞不懂）
    type: 远
    reveal: 主链「够不着」直接可猜：题目越过我脑子的界线，就是我搞不懂。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: beyond doubt / beyond question（毫无疑问）
    type: 远
    reveal: 越过「还能怀疑」的界线——怀疑够不着它，就是毫无疑问；习语形式整块认读。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点，不编造。
    basis: 无登记
  adult: 机制：beyond 的图式是「越过界线到更远侧」——空间的那一边、时间的更晚、能力的够不着是同一越界图式的三面；边界：beyond 的参照物常是界线本身（reach / control / repair），它标的是「出界」而非新的目的地，与 past 的「经过」义不要混同。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《beyond》介词条全 5 义项（2026-11-01 在线查证）：义项 1 远侧 / 2 超过（并入限度义注）/ 3 时间更晚 / 4 不可能 / 5 超出能力
  refs: []
- word: by
  bank_id: V6_核心_53
  meaning: 乘(交通工具)/在…旁/被
  phonetic_gb: /baɪ/
  core:
    form: 单一图式
    headline: by 的老家是「在旁边」：先有坐在旁边，后来才管起坐什么车去、谁做的、几点以前。
    scene:
      s: Come and sit by me.
      note: 坐到我旁边来（OALD 例句）
  verdict:
    type: 未决并存
    text: 本词中心未决、并存登记，不定案：P-02 分歧栏明载「个别介词的原型判定仍有案可查之争，如 by 的中心义」——目录对 by 的裁决就是「未决」。词典口径（OALD 空间义 / Oxford Guide §6）以「在旁边」为最老空间义，本页以之为教学起点，但裁决状态如实标未决；被动 by 在来源层无任何引申分析（主题级真空），不得替学界裁定。
  chain:
  - sense: 在……旁边
    domain: 空间
    headline: 就在边上，紧挨着——这是 by 最老的画面。
    example:
      s: There is a house by the river.
      note: 河边有一座房子
    extension:
      text: 教学起点（非裁定中心）：词典口径下最老的空间义，与 beside 邻近（Dirven 邻近组 by/with）。裁决状态见 verdict——本节点是全链的教学锚，不是学界定案。
      basis: 组装非引证
      ref: 词典口径起点（OALD / Oxford Guide §6）；中心未决见 P-02 分歧栏
  - sense: 不迟于……（最晚到……）
    domain: 时间
    headline: 到这个点儿为止，做完就行——可以提前，不能更晚。
    example:
      s: Come back by five o'clock.
      note: 最晚五点回来
    extension:
      text: 从「贴近」组装：事情最晚贴到这个时间点为止——期限是「挨着截止点」的读法。与 before 的分界（by 含当天、before 不含）见对手栏。
      basis: 组装非引证
      ref: 贴近→期限（组装）；分界据 Oxford Guide §227
  - sense: 乘……（交通工具）
    domain: 抽象
    headline: 靠什么去：车、船、飞机，前面不加 the。
    example:
      s: We go to school by bus.
      note: 我们坐公交车上学
    extension:
      text: 从「靠着」组装：靠什么去成一件事——方式义的第一站。硬规则：by + 交通工具零冠词（C-11 登记），与具体车辆的 on a bus 分工见猜一猜。
      basis: 组装非引证
      ref: 方式义组装；零冠词据 C-11
  - sense: 靠……（办法、动作）
    domain: 抽象
    headline: 做一个动作，事情就办成了。
    example:
      s: You open it by pressing this button.
      note: 按这个按钮就能打开它
    extension:
      text: 从前站组装：方式的载体从车辆换成动作——by + 动名词。by 较抽象、with 指手中工具（Oxford Guide §228 分工）。
      basis: 组装非引证
      ref: 方式义组装（车辆→动作）；分工据 Oxford Guide §228
  - sense: 被……、由……（作者）
    domain: 抽象
    headline: 被动句里站在最后的那个人，就是做事的人。
    example:
      s: The cake was made by Mum.
      note: 蛋糕是妈妈做的
    extension:
      text: 无桥梁登记：被动 by 在专家来源层从未立项、无任何引申分析（源图「主题级真空」，模型层 CO-08 明言 by 短语取舍「后置」）。本节点与方式诸站同形并列呈现，不编引申故事——这是施工纪律第 3 条在本词的落点。
      basis: 组装非引证
      ref: 无桥梁登记（主题级真空）；例句据 OALD 被动施事义 + CO-08 唯一登记例
  growth: 空间（旁边，教学起点）→ 时间（期限）→ 抽象（方式、施事）；其中施事站为并列登记、非引申站，成长路线在此如实断开一格。
  guess:
  - usage: by bus 零冠词 vs on a bus（同一辆车两种说法）
    type: 竞
    reveal: 讲「办法」用 by bus（零冠词）；讲「具体那辆车、脚站在车厢里」用 on a bus——同一辆车，两种识解，当场对照揭晓。
    source: derivation_map ③（C-11 登记）
  - usage: by chance / by mistake（碰巧、错误地）
    type: 习
    reveal: 固定搭配组整块记：来源义推不出「碰巧」，不编桥。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的专条中英错位点；已登记的相关分工是英语内部的：by 的期限义是「不迟于」（含当天），与 before「之前」（不含）差一天——见对手栏（Oxford Guide §227 明文对比），不冒充中英错位。
    basis: 无登记（英语内部分工见对手栏）
  adult: 机制：by 的老家是「在旁边」（OALD 空间义、Oxford Guide §6 同口径），期限、方式、施事诸义都是从「贴近」长出的引申，教学上按一条链串记；边界：by 的期限义是「不迟于」而非「在……之前」，与 before 的分界见对手栏（Oxford Guide §227 明文对比）；by + 交通工具零冠词是硬规则（C-11 登记），不可类推到 by the day（按日计酬）等计价结构。（卷宗成人层原文）加厚注：卷宗成人层的「一条链」讲法与目录 P-02 的「中心未决」登记有口径差——本加厚版以目录裁决为准：链为教学组装、中心标未决，施事节点无桥梁登记，三处已在 verdict 与节点 extension 中分账。
  sources:
  - Oxford Learner's Dictionaries《by》介词条（2026-11-01 在线查证）：方式义 / 旁边义 / 被动施事义 / 不迟于义为本页四组依据（其余义项登记未收）
  - Eastwood, J.《Oxford Guide to English Grammar》§6（by = at the side of）、§227（by = not later than；与 before 对比；till/until 辨析）、§228（with 与 by 表方式的分工；by + 交通工具不用 the）
  - 本项目既有登记 C-11（by bus 零冠词例句 We go to school by bus.，见现有原型 DATA）；CO-08（被动 by「后置」登记）；P-02 分歧栏（by 中心义未决）
  refs:
  - C-11
- word: down
  bank_id: G3_K20
  meaning: 向下
  phonetic_gb: /daʊn/
  core:
    form: 单一图式
    headline: down 是「从高到低」：球从山上滚下来，泪从脸上流下来。
    scene:
      s: The stone rolled down the hill.
      note: 石头从山上滚到山下（OALD 例句）
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「从高到低」，无介词原型专著裁决（CG-06 处理的是方位隐喻映射次序、非原型判定，已登记在成人层作域序材料）；OALD 介词义项共 3 条，本页收高频 2 条，全链组装。
  chain:
  - sense: 从高处到低处
    domain: 空间
    headline: 沿着斜面、脸面、楼梯，一路往低处去。
    example:
      s: Tears ran down her face.
      note: 眼泪顺着脸流下来
    extension:
      text: 核心图原位：沿斜面向下是全词的出发图，第二站从它虚化而来。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 沿着……往前（顺路）
    domain: 空间
    headline: 顺着路、河往前走——这时不一定是下坡。
    example:
      s: Go down the road and turn left.
      note: 沿着这条路往前走，然后左转
    extension:
      text: 从核心图组装：斜面被拉平——高低差虚化，只剩「顺着往前」的路径（卷宗成人层口径：路径义吸收图式的常例，OALD 义项 2）。
      basis: 组装非引证
      ref: 高低差虚化（组装）；义项据 OALD 义项 2
  growth: 空间单域内展开（向下 → 顺路），全卷仅两站；抽象域的展开次序材料（CG-06：DOWN 状态 > 时间 > 等级 > 质量）属隐喻映射层，不在本链立站，登记于成人层。
  guess:
  - usage: down the ages（纵贯历史）
    type: 远
    reveal: 时间拉成一条长坡，历史顺着坡往下流——文学义，低优先，只作揭晓认读。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: 向南 / 下游的地域义
    type: 竞
    reveal: 英美地域用法不一，只登记：同一「往下」在地图上读作向南、在河上读作顺流，不作产出要求。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: CG-06（蓝纯 2003 语料）给出中英对照的映射次序：状态域在英汉「上/下」中同居首位，其余次序不对称（DOWN：状态 > 时间 > 等级 > 质量）——教 down 的抽象用法时按此序排，别按汉语次序硬推。
    basis: 全域材料（CG-06）
  adult: 机制：down 的图式是「沿斜面向下」；边界：down the street 的 down 已虚化为「顺着往前」，不要求真有高低差——这是路径义吸收图式的常例（OALD 义项 2）；纵贯时间的 down the ages 属文学义（OALD 义项 3），不在本段，登记未收。本词 OALD 介词义项共 3 条，收高频 2 条。（卷宗成人层原文）加厚注：CG-06 域序数据（DOWN 431 例：状态 > 时间 > 等级 > 质量，与 UP 不对称）是本词唯一的成段专家材料，属映射次序而非义项链，已分账登记。
  sources:
  - Oxford Learner's Dictionaries《down》介词条全 3 义项（2026-11-01 在线查证）：义项 1 向下 / 义项 2 沿着 / 义项 3 纵贯时间（未收）
  - 本项目 CG-06（方位隐喻映射次序，蓝纯 2003 语料 431 例）
