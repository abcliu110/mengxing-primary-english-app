dossiers:
- word: about
  bank_id: V6_核心_52
  meaning: 关于/大约
  phonetic_gb: /əˈbaʊt/
  core:
    form: 单一图式
    headline: about 是「围着一件事转」：一本书围着动物讲，一群人围着一个话题聊。
    scene:
      s: This book is about animals.
      note: 一本书从头到尾围着动物讲——话题就是圆心
  verdict:
    type: 组装定中心
    text: 中心按可描绘性（PB-02）+ 亲戚最多定为「围着中心转」一图，无专著裁决；专家层仅 Dirven 意义链（PB-13）给 about 一个路径组身份（through/about），不构成中心裁决。以下链的引申理据全部为按通用机制的教学组装，逐节点标注。
  chain:
  - sense: 在……附近、到处
    domain: 空间
    headline: 东西撒在一个地方的各处，没有摆整齐。
    example:
      s: Toys are lying about the room.
      note: 玩具撒得满屋都是（英式说法里常见）
    extension:
      text: 核心图本身就是「围着中心的一圈」：东西撒在中心四周各处，是「围」这张图散开的样子——静态环绕变成分布。
      basis: 组装非引证
      ref: M-5 图式变换（静态环绕→分布）组装
  - sense: 大约
    domain: 抽象
    headline: 数目、时间说个大概，不说死。
    example:
      s: There are about forty students in our class.
      note: 四十来个，不必数清
    extension:
      text: 从「圈」组装：数目落在大概的圈里、不点准那个点——环绕的图挪到数目上，就成了「差不多」。注意本节点在词典中列于副词条（见成人层）。
      basis: 组装非引证
      ref: M-1 语用强化式组装；词典归类见 sources
  - sense: 关于
    domain: 抽象
    headline: 一本书、一场谈话围着的那件事，就是 about 后面的东西。
    example:
      s: We are talking about our school.
      note: 谈话围着「我们的学校」转
    extension:
      text: 谈话像人围着圆心坐：话题义是核心图最直接的读法——话头围着一件事转，那件事就是圆心。Cambridge 语法栏明言这是 about 作介词时最常用的意思。
      basis: 组装非引证
      ref: 核心图直接读法（组装）；常用度据 Cambridge 语法栏
  growth: 空间（环绕/分布）→ 抽象（近似、话题）；本词无时间站——「大约几点」的时间读法并入近似节点，不单独立站，成长路线到此为止属实情登记。
  guess:
  - usage: be about to do（即将）
    type: 习
    reveal: 先猜后揭晓——「围着转」推不出「即将」，这是约定结构，整块记，不编桥。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: What about …?（提议句式）
    type: 习
    reveal: 提议时把话题推到圆心请大家围看——可借核心图助记，但句式本身整块学，不作推导。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点（PB-12 错位图只覆盖 in/on/at 并辐射全体，无 about 专条），不编造。
    basis: 无登记
  adult: 机制：about 的老家是空间义「在……周围」（古英语 on+būtan「在外面一圈」），话题义是「话头围着一件事转」的引申，Cambridge 语法栏明言话题义是它作介词时最常用的意思；边界：大约义在 Cambridge/Oxford 词典中列于副词条，本页按词库口径（prep.「关于/大约」）同页收录并在节点上标明词典归类，不得据此向孩子宣称该用法中 about「是介词」。（卷宗成人层原文）加厚注：本词专家层只有 PB-13 的分组身份，链为教学组装，与引证材料分账呈现。
  sources:
  - Cambridge Dictionary《about》条：介词 CONNECTED WITH（A1）/ NO ORDER / POSITION 三义 + 副词 APPROXIMATELY 义 + 语法栏 About（2026-11-01 在线查证）
  - 'Swan, M.《Practical English Usage》about/around 条（p.83：indefinite movement and position；approximately: about）'
  - Dictionary.com《about》英式介词义序（relating to / near / on every side of）作义项划分旁证
  - 本项目 small_systems PB-13（Dirven 意义链：about 属路径组 through/about；二手系统论述级）
