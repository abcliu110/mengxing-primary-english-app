- word: of
  bank_id: ''
  meaning: ……的（所属关系）
  phonetic_gb: ''
  core:
    form: 核心关系组图
    headline: of 是「的」的小钩子：把后面的东西挂到前一个东西身上——谁的、哪一部分、什么做的，都靠它挂。
    scene:
      s: The door of our classroom is blue.
      note: 门是教室的一部分——of 的挂钩
    group_note: 否定性裁决（见 verdict）之下本词不设单一证件照：核心以「一组挂钩图」呈现——所属钩、部分钩、构成钩、数量钩、内容钩，五钩并列、以「或」相连，各管一类关系。
  verdict:
    type: 否定性裁决
    text: 双重否定性材料：P-02 边界裁定 of 的「空间源头在共时网络中已近脱落」，四条证据不合一，只能以教学可用性裁决并注明、不硬凑；PB-02 把 of 与 with 同列「不可描绘的词」，不许硬画一张图充数。故本词形态 = 关系分组呈现，chain 各站是关系类型、不是引申步骤；目录只给「已近脱落」的结果判断，没有从空间源头到现用法的任何衍生步骤——不得虚构引申链。
  chain:
  - sense: 谁的、属于谁的
    domain: 关系
    headline: 问「这是谁的」，英语爱用 of 来挂：我的一个朋友、老师的角色——后面的词把前面的词「领回家」。
    example:
      s: She is a friend of mine.
      note: 她是我的一个朋友（牛津义项 1 原短语：a friend of mine）
    extension:
      text: 分组呈现（非引申）：所属钩——把后面的所有者挂到前面的东西身上。本词无衍生路径可讲（见 verdict），各站只讲关系类型，不编长法。
      basis: 组装非引证
      ref: 否定性裁决下的分组站；义项据 OALD of 条义项 1
  - sense: 整体里的一部分
    domain: 关系
    headline: 一支队伍里的一个队员、一群朋友里的几个：of 负责从大整体里切出一块来。
    example:
      s: Tom is a member of our football team.
      note: 他是我们足球队的一员（牛津义项 2 例句：a member of the team）
    extension:
      text: 分组呈现（非引申）：部分钩——先有大整体，of 切出要的那一块。与所属钩是并列关系，不是先后引申。
      basis: 组装非引证
      ref: 否定性裁决下的分组站；义项据 OALD 义项 2 及义项 7
  - sense: 什么做的、由什么组成
    domain: 构成
    headline: 桌子是什么做的？木头。人群由什么组成？人。问「材料」，还是 of 出来挂。
    example:
      s: The table is made of wood.
      note: 桌子是木头做的（本项目 C-02 已登记此句；牛津义项 5：consists of）
    extension:
      text: 分组呈现（非引申）：构成钩——把成品拆开看它由什么组成。与 from 的 made from（材料来源）分工在 from 页猜一猜登记。
      basis: 组装非引证
      ref: 否定性裁决下的分组站；义项据 OALD 义项 5；例句据 C-02 登记
  - sense: 数量：一杯、一瓶、两公斤
    domain: 构成
    headline: 数不清的东西借杯子、瓶子、公斤来数：中间的 of 把「量器」和「东西」挂在一起。
    example:
      s: He drank a glass of milk.
      note: 他喝了一杯牛奶（牛津义项 5 例句：a glass of milk；本项目 C-01/C-05 同型登记）
    extension:
      text: 分组呈现（非引申）：数量钩——量器与内容物之间的挂钩；复数加在量器上（two glasses of water，C-05 口径）。
      basis: 组装非引证
      ref: 否定性裁决下的分组站；义项据 OALD 义项 5/6；口径据 C-05
  - sense: 关于、讲……的
    domain: 内容
    headline: 一张照片照的是谁、一张地图画的是哪儿：of 把「内容」挂在照片、地图、故事身上。
    example:
      s: This is a photo of my family.
      note: 这是我家的照片（牛津义项 4 例句为 a photo of my dog / a map of India，本句同构）
    extension:
      text: 分组呈现（非引申）：内容钩——载体在前、内容在後，of 负责把内容装进载体。与 about 的话题义分工：about 挂谈话与书的话题，of 挂照片/地图/故事的内容（卷宗口径内分工，不外推）。
      basis: 组装非引证
      ref: 否定性裁决下的分组站；义项据 OALD 义项 4
  growth: 分组呈现，无成长序：否定性裁决之下不设空间→时间→抽象的展开序（P-17 不适用本词，如实注明）；五站按教学频率排（所属、部分、构成、数量、内容），非衍生次序。
  guess:
  - usage: 形容词 + of 搭配组（proud of / afraid of / full of）
    type: 习
    reveal: 图式猜不到、最值得单列整记的高频搭配组：揭晓只给搭配本身，建议后续单列成页（卷宗未收登记同此建议）。
    source: 卷宗未收登记（a乙）；derivation_map ③
  - usage: 年龄与日期（a girl of 12 / the fourth of July）
    type: 远
    reveal: 「的」钩子挂上数字：十二岁的女孩、七月四日——挂钩本职可猜大半，形式整块认读。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 登记型注记：汉语「的」一词包办所属、材料、内容诸关系，英语在所属域分 's 与 of 两路——本项目只有 's 侧主题条（GR-13），of 的所属从未立项（源图「主题级真空」登记）；逐项错位点未登记，不编造，仅以此分工状态作教学提醒。
    basis: 卷宗登记（源图主题级真空 + GR-13）
  adult: of 是英语最忙的功能词之一：牛津词条共 13 个义项，本卷宗按小学+初中高频只收五点（所属/部分/材料/数量/关于），其余登记于未收义项待后续波次。读音上 of 的常态是弱读 /əv/，重读 /ɒv/ 只在强调等场合（牛津词条音标行：/əv/, strong form /ɒv/）。（卷宗成人层原文）加厚注：本词的「加厚」不是补引申链——P-02 与 PB-02 的否定性裁决就是它的专家定论，形态已按裁决改为组图 + 分组呈现；所属主题条未立项一事登记在源图施工序第 4 项。
  sources:
  - Oxford Learner's Dictionaries，of 介词词条（义项 1–13 及音标行）
