- word: after
  bank_id: V6_核心_56
  meaning: 在…之后
  phonetic_gb: /ˈɑːftə/
  core:
    form: 单一图式
    headline: after 是「跟在后面」：一个在前、一个在后，排着队往前走。
    scene:
      s: We play football after school.
      note: 放学排在前，踢球跟在后
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「跟在后面」的队形图，无专著中心裁决；时间的「空间借用」定性有跨词机制点名适用（CG-05 明列 before/after），时间节点的引申理据据此标引证，其余节点为教学组装。
  chain:
  - sense: 跟在……后面（追、随）
    domain: 空间
    headline: 前面的人先走，后面的人跟着、追着。
    example:
      s: The dog ran after the cat.
      note: 小狗追着小猫跑
    extension:
      text: 核心图原位：队形里的「后位」加上跑动，就是追随——这是全词的出发点，其余义项都从这张队形图长出。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 在……之后
    domain: 时间
    headline: 一件事完了，另一件才开始。
    example:
      s: We play games after class.
      note: 下课之后才玩游戏
    extension:
      text: 时间借用：把「一个跟在另一个后面」的队形原样搬到时间轴上——先发生的排在前，后发生的跟在后。CG-05 明列 before/after 为时间借空间的教学对象，本节点据此定性。
      basis: 引证
      ref: M-3 时间借用（P-09 + CG-05 点名适用 before/after）
  - sense: 一遍又一遍（day after day）
    domain: 时间
    headline: 同一个词前后夹住，天天如此、没完没了。
    example:
      s: It rained day after day.
      note: 天天下雨，一天接一天
    extension:
      text: 从队形组装：同一单位在队里一遍遍排下去——X after X 的重复格式，就是队列无限延长，读作「没完没了」。
      basis: 组装非引证
      ref: M-5 式组装（队列延长→重复）
  - sense: 排在……后面
    domain: 抽象
    headline: 名单、字母、名次里排在后一位。
    example:
      s: My name comes after yours on the list.
      note: 名单上我的名字排在你的后面
    extension:
      text: 从队形组装：走路的队列搬到名单、字母表上——身体不在场了，前后位置原样保留成次序。
      basis: 组装非引证
      ref: M-5 式组装（空间队列→抽象次序）
  - sense: 以……命名（named after）
    domain: 抽象
    headline: 孩子的名字跟着长辈走，是「跟在后面」的纪念版。
    example:
      s: The baby was named after her grandmother.
      note: 宝宝的名字跟着奶奶起
    extension:
      text: 从「跟随」组装：名字跟在长辈后面走——跟随义从脚步换成姓名，纪念就是这条引申的落点。
      basis: 组装非引证
      ref: 跟随义的人际版（组装）
  growth: 空间（追随）→ 时间（之后、重复）→ 抽象（次序、命名），是 P-17 的标准展开形；时间站有 CG-05 机制背书，其余站为组装。
  guess:
  - usage: be after（追捕、想要）
    type: 远
    reveal: 主链首站「追、随」可猜大半：The police are after him——还是那张追赶的图，只是对象换成了目标。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: after all（毕竟、终究）
    type: 止
    reveal: 不可推导登记：队形图推不出「毕竟」，整块记，揭晓只给义、不给桥。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 无本词专条登记；仅通用机制可及——汉语同样用空间词编码时间（前/后），after 的时间借用与汉语同向，错位风险低（盘点口径：TEC-L23 以空间图教 before/after 两词）。
    basis: 全域材料（CG-05 / TEC-L23）
  adult: 机制：after 的图式只有一个「跟在后面」——空间上追随、时间上随后、顺序上殿后、命名上步先人之后，是同一图式在四个域的展开（OALD 义项 1/3/4/10 同条并列）；边界：表「因为、在……之后（尽管）」的 after 多已连词化（接从句），不在本页；ask after（问候）是英式熟语动词搭配，登记未收。（卷宗成人层原文）加厚注：时间借用的定性有 CG-05 点名背书，其余引申为教学组装，已逐节点分账。
  sources:
  - Oxford Learner's Dictionaries《after》介词条全义项（2026-11-01 在线查证）：义项 1 时间在后 / 义项 2 重复 / 义项 3 跟随 / 义项 4 顺序 / 义项 10 效仿与命名
  - Eastwood, J.《Oxford Guide to English Grammar》§227（before/after 表顺序、after 表追随）
  - 本项目 CG-05（时间借空间机制，明列 before/after 为适用对象）
  refs: []
- word: against
  bank_id: ADD_0400
  meaning: 反对；靠着；违背
  phonetic_gb: /əˈɡɛnst/
  core:
    form: 单一图式
    headline: against 是「顶着」：梯子顶着墙站住，你顶着大风往前走。
    scene:
      s: The ladder is against the wall.
      note: 梯子靠着墙——墙顶着它，它才不倒（PB-04 登记场景）
  verdict:
    type: 专章裁决
    text: Lindstromberg《English Prepositions Explained》(2010) 第 15 章专章裁定 against 的基本画面含别的位置介词没有的成分——力：图式三要素 = 接触 + 压力/对抗方向（学理上游 Talmy 力动态）；本项目经 small_systems PB-04 登记。接触等级：目录 + 书评 + 作者自述级，随行不升格。
  chain:
  - sense: 靠着、顶着
    domain: 空间
    headline: 一样东西贴住另一样东西，还使着劲儿——against 的画面里有「力」。
    example:
      s: Put the bike against the wall.
      note: 把自行车靠在墙上
    extension:
      text: 核心图原位，且是 PB-04 三级衍生的第一级：静态倚靠承压——墙替梯子挡住倒下的方向，力在场但未动。
      basis: 引证
      ref: PB-04（Lindstromberg 第 15 章专章：接触 + 压力；三级衍生第一级）
  - sense: 迎着、逆着
    domain: 空间
    headline: 顶着来的方向往前走：逆风、逆水。
    example:
      s: He walked against the wind.
      note: 他顶着风走
    extension:
      text: PB-04 三级衍生的第二级：静态承压动起来——行进方向与力的方向正面对撞，就是逆力行进。
      basis: 引证
      ref: PB-04（三级衍生第二级：动态逆力行进）
  - sense: 和……比赛（对手）
    domain: 抽象
    headline: 两队面对面站，就是要分个高下。
    example:
      s: Our class is playing against Class Three tomorrow.
      note: 明天我们班和三班比赛
    extension:
      text: 对立义的规则化形态：两支队伍面对面顶着，把「对抗」装进比赛规则里。PB-04 第三级涵盖抽象对立（fight against 同级），比赛是其中最孩子气的一站。
      basis: 引证
      ref: PB-04（三级衍生第三级：抽象对立，含 fight against）
  - sense: 反对、违背
    domain: 抽象
    headline: 心里不赞成，或者做的事情顶撞了规矩。
    example:
      s: Cheating is against the rules.
      note: 作弊是违反规则的
    extension:
      text: PB-04 三级衍生的第三级正站：身体的顶撞变成态度的顶撞——against the rules、fight against，「反对义从身体画面直接长出」（PB-04 标题句定性）。
      basis: 引证
      ref: PB-04（三级衍生第三级：抽象对立）
  - sense: 防备、防着
    domain: 抽象
    headline: 先做好准备，挡住可能来的坏事。
    example:
      s: Wear your coat against the cold.
      note: 穿上外套防寒
    extension:
      text: 从力图式组装：把「顶着」的方向提前布置——坏事还没来，先立起一道挡它的墙。PB-04 三级衍生未专列此义，按组装标注。
      basis: 组装非引证
      ref: 力图式的预防版（组装）；义项据 OALD 义项 4
  growth: 空间（倚靠承压 → 逆力行进）→ 抽象（对立、违背、防备）；无时间站。本词是 29 词中引申链最有专著背书的一条：前四站为 PB-04 三级衍生，末站组装。
  guess:
  - usage: 衬托义（red against the snow）
    type: 远
    reveal: 贴着背景顶出来——红衣服贴在雪地上，靠对比显出来；还是「贴住 + 对着」那张图，可猜。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: 对……不利（evidence against him）
    type: 远
    reveal: 证据站到了他的对面——抽象对立级再走一步：不利于他的证据就是「顶着他」的证据。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点，不编造。
    basis: 无登记
  adult: 机制：Lindstromberg 专章（经 PB-04 登记）指出 against 的基本画面含其他位置介词没有的要素——力：接触 + 压力/对抗方向；静态是倚靠承压，动态是逆力行进，抽象化即对立与防备，本页五义同源；边界：衬托义（red against the snow）、折算义（weigh benefits against the cost）属书面/成人域，不在本段。（卷宗成人层原文）加厚注：against 在 P-01–P-18 中出现次数为零，是 PB 簇纯补流词；三级例句群（倚靠→逆力→对立）为簇原文回填材料，接触等级随行。
  sources:
  - Oxford Learner's Dictionaries《against》介词条全义项（2026-11-01 在线查证）：义项 1 反对/对抗 / 义项 3 接触 / 义项 4 防备（义项 2 不利、5 衬托、6 比较登记未收）
  - Lindstromberg, S. (2010)《English Prepositions Explained》第 15 章 Against 专章（pp. 183–188）与第 5 章 beside/along/against 簇（pp. 81–88）——页码与专章口径经本项目 small_systems PB-04 登记转引（接触等级：目录 + 书评 + 作者自述级）
  refs:
  - PB-04
- word: among
  bank_id: V6_核心_45
  meaning: 在(三者及以上)之间
  phonetic_gb: /əˈmʌŋ/
  core:
    form: 单一图式
    headline: among 是「在一大群中间」：前后左右都是同伴，被围在正中央。
    scene:
      s: The house is among the trees.
      note: 小房子被树围在中间（OALD 例句）
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「没入群体」一图，无专著裁决；专家层对本词零供给（源图真空清单在案），全链引申为教学组装，逐节点标注。
  chain:
  - sense: 在（一群）中间
    domain: 空间
    headline: 不是夹在两个之间，是埋在一堆里面。
    example:
      s: We walked among the flowers.
      note: 我们走在花丛中
    extension:
      text: 核心图原位：参照物是一整群、不是两个点——被围、被埋，就是 among 与 between 的第一分界。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 在……当中（是其中一员）
    domain: 抽象
    headline: 一群里头有我一个，名单里有我的名字。
    example:
      s: He is among the best students in our class.
      note: 他是班里最好的学生之一
    extension:
      text: 从核心图组装：埋在群里的人，数一数群的名单里就有他——「身在其中」读成「是其中一员」。
      basis: 组装非引证
      ref: M-1 式组装（整体→成员）
  - sense: 分给（大家）
    domain: 抽象
    headline: 把东西散到一群人手里，每人一份。
    example:
      s: Share the apples among the four children.
      note: 把苹果分给四个孩子
    extension:
      text: 从核心图组装：东西从一只手散进人群——群体从「围着他的」变成「接住东西的」，分发义由此落点。
      basis: 组装非引证
      ref: M-5 式组装（没入群体→散入群体）
  growth: 空间（没入群体）→ 抽象（成员、分发）；无时间站。全链组装，本词属源图一级真空，厚度止于词典级 + 组装理据，如实登记。
  guess:
  - usage: among other things（除此之外还有）
    type: 习
    reveal: 习语短语整块认读：「在一堆事情当中（还包括）」可作助记，不作推导。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: amongst（英式旧变体）
    type: 竞
    reveal: 与 among 同义的旧变体：只认不产出，教材统一用 among。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「在……之间/当中」一词兼包 between 与 among，英语按「分明的端点 vs 成群的整体」分工（分界口径见 between 卷宗成人层）——本词的错位点即与 between 的分工，已在对手栏与 between 页登记，此处互指不另编。
    basis: 卷宗登记（OALD + Oxford Guide §227.8 口径）
  adult: 机制：among 的参照物必须是「成群的整体」，图式是没入群体而非夹在两点之间；边界：「两者 between、三者以上 among」只是入门近似——真实分界是逐个分明 vs 成群笼统：between 可用于三者以上逐个对应的关系（OALD《between》义项 1 明言 two or more points, objects, people；Eastwood《Oxford Guide to English Grammar》§227.8 同口径），among 则从不用于两个分明的端点。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《among》介词条全 3 义项（2026-11-01 在线查证）
  - Eastwood, J.《Oxford Guide to English Grammar》§227.8 Between and among（between = small number of separate individual items；among = larger number）
