- word: as
  bank_id: G3_K42
  meaning: 像……一样；作为
  phonetic_gb: /æz/ /əz/
  core:
    form: 单一图式
    headline: as 是「派身份」：她当老师、盒子当桌子——as 给人和东西派一个身份。
    scene:
      s: She works as a teacher.
      note: 她的身份牌上写着「老师」
  verdict:
    type: 组装定中心
    text: as 没有可画的空间原型（盘点无任何针对介词 as 的专家陈述）；中心按卷宗口径定为「身份等同」——给人或物贴上角色标签（Collins：in the role of; being），属词典级定心、无专著裁决，以下引申为教学组装。
  chain:
  - sense: 作为、当（职业与角色）
    domain: 抽象
    headline: 一个人现在顶着的身份、干着的活儿。
    example:
      s: My mother works as a doctor.
      note: 我妈妈当医生
    extension:
      text: 核心图原位：身份牌贴在人身上——她现在的身份就是医生。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 Collins 介词义
  - sense: 把……当作……用
    domain: 抽象
    headline: 一件东西临时顶上另一件东西的活儿。
    example:
      s: We use the box as a chair.
      note: 我们拿箱子当椅子坐
    extension:
      text: 从核心图组装：身份牌从人贴到物——箱子临时顶上椅子的岗，身份由「当什么用」决定。
      basis: 组装非引证
      ref: 身份等同的功能版（组装）
  - sense: 把……看作
    domain: 抽象
    headline: 心里给一个人贴上的身份牌。
    example:
      s: I regard him as my best friend.
      note: 我把他看作最好的朋友
    extension:
      text: 从核心图组装：身份牌从外在任职贴到心里认定——身份由「我看他是什么」决定。
      basis: 组装非引证
      ref: 身份等同的认定版（组装）
  - sense: 跟……一样（as … as 跟名词）
    domain: 抽象
    headline: 两个 as 把要比的东西夹在中间：一样高、一样快。
    example:
      s: She is as tall as her mother.
      note: 她和妈妈一样高
    extension:
      text: 从核心图组装：两张一样的身份牌并排比——「等同」从身份挪到程度：一样高、一样快。词性归类分歧见成人层。
      basis: 组装非引证
      ref: 等同→同等程度（组装）；归类据 OALD 副词条
  growth: 本词无空间起点，链自抽象域始（角色→功能→认定→同等），是 P-17 展开序的例外形态，如实注明；全链组装。
  guess:
  - usage: such as（例如）
    type: 远
    reveal: 举一个「就是这一类」的代表：与 like 的「例如」节点对照猜——两个词在举例处会合，分工见 like 页。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: as if / as though（好像）
    type: 习
    reveal: 从句结构，归语法区；本页只登记，揭晓指向语法区条目，不在此编桥。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「像」一词兼包比较与身份，英语分工：跟名词表「像」用 like（like me），跟一整句话用 as，说身份、当作只能用 as（卷宗对手栏 + OALD Which Word? 框口径；旧 App 有 as/like 比较成组讲解，是本词最现成的教学资产）。
    basis: 卷宗登记（Which Word? 框）+ 旧 App 成组材料
  adult: 边界（本页口径）：as 没有可画的空间原型，其介词义核心是「身份等同」——给人或物贴上角色标签（Collins：in the role of; being）；as 的连词用法（当……时、因为、按照……那样 + 从句）一概不在本页，归语法区；as … as 的词性归类学界与词典不一（OALD 归副词条），本页按国内教材的介词口径收录「as + 名词」部分并在此明示，不向孩子讲词性之争。（卷宗成人层原文）
  sources:
  - Collins English Dictionary《as》条：介词义 in the role of; being（2026-11-01 在线查证）
  - Oxford Learner's Dictionaries《as》副词条义项 1（as … as 比较）及同条 Which Word? as / like 用法栏（like 为介词、后跟名词；as 为连词/副词、后跟从句）
