- word: except
  bank_id: ADD_0099
  meaning: 除了；除…之外
  phonetic_gb: /ɪkˈsept/
  core:
    form: 单一图式
    headline: except 是「把一个留在外面」：全队都算上，只把一个拿出去。
    scene:
      s: All the students are here except Tom.
      note: 全班都到了，只差 Tom 一个
  verdict:
    type: 组装定中心
    text: 中心以词源动作定心——拉丁 excipere = ex-「出」+ capere「取」，「从整队里取出一个」（OALD 词源栏，词典级依据、非专著裁决）；专家层对本词零供给（源图一级真空），全链组装。
  chain:
  - sense: 除……之外（都不）
    domain: 抽象
    headline: 一句话把所有人都说遍了，只有一个人不在里面。
    example:
      s: They all came except Matt.
      note: 他们都来了，就马特没来
    extension:
      text: 核心动作原位：先有整队，再取出唯一一个——「除外」就是这个取出动作的读法。
      basis: 组装非引证
      ref: 核心动作原位（链首节点）；义项据 OALD + Swan §456
  - sense: except for：整体里唯一的例外
    domain: 抽象
    headline: 先说整体都好，只挑出唯一的一处不算。
    example:
      s: Everything was perfect except for the weather.
      note: 样样都好，就是天气不作美
    extension:
      text: 从核心动作组装：取出的对象从「一个人」换成「整体里唯一一处毛病」——先肯定整体、再点例外，是 except for 的固定站位（Swan §456.1–456.2）。
      basis: 组装非引证
      ref: 取出动作的整体版（组装）；站位据 Swan §456
  - sense: 搭档 but：全称词后面 but 也能说「除……之外」
    domain: 抽象
    headline: nobody、everybody、nothing 这类词后面，but 脱下「但是」的外套，当 except 用。
    example:
      s: Nobody but me knew the answer.
      note: 除了我，没人知道答案
    extension:
      text: 这不是图式引申，是语法搭档换班：but 只在 all / none / every / any / no 等全称词之后顶替 except（Swan §116 原文口径与原例），按登记呈现、不编桥。
      basis: 组装非引证
      ref: 搭档换班登记（Swan §116），非图式引申
  growth: 抽象单域内展开（取出 → 整体例外 → 搭档换班）；本词无空间/时间站，成长路线即除外义内部的三分，如实登记。
  guess:
  - usage: except + 从句（except that …）
    type: 习
    reveal: 连词侧用法，归语法区：与 except for 的分工在 Swan §456.3 有登记（后接从句/介词短语时不用 for），揭晓指过去即可。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: do nothing except + 动词原形
    type: 习
    reveal: Swan §456.5 的结构登记：nothing 后面 except 带出光杆动词，初中后段随句型学。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「除了」一词兼表「加」（除了小明，还有别人）与「减」（除了小明，都来了），英语分工：besides 管加、except 管减（卷宗对手栏，OALD Which Word? 口径）——汉语一词两吃的错位点就在这组对手上，已登记。
    basis: 卷宗登记（OALD Which Word? besides / except (for) / apart from）
  adult: 机制：except 的动作是「从整队里取出一个」（OALD 词源栏：拉丁 excipere = ex-「出」+ capere「取」）；边界：与 but 的分工按 Swan 口径——but 只在 all / none / every / any / no 及 everything、nobody 等全称词之后顶替 except（§116），except (for) 是通用标记；且 except 后接介词短语或从句时不用 for（§456.3：except in Scotland；except when he smiles）。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《except》介词条（唯一义 + except for）及 Which Word? besides / except (for) / apart from 用法栏（2026-11-01 在线查证）
  - Swan, M.《Practical English Usage》§116（but meaning 'except'）与 §456（except and except for 全条）
