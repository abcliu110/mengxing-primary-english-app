# 介词加厚卷宗 · 乙组（29 词）
# 词单：about, after, against, among, around, as, before, behind, beside, between, beyond, by,
#       down, except, from, in front of, inside, like, near, of, outside, past, plus, since,
#       through, until, upon, with, without
# 规格：按「方法四条」骨架加厚——P-01（原型图 + 亲戚网）/ P-02（四条证据定中心）/
#       P-10（教图 + 长法，含猜一猜）/ P-17（空间→时间→抽象展开序）。
#       每词字段：core（核心义）/ verdict（中心裁决）/ chain（义项链，每节点带 extension 引申理据）/
#       growth（成长路线）/ guess（猜一猜候选或无候选登记）/ cn_cut（中英错位）/ adult（成人层）/
#       sources / refs。
# 基线：义项链节点序以 prep_dossiers_a.yaml + prep_dossiers_b.yaml 现卷宗为骨，不推翻；
#       引申材料以 content-depth/prep_derivation_map.md 为准，家底以 prep_source_map.md 为准。
# 铁律（据 derivation_map 零材料总账与施工纪律）：
#   1. 无专著引申材料的词，引申理据按通用机制（M-1 语用强化 / M-3 时间借用 / M-5 图式变换 /
#      功能知识）组装，逐节点 extension.basis 标注「组装非引证」，verdict 写明无专著裁决；
#   2. with、of 为否定性裁决（PB-02 / P-02：画不出单一基本图）——core.form = 核心关系组图，
#      chain 为分组呈现而非引申链，不补编单一图式；
#   3. by 中心未决（P-02 分歧栏）——verdict 并存登记，不定案；被动 by 无来源桥梁，
#      该节点 extension 如实登记「无桥梁」，不编引申故事；
#   4. 不可推导用法（习语、约定结构）只进 guess 登记 + 揭晓，不给假引申解释；
#   5. 接触等级随行：PB 侧材料除 Tyler & Evans 2001 个案外均为二手/转述级，不升格表述。
# 生成日期：2026-11-01。本文件为新增卷宗，未改动任何现有文件。机读版：model/prep_family_thick_b.json。
