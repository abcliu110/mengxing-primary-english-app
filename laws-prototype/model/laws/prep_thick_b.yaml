- word: plus
  bank_id: ''
  meaning: 加；外加
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: plus 就是「加上」：把两堆东西合到一起数——它的老家在数学课。
    scene:
      s: Two plus three is five.
      note: 数学课上的加法
  verdict:
    type: 组装定中心
    text: 中心按卷宗口径定为「合到一起」（拉丁语 plus 即 more，牛津词源行），无专著裁决；本词介词身份本就边缘——牛津介词条仅 2 义项，「零上」是形容词义项破例同卷（见链上标注与成人层）。专家层零供给（源图真空清单）。
  chain:
  - sense: 加（算式里）
    domain: 数量
    headline: 算式里读「加」的就是 plus：二加五等于七——两个数被它合到一起。
    example:
      s: Two plus five is seven.
      note: 牛津词条原例句：二加五等于七
    extension:
      text: 核心图原位：plus 站在中间，把两边的数拉到一堆——全词的出发站就在算式里。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD plus 介词条义项 1
  - sense: 外加、还有
    domain: 数量
    headline: 不光是算式：价钱里多出来的一笔、人数之外多带的东西，也用 plus 说「外加」。
    example:
      s: The toy is 30 yuan plus 2 yuan for the box.
      note: 外加 2 元盒子钱（牛津义项 2 例句框架：£22, plus £1 for postage）
    extension:
      text: 从核心图组装：算式里的「合」走出算式——主价之外再添一份，还是那个加法动作。
      basis: 组装非引证
      ref: 加法→外加（组装）；义项据 OALD 介词条义项 2
  - sense: 零上（温度）
    domain: 数量
    headline: 报温度的时候，plus 站在数字前面当「零上」的牌子：plus four degrees，就是零上四度。
    example:
      s: The temperature is plus four degrees.
      note: 牛津词条原例句：气温零上四度（形容词词条义项 2）
    extension:
      text: 身份注记（非引申）：本节点在牛津登记为形容词义项，不是介词本职——它是「正数」的标签，与 minus 的「负数」标签对举；因报温度高频而破例同卷，教学时须点明身份，不编图式桥。
      basis: 组装非引证
      ref: 破例同卷登记（OALD 形容词条义项 2），非图式引申
  growth: 数量域单域展开（加 → 外加 → 零上标签）；无空间/时间/抽象站，P-17 不适用本词，如实登记。
  guess:
  - usage: plus or minus（上下浮动）
    type: 远
    reveal: 加减成对可猜：plus 与 minus 一对站着，读作「上下浮动、正负之间」。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点，不编造。
    basis: 无登记
  adult: plus 的介词身份只覆盖「加」与「外加」两义（牛津介词条共 2 个义项）；「零上」在牛津登记为形容词条义项 2（The temperature is plus four degrees），并非介词义——本卷宗收录它只因温度表达高频且与 minus 对举，教学时应向学生点明：报温度的 plus 是「正的」标签，不是「加上谁」。词源：拉丁语 plus 即 more（更多）。（卷宗成人层原文）
