- word: around
  bank_id: G3_K43
  meaning: 在……周围；到处
  phonetic_gb: /əˈraʊnd/
  core:
    form: 单一图式
    headline: around 是「围成一圈」：围着桌子坐、绕着操场跑，都离不开一个圈。
    scene:
      s: We sit around the table.
      note: 大家围成一圈坐——圈是 around 的老家
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「圈」一图，无专著裁决；专家层对本词零供给（源图真空清单在案），全链引申为教学组装，逐节点标注。
  chain:
  - sense: 围着、在……周围
    domain: 空间
    headline: 一圈东西把中间的东西包起来。
    example:
      s: The children sit around the teacher.
      note: 孩子们围坐在老师周围
    extension:
      text: 核心图原位：圈是静态摆出来的——人围成一圈坐，圈心就是参照物。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 绕着走、绕过
    domain: 空间
    headline: 沿着边走，绕到另一边去。
    example:
      s: We walk around the lake.
      note: 我们绕着湖走
    extension:
      text: 从核心图组装：站着的圈动起来——脚沿着圈边走，静态环绕变成动态绕行。
      basis: 组装非引证
      ref: M-5 式组装（静态环绕→沿边运动）
  - sense: 到处、在……各处
    domain: 空间
    headline: 一个地方的这儿那儿都有，不只一处。
    example:
      s: Miss Li showed us around the school.
      note: 李老师带我们参观了学校各处
    extension:
      text: 从核心图组装：圈里各处都走到、都摆上——环绕的「一圈」摊成「各处都有」的分布。
      basis: 组装非引证
      ref: M-5 图式变换（多点聚合/分布）式组装
  - sense: 大约（时间、数目）
    domain: 抽象
    headline: 五点左右、四十上下，说个圈儿，不说死。
    example:
      s: We will meet around five o'clock.
      note: 我们五点左右见
    extension:
      text: 从「圈」组装：数目落在大概的圈里、不点准——与 about 的近似义同理。注意本节点各家词典多列于副词条（见成人层）。
      basis: 组装非引证
      ref: M-1 式组装（环绕→近似）；词典归类见 sources
  growth: 空间三面（静态围、动态绕、分布）→ 抽象（近似）；时间读法并入近似节点，无独立时间站。全链组装，本词属源图一级真空，如实登记。
  guess:
  - usage: turn around（转身）
    type: 远
    reveal: 「绕半圈」直接可猜：身子沿着圈转过半周，就是转身。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: around the corner（就在附近 / 即将来临）
    type: 习
    reveal: 习语整记：绕过街角 = 近在眼前，双关读法（地方近 / 时间近）揭晓时一并点明。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点，不编造。
    basis: 无登记
  adult: 机制：around 的图式是「圈」——围住、绕行、散布在圈内各处是同一图式的静态、动态与分布三面；边界：大约义各家词典多列于副词条（OALD 副词义项 1），本页按词库口径（prep./adv. 双标）同页收录并在节点标明；英式口语中同义的 round 更常见，只登记。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《around》条（副词义项 1 approximately / 义项 2 on every side / 义项 5 in or to many places，2026-11-01 在线查证）
  - Collins English Dictionary《around》介词义项 1–3（surround / to the other side / through different parts）
  - Swan, M.《Practical English Usage》about/around 条（p.83：indefinite movement and position；approximately）
