- word: near
  bank_id: ''
  meaning: 在……附近
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: near 就是「离……不远」：不用走几步、不用等几天，就到了、就来了。
    scene:
      s: There is a bookshop near our school.
      note: 书店离学校不远
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「距离短」，无专著裁决；专家层对本词仅剩一个已丢失的名单身份（EPE 第 15 章连带名单 near/by/on1/into/at，模型层被删——回填名单是它唯一的专家层修复动作，源图 CLU 项 7）。全链组装。
  chain:
  - sense: 在……附近
    domain: 空间
    headline: 离得近，但不一定挨着：书店在学校附近，走几步就到——这就是 near。
    example:
      s: My home is near the school.
      note: 我家在学校附近（牛津义项 1 例句框架：Do you live near here?）
    extension:
      text: 核心图原位：距离短、但中间可以有空——与 next to 的「正贴着」分工见对手栏。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD near 介词条义项 1
  - sense: （时间）离……近了
    domain: 时间
    headline: 日子也能比远近：生日离圣诞节很近，就是两个日子挨得近。
    example:
      s: My birthday is very near Christmas.
      note: 牛津词条原例句：我的生日离圣诞节很近
    extension:
      text: 按时间借用组装（M-3 通用机制）：距离搬到时间轴上——两个日子挨得近，就是时间上的 near。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）；义项据 OALD 义项 2
  - sense: 接近（数字）
    domain: 数量
    headline: 数字也能「离得近」：差不多五公斤、快一百人了——没到，但挨得很近。
    example:
      s: The bag is near five kilos.
      note: 这包东西接近五公斤（牛津义项 3：used before a number to mean approximately）
    extension:
      text: 从核心图组装：距离搬到数轴上——数字往上爬、快爬到目标值，就是「离它近」。
      basis: 组装非引证
      ref: 距离→数轴（组装）；义项据 OALD 义项 3
  - sense: 差不多、接近（样子）
    domain: 抽象
    headline: 颜色差不多、答案差不多对：样子离原版很近，也是 near。
    example:
      s: This colour is very near the original one.
      note: 这颜色和原来的很接近（牛津义项 4 例句为 This colour is nearest (to) the original）
    extension:
      text: 从核心图组装：距离从地方、数目换到品质——两样东西摆在一起，像到只差一点点。
      basis: 组装非引证
      ref: 距离→品质（组装）；义项据 OALD 义项 4
  - sense: 差点儿就……（状态）
    domain: 抽象
    headline: 离某种样子只差一步：差点儿哭出来、差点儿睡着——人离那个状态非常近。
    example:
      s: She was near to tears.
      note: 牛津词条原例句：她差点儿哭出来
    extension:
      text: 从核心图组装：人离某种状态只差一步——距离贴到状态的边上，就读作「差点儿」。
      basis: 组装非引证
      ref: 距离→状态（组装）；义项据 OALD 义项 5
  growth: 空间（附近）→ 时间（临近）→ 数量（接近）→ 抽象（相像、临界状态），是 29 词里节点最满的一条组装链；专家层厚度与节点数成反比，如实登记。
  guess:
  - usage: near at hand / near to one's heart（熟语组）
    type: 习
    reveal: 熟语组整记：near at hand（就在手边）由距离图可猜；near to one's heart（对某人很重要）只能半猜——「离心近 = 看得重」作助记，不作推导。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的专条中英错位点；旧 App A5 有 far from ↔ near here 对比片段可作场景层补充（源图登记），不编造错位点。
    basis: 无登记（场景资产见源图 OLD 项）
  adult: near 兼有介词/形容词/副词身份，本卷宗只收介词义。牛津词条头注：near to 的 to 在地名、人名、节日名之前通常不用（near Christmas，不说 near to Christmas）。nearest to 与 next to 的分工见牛津 Which Word? 框（nearest = 一群中最近，next to = 紧贴）。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，near 介词词条（义项 1–5、词条头注及 Which Word? next / nearest 专框）
