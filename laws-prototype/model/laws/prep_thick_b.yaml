- word: from
  bank_id: V6_核心_47
  meaning: 从…来自(be from)
  phonetic_gb: /ˈfrɒm/
  core:
    form: 单一图式
    headline: from 是「从……出发」：人从老家来、车从站里来，都先有个出发点。
    scene:
      s: I am from China.
      note: 我的老家在中国——课本里的 from 第一句
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「出发点」，无专著裁决；专家层仅给分组定位——Dirven 分离/来源组（from/off/out of，PB-13）与 EPE 第 2 章路径簇名单（PB-01），「来源/分离」只是组标签、未给任何衍生步骤。本链（起点→来源→材料/原因方向）为卷宗词典级排序的教学组装，逐节点标注（derivation_map 重做注记同此口径）。
  chain:
  - sense: 从……（地方）出发
    domain: 空间
    headline: 路的起点、东西的来路。
    example:
      s: This train comes from Beijing.
      note: 这列火车是从北京开来的
    extension:
      text: 核心图原位：一切从出发点量起——路从这里开始，话从这里说起。
      basis: 组装非引证
      ref: 核心图原位（链首节点）
  - sense: 来自（老家、出处）
    domain: 空间
    headline: 人是打哪儿来的，东西是打哪儿出的。
    example:
      s: My friend Tom is from Canada.
      note: 我的朋友汤姆来自加拿大
    extension:
      text: 从核心图组装：站在现在回望出发点——出发点读作老家与出处，是同一站点的回望版。
      basis: 组装非引证
      ref: 出发点回望（组装）
  - sense: 从……那里（收到、借到）
    domain: 空间
    headline: 东西从一个人的手里，到了我手里。
    example:
      s: I got a letter from my friend.
      note: 我收到一封朋友的来信
    extension:
      text: 从核心图组装：出发点具体成一个人——东西沿来路反向走一遍，从他手里到我手里。
      basis: 组装非引证
      ref: 出发点人格化（组装）
  - sense: 离……（距离）
    domain: 空间
    headline: 从这儿量到那儿，有多远。
    example:
      s: My home is ten minutes from school.
      note: 我家离学校十分钟路
    extension:
      text: 从核心图组装：出发点变成尺子的零刻度——距离就是从零刻度量出去的长度。
      basis: 组装非引证
      ref: 起点→零刻度（组装）
  - sense: 从……（时间）开始
    domain: 时间
    headline: 时间轴上的出发点，常和 to 手拉手。
    example:
      s: We have lessons from Monday to Friday.
      note: 我们周一到周五上课
    extension:
      text: 按时间借用组装（M-3 通用机制，非本词专述）：出发点搬到时间轴上，与 to 组成起止对子。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）
  growth: 空间（出发、来源、人、距离）→ 时间（开始），P-17 展开形的前两级；抽象站（材料/原因/区分）在卷宗未收登记中，本链止于时间站，如实登记。
  guess:
  - usage: made from（材料来源）
    type: 远
    reveal: 「成品的来路」直接可猜：酒是葡萄「从」哪儿变来的——出发点读作材料来源；与 made of 的对比随 make 词条学。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: different from（与……不同）
    type: 习
    reveal: 由 different 带动的固定搭配，随 different 整记，不作推导。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 旧 App A2 有「from 从起点出发」的成组讲解（borrow from ⇄ lend to），且汉语「从」与 from 的起点义高度平行、可正迁移；盘点同时登记本词的索引断裂：条文在 PB-01 内、挂接与 law_refs 却全空，属「条文有、索引无」，回链即可见（源图登记）。
    basis: 卷宗登记（旧 App 打捞 + 源图索引注记）
  adult: 机制：from 是纯粹的「起点」标记——空间起点、时间起点、来源与距离都从同一个「从哪儿出发」图式展开，常与 to 组成起止对子（OALD 义项 1/2/3/4/5 同条并列）；边界：材料义（made from）与区分义（different from）由动词/形容词搭配带动，不在本页展开，见未收登记。（卷宗成人层原文）加厚注：本链为教学组装一事，derivation_map 与源图口径一致，已逐节点分账；本词的当务之急是索引回链而非内容。
  sources:
  - Oxford Learner's Dictionaries《from》介词条义项 1/2/3/4/5（2026-11-01 在线查证；义项 6 视角、7 范围、8 变化前态、9 区分、10 材料、11 分离、12 防止、13 原因、14 判断依据登记未收）
  - 本项目 small_systems PB-01（EPE 第 2 章路径簇成员）+ PB-13（Dirven 分离/来源组），均为分组定位、无衍生步骤
