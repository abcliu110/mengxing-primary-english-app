- word: before
  bank_id: V6_核心_55
  meaning: 在…之前
  phonetic_gb: /bɪˈfɔː/
  core:
    form: 单一图式
    headline: before 是「排在前面」：洗手排在吃饭前面，B 排在 C 前面。
    scene:
      s: Wash your hands before dinner.
      note: 洗手排在吃饭前面——先洗手，再吃饭
  verdict:
    type: 组装定中心
    text: 中心按可描绘性 + 亲戚最多定为「排在前面」的队形图，无本词专著裁决；时间借用的定性有跨词机制点名适用（CG-05 明列 before/after），首节点据此标引证。空间义退居末位是词典登记的实情（OALD 义项 3 标 rather formal），非排课失误。
  chain:
  - sense: 在……之前（时间）
    domain: 时间
    headline: 一件事还没开始，另一件先做完。
    example:
      s: We have English before lunch.
      note: 午饭前我们上英语课
    extension:
      text: 时间借用：队形搬到时间轴上——排在前面的先发生。CG-05 明列 before/after 为时间借空间的教学对象，本节点据此定性。
      basis: 引证
      ref: M-3 时间借用（P-09 + CG-05 点名适用 before/after）
  - sense: 排在……前面（顺序）
    domain: 抽象
    headline: 名单、字母、队伍里靠前的那一个。
    example:
      s: Your name is before mine on the list.
      note: 名单上你的名字排在我的前面
    extension:
      text: 从队形组装：队列搬到名单、字母表上——位置的前后原样保留成次序的前后。
      basis: 组装非引证
      ref: M-5 式组装（空间队列→抽象次序）
  - sense: 在……面前
    domain: 空间
    headline: 站在大家面前讲话、表演——这个说法有点正式。
    example:
      s: He stood before the class and sang a song.
      note: 他站在全班面前唱了一首歌
    extension:
      text: 这是空间原义的残留正式版：排头站到大家对面去。但英语讲具体位置已基本让位给 in front of，本节点按词典口径排在末位并标「稍正式」。
      basis: 组装非引证
      ref: 空间原义的正式残留（组装）；地位据 OALD 义项 3 + Oxford Guide §7
  growth: 本词呈现序为 时间 → 顺序 → 空间，与 P-17 的一般展开序相反：不是没有空间义，而是空间义在现代英语中退场中（让位 in front of）——成长路线如实记为「时间先行、空间收尾」的例外形态。
  guess:
  - usage: 优先于（put work before everything）
    type: 远
    reveal: 顺序 = 重要：把工作排在一切前面，就是把工作看得最重——「排前面」的图可猜大半。
    source: 卷宗未收登记（a甲）；derivation_map ③
  - usage: 在法官/法庭面前（before the judge）
    type: 远
    reveal: 主链末站空间义的正式场域版：站到法官面前——正式场合把退场中的空间义又请了回来。
    source: 卷宗未收登记（a甲）；derivation_map ③
  cn_cut:
    text: 汉语「前天/后天」用空间词编码时间，与 before/after 的时间借用平行，可正迁移（derivation_map 登记）；汉语「在……面前」日常常用，正对应英语已退为正式义的 before 空间站——孩子易把 before 当日常「面前」用，须以 in front of 纠偏（卷宗成人层口径）。
    basis: 全域材料（CG-05）+ 卷宗登记
  adult: 机制：before 的图式是「站在前面」——时间上是先到，顺序上是靠前，空间上是面对；边界：英语讲具体位置时已基本让位给 in front of，before 的空间义只余正式与仪式场景（OALD 义项 3 标 rather formal；Oxford Guide §7 明言讲位置 prefer in front of and behind to before and after），故本页空间义排末位并标注。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries《before》介词条义项 1/2/3（2026-11-01 在线查证）
  - Eastwood, J.《Oxford Guide to English Grammar》§7（In front of, before, behind, after：讲位置 prefer in front of/behind）与 §227（before/after 表顺序）
  - 本项目 CG-05（时间借空间机制，明列 before/after 为适用对象）
