- word: in front of
  bank_id: ''
  meaning: 在……（外部）前面
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: in front of 就是「在……前面」：比它更靠前，脸朝着同一边。
    scene:
      s: The bus stops in front of our school.
      note: 校车停在学校大门前
  verdict:
    type: 归类裁决
    text: PB-08 归类裁定：in front of 与 behind/over/under 同列投影介词（意义需观察者坐标），与 in/on/at 三个基本拓扑介词相对；无专属理想意义公式——这是本词唯一可搬的专家层实质材料（簇层 IF-1：投影组完整名单与判据，二手/引述级随行）。无衍生链陈述，时间与抽象站为教学组装。
  chain:
  - sense: 在……前面（更靠前）
    domain: 空间
    headline: 排队时你站在我前面、公交车停在房子前面：更靠前、还挨得近，就是 in front of。
    example:
      s: He was standing in front of me in the line.
      note: 牛津词条原例句：排队时站在我前面
    extension:
      text: 核心图原位，且有归类背书：它的「前面」要靠观察者的坐标来定（投影介词，PB-08）——没有观看的人，就没有「前面」。
      basis: 引证
      ref: PB-08（投影介词归类裁定）
  - sense: 面对着……
    domain: 空间
    headline: 站在大家对面也是一种「前面」：上台表演、在镜头前面，你面对着所有人的眼睛。
    example:
      s: She likes singing in front of a big crowd.
      note: 在一大群人面前表演（牛津习语义项 2：to perform in front of a big crowd）
    extension:
      text: 从核心图组装：站位从「同侧更靠前」转到「对面相向」——还是靠坐标定的前面，只是观看者换到了对面。
      basis: 组装非引证
      ref: 投影坐标的对面版（组装）；义项据 OALD front 条习语义项 2
  - sense: 还在前面（没到的日子）
    domain: 时间
    headline: 时间也被排成一条队：还没轮到的日子，都站在你前面等着——你的一生还长着呢。
    example:
      s: You have a happy life in front of you.
      note: 幸福的日子还在前面（牛津习语义项 4 例句为 your whole life in front of you）
    extension:
      text: 按时间借用组装（M-3 通用机制）：队伍搬到时间轴上——没轮到的日子排在前面等着，与 before 的「排在前面」同图异词。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）；义项据 OALD 习语义项 4
  - sense: 当着……的面
    domain: 抽象
    headline: 当着别人的面，就是在他的眼睛前面：有些话不能当着小朋友的面说。
    example:
      s: Please don't talk about it in front of the children.
      note: 牛津词条原例句：别当着孩子们的面谈这件事
    extension:
      text: 从核心图组装：在他眼睛前面发生——「面对面」再走一步，就是「在他看得见、听得见的地方」，读作当着面。
      basis: 组装非引证
      ref: 面对面→在场见证（组装）；义项据 OALD 习语义项 3 + Cambridge 义项 2
  growth: 空间（靠前、面对）→ 时间（未到的日子）→ 抽象（当着面），P-17 标准展开形；首站有 PB-08 归类背书，其余组装。
  guess:
  - usage: in front「领先」义（The blue team is in front）
    type: 远
    reveal: 排在最前 = 领先：队伍图直接可猜——跑在所有人前面，自然就是领先。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 汉语「前面」不分内外，英语分工是牛津 Which Word? 专框的裁定：in front of 指同一侧更靠前（≠ opposite），in/at the front of 指整体内部的最前部——词库口径「在…（外部）前面」与此一致，卷宗成人层明示这是中国学习者的高频混淆点。
    basis: 卷宗登记（牛津 Which Word? 专框）
  adult: 牛津 Which Word? 专框裁定：in front of ≠ opposite——它指同一侧更靠前的位置（公交车在房子前面 = 与房子同侧）；in/at the front of 指整体内部的最前部（司机坐在公交车的前部）。词库口径「在…（外部）前面」与此裁定一致，这是中国学习者的高频混淆点。（卷宗成人层原文）加厚注：本词与 from 同病——条文在 PB-08、索引全空，回链即可见（源图登记）。
  sources:
  - Oxford Learner's Dictionaries，front 词条 in front of 习语义项 1–4 与 Which Word? in front of / in the front of 专框
  - Cambridge Dictionary，in front of 短语词条（A2，义项 1–2）
  - 本项目 small_systems PB-08（投影介词组成员；接触等级：目录 + 书评 + 引述级）
  refs:
  - PB-08
- word: inside
  bank_id: ''
  meaning: 在……里面（内部）
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: inside 就是「在里面」：不是在门口、不是在边上——是进了里面、被包在里面。
    scene:
      s: The toys are inside the box.
      note: 玩具装在盒子内部——强调「里面」
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「被包在内部」，无专著裁决；专家层对本词零供给（源图一级真空），与 in 的分工靠卷宗词典口径（强调程度之差）。全链组装。
  chain:
  - sense: 在……的内部
    domain: 空间
    headline: inside 和 in 是亲戚，但 inside 把「里面」说得更响：in 只说在里面，inside 强调在内部、靠里边。
    example:
      s: There is a gold watch inside the box.
      note: 盒子内部藏着金表（牛津词条例句改写）
    extension:
      text: 核心图原位：被包在里面、靠里边——inside = in + side（词源行），语义重心天生在「内部」一侧。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；词源据 OALD inside 词源行
  - sense: 到……里面去
    domain: 空间
    headline: inside 还管「往里走」：从外面跨过门、钻进去，也是 inside。
    example:
      s: Go inside the house.
      note: 牛津词条原例句：进屋里去
    extension:
      text: 从核心图组装：静态的「在里面」动起来——跨过边界往里走，终点还是那个内部。
      basis: 组装非引证
      ref: 静态→动态（组装）；义项据 OALD 义项 1（to the inner part）
  - sense: 在……（时间）之内
    domain: 时间
    headline: 把时间也看成一个盒子：在一小时之内做完，就是把活儿装进这一小时里。
    example:
      s: We can finish the homework inside an hour.
      note: 在一小时之内做完（牛津义项 2 例句为 inside (of) a year，本句同构）
    extension:
      text: 按时间借用组装（M-3 通用机制）：容器图式借给时间——一段时间就是一个盒子，活儿装进去、不溢出来。
      basis: 组装非引证
      ref: M-3 时间借用（容器版组装）；义项据 OALD 义项 2
  - sense: 在心里、在身体里
    domain: 抽象
    headline: 看不见的「里面」也归 inside 管：心里高兴、肚子里暖和，都是身体这个大盒子的内部。
    example:
      s: She was smiling, but inside she was sad.
      note: 心里难过（牛津义项 1 的喻义支：Inside most of us is a small child…）
    extension:
      text: 从核心图组装：盒子换成身体——内部从装玩具的地方换成装心情的地方。
      basis: 组装非引证
      ref: 容器→身体（组装）；义项据 OALD 义项 1 喻义例
  growth: 空间（内部、进入）→ 时间（之内）→ 抽象（内心），P-17 标准展开形；全链组装，本词属源图一级真空，如实登记。
  guess:
  - usage: inside「在服刑」俚语
    type: 止
    reveal: 只登记备查、不进课堂：冷僻俚语，图式推不出，揭晓仅给义与登记理由（derivation_map 口径）。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 汉语「里」一词兼包 in 与 inside，英语的分工是强调程度：in 只说在里面，inside 把「内部」说得更响（卷宗对手栏口径）——不是对错之分，孩子产出先稳住 in，inside 作强调与认读。
    basis: 卷宗登记（对手栏 + 成人层）
  adult: inside = in + side 的复合词（牛津词源行），语义重心在「内部」一侧：与 in 的分工是强调程度而非对错；美式常说 inside of，英式多省略 of；时间义（inside a year）偏正式，儿童产出以空间义为主。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，inside 介词词条（义项 1–2 及词头注 inside of）
  - Oxford Learner's Dictionaries，inside 词源行（from in + side）
