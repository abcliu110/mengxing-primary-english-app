- word: since
  bank_id: ''
  meaning: 自从；自……以来
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: since 就是「从那时起到现在」：在时间线上钉一个起点，从那儿一直连到今天。
    scene:
      s: We have lived here since 2020.
      note: 从 2020 年一直住到现在（牛津例句框架：since 2006）
  verdict:
    type: 组装定中心
    text: 中心按卷宗口径定为「时间线上的起点钉」，无本词专著裁决；专家层供血全在时态侧（TA-06/CG-07 等，义项级边角），介词簇源头缺口。时间义适用 M-3 的一般机制（起点图式借到时间），但来源无本词专述，链的搭建属教学组装（derivation_map 重做注记同此口径）。
  chain:
  - sense: 从……起一直到现在（介词）
    domain: 时间
    headline: since 后面站的是一个起点：一个年份、一个星期一、一顿早饭——事情从那儿开始，一路没停。
    example:
      s: I haven't seen him since Monday.
      note: 从周一起就没见过他（牛津义项 1 例句框架：since Tuesday / since breakfast）
    extension:
      text: 核心图原位：起点钉在过去，线一直拉到现在——固定搭档是完成时（见对手栏与 for 的分工）。图式借自「出发点」的一般机制（M-3），无本词专述，标组装。
      basis: 组装非引证
      ref: M-3 通用机制组装；义项据 OALD since 介词条义项 1
  - sense: 自从……（连词，带一句话）
    domain: 时间
    headline: 起点也可以是一整件事：自从我们认识、自从她去了北京——since 后面跟上一句话，起点就变成一件事。
    example:
      s: We have been friends since we met in Grade One.
      note: 自从一年级认识起就是朋友（牛津连词义项 1 例句框架：since she went to Berlin）
    extension:
      text: 从核心图组装：起点从一个时刻换成一整件事——钉子钉在事件上，线照样拉到现在；身份同时从介词换成连词。
      basis: 组装非引证
      ref: 起点事件化（组装）；义项据 OALD since 连词条义项 1
  - sense: 因为（连词）
    domain: 抽象
    headline: since 还有一份差事：当「因为」讲——既然下雨了，那就待在家里吧。
    example:
      s: Since it is raining, let's stay at home.
      note: 既然下雨了，就待在家里（牛津连词义项 2：because; as）
    extension:
      text: 从时间站组装：排在前面的事，顺手读成原因——「在先」滑向「因由」。本义只以连词身份出现，组装标注，教学上与时间义分开教（成人层口径）。
      basis: 组装非引证
      ref: 先后→因果（组装）；义项据 OALD since 连词条义项 2
  growth: 时间（起点、事件起点）→ 抽象（原因）；无空间站——空间源头无登记，成长路线自时间始，如实注明。
  guess:
  - usage: since when?（反问语气）
    type: 习
    reveal: 形式可猜、语气不可推：字面是问起点，实际带恼怒反问——语用义整块登记，只揭晓语气。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 汉语「自从……以来」不强制时态，英语 since 钉起点必须与完成时连用（卷宗成人层口径）；且 since 管起点、for 管时长，汉语「三年了」易误产出 since + 时段（牛津词条明载 ✗ since five years）——本词最要紧的错位点在 since/for 分工上，已在对手栏登记。
    basis: 卷宗登记（OALD 用法注 + 对手栏）
  adult: since 有两个身份（介词/连词）与两种意义（时间起点/原因），需分开教：原因义只以连词出现；时间义的恒定伙伴是完成时。ever since 是其强调版（牛津连词例句：ever since the letter arrived）。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，since 介词词条（义项 1 及 for/since 用法注）
  - Oxford Learner's Dictionaries，since 连词词条（义项 1–2）
