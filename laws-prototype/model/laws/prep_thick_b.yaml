  core:
    form: 单一图式
    headline: outside 就是「在外面」：出了门、出了圈——边界外头那一片，都是 outside。
    scene:
      s: The dog is outside the house.
      note: 狗在房子外面
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「边界之外」，无专著裁决；专家层对本词零供给（源图一级真空），与 inside 构成边界内外对子靠卷宗口径。全链组装。
  chain:
  - sense: 在……的外面
    domain: 空间
    headline: 挨着外皮的那一面：车停在房子外面、人站在教室外面，都还没有进去。
    example:
      s: You can park your car outside our house.
      note: 牛津词条原例句：车停在我家外面
    extension:
      text: 核心图原位：贴着外墙的那一侧——边界先站好，外侧才有意义，与 inside 隔界相对。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD outside 介词条义项 1
  - sense: 在……以外（出了地界）
    domain: 空间
    headline: 把边界放大到一座城：住在城外、城里最大的公园在国外——出了这个地界，就是 outside。
    example:
      s: We live in a small village just outside the city.
      note: 住在城外的小村子（牛津义项 2 例句为 just outside Leeds，本句同构）
    extension:
      text: 从核心图组装：边界从一面墙放大到一座城的地界——图没变，只是尺度放大。
      basis: 组装非引证
      ref: 边界放大（组装）；义项据 OALD 义项 2
  - sense: 不在……范围里
    domain: 抽象
    headline: 看不见的圈子也一样：上课时间之外、工作范围之外——不在这个圈子里，就是 outside。
    example:
      s: Outside working hours, Dad plays football with me.
      note: 工作时间之外（牛津义项 3 例句框架：outside working hours）
    extension:
      text: 从核心图组装：圈子换成看不见的范围（时间、管辖）——出了这个圈子，就是不在范围里。
      basis: 组装非引证
      ref: 边界→范围（组装）；义项据 OALD 义项 3
  growth: 空间（外面、出界）→ 抽象（范围外）；时间读法并入范围站（outside working hours），无独立时间站。全链组装，本词属源图一级真空，如实登记。
  guess:
  - usage: outside of = except（除了）
