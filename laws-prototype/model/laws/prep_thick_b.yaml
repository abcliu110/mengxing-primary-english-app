- word: past
  bank_id: ''
  meaning: 走过；过了……点；超过
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: past 就是「过去了」：人走过去，钟点也走过去——过了那个点，就叫 past。
    scene:
      s: A bus went past our school.
      note: 公交车从校门口驶过
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「通过并越过」（卷宗成人层：past 是 passed 的变体，牛津词源行），无专著裁决；专家层对本词零供给（源图近真空，仅 TEC-P24 一条挂接）。全链组装。
  chain:
  - sense: 从……旁边走过
    domain: 空间
    headline: 从一个人身边走过、不停下来：人过去了，影子也过去了——past 的老家是「通过」。
    example:
      s: He just walked straight past us!
      note: 牛津词条原例句：他径直从我们身边走过
    extension:
      text: 核心图原位：参照物在身侧，路径从它旁边通过并越过——不停、不绕，就是 past。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD past 介词条义项 2
  - sense: 过了……点
    domain: 时间
    headline: 报时间的时候，分针走过整点，就是 past 在上班：两点半，英语说「过了两点一半」。
    example:
      s: It's half past two.
      note: 牛津词条原例句：现在两点半
    extension:
      text: 按时间借用组装（M-3 通用机制）：人越过参照物的图搬到表盘上——分针越过整点，读作「过了几点几分」；英美分工（美式 after）见对手栏。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）；义项据 OALD 义项 1
  - sense: 超过（某个点、某个阶段）
    domain: 抽象
    headline: 看不见的线也能越过：花开过了最盛的时候、年纪过了七十——都是「已经过去了那个点」。
    example:
      s: The flowers are past their best.
      note: 牛津词条原例句：花已过盛放期
    extension:
      text: 从核心图组装：被越过的点换成看不见的阶段与限度——越过盛放期，就是过了最好的时候。与 beyond 的分工：past 是「经过」，beyond 标「出界」（beyond 页成人层口径）。
      basis: 组装非引证
      ref: 越过点→越过阶段（组装）；义项据 OALD 义项 3
