- word: like
  bank_id: ''
  meaning: 像……一样（介词义）
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: like 就是「像」：把两样东西摆在一起比——长得像、做得像，都是 like。
    scene:
      s: Tom looks like his father.
      note: 长相像——like 的原型场景
  verdict:
    type: 组装定中心
    text: 中心按卷宗口径定为「摆在一起比」，无专著裁决；介词 like 在专家/模型层真空（源图登记：索引层 11 条 law_refs 全是动词义行，引用时须防误读为介词供给）。旧 App 有 as/like 比较成组讲解，是本词最现成的教学资产。全链组装。
  chain:
  - sense: 像（长相、味道）
    domain: 比较
    headline: 长得像爸爸、尝起来像鸡肉：像不像，比一比就知道。
    example:
      s: She looks like her mother.
      note: 她长得像妈妈（牛津义项 1 例句为 She looks nothing like her mother）
    extension:
      text: 核心图原位：两样东西并排一比，外观对上号——这是 like 的出发点。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD like 介词条义项 1
  - sense: 像……那样（做法像）
    domain: 比较
    headline: 不光长得像，做得也要像：跑得像风一样快、照着这样做——都是拿一样东西当样子。
    example:
      s: He ran like the wind.
      note: 牛津词条原例句：跑得像风一样
    extension:
      text: 从核心图组装：比的对象从长相换成做法——不是他变成了风，是他跑的样子像风。
      basis: 组装非引证
      ref: 外观→方式（组装）；义项据 OALD 义项 3
  - sense: ……怎么样？（What's it like?）
    domain: 用法
    headline: 想问「新学校怎么样、新老师怎么样」，英语的问法是拿 like 来问：它「像」什么样子？
    example:
      s: What's your new school like?
      note: 你的新学校怎么样（牛津义项 2 例句框架：What's it like studying in Spain?）
    extension:
      text: 从核心图组装：问「它像什么」就是问「它是什么样子」——比较句式转身变成问法，是 like 独有的一站。
      basis: 组装非引证
      ref: 比较→问法（组装）；义项据 OALD 义项 2
  - sense: 例如
    domain: 用法
    headline: 举例子的时候，like 还能当「例如」：说一类东西太空，举两个像它的例子就清楚了。
    example:
      s: We play games like football and basketball after school.
      note: 像足球、篮球这样的游戏（牛津义项 4 例句为 novels like 'Animal Farm'，本句同构）
    extension:
      text: 从核心图组装：举一个「像这一类」的代表出来——「像」从比两样东西，变成替一类东西出代表。
      basis: 组装非引证
      ref: 比较→举例（组装）；义项据 OALD 义项 4
  growth: 比较域内部展开（样子 → 做法 → 问法 → 举例）；无空间/时间站，P-17 的域外形态，如实登记。全链组装。
  guess:
  - usage: like 作连词（like I do）
    type: 竞
    reveal: 与 as 的口语/正式竞争：口语常见、正式书面不认可——只认读，产出按 like + 名词 / as + 从句分工走。
    source: 卷宗未收登记（a乙）；derivation_map ③
  - usage: It's just like her to …（太像她的作风）
    type: 远
    reveal: 从「做法像」再走一步：连做事的风格都对上号——低频，揭晓认读即可。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 汉语「像」一词兼包，英语分工（牛津 Which Word? 框裁定）：like 后接名词/代词，as 后接从句；说身份、当作只能用 as——与 as 页互指。另须防索引误读：本词 law_refs 11 条全为动词「喜欢」的例词行，介词义零专属挂接（源图登记）。
    basis: 卷宗登记（Which Word? 框）+ 源图索引注记
  adult: 本卷宗只收 like 的介词义（动词「喜欢」不入）。介词身份的判据是「后接名词/代词」（牛津 Which Word? 框）；口语中 like 作连词（like I do）及 like = as if 极为常见，但正式书面英语不予认可——儿童阶段只教介词用法，连词用法阅读中认得即可。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，like 介词词条（义项 1–5）及 Which Word? as / like 专框
