- word: without
  bank_id: ''
  meaning: 没有；不带
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: without 就是「没有它」：该带的东西没带、该来的人没来——空着的那一块，就是 without。
    scene:
      s: He went to school without his bag.
      note: 没背书包就去了学校
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「缺席的空位」，无专著裁决；专家层对本词零供给（源图一级真空）。词源上 without = with + out（古英语 withūtan），与 with 构成「有/无」对子是词典登记的形态事实，链按此对子组装。
  chain:
  - sense: 没有（东西）
    domain: 缺失
    headline: 没有水、没有吃的、没有困难：缺了某样东西，就用 without 把它点出来。
    example:
      s: Fish can't live without water.
      note: 鱼没有水活不了（牛津义项 1 例句框架：two days without food）
    extension:
      text: 核心图原位：without 后面站的永远是「缺席的那一位」——先点名，再宣布它不在场。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD without 条义项 1
  - sense: 没人陪
    domain: 缺失
    headline: 缺席的也可以是人：别丢下我一个人走——没有我陪着，就是 without me。
    example:
      s: Don't go without me.
      note: 牛津词条原例句：别丢下我
    extension:
      text: 从核心图组装：缺席者从东西换成人——正是 with 陪伴图的反面（with 页组图首图）。
      basis: 组装非引证
      ref: 缺席者人格化（组装）；义项据 OALD 义项 2
  - sense: 没带、不用
    domain: 缺失
    headline: 眼镜没戴看不清、外套没穿会冷：该用的东西没用上，也是 without。
    example:
      s: Can you see without your glasses?
      note: 牛津词条原例句：不戴眼镜你能看见吗
    extension:
      text: 从核心图组装：该在手边干活的工具缺席——with 工具图的反面。
      basis: 组装非引证
      ref: 工具缺席（组装）；义项据 OALD 义项 3
  - sense: 没做某事就……
    domain: 缺失
    headline: without 还能管一整件事没做：没说再见就走了、没看就签了字——后面跟的是「本该做的动作」。
    example:
      s: He left without saying goodbye.
      note: 牛津词条原例句：他没说再见就走了
    extension:
      text: 从核心图组装：缺席的换成一个动作——本该做的一步被省掉；后接动名词（without doing）是其语法化最高的一支，初中写作高频（成人层口径）。
      basis: 组装非引证
      ref: 缺席者动作化（组装）；义项据 OALD 义项 4
  growth: 缺失义内部展开（物 → 人 → 工具 → 动作）；无空间/时间/抽象分站，成长路线即「缺席者升级」的次序，与 with 的组图逐图成反面对子。
  guess:
  - usage: without fail / without doubt（一定、无疑）
    type: 远
    reveal: 字面可猜：没有失败的可能、没有怀疑的余地——熟语形式整块记，义可由核心图读出。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点，不编造；结构注意点（without 后接动名词、不接动词原形）已在卷宗 errors 登记方向标明，属结构层而非错位图。
    basis: 无登记（结构注意见卷宗 errors）
  adult: without 由 with + out 复合而来（牛津词源行：古英语 withūtan，本义与「在外面」有关），与 with 构成「有/无」对子。义项 4（without doing）是其语法化程度最高的一支，后接动名词，初中写作高频，故单列成节点。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，without 介词词条（义项 1–4 及词源行）
  refs: []
