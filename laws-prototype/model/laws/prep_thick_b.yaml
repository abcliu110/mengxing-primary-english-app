- word: until
  bank_id: ''
  meaning: 直到……为止
  phonetic_gb: ''
  core:
    form: 单一图式
    headline: until 就是「一直到……为止」：一件事不停地做，做到那个点才停。
    scene:
      s: We waited until five o'clock.
      note: 一直等到五点
  verdict:
    type: 组装定中心
    text: 中心按可描绘性定为「持续到终点为止」，无专著裁决；专家层对本词零供给（源图真空清单；另有一处索引数据不一致待修：拼读挂接行标 in_bank=false 与词库现存条目 ADD_0704 不符，回链时须修正）。全链组装。
  chain:
  - sense: （地方）一直到……为止
    domain: 空间
    headline: 坐车也一样：坐到伦敦才下车——路也有它的「为止」站。
    example:
      s: You can stay on the bus until London.
      note: 牛津词条原例句：可以一直坐到伦敦
    extension:
      text: 核心图原位：持续的动作/状态先行，终点站后到——until 的机关是「先持续、后收尾」。
      basis: 组装非引证
      ref: 核心图原位（链首节点）；义项据 OALD until 条义项 1 例句
  - sense: 一直到……（时刻、事件）
    domain: 时间
    headline: 等到雨停、等到五点：事情一直继续，直到那个时刻或那件事发生，才收尾。
    example:
      s: Let's wait until the rain stops.
      note: 牛津词条原例句：等到雨停
    extension:
      text: 按时间借用组装（M-3 通用机制）：终点从地方搬到时间轴上——持续到那个时刻或那件事为止。
      basis: 组装非引证
      ref: M-3 时间借用（通用机制组装）；义项据 OALD 义项 1
  - sense: 直到……才
    domain: 时间
    headline: until 还能管「才」：作业没写完，就不能出去玩——等到条件到了，前面的事才被放行。
    example:
      s: I won't go to bed until I finish my homework.
      note: 写完作业我才睡（牛津义项 1 例句框架：not going out until you've finished）
    extension:
      text: 从前站组装：终点变成放行条件——否定句式 not...until 是同一图式的句法版，教学时单列（成人层口径）。
      basis: 组装非引证
      ref: 终点→放行条件（组装）；句式据 OALD 义项 1 例句
  growth: 空间（坐到站）→ 时间（到时刻、到条件），同域内由实到句式的深化；全链组装，本词属源图真空，词条本身只有「up to the point」一个义项群、卷宗已全收。
  guess:
    status: 无
    reason: 29 个新补词中唯一零候选者——卷宗明示 until 的义项群已全收、无未收用法；三路来源（目录/簇原文/卷宗登记）均无链外登记。如实登记为无，不凑候选。
  cn_cut:
    text: 汉语「直到……才」与 not...until 同构，此站可正迁移（卷宗义项对照得出的组装注）；汉语「等到……」与 until 的持续—终点图亦同向。错位风险主要在把 until 误当前置否定，属句式层，已在成人层与 errors 登记方向标明。
    basis: 组装（卷宗义项对照）
  adult: until 与 till 同义，但 till 不是 until 的缩写：牛津词源行显示 until = 古诺斯语 und（as far as）+ till，意思本就是叠加的。till 偏口语且不能放句首，正式写作与句首用 until（牛津词条头注：also informal till）。not...until 是否定句式的一支，教学时单列。（卷宗成人层原文）
  sources:
  - Oxford Learner's Dictionaries，until 词条（义项 1、词条头注及词源行）
