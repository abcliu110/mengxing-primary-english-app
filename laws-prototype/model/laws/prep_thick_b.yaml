    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的中英错位点；已登记的是英美分工（报时 past 英式 / after 美式，见对手栏），不冒充中英错位。
    basis: 无登记（英美分工见对手栏）
