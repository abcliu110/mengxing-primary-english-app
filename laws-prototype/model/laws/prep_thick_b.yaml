- word: with
  bank_id: ''
  meaning: 和……一起；带着；用
  phonetic_gb: ''
  core:
    form: 核心关系组图
    headline: with 就是「和……在一起」：人跟人在一起，东西跟东西在一起——带着它、用着它，都算在一起。
    scene:
      s: I play with my friends.
      note: 和朋友在一起——with 的原型场景
    group_note: 否定性裁决（见 verdict）之下本词不设单一证件照：核心以「一组场景图 + 或」呈现——陪伴图、携带图、工具图、填充图、态度图，五图并列，后一图不是前一图长出来的。
  verdict:
    type: 否定性裁决
    text: PB-02（Lindstromberg）否定性裁决：with 画不出单一基本图，「只能用一组图加『或』连起来」；能不能画本身就是基本义定得对不对的检验——with 是这条判据的著名反例。故本词形态 = 核心关系组图 + 分组呈现，chain 各站是「在一起」的并列侧面、不是引申步骤；专家层另有 Dirven 邻近组（by/with，PB-13）分组定位，无衍生链。
  chain:
  - sense: 和……一起
    domain: 伴随
    headline: 跟谁在一起，就 with 谁：和爸爸妈妈住、和朋友玩——with 先管的是「陪伴」。
    example:
      s: She lives with her parents.
      note: 牛津词条原例句：她和父母住在一起
    extension:
      text: 组图首图（非引申链首环）：陪伴是五张场景图里最先教的一张——人跟人在一起。其余四图与它并列，不是从它推导出来的。
      basis: 组装非引证
      ref: 否定性裁决下的组图站；义项据 OALD with 条义项 1
  - sense: 带着、有（特征）
    domain: 伴随
    headline: 一个人带着什么、长着什么，也归 with 说：红头发的女孩、提着箱子的人——东西就「跟」在他身上。
    example:
      s: The girl with long hair is Lily.
      note: 长头发的女孩是莉莉（牛津义项 2 例句：a girl with red hair）
    extension:
      text: 组内关系（组装）：「在一起」从人挪到物——东西跟在人身上，读作带着、有特征。与陪伴图是并列侧面。
      basis: 组装非引证
      ref: 组图并列站（组装）；义项据 OALD 义项 2
  - sense: 用（工具）
    domain: 工具
    headline: 干活的工具也「跟」着你：用筷子吃饭、用刀切苹果——工具在手里，就是 with。
    example:
      s: We eat with chopsticks.
      note: 我们用筷子吃饭（牛津义项 3：using something；其例句为 Cut it with a knife）
    extension:
      text: 组内关系（组装）：在手里干活的「在一起」——工具图。与 by 的方式分工（by 较抽象、with 指手中工具）见 by 页对手栏。
      basis: 组装非引证
      ref: 组图并列站（组装）；义项据 OALD 义项 3
  - sense: 装满、盖满
    domain: 工具
    headline: 把东西塞满、撒满：书包里塞满书、蛋糕上撒满糖——「装着什么」也是 with。
    example:
      s: The bag was stuffed with books.
      note: 书包里塞满了书（牛津义项 4 例句为 stuffed with dirty clothes，本句换物同构）
    extension:
      text: 组内关系（组装）：塞到没有空当的「在一起」——填充图，是伴随最密的一张。
      basis: 组装非引证
      ref: 组图并列站（组装）；义项据 OALD 义项 4
  - sense: 对……（态度冲着谁）
    domain: 抽象
    headline: 生气、满意、小心——这些态度也要冲着一个人去，这个人就由 with 引出来。
    example:
      s: Don't be angry with her.
      note: 牛津词条原例句：别生她的气
    extension:
      text: 组内关系（组装）：态度冲着的那个人，也是「跟」在态度旁边的人——关系图。对抗义（fight with）不在主链，在猜一猜作反例型候选登记。
      basis: 组装非引证
      ref: 组图并列站（组装）；义项据 OALD 义项 6
  growth: 分组呈现，无成长序：否定性裁决之下不设展开序（P-17 不适用本词，如实注明）；五站按教学顺序排（陪伴、携带、工具、填充、态度），非衍生次序。
  guess:
  - usage: fight with 的对手面
    type: 远
    reveal: 本组最好的反例型候选：with 古义含「对抗」（wither 残留，卷宗成人层登记）——猜成「作伴」会错；揭晓点明：跟他打，可以是并肩、也可以是对打，看动词脸色。
    source: 卷宗未收登记（a乙）；derivation_map ③
  - usage: part with（分开、割舍）
    type: 止
    reveal: 不可推导登记：与「在一起」正相反，整块记，只揭晓义，不编桥。
    source: 卷宗未收登记（a乙）；derivation_map ③
  cn_cut:
    text: 盘点未登记本词的专条中英错位点；已登记的相关分工是与 by 的英语内部方式分工（with 指手中工具、by 较抽象，Oxford Guide §228），在 by 页对手栏呈现，不冒充中英错位。
    basis: 无登记（英语内部分工见 by 页）
  adult: with 的核心是「伴随」图式：陪伴、携带、工具、填充都是「X 跟 Y 在一起」的变体。牛津词条共 17 个义项，本卷宗只取小学+初中高频 5 个，其余登记未收。词源上 with 与古义「对抗」有关（牛津词源行：related to obsolete wither 'adverse, opposite'），义项 5 的对抗义（fight with）正是这层老义的残留。（卷宗成人层原文）加厚注：成人层「变体」讲法与 PB-02 否定性裁决的口径差已按裁决修正呈现形态——组图 + 或、分组非引申链；「伴随图式」只作组图的统称，不作单一基本图使用。
  sources:
  - Oxford Learner's Dictionaries，with 介词词条（义项 1–17 及词源行）
  - 本项目 small_systems PB-02（可描绘性判据与 with 反例）；PB-13（Dirven 邻近组 by/with）
