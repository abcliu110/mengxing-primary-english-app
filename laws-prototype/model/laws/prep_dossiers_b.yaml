set: 介词补完·乙组
date: '2026-11-01'
scope: 乙组 14 词（in front of, inside, like, near, of, outside, past, plus, since, through, until, upon, with, without）——原只有核心义的介词，本卷补成与甲组同规格的全家福卷宗
basis: 义项清单逐条查证学习词典：以 Oxford Learner's Dictionaries 在线版（Oxford Advanced Learner's Dictionary）各词条为主，in front of 另据 Cambridge Dictionary 短语词条与 Oxford front 词条 Which Word? 专框，through 另引项目 small_systems PB-04（Lindstromberg 2010 路径簇）；全部于 2026-11-01 查证。查无依据的义项不写，冷僻义登记于各词 uncollected（未收义项）
granularity: 每词 3–5 个义项节点，只收小学+初中真实高频义；义项链按空间→时间→抽象排序；每节点 1 句例句；每词含核心义、对手速览、成人层一句、派生练习 1 题、病例待补登记、未收义项登记
special_rulings: of 只收最高频五点（所属/部分/材料/数量/关于）；upon 按 on 的正式变体作短卷宗；plus 以加/外加/零上为主并在成人层注明介词身份边界（零上为牛津形容词义项，破例同卷登记）；like 只收介词义，动词义不入
machine_readable_twin: model/prep_family_b.json（同内容机读版，键 = 词形，结构对齐 prepositions-prototype-v1.html 内嵌 DATA.pages 字段）
status: 乙组卷宗初稿（待集成方接入原型 DATA.pages 后，familyOrder/remainderOrder 需同步修订）
words:
  in front of:
    word: in front of
    meaning: 在……（外部）前面
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: in front of
    core:
      headline: in front of 就是「在……前面」：比它更靠前，脸朝着同一边。
      scene_sentence: The bus stops in front of our school.
      scene_note: 校车停在学校大门前
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: ''
        name: 在……前面（更靠前）
        headline: 排队时你站在我前面、公交车停在房子前面：更靠前、还挨得近，就是 in front of。
        beats:
        - beat: 更靠前
          text: 注意：这是站在外面的前面——公交车在房子前面，和房子在马路的同一边；教室里「前排」是另一件衣服，叫 in the front of。
        examples:
        - s: He was standing in front of me in the line.
          note: 牛津词条原例句：排队时站在我前面
        claim: ''
        source: Oxford Learner's Dictionaries，front 词条 in front of 习语义项 1；Cambridge Dictionary，in front of 短语词条义项 1（close to the front part of something）
      - law: ''
        name: 面对着……
        headline: 站在大家对面也是一种「前面」：上台表演、在镜头前面，你面对着所有人的眼睛。
        beats:
        - beat: 面对面
          text: 唱歌给全班听：你站在前面，大家看着你——in front of a big crowd。
        examples:
        - s: She likes singing in front of a big crowd.
          note: 在一大群人面前表演（牛津习语义项 2：to perform in front of a big crowd）
        claim: ''
        source: Oxford Learner's Dictionaries，front 词条 in front of 习语义项 2（in a position facing somebody/something）
    - domain: 时间
      label: 时间义 · 讲时间
      nodes:
      - law: ''
        name: 还在前面（没到的日子）
        headline: 时间也被排成一条队：还没轮到的日子，都站在你前面等着——你的一生还长着呢。
        beats:
        - beat: 日子排队
          text: Your whole life is in front of you：好多日子还在前面，没过完呢。
        examples:
        - s: You have a happy life in front of you.
          note: 幸福的日子还在前面（牛津习语义项 4 例句为 your whole life in front of you）
        claim: ''
        source: 'Oxford Learner''s Dictionaries，front 词条 in front of 习语义项 4（of time: still to come）'
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 当着……的面
        headline: 当着别人的面，就是在他的眼睛前面：有些话不能当着小朋友的面说。
        beats:
        - beat: 眼睛前面
          text: 他在场、他能听见——这件事就是 in front of him 发生的。
        examples:
        - s: Please don't talk about it in front of the children.
          note: 牛津词条原例句：别当着孩子们的面谈这件事
        claim: ''
        source: Oxford Learner's Dictionaries，front 词条 in front of 习语义项 3；Cambridge Dictionary，in front of 短语词条义项 2（where someone can see or hear you）
    opponents:
    - word: behind
      laws: []
      headline: behind 是它的正反面：in front of 站在前面露脸，behind 躲在后面看不见——排队时一个在前、一个在后。
    quizzes:
    - law: ''
      q: 排队时「他站在我前面」用哪个？
      options:
      - in front of
      - behind
      - inside
      answer: in front of
      hint: 排队时你站在我前面、公交车停在房子前面：更靠前、还挨得近，就是 in front of。
    errors:
    - law: ''
      type: in front of / in the front of 混用（外部前面 vs 内部前部）
      note: 分工依据见成人层（牛津 Which Word? 专框）；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: 牛津 Which Word? 专框裁定：in front of ≠ opposite——它指同一侧更靠前的位置（公交车在房子前面 = 与房子同侧）；in/at the front of 指整体内部的最前部（司机坐在公交车的前部）。词库口径「在…（外部）前面」与此裁定一致，这是中国学习者的高频混淆点。
      sources:
      - Oxford Learner's Dictionaries，front 词条 Which Word? in front of / in the front of 专框
      - Cambridge Dictionary，in front of 短语词条（A2）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: The bus stops in front of our school.
      note: 校车停在学校大门前
      law: ''
      claim: ''
    uncollected:
    - in front 作副词短语的「领先」义（The blue team is in front，牛津 in front 副词义项 2）——非介词结构，未收
    - front 名词的「前线、阵线」等义不在本卷宗范围
  inside:
    word: inside
    meaning: 在……里面（内部）
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: inside
    core:
      headline: inside 就是「在里面」：不是在门口、不是在边上——是进了里面、被包在里面。
      scene_sentence: The toys are inside the box.
      scene_note: 玩具装在盒子内部——强调「里面」
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: ''
        name: 在……的内部
        headline: inside 和 in 是亲戚，但 inside 把「里面」说得更响：in 只说在里面，inside 强调在内部、靠里边。
        beats:
        - beat: 内部优先
          text: 盒子里、房子里、书里——只要被包在里面，就能说 inside；说的就是那层「里」味儿。
        examples:
        - s: There is a gold watch inside the box.
          note: 盒子内部藏着金表（牛津词条例句改写）
        claim: ''
        source: Oxford Learner's Dictionaries，inside 介词词条义项 1（on or to the inner part of something; within）
      - law: ''
        name: 到……里面去
        headline: inside 还管「往里走」：从外面跨过门、钻进去，也是 inside。
        beats:
        - beat: 往里走
          text: 下雨了、起风了——Go inside the house，先躲进里面再说。
        examples:
        - s: Go inside the house.
          note: 牛津词条原例句：进屋里去
        claim: ''
        source: Oxford Learner's Dictionaries，inside 介词词条义项 1（to the inner part）
    - domain: 时间
      label: 时间义 · 讲时间
      nodes:
      - law: ''
        name: 在……（时间）之内
        headline: 把时间也看成一个盒子：在一小时之内做完，就是把活儿装进这一小时里。
        beats:
        - beat: 时间盒子
          text: 作业装进一小时：inside an hour，就是不用超过一小时。
        examples:
        - s: We can finish the homework inside an hour.
          note: 在一小时之内做完（牛津义项 2 例句为 inside (of) a year，本句同构）
        claim: ''
        source: Oxford Learner's Dictionaries，inside 介词词条义项 2（in less than the amount of time mentioned）
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 在心里、在身体里
        headline: 看不见的「里面」也归 inside 管：心里高兴、肚子里暖和，都是身体这个大盒子的内部。
        beats:
        - beat: 心里那块
          text: 脸上在笑，心里难过——inside 说的，就是心里那一块地方。
        examples:
        - s: She was smiling, but inside she was sad.
          note: 心里难过（牛津义项 1 的喻义支：Inside most of us is a small child…）
        claim: ''
        source: Oxford Learner's Dictionaries，inside 介词词条义项 1 喻义例（figurative）
    opponents:
    - word: in
      laws:
      - P-03
      headline: in 是松一点的亲戚：只说在里面；inside 更强调「在内部」，两个词多数时候能换，inside 的「里」味更重。
    - word: outside
      laws: []
      headline: outside 是正反面：在盒子外面、出了门——一内一外，隔着一层边界。
    quizzes:
    - law: ''
      q: 哪个词最强调「在内部、被包在里面」？
      options:
      - inside
      - outside
      - near
      answer: inside
      hint: 盒子里、房子里、书里——只要被包在里面，就能说 inside；说的就是那层「里」味儿。
    errors:
    - law: ''
      type: inside/in 选用与 inside of 语域
      note: 清单未登记逐字病例，不自编；待课堂/语料错例补录后回填。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: inside = in + side 的复合词（牛津词源行），语义重心在「内部」一侧：与 in 的分工是强调程度而非对错；美式常说 inside of，英式多省略 of；时间义（inside a year）偏正式，儿童产出以空间义为主。
      sources:
      - Oxford Learner's Dictionaries，inside 介词词条（义项 1–2 及词头注 inside of）
      - Oxford Learner's Dictionaries，inside 词源行（from in + side）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: The toys are inside the box.
      note: 玩具装在盒子内部——强调「里面」
      law: ''
      claim: ''
    uncollected:
    - 名词/副词用法（the inside 名词义、come inside 副词义）不在本介词卷宗范围
    - 俚语「在服刑」（inside 作副词/名词的非正式义）——冷僻，未收
  like:
    word: like
    meaning: 像……一样（介词义）
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: like
    core:
      headline: like 就是「像」：把两样东西摆在一起比——长得像、做得像，都是 like。
      scene_sentence: Tom looks like his father.
      scene_note: 长相像——like 的原型场景
    groups:
    - domain: 比较
      label: 样子义 · 长得像、做得像
      nodes:
      - law: ''
        name: 像（长相、味道）
        headline: 长得像爸爸、尝起来像鸡肉：像不像，比一比就知道。
        beats:
        - beat: 摆在一起比
          text: 她和妈妈站在一起：She looks like her mother——不用多说，一看就像。
        examples:
        - s: She looks like her mother.
          note: 她长得像妈妈（牛津义项 1 例句为 She looks nothing like her mother）
        claim: ''
        source: Oxford Learner's Dictionaries，like 介词词条义项 1（similar to somebody/something）
      - law: ''
        name: 像……那样（做法像）
        headline: 不光长得像，做得也要像：跑得像风一样快、照着这样做——都是拿一样东西当样子。
        beats:
        - beat: 当样子学
          text: He ran like the wind：不是他变成了风，是他跑的样子像风。
        examples:
        - s: He ran like the wind.
          note: 牛津词条原例句：跑得像风一样
        claim: ''
        source: Oxford Learner's Dictionaries，like 介词词条义项 3（in the same way as somebody/something）
    - domain: 用法
      label: 问法与举例 · 像的两个差事
      nodes:
      - law: ''
        name: ……怎么样？（What's it like?）
        headline: 想问「新学校怎么样、新老师怎么样」，英语的问法是拿 like 来问：它「像」什么样子？
        beats:
        - beat: 问样子
          text: What's your new teacher like? ——问的不是喜不喜欢，是她是个什么样的人。
        examples:
        - s: What's your new school like?
          note: 你的新学校怎么样（牛津义项 2 例句框架：What's it like studying in Spain?）
        claim: ''
        source: Oxford Learner's Dictionaries，like 介词词条义项 2（used to ask somebody's opinion of somebody/something）
      - law: ''
        name: 例如
        headline: 举例子的时候，like 还能当「例如」：说一类东西太空，举两个像它的例子就清楚了。
        beats:
        - beat: 举个像的
          text: 水果有很多种：apples and bananas 就是水果的「例子代表」。
        examples:
        - s: We play games like football and basketball after school.
          note: 像足球、篮球这样的游戏（牛津义项 4 例句为 novels like 'Animal Farm'，本句同构）
        claim: ''
        source: Oxford Learner's Dictionaries，like 介词词条义项 4（for example）
    opponents:
    - word: as
      laws: []
      headline: as 是 like 的搭档也是对手：like 后面跟名词（like me），as 后面跟一整句话（as I do）——牛津 Which Word? 框的裁定。
    quizzes:
    - law: ''
      q: 「她长得像她妈妈」用哪个词？
      options:
      - like
      - with
      - of
      answer: like
      hint: 她和妈妈站在一起：She looks like her mother——不用多说，一看就像。
    errors:
    - law: ''
      type: like/as 混用与 like 误接句子
      note: 分工依据见成人层（牛津 Which Word? 框）；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: 本卷宗只收 like 的介词义（动词「喜欢」不入）。介词身份的判据是「后接名词/代词」（牛津 Which Word? 框）；口语中 like 作连词（like I do）及 like = as if 极为常见，但正式书面英语不予认可——儿童阶段只教介词用法，连词用法阅读中认得即可。
      sources:
      - Oxford Learner's Dictionaries，like 介词词条（义项 1–5）及 Which Word? as / like 专框
      grade: 学习词典定版级
      beats: []
    stage:
      sent: Tom looks like his father.
      note: 长相像——like 的原型场景
      law: ''
      claim: ''
    uncollected:
    - 动词义「喜欢」——按本卷宗口径不入（只收介词义）
    - 义项 5「太像某人的作风」（It's just like her to tell everyone）——低频，未收
    - 非正式连词用法（like I do / It looks like we're late）——登记于成人层，未单列义项
  near:
    word: near
    meaning: 在……附近
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: near
    core:
      headline: near 就是「离……不远」：不用走几步、不用等几天，就到了、就来了。
      scene_sentence: There is a bookshop near our school.
      scene_note: 书店离学校不远
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: ''
        name: 在……附近
        headline: 离得近，但不一定挨着：书店在学校附近，走几步就到——这就是 near。
        beats:
        - beat: 几步路
          text: near 还能比大小：nearer 是更近，nearest 是最近——离得最近的那家超市就是 the nearest supermarket。
        examples:
        - s: My home is near the school.
          note: 我家在学校附近（牛津义项 1 例句框架：Do you live near here?）
        claim: ''
        source: Oxford Learner's Dictionaries，near 介词词条义项 1（at a short distance away from somebody/something）
    - domain: 时间
      label: 时间义 · 讲时间
      nodes:
      - law: ''
        name: （时间）离……近了
        headline: 日子也能比远近：生日离圣诞节很近，就是两个日子挨得近。
        beats:
        - beat: 日子挨近
          text: 把日子排成一队：挨得近的两天，就是 near。
        examples:
        - s: My birthday is very near Christmas.
          note: 牛津词条原例句：我的生日离圣诞节很近
        claim: ''
        source: Oxford Learner's Dictionaries，near 介词词条义项 2（a short period of time from something）
    - domain: 数量
      label: 数量义 · 讲数目
      nodes:
      - law: ''
        name: 接近（数字）
        headline: 数字也能「离得近」：差不多五公斤、快一百人了——没到，但挨得很近。
        beats:
        - beat: 差一点点
          text: 秤上的数字往上爬，快爬到五公斤，就是 near five kilos。
        examples:
        - s: The bag is near five kilos.
          note: 这包东西接近五公斤（牛津义项 3：used before a number to mean approximately）
        claim: ''
        source: Oxford Learner's Dictionaries，near 介词词条义项 3（approximately, just below or above）
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 差不多、接近（样子）
        headline: 颜色差不多、答案差不多对：样子离原版很近，也是 near。
        beats:
        - beat: 差一点点到
          text: 这块颜色和原来那块摆在一起：几乎一样，就是 nearest to the original。
        examples:
        - s: This colour is very near the original one.
          note: 这颜色和原来的很接近（牛津义项 4 例句为 This colour is nearest (to) the original）
        claim: ''
        source: Oxford Learner's Dictionaries，near 介词词条义项 4（similar to somebody/something in quality, size, etc.）
      - law: ''
        name: 差点儿就……（状态）
        headline: 离某种样子只差一步：差点儿哭出来、差点儿睡着——人离那个状态非常近。
        beats:
        - beat: 只差一步
          text: 眼泪已经到眼眶边了：She was near to tears——就差掉下来。
        examples:
        - s: She was near to tears.
          note: 牛津词条原例句：她差点儿哭出来
        claim: ''
        source: Oxford Learner's Dictionaries，near 介词词条义项 5（close to a particular state）
    opponents:
    - word: next to
      laws: []
      headline: next to 是贴着的紧挨着（就坐在窗户旁边）；near 是不远、但中间可以有空——牛津 Which Word? 框：nearest to 是「一群里最近的一个」，next to 是「正贴着」。
    quizzes:
    - law: ''
      q: 「我家离学校不远」用哪个词最贴？
      options:
      - near
      - inside
      - past
      answer: near
      hint: 离得近，但不一定挨着：书店在学校附近，走几步就到——这就是 near。
    errors:
    - law: ''
      type: near to 的 to 误加（地名/人名前）
      note: 依据见成人层（牛津词条头注）；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: near 兼有介词/形容词/副词身份，本卷宗只收介词义。牛津词条头注：near to 的 to 在地名、人名、节日名之前通常不用（near Christmas，不说 near to Christmas）。nearest to 与 next to 的分工见牛津 Which Word? 框（nearest = 一群中最近，next to = 紧贴）。
      sources:
      - Oxford Learner's Dictionaries，near 介词词条（义项 1–5、词条头注及 Which Word? next / nearest 专框）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: There is a bookshop near our school.
      note: 书店离学校不远
      law: ''
      claim: ''
    uncollected:
    - 熟语 close/near at hand（就在手边）、near to somebody's heart（对某人很重要）——未收
    - 动词义「靠近、临近」（The day is nearing）——非介词，未收
  of:
    word: of
    meaning: ……的（所属关系）
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: of
    core:
      headline: of 是「的」的小钩子：把后面的东西挂到前一个东西身上——谁的、哪一部分、什么做的，都靠它挂。
