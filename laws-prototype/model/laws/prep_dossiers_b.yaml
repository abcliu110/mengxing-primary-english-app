      type: past/passed 同音混写
      note: 同音分工见成人层（牛津同音词框）；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: past 是 passed 的变体（牛津词源行），核心图式是「通过并越过」：人越过参照物 → 钟点越过整点 → 数值越过界限，三级扩展同一图式。它与 passed（pass 的过去分词）同音，拼写靠词性分工（牛津词条同音词框）。名词「过去」与形容词「过去的」不在本介词卷宗。
      sources:
      - Oxford Learner's Dictionaries，past 介词词条（义项 1–3、词条头注及同音词框）
      - Oxford Learner's Dictionaries，past 词源行（variant of passed）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: A bus went past our school.
      note: 公交车从校门口驶过
      law: ''
      claim: ''
    uncollected:
    - 熟语 past it（太老了、过时了，英式非正式）——未收
    - 名词「过去、往事」与形容词「过去的、刚结束的」不在本介词卷宗范围
  plus:
    word: plus
    meaning: 加；外加
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: plus
    core:
      headline: plus 就是「加上」：把两堆东西合到一起数——它的老家在数学课。
      scene_sentence: Two plus three is five.
      scene_note: 数学课上的加法
    groups:
    - domain: 数量
      label: 数量义 · 加法一家
      nodes:
      - law: ''
        name: 加（算式里）
        headline: 算式里读「加」的就是 plus：二加五等于七——两个数被它合到一起。
        beats:
        - beat: 合到一起
          text: Two plus five is seven：plus 站在中间，把两边的数拉到一堆。
        examples:
        - s: Two plus five is seven.
          note: 牛津词条原例句：二加五等于七
        claim: ''
        source: Oxford Learner's Dictionaries，plus 介词词条义项 1（used when the two numbers or amounts mentioned are being added together）
      - law: ''
        name: 外加、还有
        headline: 不光是算式：价钱里多出来的一笔、人数之外多带的东西，也用 plus 说「外加」。
        beats:
        - beat: 多出来的一份
          text: 玩具 30 块，盒子还要外加 2 块：plus 2 yuan——主价之外，多一份。
        examples:
        - s: The toy is 30 yuan plus 2 yuan for the box.
          note: 外加 2 元盒子钱（牛津义项 2 例句框架：£22, plus £1 for postage）
        claim: ''
        source: Oxford Learner's Dictionaries，plus 介词词条义项 2（as well as something/somebody; and also）
      - law: ''
        name: 零上（温度）
        headline: 报温度的时候，plus 站在数字前面当「零上」的牌子：plus four degrees，就是零上四度。
        beats:
        - beat: 零上的牌子
          text: 注意身份：这一条在词典里登记为形容词用法，不是介词本职——因为天天要报温度，本卷宗破例把它请进来，身份写在成人层里。
        examples:
        - s: The temperature is plus four degrees.
          note: 牛津词条原例句：气温零上四度（形容词词条义项 2）
        claim: ''
        source: Oxford Learner's Dictionaries，plus 形容词词条义项 2（above zero）——非介词义项，破例同卷登记
    opponents:
    - word: minus
      laws: []
      headline: minus 是 plus 的正反面：plus 往上加，minus 往下减；零下温度也归 minus 管（minus five degrees，牛津词条在 plus 两处都标了 opposite minus）。
    quizzes:
    - law: ''
      q: 算式 Two plus five is seven 里的 plus 是什么意思？
      options:
      - 加
      - 减
      - 等于
      answer: 加
      hint: Two plus five is seven：plus 站在中间，把两边的数拉到一堆。
    errors:
    - law: ''
      type: plus/minus 温度与算式混用
      note: 清单未登记逐字病例，不自编；待课堂/语料错例补录后回填。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: plus 的介词身份只覆盖「加」与「外加」两义（牛津介词条共 2 个义项）；「零上」在牛津登记为形容词条义项 2（The temperature is plus four degrees），并非介词义——本卷宗收录它只因温度表达高频且与 minus 对举，教学时应向学生点明：报温度的 plus 是「正的」标签，不是「加上谁」。词源：拉丁语 plus 即 more（更多）。
      sources:
      - Oxford Learner's Dictionaries，plus 介词词条（义项 1–2）与形容词词条（义项 1–4）
      - Oxford Learner's Dictionaries，plus 词源行（from Latin, literally 'more'）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: Two plus three is five.
      note: 数学课上的加法
      law: ''
      claim: ''
    uncollected:
    - plus or minus（上下浮动，如误差 ±3%）——初中阅读可见，未收
    - 「……多」（£10 000 plus，形容词义项 1）与成绩 A plus（形容词义项 4）——非介词，未收
    - plus points（优点，名词/形容词用法）——未收
