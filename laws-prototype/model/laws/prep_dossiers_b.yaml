      - law: ''
        name: 超过（某个点、某个阶段）
        headline: 看不见的线也能越过：花开过了最盛的时候、年纪过了七十——都是「已经过去了那个点」。
        beats:
        - beat: 越过那条线
          text: 花最漂亮的那几天过去了：The flowers are past their best——线在后面，花在前面。
