        beats:
        - beat: 领回家
          text: a friend of mine：朋友多着呢，这一个是「我的」——of 把他领回我家。
        examples:
        - s: She is a friend of mine.
          note: 她是我的一个朋友（牛津义项 1 原短语：a friend of mine）
        claim: ''
        source: Oxford Learner's Dictionaries，of 介词词条义项 1（belonging to somebody; relating to somebody）
      - law: ''
        name: 整体里的一部分
        headline: 一支队伍里的一个队员、一群朋友里的几个：of 负责从大整体里切出一块来。
        beats:
        - beat: 切一块
          text: some of us 是「我们当中的一些」：先有我们这一大群，of 切出你要的那一块。
        examples:
        - s: Tom is a member of our football team.
          note: 他是我们足球队的一员（牛津义项 2 例句：a member of the team）
        claim: ''
        source: Oxford Learner's Dictionaries，of 介词词条义项 2（being part of something）及义项 7（some of his friends）
    - domain: 构成
      label: 构成义 · 什么做的、装多少
      nodes:
      - law: ''
        name: 什么做的、由什么组成
        headline: 桌子是什么做的？木头。人群由什么组成？人。问「材料」，还是 of 出来挂。
        beats:
        - beat: 看材料
          text: The table is made of wood：把桌子拆开看，里面全是木头——made of 是课本里的老搭档。
        examples:
        - s: The table is made of wood.
          note: 桌子是木头做的（本项目 C-02 已登记此句；牛津义项 5：consists of）
        claim: ''
        source: Oxford Learner's Dictionaries，of 介词词条义项 5（used to say what something consists of）；本项目 small_systems C-02 例句登记
      - law: ''
        name: 数量：一杯、一瓶、两公斤
        headline: 数不清的东西借杯子、瓶子、公斤来数：中间的 of 把「量器」和「东西」挂在一起。
        beats:
        - beat: 借量器
          text: 水不能一个一个数，就借一杯：a glass of water——复数加在量器上（two glasses of water）。
        examples:
        - s: He drank a glass of milk.
          note: 他喝了一杯牛奶（牛津义项 5 例句：a glass of milk；本项目 C-01/C-05 同型登记）
        claim: ''
        source: Oxford Learner's Dictionaries，of 介词词条义项 5（含 a glass of milk）及义项 6（measurements：2 kilos of potatoes）
    - domain: 内容
      label: 内容义 · 讲什么的
      nodes:
      - law: ''
        name: 关于、讲……的
        headline: 一张照片照的是谁、一张地图画的是哪儿：of 把「内容」挂在照片、地图、故事身上。
        beats:
        - beat: 装内容
          text: 照片这张纸是空的，of 把「我的一家」装进去：a photo of my family。
        examples:
        - s: This is a photo of my family.
          note: 这是我家的照片（牛津义项 4 例句为 a photo of my dog / a map of India，本句同构）
        claim: ''
        source: Oxford Learner's Dictionaries，of 介词词条义项 4（relating to or showing somebody/something）
    opponents:
    - word: by
      laws: []
      headline: by 是作品的「作者牌」：说某一幅莫奈的画用 by（a painting by Monet）；说莫奈的全部画作用 of（the paintings of Monet）——牛津 of 词条用法注的裁定。
    quizzes:
    - law: ''
      q: 「教室的门」里表示「的」的钩子是哪个词？
      options:
      - of
      - with
      - since
      answer: of
      hint: of 是「的」的小钩子：把后面的东西挂到前一个东西身上。
    errors:
    - law: ''
      type: of 与 's 所有格混用、数量结构复数落点（two glass of water 类）
      note: 数量结构口径见本项目 C-05 登记；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: of 是英语最忙的功能词之一：牛津词条共 13 个义项，本卷宗按小学+初中高频只收五点（所属/部分/材料/数量/关于），其余登记于未收义项待后续波次。读音上 of 的常态是弱读 /əv/，重读 /ɒv/ 只在强调等场合（牛津词条音标行：/əv/, strong form /ɒv/）。
      sources:
      - Oxford Learner's Dictionaries，of 介词词条（义项 1–13 及音标行）
      - 本项目 small_systems C-01/C-02/C-05/C-18 例句登记（a glass of water、made of wood 等）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: The door of our classroom is blue.
      note: 门是教室的一部分——of 的挂钩
      law: ''
      claim: ''
    uncollected:
    - 年龄与日期（a girl of 12、the fourth of July，牛津义项 6 的一部分）——未收，后续波次可议
    - 方位（north of，义项 8）与出身（the people of Wales，义项 3）——未收
    - 动词性名词之后（the arrival of the police，义项 9）、动词 + of（think of，义项 10）——语法结构义，未收
    - 形容词 + of 固定搭配（proud of / afraid of / full of，义项 11）——高频，建议后续单列，本轮未收
    - 评价行为（It was kind of you，义项 12）与名词修饰（that idiot of a boy，义项 13）——未收
  outside:
    word: outside
    meaning: 在……外面
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: outside
    core:
      headline: outside 就是「在外面」：出了门、出了圈——边界外头那一片，都是 outside。
      scene_sentence: The dog is outside the house.
      scene_note: 狗在房子外面
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: ''
        name: 在……的外面
        headline: 挨着外皮的那一面：车停在房子外面、人站在教室外面，都还没有进去。
        beats:
        - beat: 外皮一侧
          text: 房子有里外两面：贴着外墙的那一侧，就是 outside。
        examples:
        - s: You can park your car outside our house.
          note: 牛津词条原例句：车停在我家外面
        claim: ''
        source: Oxford Learner's Dictionaries，outside 介词词条义项 1（on or to a place on the outside of something）
      - law: ''
        name: 在……以外（出了地界）
        headline: 把边界放大到一座城：住在城外、城里最大的公园在国外——出了这个地界，就是 outside。
        beats:
        - beat: 地界之外
          text: 村子在城外：还在附近，但已经不归这座城的圈子了。
        examples:
        - s: We live in a small village just outside the city.
          note: 住在城外的小村子（牛津义项 2 例句为 just outside Leeds，本句同构）
        claim: ''
        source: Oxford Learner's Dictionaries，outside 介词词条义项 2（away from or not in a particular place）
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 不在……范围里
        headline: 看不见的圈子也一样：上课时间之外、工作范围之外——不在这个圈子里，就是 outside。
        beats:
        - beat: 圈外
          text: 下课铃一响，就出了「上课时间」的圈子：outside class time，想怎么玩都行。
        examples:
        - s: Outside working hours, Dad plays football with me.
          note: 工作时间之外（牛津义项 3 例句框架：outside working hours）
        claim: ''
        source: Oxford Learner's Dictionaries，outside 介词词条义项 3（not part of something）
    opponents:
    - word: inside
