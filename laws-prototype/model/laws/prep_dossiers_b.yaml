        source: Oxford Learner's Dictionaries，since 介词词条义项 1（from a time in the past until now，与现在完成时连用）
      - law: ''
        name: 自从……（连词，带一句话）
        headline: 起点也可以是一整件事：自从我们认识、自从她去了北京——since 后面跟上一句话，起点就变成一件事。
        beats:
        - beat: 一件事当起点
          text: We have been friends since we met in Grade One：认识那天，就是友谊的起点。
        examples:
        - s: We have been friends since we met in Grade One.
          note: 自从一年级认识起就是朋友（牛津连词义项 1 例句框架：since she went to Berlin）
        claim: ''
        source: Oxford Learner's Dictionaries，since 连词词条义项 1（from an event in the past until now）
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 因为（连词）
        headline: since 还有一份差事：当「因为」讲——既然下雨了，那就待在家里吧。
        beats:
        - beat: 既然……就
          text: 说「因为」的时候 since 只以连词身份出现，后面跟一整句话；它比 because 轻一点，像「既然如此」。
        examples:
        - s: Since it is raining, let's stay at home.
          note: 既然下雨了，就待在家里（牛津连词义项 2：because; as）
        claim: ''
        source: Oxford Learner's Dictionaries，since 连词词条义项 2（because; as）
    opponents:
    - word: for
      laws:
      - P-10
      - P-14
      headline: for 是它的分工搭档：since 管起点（since Monday），for 管时长（for three days）——牛津 since 词条专门警告：说一段时间要用 for，不能用 since（✗ since five years）。
    quizzes:
    - law: ''
      q: since 后面应该跟什么？
      options:
      - 时间起点（since Monday）
      - 一段时间（three days）
      - 一个地方（the park）
      answer: 时间起点（since Monday）
      hint: since 的固定搭档是完成时：have lived since 2020——起点钉在过去，线一直拉到现在。
    errors:
    - law: ''
      type: since/for 混用（since + 时段）
      note: 牛津词条已给出 ✗ 例（since five years）；中文逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: since 有两个身份（介词/连词）与两种意义（时间起点/原因），需分开教：原因义只以连词出现；时间义的恒定伙伴是完成时。ever since 是其强调版（牛津连词例句：ever since the letter arrived）。
      sources:
      - Oxford Learner's Dictionaries，since 介词词条（义项 1 及 for/since 用法注）
      - Oxford Learner's Dictionaries，since 连词词条（义项 1–2）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: We have lived here since 2020.
      note: 从 2020 年一直住到现在（牛津例句框架：since 2006）
      law: ''
      claim: ''
    uncollected:
    - since when? 的反问语气（表示恼怒，牛津介词词条义项 2）——语用义，未收
  through:
    word: through
    meaning: 穿过；通过
    family: true
    nlaws: 2
    laws:
    - PB-04
    - PB-10
    proto: PB-04
    scene: ''
    pos: through
    core:
      headline: through 就是「从里面穿过去」：从这一头进、那一头出，中间那一段在里面。
      scene_sentence: The train goes through the mountain.
      scene_note: 火车穿山（隧道）——through 的介质通过（PB-04 登记）
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: PB-04
        name: 穿过（介质内部）
        headline: 穿过山洞、穿过森林、穿过人群：钻进一个东西的内部，再从另一头出来——through 的老家。
        beats:
        - beat: 钻进介质
          text: 穿过山洞：先钻进黑黑的里面，再从另一头出来——中间那一段在里面，就是 through。
        examples:
        - s: The bird flew through the forest.
          note: 穿过森林——介质为林木群（PB-04 登记例句）
        claim: ''
        source: Oxford Learner's Dictionaries，through 介词词条义项 1（from one end or side of something to the other）；本项目 PB-04（Lindstromberg 2010 路径簇口径）
      - law: ''
        name: 隔着（看、听）
        headline: 声音和目光也会「穿」：隔着墙听见音乐、隔着雾看见人影——穿过来的不是身体，是声音和视线。
        beats:
        - beat: 声音穿墙
          text: 墙把两个房间隔开，声音却钻得过去：hear the music through the wall。
        examples:
        - s: We heard the music through the wall.
          note: 隔着墙听见音乐（牛津义项 2 例句为 hear their conversation through the wall）
        claim: ''
        source: Oxford Learner's Dictionaries，through 介词词条义项 2（see, hear, etc. through something）
    - domain: 时间
      label: 时间义 · 讲时间
      nodes:
      - law: PB-04
        name: 从头到尾、整段（时间）
        headline: 时间也是一种「介质」：一整夜、一场音乐会，从头穿到尾，就是 through。
        beats:
        - beat: 穿过一整夜
          text: 宝宝睡了整整一夜没醒：slept through the night——像穿过一条长长的隧道。
        examples:
        - s: The baby slept through the night.
          note: 宝宝睡了整夜（牛津义项 3 例句框架：through the night）
        claim: ''
        source: Oxford Learner's Dictionaries，through 介词词条义项 3（from the beginning to the end of a period of time）；PB-04 成人层（through the night 为同一图式的时间版）
    - domain: 抽象
      label: 抽象义 · 看不见的意思
      nodes:
      - law: ''
        name: 通过（关卡、考试）
        headline: 考试、大门、难关，都是要「穿过去」的关卡：穿过去了，就叫 get through。
        beats:
        - beat: 闯关
          text: 先过大门这一关，再过考试这一关：关卡排成一串，一个一个穿。
        examples:
        - s: First I have to get through the exams.
          note: 牛津词条原例句：先得通过考试这一关
        claim: ''
        source: Oxford Learner's Dictionaries，through 介词词条义项 4（past a barrier, stage or test）
      - law: ''
        name: 靠……、通过……（办法）
        headline: 办法也是一条通道：靠努力、靠读书——你从这条通道里穿过去，就到达了目标。
        beats:
        - beat: 办法是通道
          text: 想成功没有近路：You can only get there through hard work——努力就是那条隧道。
        examples:
        - s: You can get better through hard work.
          note: 靠努力就能进步（牛津义项 6 例句为 achieve success through hard work，本句同构）
        claim: ''
        source: Oxford Learner's Dictionaries，through 介词词条义项 6（by means of; because of）
    opponents:
    - word: across
      laws:
      - P-19
      headline: across 是越过一个面（过马路、游过河面）；through 是钻进介质里面穿过去（穿过森林、穿过人群）——一个在面上，一个在里面（PB-04 分工）。
    - word: over
      laws:
      - P-01
      - P-02
      - P-06
      - P-13
      headline: over 是从上方越过去：球飞过森林的上空用 over，在树中间穿过去用 through——高低两条路。
    quizzes:
    - law: PB-04
      q: through 和 across 过森林时，最大的不同是？
      options:
      - through 从里面穿过去，across 越过一个面
      - through 更快
      - 没有不同
      answer: through 从里面穿过去，across 越过一个面
      hint: 穿过山洞：先钻进黑黑的里面，再从另一头出来——中间那一段在里面，就是 through。
    errors:
    - law: PB-04
      type: through/across/over 路径图式混用
      note: 分工见 PB-04 claim；逐字病例待语料补录，不自编。
      status: 待补
    adult:
    - law: PB-04
      teacher: false
      boundary: through 的图式 = 路径 + 介质内通过（Lindstromberg 2010 第 2 章路径簇；项目 PB-04）：路径两端在介质之外、中段在介质之内；时间义与「通过考试」都是把事件看成介质的同图式扩展。美式 through = until and including（Tuesday through Friday）是英美差异，英式教学不收（牛津义项 5 注明 North American English）。
      sources:
      - Oxford Learner's Dictionaries，through 介词词条（义项 1–6）
      - Lindstromberg (2010) 路径簇（经项目 small_systems PB-04 登记，接触等级：目录 + 书评 + 作者自述级）
      grade: 学习词典定版级 + 专著路径簇口径
      beats: []
    stage:
      sent: The train goes through the mountain.
      note: 火车穿山（隧道）——through 的介质通过（PB-04 登记）
      law: PB-04
      claim: ''
    uncollected:
    - 美式时间义 until and including（Tuesday through Friday，牛津义项 5）——英美差异，未收
    - 短语动词中的 through（get through 打通电话等）——短语动词另条，未收
  until:
    word: until
    meaning: 直到……为止
    family: true
    nlaws: 0
    laws: []
    proto: ''
    scene: ''
    pos: until
    core:
      headline: until 就是「一直到……为止」：一件事不停地做，做到那个点才停。
      scene_sentence: We waited until five o'clock.
      scene_note: 一直等到五点
    groups:
    - domain: 空间
      label: 空间义 · 讲地方
      nodes:
      - law: ''
        name: （地方）一直到……为止
        headline: 坐车也一样：坐到伦敦才下车——路也有它的「为止」站。
        beats:
        - beat: 坐到站
          text: You can stay on the bus until London：伦敦就是这趟车的 until。
        examples:
        - s: You can stay on the bus until London.
          note: 牛津词条原例句：可以一直坐到伦敦
        claim: ''
        source: Oxford Learner's Dictionaries，until 词条义项 1 例句（stay on the bus until London）
    - domain: 时间
      label: 时间义 · 讲时间
      nodes:
      - law: ''
        name: 一直到……（时刻、事件）
        headline: 等到雨停、等到五点：事情一直继续，直到那个时刻或那件事发生，才收尾。
        beats:
        - beat: 做到那个点
          text: 雨不停，我们就不走：wait until the rain stops——雨停就是信号。
        examples:
        - s: Let's wait until the rain stops.
          note: 牛津词条原例句：等到雨停
        claim: ''
        source: Oxford Learner's Dictionaries，until 词条（连词/介词合条）义项 1（up to the point in time or the event mentioned）
      - law: ''
        name: 直到……才
        headline: until 还能管「才」：作业没写完，就不能出去玩——等到条件到了，前面的事才被放行。
        beats:
        - beat: 才放行
          text: not...until 是老搭档：You're not going out until you've finished——没做完，别想出门。
        examples:
        - s: I won't go to bed until I finish my homework.
          note: 写完作业我才睡（牛津义项 1 例句框架：not going out until you've finished）
        claim: ''
        source: Oxford Learner's Dictionaries，until 词条义项 1 例句（You're not going out until you've finished this）
    opponents:
    - word: since
      laws: []
      headline: since 钉起点、until 钉终点：since Monday 是从周一开始算，until Monday 是到周一为止——时间轴的两头，一人管一头。
    quizzes:
    - law: ''
      q: 「我们一直等到雨停」用哪个词？
      options:
      - until
      - since
      - plus
      answer: until
      hint: 雨不停，我们就不走：wait until the rain stops——雨停就是信号。
    errors:
    - law: ''
      type: not...until 句式误序（把 until 提前否定类）
      note: 清单未登记逐字病例，不自编；待课堂/语料错例补录后回填。
      status: 待补
    adult:
    - law: ''
      teacher: false
      boundary: until 与 till 同义，但 till 不是 until 的缩写：牛津词源行显示 until = 古诺斯语 und（as far as）+ till，意思本就是叠加的。till 偏口语且不能放句首，正式写作与句首用 until（牛津词条头注：also informal till）。not...until 是否定句式的一支，教学时单列。
      sources:
      - Oxford Learner's Dictionaries，until 词条（义项 1、词条头注及词源行）
      grade: 学习词典定版级
      beats: []
    stage:
      sent: We waited until five o'clock.
      note: 一直等到五点
      law: ''
      claim: ''
    uncollected:
    - 词条本身只有「up to the point」一个义项群，本卷宗已全收；until 的连词用法与介词用法在牛津为同条同义，未分立登记
  upon:
