      nodes:
      - law: ''
        name: 过了……点
        headline: 报时间的时候，分针走过整点，就是 past 在上班：两点半，英语说「过了两点一半」。
        beats:
        - beat: 分针过点
          text: half past two = 两点半；ten past six = 六点十分——先说过了几分，再说过的是哪一点。
        examples:
        - s: It's half past two.
          note: 牛津词条原例句：现在两点半
