        name: = on 的正式版
        headline: 坐在宝座上、把王冠戴在头上：写故事、写正式文章的人，爱把 on 换成 upon，显得郑重。
        beats:
        - beat: 换件衣服
          text: The cat sat upon the wall 和 on the wall 意思全同——upon 只是穿上了西装。
        examples:
        - s: The cat sat upon the wall.
          note: 猫坐在墙上——upon = on 的正式说法（牛津义项 1：= on, formal）
        claim: ''
        source: Oxford Learner's Dictionaries，upon 介词词条义项 1（especially British English, formal = on）
      - law: ''
        name: 故事开头：once upon a time
        headline: 每个英语故事几乎都从这四个词开始：Once upon a time——很久很久以前。这是 upon 最出名的一份差事。
        beats:
        - beat: 故事的门
          text: 听见 Once upon a time，就知道：故事要开始了，公主和王子要出场了。
        examples:
        - s: Once upon a time, there was a beautiful princess.
          note: 牛津词条原例句：很久很久以前，有一位美丽的公主
        claim: ''
        source: Oxford Learner's Dictionaries，upon 词条习语 once upon a time
      - law: ''
        name: 一……又一……（叠加）
        headline: upon 还能把东西叠起来数：一里又一里、一排又一排——多得数不清，就让 upon 一层一层摞。
        beats:
        - beat: 摞起来
          text: mile upon mile：一里摞着一里，路长得望不到头。
        examples:
        - s: We saw mile upon mile of dusty road.
          note: 一里又一里的土路（牛津义项 2 例句：mile upon mile of dusty road）
        claim: ''
        source: Oxford Learner's Dictionaries，upon 介词词条义项 2（…upon… used to emphasize a large number or amount）
    opponents:
    - word: 'on'
      laws:
      - P-01
      - P-04
      - P-08
      - P-09
      - P-11
      - P-12
      - P-17
      headline: on 是日常版，upon 是正式版：平时说话写作用 on，故事书和正式文章里才换上 upon——意思从不因此改变。
    quizzes:
