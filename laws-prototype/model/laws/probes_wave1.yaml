probes:
- id: PRB-TA01-1
  for_law: TA-01
  source_ref: 波次一 · TA-01
  title: 十二个格子逐个背：先报格名，不会先想两个开关
  predicted_misreading: 孩子把时态学成背一张十二格大表——见到句子先想「这是第几格」，格名报不出就卡住，不会先问「这件事在什么时候、我要怎么看它」。
  cognitive_source: 顺序倒置（先背形式表、后想意义，条目机制明示此顺序反过来表背得再熟也会选错）
  misreading_type: 字面化
  task: 给句子 We were playing football in the afternoon. 不许查表，只问两件事：①这件事在什么时候——现在还是过去？②说话的人是看整件、钻进中间、还是看痕迹？两问答完，再让他说这是哪个时态。
  rubric:
    hit: 只会背格名，两问答不出（或答「不知道，看表才知道」）
    partial: 时间答对、看法答错（两个开关只立住一个）
    pass: 两问全对，并能说出「先定两个开关，样子自己就出来了」
  remedy: 回第 2 步机制屏「两个开关」卡：时间开关（现在/过去）× 看法开关（全景/进行/完成）现场拨给同一个踢球场景看，再回第 4 步用条目四例逐句报开关位置复测。
  source_of_prediction: TA-01 claim（两维组合）+ mechanism[两个开关][组合不是背诵] + examples 四句的 scene_note 开关标注
  status: 已入模
  version: '1'
- id: PRB-TA02-1
  for_law: TA-02
  source_ref: 波次一 · TA-02
  title: will 是动词变出来的「将来时衣裳」
  predicted_misreading: 孩子认为动词有三件衣裳：现在、过去、将来——will 就是动词的「将来样子」，和 plays、played 是一类东西。
  cognitive_source: 体系误植（按汉语/旧教材的「三时」框架给 will 安位，没认出它是要外借的帮手）
  misreading_type: 主场·原型误植
  task: 判断题：「will 是动词变出来的将来时样子，就像 played 是过去的样子。对吗？」接指认：We will visit Grandma tomorrow. 里动词自己的衣裳是哪一件——visit 是现在样、过去样，还是「将来样」？
  rubric:
    hit: 答「对」，或把 visit 说成「将来样」
    partial: 答「不对」但说不出 will 是什么（只知道结论）
    pass: 答「不对」且能说出「动词只有现在、过去两件衣裳，will 是请来帮忙的小帮手」
  remedy: 回第 2 步机制屏「两件衣裳」卡：衣架上只有现在/过去两件，will、going to 挂在「借来的工具」一排，再回第 4 步用 We play / We played / We will visit 三句逐句指认衣裳复测。
  source_of_prediction: TA-02 claim（形态对立只有 present/preterite，will 属情态）+ mechanism[两件衣裳] + claim.scope
  status: 已入模
  version: '1'
- id: PRB-TA03-1
  for_law: TA-03
  source_ref: 波次一 · TA-03
  title: 镜头推近了，就以为整件事已经做完
  predicted_misreading: 孩子把「钻进去看中间」和「看整件」混为一谈——They were building a house. 被解成「房子已经盖好了」，进行中的画面被读成完成的结果。
  cognitive_source: 观看方式未分（体的选择被当成纯粹的形式变化，没意识到换看法就换了断言内容）
  misreading_type: 过度泛化
  task: 句意判断：They were building a house. 问「说这句话的时候，房子盖好了吗？」备选：盖好了 / 还没盖好，只看见正在盖的中间一段。再接 He was running when I saw him. 问「我看见他时，他跑完了吗？」
  rubric:
    hit: 任一题答「已经完成」
    partial: 对一错一（全景/特写的分工只在一句上立住）
    pass: 两题全对且能说出「这是把镜头推近了看中间，没说整件事的结局」
  remedy: 回第 2 步机制屏「全景与特写」卡：同一件盖房子的事，远看整件 vs 推近看中间同框对照，再回第 4 步用 built / were building 对子复测。
  source_of_prediction: TA-03 claim（完成体看整体、未完成体看内部结构）+ mechanism[全景与特写] + examples 前两句同框对
  status: 已入模
  version: '1'
- id: PRB-TA04-1
  for_law: TA-04
  source_ref: 波次一 · TA-04
  title: 正在吃饭也说 I eat：一般现在时包打天下
  predicted_misreading: 孩子把一般现在时当「现在专用时态」——指着正在吃的饭说 I eat rice now.（配上 now 就以为能装下正在发生的事）。
  cognitive_source: 标签误植（「现在时」三字被按字面理解为「说现在的事」，没意识到它要求整件事与说话一刻完全重合）
  misreading_type: 字面化
  task: 看图选句：图里小朋友正端着碗吃饭。说「他正在吃饭」用哪句——A. He eats rice now. B. He is eating rice now. 再接一题：说「他天天七点起床」用哪句——A. He is getting up at seven every day. B. He gets up at seven every day.
  rubric:
    hit: 任一题选错（第一题选 A 或第二题选 A）
    partial: 第一题对、第二题错（知道正在发生要钻镜头，但把进行时又推满到习惯上）
    pass: 两题全对且能说出「一眨眼的现在装不下一整件事；一般现在时管的是习惯和老道理」
  remedy: 回第 2 步机制屏两卡连看：「一眨眼的现在」（整件事塞不进一眨眼）与「一般现在时的正职」（习惯与老道理），再回第 4 步用条目四例（am eating / get up at seven / sun rises / are playing）逐句归位复测。
  source_of_prediction: TA-04 claim（full coincidence 要求）+ mechanism[一眨眼的现在][一般现在时的正职] + examples 四句
  status: 已入模
  version: '1'
- id: PRB-TA05-1
  for_law: TA-05
  source_ref: 波次一 · TA-05
  title: 完成时就是「做完了」：只管过去，不管现在的印子
  predicted_misreading: 孩子把完成时读成「以前做完的一件事」——I have lost my key. 只被当成在讲过去丢钥匙，对「所以现在进不了门」这层牵连毫无感觉；反过来，没「做完」的事（住了三年还在住）不敢用完成时。
  cognitive_source: 定义误植（被「完成」二字带偏：把 perfect 的语义锚在「完结」而非「现时相关」）
  misreading_type: 字面化
  task: 句意判断：I have lost my key. 问「他现在能打开家门吗？为什么这句要用 have lost，不用 lost？」再接：We have lived here for three years. 问「他们现在还住这儿吗？」
  rubric:
    hit: 第一题答「能」或答不出与现在的牵连；第二题答「不住」
    partial: 第一题对、第二题错（结果用法立住、持续用法被「完成=做完」挡住）
    pass: 两题全对且能说出「完成时看的是现在还留着的印子」
  remedy: 回第 2 步机制屏「看痕迹不看完没完」卡：钥匙（印子=进不了门）、去过北京（印子=经验）、住了三年（印子一直连到现在）三例同框，再回第 5 步做「找印子」复测。
  source_of_prediction: TA-05 claim（continuing present relevance，四用法统一于与现在相连）+ mechanism[看痕迹不看完没完] + claim.scope（经历用法的痕迹是经验本身）
  status: 已入模
  version: '1'
- id: PRB-TA06-1
  for_law: TA-06
  source_ref: 波次一 · TA-06
  title: '*I have seen him yesterday：完成时也点名昨天'
  predicted_misreading: 孩子把完成时和过去时看成可互换的「过去说法」，点名昨天时随手抓一个——I have seen him yesterday. 两套定位在一句话里打架却不自知。
  cognitive_source: 母语迁移叠加定位盲（「了」的直译冲动 + 没意识到完成时的参照点钉在现在、明确过去时间状语要把事件锚回过去）
  misreading_type: 母语迁移
  task: 改错题：I have seen him yesterday. 这句话哪里别扭、怎么改？再接判断：I have seen him.（不带 yesterday）对吗？
  rubric:
    hit: 看不出错，或改成 I have saw him yesterday. 一类（只动词形、不动时间状语）
    partial: 改对（去掉 have 或去掉 yesterday 任一方向）但说不出为什么
    pass: 改成 I saw him yesterday. 且能说出「完成时盯着现在，yesterday 把话掰回过去，两个命令相反」
  remedy: 回第 2 步机制屏「两套定位打架」卡，再回第 4 步把条目三例（saw him yesterday / have seen him / lived here since 2021）按「点没点名过去时间」分堆复测。
  source_of_prediction: TA-06 claim（参照点冲突）+ mechanism[两套定位打架] + error_cases 登记错型 *I have seen him yesterday（教学文献登记错型）
  error_form_display:
  - I have seen him yesterday
  status: 已入模
  version: '1'
- id: PRB-TA07-1
  for_law: TA-07
  source_ref: 波次一 · TA-07
  title: '*I am knowing：牌子也套进行时的镜头'
  predicted_misreading: 孩子把进行时当成无条件的形式——动词不管什么形状都往 -ing 上套，know 这种没有过程的状态也说成 I am knowing the answer.
  cognitive_source: 形式先行（先选「现在→进行时」的公式，不看动词短语自带的时间形状）
  misreading_type: 过度泛化
  task: 选句：说「我知道答案」——A. I am knowing the answer. B. I know the answer. 再接分类：She painted a picture. 里的 paint a picture 是「轮子、一段路、牌子、啪的一下」哪种形状？
  rubric:
    hit: 第一题选 A
    partial: 第一题对、第二题形状认错（选对靠语感，形状系统未立）
    pass: 两题全对且能说出「know 是静止的牌子，没有中间一段可看，镜头套不上」
  remedy: 回第 2 步机制屏「四种形状」卡（牌子/轮子/一段路/啪的一下），再回第 4 步用条目四例（know / run / painted a picture / found）逐个认形状复测。
  source_of_prediction: TA-07 claim（Vendler 四型与进行体兼容性）+ mechanism[四种形状][按短语判断] + error_cases 登记错型 *I am knowing（教学文献登记错型）
  error_form_display:
  - I am knowing the answer
  status: 已入模
  version: '1'
- id: PRB-TA08-1
  for_law: TA-08
  source_ref: 波次一 · TA-08
  title: 过去式只管过去：were 在 If I were you 里一定是说从前
  predicted_misreading: 孩子把过去形式锁死在时间义上——If I were you 里的 were 被解成「如果我是从前的你」，I wondered if you could help me. 被解成「我以前纳闷过」，推远的客气与假设全读不出来。
  cognitive_source: 单义锁定（形式—意义一对一的默认假设，没意识到「推远」是一个动作在三个维度的投影）
  misreading_type: 主场·原型误植
  task: 句意判断：If I were you, I would say sorry. 问「说话的人是在讲从前的事吗？」备选：是，在讲以前 / 不是，这是「假如我是你」的假设。再接：I wondered if you could help me. 问「这句听起来是硬邦邦地命令，还是客客气气地请人帮忙？」
  rubric:
    hit: 任一题按时间/命令直读
    partial: 对一错一（假设的推远认出、礼貌的推远未认，或反之）
    pass: 两题全对且能说出「过去形式还能把话往远处推：推到假如里、推到客气里」
  remedy: 回第 2 步机制屏「推远这一个动作」卡：时间远、心里远、关系远三格同框，再回第 4 步用条目两例逐句定位「推到了哪一维」复测。
  source_of_prediction: TA-08 claim（过去形式通义为「距离」）+ mechanism[推远这一个动作] + examples 两句儿童版登记句型
  status: 已入模
  version: '1'
- id: PRB-TA09-1
  for_law: TA-09
  source_ref: 波次一 · TA-09
  title: 过去完成时是另一种新时态——站在现在看更早的事
  predicted_misreading: 孩子把过去完成时当成一张要另背的新格子——做 I had finished my homework when Mum came home. 的时间排序时，站在「现在」往回数，说不清「写完作业」和「妈妈回家」谁先谁后，或认为 had finished 离现在最远所以排在昨天之前随便哪儿都行。
  cognitive_source: 参照点未立（不知道完成时的小旗子可以搬家，参照点搬到哪儿、「之前」就相对哪儿算）
  misreading_type: 主场·原型误植
  task: 排顺序：I had finished my homework when Mum came home. 问两个问题：①写完作业和妈妈回家，哪件事在前？②说这句话时，心里的「小旗子」插在现在，还是插在「妈妈回家」那一刻？
  rubric:
    hit: 顺序排反，或说小旗子插在现在
    partial: 顺序对、小旗子答不出（会用顺序、没立住参照点）
    pass: 两问全对且能说出「小旗子搬到了妈妈回家那一刻，再往前看就是过去完成时」
  remedy: 回第 2 步机制屏「小旗子搬家」卡：同一支旗子先插现在（现在完成时）再搬到过去某天（过去完成时）对照演示，再回第 4 步用条目三例逐句问「旗子在哪儿」复测。
  source_of_prediction: TA-09 claim（完成体是相对时态，只要求事件早于参照点）+ mechanism[小旗子搬家] + examples 首例
  status: 已入模
  version: '1'
- id: PRB-TA10-1
  for_law: TA-10
  source_ref: 波次一 · TA-10
  title: will 只是报时间的：听不出「我来！」那口气
  predicted_misreading: 孩子把 will 读成纯粹中性的时间标签——门铃响了有人说 I'll get the door! 他只听出「这事将要发生」，听不出这是当场答应「我来开」；或反过来把每个 will 都解成「想要」。
  cognitive_source: 残影未觉（语法化留下的意愿/承诺立场不在孩子的解读清单里；或把残影误当本义全量）
  misreading_type: 主场·原型误植
  task: 听口气：门铃响了，哥哥喊 I'll get the door! 问「哥哥是在预报一件事，还是在答应'我来开门'？」再接：It will rain tomorrow. 问「这句里'我乐意'的味道还在吗？」
  rubric:
    hit: 第一题答「预报」；或第二题答「还是强烈的想要」
    partial: 对一错一（残影在承诺句认出、在中性句未收，或反之）
    pass: 两题全对且能说出「will 说将来带着预言/答应的味道，天气预报里只剩一点点味道」
  remedy: 回第 2 步机制屏「旧义的残影」卡，再回第 4 步把条目三例（get the door / will rain / will help you）按「我乐意的味道」从浓到淡排序复测。
  source_of_prediction: TA-10 claim（意愿→意图→预测的语法化与 persistence）+ mechanism[旧义的残影] + claim.scope（天气预报式 will 已高度中性化）
  status: 已入模
  version: '1'
- id: PRB-TA11-1
  for_law: TA-11
  source_ref: 波次一 · TA-11
  title: going to 是「正走在去的路上」
  predicted_misreading: 孩子按字面把 going to 读成移动本身——We are going to visit Grandma this weekend. 被解成「我们现在正走在去奶奶家的路上」，计划义丢失；或与 will 完全不分，随手乱换。
  cognitive_source: 字面化（构式的来源义被当成现行义；「已经在路上」的底色——征兆/打算——没被读出来）
  misreading_type: 字面化
  task: 句意判断：We are going to visit Grandma this weekend. 问「说话的时候，我们已经出门在路上了吗？」再接：Look at the clouds! It is going to rain. 问「这句话凭什么说要下雨——说话的人看见了什么？」
  rubric:
    hit: 第一题答「已经在路上」；第二题答不出「乌云这个苗头」
    partial: 对一错一
    pass: 两题全对且能说出「going to 说的是已经有苗头、已经打算好的将来」
  remedy: 回第 2 步机制屏「上路的人」卡：背包上路的画面只取「方向已定、苗头已在」这层底色，再回第 4 步用条目三例（乌云/探望奶奶/看电影）逐句问「苗头在哪儿」复测。
  source_of_prediction: TA-11 claim（移动构式的语法化与「当前已有征兆/计划」底色）+ mechanism[上路的人] + examples 三句
  status: 已入模
  version: '1'
- id: PRB-TA12-1
  for_law: TA-12
  source_ref: 波次一 · TA-12
  title: I have written the letter 里的 have 还是「我有一封信」
  predicted_misreading: 孩子把完成时里的 have 按老本义解——I have written the letter. 被读成「我拥有一封信（外加写过）」，或指着 have 问「信在他手里吗」，把祖先的故事当成今天的定义。
  cognitive_source: 词源误当定义（条目边界明示：来历是历史解释，不能反推现代 have 的意义）
  misreading_type: 字面化
  task: 两句对照：I have the letter written.（老说法）/ I have written the letter.（今天的说法）。问「第二句里的 have，是在说'信在我手里'，还是只是一个帮忙的小词、重心在'我写过了'？」
