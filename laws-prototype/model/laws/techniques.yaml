techniques:
- id: TEC-V01
  name: 认词先认「劳模词」
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 读不快
  when: 记不住、读不快。中国学生按课本单元顺序平均用力学词，背了很多低频词，读课文时却总卡在最常见的词上。
  steps:
  - 拿到一批生词，先挑出日常最常见的那批先学；
  - 读文章时先保证高频词全认识，再处理生词；
  - 复习时按「常见程度」排队，不按字母顺序排队。
  mechanism: 词频是陡峭的幂律分布，先攻高频词等于按「每学一词能解锁多少文本」排序，回报率最高（回链 V-02、CB-11）。
  linked_laws:
  - V-02
  - CB-11
  cross_refs: []
  order_hint: 先行：适用——但词表须按儿童生活语料校准，成人语料的 700 词/2000 词族数字不直接套用，具体清单剂量待定。进阶：适用——最常用的约 2000 个词族覆盖日常文本约八成词次（V-02）；700 个最常用词约占全部文本 70%（CB-11）。
  self_check: 随手翻开一页课文，能立刻认出的词明显占大多数，卡壳的多是低频生词而不是常见词。
  misuse_warning: 覆盖率按「词次」算，不等于理解率（V-02）；频率只解决「先学谁」，不解决每个词学到什么深度（CB-11）；高频词的抽象用法虽更频，未必比具体用法更适合初学者先学（CB-11 分歧：Widdowson 的可教性反诘）。
  evidence_note: 语料统计实证（专著与词表传统定版：West 1953 / Nation 语料重制 / Willis 1990，COBUILD 语料）。
  status: 定版
- id: TEC-V02
  name: 选书先数一页生词
  zone: 词汇解码区
  pain_point:
  - 读不快
  when: 读不快。选了生词太密的书，读几页就崩盘放弃，还以为是自己「阅读能力差」。
  steps:
  - 翻开要读的书任意一页，先数这一页的生词；
  - 大约每 100 个词里生词不超过 2 个，才适合自己独立读；
  - 生词明显太密就换低一级的书；
  - 是自己非常熟悉的话题，可以放宽一点再试。
  mechanism: 猜义要靠周围认识的词作锚点，生词一密锚点断裂，理解是非线性崩塌而非线性变难；认识约 98% 的词才能流畅理解并顺带猜出生词（回链 V-03）。
  linked_laws:
  - V-03
  cross_refs: []
  order_hint: 先行：适用——落地形式是选分级读物，98% 为选书标尺（条目明示起步阶段靠分级读物的覆盖率控制，而非背词量）。进阶：适用——同一标尺自选英文读物。
  self_check: 能一口气顺畅读完一页并说出大意，读的过程里不需要频繁停下查词。
  misuse_warning: 98% 是群体平均的「足够理解」线，不是每个孩子每本书的铁律；背景知识熟悉可部分补偿（V-03 边界及阈值派与补偿派之争）。
  evidence_note: 同行评审实证（Nation 2006 期刊论文 + Laufer 词汇阈值系列实验）。
  status: 定版
- id: TEC-V03
  name: 查一个词，过一遍九格清单
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。只背中文意思，结果会认不会用、会拼不会搭——因为只建了九格里的一格。
  steps:
  - 查词时先问「它怎么读、怎么拼」；
  - 再问「它是什么意思、还有什么意思」；
  - 再问「它常和谁一起出现、在什么场合说」；
  - 哪一格答不上，就专门补哪一格。
  mechanism: 知道一个词是形（音、拼写、构成）、义（概念、联想、多义）、用（语法行为、搭配、场合）三面都建立联结；缺哪一面，就在哪一面出错（回链 V-01）。
  linked_laws:
  - V-01
  cross_refs: []
  order_hint: 先行：适用（裁剪版）——低龄以音形与核心义优先，搭配、语域等维度随年龄后长（V-01 边界），剂量待定。进阶：适用（全九格）。
  self_check: 随便抽一个「学过的」词，能当场说出它的读音、拼写、一个常用搭配和一个例句，才算真会。
  misuse_warning: 九格是清单，不是习得顺序，不要低龄阶段九格平均用力（V-01 边界）。
  evidence_note: 专著定版框架（Nation 2001/2013，学界共识级分析框架）。
  status: 定版
- id: TEC-V04
  name: 记词连伙伴一起记
  zone: 词汇解码区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。句子语法全对，却写出 do a decision 式的「外国腔」，因为只记了词，没记它的伙伴。
  steps:
  - 学生词时，把它最常跟的词一起抄下来（如 make + decision）；
  - 造句时整串用出来，不临时现配；
  - 批改作文时先检查搭配对不对，再检查语法。
  mechanism: 一个词的意义一半写在它的伙伴名单里；搭配由频率与约定决定，不由语义逻辑决定，无法靠推理生成，只能靠遇见与整记（回链 V-07、CB-02）。
  linked_laws:
  - V-07
  - CB-02
  cross_refs: []
  order_hint: 先行：适用（限高频交际搭配，剂量待定）。进阶：适用。
  self_check: 学完一个动词，能不假思索说出它最常见的两三个搭配对象，并用其中一个造出通顺的句子。
  misuse_warning: 并非一切共现都是搭配，须达一定频率与约定强度；统计显著也不等于教学上值得教，还要看学习者需要与母语干扰（V-07、CB-02 边界）。
  evidence_note: 专著定版 + 同行评审学习者实证（Lewis 1993；Bahns 1993, ELT Journal；Sinclair 1991 语料定义）。
  status: 定版
- id: TEC-V05
  name: 说话先抓整块
  zone: 词汇解码区
  pain_point:
  - 说不出
  - 写不长
  when: 说不出、写不长。一个一个词现拼句子，又慢又容易拼错，开口就卡。
  steps:
  - 听读时把整串出现的说法圈出来（如现成句架、固定搭配）；
  - 整串记进本子，不拆成单词记；
  - 说话、写作文时优先整串调用，不够时再逐词拼。
  mechanism: 母语者产出的很大一部分是整块取用的现成组合，整块储存、整块提取省去逐词拼装的加工成本，流利与地道主要来自块的库存量（回链 V-05、V-06、CB-01、CB-05）。
  linked_laws:
  - V-05
  - V-06
  - CB-01
  - CB-05
  cross_refs: []
  order_hint: 先行：适用——只收高频交际块（V-05 边界），剂量待定。进阶：适用——可按语域与交际功能挑块（CB-05 边界）。
  self_check: 说一段话时，能有几处是整串「拿来就用」的说法，而不是全程逐词现拼。
  misuse_warning: 块不能无限背，更不能取消语法概括，否则生成新句子的能力封顶（V-05）；学习者库存里从未被分析过的块可能成为化石化错误的外壳（V-06）；词汇束是语料统计产物，不能把统计表原样变成背诵表（CB-05）。
  evidence_note: 专著定版（Lewis 1993；Wray 2002；Sinclair 1991；Biber & Conrad 1999，语料证据支撑；词汇束的心理整存性有实验分歧，条目已登记）。
  status: 定版
- id: TEC-V06
  name: 查完词，造个自己的句子
  zone: 词汇解码区
  pain_point:
  - 记不住
  when: 记不住。查完词典、抄完词表就以为学完了，过两天全忘——任务里没有「真需要、自己查、做取舍」。
  steps:
  - 带着一个真问题去查词（我要说的这句话里它该怎么用）；
  - 查到后在几个意思、几个例句里比较，选出合自己句子的一个；
  - 用这个词造一个写自己事情的句子；
  - 只抄不造的词，标出来下次补造。
  mechanism: 保持量由加工深度决定——让学生真需要这个词（need）、自己去查（search）、比较取舍怎么用（evaluation）的任务保持量最高，其中把词放进新句子里比较取舍贡献最大（回链 V-09）。
  linked_laws:
  - V-09
  cross_refs:
  - TEC-V09
  order_hint: 先行：适用（第②步的比较取舍可由教师带着做，剂量待定）。进阶：适用（三步独立完成）。
  self_check: 一周后回看，每个重点词下面都有一个自己造的、写自己事情的句子，而不是只有抄来的例句。
  misuse_warning: 重复遇见次数独立起作用，投入量不是唯一变量（V-09）；另有 Folse (2006) 主张提取次数可能比加工深度更关键——最稳妥是把本技巧与 TEC-V09 的多次提取叠加（V-09 分歧栏口径）。
  evidence_note: 同行评审（Laufer & Hulstijn 2001 假说 + 双地实验；Yanagisawa & Webb 2021 元分析）。
  status: 定版
- id: TEC-V07
  name: 先猜来历，再对答案
  zone: 词汇解码区
  pain_point:
  - 记不住
  when: 记不住。习语和形象说法只背中文对应，背了就忘，因为脑子里没有画面。
  steps:
  - 遇到带画面的说法，先自己猜「它为什么这样说、最早可能在什么场景里用」；
  - 再查证它真实的来历；
  - 把来历的画面和这个词一起记下来。
  mechanism: 词源信息诱发对原始场景的心像，与语词编码构成双重编码，提取路径翻倍；先猜再揭晓比被动看注释加工更深（回链 V-08）。
  linked_laws:
  - V-08
  cross_refs: []
  order_hint: 先行：借鉴适用——证据全部来自成人/大学生被试，对儿童属方向性借鉴（V-08 边界），剂量待定。进阶：适用。
  self_check: 过几天只看这个词，能把它的来历画面复述出来，并用这个画面把词义说对。
  misuse_warning: 来历必须是真的——编造的假词源（如方位缩写式拆字）既污染事实又误导机制，绝对禁止；只适用于词源尚可考的词；被动阅读词源注释无显著效果，关键在先主动猜（V-08 边界与分歧）。
  evidence_note: 同行评审实验（Boers 2001；Boers et al. 2004 系列实验，成人被试）。
  status: 定版
- id: TEC-V08
  name: 越眼熟，越要查一查
  zone: 词汇解码区
  pain_point:
  - 错不完
  - 读不快
  when: 错不完、读不快。阅读出事的常不是生词，而是长得像熟词的「假朋友」：跳过查核直接误读，还不自知。
  steps:
  - 读到「很眼熟、但放进句子里讲不通」的词，立刻停下；
  - 查它有没有别的意思、是不是和另一个熟词长得像；
  - 把形近词、多义词的熟义陷阱成对记进错词本。
  mechanism: 形式相似触发自动误认，误认一旦发生，正确的猜义、查典流程根本不会启动，错误无声无息（回链 V-10）。
  linked_laws:
  - V-10
  cross_refs: []
  order_hint: 先行：适用——主攻形近词与多义词「只认熟义」两类（V-10 边界对起步阶段的裁剪）。进阶：适用（欺骗性构词、习语、假朋友、多义词、形近词五类全开）。
  self_check: 阅读时能主动标出至少一处「眼熟但讲不通」的地方，并查证后说清它真正的意思。
  misuse_warning: 五类的相对权重随母语不同而变，汉语背景者的清单要按本地错误裁剪，不照搬其他母语者的比例（V-10 分歧栏）。
  evidence_note: 专著章 + 同行评审实验（Laufer 1997「欺骗性透明」；Laufer 1988 synforms；Laufer 1989 实验）。
  status: 定版
- id: TEC-V09
  name: 合上书，自己考自己
  zone: 词汇解码区
  pain_point:
  - 记不住
  when: 记不住。把单词表看了很多遍，一考就忘——「看熟」不是学会。
  steps:
  - 学完一遍，先合上书；
  - 凭记忆把词义和用法说出来或写出来；
  - 打开书对答案，错的当场纠正并做标记；
  - 只重考标错的词。
  mechanism: 词是「提取」出来的，不是「看」熟的——每次成功提取都重写并加固记忆痕迹，同时暴露「以为会、其实不会」的缺口（回链 V-11）。
  linked_laws:
  - V-11
  cross_refs: []
  order_hint: 先行：适用——提取以游戏化、低惩罚形式出现（V-11 边界）。进阶：适用。
  self_check: 不看书能连续说出/写对这一批词的意思和用法，错词数一次比一次少。
  misuse_warning: 提取必须配反馈纠错——调错了不纠正，错误同样被固化（V-11 边界）。
  evidence_note: 同行评审综述汇总（Elgort & Nation 综述章汇总多项受控实验）。
  status: 定版
- id: TEC-V10
  name: 猜词先侦察，再下手
  zone: 词汇解码区
  pain_point:
  - 读不快
  when: 读不快。读到生词不是乱猜就是立刻查词典，阅读节奏全断；或者乱猜猜错还不自知。
  steps:
  - 先看生词周围的词是不是大多认识（锚点够不够）；
  - 锚点够，就用上下文线索猜一个意思；
  - 查词典验猜，猜对了把线索记下来；
  - 锚点不够（这一页生词太密），先换书或先解决关键生词，不硬猜。
  mechanism: 猜义是用已知词与背景知识对生词作约束求解；约束不足或被形近误认误导时，解必错且学习者不自知（回链 V-12，与 V-03 互为表里）。
  linked_laws:
  - V-12
  - V-03
  cross_refs:
  - TEC-V08
  order_hint: 先行：适用——限定在高覆盖的分级文本内练（V-12 边界）。进阶：适用。
  self_check: 猜完能说出「我是凭哪条线索猜的」，并经词典验证；验猜记录里猜对率在上升。
  misuse_warning: 属「欺骗性透明」的词（见 TEC-V08）猜义会系统性失败，不能拿猜词代替词汇量本身（V-12）。
  evidence_note: 同行评审奠基实验（Bensoussan & Laufer 1984；Laufer 1997 失败边界）。
  status: 定版
- id: TEC-V11
  name: 学词先搭戏台
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 说不出
  when: 记不住、说不出。buy、sell、pay、cost 逐个孤立背，考试里换个角度就不会用。
  steps:
  - 学一组同场景的词，先想清楚这幕戏里有谁、发生了什么（如买卖戏：买家、卖家、货物、钱）；
  - 把每个词标到它在戏里的位置上；
  - 换机位造句：对准买家说一句、对准卖家说一句、对准钱说一句。
  mechanism: 词义相对于框架定义，一个词激活整幕场景及其全部角色，组内任一词被激活都会预热整组，记忆负担小于逐词孤立背诵（回链 V-13、V-14）。
  linked_laws:
  - V-13
  - V-14
  cross_refs: []
  order_hint: 先行：适用（生活场景戏，如买卖、看病、邮寄，剂量待定）。进阶：适用。
  self_check: 随便给同场景里的一个词，能说出这幕戏里还有哪些角色词，并换机位造出句子。
  misuse_warning: 分组维度是「同一场景不同角色」，不是拼写或发音相近——把形近词扎堆教反而互相干扰（V-14 边界）；不是每组词都有干净的戏，编不出的明说「约定俗成」，不硬编（V-13 边界）；同义近义词同教可能交叉干扰，取场景角色分组避之（V-14 分歧）。
  evidence_note: 学术专著与大型语言工程定版（Fillmore 1977 框架语义；FrameNet 语料标注互证）。
  status: 定版
- id: TEC-V12
  name: 先认树干，再认树枝
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。多义词的义项当成互不相干的词逐条背，越背越多；或者只认一个熟义，换个意思就读错。
  steps:
  - 先学会这个词最主要的意思（树干）；
  - 遇到它的新意思，先问「这个意思和树干像在哪儿、挨在哪儿」；
  - 实在连不上的，单独注明「约定俗成」，不硬连。
  mechanism: 多义的多个义项大多有亲缘，中心义居中，其余义项经隐喻、转喻一步步长出；先教中心义再教分支，比义项清单逐条背更省力、更能猜新义（回链 V-16）。
  linked_laws:
  - V-16
  cross_refs: []
  order_hint: 先行：适用（中心义 + 少量常见分支，剂量待定）。进阶：适用。
  self_check: 遇到学过的多义词的新用法，能先用「它和中心义的关系」猜出大意，再查证。
  misuse_warning: 同形异源词（如 light「光」与 light「轻」）是两棵树，不许硬连成一棵；引申链是事后理据，推不出的义项注明约定俗成（V-16 边界）。
  evidence_note: 专著定版 + 教学实验（Taylor 1989/2003 原型与多义网络；多义网络教学延迟后测证据）。
  status: 定版
- id: TEC-V13
  name: 拆词先验真，再拆件
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 读不快
  when: 记不住、读不快。见到生词不会拆解猜义，或者乱拆一气（把 watch 硬拆出假故事），拆错反而记错。
  steps:
  - 看生词先认它像哪台「造词机器」的产物：加零件、两词拼合、老词换工作、剪短、对接混合等；
  - 确认它真是那样拼出来的，再拆开；
  - 按零件猜整词意思，最后查词典验证；
  - 拆不出真结构的，整词记，不编故事。
  mechanism: 真构词的分析接通词族网络，假分析给记忆挂上错误的故事；词的可分析性从全透明到全不透明是一条连续谱，透明的真拆、不透明的整记、半透明的注明「只是帮记」（回链 V-15、V-20）。
  linked_laws:
  - V-15
  - V-20
  cross_refs: []
  order_hint: 先行：适用（裁剪版）——只拆儿童高频词里的真构词（如 -er、un- 类），清单按年龄裁剪（V-15 边界）。进阶：适用——七台造词机器全菜单可认（V-20）。
  self_check: 给三个没学生词，能先判断每个能不能拆、是哪台机器造的，猜义经查证大体对。
  misuse_warning: 给孩子的用法是「认机器」而不是术语考试（V-20 边界）；混合、截短多见于口语与媒体新词，逆构是零星事件不是常规生产线，不要拿小概率机器乱套词（V-20）。
  evidence_note: 专著定版（Nation 2001 词部件章；Bauer & Nation 1993 词缀分级，IJL 同行评审；Plag 2003；Bauer 1983）。
  status: 定版
- id: TEC-V14
  name: 拿词根当侦探
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 读不快
  when: 记不住、读不快。初中长词、学术词猛增，逐个死背背不完，见长词就怕。
  steps:
  - 先记住一批高复用的拉丁希腊词根（如 spect 是「看」、port 是「搬」、dict 是「说」、bio 是「生命」）；
  - 见到没见过的长词，先拆件、按件猜义；
  - 查词典对答案，猜错了看错在哪一截。
  mechanism: 学术与书面词汇层的主体来自拉丁与希腊语，构词零件在成百上千的词里重复出现且拼写相对稳定；系统学一批高复用词干，等于给生词装上「可分析接口」（回链 V-21，机制与 V-08 同源：给词义多接一条结构通道以加深加工）。
  linked_laws:
  - V-21
  - V-08
  cross_refs:
  - TEC-V13
  order_hint: 先行：有限适用——词根课程传统本身从低龄起步（源课程标注 2–12 年级），但中国学生须按课标词表与所读文本裁剪清单，不整表照搬；具体剂量待定。进阶：适用（主战场，面向学术词汇层）。
  self_check: 拿到一个含已学词根的生词（如 inspect、transport），能拆件猜出大意并经查证说对。
  misuse_warning: 词干释义是教学简化（如 spect 的实际语义场比「看」宽），是脚手架不是词源学结论；形似的字母串未必是真词根（如 corner 不是 corn+er），拆前须按 TEC-V13 的验真纪律（V-21 边界）。
  evidence_note: 从业课程传统（两套课程存续三十年以上、再版不辍；词根课程本身的对照实验级效果证据源条目未检索到，本条只主张机制合理性与传统存续，不主张疗效数字）。
  status: 定版
- id: TEC-V15
  name: 说出来，卡住就标记
  zone: 词汇解码区
  pain_point:
  - 说不出
  - 写不长
  when: 说不出、写不长。听读时以为懂了的词，一到说、写就卡壳，自己还不知道哪些是假会。
  steps:
  - 学完一组词，马上用它们说一段话或写几句话；
  - 卡住的地方当场做标记；
  - 回头专门补卡住的那几个词；
  - 再说一遍同一内容，看还卡不卡。
  mechanism: 产出要求精确提取形式与搭配，失败即产生「注意到缺口」的信号，触发对输入的定向再注意；输入负责遇见，输出负责查漏（回链 V-17）。
  linked_laws:
  - V-17
  cross_refs: []
  order_hint: 先行：适用（说为主，剂量待定）。进阶：适用（说、写并行）。
  self_check: 第二次说/写同一内容时，原先标记的卡点能顺畅通过。
  misuse_warning: 输出促学以「有反馈或有自我监控」为条件；无反馈的大量自由产出可能固化错误形式（V-17 边界）。
  evidence_note: 学术假说 + 课堂观察定版（Swain 输出假说 1985/1995；加拿大法语沉浸课堂观察及后续产出促学实验）。
  status: 定版
- id: TEC-V16
  name: 攒错本，先攻最大的一类
  zone: 词汇解码区
  pain_point:
  - 错不完
  when: 错不完。同样的词形、搭配、小词漏写错误反复犯，复习却平均用力，火力没对准聚集区。
  steps:
  - 把自己写错、用错的词按类归档：词形类、搭配类、漏/多小词类；
  - 数一数哪一类最多；
  - 一段时间只主攻最多的那一类；
  - 另外留意一类隐形问题：安全词说太多、该用的词不敢用——把「一次都没用过」的该用词也记进本子。
  mechanism: 中国学习者的词汇错误不是随机的，词形、搭配、缺词与赘词是三大聚集区，与汉英系统差异一一对应；且学习者差距除用错外还有多用（回避难点的「安全牌」）与少用（该用的系统性缺席），只有分类归档才照得出来（回链 V-18、CB-13）。
  linked_laws:
  - V-18
  - CB-13
  cross_refs: []
  order_hint: 先行：适用（借分类框架）——CLEC 被试以青少年至大学生为主，初学孩子只能借用其分类框架，错误分布数值不得外推（V-18 边界）。进阶：适用（CLEC 含青少年子库，框架与分布均可参照）。
  self_check: 错本按类分好，能说出自己当前最大的一类错误是什么，且该类错误在新作文里明显减少。
  misuse_warning: 多用/少用是群体统计结论，落到自己身上要再看成因（回避、母语迁移、输入不足都可致之）；「和母语者频率一致」不是唯一目标（CB-13 边界）。
  evidence_note: 学习者语料库描写定版（CLEC 2003，桂诗春、杨惠中；Granger CIA/CEA，鲁汶 CECL）。
  status: 定版
- id: TEC-V17
  name: 选词先看场合
  zone: 词汇解码区
  pain_point:
  - 写不长
  - 错不完
  when: 写不长、错不完。同义词随便换：给朋友写信一本正经，写正式作文又太随便——不是词错了，是场合错了。
  steps:
  - 遇到一组同义词（如 ask / question / interrogate），先想这句话的场合：日常说话、正式场合、还是学术书面；
  - 日常与情感场合优先短而核心的「本村词」；
  - 正式、学术场合再换「穿正装」的法语层、拉丁层词；
  - 拿不准时查词典的语域标注再定。
  mechanism: 英语词汇像地质分层——本族层管日常与情感，法语层管制度与礼仪，拉丁-希腊层管科学与抽象；同义群内选哪个，等于在选说话的场合与身份，语域差是词的历史层位写在词里的（回链 V-19）。
  linked_laws:
  - V-19
  cross_refs: []
  order_hint: 先行：适用（意识启蒙）——先认「词有老家、场合不同用法不同」，具体分层选词剂量待定。进阶：适用（写作选词操作）。
  self_check: 同一个意思能给出日常版与正式版两种说法，并说清分别用在什么场合。
  misuse_warning: 「三连」是倾向不是铁律，部分同义词已发生义项分化（如 interrogate 已专化为「审讯」，不再与 ask 全等值），不能教成「三个词随便挑、只是正式程度不同」；三层比例是词典词条计数，不是实际语流频率，数字不作精确结论（V-19 边界）。
  evidence_note: 专著定版（Crystal 2004/2003，经图书馆权威页引录核实，二手论述级；Baugh & Cable 英语史标准例支撑）。
  status: 定版
- id: TEC-V18
  name: 先学最常用的那个意思
  zone: 词汇解码区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。一个词好几个意思一次全背，负担爆炸又记混；或者背了冷僻义项，常用义项反而不会用。
  steps:
  - 学一个多义词，先只攻它最常用的那个意思；
  - 在阅读和听力里遇到它的新意思，再逐个往上加；
  - 复习时把每个意思分开自测，不混在一起背。
  mechanism: 一个词不是一级「会」的，是一个义项一级——同一词的不同义项被实证地标到不同学习级别，学习者是按义项逐个产出学会的（回链 CB-14）。
  linked_laws:
  - CB-14
  cross_refs: []
  order_hint: 先行：适用。进阶：适用。具体义项先后以学习者产出证据为准，条目未给本地清单，剂量待定。
  self_check: 说一个学过的词，能先说出它最常用的意思并造句；问到第二个意思时知道那是「后来加的」而不是混作一团。
  misuse_warning: EVP 的级别刻画的是全球通用学习者的产出次序，不是中国学生的专属次序，本地课程须再校准；它标的是产出证据，儿童听读能懂的接受性词汇通常先于产出，不能拿级别卡儿童的输入难度（CB-14 边界）。
  evidence_note: 机构语料实证定版（English Profile Programme / EVP，基于 Cambridge Learner Corpus 学习者产出证据，Capel 领衔）。
  status: 定版
- id: TEC-V19
  name: 记词连外套一起记
  zone: 词汇解码区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。同一个词换个句型就用错意思，或者只会词、不会它进句子的样子。
  steps:
  - 记词时，把它常穿的「句子外套」一起记（如 good 要连 at、look 要连 at 一起记）；
  - 造句时按外套整套用；
  - 同一个词穿不同外套意思不同时，分开记成两条。
  mechanism: 同一词的不同义项通常由不同型式区分，词选型式、型式定义词义——词汇与语法不是两个盒子（回链 CB-10）。
  linked_laws:
  - CB-10
  cross_refs: []
  order_hint: 先行：适用——落地就是「连型式一起记词」，不是背型式术语表（CB-10 边界）。进阶：适用。
  self_check: 给一个学过的词，能连它的常用型式一起造出句子；换型式时知道意思也跟着变。
  misuse_warning: 型式是概率性的搭配-结构倾向，强型式与自由组合之间是连续谱，不是每个词都有固定外套（CB-10 边界）。
  evidence_note: 语料驱动专著定版（Hunston & Francis 2000，Bank of English 语料）。
  status: 定版
- id: TEC-V20
  name: 先端话题，再说句子
  zone: 词汇解码区
  pain_point:
  - 说不出
  when: 说不出。口语组织句子时想一步到位，说不顺就卡住，或者把书面语序硬搬进口语，越说越别扭。
  steps:
  - 聊天时先把要说的人或东西「端到前面」点一下题；
  - 再说关于它的句子；
  - 说完发现对方可能没听清指谁，在句尾再补一句把所指说清。
  mechanism: 口语语料显示，话题前置（heads）与句尾补明（tails）是「非正式口语语法的标准特征」，功能是替听者安排信息焦点，服务实时加工（回链 CB-07）。
  linked_laws:
  - CB-07
  cross_refs: []
  order_hint: 先行：适用（口语模仿层面，剂量待定）。进阶：适用。
  self_check: 口头介绍一个朋友或地方时，能先点话题再展开，对方不用反问「你说谁」。
  misuse_warning: heads/tails 只属非正式口语语域；正式写作与考试作文中不用，更不能据此推翻书面语的语序规范——是「换语域换规则」，不是「规则不存在」（CB-07 边界）。
  evidence_note: 语料语法专著定版（Carter & McCarthy 2006《Cambridge Grammar of English》，CANCODE 500 万词口语语料）。
  status: 定版
- id: TEC-V21
  name: 拿不准，就说个大概
  zone: 词汇解码区
  pain_point:
  - 说不出
  when: 说不出。说不清某个东西的准确名字就卡住不说，或者硬编一个词，反而造成误会。
  steps:
  - 形容记不准的东西时，用 thing、stuff 一类词先兜住（如「蓝蓝的那个东西」）；
  - 列举说不全时，用 or something 收尾；
  - 拿不准语气时，用 sort of 把话说软。
  mechanism: 模糊语言在口语中极其常见且成系统，用来标记「精确不重要/我拿不准/给你留面子」，是熟练而敏感的说话人的标志，而不是懒人的标志（回链 CB-08）。
  linked_laws:
  - CB-08
  cross_refs: []
  order_hint: 先行：适用（口语，剂量待定）。进阶：适用。
  self_check: 描述一个叫不出名字的东西时，能用模糊说法把话说完、说圆，不卡壳、不硬编。
  misuse_warning: 需要精确的信息（时间、数量、指令、安全事项）含糊就是错误；目标是「会选」，不是「都含糊」（CB-08 边界）。
  evidence_note: 语料语法专著定版（Carter & McCarthy 2006，CANCODE 语料）。
  status: 定版
- id: TEC-V22
  name: 造句前先看真例句
  zone: 词汇解码区
  pain_point:
  - 错不完
  when: 错不完。凭语感猜一个词怎么搭、怎么用，猜出来的句子母语者根本不这样说。
  steps:
  - 拿不准一个词的搭配或用法时，先停下，不凭感觉造；
  - 查学习词典里这个词的真实例句；
  - 照例句的搭法换成自己的内容再说、再写。
  mechanism: 语感（包括母语者的语感）对频率、搭配、语域分布的判断系统性不可靠；只有检视大批真实文本，语言事实才浮现——断言先信文本，不信直觉（回链 CB-03）。
  linked_laws:
  - CB-03
  cross_refs: []
  order_hint: 先行：适用（查图文词典/课本例句，剂量待定）。进阶：适用（查学习词典例句）。
  self_check: 写出的句子能指出它参照了哪条真例句的搭法，而不是「我觉得应该这样说」。
  misuse_warning: 语料和例句只能告诉我们「人们这样说」，不能单独决定该不该学——取舍还要叠加自己的学习需求与目标（CB-03 边界）。
  evidence_note: 专著方法论纲领（Sinclair 2004《Trust the Text》；1991 语料实践）。
  status: 定版
- id: TEC-V23
  name: 学词四样轮着来
  zone: 词汇解码区
  pain_point:
  - 记不住
  when: 记不住。自学时只背单词表一种方式，背的词既认不全也用不出——只占了学词条件的四分之一。
  steps:
  - 在听读里遇词（把课文、听力当第一来源）；
  - 在说写里用词（当天就用新词说、写）；
  - 专门研究词本身（查九格、记搭配）；
  - 拿已经会的词限时练速度（快速认读、快速说出）；
  - 一周回看，四样里缺哪样补哪样。
  mechanism: 四种学习条件分别建设词知识的不同侧面（遇见建识别、用出建提取与精确度、专学建形式细节、流利练习建自动性），不能互相替代（回链 V-04）。
  linked_laws:
  - V-04
  cross_refs: []
  order_hint: 先行：不适用（学生侧）——「四股大致均衡」是课程层面的配比原则，低龄段的配比由课程安排，且低龄以输入与流利股比重更高（V-04 边界），不作为学生自学技巧下放。进阶：适用——自学时段按四股大致均衡自查，不要求每个时段四等分。
  self_check: 一周的学习记录里四样活动都有，而不是只有背词表一项。
  misuse_warning: 「大致均衡」是课程层面的配比原则，不要求每节课、每次自学四等分（V-04 边界）。
  evidence_note: 专著课程框架定版（Nation 四股框架，2007 / 2013 第 2 版课程设计章）。
  status: 定版
- id: TEC-V24
  name: 听人说话要搭腔
  zone: 词汇解码区
  pain_point:
  - 听不懂
  - 说不出
  when: 听不懂、说不出。对话时只会沉默地听，不会回应，对话接不下去，也显得没在听。
  steps:
  - 听对方说话时，用短应和及时回应（如 Brilliant. Perfect. 一类短句）；
  - 对方停顿时用 well、right 一类小词接住话轮；
  - 先从听辨和模仿学起，听清别人怎么搭腔，再自己用。
  mechanism: 句子进入真实话语后，语法变成话语语法：应和词、插入语是听者参与共建对话的规则装置，单位是话轮与语篇，不是孤立的句子（回链 CB-09）。
  linked_laws:
  - CB-09
  cross_refs: []
  order_hint: 先行：适用——低龄先做听辨与模仿，不做术语讲解（CB-09 边界）。进阶：适用。
  self_check: 一段对话里能有来有回，自己至少有几处恰当的短应和，而不是全程沉默或只答问。
  misuse_warning: 这套装置属口语语域，写作中大多不适用；情境省略类说法以「语境能补回」为条件，补不回就是病句，初学阶段不主动学省略（CB-09 边界）。
  evidence_note: 语料专著定版（McCarthy 1998，CANCODE 语料；Carter & McCarthy 2006 页码互证）。
  status: 定版
- id: TEC-G01
  name: 先问它在干什么活，再记它的样子
  zone: 语法区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——规则背下来换个句子就不会用，因为只记了形状、没记它管什么。
  steps:
  - 遇到新语法形式先不背，先问「它替说话人传了什么消息」；
  - 找两个只差这个形式的句子并排看；
  - 用自己的话说出差别；
  - 再回头记形式本身；
  - 遇到解释不了的怪形式（个别不规则词形），停下硬记，不硬套功能解释。
  mechanism: 语法单位本身是形式—意义配对，形式存在是因为它为听话人编码了一条信息，先抓意义再记形式才有抓手（GR-01）。
  linked_laws:
  - GR-01
  cross_refs: []
  order_hint: 先行：适用（教师带着问）；进阶：适用（自己问）；剂量待定。
  self_check: 能用自己的话说出「这个形式多传了什么消息」，并举出一个并排对照句。
  misuse_warning: 任意性残余（如个别不规则词形）功能解释管不了，只能靠历史与记忆（GR-01 边界、GR-06）。
  evidence_note: 理论纲领级——Langacker《Foundations of Cognitive Grammar》(1987/1991）奠基专著口径。
  status: 定版
- id: TEC-G02
  name: 动词链只许一个落箭头，后面的穿工作服
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——Does she likes、Did you went、I want go、enjoy to swim 反复出现。
  steps:
  - 圈出句中所有动词；
  - 只让第一个动词落时态箭头，后面的动词回原形或穿工作服；
  - 提问、否定时把箭头交给第一个助动词，没有就请 do 补位；
  - 第二个实义动词穿 to 还是 -ing 按前面动词的登记来（want 带 to、enjoy 带 -ing)，记新动词时连搭档一起记；
  - 读一遍，查有没有两个时态标记或漏穿工作服。
  mechanism: 一个分句的时态只实现一次、由动词链第一个成分承载（GR-02、CO-13)，第二动词的形式是词条级搭配事实（CO-14)，do 是实义动词丢了提问、否定能力后被拉来的替补（GR-03）。
  linked_laws:
  - GR-02
  - CO-13
  - CO-14
  - GR-03
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 句中只有一个时态标记，且每个后续动词都穿了与前面动词登记一致的工作服。
  misuse_warning: 出现第二个分句时，新分句重新标记自己的时态（GR-02 边界）；语义倾向只能助记、不得冒充规则，stop to do 与 stop doing 意义相反（CO-14 边界）；be 与情态动词不需要 do 替补（GR-03 边界）；并列谓语（come and see）是共享一台发动机的特许结构（CO-13 边界）。
  evidence_note: 参考语法定版（CGEL 2002）+ 历时语料实证（Ellegård 1953; Kroch 1989）。
  status: 定版
- id: TEC-G03
  name: 不规则词按家族认亲
  zone: 语法区
  pain_point:
  - 记不住
  when: 记不住——不规则过去式和复数当成一堆散词逐个背，背了又忘。
  steps:
  - 拿到不规则词先判家族：换元音的、不变样的、用 -en 的、外来的；
  - 同族词排成一组一起读、一起记；
  - 只把不入族的杂项（went、brought 等）单独记；
  - 新词默认走规则 -ed/-s，不往家族里塞；
  - 复习时整组复现，不按字母表顺序背。
  mechanism: 不规则形式是按元音交替等模式成组存留的封闭小类，高频使用使整组形式被整体记牢、抵抗规则化（GR-06、GR-28、GR-19）。
  linked_laws:
  - GR-06
  - GR-28
  - GR-19
  cross_refs: []
  order_hint: 先行：适用（以高频家族成员为限，条目边界）；进阶：适用（扩展外来复数、-f 家族等）；剂量待定。
  self_check: 能不看表说出一个家族的全部高频成员，并判出新遇到的不规则词属哪一族。
  misuse_warning: 不得宣称「不规则全是换元音」——went 是补足异根、brought 是词尾弱化型，各有来源（GR-06 边界）；家族名单以高频为限，data 的单复数等变动带按语域双标（GR-28 边界）。
  evidence_note: 历史语法共识 + 用法基础形态学（Bybee 频率保护说；N. C. Ellis 2002 综述）。
  status: 定版
- id: TEC-G04
  name: 把八个尾巴做成一张纠错卡
  zone: 语法区
  pain_point:
  - 错不完
  - 记不住
  when: 错不完、记不住——觉得英语「变形」无边无际，写完句子纠错时无从下手。
  steps:
  - 把八个屈折功能位抄成一张卡：复数 -s、所有格 's、三单 -s、过去式 -ed、过去分词位、-ing、比较级 -er、最高级 -est；
  - 写完句子拿卡逐位扫；
  - 重点查三单 -s、-ed、复数 -s 有没有漏（中国学生的高发位，GR-29);
  - 卡上没有的「变形问题」先放下，多半不是屈折问题。
  mechanism: 现代英语的屈折只剩八个功能位，语法负载已转到语序、助动词与介词上——这八个就是形态纠错的完整靶心（GR-29）。
  linked_laws:
  - GR-29
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 能默写出八个功能位，并用卡独立查完一段自写文字。
  misuse_warning: 「八个」是功能位口径——过去分词位多数动词用 -ed 形状，按形状合并会变成七个，引用须声明口径；八个只数屈折，不含派生词缀（GR-29 边界）。
  evidence_note: 章节预览级——Yule《The Study of Language》(2010) pp.69–70 原文核对，Fromkin 等清单逐项互证。
  status: 定版
- id: TEC-G05
  name: 先画难点地图：汉语没有的先练
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——精力平均撒，冠词、时态、复数、三单 -s 反复漏却不知道先攻哪里。
  steps:
  - 列出当前在学的语法点；
  - 逐个问「汉语里有没有要标这个的办法」（如汉语靠时间词和语境、英语靠动词变形）；
  - 汉语没有对应标记的标红；
  - 红区先练、多练，自己的错题也优先归红区；
  - 过一段时间按自己的错题记录重画地图。
  mechanism: 难点先验可画——目标语中凡与母语不同、且相对母语更有标记的区域必难，难度与标记度差成正比；汉语无标记对应的冠词、时态形态、复数与三单正是登记在案的错误集中区（GR-25、GR-22、TA-15）。
  linked_laws:
  - GR-25
  - GR-22
  - TA-15
  cross_refs:
  - TEC-G22
  order_hint: 先行：适用（教师制图、学生认图）；进阶：适用（学生自己制图）；剂量待定。
  self_check: 能指着地图说出自己当前三大红区，并各举一个本周真实错例。
  misuse_warning: 只在各标记标准一致指向的区域作强预言；过度泛化类语内错误（如 *goed）不在此图解释内，另按 TEC-G22 处理（GR-25 边界）。
  evidence_note: 假说级——Eckman 标记性差异假说（1977，二手论述级转引核实），与中国学习者错误分布登记（GR-22）逐项吻合。
  status: 定版
- id: TEC-G06
  name: 拿不准时顺着「画」猜：先发生先说、越亲贴越近、越多加标记
  zone: 语法区
  pain_point:
  - 记不住
  when: 记不住——语序、所有格、复数的规则一条条背、一条条忘。
  steps:
  - 拿不准语序时，先想事情发生的先后，按先后开口；
  - 选所有格形式时，先想两者关系近不近：近用紧贴式、远用拉开式；
  - 表示「多了」时，检查词上有没有多加标记；
  - 猜完再对照课本或词典核对。
  mechanism: 语法形式常模仿经验结构——语序象似（先发生先说）、距离象似（概念距离≈形式距离）、数量象似（形式量与意义量同向增减）（GR-24）。
  linked_laws:
  - GR-24
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 遇到新句子能先用「画」的办法猜出一种排法，并说出依据的是哪条象似。
  misuse_warning: 象似只是倾向，常被省力的经济原则压过；它只在结构层显著，不可扩大为「每个词形都有道理」（dog 的词形并不像狗）（GR-24 边界）。
  evidence_note: 二手论述级/目录+书评级——Haiman 主编《Iconicity in Syntax》(1985)；形式主义阵营对象似解释持保留态度（分歧在案）。
  status: 定版
- id: TEC-G07
  name: 写句子先立柱子，再挂修饰
  zone: 语法区
  pain_point:
  - 写不长
  - 错不完
  when: 写不长、错不完——作文里主语缺失、状语全堆在句首、谓语叠床，句子散架。
  steps:
  - 先只写主干「谁+做什么」；
  - 检查主干能独立站住；
  - 再往主干上逐层挂时间、地点、方式；
  - 读一遍，删掉重复的谓语；
  - 最后检查小词（do、will、of、to）有没有丢。
  mechanism: 英语是先立主谓骨架再扩展的形合建筑术，与汉语先铺垫后点题的流水式不同（CO-15)；其总背景是英语语法已从词尾搬家到语序、助动词与介词（GR-26）。
  linked_laws:
  - CO-15
  - GR-26
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 任取自己写的一句，能划出主干并指出每块修饰挂在哪根柱子上。
  misuse_warning: 形合/意合是统计大势而非逐句判错的定律，只用于诊断与预防（CO-15 边界）；分析化不等于「英语更简单」，语序刚性本身是新约束（GR-26 边界）。
  evidence_note: 对比研究定版——连淑能《英汉对比研究》(1993)；总叙事部分为二手论述级（取 Jespersen 叙事框架，其「进步」评价已拒收）。
  status: 定版
- id: TEC-G08
  name: 先拨两个开关，再选时态
  zone: 语法区
  pain_point:
  - 错不完
  - 记不住
  when: 错不完、记不住——十二个时态格子背混，还用一般现在时说正在发生的事。
  steps:
  - 先拨时间开关：过去还是非过去（英语动词形态只有这两件衣裳）；
  - 再拨看法开关：看全景、钻进去看中间、还是看留给现在的痕迹；
  - 两开关一组合，选出形式；
  - 想说「正在发生」，第二开关必须拨到「钻进去」（进行时），因为一般现在时装不下完整事件；
  - 说将来不找「将来时」，去借工具（见 TEC-G12）。
  mechanism: 时态与体是两个独立维度——时态把情境定位到时间上，体决定如何观看情境内部的时间构成（TA-01、TA-03)；形态时态只有过去/非过去两项（TA-02)；现在时要求被描述的完整事件与说话时刻完全重合（TA-04）。
  linked_laws:
  - TA-01
  - TA-03
  - TA-02
  - TA-04
  cross_refs:
  - TEC-G12
  order_hint: 先行：适用（但镜头讲法的现有实验全来自青少年与成人，6–12 岁无随机对照，属合理外推、待验——TA-18 登记）；进阶：适用；剂量待定。
  self_check: 随便指一个句子，能说出它两个开关各拨在哪一档，并说清为什么。
  misuse_warning: 两维图是骨架不是全图，谈论将来的手段不止 will/going to（TA-01 边界）；解说、演示、历史现在时是受语体约束的合法例外，属于识解切换而非规则失效（TA-04 边界）。
  evidence_note: 类型学奠基专著（Comrie 1976/1985）+ 章振邦「两时两体」国家级规划教材口径；低龄证据强度见源条目注。
  status: 定版
- id: TEC-G09
  name: 用完成时前先找「现在的印子」，再扫「过去的时间词」
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——完成时与过去时乱换，*I have seen him yesterday 一类错误反复出现。
  steps:
  - 想用完成时前先问：这件事给现在留下了什么结果或经验？
  - 答得出才用完成时，答不出就改用过去时讲事实；
  - 写完再扫一遍句中有没有 yesterday、last night、in 2019 这类点名过去时间的词；
  - 有，就把完成时改成过去时；
  - 想用汉语「了/过」直译时停一下：只在结果持续与经历两处可对应，其余不套。
  mechanism: 完成体的统一语义是「过去情境对现在的持续相关性」，其参照点设在说话现在，与点名过去时间的状语定位冲突（TA-05、TA-06)；汉语「了/过」与它仅在结果持续与经历两处部分重叠（TA-16）。
  linked_laws:
  - TA-05
  - TA-06
  - TA-16
  cross_refs: []
  order_hint: 先行：剂量待定（源条目未给前段剂量）；进阶：适用。
  self_check: 每个自写的完成时句子都能说出「现在的印子」是什么，且全句无点名过去时间词。
  misuse_warning: 经历用法的「痕迹」就是经验本身，不许硬编具体结果（TA-05 边界）；美式口语偶有完成时配明确过去状语的松动用法，属语体变异，不改变判据（TA-06 边界）。
  evidence_note: 定版框架——Comrie《Aspect》(1976) pp.52、56–60 + CGEL 次级时态分析；「现时相关」含糊性有学界批评（Dahl & Hedin 2000，分歧在案）。
  status: 定版
- id: TEC-G10
  name: 给动词验形状再套进行时
  zone: 语法区
  pain_point:
  - 错不完
  - 听不懂
  when: 错不完、听不懂——*I am knowing 一类句子不自知，in an hour / for an hour 配错。
  steps:
  - 用进行时或时间状语前，先给动词短语验形状：状态、活动、有终点的完结、瞬间的达成，四选一；
  - 状态类（know、love 这类静止牌子型）停用进行时；
  - 拿不准时用 in an hour 和 for an hour 各配一次，顺的那种留下；
  - 按整个短语判，不按孤立动词判（run 与 run a mile 不是一类）。
  mechanism: 动词短语自带时间形状（情状类型），形状由词义决定其与进行体、时间状语的兼容性（TA-07）。
  linked_laws:
  - TA-07
  cross_refs: []
  order_hint: 先行：剂量待定；进阶：适用。
  self_check: 能给常见动词短语逐个判出四型，并预先说对它能不能进进行时。
  misuse_warning: 语境可强迫转换（广告式 I am loving it)，属特许用法，不推翻分类（TA-07 边界）。
  evidence_note: 奠基论文——Vendler "Verbs and Times"(1957)。
  status: 定版
- id: TEC-G11
  name: 先把高频过去式用熟，再回头看系统表
  zone: 语法区
  pain_point:
  - 记不住
  - 说不出
  when: 记不住、说不出——先背了系统表，讲故事时 went、saw、had 还是说不顺。
  steps:
  - 先挑天天用的高频动词过去式（went、saw、had 等）；
  - 放进讲故事、说昨天的事里反复用熟；
  - 攒够一批熟词后再打开系统表对照归类；
  - 新学的形式往已有熟词的图式上挂；
  - 低频不规则词靠增加遇见次数保命，不靠一次背死。
  mechanism: 范畴从具体词例中涌现——逐词习得、局部图式、抽象系统，高频形式最先被整存并成为图式扩展的锚点；词例频率固化具体形式（TA-17、GR-19）。
  linked_laws:
  - TA-17
  - GR-19
  cross_refs: []
  order_hint: 先行：适用（主路径）；进阶：适用（回补系统表）；剂量待定。
  self_check: 能不查表流利讲出一段昨天的事，事后能在系统表里指出自己用的形式各属哪格。
  misuse_warning: 顺序是先后关系而非取舍关系——高年级补系统表有显性学习效率优势，不得把本条读成「永远不许看表」（TA-17 边界）。
  evidence_note: 用法基础习得研究——Tomasello (2003）动词岛与图式涌现 + N. C. Ellis (2002）频率调谐综述。
  status: 定版
- id: TEC-G12
  name: 说将来先看手里的牌
  zone: 语法区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完——will 与 going to 乱选，时刻表句子也用错形式。
  steps:
  - 先看情境：是不是已经有苗头、已经打算好；
  - 有预兆、有打算用 be going to；
  - 当场决定、随口预言、拍胸脯答应用 will；
  - 碰到火车时刻表、节目单这类已定死的安排，改用一般现在时；
  - 拿不准时记住两者大量语境可互换，不硬分。
  mechanism: going to 源于「上路去做某事」，留下「当前已有征兆/计划」的底色（TA-11)；will 源于意愿动词，留有承诺/预测的立场残影（TA-10)；时刻表把未来制度化为事实，故可借现在时编码（TA-13）。
  linked_laws:
  - TA-11
  - TA-10
  - TA-13
  cross_refs: []
  order_hint: 先行：适用（原型对比）；进阶：适用（细化重叠区）；剂量待定。
  self_check: 给三个将来情境（看云要下雨、当场答应帮忙、查火车时刻）能各选对形式并说出理由。
  misuse_warning: 两者分工是倾向而非铁律（TA-11 边界）；不得宣称 will「仍然表示想要」，天气预报式 will 已高度中性化（TA-10 边界）；个人临时计划不用时刻表式现在时（TA-13 边界）。
  evidence_note: 语法化跨语言路径——Bybee, Perkins & Pagliuca (1994)，词源型登记；futurate 分析依 CGEL。
  status: 定版
- id: TEC-G13
  name: 讲故事先插旗，再说更早的事
  zone: 语法区
  pain_point:
  - 写不长
  - 错不完
  when: 写不长、错不完——叙事里过去完成时乱用、漏用，时间线讲不清。
  steps:
  - 讲到过去某一点时，先写出这个锚点句（一般过去时）；
  - 再回头补那时之前发生的事；
  - 更早的事用 had + 过去分词；
  - 写完检查：每个过去完成时旁边都找得到它的锚点；
  - 顺序已被 before/after 或语境标清的，可以省掉过去完成时。
  mechanism: 完成体是相对时态——只要求事件早于参照点；参照点在现在是现在完成时，参照点被叙事搬到过去就成了过去完成时，维度本身没有增加（TA-09）。
  linked_laws:
  - TA-09
  cross_refs: []
  order_hint: 先行：剂量待定；进阶：适用。
  self_check: 任选自己写的一段叙事，能逐个指出每个 had done 的锚点是哪一句。
  misuse_warning: 叙事顺序已标明时省略过去完成时属冗余消除，不构成对机制的反例（TA-09 边界）。
  evidence_note: 定版分析——Comrie《Tense》(1985）相对时态 + CGEL 次级时态说互证。
  status: 定版
- id: TEC-G14
  name: 想客气、想假设，把动词推远一格
  zone: 语法区
  pain_point:
  - 说不出
  when: 说不出——请求说得太生硬；假设句、虚拟式看不懂也不敢用。
  steps:
  - 想把请求说客气，先把动词推远一格用过去形式（I wondered… / Could you…?);
  - 想假设，先用 If I were… 起句把现实推远；
  - 读到 were、that he be 这类「不对劲」形式，先整体认作「非现实」标记放行，不急着「纠正」；
  - 说完检查：推远的是形式，不是事情真的发生在过去。
  mechanism: 过去形式的通义是「认识距离」——把情境置于说话人即时视域之外，时间上的远、心理上的不确定与社交上的客气是同一操作的不同维度（TA-08)；were 遗迹与 mandative 的 be 是这一机制在动词形态上剩下的化石（GR-40）。
  linked_laws:
  - TA-08
  - GR-40
  cross_refs: []
  order_hint: 先行：只埋种子——客气与假设各记一两个固定句型（TA-08 边界明示），公式化石只要求认得出、不要求产出 mandative 全式（GR-40 边界明示）；进阶：适用（条件句系统在此展开）；剂量：除上述条目明示外待定。
  self_check: 能把一句生硬请求改成推远版，并指出 If I were you 里 were 标记的是「假」而不是「过去」。
  misuse_warning: 真实过去的条件（If I was rude yesterday… 指真实往事）必须用 was（GR-40 边界）；英式 should 代替式（that he should be told）完全合法，不可判错（GR-40 边界）。
  evidence_note: 理论分析——Langacker 认识距离说（v3 回写注 Lewis 通用原则与 Palmer 类型学双证，距离为通义）；化石部分为二手论述级（CGEL irrealis 分析转述）。
  status: 定版
- id: TEC-G15
  name: 选情态词先想力气有多大
  zone: 语法区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完——must/may/can 凭语感乱选，还给情态词加 -s、把两个情态词连排。
  steps:
  - 选情态词先想力从哪来：外力推着必须做、障碍被搬开可以做、自己有劲儿能做；
  - 猜事情时用同一把尺：证据把人「推」到只能得出这个结论，才用 must 级别；
  - 写完检查情态词：不加三单 -s、不与另一个情态词连排、后面跟原形。
  mechanism: 根情态统一于力动态——义务是外力压向主体、许可是障碍缺席、能力是主体内在潜能，认识情态是同一图式搬进推理领域（GR-07)；情态词形态残缺，是它们由普通动词语法化到半路的化石证据（GR-08）。
  linked_laws:
  - GR-07
  - GR-08
  cross_refs: []
  order_hint: 先行：剂量待定（源条目未给前段形态）；进阶：适用。
  self_check: 给三个情境（校规必须、老师允许、自己会做）能选对情态词，并说出每个的「力从哪来」。
  misuse_warning: 力图式是语义骨架，不覆盖礼貌、委婉用法——Could you…？的客气不是把「能力」直译（GR-07 边界）。
  evidence_note: 专著章节级——Sweetser《From Etymology to Pragmatics》(1990）第 3 章页码核实；语法化框架见 Hopper & Traugott (2003)。
  status: 定版
- id: TEC-G16
  name: 听读先认模具，再认动词
  zone: 语法区
  pain_point:
  - 听不懂
  - 读不快
  when: 听不懂、读不快——逐词啃句子，词都认识还不懂整句在演哪出戏。
  steps:
  - 读/听一句先不查词，先判它是哪种模具：给东西、把某物弄到某处、把某物弄成某样、出场介绍等；
  - 再看动词只提供什么方式；
  - 整句意思先猜出大半；
  - 最后才查词核对；
  - 模具解释不了的词形问题（-s、-ed）转回形态层查，不硬套模具。
  mechanism: 理解句子时母语者按构式（而非主动词）分类与组织，构式义是心理现实的表征单位（CO-11)；句子的整体意义大于动词义之和，剩余意义由构式本身贡献（CO-01）。
  linked_laws:
  - CO-11
  - CO-01
  cross_refs: []
  order_hint: 先行：适用（分类实验被试为成人与青少年，低龄应用属合理外推、待验——CO-11 边界）；进阶：适用；剂量待定。
  self_check: 遮住动词只看句型框架，能说出这句大概在演哪出戏。
  misuse_warning: 模具只管论元结构层的戏，词形细节归形态层管，越界使用会造出新伪规则（CO-16、CO-01 边界）；致使移动模具要求可识解的物理致使链，纯心理/状态动词入模被拒（CO-04 边界）；结果状态须是动作可直接达成的（CO-05 边界）。
  evidence_note: 句子分类实验——Bencini & Goldberg (2000)，Liang (2002，中国学习者）与 Gries & Wulff (2005）复现同向；构式语法奠基专著（Goldberg 1995）。
  status: 定版
- id: TEC-G17
  name: 新动词进双宾先过两道门
  zone: 语法区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出——*explain me this 写出来不自知，双宾句翻来覆去只会用 give。
  steps:
  - 想用「人+人+东西」句型前，先过意思门：这个动词有没有「让人得到东西」的份；
  - 再过长相门：多音节、重音不在开头、拉丁味重的词多半被拒；
  - 被拒就改走 to 小路（explain this to me);
  - 新动词先查证再入模，不凭感觉硬套；
  - 已入模的动词按「真给→打算给→答应给」的家族谱系记。
  mechanism: 双宾构式中心义是「施事使接受者收到客体」，转移义由构式供给（CO-02)；准入受宽域语义规则与窄域语义小类+形态音位两层门禁（CO-03)；构式义是围绕中心义组织的多义网络（CO-06）。
  linked_laws:
  - CO-02
  - CO-03
  - CO-06
  cross_refs: []
  order_hint: 先行：只呈现中心义与最常用意图义（bake/make 给）（CO-06 边界明示）；进阶：适用（两道门全开）；剂量：除上述明示外待定。
  self_check: 能判出 explain、donate、bake 各自走哪条路，并说出卡在哪道门。
  misuse_warning: 窄域小类靠逐类习得，没有一条规则能全自动预测每个动词的去向，新动词须查证/语感积累（CO-03 边界）。
  evidence_note: 专著分析（Pinker 1989 宽/窄域规则）+ 可接受性判断实证（Gropen, Pinker et al. 1989)；拉丁源限制的解释覆盖有分歧（Groefsema 2001，在案）。
  status: 定版
- id: TEC-G18
  name: 介绍新面孔用 there be，点名家底用 have
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——*There has a book、There is two books 反复出现。
  steps:
  - 要把新东西第一次介绍出场，用 There be 起句；
  - is/are 看紧挨着的第一个名词的单复数；
  - 已经提过的东西再说归属，改用 have；
  - 写完专查 there be 句：be 对没对齐最近的名词。
  mechanism: 存现构式的功能是向话语中引入新实体，其主语多半是新信息，与 have 的「领有」是两出不同的戏（CO-07)；there be 的一致走就近原则（GR-12）。
  linked_laws:
  - CO-07
  - GR-12
  cross_refs: []
  order_hint: 先行：适用（就近口径只在 there be 内教，GR-12 边界）；进阶：适用；剂量待定。
  self_check: 能判出一段话里哪句该用 there be、哪句该用 have，并让 be 与最近名词对齐。
  misuse_warning: 清单列举语境可放行定指主语（There is the bus！指等候之物到达），属语境特许（CO-07 边界）；就近原则在正式书面语中受约束（GR-12 边界）。
  evidence_note: 参考语法定版——CGEL 存现分句分析 + 项目已入模口径。
  status: 定版
- id: TEC-G19
  name: 想突出谁，就让谁当主语
  zone: 语法区
  pain_point:
  - 写不长
  - 说不出
  when: 写不长、说不出——被动句只背定义不会选；把主语一律理解成「做事的人」，中动句、存现句读不懂。
  steps:
  - 写句前先定这句想让读者看谁；
  - 看做事的人用主动，看被收拾的东西用被动（be + 过去分词）；
  - 换完检查：事情没变，只变站位；
  - 读到主语不是动作发出者的句子（The door opened)，先按「镜头主角」理解，不硬找施事者。
  mechanism: 主/被动之别是焦点参与者的选择——被动把受事提升为首要焦点占据主语位，事件内容不变而站位改变（CO-08)；主语编码的是首要焦点参与者（trajector)，施事只是其原型而非定义（CO-09）。
  linked_laws:
  - CO-08
  - CO-09
  cross_refs: []
  order_hint: 先行：只建立「换主角」直觉与最常用形式（be + 过去分词），by 短语取舍等细节后置（CO-08 边界明示）；进阶：适用；剂量：除上述明示外待定。
  self_check: 同一件事能主动、被动各说一遍，并说清两遍各自想让读者看谁。
  misuse_warning: 「主角」是注意力概念，不能反推语义角色——The key opened the door 中 key 是工具还是施事，仍须结合动词与语境判（CO-09 边界）。
  evidence_note: 理论分析——Langacker trajector/landmark（2008, p.364）+ CGEL 被动章信息结构动机互证。
  status: 定版
- id: TEC-G20
  name: 整句先住进来，再拆零件换着玩
  zone: 语法区
  pain_point:
  - 说不出
  - 记不住
  when: 说不出、记不住——规则听懂了张不开嘴，新句子造不出来。
  steps:
  - 先整句背熟一个高频句（Can I have…? / What's this?);
  - 只换最后一个词，连说几遍；
  - 再试着换中间的零件；
  - 换熟后停下来说出「哪截是能换的机关」；
  - 把析出的框架抄进自己的句型本，再往里填新词。
  mechanism: 语言单位是从整存公式语、半成品框架到全抽象构式的同一条谱系，学习者先整块存取、后分析，图式从反复变例使用中析出（GR-20、CO-10、CO-12）。
  linked_laws:
  - GR-20
  - CO-10
  - CO-12
  cross_refs: []
  order_hint: 先行：适用（主路径：整句 + 换尾词）；进阶：适用（推进到带空格框架与抽象模具）；剂量待定。
  self_check: 任选一个背过的整句，能当场换出三个新句子，并指出框架的空格在哪。
  misuse_warning: 整存不等于拒绝分析——到了产出新句子的阶段不拆块换件，语块会封顶表达能力（GR-20 边界）；先整句是起点策略，不是拒绝显性讲解的理由（CO-10 边界）。
  evidence_note: 习得个案与日记研究（Tomasello 1992/2003 动词岛）+ 公式语加工速度实验（Conklin & Schmitt 2008）。
  status: 定版
- id: TEC-G21
  name: 说到卡壳别绕开，停下来看形式
  zone: 语法区
  pain_point:
  - 说不出
  when: 说不出——听都听懂了，一开口才发现说不出来，还不知道自己哪里没真会。
  steps:
  - 每天用英语说或写一小段自己真想表达的事；
  - 卡住时不许绕开，把卡点原样记下来；
  - 回头查正确说法，与自己说的并排比；
  - 把差距处标出来，抄进错题档（接 TEC-G22)；
  - 在交际最卡的那几秒顺手看形式，不等课后单独补。
  mechanism: 被推动的准确产出迫使加工从语义切换到句法，从而注意差距、检验假设（GR-23)；输入须被有意识注意到才转化为摄入（GR-17)；在意义活动中随交际问题短暂聚焦形式，是其课堂形态（GR-18）。
  linked_laws:
  - GR-23
  - GR-17
  - GR-18
  cross_refs:
  - TEC-G22
  order_hint: 先行：降阶为短句产出与情境表演，不照搬 POA 评价体系（GR-23 边界明示）；低龄的注意多由教师设计代为触发（GR-17 边界）；进阶：适用；剂量：除上述明示外待定。
  self_check: 每周能拿出至少三条「卡点—差距」记录，并能复述每条差在哪。
  misuse_warning: 输出须有输入促成配套，硬逼开口无效（GR-23 边界）；形式聚焦是「随问题出现」的短插播，需要系统建立的框架（如时态两维图）仍须专门集中呈现（GR-18 边界）。
  evidence_note: 奠基文献——Swain (1985）输出假说、Schmidt (1990）注意假说（2001 年已修正为弱式：注意越深、习得越多）；与 Krashen 输入派分歧在案。
  status: 定版
- id: TEC-G22
  name: 错题按病因归档，不按日期堆
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——错题按日期堆成山，订正完同类错误下次还犯。
  steps:
  - 每次订正先判病因：是我在试一条新规则（系统错误），还是手滑口误（偶发失误）；
  - 系统错误按类型建档（漏三单 -s、时态缺失、双宾误入…)，不按日期堆；
  - 同类攒够三条，停下来写一句「我以为的规则是…」；
  - 复习时只翻档案里的高频类；
  - 失误类不进档，提醒自己慢一点即可。
  mechanism: 错误是学习者过渡性系统（中介语）做假设检验留下的可见痕迹，系统性错误反映当前过渡能力、与偶发失误来源不同，处置应分开（GR-16）。
  linked_laws:
  - GR-16
  cross_refs: []
  order_hint: 先行：适用（病因由教师代判）；进阶：适用（自己判）；剂量待定。
  self_check: 能把本周错题逐条分进「系统/失误」两堆，并说出最大一堆背后的自以为规则。
  misuse_warning: 中介语视角解释错误来源，不等于放任错误——错误需被注意到并处理，否则有石化风险（GR-16 边界）。
  evidence_note: 奠基文献——Corder (1967)、Selinker (1972)。
  status: 定版
- id: TEC-G23
  name: 先想缺哪块，再派词去问、按块答
  zone: 语法区
  pain_point:
  - 说不出
  - 听不懂
  when: 说不出、听不懂——提问派错疑问词，答问答非所问，否定问句答反意思。
  steps:
  - 提问前先在心里说清：我缺的是人、物、时间、地点、原因还是办法；
  - 派对应的疑问词去问（问「是什么」派 What，问「怎么做、怎么样」派 How)；
  - 练习时专挑自己真不知道、对方知道的事来问；
  - 听问先判对方问的是哪块，按那块答；遇 or 问题直接选一个，不答 Yes；
  - 答否定问句先把事实在心里说成完整句，再按事实选 Yes/No 并补全句（No, I don't.)。
  mechanism: 特殊疑问句是「已知框架 + 一个空缺」的分工系统，疑问词标明空缺的语义类型，答语只需填入该类型信息（QI-01)；How 与 What 辖域分工、or 问句预设选答（QI-10、QI-11)；否定问句英语跟事实极性走、汉语常跟对方的话走（QI-12)；为不知道而问，形式记得住（QI-15）。
  linked_laws:
  - QI-01
  - QI-10
  - QI-11
  - QI-12
  - QI-15
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 听五个问题能逐个说出「它在问哪块」，且否定问句连答带补全句全对。
  misuse_warning: Why 不必全用 Because 答——问目的时 To / For 同样正宗，但应试场景以 Because 完整句最稳妥，不得以碎片答语替代完整句训练（QI-09 边界）；How do you do 等礼貌套语已公式化，整组记，不按辖域分析（QI-10 边界）；修辞问句与回声问句不服从此分工（QI-01 边界）。
  evidence_note: 参考语法定版（Quirk et al. 1985；Swan 问句诸条）+ 对比研究（连淑能 1993)；QI-12 条目登记该错位「只需一次显性对比即可大幅纠正」。
  status: 定版
- id: TEC-G24
  name: 变问句只举第一名助动词
  zone: 语法区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出——*What you want?、*Does she likes 一类问句反复出现。
  steps:
  - 先写出对应的陈述句；
  - 疑问词先搬到句首站好（汉语里它不用搬，英语必须搬）；
  - 找出动词链里第一个助动词，把它举到主语前面；
  - 没有助动词就请 do/does/did 补位，主动词回原形；
  - 两种情况放行不倒装：主语提问（Who came?）与间接问句（Do you know where she was?)。
  mechanism: 一般疑问句由主语—助动词倒装构成，被举到前面的总是排第一的那个助动词，无助动词时由 do 补位（QI-04)；英语属 wh-移位型、汉语属原位型，「原位 + 无倒装」整套搬运正是迁移错误源（QI-13）。
  linked_laws:
  - QI-04
  - QI-13
  cross_refs: []
  order_hint: 先行：适用（自发口语按发展阶段走：整句模仿→换疑问词→最后才学会倒装，不跳阶催——QI-14)；进阶：适用；剂量待定。
  self_check: 任给五个陈述句能全部改成问句，并指出每个问句「被举到前面的」是哪个词。
  misuse_warning: 英语回声问句合法保留原位疑问词（You bought WHAT?)，须与迁移错误区分标注，避免误纠（QI-13 边界）；间接问句与主语问句的不倒装是结构特许而非例外失误，须同框教学（QI-04 边界）。
  evidence_note: 教学定版（Swan《Practical English Usage》§509.4)+CGEL 倒装分析；阶段序列为 SLA 综述级（Ellis 2008 综述 Pienemann 过程性理论）。
  status: 定版
- id: TEC-G25
  name: 新信息压轴，句尾重读
  zone: 语法区
  pain_point:
  - 写不长
  - 说不出
  when: 写不长、说不出——句子重点埋没，状语顺序凭语感乱排，读出来平铺直叙。
  steps:
  - 说话写句先排已知信息；
  - 把最新、最想让对方注意的信息挪到句尾；
  - 读出来时在句尾信息上重读；
  - 句尾状语默认按常态顺序排队；
  - 真想强调某个成分时，才把它提到句首打光。
  mechanism: 英语常态是按信息值由低到高线性呈现，新信息（焦点）落在句尾并承载重音（QI-05)；句尾状语的常态序列是倾向而非定律（QI-06)；前置是把信息重心改组的「变强调」手段（QI-07）。
  linked_laws:
  - QI-05
  - QI-06
  - QI-07
  cross_refs: []
  order_hint: 先行：只练句尾压轴，前置定位为识别与欣赏、不作产出要求（QI-07 边界明示）；进阶：适用（加前置变强调）；剂量：除上述明示外待定。
  self_check: 任选自己写的三句，能逐句指出句尾的新信息是什么，并读出重音落点。
  misuse_warning: 倾向内部仍有硬约束残部（频度副词中位、方式副词与动词的黏合度），只放开地点/时间的排队等级（QI-06 边界）；重音人为前移制造对比焦点是合法手段，不算违反压轴（QI-05 边界）。
  evidence_note: 参考语法原文核实——Quirk et al. (1985) p.1357 end-focus 原文经转引核实。
  status: 定版
- id: TEC-G26
  name: 因果只搭一座桥
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——写作里 Because…, so… 两座桥一起搭。
  steps:
  - 写因果句先选站位：讲原因用 because 起句，讲结果用 so 连接；
  - 一条因果链只留一个连接点；
  - 写完通读，查同一因果链里 because 与 so 是否同时出现；
  - 同时出现就删掉一个。
  mechanism: 英语一个主从关系由一个从属连词标明即足，because…so 并用是把汉语成对关联词的意合习惯迁移进英语（GR-11）。
  linked_laws:
  - GR-11
  cross_refs: []
  order_hint: 先行：适用；进阶：适用；剂量待定。
  self_check: 通读自写段落，每条因果链上只有一个连接点。
  misuse_warning: 问题只在同一因果链里并用——because、so 各自单独使用都合法（GR-11 边界）。
  evidence_note: 对比研究定版（连淑能 1993 形合/意合）+ 中国学习者语料高频迁移错误登记。
  status: 定版
- id: TEC-G27
  name: 读关系从句先做删除测试
  zone: 语法区
  pain_point:
  - 读不快
  - 错不完
  when: 读不快、错不完——关系从句分不清要不要逗号，that/which 乱选，关系词乱省。
  steps:
  - 读到名词后面挂的小句子，先试着把它整段删掉；
  - 删了就不知道说的是哪个——它是「认人」的：紧贴名词不打逗号，that 可用；
  - 删了照样认得出——它是「补一句」的：必须打逗号、不能用 that、关系词不许省；
  - 想省关系词前再查：它在小句里作宾语才可省，作主语绝不可省；
  - whose 的位置谁也替代不了，保留 whose。
  mechanism: 限制性从句把先行词所指缩小到唯一可认，非限制性从句只追加信息，两类在逗号、that 准入与零关系化上系统分工（GR-30）。
  linked_laws:
  - GR-30
  cross_refs: []
  order_hint: 先行：剂量待定；进阶：适用。
  self_check: 给五个带关系从句的句子，能逐个判定类别，并正确决定逗号、that 与省词。
  misuse_warning: 介词前置时（the house in which we live）不可省、且只能用 which/whom；whom 在介词前置的正式书面语中仍是唯一选择（GR-30 边界）；限制性用 which 在英式英语完全标准，美式编辑规范偏好 that 属文体处方之争——考试写作跟目标考试规范，理解上两者都认（GR-30 分歧）。
  evidence_note: 二手系统论述级——CGEL (2002）第 12 章经词条系统转述核实（CGEL 原书未打开）。
  status: 定版
- id: TEC-G28
  name: 关联词先对搭档，再对形状
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——both…and or 混搭、并列成分一长一短不同形、either…or 谓语单复数乱配。
  steps:
  - 先查搭档没串门：both—and、either—or、neither—nor、not only—but also；
  - 把关联词分别贴到两边读一遍；
  - 两边成分改成同类同形（前面是 -ing 形式，后面也用 -ing)；
  - or/nor 连接两个数不一致的主语时，谓语跟较近的那个主语走；
  - and 连接的主语永远按复数，不用就近。
  mechanism: 关联并列是封闭配对、关联词后紧跟的成分必须同类同形（GR-32)；一致关系由语法一致、意义一致、就近一致三股力共同决定，就近只在限定域内生效（GR-32、GR-12）。
  linked_laws:
  - GR-32
  - GR-12
  cross_refs: []
  order_hint: 先行：适用（基础配对与同形）；进阶：适用（加 not only 前置倒装与就近细则）；剂量待定。
  self_check: 能把一个错位句（如 both 的辖域盖不住后半成分）移位改对，并说出改的依据。
  misuse_warning: 就近不是「看见近名词就跟它走」——The quality of the mangoes is… 必须跟真正主语 quality，适用域写反是本条最大教学风险；neither…nor 本身已含否定，谓语不再加否定词（GR-32 边界）。
  evidence_note: 二手系统论述级——CGEL 一致三原则与 Purdue OWL 等教学定版互证。
  status: 定版
- id: TEC-G29
  name: 配回声尾巴：抄助动词、翻极性、换代词
  zone: 语法区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出——所有句子尾巴都拖 isn't it，助动词不回指、极性不翻转。
  steps:
  - 抄：把主句的助动词/情态动词/be 抄到尾巴，没有就请 do/does/did 补位；
  - 翻：主句肯定尾巴否定、主句否定尾巴肯定（never、hardly、few、little 这类半否定词算否定主句）；
  - 换：尾巴主语换成与主句主语同指的代词；
  - 特例单独记：I am → aren't I、Let's → shall we、不定代词主语 → they、事物主语 → it；
  - 读尾巴时分工：真求证用升调，只求附和用降调。
  mechanism: 反意疑问句是把主句的助动词和极性翻转着弹回的回声机制，其无助动词时的补位与 do 替补同源（GR-33、GR-03）。
  linked_laws:
  - GR-33
  - GR-03
  cross_refs: []
  order_hint: 先行：剂量待定；进阶：适用。
  self_check: 给五个主句配尾巴全对，并能说出每个尾巴的助动词是从主句哪里抄来的。
  misuse_warning: 主句是 I think/believe + 从句时尾巴跟从句走（GR-33 边界）；语调与意义的对应是倾向而非铁律（GR-33 分歧）；美式口语中 isn't it 有松动用法，但标准教学系统仍以翻转—回指为正（GR-33 边界）。
  evidence_note: 章节影印页级——Swan《Practical English Usage》第 3 版 question tags 条原文核对（本批最高接触等级）；中国学习者难点定位为教学界共识级，无 CLEC 级语料计数（条目明示，不冒充语料定版）。
  status: 定版
- id: TEC-G30
  name: 说过去习惯先分家：状态归 used to，动作回放才用 would
  zone: 语法区
  pain_point:
  - 错不完
  when: 错不完——*We would live in the country、*I am used to get up early 反复出现。
  steps:
  - 先问说的是状态还是重复动作；
  - 状态（住过、有过、喜欢过）只能用 used to；
  - 动作回放先用 used to 或过去时把时间框架立住，再接 would 一段段放；
  - 说「已经习惯了」换 be used to，后面跟名词或 -ing；
  - 写完查：used to 后跟原形，be used to 后绝不跟原形。
  mechanism: 三式按「时间指向 × 动词类型 × 结构」分工——used to 管今昔对照、状态动作皆可；would 只回放过去重复动作且须有时间框架铺垫；be used to 的 to 是介词、与过去无关（GR-41）。
  linked_laws:
  - GR-41
  cross_refs: []
  order_hint: 先行：剂量待定；进阶：适用。
  self_check: 给四个句子（过去住乡下、每年夏天去外婆家、已习惯早起、过去常踢球）能逐个选对式，并说出切分依据。
  misuse_warning: used to 的「今已不再」是强默认蕴含而非逻辑必然，教学按「对照已变」教（GR-41 边界）；*be used to do 在任何时态下都不成立（GR-41 边界）；used to 无现在时对应物，不存在表现在的 *I use to go（GR-41 边界）。
  evidence_note: 教学定版转述级——Lingolia used to 条打开核对 + Swan 系教学定版互证。
  status: 定版
- id: TEC-S01
  name: 读到生词先自己拼，拼对了就等于学会了。
  zone: 拼读区
  pain_point:
  - 读不快
  - 记不住
  when: 读不快、记不住——阅读时一见生词就跳过或查词典，词永远认不熟；逐词指读、读速上不去。
  steps:
  - 读到生词先停一拍，不跳过；
  - 按学过的字母—声音对应逐段拼出声；
  - 把拼出的音和上下文对一对，猜它是什么意思；
  - 读完这一页后回头再认一遍这个词；
  - 下次在别的书里再遇见它时，先试着直接认出来。
  mechanism: 每成功解码一次生词，就在记忆里钉下该词的拼写细节，几次成功相遇后词就转为熟词——解码是阅读的「自我教学」机器，生词多到不可能逐个教，只能靠这个自转机制（S-04；系统拼读是全领域证据最硬的教学结论，S-01）。
  linked_laws:
  - S-04
  - S-01
  cross_refs: []
  order_hint: 先行：主战场，拼读主线期内每天阅读都用；进阶：仅作补漏（拼读未过关者回补），剂量待定。起步期正式拼读前，可先用押韵、首音—韵脚的听辨游戏打底（S-05，属成人组织的课程环节，见覆盖说明）。
  self_check: 昨天拼过的生词，今天在新的一页里能一眼认出，不用再逐字母拼。
  misuse_warning: 解码只提供自我教学的「机会」，不读课外书，机制空转（S-04 边界）；拼读管认词不管读懂，不能替代语言理解（S-01 边界）。
  evidence_note: 强——NRP 元分析（38 项实验、66 组对照，d=0.41）与自我教学假说实验（Share 1995）双支撑（随 S-01、S-04 口径）。
  status: 定版
- id: TEC-S02
  name: 记一个词，就把它的字母和声音一段一段对上号。
  zone: 拼读区
  pain_point:
  - 记不住
  when: 记不住——看词卡背整词，换个字体、换成大写就不认识；背了忘、忘了背。
  steps:
  - 拿一个要记的词，先读出声；
  - 用手指逐段划过字母，说出每段对应的音；
  - 说出词的意思，并用它说一句和自己有关的话；
  - 盖住词，凭记忆写出来；
  - 打开对一对，哪一段没对上号，就只重练那一段。
  mechanism: 用字母—音素连接把拼写逐段绑定到读音上，词就以「拼写—读音—意义」三位一体进入长时记忆，成为一眼认出的熟词；只看外形记的词换了字体就认不出（S-02 正字法映射）。
  linked_laws:
  - S-02
  cross_refs: []
  order_hint: 全程适用（进阶用于攻克长词、学术词的记忆）；每词剂量取条目机制本身（逐段绑定），单次词数剂量待定。
  self_check: 一个词隔天听写能写对，并且换成大写或另一种字体照样认得。
  misuse_warning: 映射以音素分割能力和字母知识为前提，两者未备时强推无效（S-02 边界）；不规则词只有个别字母不合规（如 sword 只有 w 不发音），其余部分照样对号，不要整词死背。
  evidence_note: 机制定版级——Ehri 四十年认词研究的总结性论文（2014）核心主张（随 S-02 口径）。
  status: 定版
- id: TEC-S03
  name: 最常见的词练到一眼认出；不讲规矩的那一小截，单独用心记。
  zone: 拼读区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——the、said、was 这类每页都出现的词还逐个拼，读速被拖死；拼写默写总在固定几个词上丢分。
  steps:
  - 从自己的课本和分级读物里挑出最高频的一小批词（不直接进口国外词表）；
  - 先按拼读规则读它，规则管得着的部分照常拼；
  - 用笔圈出不合规矩的那一小截（如 said 里读 /e/ 的 ai）；
  - 只对那一截走五步：看清→念出声（难点故意念出声）→盖住→凭记忆写→逐字母查对；
  - 隔日复现，写错再来一轮。
  mechanism: 高频词占文本大头，直认它们才腾得出速度；而「直认」的真实机制不是背词形照片，是正字法映射——规则部分照常拼读、只把不规则截段「用心记住」（heart words），要背的量缩到最小（S-25）；五步循环中「盖住后凭记忆写」把再认改造成提取练习，查对步给出逐字母即时反馈（S-24）。
  linked_laws:
  - S-25
  - S-24
  cross_refs: []
  order_hint: 先行：主用；进阶：仅补漏仍不熟的高频词。词表须按自家课标词表与分级读物重排（S-25 边界）；每轮词数宜少、隔日复现，具体词数剂量待定。
  self_check: 读一页新课文，圈出的这批词不用停顿就能读过去；隔日听写这批词全对。
  misuse_warning: 直认快线是拼读主线的并行件，不是替代品——把几百个词全做成闪卡背形状、挤掉拼读，恰是阅读科学批评的老做法（S-25 边界）；完全合规则的词不要用五步循环逐词背，那是浪费（S-24 边界）。
  evidence_note: 中——清单本身为频率工具（Dolch/Fry 数十年课程存续，覆盖率数字为课程界通行说法、未溯原文）；机制部分据 S-02 定版；五步循环为英国小学教学传统标准件，未定位到单一原始文献（随 S-24、S-25 口径）。
  status: 定版
- id: TEC-S04
  name: 合规矩的词靠规律生成，变脸的词进名单；大一点再追问「这个怪拼写记着哪门亲戚」。
  zone: 拼读区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——ea、ough 一类对应乱成一团，学生要么编口诀硬套、要么整词乱背；拼写总在「变脸词」上出错。
  steps:
  - 先用最稳的一批字母—声音对应读、写词（主线，不停）；
  - 遇到对应不稳的词，不编口诀，把它放进自己的「变脸名单」，逐个记（小学线到此为止）；
  - 初中起，挑名单里有亲戚的词追问一句：它和哪个词是一家人（如 sign—signal、heal—health）？
  - 用「词和」验一验结构（如 do + es → does），把拼写写成构件加法式；
  - 验不通的，老实留在名单里逐个记，不硬编来历。
  mechanism: 字母—声音对应是「多半如此」的统计倾向——高一致性对应做主线、低一致性项目做显性例外名单，比编造统一口诀更符合语言事实（S-06）；而拼写同时编码声音、意义与来历，同一词素在亲戚词里保持同一写法，「变脸」多半是只按声音看才显得无理（S-21）。
  linked_laws:
  - S-06
  - S-21
  cross_refs: []
  order_hint: 路线分段，不许混成无立场的一条——先行：走 S-06 名单线（先教最稳的一批，其余进变脸名单逐个记，名单随进度滚动更新）；进阶：名单线保留，叠加 S-21 词和线（词族追问、词和验证）作为词族学习工具。剂量待定。
  self_check: 拿到一个拼错的词，能先判断它属于「规律没用对」还是「本来就在变脸名单上」，并说出名单里的词靠什么记住（逐个记 / 亲戚词）。
  misuse_warning: 两条线是学界真实分歧（S-06 与 S-21 并存登记）：名单线后盾是系统合成拼读的大规模综述传统，证据等级高；词和线（SWI）的语言学描写成立，但针对 SWI 本身的干预研究迄今稀少、多出自倡导者团队，不得把两条线说成已合并的共识（S-21 边界）；词和须用真构件，形似字母串未必是真词根，不许类推编造。
  evidence_note: 分歧并存级——S-06 侧：高（Castles, Rastle & Nation 2018 等综述传统）；S-21 侧：描写层面为语言学共识，教学方案（SWI）干预证据有限（随 S-06、S-21 口径）。
  status: 定版
- id: TEC-S05
  name: 长词不硬读——先切成小块，看每块长什么样，再定元音怎么读。
  zone: 拼读区
  pain_point:
  - 读不快
  when: 读不快——一见多音节长词就卡住、跳过或瞎猜，阅读流利度被长词截断。
  steps:
  - 把长词按音节切成小块；
  - 逐块看形状：被辅音关门的（闭）读短音、敞口的（开）读长音、尾巴有不出声 e 的前面元音读长音、两个元音手拉手的读一个音、元音跟 r 的归 r 管、辅音加 -le 收尾的单独成块；
  - 按每块的读法拼出整词；
  - 放回句子里读一遍，看意思通不通；
  - 切法拿不准的块（如 tiger/camel 型），两种切法都试一下，选意思通的。
  mechanism: 六种音节类型是 Orton-Gillingham 传统定版的「元音读法预测表」——先切分、按型定元音、再拼合整词，把「对应是统计倾向」这一事实组织成学生可操作的查表流程（S-22）。
  linked_laws:
  - S-22
  cross_refs: []
  order_hint: 前段后期、进阶适用；剂量待定（随多音节词阅读量使用）。
  self_check: 给一个没学过的多音节词，能先切块、再逐块说出元音读法，最后读出整词并说出大意。
  misuse_warning: 六型给的是每型的默认读法，不是铁轨——VCV 切分等位置仍需两试（S-22 边界）；「要不要让学生显性背诵类型名」学界未有定版裁决，六型至少是教师侧的组织图与纠错语言，学生侧是否背术语按课时裁量，不写成铁律。
  evidence_note: 传统文献级——OG 课程体系内部定版分类，内容层与 S-01/S-06 拼读证据不冲突；争议在「类型标签」这一组织形式本身，未有定版裁决（随 S-22 口径）。
  status: 定版
- id: TEC-S06
  name: 不背拼写，先分堆——按声音分、按长相分、按零件分。
  zone: 拼读区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——拼写规则听讲时懂、自己写时错，规则和词之间对不上号。
  steps:
  - 拿一堆正在学的词卡，先按「中间发音一样不一样」分堆；
  - 再换一把尺子，按「长得像不像一家人」重新分；
  - 再按「是不是同一个零件拼的」分第三遍；
  - 每分完一遍，说一句自己发现的规律（哪堆词有什么共同点）；
  - 把最容易分错的几个词单独留下来，用 TEC-S03 的五步循环攻。
  mechanism: 单词分类（word sort）强迫学生亲手做特征对比，在归类中自己撞见正字法规律——分类活动是《Words Their Way》发展性词研究体系的核活动，配套程序是先测定位、按「正在用但用错」的层施教（S-23）。
  linked_laws:
  - S-23
  cross_refs:
  - TEC-S03
  order_hint: 全程适用（分堆的尺子随水平升级：先按音、再按形、后按义）；每轮词数与频次剂量待定。
  self_check: 分完堆能说出「这一堆的共同点是……」，并把一个新词放进正确的堆里。
  misuse_warning: 该体系的五阶段与年龄带是美国本土儿童（L1）的发展序列，中国儿童的英语拼写发展受汉语读写经验影响，阶段对应不可直接平移——可借的是「先测定位、按层施教」的程序骨架，阶段细节须以中国学生拼写样本重新校准（S-23 边界）。
  evidence_note: 课程传统级——源出发展性拼写研究传统（Henderson 等），课程存续二十余年；与系统合成拼读在「顺序由谁定」上立场相反，并存登记、不裁决（随 S-23 口径）。
  status: 定版
- id: TEC-S07
  name: 听不懂连贯英语，先学会认出小词的弱式、词尾辅音的「搬家」和懒懒的 /ə/。
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——单词单独都认识，连成句子就听不清；听力里总在 a、the、to 这类小词和词与词的交界处丢信息（如 an apple 听成 a napple）。
  steps:
  - 先单独听几个功能词的强式和弱式，对比着认（听辨为主）；
  - 听短句时专门盯小词：它是不是变小声、变短了；
  - 听两个词连读的地方，注意前一个词的尾巴辅音跑去和后一个词的元音连读；
  - 把没听清的句子慢速重听一遍，逐处标出「这里是弱式 / 这里辅音搬家了」；
  - 再按原速听，确认能跟上。
  mechanism: 功能词在句子里多半读弱式（元音弱化、时长缩短），听不清小词多半不是生词问题、是没认出弱式（S-09）；英语音节「有头无尾」，词尾辅音加词首元音在语流中重新切分，连贯语流的音串必然不同于逐词念（S-12）；非重读音节的元音大多缩水成 /ə/，它是弱读系统的总出口（S-08）。
  linked_laws:
  - S-09
  - S-12
  - S-08
  cross_refs: []
  order_hint: 前段后期、进阶适用（前段以听辨认出为目标）；重听次数等具体剂量待定。
  self_check: 听一句没学过的对话，能标出至少一处弱式小词和一处连读交界，并复述句子大意。
  misuse_warning: 本条只练**听辨**——弱式是语流中的默认，不是必须：慢速朗读、逐词听写、强调对比时用强式完全正确（S-09 边界）；连读也不是每处必连，停顿、强调时不发生（S-12 边界）。**产出口径已裁定（裁定 A，2026-11-02 定版）**：产出只要求 LFC 核心（多数辅音到位、元音长短对比、核重音）；弱式、连读的产出「认识即可」——听辨要练到认得出，产出不练不测（Jenkins 将弱式列为非核心，与弱读教学传统取向相反，S-09 分歧，课程层已按此定版）。本条据此不提弱式/连读的产出要求。
  evidence_note: 教材共识级——英式语音学（Roach、Gimson/Cruttenden 传统）与国内王桂珍《英语语音教程》的标准描写（随 S-08、S-09、S-12 口径）。登记：本条原挂「产出取向待裁定」封存，2026-11-02 按裁定 A 定版解封（听辨全教、产出只要求 LFC 核心、弱读产出认识即可）。
  status: 定版
- id: TEC-S08
  name: 先分清自己是「听不出词」还是「意思没搭起来」，再把六种听法配齐。
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——听力练了很久不见好，因为练法只有一种（做精听题）；有的学生词都听到了却不懂意思，有的学生是根本切不出词，两种病吃同一种药。
  steps:
  - 拿一段没听懂的材料做一次分诊：是词切不出来（低层问题），还是词都听到、意思没搭起来（高层问题）；
  - 低层问题多配精听：短材料逐句抠、听写核对；
  - 高层问题多配选听和回应听：先抓指定信息，听完说一句自己的看法；
  - 每周留出泛听时间：自选爱听的材料，低压大量听，不做题；
  - 和同伴做互动听：听对方说、要回应、听不懂就问清楚。
  mechanism: 听懂是听者在脑子里补全并共同建构说话人的意思，听力困难因此分两种——低层切分失败与高层建构失败，诊断与训练方法完全不同（TM-08）；Rost 的六类听力活动（精听、选听、互动听、泛听、回应听、自主听）各有不同加工重心，框架的用法是配比审计：只有精听题的课程，六格空了五格（TM-09）；儿童听不懂整句时靠线索猜、靠做中学，是高层建构的学生侧形态（YL-02）。
  linked_laws:
  - TM-08
  - TM-09
  - YL-02
  cross_refs: []
  order_hint: 先行：分诊与配比由教师/家长执行，学生执行各格活动，「自主听」降格为在有限菜单中自选（TM-09 边界）；进阶：学生可自做分诊与周配比。六格的具体时长配比，源条目未给数字，剂量待定。
  self_check: 能说出自己最近一次听不懂属于哪一层问题，并且这一周的听力练习里至少出现过四种听法。
  misuse_warning: 层级是诊断框架，不意味着加工严格串行（TM-08 边界）；对小学儿童，低层（语音切分）权重通常更高，高层补偿能力弱于成人，配比须调整（TM-08 边界）；泛听的证据强度在听力子领域内仍有争议，本条只取其「以量促自动化」的定位，不承诺效应量（TM-09 分歧）。
  evidence_note: 框架级——Rost《Teaching and Researching Listening》的加工层级模型与活动类型学，与同行模型大体对应、属领域共识层面框架；清单对该书的接触等级为目录级（随 TM-08、TM-09 口径）。
  status: 定版
- id: TEC-S09
  name: 听到一句话，先想它在「干什么活」，再想它的字面意思。
  zone: 表达写作区
  pain_point:
  - 听不懂
  - 说不出
  when: 听不懂、说不出——把「你能把盐递给我吗」当成能力提问来回答；对话练习里字面全对、意思全错，答非所问还不自知。
  steps:
  - 听对话时先给每句关键话标一个「活」：请求、道歉、邀请、感谢，还是单纯陈述；
  - 听见问句形式的话，先问一句：他是真问，还是在请我做事；
  - 对方好像答非所问时，别急着判他乱答，想想他是不是在用绕弯的方式回答；
  - 轮到自己回应时，按对方的「活」来接，不按字面接；
  - 练完复盘一轮：哪句的「活」判错了。
  mechanism: 说话在传递信息之外都在执行一个动作，判断一句话先看它做的事成没成、合不合场合（E-01）；间接言语行为用询问能力的外壳包装请求，听者靠共享的会话逻辑推断真实意图（E-02）；表面违反会话准则时，听者反推言外之意——理解「话里有话」靠的就是这台推理机（E-03）。
  linked_laws:
  - E-01
  - E-02
  - E-03
  cross_refs: []
  order_hint: 前段后期、进阶适用；剂量待定（随对话材料量使用）。
  self_check: 听一段新对话，能说出每句关键话在干什么活，并对一句间接请求作出合用意的回应（动手做，而不是回答「能/不能」）。
  misuse_warning: 间接不是永远更好——紧急场合、亲密关系、明确指令场合直接表达才得体（E-02 边界）；四准则的解读方式有文化差异，对学生只取「想想他为什么这样说」的推理习惯（E-03 边界）。
  evidence_note: 理论经典级——Austin/Searle 言语行为理论与 Grice 合作原则，语用学奠基框架（随 E-01、E-02、E-03 口径；E-03 另有后世理论之争，不影响启蒙框架使用）。
  status: 定版
- id: TEC-S10
  name: 发音练习按「听不听得懂」排队：先补汉语里没有的音和最容易听岔的地方。
  zone: 表达写作区
  pain_point:
  - 说不出
  - 听不懂
  when: 说不出（说了听不懂）——每个音节一样用力、词尾辅音吞掉、think 说成 sink，句子说完对方一脸茫然，却不知道先改哪儿。
  steps:
  - 先练听：在录音里找出一句话里哪个词被说得最重（那是说话人的重点），听得出才谈得上说得出；
  - 拿一份「汉语里没有」的难点清单逐项对：/θ ð v/、词尾辅音群、不重读就弱化；
  - 每次只挑两三处练：跟读时故意把句子的重点词说重、把词尾辅音说全；
  - 录下自己读的句子，请同伴或家人听写，听错的地方就是下一轮的靶子；
  - 没被听错就过，听错了只重练那一处。
  mechanism: 真正导致听不懂的发音问题集中在一小撮特征上（多数辅音是否到位、元音长短对比、核重音），把练习时间按「对听懂的影响」排序是理性分配（S-13）；中国孩子的难点可按汉英音系对比逐项列出、逐项击破——没有的音、没有的弱读、没有的词尾辅音群（S-14）；句重音是说话人「划重点」的工具，听者靠它定位新信息（S-11）。
  linked_laws:
  - S-13
  - S-14
  - S-11
  cross_refs: []
  order_hint: 全程适用；每次聚焦的难点数取条目「逐项击破」的口径（两三处为课堂惯例性安排，非条目数字），总剂量待定。
  self_check: 录一段自己读的句子，不看原文的人能听写出八成以上，且能指出句中被重读的重点词。
  misuse_warning: '**产出口径已裁定（裁定 A，2026-11-02 定版）**——本条按「听不听得懂」排序的口径即裁定 A 的产出标准：产出只要求 LFC 核心，弱读产出认识即可、不练不测。S-13 的可懂度优先出自「以国际交际为目标」的场景；若目标含国内考试听力与朗读评分，标准音特征仍在评分范围内，两条标准须分开声明，不得拿本条给学生「发音随便学」的错觉（S-13 边界）。难点清单用于排练习优先级，不用于给学生的发音贴标签（S-14 边界）；词重音是词汇属性须逐词记，与句层焦点重音别混练（S-11 边界）。'
  evidence_note: 争议级——Jenkins 的 Lingua Franca Core 是发音领域被引与争论最多的清单之一，其核心清单的证据规模、把词重音排除在外是否合理，自发表起即受批评，且与 S-09 弱读传统正面冲突；本条只作「目标排序」参照，取舍已经裁定 A 定版（2026-11-02：产出只要求 LFC 核心、弱读产出认识即可；随 S-13 口径）。难点清单部分为对比分析与本土实证口径（S-14）。登记：本条原挂「产出取向待裁定」封存，2026-11-02 按裁定 A 定版解封。
  status: 定版
- id: TEC-S11
  name: 拿起一本英文书，先搞清从哪页起、往哪边读、一个词是一个词。
  zone: 拼读区
  pain_point:
  - 读不快
  when: 读不快——刚开始读英文书的孩子指读方向乱、把图画当内容、不知道词与词之间要分开，认字再多也读不成句。
  steps:
  - 翻开书先找「故事从哪里开始」，用手指着第一行第一个词；
  - 从左往右、从上往下读，读完一行手指拐回来扫下一行；
  - 读的时候只指字、不指画，说一句「画是帮忙的，字才是讲故事的」；
  - 遇到不认识的词，先看它开头和结尾的字母，不整词跳过；
  - 读完一页，自己讲一遍刚才读了什么。
  mechanism: 印刷概念（书的正反面与页序、阅读方向、文字而非图画承载内容、词有界、词由字母按序构成）是阅读行为的先行组织框架——孩子先把口头语言与页面符号的对应建起来，解码与理解才有地方安放（NE-22）。
  linked_laws:
  - NE-22
  cross_refs: []
  order_hint: 仅起步期适用；进阶不适用（该阶段组织框架应已建成）。剂量待定（随共享阅读进行）。
  self_check: 给一本没读过的绘本，孩子能自己找到开头、按正确方向指读完一页，并指出「词」和「画」的区别。
  misuse_warning: 印刷概念测的是「懂不懂书的规矩」，不是阅读能力本身，会指读不等于会读（NE-22 分歧语境）；该框架按英语字母文字提炼，施测材料与常模不能直接套用新西兰版本（NE-22 边界）。
  evidence_note: 标准化观察工具级——Clay 的 Concepts About Print 观察任务是英语国家使用最广的早期读写评估工具之一，入学初得分预测后续阅读成就有多项研究支持；注意不得用其公认地位为 Reading Recovery 背书（随 NE-22 口径，RR 争议见覆盖说明）。
  status: 定版
- id: TEC-S12
  name: 读不懂一篇文章，先分清卡在「认词」还是「理解」，再决定练什么。
  zone: 表达写作区
  pain_point:
  - 读不快
  when: 读不快——文章读完不知道讲了什么，又分不清是词认得慢、还是句子意思本来就不懂，练习全使在错的地方。
  steps:
  - 挑一篇文章先出声读一遍，数一数卡壳、读错的地方多不多；
  - 把同一篇文章请人读给自己听（或听录音），看能不能听懂；
  - 听能懂、自己读不懂——问题在认词，回去练 TEC-S01/S13 的认词线；
  - 听也听不懂——问题在语言理解，去补词汇和句子的意思，不在读法上死磕；
  - 两边都弱的，先补认词（低段通常认词是瓶颈），再回头查理解。
  mechanism: 阅读理解是解码与语言理解的乘积，任一项接近零，理解就接近零（S-07）；阅读困难的归因必须先分层——低层（认词慢、词汇量小）与高层（不会抓主旨、不会推理）的药完全不同（TM-10）。
  linked_laws:
  - S-07
  - TM-10
  cross_refs:
  - TEC-S01
  order_hint: 前段后期、进阶适用（起步期的分诊由教师/家长代做）；剂量待定（每次读不顺时执行）。
  self_check: 读完一篇读不懂的文章，能明确说出「我卡在认词 / 卡在意思」，并选对下一步练什么。
  misuse_warning: 小学低段解码通常是瓶颈项，优先补拼读是对的——本条反对的是把瓶颈项当全部，不是降低拼读优先级（S-07 边界）；双层是分析框架，真实阅读中两层高度交互，分层只为诊断与教学分工（TM-10 边界）。
  evidence_note: 框架共识级——简单阅读观（Gough & Tunmer 1986 公式）与 Grabe 双层架构，与阅读科学主流机制同向（随 S-07、TM-10 口径）。
  status: 定版
- id: TEC-S13
  name: 选难度刚好的短文，反复读到顺、读到快，让认词变成不用想的事。
  zone: 拼读区
  pain_point:
  - 读不快
  when: 读不快——每个词都要在心里拼一下，读完一句忘了上一句，意思永远拼不起来。
  steps:
  - 选一篇词基本都认识、只有少量生词的短文；
  - 先通读一遍，把生词的意思弄清；
  - 同一篇再读两三遍，第二遍求顺、第三遍求又顺又快；
  - 读的时候用手指或书签压住已读部分，不回头逐词指；
  - 换一篇同难度的新短文，试试上一轮练出的速度能不能带过来。
  mechanism: 工作记忆容量有限，认词每多耗一份资源，理解就少一份——低层词识别必须练到自动，高层理解才有资源运行；流利度本身因此是阅读教学的目标之一（TM-10、TM-11 第 4 项「练流利」）。
  linked_laws:
  - TM-10
  - TM-11
  cross_refs: []
  order_hint: 全程适用。每篇重复遍数源条目未给数字，剂量待定；不得用源条目中「约 230 毫秒认一个词」的成人流利读者量级当儿童达标指标（TM-10 边界明示）。
  self_check: 同一篇短文，第三遍比第一遍明显少卡壳，且读完能说出大意。
  misuse_warning: 理解策略教得再好，认词未自动化，策略没有运行的资源——但反过来，只练速度不顾理解同样落空，两层要配比（TM-10 分歧与边界）；选文太难（生词成片）时自动化无从发生，先降难度再练。
  evidence_note: 框架+综述级——Grabe 二语阅读权威综述的双层架构与七项教学含义之一；清单对该书接触等级为目录级+作者自述级（随 TM-10、TM-11 口径）。
  status: 定版
- id: TEC-S14
  name: 读一篇文章，先用一句话抓出大意、认出它是什么「体」，再回头找细节。
  zone: 表达写作区
  pain_point:
  - 读不快
  - 说不出
  when: 读不快——从第一个词读到最后一个词，细节题会做、主旨题全错；读完说不出这篇到底讲了什么。
  steps:
  - 先看标题和每段第一句，用一句话说出全文大意；
  - 认一认这篇是什么体：讲故事的（谁、出什么事、怎么收尾）、说明事物的（先分类、再分着说）、讲步骤的（一二三四）；
  - 带着大意再读一遍，细节往骨架上挂；
  - 读完合上书，用自己的话把骨架复述一遍；
  - 细节题答不出时，回到对应阶段的那一段找，不满篇乱翻。
  mechanism: Grabe 七项教学含义中专列「抓主旨」与「篇章结构意识」两项——文章的组织骨架可教、且能迁移到新文本；专门练抓主旨，而非只答细节题（TM-11 第 2、3 项）。
  linked_laws:
  - TM-11
  cross_refs: []
  order_hint: 进阶为主用；前段后期可降格为故事类骨架（谁—出事—解决）的口头版。剂量待定。
  self_check: 读完一篇新文章，能先说出一句大意、指出它的结构段，再回答细节题。
  misuse_warning: 七项含义的排序是作者讲演的呈现序、非重要性权重序；其中「策略型读者」一项的独立证据强度弱于大量阅读与词汇两项，本条只取抓主旨与篇章结构两项，不打包承诺七项同等有效（TM-11 分歧与著录说明）。
  evidence_note: 中——篇章结构意识与主旨教学各有独立干预研究传统支撑（随 TM-11 口径）。
  status: 定版
- id: TEC-S15
  name: 每天留一段「自己挑书、大量读」的时间，读得轻松、读得量大。
  zone: 表达写作区
  pain_point:
  - 读不快
  - 记不住
  when: 读不快、记不住——只读课本和练习册里的短文，阅读总量太小，认词自动化和语感都没有机会长出来。
  steps:
  - 从一批难度偏易的书里自己挑想读的（读着基本不卡）；
  - 每天定时读一段时间，只求读完、读懂大意，不查每个生词；
  - 读完在本子上记一行：书名、大概讲什么；
  - 一本读完接着下一本，同系列连着读更容易；
  - 遇到反复出现的生词，读完后统一查一次。
  mechanism: 大量阅读在 Grabe 七项含义中被设为课程要件而非课外自愿——它供给认词自动化与理解系统所需的总量（TM-11 第 6 项）；与自我教学机制互锁：阅读量不足时，拼对生词的自教机会也无从发生（S-04 边界）。
  linked_laws:
  - TM-11
  - S-04
  cross_refs:
  - TEC-S13
  order_hint: 全程适用。源条目未给每日时长数字，剂量待定（只取「设为固定要件、每天执行」的定位）。
  self_check: 一周下来记录本上有每天的阅读行，且能说出每本的大意；月末回看，读书速度比月初快。
  misuse_warning: 选文须偏易——生词成片时泛读退化为查词典；泛读是课程要件，但不替代精读与拼读教学（与 TEC-S13 分工）。
  evidence_note: 中—强——大量阅读有独立干预研究传统，TM-11 将其列为七项含义之一；其阅读版证据强于听力泛听（随 TM-11、TM-09 口径）。
  status: 定版
- id: TEC-S16
  name: 问候、点餐、道别这类话，整句背下来整句用，想变化只换其中一小块。
  zone: 表达写作区
  pain_point:
  - 说不出
  when: 说不出——每句话都逐词现拼，又慢又容易拼出语法没错、但母语者不那么说的句子；开口前在心里组装半天。
  steps:
  - 挑一批日常整句（问候、请求、道别、点餐），整句听、整句跟读、整句记住；
  - 开口时整块往外拿，不逐词拼；
  - 想说新意思时，只换整句里的一个槽位（如把 "Can I have some water?" 里的 water 换成 juice）；
  - 换槽位换出的新句，先自己念一遍确认顺口；
  - 把总换错的槽位记下来，单独练那一处。
  mechanism: 日常句子是整块从记忆里取出来的程式化序列，整存整取省加工、保地道；学习者凡事逐词拼装，既慢又易拼出语法没错但母语者不说的句子（E-04）。
  linked_laws:
  - E-04
  cross_refs: []
  order_hint: 全程适用；整句清单的条数剂量待定。
  self_check: 日常场景里（如向老师请求、向同伴道别）能不迟疑地整句说出，并能当场换一个槽位造出一句新的。
  misuse_warning: 整块存取解决流利与地道，不解决创造性表达；块内结构最终仍需分析——只背整块不拆槽位，会卡在原句上（E-04 边界）。
  evidence_note: 实验支持级——程式化序列的加工速度优势有语料库与心理语言学实验支持（Conklin & Schmitt 2008 等，随 E-04 口径）。
  status: 定版
- id: TEC-S17
  name: 词想不起来时绕过去，说错了先自己重说一遍，不停下来等纠正。
  zone: 表达写作区
  pain_point:
  - 说不出
  when: 说不出——一个词卡住，整段对话就停摆；说错一句就慌，等着老师纠正，不敢往下说。
  steps:
  - 随身备三句求生句：How do you say…? / I mean… / It's like a…，卡住先掏出来用；
  - 词想不起来，换一个简单的说法把意思说圆（说不出 scissors，就说 the thing we cut paper with）；
  - 实在不行，用手势、指实物帮一把，话先说完；
  - 发现自己说错了，先停顿一下自己重说一遍改对，再继续；
  - 对话结束后，再回头把卡住的词查出来补上。
  mechanism: 策略能力把「补救」定义为能力本身——换述、迂回、求助是母语者天天在用的过坎方式，储备求生句能降低开口焦虑与交际中断（E-11）；Bygate 的技能框架同样为顺畅化与补偿手段正名：绕过去不是作弊，是口语生产技能的合法部件（TM-12）；会话的修复组织有系统偏好——自我发起、自我完成的修复优先于他人纠正（E-15）。
  linked_laws:
  - E-11
  - TM-12
  - E-15
  cross_refs: []
  order_hint: 全程适用（前段先练求生句与换说法，自我修复随口语量渐进）；剂量待定。
  self_check: 一次对话里至少出现一次「卡住—绕过去—说完」的完整过程，且有一次说错后自己改对、没停下来等人纠正。
  misuse_warning: 策略是过桥工具，不能代替词汇与句型的积累——全靠比划绕不过考试与精确表达场合（E-11 边界）；自我修复只解决「已经会、说错了」的问题，系统性不会的项目仍需教学介入，不能拿本条当「从不纠错」的借口（E-15 边界）；教学上应奖励「想办法说成」的成就策略，不奖励避谈、简化目标的缩减策略（TM-12）。
  evidence_note: 框架级——Canale & Swain 策略能力定义、CA 修复偏好（跨语言复现最稳的结构发现之一）与 Bygate 技能框架三方同向（随 E-11、E-15、TM-12 口径）。
  status: 定版
- id: TEC-S18
  name: 请人帮忙先看事大事小——小事直接说，大事先垫话、改商量、留台阶。
  zone: 表达写作区
  pain_point:
  - 说不出
  when: 说不出（说了不合场合）——对老师、陌生人也用命令式开口（"Give me the book."）；或者对好朋友也过度客气，显得见外。
  steps:
  - 开口前先掂量三样：和对方熟不熟、对方是不是长辈/老师、这件事麻烦不麻烦；
  - 小事、熟人：直接说请求；
  - 事大或不熟：先垫一句（Excuse me. / Sorry to bother you.）；
  - 把命令句改成商量问句（Could you…? / Would you mind…?）；
  - 被拒绝时不僵住，接一句没关系的话收尾。
  mechanism: 请求类行为天然占对方的便宜，说话人按社交距离、权力差、事情大小三个变量估算分量，分量越大越用间接、商量、致歉开场等缓冲策略——英语情态问句成为默认请求式，正是这套权衡的规约化结果（E-07）。
  linked_laws:
  - E-07
  cross_refs: []
  order_hint: 进阶为主用；前段后期可先练「对老师和陌生人用商量问句」的简单版。剂量待定。
  self_check: 同一个请求（如借橡皮 vs 请老师帮忙改作文），能当场说出客气程度明显不同的两个版本，并说清为什么不一样。
  misuse_warning: 三变量的估算方式因文化而异（中国文化中年龄、辈分权重更高），公式是启发模型不是计算器；亲密关系中过度客气反而疏远（E-07 边界）。语用失误分两类、治法不同：形式拿错的靠教规约用法，场合判错的靠解释场合逻辑——本条主要治后者（E-06）。
  evidence_note: 理论经典级——Brown & Levinson 礼貌理论是语用学被引最多的框架之一；其普适性受东亚学者批评、本土另有顾曰国礼貌五准则框架，两说并置，本条只取「客气随场合滑动」的共识部分（随 E-07 口径）。
  status: 定版
- id: TEC-S19
  name: 说一句话之前先对号：谁在说、对谁说、上一句说了什么；接话要接得上对方发的「球」。
  zone: 表达写作区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完（对话层面）——对话练习里答非所指、问候后没下文、"The same to you" 用在没有上文的地方，句子单看没错、放在对话里全错。
  steps:
  - 开口前默过三问：现在是我以什么身份说？对谁说？上一句他说了什么；
  - 听清对方发的是哪种「球」：问候、提问、邀请还是告别；
  - 按对子接球：问候回问候、提问给回答、邀请给接受或婉拒；
  - 回答里要回指上一句的内容（用上 too、也、同样的话），不另起炉灶；
  - 练完和同伴互相挑一轮：哪句接错了对子。
  mechanism: 得体性是关系判断不是形式判断——同一句话由不同角色说、对不同人说、在不同上文后说，对错完全不同（E-08）；对话由成对的话轮组织（问候—问候、提问—回答），第一部分一出现就对第二部分形成条件相关，该答不答本身就成了信息（E-13）。
  linked_laws:
  - E-08
  - E-13
  cross_refs: []
  order_hint: 全程适用（前段先练「谁在说、对谁说」，回指类稍后，E-08 边界）；剂量待定。
  self_check: 一段四轮对话里，每句回应都能指出它接的是上一句的哪个「球」，且至少有一句正确回指了上文。
  misuse_warning: 三问管「合不合场合」，不管语法对错，两条线别混（E-08 边界）；相邻对是「预期」不是死法——拒答、岔开都是带着含义的合法偏离，但须先掌握默认对型，才谈得上偏离的含义（E-13 边界）。
  evidence_note: 框架级——Hymes 得体维与 Canale & Swain 社会语言能力是交际教学范式的立论根基；话轮与相邻对出自会话分析奠基论文（Sacks 等 1974）（随 E-08、E-13 口径）。
  status: 定版
- id: TEC-S20
  name: 讨论之前先约法：人人开口、说想法带理由、可以不同意但要好好说、最后一起定。
  zone: 表达写作区
  pain_point:
  - 说不出
  when: 说不出——小组讨论不是抢着吵，就是齐声附和，没人真正把想法拿出来检验；轮到发言的人没话可说。
  steps:
  - 第一次小组讨论前，全组（或全班）先一起定下谈话规矩，写下来贴在桌上；
  - 讨论时每说一个想法，后面带一句理由（because…）；
  - 不同意时，先复述对方的想法，再说自己的不同意见；
  - 决定前，把桌上的几个方案都过一遍再选；
  - 讨论完花一分钟自评：刚才我们是吵、是附和、还是真的一起想了。
  mechanism: 小组谈话分三型——争执型、累积型（附和堆叠）、探索型（质疑附理由、方案摆上桌、知识对全组公开负责）；未经教导时探索型占比很低。谈话的型式本身就是思维的型式，先学会跟人一起这样想，才学会自己这样想（NE-24）；Thinking Together 的做法是先由师生共同协商出基本规则、再用到各学科任务里，并周期性回头反思（NE-25）。
  linked_laws:
  - NE-24
  - NE-25
  cross_refs: []
  order_hint: 前段后期、进阶适用；起步期规则要减量并图示化（NE-25 边界）。规则协商的课时为学期初的少量投资（NE-25 边界），具体节数剂量待定。
  self_check: 一次讨论中，每个人至少说出一个带理由的想法，且出现至少一次「先复述、再不同意」的回合；自评时全组能一致指出刚才属于哪一型谈话。
  misuse_warning: EFL 条件下想探索却没词是真实瓶颈——谈话句框（I think… because… / I agree, but…）必须先于谈话规范到位，否则规则空转成中文讨论或沉默（NE-24 边界）；中国课堂先解决面子与安全感问题，可先借「能分辨自己组在吵、附和还是真讨论」这一点起步（NE-24 边界）。
  evidence_note: 干预评估级——原始干预研究（Wegerif, Mercer & Dawes 1999：推理语言特征增至约四倍、Raven 成绩相对提升）及小学科学课复制；并有香港小学英语课堂的完整实施评估（Liang & Fung 2020，125 名小学生）作为东亚 EFL 可行性证据（随 NE-25 口径）。
  status: 定版
- id: TEC-S21
  name: 找一个搭档，各拿一半信息，靠开口问答把图拼全。
  zone: 表达写作区
  pain_point:
  - 说不出
  when: 说不出——课堂开口总是背现成对话，没有「不说就不行」的场合；和同伴说英语时各说各的，不互相回应。
  steps:
  - 两人各拿一张不同的图或表（对方的看不见）；
  - 轮流用英语描述自己这半张、向对方提问补齐他那半张；
  - 没听懂时不跳过：请对方重复、换个说法，或自己复述一遍核对；
  - 拼完后两人对图检查，哪儿对错了；
  - 交换角色再来一遍（或换一对新图）。
  mechanism: 儿童在结对任务中大量使用自我重复与他人重复推进对话，非母语同伴结对时把对方看作共同解题者，反而产出更多修正后输出；低水平儿童也能在重复版任务中做同伴纠正（YL-04）；信息差活动是口语任务谱系的第一类——双方各持对方没有的信息，必须开口才能拼全，是互动技能的最低成本发生器（TM-13）。
  linked_laws:
  - YL-04
  - TM-13
  cross_refs: []
  order_hint: 全程适用；剂量待定（随课堂结对任务量）。
  self_check: 一轮活动下来，两人能把图拼对八成以上，且过程中出现过至少一次「没听懂—澄清—说对」的完整回合。
  misuse_warning: 支撑证据多来自 ESL（目标语环境）儿童，外推到课时量低的 EFL 课堂须谨慎（YL-04 边界）；同伴支架质量低于教师支架，需要任务设计（信息差、明确分工）托底——「放孩子自己讨论」本身不是支架（YL-04 边界）。
  evidence_note: 综述级——Pinter (2015) 综述的儿童任务实验群（Oliver；Mackey 等多项对照研究）（随 YL-04 口径）。
  status: 定版
- id: TEC-S22
  name: 新词新句先别急着说——听指令、做动作，做对了就是听懂了。
  zone: 表达写作区
  pain_point:
  - 听不懂
  - 说不出
  when: 听不懂——刚起步时一听英语就紧张、被催着开口更说不出；具体词（站、跳、拿、放、颜色、身体部位）听音和意思对不上。
  steps:
  - 听老师（或录音）说一条指令，先不说话，马上用身体做出来；
  - 指令从一个动作慢慢加到两三个动作连着做；
  - 边做边听下一遍，把「听到的声音」和「身体的动作」对上号；
  - 做错时看同伴怎么做，自己跟着修正，不用开口解释；
  - 同一批词听做熟了，再试着自己说出指令，让同伴做。
  mechanism: 全身反应法（TPR）类比婴儿学母语的路径：先经历听力理解期，以全身动作回应指令，在「听—做」绑定中建立语音与意义的联结，不施加开口压力；理解基础打牢后口语随后出现（YL-13）。
  linked_laws:
  - YL-13
  cross_refs: []
  order_hint: 仅起步期适用；进阶不适用。单次时长等剂量，源条目未给数字，剂量待定。
  self_check: 连续五条新指令不用看同伴就能独立做对；同批词隔天再听，还能做对。
  misuse_warning: 内容边界明确——抽象词汇、复杂语法、读写技能无法靠动作表达，TPR 只适合起步阶段的听说地基（YL-13 边界）；Asher 的「左右脑」理论包装不被现代证据支持，可保留的只有「与词义紧密绑定的动作促进词汇编码」这一窄结论（YL-13 边界）。
  evidence_note: 有限——2026 年学前运动类语言干预系统综述（PRISMA 2020，纳入 8 项研究）结论为参与度与短期学习正向、但方法学异质且不够稳健，证据几乎只覆盖具体词汇结果；专门针对 TPR 的研究多为小样本、无对照设计，不能作强因果解读（如实标注，随 YL-13 口径）。
  status: 定版
- id: TEC-S23
  name: 学写一种文章走四步：拆一篇 → 指着地图把范文说熟 → 一起写一篇 → 自己写一篇，扶手用完撤掉。
  zone: 表达写作区
  pain_point:
  - 写不长
  when: 写不长——对着空白纸不知道从哪下笔；或者永远套同一个开头，离开句框就写不出来。
  steps:
  - 拿一篇同类范文，先认它的「台阶」：故事是铺垫→出事→解决，说明文是先分类→再分着说，把台阶标在纸上；
  - 把范文画成一张故事地图（图标加箭头），指着地图、配上动作把范文说熟；
  - 全班或小组一起口头商量、共写一篇新的：换人物、换场景，骨架不动；
  - 自己独立写一篇同类的，句框和地图先放在手边；
  - 再写一篇同类的，这次把句框和地图收起来，写完对照检查差在哪。
  mechanism: 语类是「分阶段、奔着社会目的去的做事方式」，阶段与语言特征可分析、可命名——先给文本地图再让学生写（NE-18）；教学循环把支撑量沿「解构→共同建构→独立建构」递减，本质是把学徒制排成课程顺序（NE-19）；Talk for Writing 的顺序赌注是口头语言是书面语言的排练场——能说出来的，才能写出来，其模仿段靠故事地图加全身动作做多通道编码（NE-27、NE-28）；语言一头先借现成的、内容一头自己创造，是初学者的资源分工（W-06）；支架是临时拐杖，撤掉还能写才算学会（W-10）。
  linked_laws:
  - NE-18
  - NE-19
  - NE-27
  - NE-28
  - W-06
  - W-10
  cross_refs: []
  order_hint: 全程适用；起步期可停留在口头三段（说熟→换说→编说），不必落到书面（NE-27 边界）。一个单元的周数：母语课堂原形态约三周，中国课时下须压缩、范文大幅缩短，具体剂量待定。
  self_check: 撤掉句框和地图后，还能独立写出同类文章，且能说出自己这篇走了哪几个台阶。
  misuse_warning: 模仿段在 EFL 课堂极易滑成机械背诵课文——Corbett 的模仿从来是带动作、带地图、带理解讨论的「内化」，不是默写（NE-27 边界）；地图必须由学生参与绘制，教师印好发下去的只剩装饰功能（NE-28 边界）；支架的检验标准是最终能撤掉，「给了句框」不自动算支架（NE-29 的检验标准，经覆盖说明转引）；语类图是脚手架不是模具，阶段清单须按本地任务重绘，不整套照搬（NE-18 边界）。
  evidence_note: 实践框架级——悉尼学派语类教学为四十年田野项目与课堂实践传统；Talk for Writing 的证据基础主要是实践者网络、个案与检查观察，**无 RCT 级证据**，定位为「英国主流课堂实践框架」，不得标为「经实验证明最有效」（随 NE-18、NE-19、NE-27、NE-28 口径）。其「显性教图式压制创造性」的公式化批评与悉尼学派回应并存登记（NE-18 分歧）。
  status: 定版
- id: TEC-S24
  name: 先读一段好文章，再接着它的势往下编——读过的句子会悄悄跑到笔下。
  zone: 表达写作区
  pain_point:
  - 写不长
  when: 写不长——自己写时句子干巴、词汇贫乏；背过的句型到写作文时调不出来。
  steps:
  - 选一段难度合口的文章（读得懂、只有少量生词），认真读完；
  - 合上书先说一遍：故事讲到哪儿了、接下来可能发生什么；
  - 接着原文的结尾往下写，写的时候有意用上刚读到的词和句式；
  - 写完对照原文看一遍：哪些说法是被原文「带」出来的；
  - 隔几天换一段新文章，再续一次。
  mechanism: 人的理解能力天然高于产出能力，续写迫使产出与刚读到的文本在内容与语言上对齐，理解便把产出往上「拉平」；语言必须伴着恰当语境一起学、用，续写恰好让语言粘着语境进入产出（W-05 王初明协同/拉平效应）。
  linked_laws:
  - W-05
  cross_refs: []
  order_hint: 进阶为完整形态（读后续写）；前段用简化形态——看图加短文起头，续写几句（W-05 边界）。每篇长度与频次剂量待定。
  self_check: 续写的段落里能找出至少三处自然用上的、来自原文的词或句式，且故事接得通顺。
  misuse_warning: 效果依赖原文难度与学生水平匹配——原文太难，协同无从发生（W-05 边界）。
  evidence_note: 实证级——续写协同效应有系列实证（王敏、王初明 2014 等）与元分析（任伟、吕晓轩 2021），并已进入高考英语题型设计（随 W-05 口径）。
  status: 定版
- id: TEC-S25
  name: 不把作文当流水线：边想边写边回看；每天写一点；写不下去的地方先圈起来，那就是要补的课。
  zone: 表达写作区
  pain_point:
  - 写不长
  when: 写不长——提笔就从第一句硬写到最后，写完就交；或者一到写作文就发怵，半天憋不出三句。
  steps:
  - 动笔前用一分钟想：写给谁看、主要想说什么；
  - 写的时候允许中途停下来回看、改计划、重写上一句——回环是正常的，不是写坏了；
  - 写不下去时，把卡住的地方圈出来，先跳过去往下写；
  - 写完后专门回头处理圈出的缺口：查词、换句式、或请人帮忙看；
  - 每天都写一点（日记、留言、几句话都行），不攒到作文课才写。
  mechanism: 真实写作中计划、转化、回顾三过程在监控下任意互相嵌入，把写作教成「列提纲→抄正→交卷」的流水线恰恰砍掉了熟手最核心的回环（W-02）；产出被迫进行句法加工，写不出来时学习者会注意到自己知识中的缺口，继而定向捕捉与检验——输出是习得的触发器（W-07）；IES 小学写作指南把「天天写、教过程」列入循证推荐（强证据的过程教学在内）（W-08）；转录（拼写、造句）不自动化会持续抢占工作记忆，基本功须嵌入真实写作练流利（W-12）；青少年段的元分析中，「教写作策略」效应居首（W-09）。
  linked_laws:
  - W-02
  - W-07
  - W-08
  - W-12
  - W-09
  cross_refs: []
  order_hint: 先行：以 W-08 的四件事为纲（天天写、教过程、练基本功、建写作圈），「每天一小时」的原指南时间配比不可照搬中国课时（W-08 边界）；进阶：叠加 W-09 的策略教学形态（计划、修订、编辑的具体策略）。每日字数剂量待定。
  self_check: 一篇作文的草稿上有回环痕迹（改过的计划、重写的句子、圈出的缺口被逐个处理掉）；一周内每天都有写下的东西。
  misuse_warning: 回环不等于没计划——高手的回环带着目标切换，新手的回环常是无目标乱改；教学要给每个环节可用的小策略（W-02 边界）；输出触发注意的前提是已有一定输入储备且任务难度适中，零基础者先给足输入，顺序不可倒置（W-07 边界）；基本功训练脱离真实写作搞纯抄写，量效比低（W-12 边界）。
  evidence_note: 元分析/官方指南级——IES 实践指南（Graham 等 2012，过程教学为强证据推荐）与 Writing Next 元分析（Graham & Perin 2007，策略教学居 11 个有效素之首）跨年龄段互证（随 W-02、W-08、W-09 口径；W-09 样本以高年级为主，向小学低段外推要降阶）。
  status: 定版
- id: TEC-S26
  name: 第一遍只看「讲清楚没有、读者懂不懂」，第二遍才看字词句对不对。
  zone: 表达写作区
  pain_point:
  - 错不完
  when: 错不完——改作文只会圈错别字和语法点，故事还是讲不清楚；或者衔接词贴了一堆，逻辑却对不上。
  steps:
  - 第一遍把作文读出声，站在读者位置问：我没看过这件事，能看懂吗？哪儿跳了、哪儿缺了交代；
  - 专查一类问题：指代清不清楚（谁、哪一个有没有交代）；
  - 再查路标：每个 first、then、because、but 是不是对准了真实的先后、因果、转折关系，贴错的删掉或换对；
  - 第一遍改完（可加句、调序、删段），才进第二遍：逐句查拼写、时态、单复数；
  - 最后通读一遍收尾。
  mechanism: 专家修改以内容与结构为主、新手以表面纠错为主；先做高层修订的原因很实际——段落可能整段删除或移位，先精修字词等于给要拆的房子刷漆（W-04）；写作撤掉了口头交际的表情、手势、实物兜底，每个信息都要用文字亲手交到读者眼前，指代与顺序不清正是「以写者为中心」的典型毛病（W-01）；衔接词是给读者的路标，必须对准真实的逻辑关系，贴错地方比没有更糟（W-14）。
  linked_laws:
  - W-04
  - W-01
  - W-14
  cross_refs: []
  order_hint: 前段后期、进阶适用；起步期的「修订」只落到加一句、调顺序等微动作（W-04 边界）。剂量待定。
  self_check: 改完的作文，第一遍的修改痕迹里至少有一处内容层动作（加交代、调顺序、改路标），而不是全是错别字圈改；请同桌读一遍，能复述出事情经过。
  misuse_warning: 考试限时作文中两层要压缩合并，本条是学习过程的默认顺序，不是考场死规矩（W-04 边界）；隐性连贯在叙事文里完全成立，不是每句都要路标，儿童写作中路标宁少勿错（W-14 边界）。
  evidence_note: 研究共识级——新手/专家修订行为对比研究（Bereiter & Scardamalia 1987）与 IES 指南的分步教学推荐（强证据）同向（随 W-04 口径）。
  status: 定版
- id: TEC-S27
  name: 句子太碎时做「合并操」：两个小句子变一个大句子，意思不变。
  zone: 表达写作区
  pain_point:
  - 写不长
  when: 写不长——作文全是五六个词的短句连排，像电报；想写复杂意思时没有句法工具可用。
  steps:
  - 从自己刚写的作文里挑出相邻的两个短句；
  - 先想清两句之间的关系：先后、因果、转折，还是一个修饰另一个；
  - 选用一个工具把它们接起来：and / but / because、when…、who/which…、或者把一句降成短语挂上去；
  - 把合并后的句子读出声，确认意思没变、读着顺；
  - 每个工具轮着练，同一对短句试两种接法，比比哪个好。
  mechanism: 句子合并迫使学习者在保持意思不变的前提下操练从句、并列、修饰等句法工具，句法成熟度随之上升；它绕开讲语法术语的路径，直接用产出操作练句法（W-13）。
  linked_laws:
  - W-13
  cross_refs:
  - TEC-S26
  order_hint: 前段后期、进阶适用；每轮合并的句对数剂量待定。
  self_check: 给出任意两个短句，能用至少两种工具各合并出一句意思不变的长句，并说清两句是什么关系。
  misuse_warning: 合并练的是句法操作，不自动改善内容与结构；长句不是目的——让读者看得见、跟得上才是，练习须与读者意识（TEC-S26）配套（W-13 边界）。
  evidence_note: 元分析级——句子合并是 Writing Next 元分析 11 个有效素之一，且在多项实验（含针对困难学生的研究）中重复出现正效应，是写作干预里证据最干净的单项之一（随 W-13 口径）。
  status: 定版
- id: TEC-S28
  name: 改作文时挑一处，把句子换一种说法写出来，两个版本比一比，选效果好的那个。
  zone: 表达写作区
  pain_point:
  - 写不长
  - 错不完
  when: 写不长、错不完——句子永远只有一种写法，写完不知道还能怎么改；语法学了不少，写作文时一条也调不出来。
  steps:
  - 从自己作文里挑一句最要紧的话；
  - 逼自己再写出一个不同写法的版本（长句改短句、主动改被动、换人称、换开头）；
  - 两个版本各读一遍，说清差别：哪个更清楚、哪个更有劲、哪个更像这个场合该说的话；
  - 选定一个，并把「为什么选它」用一句话说出来（说给同伴听）；
  - 把这次的选法记进自己的「选法本」，下次写作先翻一翻。
  mechanism: 语法是修辞资源而非纠错清单：同一种意思总有几种说法，每种选择产生不同的意义效果与读者感受；能说出自己为什么这样写（元语言谈话），才算把隐性语感变成可控的写作决策（NE-16）；把语法点嵌进当下的写作决定里教（这个形式在这个语类里能干什么），是嵌入式语法教学的机制关键（NE-17）。
  linked_laws:
  - NE-16
  - NE-17
  cross_refs: []
  order_hint: 仅后段适用——前段学生的英语词汇与句型存量太小，「可选的仓库」本身很小，选择教学须等存量积累（NE-16 边界，前段不适用本条）。每次润色的句数剂量待定。
  self_check: 一处修改能拿出两个版本，并当场说清选舍理由（不是「感觉好」，而是指着效果说）。
  misuse_warning: 「选择」不等于「没有对错」——EFL 阶段大量形式仍在建立中，准确性目标不能被修辞话语冲掉（NE-16 边界）；源证据来自母语八年级整群 RCT（效应量 e = 0.21），且写作能力强的学生受益更多、弱者受益较少，教师元语言知识是中介变量——外推到中国初中 EFL 只能取「嵌入优于孤立、选择可谈」的方向性结论，不能搬效应量（NE-17 边界）。
  evidence_note: 有条件级——Exeter 中学 RCT 为严格因果证据，但 EEF 在小学六年级的复制评估未复制出清晰效应，「嵌入式语法在小学阶段是否同样有效」仍是开放问题；本条据此限定初中适用（随 NE-17 口径）。
  status: 定版
- id: TEC-L01
  name: 合上书，自己考自己
  zone: 复习区
  pain_point:
  - 记不住
  when: 记不住——学完看着都懂，过两天全忘。
  steps:
  - 学完一小段，合上书或卡片；
  - 出声或写下刚学的内容（词义、句意、课文要点）；
  - 打开对照，标出想错和想不出的；
  - 只重看标出的部分；
  - 答对的词不删出复习堆，降频留下，隔几天再考。
  mechanism: 提取不是检查记忆的中性动作，而是改造记忆的事件——每次努力把信息取出来，取它的通路就被加固（LS-02；其「高效用」评级见 LS-01）；且答对之后**继续提取**贡献了几乎全部的保持增益，继续看几乎白费（LS-03）。
  linked_laws:
  - LS-02
  - LS-01
  - LS-03
  cross_refs: []
  order_hint: 先行：适用，但证据主体来自年龄更大的学习者，初学孩子须由 app／教师／家长代为出题、安排提取，不指望孩子自发使用（LS-01 边界）；进阶：可自用。剂量：自测须与学习拉开间隔（源实验中延迟 2 天至 1 周后测验组才反超重读组，LS-02）；答对后保留的提取次数源条目未给定数，剂量待定。
  self_check: 合上书能完整说出或写出，才算过；说不出的已当场标出。
  misuse_warning: 刚看完立刻自测测不出真水平（即时测验重读反占优，LS-02）；只考新学的、把答对的移出练习，正是 LS-03 点名的通病。
  evidence_note: 同行评审研究（Dunlosky et al. 2013 系统评级为高效用；Roediger & Karpicke 2006、Karpicke & Roediger 2008 实验传统）。
  audience: 学生自用（进阶）／亲子共用（先行，成人出题）
  status: 定版
- id: TEC-L02
  name: 考完马上对答案，蒙对的更要看
  zone: 复习区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——选择题被干扰项带偏、没把握蒙对的，没人纠正就越记越真。
  steps:
  - 做完一组自测题；
  - 立刻逐题对答案；
  - 答错的把正确形式完整看一遍、读一遍；
  - 没把握却蒙对的，按答错同等处理，再看一遍；
  - 合上答案，把错题再答一遍。
  mechanism: 反馈同时做两件事——放大提取的正效应（尤其保住低信心答对的内容），并拆掉负效应（纠正被干扰项带偏的错误）（LS-04）。
  linked_laws:
  - LS-04
  cross_refs: []
  order_hint: 先行：适用，反馈须即时、友好、带正确答案完整重现，不能只有对错标记（LS-04 边界）；进阶：适用。剂量：即时与延迟反馈孰优源条目无定论，剂量待定。
  self_check: 每道错题和蒙对题，合上答案后都能重新答对。
  misuse_warning: 光考不批，错的可能越记越真（LS-04 儿童版原意）；低龄儿童受选择题干扰项误导的风险比成人更高，无反馈兜底的自测慎用。
  evidence_note: 同行评审研究（Butler & Roediger 2008 等）。
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L03
  name: 把复习拆开，隔几天再碰一次
  zone: 复习区
  pain_point:
  - 记不住
  when: 记不住——一口气学完当时全会，一周后清零。
  steps:
  - 把一份内容（如一课的词）拆成几小份；
  - 今天学第一份；
  - 隔一两天学第二份，同时回考第一份；
  - 依次滚动，新学与回考并行；
  - 想记得越久的内容，间隔排得越开。
  mechanism: 间隔让第二次学习发生在「已经有点忘了」的状态，提取更费力，记忆被重新激活并改写加固（LS-06）；最优间隔随目标保持期拉长而变长、占保持期的比例反而变小（LS-07）。
  linked_laws:
  - LS-06
  - LS-07
  cross_refs: []
  order_hint: 先行：适用（幼儿间隔以秒计、起步期间隔以天计均有正面证据，LS-06），排程由成人／app 承担；进阶：可自排。剂量：儿童最优间隔的定量地图不存在，源条目明示只可借方向与形状、不可借成人参数（如「保持期 1 周时最优间隔约占 20–40%」是成人冷门知识数据，不得搬给儿童）；儿童具体间隔天数剂量待定。
  self_check: 每次回考时是「有点想不起来、但努力能想起」——太轻松说明隔太短，全想不起说明隔太长。
  misuse_warning: 间隔不是越长越好，成绩随间隔呈倒 U（LS-07）；同一天内换花样重复同一内容，不算间隔（LS-06）。
  evidence_note: 同行评审研究（Cepeda et al. 2006 定量合成；儿童证据 Vlach et al. 2008、Gluckman et al. 2014）。
  audience: 亲子共用（排程）／学生自用（进阶）
  status: 定版
- id: TEC-L04
  name: 先遮住答案，想出来才算会
  zone: 复习区
  pain_point:
  - 记不住
  when: 记不住——课文打开看着都懂、一合上就空白；复习时自我感觉良好，考试露馅。
  steps:
  - 复习时先把答案／译文遮住；
  - 只看题目或中文提示，先说出或写出英文；
  - 再打开对照判定；
  - 把「以为会、其实不会」的单独标记；
  - 隔一会儿再遮住重验标记项。
  mechanism: 答案在场时会抬高「我学会了」的判断（预见偏差）——判断依据与成绩依据脱钩；把学习情境改得像测验情境、先遮住答案尝试提取，判断才测得准（LS-09）。
  linked_laws:
  - LS-09
  cross_refs: []
  order_hint: 先行：适用（成人引导）；进阶：适用。剂量待定（源条目无频次参数）。
  self_check: 判定标准只有一个——看不见答案时能想起来；「看着眼熟」不计数。
  misuse_warning: 难度必须落在靠努力可跨越的范围且正中目标加工：把字体做难认这类外围困难已被复制研究否掉、无记忆收益；难到完全提不出来，就不再是合意困难而只是失败（LS-08）。
  evidence_note: 同行评审研究（Koriat & Bjork 2005/2006，成人词对实验；儿童无定量数据，不作数值外推，LS-09 边界）。
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L05
  name: 几类题混着练，先想这道用哪招
  zone: 复习区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——同类题成组做全对，考试混着出就选错方法。
  steps:
  - 先把每一类题各看少量示范、能认出题型；
  - 把几类题打散混编成一组；
  - 每道题先说一句「这道用哪招」再动手；
  - 做完对照，把「选错招」的题单独标出；
  - 过几天用新题再混练一次。
  mechanism: 分组练习时排版已替学习者选好方法，只剩执行；交错把选择权还给学习者——每道题都要先辨别题型再选方法，这一步本身被反复练到，增益主要来自题与方法配对变准（LS-10）。
  linked_laws:
  - LS-10
  cross_refs: []
  order_hint: 先行：前段后期适用（四年级儿童有实验证据），且各类须先有最低限度认识、先给少量分组示范或范例再交错；进阶：适用（七年级真实课堂证据）。剂量：混练比例与题量源条目未给定量，剂量待定。
  self_check: 面对混编新题，第一反应能选对方法（先看选招对不对，再看答案对不对）。
  misuse_warning: 练时更慢、错更多是本技巧的正常形态，不能据此判定无效（LS-10 与 LS-09 互为镜像）；直接证据集中在数学学科，英语句型／词义混练属机制迁移，不得宣称英语侧效应量（LS-10 边界）。
  evidence_note: 同行评审研究（Rohrer & Taylor 2007；Taylor & Rohrer 2010；Rohrer, Dedrick & Stershic 2015；Dunlosky et al. 2013 评为中效用）。
  audience: 学生自用（进阶）／教师课堂用（先行编排）
  status: 定版
- id: TEC-L06
  name: 每学一步，追问自己为什么
  zone: 复习区
  pain_point:
  - 读不快
  - 错不完
  when: 读不快（读例题、读课文只看表面，换个样子就不会）、错不完。
  steps:
  - 读一个例句或一步解法；
  - 停下来问自己「为什么这一步是对的？凭什么是这个词、这个形式？」；
  - 用自己的话把理由说出来；
  - 说不出的地方做标记——那就是没懂处；
  - 回头查清后再继续下一步。
  mechanism: 自我解释迫使学习者为每一步补出它没写明的理由、适用条件和与原理的联结，同时实时监控自己哪里没懂——补出的推论正是范例省略、而迁移时必需的部分（LS-11）。
  linked_laws:
  - LS-11
  cross_refs: []
  order_hint: 先行：须用支架形态：给两个候选理由选一个、或把理由补完后半句（源条目边界：低龄、低知识量的孩子面对开放式「为什么」会无话可说），由亲子／教师在场支持；进阶：可自用（八年级提示实验有效）。剂量：读完每句／每步后问一次（Chi et al. 1994 的提示形态）。
  self_check: 能用自己的话讲出「为什么」，且换一个新例子还能讲通。
  misuse_warning: 把复述原文当解释无效；没有可调用的既有知识垫底时硬问「为什么」只会沉默——先补知识再追问（LS-11）。
  evidence_note: 同行评审研究（Chi et al. 1989 为小样本相关发现；Chi et al. 1994 提示实验为因果证据）＋ Dunlosky et al. 2013 中效用评级。
  audience: 学生自用（进阶）／亲子共用（先行支架版）
  status: 定版
- id: TEC-L07
  name: 给生词配一幅对得上的图
  zone: 复习区
  pain_point:
  - 记不住
  when: 记不住——单词表看了多遍还是混。
  steps:
  - 学一个具体名词／动作词时，找或画一幅正指这个东西的图；
  - 词与图并排看，读出词、指出图；
  - 遮住词，看图说词；
  - 遮住图，想画面说词、拼词；
  - 复习时两个入口轮换考。
  mechanism: 具体物象可同时被言语系统与意象系统表征，两套码独立且可叠加，回忆时任一入口都可能到达目标（LS-12；按源条目分歧栏，此为双重编码的「主流解释之一」，成因另有独特性说之争）。
  linked_laws:
  - LS-12
  cross_refs:
  - TEC-L26
  order_hint: 先行：适用（具体词为主）；进阶：适用，抽象词往往只有言语码、收益递减。剂量待定。
  self_check: 看图能说出词、看词能想起图，两向都通。
  misuse_warning: 图必须与词同指一物，装饰性、气氛性图片不产生此收益、反招 TEC-L26 的一致性惩罚；严禁引用「图文结合记住 65%」一类查无出处的百分比（LS-12 明示禁用）。
  evidence_note: 经典理论（Paivio 双重编码理论，成人实验传统；对儿童只作方向引用，LS-12 边界）。
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L08
  name: 新本事先看一个做完的范例
  zone: 复习区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出——新句型、新题型一上手就乱做，错法先入为主。
  steps:
  - 拿到新句型或新题型，先不做题；
  - 找一个从头做到尾的范例，一步步看懂每一步；
  - 合上范例，自己做一道同型题；
  - 对照范例查差在哪；
  - 连对几道后把范例撤掉，独立做，再混入旧题型。
  mechanism: 新手还没有图式时直接解题，工作记忆会被手段—目的搜索占满，题目解完、图式没建成；研读已解出的范例把容量让给图式建构（范例效应，LS-14）。
  linked_laws:
  - LS-14
  cross_refs: []
  order_hint: 先行：适用（新句型先给完整范例、再渐撤支架）；进阶：适用。剂量：指导量必须随水平反着调、会了就渐撤，源条目未给撤除时点参数，剂量待定。
  self_check: 不看范例能独立做对同型题，且能说出每一步为什么。
  misuse_warning: 图式形成后还一步步盯着范例看，指导本身变成负担（专家反转效应，LS-14）；语言学习的范例先行是机制类推，其强证据集中在数学、物理等题域，不得引用其效应量（LS-14 边界）。
  evidence_note: 同行评审研究（Sweller & Cooper 1985 等；语言应用为机制迁移）。
  audience: 学生自用／教师课堂用
  status: 定版
- id: TEC-L09
  name: 规则学完，马上拿去办一件真事
  zone: 复习区
  pain_point:
  - 说不出
  when: 说不出——规则背得出、填空填得对，轮到自己说话就用不出来。
  steps:
  - 学完一个句型／规则；
  - 立刻用它说或写一件自己的真事（真人、真物、真想法）；
  - 换一个场合再用一次；
  - 接下来几天在说话、写作里主动找机会用它；
  - 用错了回看规则，用 TEC-L10 的三问补上缺的那一维。
  mechanism: 语法是第五种技能而非静态知识体系——背出来的是惰性知识，技能靠在有意义的使用中反复调动而长（TM-01 grammaring）。
  linked_laws:
  - TM-01
  cross_refs:
  - TEC-L10
  order_hint: 先行：适用（在教师创设的真实小任务中使用）；进阶：适用。剂量待定。
  self_check: 不看书、不用提示，能在说自己的事时自然用出这个句型。
  misuse_warning: 本条不否认规则讲解的价值（讲解是技能形成的一个输入口），只否认「讲解＝学会」（TM-01 边界）；显性知识能否转化为运用能力是未决之争（三派并立，TM-14），「学完马上用」是本清单在弱—强接口之间的操作站位，不得引任何一派为定论背书。
  evidence_note: 经典方法专著（Larsen-Freeman 2003；教学论主张，证据以理论论证与课堂观察为主，无大规模对照实验背书，TM-01 边界）。
  audience: 学生自用／教师课堂用
  status: 定版
- id: TEC-L10
  name: 学一个句型，先过三问
  zone: 复习区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完——句子语法对，但场合不对、听着别扭（知道 house，却不知道何时该说 residence）。
  steps:
  - 记下新句型的样子（形）；
  - 问它说的是什么事（义）；
  - 问什么场合、什么人之间才轮到它出场（用）；
  - 各造一句：对同学说、对老师说，比较哪句得体；
  - 三问有一问答不出，先补那一问再往下学。
  mechanism: 任何语法单位同时有形式、意义、使用三个维度，只教形义两维的语法课在结构上必然漏掉得体性，「用」维缺失正是产出虽对却不得体的缺口（TM-02）。
  linked_laws:
  - TM-02
  cross_refs: []
  order_hint: 先行：前段后期起在教师引导下使用（「用」维先学最显眼的场合差）；进阶：可自用。剂量待定。
  self_check: 任意给一个场合，能判断该不该用这个句型，并说出理由。
  misuse_warning: 「用」维随语境滑动、没有封闭清单，答不出时不要编规则，去例句与语料里找证据（TM-02 边界）。
  evidence_note: 经典方法专著（Celce-Murcia & Larsen-Freeman《The Grammar Book》三维框架，英语教师培训中引用率最高的语法分析工具之一）。
  audience: 学生自用（进阶）／教师课堂用
  status: 定版
- id: TEC-L11
  name: 先不看规则，自己从例句里找规律
  zone: 复习区
  pain_point:
  - 错不完
  - 记不住
  when: 错不完、记不住——规则听过就忘，换一个句子又错（如 for／since 老混）。
  steps:
  - 拿到一组同类例句（十来个）；
  - 分组圈出每句里相同的部分和不同的部分；
  - 用自己的话试着说出规律；
  - 拿几个新句子验一验，对不上就改规律；
  - 最后听教师收束的官方版本，对照自己说的差在哪。
  mechanism: 意识提升任务把学生的注意力有意引向目标形式特征，让学习者从数据出发形成假设、再修正假设，直接产物是能说清的显性知识，任务过程还产生大量围绕语法的协商互动（TM-16）。
  linked_laws:
  - TM-16
  cross_refs:
  - TEC-L09
  order_hint: 先行：前段后期可简化使用：用汉语讨论、图示化数据、规律单位更小，教师事后收束不可省（TM-16 边界）；进阶：适用。剂量待定。
  self_check: 能用自己的话把规律说给同伴听，且新句子验证通过。
  misuse_warning: 说得出规律≠流利会用（接口之争，TM-14）——本技巧只负责「看清、说清」，须接 TEC-L09／L19 的使用类技巧才闭环；数据选得例外太多、规律太绕，会归纳出错误规则（TM-16）。
  evidence_note: 经典方法专著（Rutherford 1987）＋同行评审研究（Fotos & Ellis 1991，探索性研究，样本与效应为初步量级）。
  audience: 教师课堂用／学生自用（进阶，两人以上更佳）
  status: 定版
- id: TEC-L12
  name: 照替换表拼句，先把骨架说熟
  zone: 复习区
  pain_point:
  - 说不出
  when: 说不出——新句型意思知道，但开口组装不出来、卡在半路。
  steps:
  - 拿到一张替换表（每一列是一类可换成分）；
  - 纵横各挑一格，拼出一句读出来；
  - 换一格再拼，连拼多句；
  - 挑一句配上图或实物，说说它是什么意思；
  - 练熟后合上表，自己说三句新的。
  mechanism: 替换表把句型排成可纵横选配的网格，槽位与选词的组合自由度写在表格结构里，大量合式产出让学习者内化句型骨架——是构式「骨架＋槽位」的纸质原型（TM-20）。
  linked_laws:
  - TM-20
  cross_refs: []
  order_hint: 先行：适用；进阶：只作新句型入门的短时工具，不作主练。剂量：源条目口径为「新句型呈现后最初几分钟的骨架熟悉工具」，具体分钟数待定。
  self_check: 合上表能自己说出三句同骨架的新句子，且知道每句的意思。
  misuse_warning: 这是机械层器械，学生可能全程不理解自己在说什么（TM-20 边界）；必须配赋义步骤，并按三级操练升到有意义与交际层（TM-19），只拼表不升层即回到听说法的老问题。
  evidence_note: '**从业传统**（Hornby 情景法／口语法传统，方法史经典著录；无效果实验传统）——按传统件登记，不冒充实证。'
  audience: 亲子共用／教师课堂用（表由成人提供）
  status: 定版
- id: TEC-L13
  name: 长句从尾巴开始往前搭
  zone: 复习区
  pain_point:
  - 说不出
  when: 说不出——长一点的句子、儿歌、演讲句，背到一半就断，句尾总是塌。
  steps:
  - 把长句按意群切成几小段；
  - 先把最后一段说顺；
  - 往前添一段，连起来说顺；
  - 一段一段往前接，直到整句；
  - 整句一口气说完，检查尾音不塌。
  mechanism: 从尾部建起，每次新增内容都接在已自动化片段之前，且每次练习都以完整的收尾韵律结束，针对的正是长句口头产出的工作记忆负荷与韵律完整两个困难（TM-21；此为现代认知转述，与原方法的行为主义解释分开，源条目已声明「技巧存、原义弃」）。
  linked_laws:
  - TM-21
  cross_refs: []
  order_hint: 先行：限短句、儿歌与演讲句的成串练习（源条目边界）；进阶：长句版适用。剂量待定。
  self_check: 整句能一口气说完、中间不停顿重来、句尾音调完整收束。
  misuse_warning: 切段必须按意群／韵律群切，在词组中间乱切会练出错误的停顿习惯；它练的是一条给定句子的产出流畅，不迁移为自造句子能力（TM-21）。
  evidence_note: '**从业传统**（听说法遗产技巧，无独立效果实验）——按传统件登记。'
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L14
  name: 拿颜色符号给每个词站队
  zone: 复习区
  pain_point:
  - 错不完
  when: 错不完——句子里谁是名词、谁是动词分不清，后面的规则全跟着乱。
  steps:
  - 记住固定配对（先学最常用几种）：名词黑三角、动词红圆、形容词深蓝三角、冠词浅蓝小三角；
  - 读一个短句，把符号摆在每个词上方；
  - 说一句为什么这个词站这一队；
  - 换一个新句子再摆；
  - 摆熟后撤掉符号，直接说词类。
  mechanism: 词类这种抽象分类先以可拿在手里的实物符号出现，再内化为纸面标记、最后脱离符号——同形状表同族（三角＝名词家族、圆＝动词家族），是为具体运算期儿童设计的分类通路（TM-24）。
  linked_laws:
  - TM-24
  cross_refs: []
  order_hint: 先行：专为起步期设计（三维符号先行）；进阶：一般已内化，不主推。剂量待定（源条目未给引入节奏参数）。
  self_check: 不看符号能说出句中每个词的类，并能举一个同类词替换进去。
  misuse_warning: 符号是脚手架不是语法本身，会摆≠会用，体系要求最终撤除（TM-24）；对色觉异常儿童以形状为主、颜色为辅；单摘符号而不用其配套练习序列，效果无从按原体系主张（TM-24 边界）。
  evidence_note: '**教育体系传统**（蒙台梭利语法符号，体系内标准化材料；无独立对照实验为其语法学习效果背书）——按传统件登记。'
  audience: 教师课堂用／亲子共用
  status: 定版
- id: TEC-L15
  name: 只报词类，填出一个爆笑故事
  zone: 复习区
  pain_point:
  - 记不住
  when: 记不住——词类标签（名词／动词／形容词／副词）背了就忘、用时捞不出来。
  steps:
  - 一人拿着藏起来的留空故事；
  - 逐空只问词类：「给我一个名词」「一个动词的过去式」；
  - 另一人不知道上下文，随口报词填入；
  - 填满后大声读出整个故事；
  - 笑完回头认一认：刚才每个空问的是哪类词、报的词合不合格。
  mechanism: 在脱离句子的情况下按类别从自己的词汇库里捞词，练的是词类标签的识别与提取；词与语境的语义错位制造笑点，天然提供重复玩的动力（TM-25）。
  linked_laws:
  - TM-25
  cross_refs: []
  order_hint: 先行：适用（词汇量小时配词墙或选项支持，TM-25 边界）；进阶：可作热身，非主练。剂量待定。
  self_check: 不给句子，能按词类随口报出三个合格的词。
  misuse_warning: 它不能替代任何句法教学——孩子全程不造句、不判断结构，把它当「语法游戏」宣传即属功能错位（TM-25）；先把英语词类标签与汉语的词类概念对齐，否则游戏只剩热闹。
  evidence_note: '**通俗游戏传统**（Mad Libs，1953 年发明、国民级流行度是文化事实；无教学效果研究背书）——按传统件登记。'
  audience: 亲子共用／教师课堂用
  status: 定版
- id: TEC-L16
  name: 把自己说的录下来，逐字写出来改
  zone: 复习区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完——口语里的错误一晃而过，说话当口顾不上，自己永远发现不了。
  steps:
  - 把自己的一段口头表达（复述、介绍、准备好的报告）录下来；
  - 把录音逐字转写成文字；
  - 自己先改一遍，圈出时态、词形、漏词、语序问题；
  - 把转写稿交给老师／家长，只补你没看出来的；
  - 换一个新题目再说一遍，检查同样的错还犯不犯。
  mechanism: 产出先被录音固定，事后在没有时间压力的状态下逐字落纸，说话时隐形的错误在书面形态下变得可检查——把「注意」从输入侧搬到自己的产出侧（TM-26）。
  linked_laws:
  - TM-26
  cross_refs: []
  order_hint: 先行：前段后期起用微缩版：录一句话、听写一句话、改一句话（源条目年龄适配口径）；进阶：整段转写适用。剂量：原研究形态为正式报告前两周彩排—转写—正式版，儿童剂量待定。
  self_check: 换新题再说时，上一轮圈出的错型不再出现——只把改好的稿子背下来不算（TM-26 边界）。
  misuse_warning: 转写五分钟录音是数十分钟的劳动，只用在值得打磨的产出（报告、演讲、复述），不适合日常对话；学生只能自纠其现有显性知识覆盖的错误，教师补检环节不可省（TM-26）。
  evidence_note: 同行评审研究（Mennim 2003；Lynch 2001；Mennim 2012——小样本课堂研究系，效应方向一致但规模有限，迁移证据未定版）。
  audience: 学生自用（进阶）／亲子共用（先行微缩版）
  status: 定版
- id: TEC-L17
  name: 错句按错法分栏记，只攻最厚的一栏
  zone: 复习区
  pain_point:
  - 错不完
  when: 错不完——同样的错改了又犯；错题本按日期记成流水账，从来不回头看。
  steps:
  - 准备一本错误本，按错型分栏（时态错一栏、冠词错一栏、语序错一栏……）；
  - 订正后的错句誊入对应栏：原错句、订正句、一句错因自述；
  - 誊之前先过滤：偶然口误／笔误不记，只记反复出现的系统错误；
  - 每周回看一次，数哪一栏最厚；
  - 只针对最厚的一两栏安排专项练习（练习按 TEC-L27 的分层与五关验收）。
  mechanism: 错误有系统性——口误（已会而偶失）、系统错误（当前中介语的真实状态）、未学而试，三类处置完全不同，只有系统错误值得长期追踪；按错型归档把每个学生自己的中介语做成可见、可统计的个人档案，高频错型（hot errors）就是要专练的靶子（TM-27；理论锚点为 Edge 的 slips／errors／attempts 三分）。
  linked_laws:
  - TM-27
  cross_refs:
  - TEC-L27
  order_hint: 先行：由教师代为归类，学生只负责誊抄与回看朗读，错因自述随年龄逐步移交学生（TM-27 边界）；进阶：自主管理。剂量：源条目给的节奏为定期（如每周）回看。
  self_check: 最厚一栏的错型，在新作业里出现次数连续下降。
  misuse_warning: 三条失效模式——只记不复习（档案变坟墓）、口误也全记（稀释信号）、只记不练（回看终点必须落到针对性练习）（TM-27）；错误本是个人档案而非展示品，公开比较错误量会污染记录意愿；纠错是否有用本身有上游分歧（Truscott「纠错无用」论 vs Ferris「书面纠错有效」论），本技巧预设 Ferris 侧立场，分歧登记、不装定论（TM-27 分歧栏）。
  evidence_note: 经典教师教育专著（Edge《Mistakes and Correction》1989，理论锚点）＋**从业传统**（错误本固定程式本身）——双层标注。
  audience: 学生自用（进阶）／教师课堂用（先行代管）
  status: 定版
- id: TEC-L18
  name: 先做诊断题，只学点到自己的那一课
  zone: 复习区
  pain_point:
  - 错不完
  when: 错不完（自学时）——语法书从头翻到尾，时间全花在已经会的地方，真正的洞一个没补。
  steps:
  - 先做一组诊断题；
  - 按结果圈出点到自己的几个单元；
  - 只学这几课：一页讲解看懂，马上做配套页练习；
  - 做完自己对答案，错题回看讲解页的对应段；
  - 说话／写作时卡在某个具体说法上，改走问题查法：按「我卡住的问题」查用法条目，不从头翻书。
  mechanism: 两页单元法把每个语法点做成「讲解—练习—答案—自诊入口」闭合的自学单元，书末诊断（Study Guide）先分诊、再吃药（TM-28）；用法词典路线则不按体系、按学习者真的会问会错的问题组织条目，一个管系统学、一个管按需查（TM-30）。
  linked_laws:
  - TM-28
  - TM-30
  cross_refs:
  - TEC-L09
  order_hint: 先行：前段后期在家长陪同下使用初级材料（中级册作者自陈不适合初学者，TM-28 边界）；进阶：适用。剂量待定。
  self_check: 学完一课，诊断题里的同类题能答对，且能在自己的作文里用对一次。
  misuse_warning: 单元闭环保证「学得完、对得上答案」，不保证迁移到自由产出——学完必须接 TEC-L09 的真实使用（TM-28 边界）；问题词典不负责体系全景，没有问题意识时无从查起，不能单独充当学习路径（TM-30 边界）。
  evidence_note: '**从业／产品传统**（Murphy 两页单元法、Swan 问题词典法——自学书的方法形态学，不是习得理论；「世界最畅销」等销量表述为出版社口径，本条不背书）。'
  audience: 学生自用（进阶）／亲子共用
  status: 定版
- id: TEC-L19
  name: 常用的话整块记住，整块拿出来说
  zone: 复习区
  pain_point:
  - 说不出
  when: 说不出——每个词都认识，一开口却要逐词现拼，句子断断续续。
  steps:
  - 从课文、对话里挑出整句现成话（打招呼、提问、表达喜好等整块）；
  - 整块朗读、整块背，不拆词；
  - 把整块话放进自己的场景里用（换人名、换东西）；
  - 口头练习时优先调用存货，不临时现拼；
  - 新学的句型也尽快攒成整块存起来。
  mechanism: 流利度是记忆的函数——实时无停顿地说话，靠的是记忆中存有一库存量充足的套式语块整块提取，把加工负荷从逐词拼装降到整块拿取；观测指标不是语速，而是两次停顿之间长段连贯输出的多少（WA-02）。
  linked_laws:
  - WA-02
  cross_refs:
  - TEC-L10
  order_hint: 先行：适用（儿童整块记忆强、拆解倾向弱，本机制对前段的适配度反而高于成人，WA-02 边界）；进阶：适用。剂量待定（源条目未给库存量参数）。
  self_check: 常用场景（自我介绍、问路、点餐）能成段说出、不逐词卡顿——看停顿之间的长段，不看语速。
  misuse_warning: 语块库存解释的是流利度的下限通道，不排斥规则加工（Wray 对成人拆解套式的批评，WA-02 分歧栏）；只背整块从不分析，遇到需要变形的场合会僵住——与 TEC-L10 三问配套使用。
  evidence_note: 专家博客（Thornbury《An A–Z of ELT》2009）＋同行评审系列论文（作者 2019 年剑桥 Papers in ELT 学术版）双重著录。
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L20
  name: 判断被动，先验两样东西
  zone: 复习区
  pain_point:
  - 错不完
  when: 错不完——阅读和写作里把普通句当被动、把被动当时态，跟着「少用被动句」的口号乱改句子。
  steps:
  - 拿到一个被指为「被动」的句子；
  - 先找形式：有没有 be／get＋过去分词、主语是不是对应主动句的宾语；
  - 再问：句子能不能补出做事的人（by 短语），施事到底藏没藏；
  - 两样都对不上，就不是被动句，不按被动处理；
  - 确是被动句时，只批评内容层的问题（该说清谁负责却没说清），不扣语态的帽子。
  mechanism: 被动是形式范畴——不及物动词没有宾语，结构上不可能有被动式（WA-03）；语态与时态是正交的两个维度，且被动可带 by 短语说全施事、主动也可不点名，「被动＝含糊」的民间等式双向不成立（WA-04）。
  linked_laws:
  - WA-03
  - WA-04
  cross_refs: []
  order_hint: 前段不适用（形式判准属进阶语法内容）；进阶：适用。剂量待定。
  self_check: 给出五个句子，能逐个说清哪个是被动、判准是什么；说不出判准的不下结论。
  misuse_warning: 本技巧不是「被动句都可以用」的许可证——真正的推责含糊是内容与修辞问题，仍值得批评，只是别错扣语态帽子，否则对方指出术语错误即可全身而退、真问题被放过（WA-03）。
  evidence_note: 专家博客（Pullum, Language Log；其形式判准锚定 CGEL 专著描写成果）。
  audience: 学生自用（进阶）
  status: 定版
- id: TEC-L21
  name: 选故事书，先过两把尺
  zone: 复习区
  pain_point:
  - 听不懂
  when: 听不懂——故事书不是太难听不懂，就是太幼稚没意思，孩子坐不住。
  steps:
  - 先过语言尺：图画能不能帮孩子对位听懂大意、难度对不对他的语言水平；
  - 再过心智尺：内容对不对他的年龄、兴趣与志向；
  - 两把尺都过才选定；
  - 开讲前先告诉孩子本课的产出（表演、做一本书、做一个项目）；
  - 按「准备活动—讲述中活动—后续活动」三段走完。
  mechanism: 选书须同时对上孩子的语言能力与认知能力——第二语言水平可以落后，但他们的观念与志向与发育年龄相称；绘本的图画让儿童把听到的声音与看到的画面对位，无需翻译即可把握整体意义，故事是跳板不是终点（WA-07）。
  linked_laws:
  - WA-07
  cross_refs: []
  order_hint: 先行：适用（家长／教师选书）；进阶：绘本阶段已过，仅起步期分级阅读选材可借双尺，源条目本身为少儿故事书立论。剂量待定。
  self_check: 孩子能靠图画复述故事大意，且愿意听完并参与讲后产出活动。
  misuse_warning: 只降语言难度、同时把内容幼稚化，是最常见的选书错误（WA-07）；文中关于视觉素养、社会情感的效果表述按经验主张引用，非实证结论（WA-07 边界）。
  evidence_note: 权威机构专家专栏（Gail Ellis, British Council《Voices Magazine》；教学法共识层，无对照实验数据）。
  audience: 亲子共用（家长主导）／教师课堂用
  status: 定版
- id: TEC-L22
  name: 写一段话，先让意思连成一幅画
  zone: 复习区
  pain_point:
  - 写不长
  when: 写不长——句子里 and、then、it 堆了一串，读的人还是跟不上，段落散架。
  steps:
  - 写完一段，先不看连接词，通读一遍；
  - 问自己：读的人心里能不能顺着走出一幅连贯的画；
  - 意思断开的地方，先改内容顺序、补足信息，不急着加连接词；
  - 意思顺了，再回头补钉子（连接词、照应、词汇复现）；
  - 请别人读一遍，让他复述大意来验证。
  mechanism: 衔接是语篇的表层线索，连贯是读者结合语境与世界知识在心里建起的统一意义——两者不是一回事，有衔接而意思断裂（假连贯）与无显眼线索却意思顺畅（隐连贯）都存在（CG-01）。
  linked_laws:
  - CG-01
  cross_refs: []
  order_hint: 先行：前段后期先用口头版（把一段话先说顺再写）；进阶：书面版适用。剂量待定。
  self_check: 没参与写作的人读一遍，能复述出大意与顺序。
  misuse_warning: 这是写作与阅读层面的框架，不是词句对错的判据（CG-01 边界）；反过来只加连接词冒充连贯，正是本技巧要治的病。
  evidence_note: 经典学术专著（胡壮麟《语篇的衔接与连贯》1994，本土框架；衔接／连贯边界在学界未完全定型，分歧已在源条目登记）。
  audience: 学生自用（进阶）／教师课堂用
  status: 定版
- id: TEC-L23
  name: 学时间词，先把空间图画出来
  zone: 复习区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完——before／after、in an hour 这类时间表达背了就混，还爱按汉语说法直译出错。
  steps:
  - 学一个时间表达，先画它的空间图（一条线、一个点、前后位置）；
  - 对照汉语里对应的空间说法（前天／后天、上周／下周）；
  - 把时间表达放进空间图里定位，再造句；
  - 标出英汉不一样的地方（如汉语有纵向的「上／下周」，英语没有对应）；
  - 指着图自测：说出整组时间表达。
  mechanism: 人有感知空间的器官与神经、却没有感知时间的器官，对空间关系的感知和概念化必然先于时间，个人成长中也是先习得空间概念、后习得时间概念——时间义是搭在空间图式上的第二层（CG-05）。
  linked_laws:
  - CG-05
  cross_refs:
  - TEC-P05
  - TEC-P06
  order_hint: 先行：适用；进阶：适用。剂量待定。
  self_check: 不看中文，能对着自画的时间线说对一整组时间表达。
  misuse_warning: 次序说的是概念依赖，不是每条时间表达都必须先教空间义（yesterday 等高频时间词可整体习得，CG-05 边界）；「时间全部借自空间」学界有保留（Evans 主张时间有独立结构），本条只取「空间是主要而非唯一来源」。
  evidence_note: 学术专著（蓝纯 2003 英汉空间隐喻语料对比；与清单 P-17 空间→时间→抽象路径同源互证）。
  audience: 学生自用／教师课堂用
  status: 定版
- id: TEC-L24
  name: 用完成时，先问一句：跟现在还有关系吗
  zone: 复习区
  pain_point:
  - 错不完
  when: 错不完——have done 和 did 老选错，还爱把完成时和 yesterday 连用。
  steps:
  - 要说一件过去的事，先停一秒；
  - 问自己：我说这件事，是想说明现在的情况吗（现在没钥匙用、现在有这份经历、一直持续到现在）；
  - 是——用 have done；
  - 不是，只讲过去那一刻——用过去时；
  - 句中有 yesterday、last night 等明确过去时间状语时，排除完成时，回查第
  - 步是不是问错了。
  mechanism: 现在完成时的判据是「动作发生在过去，但与现在情况有关系」，它与一般过去时的分界不在时间远近，而在是否表示和现在的关系（CG-07，薄冰《英语语法手册》定版讲法，与 Comrie、CGEL 的现时相关说一一同向）。
  linked_laws:
  - CG-07
  cross_refs: []
  order_hint: 先行：前段后期初步接触完成时时即可引入判据句；进阶：适用。剂量待定（判据类技巧无剂量参数）。
  self_check: 每用一次完成时，能当场说出它与现在的哪一点关系；说不出，就改过去时。
  misuse_warning: 只记「做完了没有」正是把定版判据压扁成的课堂口诀，是误用的源头（CG-07）；英美用法有真实差异（美式在 just／already／yet 语境更常用过去时），按所学规范判定（CG-07 分歧栏）。
  evidence_note: 经典语法手册（薄冰《英语语法手册》定版讲法；与国际现时相关定版互证）。
  audience: 学生自用／教师课堂用
  status: 定版
- id: TEC-L25
  name: 把不算分的小测嵌进正常课程
  zone: 家长角
  pain_point:
  - 记不住
  when: 记不住（课堂侧）——整学期学过的内容，期末累积考试时大面积遗忘。
  steps:
  - 把低风险小测嵌进正常教学，而非集中到期末；
  - 小测明确不算分；
  - 被测内容在单元考与学期考中回收检验；
  - 向低龄外推时题型更游戏化、单次题量更小。
  mechanism: 把提取练习嵌进真实课程，被测过的内容在单元考与学期考上都更好，且效应保持到学期末的累积考试（LS-05）。
  linked_laws:
  - LS-05
  cross_refs: []
  order_hint: 进阶：直接适用（源证据为六年级、八年级真实课堂）；先行：前段后期可借，须按上列第④步降格形态。剂量：整学期持续嵌入；具体频次源条目未给，剂量待定。
  self_check: 学期末累积考试中，被小测过的内容成绩高于未测内容。
  misuse_warning: 「小测不算分、低风险」是设计前提——变成计分考试会引入焦虑变量，证据不再直接适用（LS-05 边界）。
  evidence_note: 同行评审研究（Roediger et al. 2011；McDaniel et al. 2011，真实课堂实验）。
  audience: 教师侧（课堂编排）
  status: 定版
- id: TEC-L26
  name: 做材料先删无关，再给重点打光
  zone: 家长角
  pain_point:
  - 听不懂
  - 读不快
  when: 听不懂、读不快（材料侧）——画面热闹、词图分离，学生的眼睛满屏找、脑子忙错地方。
  steps:
  - 删掉与学习无关的词、图、音乐；
  - 用线索标出材料的结构与重点；
  - 相关的词与图在画面上彼此靠近；
  - 旁白与对应动画同步呈现，不先后错开；
  - 已有旁白和图时，不再叠加与旁白逐字相同的屏幕文字（识字初期儿童的屏幕文字可能是解码脚手架，须按年龄段分开处理）。
  mechanism: 多媒体学习的五条减负原则（一致性、信号、冗余、空间临近、时间临近）针对的都是无关加工，每条都有实验账本（LS-13）。
  linked_laws:
  - LS-13
  cross_refs: []
  order_hint: 全程适用（材料设计纪律）。剂量：原则级，无剂量参数；其中空间临近原则的中位效应量源条目标「待核」，不得引用其数字。
  self_check: 屏上／页上任一元素，都能说出它为哪一步学习服务；说不出的删掉。
  misuse_warning: 效应量来自大学生与科学说明类材料，不得转写成对儿童的收益承诺（LS-13 边界）。
  evidence_note: 同行评审研究（Mayer & Fiorella 2014 章节汇总的中位效应量：一致性 0.86、冗余 0.86、时间临近 1.22、信号 0.41）。
  audience: 教师侧（教师／app 设计者）
  status: 定版
- id: TEC-L27
  name: 练习先定层，再过五关
  zone: 家长角
  pain_point:
  - 错不完
  when: 错不完（练习侧）——练习做了一堆学生还是不会用，多半是层级没走完、或这一层本身不合格。
  steps:
  - 先给练习定层：不用懂意思也能做对的是机械层，须懂意思但答案已知是有意义层，带真实新信息的是交际层；
  - 每个新句型依次走完三层；
  - 每一层再过五关：效度、数量、成功导向、异质性、趣味；
  - 哪关不过改哪关；
  - 只停在机械层的练习，五关全过也不算练透。
  mechanism: 三级操练是练习的分层仪（答案可否预知、有无真信息，决定它练到第几层），Ur 五特征是练习的质检表（练的是不是它声称的本事、量够不够、是否大多做对、是否各水平可下手、有无趣味）——先分层、再过关（TM-19、TM-06）。
  linked_laws:
  - TM-19
  - TM-06
  cross_refs: []
  order_hint: 全程适用（教师设计）。剂量待定。
  self_check: 任一组练习，能当场说出它在哪一层、五关逐项的判定结果。
  misuse_warning: 成功导向与合意困难（LS-08）表面冲突、实为对象不同——Ur 管技能自动化阶段（高成功率才自动化），Bjork 管记忆保持（提取努力才记得牢），用反阶段都会出错（TM-06 边界）。
  evidence_note: 经典方法专著（Paulston & Bruder 1976 三级分类）＋章节原文级（Ur《Grammar Practice Activities》2009 官方节选，五特征为作者章末小结原文）。
  audience: 教师侧
  status: 定版
- id: TEC-L28
  name: 设计「不用对的形式就答不对」的听读题
  zone: 家长角
  pain_point:
  - 听不懂
  when: 听不懂（课堂侧）——被动句、物体作主语句被系统性听反（把第一个名词当成做事的人）。
  steps:
  - 选定一个会被省力策略误读的结构（如被动句）；
  - 先给关于目标结构的显性信息；
  - 再明说加工策略本身：「你的第一名词直觉在这里会骗你」；
  - 出结构化输入活动：听／读句子，只作意义判断（选图、判断谁对谁做了什么），题目设计到不处理目标形式就答不对；
  - 全程不要求产出该形式，听对之后另设产出练习。
  mechanism: 学习者理解二语句子时系统性采用意义优先与第一名词原则等省力策略；结构化输入堵死省力策略的活路、逼出正确加工——只做结构化输入、从未产出该形式的组，理解显著胜过传统产出操练组、产出与之打平（TM-15）。
  linked_laws:
  - TM-15
  cross_refs: []
  order_hint: 先行：适用（被动句、物体作主语的句子正是中国孩子的直接落点）；进阶：适用。剂量待定（源条目明示活动设计成本高，无剂量参数）。
  self_check: 学生在从未产出该形式的前提下，判断题正确率显著高于干预前。
  misuse_warning: 「双重红利」不是无条件成立——技能特异性反论（DeKeyser & Sokalski 1996）指出理解练习长理解、产出练习长产出，产出能力终须另设产出练习；对不存在加工陷阱的语法点，PI 没有额外优势（TM-15）。
  evidence_note: 同行评审研究（VanPatten & Cadierno 1993 奠基实验起，三十年跨语言复制传统）。
  audience: 教师侧（活动设计，学生作答）
  status: 定版
- id: TEC-L29
  name: 让目标句式先密集路过，再立刻让学生开口
  zone: 家长角
  pain_point:
  - 说不出
  when: 说不出（课堂侧）——句型学过了，学生开口时就是想不起来用。
  steps:
  - 选一个学生已在输入中见过、尚未能主动调用的句式；
  - 由教师／同伴用该句式密集提问或示范；
  - 紧接着给学生一个必须用新内容自己造句的场合；
  - 让学生用同一骨架作答；
  - 换内容再来一轮，保持暴露与产出的紧贴。
  mechanism: 刚听过、用过的句法结构会被不自觉地再用一次——被启动的是抽象句法框架本身，启动提高目标结构在下一次产出中被选中的概率（TM-18）。
  linked_laws:
  - TM-18
  cross_refs: []
  order_hint: 全程适用。剂量：暴露遍数源条目未给定版参数，剂量待定；关键约束是暴露必须紧贴产出机会（效应随时间衰减）。
  self_check: 学生在新内容作答中自发用出目标句式的比例上升。
  misuse_warning: 启动不教新结构——学生尚未建立表征的结构无从启动，它是调用助推器、不是呈现工具；产出任务若允许回避目标句式，收益大打折扣（TM-18）；启动产出多者进步大是相关证据，非因果定案，不写成习得捷径。
  evidence_note: 同行评审研究（Bock 1986 一语奠基实验；McDonough 一线二语课堂复制）。
  audience: 教师侧（教师课堂用，学生参与）
  status: 定版
- id: TEC-L30
  name: 抓住学生说不完整的话，当场补成整句写下来
  zone: 家长角
  pain_point:
  - 说不出
  when: 说不出（课堂侧）——进度表上的句子学生用不上，学生真想说的话又说不完整，两头落空。
  steps:
  - 课上留出学生说自己事情的时间；
  - 抓住一句学生想说而说不完整的话；
  - 当场把它补成完整、地道的整句，写在黑板上；
  - 全班跟读这句「从学生嘴里长出来的」句子；
  - 后续活动里再给机会复用这句。
  mechanism: 聚焦涌现的语言——不预设语法进度表，而是抓住学习者当场想说而说不完整的话，当场加工成目标形式，进度让位于真实的表达需要（WA-01，招牌实例即学生碎句被回铸为完整句）。
  linked_laws:
  - WA-01
  cross_refs: []
  order_hint: 先行：只取回铸内核，且低龄学习者恰恰需要故事、图片等材料支架；进阶：适用。剂量待定。
  self_check: 每节课至少有一句源自学生真实表达的整句产生，且学生在后续活动中能复用。
  misuse_warning: Dogme 强式（不用教材、轻材料到底）在小学阶段不适用——本条只收涌现回铸的机制，**不收禁材料主张**（WA-01 边界与源簇立场）；部分学生期待以教材为锚，完全无锚会让这类学生不安，须与正常材料并行（WA-01）。
  evidence_note: 专家专栏／运动纲领（Thornbury《An A–Z of ELT》；方法论宣言与实践传统，不是实证研究结论）。
  audience: 教师侧（教师课堂用）
  status: 定版
- id: TEC-P01
  name: 先认证件照，再挂亲戚、换邻居
  zone: 小系统区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。介词用法一词一页地背，背完还是乱选；遇到没学过的用法完全没抓手。
  steps:
  - 每个介词先认一张中心图（in＝装进容器、on＝贴面被托住、at＝压成一个点、over＝在上方——over 教 T&E 版中心，见误用警告）；
  - 新用法先试着挂到中心图或它的一级亲戚上，挂不上再查；
  - 把这个词和它的邻居放同一句里换着说（over/above、under/below），听意义怎么变；
  - against 记「顶着力」、through 记「从介质里穿过去」两张新证件照，同样先认图再挂用法。
  mechanism: 介词的用法是从原型场景出发、经语用强化长出的一张网，按图索引比逐条存储省力，且能迁移到没教过的用法（P-01、P-10）；中心图的定法有四条证据标准，不是随手挑的（P-02）；邻居对照是 Lindstromberg 的簇编排法——替换测试是他的基本教学动作，词的意义部分由它与邻居的边界决定（PB-01、P-13）。基本义须过「能画出来」这一关，画不出的词（如 with）不硬配图（PB-02）。
  linked_laws:
  - P-01
  - P-10
  - P-02
  - PB-01
  - P-13
  - PB-02
  cross_refs: []
  order_hint: 先行：实物与动作演示认图，只取原型＋一级引申，剂量待定；进阶：整词网络展开，替换测试成组练（如垂直四词对照集），剂量待定。
  self_check: 拿到一个没学过的用法，能先说出「它像中心图的哪一点」再作答，而不是直接翻表。
  misuse_warning: over 的中心义有两家裁决——本技巧教 Tyler & Evans 版（静态「在上方」），Brugman/Lakoff 的动态复合中心说（「从上方越过」）并存登记，不得说成学界已定案（P-06、PB-05–PB-07）；网络是分析模型，不要求背下整张网，远端义项按频率逐个补（P-01 边界）；on 的证件照只管 on1「接触承托」，on2「继续向前」（go on）不在此图内，到短语动词单元整块出现（PB-03）。
  evidence_note: 专著框架级（Tyler & Evans 2003；Lindstromberg 2010 为目录+书评级接触）＋教学实验级（P-10：认知语言学组在未学用法上亦获益）。
  status: 定版
- id: TEC-P02
  name: 先定「找谁」，再下钉子
  zone: 小系统区
  pain_point:
  - 说不出
  - 写不长
  when: 说不出、写不长。描述位置时主宾乱序，把大背景说到前面、要找的东西说到后面，句子别扭甚至说反。
  steps:
  - 开口前先问：这句是要找哪个东西？
  - 把要找的小而动的东西放前面做图形；
  - 把大而稳的东西放后面做背景；
  - 用介词把图形钉在背景上，说完整句。
  mechanism: 空间表达里图形—背景分工是知觉组织的投影，介词短语的本质是一个定位指令——先定图形，句子的骨架就不会反（P-12）。
  linked_laws:
  - P-12
  cross_refs: []
  order_hint: 先行：看图说话练「杯子在桌子上」式定位句，剂量待定；进阶：写场景描写时用同一检查排句序，剂量待定。
  self_check: 随手拿一张图，能一句话说清「要找的东西在哪」，且听者能立刻找到它。
  misuse_warning: 背景成为话题时分工可反转，那是语用怪异不是语法错误，不许把「桌子在杯子下」类句子一概判错（P-12 边界）。
  evidence_note: 专著框架级（Talmy 2000 图形—背景理论，空间语义底层共识层）。
  status: 定版
- id: TEC-P03
  name: 几何不够，再问「它是干什么的」
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。苹果高出碗沿还说 in、画没被托住还说 on——只量位置的学生在这类题上成批出错。
  steps:
  - 先按证件照看几何（在里面吗、贴面吗）；
  - 说不清时再问一句：这个东西是干什么用的（碗是盛的、桌面是托的、墙是挂的）？
  - 功能对上了就按功能定介词；
  - 摞高冒尖的碗、挂墙的画两个招牌例先记牢，遇到同类先套这两例。
  mechanism: 介词适用度由几何约束与功能约束联合决定（P-08）；功能知识是 Herskovits (1986) 就立下的第二决定项——物体用途能改写几何归类（PB-10）；偏离图式但功能成立的用法，靠约定「使用类型」与现场「语用容差」放行（PB-09）。
  linked_laws:
  - P-08
  - PB-10
  - PB-09
  cross_refs: []
  order_hint: 先行：只用两个招牌例（冒尖的碗、挂墙的画），不引入「功能」术语（PB-10 边界），剂量待定；进阶：in/on 判断题加做「功能检查」一步，剂量待定。
  self_check: 遇到几何含糊的图，能说出「因为碗是用来盛的」这类功能理由再下判断。
  misuse_warning: 功能是第二决定项，不推翻几何——日常绝大多数情形几何解释就够，不许拿功能给任意选择开脱（P-08、PB-10 边界）。
  evidence_note: 专著框架级＋实验级（Coventry & Garrod 2004 功能实验；Herskovits 1986 为目录+书评级接触）。
  status: 定版
- id: TEC-P04
  name: 拿汉语刀口图对表
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。介词跟着汉语「上/里」乱选：在报纸上、在电视上、树上、会上全线串位，且自己意识不到错在哪一类。
  steps:
  - 先认错位图：汉语「上」是一把大伞，英语拆成三把小伞；
  - 每次要说「上」时停一秒，先问：贴在面上（on）、装在里面（in）、还是就在那个场合（at）？
  - 说「在树上」时再多切一刀：是长在树上的一部分（苹果→on）还是待在枝叶之间（鸟→in）？
  - 选介词时不看「紧不紧」——紧贴维度在汉语里住在动词里（塞进、套上），英语介词不看它。
  mechanism: 空间范畴的切法自幼随母语长成，孩子带着汉语的刀口去够英语必然在交叉处系统迁移——错位可预先画成地图，在交叉处设防（PB-11、PB-12）；CLEC 语料描写同向：华语学生介词错误是切分不同、不是记性不好（P-11）。
  linked_laws:
  - PB-11
  - PB-12
  - P-11
  cross_refs: []
  order_hint: 先行：前段后期起用「上字三伞图」做选词前检查，剂量待定；进阶：把错位图当错题分类表，自己的介词错先归到三处错位中的哪一处，剂量待定。
  self_check: 说出或写出「在……上」类句子前，能先完成「三伞分问」并选对；错题能归类到错位图的具体一格。
  misuse_warning: 错位图是预测工具不是定罪工具——个体错误还有其他来源，未经语料核验的错误率一概不许编数字（PB-12 边界）；「鸟落在枝条上」说 on a branch 是界标换成枝条后的正确选择，不是本技巧的反例（PB-12 边界）。
  evidence_note: 本簇推论级（PB-12 自标推论条，原理出 Bowerman & Choi 2001，二手系统论述级）＋语料库描写级（P-11，CLEC）。
  status: 定版
- id: TEC-P05
  name: 时间题先借空间图
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。at/in/on 管时间时全靠背口诀，还背的是错口诀（「时长定介词」），in the morning、at night 一遇就翻车。
  steps:
  - 时刻当一个点→at；
  - 一天当可贴附的日历面→on；
  - 一阵子当泡在里面的容器→in；
  - 先在心里把时间对象画成点、面、容器再选词，不许数时长；
  - at night 这类画不出图的，按 TEC-P15 整块存货，不硬套图。
  mechanism: 时间介词与空间介词是同一套图式在两个域的两次使用，分工严格平行；「大于一天 in、等于一天 on、小于一天 at」是被 in the morning / at night 当场推翻的伪规则（P-09）；at/on/in 是沿意义链走遍时间、状态、话题等抽象域的三个词（PB-13）。
  linked_laws:
  - P-09
  - PB-13
  cross_refs:
  - TEC-L23
  - TEC-P06
  - TEC-P15
  order_hint: 先行：只练时刻/天/时段三格与图对应，剂量待定；进阶：叠加用法（如 on Monday morning 按就近的日为面）作理解，剂量待定（P-09 边界：属更高进度内容，此处只到进阶识别层）。
  self_check: 给一组时间表达，能先说出「我把它看成点/面/容器」再选词，且不用时长口诀。
  misuse_warning: at night、in the evening 的不对称是历史约定残留，只记不讲，不许为圆图式编解释（P-09 边界）；本条顺序应用受 TEC-P06 的趋势限定，不许说「时间义必须在空间义全会之后才能碰」——高频块可提前整记（P-17 边界）。
  evidence_note: 专著框架级（Tyler & Evans 2003；Dirven 1993 二手系统论述级）＋项目裁定级（伪规则已由本项目审查裁定删除）。
  status: 定版
- id: TEC-P06
  name: 按成长队排着学
  zone: 小系统区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。一个介词的十几个用法一股脑全上，抽象用法先学、空间图还没站稳，全线混杂。
  steps:
  - 新学一个介词，先只学空间图；
  - 空间图站稳后，再学它的时间用法；
  - 最后才碰抽象用法，且每个抽象用法都先回链到空间图；
  - 遇到 at once、in fact 这类高频抽象块，不排队，整块先认（走 TEC-P15）。
  mechanism: 介词义项在历史与习得中大体按空间→时间→抽象展开，教学顺着词自己的成长路线走（P-17）；该顺序是各语言在自身范畴内部的展开，对中国孩子还要叠加 TEC-P04 的刀口错位（PB-11、PB-12）。
  linked_laws:
  - P-17
  - PB-11
  - PB-12
  cross_refs:
  - TEC-L23
  - TEC-P04
  - TEC-P05
  - TEC-P15
  order_hint: 先行：严格按队排新词的第一课，剂量待定；进阶：复习旧词时按队补齐缺失的抽象端，剂量待定。
  self_check: 学一个新介词时，能说清「我现在学到它成长的哪一段」，抽象用法能指回空间图。
  misuse_warning: '**这是带例外的总体趋势，不是铁律**——个别介词的抽象用法有早于空间用法的反例记录（Rice 1999；Sandra & Rice 1995）；顺序管的是讲解展开的次序，不管遇见的次序，高频抽象搭配可整块提前认读（P-17 出处与边界原文）。'
  evidence_note: 专著框架级＋习得研究级（Johnston & Slobin 1979；Clark 1973/1974 转引），表述已按条目降格为趋势。
  status: 定版
- id: TEC-P07
  name: 指向三词先分工再填空
  zone: 小系统区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出。to/for/at 混作汉语的「给/对/向」一把抓，give it to me / for me 分不清。
  steps:
  - 先问这句指向的是什么：移动的落点→to；为了谁、奔着什么→for；瞄准的靶心点→at；
  - 填空前先在心里把三句招牌句过一遍（送到门口／为了谁／瞄准靶心）；
  - 遇到 give 类句子，先分清「接收者」还是「受益者」再选词。
  mechanism: 三词共享「指向」图式，靠落点／意图／瞄准分工区分，分工图式可迁移到未学用法（P-14，教学实验 P-10 直接以三词为内容验证）。
  linked_laws:
  - P-14
  - P-10
  cross_refs: []
  order_hint: 先行：只教空间落点与受益核心义，剂量待定；进阶：补 for 的时长义等远端引申的识别，产出仍以核心义为准，剂量待定。
  self_check: to/for/at 填空题能先报分工再落笔，错题能说清错在把哪种指向当成了哪种。
  misuse_warning: for 的时长义、to 的比较义（ten to six）属远端引申，不在小学产出范围，不许拿核心分工去硬推它们（P-14 边界）。
  evidence_note: 专著框架级（Tyler & Evans 2003）＋教学实验级（Tyler, Mueller & Ho 2011）。
  status: 定版
- id: TEC-P08
  name: 小品词先认图式，再按透明度分档记
  zone: 小系统区
  pain_point:
  - 记不住
  - 错不完
  - 读不快
  when: 记不住、错不完、读不快。短语动词逐词猜、当成无理清单死背，阅读中遇到 eat up、put out 逐字拆解还拆错。
  steps:
  - 先认小品词的两件行李：「穿过某地而动」＋「抵达终点／产生结果」；
  - 记新短语动词时先问：小品词在这里是本义（stand up）、拐个弯（make up＝编造），还是老习语（put up with）？
  - 前两档按「图式义＋动词」成组记；
  - 第三档整块记，不硬拆；
  - on 的「继续向前」义（go on、carry on）单独认作持续档，不套「结果」特征。
  mechanism: 小品词的基本义必含「经空运动＋终点/结果」两特征，由此给动词装上终点（Bolinger 1971，VB-10）；习语性只有三级，大多数短语动词可拆可解，只有最高一级才是死记的习语（VB-11）；图式义成组教与整块高频优先的折中口径见 P-15。
  linked_laws:
  - VB-10
  - VB-11
  - P-15
  cross_refs: []
  order_hint: 先行：只认 up（完结）/out（由内到外）等高频图式与透明档短语动词，剂量待定；进阶：三档分类成习惯，新词先分档再决定记法，剂量待定。
  self_check: 拿到一个新短语动词，能先报它属哪一档、打算怎么记，而不是直接抄进生词表逐个背。
  misuse_warning: 不许把助记说成推导——半透明档只可助记，完全习语化档必须整记（P-15 边界）；on 是「结果」特征的系统性例外（表持续），不许硬套两特征（VB-10 边界）；三级之间没有锐利界线（VB-11 边界）。
  evidence_note: 专著框架级（Bolinger 1971 为二手系统论述级接触，本簇最低，已按条目如实标；Lindner 1981 图式义研究为 P-15 出处）。
  status: 定版
- id: TEC-P09
  name: （卫星装法）先分「怎么动／往哪去」，再组短语动词
  zone: 小系统区
  pain_point:
  - 记不住
  - 说不出
  when: 记不住、说不出。把汉语趋向结构直译进英语，run out 类组合记不住、造不出，总觉得短语动词是凭空多背的一堆词。
  steps:
  - 看一个运动句，先分两格：大词在说什么「怎么动」，小尾巴在指「往哪去」；
  - 造句时先选方式动词，再挂路径小尾巴；
  - 和汉语对照一遍：汉语把「往哪去」装进动词系统（跑出去），英语挂成小尾巴——装法不同，不是一个词对一个词翻译；
  - 新学方式动词时顺手记它最常挂的尾巴。
  mechanism: 英语是把路径装进小品词「卫星」的语言，方式动词＋路径卫星可自由组合、能产性极高——短语动词是英语的出厂配置，不是例外清单；汉语的路径编码分工不同，错位是装法问题不是单词问题（P-19）。
  linked_laws:
  - P-19
  cross_refs: []
  order_hint: 先行：只建立「大词管动作、小尾巴管方向」的装法直觉，剂量待定；进阶：系统对照汉语趋向补语，造句时先分两格再组装，剂量待定。
  self_check: 读到或说出一个方式动词＋小品词组合，能当场分出哪格是哪格，并能换一个尾巴造新句。
  misuse_warning: 类型学说的是特征性默认模式，不是绝对禁令——英语也有路径动词（enter、exit），汉语也能细说方式，不许把框架说成「英语只有小品词表路径」的铁律（P-19 边界）；汉语归类本身三派并立（卫星／等立之争），技巧只用三派共识层：两种语言路径编码分工不同（P-19 分歧栏）。
  evidence_note: 经典理论级（Talmy 1985/2000，二手系统论述级接触；Slobin 章节预览级；汉语归类有 Chen & Guo 2009 语料实证）。
  status: 定版
- id: TEC-P10
  name: 先定看法，三出口一起定
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。冠词、复数、量词三处分开背规则，同一句里三处互相打架（much chickens 类）。
  steps:
  - 先只问一个问题：我把这东西看成「一个个」还是「一摊／一类」？
  - 看法定了，三个出口一起翻：冠词（a/零）、复数（-s 加不加）、量词（many 还是 much、few 还是 little）；
  - 集合词（family、team）多问一步：我现在看的是「一伙（一个单位）」还是「几口人（成员们）」，动词单复数跟着这一步走；
  - 双生活名词（chicken 鸡只／鸡肉）先报读法再选形式。
  mechanism: 可数性是识解（看法）的回执而非物体属性，冠词、复数 -s、量化词是同一个总开关的三个出口（C-01、C-17、C-18）；集合名词的单复数切换是同一开关在「集合体／成员集」轮廓上的运作（C-16）。
  linked_laws:
  - C-01
  - C-17
  - C-18
  - C-16
  cross_refs:
  - TEC-P15
  order_hint: 先行：只练「一个个／一摊」一问定三出口，集合词只取「整体→单数」主读法（C-16 边界），剂量待定；进阶：补集合词成员读法与双生活名词的量化翻转，剂量待定。
  self_check: 写出一句带量词的句子前，能先报看法、再一次把三处形式定齐，事后检查三处不打架。
  misuse_warning: 「有界」指呈现方式，不是物体有没有物理边框——旧「物理边界感」说法已被证伪，不许复活（C-01 边界）；模糊有界不等于任意可数，*an information 不成立，归属最终由英语习惯用法裁定（C-03 边界）；police、people 等只有复数待遇的词是词条级约定，走 TEC-P15 存货（C-16 边界）。
  evidence_note: 专著框架级（Langacker 1987/2008）＋描写定版级（Quirk et al. 1985）；有界判据定位为主导判据与教学入口，非充要定义（Nicolas 批评已登记，C-01）。
  status: 定版
- id: TEC-P11
  name: 数一摊先借单位，汉语量词直接搬
  zone: 小系统区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完。rice、advice、homework 直接加数词或 -s；想说「一条建议」无从下口。
  steps:
  - 认出「一摊／一类事」的东西（接 TEC-P10 的看法）；
  - 不直接数它，先找单位词（bowl、piece、cup）；
  - 数词与 -s 只落在单位上；
  - 心里先过一遍汉语：「一碗饭、两张纸」怎么说，英语照同一套搬；
  - 单位搭配拿不准时查存货卡（a piece of advice，不自创单位）。
  mechanism: 单位词执行分份操作，给无界的料装上可数外壳，复数落在单位上（C-05）；物质名词任意一份仍是它（同质），所以只能借单位切分（C-02）；抽象名词被整类打包成「一类事」，借单位计数与物质名词同法（C-15）。
  linked_laws:
  - C-05
  - C-02
  - C-15
  cross_refs:
  - TEC-P10
  order_hint: 先行：米饭、水、纸等实物料先行，单位串逐个记，剂量待定；进阶：抽象名词（advice、information、homework）全线接入同一办法，剂量待定。
  self_check: 说「两碗饭、三条建议」类表达时，数词与 -s 永远落在单位词上，不落在料上。
  misuse_warning: 单位本身有搭配习惯，须逐个登记，不许类推自创（C-05 边界）；口语 two coffees 是单位被省略，不是料变成了可数（C-04）；「切一切」演示只对部分物质名词有效，是助记不是定律（C-02 分歧栏）。
  evidence_note: 专著框架级（Langacker 2008；Aikhenvald 2000 量词类型学）。
  status: 定版
- id: TEC-P12
  name: 先问「对方找得到吗」，再定冠词与代词大小
  zone: 小系统区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。心里想着具体某一个就乱加 the（初次提及也加）；写作里代词乱指、或全名反复出现读不通。
  steps:
  - 落笔前替听者算一笔账：对方现在能不能定位到我说的这个？
  - 只需认出「是哪一类里的一个」→a；
  - 对方能唯一定位→the；
  - 对方根本无从找起、又是整类敞开说→零冠词；
  - 回指时同理：刚提过、对方记得牢→用小代词，隔得久或怕搞混→把全名再说一遍。
  mechanism: 指称形式是给听者的定位指令：a 只要求类型可辨识，the 要求唯一定位（C-06、C-07、C-19）；学习者按「我心里具体」选词是波动假说下的系统误判，换判据到「对方能否定位」正是对症（C-09）；代词与全名的伸缩由所指可及性定价，与冠词是同一理论的两面（PR-06）。
  linked_laws:
  - C-06
  - C-07
  - C-19
  - C-09
  - PR-06
  cross_refs: []
  order_hint: 先行：只练 a/the 两端一问，剂量待定；进阶：写作回指接入第⑤步，全名/代词伸缩自查，剂量待定。
  self_check: 每用一个 the，能当场回答「对方凭什么找得到它」；说不出凭据就改形式。
  misuse_warning: 证据（波动假说）来自成人被试，儿童的波动形态需另行观察，本条只取判据不取参数结论（C-09 边界）；类指 the（the tiger＝物种整体）不在此问的范围，见覆盖说明 C-13（C-07 边界）。
  evidence_note: 期刊实证级（Gundel, Hedberg & Zacharski 1993 跨五语言验证；Ionin, Ko & Wexler 2004）＋专著框架级（Siewierska 2004，章节预览级接触）。
  status: 定版
- id: TEC-P13
  name: 说 the 之前先过五条路
  zone: 小系统区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。the 的滥用与漏用没有抓手，改错全靠语感。
  steps:
  - 上文刚提过吗（回指）？
  - 有没有关联物能带出它（a wedding → the bride）？
  - 句中修饰语能不能当场锁定（the book on the desk）？
  - 它就在眼前情境里吗（Pass me the salt)？
  - 是不是全世界只有一个的常识（the sun）？
  - 五路皆无，退回 a 或零冠词。
  mechanism: 定指是「说话人发出的定位任务＋听者手头的线索」的匹配，五条路是线索的全部来源；清单的用途是纠错定位——错在缺哪条路（C-08，承 C-07）。
  linked_laws:
  - C-08
  - C-07
  cross_refs: []
  order_hint: 先行：前段后期起用五路清单做选词自查，剂量待定；进阶：写作修改环节逐个 the 过清单，关联类（最晚习得）重点练，剂量待定。
  self_check: 随机挑出自己写的一句带 the 的句子，能指出它走的是五路中的哪一条。
  misuse_warning: 五路是充分线索清单，不是每个 the 都要当场验算——它是纠错工具，不是产出前的审批流程（C-08 边界）；类指 the 不走此清单（C-08、C-13）。
  evidence_note: 专著框架级（Hawkins 1978）＋期刊实证级（Liu & Gleason 2002：五路难度显著不同，关联类最晚）。
  status: 定版
- id: TEC-P14
  name: 冠词出错先分型，再吃药
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。冠词错一大片，笼统「多练冠词」不见效，同一类错反复犯。
  steps:
  - 把错句收集起来逐个标型：漏用（该加没加）、滥用（the 泛化到泛指）、替换（a/the 选反）；
  - 漏用型先立槽位规矩：单数可数名词前必须有个小词；
  - 滥用型换判据：改用 TEC-P12 的「对方找得到吗」重判一遍；
  - 替换型练线索：用 TEC-P13 五条路逐个核；
  - 一周后只复看自己最高频的那一型。
  mechanism: 三型错误对应三个不同心理环节（范畴缺位、参数未定版、线索评估不熟），干预须对准出故障的环节（C-20）；中国学习者冠词错误以漏与滥为主、居名词短语错误前列，是 CLEC 的描写格局（C-10）。
  linked_laws:
  - C-20
  - C-10
  cross_refs:
  - TEC-P12
  - TEC-P13
  order_hint: 先行：分型以教师诊断为主，学生只执行「先立槽位」一药，剂量待定；进阶：学生自己标型自查，按型吃药，干预顺序先漏用、再滥用、后替换（C-20 边界），剂量待定。
  self_check: 拿出自己最近的五处冠词错，能逐个说出属哪一型、该吃哪服药。
  misuse_warning: 分型是教学诊断工具，不是给学生的标签；同一人可同时有两型，不许一刀切（C-20 边界）；CLEC 以书面语为主，口语错误形态可能不同（C-10 边界）。
  evidence_note: 语料库描写级（CLEC，桂诗春、杨惠中 2003）＋期刊实证级（Ionin et al. 2004；Liu & Gleason 2002）。
  status: 定版
- id: TEC-P15
  name: 做事还是去楼，先分读法
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。go to school / go to the school、in hospital 类冠词全靠蒙，错了也不知错在哪层。
  steps:
  - 先问：我说的是「去做那件事」还是「去那栋楼／那件东西」？
  - 做事（上学、睡觉、看病）→零冠词；
  - 指实物建筑→按 TEC-P12/P13 正常加冠词；
  - 拿不准的个案查存货，不硬推。
  mechanism: 机构名词的活动读法把名词识解为制度/活动（类型层），脱去个体性故零冠词；实物读法拉回个体层，冠词系统正常运作——冠词在这里标的是读法切换（C-11）。
  linked_laws:
  - C-11
  cross_refs:
  - TEC-P12
  - TEC-P16
  order_hint: 先行：school、bed 两组对子先行，剂量待定；进阶：成套对立（prison、bus 类）补齐，剂量待定。
  self_check: 说出去 school 类句子前，能先报「我现在说的是事还是楼」。
  misuse_warning: 这是倾向不是铁律——美式英语住院说 in the hospital，与英式零冠词并存，按约定单记（C-11 边界与例外登记）；乐器类活动读法反而加 the，不许拿本条去推（走 TEC-P16)。
  evidence_note: 项目模型主张级（boundedness.yaml 倾向型主张）＋教学框架级（Master 1997，经转述核实）。
  status: 定版
- id: TEC-P16
  name: 只记不讲：约定搭配整串存货
  zone: 小系统区
  pain_point:
  - 错不完
  - 记不住
  when: 错不完、记不住。给 play the piano、on foot 这类搭配硬编理由，编出的伪因果又扩散到别的词上继续出错。
  steps:
  - 遇到机制推不出的搭配，停手，不编理由；
  - 整块抄进「存货卡」，注明「这里没有为什么」；
  - 按串存：乐器串（play the piano/guitar…）、球类串（play football/basketball…）成串记，不逐个散记；
  - at night、on foot 等已裁定的固定习语同样入卡；
  - 复习只看卡，不临场现编解释。
  mechanism: 语言是「有理据的部分＋约定沉淀的部分」的混合物，约定部分靠频率与整块记忆习得，强行理据化会产生错误迁移（C-12）；本项目审查史有反面裁定：旧库曾为 on foot 编造「双脚踩地接触」的伪因果并被删除（C-12 支撑、P-04 边界）。
  linked_laws:
  - C-12
  - P-04
  cross_refs: []
  order_hint: 先行：存货卡从第一批乐器/球类搭配开始建，剂量待定；进阶：卡片成串复习，新遇约定搭配先入卡再使用，剂量待定。
  self_check: 被问「为什么 play the piano 加 the」时，能回答「约定，整串记的」并报出整串，而不是现编一条因果。
  misuse_warning: 约定不等于任意——串内部高度一致才可按串整记（C-12 边界）；play guitar 在现代口语中的松动属正在变化的用法，只登记为倾向，不拿来推翻存货卡（C-12 边界）。
  evidence_note: 项目裁定级（boundedness.yaml 例外登记）＋用法词典定版级（Swan《Practical English Usage》第 4 版冠词条目 134–143）。
  status: 定版
- id: TEC-P17
  name: a/an 只听第一个声音
  zone: 小系统区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出。按字母选 a/an,an university、a hour 类错误反复出现。
  steps:
  - 先把后面的词读出声；
  - 听第一个声音：是元音就用 an 垫住，是辅音就用 a;
  - 专盯两个陷阱组：h 不发音的（an hour、an honest…）与读辅音滑音的（a university、a one…）；
  - 写完读一遍再交，耳朵比眼睛说了算。
  mechanism: a 与 an 是同一个词（源于古英语 ān「一」）的两副面孔，形态由语音衔接决定，与拼写无关（C-14）。
  linked_laws:
  - C-14
  cross_refs: []
  order_hint: 先行：两组陷阱词成组认读，剂量待定；进阶：写作自查加「读出声验 a/an」一步，剂量待定。
  self_check: 给十个新词选 a/an，先读后选，全对且能说清每处听的是哪个音。
  misuse_warning: an historic(al）等边缘用法属历史残余与方言/正式文体现象，本技巧一刀切按读音判据，不展开（C-14 边界）。
  evidence_note: 词源定版级（OED/Etymonline 口径，项目模型 etymology 型主张）。
  status: 定版
- id: TEC-P18
  name: 每句先摆「谁」，再往下说
  zone: 小系统区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。作文与说话中成串漏主语，开头提一次人，后面句子全没了主语；老师一批改就一片红。
  steps:
  - 动笔/开口前先给每一句点名主语；
  - 学汉语接龙的反面：汉语话题链里省掉的，英语逐句一个不落补回来；
  - 没有实义主语可摆时，用 it/there 顶位（下雨→It is raining)；
  - I 永远大写、永远在场，不随话题链省略；
  - 写完回读，只查一件事：每句的「谁」都在不在。
  mechanism: 汉语是话题优先＋话题链的语言（首句立话题、后续零形式承接），英语是主语优先的语言（每小句必须有显性主语）——漏主语是两套类型对撞的可预测产物，不是粗心（PR-08）；英语动词人称一致几乎磨光，主语识别只能全压在必须出现的代词上（PR-07）。
  linked_laws:
  - PR-08
  - PR-07
  cross_refs: []
  order_hint: 先行：看图说话、写小句时逐句点名，剂量待定；进阶：段落写作回读专查主语在场，剂量待定。
  self_check: 随机抽自己写的一段，每句都能当场指出主语是哪个词。
  misuse_warning: 英语口语的日记体省略（Went home early.）是语体现象，不能拿来给漏主语背书（PR-07 边界）；纠错按结构习惯教，不按态度罚——本技巧的定位是换组织习惯，不是「细心一点」（PR-08、对照节登记）。
  evidence_note: 经典理论级（Li & Thompson 1976/1981，二手系统论述级接触）＋实证级（2011 诱发实验：话题特征迁移呈剂量—反应）。
  status: 定版
- id: TEC-P19
  name: 天气句先摆「大环境」it
  zone: 小系统区
  pain_point:
  - 错不完
  when: 错不完。Is raining.、Is cold today. 类漏 it 与普通漏主语同根，屡改屡犯。
  steps:
  - 认出「天气/时刻/距离」类句子；
  - 开口先摆 it，把它想成「周围这一整片情况」（天、时候、冷热全包）；
  - 再接 is＋后面的话；
  - 与 TEC-P18 合查：回读时天气句单独扫一遍 it 在不在。
  mechanism: 这个 it 不是没意思的占位符，它指着笼罩整个情境的环境本身（Bolinger 的 ambient it，PR-10）；汉语气象句是无主语句，「虚假主语成零」本就是话题优先的特征之一，漏 it 与漏普通主语同根（PR-08）。
  linked_laws:
  - PR-10
  - PR-08
  cross_refs:
  - TEC-P18
  order_hint: 先行：天气播报类句型成组练，剂量待定；进阶：时间、距离句（It is five. / It is far.）并入同一检查，剂量待定。
  self_check: 描述今天天气连说三句，每句 it 都在场，且能说出「it 指周围这一片」。
  misuse_warning: '**分歧并呈**——Quirk et al. (1985）的定版表述是此 it 语义内容极少或全无（占位说），Bolinger 的环境说是挑战方；本技巧的讲法取 Bolinger（对汉语学习者可解释），不替学界拍板，也不许反过来说占位说「错了」（PR-10 分歧栏）。'
  evidence_note: 专著框架级（Bolinger 1977，二手系统论述级接触；Langacker 1991 接受并发展环境说）。
  status: 定版
- id: TEC-P20
  name: There be 先想「要介绍什么新东西」
  zone: 小系统区
  pain_point:
  - 错不完
  - 写不长
  when: 错不完、写不长。作文里 There is… 一句接一句地开场，本该直接说主语的内容全绕成存现句，读起来又绕又空。
  steps:
  - 落笔前先问：我这句是要「介绍一个新东西出场」，还是「说一件已知的东西怎么样」？
  - 介绍新东西→There be 正确使用，放心用；
  - 说已知的东西→把主语直接摆出来说，不绕存现句；
  - 写完通读，把连开三次以上的 There be 逐个复查。
  mechanism: 中国学习者过产存现句，是把英语 there be 当作汉语式的话题引入装置——先立新所指再围绕它展开；错误形态由目标语决定，错误动机由母语的语篇功能决定（Schachter & Rutherford 1979 的功能→形式迁移，PR-09）。
  linked_laws:
  - PR-09
  cross_refs: []
  order_hint: 先行：高段写作起用「介绍/陈述」一问分流，剂量待定；进阶：段落修改环节专查存现句密度，剂量待定。
  self_check: 自己一段里每个 There be 都能回答「我在介绍什么新东西」；答不出的已改成主语直述。
  misuse_warning: 源研究样本为成人书面英语，儿童口语中的功能迁移形态与之同源但不完全同形，引用时只取诊断法不取分布结论（PR-09 边界）；Schachter 本人后来对「迁移」概念另有重构，本条用 1979 年功能迁移说作教学诊断的近似（PR-09 分歧栏）。
  evidence_note: 期刊实证级（二手系统论述级接触：ERIC 记录与剑桥摘要双核，Han 2000 纵向再验证）。
  status: 定版
- id: TEC-P21
  name: he/she 在限时口头里练，不在笔头练
  zone: 小系统区
  pain_point:
  - 说不出
  - 错不完
  when: 说不出、错不完。笔头选 he/she 全对，一开口说话就说反，越紧张错越多。
  steps:
  - 练法换场：不在纸上选词，改成看图限时说（指一个人，几秒内说出他/她在做什么）；
  - 说的时候先在心里闪过「男/女」再开口，把性别当作开口前的必填项；
  - 录音回听，专抓说反处，自己标记；
  - 错在哪儿补哪儿：只重练说反的那几张图。
  mechanism: he/she 混用的病灶在言前信息的性别编码——汉语 tā 同音使性别从未成为产出的必填项，口语实时压力下编码脱落；书面可回视故错误骤降，所以训练必须落在口头快速产出上（PR-11）。
  linked_laws:
  - PR-11
  cross_refs: []
  order_hint: 先行：看图说话环节嵌入限时指图说，频次剂量待定（条目只给机制与训练形态，未给剂量）；进阶：限时复述故事时专查第三人称，剂量待定。
  self_check: 限时指图连说十句，录音回听 he/she 零说反；笔头对、口头错的不对称消失才算过关。
  misuse_warning: 证据样本为大学生与成人学习者，儿童的混用率与干预效果需另行观察，本条只取机制不取数值（PR-11 边界）；条目所引跨母语错误率数字（Chen 2004）经预印本转述、原文未核，**不许引用该数字**（PR-11 支撑栏注记）。
  evidence_note: 期刊实证级（Frontiers in Psychology 2021 综述+实验，PMC 全文；病因两说——迁移说与言前编码说——并呈）。
  status: 定版
- id: TEC-P22
  name: 按类记动词：先归家，再造句
  zone: 小系统区
  pain_point:
  - 记不住
  - 错不完
  when: 记不住、错不完。动词一词一卡地散背，学了新词不知道它能进什么句型、不能进什么句型，全靠碰运气试错。
  steps:
  - 学生词先归家：它和哪个已学动词是「一家人」（切的一家、碎的一家、给的一家、放的一家）？
  - 把新词写进家族页，不写进散词表；
  - 造句前先查家族档案：这家人能怎么摆、不能怎么摆；
  - 没见过的词先按语义猜它属于哪家，再用家族档案预判它的句型，查证后修正归类。
  mechanism: 动词能进哪些句型先由它的意思决定（交替是探针），同类成员共享一组句型行为——先归类再预判，没见过的词也能猜出七八分（VB-01、VB-03）。
  linked_laws:
  - VB-01
  - VB-03
  cross_refs: []
  order_hint: 先行：只取高频大类（切、碎、给、放、运动），剂量待定（VB-03 边界：48 类全表是词典学家的工具，不是课表）；进阶：家族页成系统，新词入库先归家成为固定动作，剂量待定。
  self_check: 给一个刚学的动词，能先报它属哪家、预判两条能进/不能进的句型，再查证对错。
  misuse_warning: 类别边界有模糊带，多义词按义项跨类归家，不许按词形一刀切（VB-03 边界）；分类是调查的立足点，不宣称心理实在性（VB-03 分歧栏）。
  evidence_note: 专著框架级（Levin 1993，目录+书评级接触；分类后被 VerbNet 继承为计算词典骨架）。
  status: 定版
- id: TEC-P23
  name: cut/break 先问「自带刀吗」
  zone: 小系统区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出。*The bread cut. 类句子脱口而出；反过来该省施事时又不敢省，把「杯子碎了」说得又绕又错。
  steps:
  - 造句前先问：这个动词只说「结果」，还是自带「怎么弄＋工具」？
  - 只说结果的（break 家）：东西可以自己变样，施事可省（The window broke.）；
  - 自带刀的（cut 家）：必须把动手的人（或工具）摆出来，不许让东西「自己切」；
  - 拿不准时用尝试式验一下：能说 cut at the bread 的，多半是自带方式的一家。
  mechanism: break 只词汇化纯状态改变、不说明如何发生，故能进致使/起始交替；cut 词汇化了利刃工具与施事方式，施事缺席则句子崩坏（VB-02）；总原理是方式/结果互补——一个词根只写一端（VB-04）。
  linked_laws:
  - VB-02
  - VB-04
  cross_refs: []
  order_hint: 先行：break/cut 两家招牌对照先行，剂量待定；进阶：推广到整个「方式词 vs 结果词」的造句检查（结果词查宾语是否受影响、方式词查结果要不要另补），剂量待定。
  self_check: 造「东西自己变样」类句子前，能先判动词属哪家再决定省不省施事，且判得对。
  misuse_warning: 互补是强倾向不是无例外定律，climb、cut 本身是长期战例，不许把本技巧说成铁律（VB-04 边界与分歧栏）；cut 类内部仍有细差（carve 更强调成形结果），家族档案按 VB-02 登记，不许一把尺量全家（VB-02 边界）。
  evidence_note: 专著框架级（Levin 1993 招牌分析 pp.5–9，经多篇学术转述逐页核实；方式/结果互补为其 1995/2010 后续发展，与原书分开标注）。
  status: 定版
- id: TEC-P24
  name: 完成时先问「现在还算数吗」
  zone: 小系统区
  pain_point:
  - 错不完
  - 读不快
  when: 错不完、读不快。过去时与完成时靠「有没有明确过去时间」一条口诀硬分，遇到 I have lost my key 类句子选不对、读不懂为什么用完成时。
  steps:
  - 先不想时间，先问：这件过去的事，后果现在还立着吗？
  - 还立着（现在没钥匙、车已经到了）→完成时；
  - 只是讲一段已关闭的过去→过去时；
  - 再按用法分型核对：持续型（has been empty for ages）还是经历—结果型（has arrived）;
  - 最后才看时间状语帮不帮忙。
  mechanism: 完成体表达的是「过去牵着现在」(past involving the present)——难点本质是**选择**：同一件过去的事，选哪种形式取决于说话人要不要把它和现在挂钩（Leech，VB-05）。
  linked_laws:
  - VB-05
  cross_refs: []
  order_hint: 先行：不适用（完成体不在前段产出范围，本技巧为进阶条目）；进阶：选择判读成固定第一步，剂量待定。
  self_check: 给一组过去事件，能先报「后果现在还在吗」再选形式，错题能指出错在挂钩判断而非时间状语。
  misuse_warning: 「现时相关」在学界有批评（Dahl & Hedin、McCoard：更像自然推理而非基本义），本技巧用 Leech 的用法清单＋选择框架作课堂判读工具，不宣称统一式已定案（VB-05 边界与分歧栏）。
  evidence_note: 专著框架级（Leech 1971/2004，目录+书评级接触；与 Comrie、Palmer 三家互证）。
  status: 定版
- id: TEC-P25
  name: 进行时过三件套，情态先问「谁的判断」
  zone: 小系统区
  pain_point:
  - 错不完
  - 说不出
  when: 错不完、说不出。进行时只会一句「正在进行」，碰上状态动词与 always＋进行时就翻车；请假、请求时把 must 乱安到别人头上，语气生硬自己还不知道。
  steps:
  - 进行时判读过三关：有没有「持续」？是不是「眼下这一阵」（有限期）？有没有说做完（不必做完）？
  - 配上 always/forever 还用进行时时，改读「反复、夸张」的习惯色彩，不按「正在」硬解；
  - 用情态词前先问：这个「必须/可以」是我此刻的判断，还是外面的规矩？
  - 自己的判断→must；外部规矩摆在那儿→have to；回忆过去的「必须」只能用 had to，没有「过去的 must」;
  - 想把话说软时，把形式「退一格」（I wanted to ask… / I was wondering…），退一格同时退时间、退现实、退关系。
  mechanism: 进行体的意义可拆为持续、有限持续、不必完成三件套，临时性缺席时的特殊读法正由成分表解释（Leech，VB-06）；情态词的共义是说话人在说话时刻的判断，must 恒含说话人判断、have to 表客观必然（Lewis，VB-13）；命题情态与事件情态先分阵营再选形式（Palmer，VB-08）；「退一格」是第二形式「遥远」通义在礼貌与假设上的同一动作（VB-09、VB-12）。
  linked_laws:
  - VB-06
  - VB-13
  - VB-08
  - VB-09
  - VB-12
  cross_refs: []
  order_hint: 先行：不适用（成分核查与情态判断均为进阶条目；前段进行时只取「镜头看中间一段」的直觉，不在本技巧内）；进阶：判读与产出双练，剂量待定。
  self_check: 读到一句进行时能逐项报三件套在不在；说一句带 must 的话前能先报「这是我的判断还是规矩」，并能当场改出 have to 版。
  misuse_warning: must 的主观性在制度化语境（规章条文）中被中和，主观/客观是倾向不是铁律（VB-13 边界）；三件套是描写工具，进行时的礼貌试探与将来安排用法不能从三件套直接推出，须另行登记（VB-06 边界）；Palmer 的「主观」（范畴定义）与 Sweetser 的「主观化」（认知路径）含义不同，引用不可混用（VB-08 分歧栏）。
  evidence_note: 专著框架级（Leech 目录+书评级；Palmer 目录+书评级；Lewis 章节预览级，为本簇最高之一）。
  status: 定版
- id: TEC-L31
  name: 听之前，先把要听的东西猜出来写下
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——录音一响就慌，脑子空白，前几句全错过；听完只记得零碎几个词，说不出这段到底在讲什么。
  steps:
  - 听之前先看标题、图片或题目，用半分钟说清「这大概是讲什么的、在什么地方、都有谁」；
  - 把猜到的关键词写下来三五个（人、地点、要发生的事）；
  - 带着这几个词去听第一遍，边听边在猜中的词旁打勾；
  - 猜错的当场划掉、改写成听到的；
  - 听完先看自己的猜测单：中了几个、错在哪个词。
  mechanism: 听懂不是从零接收声音——听者靠已激活的背景知识与预期缩小「下一个词可能是什么」的范围，工作记忆才腾得出手来切分语流。把「计划与预测」设为听力课的第一步、并要求写下来供后面核对，是元认知教学序列的开场动作（Vandergrift & Goh 2012，第 6 章教学序列，序列图见该书 p.109–110）；同一做法在小学生身上做过专门实验：八节带预测与听后反思的课之后，学生对听力任务的要求与应对办法的认识明显变好，弱听者受益最大（Goh & Taib 2006）；听前准备作为独立阶段的经典划分见 Underwood（1989）的听前／听中／听后三段式（该书 p.30：把学生直接扔进听力文本是「不公平的」）。
  linked_laws: []
  cross_refs:
  - TEC-L32
  order_hint: 无前置，是任何一次听力活动的第 0 步；须排在 TEC-L32（第一遍抓大意）之前。剂量：每次听力活动都做，猜词个数源文献未给定数——三五个是本条的操作化取舍，非源文献参数。
  self_check: 听完能指着猜测单说出「我猜中了什么、哪个词把我带偏了」；说不出猜过什么，说明这一步是走过场。
  misuse_warning: 预测是用来被推翻的，不是标准答案——猜错不扣分、不许因为怕猜错就不猜；预测单若由成人全包办、孩子只抄，激活的是成人的图式不是孩子的，本条失效（Goh & Taib 2006 的形态是教师引导讨论、学生自己产出预测）。
  evidence_note: "同行评审研究＋经典专著——Vandergrift, L. & Goh, C. C. M. (2012). *Teaching and Learning Second Language Listening: Metacognition in Action*. New York: Routledge（第 6 章）；Goh, C. C. M. & Taib, Y. (2006). Metacognitive instruction in listening for young learners. *ELT Journal*, 60(3), 222–232. https://doi.org/10.1093/elt/ccl002 ；Underwood, M. (1989). *Teaching Listening*. London: Longman。"
  audience: 学生自用／亲子共用（成人只提问、不代猜）
  status: 定版
- id: TEC-L32
  name: 第一遍只抓大意，笔下只记「喊得响」的词
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——一上来就想听清每个词，结果卡在第二个生词上，后面整段全丢；听完问他讲了什么，只憋得出一个词。
  steps:
  - 第一遍前先说清：这一遍不答细节题，只回答一句话——「这段在讲什么事」；
  - 听的时候笔不许停在生词上，只记下**听得最清楚、被重读的实词**（多半是名词、动词，一段记三到六个）；
  - 听完看着这几个词，用中文或英文拼出一句话大意；
  - 拼不出就标出「缺了哪一环」（谁？做了什么？在哪？），留到第二遍（TEC-L34）专门去补；
  - 细节问题一律推迟到第二遍以后。
  mechanism: 听力加工分两层——先把声音切成词（解码），再把词搭成意思（意义建构）；初学者的解码不自动，一遍之内两层抢同一份注意力，逐词硬抠必然丢整段（Field 2008 的过程取向：解码与意义建构之分）。重读的实词是英语语流里最稳的落点：词重音与句子重音落在信息词上，先抓住它们等于先拿到骨架，细节第二遍再挂（Field 2003 专论词汇切分：重音模式是 L2 听者切分语流的主要线索之一）。
  linked_laws: []
  cross_refs:
  - TEC-L31
  - TEC-L34
  order_hint: 前置 TEC-L31（预测单在手边）；是 TEC-L34（第二遍定向追听）的上游。剂量待定（遍数由材料难度决定，源文献未给参数）。
  self_check: 第一遍结束就能用一句话说出大意，并能指出「我缺的是哪一环信息」；若只能复述零散单词，本条未过。
  misuse_warning: 只记重读词是**第一遍的纪律**，不是听力方法论——若永远只抓大意、从不进第二遍抠细节，就退化成「猜个大概」的习惯（Field 2008 对只练理解题、从不教加工过程的理解法课堂的批评正指于此）；记词时抄长句、写中文全译，都会把注意力从耳朵上抢走。
  evidence_note: "经典学术专著＋同行评审——Field, J. (2008). *Listening in the Language Classroom*. Cambridge: Cambridge University Press；Field, J. (2003). Promoting perception: Lexical segmentation in L2 listening. *ELT Journal*, 57(4), 325–334。"
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L33
  name: 听完先跟同桌对一遍，再看答案
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——答案一公布就只看对错，「我刚才其实听到了、只是不敢信」和「我压根没听到」混成一团，下次照样错。
  steps:
  - 第一遍听完，先不公布答案，两人一组把各自听到的大意与答案互相说一遍；
  - 说的时候必须带证据：「我选 B，因为我听到……」；
  - 两人不一致的地方，各自把「我听到的声音」尽量原样复述出来，看分歧是词不同还是理解不同；
  - 把分歧点记下来，作为第二遍（TEC-L34）的追听清单；
  - 第二遍听完，再回头看：分歧是听清了，还是本来就是生词／知识问题。
  mechanism: 核对环节的价值不在对答案，而在把「我脑子里建了什么」外显出来给同伴和自己看——同伴的版本是最便宜的一面镜子，分歧点自动生成下一遍的定向目标。这是元认知教学序列里「讨论／验证」阶段的标准动作（Vandergrift & Goh 2012，第 6 章：第一遍后先自查预测、再同伴讨论、然后才第二遍）；Underwood（1989）的课堂惯例同样是「让学生在两遍之间互对答案」，理由是给学生喘息并重新考虑的机会，而不是被教师直接宣判。
  linked_laws: []
  cross_refs:
  - TEC-L31
  - TEC-L32
  - TEC-L34
  order_hint: 前置 TEC-L31、L32（有预测单和第一遍大意可对）；其产出（分歧清单）是 TEC-L34 的输入。单人使用时降格为「先把自己的版本说出声／写下，再对照」。
  self_check: 第二遍开始前，能明确列出「我要去确认的一两个地方」；列不出，说明核对流于聊天。
  misuse_warning: 同桌对答案不是抄答案——只报字母不对理由的，本条无效；两人水平相当时可能一起错，互对不能替代最后的权威核对，它的产出是追听清单而不是最终答案（Vandergrift & Goh 2012 的序列里，文本／教师核对在最后阶段才出现）。
  evidence_note: 经典专著——Vandergrift & Goh (2012)，同 TEC-L31；Underwood, M. (1989). *Teaching Listening*. Longman。
  audience: 学生自用（双人）／亲子共用（成人扮同桌，只问「你听到的是什么」，不先说自己的版本）
  status: 定版
- id: TEC-L34
  name: 第二遍不重听全部，只追卡住的那几秒
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——第二遍从头放到尾，耳朵又「整段滑过去」，卡住的地方还是卡住；听三遍和听一遍没区别。
  steps:
  - 第二遍开始前，先从预测单（L31）和分歧清单（L33）里圈出一到三个「没拿下」的点：一个细节、一个数字、一个没听清的词；
  - 只重听包含这些点的短片段（前后各留一两秒），其余部分跳过；
  - 每追一个点，先说出「我要听的是……」，听完立刻写下听到的声音，哪怕只能写个大概；
  - 三遍追不下来的点，不许无限重播——转 TEC-L35 微听写对账，或登记为生词问题回词汇线处理；
  - 追完后把整段连起来再顺听一遍，确认片段接得回去。
  mechanism: 元认知序列把第二遍定义为「带问题听」——监控（发现哪里断了）与定向注意（只对断点加工）是熟练听者与不熟练听者的关键分野（Vandergrift & Goh 2012，第 6 章第二遍听与问题识别阶段）；策略教学实验里，「核实—再听确认」是被成串教授的策略之一，对低水平听者成绩与自我效能均有实测增益（Graham & Macaro 2008）。整段无目标重播之所以无效，是因为注意力均匀分布等于没有分布（同 Field 2008 对「多听≠会听」的批评口径）。
  linked_laws: []
  cross_refs:
  - TEC-L31
  - TEC-L33
  - TEC-L35
  order_hint: 前置 TEC-L33（分歧清单）或 TEC-L31（预测单未中项）；追不下来的点向 TEC-L35 移交。剂量：源文献未给每点重播上限，「三遍转对账」是本条操作化取舍。
  self_check: 每次第二遍结束后，能说出每个圈定点的结局（听清了／确认是生词／仍未解决已登记）；说「好像都听懂了」但指不出点的，不算过。
  misuse_warning: 追听不是把整段逐句抠译——目标点以外的部分不许顺手翻译；成人代劳圈点、孩子只负责听，等于把监控这一步外包，本条核心收益（自己发现断点）即告丧失。
  evidence_note: 同行评审研究＋经典专著——Graham, S. & Macaro, E. (2008). Strategy instruction in listening for lower-intermediate learners of French. *Language Learning*, 58(4), 747–783. https://centaur.reading.ac.uk/7993/ ；Vandergrift & Goh (2012)，同前。
  audience: 学生自用／亲子共用／教师课堂用（圈点由学生出）
  status: 定版
- id: TEC-L35
  name: 只把没听清的半句写下来，跟原文对账
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——某几个词明明学过，录音里就是听不出来；老师把原文一亮，「哦，原来是这个词」，下次照样听不出。
  steps:
  - 从追听（L34）仍未解决的点里挑最短的一截（半句到一句）；
  - 把这截反复听，听到什么写什么——写不出词就按声音拼，拼不出就画横线占位；
  - 写满自己能写的之后，打开原文逐词对账，在三类地方做不同记号：听漏的音、切错界的词、形对了但没敢认的词；
  - 把对账结果按三类各写一句「我栽在……」；
  - 同类栽点攒够三个，交给教师／家长安排同类微练习（或回 TEC-L38 类专项）。
  mechanism: 这是 Field 主张的**微听力（micro-listening）**：听力课的病根是只测理解、不教加工；把练习缩小到单个子技能（切分、辨音、词形匹配），失败点才暴露得出来（Field 1998／2008）。Wilson（2003）的「发现式听力」给出了完整课堂形态：听—凭笔记重构—与原文逐字比对—把错误按「没听到音／切不开／生词」归类——学生自己发现并优先排序自己的听力困难，知觉加工随之改善；其错误分类法与本条的对账三类同构。
  linked_laws: []
  cross_refs:
  - TEC-L34
  - TEC-L38
  order_hint: 前置 TEC-L34（已有明确追不下来的点）；严禁拿整篇新材料直接开写（见误用警告）。剂量：每次只处理一到三截短片段，源文献未给频次参数，剂量待定。
  self_check: 对账后能不看原文说出「这一截我栽在哪一类」；下次同类材料里同一栽点不再出现，才算吸收。
  misuse_warning: 本条是**诊断型微听写**，不是传统整篇听写测试——拿长材料逐句听写、按错字扣分，是听写在历史上被诟病的形态，与本条目的相反（分歧见附②分歧一）；对账时只改答案不分类，等于把发现环节扔掉，本条退化成抄原文。
  evidence_note: "同行评审研究＋经典学术专著——Wilson, M. (2003). Discovery listening—Improving perceptual processing. *ELT Journal*, 57(4), 335–343. https://doi.org/10.1093/elt/57.4.335 ；Field, J. (1998). Skills and strategies: Towards a new methodology for listening. *ELT Journal*, 52(2)；Field (2008)，同前。"
  audience: 学生自用（初中为主）／亲子共用／教师课堂用（小学由成人控制片段长度与对账讲解）
  status: 定版
- id: TEC-L36
  name: 对完账，再盖住原文整段听最后一遍
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——看原文时全懂，一合上原文再听还是抓不住；「认字」和「认声」是两套互不相识的库存。
  steps:
  - 完成 TEC-L35 对账后，原文再看最后一遍，手指点着读，心里把每个词的「声音样子」过一次；
  - 合上原文，整段连听一遍，这一遍不做任何题，只干一件事：每个词路过时在心里确认「这个我刚才对过账」；
  - 听完自评：还有哪一截是「眼睛认得、耳朵不认得」的，圈出来——这是下一轮 L35 的优先候选；
  - 同一材料到此收尾，不再重复（转入 L42 泛听池或归档）。
  mechanism: 原文对照的价值不在「看懂」，而在建立音—形对应：知道词长什么样之后再听，语流里的切分线索（重音、弱化、连读）才有机会被知觉系统重新登记。Wilson（2003）发现式听力的收尾步正是「不再看文本地再听一遍并自评理解」；Field（2008）改造后的理解法流程亦把「带文本听（listen with tapescript）」放在无文本听力之后作为收口环节，而非开场——顺序反了，文本就变成拐杖而不是对账单。
  linked_laws: []
  cross_refs:
  - TEC-L32
  - TEC-L34
  - TEC-L35
  - TEC-L42
  order_hint: 前置 TEC-L35；顺序硬约束：必须排在至少两遍无文本听力（L32、L34）之后。剂量待定。
  self_check: 最后一遍能做到「词过耳即确认」，且能准确圈出残余的音形不认点；若整段仍多处对不上，回 L35 缩小片段再对账。
  misuse_warning: 先看文本再听（预读原文）是本条的反面——那会把听力课上成阅读课，知觉问题永远暴露不出来（Field 2008 对理解法流程的批评点之一）；最后一遍若变成跟读原文出声，练的是朗读不是听辨，本文件口径下不算完成本条。
  evidence_note: 同行评审研究＋经典学术专著——Wilson (2003)；Field (2008)，出处同 TEC-L35、L32。
  audience: 学生自用／亲子共用
  status: 定版
- id: TEC-L37
  name: 语速不靠「放慢录音」，靠「短段原速多遍」
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——一说「太快了」就把录音调到 0.75 倍，慢速全懂、原速一上考场就崩；或者反过来硬扛长篇原速，整段放弃。
  steps:
  - 材料按原速听，不动变速键；
  - 把材料切短：一次只攻 10–30 秒一截（切段法见 TEC-L40）；
  - 同一截按 L32→L34→L35 的顺序多遍加工，听清一截再下一截；
  - 整段打通后，最后完整原速顺听一遍收尾；
  - 实在需要降速时只降一档、且只用于第一次摸底，摸完必须回原速重听同一截对账。
  mechanism: 语速实验的结论是「慢有帮助，但有顶」：低中级听者在约 127 词／分时理解最好，188、250 词／分显著变差；但再往下放慢，收益迅速递减，且中高级听者在 145–185 词／分之间无显著差异——慢不是万能药（Griffiths 1990、1992 的语速实验系列；Blau 1990／1991 的无差异结果，分歧见附②分歧二）。更关键的是：人为放慢会把弱读、连读、吞音一并「修平」，而这些恰是原速里必须学会解码的东西；短段多遍则是在保住真实信号的前提下，用重复换加工时间（反复听同一文本的价值，Nation & Newton 2009, p.51）。
  linked_laws: []
  cross_refs:
  - TEC-L32
  - TEC-L34
  - TEC-L35
  - TEC-L40
  order_hint: 与 TEC-L40（切段）配套使用；前置无。剂量：语速数字只引源研究口径（127 词／分一带为 Griffiths 低中级样本的最优值），不外推为儿童参数——儿童最优语速无源数据，剂量待定。
  self_check: 同一截材料，最终能在原速下一次听清关键信息；只能在慢速下听清的，不算过关。
  misuse_warning: 把全部材料长期放慢，是拿考试与真实场景的原速去换课堂里的虚假成就感（见分歧二）；反之，对刚起步者全程原速长材料硬扛，同样违背本条——本条的单位是「短段」，不是「整篇硬听」。
  evidence_note: "同行评审研究——Griffiths, R. (1990). Speech rate and NNS comprehension: A preliminary study. *System*, 18(2)；Griffiths, R. (1992) 语速后续实验（127／188／250 词／分三档比较，低中级学习者样本）；Blau, E. K. (1990/1991) 语速无显著差异结果（145–185 词／分，中高级样本）；Nation, I. S. P. & Newton, J. (2009). *Teaching ESL/EFL Listening and Speaking*. New York: Routledge."
  audience: 学生自用／亲子共用（切段与变速由成人控制时，目标仍须原速收尾）
  status: 定版
- id: TEC-L38
  name: 专门练听词尾：-s、-ed、-ing 一组一组地听
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——句子意思大概懂，但「是一个还是几个、是做了还是在做」总听岔：dogs 听成 dog，walked 的尾巴没听见，时间关系全靠猜。
  steps:
  - 挑一组只差词尾的句子（如 cat/cats、walk/walked/walking），先不看文本听，每句只判断一件事：尾巴是「有还是没有、是哪一种」；
  - 判断完再看文本对账，错的句子把词尾单独圈出，回听时只盯那半秒；
  - 换一组新句子再来，词尾类型每周只攻一种；
  - 攒够一类后混编复测：三种词尾混着出，还能分清才过关；
  - 把总丢的那一类登记进卡点日志（TEC-L45）。
  mechanism: 学习者听力困难清单里，「学过的词在语流里认不出」高居感知层问题之首，词尾语法音（复数、时态）短、轻、易被前后音吞没，正是重灾区（Goh 2000 对 40 名中国大学生听力日记的分析：10 类困难中 5 类属感知层，第一类即「认不出已知的词」）。把「专听某类词尾」做成独立微练习，是 Nation & Newton（2009）听写前置练习的经典形态——「听，并写下所有以 s（或 ing、ed）结尾的词」，用定向注意把知觉灵敏度单独练出来。
  linked_laws: []
  cross_refs:
  - TEC-S07
  - TEC-L45
  order_hint: 无硬前置；与 TEC-S07 分工——S07 练**功能词**的弱式与连读交界，本条练**实词词尾的语法音**，不重叠。剂量待定（每类词尾的练习量源文献未给定数）。
  self_check: 混编复测中词尾判断稳定正确；听长句时能主动报告「刚才那个 -ed 我听到了」。
  misuse_warning: 只听词尾不管意思会把听力练成音检游戏——每组练完必须回到整句意思判断一次；词尾听辨只解决「听到没听到」，词尾的语法意义（为什么用复数／过去式）归语法线，本条不越界讲解。
  evidence_note: 经典方法专著＋同行评审研究——Nation & Newton (2009)，第 8 章听写与前置练习；Goh, C. C. M. (2000). A cognitive perspective on language learners' listening comprehension problems. *System*, 28(1), 55–75。
  audience: 学生自用／亲子共用（出题与对账）
  status: 定版
- id: TEC-L39
  name: 数字、人名、地名先单独「过一遍筛子」
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——故事大意全跟上了，一到电话号码、日期、人名、地名就整段空白；题目偏偏最爱问这些。
  steps:
  - 听正文之前，先把这段材料里会出现的数字类（年份、价格、时间、号码）和专名类（人名、地名）单独拎出来，快速听认一遍：听音对号、跟读确认；
  - 正文听的时候给自己定规矩：别的信息可以丢，这几样一出现立刻记（数字直接写阿拉伯数字，专名记首字母也行）；
  - 听完对账时单列一栏核对这类信息，错因只分两种：没听出来 vs 听出来记错了；
  - 「没听出来」的，回听那两三秒专练（并入 TEC-L34 追听）；
  - 同一批数字换个说法复测（thirteen/thirty、fifteen/fifty 这类近音对重点盯）。
  mechanism: 细节信息点（数字、专名）是听力理解中最先丢失的部分：它们不可预测（猜不出）、无冗余（说错一个音全错）、且往往出现在句首或弱读位置——Goh（2000）的困难清单中「漏掉文本开头」「认不出词」正是这类丢失的机制面。听力教学与测评的经典处理是把「听取具体信息」单列为子技能并预先降低其知觉门槛：材料前先让耳朵对本节的数字／专名读音脱敏，正文时只做定向捕捉（Underwood 1989 的听取具体信息类任务；Buck 2001 对听力子技能与任务类型的系统梳理）。
  linked_laws: []
  cross_refs:
  - TEC-L31
  - TEC-L34
  - TEC-L41
  order_hint: 顺序上与 TEC-L31 同属听前准备，可合并执行（预测单上单列「数字／专名预警」一栏）；无其他前置。剂量待定。
  self_check: 对账栏里这类信息的错误率明显下降，且能分清自己错在「没听出」还是「记错」。
  misuse_warning: 过筛子只过**读音与对号**，不许顺势把正文内容提前讲透——那会把听力课变回预习课（与 TEC-L41 的堵门词纪律同理）；近音数字对（-teen/-ty）听不清多半是重音位置问题，只加量不点破重音差异，练再多也卡。
  evidence_note: "经典专著＋教材共识级——Underwood (1989)，同前；Buck, G. (2001). *Assessing Listening*. Cambridge: Cambridge University Press；Goh (2000)，同 TEC-L38。"
  audience: 亲子共用／教师课堂用（筛子由成人备，捕捉与对账由学生做）
  status: 定版
- id: TEC-L40
  name: 长材料切成小段，听一段、停一段
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——材料超过一分钟就「前面听完后面忘」，听到后半段时前半段已经散架，只能靠最后两句猜全篇。
  steps:
  - 先按意思把材料切成小段（一个场景、一个话题转换、一段对话回合为一段），每段控制在能一口气记住的范围；
  - 听一段、停一段：停顿时用一句话复述刚这段（接 TEC-L44 的小结动作）；
  - 复述卡住的段落当场回听一次再往下，不许带着窟窿听完整篇；
  - 全部分段听完后，完整连听一遍收尾，检验拼图是否合拢；
  - 随着能力长进，逐步拉长段长、减少停顿——切段是脚手架，不是永久形态。
  mechanism: 听力是实时加工，解码未自动化的听者工作记忆被语流持续冲刷，「听完就忘」是解析层的典型困难（Goh 2000 困难清单解析层第一项即「很快忘记刚听到的」）。Field（2008）的过程取向据此主张：练习单位要小到能让单个加工环节被单独操练与诊断——分段停听正是把长材料改造成可诊断单位的操作法；同一文本多次听的价值在 Nation & Newton（2009, p.51）亦有明文（「反复听同一文本应有价值」，与反复读同理）。
  linked_laws: []
  cross_refs:
  - TEC-L32
  - TEC-L34
  - TEC-L35
  - TEC-L37
  - TEC-L44
  order_hint: 与 TEC-L37（短段原速多遍）同构配套；段内加工走 L32／L34／L35 的既有动作。剂量：段长源文献未给秒数定版，「10–30 秒」为 L37 的操作化取舍，待儿童样本校准。
  self_check: 分段模式下每段都能当场复述；收尾整听时不再有「这段我完全没印象」的空洞。
  misuse_warning: 切段切到逐句停顿、逐句翻译，材料就碎了——段的边界必须落在意思的接缝上，不落在标点上；长期只听碎段从不整听，会把「跟丢长材料」的病越藏越深，⑤的拉长步骤不许跳过。
  evidence_note: 经典学术专著＋同行评审研究——Field (2008)；Goh (2000)；Nation & Newton (2009)，出处同前各条。
  audience: 亲子共用／教师课堂用（切段由成人执行，复述与回听决定由学生出）
  status: 定版
- id: TEC-L41
  name: 听前只教三五个「堵门词」，其余留到听完再说
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂（准备方式侧）——老师把生词全讲完再听，听的时候个个耳熟、其实根本没在听；或者一个词不教，第一句就被生词堵死、整段弃听。
  steps:
  - 成人备材料时先自问：哪几个词，孩子不知道就会**整段断掉**（关键名词、核心动词、题目问的那个词）；
  - 只挑这三五个，听前用图片／动作／一句中文把意思钉住，并让孩子听一遍它们的读音；
  - 其余生词一律不预教，写进「听完再揭晓」名单；
  - 听完之后再打开名单：哪些词孩子靠上下文猜出来了（表扬并确认），哪些没猜出（这时才教）；
  - 堵门词若超过五个，说明材料选难了——换材料，而不是加预教量（材料难度问题回 TEC-L21 选材线处理）。
  mechanism: 传统理解法流程把「预教全部生词」列为标配，Field（1998／2008）的批评正在于此：词全教完，听力课测的就不再是听，而是刚教完的记忆，知觉困难被系统性掩盖。Underwood（1989）的听前工作清单包括给背景、看图、定任务，但其功能定位是「让学生知道该期待什么」，不是替学生把文本扫清——预教的正当性只到「不至于开局即死」的程度。本条把这条界线操作化为「堵门词」概念：堵住整段理解的少数词先钉住，其余保留给听中推断（推断本身是 L31 预测与 L32 抓骨架要练的本事）。
  linked_laws: []
  cross_refs:
  - TEC-L21
  - TEC-L31
  - TEC-L39
  order_hint: 听前准备，与 TEC-L31、L39 同环节合并执行。剂量：「三五个」为本条操作化上限，源文献给的是原则（预教须有限）而非数字，合并审定时可议。
  self_check: 听完揭晓名单时，至少有一部分生词是学生自己猜出的；若每次全部靠预教、名单永远空，本条未执行。
  misuse_warning: 把「堵门词」标准放宽到「可能不懂的词」，名单立刻膨胀回全预教，本条名存实亡；反之一个不教、美其名曰「练推断」，对低水平者等于开局弃听——界线争议本身是学界分歧，如实登记于附②分歧四，不假装有定论。
  evidence_note: 经典专著＋经典学术专著——Underwood (1989)，听前工作章；Field (1998; 2008) 对理解法流程的批评，同 TEC-L35。
  audience: 教师侧／亲子共用（选词由成人，猜词与揭晓由学生）
  status: 定版
- id: TEC-L42
  name: 每天自选十分钟「爱听的」：低压泛听打卡
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——课堂精听练了不少，一出课堂耳朵还是「没开」：真实语速、连读、口音一上来就懵；越听不懂越怕听，量永远上不去。
  steps:
  - 材料自己选：儿歌、动画片段、分级读物音频、爱听的故事——唯一标准是「大概能听懂、大部分词耳熟」；
  - 每天固定时段听十分钟左右，不做题、不查词、不许暂停抠细节；
  - 听完只打一个卡：今天听了什么、整体懂几成（笑脸／平脸／哭脸即可）；
  - 同一材料爱听可以反复听（反复听是福利不是作弊）；
  - 每周翻一次打卡：总是哭脸，说明材料选难了，降一档；总是笑脸且嫌慢，升一档或换原速材料。
  mechanism: 知觉自动化只能靠量：切分、弱读辨认这些低层加工要在大量可懂输入里被磨成自动动作，精听的「点」必须配泛听的「面」。Renandya & Farrell（2011）以《老师，录音太快了！》为题系统倡导泛听（extensive listening）：比照泛读，让学生大量听自选的、难度合口的材料，并明确主张对低水平者，泛听优先于策略训练（其反方立场见分歧三）；Vandergrift & Goh（2012）第 10 章亦把泛听列为元认知取向的一翼（自选材料＋听后反思）。
  linked_laws: []
  cross_refs:
  - TEC-S08
  order_hint: 无前置，与精听线（L31–L40）并行、不可互相替代。剂量：源文献给的是「大量、长期、自选、可懂」的原则，未给分钟数定版；「十分钟」是本条的操作化起点，合并审定时可议。与 TEC-S08 的分工见附①：S08 是课程层面的六格配比审计，本条是学生侧的每日执行协议。
  self_check: 打卡连续不断，且「懂几成」的自评随周推进缓慢上行；材料难度自调发生过至少一次。
  misuse_warning: 泛听材料若由成人按「有用」强塞难度超标的新闻、演讲，低压与自选两个根基即告垮塌（Renandya & Farrell 2011 点名的课堂实况正是录音难度与学生水平脱节）；打卡若变成家长监工与惩罚工具，情感过滤先于知觉自动化崩坏，本条停用整改。
  evidence_note: 同行评审（专家倡导型论文）＋经典专著——Renandya, W. A. & Farrell, T. S. C. (2011). 'Teacher, the tape is too fast!' Extensive listening in ELT. *ELT Journal*, 65(1), 52–59. https://eric.ed.gov/?id=EJ908225 ；Vandergrift & Goh (2012) 第 10 章，同前。
  audience: 学生自用／亲子共用（成人只供材料菜单与陪伴，不命题）
  status: 定版
- id: TEC-L43
  name: 跑动听写：一个人跑去看，一个人坐着写，轮流换
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂（兼记不住）——坐着听写枯燥走神；听到的东西在脑子里停不住，一动笔就忘了一半。
  steps:
  - 把一小段文本（几句话）贴在房间另一头或门外；
  - 一人当「耳朵」：跑过去读一段、记在脑子里，跑回来**说给**同伴听，同伴写下来；
  - 「耳朵」只能说自己记住的，不许拼读字母逐个报（除非卡死求救）；
  - 一段传完，两人换角色；
  - 全部传完后，两人一起拿成稿与原文对账：错处先分「传话时记错」还是「写的时候听错」，再订正。
  mechanism: 跑动听写（running dictation）是听写活动化改造的招牌形态：文本不在眼前，听者必须把语块整块保持在短时记忆里再复述出来——练的正是 Goh（2000）解析层困难（听完即忘）的对症加工；同时它把「听—说—写」串成一条链，每一环的错误都会在下一环暴露。源流上，它是 Davis & Rinvolucri（1988）《Dictation》一书重振听写家族的活动谱系成员，Nation & Newton（2009, p.62）在听写变式清单中正式收录 running dictation。
  linked_laws: []
  cross_refs:
  - TEC-L35
  order_hint: 需双人（同伴或亲子）；文本长度须短于坐着听写的常规量（移动与记忆双重负荷）。剂量待定。与 TEC-L35 的分工：L35 是静态诊断微听写（抠知觉），L43 是动态记忆—复述型听写（练保持与整块加工），形态与靶点不同。
  self_check: 对账时能把错误归到「记错」或「听写错」两栏；「耳朵」复述的语块长度随练习逐渐变长。
  misuse_warning: 逐字母拼读传递会把本条败坏成拼写接力——规则必须先行讲明并执行；文本选得过长过难时，记忆负荷压垮听力加工本身，本条退化为体力活动（Nation & Newton 2009 对听写文本长度与已知词比例的要求同样适用：文本主体应为已学词）。
  evidence_note: "经典方法专著——Davis, P. & Rinvolucri, M. (1988). *Dictation: New Methods, New Possibilities*. Cambridge: Cambridge University Press（Cambridge Handbooks for Language Teachers）；Nation & Newton (2009)，第 8 章，同前。"
  audience: 学生自用（双人）／亲子共用／教师课堂用
  status: 定版
- id: TEC-L44
  name: 听完先用三句话说清「讲了啥」，说不出的地方就是缺口
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——题目答对了几道，却说不清这段到底讲了什么事；「好像懂了」和「真懂了」分不清，下次换个材料照样懵。
  steps:
  - 整段听完（并完成 L33／L34 的核对追听后），合上题目，口头说三句话：谁、在什么地方、做了什么事（或：开头、中间、结尾各一句）；
  - 说的时候不许看原文、不许翻题干找词；
  - 卡住的那一环当场标出来——那就是理解缺口，回 L34 定向追听那一截；
  - 追听补上后，再说一遍三句话，补完整才收工；
  - 低龄或口头吃力的，可画三格漫画代替口述，格子空格即缺口。
  mechanism: 小结是把「意义建构」的结果外显的最低成本办法：建构没完成的环节，在复述时必然塌陷，缺口位置因此自动定位——这正是元认知序列收尾的「评价」环节在学生侧的动作形态（Vandergrift & Goh 2012：听后反思与自我评价是序列的正式一环，而非附加作业）；Goh & Taib（2006）在小学生组里把「听后个人反思」做进八节课的设计，反思后学生对听力困难的自述明显变具体。本条与 TEC-S08 中「回应听」的分工：S08 是把回应听列为课程六格之一的配比要求，本条是学生每次听力后可执行的固定收尾动作。
  linked_laws: []
  cross_refs:
  - TEC-L33
  - TEC-L34
  - TEC-S08
  order_hint: 前置 L33（核对）之后执行；缺口回流 L34。剂量待定。
  self_check: 三句话能独立说全，且每次卡住的位置与 L34 追听的点对得上；若小结永远流畅无比，多半是背题干而非建构。
  misuse_warning: 小结用中文说清即可（低段）——强求英文复述会把听力验收变成口语考试，缺口被表达困难污染；小结若由成人代述或诱导提问拼出，本条定位功能丧失。
  evidence_note: 经典专著＋同行评审研究——Vandergrift & Goh (2012)；Goh & Taib (2006)，出处同前。
  audience: 学生自用／亲子共用（成人只听与记录卡点）
  status: 定版
- id: TEC-L45
  name: 每周记一页「卡点日志」：我总在什么地方丢
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——每次错的都说不清为什么，练习没有靶子；老师家长只能笼统地说「多听」，孩子自己也觉得听力是玄学。
  steps:
  - 准备一个小本子（或 app 内一页），每次听力活动后花一分钟记一行：日期、材料、我卡在哪一类；
  - 类别只许用固定五类贴标签：**认不出学过的词／切不开连读／一想意思就丢了后面／听到一半忘了前面／词都懂但没明白意思**；
  - 不会分类时成人帮着对一次（拿刚发生的实例对号）；
  - 每周末翻一页：数一数哪类最多——下周的微练习（L35／L38 等）就专攻那一类；
  - 每月回看一次：哪类在减少，哪类纹丝不动（纹丝不动的要换练法，不是加量）。
  mechanism: 日志法直接来自听力困难研究的原始工具：Goh（2000）用学习者日记＋访谈＋即时回顾，从 40 名中国学习者的自述里提炼出 10 类实时困难并归入感知／解析／运用三层——本条的五类标签即该分类的儿童可操作版（感知层三类、解析层一类、运用层一类）。把研究工具反手变成学生的自我监控工具，依据是元认知教学的基本主张：先有对自身困难的准确命名，才有定向练习（Vandergrift & Goh 2012 的 person/task/strategy 三种元认知知识中，person 知识即「知道自己栽在哪」）；Graham（2007）的策略教学项目亦让学生持续写策略使用日记，作为自我效能建设的一环。
  linked_laws: []
  cross_refs:
  - TEC-L35
  - TEC-L38
  order_hint: 无硬前置，但标签分类需先由成人带对两三次；其产出（最高频卡点类）是 L35、L38 等微练习的选题依据。剂量：每次一行、每周一翻，源自 Goh（2000）的周记形态。
  self_check: 月末能说出「我最常栽的一类是……，这个月它少了没有」；日志全是「没听懂」三个字的，等于没记。
  misuse_warning: 日志一旦被用作扣分、排名、向家长告状的材料，学生立刻开始写假话，自述数据全废——Goh（2000）的方法论前提正是日记的非评判性；标签五类是脚手架，孩子说出五类之外的真实困难（如「他说话带口音」）应另行记录，不许硬塞。
  evidence_note: "同行评审研究——Goh (2000)，*System*, 28(1), 55–75；Graham, S. (2007). Learner strategies and self-efficacy: Making the connection. *Language Learning Journal*, 35(1), 81–93；Vandergrift & Goh (2012) 元认知知识框架，同前。"
  audience: 学生自用（记）／亲子共用、教师课堂用（周翻与选题）
  status: 定版
- id: TEC-L46
  name: 把「猜—听—对—追—评」打包成固定开场动作，成串地教
  zone: 表达写作区
  pain_point:
  - 听不懂
  when: 听不懂——单个小窍门学过不少（猜词、抓大意、查漏），真到听力现场一个都想不起来用；策略是散的，从来没连成过一套动作。
  steps:
  - 把本文件的 L31（猜）→L32（抓大意）→L33（互对）→L34（追卡点）→L44（小结评价）印成一张流程卡，贴在练习区；
  - 头几次听力活动，成人照流程卡逐格领做，每格开始时先喊出这一格的名字；
  - 几轮之后只喊第一格，后面的格由孩子自己接龙推进；
  - 再往后流程卡只放在手边，不再领做——但每次听完对照流程卡自查：哪一格我今天跳过了；
  - 跳过率最高的那一格，就是下阶段单独回练的对象。
  mechanism: 策略教学的实验证据支持的是「成串教」而非「单点教」：Graham & Macaro（2008）对 68 名英国低中级法语学习者做纵向干预，教授由预测、定向注意、核实、评价等组成的策略**簇**，实验组听力成绩与听力自我效能均显著优于对照组；更早的 Thompson & Rubin（1996）用视频材料教授策略组合，亦得正向结果。Vandergrift & Goh（2012）的教学序列本身就是这样一个打包好的簇——本条的流程卡即其学生可执行版。单教一个策略的问题在于：听力现场没有提示，孤立策略不会被自发调用，成串绑定在固定流程上才形成条件反射式的调用链。
  linked_laws: []
  cross_refs:
  - TEC-L31
  - TEC-L32
  - TEC-L33
  - TEC-L34
  - TEC-L44
  order_hint: 前置——五个组成技巧（L31、L32、L33、L34、L44）须各单独练过至少一轮，本条只负责打包与自动化，不负责首次教学。剂量：领做轮数源文献未给定数（Graham & Macaro 2008 的干预为一学期尺度的课程嵌入），剂量待定。
  self_check: 无人领做时，孩子能按流程卡自己走完五格，并指出今天跳过／走样的是哪一格。
  misuse_warning: 流程卡若变成新的机械仪式（每格打勾但脑子不跟），即退化为本条要治的病本身——自查格（⑤）不许省；另须如实登记：策略教学对**低水平学习者**的有效性在学界有正面实验与公开质疑并存（Renandya & Farrell 2011 的反对意见见分歧三），本条不宣称对所有水平一律有效，低龄低水平者应与 L42 泛听并行、观察自效再定配比。
  evidence_note: 同行评审研究——Graham & Macaro (2008)，*Language Learning*, 58(4), 747–783；Thompson, I. & Rubin, J. (1996). Can strategy instruction improve listening comprehension? *Foreign Language Annals*, 29(3), 331–342；Vandergrift & Goh (2012)，同前。
  audience: 教师侧／亲子共用（打包与领做），学生执行
  status: 定版
