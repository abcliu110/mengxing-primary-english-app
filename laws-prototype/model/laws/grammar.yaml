- id: GR-39
  order: 39
  headline: 英美英语是两套并行标准，不是「一个对一个错」：集体名词、gotten、shall、日期，各有归属
  headline_kid: 英语有两个大「版本」：球队在英国版里可以说成「他们」，在美国版里只能说「它」；认出版本，就不会把对方的对当成错
  claim:
    type: tendency
    statement: 英美英语是两套并行标准，核实过的差异项包括：① 集体名词一致（英式允许意义一致用复数，美式绝大多数情形用形式一致的单数）；② gotten（美式 get 的过去分词，与 got 分工；英式现代标准只用 got）；③ shall 在两变体中都在退缩（美式日常几乎绝迹，英式第一人称正式体存量略高），「shall 必表将来」的旧处方两边都已失效；④ 拼写双轨（-ize 是牛津拼写，在英式中与 -ise 同样合法，但 advise、surprise 等词在任何变体中都只能 -ise）；⑤ 日期序、at/on the weekend、just/already 搭配、-t/-ed 词尾等小项群各有归属。
    evidence:
    - 集体名词与 gotten 依 "American and British English grammatical differences" 词条（引 CGEL 系与 Merriam-Webster、Compact OED 定版表述，本轮打开核对）；-ize 的牛津拼写地位依 Editage 学术编辑指南与 Sprachcaffe 对照表；at/on the weekend 与日期序依《经济学人》风格指南美英差异节的转录页
    scope: 教学口径：跟学生所用教材的变体走，另一式只要求认得出（中国国家课程标准未指定单一变体）
    exceptions:
    - text: 美式集体名词单数是「几乎一律」而非绝对：体育队名本身为复数形式、强调个体时可用复数代词回指（the team takes their seats）
      word_ids:
      - G4_0989
    - text: gotten 在英式年轻人口语中有经影视回流的迹象（进行中的变化），考试仍按 got 为英式标准
      word_ids:
      - V6_日常_0
  mechanism:
  - beat: 两个服务器
    text_kid: 同一款游戏有两个服务器：英国版和美国版。同一支球队，在英国版里可以是「他们」，在美国版里是「它」——不是谁错了，是版本不同。
    text_adult: 本条是 NE-06 三圈说的具体面：变体差被误判为对错，是「单一标准」错觉的产物（与 GR-31 than 之争同族）。中国教材多混编两式，学生先有版本意识，才能解释词典两处注法为何不同。
    visual: 两个服务器图标并排，同一支球队在两边举起不同的动词牌子
    anchors:
    - G4_0989
  - beat: gotten 的分工
    text_kid: get 的变化形：美国版留着两个——have got 是「拥有」，have gotten 是「获得/变得」；英国版只用一个 got。
    text_adult: gotten 在美式中与 got 有语义分工，不是随意变体；英式固定短语 ill-gotten gains 是化石例外。
    visual: 两本护照：一本印着 gotten（美），一本只印 got（英）
    anchors:
    - V6_日常_0
  examples:
  - level: 1
    word_ids:
    - G4_0989
    sentence: The team is winning.
    scene_note: 美式口径：集体名词作整体，用单数
    supports: claim
  - level: 1
    word_ids:
    - G4_0989
    sentence: The team are arguing among themselves.
    scene_note: 英式口径：把集体看作个体集合，用复数（意义一致）
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_0
    - G1_002
    sentence: I have got a new book.
    scene_note: 英式标准：got 表拥有
    supports: claim
  - level: 2
    word_ids:
    - G3_K48
    sentence: Shall we go?
    scene_note: 两式共存的公式：提议用 Shall we…?（美式日常 shall 虽少，此式仍在）
    supports: claim
  error_cases: *id001
  quiz:
  - q: '"The team are arguing" 在英国版里错不错？'
    answer: 不错——英式允许按意义一致用复数，美国版才几乎一律用单数。
    hint: 回到机制第 1 节「两个服务器」。
  relatives:
  - id: GR-12
    rel: 对照
  - id: GR-31
    rel: 同族
  - id: NE-06
    rel: 同族
  adult:
    sources:
    - '"American and British English grammatical differences" 词条（引 CGEL 系、Merriam-Webster、Compact OED）；Editage 与 Sprachcaffe 对照表；《经济学人》风格指南——接触等级：二手系统论述级'
    boundary: ① 美式集体名词单数是「几乎一律」而非绝对。② gotten 在英式年轻人口语有回流迹象，考试仍按 got。③ shall 的法律义（义务）在美式合同文本中是活用法。④ -ize 合法不等于可混用：同一文本内 -ise/-ize 须自始一致，这是编辑规范而非语法。
    disputes:
    - 无对错之争；仅「哪一式更值得教」的课程分歧（中国国家课程标准未指定单一变体）。登记教学口径：跟教材变体走，另一式只要求认得出。
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（本条处理的是误判问题，非学习者错句）
