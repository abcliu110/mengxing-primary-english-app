- id: GR-34
  order: 34
  headline: 倒装有三种活法，形式条件各不相同：呼应式是日常口语，全倒装只请得动名词主语，否定词搬到句首才触发助动词提前
  headline_kid: 三种「把句子翻个儿」的玩法，规矩各不一样：So do I 每天用；Here comes the bus 只许名词主语这么玩；never 搬到句首，助动词必须跟着提前
  claim:
    type: rule
    statement: (A) 呼应式：so/neither/nor + 助动词 + 主语，表「也一样/也不」，助动词回指对方句（无助动词召唤 do），日常口语高频。(B) 全倒装：here/there 及方位短语前置、动词为 come/go/be/lie/stand 等位置或运动动词时，整个谓语移到主语前；硬条件——主语必须是名词（短语），代词主语绝不倒装，动词不及物不带宾语。(C) 部分倒装：never、rarely、seldom、hardly…when、no sooner…than、not only、only + 状语等否定/限制性成分置于句首时发生主辅倒装（只有助动词提前，无助动词召唤 do）；only 修饰主语本身时不倒装。此式属正式/文学语体。
    evidence:
    - Quirk 等参考语法传统《A Grammar of Contemporary English》§7.59「Inversion after adverbs of place」（本轮经该节原文转录页核对：代词主语不倒装为原文）；(A)(C) 为 CGEL 与 Swan《PEU》的共同定版
    scope: 小学阶段全倒装限于 here/there + come/go/be 的固定式；部分倒装以认读为主
  mechanism:
  - beat: 三种活法分开存档
    text_kid: 倒装不是一招，是三招：打招呼的呼应式、整词搬家的全倒装、只搬助动词的部分倒装。先认出是哪一招，再看它的条件。
    text_adult: 三类的共同功能是信息结构：把焦点成分前置或把重主语后置（end-weight），与 QI 组已知性/焦点机制互挂。
    visual: 三个抽屉并排，各贴一张标签：呼应、全倒装、部分倒装
    anchors:
    - G2_089
  - beat: 全倒装的硬条件
    text_kid: Here comes the bus——整个动词跑到主语前面。但主角必须是名词：换成 it，就得老老实实 Here it comes，代词太轻，坐不住句尾的焦点位。
    text_adult: (B) 的代词禁令源于信息结构：代词是最轻、最旧的信息，不能占句尾焦点位。be 的指认用法（Here's a cup of tea / There she is）同样适用此规则。
    visual: 一辆公交车开到句尾的名词站台；小小的 it 被请回动词前面
    anchors:
    - G2_105
    - V6_日常_2
  - beat: 否定词搬家，助动词跟
    text_kid: never 这类否定词一搬到句首耍强调，助动词就必须跟着提前：Never have I seen…；没有助动词，就召唤 do（Seldom did he speak）。
    text_adult: 肯定性状语（always、often）前置不倒装——(C) 的触发词清单是封闭的。not only 前置与 GR-32 互挂。
    visual: never 大步走到句首，身后的助动词小跑跟上
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G2_089
    sentence: I can swim. — So can I.
    scene_note: 呼应式：肯定用 so，助动词回指 can
    supports: claim
  - level: 1
    word_ids:
    - G2_105
    - V6_日常_2
    sentence: Here comes the bus.
    scene_note: 全倒装：名词主语 bus，整个动词提前
    supports: claim
  - level: 2
    word_ids:
    - G2_105
    sentence: Here it comes.
    scene_note: 代词主语不倒装：it 老老实实站在动词前
    supports: claim
  - level: 2
    word_ids:
    - G3_0619
    sentence: Seldom did he speak.
    scene_note: 部分倒装：seldom 前置，无助动词召唤 did（正式语体，认读为主）
    supports: claim
  error_cases:
  - wrong: Here comes it.
    right: Here it comes.
    error_type: 全倒装代词误用
    source_type: 条目成人层登记的事故例
    diagnosis: 清单机制栏明示：代词主语绝不倒装（*Here comes it 不成立）；Quirk §7.59 原文同旨。回补机制第 2 节。
  quiz:
  - q: 主语换成 it：「Here ___ the bus」该怎么接？A. comes it B. it comes
    answer: B——代词主语绝不倒装。
    hint: 回到机制第 2 节「全倒装的硬条件」。
  relatives:
  - id: GR-32
    rel: 同族
  - id: GR-33
    rel: 同族
  - id: GR-30
    rel: 同族
  - id: QI-07
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Quirk 等《A Grammar of Contemporary English》§7.59（原文转录页核对）；CGEL 与 Swan《PEU》共同定版——接触等级：二手系统论述级（含一处参考语法原文转录）
    boundary: ① be 的提议/指认用法（Here's a cup of tea / There she is）是高频日常式，代词规则同样适用。② (C) 的触发词清单是封闭的，肯定性状语前置不倒装。③ me too 是口语替代式，与 So do I 语体分工，不可写入正式书面。④ 文学中 (B) 可扩展到更多不及物动词，小学阶段限于固定式。
    disputes:
    - 无实质分歧；仅术语分歧——部分语法书把 (B) 称 locative inversion 并入广义倒装，CGEL 分开处理。本条按形式条件分开著录。
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
