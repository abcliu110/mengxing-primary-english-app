- id: GR-31
  order: 31
  headline: 比较级先称「重量」：短词把 -er 缝在身上，长词请 more 来帮忙，双音节词站在两可的门口
  headline_kid: 轻的词（一拍）直接在尾巴上缝 -er；重的词（三拍以上）缝不动，请 more 站到前面帮忙；两拍的词看尾巴，有的两边都可以
  claim:
    type: tendency
    statement: 比较级形态的选择由音节数与词尾形状共同决定，是倾向性法则而非无例外的开关：单音节用 -er/-est（带拼写三配套）；双音节以 -y 结尾者用 -er，以 -ed/-ing/-ful/-less 结尾者只能用 more，其余多数用 more，但存在公认的两可带（common、clever、quiet、narrow、simple、gentle、pleasant、polite、stupid、cruel、handsome、likely 等）；三音节以上用 more/most，唯一开口是 un- 前缀派生词（unhappier / more unhappy 两可）。
    evidence:
    - 形态法则与两可带清单综合两源互证：IDP/British Council 系 IELTS 语法页 "Comparative adjectives"（明列两可词）与大学语法讲义《Comparison of adjectives and adverbs》（两可带 13 词表、un- 例外、强制 more 一条）；关联比较的构式定位依 CGEL 通行的 correlative comparative 分析
    scope: 句型面：as…as 表等值；the more…， the more… 是关联比较构式，不许拆成普通并列；than 后代词格见成人层分歧
    exceptions:
    - text: 不规则组单独记：good/well–better，bad–worse，far–farther/further，little–less，much/many–more
      word_ids:
      - G3_K08
      - G3_K09
      - V6_交通_48
      - V6_数字_54
    - text: elder/eldest 只作定语指长幼，不能进 than 结构（my elder brother 可以，*elder than me 不行）
      word_ids:
      - G1_0574
  mechanism:
  - beat: 先称重量
    text_kid: 给形容词做比较级，先把它放在秤上：一拍的轻词，尾巴上直接缝 -er；三拍以上的重词缝不动，请 more 到前面来扛。
    text_adult: 拼写三配套：词尾 -e 只加 -r；辅音+元音+辅音双写；-y 变 -i。形态选择受词频与节奏影响（与 GR-19/GR-27 互证）。
    visual: 一台秤，轻词落进「-er」盘，重词落进「more」盘
    anchors:
    - G6_0576
  - beat: 两可的门口
    text_kid: 两拍的词站在门口看尾巴：-y 结尾的进 -er 门（happier）；有一小队两边都可以（quiet、common、narrow…），站哪边都对。
    text_adult: 两可带的存在本身就是频率调谐与概率语法的实例：常见双音节词保留 -er 能力更强。-ed/-ing/-ful/-less 结尾者被强制分到 more 一侧。
    visual: 一扇双开门，quiet 和 common 站在门中间，两边都招手
    anchors:
    - G6_282
    - G4_0440
  examples:
  - level: 1
    word_ids:
    - G6_0576
    sentence: My bag is bigger than yours.
    scene_note: 轻词现场：一拍的 big 缝 -er（双写 g）
    supports: claim
  - level: 1
    word_ids:
    - G6_282
    sentence: She is happier today.
    scene_note: -y 结尾双音节：缝 -er，y 变 i
    supports: claim
  - level: 2
    word_ids:
    - G4_0440
    sentence: He is more careful than me.
    scene_note: 三拍重词：请 more 帮忙（口语 than me 合法，见成人层分歧）
    supports: claim
  - level: 2
    word_ids:
    - V6_颜色_23
    sentence: This road is narrower. / This road is more narrow.
    scene_note: 两可带现场：narrower 与 more narrow 都对
    supports: claim
  error_cases:
  - wrong: This one is more better.
    right: This one is better.
    error_type: 比较级叠用
    source_type: 条目成人层登记的事故例
    diagnosis: 清单边界明示：more 与 -er 不可叠用（*more better、*more cleverer 均不成立）；good 是不规则组，比较级是 better 本身。回补机制第 1 节。
  quiz:
  - q: quiet 的比较级怎么说？
    answer: quieter 或 more quiet 都对——quiet 在两可带里。
    hint: 回到机制第 2 节「两可的门口」。
  relatives:
  - id: GR-27
    rel: 同族
  - id: GR-19
    rel: 同族
  - id: GR-37
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - IDP/British Council 系 IELTS 语法页与大学语法讲义（两页原文已打开互证）；CGEL than 格专节 pp.1113–1117（经 Language Log 转述核实）——接触等级：教学定版转述级
    boundary: ① 「双音节用 more」作为口诀会误伤 -y 尾与两可带，是本条最常见的教学过满。② more 与 -er 不可叠用。③ elder/eldest 不与 than 连用。④ as…as 的否定式英式口语常用 not so…as，美式多用 not as…as，属语体差。⑤ 关联比较里两个 the 都不是定冠词，不可省略。
    disputes:
    - than I vs than me：传统处方派只认连词说、判 than me 为错；现代描写派（CGEL）双认——than 兼具介词与从属连词两种身份的证据各存，结论是两种用法都是标准英语。教学口径：书面考试按正式体写 than I (am) 最稳妥，口语 than me 不算错。与 GR-30 的介词后置辟谣同属「处方硬化」家族。
    evidence_grade: 教学定版转述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
