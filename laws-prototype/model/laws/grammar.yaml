  - 错不完
  adult:
    sources:
    - Lingolia 英语语法 used to 条（本轮打开核对）；Swan 系教学定版——接触等级：教学定版转述级
    boundary: ① used to 的「今已不再」是强默认蕴含而非逻辑必然，边缘情形存在，教学不必向学生渲染例外。② would 表习惯与条件/意愿用法同形，靠时间框架消歧。③ used to 无现在时对应物（*I use to go 表现在不成立；use to 只出现在 did 之后）。④ *be used to do 在任何时态下都不成立。
    disputes:
    - 无实质分歧。didn't use to 与 didn't used to 的拼写在用法界有小争（多数规范以 use to 为 did 后的形式），登记为正字法小争，教学从严取 use to。
