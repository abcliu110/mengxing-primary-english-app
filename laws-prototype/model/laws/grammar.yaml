  order: 24
  headline: 语法长得像它要说的事：象似性三原则
  headline_kid: 好多语法是在「画画」：事情先发生的先说出口，心里越亲的人在话里挨得越近，东西变多了词也跟着变长
  claim:
    type: tendency
    statement: 语法形式常常模仿经验结构（图式象似）：语序象似——先发生的事先说；距离象似——概念关系越近，形式贴得越近；数量象似——内容越多，形式越长。象似性是倾向，与经济原则长期竞争；任意性仍是语言的基本盘，象似只在结构层（语序、距离、数量）显著，不扩大到词形层。
    evidence:
    - John Haiman（主编）《Iconicity in Syntax》（1985，John Benjamins，ISBN 9789027228727）：含 Haiman 图式象似纲领文、James Tai「Temporal Sequence and Chinese Word Order」（时间顺序原则）、Givón 数量象似与同构性论述
    scope: 本条按「结构层有据、词形层不适用」的收窄版立条；小学呈现以三原则的直觉为主
    exceptions:
    - text: 词形层是任意的：dog 这个词形不「像」狗，象似不解释单个词形
      word_ids:
      - G1_015
    - text: 语言史中大量缩略与不规则化是经济原则压过象似的结果（如 went 的合形）
      word_ids:
      - V6_MORPH_20
  mechanism:
  - beat: 先发生的先说
    text_kid: 画画要按事情发生的顺序画：先洗手，再吃饭。说话也一样，「先洗手再吃饭」换个顺序，意思就变了。
    text_adult: 语序象似源于叙述的默认时序映射；Tai 以时间顺序原则证明汉语语序同样受此约束——这是本条在中国课堂最现成的本地证据。
    visual: 三格连环画：洗手→坐下→吃饭，箭头按顺序连接
    anchors:
    - V6_身体_42
    - G3_118
    - V6_日常_15
  - beat: 越亲贴得越近，越多长得越长
    text_kid: my friend 比 a friend of mine 贴得更近，读起来也更亲；一个 apple、两个 apples，东西多了，词也跟着多出一个 -s。
    text_adult: 距离象似：概念距离≈形式距离（kill 直接致使、形式最紧 vs cause to die 间接致使、形式拉开是教科书例）；数量象似：形式量与意义量同向增减。
    visual: 左边 my friend 两个人挨在一起；右边一个苹果变两个，词尾长出 -s
    anchors:
    - G3_130
    - G1_037
  examples:
  - level: 1
    word_ids:
    - V6_身体_42
    - G3_118
    - V6_日常_15
    sentence: First wash your hands, then eat.
    scene_note: 语序象似：动作的顺序就是说话的顺序
    supports: claim
  - level: 1
    word_ids:
    - G1_037
    sentence: I have two apples.
    scene_note: 数量象似：东西变多，词变长
    supports: claim
  - level: 2
    word_ids:
    - G3_130
    sentence: This is my friend.
    scene_note: 距离象似：贴得近，关系亲
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: I came, I saw, I took the book.
    scene_note: 语序象似三段：先来、再看、后拿（对照 Haiman 纲领的叙述时序）
    supports: claim
  error_cases: *id001
  quiz:
  - q: 「一个 apple、两个 apples」多出的 -s 说明哪条象似？A. 语序象似 B. 数量象似
    answer: B——内容变多，形式变长。
    hint: 回到机制第 2 节「越亲贴得越近，越多长得越长」。
  relatives:
  - id: GR-13
    rel: 同族
  - id: GR-26
    rel: 同族
  - id: GR-27
    rel: 同族
  - id: GR-05
    rel: 对照
  adult:
    sources:
    - John Haiman（主编）《Iconicity in Syntax》（1985，John Benjamins）——接触等级：目录+书评级（出版社书目与目录已核实，各章正文未打开；个别例子的归属按学界通行的二手系统论述著录）；Givón 章节为二手论述级
    boundary: 象似性是倾向：与经济原则（省力、缩略）长期竞争；任意性仍是语言的基本盘，象似只在结构层显著，不可扩大为「每个词形都有道理」。
    disputes:
    - 形式主义传统（以生成语法为代表）把任意性设为语言的设计特征，对象似解释持保留态度（Newmeyer 在《Fuzzy Grammar》读本中为范畴离散性辩护）；象似阵营内部亦有「事后合理化还是真实心理约束」之争。本条按收窄版立条，分歧登记在案。
    evidence_grade: 目录+书评级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
