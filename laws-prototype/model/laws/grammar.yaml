- id: GR-42
  order: 42
  headline: 形容词在很多语言里是「小家庭」：成员可以少到只有 8 个，而且常常像动词或像名词——英语的形容词家庭大规矩也特殊
  headline_kid: 有的语言只有 8 个形容词；汉语的「红、高」自己就能当谓语，英语的形容词不行，必须请 be 来扶着——说英语漏掉 be，是把汉语的站法搬过来了
  claim:
    type: tendency
    statement: Dixon 的类型学框架：(1) 与形容词类典型关联的语义类型分三圈——核心四类（大小、新旧、好坏、颜色）连最小的形容词类里都有，外围三类（物理性质、人品性情、速度）在中等以上规模的类里加入，大类扩展六类（难度、相似、资格、数量、位置、基数）只见于大类，合计 13 个语义类型。(2) 类的规模天差地别：伊博语的形容词类只有 8 个成员（核心四类各一对反义词）；英语是大型开放类。(3) 语法性格分型：英语形容词属「修饰名词＋作系词补语」型，不能自己作谓语——be 的强制出现是这个分型的直接后果。可教的分布事实（两派共认）：汉语性质词无须系词即可作谓语，英语形容词不可。
    evidence:
    - 'R. M. W. Dixon（2004）"Adjective Classes in Typological Perspective"，载 Dixon & Aikhenvald 编《Adjective Classes: A Cross-Linguistic Typology》（OUP），pp.1–49——第一章全文已打开通读（含 §1.1 十三语义类型清单、伊博语 8 词例、§5 汉语讨论、§6 分型标准）；Dixon（1982）《Where Have All the Adjectives Gone?》；汉语谓语事实：Li & Thompson（1981）《Mandarin Chinese》p.142，经 Sproat & Shih（1991）转引核对；be 缺失实证：Liu Yu（2008）《Journal of Chinese Language and Computing》18(2)：75–92 专节记录 "Loss of copula verbs"'
    scope: 教学口径：不许教孩子「汉语没有形容词」，也不许说「汉语形容词和英语的一样」——可教、可迁移的点只有分布事实：英语形容词作谓语必须有 be
    exceptions:
    - text: 「每种语言都有形容词类」是 Dixon 2004 的假说（且是他对自己 1977/1982 相反旧说的公开修订），判别标准有时相当微妙，不能当作已逐一证毕的定论
      word_ids:
      - G1_034
      - G2_075
    - text: 语义类型是原型关联不是盒子：同一语义类型的成员在同一语言内可分属不同词类（约鲁巴语「好」是形容词、「坏」却是动词）
      word_ids:
      - G3_K08
      - G3_K09
  mechanism:
  - beat: 8 个词的家庭
    text_kid: 伊博语的形容词只有 8 个：大、小、新、旧、好、坏、黑、白，正好四对——正好是最核心的四类。家庭可大可小，核心成员先到。
    text_adult: Dixon 2004 年卷内 13 项个案研究以同一套判别标准检验形容词类；习得侧旁证（Blackwell 2000）：英语儿童先把大小/新旧/好坏/颜色/速度类用作修饰语，物理性质与人品性情类先用作系词补语——语义类型连儿童的用法顺序都留下了痕迹。
    visual: 一个小盒子里整整齐齐 8 张词卡，四对反义词
    anchors:
    - G2_068
    - V6_服装_39
    - G3_K08
    - G1_031
  - beat: 站法不一样
    text_kid: 汉语的「红」自己就能站成一句话：花红。英语的 red 站不住，必须请 be 扶着：The flower is red。漏掉 be，就是把汉语的站法搬了过来。
    text_adult: 分型判别（Dixon 2004 §6）：形容词或像动词、或像名词、或兼像、或都不像；英语属修饰＋补语型。be 缺失的类型学根源在「分布对比」层成立——该对比是归类之争两派共认的表面事实。
    visual: 左：花和「红」并排站立；右：red 旁边伸出一只叫 be 的手扶着
    anchors:
    - G2_075
    - G1_034
    - G2_073
  examples:
  - level: 1
    word_ids:
    - G2_075
    - G1_034
    sentence: The flower is red.
    scene_note: 分布事实现场：形容词作谓语必须有 be 扶着
    supports: claim
  - level: 1
    word_ids:
    - G2_073
    sentence: He is tall.
    scene_note: 同型再现：tall 前面也要 be
    supports: claim
  - level: 2
    word_ids:
    - G1_001
    - V6_服装_39
    sentence: The bag is new.
    scene_note: 核心四类（新旧）作谓语：仍须 be
    supports: claim
  - level: 2
    word_ids:
    - G1_031
    sentence: The cat is black.
    scene_note: 核心四类（颜色）作谓语：仍须 be
    supports: claim
  error_cases:
  - wrong: The flower red.
    right: The flower is red.
    error_type: 系词缺失
    source_type: 教学文献登记错型
    diagnosis: 清单登记的实证记录：Liu Yu（2008）汉英 code-switching 研究专节记录 "Loss of copula verbs"——英语形容词作表语时 be 被省略，根源是汉语性质词可裸作谓语的站法迁移。回补机制第 2 节。
  quiz:
  - q: '"The flower red." 少了什么？'
    answer: 少了 is（be）——英语形容词作谓语必须有 be 扶着。
    hint: 回到机制第 2 节「站法不一样」。
  relatives:
  - id: GR-43
    rel: 同族
  - id: GR-22
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Dixon（2004）第一章（章节原文级，全文已打开通读）；Dixon（1982）（目录＋二手系统论述级）；Li & Thompson（1981）p.142（经 Sproat & Shih 1991 转引）；Liu Yu（2008）——接触等级逐项见 evidence
    boundary: (1)「每种语言都有形容词类」是 Dixon 2004 的假说，且是对其旧说的公开修订，不能当作已证毕的定论。(2) 语义类型是原型关联不是盒子。(3) 教学口径：不许教「汉语没有形容词」，也不许说「汉语形容词和英语的一样」；可教的只有分布事实。
    disputes:
    - 普遍性之争：Dixon 1982 的旧说（有些语言没有形容词类）vs 2004 的修订说；对具体语言仍有学者质疑（如该卷第十章即问「沃洛夫语有形容词类吗？」）。
    - 汉语形容词的归类之争（登记分歧，不站队改判）：传统说（Hockett 1958；Lyons 1968；Li & Thompson 1981；Schachter 1985）称「汉语所有形容词都是动词」；Dixon（2004，§5）直斥此说 "lacks insight"，并引 Xu（1988）——汉语形容词与动词在修饰名词的句法、作谓语的体貌可能性、派生手段、重叠语义上均有系统差别，应认独立词类。本条按清单登记状态入模：无论标签归谁，「汉语性质词无须系词即可作谓语、英语形容词不可」这一分布对比是两派共认的表面事实，be 缺失错误的类型学根源在这一层成立。
    evidence_grade: 章节原文级（Dixon 2004 第一章）
    pending:
    - 误解探针待补（入模标准要求 ≥1）
