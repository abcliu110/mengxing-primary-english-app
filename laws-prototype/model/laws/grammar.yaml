- id: GR-33
  order: 33
  headline: 反意疑问句是一台回声机：它把主句的助动词和极性翻转着弹回来，升调是真问、降调只要你点头
  headline_kid: 句子后面的小尾巴不是随便拖的：它要把前面的「小帮手」动词复制过来，再把正反翻个面；汉语一个「对吧」包打天下，英语每个句子都要现配零件
  claim:
    type: rule
    statement: 反意疑问句（question tag）的生成是三步机械操作：① 回指助动词——取主句的助动词/情态动词/be 动词复制到尾巴，主句没有助动词时召唤 do/does/did；② 极性翻转——主句肯定→尾巴否定（缩略 n't），主句否定→尾巴肯定，半否定词（never、hardly、seldom、few、little）算否定主句；③ 代词对位——尾巴主语必须是与主句主语同指的代词。语调分工（Swan 定版）：尾巴升调=真问（在求证），降调=非问（只求附和或开启话头）——此为倾向而非铁律。
    evidence:
    - Michael Swan《Practical English Usage》第 3 版 question tags 条（§487–488 及第 503 页「meaning and intonation」原文，本轮打开影印页核对：升调/降调分工为原书原文）
    scope: 特例组单列：I am → aren't I；Let's → shall we；祈使句 → will you / won't you；不定代词主语 → they；nothing/something 主语 → it。主句是 I think/believe + 从句时，尾巴跟从句走
  mechanism:
  - beat: 回声机三步
    text_kid: 小尾巴是一台回声机：第一步，复制主句的小帮手；第二步，把正反翻个面；第三步，主语换成同指的代词。三步做完，尾巴就配好了。
    text_adult: 无助动词时召唤 do 与 GR-03 是同一替补机制；半否定词算否定主句是翻转判定的关键细则。
    visual: 一台机器：左边进主句，右边吐出翻好面的尾巴
    anchors:
    - G3_131
  - beat: 升调真问，降调点头
    text_kid: 尾巴读升调，是心里没底、在问你；读降调，是心里有数，只等你点点头。书面语没有声音，就靠语境猜。
    text_adult: Swan 定版的语调分工；对应关系是倾向（升调也可表礼貌试探），Swan 本人即以倾向性说法表述。美式口语中反意疑问使用频率低于英式。
    visual: 一条声调线：上扬的标着问号，下沉的标着对勾
    anchors:
    - V6_家庭_34
  examples:
  - level: 1
    word_ids:
    - G3_131
    sentence: You are a student, aren't you?
    scene_note: 回声机样本：be 动词复制 + 肯定翻否定
    supports: claim
  - level: 1
    word_ids:
    - V6_家庭_34
    sentence: She went home, didn't she?
    scene_note: 无助动词：召唤 did + 代词对位
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: Let's go, shall we?
    scene_note: 特例：Let's 的尾巴是 shall we
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: He never plays football, does he?
    scene_note: 半否定 never 算否定主句：尾巴用肯定
    supports: claim
  error_cases:
  - wrong: You went there, isn't it?
    right: You went there, didn't you?
    error_type: 尾巴不回指-万能尾巴
    source_type: 教学界共识级
    diagnosis: 清单支撑栏登记的典型错误：母语只有一个万能尾巴（如汉语「对吧」）的学习者，面对英语「每句现配」的系统，典型错误是全程统一用 isn't it 与助动词不回指。已如实标注：本轮未检索到针对该错误的 CLEC 级语料计数，不冒充语料定版。回补机制第 1 节。
  probes:
  - PRB-GR33-1
  - PRB-GR33-2
  - PRB-GR33-3
  - PRB-GR33-4
  - PRB-GR33-5
  quiz:
  - q: She went home, ___? A. isn't she B. didn't she
    answer: B——先找小帮手：没有助动词就召唤 did，再翻极性、换代词。
    hint: 回到机制第 1 节「回声机三步」。
  relatives:
  - id: GR-03
    rel: 同族
  - id: GR-02
    rel: 同族
  - id: GR-34
    rel: 同族
  pain_points:
  - 错不完
  - 说不出
  adult:
    sources:
    - Michael Swan《Practical English Usage》第 3 版 question tags 条 §487–488、p.503——接触等级：章节影印页级（本组最高）；汉语对照部分为教学界共识级（见 error_cases 标注）
    boundary: ① I think/believe + 从句时尾巴跟从句走（I think he's coming, isn't he?)；not 的辖域转移同理。② 美式口语使用频率低于英式，且有 isn't it 的松动用法，标准教学系统仍以翻转-回指为正。③ 降调尾巴在英式口语里大量用作会话润滑，不逐句翻译成「对吧」。④ 同极性尾巴（肯定+肯定）表惊讶/讽刺/推断，属进阶语用。
    disputes:
    - 同极性尾巴的语用定性（讽刺 vs 中性推断）各参考语法措辞不一，记为语用层分歧，不影响形式教学。语调与意义的对应是倾向而非铁律。
    evidence_grade: 章节影印页级（形式与语调部分）；汉语对照部分教学界共识级
