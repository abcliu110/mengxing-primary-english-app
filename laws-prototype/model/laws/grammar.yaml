- id: GR-26
  order: 26
  headline: 英语把语法搬了家：从屈折综合到语序分析的总叙事
  headline_kid: 小尾巴一个个磨没了，语法只好搬家：搬进词排队的顺序里，搬进 do、will 这样的小帮手里，搬进 of、to 这样的小介词里
  claim:
    type: etymology
    statement: 古英语是综合语：格、性、时态都写在词尾的屈折里，词序相对自由；一千年间词尾在非重读音节里磨平、脱落（驱动力含语音弱化、与古诺斯语接触者的相互磨平、诺曼法语的叠加冲击），现代英语成为分析语：语法关系改由固定语序、助动词、介词承担。本条是 GR-02、GR-03、GR-04 的共同出生证。
    evidence:
    - Otto Jespersen《Growth and Structure of the English Language》（1905，Teubner）把综合→分析轨迹作为英语史主线叙事提出；现代定版叙事：Albert C. Baugh & Thomas Cable《A History of the English Language》（第 6 版 2013，Routledge）的屈折齐平与脱落章节
    source: 总叙事：屈折综合 → 语序分析的历史搬家（Jespersen 叙事框架 + Baugh & Cable 定版描写；Jespersen 的「进步」评价不收）
    scope: 「搬家」是教学隐喻，不是机制本身：分析化不等于变简单；屈折也未归零（残余形态另有专条盘点，见 GR-29）
  mechanism:
  - beat: 老房子：语法住在词尾里
    text_kid: 很久以前，英语的语法藏在词的小尾巴里：尾巴一变，意思就变，词排在哪儿倒没那么要紧。
    text_adult: 古英语文本的词序自由度与现代英语的刚性 SVO 构成直接对照证据；屈折流失与分析化是中古英语最深刻的结构事件。
    visual: 一座老房子，墙上挂满词尾零件，词们在屋里随便站
    anchors: []
  - beat: 新房子：三样东西当家
    text_kid: 尾巴磨没了，语法搬了家：谁站在前面（语序）、帮手是谁（do、will 这些小词）、小介词别丢（of、to）——今天学英语，盯紧这三样。
    text_adult: 语法功能的系统性转手：格关系→语序+介词、时态体貌→助动词系统膨胀、一致关系→几乎消失；介词在本清单中权重异常之高，正因它是屈折搬家后的主要承接者之一。
    visual: 新房子里三根柱子亮着：语序、助动词、介词
    anchors:
    - V6_日常_1
    - G1_015
    - G1_014
  examples:
  - level: 1
    word_ids:
    - G1_015
    - V6_日常_17
    - G1_014
    sentence: The dog sees the cat.
    scene_note: 新房子现场：语序决定谁看谁，换位置就换意思
    supports: claim
  - level: 1
    word_ids:
    - G1_014
    - V6_日常_17
    - G1_015
    sentence: The cat sees the dog.
    scene_note: 位置一换，故事反过来——老房子的自由词序已经不在了
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: Do you go to school?
    scene_note: 小帮手当家：do 扛着提问（见 GR-03）
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: I will go home.
    scene_note: 小帮手当家：will 扛着将来（见 GR-08）
    supports: claim
  error_cases: *id001
  quiz:
  - q: 词尾磨没以后，英语的语法主要搬去了哪三处？
    answer: 固定语序、助动词、介词。
    hint: 回到机制第 2 节「新房子：三样东西当家」。
  relatives:
  - id: GR-02
    rel: 同族
  - id: GR-03
    rel: 同族
  - id: GR-04
    rel: 同族
  - id: GR-29
    rel: 同族
  adult:
    sources:
    - Otto Jespersen《Growth and Structure of the English Language》（1905）；Baugh & Cable《A History of the English Language》第 6 版（2013）——接触等级：均为二手论述级（原书未打开，经语言学史专题与转述核实）
    boundary: 分析化不等于「变简单」：语序刚性本身是新的约束，助动词系统造出了新的复杂性；把总叙事教成「英语越来越简单」即越界。
    disputes:
    - 'Jespersen 的价值判断（分析化=进步）已被现代语言学整体拒绝：Aitchison《Language Change: Progress or Decay?》（第 3 版 2001）梳理三态度，学界定版取中立论；Bally 早指出综合↔分析方向可逆转（法语将来时由迂回式重新合成）。本条收 Jespersen 的叙事框架，不收他的评价。'
    evidence_grade: 二手论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
