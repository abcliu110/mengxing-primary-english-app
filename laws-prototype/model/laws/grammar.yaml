- id: GR-45
  order: 45
  headline: 名词短语的装箱规矩：轻的短的在前，重的长的往后挂；「谁的」先看那人在不在眼前（Keizer 的功能解释）
  headline_kid: 短的、轻的贴前面，长的、一串的说明挂到后面去；说「谁的」先看那人在不在眼前：在眼前用 's 抱到前面，不在眼前用 of 挂在后面
  claim:
    type: tendency
    statement: Keizer 第 11 章：名词短语的语序是多股功能原则互相妥协的结果（多功能语序理论，源出 Dik 1997）；后置移位的决定同时受结构重量（越长越重越往后）与交际重量（信息地位）制约（「假说 2」，p.273)，且在某些情形下「语用考虑优先于复杂性原则」（p.286）。第 12 章：'s 属格与 of 结构的选择是多因素的，其中关键一项是相关名词短语的激活状态——已提及/可及的指称对象更倾向用 's 前置，新引入的、需要展开说明的更倾向 of 后置（与本清单「已知性」机制同向互证）。
    evidence:
    - Keizer（2007）第 11 章（多功能语序理论、假说 2 在 p.273、「语用优先」语在 p.286）与第 12 章（所有格 's/of 选择与激活状态），均经 García Velasco 书评（《Lingua》119（2009）：136–139）逐章带页码转述核对；Hawkins（1994）《A Performance Theory of Order and Constituency》与 Guéron（1980）为书中对立面的一手书目（书评参考文献表核对）
    scope: 小学剂量：只教「长说明挂后面」的装箱直觉与最常见的 of 后置；'s/of 的激活状态解释属初中与教师层
    exceptions:
    - text: 习语化搭配（a day's journey 型）等本条未展开的因素（语域、节奏）同样影响 's/of 选择，激活状态是「关键一项」不是唯一开关
      word_ids:
      - V6_节日_5
    - text: Keizer 没有给出各因素的统计权重，「语用优先」原话自带限定 "in some circumstances"，不得改写成「语用永远第一」
      word_ids:
      - G1_002
  mechanism:
  - beat: 轻的在前，重的挂后
    text_kid: 装包裹有规矩：短的、轻的贴前面（a red book)，长的、一串的说明挂到后面（the book on the desk by the window)。汉语正相反，再长的说明也全堆在名词前面。
    text_adult: 重量后置与英语语序的整体格局一致（从句、介词短语等重成分系统性右移）。汉语修饰语无条件前置＋「的」，英语则按重量后置——长定语的前置迁移是可由本条机制预测的产出困难。
    visual: 左边：短签贴在包前；右边：长尾巴挂在包后，包稳稳当当
    anchors:
    - G1_002
    - G1_0928
  - beat: 谁的：先看在不在眼前
    text_kid: 那个人就在眼前、大家正想着他，就用 's 一把抱到前面（the author's opinion)；不在眼前、要慢慢说清，就用 of 挂在后面（the opinion of the author）。
    text_adult: '''s/of 选择受生命度与已知性影响的方向，与语料库属格研究的大势同向（本条只登记方向，不引未核的具体频率数字）；激活状态与本清单「已知性」机制（听者可辨识度决定形式选择）同向互证。'
    visual: 一个人站在眼前，'s 把「谁的」抱到前面；人不在眼前，of 把说明挂到后面
    anchors:
    - G1_007
    - G1_002
    - V6_节日_5
    - V6_家庭_34
  examples:
  - level: 1
    word_ids:
    - G1_002
    - G1_0928
    sentence: The book on the desk is new.
    scene_note: 装箱现场：长说明 on the desk 挂在名词后面
    supports: claim
  - level: 1
    word_ids:
    - G1_007
    - G1_002
    sentence: This is my teacher's book.
    scene_note: '''s 前置现场：老师是眼前熟悉的人'
    supports: claim
  - level: 2
    word_ids:
    - V6_节日_5
    - V6_家庭_34
    sentence: At the end of the day, we go home.
    scene_note: of 后置现场：end of the day 慢慢说清
    supports: claim
  - level: 2
    word_ids:
    - G1_043
    sentence: the car's door / the door of the car
    scene_note: 两式对照：同一关系，'s 抱前、of 挂后（与 GR-13 互挂）
    supports: claim
  error_cases: *id001
  quiz:
  - q: 长长的说明应该挂在名词前面还是后面？
    answer: 后面——轻的短的在前，重的长的往后挂，包裹才不头重脚轻。
    hint: 回到机制第 1 节「轻的在前，重的挂后」。
  relatives:
  - id: GR-44
    rel: 前置
  - id: GR-13
    rel: 同族
  - id: GR-30
    rel: 同族
  pain_points:
  - 写不长
  adult:
    sources:
    - Keizer（2007）第 11、12 章（经 García Velasco 书评逐章带页码转述）；Hawkins（1994）；Guéron（1980）；Dik（1997）功能语法——接触等级：目录＋书评全文级（原书未打开，页码经书评转引）
    boundary: (1) Keizer 没有给出各因素的统计权重，「语用优先」自带限定。(2) 's/of 还有语域、节奏、习语化搭配等因素，激活状态是「关键一项」不是唯一开关。(3) 汉语前置迁移一段是本簇的教学推论（已在机制栏标明），不得回引为 Keizer 的实证结论。(4) 小学剂量只到装箱直觉与常见 of 后置。
    disputes:
    - 三方并存：语用单一说（Guéron 1980）vs 复杂性单一说（Hawkins 1994）vs Keizer 的多功能妥协说。本条取妥协说著录（与书评对其第 11 章的肯定一致），但登记另两说为未被否证的对立面——尤其 Hawkins 的加工复杂性解释在心理语言学中仍有独立生命力。
    evidence_grade: 目录＋书评全文级
    pending:
    - （2026-11-02 终局登记）原书未打开一项就此定版：同 GR-44 销项口径——第 11 章「假说 2」(p. 273）与「语用优先」(p. 286）等页码级主张的接触等级封顶为书评转述级（García Velasco 书评逐章带页码转述），不再作开放待核挂账
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（本条的汉语迁移段为教学推论，未登记错例）
