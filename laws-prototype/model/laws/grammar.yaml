  config_gates:
    B: 已裁定（2026-11-02，裁定 B 定版 B1）：本条涉及 POA——只收「先试产出暴露缺口、再给输入」的排序思想作关卡排序原则，完整流程不进小学。原门控记录：本条呈现与练习要求曾受裁定 B 档位门控（默认 B1 顶行，开关只改呈现、不改数据本体）；裁定落档后门控解除，本字段转为裁定记录。
  adult:
    sources:
