- id: GR-18
  order: 18
  headline: 把形式拉回交际现场：一边说话解决问题，一边顺手看形式
  headline_kid: 最好的学语法时间，是你正想说清楚一件事、刚好被一个小形式卡住的那几秒钟
  claim:
    type: tendency
    statement: Long 的「形式聚焦」（focus on form）：在意义为中心的活动中，当交际问题出现时短暂地把注意力引向语言形式；它区别于把形式拆成清单逐项教的 focus on formS。后续课堂研究与元分析显示，嵌于交际中的形式聚焦在准确性与流利性上优于孤立形式教学。
    evidence:
    - 'Michael Long "Focus on Form: A Design Feature in Language Teaching Methodology"（1991，载 de Bot, Ginsberg & Kramsch 编《Foreign Language Research in Cross-cultural Perspective》，John Benjamins，pp.45–46 给出定义）；其互动假说（1983/1996）为同一体系的另一支柱'
    scope: 形式聚焦是「随问题出现」的短插播；需要系统建立的初学框架（如时态两维图）仍需专门的集中呈现
    exceptions:
    - text: 初学框架的系统建立（如时态的时间×看法两维图）需要专门的集中呈现，不适用随问题插播
      word_ids:
      - V6_日常_1
  mechanism:
  - beat: 卡住的那几秒
    text_kid: 你正想告诉同桌昨天去哪儿玩了，卡在 went 上——这几秒钟看一眼形式，比单独坐下来背十条规则记得还牢。
    text_adult: 交际需求制造了真实的「注意差距」时刻（与 GR-17 互挂），此时插入的形式处理有意义锚点托底。
    visual: 对话气泡里一个词卡住，旁边弹出一个小小的形式放大镜
    anchors:
    - G1_055
  - beat: 插播，不是停播
    text_kid: 形式聚焦是插播：看一眼，接着说。把节目停下来逐条讲规则清单，是另一回事（formS），节目就凉了。
    text_adult: Long 的定义核心是「在交际中、由问题触发、短暂」；后续元分析支持其相对孤立形式教学的优势。
    visual: 一条对话长河，中间只有一个小小的放大镜气泡，很快又流回对话
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_055
    sentence: Can I have some water, please?
    scene_note: 交际现场：要水喝的请求句，形式（some、please）顺手习得
    supports: claim
  - level: 1
    word_ids:
    - G4_0415
    sentence: What did you do yesterday?
    scene_note: 交际现场：问昨天做了什么，did 的用法在问答中出现
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: We played football yesterday.
    scene_note: 回答里 went/played 的形式在讲述中被用上
    supports: claim
  - level: 2
    word_ids:
    - G2_082
    sentence: I went to the zoo.
    scene_note: 讲述昨天的经历，过去式在真实表达需求中出现
    supports: claim
  error_cases: *id001
  quiz:
  - q: 形式聚焦（focus on form）和把规则列成清单逐项教，哪一个发生在说话解决问题的时候？
    answer: 形式聚焦——它由交际中出现的问题触发，短暂插入，不是停下交际讲清单。
    hint: 回到机制第 2 节「插播，不是停播」。
  relatives:
  - id: GR-17
    rel: 前置
  - id: GR-23
    rel: 同族
  - id: GR-21
    rel: 同族
  adult:
    sources:
    - Michael Long（1991，John Benjamins，pp.45–46 定义原文页）——接触等级：定义原文级（二手转述核实）
    boundary: 形式聚焦不适用于需要系统建立的初学框架（如时态两维图），框架建立仍需专门的集中呈现。
    disputes:
    - 与 Krashen「形式教学无用论」相对；本项目取 Long 口径，与课标立场一致，记录分歧在案。
