- id: GR-09
  order: 9
  headline: 否定词会「磨损—加固」打转：not 本来是被喊来帮忙加强否定的，后来自己当了主角
  headline_kid: 否定词说多了会变弱，人们就再加一个更重的词来加强；新词抢了班，旧词又慢慢不见了，隔几百年再来一轮
  claim:
    type: etymology
    statement: 高频否定词在语音与语义上弱化，说话人引入强调成分补强，补强成分随后常规化为主要否定标记，原标记脱落，循环重演（耶斯佩森循环）：英语 ne → ne…not → not；法语 ne → ne…pas → 口语 pas。
    evidence:
    - Otto Jespersen《Negation in English and Other Languages》（1917）p.4 的经典描述（循环之名由 Dahl 1979 命名）
    source: 耶斯佩森循环：否定标记的弱化—补强—替换三段式
    scope: 循环解释的是长时段的语言演变，不是孩子今天说错否定的原因；课堂上只作「语言会变」的真历史故事使用
  mechanism:
  - beat: 说多了会变弱
    text_kid: 一个词天天被说，会越说越轻、越说越短。否定词 ne 说到后来几乎听不见了，大家觉得「不够劲」。
    text_adult: 高频带来的语音与语义弱化是否定循环的起点，多语言独立呈现同一三段式轨迹（英语、法语、威尔士语、柏柏尔语）。
    visual: 一个大大的 ne 逐格缩小、变淡
    anchors: []
  - beat: 请帮手，帮手抢班
    text_kid: 人们请来一个重词 not 帮忙加强；后来大家只认 not，旧的 ne 就悄悄退场了。
    text_adult: 补强成分常规化为主要标记、原标记脱落，是循环的后两段；今天的 not 正是当年的补强词。
    visual: 小个子 ne 退到幕后，大个子 not 站到台前
    anchors:
    - V6_日常_64
    - G6_282
  examples:
  - level: 1
    word_ids:
    - V6_日常_64
    sentence: I do not like it.
    scene_note: 今天的否定主角 not 站在动词前面
    supports: claim
  - level: 1
    word_ids:
    - G6_282
    sentence: She is not happy.
    scene_note: not 独自当班的现代句
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: He does not play football.
    scene_note: doesn't 是 not 的缩略后代，仍是同一个主角
    supports: claim
  - level: 2
    word_ids:
    - G2_0502
    sentence: It is not raining.
    scene_note: 否定今天的天气：not 的位置不变
    supports: claim
  error_cases: *id001
  quiz:
  - q: not 一开始就是否定的主角吗？
    answer: 不是。它原是被喊来给旧否定词帮忙加强的，后来才当上主角。
    hint: 回到机制第 2 节「请帮手，帮手抢班」。
  relatives:
  - id: GR-03
    rel: 同族
  - id: GR-26
    rel: 前置
  adult:
    sources:
    - Otto Jespersen《Negation in English and Other Languages》（1917）p.4——接触等级：二手系统论述级（经词条与学术转述核实）
    boundary: 循环解释长时段演变，不是孩子今天说错否定的原因；只作「语言会变」的真历史故事使用。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases）
