- id: GR-03
  order: 3
  headline: do 是替补队员：英语实义动词丢了自己提问、否定的能力，do 被拉来扛时态
  headline_kid: 很久以前动词能自己提问，后来不行了，就请 do 来帮忙举手提问、摇头否定
  claim:
    type: etymology
    statement: 中古英语后期，实义动词逐渐丧失倒装提问与直接加 not 否定的能力；无实义的 do 作为纯语法替补（do-support），在 16–17 世纪被规整进否定句、疑问句与强调句。
    evidence:
    - 'Alvar Ellegård《The Auxiliary Do: The Establishment and Regulation of Its Use in English》（1953，Almqvist & Wiksell），基于 1400–1700 年语料统计；Kroch（1989）以其数据证明各类语境中的 do 以相同速率增长（恒定速率效应）'
    source: 历时叙事：do-support 的建立与规整（Ellegård 1953 语料史）
    scope: be、have（英式）与情态动词保留了自己倒装、否定的老能力，不需要 do 替补
  mechanism:
  - beat: 动词曾经自己会提问
    text_kid: 很久以前，英语动词能自己跑到句首提问。后来这个本领丢了，句子里提问和否定就没人干活。
    text_adult: 中古英语后期实义动词失去倒装与直接否定能力，是 do-support 兴起的系统背景（见 GR-26 总叙事）。
    visual: 老照片风格的动词站在句首，画面渐渐褪色
    anchors: []
  - beat: do 来当替补
    text_kid: do 被请来当替补队员：提问时它举手站到前面，否定时它扛着 not，后面的主动词只管用原形做事。
    text_adult: do 在此无实义、纯语法功能；它的规整化有 Ellegård 的历时语料计数为据，Kroch 的恒定速率再分析排除了「逐语境独立发明」的解释。
    visual: 替补队员 do 从板凳上跑上场，站到主语前面
    anchors:
    - V6_日常_64
    - G2_0489
  examples:
  - level: 1
    word_ids:
    - V6_日常_64
    - G1_052
    sentence: Do you like milk?
    scene_note: 早餐桌上问同学：do 替补上场提问
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: He doesn't play football today.
    scene_note: 今天他不踢球：doesn't 扛否定与时态
    supports: claim
  - level: 2
    word_ids:
    - G6_282
    sentence: Is she happy?
    scene_note: 边界例：be 自己会倒装，不请替补（见 claim 范围）
    supports: claim
  - level: 2
    word_ids:
    - G2_089
    sentence: Can you swim?
    scene_note: 边界例：情态动词自己会倒装，不请替补
    supports: claim
  error_cases:
  - wrong: "She not allowed me to fool around my time."
    right: "She didn't allow me to fool around my time."
    error_type: "否定缺 do 支撑"
    source_type: "真实语料错型"
    diagnosis: "原文只标注目标形式 didn't allow, corrected 按最小改动补全整句。否定直接把 not 放在实义动词之前、无 do 支撑 —— 实义动词自己扛不了否定, 须拉替补 do 进场扛时态与否定。〔出处：Zhan, Huifang. Frequent Errors in Chinese EFL Learners' Topic-Based Writings[J]. English Language Teaching, 2015, 8(5). DOI: 10.5539/elt.v8n5p72 (ERIC EJ1075251)；定位：§3.1 动词形式错误例 e(原文括注: didn't allow); 语料为广西某高校英语专业二年级 177 篇话题作文；学段：大学二年级(英语专业)；病例号 GEC-003〕"
  - wrong: "He not likes this book."
    right: "He doesn't like this book."
    error_type: "否定缺 do 支撑"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 受汉语影响将否定词放在实义动词之前; 原文给出的改正句即 He doesn't like this book.。本例在该文中以编号例呈现, 按『教学文献登记错型』等级收录(与 grammar.yaml 既有 GR-29 病例同级)。〔出处：向秋彤. 高中生英语写作中句法负迁移现象与改进策略[J]. 职业教育发展, 2024, 13(6): 2041起；定位：正文句法负迁移现象编号例 1; 样本为重庆市万州某高中三年级学生作文(文本分析法)；学段：高三；病例号 GEC-004〕"
  quiz:
  - q: 哪个句子不用请 do 来帮忙？A. Do you swim? B. Is she happy?
    answer: B——be 保留了自己倒装的老能力，不需要替补。
    hint: 回到 claim 的范围：哪类动词不需要 do 替补。
  relatives:
  - id: GR-02
    rel: 同族
  - id: GR-26
    rel: 前置
  - id: GR-33
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Alvar Ellegård《The Auxiliary Do》（1953）——接触等级：二手系统论述级（经 Kroch 1989 再分析的引用链核实）
    boundary: be、have（英式）与情态动词保留了自己倒装、否定的老能力，不需要 do 替补。
    disputes:
    - do 的最初来源有争议：Ellegård 主张源于使役构式再分析，另有凯尔特语接触说等；本条只取「功能替补 + 历时规整」这一共识层，不裁来源之争。
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
  zone: 语法
  group: GR
  prereq: []
  probes: []
  status: 入模中
  version: '1.0'
  changelog:
  - date: '2026-11-01'
    change: 清单 v6 散文入模（数据补齐总攻·波次 C1）
    basis: 专家清单 v6 GR 组原文
- id: GR-04
  order: 4
  headline: 三单 -s 是北方方言留下的幸存者：动词变位大简化后唯一没被磨掉的词尾
  headline_kid: 以前动词尾巴有很多种，后来大家越说越简单，只剩 he/she 后面这个小小的 -s 还在值班
  claim:
    type: etymology
    statement: 古英语动词有一整套人称词尾，中古英语时期词尾系统大面积磨损、合并；第三人称单数现在时 -s 起源于北方方言（诺森布里亚），16–17 世纪南下取代南方的 -eth，成为唯一幸存的人称标记。
    evidence:
    - 历史语法共识（Wrenn、Sweet、Jespersen 一致）：约 970 年北方《林迪斯法恩福音书》行间注已有 -s 之例；见 Miwa & Li 对 -s 起源的学术梳理（鹿儿岛大学纪要）
    source: 北方方言（诺森布里亚）动词词尾，南下取代南方 -eth
    scope: 这是「为什么偏偏留了这一个」的历史解释，不是功能解释
  mechanism:
  - beat: 尾巴大磨损
    text_kid: 古英语的动词尾巴是一整排：不同的人配不同的尾巴。几百年里，大家越说越快，尾巴一个个磨没了。
    text_adult: 中古英语词尾系统的整体磨损与合并，是分析语化（GR-26）的一部分；人称标记几乎全失，仅三单 -s 存留。
    visual: 一排词尾像粉笔字被慢慢擦掉，只剩最后一个 -s 还亮着
    anchors: []
  - beat: 北方来的幸存者
    text_kid: 留下的这个 -s 是北方方言的词尾：北方文本里它出现得最早，后来一路南下，把南方的 -eth 换了下来。
    text_adult: 方言文献（北方文本早于标准语数百年出现 -s）与标准语 16–17 世纪 -eth 让位的文本记录互相印证。
    visual: 地图上一个小 -s 从北方向南旅行，最后坐进标准语
    anchors:
    - G2_0489
    - POLY_WATCH
  examples:
  - level: 1
    word_ids:
    - G2_0489
    sentence: He plays football.
    scene_note: 操场上：he 后面 plays 戴着幸存的 -s
    supports: claim
  - level: 1
    word_ids:
    - POLY_WATCH
    sentence: She watches TV.
    scene_note: 在家看电视：she 后面 watches 戴 -s
    supports: claim
  - level: 2
    word_ids:
    - G2_0502
    - G2_100
    sentence: It rains a lot in summer.
    scene_note: 夏天的雨：it 后面 rains 也戴 -s
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: He goes to school by bus.
    scene_note: 上学路上：goes 的 -s 是特殊拼法，来源相同
    supports: claim
  error_cases:
  - wrong: "My friend love me."
    right: "My friend loves me."
    error_type: "三单 -s 遗漏(GR 线)"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 可数名词单数主语之后谓语未用第三人称单数形式; 该文将主谓一致偏误成因归为语际迁移(汉语无主谓一致要求)、语内迁移与结构磨蚀。〔出处：刘沥沥. 初中生英语写作中的主谓一致偏误研究[J]. 职业教育发展, 2025, 14(4): 133-137. DOI: 10.12677/ve.2025.144166；定位：§3.1例句; 样本为重庆市万州区某中学初二某班 20 份作文(该节题为「可数名词做主语」)；学段：初二；病例号 GEC-005〕"
  - wrong: "She always want to be a musician."
    right: "She always wants to be a musician."
    error_type: "三单 -s 遗漏(GR 线)"
    source_type: "真实语料错型"
