- id: GR-35
  order: 35
  headline: only 站哪儿就圈哪儿：它的辖域跟着位置与重音走，口语靠重音补位，书面语必须靠站位明说
  headline_kid: only 像一个手电筒，照到哪儿，哪儿就是「只有这一个」：同一个句子，only 挪一个格子，意思就换一件事
  claim:
    type: tendency
    statement: only 是焦点敏感词：它断言「被圈中的成分成立，同类替代项全不成立」，辖域由它在句中的位置与所关联的焦点共同决定。书面语的规范策略是把 only 紧贴在所圈成分之前；真实口语里 only 习惯居动词前中位，辖域靠重音标示焦点——书面语没有重音通道，故正式写作要求贴位以防歧义。
    evidence:
    - 焦点敏感的形式语义框架依 Horn（1969）对 only 的经典分析与 Rooth（1985）焦点语义学（经 Erlewine & Kotek 的 MIT 语义学研讨班讲义转述核对）；贴位规范与口语习惯位的分工依 Swan《Practical English Usage》only 条的定版处理与用法作家共识
    scope: 理解按描写口径（中位+重音合法），产出在正式写作按处方口径（贴位）；本条不管辖 not only…but also 的 only（属 GR-32）
    exceptions:
    - text: 中位 only 在口语与非正式写作中是常态、不是错误；一律判错是过度处方
      word_ids:
      - G4_0585
    - text: only 圈时间/数量短语时位置在短语前（only yesterday，only three）
      word_ids:
      - G4_0585
  mechanism:
  - beat: 手电筒照哪儿
    text_kid: only 是一支手电筒：照着 I，是「只有我」；照着 kissed，是「只亲了，没做别的」；照着 her，是「只亲了她」。挪一个格子，照亮的就换一个。
    text_adult: 三联对比例是英语教学界沿用百年的 only 经典教例（自 19 世纪修辞学教材起），本轮在多家用法来源中互证一致。汉语「只」的辖域同样随位置变化，机制相通，难点不在概念而在英语书面贴位纪律。
    visual: 一支手电筒在句子上移动，光圈依次落在 I、kissed、her 上
    anchors:
    - ADD_0171
    - V6_核心_11
  - beat: 口语靠声音，书面靠站位
    text_kid: 说话时不用挪位置，重读哪个词，only 就圈哪个；写下来没有声音，就必须把 only 摆到要圈的词前面，不然读者会猜错。
    text_adult: 「口语靠重音、书面靠站位」的分工是参考语法的定版处理；歧义只在书面无重音时成立，朗读时重音即消歧——教学中应先教听辨重音再教贴位。
    visual: 左边一个嘴巴（重音波形），右边一支笔把 only 挪到目标词前面
    anchors:
    - G1_003
    - G1_025
  examples:
  - level: 1
    word_ids:
    - ADD_0171
    - V6_核心_11
    sentence: Only I kissed her.
    scene_note: 圈主语：只有我，别人没有
    supports: claim
  - level: 1
    word_ids:
    - ADD_0171
    - V6_核心_11
    sentence: I kissed only her.
    scene_note: 圈宾语：只亲了她，没亲别人
    supports: claim
  - level: 2
    word_ids:
    - G1_003
    - G1_025
    sentence: I only have one pen.
    scene_note: 口语中位现场：only 在动词前，靠重音圈住 one pen
    supports: claim
  - level: 2
    word_ids:
    - ADD_0171
    - V6_核心_11
    sentence: I only kissed her.
    scene_note: 中位+重音现场：重读 KISSED 是「只亲了」，重读 HER 是「只亲了她」
    supports: claim
  error_cases: *id001
  quiz:
  - q: '"I only kissed her" 和 "I kissed only her"，only 圈的成分一样吗？'
    answer: 不一样：前者（书面贴位读法）圈的是 kissed，后者圈的是 her。
    hint: 回到机制第 1 节「手电筒照哪儿」。
  relatives:
  - id: GR-32
    rel: 对照
  - id: GR-30
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Horn（1969）；Rooth（1985），经 MIT 语义学研讨班讲义转述；Swan《PEU》第 3 版 only 条 §398——接触等级：二手系统论述级（条目号经 2026-11-02 核实，见 pending 销项）
    boundary: ① 中位 only 在口语与非正式写作中是常态、不是错误（与 GR-30/GR-31 的「处方硬化」家族互文）。② only 圈时间/数量短语时位置在短语前。③ not only…but also 的 only 不受本条管辖。④ 先教听辨重音，再教贴位。
    disputes:
    - 处方派（多数写作手册）主张任何语体都应贴位；描写派（CGEL 与用法专栏）承认中位为口语惯用、仅在可能误读时才需移位。登记为语体规范之争，教学口径：理解按描写派，正式写作产出按处方派。
    evidence_grade: 二手系统论述级
    pending:
    - （2026-11-02 销项）Swan《PEU》only 条条目号已核：第 3 版（2005）条目 398 “only: use and position”（含 398.4 “only today etc.”);关联条 “not only … but also” 为条目 383。核对源：第 3 版全文索引。与本文件 GR-33 按第 3 版著录（§487–488）口径一致；第 4 版（2016）条目另行编排，引用须标版次
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases；本条登记的是歧义现象，非学习者错句）
