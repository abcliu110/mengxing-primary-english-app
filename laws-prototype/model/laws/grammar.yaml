- id: GR-21
  order: 21
  headline: 语法讲解的及格线：短、准、够用——先过效率与适切两道检查
  headline_kid: 讲规则像递工具：挑最顺手的、只讲用得上的，讲完马上拿去干活
  claim:
    type: rule
    statement: Thornbury 把语法教学决策拆为 E 因子（效率：economy 简短、ease 易懂、efficacy 有效——须连过注意力、理解、记忆、动机四关）与 A 因子（适切：年龄、水平、班额、需求、兴趣、材料、语境）。这是教师侧的设计检查框架，不是学习规律本身：它规定「怎么教」，不裁定「教什么对」。
    evidence:
    - Scott Thornbury《How to Teach Grammar》（1999，Longman "How to Teach" 系列）开篇评判框架
    scope: 本条为教师/设计层条目（孩子面只作口号呈现）；内容对错由本清单其余各条的出处负责
  mechanism:
  - beat: 递工具，不是摆摊
    text_kid: 讲规则像给人递工具：只递这一件活儿用得上的那把，讲清怎么使，马上让他拿去干活。把整个工具箱倒出来摆摊，谁也记不住。
    text_adult: E 因子的 efficacy 要求讲解连过注意力、理解、记忆、动机四关； economy 与 ease 约束讲解的体量与说法。
    visual: 一只手只递出一把扳手，旁边的工具箱合着
    anchors:
    - G2_0489
  - beat: 先看场合再开口
    text_kid: 同一条规则，讲给谁、在哪儿讲、为什么讲，讲法都不一样：适切检查先看年龄、水平和需求，再决定讲多少。
    text_adult: A 因子是讲解的场合适配清单（年龄、水平、班额、需求、兴趣、材料、语境），与 E 因子共同构成备课检查表。
    visual: 一张检查表，格子依次写着：谁听、多大班、为什么学
    anchors:
    - V6_日常_1
  examples:
  - level: 1
    word_ids:
    - G2_0489
    sentence: He plays. —— he 后面，动词戴 -s。
    scene_note: 示范讲解一：一次只递一个变量，讲完即用
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_1
    sentence: Did you go? —— did 来了，后面用 go。
    scene_note: 示范讲解二：一句话讲清，马上回到问答里练
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: books 的 -s 在说「不止一本」。
    scene_note: 示范讲解三：先讲功能（传递什么信息），后讲形式
    supports: claim
  - level: 2
    word_ids:
    - G2_0502
    sentence: It rains. —— it 的动词也戴 -s。
    scene_note: 示范讲解四：与前例成组复现，不新增负担
    supports: claim
  error_cases: *id001
  quiz:
  - q: （给老师）讲一条新规则之前，先过哪两道检查？
    answer: E 因子（效率：短、易懂、有效）与 A 因子（适切：年龄、水平、需求、语境）。
    hint: 回到机制第 1、2 节：先过效率，再看场合。
  relatives:
  - id: GR-18
    rel: 同族
  - id: GR-17
    rel: 同族
  adult:
    sources:
    - Scott Thornbury《How to Teach Grammar》（1999，Longman）——接触等级：二手系统论述级（经书评与框架转述核实）
    boundary: E/A 因子是设计检查框架，不是学习规律本身；它规定「怎么教」，不裁定「教什么对」。本条为教师层条目。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
