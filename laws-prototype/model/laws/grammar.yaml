- id: GR-43
  order: 43
  headline: 形容词排队有座次：越靠里的越「长在东西身上」——评价坐最外，颜色、出身、材料贴着名词坐
  headline_kid: 几个形容词一起修饰一个东西时要按座次排队：越是这个东西自己长着的、换不了的性质，越贴着名词坐；汉语每个形容词后可以挂个「的」，顺序松得多
  claim:
    type: tendency
    statement: 两套独立文献给出同向的语义类型层级：Dixon 的英语无标记顺序为评价 > 大小 > 物理性质 > 速度 > 性情 > 新旧 > 颜色（颜色是「相当固定的性质」故最贴近名词，评价是「主观判断」故坐最外）；Sproat & Shih（1991）的层级为 QUALITY > SIZE > SHAPE > COLOR > PROVENANCE，并提出机制——层级只约束直接修饰名词的形容词；汉语带「的」的形容词是间接修饰（结构上类似关系从句），故顺序自由，不带「的」的裸修饰与英语一样受层级约束。这是中性直接修饰下的强偏好，不是绝对语法规则。
    evidence:
    - Dixon（1982：24–25），经 Dixon（2004）第一章 §4 脚注 2 逐字转引（原文已读）；Sproat & Shih（1991）"The Cross-Linguistic Distribution of Adjective Ordering Restrictions"，载 Georgopoulos & Ishihara 编《Interdisciplinary Approaches to Language》（Kluwer），pp.565–593——论文原文 PDF 已打开通读（层级 p.565，直接/间接修饰论证 pp.572–578）
    scope: 本条限定于中性直接修饰（Sproat & Shih 本人即把 AOR 限定于 "neutral direct modification"）；教学时取各层级的交集核心，不把任何一张表当唯一答案
    exceptions:
    - text: 对比重音、逗号并列（转为间接修饰）、固定搭配都可合法越序
      word_ids:
      - G1_001
    - text: 多因素证据给层级降温：Wulff（2003）全模型对未见形容词串的预测正确率约 73.5%，语音重量、与名词的共现频率也在起作用——逆序是「别扭且偶有歧义」，不是错句
      word_ids:
      - G2_075
  mechanism:
  - beat: 座次表：主观在外，固有在内
    text_kid: 排队规矩一句话：越是「我觉得」的，坐得越靠外；越是东西自己长着的、换不了的，越贴着名词坐。评价坐最外，颜色贴着名词。
    text_adult: 主观性解释有实验支持：Scontras、Degen & Goodman（2017）发现形容词越主观越靠外；语料侧 Wulff（2003）对 BNC 的多因素分析显示语义变量是最强预测因子。层级被多套独立文献反复提出（Hetzron 1978；Dixon 1982；Cinque 1994；Scott 2002）。
    visual: 一排座位：评价坐在最外侧，中间大小新旧，最里颜色紧贴着名词
    anchors:
    - G2_068
    - G1_034
    - G1_001
  - beat: 汉语的「的」是逃逸通道
    text_kid: 汉语说「小的绿的花瓶」「绿的小的花瓶」都行，因为每个形容词后面挂着「的」，是松松的间接修饰；英语没有「的」帮忙，紧紧叠在一起排，座次就是规矩本身。
    text_adult: Sproat & Shih 的直接/间接修饰之分是本条的机制核心：中国学生的语序错点由此有机制解释——母语的「的」提供了逃逸通道，迁到英语裸叠加时仍按自由顺序排。
    visual: 左边：「的」像松紧带把形容词松松连着；右边：英语形容词紧紧叠成一摞
    anchors:
    - V6_服装_39
    - G1_003
  examples:
  - level: 1
    word_ids:
    - G2_068
    - G1_034
    - G1_001
    sentence: She has a big red bag.
    scene_note: 座次现场：大小在外，颜色贴名词
    supports: claim
  - level: 1
    word_ids:
    - V6_服装_39
    - G1_003
    sentence: He has a new black pen.
    scene_note: 座次现场：新旧在外，颜色在内（black 锚词见 GR-42 例词）
    supports: claim
  - level: 2
    word_ids:
    - G2_075
    sentence: a small green flower
    scene_note: 汉语对照的英语版：裸叠加按层级排（小→绿→花）
    supports: claim
  - level: 2
    word_ids:
    - G1_001
    sentence: a lovely old bag
    scene_note: 评价（lovely）在最外，新旧（old）在其内
    supports: claim
  error_cases: *id001
  quiz:
  - q: big 和 red 一起修饰 bag，哪个离 bag 更近？
    answer: red——颜色是东西固有的性质，贴着名词坐；大小（big）在它外面。
    hint: 回到机制第 1 节「座次表：主观在外，固有在内」。
  relatives:
  - id: GR-42
    rel: 前置
  - id: GR-44
    rel: 同族
  pain_points:
  - 错不完
  - 说不出
  adult:
    sources:
    - Dixon（1982：24–25，经 2004 自引，章节原文级）；Sproat & Shih（1991，pp.565–593，原文级）；Scott（2002）扩展层级经 Artiagoitia（2006）转引（二手转引级）——接触等级逐项见 evidence
    boundary: (1) 这是中性直接修饰下的强偏好，不是绝对语法规则。(2) 各层级的类目清单并不一致（Dixon 把 AGE 排在颜色之前一位，课堂序列把 age 排在 shape 之前），教学时取交集核心，不把任何一张表当唯一答案。(3) 教成「背错顺序就是语法错」会过头：准确定性是「母语者强烈如此排，逆序听起来别扭且偶有歧义」。
    disputes:
    - 解释路线之争：句法决定论（Cinque 1994；Scott 2002——层级是名词短语内部功能层级的镜像，逆序即不合语法）vs 多因素偏好论（Wulff 2003；Scontras 等——语义主观性＋语音＋频率共同作用的偏好梯度）。本条按「强偏好＋机制理据」著录，与句法派并存登记；教学取偏好说（可类推到新词），不取「错序＝错句」的判分口径。
    evidence_grade: 原文级（Sproat & Shih）与章节原文级（Dixon）
