- id: GR-15
  order: 15
  headline: a / an 按声音不按字母：耳朵决定，字母只是参考
  headline_kid: a 还是 an，不看第一个字母长什么样，看第一个声音是不是元音：an hour 的 h 不出声，a unit 开头是「优」的辅音味儿
  claim:
    type: rule
    statement: an 的 -n 是为避免两个元音相撞而保留的连接音：冠词形式由后随词的起始音素（语音）决定，不由拼写字母决定。
    evidence:
    - Michael Swan《Practical English Usage》a/an 条（以发音为准的通行口径）
    scope: h 的读法有方言与历史变异（an historic 在英式旧式用法中可见），小学阶段以「听第一个音」为准，不展开方言史
  mechanism:
  - beat: 耳朵说了算
    text_kid: 选 a 还是 an，先把词读出声：第一个音是元音，就用 an 把两个元音隔开；第一个音是辅音，就用 a。字母长什么样，不算数。
    text_adult: 语音决定形式：an hour（h 不发音）、a one-way street（one 开头是 /w/ 辅音味）、a European（开头是 /j/）成组证明只能以语音解释。
    visual: 一只大耳朵贴在单词前面听第一个音，眼睛（字母）被划上一道斜线
    anchors:
    - V6_节日_16
    - ADD_0308
  - beat: 两个陷阱词
    text_kid: hour 的 h 是哑巴，听到的第一个音是元音，所以 an hour；unit 的第一个字母是元音字母 u，声音却是辅音打头，所以 a unit。
    text_adult: 拼写与选择不一致的词例是本条的证据现场：按字母选必错，按声音选必对。
    visual: hour 的 h 被打上静音标记；unit 的 u 旁边冒出一个辅音音符
    anchors:
    - V6_节日_16
    - ADD_0308
    - ADD_0152
  examples:
  - level: 1
    word_ids:
    - V6_节日_16
    - G3_0796
    sentence: I waited an hour.
    scene_note: h 不出声：第一个音是元音，用 an
    supports: claim
  - level: 1
    word_ids:
    - ADD_0308
    sentence: This is a unit about animals.
    scene_note: u 开头却是辅音声：用 a
    supports: claim
  - level: 2
