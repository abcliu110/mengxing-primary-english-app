- id: GR-20
  order: 20
  headline: 语块先于规则：整句先住进来，语法是后来从里面拆出来的
  headline_kid: 小朋友先是整句整句地学「Can I have...?」「What's this?」，说得多了，才慢慢发现里面藏着可以换零件的机关
  claim:
    type: rule
    statement: Lewis 主张语言由「语法化的词汇」（语块）而非「词汇化的语法」构成；Wray 的公式语研究证明，公式化序列被整块存取、不经语法分析——学习者先整存、后分析，语法图式从语块中被感知出来。
    evidence:
    - Michael Lewis《The Lexical Approach》（1993，Language Teaching Publications）p.iv 名言；Alison Wray《Formulaic Language and the Lexicon》（2002，Cambridge University Press）p.9 公式语定义
    scope: 语块整存不等于拒绝分析：到了需要产出新句子的阶段，必须引导学习者拆块、换件（见 CO-10 的动词岛路径），否则语块会封顶表达能力
  mechanism:
  - beat: 整句先住进来
    text_kid: 小朋友最早说出的英语，是整句整句搬进来的：What's this? 是一整块，不是一个个词拼的。
    text_adult: Conklin & Schmitt（2008）等实验显示，母语者与学习者对公式语的加工速度显著快于新造句，证明整存整取的心理现实性。
    visual: 一整块积木被放进仓库，上面印着一整句问话
    anchors: []
  - beat: 后来才拆出机关
    text_kid: 整句说熟了，大脑才发现：原来中间有个格子可以换零件——Can I have water? 换成 Can I have milk？机关就这样被拆出来。
    text_adult: 从整存到分析是习得的常态路径：语法图式不是先学后用，而是从已存语块中被感知出来（与 CO-12 构式谱系同向）。
    visual: 积木块被打开，露出中间一个可换件的空格子
    anchors:
    - G1_055
    - G1_052
