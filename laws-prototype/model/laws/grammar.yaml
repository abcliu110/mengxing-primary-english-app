- id: GR-02
  order: 2
  headline: 一个句子的时态只标记一次：标在第一个动词上，后面的动词回原形
  headline_kid: 时态标记像一支向下的箭头，一个句子只落一次；did 出来站岗，后面的动词就不落箭头、用原形
  claim:
    type: rule
    statement: 英语的时态（与人称一致标记）由限定动词链的第一个成分承载：did / does / do 一旦扛起时态，后随实义动词不再重复标记、用原形。
    evidence:
    - Rodney Huddleston & Geoffrey K. Pullum《The Cambridge Grammar of the English Language》（CGEL，2002）动词短语结构章——限定性只落在首个助动词/动词上的分析
    scope: 同一分句内的动词链；出现第二个分句（如从句）时，新分句重新标记自己的时态
  mechanism:
  - beat: 箭头只落一次
    text_kid: 一个分句里，时态这支箭头只落在站在最前面的那个动词上：is、did、does 落上了，后面的动词就不落箭头、用原形。
    text_adult: 限定性（finiteness）落在动词链首个成分上，这是 CGEL 对动词短语结构的分析，与本项目「时态全句只标记一次」的裁定同源同口径。
    visual: 一排动词排队，第一个动词带动词线、线中点落一支向下箭头，后面的动词线下都没有箭头
    anchors:
    - V6_日常_1
  - beat: did 站岗的三种场合
    text_kid: 提问（Did you go?)、否定（She doesn't like it)、强调（I do like it）——三种句子里都是 did/does 先站出来扛时态，主角动词退回原形。
    text_adult: 三类句子共享同一词形事实，无需逐句背规则：助动词扛时态，实义动词回原形。
    visual: 三个门框（问号、叉号、感叹号），每个门框前都站着一个 do 家族成员
    anchors:
    - V6_日常_64
  examples:
  - level: 1
    word_ids:
    - V6_日常_1
    - G2_080
    sentence: Did you go to the park?
    scene_note: 周末问同学：did 扛了过去时，go 用原形
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_64
    - G1_037
    sentence: She doesn't like apples.
    scene_note: 同桌不吃苹果：doesn't 扛时态，like 用原形
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: Does he play football?
    scene_note: 问同学踢不踢球：does 站岗，play 回原形
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: I do go to school by bus.
    scene_note: 强调句：do 扛时态，go 仍用原形
    supports: claim
  error_cases:
  - wrong: "He doesn't plays games."
    right: "He doesn't play games."
    error_type: "标记重复(时态/一致标两次)"
    source_type: "真实语料错型"
    diagnosis: "原文将此例归入『误加』: 助动词 doesn't 已承载否定与人称标记, 实义动词应回原形 play, 学生又给动词加了 -s —— 同一个标记在一个句子里标了两次。〔出处：胡晓, 冯姗. 错误分析理论视角下初二写作中动词误用研究[J]. 职业教育发展, 2026, 15(4): 20-32. DOI: 10.12677/ve.2026.154163；定位：表3「动词误加」典型案例, 学生编号 S33(原文括注: 应为 doesn't play); 语料为重庆万州及周边四所学校初二 150 篇写作；学段：初二；病例号 GEC-001〕"
  - wrong: "What does my father looks like?"
    right: "What does my father look like?"
    error_type: "标记重复(时态/一致标两次)"
    source_type: "真实语料错型"
    diagnosis: "原文分析(转述): does 已标出时态与人称, 学生又在 look 上保留三单 -s, 等于把标记标了两次(原文明言学习者事实上把时态标了两次)。〔出处：Zhan, Huifang. Frequent Errors in Chinese EFL Learners' Topic-Based Writings[J]. English Language Teaching, 2015, 8(5). DOI: 10.5539/elt.v8n5p72 (ERIC EJ1075251)；定位：§3.1 动词形式错误例 d(原文括注: look); 语料为广西某高校英语专业二年级 177 篇话题作文；学段：大学二年级(英语专业)；病例号 GEC-002〕"
  quiz:
  - q: Did you ___ to school yesterday? A. go B. went
    answer: A. go——did 已经扛了过去时，后面的动词不落箭头、用原形。
    hint: 回到机制第 1 节「箭头只落一次」。
  relatives:
  - id: GR-03
    rel: 同族
  - id: GR-33
    rel: 同族
  - id: GR-34
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Huddleston & Pullum《CGEL》（2002）——接触等级：二手系统论述级（经 Glottopedia 分析总览页核实）
    boundary: 只适用于同一分句内的动词链；句子里出现第二个分句（如从句）时，新分句重新标记自己的时态。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
