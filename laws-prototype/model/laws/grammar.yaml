- id: GR-32
  order: 32
  headline: 关联词成对出门：both…and、either…or 各就其位，并列成分要同形，动词听离它最近的那个主语
  headline_kid: both 和 and 是一对搭档，搭档不能串门；两个搭档夹着的东西要长得一样；either…or 领着两个主语时，动词听离它最近的那个
  claim:
    type: rule
    statement: ① 配对纪律：关联并列是封闭配对——both…and…、either…or…、neither…nor…、not only…but also…（also 可省、but 不可省），混搭不成立。② 同形原则：关联词之后紧跟的成分必须同类同形。③ not only 前置句首时后半句主辅倒装。④ 就近原则：either…or / neither…nor 连接数不一致的主语时，谓语与较近的主语一致——就近在一致三原则（语法一致、意义一致、就近一致）中排位最末，只管 or/nor 型并列。
    evidence:
    - Purdue OWL 关联并列条；CGEL 一致关系三原则的通行转述；同形原则与 not only 倒装为 Quirk 等参考语法与 Swan《Practical English Usage》的共同定版
    scope: 就近只管 or/nor 型并列主语；and 连接的主语永远复数，不适用就近
  mechanism:
  - beat: 搭档不能串门
    text_kid: both 的搭档是 and，either 的搭档是 or，neither 的搭档是 nor——每对搭档一起出门，不许跟别人组队。
    text_adult: 封闭配对是形式档案：混搭（*both…and or、*either…nor）在标准英语中不成立；neither…nor 本身已含否定，谓语不再加否定词。
    visual: 三对小伙伴手拉手出门，队服颜色各不相同
    anchors:
    - G1_014
    - G1_015
  - beat: 夹着的东西要同形
    text_kid: 把关联词分别贴到两边读：I like both swimming and running——两边都是 -ing，长得一样；一头是动作、一头是名词，就别扭了。
    text_adult: 判断法：关联词分别贴到两个被连接成分前朗读，成分必须同类同形；*She both likes music and dancing 的错位源于 both 的辖域只盖住 likes。
    visual: 天平两端各放一个 -ing 词，天平平平的
    anchors: []
  - beat: 动词听最近的那个
    text_kid: either…or、neither…nor 领着两个数不一样的主语时，动词听离它最近的那个：students 在近处就 were，teacher 在近处就 was。
    text_adult: 就近原则有心理语言学实在性（agreement attraction 实验传统）；但它排位最末：真主语被介词短语隔开时，跟着近处名词走正是经典的「就近错误」（The quality of the mangoes is…）。
    visual: 动词侧着耳朵，听离它最近的那个主语说话
    anchors:
    - G1_007
    - G3_131
  examples:
  - level: 1
    word_ids:
    - G1_014
    - G1_015
    sentence: I like both cats and dogs.
    scene_note: 配对+同形：both…and 夹着两个名词
    supports: claim
  - level: 1
    word_ids:
    - G2_0781
    sentence: She likes both music and dancing.
    scene_note: 同形现场：both 移到两个名词短语前面，两边对齐
    supports: claim
  - level: 2
    word_ids:
    - G1_007
    - G3_131
    sentence: Neither the teacher nor the students were late.
    scene_note: 就近现场：动词听近处的 students
    supports: claim
  - level: 2
    word_ids:
    - G1_007
    - G3_131
    sentence: Neither the students nor the teacher was late.
    scene_note: 顺序一换：动词改听近处的 teacher
    supports: claim
  error_cases:
  - wrong: She both likes music and dancing.
    right: She likes both music and dancing.
    error_type: 平行结构错位
    source_type: 条目成人层登记的事故例
    diagnosis: 清单机制栏登记的错位例：both 的辖域只盖住 likes，后半盖不住；把 both 移到两个同形成分之前即对齐。回补机制第 2 节。
  - wrong: The teacher and the students was happy.
    right: The teacher and the students were happy.
    error_type: 就近误用-and 主语
    source_type: 条目成人层登记的事故例
    diagnosis: 清单边界明示：and 连接的主语永远复数，不适用就近（*The teacher and the students was 不成立）。回补机制第 3 节：就近只管 or/nor。
  quiz:
  - q: both 的搭档是 and 还是 or？
    answer: and——both…and 是一对，搭档不能串门。
    hint: 回到机制第 1 节「搭档不能串门」。
  relatives:
  - id: GR-12
    rel: 同族
  - id: GR-34
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Purdue OWL 关联并列条；CGEL 一致三原则；Swan《PEU》——接触等级：二手系统论述级
    boundary: ① 就近原则只管 or/nor 型并列主语；and 连接的主语永远复数。② 就近不是通用许可：The quality of the mangoes is… 中谓语必须跟真正主语 quality，跟着近处走是「就近错误」。③ 混合数主语时把复数放后面更自然，是文体建议非语法强制。④ neither…nor 本身已含否定，谓语不再加否定词。
    disputes:
    - 就近原则的地位有温和分歧：严格形式语法倾向把它处理为「意义一致」的副产品或口语宽容，CGEL 明列为独立原则之一。教学口径取 CGEL：规则照教，但明确它排位最末，与语法一致冲突时语法一致优先。
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
