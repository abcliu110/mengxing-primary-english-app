- id: GR-44
  order: 44
  headline: 名词短语是一个打包递出去的「指称单位」：包里谁当头、算哪一类，边界是软的、是梯度（Keizer）
  headline_kid: 名词短语像一个打包好的包裹：最前面的 the / this / three 是封条，中心名词是包裹里的东西本体；英语说话是整包递出去的，所以可数名词不能「光着身子」出门
  claim:
    type: tendency
    statement: Keizer（2007）对英语名词短语的系统检验给出三点框架性结论：(1) 整体指称——名词短语作为一个单位行使指称（紧密同位结构中是整个结构在指称；sort of/kind of 序列熔合成限定词化单位；pseudo-partitive 是「复合量化词＋中心名词」的整体）；(2) 范畴梯度——「中心性」是由多条标准投票决定的簇概念，标准冲突时按满足条数定中心，补足语与修饰语之分也是渐变的；(3) 结构不能自足——名词短语的内部结构要得到充分解释，必须先看交际、语用与认知因素如何介入（语料取自 ICE）。
    evidence:
    - 'Evelien Keizer（2007）《The English Noun Phrase: The Nature of Linguistic Categorization》，剑桥大学出版社（Studies in English Language 丛书），xiii + 379 页，精装 ISBN 9780521849616；章级内容经 Daniel García Velasco 的正式书评（《Lingua》119（2009）：136–139，DOI 10.1016/j.lingua.2008.06.003）逐章带页码转述'
    scope: 对小学教学的剂量：孩子只需「打包」直觉与封条意识；梯度与中心性之争是教师知识，不下放到儿童规则
    exceptions:
    - text: 双名词结构的中心归属在文献中另有异说（binominals 的 N1 中心说传统），Keizer 按其标准簇裁定为第二名词——中心判定本就是梯度的
      word_ids:
      - G1_002
    - text: 该书刻意不依附任何单一理论的形式系统，部分范畴（qualifiers、complex quantifiers 等）为个案设立，难以平移到综合理论
      word_ids:
      - G1_055
  mechanism:
  - beat: 整包递出去
    text_kid: 说话时，名词不是单个递出去的，是打好包整包递：封条（the/this/three）先贴上，说明签（形容词）贴在外面，本体（名词）在中间，长说明挂在包外。
    text_adult: 教学骨架「限定—数量—描写—中心名词—后修饰」的分区顺序是描写语法的通行框架；Keizer 的贡献是给骨架装上解释层：分区与中心都是原型式的，边缘情形是常态而非例外。
    visual: 一个包裹：封条、说明签、本体、挂在外面的长尾巴，逐个标出
    anchors:
    - G1_002
    - G1_034
    - G1_0928
  - beat: 谁是本体，有时说不清
    text_kid: a bottle of wine 里，到底是 bottle 还是 wine 当头？这种模糊是正常的——「谁是中心」是好几条标准投票投出来的，不是一条线划出来的。
    text_adult: 中心性簇概念（第 2 章）：标准互相冲突时按满足条数定中心；紧密同位结构至少六型，按特征多少呈梯度成员资格（第 3 章）；补足语提供整个短语的「概念视角」、修饰语不提供（第 10 章，p.251）。
    visual: 两张选票投给 bottle 和 wine，票数接近，标着「模糊地带」
    anchors:
    - G1_002
    - G1_001
  examples:
  - level: 1
    word_ids:
    - G1_002
    - G1_034
    - G1_0928
    sentence: The red book on the desk is mine.
    scene_note: 整包现场：封条 the、说明签 red、本体 book、长尾巴 on the desk
    supports: claim
  - level: 1
    word_ids:
    - G1_002
    - G1_001
    sentence: I have three books in my bag.
    scene_note: 封条是数量 three：可数名词打好包才出门
    supports: claim
  - level: 2
    word_ids:
    - G1_055
    sentence: a bottle of water
    scene_note: 模糊现场：bottle 与 water 谁当头，按标准投票（见机制第 2 节）
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: the books on the desk
    scene_note: 长说明挂包外：on the desk 不进包心
    supports: claim
  error_cases: *id001
  quiz:
  - q: 可数名词为什么不能「光着身子」出门？
    answer: 因为名词短语是整包递出去的：要有封条（限定词），或本身是复数/专名，才递得出去。
    hint: 回到机制第 1 节「整包递出去」。
  relatives:
  - id: GR-45
    rel: 同族
  - id: GR-13
    rel: 同族
  - id: GR-43
    rel: 同族
  adult:
    sources:
    - Evelien Keizer（2007，CUP，ISBN 9780521849616）；García Velasco 书评（《Lingua》119（2009）：136–139，DOI 10.1016/j.lingua.2008.06.003，书评全文已打开）——接触等级：目录＋书评全文级（原书未打开，凡涉页码的主张均经书评转述，不冒充原书直引）
    boundary: (1) 术语交代：框架里说的 "unit status"（单位性）在语言学中原是 Langacker 认知语法的「固化」术语；据核查（目录＋书评全文），Keizer 2007 并未以该术语为名词短语立论——本条按可核内容立论（整体指称＋范畴梯度），不把 unit status 冒充为 Keizer 的术语；儿童版「打包单位」是教学转述，不是她的理论命名。(2) 全书不用频率统计：其「原型/梯度」结论建立在标准计数与个案分析上，教学引用时不得加统计口吻。(3) 小学剂量只到「打包」直觉与封条意识。
    disputes:
    - 方法论之争（书评人 García Velasco 明确提出）：语用/认知因素会影响句法范畴的表现，并不逻辑地推出「范畴本身是梯度的」——形式语言学立场完全可以接收同样的数据而保持离散范畴。Keizer 的梯度立场与形式派的离散立场并存登记，本条取其教学可用的部分，不把梯度说当作已判胜负的定论。
    evidence_grade: 目录＋书评全文级
    pending:
    - （2026-11-02 终局登记）原书未打开一项就此定版：Keizer (2007) 无开放全文，本条页码级主张的接触等级封顶为「目录＋书评全文级」（García Velasco 正式书评逐章带页码转述、书评全文已打开）；如需原书直引须以馆藏/购书渠道另行取得，不再作开放待核挂账
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases）
