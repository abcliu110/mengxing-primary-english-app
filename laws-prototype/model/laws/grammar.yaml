    sources:
    - Eve Sweetser《From Etymology to Pragmatics》（1990，CUP，ISBN 0-521-32406-8）第 3 章——接触等级：章节页码级（经学术论文转引核实）
    boundary: 力图式是语义骨架，不覆盖礼貌、委婉等语用用法；教学中类比须同时声明这一失效点。
    disputes: []
