- id: GR-40
  order: 40
  headline: 虚拟语气只剩几块化石：If I were 的 were 与 suggest that he be，是「过去形式标记非现实」的最后遗迹
  headline_kid: 英语只剩两件「说假话专用」的纪念品：If I were you 里的 were 在喊「这是假的」，suggest that he be 里的 be 在喊「这事还没成真」
  claim:
    type: rule
    statement: 现代英语的虚拟语气不是完整变位系统，而是两个残存点：① were 遗迹（irrealis were）——be 的过去式在假设条件、wish、as if 从句中对所有人称用 were，用「过去」的形式标记「不是现实」；口语与非正式体中 was 大量替代，正式体以 were 为规范。② 命令式虚拟（mandative）——在 suggest/demand/insist/recommend 等「要求实现某事」的 that 从句中动词用原形、三单不加 -s、否定把 not 放在动词前；美式英语此式是活的标准用法，英式英语 20 世纪中几近消失（代以 should 式或直陈式），近年受美式影响回流中。
    evidence:
    - 框架依 CGEL 的 subjunctive 处理（were 定性为 irrealis 残存式、mandative 从句的触发词表与 not 前置否定），经 "English subjunctive" 词条的系统转述核实；英美消长依 Övergaard（1995）对 20 世纪英美语料的 mandative 研究结论（经同词条转引）
    scope: 小学与初中低段只要求认得出 If I were you 与 God bless you、Long live… 等公式化石，不要求产出 mandative 全式；真实过去条件（指真实往事）必须用 was
  mechanism:
  - beat: were 在喊「这是假的」
    text_kid: If I were you——I 本来配 was，这里偏用 were。这件旧衣服一穿上，大家就知道：下面说的是假的、是假设的。
    text_adult: were 遗迹与 TA-08（过去=距离）构成形态-机制互证：过去形式系统性地兼职标记「远离现实」（礼貌、假设、转述、虚拟），were 是该系统在变位耗尽后留下的最后一块可见化石——与 GR-08 情态化石、GR-04 三单幸存者同属一个总叙事。
    visual: 一件博物馆里的旧外套，标签写着「非现实专用」
    anchors:
