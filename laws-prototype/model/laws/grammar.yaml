- id: GR-10
  order: 10
  headline: some / any 是说话人的立场选择，不是「肯定句 some、疑问否定 any」的铁律
  headline_kid: some 是「我心里有数、我乐意」的小旗子，any 是「随便哪个都行、我没预设」的小旗子；举哪面旗，看说话人的心思
  claim:
    type: tendency
    statement: some 携带说话人的肯定预期/积极立场（故请求、邀请句中用 some 是「预期对方答应」），any 是无预设的自由选择/非断言环境标记；两者的分布由立场与语境决定，不由句类机械决定。
    evidence:
    - Michael Swan《Practical English Usage》（第 4 版 2016，OUP）some/any 条；与 Quirk et al.（1985）断言/非断言形式的处理一致
    scope: 初学阶段「陈述肯定多用 some、一般疑问与否定多用 any」仍是可用的默认倾向，必须标明是倾向，例外随学随补，不得再以「铁律」措辞出现
    exceptions:
    - text: 邀请/请求句中用 some，是预期对方答应的立场选择（Would you like some tea?)
      word_ids:
      - G2_0944
      - V6_日常_64
    - text: 肯定句中 any 可表「任意」（Any child can read it)
      word_ids:
      - G3_0667
      - G2_0492
  mechanism:
  - beat: 两面小旗子
    text_kid: some 是「我心里有数」的小旗子，any 是「随便哪个都行」的小旗子。说话人先有心思，再举旗子，不是先看句子是肯定还是否定。
    text_adult: 分布由立场决定：肯定预期→some；无预设/自由选择→any。句类只是与立场常相关，不是决定者。
    visual: 两面小旗子立在说话人头顶：一面写着「有数」，一面写着「随便」
    anchors:
    - G2_0944
  - beat: 默认倾向不是铁律
    text_kid: 刚开始学，可以先记一个大概：肯定句多用 some，提问和否定多用 any。但这只是「多半」，遇到邀请、请求就翻牌。
    text_adult: 旧铁律已被裁定废止，改判为「立场与连接选择」；默认倾向保留为入门脚手架，随学随补例外。
    visual: 一块写着「多半如此」的牌子，旁边挂着几个例外小牌（邀请、任意）
    anchors:
    - G1_002
    - G1_003
  examples:
  - level: 1
    word_ids:
    - G1_003
    sentence: She has some pens.
    scene_note: 默认倾向：肯定陈述多用 some
    supports: claim
  - level: 1
    word_ids:
    - G1_003
    sentence: Do you have any pens?
    scene_note: 默认倾向：一般疑问多用 any
    supports: claim
  - level: 2
    word_ids:
    - G2_0944
    - V6_日常_64
    sentence: Would you like some tea?
    scene_note: 例外现场：邀请时用 some，因为盼着对方答应
    supports: claim
  - level: 2
    word_ids:
    - G3_0667
    - G2_0492
    sentence: Any child can read it.
    scene_note: 例外现场：肯定句里 any 表「任意一个」
    supports: claim
  error_cases: *id001
  quiz:
  - q: 邀请朋友喝茶、盼着他答应：Would you like ___ tea? A. some B. any
    answer: A. some——邀请时的 some 是「预期对方答应」的立场旗。
    hint: 回到机制第 1 节「两面小旗子」。
  relatives:
  - id: GR-27
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Michael Swan《Practical English Usage》第 4 版（2016，OUP，ISBN 9780194202411）some/any 条；Quirk et al.（1985）——接触等级：二手系统论述级
    boundary: 初学默认倾向可用，但必须标明是倾向且例外（邀请/请求/任意义）随学随补，不得再以「铁律」措辞出现（本项目已裁定旧铁律废止）。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases）
