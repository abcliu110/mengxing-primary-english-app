    diagnosis: "名词复数 -s 遗漏。与 GEC-008–010 合看: 该加的(复数 -s)不加, 不该加的(三单 -s)乱加 —— 两个 -s 系统各自独立、互不相干。〔出处：Zhan, Huifang. Frequent Errors in Chinese EFL Learners' Topic-Based Writings[J]. English Language Teaching, 2015, 8(5). DOI: 10.5539/elt.v8n5p72 (ERIC EJ1075251)；定位：§3.5 名词复数错误例 a(原文括注: strangers); 该节复数形式错误共 84 例次; 语料为广西某高校英语专业二年级 177 篇话题作文；学段：大学二年级(英语专业)；病例号 GEC-011〕"
