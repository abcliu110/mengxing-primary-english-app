- id: GR-22
  order: 22
  headline: 汉语不标的，英语偏要标：冠词、时态、复数、三单 -s 是中国孩子的错误集中区
  headline_kid: 汉语靠上下文就懂的事，英语非要在词上做个记号；记号越是汉语里没有的，就越容易漏
  claim:
    type: tendency
    statement: 母语迁移发生在系统差异点上：汉语无冠词系统、无时态形态、无名词复数与三单一致标记，英语这些强制标记位置正是中国学习者错误的统计高发区（冠词错误居首，时态形式、复数、三单 -s、介词次之）。
    evidence:
    - 连淑能《英汉对比研究》（1993）形合/意合与形态差异框架；中国学生自由写作语料研究（冠词错误居首；domains.yaml 纲领 basis 引 ERIC EJ1075686）
    scope: 迁移是错误来源之一，不是全部：过度泛化（如 *goed）等语内错误与迁移并存，教学诊断时两类要分开
    exceptions:
    - text: '*goed 式过度泛化错误来自学习者系统内部，与汉语迁移无关（见 GR-16）'
      word_ids:
      - V6_MORPH_20
  mechanism:
  - beat: 记号地图
    text_kid: 把英语必须做记号的地方画成一张地图：a/the、过去式、复数、三单 -s——汉语里这些地方是空白，所以最容易漏。
    text_adult: 错误分布与中英形态系统差异点逐项对应，且随水平提升高发区收窄的顺序与标记的有无标记状态一致，排除「普遍粗心」解释。
    visual: 一张地图，四个位置亮着红灯：冠词、时态、复数、三单
    anchors:
    - G1_015
    - G2_0489
  - beat: 漏的不是态度，是母语没这个格子
    text_kid: 孩子漏掉 a，不是不认真：他的母语里根本没有「冠词」这个格子，要先在脑子里新开一个格子，记号才有地方放。
    text_adult: 迁移的机制是系统差：目标语强制标记而母语无对应范畴时，学习者默认按母语的无标记方式产出（与 GR-25 标记性预测互证）。
    visual: 一个空的格子被画出来，标着「新开：冠词」
    anchors:
    - G1_002
    - G1_029
  examples:
  - level: 1
    word_ids:
    - G1_015
    sentence: I have a dog.
    scene_note: 集中区现场一：冠词 a 要标出来
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: He plays football.
    scene_note: 集中区现场二：三单 -s 要标出来
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    - G1_029
    sentence: I have three books.
    scene_note: 集中区现场三：复数 -s 要标出来
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: She played football yesterday.
    scene_note: 集中区现场四：过去式 -ed 要标出来
    supports: claim
  error_cases:
  - wrong: I have dog.
    right: I have a dog.
    error_type: 母语迁移-冠词缺失
    source_type: 真实语料错型
    diagnosis: 清单条目登记：中国学生自由写作语料研究中冠词错误居首（domains.yaml 纲领 basis 引 ERIC EJ1075686）；汉语无冠词系统，漏标是系统差而非粗心。回补机制第 1 节记号地图。
  quiz:
  - q: 中国孩子英语错误里，哪一类排第一？A. 冠词 B. 语序
    answer: A. 冠词——汉语没有冠词系统，它是最大的系统差异点。
    hint: 回到机制第 1 节「记号地图」。
  relatives:
  - id: GR-25
    rel: 同族
  - id: GR-16
    rel: 对照
  - id: GR-15
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - 连淑能《英汉对比研究》（1993）；中国学生自由写作语料研究（见 domains.yaml basis，ERIC EJ1075686）——接触等级：二手系统论述级
    boundary: 迁移是错误来源之一，不是全部——过度泛化等 intralingual 错误与迁移并存（见 GR-16），教学诊断时两类要分开。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
