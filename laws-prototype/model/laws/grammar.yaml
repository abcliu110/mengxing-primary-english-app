  group: GR
  prereq: []
  probes: []
  status: 入模中
  version: '1.0'
  changelog:
  - date: '2026-11-01'
    change: 清单 v6 散文入模（数据补齐总攻·波次 C1）
    basis: 专家清单 v6 GR 组原文
- id: GR-36
  order: 36
  headline: 使役动词按力气排队：make 是推着走，let 是放行，have 是派活，get 是说服——形式上只有 get 请得动 to
  headline_kid: 让别人做事有四种「力气」：make 是推着走，let 是放行，have 是派活，get 是说服；四个词里只有 get 后面的动词要带 to
  claim:
    type: rule
    statement: 四词构成致使力梯度（与 GR-07 力动态对接）：make=强力致使（对象意志被压过）、let=移除障碍（对象意志自发，致使者只撤除阻挡）、have=权威安排（致使力来自角色/职务关系）、get=说服致使（对象意志被改变）。形式档案是封闭对照：make/let/have + 宾语 + 光杆不定式；get + 宾语 + to 不定式；help 两可。被动不对称：make 被动时 to 必须回来（He was made to wait）；have 的使役式无被动；let 作「允许」讲时基本无被动（固定式 The dogs were let out 除外）。
    evidence:
    - 形式档案与被动不对称依 ELT Concourse 教师培训语法（causative 条）与 Cambridge 系考试语法（CPE 语法指南）互证；力梯度为 Talmy 力动态框架在参考语法中的通行应用（与 GR-07 同一出处线）
    scope: have/get + 宾语 + 过去分词（have my car repaired）是另一个结构，与本条「+ 人 + 动词」分开记；force/cause 等正式词走 to 不定式，分开记
  mechanism:
  - beat: 四种力气
    text_kid: 让别人做事，力气分四档：make 是推着你走（不想做也得做）；let 是把门打开（你想做，我准了）；have 是派活（我是安排的人）；get 是说服（把你说动了）。
    text_adult: 力梯度与 GR-07 的力动态是同一套图式在使役域的实例：意志被压过、障碍被移除、权威安排、意志被改变，四种力的来源各不相同。
    visual: 四格漫画：推、开门、派任务单、坐下来谈
    anchors:
    - V6_日常_1
    - G3_0442
  - beat: 衣服不一样
    text_kid: 四个词后面的动词穿什么衣服也不一样：make、let、have 后面光着脚（不带 to)，只有 get 后面要穿上 to 这双鞋。
    text_adult: 形式档案封闭：被动时 make 的 to 要回来，have 没有使役被动，let 的被动只存在于 let out 这类词汇化短语。中国学习者三类高频错误（make/let 后误加 to、get 后漏 to、被动漏 to）与档案一一对应。
    visual: 四个动词排队，前三个后面的动词光脚，get 后面的穿着 to 鞋
    anchors:
    - V6_学校_75
    - G4_0498
    - G3_0796
  examples:
  - level: 1
    word_ids:
    - V6_日常_1
    sentence: Let me go.
    scene_note: let 现场：放行，后面的 go 光着脚
    supports: claim
  - level: 1
    word_ids:
    - V6_学校_75
    - G4_0498
    sentence: Mum makes me practise the piano.
    scene_note: make 现场：推着走，practise 不带 to
    supports: claim
  - level: 2
    word_ids:
    - G3_0442
    sentence: I got him to help me.
    scene_note: get 现场：说服，help 前面穿 to
    supports: claim
  - level: 2
    word_ids:
    - G3_0796
    sentence: He was made to wait.
    scene_note: 被动现场：make 一被动，to 必须回来
    supports: claim
  error_cases:
  - wrong: She made me to go.
    right: She made me go.
    error_type: 使役形式误加 to
    source_type: 教学文献登记错型
    diagnosis: 清单支撑栏登记：中国学习者高频错误与形式档案一一对应——make/let 后误加 to（受汉语「让/叫」后动词无形式变化的迁移与 to 不定式泛化双重作用）、get 后漏 to、被动漏 to，三类均为可预测的档案型错误。回补机制第 2 节。
  quiz:
  - q: I got him ___ the door. A. open B. to open
    answer: B——只有 get 后面的动词要带 to。
    hint: 回到机制第 2 节「衣服不一样」。
  relatives:
  - id: GR-07
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - ELT Concourse 教师培训语法 causative 条；Cambridge 系 CPE 语法指南（两源原文已打开互证）——接触等级：教学定版转述级
    boundary: ① make 还有「造出结果」义（make him a star / make her happy），不属使役跟动词式，勿混。② let 的被动在 let go 等词汇化短语中存在，属固定式例外。③ have + 人 + 光杆式在英式中较美式少用，属语体/变体差。④ force/cause 等正式词走 to 不定式，与四词档案分开记。
    disputes:
    - 无实质分歧。仅分析分歧：CGEL 把 make/let/have 的光杆式归入「裸不定式补足语」的封闭小类，与感知动词（see him go）同组；教学语法多单列使役——不影响形式事实。
    evidence_grade: 教学定版转述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
