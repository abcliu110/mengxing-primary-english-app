    rel: 对照
  adult:
    sources:
    - Huddleston & Pullum《CGEL》（2002）属格章——接触等级：二手系统论述级
    boundary: 无生命名词的 's 在正式语体中仍常让位于 of 结构（the leg of the table 更稳妥），适用范围随名词的生命度与熟悉度渐变，非一刀切。
    disputes: []
