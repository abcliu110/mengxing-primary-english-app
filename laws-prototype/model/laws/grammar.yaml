- id: GR-12
  order: 12
  headline: 主谓一致有三股力在拉：形式、意义、就近——there be 听离它最近的那个名词
  headline_kid: 动词选单数还是复数，有时看长相、有时看意思、有时看谁站得近；There is/are 就看紧挨着的第一个名字
  claim:
    type: tendency
    statement: 一致关系不总由主语的形态数决定：形式一致、意义一致（集体名词按意义取复数，英式）、就近一致（there 存现句与并列主语中动词与最近名词对齐）三者是同一「对齐」问题下的不同解。
    evidence:
    - Huddleston & Pullum《CGEL》（2002）主谓一致章对一致变异的系统处理
    scope: 小学阶段只教 there be 的就近口径并注明「说话时常这样」；就近原则在正式书面语中受约束（编辑规范多要求与整个主语一致）
    exceptions:
    - text: 英式英语中集体名词可按意义用复数：The team are arguing among themselves
      word_ids:
      - G4_0989
    - text: 正式书面语的编辑规范多要求与整个主语一致，就近不适用
      word_ids:
      - G1_002
  mechanism:
  - beat: 三股力拔河
    text_kid: 动词的单复数像在拔河：一头是「看长相」，一头是「看意思」，还有一头是「看谁站得近」。不同句子里，赢的那头不一样。
    text_adult: CGEL 把一致变异处理为三原则的竞争；There is a pen and two books、The family are…等语料常见型无法用单一形式规则解释。
    visual: 三根绳子拉着一个动词，绳子分别写着：长相、意思、距离
    anchors: []
  - beat: there be 看第一个名字
    text_kid: There is/are 后面的动词，先看紧挨着的第一个名字：一个 pen 就用 is，两个 books 就用 are。
    text_adult: 存现句的动词与最近名词对齐是就近原则的教学定版口径，与 GR-32 的 or/nor 就近是同一原则的不同适用域。
    visual: 队伍最前面站着 pen（单数），动词举起 is 的牌子
    anchors:
    - G1_003
    - G1_002
    - G1_0928
  examples:
  - level: 1
    word_ids:
    - G1_003
    - G1_002
    - G1_0928
    sentence: There is a pen and two books on the desk.
    scene_note: 桌子上有笔和书：动词听第一个名字 pen
    supports: claim
  - level: 1
    word_ids:
    - G1_002
    - G1_003
    - G1_0928
    sentence: There are two books and a pen on the desk.
    scene_note: 把顺序换过来：第一个名字变成 books，动词跟着变 are
    supports: claim
  - level: 2
    word_ids:
    - G1_037
    - G2_0930
    sentence: There is an apple on the table.
    scene_note: 单个名字在前，用 is
    supports: claim
  - level: 2
    word_ids:
    - G1_014
    sentence: There are three cats under the tree.
    scene_note: 复数名字在前，用 are
    supports: claim
  error_cases:
  - wrong: "People was happy but they felt tired."
    right: "People were happy but they felt tired."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原文分析: people 用作主语、意义上为复数, 谓语动词应该使用复数形式; 学生辨认名词单复数通常只看词尾是否加了 s/es, 无法辨别集合名词 —— 意义一致这股力被词尾形式误导。〔出处：罗宇. 初中英语写作中主谓一致偏误现象的研究[J]. 职业教育发展, 2025, 14(4): 30-35. DOI: 10.12677/ve.2025.144150；定位：§5.1 第二种类型案例(p.32); 样本为重庆市万州区某中学初一 54 名学生 54 份同话题写作；学段：初一；病例号 GEC-016〕"
  - wrong: "I were very happy to the farm."
    right: "I was very happy to the farm."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 该篇文本整体为过去时态, 主语 I 的 be 过去式正确的应该是 was; 学生对过去时态运用不熟练、人称与 be 动词的对应不熟悉。corrected 仅按原文改正主谓一致一点, 原句其余部分照录。〔出处：罗宇. 初中英语写作中主谓一致偏误现象的研究[J]. 职业教育发展, 2025, 14(4): 30-35. DOI: 10.12677/ve.2025.144150；定位：§5.1 第三种类型案例(p.32); 样本为重庆市万州区某中学初一 54 名学生 54 份同话题写作；学段：初一；病例号 GEC-017〕"
  - wrong: "The population of this country are very large."
    right: "The population of this country is very large."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 不可数名词(物质和抽象名词)做主语, 谓语动词一律用单数。of 短语与『人口众多』的复数直觉把谓语拉向 are, 形式一致(中心词为单数概念)应当胜出。〔出处：刘沥沥. 初中生英语写作中的主谓一致偏误研究[J]. 职业教育发展, 2025, 14(4): 133-137. DOI: 10.12677/ve.2025.144166；定位：§3.2例句; 样本为重庆市万州区某中学初二某班 20 份作文(该节题为「不可数名词做主语」)；学段：初二；病例号 GEC-018〕"
  - wrong: "there is 3 watermelons."
    right: "There are 3 watermelons."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原句句首小写 t 为学生原文样貌, 照录。原文分析: there be 中 be 用 is 还是 are 由其后的名词决定 —— 离 be 最近的名词短语 3 watermelons 为复数, 应用 are, 是就近一致的用武之地。〔出处：刘沥沥. 初中生英语写作中的主谓一致偏误研究[J]. 职业教育发展, 2025, 14(4): 133-137. DOI: 10.12677/ve.2025.144166；定位：§3.3例句; 样本为重庆市万州区某中学初二某班 20 份作文(该节题为「存在句 there be 句型」)；学段：初二；病例号 GEC-019〕"
  - wrong: "The government pay more attention to people's health."
    right: "The government pays more attention to people's health."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 集体名词表集体(整体)用法时谓语动词一律用单数; 其根本原因在于汉语没有词的屈折形式变化, 属母语负迁移的语际错误。注: 英式英语中 government 着眼成员时用复数亦可(见 GR-39 并行标准), 本例按原文的整体义口径改正。〔出处：刘沥沥. 初中生英语写作中的主谓一致偏误研究[J]. 职业教育发展, 2025, 14(4): 133-137. DOI: 10.12677/ve.2025.144166；定位：§3.4例句; 样本为重庆市万州区某中学初二某班 20 份作文(该节题为「集体名词和专有名词做主语」, 本例为该节例 1)；学段：初二；病例号 GEC-020〕"
  - wrong: "Most of the time are wasted."
    right: "Most of the time is wasted."
    error_type: "一致三力错配"
    source_type: "真实语料错型"
    diagnosis: "原文分析: most 等数量词语的谓语单复数要视它们所修饰的名词情况决定; time 为不可数名词, 谓语应用单数 —— 一致关系看的是短语的实际所指, 而非数量词的表面气势。〔出处：刘沥沥. 初中生英语写作中的主谓一致偏误研究[J]. 职业教育发展, 2025, 14(4): 133-137. DOI: 10.12677/ve.2025.144166；定位：§3.6例句; 样本为重庆市万州区某中学初二某班 20 份作文(该节题为「不定代词和数量词语做主语」)；学段：初二；病例号 GEC-021〕"
  quiz:
  - q: There ___ a pen and two books on the desk. A. is B. are
    answer: A. is——there be 听离它最近的第一个名字 pen。
    hint: 回到机制第 2 节「there be 看第一个名字」。
  relatives:
  - id: GR-32
    rel: 同族
  - id: GR-39
    rel: 对照
  pain_points:
  - 错不完
  adult:
    sources:
    - Huddleston & Pullum《CGEL》（2002）主谓一致章——接触等级：二手系统论述级
    boundary: 就近原则在正式书面语中受约束；小学阶段只教 there be 的就近口径并注明「说话时常这样」。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
