- id: GR-06
  order: 6
  headline: 不规则过去式按「家族」住：老词靠元音换声留住老样子，高频是它们的保命符
  headline_kid: sing–sang、ring–rang 是一家人，换中间的元音变过去；用得越多的老词，越舍不得改成 -ed
  claim:
    type: tendency
    statement: 不规则过去式的主体是古英语强动词的元音交替（ablaut）家族残余，按元音变化模式成组存留；高频使用使这些形式被整体记牢、抵抗规则化。
    evidence:
    - 历史层：Jespersen《Modern English Grammar on Historical Principles》强动词交替的系统描写；保存层：Joan Bybee 用法基础形态学（频率保护不规则形），综述见 Ellis（2002）《Studies in Second Language Acquisition》24(2)
    scope: 教学时须按家族分组、杂项单记；不得宣称「不规则全是换元音」
    exceptions:
    - text: went 是补足异根（go 的过去式整个换词），不属元音交替家族
      word_ids:
      - V6_MORPH_20
    - text: brought 一类是词尾弱化型，另有来源，不属元音交替家族
  mechanism:
  - beat: 换元音的一家人
    text_kid: sing 变 sang、swim 变 swam：这一家人变过去式不加 -ed，而是换掉中间的元音。认出家人，就成串记住。
    text_adult: 强动词的元音交替是古英语的系统遗产，按变化模式成组存留；儿童与二语者的过度规则化错误反证了家族组织的心理现实性。
    visual: 一排词排队换中间字母的颜色：sing→sang、swim→swam
    anchors:
    - G6_0670
    - G6_0671
  - beat: 用得越多，越不变
    text_kid: went、sang 这些词天天被说，早就被整块记牢，谁也改不动它们；很少用的老词，才慢慢被 -ed 拉走。
    text_adult: 用法基础形态学：词例频率固化具体形式（与 GR-19 同一机制）。低频不规则词被过度规则化、高频稳固存留，是该说的经典证据。
    visual: 一棵大树（went）根扎得很深，风吹不动；小苗被风吹向 -ed
    anchors:
    - V6_MORPH_20
  examples:
  - level: 1
    word_ids:
    - G6_0670
    - G2_0669
    - G2_081
    sentence: We sang a song at school.
    scene_note: 音乐课上：sing 的一家人 sang
    supports: claim
  - level: 1
    word_ids:
    - G6_0671
    sentence: He swam in the river.
    scene_note: 游泳课：swim 的一家人 swam
    supports: claim
  - level: 2
    word_ids:
    - V6_MORPH_20
    - G2_082
    sentence: She went to the zoo.
    scene_note: 杂项单记：went 整个换词，不属换元音家族（见例外）
    supports: claim
  - level: 2
    word_ids:
    - V6_MORPH_21
    sentence: I saw a big bird.
    scene_note: 杂项：see 的过去式 saw 单记
    supports: claim
  error_cases:
  - wrong: I goed to school yesterday.
    right: I went to school yesterday.
    error_type: 过度规则化
    source_type: 教学文献登记错型
    diagnosis: 清单条目登记：儿童与二语者对低频/未固化形式作 *goed 式过度规则化，是频率保护说的经典证据；went 属杂项单记，不按家族类推。回补机制第 2 节。
  quiz:
  - q: sing 的过去式跟哪个是一家人？A. singed B. sang
    answer: B. sang——sing 属换元音家族。
    hint: 回到机制第 1 节「换元音的一家人」。
  relatives:
