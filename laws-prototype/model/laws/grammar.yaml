- id: GR-19
  order: 19
  headline: 频率在调谐大脑：见得多的先会、不规则的靠见得多才活得下来
  headline_kid: 一个词、一种说法，你遇见一百次，它就自己住进脑子里了；连 went 这种「不讲理」的词，也是因为天天见才没被改掉
  claim:
    type: rule
    statement: 基于用法的研究显示，语言加工在各层级受输入频率调谐：词例频率（token）固化具体形式，类型频率（type）催生可推广的图式，练习效果服从幂定律。
    evidence:
    - Nick C. Ellis "Frequency Effects in Language Processing"（《Studies in Second Language Acquisition》24(2)，2002，143–188，DOI 10.1017.S0272263102002024）
    scope: 频率不是唯一变量：显著性、母语 congruency、教学干预都会改写顺序；低频但高交际价值的形式仍需人为提高复现
  mechanism:
  - beat: 见得多的先住进来
    text_kid: 大脑像在给每种说法记见面次数：见一百次的，自己就住进来了，不用人背。
    text_adult: 该综述整合心理语言学、二语习得与语料库证据，是「先高频、后系统」教学排序（见 TA-17）的定量依据。
    visual: 一本见面登记簿，went 的名字后面画满了勾
    anchors:
    - V6_MORPH_20
    - V6_家庭_34
  - beat: 两种频率，两种活儿
    text_kid: 同一个词见得多（词例频率），这个词本身就记牢；同一类变化见得多（类型频率），大脑就总结出一条能套新词的规律。
    text_adult: token 频率固化形式（went 不被规则化），type 频率催生图式（-ed 规则可推广到新动词）。
    visual: 左边一棵大树（单个词记牢），右边一排小树苗（规律套新词）
    anchors:
    - G2_0489
    - POLY_WATCH
  examples:
  - level: 1
    word_ids:
    - V6_MORPH_20
    - V6_家庭_34
    sentence: I went home.
    scene_note: 词例频率现场：went 天天见，整块记牢
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: We played football.
    scene_note: 类型频率现场：-ed 见得多，能套到新动词上
    supports: claim
  - level: 2
    word_ids:
    - POLY_WATCH
    sentence: She watched TV.
    scene_note: 同一图式再复现：watched 的 -ed 不用现想
    supports: claim
  - level: 2
    word_ids:
    - V6_MORPH_21
    sentence: I saw a bird.
    scene_note: 高频不规则 saw 与 went 一样靠常见保命
    supports: claim
  error_cases: *id001
  quiz:
  - q: went 为什么没有被大家改成 goed？
    answer: 因为它出现得太多，被整块记牢了——高频就是不规则形式的保命符。
    hint: 回到机制第 1 节「见得多的先住进来」。
