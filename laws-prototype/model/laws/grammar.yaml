- id: GR-25
  order: 25
  headline: 难点可以预测：标记性与「母语没有、目标语偏有」的差值
  headline_kid: 有的语法点是出厂「标配」，有的要「额外加装」。汉语里不用加装的小零件，到了英语全要加装——这些地方最容易漏、最要多练
  claim:
    type: tendency
    statement: Eckman 的标记性差异假说（MDH，1977）：目标语中凡与母语不同、且相对母语更有标记的区域，必难，且难度与标记度差成正比；不同但不更有标记的区域，不难。汉语没有冠词系统、没有时态形态标记，这些位置正是英语对中国学习者的高难区——难点分布先验可画。
    evidence:
    - Fred R. Eckman, "Markedness and the Contrastive Analysis Hypothesis"，《Language Learning》27(2)（1977）：315–330，DOI 10.1111/j.1467-1770.1977.tb00124.x——假说三条经多篇学术综述逐字引录核实
    scope: MDH 的预测在音系与形态层最稳，在句法高层与语篇层变弱；本条只在「各标记标准一致指向」的区域（冠词、形态标记）作强预言
    exceptions:
    - text: 过度泛化等语内错误（如 *goed）不在 MDH 解释范围内（见 GR-16）
      word_ids:
      - V6_MORPH_20
    - text: 不同但不更有标记的区域，按假说 (c) 不难（如部分语序细节可正迁移或短期修正）
      word_ids:
      - G2_0492
      - G1_002
  mechanism:
  - beat: 标配和加装
    text_kid: 语法点分两种：出厂就有的「标配」，和要额外装上的「加装件」。汉语的出厂配置里没有冠词、时态尾巴这些零件，英语却每件都要装。
    text_adult: 标记性的类型学判据是蕴含关系：若有 A 必先有 B，则 A 比 B 更有标记（Eckman 1977 的原始定义）；概念源流为布拉格学派 Trubetzkoy（1939）与 Jakobson（1941），经类型学改造后由 Eckman 引入二语习得。
    visual: 两辆车并排：一辆标着「汉语配置」，少了几个零件位；一辆标着「英语配置」，零件位全装满
    anchors:
    - G1_014
  - beat: 难点先画地图
    text_kid: 不用等学生错了才知道哪儿难：把「汉语没有、英语偏有」的零件先圈出来，那就是要多练的地方。
    text_adult: MDH 把对比分析从「不同即难」修正为「不同×更有标记才难」并给出程度预言；其预测与 GR-22 登记的错误集中区（冠词居首，时态、复数、三单次之）逐项吻合：GR-22 是现象地图，本条是成因总机制。
    visual: 一张地图，「冠词」「时态」「复数」三处被红圈圈住
    anchors:
    - G2_0489
    - G1_002
  examples:
  - level: 1
    word_ids:
    - G1_014
    sentence: I see a cat. The cat is black.
    scene_note: 高难区现场：冠词 a/the 汉语里没有对应零件
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: He plays football.
    scene_note: 高难区现场：三单 -s 是汉语没有的加装件
    supports: claim
  - level: 2
    word_ids:
    - G2_0492
    - G1_002
    sentence: She reads a book.
    scene_note: 对照：语序细节与汉语相近，可正迁移，不同但不更有标记
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: I have three books.
    scene_note: 高难区现场：复数标记汉语不强制，加装易漏
    supports: claim
  error_cases: *id001
  quiz:
  - q: 汉语里没有冠词，所以冠词对中国孩子是___区。A. 高难 B. 不难
    answer: A. 高难——与母语不同且更有标记，正是 MDH 预测的难点。
    hint: 回到机制第 1 节「标配和加装」。
  relatives:
  - id: GR-22
    rel: 同族
  - id: GR-16
    rel: 对照
  - id: GR-15
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Fred R. Eckman（1977，《Language Learning》27(2): 315–330，DOI 10.1111/j.1467-1770.1977.tb00124.x）——接触等级：二手论述级（原刊页未打开；2026-11-02 引文级核实：标记性定义见 p. 320、MDH 三条见 p. 321，均经多篇学术论文逐字引录互证，与本条表述一致）；标记性源流 Trubetzkoy（1939）、Jakobson（1941）经 Eckman 1996 综述转述
    boundary: MDH 在音系与形态层最稳，句法高层与语篇层变弱；标记性度量本身有多套标准，标准冲突时预测随之含糊。难点≠错误全貌：语内错误不在其解释范围。
    disputes:
    - 标记性概念被批为「伞概念」（Battistella 对其内部不一致的系统批评为代表）；UG 阵营倾向把难点归因于参数重设而非标记度本身。MDH 与旧对比分析假说的关系是「修正而非替代」，不可简化为「越怪越难」。
    evidence_grade: 二手论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases；本条为预测机制条，病例集中在 GR-22）
