- id: GR-38
  order: 38
  headline: 标点是语法的一部分：英语的逗号扛不起两个完整句子，撇号也不是装饰
  headline_kid: 逗号太细，钩不住两节完整的车厢：两个各自能站住的句子之间只放一个逗号，叫「逗号粘连」，是正式错误；汉语能用逗号一路串下去，这个习惯别搬进英语
  claim:
    type: rule
    statement: ① 逗号粘连：两个独立分句之间只用逗号连接，在标准英语书面语中是句子边界错误；合法连接只有四种——句号分开、分号连接、逗号+并列连词、把一分句降级为从属分句。根源是句法类型差：英语是形合语言，分句关系必须明示层级；汉语是意合语言，流水句靠逗号连排合法。② 撇号二职：表所属（Tom's book）与表省略（it's = it is）；its（所属）无撇号、it's（是）有撇号；普通复数绝不加撇号。
    evidence:
    - 逗号粘连的定义与四种改法依美国大学写作中心定版材料（Fordham、Utah Valley、Waterloo 三校写作中心讲义，本轮打开互证）；形合/意合对照依连淑能《英汉对比研究》（1993）的通行定版；撇号规则为 Swan《PEU》与各参考语法共同定版
    scope: 判据以正式书面语为准；口语转写与非正式写作（短信、日记）中逗号粘连的容忍度高
  mechanism:
  - beat: 逗号钩不住车厢
    text_kid: 两个完整的句子像两节车厢：中间只挂一个逗号，钩子太细，跑起来就脱钩。要么分开（句号），要么换粗钩（分号、逗号+连词），要么把一节车厢降成挂车（从句）。
    text_adult: 错误本质是把汉语的合法句式平移进英语的标点系统：意合语言靠语义连贯连排，形合语言必须由连接词或标点明示层级——与 GR-22「汉语不标的，英语偏要标」同属一个家族，这次不标的是句界。
    visual: 两节车厢中间一根细逗号钩断开，旁边摆着四种正牌挂钩
    anchors:
    - G2_0502
    - V6_家庭_34
  - beat: 撇号的两份工作
    text_kid: 撇号有两份工作：Tom's 是「谁的」，it's 是「it is 的缩写」。分不清时展开一读：能展开成 it is 的，就是带撇号的那个。
    text_adult: its/'s 之别靠「能否展开成 it is」一测即分；普通复数加撇号（*apple's 表复数）是经典 greengrocer's apostrophe 错误，对母语者同样高频，不渲染为中国学习者独有。
    visual: 两个牌子并排：its（无撇号，所属）和 it's（有撇号，是）
    anchors:
    - G1_014
  examples:
  - level: 1
    word_ids:
    - G2_0502
    - V6_家庭_34
    sentence: It rained. I stayed home.
    scene_note: 合法连接一：句号分开
    supports: claim
  - level: 1
    word_ids:
    - G2_0502
    - V6_家庭_34
    sentence: It rained, so I stayed home.
    scene_note: 合法连接二：逗号+并列连词（与 GR-11 互挂）
    supports: claim
  - level: 2
    word_ids:
    - G1_014
    sentence: It's a cat.
    scene_note: 撇号省略职现场：It's = It is
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: This is Tom's book.
    scene_note: 撇号所属职现场（人名 Tom 为句中专名，锚词取 book）
    supports: claim
  error_cases:
  - wrong: It rained, I stayed home.
    right: It rained, so I stayed home. / It rained. I stayed home.
    error_type: 逗号粘连
    source_type: 教学定版登记错型
    diagnosis: 美国大学写作中心一致把逗号粘连列为头号句界错误；中国学习者的发生率叠加了意合迁移（连淑能形合/意合对照）。回补机制第 1 节：四种合法连接选一种。
  quiz:
  - q: 两个完整句子之间只放一个逗号，行不行？
    answer: 不行，那是逗号粘连；要用句号、分号、逗号+连词，或把一句降为从句。
    hint: 回到机制第 1 节「逗号钩不住车厢」。
  relatives:
  - id: GR-11
    rel: 同族
  - id: GR-26
    rel: 同族
  - id: GR-22
    rel: 同族
  pain_points:
  - 写不长
  - 错不完
  adult:
    sources:
    - Fordham、Utah Valley、Waterloo 三校写作中心讲义（本轮打开互证）；连淑能《英汉对比研究》（1993）；Swan《PEU》——接触等级：教学定版转述级（形合/意合一条经 2026-11-02 篇目级核实，见 pending 销项）
    boundary: ① 文学例外：短小平行分句的连排（I came, I saw, I conquered 式）是修辞手法，不判错——学生写作不适用此例外。② 口语转写与非正式写作中容忍度高，本条判据以正式书面语为准。③ 分号连接要求两分句语义密切相关。④ its/it's 对母语者同样高频混淆，不渲染为中国学习者独有。
    disputes:
    - 无实质分歧。仅定性差：部分写作手册把逗号粘连称「重罪」，语料取向的用法学家（如 Pinker 一线）指出名家写作中不乏此式——登记为教学严格度之争，学校写作口径从严。
    evidence_grade: 教学定版转述级
    pending:
    - （2026-11-02 销项）形合/意合一条已经篇目级核实：连淑能《英汉对比研究》（高教社，1993 年 3 月，ISBN 9787040044508, 221 页）目录含「形合与意合」对比专题（p. 8），该章正文经公开扫描本核读——形合（显性接应、作者负责）与意合（语义接应、读者负责）之辨与本条引用一致（与 GR-11 销项同源）
    - 误解探针待补（入模标准要求 ≥1）
