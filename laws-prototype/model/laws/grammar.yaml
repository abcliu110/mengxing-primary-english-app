- id: GR-11
  order: 11
  headline: because 和 so 各管一段路：英语一段因果通常只留一个连接点，两个都上是汉语的习惯迁移
  headline_kid: 英语说因果像只搭一座桥：要么站在 because 这头说原因，要么站在 so 那头说结果；两座桥一起搭，是把汉语的习惯带过来了
  claim:
    type: tendency
    statement: 英语从句连接以形合为常态：一个主从关系由一个从属连词标明即足。同一因果链里 because…so 并用，是汉语「因为…所以」成对关联词的意合习惯迁移到英语的冗余结构。
    evidence:
    - 连淑能《英汉对比研究》（1993，高等教育出版社；2010 增订本）形合/意合对比专题
    scope: 问题只在同一因果链里并用；because 与 so 各自单独使用均合法。口语中偶见的强调性叠用不属小学教学范围
    exceptions:
    - text: 口语中偶见的强调性叠用，不按小学阶段的错误处理
      word_ids:
      - G2_0502
      - V6_家庭_34
  mechanism:
  - beat: 只搭一座桥
    text_kid: 说因果时选一座桥过河：想先说原因，就走 because；想先说结果，就走 so。一座桥就够过河了。
    text_adult: 形合语言的常态是一个连接点标明一个主从关系；并用两个连接点不增加信息，只添冗余。
    visual: 一条河上只架一座桥，because 桥和 so 桥二选一
    anchors:
    - G2_0502
    - V6_家庭_34
  - beat: 汉语的成对习惯
    text_kid: 汉语喜欢「因为…所以…」成对出现，这是汉语自己的规矩；搬进英语，两座桥叠在一起，英语听着就别扭。
    text_adult: 连淑能形合/意合对比：中国学习者语料中 because…so 并用是稳定高频的迁移错误类型，与英汉关联词系统的结构差异精确对应。
    visual: 两座桥硬叠在一起，桥面挤得晃动，标着「汉语习惯」
    anchors: []
  examples:
  - level: 1
    word_ids:
    - V6_家庭_34
    - G2_0502
    sentence: I stayed home because it rained.
    scene_note: 下雨天：站在 because 这头说原因
    supports: claim
  - level: 1
    word_ids:
    - G2_0502
    - V6_家庭_34
    sentence: It rained, so I stayed home.
    scene_note: 同一件事：站在 so 那头说结果
    supports: claim
  - level: 2
    word_ids:
    - G2_081
    sentence: I was late because the bus was late.
    scene_note: 上学迟到：只选 because 一座桥
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: It was sunny, so we played outside.
    scene_note: 放晴出门玩：只选 so 一座桥
    supports: claim
  error_cases:
  - wrong: Because it rained, so I stayed home.
    right: I stayed home because it rained. / It rained, so I stayed home.
    error_type: 母语迁移-连接词并用
    source_type: 真实语料错型
    diagnosis: 清单条目登记：中国学习者语料中 because…so 并用是稳定高频的迁移错误类型（连淑能形合/意合对比）。回补机制第 1 节：一座桥过河。
  quiz:
  - q: 哪句对？A. Because it rained, so I stayed home. B. It rained, so I stayed home.
    answer: B——一段因果只留一个连接点。
    hint: 回到机制第 1 节「只搭一座桥」。
  relatives:
  - id: GR-26
    rel: 同族
  - id: GR-22
    rel: 同族
  - id: GR-38
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - 连淑能《英汉对比研究》（1993，高教社）——接触等级：二手系统论述级（书目经高教社官方产品页核实：1993 年 3 月，ISBN 9787040044508, 221 页；2026-11-02 篇目级核实：目录含「形合与意合」对比专题（p. 8），该章正文——形合（显性接应、作者负责）与意合（语义接应、读者负责）之辨——经公开扫描本核读，与本条引用一致）
    boundary: because 与 so 当然都能用，问题只在同一因果链里并用；口语中偶见的强调性叠用不属小学教学范围。另：旧「语法树会断」伪机制已删除，不得复活。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
