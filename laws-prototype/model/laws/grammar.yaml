    sentence: I will help you.
    scene_note: 答应帮同学：will 已经是帮手，不管「想要」了
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: I will play football tomorrow.
    scene_note: 明天的打算：will 站在动词前面当帮手
    supports: claim
  - level: 2
    word_ids:
    - G3_0442
    sentence: Will you help me?
    scene_note: 请人帮忙：will 自己站到句首提问（老动词的本事还在）
    supports: claim
  - level: 2
    word_ids:
    - G2_089
    sentence: She can swim.
    scene_note: can 不加 -s：化石残缺的一个现场
    supports: claim
  error_cases:
  - wrong: "She must did it."
    right: "She must do it."
    error_type: "情态动词后动词形式错误"
    source_type: "真实语料错型"
    diagnosis: "情态动词之后误用过去式 did: must 是没有时态屈折变化的化石形式, 后面只能跟动词原形。〔出处：Zhan, Huifang. Frequent Errors in Chinese EFL Learners' Topic-Based Writings[J]. English Language Teaching, 2015, 8(5). DOI: 10.5539/elt.v8n5p72 (ERIC EJ1075251)；定位：词类误用例 d(原文括注: must do); 语料为广西某高校英语专业二年级 177 篇话题作文；学段：大学二年级(英语专业)；病例号 GEC-012〕"
  - wrong: "Do some other things, for example, you can running or watching TV or reading books."
    right: "Do some other things, for example, you can run or watch TV or read books."
    error_type: "情态动词后动词形式错误"
    source_type: "真实语料错型"
    diagnosis: "原文将此例列为其语料中 can 的典型错误用法之一: 情态动词后误接 -ing 形式。corrected 按最小改动原则, 仅将 can 后三个动词改为原形, 其余照录。〔出处：李晓微, 庄严. 基于自建小型语料库的高二英语写作研究[C]. Proceedings of the 2016 International Symposium on Social Science (ISSS 2016), Atlantis Press, 2016；定位：§3.3.3 情态动词 can 典型错误例(1); 语料为成都某高中高二 100 份月考作文(自建小型语料库)；学段：高二；病例号 GEC-013〕"
  - wrong: "You don't could give up online games."
    right: "You couldn't give up online games."
    error_type: "情态动词叠用/与助动词连排"
    source_type: "真实语料错型"
    diagnosis: "原文以此例说明情态动词的误用: don't 与 could 连排 —— 化石情态动词不能与助动词叠床架屋, 否定应直接挂在情态动词本身上。原例第二句另有其他错误, 非本条范围, 只录第一句; corrected 为最小改动。〔出处：李晓微, 庄严. 基于自建小型语料库的高二英语写作研究[C]. Proceedings of the 2016 International Symposium on Social Science (ISSS 2016), Atlantis Press, 2016；定位：§4.1 例(1)第一句; 语料同 GEC-013；学段：高二；病例号 GEC-014〕"
  - wrong: "You can playing the basketball."
    right: "You can play basketball."
    error_type: "情态动词后动词形式错误"
    source_type: "真实语料错型"
    diagnosis: "原文行文中以此例说明 can 后动词形式误用(can + playing)。corrected 按最小改动处理情态后动词形式; 原句 the basketball 的冠词误用非本条范围, 一并顺正并在此注明。〔出处：李晓微, 庄严. 基于自建小型语料库的高二英语写作研究[C]. Proceedings of the 2016 International Symposium on Social Science (ISSS 2016), Atlantis Press, 2016；定位：§4.3 行文例; 语料同 GEC-013；学段：高二；病例号 GEC-015〕"
  quiz:
  - q: 为什么不说 will can swim？
    answer: 情态动词是停在半路的化石，彼此互斥，不能连排。
    hint: 回到机制第 2 节「化石证据：残缺」。
