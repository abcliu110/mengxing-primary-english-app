- id: GR-13
  order: 13
  headline: 所有格 's 是「关联标记」，不是「所有权证书」
  headline_kid: '''s 像一条小绳子，把两样东西拴在一起说「它们有关系」：不一定是「谁的东西」，也可以是「昨天的新闻」「一天的路」'
  claim:
    type: tendency
    statement: '''s 标记的是两个名词之间的关联关系（领有只是其中最常见的一种），它附着在整个名词短语的末尾，语义上涵盖时间、度量、来源、部分—整体等关系；其适用范围随名词的生命度与熟悉度渐变。'
    evidence:
    - Huddleston & Pullum《CGEL》（2002）属格章：'s 为短语级标记、属格表关联而非仅领有
    scope: 无生命名词的 's 在正式语体中仍常让位于 of 结构；'s 的适用范围随生命度与熟悉度渐变，非一刀切
    exceptions:
    - text: 无生命名词在正式语体中常改用 of 结构（the leg of the table 更稳妥）
      word_ids:
      - G2_0930
  mechanism:
  - beat: 小绳子拴关系
    text_kid: '''s 是一条小绳子：一头拴着人，一头拴着东西，说的是「它们俩有关系」，不是一张写着「这是我的」的所有权证书。'
    text_adult: CGEL 的分析：'s 是短语级标记（the King of England's crown 挂在整个短语末尾），语义为关联而非仅领有。
    visual: 一条绳子把「老师」和「书」拴在一起，绳结上写着「有关系」
    anchors:
    - G1_002
  - beat: 关系的种类很多
    text_kid: 「昨天的新闻」不是昨天拥有的新闻，「一天的路」也不是路属于谁——时间、度量，都是这条绳子拴的关系。
    text_adult: yesterday's news、a day's journey、the car's wheel 等高频用例均非「所有权」可释，而「关联」一解全通。
    visual: 绳子的一头分出几条小线：时间、度量、部分
    anchors:
    - V6_节日_5
    - G1_043
  examples:
  - level: 1
    word_ids:
    - G1_002
    sentence: This is Lily's book.
    scene_note: 最常见的一拴：书和 Lily 的领有关系
    supports: claim
  - level: 1
    word_ids:
    - G1_013
    - V6_家庭_34
    - G2_079
    sentence: The bird's home is in the tree.
    scene_note: 鸟和它的窝：部分—整体也是一拴
    supports: claim
  - level: 2
    word_ids:
    - V6_节日_5
    sentence: It is a day's trip.
    scene_note: 度量关系：一整天的路程，不是「天的东西」
    supports: claim
  - level: 2
    word_ids:
    - G1_043
    sentence: The car's door is open.
    scene_note: 车和它的门：部分—整体关系
    supports: claim
  error_cases: *id001
  quiz:
  - q: '"yesterday''s news" 里的 ''s 表示「昨天的所有物」吗？'
    answer: 不表示。它拴的是时间关系——'s 标记的是关联，不只是所有。
    hint: 回到机制第 2 节「关系的种类很多」。
  relatives:
