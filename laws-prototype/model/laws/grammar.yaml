- id: GR-01
  order: 1
  headline: 形式跟着功能走：语法形式是装着意义的符号，不是空壳规矩
  headline_kid: 每个小尾巴、小变化都在悄悄告诉听的人一件事，学语法就是学它们在干什么活
  claim:
    type: rule
    statement: 语法单位本身是形式—意义配对（象征单位）：一个形式之所以存在，是因为它为听话人编码了一条信息。本组 GR-02 至 GR-15 的形态事实都由这一纲领统一解释。
    evidence:
    - Ronald W. Langacker《Foundations of Cognitive Grammar》Vol.1（1987）/ Vol.2（1991），Stanford University Press；综述见 Broccias 2013《牛津构式语法手册》认知语法章
    scope: 全域纲领；任意性残余（如个别不规则词形）不在本条解释范围，靠历史与记忆（见 GR-06）
  mechanism:
  - beat: 小尾巴在说话
    text_kid: dogs 里的 -s 在说「不止一只」，played 里的 -ed 在说「已经过去了」——小尾巴不是装饰，是在传递消息。
    text_adult: 认知语法认为语法本质上是有意义的：复数、时态等标记各自编码一条信息，听话人靠它们还原说话人的意思。
    visual: 两个气泡对话框：一只狗→两只狗（-s 发亮），今天踢球→昨天踢球（-ed 发亮）
    anchors:
    - G1_015
    - G2_0489
  - beat: 遇到形式先问它干什么活
    text_kid: 以后每见到一个新变化，先别背，先问：它在告诉听的人什么事？问得出，规则就不用死记。
    text_adult: 这是本组的总方法：功能解释回答「为什么有这个形式」；解释不了的任意性残余，明确归历史与记忆，不硬编功能故事。
    visual: 一个大问号牌立在词尾上方，箭头指向听话人的耳朵
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G1_015
    sentence: Look, two dogs!
    scene_note: 教室里看图说话：从一只到两只，-s 把「不止一只」说出来
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: She played football yesterday.
    scene_note: 放学后的操场：-ed 把「已经过去」标出来
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    - G2_081
    - G2_105
    sentence: He goes to school by bus.
    scene_note: 上学路上：goes 的 -s 在说「他，天天如此」
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    - G1_029
    sentence: I have three books.
    scene_note: 书包里的书：books 的 -s 在说「不止一本」
    supports: claim
  error_cases: &id001
  - status: 待补
    note: 清单未登记该条真实错例，按不自编纪律留待补病例流程补入
  quiz:
  - q: 句子 He plays football 里，plays 的小尾巴 -s 在告诉我们什么？
    answer: 它在说：做这件事的是 he/she 这样一个人（第三人称单数），而且是现在时。
    hint: 回到机制第 1 节「小尾巴在说话」：先问这个形式在传递什么消息。
  relatives:
  - id: GR-26
    rel: 同族
  - id: GR-19
    rel: 同族
  adult:
    sources:
    - Ronald W. Langacker《Foundations of Cognitive Grammar》Vol.1（1987）/ Vol.2（1991），Stanford University Press——接触等级：二手系统论述级（经 Broccias 2013 综述核实）
    boundary: 功能解释管「为什么有这个形式」，管不了任意性残余（如个别不规则词形），那部分只能靠历史与记忆（见 GR-06）。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases）
