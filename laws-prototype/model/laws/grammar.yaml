- id: GR-05
  order: 5
  headline: 名词复数 -s 和三单 -s 不是一家人：长得像，是两条独立源流后来的巧合
  headline_kid: 两个 -s 只是长得像，其实来自不同的老祖宗，一个管「好几个」，一个管「他/她做」
  claim:
    type: etymology
    statement: 名词复数 -s 源自古英语强变化阳性名词复数词尾 -as 的推广；动词三单 -s 源自北方方言词尾；两条独立演化线在中古英语词尾磨损中偶然长成了同一个音。
    evidence:
    - 历史语法共识（Jespersen 历史语法传统）；与 GR-04 同源出处
    source: 复数 -s ← 古英语 -as；三单 -s ← 北方方言动词词尾
    scope: 现代英语里两者发音规则相同；「源流不同」只用于破除「一个 -s 包打天下」的误解，不影响拼读教学
  mechanism:
  - beat: 两条河汇到一起
    text_kid: 复数的 -s 走的是名词的河，三单的 -s 走的是动词的河；两条河本来不相干，后来水面长成了一个样子。
    text_adult: 两类 -s 在方言分布、出现年代与语音环境上均保留可区分的历史痕迹（复数有 /s z ɪz/ 三读且源于元音脱落史）。
    visual: 两条不同颜色的河从不同山头流下，最后汇成一个湖
    anchors:
    - G1_002
  - beat: 长得像，用法各管各
    text_kid: 今天两个 -s 读音规则一样，但各管各的事：名词后面的管「好几个」，动词后面的管「他/她正在做」。
    text_adult: 同形不等于同源；教学中分开教、分开记，避免用一条规则打包解释两个现象。
    visual: 两个长得一样的双胞胎，一个抱着书堆，一个拿着哨子
    anchors:
    - G2_0492
    - G1_002
  examples:
  - level: 1
    word_ids:
    - G1_002
    - G1_030
    sentence: I have two books.
    scene_note: 书包里两本书：books 的 -s 管「好几个」
    supports: claim
  - level: 1
    word_ids:
    - G2_0492
    - G1_002
    sentence: He reads books.
    scene_note: 一句话里两个 -s 都出现：reads 管「他做」，books 管「好几本」
    supports: claim
  - level: 2
    word_ids:
    - G1_037
    sentence: She eats an apple.
    scene_note: 动词 eats 的 -s 管「她做」
    supports: claim
  - level: 2
    word_ids:
