- id: GR-30
  order: 30
  headline: 关系从句先分「认人」还是「补一句」：限制性从句负责认出是哪一个，非限制性只是补充情报，逗号就是分界牌
  headline_kid: 一种是「在一群人里指出是哪一个」，一种是「已经知道是谁，再多说一句他的事」——指人的紧贴着不打逗号，补一句的要用逗号隔开
  claim:
    type: rule
    statement: 关系从句的系统由三组选择构成：(1) 功能——限制性从句把所指缩小到唯一可认（删掉就不知道说的是哪个），非限制性从句只追加信息（删掉所指不变，书写上必须用逗号隔开）；(2) 关系词——that 只能进限制性从句，which 两类都可，指人用 who（正式宾格 whom），whose 表所属且人和物都可用、不能被 that 替代；(3) 零关系词——仅限限制性从句中关系词作宾语时可省，作主语、非限制性、介词前置时均不可省。
    evidence:
    - Huddleston & Pullum《CGEL》（2002）第 12 章相对从句的定版区分（限制性/非限制性、关系词系统、零关系化仅限限制性非主语位置），经 "English relative clauses" 词条的系统转述核实
    scope: 小学呈现以「认人 vs 补一句」的二分与逗号纪律为主干，关系词全表与零关系词细则按顺序后置
  mechanism:
  - beat: 先分活儿：认人还是补一句
    text_kid: 给名词挂小句子前，先问它干哪种活：帮听话人认出「是哪一个」，还是已经认出来了、再补一句他的事。
    text_adult: 功能选择决定后面的一切：逗号打不打、that 能不能用、关系词能不能省，全跟着功能走。
    visual: 一台照相机对准人群：一个人的脸被框住（认人），另一个人旁边浮出一个小气泡（补一句）
    anchors:
    - G3_134
    - G1_007
  - beat: 逗号是分界牌
    text_kid: 补一句的那种，必须用逗号把小句子隔开；指人的那种紧贴着名词，中间什么都不放。逗号漏了，补的话就会被听成认人的话。
    text_adult: 非限制性从句的逗号是义务性的：漏逗号是本条最高频的书写错误。that 的禁区、whose 的不可替代、零关系词的三个禁区（主语位、非限制性、介词前置）都是形式档案细则。
    visual: 两个名词短语并排：一个逗号牌插在补句型中间，认人型的牌子写着「不许插」
    anchors:
    - G1_043
    - G1_034
    - G1_002
    - G2_0492
  examples:
  - level: 1
    word_ids:
    - G3_134
    - G1_007
    - G4_0415
    sentence: The man who came yesterday is my teacher.
    scene_note: 认人型：没有这句，就不知道是哪个男人
    supports: claim
  - level: 1
    word_ids:
    - G1_043
    - G1_034
    sentence: My car, which is red, is new.
    scene_note: 补句型：车已认明，补一句颜色，逗号隔开、不用 that
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    - G2_0492
    sentence: The book I read is good.
    scene_note: 零关系词：read 的宾语位置，that 可以省
    supports: claim
  - level: 2
    word_ids:
    - G3_134
    sentence: The man who called is my uncle.
    scene_note: 不可省现场：who 作主语，删不得
    supports: claim
  error_cases:
  - wrong: My car, that is red, is new.
    right: My car, which is red, is new.
    error_type: 关系词误用-that 进非限制性
    source_type: 条目成人层登记的事故例
    diagnosis: 清单机制栏明示：that 只能进限制性从句，「*My car, that is red… 不成立」。回补机制第 1 节：先看它是补一句的活儿。
  quiz:
  - q: 「补一句」的那种从句，能用 that 开头吗？
    answer: 不能。非限制性从句不用 that，要用 who/which，还要用逗号隔开。
    hint: 回到机制第 1 节「先分活儿：认人还是补一句」。
  relatives:
  - id: GR-45
    rel: 同族
  - id: GR-34
    rel: 同族
  pain_points:
  - 错不完
  - 写不长
  adult:
    sources:
    - Huddleston & Pullum《CGEL》（2002）第 12 章（经词条系统转述）——接触等级：二手系统论述级（词条原文已打开核对，CGEL 原书未打开）；介词后置辟谣出处：Wikipedia "Preposition stranding" 与 "Common English usage misconceptions" 两词条原文（引 Dryden 1672、Lowth 1762 原文引文与 Fowler 语）
    boundary: ① 方言例外：某些口语变体有主语接触从句（There's a man wants to see you 型），属非标准口语，不进教学正例。② whom 在日常口语中大幅退让，但在介词前置的正式书面语里（to whom）仍是唯一选择。③ whose 指物现代参考语法一致接受。④ 非限制性从句的逗号是义务性的。
    disputes:
    - 限制性 which 之争：美式文体手册（Chicago Manual 一线）主张限制性一律 that；CGEL 与英式用法认为限制性 which 是标准英语的历史常态——登记为「编辑处方 vs 描写事实」之争，教学口径：考试写作跟目标考试规范，理解上两者都认。
    - CGEL 把关系 that 分析为从属标记（subordinator）而非代词，与传统「关系代词」说不同——只影响术语。
    - 连带辟谣登记：「介词永远不能放句尾」是伪规则——介词后置自古英语以来即为自然用法；Lowth（1762）只说前置「更优雅」，绝对禁令是后世教科书对 Lowth 的硬化转述，Fowler 称其为「关于介词最顽固的迷思之一」。
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
