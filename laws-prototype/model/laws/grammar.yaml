  group: GR
  prereq: []
  probes: []
  status: 入模中
  version: '1.0'
  changelog:
  - date: '2026-11-01'
    change: 清单 v6 散文入模（数据补齐总攻·波次 C1）
    basis: 专家清单 v6 GR 组原文
- id: GR-37
  order: 37
  headline: 程度词各就各位：so 管形容词，such 管名词短语，too 自带「过头」的否定后果，enough 在形容词后、名词前
  headline_kid: so 后面跟光秃秃的形容词，such 后面跟「形容词+东西」；too 不是「非常」，是「过头了，所以不行」；enough 修饰形容词站在后面，修饰名词站在前面
  claim:
    type: rule
    statement: 程度构式群按所修饰的中心分工：① so + 形容词/副词（结果从句 so…that…）；② such + （a/an) + 形容词 + 名词，such 是前限定词，冠词必须放在 such 之后；③ 冠词互动特殊式：so + 形容词 + a + 单数可数名词（so good a day），仅限单数可数名词，as/how/too 同族同式；④ too + 形容词/副词 + to 不定式，语义自带「超标→负面后果」，与 very 的纯加强有本质区别（only too glad 等固定式除外）；⑤ enough 作副词修饰形容词/副词时后置，作限定词修饰名词时前置。
    evidence:
    - 分工框架依 Swan《Practical English Usage》so/such、too、enough 诸条的定版（经 Linguapress 程度副词专章与 Cambridge CAE/CPE 高级语法「as/how/so/too + 形容词 + a/an + 名词」条的原文转述互证）
    scope: so good a day 偏正式语体，日常口语多用 such a good day，不可反过来说前者错误；so 修饰名词/动词的口语新用法（so yesterday 等）是语体注记，不进小学正例
  mechanism:
  - beat: so 和 such 分工
    text_kid: so 是个只管形容词的：so hot，后面什么都不跟。such 是管一整串的：such a hot day，形容词和东西一起打包，冠词站在 such 后面。
    text_adult: such/so 的分工是「限定词位置竞争」的实例：such 占前限定词槽，so 迫使冠词后移（so good a day)，与 C 组冠词槽位机制互挂。
    visual: 两个篮子：so 的篮子里只放形容词，such 的篮子里放「冠词+形容词+名词」一整串
    anchors:
    - G2_098
    - V6_节日_5
  - beat: too 带刹车，enough 换站位
    text_kid: too hot 不是「非常热」，是「热过头，喝不了」——too 自带坏后果。enough 是个换站位的：tall enough 站在形容词后，enough money 站在名词前。
    text_adult: too 的语义档案是「超标→负面后果」，后接 to 不定式把后果说出来；enough 的双站位由其词性（副词后置/限定词前置）决定，*enough old 不成立。
    visual: 一个温度计冲过红线（too）；enough 在形容词和名词两边各站一次
    anchors:
    - G2_073
    - V6_数字_57
    - G4_K03
  examples:
  - level: 1
    word_ids:
    - G2_098
    sentence: It is so hot today.
    scene_note: so 现场：只跟形容词
    supports: claim
  - level: 1
    word_ids:
    - G2_098
    - V6_节日_5
    sentence: It is such a hot day.
    scene_note: such 现场：冠词在 such 后面，一整串打包
    supports: claim
  - level: 2
    word_ids:
    - G2_073
    - V6_数字_57
    sentence: He is tall enough to reach it.
    scene_note: enough 后置：站在形容词后面
    supports: claim
  - level: 2
    word_ids:
    - V6_数字_57
    - G4_K03
    sentence: I have enough money.
    scene_note: enough 前置：站在名词前面
    supports: claim
  error_cases:
  - wrong: She is enough old to ride a bike.
    right: She is old enough to ride a bike.
    error_type: enough 站位错
    source_type: 条目成人层登记的事故例
    diagnosis: 清单支撑栏登记的中国学习者高频错误四类之一：*enough old（另有 *a such、*so a good day、把 too 当 very 用），均属站位与语义档案错误。回补机制第 2 节。
  quiz:
  - q: 「tall enough」还是「enough tall」？
    answer: tall enough——enough 修饰形容词时站在后面。
    hint: 回到机制第 2 节「too 带刹车，enough 换站位」。
  relatives:
  - id: GR-31
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - Swan《PEU》so/such、too、enough 诸条；Linguapress 程度副词专章；Cambridge CAE/CPE 高级语法条——接触等级：二手系统论述级
    boundary: ① so good a day 偏正式语体，不可判错。② too 的「非常」义只限 only too 等一小撮固定搭配，不可推广（*too delicious 表「非常好吃」仍是中式英语高频误用）。③ so 的口语新用法不进小学正例。④ enough + 名词后置式（money enough）是古旧/文学式。
    disputes:
    - 无实质分歧。so good a day 的存续状态有语体判断差（部分手册标「罕见」，语料显示在正式书面语中稳定存在），登记为语体评估差。
    evidence_grade: 二手系统论述级
