- id: GR-14
  order: 14
  headline: 代词的格跟着位置走：主语位用主格、宾语位用宾格，「讲究过头」也会错
  headline_kid: I 和 me 是同一个人穿的两件衣裳：站在句子开头当主角穿 I，跟在动词和介词后面穿 me；穿错或「太讲究」穿错，都是错
  claim:
    type: rule
    statement: 英语代词格是位置性标记——格由成分在句中的句法位置决定而非语义角色：主语位用主格，动词与介词后的宾语位用宾格。between you and I 这类错误是把礼貌/正式感误加到宾语位上的过度矫正。
    evidence:
    - Huddleston & Pullum《CGEL》（2002）代词格变异章（对 and I 过度矫正有专门讨论）
    scope: 口语中 It's me 等主格/宾格松动是真实变异，小学阶段教位置口径即可，不把口语变异判为「错误」展示
  mechanism:
  - beat: 位置决定穿哪件
    text_kid: 代词站在哪儿，就穿哪件衣裳：站到句子前面当主角，穿主格；跟在动词、介词后面，穿宾格。跟它「是谁」没关系，跟它「站哪儿」有关系。
    text_adult: 格由句法位置决定：主语位与宾语位的分工是位置性的，这解释了为何母语者也会在并列宾语里犹豫。
    visual: 一个小人走到句子开头的舞台中央，换上 I 的衣服；走下台到介词后面，换上 me 的衣服
    anchors: []
  - beat: 讲究过头也会错
    text_kid: 有人觉得 me 不够体面，在 between you and ___ 里也塞一个 I——体面塞错了位置，反而成了错。
    text_adult: 母语者语料中 between you and I 的稳定出现证明：格的驱动力是位置+语体直觉，过度矫正是把正式感误加到宾语位。
    visual: 一件过大的礼服套在小小的宾语位上，标着「太讲究」
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G3_130
    sentence: He and I are friends.
    scene_note: 主语位并列：两个人都穿主格（另有「you 先人后」的礼貌顺序与之配套）
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_8
    - G1_002
    sentence: She gave the book to him.
    scene_note: 介词 to 后面：him 穿宾格
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_2
    sentence: Come with me, please.
    scene_note: 介词 with 后面：me 穿宾格
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: They play with us.
    scene_note: 动词短语后面：us 穿宾格
    supports: claim
  error_cases:
  - wrong: between you and I
    right: between you and me
    error_type: 过度矫正-格
    source_type: 真实语料错型
    diagnosis: 清单条目登记：母语者语料中 between you and I 稳定出现，是把礼貌/正式感误加到宾语位的过度矫正。回补机制第 1 节：格跟着位置走。
  quiz:
  - q: between you and ___ A. I B. me
    answer: B. me——介词后面是宾语位，穿宾格。
    hint: 回到机制第 1 节「位置决定穿哪件」。
  relatives: []
  pain_points:
  - 错不完
  adult:
    sources:
    - Huddleston & Pullum《CGEL》（2002）代词格变异章——接触等级：二手系统论述级；本项目已裁定口径「格跟着位置走」
    boundary: 口语中 It's me 等松动是真实变异，小学阶段教位置口径即可，不把口语变异判为「错误」展示。
    disputes: []
    evidence_grade: 二手系统论述级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
