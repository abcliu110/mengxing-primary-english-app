- id: GR-27
  order: 27
  headline: 语法是概率，不是开关：梯度观与概率语法
  headline_kid: 很多英语说法不是「对或错」的开关，是「顺不顺耳」的滑杆：两种说法都对，但母语者平时多半说其中一种
  claim:
    type: tendency
    statement: 语法规律在很大一片区域里是概率倾向而非二值开关：合法变体之间的选择可被多因素概率模型高精度预测（Bresnan 对与格交替的预测达 94%）；范畴成员资格与可接受性判断也是连续梯度（Aarts）。概率层只覆盖「多变体共存」与「边缘成员」区域，硬性范畴区域不在此列。
    evidence:
    - 'Joan Bresnan, "Is syntactic knowledge probabilistic?"（2007，pp.77–96）及 Bresnan, Cueni, Nikitina & Baayen, "Predicting the dative alternation"（2007，pp.69–94）——94% 预测率经 Bresnan 本人会议摘要原文核实；Bresnan & Hay, 《Lingua》118(2)（2008）：245–259（全文已打开）；Bas Aarts, 《Studies in Language》28(1)（2004）；Aarts 等编《Fuzzy Grammar: A Reader》（2004，OUP）'
    scope: 小学段仍先教范畴与默认项，梯度观是教师与高阶学习者的校准器；不可把本条读成「没有对错」
    exceptions:
    - text: 语序骨架、一致标记的有无等大片语法是硬性的，没有梯度（如主谓一致标记不可半标）
      word_ids:
      - G2_0489
    - text: 可接受性判断的梯度部分来自加工难度等表现因素，不能全数记到语法表征头上
      word_ids:
      - G1_002
  mechanism:
  - beat: 滑杆，不是开关
    text_kid: give him the book 和 give the book to him 都对。母语者选哪个，不靠对错，靠「平时多半这么说」——像调音量，滑杆停在哪儿有规律可循。
    text_adult: 概率性选择受动词义类、代词性、定指性、生命性、成分长短、话语可及性等多因素联合加权；模型概率与母语者的自然度评分对应，说明概率结构是说话人知识的一部分。
    visual: 一根滑杆，左边 give him the book，右边 give the book to him，滑块停在常听的那侧
    anchors:
    - V6_日常_8
    - G1_002
  - beat: 两种梯度别混
    text_kid: 一种是「选哪个说法」的概率，一种是「算不算这一类」的程度：utter 只能站在名词前面，是「半个」形容词——成员资格也有深浅。
    text_adult: Aarts 区分子类梯度（类内典型性不一）与交叉梯度（横跨两类边界）；与 GR-19 的关系：GR-19 讲这种概率知识如何被频率习得，本条讲习得完成的语法本身即概率与梯度的（表征主张）。
    visual: 一排形容词站在深浅不一的水里，水最深的在中间
    anchors: []
  examples:
  - level: 1
    word_ids:
    - V6_日常_8
    - G1_002
    sentence: I gave him the book.
    scene_note: 合法变体一：给字句的双宾式
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_8
    - G1_002
    sentence: I gave the book to him.
