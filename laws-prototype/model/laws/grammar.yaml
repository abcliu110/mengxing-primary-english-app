    error_type: "复数主语误配三单 -s"
    source_type: "真实语料错型"
    diagnosis: "原文分析: 主语为复数形式, 谓语却用第三人称单数; 研究者课后询问学生, 得到回复是『错误地将第三人称单数和名词复数作了混淆』—— 两个 -s 在学生心里被当成了一家人, 正是本条要拆开的混淆。〔出处：罗宇. 初中英语写作中主谓一致偏误现象的研究[J]. 职业教育发展, 2025, 14(4): 30-35. DOI: 10.12677/ve.2025.144150；定位：§5.1 第一种类型案例(p.32); 样本为重庆市万州区某中学初一 54 名学生 54 份同话题写作；学段：初一；病例号 GEC-008〕"
  - wrong: "They cooks delicious food for us as dinner."
    right: "They cook delicious food for us as dinner."
    error_type: "复数主语误配三单 -s"
    source_type: "真实语料错型"
