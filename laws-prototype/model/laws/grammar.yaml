- id: GR-07
  order: 7
  headline: 情态动词说的是「力」：must 是一股推力，may 是搬走障碍，can 是自己有劲儿
  headline_kid: must 像有人在后面推你「必须去」，may 像门卫把路障搬开「可以啦」，can 是你自己有力气「我能行」
  claim:
    type: rule
    statement: 情态动词的核心语义是一套力图式（Talmy 力动态）：must 是外力压向主体（义务），may 是障碍缺席（许可），can 是主体内在潜能（能力）；推断义（认识情态）是同一套力图式经隐喻搬进推理领域——前提「迫使」人得出结论。
    evidence:
    - Eve Sweetser《From Etymology to Pragmatics》（1990，Cambridge University Press）第 3 章（must 强迫力 p.52、may 障碍移除 p.51、can 正向潜能 p.53、认识情态扩展 p.64）
    scope: 力图式是语义骨架，不覆盖礼貌、委婉等语用用法（如 Could you...? 的客气不是「能力」在直译）
  mechanism:
  - beat: 三种力
    text_kid: must：有人在后面推着你走；may：门卫把路障搬开，路通了；can：你自己的肌肉有力气。先认力，再认词。
    text_adult: Sweetser 以力动态统一根情态语义：义务=外力、许可=障碍移除、能力=内在潜能。儿童习得中根义先于认识义出现，与「具体力图式→抽象推理」的映射方向吻合。
    visual: 三格漫画：被推着走的孩子、被搬开的路障、举起胳膊秀肌肉的孩子
    anchors:
    - G2_089
  - beat: 力搬进脑子里
    text_kid: 猜事情的时候也是这股力在推：He must be tired——不是有人推他，是证据推着我下结论。
    text_adult: 认识情态是根情态图式的隐喻扩展：前提对结论的「迫使」对应物理世界的外力。
    visual: 同一个推力箭头，从操场搬进一个大脑形状的框里
    anchors:
    - G2_0502
  examples:
  - level: 1
    word_ids:
    - G2_089
    sentence: I can swim.
    scene_note: 游泳课：can 是自己有劲儿
    supports: claim
  - level: 1
    word_ids:
    - V6_日常_2
    sentence: May I come in?
    scene_note: 进教室前敲门：may 是路障搬开、被允许
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    - V6_家庭_34
    sentence: You must go home now.
    scene_note: 放学时老师说话：must 是规矩在推
    supports: claim
  - level: 2
    word_ids:
    - G2_0502
    sentence: It may rain today.
    scene_note: 看天色猜天气：力搬进推理里（见机制第 2 节）
    supports: claim
  error_cases: *id001
  quiz:
  - q: May I come in? 里的 may 像哪幅画？A. 有人在后面推 B. 路障被搬开
    answer: B——may 是障碍移除，是许可。
    hint: 回到机制第 1 节「三种力」。
  relatives:
  - id: GR-36
    rel: 同族
  - id: GR-08
    rel: 同族
