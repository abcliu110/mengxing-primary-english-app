    sentence: Can I have some water, please?
    scene_note: 整块存取的请求句
    supports: claim
  - level: 2
    word_ids:
    - G1_052
    sentence: Can I have some milk, please?
    scene_note: 拆件现场：同一个框架，只换 drinks 格子里的词
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: Can I have that book, please?
    scene_note: 再换一件：框架不变，表达能力开始长
    supports: claim
  error_cases:
  - wrong: "As the development of the society, there are more and more aged people."
    right: "With the development of the society, there are more and more aged people."
    error_type: "语块整存整取内部错位"
    source_type: "真实语料错型"
    diagnosis: "汉语语块『随着社会的发展』被整块调用: 框架完整无缺, 只有框架首词被 As 顶替了 With。整存整取、内部不拆解 —— 语块先住进来、语法后来拆的典型样貌; 错不在规则运用, 而在整块提取时首词错位。〔出处：Zhan, Huifang. Frequent Errors in Chinese EFL Learners' Topic-Based Writings[J]. English Language Teaching, 2015, 8(5). DOI: 10.5539/elt.v8n5p72 (ERIC EJ1075251)；定位：§3.3 例 j(原文括注: With); 语料为广西某高校英语专业二年级 177 篇话题作文；学段：大学二年级(英语专业)；病例号 GEC-022〕"
  quiz:
  - q: 小朋友先会整句 "What's this?"，还是先会造这句的语法规则？
    answer: 先会整句——语块整存先行，语法是后来从里面拆出来的。
