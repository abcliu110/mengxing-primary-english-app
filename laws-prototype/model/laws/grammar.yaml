- id: GR-17
  order: 17
  headline: 注意到，才学得会：形式被「看见」的那一刻才开始变成自己的
  headline_kid: 光是天天听英语还不够；哪天你突然「咦，这里有个 -s！」——这个形式才开始真正进你的脑子
  claim:
    type: tendency
    statement: Schmidt 的注意假说（弱式）：输入须被有意识地注意到才转化为摄入；学习者在输出中发觉自己说法与目标说法之间的「差距」是关键触发事件；注意越深，习得越多。
    evidence:
    - Richard Schmidt "The Role of Consciousness in Second Language Learning"（《Applied Linguistics》11(2)，1990，129–158，DOI 10.1093/applin/11.2.129）；「注意差距」源于 Schmidt & Frota（1986）日记研究
    scope: 低龄儿童的注意多由教师设计（对比、高亮、复现）代为触发，不能等同于成人式自觉分析；本条以弱式（注意越深、习得越多）为准
    exceptions:
    - text: 强式主张（注意是唯一通道）不成立：Schmidt 2001 年已将强式修正为弱式；未被有意识注意的形式在大量接触中也可能被部分吸收
      word_ids:
      - G2_0489
  mechanism:
  - beat: 看见的那一刻
    text_kid: 同一个 -s，听过一百遍没感觉；哪天突然「咦，这里有个 -s」，它才开始进脑子。学习从「看见」那一刻起步。
    text_adult: Schmidt 本人学葡萄牙语的日记记录显示：未被注意到的形式在大量输入后仍未习得，被注意的形式随后进入产出。
    visual: 一排 plays 飞过，只有一只被聚光灯照亮，头上冒出「咦？」
    anchors:
    - G2_0489
  - beat: 差距是最好的老师
    text_kid: 自己说一遍，再听正确的说法一遍——两边不一样的地方，就是下一次要注意的地方。
    text_adult: 「注意差距」（noticing the gap）是输出与输入对照时触发的事件，与 GR-23 输出假说互挂。
    visual: 两句话并排，差别处被红圈圈出
    anchors:
    - G2_0502
    - G2_0489
  examples:
  - level: 1
    word_ids:
    - G2_0489
    sentence: He plays football. She plays football too.
    scene_note: 注意目标：两句里都有的 -s，先看见再说出
    supports: claim
  - level: 1
    word_ids:
    - G2_0502
    sentence: It rains a lot in summer.
    scene_note: 注意目标：it 后面的 rains 也戴 -s
    supports: claim
  - level: 2
    word_ids:
    - V6_日常_1
    sentence: He goes to school by bus.
    scene_note: 注意目标：goes 的拼法变化也是被「看见」的对象
    supports: claim
  - level: 2
    word_ids:
    - POLY_WATCH
    sentence: She watches TV at home.
    scene_note: 注意目标：watches 的 -es 与前两例对照
    supports: claim
  error_cases: *id001
  quiz:
  - q: 只是天天听英语，为什么三单 -s 还是学不会？
    answer: 因为没有注意到它——没被「看见」的形式，不会变成自己的。
    hint: 回到机制第 1 节「看见的那一刻」。
  relatives:
  - id: GR-16
    rel: 前置
  - id: GR-18
    rel: 同族
  - id: GR-19
    rel: 同族
  - id: GR-23
    rel: 同族
  adult:
    sources:
    - Schmidt（1990，《Applied Linguistics》11(2)，DOI 10.1093/applin/11.2.129）；Schmidt & Frota（1986）——接触等级：期刊原文级（DOI 已核）
    boundary: 注意是必要条件的强版本仍有争议；本条取 Schmidt 2001 年修正后的弱式。低龄儿童的注意多由教师设计代为触发。
    disputes:
    - Krashen 的输入假说主张无意识习得充分，与注意假说相对；登记分歧在案，教学取向以弱式注意假说为准。
    evidence_grade: 期刊原文级（弱式口径）
    pending:
    - 误解探针待补（入模标准要求 ≥1）
    - 真实错例待补（见 error_cases）
