- id: GR-08
  order: 8
  headline: 情态动词是语法化的化石：它们曾经是普通动词，所以没有三单 -s、不能连排
  headline_kid: will 以前就是「想要」这个动词，它慢慢变成了小帮手，老动词的习惯就留了下来：不加 -s，也不能两个帮手排排坐
  claim:
    type: etymology
    statement: 情态动词曾是普通实义动词，在语法化途中逐步丢失动词性（形态变化、论元结构）变成助动词；will 由「意愿」义沿「意愿 → 意图 → 将来」路径漂移。形态上的残缺（无三单 -s、无不定式、互斥不能连排）正是它停在半路的化石证据。
    evidence:
    - Joan Bybee, Revere Perkins & William Pagliuca《The Evolution of Grammar》（1994，University of Chicago Press）将来标记来源路径；框架见 Hopper & Traugott《Grammaticalization》（2003 第 2 版）语法化斜坡
    source: 实义动词语法化为助动词的斜坡路径（意愿 → 意图 → 将来）
    scope: 语法化是强统计倾向而非铁律；讲给孩子时说「大多数时候」
  mechanism:
  - beat: 动词慢慢变成帮手
    text_kid: will 原来是个正经动词，意思是「想要」。几百年里它越用越虚，慢慢只剩下帮手的活儿。
    text_adult: 语法化斜坡：实义动词沿可预测路径丢失形态与论元结构；跨语言反复出现同一演化路径（意愿/义务/移动动词变将来标记）。
    visual: 一个动词的影子逐格变淡，最后变成半透明的帮手
    anchors:
    - G3_0442
  - beat: 化石证据：残缺
    text_kid: 帮手们有个共同点：不加三单 -s、不能两个排排坐（不说 will can）、也没有 to 形式——这些「缺块」就是它们半路停下的证据。
    text_adult: 情态词的形态残缺与其在语法化斜坡上的位置一一对应。
    visual: 一排帮手站队，每个人身上都贴着「缺」的小标签：无 -s、无 to、不能连排
    anchors: []
  examples:
  - level: 1
    word_ids:
