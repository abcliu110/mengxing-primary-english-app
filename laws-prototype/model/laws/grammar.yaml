- id: GR-28
  order: 28
  headline: 不规则复数不住单间，住家族宿舍：零复数、变音、-en、外来复数，各是一小家
  headline_kid: 大部分词变复数加 -s，但有几个小家族不走大路：认出它是哪家人，就知道它的复数怎么变
  claim:
    type: rule
    statement: 不规则复数是古英语与外来借词留下的若干封闭小类：①零复数（sheep、deer、fish 等单复数同形）；②元音变音——全英语只剩七个名词（man、woman、foot、tooth、goose、mouse、louse）及其复合词；③-en 家族（ox/oxen，及双重标记化石 children、brethren）；④-f 浊化小家族（knife/knives 等，成员资格不齐，半规则）；⑤外来复数（拉丁 -us→-i、-um→-a，希腊 -is→-es、-on→-a，双形并立按语域分工）；⑥只有复数（scissors、trousers 等，计数靠 a pair of）。家族全是封闭类，只收老成员，新词一律走 -s。
    evidence:
    - 分类骨架为英语参考语法与大学形态学课程的通行处理（零复数、变音七词、-en 三词、外来复数的语域分工、pluralia tantum 五分法），经多份大学课程材料与语法综述交叉印证；变音七词与 -en 三词的口径经 v5 回写三处独立来源（LSGSWE 第 4 章教学单元、形态学讲义、Huddleston & Pullum 学生版讲义）清单一致互证
    scope: 计数约定：变音七词不计 titmouse/dormouse 等复合词与古体 kine（否则旧式语法书作九词）；-en 实用成员仅 oxen/children（brethren 仅宗教/社团语域）；教学时家族名单以高频成员为限
  mechanism:
  - beat: 六个小宿舍
    text_kid: 不规则复数不住单间，住六个小宿舍：不变样的、换元音的、用 -en 的、-f 变声的、外国来的、只有复数的。进门先认宿舍。
    text_adult: 与 GR-06（不规则过去式家族）完全同构：封闭小类靠高频保命（GR-19），新词不再入住。儿童与二语者的错误形态（家族外误用 -s 与家族内过度类推并存）证明学习者大脑同样按类组织这些形式。
    visual: 一栋宿舍楼，六个房间各挂一块牌子
    anchors:
    - G4_194
    - G3_0668
  - beat: 外国宿舍的双门牌
    text_kid: cactus 的复数 cacti 和 cactuses 都在词典里：学术场合多用外国式，日常多用 -s 式——不是谁错，是场合分工。
    text_adult: 词典对外来复数双形的并列著录是语域分工说的一手证据；data 在通用语域日益作不可数单数处理，与学术语域的复数处理并存。
    visual: 一扇门上挂两块门牌：一块写着 cacti（学术），一块写着 cactuses（日常）
    anchors: []
  examples:
  - level: 1
    word_ids:
    - G4_194
    sentence: Two sheep are eating grass.
    scene_note: 零复数宿舍：一只两只一个样
    supports: claim
  - level: 1
    word_ids:
    - G3_0659
    sentence: Wash your feet, please.
    scene_note: 变音宿舍：foot→feet（feet 在词库为变形条目）
    supports: claim
  - level: 2
    word_ids:
    - G3_0668
    sentence: The children are playing.
    scene_note: -en 宿舍：children 是双重标记的化石
    supports: claim
  - level: 2
    word_ids:
    - G5_0664
    sentence: I see two mice.
    scene_note: 变音宿舍：mouse→mice（mice 在词库为变形条目）
    supports: claim
  error_cases:
  - wrong: There are three childs in the park.
    right: There are three children in the park.
    error_type: 家族外误用规则
    source_type: 教学文献登记错型
    diagnosis: 清单条目登记：儿童与二语者的错误形态正是「家族外误用 -s」（*sheeps、*childs、*foots）与「家族内过度类推」并存。回补机制第 1 节：先认宿舍。
  quiz:
  - q: foot 的复数是哪家宿舍的？A. 零复数 B. 变音
    answer: B——foot→feet 是元音变音家族（七词之一）。
    hint: 回到机制第 1 节「六个小宿舍」。
  relatives:
  - id: GR-06
    rel: 同族
  - id: GR-19
    rel: 同族
  - id: GR-29
    rel: 同族
  pain_points:
  - 记不住
  - 错不完
  adult:
    sources:
    - 参考语法与形态学教学传统通行分类；v5 回写销项：LSGSWE 第 4 章教学单元、形态学讲义、Huddleston & Pullum 学生版讲义三处互证——接触等级：二手系统论述级
    boundary: 家族全是封闭类，名单有限、可穷尽，这正是它可教的原因。变动带如实说：fish 指种类时可 fishes；data 的单复数地位仍在变动；hoof、scarf 等 -f 家族成员两可。
    disputes:
    - 外来复数的「归化尺度」是用法指南界的长年争议：严格派主张学术写作必须用外来式，描写派（主流词典立场）登记双形与语域分工即止——清单取描写派口径。连带辟谣：octopus 源自希腊语，通行复数是 octopuses，octopi 是误套拉丁规则的产物。
    evidence_grade: 二手系统论述级
