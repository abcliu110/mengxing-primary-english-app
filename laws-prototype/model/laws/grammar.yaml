- id: GR-29
  order: 29
  headline: 英语的屈折只剩八个词尾：一张小卡片装下全部「变形负担」
  headline_kid: 英语词要「变身」的地方全部加起来只有八个小尾巴：一张卡片就写完了——英语把力气都花在词的顺序上，不花在词尾上
  claim:
    type: rule
    statement: 现代英语的屈折只剩八个功能位（Yule 2010 通行盘点）：名词——复数 -s、所有格 -'s；动词——三单 -s、过去式 -ed、过去分词 -en、现在分词 -ing；形容词——比较级 -er、最高级 -est；且八个全是后缀。这是分析语化（GR-26）在形态层的点名清单。
    evidence:
    - George Yule《The Study of Language》（Cambridge University Press，第 4 版 2010，pp.69–70）明文 "English has only eight inflectional morphemes"；Fromkin et al.《An Introduction to Language》的八项清单逐项一致（经学术期刊引文核对）
    scope: 「八个」按功能位计数：过去分词位以 -en（eaten）为代表形，绝大多数动词该位用 -ed（finished）——同一功能、两种形状；若按形状合并计算则为七个，引用时须声明口径。八个只数屈折，不含派生词缀（派生词缀见 V-20）
  mechanism:
  - beat: 一张卡片点名
    text_kid: 把英语全部词尾请到一张卡片上点名：复数、所有格、三单、过去、完了形、进行、比较、最高——正好八个，一个不多。
    text_adult: 跨语言对照即支撑：俄语、德语保留数十个屈折词尾，英语的八个在类型学上属极简端；语法负载随之转移到语序、助动词与介词。
    visual: 一张小卡片，八个词尾排成两列打勾点名
    anchors:
    - G1_014
    - G2_0489
  - beat: 少而必标
    text_kid: 词尾虽少，却个个必标：中国孩子漏的，恰好就是这八个里的几个——三单 -s、过去 -ed、复数 -s，漏一个就露馅。
    text_adult: 中国学习者的屈折错误集中在这八个中的几个（见 GR-22）——「少而必标」正是迁移难点所在，反证这八个是英语形态教学的完整靶心。
    visual: 卡片上三个词尾被红圈圈住：三单、过去、复数
    anchors:
    - G2_0489
    - G2_068
  examples:
  - level: 1
    word_ids:
    - G1_014
    - G2_0489
    sentence: Two cats are playing.
    scene_note: 一张句子里点到两个：复数 -s、进行 -ing
    supports: claim
  - level: 1
    word_ids:
    - G2_0489
    sentence: She played football yesterday.
    scene_note: 过去式 -ed 在岗
    supports: claim
  - level: 2
    word_ids:
    - G6_0576
    - V6_MORPH_65
    sentence: This box is bigger. That one is the biggest.
    scene_note: 比较级 -er、最高级 -est 在岗
    supports: claim
  - level: 2
    word_ids:
    - G1_002
    sentence: The dog's book is here.
    scene_note: 所有格 's 在岗（演示用：小狗的图画书）
    supports: claim
  error_cases:
  - wrong: He play football.
    right: He plays football.
    error_type: 屈折遗漏-三单
    source_type: 教学文献登记错型
    diagnosis: 清单条目登记：中国学习者的屈折错误恰集中在这八个中的几个（三单 -s、过去式 -ed、复数 -s 的遗漏，见 GR-22）。回补机制第 2 节「少而必标」。
  quiz:
  - q: 英语的屈折词尾一共有几个功能位？
    answer: 八个：名词两个、动词四个、形容词两个。
    hint: 回到机制第 1 节「一张卡片点名」。
  relatives:
  - id: GR-26
    rel: 前置
  - id: GR-04
    rel: 同族
  - id: GR-05
    rel: 同族
  - id: GR-13
    rel: 同族
  pain_points:
  - 错不完
  adult:
    sources:
    - George Yule《The Study of Language》第 4 版（2010，CUP，pp.69–70）；Fromkin et al.《An Introduction to Language》——接触等级：章节预览级（Yule 原书形态学章 pp.67–70 经原文转载核对；Fromkin 为二手引文印证）
    boundary: 计数口径必须标注（功能位 vs 形状，见 claim 范围）；八个只数屈折，不含派生词缀。
    disputes:
    - 所有格 's 的身份有真分歧：传统语法（Yule 清单）作名词屈折词尾；Huddleston & Pullum《CGEL》分析其附着于整个名词短语末端，性质更接近附着成分。分歧不影响「功能位共八个」的盘点结论，影响的是教成「词的变形」还是「短语的挂签」（与 GR-13 接续）。
    evidence_grade: 章节预览级
    pending:
    - 误解探针待补（入模标准要求 ≥1）
