- id: GR-16
  order: 16
  headline: 错误是学习者心里的「临时系统」在试单，不是粗心也不是坏习惯
  headline_kid: 说错话常常说明大脑正在自己试一条新规则——试错的样子，就是正在学习的证据
  claim:
    type: rule
    statement: Corder 区分系统性错误（error，反映学习者当前的过渡能力）与偶发失误（mistake）；Selinker 的中介语理论指出，学习者语言是自成体系、不断重组的系统，错误是假设检验留下的可见痕迹。
    evidence:
    - S. Pit Corder "The Significance of Learners' Errors"（1967，IRAL）；Larry Selinker "Interlanguage"（1972，IRAL 10）——二语习得研究的两篇奠基文献
    scope: 中介语视角解释错误来源，不等于放任错误：Selinker 本人提出石化风险，错误需被注意到并处理（见 GR-17）
  mechanism:
  - beat: 错误是试单的回执
    text_kid: 孩子说出一个错句，常常是大脑拿自己试出来的规则在「下单试用」：试对了留下来，试错了换一条。回执上的错，写着他现在学到哪儿了。
    text_adult: '*goed、*sheeps 等过度泛化错误在不同母语背景儿童身上同型出现，证明其来源是系统内部规则而非个体粗心。'
    visual: 一张试订单，上面盖着「系统试用中」的印章
    anchors:
    - V6_MORPH_20
    - G4_194
  - beat: 错误和失误要分开
    text_kid: 每次都这样错，是系统在试单（error）；偶尔一次说秃噜嘴、自己能改回来，是失误（mistake）。两种的处理方法不一样。
    text_adult: Corder 的 error/mistake 之分是错误分析的起点；中介语系统会不断重组，也可能停在某处石化。
    visual: 两条岔路：一块路牌写着「系统试单」，一块写着「偶尔失误」
    anchors: []
  examples:
  - level: 1
    word_ids:
    - V6_MORPH_20
    sentence: I went to the park yesterday.
    scene_note: 试单成功后的定版形式：went 被整块记住
    supports: claim
  - level: 1
    word_ids:
    - G4_194
    sentence: The sheep are eating grass.
    scene_note: sheep 的单复数同形被系统接纳后的正确产出
    supports: claim
  - level: 2
    word_ids:
    - V6_MORPH_21
    sentence: I saw a film yesterday.
    scene_note: 不规则形式进入系统后的稳定产出
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: He plays football every day.
    scene_note: 三单规则进入系统后的产出
    supports: claim
  error_cases:
  - wrong: I see two sheeps.
    right: I see two sheep.
    error_type: 过度规则化
    source_type: 教学文献登记错型
    diagnosis: 清单条目登记：*sheeps、*goed 等过度泛化错误在不同母语背景儿童身上同型出现，是中介语系统按自有规则试单的痕迹。回补机制第 1 节。
  quiz:
  - q: 孩子说 *goed，说明什么？A. 他粗心 B. 他在用自己试出来的规则
    answer: B——这是他的临时系统在试单，是正在学习的证据，不是粗心。
    hint: 回到机制第 1 节「错误是试单的回执」。
