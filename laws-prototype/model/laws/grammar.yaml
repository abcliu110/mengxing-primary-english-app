- id: GR-41
  order: 41
  headline: 过去的习惯有三兄弟，分工不能串：used to 管今昔对照，would 只回放动作碰不得状态，be used to 是另一个词组
  headline_kid: used to 的眼睛一半看着过去、一半看着现在（重点在「变了」）；would 只能放「动作录像」，放不了「状态照片」；be used to 是另一个词组，说的是「我已经习惯了」
  claim:
    type: rule
    statement: 三式按「时间指向 × 动词类型 × 结构」三维分工：① used to + 原形——过去的习惯或状态，自带「今昔对照、今已不再」的强默认蕴含，动词类型不限，可独立成句，否定疑问借 did（didn't use to）；② would + 原形——过去重复动作的叙事回放，三条硬限：不接状态动词、不能领起话题（须先用 used to 或过去时场景立住时间框架）、不用于否定与疑问表习惯；③ be/get used to + 名词/-ing——与过去无关，表「已习惯/正变习惯」，其中 to 是介词（used to 的 to 是不定式标记，这是混淆的机关）。另：used to 无现在时对应物。
    evidence:
    - 三维分工依 Lingolia 英语语法（used to 条：would 只表习惯不表状态、须有时间标记铺垫、否定疑问不用 would、used to 全形式可用——本轮打开核对）与 Swan 系教学定版互证；状态动词清单（be、have、live、know、like、own…）为参考语法通行表
    scope: used to 的「今已不再」是可被语境取消的强默认蕴含而非逻辑必然，教学口径按「对照已变」教
  mechanism:
  - beat: 三兄弟分工表
    text_kid: 三兄弟长得像，活儿完全不同：used to 管「以前怎样、现在变了」；would 管「讲故事时一段段回放动作」；be used to 管「我已经习惯了」。先认人，再派活。
    text_adult: 混淆源可定位：used to 与 be used to 字面仅差一个 be，且汉语「习惯」一词同时覆盖「过去常常」与「已经习惯」，学习者按字面拼装是可预测的结构陷阱（与 GR-36 的档案型错误同科）。
    visual: 三兄弟并排站，每人胸前挂一块分工牌
    anchors:
    - G3_0653
    - G5_0368
  - beat: would 的三条硬限
    text_kid: would 放录像有三条规矩：只放动作不放状态（不能说 would live、would have a cat）；不能自己开头（先有时间框架才接得上）；否定和疑问里不用它表习惯。
    text_adult: have 在 would 后会被读成条件句，正是状态禁令的现场证据；时间框架先行是叙事回放的结构要求。
    visual: 一台放映机，说明书上三条红线：动作、接续、不否定疑问
    anchors:
    - G2_100
    - G6_270
    - V6_家庭_12
  examples:
  - level: 1
    word_ids:
    - G3_0653
    - G5_0368
    sentence: I used to live in the country.
    scene_note: used to 管状态：以前住在乡下（现在不住）
    supports: claim
  - level: 1
    word_ids:
    - G2_100
    - G6_270
    - V6_家庭_12
    sentence: Every summer we would visit grandma.
    scene_note: would 回放：先有 every summer 立框架，再放动作录像
    supports: claim
  - level: 2
    word_ids:
    - G5_K02
    sentence: I am used to getting up early.
    scene_note: be used to：与过去无关，说的是「已经习惯」，to 后跟 -ing
    supports: claim
  - level: 2
    word_ids:
    - G2_0489
    sentence: I used to play football every day.
    scene_note: used to 管习惯动作：今昔对照在句外（现在不踢了）
    supports: claim
  error_cases:
  - wrong: I am used to get up early.
    right: I am used to getting up early.
    error_type: used to 结构混淆
    source_type: 教学文献登记错型
    diagnosis: 清单支撑栏登记：used to 与 be used to 字面仅差一个 be，汉语「习惯」一词双覆盖，学习者按字面拼装（*I am used to get up early 式 be 与原形的误配）是可预测的正字法-结构双重陷阱。回补机制第 1 节：be used to 的 to 是介词，后跟 -ing。
  quiz:
  - q: 「以前住在乡下」（状态）能用 would live 吗？
    answer: 不能——would 只回放动作，状态只能用 used to。
    hint: 回到机制第 2 节「would 的三条硬限」。
  relatives:
  - id: GR-40
    rel: 同族
