- id: GR-23
  order: 23
  headline: 输出把「听懂」逼成「会用」：说不出来，才知道自己哪里没真会
  headline_kid: 光听懂像看别人游泳；自己开口说，才发现哪个动作还不会——说，就是检查自己最好的办法
  claim:
    type: tendency
    statement: Swain 的输出假说：可理解输入不充分；被推动进行准确产出（pushed output）时，学习者被迫从语义加工切换到句法加工，从而注意差距、检验假设并进行元语言反思。
    evidence:
    - Merrill Swain（1985，载 Gass & Madden 编《Input in Second Language Acquisition》，Newbury House，pp.235–253）——证据来自加拿大法语沉浸学生「理解近母语、产出语法长期不准」；中国本土对应理论：文秋芳输出驱动假设（2008）与产出导向法 POA（2015，《外语教学与研究》）
    scope: POA 原案针对中高级学习者（英语专业/大学英语）：用于小学必须降阶为短句产出与情境表演，不得照搬其评价体系；输出须有输入促成配套，硬逼开口无效
    exceptions:
    - text: 无输入配套的硬逼开口无效：输出必须与输入促成配套使用
      word_ids:
      - G3_0625
  mechanism:
  - beat: 下水才知道
    text_kid: 看别人游泳看一百遍，自己第一次下水，还是会呛。开口说英语也一样：一说，才知道哪个形式自己其实不会。
    text_adult: 沉浸项目数十年的追踪数据构成对「输入充分论」最有力的反例群：理解可达近母语，产出语法长期不准。
    visual: 岸上看游泳的孩子跳进水里，水花里冒出几个问号
    anchors:
    - G4_0415
  - beat: 说，逼着脑子换挡
    text_kid: 听的时候，脑子猜个大概就能懂；说的时候，每个词尾都要自己做出来——脑子被逼着从「猜意思」换到「拼形式」。
    text_adult: pushed output 的三功能：注意差距、检验假设、元语言反思；与 GR-17 的注意差距互挂。
    visual: 一个齿轮从「听」的位置咔哒一声换到「说」的位置
    anchors:
    - G2_0489
    - G3_130
  examples:
  - level: 1
    word_ids:
    - G4_0415
    sentence: What did you do yesterday?
    scene_note: 产出任务一：被问到昨天，必须自己组装过去式
    supports: claim
  - level: 1
    word_ids:
    - V6_MORPH_20
    - G2_0489
    - G3_130
    sentence: I went to the park. I played with my friends.
    scene_note: 产出样本：讲述里 went、played 都要自己做出来
    supports: claim
  - level: 2
    word_ids:
    - V6_家庭_34
    sentence: I went home and did my homework.
    scene_note: 产出任务二：放学后的一天，用短句讲完
    supports: claim
  - level: 2
    word_ids:
    - G2_082
    sentence: I saw a tiger at the zoo.
    scene_note: 产出样本：动物园之行，saw 要自己选出来
    supports: claim
  error_cases: *id001
  quiz:
  - q: 为什么光听懂还不够，非要开口说？
    answer: 因为产出逼着大脑做句法加工：说不出来的地方，正是没真会的地方。
    hint: 回到机制第 2 节「说，逼着脑子换挡」。
  relatives:
  - id: GR-17
    rel: 同族
  - id: GR-18
    rel: 同族
  pain_points:
