    - 这条路通到山顶 ↔ The road goes to the hilltop.
    source: P-16 成人层
  adult:
    mechanism: 虚构运动源于注意沿路径的心理扫描；语言在实动与虚动之间共用同一套路径图式，眼动与阅读实验显示虚构运动句的加工伴随沿路径的注意移动。
