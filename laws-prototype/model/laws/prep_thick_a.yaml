meta:
  title: 介词加厚卷宗 · 甲组（先行全家福 14 词，方法四条骨架重写）
  date: '2026-11-01'
  words:
  - in
  - 'on'
  - at
  - over
  - above
  - under
  - up
  - for
  - to
  - below
  - along
  - across
  - into
  - 'off'
  method: P-01（原型图 + 亲戚网，语用强化为引申引擎）/ P-02（四条证据定中心）/ P-10（教图 + 长法，猜一猜为其练习形态）/ P-17（空间 → 时间 → 抽象展开序）
  basis: 义项链节点序以现卷宗（prepositions-prototype-v1.html 内嵌 DATA）为基线不推翻，只加厚；加厚材料出自 prep_derivation_map.md 与 prep_source_map.md；无专著材料的节点 extension 一律标「组装：按通用机制衔接，非专著引证」；断链与不可推导点只登记不编桥（施工纪律 1–5）。
  fields: core 核心图式 / verdict 中心裁决 / chain 义项链（每节点含 extension 引申理据）/ growth 成长序 / guess 猜一猜 / cn_cut 中英错位 / adult 成人层（机制 + 边界 + 接触等级）
words:
- word: in
  meaning: 在……里面
  family: true
  core:
    kid: in 的老家是一张「装进里面」的图：东西被一个有边的地方围住、包起来——装进口袋、杯子，人进屋子，都是这张图。
    scene_sentence: The cat is in the box.
    scene_note: 纸箱与猫——最典型的容器场景（基线卷宗）
  verdict:
    type: 专著裁决（三家同指）
    center: 被包容在有界空间里（容器图式），且原型自带功能面：容器对内容物施加庇护、限制、浸泡式影响。
    evidence:
    - Tyler & Evans（P-03）：in 的中心场景即容纳，功能面是原型的一部分，不是后加的比喻。
    - Herskovits（PB-08）理想意义同指「包含于有界空间内」（p.149–150 一带）——同一事实的单义账本，与网络账本结论一致。
    - 图式心理意象实验（Language and Cognition）支撑容器图式的心理真实性。
    sources:
    - P-03
    - PB-08
    note: 三家独立同指，本词中心无并存分歧登记。
  chain:
  - law: P-03
    sense: 装进里面（容器图式）
    stage: 空间
    headline: in 就是「进到里面」：在盒子里、在房间里、在队伍里——被围起来，就是 in。
    examples:
    - s: The cat is in the box.
      note: 纸箱与猫——最典型的容器场景
    - s: The dog is in the room.
      note: 房间是装人和物的容器
    - s: The students are in the team.
      note: 队伍作为集合容器
    - s: The water is in the cup.
      note: 液体被杯子装住并受其形状影响
    extension:
      text: 这一站不用「长」，它就是老家本身：东西装进一个有边的地方。连「队伍」这种看不见边的人堆，也被看成一个容器——边可以是画出来的，也可以是心里认定的。
      mechanism: 原型场景（中心节点）
      basis: 专著引证
      source: P-03
  - law: P-08
    sense: 看功能：装好、托好
    stage: 空间
    headline: 碗的工作是「装」，桌子的工作是「托」——东西有没有被装好、被托好，比它在哪儿更重要。
    examples:
    - s: The apple is in the bowl.
      note: 苹果在碗中——碗的盛装功能
    - s: The bananas are in the bowl.
      note: 香蕉装碗
    extension:
      text: 核心图动了一步：不只看「围没围住」，还看这个地方的「工作」。碗的工作就是装——苹果装在碗里，哪怕没冒尖，也算装好了，所以还是 in。图式没换，只是把「它是干什么用的」算了进来。
      mechanism: 功能知识介入（功能面）
      basis: 专著引证
      source: P-08 / PB-10
  - law: P-11
    sense: 汉语的刀口不一样（对照站）
    stage: 空间
    headline: 中文和英语像两把不同的尺子，量同一个地方，刻度画的位置不一样。用错介词常常不是忘了，是拿错了尺子。
    examples:
    - s: The bird is in the tree.
      note: 鸟在枝叶之间用 in——与苹果对照，汉语不切这一刀
    - s: I read it in the newspaper.
      note: 「在报纸上」归 in——汉语「上」横跨三家的一例（详见 PB-12）
    extension:
      text: 这一站不是新意思，是同一张图被汉语切成了另一副样子：汉语靠后面的「里、上」分工，英语靠 in、on、at 三张图分工。鸟被枝叶包住 → 还是容器图 → in；报纸的内容被看成装在纸面之内 → 还是容器图 → in。
      mechanism: 切分对照（非引申站：同一图式的母语切法差异）
      basis: 专著引证
      source: P-11 / PB-12
  - law: P-12
    sense: 先定找谁（图形—背景）
    stage: 空间
    headline: 说东西在哪儿，先想好「在找谁」：找的东西站前面，大背景站后面，介词是把它们连起来的钉子。
    examples:
    - s: The cat is in the box.
      note: 找猫——猫做图形，纸箱做背景
    - s: The ball is in the grass.
      note: 草地做背景，球做图形
    extension:
      text: 图还是那张容器图，动的是「先看谁」：要找的小东西站前面当主角，又大又稳的容器站后面当背景。in 连的就是这两位——这一步决定一句话里谁先谁后。
      mechanism: 视角选择（图形—背景分工）
      basis: 专著引证
      source: P-12（Talmy 图形—背景）
  - law: P-09
    sense: 泡在一段时间里
    stage: 时间
    headline: 讲时间的时候借用讲地方的图：一阵子是「泡在里面」（in），一天是「贴在日历上」（on），一个时刻是「一个点」（at）。
    examples:
    - s: We play in the morning.
      note: 上午——泡在时段里
    - s: We swim in summer.
      note: 夏天——更长的时段容器
    extension:
      text: 空间图整张借给时间：一段时间被看成一个容器，人「泡」在里面做事。图式内部的逻辑原样搬过去，所以靠的不是时长长短——morning 不到一天也用 in，因为它是「泡在里面」，不是「够不够长」。
      mechanism: 时间借用（空间图式映射到时间域）
      basis: 专著引证
      source: P-09 / CG-05
  - law: P-03
    sense: 泡在看不见的状态里
    stage: 抽象
    headline: 麻烦和爱情看不见摸不着，可人陷在里面出不来——就像泡在水里，所以也用 in。（加厚补入：基线链未单列此站，引申路径出自 P-03 功能面分析）
    examples:
    - s: The boy is in trouble.
      note: 陷在麻烦里——状态容器
    - s: She is in love.
      note: 泡在爱里——功能面的浸泡感
    extension:
      text: 功能面再往前一步：容器从「装东西」长成「装状态」。麻烦、爱情没有边，可人陷在里面、受它影响、一下子出不来——和东西泡在水里受水影响是同一张图，所以 in trouble、in love 不另立新词，还是老家的图。
      mechanism: 功能面抽象化（容器 → 状态）
      basis: 专著引证
      source: P-03 功能面 / 引申施工图 in ②
  growth:
    stages:
    - stage: 空间
      nodes:
      - 装进里面（容器图式）
      - 看功能：装好、托好
      - 汉语的刀口不一样（对照站）
      - 先定找谁（图形—背景）
    - stage: 时间
      nodes:
      - 泡在一段时间里
    - stage: 抽象
      nodes:
      - 泡在看不见的状态里
    note: 按 P-17 展开序：先地方、再时间、最后抽象。in 在 Dirven 意义链上是全域词——话题、方式、情境、原因各域都有席位（PB-13），小学阶段只展开到状态义，其余各域按频率逐个补。
  guess:
  - usage: in the photo
    sentence: The dog is in the photo.
    type: 远端引申（图式可猜）
    source: P-03 定性「画面即容器，点明即可」；引申施工图 in ③
    path: 先猜：照片又扁又平，怎么用 in？揭晓：照片被看成一个有边的小世界，画面里的东西就像装在这个小世界里面——容器图没变，只是容器换成了画面。
  - usage: in the newspaper
    sentence: I read it in the newspaper.
    type: 竞争用法（汉语错位）
    source: PB-12 刀口错位图；引申施工图 in ③
    path: 先猜：汉语说「在报纸上」，为什么不用 on？揭晓：英语看的是内容——内容被看成装在纸面之内的东西，归容器图管，所以用 in。这是汉语「上」横跨三家里 in 的那一把。
  cn_cut:
  - point: 同一个「在树上」再切一刀：苹果是树的一部分（长在树上）→ on；鸟位于枝叶之间（被包住）→ in。汉语不切这一刀，是错位高发区。
    examples:
    - The apples are on the tree.
    - The bird is in the tree.
    source: PB-12
  - point: 汉语「上」横跨英语三家：在报纸上 → in（内容在纸面之内）；在电视上 → on； 在会上 → at。本词承接其中的 in 一支。
    examples:
    - I read it in the newspaper.
    source: PB-12 / P-11
  - point: 汉语把「紧贴」放在动词里（塞进、套上），中国孩子对「紧」有现成注意；但英语选 in/on 时不看松紧，看的是图式——选词时要学会不看这一维。
    examples: []
    source: PB-12（原理出处 Bowerman & Choi 2001）
  adult:
    mechanism: 引申引擎为语用强化（P-01）：场景中反复出现的附带含义沉淀为独立义项；in 的网络另有功能面这一维——容器对内容物的庇护、限制与浸泡式影响，是其抽象义（状态域）的直接来源。Dirven 意义链（PB-13）中 in 与 at、on 同为全域词。
    boundary: 容纳的边界可由功能划定而非物理围合（in the street 英式指街道区域内）；网络是分析模型，教学只取原型图 + 一级引申，远端义按频率逐个补；真实病例与误解探针仍为待补（全域登记）。
    contact: Tyler & Evans (2003)：专著系统论述级；Herskovits (1986)：目录+书评+引述级；Bowerman & Choi (2001)、Dirven (1993)：二手系统论述级。
- word: 'on'
  meaning: 在……上面（有接触）
  family: true
  core:
    kid: on 的老家是一张「贴在面上」的图：东西挨着一个面，靠这个面托着、挂着、套着——挨着，还被撑住。
    scene_sentence: The book is on the desk.
    scene_note: 书桌——水平面承托（基线卷宗）
  verdict:
    type: 专著裁决 + 切分之争（双基本义并存）+ 断链登记
    center: 贴在一个面上、并被这个面撑住（接触 + 支撑双要素；支撑不必自下而上：墙面附着、手指环绕同样算）。
    evidence:
    - Tyler & Evans（P-04）：中心场景为接触 + 支撑；PB-08 Herskovits 理想意义（p.140）大体同文。
    - PB-02 可描绘性样板：招牌图「圆团被线从下方托住」即以 on 为例——核心义须能画出来，on1 过关。
    sources:
    - P-04
    - PB-08
    - PB-02
    dispute: 切分之争（PB-03，Lindstromberg）：on 应拆成两个并列基本义——on1「接触承托」与 on2「继续、向前」（go on、Read on）。目录明令：不得把「on 只有一个原型场景」写成定论。
    broken_chain: 断链登记：on2「继续」无法从贴面图式经语用强化推出——「接着往前」与「贴在面上」之间没有可指认的经验桥梁。本卷宗不编桥：on2 单独登记为第二个基本义，小学阶段在短语动词单元整块出现即可。Tyler & Evans 一侧的处理不同：把「继续」义放在小品词/体貌引申一侧（P-15），不立第二个基本义——两说并存登记，不裁定。
    note: VB-10 从小品词侧另给 on 一张身份证：基本义是「保持在视野内的水平持续」，故 on 表持续而非结果——与 on2 的存在互为旁证（成人层登记）。
  chain:
  - law: P-04
    sense: 贴在面上（接触 + 承托）
    stage: 空间
    headline: on 就是「贴在表面上」：东西挨着一个面，靠这个面托着、挂着、套着。
    examples:
    - s: The book is on the desk.
      note: 书桌——水平面承托
    - s: The picture is on the wall.
      note: 挂画——垂直面附着（中国孩子高发错位点，见 PB-12）
    - s: The ring is on her finger.
      note: 戒指套手指——环绕式承托
    - s: The cat is on the table.
      note: 猫在桌面上——面承托活物
    extension:
      text: 这一站是老家：挨着一个面，还被这个面撑住。撑住不一定从下往上——画挂在墙上是贴着，戒指套在手指上是环绕着，都算被「面」承托。
      mechanism: 原型场景（中心节点）
      basis: 专著引证
      source: P-04
  - law: P-08
    sense: 看功能：托好
    stage: 空间
    headline: 碗的工作是「装」，桌子的工作是「托」——东西有没有被装好、被托好，比它在哪儿更重要。
    examples:
    - s: The cup is on the table.
      note: 桌面托杯——承托功能
    - s: The books are on the table.
      note: 多本书在桌面
    extension:
      text: 核心图动了一步，和 in 的功能站正好对照：桌子的工作是「托」。杯子放在桌上是 on，因为桌子在托它；换个东西不起托的作用，说法就会变。
      mechanism: 功能知识介入（功能面）
      basis: 专著引证
      source: P-08 / PB-10
  - law: P-11
    sense: 汉语的刀口不一样（对照站）
    stage: 空间
    headline: 中文和英语像两把不同的尺子，量同一个地方，刻度画的位置不一样。用错介词常常不是忘了，是拿错了尺子。
    examples:
    - s: The picture is on the wall.
      note: 汉语「在墙上」的「上」在此归 on——切分对照点
    - s: The apples are on the tree.
      note: 苹果长在树上（树的一部分）用 on
    extension:
      text: 不是新意思，是切法不同：汉语「在墙上、在树上」的「上」，到了英语要看贴的是哪种面——画贴墙面、苹果连在枝头，都是贴面图 → on（苹果的对照面是鸟的 in，见 in 卷宗）。
      mechanism: 切分对照（非引申站）
      basis: 专著引证
      source: P-11 / PB-12
  - law: P-12
    sense: 先定找谁（图形—背景）
    stage: 空间
    headline: 说东西在哪儿，先想好「在找谁」：找的东西站前面，大背景站后面，介词是把它们连起来的钉子。
    examples:
    - s: The cup is on the table.
      note: 找杯子——杯子做图形
    extension:
      text: 图没变，变的是站位：要找的杯子站前面，又大又稳的桌面站后面当背景。on 连的就是「贴在面上」这两位。
      mechanism: 视角选择（图形—背景分工）
      basis: 专著引证
      source: P-12
  - law: P-04
    sense: 被交通工具载着走
    stage: 空间
    headline: 坐公交车、火车用 on：你被车厢的地板和座位托着、载着走。（加厚补入：基线链未单列此站，出自 P-04 个案一级引申）
    examples:
    - s: The students are on the bus.
      note: 在公交车上——被承载
    - s: We are on the train.
      note: 在火车上——同一张承载图
    extension:
      text: 贴面图动了一步：面不只是贴着，还「载着你走」。公交车、火车的地板托着你、带着你移动——「被承载」是贴面承托的一级引申。小汽车太小、像个盒子把人装进去，所以 on the bus 却 in the car（见猜一猜跨词条）。
      mechanism: 语用强化（贴面 → 承载）
      basis: 专著引证
      source: P-04 个案 / 引申施工图 on ②
  - law: P-09
    sense: 贴在日历上的一天
    stage: 时间
    headline: 讲时间的时候借用讲地方的图：一阵子是「泡在里面」（in），一天是「贴在日历上」（on），一个时刻是「一个点」（at）。
    examples:
    - s: We have English on Monday.
      note: 星期一——日历上的一格
    extension:
      text: 贴面图借给时间：一「天」被看成日历上的一个面，事情贴在这张面上发生。具体到某天的上午，面跟着就近的那一天走——on Monday morning，面是 Monday 那一格。
      mechanism: 时间借用（面 → 日历格）
      basis: 专著引证
      source: P-09
  growth:
    stages:
    - stage: 空间
      nodes:
      - 贴在面上（接触 + 承托）
      - 看功能：托好
      - 汉语的刀口不一样（对照站）
      - 先定找谁（图形—背景）
      - 被交通工具载着走
    - stage: 时间
      nodes:
      - 贴在日历上的一天
    - stage: 抽象
      nodes: []
    note: 按 P-17 展开序。on 的抽象席位在 Dirven 链上有名（on holiday 状态、an expert on history 话题、on foot 方式，PB-13），本卷宗以猜一猜形式先行呈现两个，正式节点按频率后补；on2「继续」不在此序内——它是断链登记的第二个基本义（见裁决栏）。
  guess:
  - usage: on foot
    sentence: We go to school on foot.
    type: 约定习语（揭晓即拆伪因果）
    source: FR09 裁定；引申施工图 on ③（三源同登）
    path: 先猜：走路时脚贴着地面，是不是因为「贴面」才用 on？揭晓：这条桥是编不得的——on foot 是固定习语，本项目已裁定不许用「脚踩地面接触」当因果。它和 on horseback 成对出现，整块记住即可。这一题就是专门练「猜不到也要登记」的。
  - usage: on holiday
    sentence: They are on holiday.
    type: 远端引申（图式可猜）
    source: PB-13 Dirven 意义链（状态域具名例）；引申施工图 on ③
    path: 先猜：放假不在「面上」，为什么用 on？揭晓：Dirven 的意义链里 on 在「状态」域有席位——人像贴在一个叫「假期」的状态面上。图离老家已经远了，能挂上链，就算猜中大半。
  cn_cut:
  - point: 汉语「上」横跨三家里 on 的一支：在电视上 → on（节目贴在屏幕面上呈现）；在墙上 → on（贴面）。
    examples:
    - We study on TV.
    - The picture is on the wall.
    source: PB-12
  - point: 同一个「在树上」：苹果（树的一部分）→ on，鸟（枝叶之间）→ in。汉语一把伞，英语再切一刀。
    examples:
    - The apples are on the tree.
    - The bird is in the tree.
    source: PB-12
  - point: 交通工具的身体图：能站起来走动的大车厢（bus/train/plane）用 on（被承载），坐进小空间（car/taxi）用 in——汉语都说「在车上」，英语按身体感觉再分。
    examples:
    - on the bus
    - in the car
    source: 引申施工图跨词候选（spacetime 登记）/ P-04 承载义
  adult:
    mechanism: 主链引擎为语用强化；切分问题上 Lindstromberg 以可描绘性（PB-02）为判据立双基本义，Tyler & Evans 以单一原型 + 网络回应——这是介词词义学的真实断层线，本卷宗并存登记。Herskovits（PB-09）另有「只表接触不表承托」的使用类型登记（如部分附着场景），属约定转移清单，不改中心裁决。
    boundary: on 的「面」可退化为线或点（on the corner 与 at 竞争，英美有别）；on foot 是固定习语，FR09 已裁定不得编「脚踩地面接触」的伪因果，与本条机制严格区分；小学阶段只教 on1。
    contact: Tyler & Evans (2003)：专著系统论述级；Lindstromberg (2010)：目录+书评+作者自述级（双基本义的具体论述未读原书正文）；Herskovits (1986)：目录+书评+引述级。
- word: at
  meaning: 在（小地点）/（具体几点钟）
  family: true
  core:
    kid: at 的老家是一张「点」的图：不管地方多大、时间多长，在心里把它压成一个没有大小的小点点——at 看的就是那个点。
    scene_sentence: The student is at the station.
    scene_note: 车站作为位置点（基线卷宗）
  verdict:
    type: 专著裁决
    center: 点化：把地方、时刻、目标在心里压成没有大小的点，只保留它在参照系中的坐标位置。
    evidence:
    - Tyler & Evans（P-05）：at 的中心操作是点化，统摄地点、时刻、目标（及价格，见链中回填站）。
    - Herskovits（PB-08，p.128）理想意义「射体与被当作点的界标重合」——目录注：P-05 的点识解与此相通但未溯此源，两说同指、并存登记。
    - 强证据形态：at 与 in/on 的对立在地点、时间两域平行复现（at the station / in the city；at 5 / in June）——跨域复现是图式说的强证据。
    sources:
    - P-05
    - PB-08
    note: 点化是「看作」点，不是「是」点：同一座城市可以点化（at）也可以容器化（in the city），随说法切换。
  chain:
  - law: P-05
    sense: 地点压成一个点
    stage: 空间
    headline: at 是把东西看成地图上的一个小点点：地方再大，在 at 眼里也只是一个点。
    examples:
    - s: The student is at the station.
      note: 车站作为位置点
    - s: We are at home.
      note: 家被点化为所在位置
    - s: The teacher is at the door.
      note: 门口是一个位置点
    - s: The bus is at the station.
      note: 车辆到站——点位到达
    extension:
      text: 这一站是老家：车站那么大，在地图上也只是一个点。说 at 的时候，心里主动把大小、形状统统扔掉，只留「在哪一个位置」。
      mechanism: 原型场景（点化操作）
      basis: 专著引证
      source: P-05
  - law: P-09
    sense: 时刻是时间轴上的点
    stage: 时间
    headline: 讲时间的时候借用讲地方的图：一阵子是「泡在里面」（in），一天是「贴在日历上」（on），一个时刻是「一个点」（at）。
    examples:
    - s: The bus comes at five.
      note: 五点——时刻点
    extension:
      text: 点化图借给时间：一个时刻就是时间轴上的一个点，没有长短，只有位置。注意别上当——有人说「时间短才用 at」，可 at night 的 night 是一整夜：夜被点化成日程表上的一个点，靠的是点化，不是时长（at night 的完整登记见猜一猜）。
      mechanism: 时间借用（点 → 时刻）
      basis: 专著引证
      source: P-09
  - law: P-05
    sense: 价格标在一个点上
    stage: 抽象
    headline: 价钱也被压成一个点：东西「停」在哪个价位上，就用 at。（加厚回填：簇原文 P-05 机制中价格域与地点/时刻/目标并列，模型层丢失，本站按源图回填）
    examples:
    - s: The book is at $5.
      note: 这本书卖 5 美元——价格点（簇原文 at $5）
    extension:
      text: 点化再走一步：价格是一条刻度线，东西停在哪个刻度点上，就用哪个点说话。地点能压成点、时刻能压成点、价钱也能——同一把「压点」的工具，换了三个地方用。
      mechanism: 点化迁移（点 → 价格刻度）
      basis: 簇原文回填引证（目录 P-05 机制含价格域，模型层丢失）
      source: P-05 / 源图 CLU 项 4
  - law: P-14
    sense: 目光瞄准的点
    stage: 抽象
    headline: to 是「送到门口」，for 是「为了谁」，at 是「瞄准靶心」——都是朝一个方向，但心里装的东西不一样。
    examples:
    - s: Look at the map.
      note: 目光瞄准地图上的点
    extension:
      text: 点图动了一步：点从「东西所在的位置」变成「目光和动作瞄准的靶心」。看、指、扔、笑——只要心里有一个瞄准的落点，就用 at。at 在指向三词里管的就是这一站：瞄准。
      mechanism: 视角迁移（位置点 → 目标点）
      basis: 专著引证
      source: P-14
  growth:
    stages:
    - stage: 空间
      nodes:
      - 地点压成一个点
    - stage: 时间
      nodes:
      - 时刻是时间轴上的点
    - stage: 抽象
      nodes:
      - 价格标在一个点上
      - 目光瞄准的点
    note: 按 P-17 展开序。at 是全库猜一猜候选最多的词（8 条）——点化图的迁移面最宽；Dirven 链上 at 与 in、on 同为全域词（at work 状态、good at math 话题、at full speed 方式，PB-13），抽象各域按频率逐个补。
  guess:
  - usage: at night
    sentence: We sleep at night.
    type: 不可推导登记（约定残留）
    source: P-09 例外登记；引申施工图 at ③（四源同登）
    path: 先猜：night 是一整夜，为什么不用 in？揭晓：这一步推不出来——它和 at noon、at midnight 成组，是「点化传统」的历史约定残留。正确的学法是整组登记：at night / at noon / at midnight。顺带当场拆掉假规则：「时间短用 at」是错的——判定靠点化，不靠时长。
  - usage: at the weekend
    sentence: We play at the weekend.
    type: 竞争用法（英美分工）
    source: 引申施工图 at ③（英式 at / 美式 on）
    path: 先猜：周末是两天，该贴在面上（on）还是压成点（at）？揭晓：两种都有人用——英式多说 at the weekend（把周末看成日程上的一个点），美式多说 on the weekend（看成日历上的一格）。这是全库最干净的一例「英美竞争」：图都没错，看你跟哪边的习惯。
  cn_cut:
  - point: 汉语「上」横跨三家里 at 的一支：在会上 → at the meeting（场合被点化为日程上的一个点）。注：meeting 尚在补词流程中，此例先行登记。
    examples:
    - at the meeting
    source: PB-12
  - point: 汉语没有「点化」这一刀：地点大小不决定用不用 at——学校再大，说 at the school 时它也只是一个点。中国孩子容易按大小选 in/at，这是登记在案的混用高发区。
    examples:
    - The student is at the station.
    - in the city
    source: P-05 / 基线病例类型（at/in 点与容器混用）
  adult:
    mechanism: 点化是识解（construal）操作：主动忽略对象的内部结构，只保留坐标位置。at 与 in/on 的对立在地点、时间两域平行出现，是图式跨域复用的强证据；Dirven 链（PB-13）中 at 的抽象端席位最全。
    boundary: 点化是「看作」点不是「是」点，同一对象可随说法在 at/in 间切换；at night 等约定残留单记为例外，不许编图式解释圆场；价格域为簇原文回填，模型 P-05 现行文本只有三域，回填以本卷宗登记为准。
    contact: Tyler & Evans (2003)：专著系统论述级；Herskovits (1986)：目录+书评+引述级（理想意义原文页段经引述）；Dirven (1993)：二手系统论述级。
- word: over
  meaning: 在……正上方 / 越过 / 结束
  family: true
  core:
    kid: over 有两张候选老家图，专家还没吵完：一张是「停在上方」，一张是「从上方飞过去」。两张都摆在这里——这词的全家福就是从这场官司开始的。
    scene_sentence: The bird flew over the wall.
    scene_note: 鸟越墙——两版中心共享的场景（基线卷宗）
  verdict:
    type: 双版中心并存（未终局）
    center: 并存两版，不设单一中心（见 versions）。
    versions:
    - name: 甲版 · 静态中心（Tyler & Evans，P-06/P-02）
      center: 静态「在上方（ABOVE）」为中心场景。
      evidence:
      - 最早义：梵语、古日耳曼语证词指向「高于」。
      - 网络主导：判定后的 15 个义项中 8 个直接涉及 ABOVE。
      - 邻居对照：over 是垂直对照集（over/above/under/below）的一极。
      - 预测力最强：「盖住」只是从上方长出的第一代亲戚，其余义项由此排序长出。
      admission: 义项准入双判据（PB-07）：意义成分原型里没有 + 不依赖具体语境，两关全过才算独立义项——Brugman/Lakoff 的 24+ 个义项按此压回 15 个。
    - name: 乙版 · 动态中心（Brugman / Lakoff，PB-05）
      center: 动态复合图式为中心：一个东西沿着路径、从参照物的上方越过去（飞机飞过院子、开车过桥）。
      evidence:
      - 静态「在上方」只是去掉路径后留下的近亲，不是中心本身。
      - 全网络至少 24 个义项（定版口径 24+；旧说「22」无权威出处已删），节点靠图式变换链式相连，链末端可以与中心不共享任何特征（PB-06）。
      admission: 节点为全规格的具体用法类型，不设准入门槛——这正是甲版批评的「全规格谬误」所在，两版之争即在此。
    sources:
    - P-06
    - P-02
    - PB-05
    - PB-06
    - PB-07
    note: 目录修正意见：静态中心是「一方裁决」，未终局——Evans (2014) 后来自承有原则多义框架「可能过于简单」；Sandra & Rice (1995) 另有心理真实性质疑。本卷宗标题与呈现一律双版并存，不得称定案。Tyler & Evans (2001) 个案原文（直升机/蜂鸟例与逐点反驳）是全介词域唯一的一手原文级材料。
  chain:
  - law: P-06
    sense: 在上方
    stage: 空间
    headline: over 的老家是「在上面」：毯子盖在上面，是因为它先要在上面；跳过栅栏，是从上面过去。
    examples:
    - s: The bird is over the tree.
      note: 鸟在树上方——甲版中心义 ABOVE
    - s: The plane flew over the clouds.
      note: 云层上方——纯上方义
    extension:
      text: 甲版里这一站是老家：东西停在另一样东西的上方，不碰它。乙版里它不是老家，是「飞过去」半路停下来的样子——先记住两版在这一站就分家了。
      mechanism: 原型场景（甲版中心）/ 去路径近亲（乙版）
      basis: 专著引证
      source: P-06 / PB-05
  - law: P-06
    sense: 盖住、遮挡
    stage: 空间
    headline: 在上面的东西，常常正好把下面的东西挡住——「盖住」是从「在上面」长出的第一代亲戚。（例句为簇原文回填）
    examples:
    - s: Spread the tablecloth over the table.
      note: 把桌布铺在桌上——覆盖义招牌例（簇原文回填，模型层曾丢失）
    extension:
      text: 从老家动的步子最小：在上面的东西，天天都在挡住下面的东西——「遮挡」这个附带的意思出现得太频繁，慢慢沉淀成 over 自己的一个意思。这一步叫语用强化：不是图变了，是图里常伴随的那层意思独立了。
      mechanism: 语用强化（上方 → 遮挡，第一代引申）
      basis: 专著引证
      source: P-06 / P-01（例句出簇原文，源图 CLU 项 1）
  - law: P-06
    sense: 越过（上方 + 路径）
    stage: 空间
    headline: 跳过栅栏、飞过墙——「在上面」加上「移动」，就长出「越过」。
    examples:
    - s: The bird flew over the wall.
      note: 从上方越过——中心与路径的结合
    - s: The cat jumped over the box.
      note: 跳过纸箱——越过义的儿童场景
    - s: The ball went over the bridge.
      note: 球越过桥面
    extension:
      text: 给老家图加上「动起来」：东西沿着一条路、从参照物的上方通过。甲版说这是「上方 + 路径」在线拼出来的；乙版说这根本就是老家本尊——同一站，两版的账正好相反，这就是中心之争的现场。
      mechanism: 图式加路径（甲版：在线组合；乙版：中心本尊）
      basis: 专著引证
      source: P-06 / PB-05
  - law: PB-05
    sense: 布满、分布
    stage: 空间
    headline: 不是一个点在上面，是到处都是——「布满」是把许多个点看成一整面。（例句为簇原文回填）
    examples:
    - s: Guards were posted all over the hill.
      note: 守卫布满山头——分布义招牌例（簇原文回填）
    extension:
      text: 乙版的招牌变换「多点聚合为面」：一个东西在上方是一个点，许多东西散在各处上方，眼睛一扫，看成铺满了一整面。图动的步子是：点 → 一堆点 → 一整面。
      mechanism: 图式变换（多点聚合为面/团）
      basis: 专著引证
      source: PB-05 / PB-06（例句出簇原文，源图 CLU 项 1）
  - law: PB-05
    sense: 在另一边
    stage: 空间
    headline: 越过山头，村子在那一边——注意力从「飞过去」挪到「落在哪」。（例句为簇原文回填）
    examples:
    - s: The village is over the hill.
      note: 山那边的村子——终点义招牌例（簇原文回填）
    extension:
      text: 乙版的另一种招牌变换「路径终点聚焦」：同样是越过，注意力从半路的弧线挪到弧线的终点——东西已经在参照物的另一边了。图没换，只是聚光灯挪了位置。
      mechanism: 图式变换（路径终点聚焦）
      basis: 专著引证
      source: PB-05 / PB-06（例句出簇原文，源图 CLU 项 1）
  - law: PB-05
    sense: 翻过来
    stage: 空间
    headline: 把卡片翻过来——「越过」的路缩到东西自己身上：顶面转到下面去。
    examples:
    - s: Turn over the card.
      note: 翻卡片——翻转义的儿童场景
    extension:
      text: 还是那条从上方越过的弧线，只是这回越过的不是栅栏、不是山头，而是物体自己的中线：上面翻下去、下面翻上来。乙版网络里它靠变换链与中心相连，离中心已经几步远——链式家族相似的末端，可以与中心长得不太像了。
      mechanism: 图式变换（路径内化为自转）
      basis: 专著引证
      source: PB-05 / PB-06
  - law: P-13
    sense: 与 above 的分工（对照站）
    stage: 空间
    headline: 上下这条线上有四个小伙伴分工：有的管「高」，有的还管「盖住、越过」——分清谁管什么，才不会用错。
    examples:
    - s: The plane flew over the hill.
      note: 越过山丘——over 的牵连义
    extension:
      text: 这一站不是新意思，是划界：over 的图里含「牵连」——可以盖住、可以越过、和下面的东西有关系；above 只管高低、没有牵连。分清这条界，over 的地盘才完整。
      mechanism: 对照分工（非引申站）
      basis: 专著引证
      source: P-13
  - law: P-06
    sense: 结束（事情到头了）
    stage: 抽象
    headline: 比赛结束了——路走完了，事情也就到头了。（基线词义含「结束」，链未单列，本站按 Tyler & Evans 亲缘排序补入）
    examples:
    - s: The game is over.
      note: 比赛结束——终点感的事件版
    extension:
      text: 从「越过终点」再往前一步：一条路走完、越过了终点，剩下的就是「完事了」。把『越过终点』这层感觉从空间搬到事情上——比赛、电影、一节课，都可以 over。甲版亲缘排序里它排在链条的远端，是『越过』的后代。
      mechanism: 语用强化（越过终点 → 结束）
      basis: 专著引证
      source: P-06 亲缘排序 / 引申施工图 over ②
  growth:
    stages:
    - stage: 空间
      nodes:
      - 在上方
      - 盖住、遮挡
      - 越过（上方 + 路径）
      - 布满、分布
      - 在另一边
      - 翻过来
      - 与 above 的分工（对照站）
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes:
      - 结束（事情到头了）
    note: 按 P-17 展开序。两点登记：①时间「经过」义（如 over the years）有 Tyler & Evans 的引申分析，本卷宗未单列节点，先登记待补；②甲乙两版的链序不同——甲版按亲缘代际（上方 → 覆盖 → 越过 → 结束），乙版按变换链（动态中心 → 终点聚焦/多点聚合诸站），本站序以甲版教学序为主、乙版节点以 PB-05 标记并入，不合并成一条假链。
  guess:
  - usage: over 100 people
    sentence: Over 100 people came.
    type: 竞争用法（分工例外口）
    source: P-13 互换区登记；引申施工图 over ③
    path: 先猜：说数量「一百多」，按分工该用只管高低的 above 吧？揭晓：这一处是分工的例外口——over 和 above 在数量上可以互换，over 100 people 是常见说法。分工是强倾向不是铁律，例外按频率逐个登记，不许反推规则。
  cn_cut:
  - point: 分工型错位：汉语「在……上面」一个说法盖住 over 与 above 两家——纯比高低时英语要 above，一旦有盖、越、牵连就是 over。中国孩子容易把纯海拔也说成 over。
    examples:
    - The plane is above the clouds.
    - The plane flew over the hill.
    source: P-13 对照集
  adult:
    mechanism: 连接机制三家三说并存登记：图式变换（Brugman/Lakoff)、语用强化（Tyler & Evans)、在线识解整合（Evans 后期 LCCM)；变换链的心理真实性正是 Sandra & Rice (1995）的质疑焦点。源头网络的全规格四维细节（参照物面/线、射体点/团、接触与否、终点在不在另一侧）为重画源头版网络的唯一依据（簇原文登记）。
    boundary: 24+ 个义项是分析模型，不是教学内容；小学阶段 over 只教「上方」与「越过」两支；静态中心不得称定案（见裁决栏目录修正意见）。
    contact: Tyler & Evans (2001), Language 77(4)：一手批评文献原文级（全介词域唯一原文级材料）；Tyler & Evans (2003)：专著系统论述级；Brugman (1981）/Lakoff (1987)、Rice (1993）复刻：二手系统论述级。
- word: above
  meaning: 在……斜上方（不接触）
  family: true
  core:
    kid: above 没有自己的证件照——它是站在 over 旁边量出来的：只管「更高」，不管盖不盖、越不越。
    scene_sentence: The plane is above the clouds.
    scene_note: 只比云高——above 的标量义（基线卷宗）
  verdict:
    type: 对照式定位（无独立中心裁决）
    center: 无独立原型场景：其意义由垂直对照集中的位置决定——只编码标量高低，不含与参照物的牵连。
    evidence:
    - P-13 对照网：over 管「上方且有牵连」，above 只管「海拔更高」——above 是 P-02 证据三（邻居对照）中 over 的对照极。
    - 簇归属：Tyler & Evans《The Semantics of English Prepositions》第 9 章 above/over 簇（源图 AB-1），无独立裁决程序。
    sources:
    - P-13
    - P-02
    note: 本项目口径：above 作认读词处理——先认得、会对照，不要求产出全网络。
  chain:
  - law: P-13
    sense: 只比高低
    stage: 空间
    headline: 上下这条线上有四个小伙伴分工：有的管「高」，有的还管「盖住、越过」——分清谁管什么，才不会用错。
    examples:
    - s: The plane is above the clouds.
      note: 只比云高——above 的标量义
    - s: The stars are above the mountain.
      note: 星星比山高——纯高低
    extension:
      text: 它不从哪张图「长」出来——它的意义就是和邻居比出来的：把 over 的「盖、越、牵连」全部拿掉，剩下的纯高度就是 above。这一站学的不是引申，是划界。
      mechanism: 对照定位（非引申站：意义由对照集切分）
      basis: 专著引证
      source: P-13
  growth:
    stages:
    - stage: 空间
      nodes:
      - 只比高低
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes: []
    note: 只有空间一级。数量读法（above 100 people）与 over 的互换区登记在 over 卷宗的猜一猜名下，本词不另设节点。
  guess: []
  guess_note: 无独立候选：与 over 的数量互换区已记 over 名下（三路来源总账）；本词不硬凑猜一猜。
  cn_cut:
  - point: 分工型错位：汉语「在……上面」不分 over/above——纯比高低要用 above，中国孩子容易顺手用 over。与 over 卷宗同一错位点的另一面。
    examples:
    - The plane is above the clouds.
    source: P-13 对照集
  adult:
    mechanism: 对照集联合切分语义空间：意义部分地由与邻居的边界决定（P-02 证据三的方法论现场）。
    boundary: 四词分工是强倾向：互换区按频率逐个登记，不追求理论洁癖。
    contact: Tyler & Evans (2003）对照集分析：专著定版级。
- word: under
  meaning: 在……下面
  family: true
  core:
    kid: under 的老家是「在下面、而且有牵连」：上面有东西罩着你、压着你——钻到桌子底下，就是这张图。
    scene_sentence: The cat is under the table.
    scene_note: 桌子下方且被桌罩着——under 的牵连义（基线卷宗）
  verdict:
    type: 对照式裁决
    center: 下方且有牵连（被压、被罩）——在垂直对照集中与 below 对裁：below 只管更低，under 管「下面 + 关系」。
    evidence:
    - P-13 对照网裁定：under 的意义成分含与参照物的关联（覆盖、压制），这是与 below 的分界线。
    - PB-08 归类：under 列入投影介词组；簇归属 Tyler & Evans 第 12 章 under/below 簇——对照定位与归类定位双重登记。
    sources:
    - P-13
    - PB-08
    note: 习得旁证：under 与 in/on 同属儿童最先稳定产出的方位词组（Johnston & Slobin 1979，见 P-17）。
  chain:
  - law: P-12
    sense: 先定找谁（图形—背景）
    stage: 空间
    headline: 说东西在哪儿，先想好「在找谁」：找的东西站前面，大背景站后面，介词是把它们连起来的钉子。
    examples:
    - s: The book is under the desk.
      note: 书在桌下——仍是小的做图形
    extension:
      text: 图先从站位长起：要找的书站前面做主角，又大又稳的桌子站后面做背景——要是丢的是桌子，也可以反过来说，只是听起来怪，因为平时没人找桌子。
      mechanism: 视角选择（图形—背景分工）
      basis: 专著引证
      source: P-12
  - law: P-13
    sense: 下面 + 牵连（被罩、被压）
    stage: 空间
    headline: 上下这条线上有四个小伙伴分工：有的管「高」，有的还管「盖住、越过」——分清谁管什么，才不会用错。
    examples:
    - s: The cat is under the table.
      note: 桌子下方且被桌罩着——under 的牵连义
    extension:
      text: 从「在下面」往前一步：上面的东西不只是位置高，它还罩着、压着下面的东西。桌子盖着猫——这份「牵连」就是 under 的身份证，也是它和 below 的分界：below 只报刻度，不管罩不罩。
      mechanism: 语用强化（下方 → 下方 + 牵连）
      basis: 专著引证
      source: P-13
  growth:
    stages:
    - stage: 空间
      nodes:
      - 先定找谁（图形—背景）
      - 下面 + 牵连（被罩、被压）
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes: []
    note: 只有空间一级（本项目小学口径）。汉语「下」与 under 大面积重合，此词可快速通过，重心只在与 below 的分工一站。
  guess: []
  guess_note: 无候选：三路来源（目录、簇原文、卷宗登记）均无 under 的链外用法登记，不硬凑。
  cn_cut:
  - point: 正迁移登记：汉语「下」与 under 大面积重合（在桌子下、在床下），这一大片可快速通过，不必逐个纠错——错位图把火力留给交叉区。
    examples:
    - The cat is under the table.
    source: PB-12（例外栏：重合区）
  - point: 唯一的错位小口：刻度场合（零下、海拔以下）汉语仍说「下」，英语换 below——见 below 卷宗。
    examples: []
    source: P-13
  adult:
    mechanism: 对照集切分 + 图形—背景分工双机制；背景成为话题时分工可反转，反转句是语用怪异而非语法错误（P-12）。
    boundary: 四词分工是强倾向，互换区按频率逐个登记。
    contact: Tyler & Evans (2003)：专著定版级；Herskovits (1986）投影组归类：目录+书评+引述级；Talmy (2000）图形—背景：理论定版级。
- word: up
  meaning: 向上
  family: true
  core:
    kid: up 的老家是「往上」：太阳升起来、人站起来——都是往上走。它后面长出的意思，全从这条向上的路上来。
    scene_sentence: The sun is up.
    scene_note: 太阳升起来了——空间义本体（基线卷宗）
  verdict:
    type: 经验相关裁定（非四证据逐条落实）
    center: 空间「向上」为源头义。
    evidence:
    - P-07：源头义的裁决依据是经验相关——「量变多」与「高度变高」在经验中总是同现（倒水时水量↑与水位↑同时发生），语言形式随之绑定；不是 P-02 四条证据逐条落实的裁决，如实登记其依据类型。
    - VB-10（Bolinger 双特征）：小品词图式 = 经由空间的运动 + 终点/结果，up 是招牌例——从小品词侧与 P-07 同指。
    - CG-06 域序旁证：UP 的隐喻展开序为状态 > 质量 > 等级 > 时间（语料 529 例），展开方向与「空间为源」一致。
    sources:
    - P-07
    - VB-10
    - CG-06
    note: Lindner (1981) 对 out/up 的体貌引申有经典分析（UCSD 博士论文），是完结支的学理上游——书目补核级，未读正文，引用时连等级标明。
  chain:
  - law: P-07
    sense: 变多、变大（数量通道）
    stage: 抽象
    headline: 水越多，杯子里的水位就越高——所以英语里「变多」也用 up：声音变大、价格变高，都往「上」走。
    examples:
    - s: The water goes up in the cup.
      note: 倒水时水位上升——经验相关的原场景
    - s: The wind is up.
      note: 风变大了——量增用 up（登记用法）
    - s: Turn the light up.
      note: 把灯调亮——量增的动作指令（亮度量）
    - s: The sun is up.
      note: 太阳升起来了——空间义本体，与数量义同源对照
    extension:
      text: 核心图动的是「通道」：往杯子里倒水，水变多了，水位也变高了——两件事总是一起发生，在脑子里绑成一条通道。以后凡是「变多、变大、变强」，都借这条向上的路说：价格涨、声音大、灯调亮。汉语说「上涨、提高」，走的是同一条路，可以直接接通。
      mechanism: 经验相关绑定（MORE IS UP）
      basis: 专著引证
      source: P-07 / Lakoff & Johnson (1980)
  - law: P-15
    sense: 满了、到底了（完结支）
    stage: 抽象
    headline: 动词后面的小词 up、out、off 都有自己的画面：up 是「满了、到底了」，out 是「从里面出来」——看着画面记短语动词，容易得多。
    examples:
    - s: Stand up, please.
      note: 教室日常指令——up 的空间义本体
    - s: Eat up the cake.
      note: 把蛋糕吃光——up 的完结义
    extension:
      text: 这是另一条支线，别和数量通道混：容器装满到顶，就是「到了头」。eat up 是吃到底、吃光——这里的 up 管的是「到顶、到底」的完结。判断口诀：能换成「光、完」的，是完结支；能换成「多、大」的，是数量支。短语动词按透明度分三档：stand up 一看图就懂（透明），eat up 要拐个弯（半透明），少数只能整块记。
      mechanism: 图式迁移（升到顶 → 完结）+ 透明度三档分流
      basis: 专著引证
      source: P-15 / P-07 边界登记
  growth:
    stages:
    - stage: 空间
      nodes:
      - （本体：在上方、升起来——载于两站例句，不单列节点）
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes:
      - 变多、变大（数量通道）
      - 满了、到底了（完结支）
    note: 按 P-17 的域序精神登记：up 的展开以抽象域（数量、完结）为主战场，无时间借用主节点；CG-06 域序（状态 > 质量 > 等级 > 时间）为成人备课参考。
  guess:
  - usage: give up
    sentence: Don't give up.
    type: 不可推导登记（揭晓给完结支新桥）
    source: P-07 边界登记 / P-15；引申施工图 up ③
    path: 先猜：放弃和「往上」「变多」有什么关系？——从数量通道推不出来，这一步如实登记「推不出」。揭晓：它走的是完结支——做到头、交出去、停手。give up 须单独点明，不许拿「多就是上」硬圆。它和 eat up 成对：一个是完结支里能拐弯猜到的，一个是拐弯后要单独记的。
  - usage: speak up
    sentence: Please speak up.
    type: 远端引申（图式可猜）
    source: P-07 边界登记（音量与公开化两支，教学取音量支）；引申施工图 up ③
    path: 先猜：说话和「上」有什么关系？揭晓：声音也是量——声音变大，往「上」走，和调亮灯是同一条数量通道。这一条能从图上猜出来。
  cn_cut:
  - point: 正迁移为主：汉语「上涨、提高、站起来、吃光」与 up 的空间、数量、完结三支多通道同向（P-07/CG-06），中国孩子接通成本低。
    examples:
    - prices go up ↔ 价格上涨
    source: P-07 / CG-06
  - point: 错位只在完结支的习语点：give up 一类汉语没有对应的「上」图，须整块登记，不许用母语图硬套。
    examples:
    - give up
    source: P-07 边界登记
  adult:
    mechanism: 经验相关（experiential correlation）：两个总在同一场景同现的属性在概念系统里被绑成一条通道，语言形式随之共享；完结支的机制是「升至顶 = 抵达终点」的结果图式（VB-10 双特征之「终点/结果」）。
    boundary: 经验相关解释「为什么偏偏是 up」，不保证每个 up 短语可推导：give up 的 up 是完结义另一支，须单独点明；speak up 兼有音量与公开化两支，教学取音量支；合成度连续谱按透明/半透明/整记三档处理。
    contact: Tyler & Evans (2003) up 分析：专著定版级（液体上升例经 LINGUIST List 书评转述）；Lakoff & Johnson (1980)：经典原文；Lindner (1981)：书目补核级，未读正文。
- word: for
  meaning: 为了 / 给 / 持续……时间
  family: true
  core:
    kid: for 的心里装的是「为了谁」：礼物还没到妹妹手里，它已经「奔着」妹妹去了——for 看的是心意奔向谁。
    scene_sentence: The gift is for my sister.
    scene_note: 礼物为了妹妹——受益（基线卷宗）
  verdict:
    type: 源流裁决（专著个案）
    center: 现行中心 = 目的/受益；源头 = 空间「在前、为先」——空间义是祖先，意图义是后代中心用法。
    evidence:
    - P-14（Tyler & Evans 个案）：for 由「在前、为先」的空间义引申出意图义——裁决给的是源流方向：空间在先、意图在后，现行教学中心取后代（受益），源头登记在裁决栏，不现教。
    - 教学实验旁证（P-10）：Tyler (2011) 的实验材料即以 to/for/at 的引申链为内容，CL 组在未学用法上同样获益——受益中心 + 引申链的呈现方式有迁移证据。
    sources:
    - P-14
    - P-10
    note: 本项目口径「三站」（旧 App 定稿）：为了谁 / 奔着哪儿 / 持续多久——与 P-14 源流方向一致，时长站为远端（见链）。
  chain:
  - law: P-14
    sense: 为了谁（受益、目的）
    stage: 抽象
    headline: to 是「送到门口」，for 是「为了谁」，at 是「瞄准靶心」——都是朝一个方向，但心里装的东西不一样。
    examples:
    - s: The gift is for my sister.
      note: 礼物为了妹妹——受益
    extension:
      text: 从老家的图动了一步：老家的 for 是「在前面领着」——东西在前面，心意先到。慢慢地，「在前」长成了「奔着」：礼物奔着妹妹、努力奔着一个目标。for 看的是意图和受益，不是东西最后落到谁手里（落点是 to 的活）。
      mechanism: 语用强化（在前 → 意图/受益）
      basis: 专著引证
      source: P-14 源流裁决
  - law: P-14
    sense: 持续多久（时长）
    stage: 时间
    headline: 「奔着」的路拉长，就成了持续的一段时间：for two hours 是走了两个小时的路。（远端引申，小学只作认读）
    examples:
    - s: We played for two hours.
      note: 玩了两个小时——时长站
    extension:
      text: 受益站再往远走一步：心里奔着的方向，拉成一段时间来量——活动沿着这段时间一直往前。这一站离老家已经远了，是三站里的最后一站，小学阶段认得即可，不作产出重点。
      mechanism: 时间借用（方向 → 时长）
      basis: 组装：按通用机制衔接，非专著引证
      source: P-14 引申方向 + 旧 App「for 三站」定稿口径
  growth:
    stages:
    - stage: 空间
      nodes:
      - （源头「在前」：仅裁决栏登记，不现教）
    - stage: 抽象
      nodes:
      - 为了谁（受益、目的）
    - stage: 时间
      nodes:
      - 持续多久（时长）
    note: for 是 P-17 顺序的一个登记在案的形态：空间源头已退出日常用法，现行展开从抽象中心（受益）起步、时长殿后——顺序管讲解展开，源头只作裁决背景。
  guess:
  - usage: vote for
    sentence: We vote for the new plan.
    type: 远端引申（图式可猜）
    source: 引申施工图 for ③（c 源登记）
    path: 先猜：投票和「为了谁」有什么关系？揭晓：投票就是公开站到「为了谁」的那一边——支持谁，就是把票奔着谁投。「为了谁 → 站到谁一边」，这条桥能从图上猜出大半。
  cn_cut:
  - point: 「给」的分工错位：中国孩子常把「给、对、向」一股脑塞给一个词——英语按落点/受益/瞄准三分：Give it to me（接收者，落点归 to）；Buy it for me（受益者，归 for）。这是小学阶段最重要的分工对比。
    examples:
    - Give it to me.
    - This gift is for me.
    source: P-14 / 引申施工图 to ②
  adult:
    mechanism: 指向图式三词分工（P-14）：to 编码落点（接收者），for 编码意图（受益者），at 编码瞄准（目标点）——同一「指向」大图式下靠心里装的东西分工。for 的历时方向为空间「在前」→ 意图（语用强化型引申）。
