    examples:
    - s: The road runs along the river.
      note: 清单原文例句——路沿河伸展
    extension:
      text: 这一站的图动在「谁在动」：路一动不动，动的是我们的目光——眼睛沿着河边的路从这一头扫到那一头，句子把这趟「眼睛的旅行」写成了路在跑。along 管的就是这条被目光扫过的长线。
      mechanism: 虚构运动（注意沿路径的心理扫描）
