    - stage: 空间
      nodes:
      - 越过一个面
      - 当小尾巴报路径（卫星框架）
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes: []
    note: 只有空间一级；「在……对面」（across the river 的静态读法）为词义登记项，未单列节点，按频率后补。
  guess: []
  guess_note: 无候选：三路来源均无 across 的链外用法登记。
  cn_cut:
  - point: 路径编码错位：汉语「游过河、跑过马路」把路径装进动词（过），英语把路径装进小尾巴 across——趋向结构直译是登记在案的错型，学 across 就是学这套装法。
    examples:
