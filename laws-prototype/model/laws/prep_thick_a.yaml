    type: 专著定位（原型场景裁定）
    center: 移动物抵达界标：路径的终点是 to 的原型场景。
    evidence:
    - P-14（Tyler & Evans）：to 的 proto-scene 为「移动物抵达界标」，与 for（意图）、at（瞄准）同图分工、定位互斥。
