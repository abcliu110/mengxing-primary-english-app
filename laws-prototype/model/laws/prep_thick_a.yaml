  - law: PB-04
    sense: 越过一个面
    stage: 空间
    headline: across 只认「面」：河面、路面是一个面，路贴着面从这头到那头——不钻进里面去。（加厚补入：基线链未单列此站，出自分工判据）
    examples:
    - s: We swim across the river.
      note: 游过河——贴着河面横过
    - s: The cat ran across the road.
      note: 穿过马路——贴着路面横过
    extension:
      text: 这一站是全词的骨架，不用从别处长：across 的路全程在「面上」——起点在一边、终点在另一边、中间贴着面过。和 through 的分界就在这一步：through 要钻进介质内部（穿树林、穿隧道），across 只越面。
      mechanism: 原型场景（分工判据给出）
      basis: 专著引证
      source: PB-04
  - law: P-19
    sense: 当小尾巴报路径（卫星框架）
    stage: 空间
    headline: 说「跑出去」，英语和汉语装东西的格子不一样：英语把「怎么动」装进大词（run），把「往哪去」做成小尾巴挂在后面（out）；汉语把「往哪去」也装进动词里。学 run out 不是背新单词，是学英语的装法。
    examples:
    - s: The cat ran across the road.
      note: 穿过马路——across 承担路径
    - s: We swim across the river.
      note: 游过河——方式动词 + 路径卫星的能产组合
    extension:
      text: 这一站不是新意思，是「谁来干活」的分工：across 在句子里当小尾巴，专管「往哪去」；「怎么动」交给 run、swim 这些大词。所以没学过的组合也能现拼：roll across、walk across——尾巴不变，大词随便换。
      mechanism: 编码定位（非引申站：路径的词汇化位置）
      basis: 专著引证
      source: P-19
  growth:
