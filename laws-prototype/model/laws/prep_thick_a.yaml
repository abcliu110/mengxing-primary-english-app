  adult:
    mechanism: into 的语义由构式现场组装：容器图式（in）提供终点构型，路径方向提供位移分量——这是有原则多义框架下「在线组合」的教学化呈现，但须与专著引证的引申链分账（源图施工纪律 4）。
    boundary: 组装站不得表述为 Tyler & Evans 或 Lindstromberg 的 into 分析——两家均未给 into 独立图式（IO-1 登记）。
    contact: EPE 名单归属：目录+书评+作者自述级；Talmy 卫星框架：二手系统论述级；组装部分无外部出处，为本项目教学组装。
- word: 'off'
  meaning: 离开；（电器）关着
  family: true
  core:
    kid: off 的图是「脱开」：贴着的东西分开了、挨着的东西离开了——从桌上掉下去、把灯关掉，都是这张图。
    scene_sentence: The cup fell off the table.
    scene_note: 杯子从桌上掉下来——贴离主线场景（旧 App spacetime 专幕骨架）
  verdict:
    type: 无单一中心裁决（图式族级定位）
    center: 无任何来源给 off 单一中心裁决；现有定位只有两处：Lindstromberg 第 3 章章题把 off 与 on1、on2 编在同章（"On1, off, on2"），Dirven 意义链把 off 列入分离/来源组。
    evidence:
    - PB-03 章题编排事实：off 与 on 的两个基本义同章——贴/离对照是它的编排定位。
    - PB-13 Dirven 分组：分离/来源组（from/off/out of）成员身份（模型层名单曾丢失，源图项 8 回填）。
    - P-15/VB-10：小品词图式族覆盖 off 的「脱离」义，但无逐词核查的专属图式句。
    sources:
    - P-15
    - PB-03
    - PB-13
    - VB-10
    note: 重做注记（源图原话）：off 的主链以旧 App 贴离主线为教学骨架、来源侧只登记到图式族级，不得伪称专章材料。本卷宗逐站按此分账。
  chain:
  - law: 旧App贴离主线
    sense: 离开表面（贴离）
    stage: 空间
    headline: off 的空间主线是「离开」：原来贴在面上的东西，分开了、掉下来了、拿走了。（本站以旧 App 贴离专幕为教学骨架，来源侧为图式族级）
    examples:
    - s: The cup fell off the table.
      note: 杯子从桌上掉下——脱离表面
    - s: Take the picture off the wall.
      note: 把画从墙上取下——主动脱离
    extension:
      text: 这一站是 on 的镜子：on 是贴上去，off 是脱开来。图动的步子只有一步——接触断了。旧 App 的贴离专幕就是按这条主线排的；专家来源这边只登记到「脱离属小品词图式族」，没有专章替它逐步作证，所以本站如实标为教学骨架站。
      mechanism: 图式族定位（脱离）+ 教学骨架组装
      basis: 组装：按通用机制衔接，非专著引证
      source: 旧 App A2 贴离主线 / P-15 图式族
  - law: P-15
    sense: 断开、关闭（电器与活动）
    stage: 抽象
    headline: 动词后面的小词 up、out、off 都有自己的画面：off 是「脱开了」——灯和电路脱开，就是关灯。
    examples:
    - s: Turn off the light.
      note: 关灯——off 的脱离/关闭义
    extension:
      text: 从「脱开表面」往前一步：灯亮着，是和电路「接着」；关灯，就是让它「脱开」。连接断了 → 关。活动也一样：会不开了，是活动和日程「脱开」了（见猜一猜的 the meeting is off）。
      mechanism: 图式迁移（脱离 → 断开连接）
      basis: 专著引证（图式族级）
      source: P-15 / Tyler & Evans (2003) 统一网络处理
  growth:
    stages:
    - stage: 空间
      nodes:
      - 离开表面（贴离）
    - stage: 时间
      nodes: []
    - stage: 抽象
      nodes:
      - 断开、关闭（电器与活动）
    note: on/off 对照是本词的隐藏骨架：接通/举行（on）↔ 断开/取消（off）——对照本身就是一半的记忆术，但 go off 一类反例证明对照不能包办（见猜一猜）。
  guess:
  - usage: go off（闹钟响起来）
    sentence: The alarm clock went off.
    type: 不可推导登记（招牌反例）
    source: 旧 App spacetime 登记；引申施工图 off ③
    path: 先猜：闹钟「响起来」，按「脱开、断开」的图，怎么会是 off？揭晓：推不出来，而且正好相反——这是全库的招牌反例。spacetime 登记明定不得硬套图式：go off = 响起来，整块记住。学会在这一题上停手，比学会十条桥更重要。
  - usage: the meeting is off
    sentence: The meeting is off.
    type: 不可推导登记（与 on 对照半可猜）
    source: 旧 App spacetime 登记；引申施工图 off ③
    path: 先猜：会「off」了，是什么意思？揭晓：取消。这一条有一半能猜——会本来和日程「接着」（on），脱开了就是取消；但「一半能猜」仍按登记处理：和 on 的用法对照着整块记，不当作推导成果。
  cn_cut:
    status: 无专属登记
    note: 源图 PB-12 未给 off 专属中英错位点；其学习难点在短语动词的整记层面（透明度三档），不在汉语刀口交叉区，不硬编错位点。
  adult:
    mechanism: 小品词与介词同源同图式（P-15）：off 在短语动词中的意义贡献是「脱离」图式义的系统引申（脱离、断开等体貌义）；Bolinger 双特征（VB-10）为通则覆盖。旧 App spacetime 层另有贴离主线与 go off 反例的结构化登记，是本词最现成的场景资产。
    boundary: 合成度连续谱按三档处理：透明可推、半透明助记、习语化整记；不许把助记说成推导（go off 为明定反例）。off 无专章材料，卷宗厚度封顶于图式族级 + 旧 App 骨架，如实呈现。
    contact: Tyler & Evans (2003）统一网络处理：专著定版级；Lindstromberg 章题编排：目录+书评+作者自述级；Dirven (1993)：二手系统论述级；旧 App spacetime：本项目自产登记。
