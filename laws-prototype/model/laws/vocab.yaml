        options: ["故事很顺口，一定是真的", "查年代：tip 作『小费』18 世纪已见于文字，那时几乎没人用首字母造词——故事不成立", "问问服务员"]
        answer: "查年代：tip 作『小费』18 世纪已见于文字，那时几乎没人用首字母造词——故事不成立"
