  - id: V-34
    zone: 词汇解码
    group: V
    headline: "变色龙前缀：in- 碰到 p 变 im-、碰到 l 变 il-、碰到 r 变 ir-——前缀的尾巴会照着后面字母的样子改，同化处几乎都产生双写字母"
    headline_kid: "in- 后面跟 p、b、m 就变成 im-（impossible），跟 l 变 il-（illegal），跟 r 变 ir-（irregular）。不是它们想变，是嘴巴偷懒，说起来更顺——看懂这条，双写字母就不用死记了"
    claim:
      type: rule
      statement: "拉丁前缀末尾辅音向后接词根的首辅音同化（顺同化），拼写把发音妥协固定下来：in-→im-（唇音前）/il-（l 前）/ir-（r 前），con-→com-/col-/cor-/co-，ad-→ac-/af-/ag-/al-/an-/ap-/ar-/as-/at-，sub-→suc-/suf-/sug-/sum-/sup-/sur-/sus-，dis-→dif-，ob-→oc-/of-/op-，ex-→ef-/e-；同化处几乎都产生双写字母，是英语双辅音拼写的一大来源"
      evidence:
        - "拉丁前缀同化通例著录：Monmouth College 古典学系科学术语课程讲义（同化全表）、Stone《Morphology Masterclass》教师手册与 Prefix Assimilation 词表、澳大利亚形态学教学范围文件（RSIS）——三家名单与例词交叉一致（二手系统论述级）"
      scope: "只存在于拉丁借词的成品里，是历史化石，不是现行活规则"
      exceptions:
        - note: "现代英语新造词不再执行同化：input、inboard 拼写保留 n（尽管口读近 m），不会生出 *ilput——本条教的是读懂旧账，不是造词配方"
          word_ids: [ADD_0159]
        - note: "同形须防假：illusion、immerse、irrigate 里的 im-/ir- 是另一个 in-（向内义），不是否定——判断变体前先确认是哪个 in-（见 V-35）"
          word_ids: []
    mechanism:
      - beat: 嘴巴偷懒
        text_kid: "in- 的尾巴 /n/ 碰到嘴唇音（p、b、m），自己先变成 /m/，写出来就是 im-；碰到 l、r，就变得和后面一模一样，还多写一个——双写字母就是这么来的。"
        text_adult: "同化只解释前缀末尾一格的变化，词根内部的双写（如 accommodate 中段）另有来源，不可一例推全词。发音事实可验证：in- 的鼻音在唇音前实际读作 /m/（input 口语中即如此）。"
        visual: "变色龙图式：in- 走到 p/l/r 门前依次换装成 im-/il-/ir-，双写字母高亮"
        anchors: [G6_0476, G5_0521, G6_0682]
    examples:
