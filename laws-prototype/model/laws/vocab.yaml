    zone: 词汇解码
    group: V
    headline: "同音异形词读音完全不能消歧，拼写只能靠『这句话在说什么』来选——写错不是粗心，是这类词的任务本质如此；解法是按对子呈现加绘本钉桩"
    headline_kid: "their 是『他们的』，there 是『那里』，they're 是『他们是』——耳朵听起来一模一样，只能靠脑子想这句话是什么意思。有两本好笑的绘本专治这个病，笑一次记一对"
    claim:
      type: tendency
      statement: "同音异形词的拼写选择是『语音通道失效、句法语义通道接管』的任务：their 后必跟名词、there 指处所或作存在句引词、they're 是 they are 的缩合——选字依据是位置与意义，不是声音；教学须成组呈现（同音组同批对比、句子里二选一），绘本用字面图景把错误读法钉成视觉锚点"
      evidence:
        - "Peggy Parish《Amelia Bedelia》(1963, Harper & Row)——字面理解型女佣系列首作（书目二手级，多家书目与 HarperCollins 五十周年资料互证；其 draw the drapes 例被美国联邦第四巡回上诉法院 2019 年判决书引作词义辨析材料）"
        - "Fred Gwynne《The King Who Rained》(1970, Simon & Schuster 少儿线)——同音词与习语的字面图景绘本（书目二手级）；美国教师培训课程以之作同音词单元导入书（Charlotte Teachers Institute 课程文件）"
        - "同音组清单（their/there/they're、to/too/two、write/right、hear/here、week/weak 等）为学习词典与拼写教材通载（词典级）"
      scope: "同音关系随口音而变：wine/whine、horse/hoarse 在部分口音并不同音——选对子须以目标教学口径逐对核"
      exceptions:
        - note: "读绘本的顺序有讲究：初学阶段宜先立对子、后读绘本，否则笑话可能反过来固化错误读法"
          word_ids: []
