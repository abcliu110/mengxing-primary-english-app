        text_adult: "第二把尺是词源：bank 的金融机构义借自意大利语 banca（钱商长凳），河岸义源出日耳曼/古诺尔斯一线——两源汇流即同形异义；eye 经『形状功能像眼睛的小孔』扩至针眼是标准多义链（见 V-16）。"
