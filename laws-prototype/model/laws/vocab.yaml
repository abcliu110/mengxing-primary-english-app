    group: V
    headline: "理解一个词，就是想起它出场的那幕生活场景和场景里的角色；buy、sell、pay、cost 是同一幕买卖戏换了机位"
    headline_kid: "学词像看戏：先看懂整场戏里有谁、发生了什么，每个词自然就知道站在哪个位置说话了"
    claim:
      type: tendency
      statement: "词义相对于框架（frame）定义：一个词激活整幕场景及其全部角色，听到 buy 就自动知道必曾有人卖、必有价——框架提供免费的推论"
      evidence:
        - "Fillmore (1977) 'Scenes-and-frames semantics'（载 Zampolli (ed.)《Linguistic Structures Processing》）——商业事件框架与 buy/sell/cost/charge 机位分析原始出处（二手论述级）"
        - "伯克利 FrameNet 工程（Fillmore & Baker 2010 等）：Commerce_buy 框架角色结构（Buyer/Seller/Goods/Money）与语料标注高度吻合"
