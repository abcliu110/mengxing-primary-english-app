  - id: V-19
    zone: 词汇解码
    group: V
    headline: "英语词汇有三个地层：盎格鲁-撒克逊本族层（短、核心、日常）、诺曼法语层（居中、体面）、拉丁希腊学层（长、书面、学术）——同义词的场合差是词的历史层位写在词里"
    headline_kid: "每个词都有老家：老家在『本村』的词（ask、cow）随口说；从法国来的词（question、beef）穿正装上班；从拉丁图书馆来的词（interrogate）最一本正经"
    claim:
      type: tendency
      statement: "层位与语域的对应是统计性倾向：越往上层，词越长、越晚近、越正式、越抽象；本族层管日常与情感，法语层管制度与礼仪，拉丁希腊层管科学与抽象"
      evidence:
        - "David Crystal《The Stories of English》(2004) 与《The Cambridge Encyclopedia of the English Language》(第2版 2003, CUP)——lexical alternatives 论述，经 Folger Shakespeare Library 专题页逐字引录核实（二手论述级）"
        - "Finkenstaedt & Wolff《Ordered Profusion》(1973) 对《简编牛津词典》约 8 万词统计：法语/奥依语 28.3%、拉丁 28.24%、日耳曼语 25%、希腊 5.32%（二手论述级）"
        - "Baugh & Cable《A History of the English Language》(第6版 2013) 牲畜/肉食对为标准例"
      scope: "三层比例是词典词条（type）计数，不是实际语流（token）频率；真实说话中占压倒多数的仍是本族层"
      exceptions:
        - note: "『三连』是倾向不是铁律：部分三连已发生义项分化（interrogate 已专化为『审讯』），不能教成『三个词随便挑、只是正式程度不同』"
          word_ids: [ADD_0545]
        - note: "层位判断靠词源，部分词的层属（如经法语转手的拉丁词）本身有双重身份"
          word_ids: []
    mechanism:
      - beat: 三次沉积
        text_kid: "英语的词像地层一样一层一层堆出来：最底下是老家的词，中间是法国客人带来的，最上面是图书馆里的学问词。认出老家，就知道该在哪个场合说哪个词。"
        text_adult: "三层是三次历史事件的沉积（日耳曼定居、1066 诺曼征服、文艺复兴古典借词）；Crystal 称成套近义词为 lexical alternatives：选哪个等于选场合与身份。单个词的入境路线显微镜见 V-23。"
        visual: "地层剖面图：三层土壤各嵌代表词，餐桌场景中 cow 在田间、beef 上桌"
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_69, G4_0518]
        sentence: "Ask a question."
        scene_note: "ask（本族层）配 question（法语层）：最常同框的一对"
        supports: claim
      - level: 2
        word_ids: [G4_191, G4_0941]
        sentence: "The cow is in the field. We eat beef."
        scene_note: "活物在田间用本族词 cow，肉上了桌用法语词 beef（Baugh & Cable 标准例）"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-23, rel: 同族}
      - {id: V-35, rel: 同族}
    quiz:
      - stem: "ask、question、interrogate 意思相近，为什么不能随便换？"
        options: ["因为它们的老家（地层）不同，场合不同", "因为字母不一样多", "因为老师规定"]
        answer: "因为它们的老家（地层）不同，场合不同"
        hint_ref: "mechanism『三次沉积』"
    probes: []
    prereq: []
    order: 19
    pain_points: [记不住, 写不长]
    adult:
      sources: ["Crystal (2004; 2003)；Finkenstaedt & Wolff (1973)；Baugh & Cable (第6版 2013)；Bryson《The Mother Tongue》(1990) 第5章通俗版"]
      boundary: "比例是词条计数非语流频率；三连是倾向，部分已义项分化；层属有双重身份者"
      disputes: "计数口径之争：Finkenstaedt & Wolff 的词典统计与 Joseph M. Williams 对 1 万词商务信函的统计给出不同比例，学界公认尚无定论的计数（比例只作量级参考）；三层同义词为何长期共存而不被淘汰，Crystal 称为『词汇学之谜』，功能分化解释是事后归因"
