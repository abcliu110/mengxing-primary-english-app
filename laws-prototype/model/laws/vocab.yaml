  - id: V-20
    zone: 词汇解码
    group: V
    headline: "英语造词有七台机器——派生、复合、转类、混合、截短、逆构、首字母缩合——产出性天差地别：有的天天开工，有的早已封存"
    headline_kid: "英语造新词就几招：加零件、两个词拼一起、老词换个工作、两词各砍一半对接、把长词剪短、拆错了拆出新词、首字母拼新词。先认机器，再背单词"
    claim:
      type: tendency
      statement: "构词过程构成通行菜单（Plag 2003 章节编排即按此组织）；产出性是梯度：复合、转类与高产词缀至今随时造新词，混合与截短中度活跃，逆构是零星事件，首字母缩合在科技与机构命名里高产"
      evidence:
        - "Ingo Plag《Word-Formation in English》(CUP, 2003) 第3–6章——产出性专论（p.44）与七过程菜单（章节预览级）"
        - "Laurie Bauer《English Word-formation》(CUP, 1983)——词缀产出性分级；-th 只接一小串固定词、已封存（二手系统论述级）"
      scope: "本菜单是清单指定的七种；完整的构词生态另含借词（不算『造』）与凭空生造（极罕见），不在七台之列；产出性随语域变"
      exceptions:
        - note: "-th（warmth、length）只能接一小串固定词、不再接新词基——说某词缀『封存』指不再造新词，不指已有词消失"
          word_ids: [G6_0901, G6_0899]
    mechanism:
      - beat: 七台机器
        text_kid: "看见生词先猜：它是被哪台机器造出来的？加零件的（un-happy）、拼起来的（black-bird）、剪短的（gym）、拆错拆出来的（edit），认出机器，就知道该怎么对付它。"
        text_adult: "七过程：派生/复合/转类/混合/截短/逆构/首字母缩合（acronym 可读成词 vs initialism 逐字母念须分清）。给孩子的用法是『认机器』而非术语考试，拆的纪律见 V-15。"
        visual: "七台机器图标排：每台机器吐出一个例词"
        anchors: [G4_0457]
    examples:
      - level: 1
        word_ids: [G4_0457]
        sentence: "Un-happy: two parts, one word."
        scene_note: "派生机：un- + happy（与 V-33 互挂）"
        supports: claim
      - level: 2
        word_ids: [G5_0745, ADD_0646, G6_301]
        sentence: "A blackbird is not just a black bird."
        scene_note: "复合机（blackbird）对短语（black bird）——重音判据在 S-20"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-15, rel: 同族}
      - {id: V-36, rel: 同族}
    quiz:
      - stem: "gym 是哪台机器造出来的？"
        options: ["派生（加零件）", "截短（把长词剪短）", "逆构（拆错拆出来的）"]
        answer: "截短（把长词剪短）"
        hint_ref: "mechanism『七台机器』"
    probes: []
    prereq: [V-15]
    order: 20
    pain_points: [记不住]
    adult:
      sources: ["Plag (2003) CUP 第3–6章；Bauer (1983) CUP"]
      boundary: "借词与生造不在七台之列；产出性是梯度且随语域变；封存指不再接新词基"
      disputes: "①转类算不算派生的一支：Lyons、Marchand 归入派生，Koziol、Strang 主张与派生并列（Bauer 1983: 32 引两派）；②混合的归属：Plag 明说『算复合的特例还是无词缀派生并不清楚』。两处分歧不影响菜单的教学可用性，引用时不得把任一归类说成定论"
      evidence_grade: 章节预览级 / 二手系统论述级
      pending: ["本条清单无独立『标题句』行，headline 取条目标题定版（簇源如有标题句，定版时回填）"]
