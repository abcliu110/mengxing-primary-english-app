      boundary: "与假词源分开；改定的词形即标准词不许拨乱反正；sparrowgrass 只在方言层"
      disputes: "crayfish 前半 cray- 的确切音变路径各词典著录详略不一，正文只取各家一致部分；écrevisse 再上溯日耳曼语 *krebiz 为通行说、未逐源核实，标待核；民间词源与『类推』的边界在理论语言学中亦有讨论，本条取宽口径"
