  - id: V-45
    zone: 词汇解码
    group: V
    headline: "一个词『最核心的意思』和『在语料里出现最多的意思』是两把不同的尺：核心义由引申网络定，频率由文本构成定——排教学顺序要两把尺都看"
    headline_kid: "『跑』是 run 一家的老大，别的意思都从它变出来。可在大人写生意的文章里，『经营一家公司』出现得最多。谁最常出现，和谁地位最核心，是两回事，要看在哪个场子里数票"
    claim:
      type: tendency
      statement: "原型性是网络结构属性（引申方向、习得顺序、典型性判断），频率是语料统计属性，随语料的语域配比大幅摆动；两者在综合语料里可以重合（run 的核心义『跑』也最高频），在商务偏向的文本里可以分家（『经营』反超）——分家与否取决于按哪个语域数"
      evidence:
        - "Fang & Liu (2022) 'A Semantic Contrastive Study of Chinese and English Verb 跑/run', Forum for Linguistic Studies 4(1): 100–115, DOI 10.18063/fls.v4i1.1458——语料分析显示跑/run 频率最高的义项同为『快速步行移动』，且该义即原型/中心义（期刊原文级）"
        - "商务偏向样本：一项课堂语料研究的 83 行 run 索引行中，manage/operate/organize 义占 42 行居首（二手转述级，样本小，仅作语域效应示例）；Crayton Walker 对 BNC 与 Bank of English 的商务搭配研究（run 的高频名词搭配为 business、company 等）"
      scope: "小学阶段以儿童输入语料与原型结构双尺合排；引用『最常用义』必须标明所据语料，不许无出处宣称"
      exceptions:
        - note: "义项频率统计依赖先行的义项切分（切得越细每义票数越少，与 V-41 同根），不同研究的 run 频率表不可直接拼比"
          word_ids: [G2_087]
    mechanism:
      - beat: 两把尺
        text_kid: "量一个词有两个尺子：一个量它在词族里的地位（谁是老大），一个量它在文章里出现的次数（谁出镜多）。换一个场子数票，出镜王就换人了，老大可不变。"
        text_adult: "词典编排与教材排序若只按成人综合频率，会把『经营』排到『跑』前教给儿童；而儿童输入（绘本、课堂英语）里 run 以运动义绝对主导，按儿童频率排则两尺完全一致。"
        visual: "双尺图：左尺『家族地位』run 的『跑』居顶，右尺『出镜次数』随场子（绘本/财经版面）换榜首"
        anchors: [G2_087, V6_城市_26]
    examples:
      - level: 1
        word_ids: [G2_087]
        sentence: "I run in the park."
        scene_note: "儿童场：run 的最高频义与中心义重合，都是『跑』"
        supports: claim
      - level: 2
        word_ids: [G2_087, V6_城市_26, ADD_0186]
        sentence: "They run a company."
        scene_note: "商务场：run『经营』与 company 共现——榜首换人是语料构成的函数（manage ADD_0186 旁证）"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-16, rel: 同族}
      - {id: V-41, rel: 同族}
    corrections:
      - "任务书『run 的原型是跑，语料里最高频却是经营/运转』作为全称判断不成立：它只在商务/成人书面偏向的样本里为真；在综合语料（Fang & Liu 2022 所据数据）里最高频仍是『跑』，与原型重合。定版表述只能是定性的：两把尺可以分家，分家与否取决于按哪个语域数；任何场合引用『经营义最高频』必须携带语料来源，禁止裸引"
    quiz:
