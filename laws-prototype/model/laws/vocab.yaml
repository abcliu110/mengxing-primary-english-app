        right: "两个 light 是同形异源的两棵树，分别记"
        error_type: 义项硬连
        source_type: 条目成人层登记的事故例
        diagnosis: "把同形异义当多义网络硬连（回 mechanism『树干与树枝』；VF-003 裁定）"
    relatives:
