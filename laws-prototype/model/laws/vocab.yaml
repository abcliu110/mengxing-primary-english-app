      - {id: V-30, rel: 同族}
      - {id: V-31, rel: 同族}
    corrections:
      - "『小学阶段约三分之二的已识词靠形态推导』在 Anglin 原文及权威转述中均无此表述，不予采用。可核数字：五年级派生词约 16000，占总识别词汇约 40000 的约 40%；派生/(词根+派生）约 68%（疑为误传来源，分母不同）；新遇词 60–80% 为形态复杂词（说的是新词构成，不是已识词来源）。三数口径各异，不可混用"
    quiz:
      - stem: "大孩子认得的派生词暴涨，主要是因为什么？"
        options: ["背得更多", "会当场拆词解题，词自己长出来", "词变简单了"]
        answer: "会当场拆词解题，词自己长出来"
        hint_ref: "mechanism『解题引擎』"
    probes: []
