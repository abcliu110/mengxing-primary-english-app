    headline: "中国学习者的词汇错误不是随机的：词形（拼写、构词）、搭配（动名搭配、近义词误选）、缺词与赘词（冠词、限定词、介词的漏与多）是三大聚集区"
    headline_kid: "中国小朋友学英语，老在几个地方摔跤：词写错、词搭错、该有的小词漏掉——先知道坑在哪，就绕得开"
