  - id: V-28
    zone: 词汇解码
    group: V
    headline: "小学阶段词汇量的暴涨主要不是逐个背出来的：母语儿童认得的派生词从 6 岁的约 2000 个涨到 10 岁的约 16000 个，增量靠当场『拆词解题』"
    headline_kid: "大孩子认得的词多得吓人，不全是背出来的：他们会拆词——碰到没学过的长词，先拆开，靠认识的部分猜出意思，词就『自己长』出来了"
    claim:
      type: tendency
      statement: "形态解题（morphological problem solving）：掌握词根义+词缀义+构词规则后，对未学过的复杂词在遇到的当场推导意义；派生词知识的暴涨本身就是解题引擎在转的证据（Anglin 五分类计数与释义访谈的言语证据）"
      evidence:
        - "Anglin (1993)《Vocabulary Development: A Morphological Analysis》, Monographs of the SRCD 58 (Serial No. 238)——分类计数经 Nation 教科书转述：词根词 6 岁约 3000 / 10 岁约 7500；派生词同期约 2000 / 16000（权威转述级）"
        - "访谈实证：五年级孩子没学过 treelet，却能借已知的 piglet（-let＝小）当场类推『小树』"
      scope: "样本为英语母语儿童；中国孩子英语词根库存小得多，同一引擎的转速不可直接搬用（先得有根可拆，见 V-30、V-31）"
      exceptions:
        - note: "Anglin 的结论是机制性推论（由派生词暴涨+访谈言语证据推断引擎存在），并未逐词溯源每个已识词的习得方式"
          word_ids: [G2_079, G1_019, ADD_0604, ADD_0688]
    mechanism:
      - beat: 解题引擎
        text_kid: "认词有两种：背过的，和现场拆出来的。大孩子的词一大半是拆出来的——零件认识得越多，能拆的词就越多，词就越长越快。"
        text_adult: "Anglin 五分类：词根词、屈折词、派生词、字面复合词、习语；『派生词』与『词根词』的分界是心理基本词判据——不能靠拆解得出、必须单独存一条的，才算词根词。"
        visual: "增长曲线图：派生词线陡升（2000→16000），词根词线缓升（3000→7500）"
        anchors: [G2_079, G1_019]
    examples:
      - level: 1
        word_ids: [G1_019, ADD_0604, ADD_0688]
        sentence: "A piglet is a small pig."
        scene_note: "访谈原案：由 piglet 的 -let『小』类推 treelet『小树』"
        supports: claim
      - level: 2
        word_ids: [G2_079]
        sentence: "A treelet is a small tree."
        scene_note: "当场解题的产物：没学过的词，拆出来了"
