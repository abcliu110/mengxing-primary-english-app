  - id: V-31
    zone: 词汇解码
    group: V
    headline: "『要不要教词根词缀』有两轮元分析的裁决：教了有用，总效应 d≈0.32–0.33（中等偏小）；低龄儿童与有识字困难的儿童受益相对最大"
    headline_kid: "很多班级都试过『上拆词课』，把成绩合起来看：拆词课确实让孩子更会认词、拼词、猜词；但它不会自动让整篇故事读得更懂——那还要靠多读书本身"
    claim:
      type: tendency
      statement: "干预效应沿『与教学的距离』衰减：离教学最近的结果（形态知识、拼写）效应最稳，越远（阅读理解、阅读流利度）越弱；形态教学改变的是『处理词的工具』，理解还取决于词量、背景知识与阅读量本身"
      evidence:
        - "Goodwin & Ahn (2010) Annals of Dyslexia 60(2): 183–208——17 项研究、79 个效应量，总效应 d=0.33（原文摘要级）"
        - "Goodwin & Ahn (2013) Scientific Studies of Reading 17(4): 257–285——30 项研究、92 个效应量，总效应 d=0.32；分项：解码 0.59、形态知识 0.44、词汇 0.34、拼写 0.30；阅读理解与流利度不显著（原文摘要级）"
      scope: "两轮样本以英语母语（含部分困难儿童）为主，中国 EFL 课堂效应预期应下调；2013 年『低龄受益最大』仅基于 30 项研究中的 4 项低龄研究，引用必须带此保留"
      exceptions:
        - note: "阅读理解与流利度在 2013 年元分析中不显著——拆词课不是阅读理解的直接药"
          word_ids: []
    mechanism:
      - beat: 距离衰减
        text_kid: "拆词课像给孩子一把好工具：认词、拼词马上变强；可读懂整篇故事，还得靠词够多、书读得多——工具再好，也不能代替盖房子本身。"
