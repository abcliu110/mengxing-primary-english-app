        sentence: "I expect good news."
        scene_note: "expect（ex- 往外 + spect 看：往外看→期待）在词库；inspect/respect 家族全量名单见挂接表"
        supports: claim
      - level: 2
        word_ids: [ADD_0676, ADD_0650, ADD_0658, ADD_0430]
