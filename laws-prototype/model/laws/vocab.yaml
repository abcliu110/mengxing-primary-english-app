  - id: V-24
    zone: 词汇解码
    group: V
    headline: "一个词里有一截变得听不懂时，说话人会自发把它替换成音近又说得通的熟悉词——民间词源是真实的造词力，它真的改掉了词形"
    headline_kid: "bridegroom 原来的后半截是 guma（男人），没人懂了，就被换成了 groom。crayfish 本来跟鱼没关系，是法国词 crevice 被听成了 cray-fish——词也会『听错+找补』"
    claim:
      type: etymology
      statement: "再分析（reanalysis）机制：不透明的成分 + 音近的熟悉词 + 说得通的语义，三件套齐备时词形被改定，改定的结果就是今天的标准词；触发器分三类：本族词退出使用、外语词入境落地、学者式误靠"
      source: "Wikipedia 'Folk etymology' 条（原文打开）逐例著录 bridegroom（古英语 brydguma）、crayfish（中古英语 crevis，同源法语 écrevisse）、sparrowgrass 及 Förstemann 1852 年铸词出处；Crystal《The Story of English in 100 Words》(2011) 第14词 bridegroom（书目+目录级）；Room《Dictionary of True Etymologies》(1986) 工具书"
      evidence:
        - "同机制例子成串：chaise lounge ← chaise longue；sparrowgrass 至今存活于方言与老式口语——不是个别人的口误"
      scope: "被民间词源改定的词形（bridegroom、crayfish）就是现行标准词，不可改回古形；sparrowgrass 只在方言层存活，未进标准语——同机制，结局分两等，须标明"
      exceptions:
        - note: "民间词源与假词源（V-25）必须分开：前者词形真的被改了，后者只是编了个假故事、词形没动"
          word_ids: []
    mechanism:
      - beat: 听错加找补
        text_kid: "词里有一截听不懂，大家就拿一个『听着像、说得通』的熟词顶上。顶成功了，这个词就换了新样子，一直用到今天。"
        text_adult: "学者式误靠也在此列：island 的 s 是文人按拉丁 insula 硬加的，该词本与 insula 无关。术语 folk etymology 是德语 Volksetymologie 的译借（Förstemann, 1852）。"
        visual: "词形拼图动画：旧部件（guma）褪色，新部件（groom）咔哒装上"
        anchors: [G3_127, G5_235]
