  - id: V-36
    zone: 词汇解码
    group: V
    headline: "词类变身机：给词根装不同的尾，就能把它变成动词、名词、形容词、副词——但每台变身机的『营业状态』不一样：-ness、-able、-ly 还通电，-tion、-ible 已封存"
    headline_kid: "词尾像变身按钮：act 装 -ion 变名词（action），装 -ive 变形容词（active）。有的按钮天天有人按，有的早就锈住了。认清哪些还通电，猜词和造词就都有谱"
    claim:
      type: tendency
      statement: "派生后缀按变出什么词类成菜单，其产出性与地层成反比倾向：日耳曼与已归化后缀（-ness、-ly、-able、-ful）活，深度拉丁后缀（-tion、-ible、-ance）封；产出性是梯度与语域函数，不是开关；每台机器还有选配限制（-ity 只认拉丁底、-en 只认单音节形容词）"
      evidence:
        - "Bauer《English Word-formation》(CUP, 1983) 与 Plag《Word-Formation in English》(CUP, 2003, 第3章产出性专论、第4章词缀派生)——-th 封存、-ness 高产等判断（二手系统论述级）"
        - "-able 全产出与 -ible 封闭的对比经 The Free Dictionary 语法专文逐点核对（新词 streamable、clickable 皆取 -able）"
        - "新词著录为最硬证据：近几十年词典新收派生词在 -ize、-ify、-able、-ness、-ly 名下成串出现，新造 -tion/-ible 词举不出"
      scope: "菜单是『变词类』的地图，不是意义的保证：-able 的被动义、-ful 的双读等语义细则须逐后缀另学"
      exceptions:
        - note: "-ate 说『有限』不等于零：化学与生物语域仍在造（differentiate 一线）；-ize 说『高产』不等于处处得体：公文写作指南常劝改用更朴素的动词"
          word_ids: [G4_0320, ADD_0577, ADD_0642, ADD_0480]
    mechanism:
      - beat: 四台变身机
        text_kid: "四台机器各管一变：变出动词的、变出名词的、变出形容词的、变出副词的。每台机器先看牌子：还通电的（-ness、-able、-ly）放心用；锈住的（-tion、-ible）只认老词，不许自己造。"
        text_adult: "动词化：-ize（高产）、-ify（产出）、-ate（存量大、新造有限）、-en（近封存）。名词化：-ness（最高产）、-ity（半产出）、-ment（衰退）、-tion/-sion（非活后缀，随拉丁词干整词进入）、-ance/-ence（停滞）、-er/-or（高产）。形容词化：-able（全产出）、-ful（产出中上）、-ous（低）、-ive（半产出）、-ible（封存）。副词化：-ly（近全产出；friendly、lonely 先占位，fast、hard 零形式）。"
        visual: "四台变身机并排，每台挂营业状态牌（通电/半通电/封存）"
        anchors: [G4_0320, G6_0856, G4_164, V6_情感_16]
    examples:
      - level: 1
        word_ids: [G4_0320, G5_0325, G5_0323]
        sentence: "Act, action, active."
        scene_note: "一根三变：act（动词）→ action（名词）→ active（形容词）；action/active 已入词库"
        supports: claim
      - level: 2
        word_ids: [G6_0856, G4_164]
        sentence: "Happy — happiness. He is friendly."
        scene_note: "-ness 通电例（happiness）；friendly 是 -ly 先占位的形容词例外（不是副词）"
        supports: claim
    error_cases:
      - wrong: "*breaktion（拿封存的 -tion 套新词基造词）"
        right: "-tion 不是活后缀：它随拉丁词干整词进入，英语内部不拿它造新词"
        error_type: 词缀选配误用
        source_type: 条目成人层登记的事故例
        diagnosis: "把封存机器当通电机器用（回 mechanism『四台变身机』营业状态牌）"
    relatives:
      - {id: V-20, rel: 同族}
      - {id: V-37, rel: 同族}
    quiz:
      - stem: "想给一个新词造『能……的』形容词，用哪个尾巴最靠谱？"
        options: ["-ible", "-able（还通电的活后缀）", "-tion"]
        answer: "-able（还通电的活后缀）"
        hint_ref: "mechanism『四台变身机』"
    probes: []
    prereq: [V-20]
    order: 36
    pain_points: [记不住]
    adult:
      sources: ["Bauer (1983)；Plag (2003) 第3、4章；TFD 语法专文『Commonly Confused Suffixes: -able vs. -ible』"]
      boundary: "产出性是倾向与语域的合成；变身有选配限制，菜单不能跨栏乱点；本条只管通道与营业状态，不管语义细则"
      disputes: "①-ize/-ise 之争：牛津传统许 -ize，英式出版多 -ise——两式皆合法、出版物从其体例，不作对错判。②『-tion 不是后缀而是词干的一部分』：结构派（Plag）与教学派口径不同；本条按结构派立论、教学上保留『认得出 -tion 名词』的操作目标，两层分开著录"
      evidence_grade: 二手系统论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V36-* 预留）", "scene_spec 待补"]
  - id: V-37
    zone: 词汇解码
    group: V
    headline: "后缀一来，拼写要让路：丢不丢 e、y 变不变 i、尾巴双不双写，每条让路规则都有原因——正字法为语音与形态让路"
    headline_kid: "加尾巴有四条交通规则：接元音尾先扔不发音的 e（make→making），但 change 的 e 得留着护住软音；辅音+y 变 i（happy→happiness）；短词一个元音一个辅音结尾，尾巴要双写（stop→stopped）"
    claim:
      type: tendency
      statement: "四组拼写让路规则是语料分布的真实概括：①e 的去留（默认去 e；软 c/g 后接 -able/-ous 保 e 守软音；避同形保 e；接辅音首后缀一般保 e）；②y→i（辅音后 y 接后缀变 i，接 -ing 不变，元音后 y 不变）；③双写（重读音节+单元音+单尾辅音且后缀元音开头；x/w/y 结尾永不双写；英美在 l 上分家）；④-able/-ible（能拆出完整词用 -able，拆出半截拉丁词根用 -ible）"
      evidence:
        - "规则骨架为正字法教学与用法词典通行著录，经 The Free Dictionary 语法专文『Commonly Confused Suffixes』（含 -mit→-missible 与 limit 反例）与多家拼写规则文献交叉核对（二手系统论述级）"
        - "可证伪点：*happyness、*stoping（表『停』）、*visitted 在语料中系统性缺席；孩子把 refer 写成 *refered、visit 写成 *visitted，正是重音条件没掌握的两类镜像错误——错误分布反证条件结构真实"
      scope: "四条都是带例外的倾向，不是算法：教学口径是『默认走规则、例外进名单』；双写规则的前提是重音位置已知，须与 S-27（重音）合教"
      exceptions:
        - note: "接辅音首后缀保 e 的固化例外：truly、awful、argument"
          word_ids: [G6_0847, ADD_0423, ADD_0413]
        - note: "-able 前有一批两写词：lovable/loveable、movable/moveable（词典多以 lovable 为主形）"
          word_ids: [ADD_0565, ADD_0583]
        - note: "-able/-ible 判据有例外带：accessible、flexible、contemptible 剩整词却用 -ible；-ible 一侧全名单不过百余词，最终靠认读存量解决"
          word_ids: [ADD_0395, ADD_0511]
        - note: "y→i 的摇摆带：shyly、dryly/drily 单音节词两写并行"
          word_ids: []
    mechanism:
      - beat: 为语音让路
