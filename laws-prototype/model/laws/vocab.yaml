  - id: V-32
    zone: 词汇解码
    group: V
    headline: "拆词有天花板：学校英语的派生词中完全透明者只占约 56–62%，约 18–24% 基本不可推——必须当作独立词另学。拆词是强工具，不是万能钥匙"
    headline_kid: "拆词像开锁：很多锁能开，可有些词是『假锁』——invaluable 不是『没有价值』，恰恰是『价值极高』。所以拆完猜完，一定要查一查、对一对"
    claim:
      type: tendency
      statement: "透明度是连续谱，由三件事共同决定：词基认不认识、词缀义稳不稳定、组合义有没有在历史上漂移；按 Nagy & Anderson 五级量表（SEM 0 完全可推 → SEM 5 完全不可推），SEM 0–1 占约 56–62%，SEM 3–5 占约 18–24%（随计数口径）"
      evidence:
        - "Nagy & Anderson, Technical Report No. 253 (1982, ERIC ED218596) 表5、表6 透明度分布（原文级，两表直读并按小计回推校验）；Anderson & Nagy (1993) Technical Report No. 570"
      scope: "透明度没有公认测法：按直接来源词计 SEM 3–5 约 24%，按最相近义项计约 18%——引用任何单一百分比必须连口径一起报"
      exceptions:
        - note: "词频越低，派生词的透明比例反而越高（低频词多是晚近按规则现造、漂移时间短）——天花板主要压在中高频的古老派生词上"
          word_ids: []
    mechanism:
      - beat: 两种拆不动
        text_kid: "拆不动有两种：一种是零件不认识（词根没学过），先去补零件；一种是零件都认识、拼出来的意思却变了味（假锁），只能整个记住。先分清是哪一种，再对症下药。"
        text_adult: "根缺失型（dict、port 等黏着词根不认识→补根，见 V-21）与关系不透明型（invaluable 的 in- 是加强非否定；restive 实义『焦躁难驭』）分治。与 V-12 语境猜义天花板、V-10 形似误认并称『三堵墙』，共同操作结论：猜后必须验。"
        visual: "开锁动画：多数锁打开，两把假锁标红——一把缺零件、一把锁芯变了"
        anchors: [G6_0331]
    examples:
      - level: 1
        word_ids: [G6_0331, ADD_0546, ADD_0625]
        sentence: "Predict = pre- (before) + dict (say)."
        scene_note: "根缺失型正例：predict 的 pre- 就是『预先』，组合义成立；难在 dict 不认识（清单纠正，见 corrections）"
        supports: claim
      - level: 2
        word_ids: [ADD_0546]
        sentence: "This book is invaluable."
        scene_note: "关系不透明型假锁标本：invaluable = 贵重到没法估价，不是『没有价值』——拆对零件、猜反意思，猜后必须验的招牌例"
        supports: claim
    error_cases:
      - wrong: "invaluable = 没有价值的（按 in- 否定硬拆）"
        right: "invaluable = 贵重得无法估价；此词的关系不透明，整词记"
        error_type: 假拆分
        source_type: 条目成人层登记的事故例
        diagnosis: "把加强义 in- 当否定 in-（回 mechanism『两种拆不动』之关系不透明型）"
    relatives:
      - {id: V-29, rel: 同族}
      - {id: V-15, rel: 同族}
      - {id: V-12, rel: 同族}
      - {id: V-10, rel: 同族}
    corrections:
      - "『约半数派生词的意义不能从根+缀可靠推出』无一手出处且偏高：按 N&A 自家量表，基本不可推者（SEM 3–5）约五分之一到四分之一；定版表述为『完全透明者只占一半多，其余或多或少要打折』，『约半数不可推』不予采用"
      - "predict 例任务书亦误：pre- 的确就是『预先/在前』，predict＝预先说→预言，组合义本身成立；它对孩子的墙是 dict 黏着词根不认识（根缺失型），不是前缀不表『预先』——两类失败解法不同，混为一谈会开错药"
    quiz:
      - stem: "拆词猜完意思，下一步必须做什么？"
        options: ["直接当答案用", "查一查、对一对，验证了才算数", "猜错就再也不拆了"]
        answer: "查一查、对一对，验证了才算数"
        hint_ref: "mechanism『两种拆不动』"
    probes: []
    prereq: [V-30]
    order: 32
    pain_points: [记不住, 错不完]
    adult:
      sources: ["Nagy & Anderson TR No. 253 (1982) 表5/表6；Anderson & Nagy (1993) TR No. 570；新古典拼装件传统：Ayers 第2版医学组合形诸课"]
      boundary: "百分比必须连口径报；新古典拼装件（telephone、biology）不得把拼装件说成『古希腊词』——『古』只在零件不在整词；『记 300 个组合形解码上万科学词』未核到一手统计，只登记为课程宣传口径，待核，不作断言"
      disputes: "透明度测法未决（口径差 18% vs 24%）；教学顺序之争与 V-12 同源（策略派先教猜 vs 词量派先保词量），共识底线只有一条：任何一堵墙都不支持『光靠猜就能代替学词』"
      evidence_grade: 原文级
      pending: ["『300 个组合形解码上万科学词』一手统计待核（清单已登记）"]
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V32-* 预留）", "scene_spec 待补"]
  - id: V-33
    zone: 词汇解码
    group: V
    headline: "词缀的头部定律：20 个前缀管住带前缀词的 97%，前 4 个（un-、re-、in- 否定、dis-）占 58%——先学一小撮，阅读里的大头全归队"
    headline_kid: "英语前缀有一大群，可真正常出来干活的就一小撮：un-、re-、in-、dis- 这四个『班长』占了书里带前缀词的一大半。先把这一小撮学透，比背一百个前缀的大表有用得多"
    claim:
      type: tendency
      statement: "学校阅读语料中带前缀词的分布是幂律式头部集中：un- 一家占 26%，前三（un-、re-、in- 否定）合计 51%，前四（加 dis-）合计 58%，20 个前缀的清单覆盖 97%"
      evidence:
        - "White, Sowell & Yanagihara (1989) 'Teaching Elementary Students to Use Word-Part Clues', The Reading Teacher 42(4): 302–308——语料为 Carroll, Davies & Richman《The American Heritage Word Frequency Book》(1971) 三至九年级教材统计；关键句经 Marzano (2004) 逐字转引核对（原文引文级）"
      scope: "百分比是带前缀词在学校阅读语料中的出现份额（频次口径），不是词典词条种类的比例；语料是 1970 年代美国教材，中国学生阅读语料构成不同，名次细节不可直接搬用——可搬的是『头部集中、先教高频小集合』的结构事实"
      exceptions:
        - note: "高频前缀恰恰多义、易假拆：uncle 不是 un- 前缀、reason 不是 re- 前缀——White et al. 第一课专设 tricksters 辨假环节"
          word_ids: [G2_067, ADD_0615]
    mechanism:
      - beat: 头部小集合
        text_kid: "前缀班里有四个班长，活儿占了一大半。先把班长学透，书里的带前缀词就大半有认识的『门卫』了。"
        text_adult: "定版 20 名单：un-、re-、in-（否定）、dis-、en-/em-、non-、in-/im-（向内）、over-、mis-、sub-、pre-、inter-、fore-、de-、trans-、super-、semi-、anti-、mid-、under-。计数口径：两个 in- 分列、en-/em- 合并计一；引用以此口径为准。义项分工（in- 两职、re- 两义、un- 兼『做反动作』）见 V-35、V-39。"
