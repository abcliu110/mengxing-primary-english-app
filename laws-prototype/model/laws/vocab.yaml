          word_ids: []
    mechanism:
      - beat: 树干与树枝
        text_kid: "先认树干（最中心的意思），再顺着树枝认其他意思：它们都是从树干长出来的亲戚。"
        text_adult: "引申操作三件：隐喻（相似）、转喻（相邻）、图式化。中心义的判定（引申关系）与最高频义（语料构成）是两把尺，见 V-45。"
