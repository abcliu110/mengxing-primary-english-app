    headline: "词的可分析性从全透明到全不透明是一条连续谱：透明的真拆，不透明的整记，半透明的注明『只是帮记』；假分析会给记忆挂上错误的故事"
    headline_kid: "有些词是真积木，能拆开看；有些词看着像积木，其实是一整块石头，硬拆会拆错——拆之前先确认它真的是积木"
