# 规律模型 · 词汇解码区（V 组 45 条）
# 入模波次 W2。源：专家规律清单 v6 之 V 组（V-01–V-45），逐条按 DESIGN §3 schema 转化。
# 纪律：claim 只用清单定版口径；已纠正的伪说法只进 corrections，不进 claim。
# 例词只引词库 id；库外词进 pending_words 走补词流程，不自造 id。
# 探针：仅旗舰 V-40、V-33 有探针库 v1 现成探针（PRB-* 编号按 DESIGN §3.6 格式映射探针库分组序号）；其余登记待补。
meta:
  group: V
  zone: 词汇解码
  source: expert-summaries-catalog-v6.md（V 组）+ catalog_add_etymology/roots_evidence/affixes/polysemy 簇源
  modeled_at: 2026-11-01
  schema: DESIGN.md §3.1
entries:
  - id: V-01
    zone: 词汇解码
    group: V
    headline: "知道一个词 = 形（音、拼写、构成）、义（概念、联想、多义）、用（语法行为、搭配、场合）三面都建立了联结；缺哪一面，就在哪一面出错"
    headline_kid: "一个词有好多面：长什么样、读什么音、是什么意思、和谁是好朋友、什么时候能说——全认识了，才算真会"
    claim:
      type: tendency
      statement: "词知识由形/义/用三维多格构成，各通道分别建链；只背中文意思只建了其中一格，会认不会用、会拼不会搭都是某条通道没建好"
      evidence:
        - "Paul Nation《Learning Vocabulary in Another Language》(2001；第2版 2013, CUP)——knowing a word 形/义/用三维表为全书分析框架（二手论述级，经 Elgort & Nation 综述章转述）"
      scope: "词汇知识的分析框架；是清单，不是习得顺序"
      exceptions:
        - note: "低龄阶段以音形与核心义优先，搭配、语域等维度随年龄后长——三面齐备是目标态，不是入门门槛"
          word_ids: []
    mechanism:
      - beat: 三面格子
        text_kid: "认识一个词像认识一个新同学：要知道他长什么样、叫什么、喜欢和谁玩、什么场合说什么话。只知道名字，不算真认识。"
        text_adult: "Nation 三维表：形（口语形、书面形、词部件）、义（形义联结、概念与所指、联想）、用（语法功能、搭配、约束）。测验与课程按此拆解，不只测词义配对。"
        visual: "九宫格图式：一个词卡中央，周围九格逐格点亮"
        anchors: [G1_002]
      - beat: 缺面即错面
        text_kid: "哪一面没学好，就会在哪一面出错：会读不会搭，就会说出外国腔的句子。"
        text_adult: "记忆是多通道分别建链；诊断词汇错误先定位是哪一维缺失，再补哪一维。"
        visual: "九宫格中一格灰暗，对应一句搭配错误句浮现"
        anchors: []
    examples:
      - level: 1
        word_ids: [G1_002]
        sentence: "This is a book. I read a book."
        scene_note: "教室里拿起一本书——音、形、义、用四格同屏"
        supports: claim
      - level: 2
        word_ids: [V6_日常_4, ADD_0070]
        sentence: "Make a decision."
        scene_note: "decision 的『用』：它的伙伴是 make，不是 do（与 V-07 互挂）"
        supports: claim
    error_cases:
      - wrong: "Do a decision."
        right: "Make a decision."
        error_type: 搭配迁移
        source_type: 教学文献登记错型
        diagnosis: "只建了 decision 的义，没建它的搭配面（回 mechanism『缺面即错面』）"
    relatives:
      - {id: V-07, rel: 同族}
      - {id: V-15, rel: 同族}
    quiz:
      - stem: "小明会读、会拼 decision，还知道它是『决定』，可他说了 Do a decision。他缺的是哪一面？"
        options: ["形", "义", "用（搭配）"]
        answer: "用（搭配）"
        hint_ref: "mechanism『缺面即错面』"
    probes: []
    prereq: []
    order: 1
    pain_points: [记不住, 说不出]
    adult:
      sources: ["Nation (2001/2013)《Learning Vocabulary in Another Language》, CUP；框架转述：Elgort & Nation 综述章（ResearchGate 305204504）"]
      boundary: "框架是清单，不是习得顺序；低龄阶段音形与核心义优先"
      disputes: "无（框架为学界共识；分歧只在各维度教学权重）"
      evidence_grade: 二手论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V01-* 预留）", "scene_spec 待补"]
  - id: V-02
    zone: 词汇解码
    group: V
    headline: "词频是陡峭的幂律分布：先攻最常用的约 2000 个词族，覆盖日常文本约八成词次，回报率最高"
    headline_kid: "英语里有一小队『劳模词』，到处都是它们；先把劳模词认全，书里的大部分字一下子就都认识了"
    claim:
      type: tendency
      statement: "学习顺序按频率排，等于按『每学一词能解锁多少文本』排；GSL 前两千词族合计覆盖普通文本约八成词次（随语料类型浮动）"
      evidence:
        - "Michael West《A General Service List of English Words》(1953, Longmans)——2000 词族通用词表；覆盖率原始数据见 Coxhead (2000)：GSL 第一千词族覆盖学术语料 71.4% 词次（二手论述级）"
        - "Nation 后续以 BNC/COCA 语料重制分级表承其框架"
      scope: "覆盖率按词次（token）计，不等于理解率；数字随语料类型浮动"
      exceptions:
        - note: "GSL 是 1953 年的表，computer 一类新高频词缺位，现代应用以其后继表（NGSL 等）为准"
          word_ids: [G4_155]
        - note: "儿童读物词频分布与成人语料不同，需按年龄语料校准"
          word_ids: []
    mechanism:
      - beat: 幂律分布
        text_kid: "书里的词不公平：少数词出现一遍又一遍，多数词只露一次脸。先认露脸最多的，书一下子就好读了。"
        text_adult: "词次分布极不均匀；词族杠杆的量化锚见 V-29（每基本词平均带 1.57 个透明派生词）。"
        visual: "柱状图：一小撮高柱（高频词）罩住大部分文本面积"
        anchors: []
      - beat: 词族口径
        text_kid: "学一个词，它的亲戚（长得像的词）常常顺带就认得了——所以数词要按『家』数。"
        text_adult: "计数单位（词族/词目/词形）会改变同一结论的数字，引用词汇量数字必须连口径一起引（见 V-29 边界）。"
        visual: "一棵词族树：树干一个词，枝上挂亲戚词"
        anchors: [G2_087]
    examples:
      - level: 1
        word_ids: [G1_002, G1_015]
        sentence: "I read a book about a dog."
        scene_note: "绘本一页：book、dog 都是到处露脸的劳模词"
        supports: claim
      - level: 2
        word_ids: [G4_155]
        sentence: "I use a computer at school."
        scene_note: "computer 在 1953 年词表里缺位——老词表要更新（例外同屏）"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-29, rel: 同族}
      - {id: V-03, rel: 同族}
    quiz:
      - stem: "先学哪批词最划算？"
        options: ["按字母表顺序", "按出现频率从高到低", "按笔画多少"]
        answer: "按出现频率从高到低"
        hint_ref: "mechanism『幂律分布』"
    probes: []
    prereq: []
    order: 2
    pain_points: [记不住, 读不快]
    adult:
      sources: ["West (1953) GSL；Coxhead (2000) 学术词表与覆盖率原文；eapfoundation 词表综述页"]
      boundary: "覆盖率按词次算，不等于理解率；GSL 年代局限见 exceptions"
      disputes: "以词族还是词目/词形为计数单位会改变数字，学界口径未完全统一"
      evidence_grade: 二手论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V02-* 预留）", "error_cases 待补（本条为排序原则，无清单登记的病句病例，不自编）", "scene_spec 待补"]
  - id: V-03
    zone: 词汇解码
    group: V
    headline: "生词密度决定理解是否崩盘：认识约 95% 的词只能吃力猜读，达到约 98% 才能流畅理解并顺带猜出生词"
    headline_kid: "一页书里不认识的词太多，就像拼图缺了太多块，整幅画拼不出来；只缺一两块，才能猜出那块是什么"
    claim:
      type: tendency
      statement: "覆盖率是阅读理解的阈值变量：低于阈值理解断崖式下降，约 98% 是群体平均的『足够理解』线；猜义靠周围认识的词作锚点，锚点断裂则理解非线性崩塌"
      evidence:
        - "Nation (2006) 'How large a vocabulary is needed for reading and listening?', Canadian Modern Language Review 63(1)——98% 覆盖需 8000–9000 词族（二手论述级）"
        - "Laufer 自 1989 年起的词汇阈值（lexical threshold）系列实验：低于阈值理解分数断崖式下降"
      scope: "群体平均线，不是每个孩子每本书的铁律；小学阶段的落地形式是分级读物覆盖率控制，不是背 8000 词"
      exceptions:
        - note: "背景知识熟悉的话题可部分补偿覆盖率不足（补偿派），代偿有上限"
          word_ids: []
    mechanism:
      - beat: 锚点
        text_kid: "猜生词要靠旁边的熟词帮忙。熟词太少，帮手都不在，猜也猜不动。"
        text_adult: "猜义 = 用已知词与背景知识对生词作约束求解；约束不足时解必错（与 V-12 互为表里）。"
        visual: "拼图动画：缺块少时可补全，缺块过半画面崩解"
        anchors: []
    examples:
      - level: 1
        word_ids: [G2_087, G1_015]
        sentence: "I run with my dog."
        scene_note: "全是熟词的一句——读得顺"
        supports: claim
      - level: 2
        word_ids: [G1_002]
        sentence: "I read a book."
        scene_note: "分级读物选书演示：一页只留一两个生词，其余全是锚点"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-12, rel: 同族}
      - {id: V-02, rel: 前置}
    quiz:
      - stem: "一页书里有好多生词，越读越糊涂。最对症的办法是？"
        options: ["硬猜到底", "换一本生词更少的书", "把每个生词抄十遍"]
        answer: "换一本生词更少的书"
        hint_ref: "mechanism『锚点』"
    probes: []
    prereq: [V-02]
    order: 3
    pain_points: [读不快, 记不住]
    adult:
      sources: ["Nation (2006) CMR 63(1)；Laufer 词汇阈值系列 (1989–)"]
      boundary: "98% 是平均线；背景知识可部分补偿"
      disputes: "阈值派（Laufer）与补偿派之争：分歧在代偿上限；Laufer 本人亦承认知识补偿存在"
      evidence_grade: 二手论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V03-* 预留）", "error_cases 待补（无清单登记病例，不自编）", "scene_spec 待补"]
  - id: V-04
    zone: 词汇解码
    group: V
    headline: "词汇习得需要四种学习条件大致均衡：意义导向输入、意义导向输出、语言导向学习、流利度发展——只背单词表只占四分之一"
    headline_kid: "学词像吃饭要营养均衡：多听多读、多说多写、认真研究、反复用熟——四样都要有"
    claim:
      type: tendency
      statement: "四股分别建设词知识的不同侧面（遇见建识别、用出建提取与精确度、专学建形式细节、流利练自动性），不能互相替代"
      evidence:
        - "Nation 四股（four strands）框架：Nation (2007) 及《Learning Vocabulary in Another Language》第2版 (2013) 课程设计章（二手论述级，经 Coxhead 2018 综述转述）"
      scope: "课程层面的配比原则，不要求每节课四等分"
      exceptions:
        - note: "低龄段输入与流利股的比重应更高——均衡是按发展阶段调过的均衡"
          word_ids: []
    mechanism:
      - beat: 四股分工
        text_kid: "听读是『遇见』，说写是『用出来』，研究词是『看仔细』，反复用是『练熟』。四件事做四种活，少一样都不完整。"
        text_adult: "四股与 V-01 的形/义/用各维对应供血；单词卡属专学还是流利练习之争见分歧栏。"
        visual: "四条腿的桌子图式，抽掉一条即倾斜"
        anchors: []
    examples:
      - level: 1
        word_ids: [G2_0642, G2_0492]
        sentence: "I listen and read every day."
        scene_note: "输入股：每天听读遇见词"
        supports: claim
      - level: 2
        word_ids: [G3_0619, G3_0487]
        sentence: "I speak and write with my words."
        scene_note: "输出股 + 流利股：把词用出来、用熟"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-01, rel: 同族}
      - {id: V-17, rel: 同族}
      - {id: V-11, rel: 同族}
    quiz:
      - stem: "小明每天只背单词表，从不开口说。他缺了四股里的哪几股？"
        options: ["只有输入股", "输出、流利等股都缺", "四股都齐了"]
        answer: "输出、流利等股都缺"
        hint_ref: "mechanism『四股分工』"
    probes: []
    prereq: [V-01]
    order: 4
    pain_points: [记不住, 说不出]
    adult:
      sources: ["Nation (2007)；Nation (2013) 第2版课程设计章；Coxhead (2018) 综述转述"]
      boundary: "配比是课程层原则；低龄段输入与流利比重更高"
      disputes: "无主流分歧；争议在各股的具体活动形式（如单词卡的归属）"
      evidence_grade: 二手论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V04-* 预留）", "error_cases 待补（无清单登记病例，不自编）", "scene_spec 待补"]
  - id: V-05
    zone: 词汇解码
    group: V
    headline: "母语者产出的很大一部分是整块取用的现成组合；语言的底盘是『被语法组织起来的词汇』，不是『先有语法再填词』"
    headline_kid: "说英语像搭乐高：高手手里有很多拼好的小组件，拿来就用；一个一个零件现拼，又慢又容易拼错"
    claim:
      type: tendency
      statement: "整块储存、整块提取省去逐词拼装的加工成本；流利与地道主要来自块的库存量，块独立于语法库存（语法已好时搭配错误仍是主要错误源）"
      evidence:
        - "Michael Lewis《The Lexical Approach》(1993, LTP) 及《Implementing the Lexical Approach》(1997)——块的分类（二手论述级）"
        - "Bahns (1993, ELT Journal 47(1)) 对比研究：学习者语法已很好时，搭配错误仍是主要错误源"
      scope: "儿童阶段只收高频交际块"
      exceptions:
        - note: "块学得再多也不能取消语法概括，否则生成新句子的能力封顶"
          word_ids: []
    mechanism:
      - beat: 整块取用
        text_kid: "现成的句子块像拼好的乐高小车，拿来就能跑；现拼的要一个零件一个零件对，慢，还容易装错。"
        text_adult: "块的心理现实性见 V-06（整存整取通道）；Bahns 的反证说明块库存不随语法水平自动增长。"
        visual: "乐高组件墙：整块组件与散件两区对比"
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_日常_4, ADD_0070]
        sentence: "Make a decision."
        scene_note: "整块存取的搭配块（与 V-07 同例互挂）"
        supports: claim
      - level: 2
        word_ids: [V6_日常_6, G4_0381]
        sentence: "Take a photo."
        scene_note: "take a photo 是整块，不是 take 的义项临时拼装"
        supports: claim
    error_cases:
      - wrong: "Do a decision."
        right: "Make a decision."
        error_type: 搭配迁移
        source_type: 教学文献登记错型
        diagnosis: "逐词拼装而非整块取用（回 mechanism『整块取用』）"
    relatives:
      - {id: V-06, rel: 同族}
      - {id: V-07, rel: 同族}
    quiz:
      - stem: "『make a decision』应该怎么学？"
        options: ["拆成三个词分别背", "整块记住、整块用", "先学语法再填词"]
        answer: "整块记住、整块用"
        hint_ref: "mechanism『整块取用』"
    probes: []
    prereq: [V-01]
    order: 5
    pain_points: [说不出, 写不长, 记不住]
    adult:
      sources: ["Lewis (1993, 1997)；Bahns (1993) ELT Journal 47(1): 56–63；British Council / ELT Concourse 词汇法介绍"]
      boundary: "块不能无限背：儿童阶段只收高频交际块；块不能取消语法"
      disputes: "批评者指词汇法对『块如何被再分析、长成语法』交代不足；Lewis 阵营以归纳式课堂补足。此分歧未决，教学上块与规则并行"
      evidence_grade: 二手论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V05-* 预留）", "scene_spec 待补"]
  - id: V-06
    zone: 词汇解码
    group: V
    headline: "心理词库是词素、单词、词块、整句并存的多规格仓库；大脑优先抓现成的大块用，因为省力"
    headline_kid: "脑子里的词仓库什么尺寸都有：单个的词、成串的短语、整句话——说话时先伸手拿大件，省事又快"
    claim:
      type: tendency
      statement: "整体加工与分析加工是并行双通道；高频组合走整取通道，这是程式化序列处理速度优势的心理基础"
      evidence:
        - "Alison Wray《Formulaic Language and the Lexicon》(2002, CUP) 及续作 (2008)——程式化序列定义与异质词库模型（二手论述级）"
        - "Conklin & Schmitt (2008) 眼动/反应时实验：程式化序列处理快于同长新造组合"
      scope: "整取优势随熟练度与频率变化"
      exceptions:
        - note: "学习者库存中的块若从未被分析，可能成为化石化错误的外壳"
          word_ids: []
    mechanism:
      - beat: 双通道
