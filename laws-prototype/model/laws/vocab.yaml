  - id: V-41
    zone: 词汇解码
    group: V
    headline: "长得一样的两堆意思，可能是一个词长出的分支（多义），也可能是历史上撞脸的两个词（同形异义）——义项是编词典的人按词典的使命切出来的，没有客观刻度"
    headline_kid: "river bank（河岸）和 money bank（银行）是两个词穿了同一件衣服，叫『撞脸』；eye 和针眼是一个词的亲戚。有个小游戏能验：把两个意思塞进同一句话，听着别扭得像笑话，多半是撞脸或远亲"
    claim:
      type: tendency
      statement: "判定有工具（zeugma 轭式测试、词源考），但义项切分（sense division）取决于词典使命：历史词典按历史原则求全求细，学习词典按教学可用性合并——同一个 run，OED3（2011 修订）动词切 645 项、OED 官网现行页自报 245 meanings、学习词典（OALD9+COBUILD9）计 46 项，三数都对，口径不同"
      evidence:
        - "Gilliver (2013) 'Make, put, run: Writing and Rewriting Three Big Verbs in the OED', Dictionaries 34: 10–23——run 词条 645 个义项、整条约 124000 词、耗时九个月（二手互证级）"
        - "Fang & Liu (2022) 按 OALD9 与 COBUILD9 计得 run 共 46 个义项（期刊原文级，见 V-45 出处）"
        - "zeugma 与交叉读法测试的系统讲义：剑桥大学语言学 L113《Word Meaning and Discourse Understanding》课程讲义（讲义原文级）"
        - "Stamper《Word by Word: The Secret Life of Dictionaries》(2017)——编者关于义项切分与合并派/细分派的一线自述（出版社书目级）"
      scope: "zeugma 是启发式工具，不是判决机；判定教学只取『撞脸 vs 亲戚』的直觉层，不取测试的技术结论；引用义项数必须携带口径（版本、词性、粒度）"
      exceptions:
