  - id: V-38
    zone: 词汇解码
    group: V
    headline: "假拆分三型须分别诊断：压根没零件（butter 的 -er 不是『做事的人』）、零件是真而组合义已死（butterfly）、零件是真而零件的义已变（understand 的 under 是古义）"
    headline_kid: "拆词先问一句：拆出来的零件是真的吗？拆对了，意思对得上吗？butter 的 er 不是『人』；butterfly 能拆也猜不出为什么叫这个名；understand 的 under 是老早以前的意思，不是今天的『在下面』"
    claim:
      type: etymology
      statement: "三型病理：①伪词缀——butter 源于希腊语 boútyron 经拉丁语借入，-er 是借词词干的一部分，与施事 -er 无关；river 经古法语上溯拉丁语 rīpa（河岸），-er 同为词干残段。②可分割而不可组合——butterfly 分割成立（古英语 buttorflēoge = butter + fly），但命名动机晦暗无定论。③古义残留——understandan 确由 under + standan 构成，但前缀取古义『在……之间』，现代义无法由今义拼出"
      source: "butterfly 词源：Collins、American Heritage、Random House 诸词典一致著录古英语 buttorflēoge = butter + fly，动机作『perhaps』级猜测；Etymonline 同条著录 'evidently butter + fly, but of obscure signification' 并列三说；butter 的希腊—拉丁来源、river 的 rīpa 来源、understandan 的构成为词源词典通说（二手系统论述级；OED 原文未直接打开，其观点经 Language Log 转述核对）"
      evidence:
        - "三型各有硬证据：butter/river 的 -er 若真是施事后缀，应有对应动词词基（*butt、*rive 作相关动词不成立）；butterfly 分割有古英语原文形态直接支持；understandan 早期即作『理解』用、不作『站在下面』用"
      scope: "辟谣的边界是『不许硬拆』，不是『不许联想』：把 butterfly 记成『黄油色的飞虫』作记忆术完全合法，但助记与词源必须分开标（V-08 纪律）"
      exceptions:
        - note: "butterfly 不是『拆错了』，是『拆对了也解不出』——把它与 butter/river 并列作假拆分会误导；三型分开，才是可教的辟谣（本条即纠正此含混，见 corrections）"
          word_ids: [G3_0759]
    mechanism:
      - beat: 三型诊室
        text_kid: "拆不动的词进三间诊室：一号，没零件——别拆；二号，有零件、猜不出为什么——拆开看可以，意思另记；三号，零件的意思变了——故事可讲，拼法不可用。"
        text_adult: "判断分两步：『可分割』与『可组合解义』是两个独立判断（与 V-10 透明性谱、V-15 拆词纪律同轴）。词源动机无定论处须保持 perhaps 级措辞。"
        visual: "三间诊室门牌：butter（一号）、butterfly（二号）、understand（三号）各进各屋"
        anchors: [V6_食物_17, G3_0759, G5_232]
    examples:
      - level: 1
        word_ids: [V6_食物_17, G5_232]
        sentence: "Butter is yellow. The river is long."
        scene_note: "一号诊室组：butter 与 river 的 -er 都是词干残段，不是施事后缀"
        supports: claim
      - level: 2
        word_ids: [G3_0759, V6_学校_71]
        sentence: "A butterfly is in the garden. I understand."
        scene_note: "二号诊室 butterfly（可拆不可解）对三号诊室 understand（under 取古义『在……之间』，今义不可由今义拼出）"
        supports: claim
    error_cases:
      - wrong: "butter = butt + er，『一个叫 butt 的人』（把借词词干残段当施事后缀）"
        right: "butter 整词记：-er 是希腊—拉丁借词词干的一部分，与 teacher 的 -er 只是同形"
        error_type: 假拆分
        source_type: 条目成人层登记的事故例
        diagnosis: "伪词缀型假拆（回 mechanism『三型诊室』一号室）"
    relatives:
      - {id: V-15, rel: 同族}
      - {id: V-10, rel: 同族}
      - {id: V-32, rel: 同族}
    corrections:
      - "任务书把 butterfly 与 butter/river 并列作『假拆分』是含混：butterfly 在分割层面确为 butter + fly（古英语 buttorflēoge），『非 butter+fly 组合』只在语义组合层面成立——本条分两层讲清，三型分开著录"
    quiz:
      - stem: "butterfly 能拆成 butter + fly，为什么还是猜不出它的意思来源？"
        options: ["因为拆错了", "拆是真拆，但它为什么叫这个名，没有定论", "因为 fly 不认识"]
        answer: "拆是真拆，但它为什么叫这个名，没有定论"
        hint_ref: "mechanism『三型诊室』"
    probes: []
    prereq: [V-15]
    order: 38
    pain_points: [错不完, 记不住]
    adult:
      sources: ["Collins / AHD / Random House 词典著录；Etymonline butterfly 条；OED 观点经 Language Log 转述"]
      boundary: "不许硬拆≠不许联想（助记与词源分开标）；动机无定论处保持 perhaps 级措辞"
      disputes: "butterfly 命名动机三说并立（翼色说/偷食民俗说/荷兰语排泄物说），词典间措辞互有出入——登记为未定，不裁决。understandan 中 under 的古义有『之间』说与『在下→深入』说两解，教学只标『古义非今义』"
      evidence_grade: 二手系统论述级
      pending: []
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V38-* 预留）", "scene_spec 待补"]
  - id: V-39
    zone: 词汇解码
    group: V
    headline: "词缀怎么教才有效：先立概念、防假拆，再按义项分课教『小集合』；而且要和语境一起教，不要单独教——词缀教学的红利在『自己解新词』，不在『学得快课本词』"
    headline_kid: "学前缀后缀有个好办法：先分清真假前缀（uncle 里的 un- 是冒牌的），一次只学几个最有用的，把每个的几个意思分开学，最后把零件用到句子里去猜生词"
    claim:
      type: tendency
      statement: "三股可核传统与实证合流：①课序传统（White, Sowell & Yanagihara 1989 六课序列：立概念辨真伪→按义项逐课教否定/再回/反动作/向内诸义→扩到 en-/em-/over-/mis-）；②实证对照（Baumann 团队：学形态分析的组别在推断含词缀生词上优于对照；混合教学组的优势在延迟后测才显现）；③词缀教学的收益射程明确：强在解未学新词，不加速课本词学习、不直接抬阅读理解总分"
      evidence:
        - "White et al. (1989) 六课序列经 Marzano (2004) 转引原文核对（六课主题与 tricksters 例词逐课一致）（原文引文级）"
        - "Baumann et al. (2002) Reading Research Quarterly 37: 150–176——88 名五年级、四组设计（二手系统论述级，经 Ebbers 2008 综述转述）"
        - "Baumann et al. (2003) American Educational Research Journal 40(2): 447–494——157 名五年级准实验，结论四条经 APA PsycNet 摘要核对（摘要原文级）"
      scope: "两研究的被试是美国母语五年级学生、周期以周计，迁移到中国 EFL 课堂须打折看，剂量更不可直搬"
      exceptions:
        - note: "2003 年研究中 TV（教材词汇）组学课本词更强——词缀教学不加速课本词学习，短期测评会系统性低估它（红利在延迟后测兑现）"
          word_ids: []
    mechanism:
      - beat: 六课课序
        text_kid: "第一课先练眼力：哪个 un- 是真的，哪个是冒牌的。然后一课学一个意思：un- 的『不』、re- 的『再』和『回』分开学。学过的零件马上拿去句子里猜生词。"
        text_adult: "六课序列的设计逻辑：选取服从 V-33 的频率头部、义项逐个拆开、假拆从第一课防起。课序传统属『研究者处方』等级，与 Baumann 的实验结论分开标级，不许混报为『六课序列已被实验证明』。"
        visual: "六级台阶图：每级一块义项牌，台阶尽头是『拿去句子里用』的门"
        anchors: [G2_067, G4_0457, ADD_0157]
    examples:
      - level: 1
        word_ids: [G2_067, G4_0457]
        sentence: "Uncle — no. Unhappy — yes."
        scene_note: "第一课辨假：uncle 的 un- 是冒牌货，unhappy 的是真前缀"
        supports: claim
      - level: 2
        word_ids: [ADD_0157, ADD_0250, G5_0466, ADD_0310]
        sentence: "Incorrect = in- (not) + correct."
        scene_note: "按义项分课样本：否定 in- 单独一课；re- 两义（reread 再读/return 返回）与 un- 反动作义（untie）同屏预告"
        supports: claim
    error_cases:
      - wrong: "uncle 里有 un-，所以 uncle 和『不』有关系（未辨假先套义）"
        right: "uncle 是整词，无前缀——辨真伪是拆词的第一课"
        error_type: 假拆分
        source_type: 条目成人层登记的事故例
        diagnosis: "跳过立概念环节直接套前缀义（回 mechanism『六课课序』第一课）"
    relatives:
      - {id: V-33, rel: 同族}
      - {id: V-31, rel: 同族}
      - {id: V-38, rel: 同族}
    corrections:
      - "对照框架纠偏：不存在『纯词缀教学 vs 混合法』的同场胜负数据——2003 年研究里混合组（MC）对的是教材组（TV），不是纯词缀组；把两研究混成『混合法胜出』是常见转述错误，本条分开著录"
      - "『Graves 1987 词缀教学四步』本次未检索到原始文献，不立为出处：Graves 的可核贡献是四板块框架（《The Vocabulary Book》2006；2nd ed. 2016），词缀属其『策略』板块；正式引用课序用 White et al. 六课序列"
    quiz:
      - stem: "学词缀的第一课应该先学什么？"
        options: ["背 20 个前缀表", "先分清真假前缀，再按意思一课学一组", "先学生僻前缀"]
        answer: "先分清真假前缀，再按意思一课学一组"
        hint_ref: "mechanism『六课课序』"
    probes: []
    prereq: [V-33, V-38]
    order: 39
    pain_points: [记不住]
    adult:
      sources: ["White, Sowell & Yanagihara (1989) 六课序列（Marzano 2004 转引）；Baumann et al. (2002) RRQ 37；(2003) AERJ 40(2)；Graves《The Vocabulary Book》(2006/2016) 四板块框架"]
      boundary: "课序是处方级非实验证明；被试与剂量不可直搬 EFL；Graves『四步』按查无终局处理（2026-11-02 复检确认无原始文献，见 pending）"
      disputes: "投入产出之争：倡导方（Baumann、Ebbers）以『解新词能力』为效标得出积极结论；节制方（如 Adams 1990 经 Marzano 转引）以阅读流利与认知负荷为效标表示保留——实点是起步年龄与效标选择。清单口径：只教 V-33 头部小集合、永远与语境合教，高龄段再扩到词根系统（V-21）"
      evidence_grade: 原文引文级 / 摘要原文级 / 二手系统论述级
      pending: ["（2026-11-02 终局登记）『Graves 1987 词缀教学四步』经复检确认查无：不存在此说法的原始文献——词缀教学文献所引 Graves 为 Graves & Hammond (1980) 的前缀研究；Graves 的框架性贡献是《The Vocabulary Book》(2006；2nd ed. 2016) 四板块。本条不立其为出处、正式课序用 White et al. 六课序列的口径终局化"]
    status: 入模中
    version: "1.0"
    pending: ["探针待补写（PRB-V39-* 预留）", "scene_spec 待补"]
  - id: V-40
    zone: 词汇解码
    group: V
    headline: "一个事件的语义零件可以有不同的『打包法』：汉语爱用一个总管动词统管一串事，英语爱按事情的细节换动词与搭配——把母语的打包图原样套到英语上，逐词对译必失真"
    headline_kid: "中文像一个万能遥控器：门、灯、电视、开会全按『开』。英语像一串专用按钮：门按 open，灯和电视按 turn on，开车按 drive，开会按 have。先看清这件事在干什么，再挑对按钮"
    claim:
      type: tendency
      statement: "汉语『开』的打包与英语的拆分对照（词典可查）：开门 = open the door、开灯/开电视 = turn on / switch on、开车 = drive、开会 = have / hold a meeting；反向：英语 take 一词分管汉语的拿、带走、坐（车）、吃（药）、拍（照）。打包差是两种语言的特征性默认，不是能不能的问题"
      evidence:
        - "Talmy 'Lexicalization Patterns' (1985，载 Shopen (ed.)《Language Typology and Syntactic Description》第3卷, CUP, pp.57–149)，系统化于《Toward a Cognitive Semantics》第II卷 (2000, MIT Press)——词汇化模式（熔合 conflation）原论（二手系统论述级，与 P-19 同源同级）"
        - "汉英日常动词对照为词典级事实：《现代汉语词典》『开』的义项群与各英语学习词典 open/turn on/take 条目可逐项对查（词典级）"
      scope: "特征性默认而非绝对分野：打包差是频率与默认值的差；具体动词对仍须逐对查证"
      exceptions:
        - note: "汉英也有大面积对齐的对子：关门 = close/shut the door、开窗 = open the window——不许讲成『处处错位』"
          word_ids: [G3_0384, ADD_0270, G1_0932, G4_159, V6_日常_10]
    mechanism:
      - beat: 万能遥控与专用按钮
        text_kid: "中文的『开』是一个按钮管好多事；英语是每件事一个按钮。说英语前先看：这件事到底在干什么——推开一扇门？让灯亮起来？开着车走？开会是把人聚起来开？看清了，按钮就挑对了。"
        text_adult: "Talmy 的熔合分析自带非运动例（shelve 把『移动+路径+背景（架子）』熔进一个动词，powder 熔进『图形（粉末）』），说明打包差异不限于运动域；与 P-19 构成『同一思想、两个尺度』的姊妹关系。"
        visual: "遥控器图式：左侧一个『开』键连四台设备，右侧四个专用按钮各连一台"
        anchors: [V6_日常_10, G1_0932, G2_105, V6_身体_34]
      - beat: take 的反向打包
        text_kid: "反过来，英语的 take 也是个万能按钮：拍照、吃药、坐车、拿走、拿东西都用它。轮到中文，每件事又各有各的说法。"
        text_adult: "双向对照才完整：打包错位不是『汉语粗、英语细』的单向判断，两个方向都有总管动词与拆分域。"
        visual: "take 一键五连图：照相机、药、公交车、行李、手各连一条线"
        anchors: [V6_日常_6, G4_0381, G2_105, V6_身体_34]
    examples:
      - level: 1
        word_ids: [V6_日常_10, G1_0932]
        sentence: "Open the door."
        scene_note: "对齐例先行：开门就是 open——不是所有『开』都错位"
        supports: claim
      - level: 2
        word_ids: [V6_日常_6, V6_身体_34, G2_105]
        sentence: "Take the medicine. Take the bus."
        scene_note: "take 两管：吃药（服药）与坐车，汉语说法全然不同"
        supports: claim
    error_cases:
      - wrong: "Open the light."
        right: "Turn on the light."
        error_type: 打包直译
        source_type: 条目成人层登记的事故例
        diagnosis: "把汉语『开』的打包图原样套给英语的灯（回 mechanism『万能遥控与专用按钮』；探针 PRB-V40-1 同案）"
