  - id: V-25
    zone: 词汇解码
    group: V
    headline: "知道一个词『最初是什么意思』，管不住它『现在是什么意思』——拿词源给现行词义判对错，叫词源谬误；越是好听得像段子的词源故事，越经不起年代学与文献链的检验"
    headline_kid: "nice 八百年前是骂人『傻』，今天你说 You are nice，没人会生气——词的意思归现在用它的人管。再当一回侦探：posh 的轮船故事查无此票，故事越完美越要查"
    claim:
      type: etymology
      statement: "假词源辟谣两件武器：年代学否决（首字母缩略造词在 19 世纪中叶以前极为罕见，posh/tips 的词龄早于缩略造词时代）与文献缺席（传说中的 POSH 船票从未被找到）；这类倒编首字母的假说学名 backronym"
      source: "Liberman《Word Origins... and How We Know Them》(OUP, 2005) 与氏 OUP 官方博客方法连载（原文打开）；辟谣逐项核实：Wikipedia 'List of common false etymologies of English words'（原文打开）posh、tip 两条；Grammarphobia 专栏引 Sheidlower《The F-Word》判语（专栏原文打开，二手论述级）"
      evidence:
        - "与 V-22 互为表里：四律证明词义从来在变，所以『回到原义才正确』在逻辑上先输一步"
        - "课堂三件套：posh、tips、golf（Gentlemen Only, Ladies Forbidden）三个故事结构相同，正好用年代学逐个否决"
      scope: "辟谣不等于给出新答案：posh 的真实来源学界无定案，tip 的确切来源词典标『不确定』——『不知道』是词源学的合法结论"
      exceptions:
        - note: "不可用一个新故事替换旧故事：辟谣的产物是『存疑』，不是新词源"
          word_ids: []
    mechanism:
      - beat: 侦探两件套
        text_kid: "查词源故事真假有两招：一看年代对不对（那个年代的人用不用这种造词法），二查有没有真东西留下来（船票、书、报纸）。两招都过不去，故事就是编的。"
        text_adult: "Liberman 治学原则：词源学是概率的游戏，结论须由语音对应规律与文献记录支撑；词以『词巢（nest）』成群存在，孤立的绝妙故事尤其可疑。etymythology（词源神话）为此类假说的统称。"
        visual: "侦探桌面图：船票（缺席）、年代时间线两件证物，posh 故事卡被盖『查无此据』章"
        anchors: [G5_K01]
    examples:
      - level: 1
        word_ids: [G5_K01]
        sentence: "You are nice."
        scene_note: "词源谬误第一例：nice 的古义管不住今义"
        supports: claim
      - level: 2
        word_ids: [ADD_0605, ADD_0686, ADD_0516]
        sentence: "Is the posh story true? — Check the dates."
        scene_note: "侦探练习组：posh/tips/golf 三个缩略故事同场否决"
        supports: claim
    error_cases:
      - wrong: "posh = Port Out, Starboard Home（轮船舱位首字母说）"
        right: "缩略说被年代学否决且无文献（船票从未被找到）；posh 真实来源无定案，登记存疑"
        error_type: 假词源
        source_type: 条目成人层登记的事故例
