        word_ids: [G3_0943, G1_015]
        sentence: "Meat is food. A dog is an animal."
        scene_note: "收窄例 meat（原泛指食物）对涨大例 dog（原只指一种大狗）同屏"
        supports: claim
      - level: 2
        word_ids: [G5_K01, ADD_0641]
