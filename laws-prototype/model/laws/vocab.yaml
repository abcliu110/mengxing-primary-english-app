  - id: V-27
    zone: 词汇解码
    group: V
    headline: "英语与汉语互相借词约四百年：海路把闽南的『茶』送成全世界的 tea，港口把英语的 sofa 送成中国的『沙发』；借词的方向画的是贸易路线图"
    headline_kid: "你喝的『茶』，英语叫 tea——那是福建人说话的声音坐着商船去的欧洲。你坐的『沙发』，是英语 sofa 的声音坐船来的中国。add oil（加油）已经被牛津大词典正式收下啦"
    claim:
      type: etymology
      statement: "借词走两条通道：语音借入（借形，如 tea ← 闽南语 tê 经荷兰语传遍西欧；粤语路线得 chá——te 系与 cha 系的分界即海陆两条商路）与语义直译（借结构，如 add oil、long time no see 把汉语组装法整体译进英语）"
      source: "逐项词源词条级核实：tea（Etymonline、Wiktionary 一致：1650 年代入英语，经荷兰语 thee，源头厦门方言 tê）；add oil（2018 年 10 月 OED 在线版正式新增，著录香港英语，用例可追溯至 1964 年）；long time no see（OED 老牌词条：最早用例 1901 年 Drannan，定性为源于美国的『对蹩脚英语的戏谑模仿』）；逻辑定名史经北大新闻网、全国科学技术名词审定委员会术语在线与译名史论文核实（二手系统转述级）"
      evidence:
        - "te/cha 世界分界图是借词地理学的明星案例：一张地图同时讲清海运与陆运两条贸易线"
        - "add oil（2018 新入 OED）与 long time no see（19 世纪末已立条）并置，展示直译借词的两种命运与两种证据等级"
      scope: "数量上两个方向并不对等：汉语进入英语的借词以饮食、物产、制度文化词为主，总量数百，不可讲成『对等交换』；方向的象征意义大于数量意义"
      exceptions:
        - note: "把『茶』的世界传播全记在英语头上是误读——tea 是闽南语经荷兰人转手的，英语只是中转站之一"
          word_ids: [G2_0944]
    mechanism:
      - beat: 两条通道
        text_kid: "词搬家有两条路：一条搬声音（茶→tea、sofa→沙发），一条搬拼法（加油→add oil，一个词一个词对着译）。"
        text_adult: "汉语一侧的借入要过『定名竞争』关：logic 的译名打了几十年（名学/论理学/理则学 vs 音译『逻辑』），胜出的逻辑是罕见的音译胜意译案例；幽默是古词复活式音译（林语堂 1924）。"
        visual: "世界地图图式：te 海路与 cha 陆路两色线，沙发/咖啡入境箭头，add oil 出境箭头"
        anchors: [G2_0944, G4_0945, G4_173, ADD_0002, ADD_0208]
    examples:
      - level: 1
        word_ids: [G2_0944, G4_0945]
        sentence: "I drink tea and coffee."
        scene_note: "tea 是汉语出境词，coffee 是英语入境词（咖啡）——一桌两方向"
        supports: claim
      - level: 2
        word_ids: [ADD_0002, ADD_0208]
        sentence: "Add oil!"
        scene_note: "add（ADD_0002）+ oil（ADD_0208）：直译借词，2018 年入 OED"
        supports: claim
    error_cases: []
    relatives:
      - {id: V-19, rel: 同族}
      - {id: V-25, rel: 同族}
    corrections:
      - "long time no see 不是近年新收词：是 OED 老牌词条（最早用例 1901），与 2018 年新收的 add oil 证据等级不同，教学必须分开讲，不许打包成『汉语说法都进牛津了』"
      - "ginseng 的通行全译『man-root』已降格：Etymonline 明言第二字（参）本义不确定，第一字『人』确定、第二字存疑"
      - "逻辑定名功劳已修正：日本线贡献的是竞争对手『论理学』（和制汉语意译），胜出的音译『逻辑』是本土造词（严复 1902 首用、章士钊立名推广），并非自日语转来"
    quiz:
      - stem: "tea 这个词是怎么旅行的？"
        options: ["英国人发明的", "福建话的『茶』坐着荷兰商船去的欧洲", "从日本来的"]
        answer: "福建话的『茶』坐着荷兰商船去的欧洲"
        hint_ref: "mechanism『两条通道』"
