    claim:
      type: etymology
      statement: "词根是词汇的深层户口：拉丁 specere『看』加不同前缀派生整族（in- 看进去、re- 回看、sub- 从下看），名词 speciēs『样子』另成一系；希腊一侧经音序倒置成 skop-，日耳曼一侧按格林定律给出 spy 一线"
      source: "Watkins 主编《The American Heritage Dictionary of Indo-European Roots》(第2版 2000；第3版 2011) *spek- 条（原文打开：词根义 to observe，逐项列明 specere 一族）；交叉核实：Etymonline *spek- 条（原文打开）、UT Austin 语言学研究中心 PIE 词根索引"
      evidence:
        - "本族在英语中的成员数以十计且多为中小学高频学术词（aspect、expect、perspective、prospect、retrospect、specimen 等）；连 bishop 都出自本根（经希腊 episkopos『在上面看的人』）"
      scope: "词根是记忆脚手架和历史地图，不是释义公式：同根不等于今义可互推"
      exceptions:
        - note: "species 已专指生物分类；spice 经 speciēs『种类、货物』辗转而来，与『看』的联系只剩化石"
          word_ids: [ADD_0650, ADD_0657]
        - note: "spectator 的直接来源是拉丁 spectāre 而非 specere 本体，拆词应写作 spect-（看），不硬套 spec-"
          word_ids: [ADD_0654]
    mechanism:
      - beat: 一个根一族词
        text_kid: "老祖宗 *spek- 是『看』。看进去是检查 inspect，回头看是尊敬 respect，偷偷从下面看是怀疑 suspect，看出来长什么样是 species。记住老祖宗，一串词一次记完。"
        text_adult: "重建靠比较法：印欧词根是比较法重建的假说，星号 * 即『未经文献证实』的技术标记，教学表述必须保留『重建』二字。方法祖型：Norman Lewis《Word Power Made Easy》(1949) 的词源 session 法（成人自学对象，儿童面降阶取材）。"
        visual: "家族树图：树根 *spek-『看』，三条大枝（拉丁/希腊/日耳曼）各挂成员词"
