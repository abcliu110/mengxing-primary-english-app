  - id: V-23
    zone: 词汇解码
    group: V
    headline: "同一个祖先词从两条不同的路进入英语，会住下两个同根异形的词（同源对）；本族、法语、拉丁三条路齐聚，就成三连词——语域差是『路线差』留下的化石"
    headline_kid: "shirt 和 skirt 本来是同一个词！一个留在英国老家，一个去北欧亲戚家住了一阵又被带回来。kingly、royal、regal 是三兄弟：越排越正式"
    claim:
      type: etymology
      statement: "同源对的形与义之差由入境路线决定：本土继承 vs 亲族借入（shirt/skirt）、同一外源不同方言两次输入（ward/guard、warranty/guarantee）、三路叠印成三连词（ask/question/interrogate）"
      source: "Baugh & Cable《A History of the English Language》(第6版 2013, Routledge) 同源对与三连经典著录（二手系统转述级）；逐对核实：Wiktionary 'Appendix: English doublets'（原文打开）——原始日耳曼语 *skurtijǭ → shirt/skirt、*wardō → ward/guard；Jackson & Amvela《Words, Meaning and Vocabulary》(2000) 三连语域梯度"
      evidence:
        - "同型对子成批存在（catch/chase、captain/chieftain），证明法语两次输入是系统现象；ward 一根可扩成 ward/guard/warden/guardian 四人组"
      scope: "地层归属判的是路线而非血统（royal 血统也是拉丁 regalis，只是经法语过境）"
      exceptions:
        - note: "同源对不等于同义词：skirt 与 shirt 已完全分工；guarantee 与 warranty 在现代法律英语中分化——同根只解释『为什么长得像、为什么场合不同』，不可推出『可以互换』"
          word_ids: [G1_056, G1_058]
    mechanism:
      - beat: 两条入境路
        text_kid: "同一个老词，留在老家的变了一个样（shirt），去亲戚家串门又回来的变成另一个样（skirt）。长得像，是因为它们本来就是一家。"
        text_adult: "三路况：本土继承 vs 亲族借入（古英语 sc- 腭化读 sh-，诺斯语版本保住 sk-）；同源不同方言两次输入（诺曼法语留 w-、中央法语变 g-）；三连词为三路叠印。本条是 V-19 三地层的显微镜。"
