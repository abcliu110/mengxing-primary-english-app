  - id: V-16
    zone: 词汇解码
    group: V
    headline: "一个词的多个义项大多有亲缘：中心义（原型）居中，其余义项经隐喻、转喻一步步长出分支；先教中心义再教分支，能迁移到未教义项"
    headline_kid: "多义词像一棵树：树干是它最主要的意思，其他意思都是树枝——先认树干，树枝就好认了"
    claim:
      type: tendency
      statement: "多义网络的引申由可名状的认知操作（相似→隐喻、相邻→转喻、图式化）驱动，义项间有理据而非任意并置；按『原型+引申』组织比按义项清单教学在延迟后测上更优"
      evidence:
        - "John R. Taylor《Linguistic Categorization: Prototypes in Linguistic Theory》(1989；第3版 2003, OUP)——原型与多义网络系统论述（二手论述级；版次 2026-11-01 补核）"
        - "多义网络教学实验（含 Tyler 等人介词实验）：原型+引申组延迟后测更优且能迁移到未教义项"
      scope: "引申链是事后理据，不保证每个义项都可推导"
      exceptions:
        - note: "同形异源词是两棵树：light『光』与 light『轻』不许硬连成一棵（VF-003 已拆分登记）"
