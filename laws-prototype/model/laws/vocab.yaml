  - id: V-43
    zone: 词汇解码
    group: V
    headline: "有些词常年只和坏事一起出现，词本身就染上了坏运气——这种由惯常搭配沉淀出的褒贬氛围叫语义韵：词典不标、语法不管，选错了句子没错也『味儿不对』"
    headline_kid: "cause 后面跟的多半是麻烦、伤害、问题，所以『带来进步』不用 cause，要用 bring about。provide 正相反，常跟帮助、服务在一起，听着就顺耳。学一个词，要顺便看看它平常跟谁玩"
    claim:
      type: tendency
      statement: "语义韵是搭配的评价极性迁移：当某词的高频搭配在褒贬上高度一致，极性就沉淀为该词的联想意义；单句不可见、语料可见——cause 的宾语压倒性地是负面结果，utterly 的伙伴几乎全是负面词，provide 具正面语义韵"
      evidence:
        - "Louw (1993) 'Irony in the Text or Insincerity in the Writer?'，载 Baker, Francis & Tognini-Bonelli (eds)《Text and Technology》(John Benjamins, pp.157–176)——语义韵命名与定义（二手互证级，经多篇带页码综述转引）"
        - "Stubbs (1995) 语料分析：'the lemma CAUSE has a strongly unfavourable prosody'（p.50）；provide 的 favourable prosody 据 COBUILD 语料（二手互证级，经 Stewart 2010 汇总转引）"
        - "Sinclair 对 set in 的观察 (1987/1991) 为先声：其主语几乎总是不愉快状态"
      scope: "语义韵是概率倾向，不是搭配禁令；随语域与时代漂移，引用具体结论须带语料来源与年代；儿童面只取 cause/utterly/provide 三个已核案，不扩张到未核词表"
      exceptions:
        - note: "中性/正面用例确实存在（cause a stir 等）；cause 用于物理因果（The earthquake caused the collapse）时宾语仍多为坏事，是倾向的印证而非例外——讲成『cause 后面只能跟坏词』即造假"
          word_ids: [ADD_0442, ADD_0659]
    mechanism:
      - beat: 染上的天气
        text_kid: "一个词总和坏事做朋友，自己也带上了坏天气。学词的时候顺便看一眼：它平常跟好事玩，还是跟坏事玩？"
        text_adult: "Louw 立此概念的初衷是诊断反讽：故意给 utterly 配正面词即成反讽。本条是 CB-02（搭配）的姊妹篇：彼管词跟谁，本条管跟的人是好是坏。"
        visual: "词卡天气图标：cause 头顶乌云、provide 头顶晴空，伙伴词在身旁排队"
        anchors: [ADD_0705]
    examples:
      - level: 1
        word_ids: [ADD_0442, ADD_0689]
        sentence: "Smoking can cause trouble."
        scene_note: "cause 的宾语是麻烦——负面语义韵的招牌案"
        supports: claim
      - level: 2
        word_ids: [G6_0339, ADD_0610]
        sentence: "They provide information and help."
        scene_note: "provide 与正面供给搭配（information 在库 G6_0339）"
        supports: claim
    error_cases:
      - wrong: "The new teacher caused progress in our class.（按『引起』字面义选词）"
        right: "The new teacher brought about progress in our class.——cause 的语义韵是负面的，正面结果不用它"
        error_type: 语义韵误选
        source_type: 教学文献登记错型
        diagnosis: "只查词义不看搭配氛围（回 mechanism『染上的天气』；cause progress 是清单登记的对照形）"
    relatives:
      - {id: V-07, rel: 同族}
    quiz:
      - stem: "『新政策带来了进步』，哪个动词味儿对？"
        options: ["cause", "bring about", "两个一样"]
        answer: "bring about"
        hint_ref: "mechanism『染上的天气』"
    probes: []
    prereq: [V-07]
    order: 43
    pain_points: [说不出, 写不长]
    adult:
      sources: ["Louw (1993) pp.157–176；Stubbs (1995) p.50 与《Words and Phrases》(2001)；Sinclair (1987/1991)"]
      boundary: "概率倾向非禁令；结论须带语料来源与年代；儿童面只取三案"
      disputes: "语义韵『住在词里还是住在说话人立场里』有真分歧：Hunston (2007) 主张它主要是说话人借整个短语单位表达的态度意义，不宜说成词的固有属性；Stubbs 一派坚持它是词的语料行为事实——学术表述须两说并呈，教学处理不受影响"
