  - id: V-35
    zone: 词汇解码
    group: V
    headline: "『不』有两个供货商：日耳曼底子用 un-，拉丁底子用 in-——大势可依，例外成串；un- 是活零件至今能装新词，in- 已退休只守老词"
    headline_kid: "说『不』有两个零件：老家的词用 un-（unhappy），外来的拉丁词用 in-（incorrect）。believe 是老家词，所以 unbelievable；credible 是拉丁词，所以 incredible。但这只是大势，例外一串串"
    claim:
      type: tendency
      statement: "否定前缀的选取受词基地层制约（地层一致性倾向）：un-（日耳曼源）产出性至今开放，可接形容词与分词且早已越界接大量拉丁底词基；in-（拉丁源）是封闭存量，只见于已成型的拉丁借词，不接日耳曼词基、也不再造新词；non- 是后起的中性第三方，多表『非此类』而非『相反极』"
      evidence:
        - "地层分工与产出性差为英语形态学通行论述：Bauer (1983)、Plag (2003) 对 un- 高产出与 in- 非产出的处理一致（二手系统论述级）"
        - "可证伪点：新造否定词在语料中一律取 un-/non- 而不见新 in- 词（unfriend、unsubscribe、non-event）；*inhappy、*inkind 在词典与语料中皆不存在"
      scope: "本条只管否定 in-；方向 in-（income、import、include）是另一个前缀，选取不受本条约束"
      exceptions:
        - note: "un- 越界拉丁底成串：uncertain、unstable、unconscious、unpopular 都是 un- + 拉丁/法语底——『地层纯洁』从未实现"
          word_ids: [G3_130, ADD_0694, ADD_0702, ADD_0695, ADD_0701]
        - note: "inflammable 的 in- 是『向内/使……』义而非否定，故 flammable 与 inflammable 同义（现代安全标识多改用 flammable）"
          word_ids: [ADD_0539, ADD_0509]
        - note: "invaluable 的 in- 虽是否定形，词义却是『贵重到没法估价』（极言而非否定，见 V-32）"
          word_ids: [ADD_0546]
        - note: "ingenious/ingenuous 等为整词借入，不可拆解套规则"
          word_ids: []
    mechanism:
      - beat: 活零件与退休零件
        text_kid: "un- 像个还在上班的零件，现在的新词（unfriend 取关）还往上装；in- 已经退休了，只在老词里见得到，新词一个都不接。见到日常词先试 un-，见到拉丁长词先试 in- 一家。"
        text_adult: "本条是倾向条：能帮学生猜，不能帮学生判对错——凡按『un- 必日耳曼底』出题判错者皆错。地层背景见 V-19，变体见 V-34。"
        visual: "两间供货商铺面：un- 铺『营业中·可装新词』，in- 铺『存量老词·不再进货』"
        anchors: [G4_0457, ADD_0157]
    examples:
      - level: 1
        word_ids: [G4_0457, ADD_0693, ADD_0538]
        sentence: "He is unhappy."
        scene_note: "un- 本职例；unbelievable/incredible 对子（believe 老家词 vs credible 拉丁词）同屏"
        supports: claim
      - level: 2
        word_ids: [ADD_0157, G3_130]
