    headline: "隐喻引擎不只管介词：把『先教中心义、再沿隐喻路径长分支』推广到一般多义词与习语，对照实验同样显示理解与保持受益"
    headline_kid: "词的意思像滚雪球：hold 先是『手抓住东西』，然后滚成『控制住』『装得下』『举行』。知道雪球怎么滚的人，碰到没学过的新意思也能猜出大半"
