  - id: V-29
    zone: 词汇解码
    group: V
    headline: "学校英语里需要当作独立词学的单位约 88533 个；但学会一个词之后，平均还有一到三个亲戚词应当能顺带读懂——前提是会用语境和拆词去推"
    headline_kid: "书里的词看着多，其实很多是『一家人』：学会一个词，再碰到它的亲戚，常常不用重新学，猜一猜就懂了"
    claim:
      type: tendency
      statement: "计数单位即机制：派生词若意义能由词根+词缀当场算出（语义透明），就不必另占一个『要学的词』；88533 = 形态基本词 + 语义不透明派生词——把能白拿的剔掉之后剩下的真实学习负担；每学会一个词，平均另有 1.57 个语义透明派生亲戚（精细平均值）"
      evidence:
        - "Nagy & Anderson (1984) 'How many words are there in printed school English?', Reading Research Quarterly 19: 304–330；技术报告版 Technical Report No. 253 (1982, ERIC ED218596)——88533 为报告精确推算值，摘要取整 88500（原文级，技术报告全文直读）"
      scope: "语料为 Carroll, Davies & Richman《Word Frequency Book》（3–9 年级教材与读物，约 508 万词次）；杠杆带条件——会用语境与形态推导才成立，且主要藏在中低频学术词汇层"
      exceptions:
        - note: "高频段的词族杠杆小：熟词多为独立词根，亲戚红利主要在中低频段"
