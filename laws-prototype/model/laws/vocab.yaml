  - id: V-22
    zone: 词汇解码
    group: V
    headline: "词义漂移有四个主方向——范围缩小、范围涨大、评价升格、评价跌格；给老词问『原来指多大范围、原来是好话还是坏话』，就能讲清它今天为什么是这个意思"
    headline_kid: "词会慢慢『搬家』：meat 以前管所有吃的，现在只管肉；nice 以前是骂人『傻』，现在是夸人『好』。记住四种搬法，遇到哪个词都能猜它经历过什么"
    claim:
      type: tendency
      statement: "四律是给词讲『前世今生』的整理架：漂移不是跳变，是用法一点点挪；Traugott 的受邀推理给出引擎——听者反复从字面义推出言外之意，言外之意用久了就固化成词义本身"
      evidence:
        - "Bloomfield《Language》(1933) 历史语义分类（九类，含 degeneration/elevation）——经语义变迁综述页核实（二手系统转述级）"
        - "Ullmann《Semantics》(1962) 对『变迁后果』的四分：widening / narrowing / amelioration / pejoration——整齐四分的成形出处"
        - "Traugott & Dasher《Regularity in Semantic Change》(CUP, 2001)——受邀推理与主观化（书目级+综述转述）"
      scope: "四律是结果分类，不是预测定律：方向事先不可知"
      exceptions:
        - note: "同一词常多律叠加：knave『男孩→男仆→无赖』是收窄+跌格同时发生"
          word_ids: [ADD_0557]
        - note: "更不可反推『原义才是真义』——那正是 V-25 要拆的词源谬误"
          word_ids: []
    mechanism:
      - beat: 四种搬家
        text_kid: "词搬家有四种：地盘变小（meat 只管肉了）、地盘变大（dog 所有狗都算）、坏话变好话（nice）、好话变坏话（silly）。搬家是一小步一小步挪的，每站都说得通。"
        text_adult: "评价漂移常走『中间站』链条：silly 从『有福』经『天真无害』『可怜、弱小』滑到『愚笨』；nice 从『无知』经『讲究、精细』滑向『宜人』。四例时间线即 V-08 的现成故事卡素材。"
        visual: "四格漫画式时间线：meat/dog/nice/silly 各走一条搬家路"
        anchors: [G3_0943, G1_015, G5_K01]
    examples:
