      boundary: "两轮效应量度不同（2010 均值变化差、2013 组间均差），0.33 与 0.32 不可直接比大小；低龄结论仅 4 项研究支撑；EFL 预期下调"
      disputes: "①嵌入之争：2010 发现综合嵌入优于纯形态教学，2013 未复制——『嵌入不亏、单教不罪』，不许任何一面自称定案。②替代对照冷水：Bowers, Kirby & Deacon (2010) 发现对『换一种好教学』的替代对照效应接近于零——已证的是『胜过不教』，未证的是『胜过其他词汇教学』。③2024 预注册元分析结论更冷：向未学词的迁移只在拼写上成立、阅读上不成立，阅读理解无明确证据。本条以 2010/2013 为主体证据、2024 为温度修正，引用不得只引最热的一轮"
