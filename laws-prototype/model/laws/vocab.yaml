  - id: V-21
    zone: 词汇解码
    group: V
    headline: "英语学术与书面词汇的主体来自拉丁与希腊语，其构词零件在成百上千的词里重复出现：系统学一批高复用词干，等于给生词装上可分析接口"
    headline_kid: "很多长词是小零件拼的：spect 是『看』，port 是『搬』，dict 是『说』，bio 是『生命』。学会零件，碰到没见过的长词就能先猜个八九不离十——猜完再查词典对答案"
    claim:
      type: tendency
      statement: "见词先拆件、按件猜义、用语境与词典验猜；词根法与 V-08 的词源精细加工机制同源（给词义多接一条结构通道），区别在组织形态：词根法成体系成课程（固定词干清单 + 例行练习 + 累积复现）"
      evidence:
        - "Lundquist《English from the Roots Up, Vol.1》(1989)——100 个希腊/拉丁词根、卡片系统（目录+书目级）"
        - "Michael Clay Thompson《The Word Within the Word》(Royal Fireworks Press)——每卷 30 课、第一卷 500 词干（章节预览级，出版社官方样章）"
      scope: "词干的『释义』是教学简化（如 spect gloss 作 look，实际语义场更宽），是脚手架，不是词源学结论；词干清单须按课标词表与所读文本裁剪，不必整表照搬"
      exceptions:
        - note: "形似的字母串未必是真词根（corner 不是 corn+er）——拆之前须按 V-15 的纪律确认是真构词"
          word_ids: [V6_城市_33]
    mechanism:
      - beat: 零件接口
        text_kid: "长词不可怕，它是零件拼的。先把零件认全：看到 spect 就想到『看』，看到 port 就想到『搬』，拼起来猜意思，最后查词典对答案。"
        text_adult: "两套通行课程为锚点（Lundquist 卡片制、Thompson 词干课）；课程本身的对照实验级效果证据本次未检索到——本条主张机制合理性与传统存续，不主张已证疗效数字（疗效证据见 V-31）。"
        visual: "零件墙：spect/port/dict/bio 四块零件逐个插进长词插槽"
        anchors: [G6_0331]
    examples:
      - level: 1
        word_ids: [G6_0347, ADD_0544, G6_0346, ADD_0676]
        sentence: "I expect a letter."
        scene_note: "expect 在词库（ex- + spect『看』：往外看→期待）；inspect/respect/suspect 家族全量名单见挂接表"
        supports: claim
      - level: 2
        word_ids: [G6_0331]
        sentence: "Can you predict the story?"
        scene_note: "predict = pre-（预先）+ dict（说）：预先说→预言（难点的真身是 dict 不认识，见 V-32）"
        supports: claim
    error_cases:
      - wrong: "corner = corn + er（把形似字母串当真词根硬拆）"
        right: "corner 不是构词拆分对象——拆前先确认是真构词（V-15 纪律）"
        error_type: 假拆分
        source_type: 条目成人层登记的事故例
        diagnosis: "形似误认成词根（回 mechanism『零件接口』的例外同屏）"
    relatives:
      - {id: V-08, rel: 同族}
      - {id: V-26, rel: 同族}
      - {id: V-30, rel: 同族}
    quiz:
      - stem: "碰到没见过的长词 transport，先做什么？"
        options: ["整词死背", "先拆零件（trans- 搬过去 + port 搬），猜『搬运』，再查词典对", "跳过"]
        answer: "先拆零件（trans- 搬过去 + port 搬），猜『搬运』，再查词典对"
        hint_ref: "mechanism『零件接口』"
    probes: []
    prereq: [V-15]
    order: 21
    pain_points: [记不住]
    adult:
      sources: ["Lundquist (1989)；Thompson《The Word Within the Word》出版社官方样章"]
      boundary: "词干释义是教学简化；假拆风险须守 V-15；清单按中国课标裁剪；课程疗效证据未检索到，不主张已证数字"
      disputes: "路线之争：『清单先行』（先背词干再应用，两套课程属此路）vs『探究先行』（在真实词族里边查边归纳，SWI 属此路）——清单不裁决，可按年龄分工；词干释义简化到何种程度算失真，课程界与词源学界尺度不同，按 V-15『半透明须注明只是帮记』处理"
      evidence_grade: 章节预览级 / 目录+书目级
      pending: ["课程对照实验级效果证据待核（清单已登记，本条不主张疗效数字）"]
