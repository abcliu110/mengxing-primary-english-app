      evidence:
        - "Beréndi, Csábi & Kövecses 'Using Conceptual Metaphors and Metonymies in Vocabulary Teaching'，载 Boers & Lindstromberg (eds)《Cognitive Linguistic Approaches to Teaching Vocabulary and Phraseology》(2008)——多义词实验源自 Csábi (2004)：52 名匈牙利中学生学 hold 与 keep，隐喻组织组在即时与两天后延迟测验的理解与保持上均胜出（章节全文级）"
