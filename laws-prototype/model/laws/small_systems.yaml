      evidence: ["Lakoff & Johnson (1980) 时间以空间结构化的一般理论", "Tyler & Evans (2003) 各介词时间义的引申分析", "本项目 frameworks 裁定（ROYAL T09 / g14-time-borrow）已按此口径改判并登记约定例外"]
