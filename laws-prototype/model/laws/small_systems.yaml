    headline: "天气 it 指的是「整个环境」——一条没有共识、但有主读法的边界"
    headline_kid: "It is raining 里的 it 不是「凑数的假主语」——它指的是整个天气、整个场面：整个世界都在下雨。"
    claim:
      type: tendency
      statement: "天气与环境陈述中的 it「指周围的整体环境」，并非毫无语义的凑数主语——指称沿一条由具体到全域的斜坡渐变，天气 it 处在「全域指称」的端点；但语义学界对它的记账至今分立两派，本条只立教学主读法（Bolinger 线），学术登记保留 Quirk 的虚指说并列。"
      evidence: ["Bolinger《Meaning and Form》(1977) 第 4 章（ambient it 的系统论证，pp. 67、77–87；渐变带见 p. 82 的 cline 陈述）", "印证：Chafe 对居间状态动词主语的论述（同一传统转述）", "采信：Langacker (1991: 366) 在认知语法中正式采纳环境 it 的读法"]
