  - id: PR-05
    zone: 小系统
    group: PR
    headline: "「人称」是一个范畴家族，不是一张三行表——英语的系统是「素颜版」"
    headline_kid: "全世界的语言给「人」分队的方法五花八门；英语是最简单的一版：不分双数、不分包不包你，性别只在第三人称单数露一下面。"
    claim:
      type: rule
      statement: "人称系统的可能维度至少包括：人称（1/2/3，可再分）、数（含双数、三数）、包容/排斥、性别（在许多语言受人称层级制约，常只出现在第三人称）、敬称；英语的实现恰是其中最朴素的一种：无人称内对立的包容区分、无双数、性别只在第三人称单数、格只剩代词内部残留。"
      evidence: ["Siewierska《Person》(2004, Cambridge University Press；分析基于 700 多种语言)：第 2 章独立人称形式（2.1 性别、2.2 数、2.3 格），第 3 章语义范畴（3.2.1 包容与排斥、3.2.2 双数与三数、3.3 性别与人称层级关系）（接触等级：章节预览级，出版社章节预览 PDF 核实）"]
    mechanism:
