        text_adult: "英语 thou 的消亡与 you 的通吃有完整的历史语法记录；人称/数的挪用本身在许多语言里就是礼貌装置（复数表尊称、皇家 we、编辑 we），英语把这套装置拆掉后，功能必须由其他形式补位。"
