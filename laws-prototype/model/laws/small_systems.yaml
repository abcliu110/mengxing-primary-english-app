  - id: PB-02
    zone: 小系统
    group: PB
    headline: "基本义要能「画出来」：可描绘性是 Lindstromberg 给核心义定的门槛"
    headline_kid: "每个介词都有一张「证件照」：on 的照片是一个圆球搁在一条线上。学介词先认照片，再看它在别的地方的样子。"
    claim:
      type: rule
      statement: "一个介词的基本义应当简单到能用一张小图画出来（一团东西搁在一条线上，就是 on 的招牌图）；画不出来的词（如 with）就老实承认它没有单一基本图，只能用一组图加「或」连起来——可描绘性本身就是判断「基本义定得对不对」的检验。"
      evidence: ["Lindstromberg《English Prepositions Explained》(1998/2010) 的基本义陈述法", "作者专栏 'Against the grain', Humanising Language Teaching 3(4), 2001（接触等级：目录 + 书评 + 作者自述级）"]
    mechanism:
      - beat: "图标检验"
        text_kid: "先给每个介词拍一张最简单的照片：on 是圆球搁在线上，in 是圆球进到框里。"
        text_adult: "空间介词分「可描绘的」与「不可描绘的」：on 的最常见空间义可用极简图标说清（侧视图中一个圆团被一条线从下方托住）；两个参与者称 Subject（被定位物）与 Landmark（参照物）。"
        visual: "on/in/at 三张极简图标并排（圆+线/圆+框/圆+点）"
        anchors: [G3_142, G3_140, V6_核心_37]
      - beat: "反对纯搭配法"
        text_kid: "（教师侧）光背「和哪个词搭配」学不会介词：为什么 on what condition 和 under what condition 不一样，搭配表答不出来，意义才答得出。"
        text_adult: "作者明确反对只靠搭配学介词：意义知识是解开习语差别的钥匙；基本义先用图钉住，抽象义再沿图引申。"
        visual: "搭配表打叉 → 意义图打勾的对照"
        anchors: [V6_核心_50]
    examples:
      - level: 1
        word_ids: [G1_041, G3_142, G2_0930]
        sentence: "The ball is on the table."
        scene_note: "on 的证件照本景：圆团搁在线（面）上"
        supports: claim
      - level: 1
        word_ids: [G1_041, G3_140, G1_0994]
        sentence: "The ball is in the box."
        scene_note: "in 的证件照：圆团进框"
        supports: claim
      - level: 2
        word_ids: [G1_041, V6_核心_37, G1_0932]
        sentence: "The ball is at the door."
        scene_note: "at 的证件照：圆团落在点上"
        supports: claim
      - level: 2
        word_ids: [G1_041, G3_143, G2_0930]
        sentence: "The ball is under the table."
        scene_note: "under 图标：圆团在线（面）之下"
        supports: claim
    error_cases:
      - wrong: "people can be on car"
        right: "people can be in the car"
        error_type: "介词选择错误（可描绘性错位）"
        source_type: "真实语料错型"
        diagnosis: "人在车里，英语画的是「被车身包住」的 in 的图，学习者却用了表示接触承托的 on：基本义要能画出来，画错图就选错词，汉语「在车上」的「上」不能直译成 on。〔出处：郭佳佳. 英语介词“on”使用的数据驱动研究[J]. 国外英语考试教学与研究, 2023, 5(3): 146-159. DOI: 10.12677/oetpr.2023.53015｜定位：表 8 选择错误例（语料片段）｜语料为东北大学分班考试 300 篇作文中的 on 误用 27 例之一｜学段：大学｜病例号 VEC-033〕"
        diagnosis_kid: "人在车里面，是被车包住的，要说 in the car，不能说 on car——on 是站在上面、贴着的意思。"
    relatives:
      - {id: P-04, rel: 同族}
      - {id: PB-01, rel: 前置}
      - {id: PB-03, rel: 同族}
    quiz:
      - q: "按 Lindstromberg 的标准，一个「基本义」定得对不对，先看它能不能怎样？"
        options: ["被画成一张小图", "被翻译成中文", "被编成口诀"]
        answer: "被画成一张小图"
        hint_ref: "mechanism[0]"
