        text_adult: "给定性等级是一套会话合作装置：选错形式等于给听者发了错误的定位预期；等级蕴涵（高状态蕴涵低状态）使形式选择可系统预测。"
        visual: "说话人头顶算盘图：对方知道吗？→ 选词滑杆 a/the/代词"
