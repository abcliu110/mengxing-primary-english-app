  - id: PB-08
    zone: 小系统
    group: PB
    headline: "每个介词只有一个「理想意义」：几何自画像，其余全是偏离"
    headline_kid: "每个介词都有一张「标准照」：in 是「在盒子里面」，on 是「贴在面上被托住」，at 是「就站在那个点上」。照片是标准，但真人不用跟照片一模一样。"
    claim:
      type: rule
      statement: "Herskovits 给每个介词只发一张几何自画像——「理想意义」：in 是「包含于一个有界空间内」，on 是「与一个面接触（并典型地被它承托）」，at 是「射体与被当作一个点的界标重合」；真实用法大多不精确等于自画像，介词的学问一半在画像里、一半在「怎么偏离也算数」的规则里（见 PB-09）。"
      evidence: ["Herskovits《Language and Spatial Cognition》(1986, Cambridge University Press)——理想意义定义 p. 39、at pp. 128–136、on p. 140、in pp. 149–150 一带（关键页码经多家带页码引文互证，二手互证级销项）", "先行论文 Herskovits (1985), Cognitive Science 9(3): 341–378（接触等级：目录 + 书评级）"]
    mechanism:
      - beat: "两层框架"
        text_kid: "先有一张标准照（几何长相），再有一本「差多少算过关」的账——介词的学问有两半。"
        text_adult: "第一层是理想意义：纯几何的点、线、面、容器、边界关系，配套「情境类型」知识（什么东西在什么场合算容器、算面）；第二层是偏离的会计制度（PB-09）。框架出身是人工智能：意义须写成机器可算的几何描述，「理想」是计算所需的规范形，不是脑中的照片。"
        visual: "in/on/at 三张几何自画像 + 情境类型注脚"
        anchors: [G3_140, G3_142, V6_核心_37]
      - beat: "个案范围"
        text_kid: "（教师侧）这本书细做了 in/on/at 三个「基本拓扑介词」，和一批要靠观察者眼睛定位的词（in front of、behind、over、under）。"
        text_adult: "个案研究部分为「三个基本拓扑介词」与「投影介词」两组；该书被公认为「从语义学与人工智能角度对英语介词意义最彻底的检视」（Tenbrink 2005 综述语）。"
        visual: "全书个案地图"
        anchors: [V6_核心_41]
    examples:
      - level: 1
        word_ids: [G1_041, G3_140, G1_0994]
        sentence: "The ball is in the box."
        scene_note: "in 的理想意义本景：包含于有界空间"
        supports: claim
      - level: 1
        word_ids: [G1_041, G3_142, G2_0930]
        sentence: "The ball is on the table."
        scene_note: "on 的理想意义本景：与面接触并被承托"
        supports: claim
      - level: 2
        word_ids: [G1_041, V6_核心_37, G1_0932]
        sentence: "The ball is at the door."
        scene_note: "at 的理想意义本景：与被当作点的界标重合"
        supports: claim
      - level: 2
        word_ids: [G1_014, V6_核心_41, G2_0930]
        sentence: "The cat is behind the table."
        scene_note: "投影介词 behind：需观察者坐标（behind 已在库）"
        supports: claim
    error_cases:
      - wrong: "I am at the bed"
        right: "I am on the bed"
        error_type: "介词选择错误（at 点重合与 on 接触承托混淆）"
        source_type: "真实语料错型"
        diagnosis: "人躺在床面上，英语用表示接触面的 on；学习者用了表示「点」的 at，是把汉语「在」一个字对到英语多个介词上的结果：at 是点重合，on 是贴在面上，两幅图不一样。〔出处：王倩. 初一学生英语写作中的介词错误分析[J]. 职业教育发展, 2026, 15(4): 156-164. DOI: 10.12677/ve.2026.154180｜定位：文中 at/on 误用例｜语料为123 名初一学生 246 篇作文中的 184 处介词错误之一｜学段：初一｜病例号 VEC-035〕"
        diagnosis_kid: "躺在床上要说 on the bed，on 是贴在床面上的意思；at 是指一个点，放在这儿不对。"
    relatives:
      - {id: P-05, rel: 同族}
      - {id: PB-09, rel: 同族}
      - {id: PB-10, rel: 同族}
    quiz:
      - q: "Herskovits 说的「理想意义」是什么？"
        options: ["每个介词一张纯几何的标准描述，偏离另行记账", "每个介词最常用的那个意思", "词典里的第一个义项"]
        answer: "每个介词一张纯几何的标准描述，偏离另行记账"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [P-03, P-04, P-05]
    order: 27
    pain_points: []
    adult:
      sources: ["Herskovits (1986)（目录全文 + Computational Linguistics 书评；关键页码二手互证级，清单 v5 回写定版）", "Herskovits (1985) 先行论文"]
      boundary: "理想意义是分析者的规范化重构，不声称脑中有这张几何表；at 的「点」是理想化操作，教学时须说清是「把大地方看作一个点」的看法转换（与 P-05 点识解相通，P-05 未溯此源，本条补上）。"
      disputes: ["单义架构 vs 多义网络是本簇第二条断层线：Herskovits 一词一义、偏离外包给使用类型与语用；Brugman/Tyler & Evans 一词多义、偏离内化为网络节点——两家对同一批例句给出不同账目（清单原文登记）"]
      evidence_grade: "目录 + 书评级（关键页码二手互证）"
      pending: ["误解探针待补（W7 收口）"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: PB-09
    zone: 小系统
    group: PB
    headline: "偏离走两条道：挂账的「使用类型」与现场的「语用容差」——外加四条语用原则当交警"
    headline_kid: "说话像量身高：差一点点也算过关（容差）；但有些「差一点」是大家早就说好可以的（贴墙的画也用 on）。心里有一本说好的账，也有一把现场的尺。"
    claim:
      type: rule
      statement: "一个用法偏离理想意义时，Herskovits 只许两种报销方式：要么这偏离是约定俗成的、登记在案的「使用类型」（如 on 可只表接触不表承托——画挂墙上没有东西托着它），要么是语用现场放行的「容差」（差不多成立就当成立——苹果摞高出碗沿仍说 in the bowl）；放行时听四条语用原则指挥：显著性、相关性、容差、典型性。"
      evidence: ["Herskovits (1986)（使用类型定义见 p. 87 二手引述；behind 典型性见 pp. 148–155 引述）", "Tenbrink (2005, SFB/TR8 Report 004-03) 对 Herskovits 的系统重构与 Computational Linguistics 书评（接触等级：目录 + 书评 + 学术引述级）"]
    mechanism:
      - beat: "挂账道：使用类型"
        text_kid: "画贴在墙上，没有东西托着，也用 on——这是大家早就说好的，不算错。"
        text_adult: "使用类型是挂在每个介词理想意义之下的约定俗成的意义转移清单，属词库的一部分；本项目的「已知例外」字段正是 Herskovits 式工具，好用的前提是登记纪律（须给条款编号与出处，设上限）。"
        visual: "on 的例外账本一页：只接触不承托（挂画）已登记"
        anchors: [G4_158, G3_142, G3_0934]
      - beat: "现场道：容差与四原则"
        text_kid: "苹果堆得冒出碗沿，还说 in the bowl——差不多成立，大家就当成立。"
        text_adult: "容差原则管辖「不精确但可接受」；相关性招牌例是 the dust in/on the bowl（取内空间读法还是附着表面读法，由当前话题决定）；典型性招牌例是 behind 预设邻近（喷泉不能离市政厅太远，这个「近」不在几何意义里）。"
        visual: "冒尖的苹果碗（容差）+ 喷泉与市政厅距离标尺（典型性）"
        anchors: [G1_037, G3_0937, V6_核心_41]
    examples:
      - level: 1
        word_ids: [G4_158, G3_142, G3_0934]
        sentence: "The picture is on the wall."
        scene_note: "使用类型：只接触不承托的 on"
        supports: claim
      - level: 1
        word_ids: [G1_037, G3_140, G3_0937]
        sentence: "The apples are in the bowl."
        scene_note: "容差：苹果摞满碗仍说 in（词形经 apple 归一）"
        supports: claim
      - level: 2
        word_ids: [G1_014, V6_核心_41, G2_0930]
        sentence: "The cat is behind the table."
        scene_note: "典型性：behind 预设离得不远"
        supports: claim
      - level: 2
        word_ids: [G1_041, G3_142, G3_0933]
        sentence: "The ball is on the floor."
        scene_note: "承托齐全的 on——与挂画的「只接触」对照"
        supports: claim
    error_cases:
      - wrong: "in the wall"
        right: "on the wall"
        error_type: "介词选择错误（使用类型误判：接触误作包含）"
        source_type: "真实语料错型"
        diagnosis: "画挂在墙面上，只有接触、没有嵌进墙里，英语登记在案的使用类型是 on the wall；学习者按「在墙里」的包含图用了 in，把接触误判成包含——偏离走的是约定俗成的使用类型这条道，现场语用容差救不了。〔出处：谢世君. 基于语料库分析的高二英语读后续写介词使用偏误分析[J]. 职业教育发展, 2026, 15(6): 15-22. DOI: 10.12677/ve.2026.156238｜定位：§5.3 讨论例（短语级错例）｜语料为96 名高二学生 192 篇读后续写中的 450 例介词偏误之一｜学段：高二｜病例号 VEC-036〕"
        diagnosis_kid: "画是挂在墙面上的，要说 on the wall；in the wall 是嵌进墙里面的意思，画不是嵌进去的。"
    relatives:
      - {id: PB-08, rel: 前置}
      - {id: P-08, rel: 同族}
      - {id: PB-10, rel: 同族}
    quiz:
      - q: "画挂在墙上没有承托却用 on，按 Herskovits 的账，这笔偏离记在哪里？"
        options: ["使用类型（约定登记在案）", "容差（现场放行）", "算错误用法"]
        answer: "使用类型（约定登记在案）"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [PB-08]
    order: 28
    pain_points: []
    adult:
      sources: ["Herskovits (1986)", "Tenbrink (2005) 系统重构；Computational Linguistics 书评（接触等级：目录+书评+学术引述级）"]
      boundary: "使用类型清单有滑向「特设清单」的危险：每遇反例就新登记一条，框架的解释力会被自己的清单吃掉——这也是本项目「已知例外」字段要设上限、须给条款编号与出处的理由（清单原文）。"
      disputes: ["Coventry & Garrod (2004) 直评 Herskovits 的使用类型「以特设方式挂在中心义上」，替代方案是让情境中的功能关系在语义分析内部做这项工作——本项目立场站在两家之间（有原则多义 + 已知例外必填），本条把上游之争登记在案（清单原文）"]
      evidence_grade: "目录 + 书评 + 学术引述级"
      pending: ["误解探针待补（W7 收口）"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: PB-10
    zone: 小系统
    group: PB
    headline: "功能知识：介词不只看形状，还看「这东西是干什么用的」"
    headline_kid: "眼睛看形状，心里还要想一想「它是干什么的」：碗是装东西的碗，东西装得冒尖了，也还是「在碗里」。"
    claim:
      type: rule
      statement: "判断一个东西能不能算「容器」、一面墙能不能算「承托」，靠的不只是几何，还有关于物体用途的功能知识：碗是用来盛的，所以摞高的苹果还算在碗里；墙是用来挂画的，所以没有托举的画也「在墙上」——功能是介词选择的第二决定项。"
      evidence: ["Herskovits (1986) 功能与情境类型知识（Meaning and Use、Normal Situation Types 两章，目录可证）（接触等级：目录 + 书评级）", "思想链后两环：Tyler & Evans (2003) 原型场景的功能要素（P-04）、Coventry & Garrod (2004) 功能几何实验化（P-08）"]
    mechanism:
      - beat: "功能改写几何"
        text_kid: "一条路可以看成一条线，一个镇可以看成一个点——是「用它做什么」在帮我们重新划界。"
        text_adult: "功能知识属情境类型的常规知识：同一几何构型，物体功能不同，介词判断可以不同；功能甚至能改写几何归类（路作线、镇作点）。"
        visual: "路（面→线）与镇（面→点）的功能重分类图"
        anchors: [G4_0592, G4_0986]
      - beat: "一条思想链"
        text_kid: "（教师侧）这个想法有三站：先有人提出来（Herskovits），再有人做实验（Coventry），最后被写进介词的图式里（Tyler & Evans）。"
        text_adult: "时序：1986 Herskovits 功能知识 → 1990 年代 Coventry 等实验化 → 2003 年被原型场景吸收为「功能要素」；清单此前只登记了后两环，本条补齐源头。"
        visual: "三站时间线"
        anchors: [G1_037, G3_0937]
    examples:
      - level: 1
        word_ids: [G1_037, G3_140, G3_0937]
        sentence: "The apples are in the bowl."
        scene_note: "碗的功能（盛）撑住 in 的判断（词形经 apple 归一）"
        supports: claim
      - level: 1
        word_ids: [G4_158, G3_142, G3_0934]
        sentence: "The picture is on the wall."
        scene_note: "墙的功能（挂）撑住 on 的判断"
        supports: claim
      - level: 2
        word_ids: [G2_105, V6_核心_37, G4_0517]
        sentence: "The bus is at the station."
        scene_note: "车站被功能与尺度点化为一个点"
        supports: claim
      - level: 2
        word_ids: [G1_047, ADD_0295, G5_231]
        sentence: "The train goes through the mountain."
        scene_note: "隧道的功能（穿行）使 through 成立"
        supports: claim
    error_cases:
      - wrong: "He is in home"
        right: "He is at home"
        error_type: "介词选择错误（功能知识缺位：容器图误用于定位点）"
        source_type: "真实语料错型"
        diagnosis: "汉语把「家」感知为一个容器，学习者顺手用了 in；英语习惯把家抽象为一个活动的「定位点」，用 at：介词选哪个，看的是这个地方在生活里是用来干什么的，不是看它的形状。〔出处：熊汇丹. 初二学生英语写作中介词偏误分析——以介词“in”“on”“at”为例[J]. 教育进展, 2026, 16(3): 449-454. DOI: 10.12677/ae.2026.163503｜定位：文中 in/at 误用例及成因分析｜语料为105 名初二学生 316 句含 in/at/on 的句子中的 205 句偏误之一｜学段：初二｜病例号 VEC-037〕"
        diagnosis_kid: "在家要说 at home。英语把「家」当成一个地点，不当成一个装东西的盒子，所以不用 in。"
    relatives:
      - {id: P-08, rel: 同族}
      - {id: PB-09, rel: 前置}
      - {id: P-04, rel: 同族}
    quiz:
      - q: "苹果摞得高出碗沿还说 in，最关键的判断依据是？"
        options: ["碗的功能是盛东西", "苹果是圆的", "碗比较大"]
        answer: "碗的功能是盛东西"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [PB-09]
    order: 29
    pain_points: [错不完]
    adult:
