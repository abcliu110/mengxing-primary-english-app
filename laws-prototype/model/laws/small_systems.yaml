    claim:
      type: rule
      statement: "一句空间表达里，小而动（或正被寻找）的东西做「图形（figure）」，大而稳的东西做「背景（landmark/ground）」，介词负责把图形钉在背景上；介词短语的本质是一个定位指令，语言镜像的是「注意如何扫描世界」。"
      evidence: ["Talmy 图形—背景理论，定版于《Toward a Cognitive Semantics》Vol. I (2000, MIT Press)", "Tyler & Evans (2003) 的 trajector/landmark 术语即源于此传统"]
