  - id: C-07
    zone: 小系统
    group: C
    headline: "the 的本职：让听者「唯一定位到那一个」"
    headline_kid: "说 the 的时候，是在说「就是那一个，你知道的」——对方得能一下子找到它。"
    claim:
      type: rule
      statement: "the 传递的信息是：「线索已经够了，你能在心里唯一定位到我指的那一个（或那一整类）」——在给定性等级中 the N 对应「可唯一辨识（uniquely identifiable）」级；说 the 而听者定位不到，就是误用。"
      evidence: ["Gundel, Hedberg & Zacharski (1993)（the N 对应 uniquely identifiable 级）", "Hawkins《Definiteness and Indefiniteness》(1978) 定位理论（定指 = 在共享语用集中定位）"]
    mechanism:
      - beat: "定位完成指令"
        text_kid: "说 the 之前先想：对方能一下子找到是哪个吗？找不到，就不能用 the。"
        text_adult: "the 要求指称对象达到可唯一辨识的认知状态：说话人预设听者能凭已给材料把候选收成唯一；加 the 等于向听者发出「你应该找得到」的信号。二语习得界至今以 Hawkins (1978) 的操作性定义为准（经 Lyons 1999 综述转述）。"
        visual: "一堆书中目标书被光圈唯一锁定，标 the；候选未收拢时 the 卡变灰"
        anchors: [G1_002, G1_0928]
      - beat: "线索可以不在上文"
        text_kid: "太阳不用介绍也能说 the sun——因为全世界就一个，大家都知道。"
        text_adult: "定位材料可以是情境、常识、关联推论（五条路见 C-08）；类指 the（the tiger = 物种整体）是延伸用法，见 C-13。"
        visual: "太阳唯一亮起——常识定位"
        anchors: [G2_0501]
    examples:
      - level: 1
        word_ids: [G1_002, G1_0928]
        sentence: "The book on the desk is mine."
        scene_note: "修饰语当场锁定唯一一本（mine 经代词别名归一）"
        supports: claim
      - level: 1
        word_ids: [G2_0501]
        sentence: "The sun is up."
        scene_note: "常识唯一——定位无需上文"
        supports: claim
      - level: 2
        word_ids: [G1_015]
        sentence: "I have a dog. The dog is cute."
        scene_note: "先 a 后 the：第二次提及已可定位（cute 已在库）"
        supports: claim
      - level: 2
        word_ids: [G4_0818]
        sentence: "Pass me the salt, please."
        scene_note: "餐桌上就一瓶盐——情境定位（登记场景）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "the 滥用（定位不到而加 the）"
        note: "滥用型的机制与处方见 C-09/C-20；逐字病例待补，不自编。"
    relatives:
      - {id: C-06, rel: 对照}
      - {id: C-08, rel: 同族}
      - {id: C-19, rel: 同族}
    quiz:
      - q: "什么时候才可以用 the？"
        options: ["对方能凭线索唯一定位到那一个时", "名词很重要时", "句子开头时"]
        answer: "对方能凭线索唯一定位到那一个时"
        hint_ref: "mechanism[0]"
    probes: []
