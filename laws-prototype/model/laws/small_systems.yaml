      - beat: "两端的用法"
        text_kid: "刚提到的用小代词接着说（it、he）；说了很久以前的，要把名字重新说全。"
        text_adult: "等级高端是 this/that 与代词（与代词区的可及性机制 PR-06 同一台机器的两端）；儿童教学只取等级的两端（a 与 the）加零冠词。"
        visual: "等级阶梯：a → the → this/that → 代词，儿童段高亮两端"
