# 小系统区规律条目（类型化模型）· 波次 W4 / 数据补齐 D
# 来源：专家规律清单 v6 的 P（19）+ PB（13）+ C（20）+ PR（11）= 63 条，逐条按 DESIGN.md §3.1 schema 入模。
# 纪律：不自编——断言、出处、边界、分歧均取自清单原文；病例只用清单登记的真实错例/错型，
#   缺逐字病例者以 status: 待补 占位登记；例词只引词库 id（wordbank.json）。
# 约定：error_cases 占位形 = {status: 待补, error_type, note}；probes 为 [] 者表示探针待补（见 adult.pending）。
# 配套文档：small_systems_MODEL.md；挂接表：../hitching/small_systems_hitching.yaml。
zone: 小系统
entries:
  - id: P-01
    zone: 小系统
    group: P
    headline: "一个介词 = 一张原型图 + 一张亲戚网（有原则的多义）"
    headline_kid: "每个介词都有一张全家福：中间是它最主要的那张图，周围都是它的亲戚——长得像它、从它变出来的。"
    claim:
      type: rule
      statement: "每个介词的诸多用法不是互不相干的义项清单，而是从一个中心场景（原型）出发、经经验关联（语用强化）一步步长出的一张网；学介词就是学这张网的长法。"
      evidence: ["Tyler & Evans《The Semantics of English Prepositions》(2003, Cambridge University Press)：有原则的多义与原型场景方法的定版著作"]
    mechanism:
      - beat: "原型图"
        text_kid: "先认每个介词最主要的那张图：in 是装进里面，on 是贴在面上，at 是一个点。"
        text_adult: "原型场景（proto-scene）是网络的中心节点，由四条证据裁定（见 P-02），不是教师直觉。"
        visual: "三个介词的原型图式并排（容器/贴面/点），作本区总图"
        anchors: [G3_140, G3_142, V6_核心_37]
      - beat: "亲戚网的长法"
        text_kid: "新用法不是凭空来的：over 先有「在上面」，才长出「盖住」，再长出「越过」。"
        text_adult: "引申引擎是语用强化：场景中反复出现的附带含义沉淀为独立义项；义项间有理据，但不是每一步都能当场推导。"
        visual: "over 网络三层图：中心 ABOVE → 覆盖 → 越过"
        anchors: [V6_核心_40]
    examples:
      - level: 1
        word_ids: [G1_013, V6_核心_40, G3_0934]
        sentence: "The bird flew over the wall."
        scene_note: "操场围墙，鸟飞过去——越过义贴近中心"
        supports: claim
      - level: 1
        word_ids: [G1_014, G3_140, G1_0994]
        sentence: "The cat is in the box."
        scene_note: "纸箱里的猫——in 的原型场景"
        supports: claim
      - level: 2
        word_ids: [G1_046, V6_核心_40, G2_077]
        sentence: "The plane flew over the hill."
        scene_note: "飞机从山的上方越过——上方+路径的引申"
        supports: claim
      - level: 2
        word_ids: [G1_002, G3_142, G1_0928]
        sentence: "The book is on the desk."
        scene_note: "书桌场景——on 的原型场景，与 in 形成对照"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "介词义项清单式误用"
        note: "清单未登记本条逐字错例，按纪律不自编；待课堂/语料错例补录后回填。"
    relatives:
      - {id: P-02, rel: 前置}
      - {id: P-10, rel: 同族}
      - {id: PB-01, rel: 对照}
      - {id: PB-06, rel: 对照}
    quiz:
      - q: "第一次学 over，先记哪一个意思最划算？"
        options: ["在……上方（中心义）", "盖住", "结束"]
        answer: "在……上方（中心义）"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: []
    order: 1
    pain_points: [错不完, 记不住]
    adult:
      sources: ["Tyler & Evans (2003), Cambridge University Press（接触等级：专著系统论述级；书评与方法转述见清单原文链接）"]
      boundary: "网络是分析模型，不是要求孩子背下整张网；教学只取原型图 + 一级引申，远端义项按频率逐个补。"
      disputes: ["Sandra & Rice (1995) 质疑多义网络的心理真实性；Evans 后期 LCCM 主张部分义项靠语境在线生成——分歧影响教学剂量，不影响「禁清单式死记」的共同结论（清单原文登记）"]
      evidence_grade: "专著定版级"
      pending: ["误解探针待补（W7 收口）", "病句医院病例待补"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: P-02
    zone: 小系统
    group: P
    headline: "原型不是凭感觉选的：四条证据定中心"
    headline_kid: "全家福中间放谁的照片，要讲证据：谁最老、谁亲戚最多、谁最能代表全家——不是随便挑的。"
    claim:
      type: tendency
      statement: "在 Tyler & Evans 的判据下，哪个义项是原型由四条证据裁定：历史上最早出现的义、网络中牵连最多的义、与邻居介词构成对照的义、最能预测其他义项的义；四条指向同一个，才够格当中心。"
      evidence: ["Tyler & Evans (2003: 47) 明列的四项标准"]
      scope: "Tyler & Evans 有原则多义框架内的原型判定；不是学界终局定案"
      exceptions:
        - {note: "四条证据偶有冲突（如 of 的空间源头在共时网络中已近脱落），此时以教学可用性裁决并注明，不硬凑", word_ids: [V6_核心_54]}
    mechanism:
      - beat: "四条证据"
        text_kid: "选中心要过四关：最老、亲戚最多、最能跟邻居分工、最能猜出别的亲戚。"
        text_adult: "把「原型」从直觉概念升级为可核查的方法论，避免不同教材各说一个中心义。"
        visual: "四条证据的清单图 + over 的四关全过标记"
        anchors: [V6_核心_40]
      - beat: "over 的裁决示范"
        text_kid: "over 的老家是「在上方」：它最老、亲戚最多，所以坐在全家福中间。"
        text_adult: "15 个义项中 8 个直接涉及 ABOVE 满足主导证据；词源最早义为「高于」，两条独立证据同指一心。"
        visual: "over 网络图上标出 8 个涉 ABOVE 的节点"
        anchors: [V6_核心_40]
    examples:
      - level: 1
        word_ids: [G1_013, V6_核心_40, G2_079]
        sentence: "The bird is over the tree."
        scene_note: "鸟在树上方——中心义 ABOVE"
        supports: claim
      - level: 1
        word_ids: [G1_046, V6_核心_39, G3_0505]
        sentence: "The plane is above the clouds."
        scene_note: "与邻居 above 对照——证据三（对照集）"
        supports: claim
      - level: 2
        word_ids: [V6_核心_40, G5_229]
        sentence: "The car went over the bridge."
        scene_note: "越过义——由中心义可预测的引申（证据四）"
        supports: claim
      - level: 2
        word_ids: [G1_041, V6_核心_40, G2_077]
        sentence: "The ball rolled over the hill."
        scene_note: "滚过山坡——上方+路径"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "中心义误定"
        note: "方法论条目，清单未登记逐字错例，不自编。"
    relatives:
      - {id: P-01, rel: 前置}
      - {id: P-06, rel: 同族}
      - {id: PB-05, rel: 对照}
      - {id: PB-07, rel: 对照}
    quiz:
      - q: "判定一个义项是不是原型，下面哪一条不是 Tyler & Evans 的证据？"
        options: ["历史上最早出现", "老师觉得最常用", "最能预测其他义项"]
        answer: "老师觉得最常用"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [P-01]
    order: 2
    pain_points: [记不住]
    adult:
      sources: ["Tyler & Evans (2003: 47)（接触等级：专著原文级转述，见清单链接）"]
      boundary: "四条证据偶有冲突时以教学可用性裁决并注明（见 claim.exceptions）。"
      disputes: ["这套裁决法是 Tyler & Evans 一家的：Brugman/Lakoff 的动态复合中心说并存登记（PB-05–PB-07）；Vandeloise 有简约性批评，Sandra & Rice (1995) 有心理真实性批评；by 的中心义仍有案可查之争（清单 v3 回写登记）"]
      evidence_grade: "专著原文级"
      pending: ["误解探针待补（W7 收口）", "病句医院病例待补"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: P-03
    zone: 小系统
    group: P
    headline: "in 的原型是「装进容器」：边界之内，且受容器影响"
    headline_kid: "in 就是「进到里面」：在盒子里、在房间里、在队伍里——被围起来，就是 in。"
    claim:
      type: rule
      statement: "in 的中心场景是「一个东西被包容在有边界的空间里」——不止位置在内，还附带「被围住、受保护、受影响」的功能面；房间、盒子、城市、队伍、一段时间都是不同尺度的容器。"
      evidence: ["Tyler & Evans (2003) 对 in 的 proto-scene 分析（容纳为中心义）", "Language and Cognition 图式实验：被试对 in 的 CONTAINMENT 图式有稳定的心理意象对应"]
    mechanism:
      - beat: "容器图式"
        text_kid: "东西装进口袋、杯子，人进屋子——装进一个有边的地方，就是 in 的老家。"
        text_adult: "容纳图式（CONTAINMENT）来自身体经验；原型场景除几何面外还含功能面：容器对内容物施加影响（庇护、限制、浸泡）。"
        visual: "容器剖面图：物体在边界之内，容器以虚线标出「影响」"
        anchors: [G3_140, G1_0994]
      - beat: "容器可以变大变抽象"
        text_kid: "城市是装人的大容器，队伍是装人的长容器，in trouble 是泡在麻烦里出不来。"
        text_adult: "尺度与域可变：in the city（区域）、in the team（集合）、in trouble / in love（状态浸泡）都是一级引申。"
        visual: "同心放大图：盒子→房间→城市→状态"
        anchors: [G4_0985, G4_0989, V6_日常_63]
    examples:
      - level: 1
        word_ids: [G1_014, G3_140, G1_0994]
        sentence: "The cat is in the box."
        scene_note: "纸箱与猫——最典型的容器场景"
        supports: claim
      - level: 1
        word_ids: [G1_015, G3_140, V6_家庭_36]
        sentence: "The dog is in the room."
        scene_note: "房间是装人和物的容器"
        supports: claim
      - level: 2
        word_ids: [G3_131, G3_140, G4_0989]
        sentence: "The students are in the team."
        scene_note: "队伍作为集合容器（学生为复数泛指，students 词形经词库 student 归一）"
        supports: claim
      - level: 2
        word_ids: [G1_055, G3_140, G2_0936]
        sentence: "The water is in the cup."
        scene_note: "液体被杯子装住并受其形状影响"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "in/on 切分误用"
        note: "错位高发区见 PB-12；逐字病例待语料补录，不自编。"
    relatives:
      - {id: P-01, rel: 前置}
      - {id: P-04, rel: 对照}
      - {id: P-05, rel: 对照}
      - {id: PB-12, rel: 同族}
    scene_spec:
      facts: "对象：小物（图形）+ 容器（背景）；状态变化：小物由外进入边界之内；守恒：容器边界不破"
      beats: "入场（外）→ 穿越边界 → 停在内部并受容器影响（停顿标注）"
    quiz:
      - q: "「小鸟在鸟笼里」用哪个词最贴？"
        options: ["in", "on", "at"]
        answer: "in"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [P-01]
    order: 3
    pain_points: [错不完, 说不出]
    adult:
      sources: ["Tyler & Evans (2003) in 的 proto-scene 分析", "Language and Cognition 图式心理意象实验（清单原文链接）"]
      boundary: "容纳的边界可由功能划定而非物理围合（in the street 英式指在街道区域内）；in the photo 靠「画面即容器」的识解，属一级引申。"
      disputes: []
      evidence_grade: "专著定版级 + 实验支持"
      pending: ["误解探针待补（W7 收口）", "病句医院病例待补"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: P-04
    zone: 小系统
    group: P
    headline: "on 的原型是「贴面加承重」：接触面在替它撑着"
    headline_kid: "on 就是「贴在表面上」：东西挨着一个面，靠这个面托着、挂着、套着。"
    claim:
      type: rule
      statement: "on 的中心场景是「贴在一个面上，并且被这个面撑住」——接触（contact）与支撑（support）是原型双要素；支撑不必自下而上，墙面以附着、手指以环绕方式同样「负责」物体的位置。"
      evidence: ["Tyler & Evans (2003) 对 on 的 proto-scene 分析", "本项目纲领 dom-prepositions coreView 已采此口径"]
    mechanism:
      - beat: "贴面"
        text_kid: "书贴在桌面上，画贴在墙上，戒指套在手指上——都先要「挨着一个面」。"
        text_adult: "接触是 on 的第一要素；面的朝向不限：水平面、垂直面、环绕面都是面。"
        visual: "三种面朝向并排：桌面（托）/墙面（挂）/手指（套），同一图式"
        anchors: [G3_142, G1_002, G4_158]
      - beat: "承重"
        text_kid: "面不只是挨着，还要「负责」：没有桌面，书就掉下去了。"
        text_adult: "支撑是功能要素：面以承托、附着或环绕的方式维持物体的位置；on the bus 是被交通工具承载的一级引申。"
        visual: "桌面抽走→书下落的对照帧"
        anchors: [G2_105]
    examples:
      - level: 1
        word_ids: [G1_002, G3_142, G1_0928]
        sentence: "The book is on the desk."
        scene_note: "书桌——水平面承托"
        supports: claim
      - level: 1
        word_ids: [G4_158, G3_142, G3_0934]
        sentence: "The picture is on the wall."
        scene_note: "挂画——垂直面附着（中国孩子高发错位点，见 PB-12）"
        supports: claim
      - level: 2
        word_ids: [V6_服装_26, G3_142, V6_身体_13]
        sentence: "The ring is on her finger."
        scene_note: "戒指套手指——环绕式承托"
        supports: claim
      - level: 2
        word_ids: [G1_014, G3_142, G2_0930]
        sentence: "The cat is on the table."
        scene_note: "猫在桌面上——面承托活物"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "汉语「上」直译误用 in/at"
        note: "错位图见 PB-12；逐字病例待语料补录，不自编。"
    relatives:
      - {id: P-03, rel: 对照}
      - {id: PB-03, rel: 对照}
      - {id: PB-12, rel: 同族}
    scene_spec:
      facts: "对象：物体（图形）+ 面（背景）；状态变化：物体落到面上并停住；守恒：接触不中断"
      beats: "悬空 → 落面 → 面承托（停顿标注「面在负责」）"
    quiz:
      - q: "画挂在墙上，为什么用 on 不用 in？"
        options: ["画贴在墙面上，墙面负责挂住它", "画在墙的里面", "墙是一个点"]
        answer: "画贴在墙面上，墙面负责挂住它"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [P-01]
    order: 4
    pain_points: [错不完, 说不出]
    adult:
      sources: ["Tyler & Evans (2003) on 的 proto-scene 分析"]
      boundary: "on 的「面」可退化为线或点（on the corner 与 at 竞争，英美有别）；on foot 是固定习语——本项目 FR09 已裁定不得编「脚踩地面接触」的伪因果，与本条机制严格区分。"
      disputes: ["功能几何框架（P-08）强调：单说「贴面」不够，面的功能角色才是 on 与 in 分工的决定项——与本条不冲突，是精度之争（清单原文登记）"]
      evidence_grade: "专著定版级"
      pending: ["误解探针待补（W7 收口）", "病句医院病例待补"]
    status: 入模中
    version: "1.0"
    changelog: ["2026-11-01 由清单 v6 入模（波次 W4）"]
  - id: P-05
    zone: 小系统
    group: P
    headline: "at 的原型是「当成一个点」：把对象压扁成坐标"
    headline_kid: "at 是把东西看成地图上的一个小点点：地方再大，在 at 眼里也只是一个点。"
    claim:
      type: rule
      statement: "at 的中心操作是「点化」：把一个地方、一个时刻、一个目标在心里压成一个没有大小的点来对待——at the door、at 5 o'clock、aim at 都是同一次维度消减的识解操作。"
      evidence: ["Tyler & Evans (2003) 对 at 的分析（点位为中心义）", "本项目纲领 coreView 同此口径"]
    mechanism:
      - beat: "点化"
        text_kid: "车站那么大，在地图上也只是一个点——说 at 的时候，心里想的就是那个点。"
        text_adult: "点化 = 主动忽略对象的内部结构（大小、形状），只保留其在参照系中的坐标位置。"
        visual: "车站实景渐缩成地图上的一个点"
        anchors: [V6_核心_37, G4_0517]
      - beat: "点在各域复现"
        text_kid: "地方可以是一个点，时间也可以：五点钟就是时间线上的一个点。"
        text_adult: "at 与 in/on 的对立在地点与时间两域平行出现（at the station / in the city；at 5 / in June），是图式跨域复用的强证据。"
        visual: "地点轴与时间轴并排，at 同点亮两轴的点位"
        anchors: [G1_022]
    examples:
      - level: 1
        word_ids: [G3_131, V6_核心_37, G4_0517]
        sentence: "The student is at the station."
        scene_note: "车站作为位置点"
        supports: claim
      - level: 1
        word_ids: [V6_核心_15, V6_核心_37, V6_家庭_34]
        sentence: "We are at home."
        scene_note: "家被点化为所在位置"
        supports: claim
      - level: 2
        word_ids: [G1_007, V6_核心_37, G1_0932]
        sentence: "The teacher is at the door."
        scene_note: "门口是一个位置点"
        supports: claim
      - level: 2
        word_ids: [G2_105, V6_核心_37, G4_0517]
        sentence: "The bus is at the station."
        scene_note: "车辆到站——点位到达"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "at/in 点与容器混用"
        note: "清单未登记逐字病例，不自编。"
    relatives:
