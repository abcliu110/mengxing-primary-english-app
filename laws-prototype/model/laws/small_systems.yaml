      boundary: "顺序是强倾向不是锁步；语言特异性限定（v3 回写）：展开顺序是各语言在自身范畴内部的展开，不预设普适概念清单；对中国孩子还要叠加刀口错位（PB-12）。"
      disputes: ["习得顺序的儿童证据多来自英语母语儿童；汉语儿童的时间介词相对难度排序可能位移，待本项目自证（清单原文登记）"]
