        text_adult: "Quirk et al. (1985: 348–349、748) 把天气 it 定为 prop it「语义内容很少或没有」；两派的事实基础相同、分歧在记账方式。本条按清单裁定：教学主读法取 Bolinger，学术登记保留 Quirk 并列，不裁定学术胜负（见 disputes）。"
