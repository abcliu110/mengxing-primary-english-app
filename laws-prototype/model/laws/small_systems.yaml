    order: 39
    pain_points: [错不完, 说不出]
    adult:
      sources: ["Gundel, Hedberg & Zacharski (1993)", "Hawkins (1978) 定位理论；Lyons (1999)《Definiteness》综述判定"]
      boundary: "定位材料可以不在上文里（见 C-08 菜单）；类指 the 是把整个物种当作一个整体来定位的延伸用法（C-13），高年级内容。"
      disputes: ["定指语义核心百年之争：熟悉说（Christophersen 1939）vs 唯一说（Russell 1905；Hawkins 1978）；Lyons (1999) 判定两说各覆盖一部分用法，以「可辨识性」为上位概念综合——教学取综合说（清单原文登记）"]
