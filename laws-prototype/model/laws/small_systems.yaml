    headline_kid: "米饭不能一粒一粒数？借个碗！「一碗饭、两碗饭」——碗能数，饭跟着碗走。英语也是这么干的。"
    claim:
      type: rule
      statement: "料不能直接数，就借单位词先把它切成有界的份再数——a bowl of rice、two pieces of paper；复数 -s 加在单位上，不加在料上。汉语「一碗饭、两张纸」用的正是同一套办法，是现成的正迁移资源。"
      evidence: ["机制层同 Langacker 的 portioning（C-04）", "单位词作为独立语法系统的类型学定版：Aikhenvald《Classifiers: A Typology of Noun Categorization Devices》(2000, OUP；2003 平装 ISBN 978-0-19-926466-7，勿将平装号误作 2000 年条目）", "教学口径（汉语量词正迁移）为本项目纲领 dom-countability-articles coreView 明文"]
    mechanism:
      - beat: "单位先行"
        text_kid: "先找一个能数的帮手：碗、张、条——帮手站在前面数，后面的料跟着走。"
        text_adult: "单位词执行分份操作：给无界的料装上有界的外壳，使其进入可数轨道；量词/单位词系统是人类语言把连续世界离散化的通用装置（classifier 系统与英语 measure words 结构同构）。"
        visual: "米饭整摊 → 碗逐个装份 → -s 亮在 bowl 上而非 rice 上"
        anchors: [G3_0937, G1_054, V6_数字_40]
      - beat: "搭配要逐个记"
        text_kid: "建议是 a piece of advice，不是 a bowl of advice——哪个料配哪个单位，要一个一个记好。"
        text_adult: "单位词本身有搭配习惯，须逐个登记；口语中单位可省略（two coffees，见 C-04），但省略不改变计数落在单位上的本质。"
        visual: "单位配对卡：bowl of rice / piece of paper / piece of advice"
        anchors: [G6_0329]
    examples:
      - level: 1
        word_ids: [G3_0937, G1_054]
        sentence: "I want a bowl of rice."
        scene_note: "食堂打饭——汉语「一碗饭」的同构场景"
        supports: claim
      - level: 1
        word_ids: [V6_数字_40, V6_学校_20]
