  - id: P-14
    zone: 小系统
    group: P
    headline: "to / for / at：三个「指向」介词的分工"
    headline_kid: "to 是「送到门口」，for 是「为了谁」，at 是「瞄准靶心」——都是朝一个方向，但心里装的东西不一样。"
    claim:
      type: rule
      statement: "to 指向终点（移动的落点），for 指向意图与受益（为了谁、奔着什么），at 指向瞄准的点（目标点）——三者共享「指向」图式，靠「落点 / 意图 / 瞄准」分工；中国学生常错在把三者都塞给汉语的「给/对/向」。"
      evidence: ["Tyler & Evans (2003) 对 to/for/at 的个案网络分析", "Tyler, Mueller & Ho (2011) 实验直接验证三词图式教学的可教性（见 P-10）", "for 的三站口径（为了谁/奔着哪儿/持续多久）已由本项目 spacetime 对齐裁定（sf-021/sf-022）"]
    mechanism:
      - beat: "三张指向图"
        text_kid: "to 看终点：走到学校门口停下；for 看为了谁：礼物是给妹妹的；at 看靶心：目光落在门上。"
        text_adult: "三词原型场景分别为路径终点（to）、目的/受益（for，由「在前、为先」引申）、点位瞄准（at，点化图式见 P-05）；引申网络各自展开。"
        visual: "三幅小图并排：箭头落点 / 礼物递向受益人 / 十字准星"
        anchors: [V6_核心_48, V6_核心_49, V6_核心_37]
      - beat: "最重要的落地对比"
        text_kid: "give it to me 是「递给我收着」，give it for me 是「替我拿着/为了我」——收的人和受益的人不是一回事。"
        text_adult: "接收者（to）与受益者（for）的分工是本条在小学阶段最重要的落地对比；汉语「给」一词兼包两职，是误用的母语根源。"
        visual: "同一递物动作两帧：收下 vs 代收，高亮差异"
        anchors: [V6_日常_8]
    examples:
      - level: 1
