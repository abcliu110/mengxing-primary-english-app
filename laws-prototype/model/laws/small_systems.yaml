  - id: C-06
    zone: 小系统
    group: C
    headline: "a 的本职：让听者「认出是哪一类」就够了"
    headline_kid: "说 a 的时候，是在说「随便哪一个都行，我说的就是这种东西里的一个」。"
    claim:
      type: rule
      statement: "a/an 传递的信息只有一条：「我说的是这一类里的某一个，你认出类别就行，不必知道是哪一个」——在给定性等级中 a N 对应「类型可辨识（type identifiable）」一级，是给听者的最低限度定位指令；首次提及、泛指其一、职业身份（a teacher）都用它。"
      evidence: ["Gundel, Hedberg & Zacharski (1993) 'Cognitive status and the form of referring expressions in discourse', Language 69(2): 274–307——给定性等级中 a N 对应 type identifiable 一级"]
    mechanism:
      - beat: "只认类别"
        text_kid: "第一次说起一只狗，说 a dog 就够了：听的人知道「哦，是一只狗」，不用知道是哪一只。"
        text_adult: "指称形式按听者所需的认知状态分级：a 只要求类型可辨识，是整条给定性等级的最底层；等级的蕴涵结构（高状态蕴涵低状态）得到跨语言支持（英语、汉语、日语、俄语、西班牙语五种语言的自然语篇验证）。"
        visual: "一群狗剪影中任一只亮起，标「哪类清楚，哪只不管」"
        anchors: [G1_015]
      - beat: "职业也是类别"
        text_kid: "My mum is a teacher——说的是「她是当老师的这一类人」。"
        text_adult: "职业身份用 a 是同一机制：把人归入一个类型，不涉及唯一定位。"
        visual: "职业卡归类图"
        anchors: [G1_007]
    examples:
      - level: 1
        word_ids: [G1_015]
        sentence: "I have a dog."
        scene_note: "首次提及——只认类别"
        supports: claim
      - level: 1
        word_ids: [G1_002]
        sentence: "This is a book."
        scene_note: "介绍一个新东西"
        supports: claim
      - level: 2
