    claim:
      type: rule
      statement: "Lindstromberg 不给每个介词写孤立词条，而是把意义相邻的介词编成「功能决定的簇」（有核心有外围）地讲：每章从核心词的基本义出发，越走越远地比它和邻居的差别；全书最后一章倒过来编——从抽象概念出发反查该用哪个介词。他的总目标是解释「在同一语境里换掉一个介词，意义为什么变、怎样变」，替换测试是其基本教学动作。"
      evidence: ["Lindstromberg《English Prepositions Explained》（初版 1998；修订版 2010, John Benjamins, 273 pp.）出版社目录全文", "Levshina 书评（Language 学会 Book Notices）对全书结构与簇组织的系统描述（接触等级：目录 + 书评级）"]
