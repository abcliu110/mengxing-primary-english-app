        word_ids: [G1_046, V6_核心_40, G2_077]
        sentence: "The plane flew over the hill."
        scene_note: "越过山丘——over 的牵连义"
        supports: claim
      - level: 1
        word_ids: [G1_046, V6_核心_39, G3_0505]
        sentence: "The plane is above the clouds."
        scene_note: "只比云高——above 的标量义"
        supports: claim
      - level: 2
        word_ids: [G1_014, G3_143, G2_0930]
        sentence: "The cat is under the table."
        scene_note: "桌子下方且被桌罩着——under 的牵连义"
        supports: claim
      - level: 2
        word_ids: [G2_0506, V6_核心_39, G5_231]
        sentence: "The stars are above the mountain."
        scene_note: "星星比山高——纯高低"
        supports: claim
      - level: 2
