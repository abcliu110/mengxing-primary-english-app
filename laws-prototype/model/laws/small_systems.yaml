  - id: PR-04
    zone: 小系统
    group: PR
    headline: "礼貌和亲疏本来住在代词里——英语把这套系统拆了，礼貌搬了家"
    headline_kid: "以前的英语也有「您」和「你」的分工，后来只剩一个 you——所以英语的礼貌不在代词里，要靠别的说法（称呼、语气、绕个弯）来补。"
    claim:
      type: rule
      statement: "欧洲语言史上，第二人称的 T/V 对立是权力与亲疏的语法化编码；英语在近代丢失 thou/you 对立后，礼貌功能整体迁出代词系统，改由称呼语、情态与间接言语行为承担——对老师说 you 完全正确，礼貌靠 Please / Mr. / Ms. / Could you…? 补足。"
      evidence: ["Brown & Gilman (1960)「权力与同等」分析（T/V 系统的历史语义）", "Mühlhäusler & Harré (1990: 5) 把性别、等级并列为编进指人表达的社会关系", "Siewierska (2004) 第 6 章「人称形式与社会指示」（6.1 语义范畴的挪用、6.2 专门敬称人称标记）（接触等级：章节预览级）"]
