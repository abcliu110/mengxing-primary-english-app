  - id: PR-01
    zone: 小系统
    group: PR
    headline: "代词首先是「关系词」，不是「代替名词的词」"
    headline_kid: "代词不只是替名字省事的词——你选哪个代词，就在告诉大家「我和你是什么关系、谁和谁是一伙的」。"
    claim:
      type: rule
      statement: "传统语法把代词定义为「代替名词的词」（回指功能），顺序应当倒过来：指人表达的首要工作是个人指示、社会指示与身份建构——大多数语言里「指人的表达都包含对特定社会关系的指涉」，性别、等级、亲疏被直接编进代词系统。"
      evidence: ["Mühlhäusler & Harré《Pronouns and People: The Linguistic Construction of Social and Personal Identity》(1990, Basil Blackwell；开篇断言见 p. 5，二手引文）（接触等级：二手系统论述级——框架经多篇带页码引文的学术二手论述拼合）"]
    mechanism:
      - beat: "先关系后代替"
        text_kid: "说 I、you、we 的时候，你不只是在指人，还在说清「谁跟谁是一伙的、谁在说话、谁在听」。"
        text_adult: "该书的立书命题被概括为「语法与自我感密切相关」（grammar and the sense of self are intimately related）；后续 Davies & Harré (1990) 的定位论（positioning）即由该书思路长出，其后三十年的代词与身份研究持续以该书为源头引用。"
        visual: "人物关系网图：代词节点亮起时，关系线同时亮起"
        anchors: [V6_核心_15, V6_核心_4]
      - beat: "英语里藏得深"
        text_kid: "英语的代词个子小，关系藏得深：一个 we，就能把全班说成一伙的。"
        text_adult: "该书的论证材料以欧洲语言与皮钦语/克里奥尔语为主，其「社会关系编码」在英语里因代词系统瘦小而表现隐蔽（见 PR-04），不能按法语/爪哇语的显性程度向孩子展示。"
        visual: "老师说 We 时全班被圈成一组的示意"
        anchors: [V6_核心_15, V6_学校_25]
    examples:
      - level: 1
        word_ids: [V6_核心_15, V6_家庭_27]
        sentence: "We are friends."
        scene_note: "we 把说话人和伙伴说成一伙（friends 词形经 friend 归一）"
        supports: claim
      - level: 1
        word_ids: [V6_核心_4, V6_核心_1]
        sentence: "You are my friend."
        scene_note: "you 与 my 同时标出关系双方"
        supports: claim
      - level: 2
        word_ids: [V6_核心_19, G3_130]
        sentence: "They are my friends."
        scene_note: "they 把第三方划成另一组（词形经 friend 归一）"
        supports: claim
      - level: 2
        word_ids: [V6_核心_15, G4_0393]
        sentence: "We are classmates."
        scene_note: "同班即共同体——学校场景（词形经 classmate 归一）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "代词关系义忽视（语用层）"
        note: "框架条目，清单未登记逐字病例，不自编。"
    relatives:
