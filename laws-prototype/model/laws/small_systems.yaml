    mechanism:
      - beat: "两把尺子"
        text_kid: "中文说「在桌子上、在盒子里」，靠后面的「上、里」分工；英语靠 in、on、at 三张图分工——分工的位置不一样。"
        text_adult: "母语的空间概念化方式（汉语的后置定位与方位名词系统）作为默认框架被带入英语（概念迁移）；同母语背景学生错误形态高度趋同且与汉语切分线对应，是「系统差异」的判据（Jarvis 迁移可检测性标准）。"
        visual: "同一场景两把尺子并排量：汉语刀口 vs 英语刀口"
        anchors: [G3_140, G3_142, V6_核心_37]
      - beat: "错位高发区"
        text_kid: "「在墙上」要用 on、「在树上」苹果和鸟还不一样——这些地方最容易拿错尺子，要多练。"
        text_adult: "错误集中在切分不一致的地带；错位地图见 PB-12（本条给出语料描写，PB-12 给出习得机制解释）。"
