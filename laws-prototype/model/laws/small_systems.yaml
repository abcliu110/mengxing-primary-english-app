  - id: PB-03
    zone: 小系统
    group: PB
    headline: "on 被他拆成两个基本义：on1「接触承托」与 on2「继续向前」——切分粒度之争的一个标本"
    headline_kid: "on 有两张证件照：一张是「贴在面上」，一张是「接着往前走」。"
    claim:
      type: tendency
      statement: "在 Lindstromberg 的系统里，on 有两个并列的基本义：on1 表接触（主体与一面相贴、被托住），on2 表「继续、向前」（go on、on and on 的 on）；两个基本义各自带一簇用法，中间不强行修桥——当两组用法的图式差异大到画不出同一张图时，宁可立两个基本义。"
      evidence: ["Lindstromberg (2010) 目录第 3、4 章标题明载 On1/on2 之分（接触等级：目录 + 书评级；具体论述未读原书正文，转述层级已标注）"]
      scope: "Lindstromberg 系统内的共时教学表征；不否认两者历史同源"
      exceptions:
        - {note: "原记『Tyler & Evans 将继续义置于小品词/体貌侧』，经原书全文复核查无对应推导，2026-11-02 经用户裁定撤销此归属；on 继续义的桥仅据 Lindstromberg 弱桥登记。", word_ids: [G3_142]}
    mechanism:
      - beat: "两张图"
        text_kid: "一张图是球贴在面上（on1），一张图是箭头沿着路继续往前（on2）——画不成一张，就老实分成两张。"
        text_adult: "判断标准仍是可描绘性（PB-02）：on2 的「沿原路继续」是另一个可画图式，与 on1 的静态接触图不同源；全书目录即按此编排（第 3 章 'On1, off, on2'）。"
        visual: "on1 静态接触图与 on2 沿线向前图并置，中间标「不修桥」"
        anchors: [G3_142, G3_K44]
      - beat: "教学剂量"
        text_kid: "（教师侧）小学只教 on1；on2 在短语动词单元以整块形式出现即可，不必现在立条教学。"
        text_adult: "on2 的独立性在语料中显而易见：carry on / go on 的「继续」义无法从「贴面」经语用强化自然推出（没有经验桥梁），拆分派据此立义。"
        visual: "on1/on2 用法簇的剂量分配图"
        anchors: [G3_142]
    examples:
      - level: 1
