        text_adult: "该书 Ch. 3.3 专门论证性别的人称层级制约（人称层级越低越可能区分性别）；儿童教学只取类型学坐标：知道英语缺了哪些格，日后学法语、日语时就不会误以为那些格是多余装饰；we 的滑移性（PR-03）也由「无包容对立、无皇家标记」的留白解释。"
