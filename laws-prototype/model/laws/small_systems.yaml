    group: P
    headline: "华语学生的介词错误是「切分不同」，不是「记性不好」"
    headline_kid: "中文和英语像两把不同的尺子，量同一个地方，刻度画的位置不一样。用错介词常常不是忘了，是拿错了尺子。"
    claim:
      type: tendency
      statement: "中国学生错介词，多是把汉语「在 + 方位词」系统的切分线套到英语 in/on/at 的图式系统上——属于概念迁移：错误成系统、可预测，集中在两系统切分不一致的地带。"
      evidence: ["CLEC（桂诗春、杨惠中 2003）：介词短语是中国学习者 11 大类偏误之一", "基于 CLEC 的 at/on/in 误用与概念迁移专项研究（证据等级：语料个案分析，强度中等）"]
      scope: "华语母语学习者的介词错误预判；CLEC 被试为中学生以上，小学生分布可能不同"
      exceptions:
