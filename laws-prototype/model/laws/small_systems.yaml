  - id: C-17
    zone: 小系统
    group: C
    headline: "量词排队先看识解：many/much、few/little 是同一总开关的下游"
    headline_kid: "先决定东西是「一个个」还是「一摊」：一个个的用 many/few，一摊的用 much/little——开关只有一个，灯有好几盏。"
    claim:
      type: rule
      statement: "选 many 还是 much、(a) few 还是 (a) little，不取决于词本身，只取决于被量的东西当前被看成「一个个」还是「一摊」——量化词与冠词、复数 -s 是同一个识解总开关（C-01）的三个出口；量化是对已识解完毕的指称域作量级评估。"
      evidence: ["识解总开关的上游出处同 C-01（Langacker 2008）", "量化词与可数性的系统对应以 Quirk et al.《A Comprehensive Grammar of the English Language》(1985, Longman) 的描写为准（本项目纲领既定基准来源之一）"]
