        text_kid: "stand up 是真的站起来（往上）；eat up 是吃到底、吃光——up 还是那个 up。"
        text_adult: "小品词与介词同源同图式，在短语动词中的意义贡献是图式义的系统引申（完结、显现、脱离、持续等体貌义）。"
        visual: "容器装满到顶的动画对应 eat up 的「光盘」帧"
