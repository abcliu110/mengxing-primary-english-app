  - id: C-20
    zone: 小系统
    group: C
    headline: "冠词错误要分型纠：漏用、误加、替换是三种病、三种药"
    headline_kid: "冠词出错有三种样子：忘了放、放多了、放错了——先看清是哪一种，再对症下药。"
    claim:
      type: rule
      statement: "冠词错误按形态分三型：漏用（缺槽位意识，药是立规矩）、the 滥用（按具体性选词，药是换判据到「对方能否定位」）、a/the 替换（定位判断本身摇摆，药是五路线索训练）——三型对应三个不同的心理环节（范畴缺位、参数未定版、线索评估不熟），不分型地「多练冠词」效率最低。"
      evidence: ["分型框架综合 Ionin, Ko & Wexler (2004)（替换/滥用型的机制，C-09）与 CLEC 的错误标注分类（漏用型的语料形态，C-10）", "教学分轨思路与 Master (1997) 按用法类别组织冠词教学的框架一致", "Liu & Gleason (2002)：the 的不同用法类别难度与错误形态显著不同（C-08），是分型施教最直接的实证依据"]
    mechanism:
      - beat: "三型三药"
        text_kid: "忘了放——先练「名词前面要有小词」；放多了 the——练「对方找得到吗」；放错了——练五条找东西的路。"
        text_adult: "干预必须对准出故障的环节：漏用治范畴缺位（母语无冠词），滥用治参数未定版（波动），替换治线索评估不熟；干预顺序一般为先漏用、再滥用、后替换。"
        visual: "三型诊断卡并排，各挂一味药签"
