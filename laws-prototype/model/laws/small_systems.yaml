        sentence: "The book is on the desk."
        scene_note: "on1：接触承托"
        supports: claim
      - level: 1
        word_ids: [G3_142, G2_0489]
        sentence: "Go on, play!"
        scene_note: "on2：继续（操场口语指令）"
        supports: claim
      - level: 2
        word_ids: [G4_158, G3_142, G3_0934]
        sentence: "The picture is on the wall."
        scene_note: "on1：附着也是接触"
        supports: claim
      - level: 2
        word_ids: [G2_0492, G3_142]
        sentence: "Read on."
        scene_note: "on2：接着读——课堂指令整块"
        supports: claim
    error_cases:
