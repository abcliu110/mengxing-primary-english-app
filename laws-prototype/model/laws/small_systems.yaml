      type: rule
      statement: "中国学习者把汉语的话题结构当成功能蓝图带进英语：需要「先摆出话题再展开」时，顺手抓英语现成的 there be 与主语提升构式来顶替（存现句滥用、外置句偏好、伪被动），表面形式是英语的，功能骨架是汉语的——迁移的单位是语篇组织功能，不是词形对应。"
