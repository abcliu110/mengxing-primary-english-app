  - id: PB-11
    zone: 小系统
    group: PB
    headline: "韩语孩子按「紧贴不紧贴」切世界，英语孩子按「包住/托住」切——同一批积木，两种分法，从一岁半就开始分"
    headline_kid: "小朋友的眼睛会学着「家里的话」去切蛋糕：说英语的按「装进去／放在上面」切，说韩语的按「卡得紧／放得松」切——同一桌玩具，两种切法，都从很小的时候就开始练了。"
    claim:
      type: rule
      statement: "空间范畴不是先有一套全人类相同的、再贴上词：英语把「契合度」排除在介词之外（戒指套手指用 on、磁带进盒用 in，紧不紧与介词无关），韩语却把契合度升为组织空间动词系统的核心维度（kkita 紧贴契合 vs nehta 松放装入）；非语言分类任务显示，约 18–23 个月的幼儿已按自己语言的刀口看世界——范畴切口跟着本语言一起长出来。"
      evidence: ["Bowerman & Choi (2001) 'Shaping meanings for language'，载 Bowerman & Levinson 编《Language Acquisition and Conceptual Development》(CUP), pp. 475–511（页码经 2026-11-01 定版销项）", "18–23 个月数字出处修正：Choi, McDonough, Bowerman & Mandler (1999), Cognitive Development 14(2): 241–268", "前驱：Choi & Bowerman (1991), Cognition 41；Casasola (2005) 反向作用证据（接触等级：二手系统论述级，多源互证）"]
    mechanism:
      - beat: "同一批积木两种分法"
        text_kid: "把戒指套上手指、把磁带放进盒子：英语只问「装进去还是放在上面」，韩语先问「卡得紧不紧」。"
        text_adult: "英语把包含 vs 支撑作组织对子、把契合度拆散重组（套/嵌归 on，塞紧/装入归 in）；韩语以契合度为核心维度组织空间动词——同一组事件，两种范畴切法。"
        visual: "四格事件（套戒指/磁带进盒/拼图嵌入/杯子摞杯）两套分格对照"
        anchors: [V6_服装_26, V6_身体_13, G1_0994]
      - beat: "词反过来扶范畴"
        text_kid: "（教师侧）听到熟悉的 on，18 个月的宝宝更容易把「托住」的事情归成一类——词一边学，一边帮眼睛分类。"
        text_adult: "Casasola (2005) 显示词对范畴的反向扶持；产出分化约 14–16 个月起，非语言分类的语言特异性敏感性见于 18–23 个月（眼动/偏好注视研究）。"
        visual: "发展时间线：14–16 月产出分化 → 18–23 月非语言敏感性"
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_服装_26, G3_142, V6_身体_13]
        sentence: "The ring is on her finger."
        scene_note: "套手指——韩语按「紧贴」另切，英语归 on（契合度不入介词）"
        supports: claim
      - level: 1
        word_ids: [G1_041, G3_140, G1_0994]
        sentence: "The ball is in the box."
        scene_note: "装入盒中——英语的「包含」刀口"
        supports: claim
      - level: 2
        word_ids: [G2_0936, G3_142, G2_0936]
        sentence: "The cup is on the cup."
        scene_note: "杯子摞杯子——摞叠事件是两套切法的对照素材（同词复现）"
        supports: claim
      - level: 2
        word_ids: [G1_002, G3_140, G1_0994]
        sentence: "The books are in the box."
        scene_note: "书装箱——松放也归 in（词形经 book 归一）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "母语范畴刀口迁移（预测型）"
        note: "本条为习得研究登记；对中国孩子的具体错位图见 PB-12，逐字病例待补，不自编。"
    relatives:
