  - id: P-15
    zone: 小系统
    group: P
    headline: "小品词是介词的「动词版亲戚」：up / out / off 的图式义随身携带"
    headline_kid: "动词后面的小词 up、out、off 都有自己的画面：up 是「满了、到底了」，out 是「从里面出来」——看着画面记短语动词，容易得多。"
    claim:
      type: tendency
      statement: "短语动词里的 up、out、off 带着各自的图式义上岗：up 有「到顶、到底」的完结义（源于容器装满到顶），out 是「由内到外、脱离原位」；图式义的贡献是系统性引申，但合成度是连续谱——透明的可推，习语化的仍须整记。"
      evidence: ["Tyler & Evans (2003) 将空间小词处理为统一的多义网络对象（介词与小品词同网）", "Lindner (1981) 对 out/up 的经典分析（UC San Diego 博士论文，导师 Langacker；书目经 CRL 通讯核实）"]
      scope: "图式透明与半透明的短语动词；完全习语化者不在可推范围内"
      exceptions:
