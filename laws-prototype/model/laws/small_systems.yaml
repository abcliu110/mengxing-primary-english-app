  - id: PR-11
    zone: 小系统
    group: PR
    headline: "he/she 说混不是态度问题，是「开机顺序」问题：口头高发、书面低发"
    headline_kid: "中国孩子说话时把 he、she 说混，写下来却很少错——不是不用心，是说话时脑子来不及选：汉语的「tā」本来就不分男女。"
    claim:
      type: tendency
      statement: "汉语普通话的第三人称在口语中只有一个音 tā，性别信息不在「开口前想好的意思」里；说英语时，性别选择被迫推迟到措辞的最后一刻，在快速口语产出中系统性地来不及——于是错误呈「口头高发、书面低发」的分布；这是产出加工的时间问题，不是性别概念问题，更不是态度问题。"
      evidence: ["综述与实验：Frontiers in Psychology (2021) 对中国学习者代词性别错误的系统综述与自产实验证据（PMC8925987）", "Dong & Jia (2011) 二语习得研究：口语 6.47% 与写作 15% 的可检出误用分布（以正式期刊发表数据为准，见 disputes 的转引裁定）"]
      scope: "汉语普通话母语者的英语第三人称产出（口头/书面分布差异）"
      exceptions:
        - {note: "个别学习者的错误可源于词汇混淆等其他环节，不能一概按加工说诊断；书面高发者须另查范畴问题", word_ids: []}
    mechanism:
      - beat: "开口前的清单"
        text_kid: "说话像发快递：汉语打包时不贴「男/女」标签，英语发货前必须贴——说得快，就容易贴错；写的时候慢慢贴，就很少错。"
        text_adult: "该综述的机制模型：言语产出中性别特征须在概念化阶段编码，汉语母语者的概念化阶段没有这一项，于是选择被推迟到形式编码阶段，时间压力下出错；同音问题不在听辨而在产出规划。"
