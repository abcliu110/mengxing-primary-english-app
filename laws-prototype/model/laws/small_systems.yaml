      boundary: "作者自陈这些基本义的「认知真实性仍需实证支持」（Levshina 书评转述）——图标是教学表征，不冒充心理实验结论；不可描绘的词（with、of 等）不许硬画一张图充数，与本项目「不许编伪因果」同向。"
      disputes: ["与 Tyler & Evans 分工不同：原型场景是分析者归纳的抽象图式（求分析严谨），Lindstromberg 的图标是面向学习者的可画版本（求可教）——清单 P-03/P-04 用前者，本条补后者为教学呈现层（清单原文登记）"]
      evidence_grade: "目录 + 书评 + 作者自述级"
      pending: ["误解探针待补（W7 收口）"]
