  - id: PB-06
    zone: 小系统
    group: PB
    headline: "连接节点的不是「引申理据」，是「图式变换」：链的性质决定了网络能长多长"
    headline_kid: "像传话游戏：每人只改一个字，传到最后，句子已经完全不一样——但每一步都能说清改了哪里。"
    claim:
      type: rule
      statement: "在 Brugman/Lakoff 的网络里，相邻义项之间的连线是一种图式变换（image-schema transformation）：对中心图式做一个小手术（把注意力移到路径终点、把一堆点看成一个面）就得到一个新义项；网络因此是链式结构——相邻节点共享特征即可，链条末端可以与中心不共享任何特征，这是家族相似在词汇中的实现。"
      evidence: ["Brugman (1981) 与 Lakoff (1987)（同 PB-05）", "Rice (1993) 对两人网络的复刻比较（ESCOL '92 论文集，pp. 206–217；图 4 即 Brugman 原网复刻）（接触等级：二手系统论述级，含网络图复刻件）"]
