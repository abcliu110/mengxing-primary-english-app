  - id: PR-08
    zone: 小系统
    group: PR
    headline: "中国孩子漏主语的总根源：汉语先说「话题」，英语先摆「主语」"
    headline_kid: "汉语说话先摆出「说的是什么事」，后面的句子可以接着往下说；英语每句都要先摆一个主语，哪怕是凑数的 it、there，也得摆上。"
    claim:
      type: tendency
      statement: "汉语是话题突出型语言：句子围绕话题组织，话题一旦立住，后续小句可以在话题链中零指称地一路说下去；英语是主语突出型：每个小句必须有语法主语，无话题可立时也要用 it/there 占位。学习者把话题链带进英语，漏主语便成系统性现象，而非粗心。"
      evidence: ["Li & Thompson (1976) 话题突出/主语突出类型学（收入 Li (ed.)《Subject and Topic》, Academic Press；话题突出诊断标准清单见 pp. 466–471、pp. 457–489 一带）", "Li & Thompson (1981)《Mandarin Chinese: A Functional Reference Grammar》：话题链、哑主语零形式等逐项描写", "一手实证：汉语母语者中介语诱发研究（39 名学习者，五项话题突出特征在中介语中全部可检出，2011）"]
