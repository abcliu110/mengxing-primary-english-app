    headline: "全称、代词还是干脆不说——按「心里有多清楚」定价"
    headline_kid: "提到的人越清楚，用的词越省：刚说过的用小代词，久没提的要把名字说全——说太省，别人就找不到你说的是谁。"
    claim:
      type: tendency
      statement: "在完整名词、代词与零形式之间选择，是按所指对象的可及性定价的：代词只配给当前最可及的所指（刚提过、话题中心），远了、岔了、多人竞争了，就必须升回完整名词；写作文时「代词指不清」不是态度问题，是定价错误。"
      evidence: ["Siewierska (2004) 第 5 章指称跟踪：5.2 可及性与分布、5.2.2 话题连续性与词汇表达形式、5.3 指称选择的句法约束（含 5.3.3 避代词约束）（接触等级：章节预览级）"]
