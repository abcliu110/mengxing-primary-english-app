    claim:
      type: rule
      statement: "homework、information、advice 没有形状可切——它们被英语整类打包成「一类事」来处理，所以不可数；识解不限于物理域：在抽象域中，事体以类别而非个体的形式被概念化，继承物质名词的全部语法待遇（无 a、无 -s、借单位计数、配 much）。"
      evidence: ["Langacker (2008)：名词的「区域」定义适用于抽象域（抽象有界名词 moment、paragraph 为其正例，反之抽象无界名词同理）", "本项目 boundedness 模型例外 xc-homework-uncuttable 已登记本类"]
