        text_kid: "（教师侧条目，无儿童面讲解）"
        text_adult: "全书 21 章：19 章按意义簇编排（如第 2 章路径簇 toward/to/into/through/out/from；第 9 章 above/over 簇；第 12 章 under/below 簇），第 21 章是纯概念导向的抽象概念索引；每章离心式展开：核心基本义 → 引申 → 近义词分界。"
        visual: "全书簇地图（以出版社目录为准）"
