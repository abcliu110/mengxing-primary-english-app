  - id: PR-03
    zone: 小系统
    group: PR
    headline: "we 是最「滑」的代词：包不包你，要靠听者自己猜"
    headline_kid: "英语的 we 有时候把听的人算在里面，有时候不算——听到 we，要先想一想「这里面有没有我」。"
    claim:
      type: rule
      statement: "许多语言把「包括听者的我们」与「排除听者的我们」做成两个词（包容式/排斥式对立），英语不做这个区分，于是 we 的边界永远要靠语境裁定；we 至少向听者发出一个邀请——「请你想一想，除了我之外还指谁」，同时是一种「同说」行为：把同一命题一次性套到包括自己在内的一群人头上，共同体就此被说出来。"
      evidence: ["Mühlhäusler & Harré (1990)，经 Goddard (1995: 107) 转述（转述经 Globe 期刊论文原文核实）", "包容/排斥的类型学定版见 Siewierska (2004) 第 3.2.1 节（PR-05）（接触等级：二手系统论述级）"]
    mechanism:
      - beat: "边界靠猜"
        text_kid: "老师说 We have a test today——有你；老师对另一个老师说 We have a meeting——可能没你。听到 we 先找一找自己在不在里面。"
        text_adult: "英语 we 的指称边界不由形式标记，听者须以语境裁定；政治与机构话语研究反复证实 we 是共同体建构的首选工具（老师的「我们班」、演说者的「我们国家」滑移自如），滑移性正来自这一空白。"
