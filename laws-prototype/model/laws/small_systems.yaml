    order: 40
    pain_points: [错不完]
    adult:
      sources: ["Hawkins (1978) 分类（经 Abbott 2006 综述转述）", "Liu & Gleason (2002), Studies in Second Language Acquisition 24(1)"]
      boundary: "五路是充分线索清单，不是每个 the 都要当场验算——母语者是自动化处理；分类细节各家略有出入（Hawkins 原分类更细，教学与习得研究多用简化版）。"
      disputes: []
      evidence_grade: "理论分类 + 习得实证级"
