  - id: C-01
    zone: 小系统
    group: C
    headline: "可数不可数是「看法」，不是物体的物理属性（识解说）"
    headline_kid: "数不数得清，先看你怎么看：看成一个一个的，就能数；看成一摊、一堆的，就不能直接数，要借杯子、碗来帮忙数。"
    claim:
      type: tendency
      statement: "英语数东西之前，先由说话人决定把东西看成一个个的个体，还是一摊料、一类事；形式跟着看法（识解 construal）走，不跟着物体的物理形状走——可数名词 = 在呈现中被识解为有界的区域，不可数名词不带此识解；「有界」指呈现方式（当前取景范围内是否把限界算进图里），与物体有没有物理边框无关。"
      evidence: ["Langacker《Foundations of Cognitive Grammar》Vol. I (1987) 奠基，及《Cognitive Grammar: A Basic Introduction》(2008), 第 5 章（pp. 132–133 原文转引）"]
      scope: "可数性与冠词全域的主导判据与教学入口；不是充要定义——个别名词的归属最终以英语的习惯识解（用法事实）为准"
      exceptions:
        - {note: "rice 颗粒分明却不可数、furniture 件件有形却不可数：物理属性说当场失效的反例，正是识解说的支撑；同时说明归属由习惯识解裁定，不许学习者自创", word_ids: [G1_054, ADD_0113]}
        - {note: "湖里的水物理上有岸，water 仍不可数；moment 没有任何物理形状，却可数（moment 已入词库 ADD_0578）", word_ids: [G1_055, ADD_0578]}
    mechanism:
      - beat: "取景决定形式"
        text_kid: "同一样东西，你把它看成「一个一个」就能数，看成「一摊」就不能数——先有看法，后有说法。"
        text_adult: "说话人可对同一事物施加不同的概念化操作（取景）：把限界与个体性纳入呈现即得可数读法，抹平个体只呈现质料即得不可数读法；语法形式是取景结果的回执。"
        visual: "同一堆米两帧：逐粒高亮（一个个）vs 整摊轮廓（一摊），下方形式随之切换 many→借碗数"
        anchors: [G1_054, G3_0937]
      - beat: "旧说禁区"
        text_kid: "不是「有边没边」决定的！水装在碗里有边，也不能数；要看你心里把它当成一个个还是一摊。"
        text_adult: "Langacker 的 bounding 指呈现方式，不是物理边框；本项目旧「物理边界感」说正是把此概念误读为物理形状，已被证伪，不得以任何形式复活（边界原文）。"
        visual: "旧讲法卡（物理边界）打叉封存，新讲法卡（看法/取景）上场"
        anchors: [G1_055, G2_0936]
    examples:
