    group: P
    headline: "语言怎么「装」运动：英语把路径装进小尾巴，汉语把路径装进动词系统"
    headline_kid: "说「跑出去」，英语和汉语装东西的格子不一样：英语把「怎么动」装进大词（run），把「往哪去」做成小尾巴挂在后面（out）；汉语把「往哪去」也装进动词里。学 run out 不是背新单词，是学英语的装法。"
    claim:
      type: tendency
      statement: "Talmy 的运动事件类型学：语言描写运动时须决定把路径装在哪里——英语是卫星框架语言（方式装进主动词，路径装进小品词卫星），汉语的路径由趋向补语与连动成分承担、分工不同；这是两种语言的特征性默认模式之差，不是「能不能」的绝对禁令。"
      evidence: ["Talmy (1985) 'Lexicalization Patterns'（收入 Shopen 编《Language Typology and Syntactic Description》Vol. 3, pp. 57–149），后系统化于《Toward a Cognitive Semantics》Vol. II (2000)（接触等级：二手系统论述级）", "Slobin (1996) 'Thinking for Speaking'（章节预览级）", "Chen & Guo (2009) 汉语小说语料研究，Journal of Pragmatics 41: 1749–1766（章节预览级）"]
      scope: "类型学特征性（characteristic）默认模式；英语也有路径动词（enter、exit——拉丁层词），汉语也能细说方式"
      exceptions:
        - {note: "英语的路径动词 enter/exit/ascend 恰是拉丁层词，不服从卫星默认——默认模式有成批的词源层例外", word_ids: []}
    mechanism:
      - beat: "两个格子"
        text_kid: "英语的句子像有两个格子：大格子装「怎么动」（跑、游、滚），小格子装「往哪去」（out、in、across）。"
        text_adult: "词汇化模式 = 路径的默认编码位置。卫星框架腾出动词槽位装方式，故方式动词词库异常丰富（trudge、sprint、wade 等），且「方式动词 + 路径卫星」能产性极高——这是短语动词在英语里成系统的根源。"
        visual: "双格装配图：run/swim/roll × out/in/across 自由组合"
        anchors: [G2_087, G3_K21, G3_K40, G5_0638]
      - beat: "为说话而思考"
        text_kid: "说哪种语言，就会先注意哪种东西：说英语的人先看「怎么动」，汉语先看「往哪走、到了没」。"
        text_adult: "Slobin 的 thinking for speaking：每种语言的装法训练配套的注意力习惯，从母语带进二语，构成系统性迁移；Slobin 的跨语言「青蛙故事」叙事研究显示学龄前儿童的叙述已呈现母语框架习惯。"
        visual: "同一运动事件两副眼镜的注视点对照"
        anchors: [G2_087]
    examples:
      - level: 1
        word_ids: [G1_013, G3_K21]
        sentence: "The bird flew out."
        scene_note: "方式（fly）+ 路径卫星（out）的最小装配"
        supports: claim
      - level: 1
        word_ids: [G1_015, G3_K40, G1_0994]
        sentence: "The dog ran into the box."
        scene_note: "跑进箱子——路径装进 into"
        supports: claim
      - level: 2
        word_ids: [G1_014, G5_0638, G4_0592]
        sentence: "The cat ran across the road."
        scene_note: "穿过马路——across 承担路径"
        supports: claim
      - level: 2
        word_ids: [G2_089, G5_0638, G5_232]
        sentence: "We swim across the river."
        scene_note: "游过河——方式动词 + 路径卫星的能产组合"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "汉语趋向结构直译（路径编码错位）"
        note: "错型机制已登记；逐字病例待语料补录，不自编。"
