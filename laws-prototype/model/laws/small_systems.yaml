        text_adult: "Bolinger 的论证要点：天气 it 的指称虽弥漫但非空无——若纯粹凑数，则无法解释它与 *The sky is raining 等替换的不对称与语感差异；Langacker 把它纳入「设定/场景」指称，赋予认知语法的正式位置。"
