        scene_note: "路通向岛——静态延伸用 goes"
        supports: claim
      - level: 2
        word_ids: [G5_229, G5_232]
        sentence: "The bridge is over the river."
        scene_note: "对照：静态位置的普通说法，不用运动词"
        supports: claim
      - level: 2
        word_ids: [G4_0592, G5_231]
        sentence: "The road climbs up the mountain."
        scene_note: "路「爬上」山坡——虚构运动的爬升版（climb 已在库）"
        supports: claim
    error_cases:
