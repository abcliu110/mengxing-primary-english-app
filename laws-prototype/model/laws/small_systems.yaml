  - id: C-09
    zone: 小系统
    group: C
    headline: "学习者选错冠词有个系统原因：先按「具体」选，后按「定指」选（波动假说）"
    headline_kid: "刚开始学的时候，小朋友容易把「我心里想着的那一个」都加上 the，其实英语问的是「对方知不知道是哪一个」。"
    claim:
      type: tendency
      statement: "母语没有冠词的学习者，初期不是在乱猜，而是在用另一套切分：把 the 发给「我心里有具体所指」的名词，哪怕是第一次提——随着输入积累，才切换到英语的「说听双方可定位」切分（波动假说：冠词选择在「定指」与「具体性」两种切分间波动，直至参数定版）。"
      evidence: ["Ionin, Ko & Wexler (2004) 'Article semantics in L2 acquisition: The role of specificity', Language Acquisition 12: 3–69——冠词选择参数与波动假说的原始论文"]
      scope: "无冠词母语学习者的替换/滥用型错误；证据来自成人被试，儿童的波动形态与时长需本项目自证（方向性依据）"
      exceptions:
        - {note: "漏用型错误的主因不在波动，而在母语无冠词范畴（见 C-10），两型须分开诊断", word_ids: []}
    mechanism:
      - beat: "两套切分"
        text_kid: "心里想着一只具体的狗，就想说 the dog——可是对方还没见过这只狗，应该说 a dog。"
        text_adult: "冠词在跨语言间有两种可行的语义切分——按定指（说听共享）或按具体性（说话人单方有指）；无冠词母语者对两种切分都有心理通道，习得即在两通道间波动。"
        visual: "同一只狗两帧：说话人心里有（具体）vs 听者能定位（定指），the 的归属随判据翻转"
        anchors: [G1_015]
      - beat: "预测吻合"
        text_kid: "这个说法能提前算出学生会错在哪：第一次提、心里又有具体的那一个，最容易错加 the。"
        text_adult: "俄语、韩语被试在 [−定指, +具体] 语境系统性过用 the、在 [+定指, −具体] 语境过用 a，与波动预测精确吻合；后续多语言复制大体支持。"
        visual: "2×2 语境格（定指×具体）与错误方向标注"
        anchors: []
    examples:
      - level: 1
        word_ids: [G1_015, G2_0414]
        sentence: "I saw a dog today."
        scene_note: "正形：初次遇见的一只狗——说话人具体有指、听者不可定位，用 a"
        supports: claim
      - level: 1
        word_ids: [G1_014]
        sentence: "I want a cat."
        scene_note: "心里想要一只（还不存在的）猫——具体性弱，更用 a"
        supports: claim
      - level: 2
        word_ids: [G1_015]
        sentence: "The dog is my dog. The dog is cute."
        scene_note: "第二次提及：双方可定位，切换到 the——参数定版后的目标形态"
        supports: claim
      - level: 2
        word_ids: [G1_002, G4_184]
        sentence: "I read a book in the library."
        scene_note: "初次提及的书用 a（library 场景）"
        supports: claim
      - level: 2
        word_ids: []
        sentence: "I saw the dog yesterday."
        scene_note: "此句为 error_cases 中登记错句的对照帧（初次提及误用 the），非正例"
        supports: claim
    error_cases: []
    relatives:
