  - id: PB-13
    zone: 小系统
    group: PB
    headline: "Dirven 的意义链：物理空间怎么切，心理空间就怎么搭——at/on/in 是三个能走遍所有抽象域的词"
    headline_kid: "介词先是在操场上学会的词：at 一个点、on 一个面、in 一个里面。后来它们去管时间（at five、on Monday、in May），再后来去管看不见的东西（in love、at work）——用的还是操场上那三把刀。"
    claim:
      type: rule
      statement: "Dirven (1993) 把介词的空间概念排成一串链：先切物理空间，再沿同一串词走进时间，最后走进心理与抽象空间——状态（at work、on holiday、in love）、话题领域（good at math、an expert on history）、方式手段（on foot、at full speed）、情境、原因；总纲是：英语切分物理空间的方式，是它组织心理空间的图纸。at/on/in 是链上走得最远的三个词，在每个抽象域都有席位。"
      evidence: ["Dirven (1993) 'Dividing up physical and mental space…'，载 Zelinsky-Wibbelt 编《The Semantics of Prepositions》(Mouton de Gruyter), pp. 73–97（页码经 2026-11-01 定版销项；内容经三家二手系统论述互证）", "链条后被 Radden & Dirven (2007)《Cognitive English Grammar》收编为教材框架（接触等级：二手系统论述级）"]
    mechanism:
      - beat: "链的排法"
        text_kid: "先在操场上学 at、on、in，再看它们去时间里上班，最后去管心情和学习——一路都是同一把刀。"
        text_adult: "分类从空间端起排（基本空间组 at/on/in、邻近组、路径组、垂直组、分离组），随后展示每个空间概念如何沿链延伸；链的抽象端是点名到户的域名单（时间、状态、话题/知识领域、方式/手段、情境、原因/理由），不是含糊的「比喻义」。"
        visual: "意义链横轴：物理空间 → 时间 → 状态/话题/方式/情境/原因，at/on/in 三线贯穿"
        anchors: [V6_核心_37, G3_142, G3_140]
      - beat: "与清单内证据咬合"
        text_kid: "（教师侧）P-09 的时间借用是这条链中段的独立复现；P-17 的展开次序是同一现象的习得侧表述。"
        text_adult: "Tyler & Evans 给出形式判据，Dirven 给出域名单；Dirven 链条作为共时组织同样只是组织法，不担保习得次序（P-17 已按 Rice 1999 反例降格为趋势）。"
        visual: "链与 P-09/P-17 的咬合点标注"
        anchors: [G3_140, V6_日常_63]
    examples:
      - level: 1
        word_ids: [V6_核心_37, G1_022]
        sentence: "The bus comes at five."
        scene_note: "链中段：时间域的 at（点）"
        supports: claim
      - level: 1
        word_ids: [G3_140, G2_102]
        sentence: "We play in winter."
        scene_note: "链中段：时间域的 in（容器）"
        supports: claim
      - level: 2
        word_ids: [V6_核心_15, G3_140, V6_日常_63]
        sentence: "We are in love."
        scene_note: "链抽象端：状态域的 in（清单原文登记例 in love）"
        supports: claim
      - level: 2
        word_ids: [V6_核心_4, G4_0440, V6_核心_37, V6_学校_29]
        sentence: "You are careful at English."
        scene_note: "话题/领域域的 at（good at 的同型结构，careful 已在库；good 口径见成人层注）"
        supports: claim
    error_cases:
      - wrong: "The party will be held in July 1st."
        right: "The party will be held on July 1st."
        error_type: "介词选择错误（时间域：具体日期误用 in）"
        source_type: "真实语料错型"
        diagnosis: "at/on/in 从空间走进时间后分工不变：具体到某一天用 on（on July 1st），月份、年份才用 in；学习者把空间里的 in 直接搬进时间域，日期也用了 in。〔出处：谢世君. 基于语料库分析的高二英语读后续写介词使用偏误分析[J]. 职业教育发展, 2026, 15(6): 15-22. DOI: 10.12677/ve.2026.156238｜定位：文中 in/on 时间介词误用例｜语料为96 名高二学生 192 篇读后续写中的 450 例介词偏误之一｜学段：高二｜病例号 VEC-039〕"
        diagnosis_kid: "具体到 7 月 1 日这一天，要说 on July 1st；说 7 月份、2026 年，才用 in。"
    relatives:
      - {id: P-09, rel: 同族}
      - {id: P-17, rel: 同族}
      - {id: PB-04, rel: 同族}
    quiz:
      - q: "in love 里的 in，是从哪一站沿链走过来的？"
        options: ["操场上的「在里面」（空间）", "时间的「在早上」", "它是另一个词"]
        answer: "操场上的「在里面」（空间）"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [P-09, P-17]
    order: 32
    pain_points: [记不住, 说不出]
    adult:
