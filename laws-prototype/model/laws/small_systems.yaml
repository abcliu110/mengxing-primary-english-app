  - id: P-16
    zone: 小系统
    group: P
    headline: "静态的东西借动态的词：The road runs along the river（虚构运动）"
    headline_kid: "路明明没动，却说它「跑」——其实是我们的眼睛在沿着路看过去，像手指划过地图一样。"
    claim:
      type: rule
      statement: "英语常把静止的延展物说成在动（路沿着河伸展、篱笆爬上山坡）——这是观察者的目光沿物体扫描（心理扫描）被直接写成了运动句；读到这类句子不要按字面找「谁在跑」。"
      evidence: ["Talmy 虚构运动研究，定版于《Toward a Cognitive Semantics》Vol. I (2000) 第 2 章 'Fictive motion in language and ception'（pp. 99–175；1996 年原载 Bloom et al. 编《Language and Space》）"]
    mechanism:
      - beat: "目光在动"
        text_kid: "眼睛从路的这一头看到那一头，就像手指划过地图——句子把这趟「眼睛的旅行」说成了路在跑。"
        text_adult: "虚构运动（fictive motion）源于注意沿路径的心理扫描；语言在实动与虚动之间共用同一套路径图式。"
        visual: "地图上一条路，高亮点沿路移动模拟目光扫描，路本身静止并标注"
        anchors: [G4_0592, G5_232]
      - beat: "阅读提示"
        text_kid: "看到 runs、goes 说路和篱笆，先想一想：是真的在动，还是眼睛在旅行？"
        text_adult: "眼动与阅读实验显示虚构运动句的加工伴随沿路径的注意移动；汉语亦有同类表达（「这条路通到山顶」），可由母语平行现象接通。"
        visual: "真运动句与虚构运动句对照卡"
        anchors: [G4_0592]
    examples:
      - level: 1
        word_ids: [G4_0592, G5_232, ADD_0404]
        sentence: "The road runs along the river."
        scene_note: "清单原文例句——路沿河伸展（along 已入词库 ADD_0404）"
        supports: claim
      - level: 1
        word_ids: [G4_0592, G5_235]
