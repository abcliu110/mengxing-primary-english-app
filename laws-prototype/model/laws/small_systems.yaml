  - id: P-13
    zone: 小系统
    group: P
    headline: "垂直方向是四个词合伙切的：above / over / under / below 的分工"
    headline_kid: "上下这条线上有四个小伙伴分工：有的管「高」，有的还管「盖住、越过」——分清谁管什么，才不会用错。"
    claim:
      type: tendency
      statement: "英语把垂直轴切给四个词分管：over 管「上方且有牵连（可盖、可越）」，above 只管「海拔更高」，under 管「下方且有牵连（被压、被罩）」，below 只管「海拔更低」——每个词的意义部分地由它与邻居的边界决定。"
      evidence: ["Tyler & Evans (2003) 对照集分析（above/over/under/below 四词划分垂直维度）"]
      scope: "垂直维度的四词对照集；分工是强倾向而非无缝切割"
      exceptions:
        - {note: "over 与 above 在部分语境可互换（如数量读法 over/above 100 people），互换区按频率逐个登记", word_ids: [V6_核心_40, V6_核心_39]}
        - {note: "below 已入词库（ADD_0428），四词全量（above/over/under/below）齐备", word_ids: [ADD_0428]}
    mechanism:
      - beat: "牵连轴"
        text_kid: "飞机从山头飞过去，是 over（跟山有关系：越过它）；飞机只是在云的上面，是 above（只是更高）。"
        text_adult: "对照集联合切分语义空间：over/under 带与参照物的关联（接触可能、路径构成），above/below 只编码标量高低；below 在温度、海拔等标量域占优（below zero）。"
        visual: "垂直轴一分为二：左列「有牵连」over/under，右列「只比高低」above/below"
        anchors: [V6_核心_40, V6_核心_39, G3_143]
      - beat: "替换测试"
        text_kid: "把词换一换试试：换了意思就变，说明它们分工不同。"
        text_adult: "The plane flew over the hill（越过，有路径牵连）vs The plane flew above the clouds（仅更高）——替换测试可验证分工（清单原文）。"
        visual: "同句两版对照，差异处高亮"
        anchors: [G1_046]
    examples:
