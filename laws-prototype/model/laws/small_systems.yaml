      - beat: "先定找谁"
        text_kid: "杯子在桌子上——我们在找杯子，杯子站前面；桌子又大又稳，站在后面当背景。"
        text_adult: "图形—背景分工是知觉组织原则在语言中的投影：图形 = 待定物，背景 = 参照物；介词编码两者的空间关系。"
