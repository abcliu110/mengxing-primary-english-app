      boundary: "该书材料以欧洲语言与皮钦/克里奥尔语为主；英语中的社会编码表现隐蔽（见 PR-04），展示程度须降格。"
      disputes: ["无主流分歧（身份建构视角已成社会语言学共识）；分歧在方法论层——定位论认为自我是话语产物，认知取向保留前话语的自我概念，本条教学只取语言观察面，不站队（清单原文登记）"]
