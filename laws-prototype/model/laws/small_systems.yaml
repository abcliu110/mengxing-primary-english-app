  - id: C-08
    zone: 小系统
    group: C
    headline: "把东西「找出来」的线索只有五条路（定指的建立菜单）"
    headline_kid: "说 the 之前先检查：对方能凭什么找到它？说过、挨着、看得见、大家都知道——总得有一条路。"
    claim:
      type: rule
      statement: "听者能定位一个 the 名词，靠的无非五条路：上文刚提过（回指）、关联物带出（a wedding → the bride）、句中修饰语当场锁定（the book on the desk）、眼前情境就在（Pass me the salt）、全世界只有一个的常识（the sun）——五路皆无，就不能用 the；五条路是「充分线索」的清单。"
      evidence: ["Hawkins (1978) 对 the 非类指用法的分类（回指、关联、情境、常识等）", "Liu & Gleason (2002) 'Acquisition of the article the by nonnative speakers of English', SSLA 24(1)：以该分类的操作定义测查学习者，不同类别难度显著不同（关联类最晚）"]
    mechanism:
      - beat: "五条路清单"
        text_kid: "找东西有五条路：刚才说过、跟着别的东西来、话里说清了、就在眼前、全世界只有一个。"
        text_adult: "定指不是名词自身的属性，而是「说话人发出的定位任务 + 听者手头的线索」之间的匹配关系；五条路是线索的全部来源，清单的用途是给学习者纠错定位（错在缺哪条路）。"
        visual: "五条路的菜单卡，各配一个小图标"
        anchors: [G1_002, G2_0501, G4_0818]
      - beat: "分路练"
        text_kid: "五条路难易不同：关联那条路最难学会，要单独多练。"
        text_adult: "Liu & Gleason (2002) 证明五条路在心理上不是一回事：不同类别的 the 习得难度显著不同，教学应分路练，不许混成一锅。"
        visual: "五条路难度标记（关联路标「最晚」）"
        anchors: []
    examples:
      - level: 1
        word_ids: [G1_015]
        sentence: "I have a dog. The dog is cute."
        scene_note: "回指路：上文刚提过"
        supports: claim
      - level: 1
        word_ids: [G4_0818]
        sentence: "Pass me the salt, please."
        scene_note: "情境路：就在餐桌上"
        supports: claim
      - level: 2
        word_ids: [G1_002, G1_0928]
        sentence: "The book on the desk is my book."
        scene_note: "修饰锁定路：on the desk 当场圈定"
        supports: claim
      - level: 2
        word_ids: [G2_0507]
        sentence: "The moon is up in the sky."
        scene_note: "常识路：月亮只有一个（sky 已在库）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "五路皆无而用 the"
        note: "错型由本条菜单定义；逐字病例待补，不自编。关联路原文例（a wedding → the bride，见 claim 陈述）两词已入词库（ADD_0710/ADD_0433）。"
    relatives:
      - {id: C-07, rel: 前置}
      - {id: C-20, rel: 同族}
    quiz:
      - q: "「Pass me the salt」能用 the，走的是哪条路？"
        options: ["眼前情境就在", "上文刚提过", "全世界只有一个"]
        answer: "眼前情境就在"
        hint_ref: "mechanism[0]"
    probes: []
