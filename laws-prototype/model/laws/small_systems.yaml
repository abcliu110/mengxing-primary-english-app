  - id: PB-07
    zone: 小系统
    group: PB
    headline: "中心义判定之争：Tyler & Evans 用两条判据把 24 个义项压回 15 个，并把中心换成静态图式"
    headline_kid: "像整理衣柜：一件衣服要单独占一格，得证明它和别的格子里的真不一样、而且不是临时搭配出来的——不然就挂回原来的格子。"
    claim:
      type: tendency
      statement: "Tyler & Evans 判定一个用法算不算「独立义项」须同时过两关：（一）它带的意义成分在原型场景里没有（非空间义或不同的空间构型）；（二）它不依赖具体语境、换个句子还在。过不了关的一律降格为「语境在线生成的解释」，不进网络。按此判据，over 的义项从 24+ 压到 15，中心也从动态复合图式换成静态的「射体高于界标」原型场景——本项目教学取修订版（取其可教性与可核查性），不宣称学理已定案。"
      evidence: ["Tyler & Evans (2001) 'Reconsidering prepositional polysemy networks: The case of over', Language 77(4): 724–765（开放全文；接触等级：一手批评文献原文级）", "专著版 Tyler & Evans (2003)"]
      scope: "义项切分的方法论判据之争；本项目呈现口径取修订版"
      exceptions:
        - {note: "Evans (2014) 后来自承有原则多义框架「可能过于简单」（二手述评语）——修订方自己的保留", word_ids: []}
    mechanism:
      - beat: "全规格谬误"
        text_kid: "（教师侧）把场景里的一切差别都记成词的新意思，等于把整个场景的账记在一个词头上——账就越记越多。"
        text_adult: "源头方法的诊断名是「全规格谬误」：把语境、世界知识、参照物物理属性带来的意义差异统统登记为义项。修订的支点是「语言形式只是提示（prompt)，意义在概念层与语境整合在线建成」——直升机对海洋与蜂鸟对花在 Lakoff 网里是两个义项，在修订版里是同一个「上方」义项的两次在线实现。"
        visual: "两句直升机/蜂鸟例的切分对照（两格 vs 一格）"
        anchors: [V6_核心_40]
      - beat: "争论是光谱不是对骂"
        text_kid: "（教师侧）中间还有 Kreitzer 的「部分规格」版本——大家在一条光谱上挪位置，不是两派对骂。"
