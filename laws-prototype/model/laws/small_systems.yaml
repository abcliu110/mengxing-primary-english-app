  - id: PB-12
    zone: 小系统
    group: PB
    headline: "对中国孩子：刀口错位图——汉语的「上/里」与英语的 in/on/at 在哪几处必然打架（本簇推论条）"
    headline_kid: "中文说「上」，英语要再问一句：是贴在面上（on）、装在里面（in）、还是就在那个场合（at）？中文的「上」是一把大伞，英语把它拆成三把小伞。"
    claim:
      type: tendency
      statement: "中国孩子学英语介词的难处可预先画出地图：汉语「上」横跨英语 on/in/at 三家（在报纸上 = in、在电视上 = on、在会上 = at）；同一个「在树上」，英语按「树的一部分（苹果→on）」与「位于枝叶之间（鸟→in）」再切一刀；汉语把「紧贴」维度放在动词里（塞进、套上），中国孩子对「紧」有现成注意，却要学会选介词时不看它。凡汉语刀口与英语刀口交叉之处，即错误高发区。"
      evidence: ["原理出处：Bowerman & Choi (2001)（PB-11，二手系统论述级）", "错误描写侧：P-11 已收的 CLEC 语料库与 Jarvis 迁移框架", "三类错位例（报纸/电视/场合、树上苹果与树上鸟、紧贴动词）为本簇逐例核对的对比例，非引自单一文献（清单原文特此标明）"]
      scope: "本簇推论条：错位图是预测工具，不是给个体错误定罪的工具"
      exceptions:
        - {note: "「树上」一例须注意英语内部的语境变通：鸟落在枝头表面时口语可说 on a branch——那是界标换成「枝条」后的正确选择，非本例反例", word_ids: [G1_013, G2_079]}
        - {note: "汉语「下」与 under、「里」与 in 的大面积重合区可快速通过，不在错位图内", word_ids: [G3_143, G3_140]}
    mechanism:
      - beat: "「上」的三把小伞"
        text_kid: "在报纸上（in）、在电视上（on）、在会上（at）——同一个「上」，英语分给三家。"
        text_adult: "汉语「在+方位词」系统中「上」是大范畴，英语按图式（容器/面/场合点）再切分；范畴级系统迁移由此产生（P-11 记录「错在哪」，本条给出「为什么成批错在这几处」）。"
        visual: "「上」大伞分流三把小伞的错位图，三例并置"
        anchors: [V6_学校_20, G3_K32, G3_140, G3_142, V6_核心_37]
      - beat: "病句医院选题图"
        text_kid: "（教师侧）错位图交叉的地方，就是要重点练、要出题检查的地方。"
        text_adult: "病句医院的选题可由错位图直接生成：凡两刀口交叉之处即错误高发区；重合区快速通过。凡未经语料或课堂数据核验的具体错误率，本条一概不写数字。"
        visual: "错位图上高发区标红，重合区标绿"
        anchors: [G2_079, G1_037, G1_013]
    examples:
      - level: 1
        word_ids: [G1_002, G3_140, V6_学校_19]
        sentence: "I read it in the newspaper."
        scene_note: "在报纸上 → in（内容在纸面之内）"
        supports: claim
      - level: 1
        word_ids: [G4_174, G3_142, G3_K32]
        sentence: "We study on TV."
        scene_note: "在电视上 → on（节目在屏幕面上呈现；登记搭配）"
        supports: claim
      - level: 2
        word_ids: [G1_037, G3_142, G2_079]
        sentence: "The apples are on the tree."
        scene_note: "苹果是树的一部分 → on（词形经 apple 归一）"
        supports: claim
      - level: 2
        word_ids: [G1_013, G3_140, G2_079]
        sentence: "The bird is in the tree."
        scene_note: "鸟在枝叶之间 → in（与苹果对照）"
        supports: claim
      - level: 2
        word_ids: [V6_家庭_3, ADD_0782]
        sentence: "Dad is at the meeting."
        scene_note: "在会上 → at：会议是场合（点），不是容器也不是面（与报纸 in、电视 on 对照）"
        supports: claim
    error_cases:
      - wrong: "The bird landed on the tree."
        right: "The bird landed in the tree."
        error_type: "介词选择错误（汉语「上」一形多切：鸟落树上应用 in）"
        source_type: "真实语料错型"
        diagnosis: "汉语一个「在树上」，英语要按东西再切一刀：鸟落在枝叶间是 in the tree（被树冠包住），苹果挂在枝头才是 on the tree（贴在表面上）；学习者用汉语的刀口切英语世界，把鸟也写成了 on。〔出处：谢世君. 基于语料库分析的高二英语读后续写介词使用偏误分析[J]. 职业教育发展, 2026, 15(6): 15-22. DOI: 10.12677/ve.2026.156238｜定位：文中 in/on 误用例｜语料为96 名高二学生 192 篇读后续写中的 450 例介词偏误之一｜学段：高二｜病例号 VEC-038〕"
        diagnosis_kid: "小鸟落在树枝中间，要说 in the tree；苹果挂在树枝上，才说 on the tree。汉语一个「上」，英语要分两种情况。"
    relatives:
      - {id: PB-11, rel: 前置}
      - {id: P-11, rel: 同族}
      - {id: P-03, rel: 同族}
      - {id: P-04, rel: 同族}
    quiz:
      - q: "「在报纸上」为什么用 in 不用 on？"
        options: ["报纸的内容被看成装在纸面之内（容器图）", "报纸比较薄", "on 只能用于桌子"]
        answer: "报纸的内容被看成装在纸面之内（容器图）"
        hint_ref: "mechanism[0]"
    probes: []
    prereq: [PB-11, P-11]
    order: 31
    pain_points: [错不完]
    adult:
      sources: ["Bowerman & Choi (2001)（原理）", "CLEC 与 Jarvis 框架（P-11）", "Sinha et al. (1994) 英/丹/汉三语儿童比较含汉语样本，方向一致", "汉语「在+方位词」刀口事实为汉语语法学常识；三类错位例为本簇逐例核对（清单原文标明）"]
      boundary: "错位图是预测工具不是定罪工具：个体错误还有语音、教学、粗心等来源；本条不写未经核验的错误率数字。与 P-17 的关系：顺序发生在各语言自己的范畴之内，两条合起来才完整（清单原文登记）。"
      disputes: ["无（推论条自担其责，清单原文）"]
      evidence_grade: "推论级（原理 + 语料描写互证）"
      pending: ["误解探针待补（W7 收口）", "病句医院病例待补（逐字错例）"]
