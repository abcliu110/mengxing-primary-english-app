  - id: C-19
    zone: 小系统
    group: C
    headline: "选冠词时，心里要过一遍「对方知道吗」——冠词是给听者的服务"
    headline_kid: "说英语的时候要多想一步：「我说的这个东西，对方找得到吗？」把答案用小词标出来，听的人才不迷路。"
    claim:
      type: rule
      statement: "a/the/零 的选择本质上是说话人替听者算账：持续估算「对方现在能不能定位」，并用冠词把答案标在句子表面；形式越往给定性等级高端走（a → the → this/that → 代词），预设的听者认知状态越高；汉语把这笔账记在语境里，英语把它写出来。"
      evidence: ["Gundel, Hedberg & Zacharski (1993) 给定性等级的蕴涵体系（同 C-06）", "理论先声：Prince (1981) 熟悉度量表（经 Abbott 2006 综述转述）", "Gundel et al. (2010), Journal of Pragmatics 42(7) 跨语言复制验证（含汉语对应形式分析）"]
