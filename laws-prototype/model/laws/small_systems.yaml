  - id: P-17
    zone: 小系统
    group: P
    headline: "先空间、后时间、再抽象：介词义的展开顺序就是教学顺序"
    headline_kid: "每个介词都是从「讲地方」开始长大的：先学会讲地方，再讲时间，最后讲看不见摸不着的意思——我们学它的顺序，就跟它长大的顺序一样。"
    claim:
      type: tendency
      statement: "一个介词的义项在历史与习得中大体按「空间 → 时间 → 抽象」的顺序展开：空间义最早出现、最具体，抽象义最晚、最依赖图式迁移——教学按这个顺序排，是带例外的总体趋势与教学路径，不是无例外铁律。"
      evidence: ["Tyler & Evans (2003) 原型判定标准一（历史最早义多为空间义）", "习得侧：Johnston & Slobin (1979) 儿童方位表达的稳定产出顺序（in/on/under/beside 先于 between 与前后）", "介词时间义通常晚于空间义习得（Clark 1973/1974，转引自 Kemmerer 2005）"]
      scope: "各语言在自身范畴内部的展开顺序（语言特异性限定，见 PB-11）；不管「遇见的次序」，只管讲解的展开次序"
      exceptions:
        - {note: "个别介词的抽象用法有早于空间用法的反例记录（Rice 1999；Sandra & Rice 1995），顺序说已按清单降格为趋势", word_ids: []}
        - {note: "高频抽象搭配（如 at once、in fact）可作为整块提前认读，不受顺序约束", word_ids: [V6_核心_37, G3_140]}
    mechanism:
      - beat: "成长路线"
        text_kid: "介词先学会说地方（在盒子里），再学会说时间（在早上），最后才说看不见的意思（在麻烦中）。"
        text_adult: "空间经验在发展与演化上都先行：具身空间图式是最早可用的认知资源，其余域靠映射借用（与 P-09 同一原理的时间轴版本）。"
        visual: "三级台阶：空间 → 时间 → 抽象，各放一个 in 的例句"
        anchors: [G3_140]
      - beat: "顺序即排课"
        text_kid: "（教师侧）排课按台阶走：先把地方讲透，时间借图跟上，抽象义最后逐个补。"
        text_adult: "P-02 四条标准中「最早义」一条在 15 个介词上大体指向空间义；教学实验（P-10）按空间原型起步的设计与此一致。注意 Bowerman & Choi 的限定：顺序发生在各语言自己的范畴之内（PB-11）。"
        visual: "本区 order 字段的排布示意"
        anchors: [G3_140, G3_142]
    examples:
      - level: 1
        word_ids: [G1_014, G3_140, G1_0994]
        sentence: "The cat is in the box."
        scene_note: "第一级：空间义"
        supports: claim
      - level: 1
        word_ids: [G3_140, G1_0564]
        sentence: "We play in the morning."
        scene_note: "第二级：时间义（借空间图）"
        supports: claim
      - level: 2
        word_ids: [G1_015, G3_142, G2_0930]
        sentence: "The dog is on the table."
        scene_note: "空间义先行习得的另一原型（幼儿产出顺序前列）"
        supports: claim
      - level: 2
        word_ids: [G1_002, G3_143, G1_0928]
        sentence: "The book is under the desk."
        scene_note: "under 与 in/on 同属先行组（Johnston & Slobin 1979）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "抽象义抢先教学（教学侧风险）"
        note: "顺序条目，逐字病例不适用，登记待补说明。"
    relatives:
      - {id: P-09, rel: 同族}
      - {id: PB-11, rel: 对照}
      - {id: PB-13, rel: 同族}
    quiz:
      - q: "教 in 的三个意思，顺序应该是？"
        options: ["在盒子里 → 在早上 → 在麻烦中", "在麻烦中 → 在盒子里 → 在早上", "哪个都行，没有区别"]
