  - id: C-02
    zone: 小系统
    group: C
    headline: "物质名词的判据是「同质」：随便拿一小份，还是它"
    headline_kid: "一滴水也是水，一小块面包也是面包——切多少份都还是它，这样的东西不能一个一个数。"
    claim:
      type: tendency
      statement: "水、木头、面包这类词指的东西，任意取一小份，性质与整体完全相同——这种「同质」使它不需要边界也能被认出是哪种东西，所以不直接计数：物质由「质」定义而非由「形」定义，语言不给它配个体化装置（a / -s），改为借单位切分后才计数。"
      evidence: ["Langacker (2008: 133) 原例：以 wood 立论——「这种物质的任何一份样本都呈现其区别性品质，与形状大小无关」"]
