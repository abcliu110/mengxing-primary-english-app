  - id: PR-02
    zone: 小系统
    group: PR
    headline: "「我」是把自己钉在此时此地、并为这句话担责的词"
    headline_kid: "说 I 的人永远是「正在说话的这个人」——话一换人说，I 指的人就跟着换；谁说 I，谁就为这句话负责。"
    claim:
      type: rule
      statement: "第一人称是典型的换位词（shifter）：所指随言语事件本身移动；I 把说话者「系在时空之中，并标明谁是这句话及其后果的负责人」——自我同时被定位为有身体的个体（数量同一性）与社会中的人（性质同一性），代词系统是第二种定位的语法工具。"
      evidence: ["Mühlhäusler & Harré (1990), pp. 88（自我双重定位）、92（系于时空与担责）（接触等级：二手系统论述级，两处页码引文分别经学术转述核实，未打开原书）"]
    mechanism:
      - beat: "换位"
        text_kid: "老师说 I，是老师；你说 I，就是你——I 永远跟着正在说话的人跑。"
        text_adult: "换位性是儿童代词习得的经典难点与经典观察：幼儿先把 I/you 当专名用（照搬大人对自己说的话），在对话轮换中才翻转过来——这正是「钉住说话者」机制的习得证据（本条只引机制，不引具体实验数值）。"
        visual: "对话轮换动画：I 的高亮随说话人切换而移动"
        anchors: [V6_核心_0]
      - beat: "担责与正迁移"
        text_kid: "汉语的「我」也是一样换来换去，这一条不用重新学；要记的是英语的 I 永远大写、每句都要站出来（见 PR-08）。"
        text_adult: "对中国孩子，本条概念是正迁移区；难点不在概念而在形式：I 必须大写，且不能像汉语那样在话题链中省掉。"
        visual: "I 大写标记 + 句子首位站位示意"
        anchors: [V6_核心_0]
    examples:
      - level: 1
        word_ids: [V6_核心_0, G1_007]
        sentence: "I am a teacher."
        scene_note: "老师说 I——指说话人自己（I 经别名归一至代词组条目，以独立条目为准）"
        supports: claim
      - level: 1
        word_ids: [V6_核心_0, G3_131]
        sentence: "I am a student."
        scene_note: "换学生说 I——指的人立刻换了"
        supports: claim
      - level: 2
        word_ids: [V6_核心_4, V6_核心_1]
        sentence: "You are my friend."
        scene_note: "you 指向听者——换位词的对偶面"
        supports: claim
      - level: 2
        word_ids: [V6_核心_0, G6_282]
        sentence: "I am happy."
        scene_note: "谁说 I，谁为这句「开心」担责（陈述归属）"
        supports: claim
    error_cases:
      - status: 待补
        error_type: "I/you 换位混淆（幼儿专名化误用）"
        note: "习得现象已在机制登记；逐字病例待补，不自编。"
