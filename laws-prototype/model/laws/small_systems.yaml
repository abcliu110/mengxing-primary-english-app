  - id: PR-07
    zone: 小系统
    group: PR
    headline: "有的语言把「人」长在动词上——英语把这套拆了，所以代词必须出场"
    headline_kid: "有些语言看动词就知道是谁在做，英语的动词几乎不留记号——所以英语的句子里，I、you、he 一个都不能缺席。"
    claim:
      type: rule
      statement: "人称标记在语言中有两处住所：独立代词与动词上的一致标记（附着/词缀形式）；许多语言（西班牙语、意大利语）靠动词一致即可省代词（pro-drop）；英语在历史上把动词一致磨得只剩三单 -s 一处残迹，于是主语代词成了义务出场——这是系统配置问题，不是英语「啰嗦」。"
      evidence: ["Siewierska (2004) 第 2 章（独立形式 vs 附着形式：一性两处住所）、第 4.1 节（pro-drop 语言的一致与省代词）、第 6.3 节（虚假主语与论元实现）、第 7.2 节（人称标记的语法化路径）（接触等级：章节预览级）"]
    mechanism:
      - beat: "两处住所"
        text_kid: "「谁在做」这件事，有的语言写在动词身上，有的写在单独的小词上；英语写在小词上，所以小词不能丢。"
        text_adult: "该书的框架强调「人称」范畴不限于代词词表：束缚形式（bound forms）与独立形式同属一个系统，本条任务书不用 pro-drop 术语，但机制即其内容；英语三单 -s 是旧一致系统的残迹（与 C-18 的复数 -s 分轨）。"
        visual: "两语言对照：动词尾巴带标记 vs 代词独立站位"
        anchors: [V6_核心_13]
      - beat: "虚主语的伏笔"
        text_kid: "英语连「没有谁在做」的句子都要放个 it 占位——占位规则见 PR-08/PR-10。"
        text_adult: "虚假主语（第 6.3 节）在英语中义务化，正是「主语位不可空」在无所指时的补位形态，与 PR-08 的 dummy it 同源。"
        visual: "空椅子 + it 占位标记"
        anchors: [V6_核心_13]
    examples:
      - level: 1
        word_ids: [V6_核心_7, G2_089]
        sentence: "He swims."
        scene_note: "he 义务出场，动词只剩 -s 一点痕迹（swim/s 已在库）"
        supports: claim
      - level: 1
        word_ids: [V6_核心_10, G2_0492]
