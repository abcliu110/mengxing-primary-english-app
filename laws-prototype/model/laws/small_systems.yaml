      - {id: PR-04, rel: 同族}
    quiz:
      - q: "老师说「We are a team」时，we 除了指人，还在做什么？"
        options: ["把大家说成一伙（建构共同体）", "代替老师的名字", "表示人数很多"]
        answer: "把大家说成一伙（建构共同体）"
        hint_ref: "mechanism[0]"
