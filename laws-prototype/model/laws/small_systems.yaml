        sentence: "My mother is a teacher."
        scene_note: "职业身份——类别归属"
        supports: claim
      - level: 2
        word_ids: [G1_037]
        sentence: "I want an apple."
        scene_note: "随便哪一个苹果都行（an 的声音判据见 C-14）"
        supports: claim
    error_cases:
