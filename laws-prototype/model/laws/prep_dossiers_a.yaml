  adult: 机制：down 的图式是「沿斜面向下」；边界：down the street 的 down 已虚化为「顺着往前」，不要求真有高低差——这是路径义吸收图式的常例（OALD 义项 2）；纵贯时间的 down the ages 属文学义（OALD 义项 3），不在本段，登记未收。本词 OALD 介词义项共 3 条，收高频 2 条。
  sources:
  - Oxford Learner's Dictionaries《down》介词条全 3 义项（2026-11-01 在线查证）：义项 1 向下 / 义项 2 沿着 / 义项 3 纵贯时间（未收）
  refs: []
- word: except
  bank_id: ADD_0099
  meaning: 除了；除…之外
  phonetic_gb: /ɪkˈsept/
  core:
    headline: except 是「把一个留在外面」：全队都算上，只把一个拿出去。
    scene:
      s: All the students are here except Tom.
      note: 全班都到了，只差 Tom 一个
  groups:
  - domain: 抽象
    label: 除外义 · 讲例外
    nodes:
    - sense: 除……之外（都不）
      headline: 一句话把所有人都说遍了，只有一个人不在里面。
      examples:
      - s: They all came except Matt.
        note: 他们都来了，就马特没来
      source: Oxford Learner's Dictionaries《except》介词条（used before you mention the only thing or person about which a statement is not true；They all came except Matt）；Swan《Practical English Usage》§456
    - sense: except for：整体里唯一的例外
      headline: 先说整体都好，只挑出唯一的一处不算。
      examples:
      - s: Everything was perfect except for the weather.
        note: 样样都好，就是天气不作美
      source: Oxford Learner's Dictionaries《except》条（also except for）；Swan《Practical English Usage》§456.1–456.2（except for before nouns；全称词后 for 常省略）
    - sense: 搭档 but：全称词后面 but 也能说「除……之外」
      headline: nobody、everybody、nothing 这类词后面，but 脱下「但是」的外套，当 except 用。
      examples:
      - s: Nobody but me knew the answer.
        note: 除了我，没人知道答案
      source: Swan《Practical English Usage》§116 but meaning 'except'（We use but to mean 'except' after all, none, every, any, no …；原文例句 Nobody but me knew the answer.）
  nsenses: 3
  opponents:
  - word: besides
    headline: besides 是「再加上一个」（往里加），except 是「拿掉一个」（往外减），方向正好相反（OALD Which Word? besides / except (for) / apart from）。
  adult: 机制：except 的动作是「从整队里取出一个」（OALD 词源栏：拉丁 excipere = ex-「出」+ capere「取」）；边界：与 but 的分工按 Swan 口径——but 只在 all / none / every / any / no 及 everything、nobody 等全称词之后顶替 except（§116），except (for) 是通用标记；且 except 后接介词短语或从句时不用 for（§456.3：except in Scotland；except when he smiles）。
  sources:
  - Oxford Learner's Dictionaries《except》介词条（唯一义 + except for）及 Which Word? besides / except (for) / apart from 用法栏（2026-11-01 在线查证）
  - Swan, M.《Practical English Usage》§116（but meaning 'except'）与 §456（except and except for 全条）
