- word: from
  bank_id: V6_核心_47
  meaning: 从…来自(be from)
  phonetic_gb: /ˈfrɒm/
  core:
    headline: from 是「从……出发」：人从老家来、车从站里来，都先有个出发点。
    scene:
      s: I am from China.
      note: 我的老家在中国——课本里的 from 第一句
  groups:
  - domain: 空间
    label: 起点义 · 讲出发
    nodes:
    - sense: 从……（地方）出发
      headline: 路的起点、东西的来路。
      examples:
      - s: This train comes from Beijing.
        note: 这列火车是从北京开来的
      source: Oxford Learner's Dictionaries《from》介词条义项 1（used to show where somebody/something starts；Has the train from Bristol arrived?）
    - sense: 来自（老家、出处）
      headline: 人是打哪儿来的，东西是打哪儿出的。
      examples:
      - s: My friend Tom is from Canada.
        note: 我的朋友汤姆来自加拿大
      source: Oxford Learner's Dictionaries《from》介词条义项 2（used to show what the origin of somebody/something is；I'm from Italy）
    - sense: 从……那里（收到、借到）
      headline: 东西从一个人的手里，到了我手里。
      examples:
      - s: I got a letter from my friend.
        note: 我收到一封朋友的来信
      source: Oxford Learner's Dictionaries《from》介词条义项 3（used to show who sent or gave something）
    - sense: 离……（距离）
      headline: 从这儿量到那儿，有多远。
      examples:
      - s: My home is ten minutes from school.
        note: 我家离学校十分钟路
      source: Oxford Learner's Dictionaries《from》介词条义项 5（used to show how far apart two places are）
  - domain: 时间
    label: 时间义 · 讲开始
    nodes:
    - sense: 从……（时间）开始
      headline: 时间轴上的出发点，常和 to 手拉手。
      examples:
      - s: We have lessons from Monday to Friday.
        note: 我们周一到周五上课
      source: Oxford Learner's Dictionaries《from》介词条义项 4（used to show when something starts；open from 8 a.m. to 7 p.m.）
  nsenses: 5
  opponents:
  - word: to
    headline: from 管出发、to 管到达，两个常常一前一后手拉手出现。
  adult: 机制：from 是纯粹的「起点」标记——空间起点、时间起点、来源与距离都从同一个「从哪儿出发」图式展开，常与 to 组成起止对子（OALD 义项 1/2/3/4/5 同条并列）；边界：材料义（made from）与区分义（different from）由动词/形容词搭配带动，不在本页展开，见未收登记。
  sources:
  - Oxford Learner's Dictionaries《from》介词条义项 1/2/3/4/5（2026-11-01 在线查证；义项 6 视角、7 范围、8 变化前态、9 区分、10 材料、11 分离、12 防止、13 原因、14 判断依据登记未收）
  refs: []
