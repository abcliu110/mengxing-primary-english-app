      source: Oxford Learner's Dictionaries《down》介词条义项 1（from a high or higher point to a lower one；Tears ran down her face）
    - sense: 沿着……往前（顺路）
      headline: 顺着路、河往前走——这时不一定是下坡。
      examples:
