# 介词全家福补完卷宗 · 甲组（15 词）
# 词单：about, after, against, among, around, as, before, behind, beside, between, beyond, by, down, except, from
# 规格：与现有 14 个全家福（in/on/over/…）同构——核心义（孩子话一句 + 可画场景句）、义项链
#       （按 空间→时间→抽象 排序；每节点 = 义项孩子话名 + 孩子话解说 + 1 句例句 + 来源标注）、
#       对手速览、成人层一句（机制/边界）、sources 依据清单（逐条可查）。
# 出处纪律：每词义项清单先查证学习词典条目（Oxford Learner's Dictionaries / Cambridge Dictionary）
#       与 Swan《Practical English Usage》相关条目后裁定；查无依据的义项不写，冷僻义登记于
#       卷末 uncollected_senses。against / beside 的认知语言学口径引 Lindstromberg (2010)
#       （经 small_systems PB-04 登记转引）；behind 的原型口径挂 PB-08 / PB-09（既有登记）。
# 机读版：model/prep_family_a.json（同内容，结构对齐原型 DATA.pages 字段，键 = 词形）。
# 生成日期：2026-11-01。本文件为新增卷宗，未改动任何现有文件。
