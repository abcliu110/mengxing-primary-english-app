  - id: YL-12
    zone: 支撑层
    group: YL
    subgroup: 年龄、动机与儿童参与
    audience: 教师/设计层
    headline: 英语课是孩子整体教育的一部分，不是孤立的「语言系统」训练
    headline_kid: 在英语课上画画、做手工、演小剧、唱歌，不是在玩别的东西——这些都是学英语的样子。
    claim:
      type: tendency
      statement: 小学英语教师的职责大于「教语言系统本身」——英语课是儿童整体教育的一个组成部分：活动体系横跨听说读写、词汇语法、游戏、歌曲歌谣、戏剧、手工与视频；对低龄段而言，语言发展与认知、社交、动手能力的发展是同一件事的不同侧面。
      evidence:
        - "Phillips (1993), Young Learners, OUP Resource Books for Teachers, 182 pp.（立书原则原文与目录经 Google Books 出版社页核实）"
      scope: 「整体教育」不构成削减语言目标的理由——活动仍须有明确的语言产出与理解目标（与 YL-01 任务五标准中的「语言目标清晰」互锁）。
      exceptions:
        - 该书为活动资源书而非理论专著，机制层表述以其立书原则与活动体系结构为据，不作超出文本的理论引申。
    mechanism:
      - beat: 整体教育定位
        text_kid: 在英语课上画画、做手工、演小剧、唱歌，都是学英语的样子。
        text_adult: 该书是 OUP 教师资源系列面向小学教师的奠基之作；其定位与 Cameron (2001) 理论框架、Shin & Crandall (2014) 的 21 世纪技能章方向一脉相承，三条独立来源跨 20 年同向。
        visual: 英语课与整体教育（认知/社交/动手）的交叠图
        anchors: [G3_0790]
    examples:
      - level: 1
        word_ids: [G3_0790]
        form: "draw（画画）等手工活动作为英语课的正当构成"
        scene_note: 清单原文的活动体系横跨范围
        supports: claim
    error_cases:
