  - id: VB-11
    zone: 支撑层
    group: VB
    subgroup: "Bolinger:短语动词是可分析的机器"
    audience: 教师/设计层
    headline: 习语性有三级：大多数短语动词可拆可解，只有最高一级才是死记的习语
    headline_kid: 短语动词像三层冰：表层是看得懂的（load up 装满），中层要拐个弯（make up a face 编一张脸→编造），只有最底下薄薄一层是猜不出的老习语（put on airs 摆架子）——别把整座冰山都当成要死背的。
    claim:
      type: tendency
      statement: "Bolinger (1971: 113）提出隐喻/习语性的三级（three levels of metaphor)：一级，小品词基本义的直接延伸（load up)；二级，整个短语动词的比喻性延伸（make up a face)；三级，含特定名词的固定表达（put on airs)，只有这一级接近真习语。配套的能产性立场：短语动词是英语动词系统正在生长的部分，新组合按小品词与动词的语义相容性不断被造出，教学与词典应呈现「系统＋程度」，而非把每个组合当孤立的例外登记。"
      evidence:
        - "Bolinger (1971)，三级说 p. 113、逐词字面—引申义讨论 pp. 98–102（经诺维萨德大学硕士论文 (2022) 第 2.1.1 节对原书的专节转述核实）"
      scope: 三级之间没有锐利界线，归类依赖对小品词基本义的先行分析（见 VB-10)。
      exceptions:
        - 三级习语虽少却高频（put up with 类），教学中不能因其「层级低」而略过（清单原文：三级为最高一级、数量最少）。
    mechanism:
      - beat: 三级习语性
        text_kid: 短语动词像三层冰，只有最底下薄薄一层是猜不出的老习语——别把整座冰山都当成要死背的。
        text_adult: 后续研究（Gorlach 2004 对照、构式语法分析）大体接受「可分析性是连续谱」的图象；语料库里短语动词的高频与高产出率是能产性的经验侧面。与培训界「短语动词全靠死背」的通行做法正面冲突，属清单应显性封堵的伪前提（清单原文登记）。
        visual: 三层冰图（一级直接延伸/二级比喻延伸/三级固定习语）
        anchors: [V6_日常_4, G1_010, V6_日常_9]
    examples:
      - level: 1
        word_ids: [V6_日常_4, G1_010]
        form: "make up a face（二级：编一张脸→编造）"
        scene_note: 清单原文例（一级 load up 与三级 put on airs 的构成词 load 已入词库（ADD_0562）、airs 为 air 的复数形（G4_0981））"
        supports: claim
    error_cases:
      - wrong: 把全部短语动词当作死记习语教学
        right: 按三级呈现系统与程度：大多数可拆可解，只有最高一级须整记
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的三级说。
    relatives:
      - {id: VB-10, rel: 前置}
    quiz:
      - q: 三级中哪一级接近真习语、须整记？
        options: [一级（直接延伸）, 二级（比喻延伸）, 三级（含特定名词的固定表达）, 三级都要死记]
        answer: 三级（含特定名词的固定表达）
        hint_on_wrong: 回机制小节「三级习语性」
    probes: []
    prereq: [VB-10]
    order: 11
    pain_points: []
    adult:
      sources:
        - "Bolinger (1971), p. 113, pp. 98–102；诺维萨德大学硕士论文 (2022) 专节转述 https://remaster.ff.uns.ac.rs/materijal/punirad/Master_rad_20220203_eng_200012_2020.pdf"
      boundary: 三级界线不锐利，归类依赖 VB-10 的先行分析。
      disputes: 与清单 CO-12（构式—语块谱系）图象互证、切分不同：CO-12 按抽象程度排谱系，Bolinger 按隐喻距离排层级；两套谱系在「大部分组合可分析、少数须整记」上结论一致，可互相锚定（如实保留）。
      evidence_grade: 二手系统论述级（同 VB-10）
      pending:
