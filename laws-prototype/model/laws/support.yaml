  - id: YL-07
    zone: 支撑层
    group: YL
    subgroup: 学习载体
    audience: 教师/设计层
    headline: 老师「讲」故事胜过「读」故事：讲述者的眼睛和节奏就是脚手架
    headline_kid: 老师看着我们讲故事，哪里没懂就慢一点、再讲一遍——故事是讲给我们听的，不是念给书听的。
    claim:
      type: tendency
      statement: 「讲述」与「朗读」不同：讲述时教师脱离文本，以目光、停顿、重复与动作实时调控儿童的理解，故事由此几乎一举解决动机问题。决定所需语言水平的不是故事本身，而是「我们让孩子拿故事做什么」——同一故事配不同任务即可跨水平使用。
      evidence:
        - "Wright (1995), Storytelling with Children, OUP Resource Books for Teachers（结构与引文经 Perlinguam 期刊书评全文核实）"
      scope: 讲述对教师的语言与表演能力有真实要求，不是零门槛技巧。
      exceptions:
        - 书评批评其入门部分个别建议（如「气泡技巧」）对新手交代不足。
    mechanism:
      - beat: 讲述即脚手架
        text_kid: 老师看着我们讲故事，哪里没懂就慢一点、再讲一遍。
        text_adult: 故事同时是语法与词汇的天然载体（该书专设「Grammar and stories」部分）；其活动库按讲前/讲中/讲后组织，与 YL-06 的 Plan-Do-Review 骨架互相印证（两条独立来源同向）。
        visual: 讲述者目光/停顿/重复实时调控理解的示意
        anchors: [V6_学校_44]
    examples:
      - level: 1
        word_ids: [V6_学校_44]
        form: "storytelling（讲述）vs reading aloud（朗读）"
        scene_note: 清单原文的核心区分
        supports: claim
    error_cases:
      - wrong: 把照本朗读当作故事讲述交付
        right: 脱离文本讲述，以目光、停顿、重复、动作实时调控理解
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的讲述/朗读之分。
