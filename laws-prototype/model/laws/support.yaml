  - id: CB-09
    zone: 支撑层
    group: CB
    subgroup: "McCarthy & Carter:口语有自己的语法"
    audience: 教师/设计层
    headline: 句子语法之上还有一层「话语语法」：省略、应和与插话都是规则
    headline_kid: 聊天的时候，话可以省着说（「喝茶吗？」），听的人还要搭腔（「太好了！」）——这些省和搭，都有规矩。
    claim:
      type: tendency
      statement: "口语在实时互动中生成，长出一套句子语法管不到的装置：情境省略（语境清楚时省去主语、助动词，CGE 2006: 182）、插入语（well、oh、right 独立成块组织话轮）、应和词（听者用短应和参与共建对话）、称呼语。当句子进入真实话语，语法就变成 discourse grammar——单位是话轮与语篇，不是孤立的句子。"
      evidence:
        - "McCarthy (1998), Spoken Language and Applied Linguistics, CUP, 第 4 章（基于 CANCODE 语料，Google Books 书目与目录核实）"
        - "省略的页码见 Carter & McCarthy (2006: 182)（转引，见 pending）"
      scope: 省略以「语境能补回」为条件，补不回就是病句；在写作语域里这套装置大多不适用，低龄教学先做听辨与模仿，不做术语讲解。
      exceptions:
        - 例（清单原文）：情境省略「喝茶吗？」型；应和词 Brilliant. / Perfect. 型（构成词 brilliant 已入词库 ADD_0435）。
    mechanism:
      - beat: 话语语法装置
        text_kid: 聊天的时候，话可以省着说，听的人还要搭腔——这些省和搭，都有规矩。
        text_adult: McCarthy 以 CANCODE 的成系统研究支撑「口语应置于大纲中心」的主张；本条与 CB-04 的语域观、YL-02 的课堂话语同链。
        visual: 省略/插入语/应和词/称呼语四类装置清单
        anchors: [G2_0944, G3_K27]
    examples:
      - level: 1
        word_ids: [G2_0944]
        form: "tea 的情境省略问句（「喝茶吗？」型：主语与助动词省去）"
        scene_note: 清单原文的省略例
        supports: claim
      - level: 2
        word_ids: [G3_K27]
        form: "well/right 型插入语组织话轮"
        scene_note: 清单原文的插入语例词
        supports: claim
    error_cases:
      - wrong: 把语境可补回的口语省略一律当病句改，或在写作语域套用话语语法装置
        right: 省略以可补回为界、按语域区分；低龄先听辨模仿不讲术语
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope。
    relatives:
      - {id: CB-07, rel: 同族}
      - {id: CB-04, rel: 同族}
    quiz:
      - q: 话语语法的单位是什么？
        options: [单词, 孤立句子, 话轮与语篇, 音节]
        answer: 话轮与语篇
        hint_on_wrong: 回机制小节「话语语法装置」
    probes: []
    prereq: [CB-07]
    order: 9
    pain_points: []
    adult:
      sources:
        - "Michael McCarthy (1998), Spoken Language and Applied Linguistics, CUP, ISBN 9780521597692, 第 4 章；Carter & McCarthy (2006: 182)"
      boundary: 省略以语境可补回为条件；写作语域大多不适用。
      disputes: 无。
      evidence_grade: 书目目录核实（页码转引）
      pending:
        - "同 CB-07：CGE p. 182 页码待打开原书核对"
