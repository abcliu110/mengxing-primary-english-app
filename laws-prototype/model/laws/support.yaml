  - id: CB-08
    zone: 支撑层
    group: CB
    subgroup: "McCarthy & Carter:口语有自己的语法"
    audience: 教师/设计层
    headline: 话说得「含糊」，常常是熟练和体贴（vague language）
    headline_kid: 说「蓝蓝的东西」「去散步什么的」不是偷懒——有时候不用说那么准，听的人反而更舒服。
    claim:
      type: tendency
      statement: "口语语料中 thing、stuff、or something、sort of 一类模糊语言极其常见且成系统：说话人用它标记「精确不重要/我拿不准/给你留面子」。Carter & McCarthy 的定性是：模糊语言「更可能是熟练而敏感的说话人的标志，而不是懒人的标志」（2006: 202），应被鼓励而非纠正。"
      evidence:
        - "Carter & McCarthy (2006), CGE, p. 202（经 HLT 文章转引；CANCODE 500 万词口语语料分布为据）"
      scope: 模糊是交际策略，有适用场合；教学目标是让学习者「会选」，不是「都含糊」。
      exceptions:
        - 需要精确的信息（时间、数量、指令、安全事项）含糊就是错误。
    mechanism:
      - beat: 模糊即策略
        text_kid: 说「蓝蓝的东西」「去散步什么的」不是偷懒——有时候不用说那么准，听的人反而更舒服。
        text_adult: 模糊语言成系统地出现在 CANCODE 口语语料中，是口语语法的正式成员（与 CB-07/09 同组）；儿童侧先做听辨与理解，不做术语讲解。
        visual: 精确—模糊的选择场景对照
        anchors: []
    examples:
      - level: 1
        word_ids: [G3_0622, ADD_0781, ADD_0662]
        form: "talk 中的 or something / sort of 型模糊标记"
        scene_note: 清单原文列举的模糊语言形式（构成词 thing/stuff 已入词库 ADD_0781/ADD_0662）
        supports: claim
    error_cases:
      - wrong: 把学生的模糊语言一律当懒或错误纠正，或反过来教学生处处含糊
        right: 模糊是策略：该精确处必须精确，其余场合是熟练标志
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 定性与 exceptions。
    relatives:
      - {id: CB-07, rel: 同族}
      - {id: CB-09, rel: 同族}
    quiz:
      - q: 哪些场合含糊就是错误？
        options: [闲聊, 时间、数量、指令、安全事项, 讲故事, 打招呼]
        answer: 时间、数量、指令、安全事项
        hint_on_wrong: 回 claim 的 exceptions
    probes: []
    prereq: [CB-07]
    order: 8
    pain_points: []
    adult:
      sources:
        - "Carter & McCarthy (2006), Cambridge Grammar of English, CUP, p. 202；特征清单整理 https://www.kenpatersonwriter.com/spoken-grammar/"
      boundary: 精确信息场合不适用模糊策略。
      disputes: 无。
      evidence_grade: 页码经转引核实（原书未打开）
      pending:
        - "同 CB-07：CGE 页码引文待打开原书核对"
