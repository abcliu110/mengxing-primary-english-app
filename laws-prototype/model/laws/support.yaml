  - id: LS-11
    zone: 支撑层
    group: LS
    subgroup: 生成性加工
    audience: 教师/设计层
    headline: 精细化提问与自我解释：每学一步就追问「为什么、凭什么」，把例子读出道理的人学到的才是会迁移的那一份
    headline_kid: 看例题别只记住答案——每一步都问问自己：「为什么这一步是对的？换个样子还对吗？」能给自己讲出道理，才算真懂。
    claim:
      type: tendency
      statement: 精细化提问（追问「为什么这是真的」）与自我解释（为范例每一步补出没写明的理由、条件与原理联结）是同源的生成性技巧：补出的推论正是范例省略、而迁移时必需的部分；提示自我解释可教、可诱发，不是学霸的个人习惯。两技巧在 Dunlosky (2013) 评级中为中效用。
      evidence:
        - "Chi, Bassok, Lewis, Reimann & Glaser (1989), Cognitive Science 13(2): 145–182（自我解释数量与后测高相关：每例 15.3 条 vs 2.8 条，后测 82% vs 46%）"
        - "Chi, de Leeuw, Chiu & LaVancher (1994), Cognitive Science 18: 439–477（八年级提示实验）"
      scope: 共同前提是学习者有可调用的既有知识；低龄、低知识量儿童面对开放式「为什么」会无话可说。
      exceptions:
        - 1989 原研究是小样本相关发现（8 名大学生），因果证据来自 1994 提示实验（14 名八年级学生，样本依然小）。
        - App 侧应把追问做成有支架的形态（给候选理由选一选、补完理由后半句），不把成人开放式发问原样搬给小学生；自我解释在儿童身上自发发生率低，需提示触发。
    mechanism:
      - beat: 生成性追问
        text_kid: 看例题别只记住答案——每一步都问问自己：「为什么这一步是对的？」
        text_adult: 自我解释同时实时监控哪里没懂——讲不出来的地方正是未懂之处。设计上以支架式追问诱发，而非开放发问。
        visual: 范例步骤旁的支架式追问气泡示意
        anchors: []
    examples:
      - level: 1
        word_ids: [G4_0518]
        form: "elaborative interrogation（精细化提问）、self-explanation（自我解释）"
        scene_note: 清单原文的两个技巧名
        supports: claim
    error_cases:
      - wrong: 对低龄儿童原样使用开放式「为什么」追问且无支架
        right: 追问做成候选理由二选一、补完后半句等支架形态
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——技巧以既有知识为前提。
    relatives:
      - {id: LS-01, rel: 同族}
    quiz:
      - q: 自我解释为什么只拿到中效用评级？
        options: [完全无效, 以可调用的既有知识为前提, 只能用于数学, 需要特殊设备]
        answer: 以可调用的既有知识为前提
        hint_on_wrong: 回 claim 与 LS-01 评级
    probes: []
    prereq: []
    order: 11
    pain_points: []
    adult:
      sources:
        - "Chi et al. (1989), Cognitive Science 13(2): 145–182, DOI 10.1207/s15516709cog1302_1；Chi et al. (1994), Cognitive Science 18: 439–477；评级见 Dunlosky et al. (2013)"
      boundary: 样本小；年龄下限真实存在，儿童形态须支架化。
      disputes: 训练后自我解释质量个体差异大，「解释」与「复述」的编码边界各研究操作定义不完全一致；「提示自我解释有效」本身无主流反对。
      evidence_grade: 一手实验核实（小样本已注）
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-11}

  - id: LS-12
    zone: 支撑层
    group: LS
    subgroup: 双通道、多媒体与认知负荷
    audience: 教师/设计层
    headline: 双重编码：词和图各存一份，等于给记忆留两个入口——但那组到处流传的百分比没有出处，禁用
    headline_kid: 一个词配上一幅对的图，脑子里就存了两份：一份是图的样子，一份是词的声音和拼写。想起图能带出词，想起词也能带出图，比只看词多一条路。
    claim:
      type: tendency
      statement: 认知有两个功能独立又互相联结的系统——言语系统与意象系统；具体物象天然被双重表征，两套码独立且可叠加，回忆时任一入口都可能到达目标。教学含义是「词与它的指称图配对呈现」，不是「页面上有图就行」。
      evidence:
        - "Paivio (1971) Imagery and Verbal Processes；Paivio (1986) Mental Representations: A Dual Coding Approach（理论定版）"
        - "Paivio & Csapo (1973), Cognitive Psychology 5(2): 176–206（N = 519，图片 > 具体词 > 抽象词）"
      scope: 经典实验被试为成人大学生、材料为名词性物象；对儿童只作方向引用，不挂未核数字。
      exceptions:
        - 网络流传的「只听记住 10%……图文结合 65%」学习金字塔百分比查无原始实验出处，Paivio 从未给出此类比例，任何页面与条目不得引用。
        - 图必须与词同指一物：装饰性、气氛性图片不产生双重编码收益，反而触发 LS-13 一致性原则惩罚。
    mechanism:
      - beat: 双码双入口
        text_kid: 一个词配上一幅对的图，脑子里就存了两份，想起图能带出词，想起词也能带出图。
        text_adult: 统计分析支持意象码与言语码贡献互相独立、可加，且意象码贡献大于言语码——这是双重编码而非单一通道强弱的证据形态。
        visual: 词—图配对呈现（同指一物）示意
        anchors: [G1_037]
    examples:
      - level: 1
        word_ids: [G1_037]
        form: "apple 配苹果图：图像码 + 言语码双重表征"
        scene_note: 清单原文的经典例（物象名词）
        supports: claim
    error_cases:
      - wrong: 引用「图文结合记住 65%」等学习金字塔百分比作设计依据
        right: 该组百分比无原始出处，禁用；双重编码只作方向引用
        error_type: 伪出处引用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——Paivio 从未给出此类比例。
    relatives:
      - {id: LS-13, rel: 同族}
    quiz:
      - q: 哪种配图产生双重编码收益？
        options: [装饰性气氛图, 与词同指一物的图, 任意图片, 图越多越好]
        answer: 与词同指一物的图
        hint_on_wrong: 回 claim 的教学含义
    probes: []
    prereq: []
    order: 12
    pain_points: []
    adult:
      sources:
        - "Paivio (1971); Paivio (1986), Oxford University Press; Paivio & Csapo (1973), Cognitive Psychology 5(2): 176–206, DOI 10.1016/0010-0285(73)90032-7"
      boundary: 成人大学生、名词性物象；儿童只作方向引用。
      disputes: 图片优势成因有实质争论——「独特性」解释近年获强支持（Higdon et al. 2024 宣称双重编码解释「不再成立」）；教学结论「词配对图」在两派下都成立，但机制表述须标为「主流解释之一」，不得写成已定论的唯一机制。
      evidence_grade: 一手实验+理论原文核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-12}

  - id: LS-13
    zone: 支撑层
    group: LS
    subgroup: 双通道、多媒体与认知负荷
    audience: 教师/设计层
    headline: Mayer 多媒体原则：动画课的画面纪律是有实验账本的——删无关、给信号、词图同地同时
    headline_kid: 屏幕上的每样东西都要为学习干活：跟学习没关系的热闹删掉，重要的地方做上记号，讲到哪儿图就出现在哪儿、就放在旁白说的那个词旁边，别让眼睛满屏找。
    claim:
      type: tendency
      statement: 多媒体学习立在三条假设上（双通道、容量有限、主动挑选—组织—整合）；针对无关加工的五条原则证据最完整：一致性（删无关）、信号（标结构重点）、冗余（有旁白和图时不叠加逐字相同的屏幕文字）、空间临近、时间临近（旁白与对应动画同步）。
      evidence:
        - "Mayer, Multimedia Learning (2001；2020 第 3 版，CUP)"
        - "Mayer & Fiorella (2014) Handbook 章：中位效应量——一致性 d = 0.86（23/23）、冗余 d = 0.86（16/16）、时间临近 d = 1.22（9/9）、信号 d = 0.41（24/28）、空间临近 d = 1.10（22/22；2026-11-02 经该章 APA PsycNet 摘要核补）"
      scope: 实验主体是大学生，材料是科学说明类短图文/动画，测验多为即时或短延迟迁移；效应量数字不得转写成对儿童的收益承诺，只借设计纪律的方向。
      exceptions:
        - 空间临近原则的中位效应量已经 2026-11-02 核实为 d = 1.10（22/22 项检验支持），出处为 Mayer & Fiorella (2014) 章的官方摘要（APA PsycNet 章记录）——原「标待核、不填数」登记就此销项（见 adult.pending）。
        - 冗余原则的证据针对已能流利阅读的学习者；对识字初期儿童，屏幕文字可能是解码脚手架，是否叠加字幕须按年龄段分开处理，不能整条照搬。
    mechanism:
      - beat: 五原则画面纪律
        text_kid: 屏幕上的每样东西都要为学习干活：没关系的删掉，重要的做记号，讲到哪儿图就出现在哪儿。
        text_adult: 本条是动画画面的设计检查表（与本项目画面纪律直接对应）：删装饰、同步呈现、就近摆放、信号化。「个性化」「具身」等晚出原则证据弱，只锚定证据最硬的五原则，不整包引进全部十二原则。
        visual: 五原则逐项对照的画面审查示意
        anchors: [G4_158]
    examples:
      - level: 1
        word_ids: [G4_158]
        form: "picture 与讲解词空间临近、时间同步呈现"
        scene_note: 由清单原文五原则推出的画面形态（设计层示例）
        supports: claim
    error_cases:
      - wrong: 给儿童动画叠加与旁白逐字相同的全屏字幕并宣称符合冗余原则
        right: 冗余原则证据针对流利阅读者；识字初期儿童的字幕处理须单独裁定
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——原则适用条件被忽略。
    relatives:
      - {id: LS-12, rel: 同族}
      - {id: LS-14, rel: 同族}
    quiz:
      - q: 空间临近原则的中位效应量（Mayer & Fiorella 2014）是？
        options: [0.41, 0.86, 1.10, 1.22]
        answer: 1.10
        hint_on_wrong: 回 claim 的 evidence（22/22 项检验支持）
    probes: []
    prereq: [LS-12]
    order: 13
    pain_points: []
    adult:
      sources:
        - "Mayer (2001/2020), CUP; Mayer & Fiorella (2014), in Cambridge Handbook of Multimedia Learning (2nd ed.), pp. 279–315"
      boundary: 大学生、科学说明材料；只借设计纪律方向。
      disputes: 原则间有张力——信号要「加东西」、一致性要「减东西」，落地以「标记是否服务于结构」裁决。
      evidence_grade: 章节原文核实
      pending:
        - "（2026-11-02 销项）空间临近原则中位效应量已核：d = 1.10（22/22），源头为 Mayer & Fiorella (2014) 章的官方摘要（APA PsycNet 章记录）——非二手汇总表，已填入 claim evidence 与 exceptions"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-13}

  - id: LS-14
    zone: 支撑层
    group: LS
    subgroup: 双通道、多媒体与认知负荷
    audience: 教师/设计层
    headline: Sweller 认知负荷：新手先看「做完的范例」，熟手再看就是累赘——指导的量必须随水平反着调
    headline_kid: 刚学一样新本领，先看一个从头做到尾的例子，把每一步看懂，再自己动手；等你已经会了，例子就该撤掉——还一步步盯着例子看，反而拖住你。
    claim:
      type: tendency
      statement: 工作记忆一次只能处理很少的新元素；新手无图式时直接解题会被手段—目的搜索占满容量，研读已解出的范例把容量让给图式建构（范例效应）。图式一旦形成，逐步指导与脑内图式重复、变成外在负荷（专家反转效应）——指导必须随水平渐撤。
      evidence:
        - "Sweller & Cooper (1985), Cognition and Instruction 2(1): 59–89（五个实验，中学生与少量大学生）"
        - "Sweller, van Merriënboer & Paas (1998), Educational Psychology Review 10(3): 251–296（三类负荷框架定版）"
        - "Kalyuga (2007), Educational Psychology Review 19(4): 509–539（专家反转综述）"
      scope: 范例效应强证据集中在数学、物理等结构良好题域与中学以上被试；语言学习里的对应物是机制类推，可借结构（新句型先给完整范例、再渐撤支架）不借效应量。小学生工作记忆更小，约束只会更硬。
      exceptions:
        - 三类负荷主要靠主观量表事后测量，相关负荷与内在负荷在测量上难以干净分离；教学口径可用「三类」作设计清单，但不得把三类负荷写成三个可分别测量的实体。
    mechanism:
      - beat: 范例先行、指导渐撤
        text_kid: 刚学一样新本领，先看一个从头做到尾的例子；等你已经会了，例子就该撤掉。
        text_adult: 内在负荷取决于学习者已有图式，故同一材料对新手与熟手是两种负荷；分段呈现、一次只引入一个新元素是低龄侧的硬约束。
        visual: 指导量随水平递减的渐撤曲线
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_43]
        form: "worked example（已解范例）：新句型先给完整范例再渐撤支架"
        scene_note: 清单原文给出的语言学习对应形态（机制类推，已标）
        supports: claim
    error_cases:
      - wrong: 对已熟练的学习者继续强制逐步范例指导
        right: 图式形成后撤掉指导（专家反转效应），指导量随水平反着调
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim——同一份设计对新手是帮助、对熟手是干扰。
    relatives:
      - {id: LS-10, rel: 对照}
      - {id: LS-13, rel: 同族}
    quiz:
      - q: 专家反转效应说明什么？
        options: [范例永远有害, 指导量应随水平提高而减少, 新手不需要范例, 负荷无法管理]
        answer: 指导量应随水平提高而减少
        hint_on_wrong: 回机制小节「范例先行、指导渐撤」
    probes: []
    prereq: []
    order: 14
    pain_points: []
    adult:
      sources:
        - "Sweller & Cooper (1985), Cognition and Instruction 2(1): 59–89, DOI 10.1207/s1532690xci0201_3；Sweller et al. (1998), EPR 10(3): 251–296；Kalyuga (2007), EPR 19(4): 509–539"
      boundary: 结构良好题域、中学以上证据为主；语言侧是机制类推。
      disputes: 三类负荷可测性争议（如实登记）——Kalyuga (2011) 主张两类负荷已经足够；Sweller 后期把 germane 重新定位为「投入处理内在负荷的资源」而非独立第三类（修订原句已核：Sweller 2010, p. 126，见 pending 销项；本条转述与原句一致）。
      evidence_grade: 一手实验+框架核实（后期修订原句待核）
      pending:
        - "（2026-11-02 部分销项）germane 修订原句已核：Sweller (2010), “Element interactivity and intrinsic, extraneous, and germane cognitive load”, Educational Psychology Review 22(2): 123–138, p. 126——“Unlike intrinsic and extraneous cognitive load, germane cognitive load does not constitute an independent source of cognitive load. It merely refers to the working memory resources available to deal with the element interactivity associated with intrinsic cognitive load.”（经 Garnett《Cognitive Load Theory: A Handbook for Teachers》与 EdTech Books CLT 章两处独立引录逐字一致；2019/2023 复述同此）"
        - "Kalyuga (2011)「两类足够」论证细节仍未打开原文，引用其原句前须补核（仅剩此子项）"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-14}

  - id: LS-15
    zone: 支撑层
    group: LS
    subgroup: 课程层编排
    audience: 教师/设计层
    headline: Nation 四线平衡：一个设计良好的语言课程有四条等时的线——只跑「讲练线」，等于缺了四分之三的课
    headline_kid: 学英语的时间要分四份：听故事、读绘本把意思弄懂；开口说、动手写把意思送出去；专门停下来抠单词和语法；还有一份时间不学新东西，只把已经会的练到又快又顺。
    claim:
      type: tendency
      statement: 语言课程的一切活动可归入四条贯穿全程的线——意义聚焦输入（材料约 98% 已知词覆盖）、意义聚焦输出、语言聚焦学习、流利度发展（材料全部熟悉、无生词，带适度速度压力且量大）；设计良好的课程四线时间大致均等，只有语言聚焦一线以形式为中心。
      evidence:
        - "Nation (2007), Innovation in Language Learning and Teaching 1(1)（原文已打开核对等时原句）"
        - "Nation & Yamamoto (2012)（98% 覆盖复述，原文核对）"
      scope: 「各占四分之一」是课程设计的规范框架，不是实验测得的效应量，不得包装成「研究证明 25% 最优」；原始讨论语境以青少年与成人课程为主，小学段形态需本地化，四分之一只作巡检参照、不作排课公式。
      exceptions:
        - 市面课程最常见的失衡是语言聚焦学习一线独大、其余三线萎缩；流利度线因四项成立条件（材料熟悉、关注信息、有速度压力、量大）最容易被整条漏掉。
    mechanism:
      - beat: 四线巡检
        text_kid: 学英语的时间要分四份，少哪一份都会瘸腿。
        text_adult: 输入与流利度两线靠覆盖率互相划界：输入约 98% 覆盖留少量新词，流利度读几乎不含生词的材料并求速度。小学段本地化：输入靠听读故事、输出靠表演与讲述、流利度靠复读复述与限时小游戏。
        visual: 四线等时配比巡检图
        anchors: [G2_0492]
    examples:
      - level: 1
        word_ids: [V6_学校_44]
        form: "意义聚焦输入：听故事、读绘本（约 98% 已知词覆盖）"
        scene_note: 清单原文给出的四线活动例
        supports: claim
    error_cases:
      - wrong: 宣称「研究证明四线各占 25% 时间最优」
        right: 四线等时是规范框架而非效应量，只作课程巡检参照
        error_type: 伪出处引用
        source_type: 条目成人层登记
        diagnosis: 回指 scope——证据形态是四支研究传统的综合判断。
    relatives: []
    quiz:
      - q: 流利度发展线的材料条件是什么？
        options: [含大量生词, 全部熟悉、无生词且带速度压力, 只读不说, 越难越好]
        answer: 全部熟悉、无生词且带速度压力
        hint_on_wrong: 回 claim 的四线定义
    probes: []
    prereq: []
    order: 15
    pain_points: []
    adult:
      sources:
        - "Nation (2007), ILLT 1(1), DOI 10.2167/illt039.0；Nation & Yamamoto (2012), IJIELT 1(2)；Nation & Newton (2009), Teaching ESL/EFL Listening and Speaking, Routledge"
      boundary: 规范框架而非效应量；小学段形态需本地化，比例只作巡检参照。
      disputes: 框架属主流课程观、无对立学派；实际争论在配比细节（语言聚焦的合理上限、流利度是否挤占新学时间）。
      evidence_grade: 一手论文原文核实
      pending:
        - "（2026-11-02 终局登记）四线归因核查：四股框架归于 Nation (2001)《Learning Vocabulary in Another Language》系学术文献通行著录（多篇同行评审论文与学位论文一致引作 Nation 2001 的四股主张）；框架的自足定版文本为 Nation (2007) 本人论文（全文已核，其参考文献含 2001 原书）。2001 原书内的页码级定位未做——本条引用以 2007 论文为准的口径不变，2001 归因按「通行著录」登记、不作页码级引用，就此终局"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-15}

  # ================= YL 少儿英语（14 条） =================
  - id: YL-01
    zone: 支撑层
    group: YL
    subgroup: 儿童的学习机制
    audience: 教师/设计层
    headline: 活动的「难度落差」就是学习发生的地点：任务要求与教师支持之间的差，决定孩子学不学得到东西
    headline_kid: 题目太容易，没意思；太难，够不着。老师在旁边搭一把手、刚刚够得着的地方，就是学会的地方。
    claim:
      type: tendency
      statement: 儿童外语任务同时对孩子提出多维要求（认知、语言、互动、身体动作等），教师提供相应支持；当要求略高于孩子现有能力、支持恰好补上落差时，差额就是成长与学习机会的空间。配套三段式任务结构（准备→核心→跟进）用于动态调节落差。
      evidence:
        - "Cameron (2001) Teaching Languages to Young Learners, CUP, 第 2 章任务框架（demands/supports, pp. 21–25；任务五特征 p. 31；三段式 p. 32——经 Pinter 2015 章节转引核实，书目与目录经书商页核实）"
      scope: 落差是动态的、因人而异的，支持量须随观察调整，不是备课时一次算死的数值。
      exceptions:
        - 支持给得过多（替孩子做完）同样消灭学习空间。
    mechanism:
      - beat: 要求—支持落差
        text_kid: 题目太容易，没意思；太难，够不着。刚刚够得着的地方，就是学会的地方。
        text_adult: Cameron 给儿童任务定的五条标准（整体连贯、有意义与目的、语言目标清晰、有头有尾、孩子主动参与）已成为少儿任务设计的通行检查表；App 的活动难度与支架量按本框架巡检。
        visual: 要求线与支持线之间的落差带示意
        anchors: []
    examples:
      - level: 1
        word_ids: [G2_0990]
        form: "三段式任务：准备活动 → 核心活动 → 跟进活动"
        scene_note: 清单原文的任务结构
        supports: claim
    error_cases:
      - wrong: 备课时把支持量一次算死，或支持过多替孩子做完
        right: 支持量随观察动态调整，只补落差、不替代产出
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 exceptions。
    relatives:
      - {id: YL-02, rel: 同族}
      - {id: LS-14, rel: 对照}
    quiz:
      - q: 学习机会出现在哪里？
        options: [要求最低处, 要求略高于能力且支持补上落差处, 支持最大处, 任务最难处]
        answer: 要求略高于能力且支持补上落差处
        hint_on_wrong: 回机制小节「要求—支持落差」
    probes: []
    prereq: []
    order: 1
    pain_points: []
    adult:
      sources:
        - "Lynne Cameron (2001), Teaching Languages to Young Learners, Cambridge University Press, ISBN 9780521774345；Pinter (2015) 转引（WRAP 开放存档）"
      boundary: 同一任务对不同孩子的要求不同，支持必须随观察调整。
      disputes: 无主流分歧；Pinter 指出儿童任务研究多为成人任务研究的延伸，儿童如何受益的直接证据仍在积累（见 YL-04）。
      evidence_grade: 目录+书评级（页码经转引核实）
      pending:
        - "（2026-11-02 终局登记）Cameron (2001) 个别页码级引文（如 p. 52）维持二手转引标注：本轮未打开原书，此为长期标注规则——引用具体页码前须开原书复核；不再作开放待核计数"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-01}

  - id: YL-02
    zone: 支撑层
    group: YL
    subgroup: 儿童的学习机制
    audience: 教师/设计层
    headline: 儿童是在「活动 + 话语」里把意思搭出来的：听不懂整句时，他们靠线索猜、靠做中学
    headline_kid: 听不懂一整句没关系——看图、看动作、抓认识的词，先猜个大概，做着做着就全懂了。
    claim:
      type: tendency
      statement: 儿童的外语理解是主动「寻求意义」：调动语境、图片、实物、动作、已知词汇与世界知识推测话语意思，理解在参与活动中逐步建成。教师话语身兼输入与脚手架两职（放慢、重复、改述、配动作与实物），课堂话语质量直接决定孩子能搭出多少理解。
      evidence:
        - "Cameron (2001), CUP, 第 1 章与第 3 章（书介与 British Council 书评核实其框架定位）"
      scope: 猜测需要足够的线索密度；输入完全不可理解时「寻求意义」会变成焦虑与放弃。
      exceptions:
        - 不能推论为「随便说、孩子自会懂」——机制要求教师话语做可理解性加工。
    mechanism:
      - beat: 寻求意义
        text_kid: 听不懂一整句没关系——看图、看动作、抓认识的词，先猜个大概，做着做着就全懂了。
        text_adult: 该书是少儿外语领域少数把「课堂话语」当作研究对象的理论专著；App 侧的旁白与讲解话语按脚手架标准设计（放慢、重复、改述、配实物/动作）。
        visual: 线索（图/动作/实物/已知词）汇聚成理解的示意
        anchors: [G4_158]
    examples:
      - level: 1
        word_ids: [G4_158]
        form: "以图片、实物、动作作理解线索的课堂话语"
        scene_note: 清单原文列举的线索类型
        supports: claim
    error_cases:
      - wrong: 输入无线索、无实物支撑却期待孩子自行猜懂
        right: 先保证线索密度与话语的可理解性加工，再让孩子寻求意义
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope——线索不足时机制失效。
    relatives:
      - {id: YL-01, rel: 同族}
    quiz:
      - q: 教师话语在儿童课堂里身兼哪两职？
        options: [输入与考试, 输入与脚手架, 纠错与管理, 朗读与翻译]
        answer: 输入与脚手架
        hint_on_wrong: 回机制小节「寻求意义」
    probes: []
    prereq: [YL-01]
    order: 2
    pain_points: []
    adult:
      sources:
        - "Lynne Cameron (2001), Teaching Languages to Young Learners, CUP, 第 1、3 章"
      boundary: 要求教师话语的可理解性加工，不能推论为随便说孩子自会懂。
      disputes: 无。
      evidence_grade: 目录+书评级
      pending:
        - "同 YL-01：页码级引文入模引用前须开原书复核"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-02}

  - id: YL-03
    zone: 支撑层
    group: YL
    subgroup: 儿童的学习机制
    audience: 教师/设计层
    headline: 一个主题滚一周：词汇和句型要在故事、游戏、手工里反复见面，才算学过
    headline_kid: 一个主题玩一整周——故事里听到、游戏里用到、手工时又说一遍，见面次数多了，自然就记住啦。
    claim:
      type: tendency
      statement: 儿童的词汇与语法靠同一主题下多类活动提供的多次、有变化的接触建立：同一批词在故事语境、操作活动、口头产出中以不同面貌复现，记忆痕迹与用法网络随之增厚；主题充当组织器，让复现不沦为机械重复。
      evidence:
        - "Cameron (2001), CUP, 第 4 章（词汇）、第 5 章（语法）、第 8 章（主题式教学），目录核实"
        - "Shin & Crandall (2014) 以主题单元「情境化教学」为全书第 3 章，独立背书（见 YL-10）"
      scope: 复现必须是有变化的复现；主题只是容器，语言目标仍须事先选定（与 YL-01 任务标准互锁）。
      exceptions:
        - 原样重复同一练习会迅速耗尽儿童注意力；主题大到无焦点同样失效。
    mechanism:
      - beat: 主题内变化复现
        text_kid: 一个主题玩一整周——故事里听到、游戏里用到、手工时又说一遍，见面次数多了，自然就记住啦。
        text_adult: 与 LS-06 间隔效应在课堂形态上衔接：同一主题内的多次见面同时提供间隔与语境变化。
        visual: 一周主题内多活动复现同一批词的排布图
        anchors: [V6_学校_44, G2_0990]
    examples:
      - level: 1
        word_ids: [V6_学校_44, G2_0990]
        form: "同一主题下：故事（story）里听到、游戏（game）里用到"
        scene_note: 清单原文的活动类型
        supports: claim
    error_cases:
      - wrong: 同一练习原样重复多遍充当复现
        right: 换活动、换用法地复现同一批词与句型
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——无变化的重复耗尽注意力。
    relatives:
      - {id: YL-10, rel: 同族}
      - {id: LS-06, rel: 对照}
    quiz:
      - q: 本条要求的复现是哪一种？
        options: [原样重复, 有变化的复现, 只读不说, 只考不学]
        answer: 有变化的复现
        hint_on_wrong: 回机制小节「主题内变化复现」
    probes: []
    prereq: []
    order: 3
    pain_points: []
    adult:
      sources:
        - "Cameron (2001), CUP, 第 4、5、8 章"
      boundary: 主题不能大到无焦点；语言目标须事先选定。
      disputes: 无。
      evidence_grade: 目录核实级
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-03}

  - id: YL-04
    zone: 支撑层
    group: YL
    subgroup: 儿童的学习机制
    audience: 教师/设计层
    headline: 孩子之间会互相「搭手」：同伴支架是儿童课堂的真实学习机制，不是纪律问题
    headline_kid: 和同桌一起做任务时，你帮我说一半、我提醒你一个词，两个人就都往前走了一步。
    claim:
      type: tendency
      statement: 8–13 岁儿童在结对任务中会使用协商意义策略，其形态与成人不同：较少做理解核查，大量使用自我重复与他人重复推进对话；非母语同伴结对时孩子把对方看作共同解题者，产出的修正后输出多于与成人母语者结对；低水平儿童也能在重复版任务中做同伴纠正。
      evidence:
        - "Pinter (2015)「Task-based learning with children」, in Bland (Ed.) Teaching English to Young Learners, Bloomsbury, pp. 113–128（WRAP 开放存档全文）"
        - "所综述一手研究：Oliver (1998, 2002)；Mackey, Oliver & Leeman (2003)；Mackey & Oliver (2002)；Mackey & Silver (2005)；Pinter (2005)；Guk & Kellogg (2007)"
      scope: 实验证据多来自 ESL（目标语环境）儿童，外推到课时量低的 EFL 课堂须谨慎（Pinter 本人明言）。
      exceptions:
        - 同伴支架质量低于教师支架，需要任务设计（信息差、明确分工）托底；「放孩子自己讨论」本身不是支架。
    mechanism:
      - beat: 同伴支架
        text_kid: 和同桌一起做任务时，你帮我说一半、我提醒你一个词，两个人就都往前走了一步。
        text_adult: 成人给予的互动性反馈（针对孩子具体困难的改述）被实验证明能促进儿童疑问句式的发展；结对任务须配信息差与分工设计。
        visual: 结对任务中重复与修正输出的对话示意
        anchors: [G3_0442]
    examples:
      - level: 1
        word_ids: [G3_0442]
        form: "「找不同」重复版任务中的同伴纠正（help 的课堂形态）"
        scene_note: 清单原文登记的任务类型
        supports: claim
    error_cases:
      - wrong: 无信息差、无分工地放任孩子自由讨论并称之为同伴支架
        right: 结对任务须有信息差与明确分工托底
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions。
    relatives:
      - {id: YL-01, rel: 同族}
    quiz:
      - q: 儿童结对协商的典型形态与成人有何不同？
        options: [更多理解核查, 较少理解核查、大量使用重复, 完全不说话, 只用母语]
        answer: 较少理解核查、大量使用重复
        hint_on_wrong: 回机制小节「同伴支架」
    probes: []
    prereq: [YL-01]
    order: 4
    pain_points: []
    adult:
      sources:
        - "Annamaria Pinter (2015), Bloomsbury, pp. 113–128, WRAP 全文 https://wrap-test.warwick.ac.uk/id/eprint/71512/"
      boundary: ESL 证据外推 EFL 须谨慎；同伴支架需任务设计托底。
      disputes: 心理语言学派（重产出模式的统计趋势）与社会文化派（重个体如何理解同一任务）对「任务决定什么」看法不同，Pinter 并列登记，未作调和。
      evidence_grade: 章节全文核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-04}

  - id: YL-05
    zone: 支撑层
    group: YL
    subgroup: 儿童的学习机制
    audience: 教师/设计层
    headline: 儿童学二语的路径由「语境」决定：在家、在课堂、在沉浸环境，是三种学法
    headline_kid: 住在英语国家天天听，和一周上两节英语课，是完全不一样的学法——不能拿一种的标准去要求另一种。
    claim:
      type: tendency
      statement: 儿童二语研究必须先分清语境——家庭双语、学校外语课堂、沉浸教育——因为输入量、互动机会与学习过程性质根本不同；同一「年龄效应」问题在不同语境下答案相反。儿童学习受发展阶段制约，成人 SLA 结论不能平移到儿童。
      evidence:
        - "Pinter (2011), Children Learning Second Languages, Palgrave Macmillan, DOI 10.1057/9780230302297（出版社页目录核实）"
      scope: 本条是研究框架级结论，不直接给出课堂操作；对 App 的含义是筛选证据时的过滤器。
      exceptions:
        - 凡引「儿童学语言快」类说法，必须先问出自哪种语境，否则不予采信。
    mechanism:
      - beat: 语境三分
        text_kid: 住在英语国家天天听，和一周上两节英语课，是完全不一样的学法。
        text_adult: 该书被书评称为儿童二语领域「开新局」之作，系统对应研究与课堂实践之间的落差；本条与 YL-08 年龄效应互锁。
        visual: 三种语境（家庭双语/外语课堂/沉浸）的输入结构对照
        anchors: [G2_089]
    examples:
      - level: 1
        word_ids: [G2_089]
