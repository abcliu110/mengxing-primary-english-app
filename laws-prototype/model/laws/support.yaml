  - id: YL-11
    zone: 支撑层
    group: YL
    subgroup: 年龄、动机与儿童参与
    audience: 教师/设计层
    headline: 外语环境里，课堂（和产品）几乎是孩子唯一的英语来源——所以体验质量就是学习质量
    headline_kid: 在学校外面很少能碰到英语，所以每一节课、每一次打开学习的时间，都要真的好玩、真的能学到——没有别的地方补。
    claim:
      type: tendency
      statement: 外语情境中的孩子几乎完全依赖学校（以及校内产品）获得英语输入，不像二语环境有环境输入兜底；儿童的学习意愿直接由活动体验驱动——享受活动才投入并持续，持续投入又增加输入量。因此在外语语境里，体验设计不是包装，而是输入供给机制本身。
      evidence:
        - "Moon (2000), Children Learning English, Macmillan-Heinemann, Teacher Development Series（书目经诺丁汉大学 TEFL 阅读清单核实；机制表述依据二手学术引用，页码级引文未打开一手页——见 pending）"
        - "Moon 与 Brumfit、Tongue (1991) 的儿童相对成人学习特征经典概括（反复被引）"
      scope: 本条写于 2000 年，校外输入环境（短视频、AI 对话）已变：「唯一来源」的程度在数字时代有所缓解，但结构化、可理解的输入仍主要来自课堂与产品，结论方向不变、强度待按当代语境再评估。
      exceptions:
        - 与 YL-05 语境框架、YL-08 接触总量结论互相印证，但不得把 2000 年的「唯一」程度原样搬到今日。
    mechanism:
      - beat: 体验即输入供给
        text_kid: 在学校外面很少能碰到英语，所以每一次打开学习的时间，都要真的好玩、真的能学到。
        text_adult: 对 App 的直接含义：产品内的每一次学习体验同时承担输入供给职能，体验质量的下滑即输入量的下滑，没有环境兜底。
        visual: 外语语境输入来源结构（课堂/产品为主）示意
        anchors: [G3_0619]
    examples:
      - level: 1
        word_ids: [G3_0619]
        form: "speak 的机会在外语语境主要由课堂与产品供给"
        scene_note: 清单原文的输入结构论点
        supports: claim
    error_cases:
      - wrong: 假设孩子会在校外环境中自然补足英语输入
        right: 外语语境下输入供给须由课堂与产品设计全额承担
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的输入结构。
    relatives:
      - {id: YL-05, rel: 同族}
      - {id: YL-08, rel: 同族}
    quiz:
      - q: 在外语语境里，体验设计为什么是输入供给机制本身？
        options: [因为好玩更重要, 因为孩子几乎只从课堂与产品获得英语输入, 因为考试要求, 因为家长要求]
        answer: 因为孩子几乎只从课堂与产品获得英语输入
        hint_on_wrong: 回机制小节「体验即输入供给」
    probes: []
    prereq: [YL-05]
    order: 11
    pain_points: []
    adult:
      sources:
        - "Jayne Moon (2000), Children Learning English, Macmillan-Heinemann（诺丁汉大学阅读清单书目核实）"
      boundary: 2000 年语境，当代强度待再评估，方向不变。
      disputes: 无。
      evidence_grade: 书目核实+二手转引级（页码级引文待核）
      pending:
        - "（2026-11-02 终局登记）Moon (2000) 页码级引文（p. 7、p. 14）：书目本体已核（Jayne Moon《Children Learning English》, Macmillan-Heinemann, Teacher Development Series, 2000；诺丁汉大学 TEFL 阅读清单著录），但 p. 7/p. 14 的具体引文经检索无开放全文可逐字比对——维持二手学术引用标注，引用该两页前须开原书，就此终局登记"
