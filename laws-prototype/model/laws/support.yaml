  - id: CB-10
    zone: 支撑层
    group: CB
    subgroup: "Hunston & Francis:词义绑在型式上"
    audience: 教师/设计层
    headline: 换个型式，就换了个意思（pattern grammar）
    headline_kid: 同一个词，穿不同的「句子外套」，意思就不一样——看词要连外套一起看。
    claim:
      type: tendency
      statement: "一个词的 pattern 是「与这个词规律性地相伴出现、并对其意义有贡献的全部词与结构」（Hunston & Francis 2000: 37）：组合要算型式，须相对高频、依赖于特定词的选择、且带明确意义关联。推论：同一词的不同义项通常由不同型式区分；同一型式槽位里出现的词往往意义相亲——词选型式，型式定义词义，词汇与语法不是两个盒子。"
      evidence:
        - "Hunston & Francis (2000), Pattern Grammar, John Benjamins, 289 pp.（定义 p. 37 经 Römer 2009 综述逐页转引核实）"
        - "reflect 三义项由 V n / be Ved / V on n 三型式区分（pp. 255–256，转引登记；reflect 已入词库 ADD_0618）"
      scope: 型式是概率性的搭配-结构倾向，强型式与自由组合之间是连续谱。
      exceptions:
        - 给儿童的落地是「连型式一起记词」（如 good at、look at），不是背型式术语表。
    mechanism:
      - beat: 型式定义词义
        text_kid: 同一个词，穿不同的「句子外套」，意思就不一样——看词要连外套一起看。
        text_adult: 型式分析基于 COBUILD 的 Bank of English 索引行累积证据，判定辅以统计显著性检验（t-score）；本条与 CB-02 搭配、CO 组构式在「词汇—语法连续」上同向。
        visual: 一词多型式—多义项的对应图
        anchors: [G3_K08, V6_日常_16]
    examples:
      - level: 1
        word_ids: [G3_K08]
        form: "good at（型式连记）"
        scene_note: 清单原文给出的儿童落地例
        supports: claim
      - level: 2
        word_ids: [V6_日常_16]
        form: "look at（型式连记）"
        scene_note: 清单原文给出的儿童落地例
        supports: claim
    error_cases:
      - wrong: 词与语法分盒教：只背孤立词义或只背抽象句型
        right: 连型式一起记词，义项由型式区分
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的推论。
    relatives:
      - {id: CB-02, rel: 同族}
      - {id: CB-01, rel: 同族}
    quiz:
      - q: 同一词的不同义项通常由什么区分？
        options: [字母顺序, 不同型式, 词长, 年级]
        answer: 不同型式
        hint_on_wrong: 回机制小节「型式定义词义」
    probes: []
    prereq: [CB-02]
    order: 10
    pain_points: []
    adult:
      sources:
        - "Susan Hunston & Gill Francis (2000), Pattern Grammar: A Corpus-Driven Approach to the Lexical Grammar of English, John Benjamins；Römer (2009) 综述转引 https://uteroemer.weebly.com/uploads/5/5/7/7/5577406/arcl_2009_ute_roemer_06rom.pdf"
      boundary: 型式是概率倾向、连续谱；儿童落地是连型式记词，不是背术语表。
      disputes: 无（型式语法与构式语法在「型式/构式」的本体地位上有理论对话，但对「词义—型式绑定」这一教学结论无实质分歧）。
      evidence_grade: 定义经逐页转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-10}

  - id: CB-11
    zone: 支撑层
    group: CB
    subgroup: "Willis:教学顺序先问频率"
    audience: 教师/设计层
    headline: 最有势力的 700 个词，先攻它们（lexical syllabus）
    headline_kid: 先认识出场最多的那一小队词——它们到处都是，认识它们，一大半的话就都懂了。
    claim:
      type: tendency
      statement: "大纲按词汇而非语法项目分级：以最常用 700 词为一级、1500 词为二级、2500 词为三级组织接触顺序；最高频的词同时携带最常用的型式与用法，抓住常用词就不可避免地抓住了常用型式。数据依据：最常用的 700 个词约占全部文本的 70%（Willis 1990: vi, 46），其后覆盖率陡降（再 800 词约 +6%，再 1000 词约 +4%，p. 47）。"
      evidence:
        - "Willis (1990), The Lexical Syllabus, Collins ELT（源于 COBUILD 语料与 COBUILD English Course 编写实践；数字经 HLT 纪念文与 Harwood 文逐字引 p. 47 核实）"
      scope: 频率是成人通用语料的频率；儿童的交际世界词频分布不同，直接套用会错过儿童高频词、纳入儿童低需词。频率只解决「先学谁」，不解决每个词学到什么深度（见 CB-10、CB-14）。
      exceptions:
        - "频率不等于可教性/可学性：高频词的抽象用法（如 make a decision）虽更频，未必比具体用法（make a cake）更适合初学者先学（Widdowson 2004 的 teachability 反诘；Willis 本人亦承认一般频率不是唯一标准，1990: 47）。"
    mechanism:
      - beat: 频率定序
        text_kid: 先认识出场最多的那一小队词——它们到处都是，认识它们，一大半的话就都懂了。
        text_adult: 词汇大纲实际上涵盖了结构大纲，因为常用词携带常用型式；频率定序时须与儿童认知可达性对冲（scope）。
        visual: 700/1500/2500 三级与覆盖率陡降曲线
        anchors: [V6_日常_4]
    examples:
      - level: 1
        word_ids: [V6_日常_4]
        form: "make a cake（具体用法）vs make a decision（抽象用法）的先学次序问题"
        scene_note: 清单分歧栏登记的 Widdowson 对照例
        supports: claim
    error_cases:
      - wrong: 把成人语料频率表直接套作儿童学序，或宣称频率是唯一标准
        right: 频率与儿童认知可达性、儿童交际词频对冲后再定序
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 disputes。
    relatives:
      - {id: CB-14, rel: 同族}
      - {id: CB-10, rel: 同族}
    quiz:
      - q: 最常用 700 词约占全部文本的多少？
        options: [约 30%, 约 50%, 约 70%, 约 90%]
        answer: 约 70%
        hint_on_wrong: 回 claim 的数据依据
    probes: []
    prereq: []
    order: 11
    pain_points: []
    adult:
      sources:
        - "Dave Willis (1990), The Lexical Syllabus: A New Approach to Language Teaching, Collins ELT；HLT 纪念文 http://old.hltmag.co.uk/dec13/mart03.htm"
      boundary: 成人频率须与儿童世界对冲；频率不解决深度问题。
      disputes: 频率 ≠ 可教性/可学性——Harwood 指出 Willis 本人也承认一般频率不是唯一标准；Widdowson (2004) 以 teachability 反诘。频率定序时须与儿童认知可达性对冲（如实登记）。
      evidence_grade: 数字经逐字转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-11}

  - id: CB-12
    zone: 支撑层
    group: CB
    subgroup: "Granger:把学习者的话存起来"
    audience: 教师/设计层
    headline: 对比中介语分析：两面镜子照出母语的指纹（CIA）
    headline_kid: 把很多小朋友写的英语收集起来，和英语国家的人写的、和其他国家小朋友写的比一比——就能看出每个国家的孩子容易在哪儿摔跤。
    claim:
      type: tendency
      statement: 学习者语料库研究以 ICLE（第二版 2009 年涵盖 16 个母语群体）与口语库 LINDSEI（2010 年发布版 11 个母语背景；项目现行口径 14 个，含在建成分）为基础设施；核心方法 CIA 做两类对比——学习者 vs 母语者照出与目标的距离，不同母语学习者之间分离出「母语迁移造成的特异困难」与「所有学习者共有的发展困难」。配套计算机辅助错误分析（CEA）使用 50 余个错误标签。
      evidence:
        - "Granger 与鲁汶大学 CECL 官方页（项目、群体数与 CIA (1996, 2015) 定义核实）"
      scope: ICLE/LINDSEI 的主体是中高级（多为大学阶段）学习者，其困难清单不能直接当作中国小学生的困难清单——方法可迁移，结论须用本地学习者语料重验（与本项目 CLEC 线索衔接）。
      exceptions:
        - LINDSEI 母语背景数已核清（2026-11-02）：2010 年发布版（Gilquin, De Cock & Granger 编手册所据）为 11 个母语背景；CECL 项目页现行作 14 个，系含在建成分的项目口径——两个数字均为官方，差异属版本口径（见 pending 销项）。
    mechanism:
      - beat: 两类对比
        text_kid: 把很多小朋友写的英语收集起来比一比——就能看出每个国家的孩子容易在哪儿摔跤。
        text_adult: CIA 是 CB-13 频率错位三分的取证方法；对本项目的用途是方法论模板：本地学习者语料（CLEC 线）按同一双对比逻辑运行（见 CG-02、CG-07 的 CLEC 引用）。
        visual: L2 vs L1、L2 vs L2 双对比示意
        anchors: [G3_0487]
    examples:
      - level: 1
        word_ids: [G3_0487]
        form: "write 的学习者产出与母语者产出对比（ICLE 论说文）"
        scene_note: 清单原文的语料构成（统一采集论说文）
        supports: claim
    error_cases:
      - wrong: 把 ICLE 大学生困难清单直接当作中国小学生的困难清单
        right: 方法可迁移，结论须用本地学习者语料重验
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope。
    relatives:
      - {id: CB-13, rel: 同族}
      - {id: CG-02, rel: 对照}
    quiz:
      - q: CIA 的两类对比分别照出什么？
        options: [难度与速度, 与目标的距离、迁移特异困难 vs 共有发展困难, 词汇与语法, 口语与书面]
        answer: 与目标的距离、迁移特异困难 vs 共有发展困难
        hint_on_wrong: 回机制小节「两类对比」
    probes: []
    prereq: []
    order: 12
    pain_points: []
    adult:
      sources:
        - "Sylviane Granger / 鲁汶大学 CECL 官方页 http://www.uclouvain.be/en/research-institutes/ilc/cecl/learner-corpus-research"
      boundary: 主体是大学阶段学习者；结论须本地重验。
      disputes: 无。
      evidence_grade: 官方页核实
      pending:
        - "（2026-11-02 销项）ICLE 总词量已按官方版本沿革定版（鲁汶大学出版社）：v1（2002）250 万词、11 个母语背景；v2（2009）370 万词、16 个；v3（2020）逾 550 万词、25 个。纪念文集转述的「约 330 万词」与任何官方版本均不合，维持不采用"
        - "（2026-11-02 销项）LINDSEI 母语背景数版本沿革已定版：发布版 11 个——保加利亚、中国、荷兰、法国、德国、希腊、意大利、日本、波兰、西班牙、瑞典（鲁汶大学出版社产品页；学习者口语约 80 万词、全库逾 100 万词）；CECL 综述页作 14 个系含在建成分。claim 已按此修正著录"
    status: 入模中
    version: "1.0"
