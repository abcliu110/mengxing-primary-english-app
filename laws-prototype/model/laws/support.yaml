  - id: CB-02
    zone: 支撑层
    group: CB
    subgroup: "Sinclair:语言是整块选出来的"
    audience: 教师/设计层
    headline: 一个词的意义，一半住在它常跟谁一起出现里（collocation）
    headline_kid: 认一个词，还要认它的小伙伴——有些词总是一起出现，拆开用就怪怪的。
    claim:
      type: tendency
      statement: "collocation 是两个或多个词在一小段文本距离内共现（Sinclair 1991: 170）；共现不是随机的，显著互相搭配的词是「一次共同选择」（co-selection）的结果，搭配本身携带意义——知道一个词，必须同时知道它通常吸引哪些伙伴、排斥哪些伙伴。"
      evidence:
        - "Sinclair (1991), OUP, p. 170 定义、p. 113 co-selection 论述（经 Newcastle 教学综述逐条引页码核实）"
        - "搭配显著性可用统计检验判定（互信息、t-score；Hunston & Francis 1999: 231 转引）"
      scope: 搭配是概率倾向不是铁律，强弱因词而异。
      exceptions:
        - 统计显著不等于教学上值得教，还要看学习者的需要与母语干扰（见 CG-02、CB-12 的本地化要求）。
    mechanism:
      - beat: 共选携带意义
        text_kid: 认一个词，还要认它的小伙伴——有些词总是一起出现，拆开用就怪怪的。
        text_adult: 有的词宾语槽几乎全开，有的高度受限；搭配知识是词知识的一半，词库与词汇教学须把伙伴关系作为呈现单位（与 CB-01、CB-10 同链）。
        visual: 词与其高频伙伴的网络图
        anchors: [V6_日常_4]
    examples:
      - level: 1
        word_ids: [V6_日常_4]
        form: "make a decision 型搭配：make 的伙伴选择携带意义"
        scene_note: 清单 CB-11 分歧栏登记的对照例（make a decision vs make a cake，见 CB-11）
        supports: claim
    error_cases:
      - wrong: 只教词的孤立释义、不教其搭配伙伴
        right: 词连同高频伙伴整块教（共选关系即词义的一半）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的共选论点。
    relatives:
      - {id: CB-01, rel: 同族}
      - {id: CB-10, rel: 同族}
    quiz:
      - q: 搭配显著性可用什么判定？
        options: [语感, 统计检验（互信息、t-score）, 词典页码, 年级]
        answer: 统计检验（互信息、t-score）
        hint_on_wrong: 回 claim 的 evidence
    probes: []
    prereq: [CB-01]
    order: 2
    pain_points: []
    adult:
      sources:
        - "John Sinclair (1991), OUP, pp. 113, 170；转引核实 http://wjmll.ncl.ac.uk/issue04-05/dodd.htm"
      boundary: 搭配是概率倾向；教学取舍叠加学习者需求与母语干扰。
      disputes: 无。
      evidence_grade: 原书页码经转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-02}

  - id: CB-03
    zone: 支撑层
    group: CB
    subgroup: "Sinclair:语言是整块选出来的"
    audience: 教师/设计层
    headline: 关于英语的断言，先信文本，不信直觉（Trust the Text）
    headline_kid: 想知道英语到底怎么说，别光凭感觉——去数一数大家真的怎么说。
    claim:
      type: tendency
      statement: 语感（包括语言学家和母语者的语感）对频率、搭配、语域分布的判断系统性不可靠；只有把大批真实文本放进语料库系统检索，语言事实才会浮现。Sinclair 晚年进一步提出「意义单位」大于单个词——意义的典型实现是一组共选的词，单个词只是这个单位的核。
      evidence:
        - "Sinclair (2004), Trust the Text: Language, Corpus and Discourse, Routledge（书名章即 \"Trust the text\"；LINGUIST List 出版公告核实书目）"
        - "自述引文：「系统地检视大型文本语料的能力，带来了一种此前不存在的证据质量」（1991: 4，转引登记）"
      scope: 语料只能告诉我们「人们这样说」，不能单独决定「课堂该不该教」——教学取舍还要叠加学习者需求、年龄与交际目标；语料的代表性决定结论的外推范围。
      exceptions:
        - 语料代表性（收什么文本）不审查，结论不得外推。
    mechanism:
      - beat: 证据观
        text_kid: 想知道英语到底怎么说，别光凭感觉——去数一数大家真的怎么说。
        text_adult: 本条是 CB 组的纲领（拟挂载 dom-corpus-register：「规则先问证据」），也是本项目出处纪律在语料侧的根据：一切关于英语分布的断言先问语料。
        visual: 直觉判断 vs 语料检索的证据对照
        anchors: [G2_0492]
    examples:
      - level: 1
        word_ids: [G2_0492]
        form: "read 的搭配与频率事实以语料检索为准，不以语感为准"
        scene_note: 由纲领推出的工作形态（设计层示例）
        supports: claim
    error_cases:
      - wrong: 以母语者语感或编者直觉断言频率、搭配与语域分布
        right: 先语料检索、再下断言，并注明语料代表性
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的证据观。
    relatives:
      - {id: CB-04, rel: 同族}
      - {id: CB-13, rel: 同族}
    quiz:
      - q: 语料能单独决定什么？
        options: [课堂该教什么, 人们实际怎么说, 考试标准, 儿童发展次序]
        answer: 人们实际怎么说
        hint_on_wrong: 回 claim 的 scope
    probes: []
    prereq: []
    order: 3
    pain_points: []
    adult:
      sources:
        - "John Sinclair (2004), Trust the Text, Routledge, ISBN 0415317673；https://linguistlist.org/issues/15/2786/"
      boundary: 教学取舍须叠加学习者需求、年龄与目标；语料代表性决定外推范围。
      disputes: 语料驱动（corpus-driven）与语料辅助（corpus-based）的方法论分工是该领域长期讨论，但不影响本条证据观本身。
      evidence_grade: 书目核实级
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-03}

  - id: CB-04
    zone: 支撑层
    group: CB
    subgroup: "Biber:只有各语域的英语"
    audience: 教师/设计层
    headline: 口语和书面语的差别是系统性的，不是口语「不规范」
    headline_kid: 说话和写文章本来就是两种样子——说话时「我、你」多，写文章时名词多；不是谁对谁错。
    claim:
      type: tendency
      statement: LGSWE 基于 4000 万词语料（37,000 篇文本，英美两式）按语域统计语法特征，结果呈互补分布：学术散文名词密集、名词化与前置修饰密集；会话则代词、动词、副词与缩略形式密集。差别源于产出条件（实时互动 vs 可反复修改的信息打包），不是水平高下。
      evidence:
        - "Biber, Johansson, Leech, Conrad & Finegan (1999), Longman Grammar of Spoken and Written English, Pearson, ISBN 0-582-23725-4（语料规模经书评转述）"
        - "学术散文名词约占实词 60%（p. 65）、复数名词为会话 3–4 倍（p. 291）——页码级数字来自二手对照表，原书页面未打开（见 pending）"
      scope: 语域是连续谱不是四个盒子；本条说的是群体频率倾向，不能拿来评判单个句子。
      exceptions:
        - 小说里含大量对话、学术讲演介于其间，单文本须落在连续谱上看（与 CB-06 同轴）。
    mechanism:
      - beat: 语域互补分布
        text_kid: 说话和写文章本来就是两种样子——不是谁对谁错。
        text_adult: 「没有一种英语语法，只有各语域的英语」是本子组的总纲：向孩子呈现任何形式时须标明它属于哪个语域（与 CB-07/08/09 的口语语法一脉）。
        visual: 会话 vs 学术散文的特征密度对照
        anchors: [G3_0619]
    examples:
      - level: 1
        word_ids: [G3_0619]
        form: "speak（会话）语域中代词、缩略形式密集"
        scene_note: 清单原文的会话端特征
        supports: claim
    error_cases:
      - wrong: 以书面语规范评判口语「不规范」，或拿群体频率倾向评判单个句子
        right: 先认语域再评价；条内结论只作群体倾向
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 与 scope。
    relatives:
      - {id: CB-06, rel: 同族}
      - {id: CB-07, rel: 同族}
    quiz:
      - q: 口语与书面语差别的来源是？
        options: [水平高下, 产出条件（实时互动 vs 信息打包）, 年龄, 国别]
        answer: 产出条件（实时互动 vs 信息打包）
        hint_on_wrong: 回机制小节「语域互补分布」
    probes: []
    prereq: [CB-03]
    order: 4
    pain_points: []
    adult:
      sources:
        - "Biber et al. (1999), LGSWE, Pearson；书评 https://www.academia.edu/120068795/（语料规模与全书结构）"
      boundary: 语域连续谱；群体倾向不评判单句。
      disputes: 无（语域差异的实证图景为语料语言学共识；register 与 genre 的术语分工另有讨论，不影响本条）。
      evidence_grade: 书评+二手对照表级（页码级数字经两处独立带页码来源互证，2026-11-02）
      pending:
        - "（2026-11-02 销项）LGSWE 页码级数字已互证：名词占学术散文实词约 60%（p. 65）与复数名词在学术散文中为会话的 3–4 倍（p. 291）——经两处独立带页码来源一致引录（Virtual Writing Tutor 的 Biber et al. 页码对照表；兰卡斯特 UCREL 2003 会议论文引作 Biber et al. 1999: 65）。原书页面仍未亲开，等级维持二手互证，不再挂待核"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-04}

  - id: CB-05
    zone: 支撑层
    group: CB
    subgroup: "Biber:只有各语域的英语"
    audience: 教师/设计层
    headline: 高频词串是搭起语篇的预制砖（lexical bundles）
    headline_kid: 有些词总是手拉手一串出现，像乐高拼好的一小块——学会整串，说话写字都顺。
    claim:
      type: tendency
      statement: 在语域中最频繁复现的三词以上序列称为 lexical bundles（词汇束），判据纯统计：每百万词至少出现 10 次、且分布于至少 5 篇不同文本。词汇束大多不是完整结构单位、意义也不习语化，却是各语域构建语篇的基本建筑块——每个语域有自己的一套常用砖。
      evidence:
        - "Biber & Conrad (1999)「Lexical bundles in conversation and academic prose」, 收入 LGSWE (1999) 第 13 章（定义见 1999: 183，经期刊梳理转引）"
      scope: 词汇束是语料统计产物，不等于心理上整存整取的单位；教学上应按语域与交际功能挑选，不能把统计表原样变背诵表。
      exceptions:
        - 例：会话里的 do you want me to、学术散文里的 in the case of the（清单原文例）。
    mechanism:
      - beat: 统计判据定义词串
        text_kid: 有些词总是手拉手一串出现，像乐高拼好的一小块——学会整串，说话写字都顺。
        text_adult: LGSWE 第 13 章给出会话与学术散文四至六词词汇束的长表并按结构分类；各语域砖块不同，选材须按目标语域挑（与 CB-04 同链）。
        visual: 语域常用词串清单示意（统计判据标注）
        anchors: [V6_日常_1]
    examples:
      - level: 1
        word_ids: [V6_日常_1]
        form: "go 的会话词串形态（do you want me to 型整串呈现）"
        scene_note: 清单原文会话词汇束例的构成词
        supports: claim
    error_cases:
      - wrong: 把词汇束统计表原样变成背诵表，或断言词串必为心理整存单位
        right: 按语域与交际功能挑选教学；心理现实性另有争议（见 disputes）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 disputes。
    relatives:
      - {id: CB-01, rel: 同族}
      - {id: CB-04, rel: 同族}
    quiz:
      - q: 词汇束的判据是？
        options: [意义习语化, 每百万词≥10 次且分布于≥5 篇文本, 结构完整, 教师推荐]
        answer: 每百万词≥10 次且分布于≥5 篇文本
        hint_on_wrong: 回 claim 的判据
    probes: []
    prereq: [CB-04]
    order: 5
    pain_points: []
    adult:
      sources:
        - "Biber & Conrad (1999), in LGSWE 第 13 章；概念源流梳理 https://www.sciencedirect.com/science/article/abs/pii/S0889490610000256"
      boundary: 统计产物不等于心理单位；教学须按语域功能挑选。
      disputes: 词汇束的心理现实性有争议——加工实验发现学习者阅读词汇束并不比普通词串更快（JTELS 实验，三组伊朗学习者三项实验均无整存优势），「频繁共现」与「整块存储」不能划等号。
      evidence_grade: 定义经转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-05}

  - id: CB-06
    zone: 支撑层
    group: CB
    subgroup: "Biber:只有各语域的英语"
    audience: 教师/设计层
    headline: 「投入互动」对「信息密度」：一条轴看懂口语与书面语（Dimension 1）
    headline_kid: 说话像聊天，越聊越热闹；写文章像打包，越包越紧实——两种样子在一条尺子的两头。
    claim:
      type: tendency
      statement: 多维分析（因子分析）显示语法特征成团共现：第一、第二人称代词、缩略式、现在时动词、问句总是一起多（会话端），名词、介词、定语形容词、长词总是一起多（学术散文端）；两团互补，构成「投入式 vs 信息型产出」维度——语域差异背后是交际功能在驱动形式共选。
      evidence:
        - "Biber (1988), Variation across Speech and Writing, CUP（多维分析框架，基于 LOB 与 London-Lund 语料）"
      scope: 维度是连续量，单个文本落在轴上某一点；不能用二分法套具体作品。
      exceptions:
        - 小说对话、演讲稿等文本居中（清单原文例）。
    mechanism:
      - beat: Dimension 1
        text_kid: 说话像聊天，越聊越热闹；写文章像打包，越包越紧实。
        text_adult: 会话在 Dimension 1 得分各语域最高、正式文件与学术散文最低，两端特征团呈统计互补；本条是 CB-04 互补分布的量化骨架。
        visual: Dimension 1 轴线与语域落点图
        anchors: []
    examples:
      - level: 1
        word_ids: [G3_0622]
        form: "talk（会话端）：代词、缩略、问句成团"
        scene_note: 清单原文的特征团
        supports: claim
    error_cases:
      - wrong: 用「口语=互动、书面=信息」二分具体作品
        right: 文本落在连续维度上定点，二分只描述两端倾向
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 exceptions。
    relatives:
      - {id: CB-04, rel: 前置}
    quiz:
      - q: Dimension 1 两端特征团呈什么关系？
        options: [随机分布, 统计互补, 完全相同, 只差词长]
        answer: 统计互补
        hint_on_wrong: 回机制小节「Dimension 1」
    probes: []
    prereq: [CB-04]
    order: 6
    pain_points: []
    adult:
      sources:
        - "Douglas Biber (1988), Variation across Speech and Writing, Cambridge University Press；多维分析原文 https://www.mark-davies.org/articles/davies_30.pdf"
      boundary: 连续量，不二分具体作品。
      disputes: 无。
      evidence_grade: 框架原文核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-06}

  - id: CB-07
    zone: 支撑层
    group: CB
    subgroup: "McCarthy & Carter:口语有自己的语法"
    audience: 教师/设计层
    headline: 把话题先端出来、或在句尾再补一句，都不是病句（heads & tails）
    headline_kid: 说话时可以先把要说的东西「端到前面」提醒大家，也可以说完了在后面「补个尾巴」说清楚——这是说话的规矩，不是说错了。
    claim:
      type: tendency
      statement: "会话中说话人常把话题成分前置（head/header）或在句末把代词展开成名词短语（tail）；Carter & McCarthy 在《Cambridge Grammar of English》中定性其为「非正式口语语法的标准特征」（2006: 192），功能是替听者安排信息焦点，服务实时加工。"
      evidence:
        - "Carter & McCarthy (2006), Cambridge Grammar of English, CUP, p. 192（经 HLT 教学文章逐页转引；页码未打开原书，见 pending）"
        - "语料基础：CANCODE 500 万词口语语料（诺丁汉大学官方页核实规模与主持人）"
      scope: heads/tails 属非正式口语语域；正式写作与考试作文中不用。
      exceptions:
        - 例：That friend of yours, did you see her again?（head）；It's a great place to visit, Barcelona.（tail）——清单原文例。
        - 不能据此推翻书面语的语序规范——是换语域换规则，不是规则不存在。
    mechanism:
      - beat: 话题安排装置
        text_kid: 说话时可以先把要说的东西「端到前面」提醒大家，也可以说完了在后面「补个尾巴」说清楚。
        text_adult: 先给话题、或事后澄清所指，都是为听者的实时加工服务的信息安排（与「已知性」机制相通：已知信息先行/补明）。
        visual: head 前置与 tail 后补的句式图
        anchors: [G3_130, G4_K02]
    examples:
      - level: 1
        word_ids: [G3_130, V6_日常_17, G3_K24]
        sentence: "That friend of yours, did you see her again?"
        scene_note: 清单原文 head 例（句中专名类词外，其余实词均在库）
        supports: claim
      - level: 2
        word_ids: [G4_K02, G6_270]
        sentence: "It's a great place to visit, Barcelona."
        scene_note: 清单原文 tail 例（Barcelona 为专名，按 DESIGN Q5 豁免口径登记）
        supports: claim
    error_cases:
      - wrong: 把 heads/tails 当病句纠正，或在正式写作中套用
        right: 认其为非正式口语的标准特征，换语域换规则
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的定性与 scope。
    relatives:
      - {id: CB-04, rel: 同族}
      - {id: CB-09, rel: 同族}
    quiz:
      - q: heads/tails 的功能是什么？
        options: [凑字数, 替听者安排信息焦点, 显示词汇量, 避免沉默]
        answer: 替听者安排信息焦点
        hint_on_wrong: 回机制小节「话题安排装置」
    probes: []
    prereq: [CB-04]
    order: 7
    pain_points: []
