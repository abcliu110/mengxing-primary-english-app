  - id: YL-08
    zone: 支撑层
    group: YL
    subgroup: 年龄、动机与儿童参与
    audience: 教师/设计层
    headline: 「越小开始越好」在课堂外语环境里不成立：决定成败的是接触的总量、质量与连续性
    headline_kid: 早开始不等于学得好。学得好不好，要看一共听了多少、用了多少、是不是一直没断过——不是看几岁开始。
    claim:
      type: tendency
      statement: 年龄效应必须分语境看：在每周几节课的学校外语环境里，等量教学时数下开始较晚的孩子学得更快（认知成熟与显性学习机制占优）；在自然/沉浸环境里，早开始才与长期最终造诣（尤其语音）相关。早期起步的真实红利在拉长可累积的接触总时长与态度动机的早期建立，前提是供给的质量、数量与学段衔接跟得上。
      evidence:
        - "Nikolov (Ed.) (2009), The Age Factor and Early Language Learning, De Gruyter Mouton（第 1 章总览，目录核实）"
        - "Muñoz (Ed.) (2006) 所载 Barcelona Age Factor 项目：8/11/14/成人四组、200/416/726 教学小时三节点的纵向研究（Atlantis 书评全文核实）"
      scope: 适用范围是学校外语课堂、低至中等课时量；本条纠正的是「起始年龄决定论」，不是「早期教育无用论」。
      exceptions:
        - 不可反向推论为「晚开始更好」——若早期供给充足且连续，早开始组的总接触量优势真实存在。
        - BAF 中唯语音感知一项早开始亦未显示清晰优势（Fullana 章结论「没有明确证据」）。
    mechanism:
      - beat: 语境决定年龄效应
        text_kid: 早开始不等于学得好，要看一共听了多少、用了多少、是不是一直没断过。
        text_adult: BAF 是课堂外语年龄效应规模最大的纵向项目之一：多数测验上晚开始组在等量课时下更快、更有效，形态习得顺序各组相似但速度晚组更快。Nikolov (2009) 匈牙利项目同样把早期项目成败归因于供给条件而非起始年龄本身。
        visual: 等量课时下不同起始年龄组的学习速度对照
        anchors: [G3_0628]
    examples:
      - level: 1
        word_ids: [G3_0628]
        form: "learn 的速度比较须先固定教学时数（BAF 设计）"
        scene_note: 清单原文的研究设计要点
        supports: claim
    error_cases:
      - wrong: 宣称「越小开始越好」作为无条件结论，或反读为「晚开始更好」
        right: 年龄结论必须带语境与供给条件：课堂外语看接触总量、质量与连续性
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 exceptions。
    relatives:
      - {id: YL-05, rel: 前置}
    quiz:
      - q: 在学校外语课堂、等量课时下，BAF 发现哪组学得更快？
        options: [最早开始组, 较晚开始组, 无差别, 成人组最慢]
        answer: 较晚开始组
        hint_on_wrong: 回机制小节「语境决定年龄效应」
    probes: []
    prereq: [YL-05]
    order: 8
    pain_points: []
    adult:
      sources:
        - "Nikolov (Ed.) (2009), De Gruyter Mouton, ISBN 9783110218282；Muñoz (Ed.) (2006), Multilingual Matters（BAF 项目）"
      boundary: 结论限学校外语课堂、低至中等课时量。
      disputes: 与关键期假说传统（Lenneberg 系）在「最终造诣」层面仍有分歧：沉浸语境支持早开始与近母语语音相关，课堂语境（BAF 等）显示该优势在低输入条件下不兑现；分歧的实质是语境而非年龄本身，两造并列登记。
      evidence_grade: 目录+书评全文核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-08}

  - id: YL-09
    zone: 支撑层
    group: YL
    subgroup: 年龄、动机与儿童参与
    audience: 教师/设计层
    headline: 儿童学外语的动机住在课堂里：好玩的活动、亲近的老师、看得见的进步
    headline_kid: 小朋友喜不喜欢学英语，先看三样：活动好不好玩、老师亲不亲、自己有没有觉得「我比以前会了」。
    claim:
      type: tendency
      statement: 儿童的外语动机不能用成人研究中的工具型/融合型量表捕捉：孩子说出的学习理由主要落在学习情境层面——课堂活动是否有趣、材料是否好玩、与教师的关系如何；随年龄增长功利性理由逐渐出现，但课堂相关因素始终居于核心；动机的敌人是「感觉不到进步」。
      evidence:
        - "Nikolov (1999), Language Teaching Research 3(1): 33–56（匈牙利 6–14 岁儿童三组、各追踪 8 年的长程民族志研究，期刊全文核实）"
        - "姊妹研究：Mihaljević Djigunović (1993/1995) Zagreb 项目，336 名 7 岁儿童及三年后追踪（Nikolov 文中综述，同向）"
      scope: 研究语境为匈牙利小学外语课堂，动机结构受当地升学与语言地位影响，外推须注意文化与制度差异。
      exceptions:
        - 「活动有趣」指内在有趣的任务与材料，不等同于用游戏包装一切——被教师称为「游戏」的无聊活动恰恰是孩子点名讨厌的（文中登记的反例）。
    mechanism:
      - beat: 课堂动机三要素
        text_kid: 小朋友喜不喜欢学英语，先看三样：活动好不好玩、老师亲不亲、自己有没有觉得「我比以前会了」。
        text_adult: 该研究以教师兼研究者身份跨 1977–1995 年三轮各 8 年追踪，是儿童外语动机领域罕见的长程数据；设计含义：进步须可见（与 LS-09 的掌握判定衔接——可见的进步须是真进步而非流畅错觉）。
        visual: 活动趣味/教师关系/可见进步三要素图
        anchors: [G2_0489]
    examples:
      - level: 1
        word_ids: [G2_0489]
        form: "play/活动趣味作为儿童动机的课堂层来源"
        scene_note: 清单原文的动机来源分类
        supports: claim
    error_cases:
      - wrong: 用成人工具型/融合型量表测儿童动机，或用游戏包装无聊活动
        right: 儿童动机按课堂层三要素设计与诊断；活动须内在有趣
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 与 exceptions。
    relatives:
      - {id: YL-14, rel: 同族}
      - {id: YL-11, rel: 同族}
    quiz:
      - q: 儿童动机的敌人是什么？
        options: [活动太难, 感觉不到进步, 老师太严, 课时太少]
        answer: 感觉不到进步
        hint_on_wrong: 回机制小节「课堂动机三要素」
    probes: []
    prereq: []
    order: 9
    pain_points: []
    adult:
      sources:
        - "Marianne Nikolov (1999), Language Teaching Research 3(1): 33–56, DOI 10.1177/136216889900300103"
      boundary: 匈牙利语境，外推注意文化与制度差异。
      disputes: 无主流分歧；与成人动机理论（Gardner 系）的分歧在量表适用性——Nikolov 明确批评成人量表题目超出儿童理解范围，属方法论分歧。
      evidence_grade: 期刊全文核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-09}

  - id: YL-10
    zone: 支撑层
    group: YL
    subgroup: 学习载体
    audience: 教师/设计层
    headline: 少儿英语课要有「单元骨架」：以主题组织整段学习，先听说、后读写
    headline_kid: 我们不是一课学一课的散点——围绕一个主题学好几节课，故事、歌、游戏、手工都是同一个主题，学过的话能一直用。
    claim:
      type: tendency
      statement: 少儿英语课以主题单元（thematic units）组织长期与课时规划，让语言目标、内容目标与活动在同一主题下互相支撑（情境化教学）；技能顺序上先立听说、再展读写，故事单列为听说读写的枢纽，评估与管理亦按儿童特点改造。
      evidence:
        - "Shin & Crandall (2014), Teaching Young Learners English: From Theory to Practice, National Geographic Learning, 403 pp., ISBN 9781111771379（全书目录经大学图书馆目录页核实）"
      scope: 主题单元解决的是组织问题，不自动保证每个活动的质量（单活动仍受 YL-01 要求-支持框架检验）；具体课时与评估制度须按本地课标再适配。
      exceptions:
        - 该书活动排序的页级细则（p. 72 规划六步、p. 77 排序六则）本轮仅见二手转述，未采用。
    mechanism:
      - beat: 主题单元骨架
        text_kid: 围绕一个主题学好几节课，学过的话能一直用。
        text_adult: 该书是 UMBC TESOL 培训体系的少儿方向教材，含 TEYL 基本原则与教学一览表，是 Cameron (2001) 之后少儿英语教学体系化的代表性综合教材。
        visual: 主题单元内听说先行、读写随后、故事为枢纽的结构图
        anchors: [G2_0669]
    examples:
      - level: 1
        word_ids: [G2_0669]
        form: "song（歌）与故事、游戏、手工同属一个主题单元"
        scene_note: 清单原文的单元构成
        supports: claim
    error_cases:
      - wrong: 以为用了主题单元就自动保证活动质量
        right: 单活动仍须过 YL-01 的要求-支持检验
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope。
