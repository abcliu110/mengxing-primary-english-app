      boundary: 只取高频小品词核心义网络；隐喻引申越远特征越稀薄。
      disputes: 与清单的关系：清单 P 组处理介词的空间图式、V 组与 CO-12 处理语块谱系，但短语动词的小品词体貌义在清单里没有专条——Lindner (1981) 在 P 组只作出处一笔带过，Bolinger 是这条线的源头与承重墙。另注意分工之争：同一现象 Bolinger 从小品词切入（词有义），Goldberg 一系从构式切入（模具带义），VB-01 的张力在此重现（如实保留）。
