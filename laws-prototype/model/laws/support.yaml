  - id: VB-02
    zone: 支撑层
    group: VB
    subgroup: "Levin:动词意义决定句法行为"
    audience: 教师/设计层
    headline: break 和 cut 不是一回事：一个只说「结果」，一个自带「怎么切」
    headline_kid: break（碎）只说东西变样了、没说怎么弄的，所以「杯子自己碎了」也成立；cut（切）自带一把看不见的刀，必须有人拿刀动手，所以不能说「面包自己切了」。
    claim:
      type: tendency
      statement: Levin 以三组交替把近义动词切开（原书 pp. 5–9)：只有 cut、hit 能进尝试交替（cut at the bread)，因为它们词汇化了「接触＋运动」；只有 break 能进致使/起始交替（The window broke)，因为它只词汇化纯状态改变、完全不说明改变如何发生（p. 9)；cut 则词汇化了工具（利刃）与施事方式，施事缺席则句子崩坏。分类落实为 §21「Verbs of Cutting」与 §45.1「Break Verbs」分属全书两端。
      evidence:
        - "Levin (1993) §1 引言四词对照分析（pp. 5–9）与 §21、§45.1 分类（出版社目录核对；页码与引文经 Goldberg & Jackendoff 一系学术转述逐页核实）"
        - "跨语言佐证：Guerssel, Hale, Laughren, Levin & White Eagle (1985) 四种语言的 CUT/BREAK 对立"
      scope: cut 类内部仍有细差（carve 类更强调成形结果）；后续研究把这条界线处理为「词汇化了哪一端」的强倾向而非绝对禁令。
      exceptions:
        - 某些语言（如 Tidore）切类词在特定条件下也能出现起始用法。
    mechanism:
      - beat: 三组交替切开近义词
        text_kid: break 只说变样了，cut 自带一把看不见的刀，必须有人拿刀动手。
        text_adult: "与本项目呼应（清单原文登记）：这正是动画侧 C1「切类」原语的语言学根据——切类动作在语言里就自带「施事＋工具接触＋分离结果」，动画中「无人持刀、苹果自裂成两半」不仅是物理错误，也是把 cut 演成了 break：动词类选错，画面逻辑必然错。"
        visual: break/cut/hit 在三组交替中的准入对照表
        anchors: [ADD_0025, V6_日常_47, ADD_0149, G3_126, G4_159]
    examples:
      - level: 1
        word_ids: [ADD_0025, G4_159]
        sentence: "The window broke."
        scene_note: 清单原文例：break 可进致使/起始交替
        supports: claim
      - level: 2
        word_ids: [V6_日常_47, G3_126]
        form: "cut at the bread（尝试交替，cut 可进）；*The bread cut（起始交替，cut 不可进）"
        scene_note: 清单原文例（星号句为不合语法登记，非错例冒充）
        supports: claim
    error_cases:
      - wrong: "*The bread cut（把 cut 当 break 用，施事缺席）"
        right: cut 词汇化了工具与施事方式，必须有施事拿刀动手；无施事的结果陈述用 break 类
        error_type: 动词类误选（清单登记的对照）
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的三组交替切分。
    relatives:
      - {id: VB-01, rel: 前置}
      - {id: VB-04, rel: 同族}
    quiz:
      - q: 哪组交替只有 break 能进？
        options: [尝试交替, 致使/起始交替, 与格交替, 喷洒交替]
        answer: 致使/起始交替
        hint_on_wrong: 回机制小节「三组交替切开近义词」
    probes: []
    prereq: [VB-01]
    order: 2
    pain_points: []
    adult:
      sources:
        - "Levin (1993), pp. 5–9, §21, §45.1；转述核实 https://www.researchgate.net/publication/266727725 ；作者 LSA 讲义 http://web.stanford.edu/~bclevin/lsa15intro.pdf"
      boundary: 强倾向而非绝对禁令；cut 类内部有细差。
      disputes: 方式/结果互补说后来被部分研究者以双词汇化候选例挑战（如 climb 的再分析之争），属学界进行中的争论；但 break/cut 的基本对立本身无主流异议（如实保留）。
      evidence_grade: 目录+书评级（招牌分析经逐页转述核实）
      pending:
        - "（2026-11-02 终局登记）同 VB-01 销项口径：成员名单未逐类核对一项封顶登记（carve 已入词库 ADD_0441）"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-02}

  - id: VB-03
    zone: 支撑层
    group: VB
    subgroup: "Levin:动词意义决定句法行为"
    audience: 教师/设计层
    headline: 动词类是词典的组织方式：先归类，再预判，没见过的词也能猜出七八分
    headline_kid: 动词像动物分科：先认出它是「切的一家」还是「碎的一家」，它爱怎么造句、讨厌怎么造句，大半就能猜到。
    claim:
      type: tendency
      statement: Levin 第二部分把 3,000 多个动词组织成 48 个语义大类（约 192 个小类），每类成员共享一组交替行为。分类的用途是预测：新词只要语义归类对，它能进的句型、不能进的句型、宾语能不能省略、能不能被动，大半可由类推得——词典从「一词一条互不相干」变成「一类一组共享语法档案」。
      evidence:
        - "Levin (1993) Part Two（出版社目录逐章核对）；规模经作者讲座幻灯自述核实"
        - "后续生命：VerbNet 以 Levin 类为骨架建成计算词典，并用 Levin 类预测短语动词的能产组合（ACL 文献）"
      scope: 类别边界有模糊带（多义词跨类是常态，Levin 按义项归类而非按词形）；分类以交替行为为据，对不参与多少交替的动词判别力弱；教学中只宜取高频大类，48 类全表是词典学家的工具，不是课表。
      exceptions:
        - 例（清单原文）：高频大类如切、碎、给、放、运动可进教学；全表不进课表。
    mechanism:
      - beat: 类即语法档案
        text_kid: 先认出动词是哪一家，它爱怎么造句，大半就能猜到。
        text_adult: LINGUIST List 1996 年「动词分类」专题问答中多位学者一致推荐此书为该领域的标准参照。本条与 CO-03 直接咬合：双宾准入「哪些动词意思不合」须靠 Levin 类清单才说得出（清单对照节登记的缺口）。
        visual: 48 大类索引与类内共享交替档案示意
        anchors: [V6_日常_8, V6_日常_9, G2_087]
    examples:
      - level: 1
        word_ids: [V6_日常_8, V6_日常_9]
        form: "give（所有权转移类）、put（放置类）：归类即预判句型档案"
        scene_note: 清单原文列举的高频大类成员
        supports: claim
    error_cases:
      - wrong: 把 48 类全表当课表教，或按词形（而非义项）给多义词归类
        right: 教学只取高频大类；多义词按义项归类
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope。
    relatives:
      - {id: VB-01, rel: 前置}
    quiz:
      - q: Levin 分类的首要用途是？
        options: [背诵类名, 预测没见过的词的句型行为, 统计词频, 划分年级]
        answer: 预测没见过的词的句型行为
        hint_on_wrong: 回机制小节「类即语法档案」
    probes: []
    prereq: [VB-01]
    order: 3
    pain_points: []
    adult:
      sources:
        - "Levin (1993) Part Two；VerbNet 继承关系见 ACL Anthology VPC 文献综述"
      boundary: 模糊带与跨类是常态；判别力对少交替动词弱。
      disputes: 分类粒度之争（Gross 一系主张细得多的类别）与「类是真实心理表征还是编纂便利」之争一直存在；Levin 本人立场是把类当作调查的立足点（preliminary)，不宣称心理实在性（如实保留）。
      evidence_grade: 目录+书评级
      pending:
        - "（2026-11-02 终局登记）同 VB-01 销项口径：各类成员名单未逐类核对一项封顶登记"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-03}

  - id: VB-04
    zone: 支撑层
    group: VB
    subgroup: "Levin:动词意义决定句法行为"
    audience: 教师/设计层
    headline: 方式与结果只能选一端写进词里：这是 break/cut 之别的总原理
    headline_kid: 一个动词像一支笔，只能涂满一头：要么把「怎么动」说细（擦、抹、扫），要么把「变成什么样」说死（碎、开、满），两头都说细的词，英语里基本没有。
    claim:
      type: tendency
      statement: "方式/结果互补（manner/result complementarity)：动词词根词汇化的是事件的一个侧面——或是方式（动作如何执行，如 wipe、scrub、run)，或是结果（标量变化的终点，如 break、open、arrive)，二者互补。由此推出一串句法后果：方式动词能带非选定宾语、能省略宾语；结果动词宾语必须受影响并测度事件进程，不能随意省略。此为 Levin (1993) 的后续发展，须与原书分开标。"
      evidence:
        - "Levin & Rappaport Hovav (1995), Unaccusativity；Rappaport Hovav & Levin (2010)「Reflections on manner/result complementarity」；经 Levin 本人 LSA 2015 讲义核实其陈述"
      scope: 互补是强倾向而非无例外定律；对小学教学而言，只取「动词自带一头重点」这一直觉层即可。
      exceptions:
        - 边缘案例如 climb、cut 本身（兼有方式与分离结果）长期被双方引为战例。
    mechanism:
      - beat: 词根只写一端
        text_kid: 一个动词只能涂满一头：要么把「怎么动」说细，要么把「变成什么样」说死。
        text_adult: 这条原理是 VB-02 中 break（结果）与 cut（方式＋工具）对立在全词库尺度上的推广；对 TA-07 的推进（清单对照节登记）：Vendler 四型是短语层情状分类，方式/结果互补给出词根层的分类原理，能解释四型之间的转换为何受限。
        visual: 方式端/结果端二分的词根图式
        anchors: [V6_日常_13, G2_087, ADD_0025, V6_日常_10, V6_交通_56, G4_0800]
    examples:
      - level: 1
        word_ids: [V6_日常_13, G2_087]
        form: "sweep、run：方式动词（能省略宾语：Leslie swept）"
        scene_note: 清单原文例（wipe、scrub 已入词库 ADD_0715/ADD_0634）
        supports: claim
      - level: 2
        word_ids: [ADD_0025, V6_日常_10, V6_交通_56]
        form: "break、open、arrive：结果动词（宾语测度事件进程）"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 把方式/结果互补当作无例外定律套用
        right: 按强倾向使用；climb、cut 等边缘案例单独登记
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 exceptions。
    relatives:
      - {id: VB-02, rel: 前置}
    quiz:
      - q: 方式动词与结果动词在宾语省略上的差别是？
        options: [方式动词能省略宾语，结果动词不能随意省略, 两者都能, 两者都不能, 结果动词能省略]
        answer: 方式动词能省略宾语，结果动词不能随意省略
        hint_on_wrong: 回 claim 的句法后果
    probes: []
    prereq: [VB-02]
    order: 4
    pain_points: []
    adult:
      sources:
        - "Levin & Rappaport Hovav (1995); Rappaport Hovav & Levin (2010)；LSA 2015 讲义 http://web.stanford.edu/~bclevin/lsa15intro.pdf"
      boundary: 后续发展须与 1993 原书分开标；强倾向而非定律。
      disputes: Goldberg (2001, 2005）等对「省略宾语」等预测提出过反例与弱化版本（见讲义自注），互补说的精确形式至今仍在修订中（如实保留）。
      evidence_grade: 作者讲义核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-04}

  - id: VB-05
    zone: 支撑层
    group: VB
    subgroup: "Leech:把动词短语拆成意义成分"
    audience: 教师/设计层
    headline: 完成体不是「做完」，是「过去牵着现在」：Leech 与 Comrie 在这一点上互相印证
    headline_kid: 完成时说的是「以前的事，现在还算数」：I have lost my key 重要的不是「丢」这个动作，是「现在没钥匙」这个后果还立着。
    claim:
      type: tendency
      statement: "Leech 把表达过去的两种手段并置：过去时把事件钉在已关闭的过去时段，完成体表达「past involving the present」（2004: 36）——事件发生在过去，但其效力区间延伸到说话时刻。现在完成体用法可清单化为可判读的几型：持续型（That house has been empty for ages, 2004: 36）、不定型/经历—结果型（The taxi has arrived, 2004: 39）等；真正的教学难点是选择：同一件过去的事，选过去时还是完成体，取决于说话人要不要把它和现在挂钩。"
      evidence:
        - "Leech (1971; 3rd ed. 2004), Meaning and the English Verb, Pearson/Longman, 第 1–3 章（第 3 版目录经 Routledge 出版社页核对；用法分类与页码经筑波大学论文逐处引用与马来 ESL 研究系统转述核实）"
        - "Palmer (1976: 50-1) 独立地称现时相关恰当解决了完成体的选择问题（转引登记）——Leech、Comrie (1976)、Palmer 三家汇合（另见 CG-07）"
      scope: Leech 的分类是教学导向的用法清单，不是单一语义公式。
      exceptions:
        - 「现时相关」被 Salkie 等批评为更像由时间意义推出的自然推理而非基本义本身（TA-05 已登记 Dahl & Hedin、McCoard 之争）——清单化讲法回避不了这个理论争议，只是把它推迟。
    mechanism:
      - beat: 选择问题+用法清单
        text_kid: 完成时说的是「以前的事，现在还算数」。
        text_adult: 与清单 TA-05 的关系是互证而非修正：TA-05 取 Comrie 的统一式定义，本条补上 Leech 的「选择问题＋用法清单」操作面（清单对照节登记 TA-05 目前未采清单化，是已知的对冲缺口）；TA-12 的语法化来历是 Leech 框架不处理的历史层，二者互补。
        visual: 过去时（已关闭时段）vs 完成体（效力延伸到现在）的时间图
        anchors: [G4_0740, V6_MORPH_58, G3_0972, V6_家庭_35]
    examples:
      - level: 1
        word_ids: [G4_0740, V6_MORPH_58]
        sentence: "I have lost my key."
        scene_note: 清单原文招牌例：重要的不是「丢」，是「现在没钥匙」
        supports: claim
      - level: 2
        word_ids: [G3_0972]
        form: "The taxi has arrived（不定型/经历—结果型，Leech 2004: 39 例；arrived 经 verb_form_of 归一至 arrive）"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 把完成体教成「动作做完了」
        right: 判据是过去牵着现在（现时相关），教学按选择问题+用法清单展开
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim；与 CG-07 薄冰判据同向。
    relatives:
      - {id: CG-07, rel: 对照}
    quiz:
      - q: 选过去时还是完成体，取决于什么？
        options: [动作是否做完, 说话人要不要把过去的事和现在挂钩, 动词长短, 时间远近]
        answer: 说话人要不要把过去的事和现在挂钩
        hint_on_wrong: 回机制小节「选择问题+用法清单」
    probes: []
    prereq: []
    order: 5
    pain_points: []
    adult:
      sources:
        - "Geoffrey Leech (1971/1987/2004), Meaning and the English Verb, Pearson/Longman, 152 pp.；Routledge 出版社页 https://www.routledge.com/Meaning-and-the-English-Verb/Leech/p/book/9780582784574；筑波大学论文转引 https://tsukuba.repo.nii.ac.jp/record/2006888/files/TES_39-153.pdf"
      boundary: 用法清单是描写/教学工具，不声称统一式争议已解。
      disputes: 与 TA-05 的分歧只在统一式是否成立这一理论层，TA-05 已有登记，两边不冲突（如实保留）。
      evidence_grade: "目录+书评级（清单接触等级总表）：全书 PDF 在登录墙后，正文未打开，页码经转述核实"
      pending:
        - "（2026-11-02 部分销项＋终局）Leech《Meaning and the English Verb》完成体章的框架已获多篇学术文献带页码引录互证（现时相关与四分法：持续型/不定型，例 “That house has been empty for ages” 引作 Leech 2004: 36、“The taxi has arrived” 引作 2004: 39，与本条登记例一致）——「全书正文未打开」的笼统登记就此细化为「完成体章经带页码学术引录互证」。仅「时间图为其招牌教具」一说仍未在原书页面亲见图例：维持不坐实，终局登记"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-05}

  - id: VB-06
    zone: 支撑层
    group: VB
    subgroup: "Leech:把动词短语拆成意义成分"
    audience: 教师/设计层
    headline: 进行体三件套：持续、有限期、不必做完——外加「临时性消失时」的特殊读法
    headline_kid: 进行时像把镜头推近、只看中间一段：事情在进行（持续），只是眼下这一阵（有限期），而且没说做完没做完（不必完成）。
    claim:
      type: tendency
      statement: "Leech 把进行体的意义拆成可核查的成分（1976: 15, 22 清单，经二手系统转述）：① 持续（duration)；② 有限的持续（limited duration，即临时性）；③ 活动不必抵达完成。精细推论：当「临时性」成分缺席（如配 always/forever/continually)，进行体反而读出反复、夸张的习惯化色彩。"
      evidence:
        - "Leech《Meaning and the English Verb》第 2 章「Progressive Aspect」（成分清单经伊拉克高校 TAM 综述对 Leech (1976: 15, 22) 的转述核实）"
        - "咖啡对照例（Leech 1971: 17) 经 Salkie (1989) JL 论文原文转引核实"
      scope: 成分清单是描写工具，不声称每项都是不可再分的语义原子。
      exceptions:
        - 进行体的礼貌试探用法（I was wondering…）、将来安排用法（I'm leaving tomorrow) Leech 另有处理，不能从三件套直接推出，须与 TA-08（距离义）、TA-13（安排义）合看。
    mechanism:
      - beat: 成分检查单
        text_kid: 进行时像把镜头推近、只看中间一段：持续、只是眼下这一阵、没说做完没做完。
        text_adult: "招牌对照——When we arrived she made some coffee（到达后才做）vs she was making some coffee（到达落在做咖啡中间）——用一个时间关系图钉死简单/进行之别。这套成分拆法解释状态动词为何抗拒进行体（无「过程」可截取，与 TA-07 的 Vendler 情状类型衔接）。与 TA-03 的关系：TA-03 用 Langacker 图象给统一识解，Leech 给可逐项核查的成分表——一幅图 vs 一张检查单，互证而侧重不同（清单原文登记）。"
        visual: 咖啡对照的时间关系图（到达点落在过程内/外）
        anchors: [G4_0945]
    examples:
      - level: 1
        word_ids: [G4_0945]
        form: "she made some coffee vs she was making some coffee（Leech 1971: 17 招牌对照）"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 把进行时教成一句口诀「正在进行」
        right: 按三件套逐项核查（持续/有限期/不必完成），边角用法另与 TA-08/TA-13 合看
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 与 exceptions。
    relatives:
      - {id: VB-05, rel: 同族}
    quiz:
      - q: 进行体三件套不包括哪一项？
        options: [持续, 有限的持续, 不必抵达完成, 必须与现在有关系]
        answer: 必须与现在有关系
        hint_on_wrong: 回 claim 的三成分（现时相关是完成体的判据，见 VB-05）
    probes: []
    prereq: [VB-05]
    order: 6
    pain_points: []
    adult:
      sources:
        - "Leech《Meaning and the English Verb》第 2 章；TAM 综述转引 https://iasj.mohesr.gov.iq/journals/uploads/2024/12/06/6fb48ce39314846e9a8c984b152dac78.pdf；Salkie (1989) 转引"
      boundary: 成分是描写工具，非语义原子；礼貌与安排用法须另行处理。
      disputes: 与 TA-03 的异同：统一图象 vs 成分检查单，二者互证（都反对「进行时＝正在进行」的口诀），但 Leech 的清单能解释「临时性缺席」这类图象说解释不了的边角，这是 TA 组目前没有的（如实保留）。
      evidence_grade: 目录+书评级（成分清单经转述核实）
      pending:
        - "（2026-11-02 终局登记）同 VB-05 销项口径：Leech 正文接触等级封顶为「带页码学术引录互证」级"
    status: 入模中
