  - id: VB-12
    zone: 支撑层
    group: VB
    subgroup: "Lewis:动词语法是说话人此刻的选择"
    audience: 教师/设计层
    headline: 通用原则：一个形式只有一个通义；出现「例外」，错的是规则写窄了
    headline_kid: 一个词形就像一把钥匙，只开一种锁——要是有的门开不了，不是钥匙有「例外」，是大人把锁的样子说错了。will 不是「将来专用钥匙」，它和 can、must 一样，是说话人表态的钥匙。
    claim:
      type: tendency
      statement: "Lewis 第 4 章立「通用原则」（The Principle of General Use)：任一动词形式的全部用法必须能由一个足够宽的底层意义统一解释；教学语法里「先立规则、再打补丁」的目录式讲法（他点名批评 Thomson & Martinet 一类手册）必然让学习者先学一条、再被告知它不算数——规则有例外即证明规则本身错了。应用样例：一般现在时的通义是「说话人把事件看作一个无时间性的整体事实」（the speaker's view of the event as a timeless fact)；与第二形式（过去式）的对立不在时间而在 immediate vs remote。基石判语（p. 47)：「Time is not the same as tense.」"
      evidence:
        - "Lewis (1986), The English Verb, LTP (Hove), 180 pp., ISBN 0-906717-40-X（全书目录经 PUCE 大学图书馆书目完整核对（15 章）；一般现在时章、第二形式章原文经在线全文节选逐段核实；p. 47 引文经书评转引与原文节选双证）"
      scope: 通用原则是方法论戒律而非已被证明的语言学定律；小学阶段只宜用它筛除假规则（如「will ＝将来时」)，不宜向孩子灌输通义本身。
      exceptions:
        - 「一个形式一个通义」在强多义形式（如 get）上会被拉到很抽象的层面，抽象到失去教学价值时 Lewis 本人也会停手。
    mechanism:
      - beat: 通用原则
        text_kid: 一个词形就像一把钥匙，只开一种锁——开不了不是钥匙有例外，是锁的样子说错了。
        text_adult: 该书出版后即成为 DELTA 等高级教师培训的必读书；其「两时制＋遥远义」处理与 CGEL、Leech 的描写结论一致（见 VB-07)，差别在 Lewis 把它做成了教师可直接使用的意义叙述。本条是本项目「废除假规则、形式从说话人视角讲」纲领在动词域的出处。
        visual: 一形一通义 vs 规则+补丁目录的对照图
        anchors: [G3_K02]
    examples:
      - level: 1
        word_ids: [G3_K02]
        form: "Boys will be boys：will 不管将来，是说话人表态（清单原文例；boys 为 boy 的复数形（G1_1000），句以 form 登记）"
        scene_note: 清单原文的假规则筛除例
        supports: claim
    error_cases:
      - wrong: 先立窄规则、再逐条打补丁讲「例外」
        right: 按通用原则重写规则：有例外即规则写窄了，须找到足够宽的通义
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的通用原则。
    relatives:
      - {id: VB-13, rel: 同族}
      - {id: VB-07, rel: 对照}
    quiz:
      - q: 出现「例外」时，通用原则的诊断是？
        options: [学生没学好, 规则本身写窄了, 例外太多应删, 词形不规则]
        answer: 规则本身写窄了
        hint_on_wrong: 回机制小节「通用原则」
    probes: []
    prereq: []
    order: 12
    pain_points: []
    adult:
      sources:
        - "Michael Lewis (1986), The English Verb: An Exploration of Structure and Meaning, LTP；目录 https://catalogobiblioteca.puce.edu.ec/cgi-bin/koha/opac-detail.pl?biblionumber=210971；书评转引 https://closelyobserved.medium.com/the-wisdom-of-michael-lewis-7e4ebaef93be"
      boundary: 方法论戒律而非定律；强多义形式上通义会抽象到失去教学价值。
      disputes: 与清单 TA-01/TA-02 的关系：结论互证、路径不同。TA-02 以形态判据立「只有两个时」，Lewis 以意义判据立同一结论并多走一步：第二形式的通义是 remote，这正是 TA-08（距离义）的通义表述——TA-08 在清单里被处理为过去时的「附加用法」，在 Lewis 这里是主义项。这是本簇对 TA 组最实质的一处重心修正（非事实修正）：距离不是过去时的兼职，是它的本职之一（如实保留）。
      evidence_grade: "章节预览级（清单接触等级总表：本簇最高之一）——一般现在时章、第二形式章、情态组章、条件句章（pp. 148–150 重印）原文节选核实"
      pending:
        - "（2026-11-02 终局登记）未打开章节（be going to 章、被动章等）一项封顶登记：Lewis (1986) 全书目录（15 章）已经 PUCE 大学图书馆书目完整核对、招牌章原文节选已核（见 claim evidence），未打开章节维持「目录＋二手讲义」等级，不再作开放待核挂账（VB-13 同此）"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-12}

  - id: VB-13
    zone: 支撑层
    group: VB
    subgroup: "Lewis:动词语法是说话人此刻的选择"
    audience: 教师/设计层
    headline: 情态词是「说话人此刻的判断」，不是时态的附庸：must 与 have to 的分界在主观/客观
    headline_kid: must 是「我觉得非这样不可」，have to 是「外面的规矩摆在那儿，非这样不可」——一个出自说话人的脑子，一个出自世界。老师上课老说 I must…，学生就以为请假也要 must，其实那是把自己的判断安到了别人头上。
    claim:
      type: tendency
      statement: Lewis：第 5 章「说话人的重要性」与第 13–14 章——动词形式的选择本质上是说话人在说话时刻行使判断；情态助动词是一个封闭组（can, could, may, might, shall, should, will, would, must——含 will/shall，不含 have to/ought to)，其共义是「说话人在说话时刻对非事实状态的判断」；could/would 不是 can/will 的「过去式」，以 remote 义统一之。招牌分析：must 恒含说话人判断（主观必然），(have) to 表客观必然；正因 must 的判断绑定说话时刻，回忆过去的必然只能用 had to——「过去的 must」不存在，是其主观性义的直接推论。
      evidence:
        - "Lewis (1986) 第 5、13、14 章（must/have to 章节原文经在线全文节选核实；情态组清单与遥远义处理经原书条件句章 pp. 148–150（Berry《English Grammar》教材重印）核实；目录同 VB-12）"
      scope: must 的主观性在制度化语境（规章条文中的 must）里被中和，主观/客观是倾向而非铁律；Lewis 的情态组处理是教学语法级别的简化，与 Palmer VB-08 的类型学框架相比牺牲了证据情态等细类——两者是「课堂版」与「地图版」的关系。
      exceptions:
        - 呈现 must 时须换主语、换外部权威例子，否则学生把说话人判断安到别人头上（清单原文的教学推论）。
    mechanism:
      - beat: 说话人判断
        text_kid: must 是「我觉得非这样不可」，have to 是「外面的规矩摆在那儿，非这样不可」。
        text_adult: Lewis 对 must/have to 的主观/客观分界与 Palmer 的动力/义务区分、以及语料研究（Coates）对 must 的说话人取向描写大体同向；TA-10 处理 will 的预言义时应与本条对读，防学习者把 will 误 filing 为时态。
        visual: 主观必然（must）vs 客观必然（have to）的来源对照
        anchors: [G3_K03, V6_日常_5]
    examples:
      - level: 1
        word_ids: [G3_K03]
        form: "must：说话人此刻的判断（主观必然）"
        scene_note: 清单原文招牌分析
        supports: claim
      - level: 2
        word_ids: [V6_日常_5]
        form: "have to：客观必然（have 的构成词入挂接；had to 为其过去形式，归一至 have）"
        scene_note: 清单原文招牌分析
        supports: claim
    error_cases:
      - wrong: 用 must 替他人陈述外部规矩的必然（如替学生请假场景滥用 must），或把 could/would 教成 can/will 的过去式
        right: must 绑定说话人判断；回忆过去的必然用 had to；could/would 按 remote 义统一讲
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的招牌分析。
    relatives:
      - {id: VB-12, rel: 前置}
      - {id: VB-08, rel: 对照}
      - {id: VB-09, rel: 对照}
    quiz:
      - q: 为什么不存在「过去的 must」？
        options: [must 没有过去式词形且其判断绑定说话时刻, 约定俗成, must 只能用于将来, 语法书漏收]
        answer: must 没有过去式词形且其判断绑定说话时刻
        hint_on_wrong: 回 claim 的招牌分析推论
    probes: []
    prereq: [VB-12]
    order: 13
    pain_points: []
    adult:
      sources:
