  # ================= CB 语料库与真实英语（14 条） =================
  - id: CB-01
    zone: 支撑层
    group: CB
    subgroup: "Sinclair:语言是整块选出来的"
    audience: 教师/设计层
    headline: 英语大部分时候不是逐词拼的，是整块选的（idiom principle）
    headline_kid: 说英语像拿现成的积木块搭东西，不是一个字一个字现刻——现成的块用得最多。
    claim:
      type: tendency
      statement: 语言产出有两套原理：open-choice principle 把句子看成一串槽位逐词填入，只受语法约束；idiom principle 指说话人手里有大量半预制短语，整块构成一次选择。语料证据显示 idiom principle 远比传统语法假设的普遍，是默认模式，逐词拼装只是退路。
      evidence:
        - "Sinclair (1991), Corpus, Concordance, Collocation, OUP, p. 110 idiom principle 定义原文（经 AsiaTEFL 论文与乌格德论文两处转引核实页码）"
      scope: 两套原理是同一产出过程的两端、随时切换，不是二选一。
      exceptions:
        - 新造词、专名、术语性表达更靠 open-choice 一端。
    mechanism:
      - beat: 整块选择为默认
        text_kid: 说英语像拿现成的积木块搭东西——现成的块用得最多。
        text_adult: "Sinclair 主持的 COBUILD 大型语料实践的系统检索结论：多数词没有独立意义，而是丰富多词型式库的部件（1991: 108，转引登记）。"
        visual: 整块选取 vs 逐词拼装的产出对照图
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_日常_8]
        form: "give 一类高频动词的半预制短语整块选取（give sb a call 型）"
        scene_note: 清单原文的半预制短语论点（搭配实例与 CO-17 互挂）
        supports: claim
    error_cases:
      - wrong: 默认把句子教学设计成逐词拼装、语法槽位填词
        right: 整块选择是默认模式，词块与型式应整块呈现（见 CB-10）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的默认/退路之分。
