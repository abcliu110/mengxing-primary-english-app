  - id: VB-07
    zone: 支撑层
    group: VB
    subgroup: "Leech:把动词短语拆成意义成分"
    audience: 教师/设计层
    headline: Leech 的章名就是立场：没有「将来时」一章，只有「将来时间的表达」
    headline_kid: 英语动词身上根本没有「将来」这个零件；说将来的事，是拿现在的零件临时拼的：安排表、预言、打算，各拼各的。
    claim:
      type: tendency
      statement: Leech 第 3 版目录八章里，将来对应的不是 "The Future Tense" 而是「The Expression of Future Time」——将来不是动词的一个时（tense)，而是一组表达手段的集合（will 情态义、be going to、现在进行表安排、一般现在表时刻表），每种手段自带情态色彩（预言/意图/安排/既定事实）。同理第 8 章把虚拟、假设处理为语气问题而非「时态倒退」。
      evidence:
        - "Leech (2004) 全书目录（Routledge 出版社页核对，同 VB-05）"
        - "与 Palmer《The English Verb》把 will/shall 单列「The modals WILL and SHALL」一章完全同向（见 VB-08）"
      scope: 章名证据是间接证据——它证明 Leech 的范畴立场，不等于他否认 will 的时间指向用法；教学上「将来表达拼盘」仍需逐个交代各拼件的默认读法（TA-10/TA-11/TA-13 在做）。
      exceptions:
        - 分歧不在结论而在讲法：清单 TA-02 用「没有这个词形」的形态判据，Leech 用「表达手段拼盘」的功能判据，前者干净、后者更贴近使用场景。
    mechanism:
      - beat: 章名即立场
        text_kid: 英语动词身上根本没有「将来」这个零件；说将来的事，是拿现在的零件临时拼的。
        text_adult: 与清单 TA-02（英语形态上只有两个时）互证且更早：Leech 1971 年即如此组织全书，比清单所据的 CGEL 口径更早把这一立场做成了教材结构（清单对照节登记为四方独立汇合之一）。
        visual: 将来表达拼盘（will/be going to/进行表安排/现在表时刻表）清单图
        anchors: [G3_K02]
    examples:
      - level: 1
        word_ids: [G3_K02]
        form: "will 在拼盘中是情态义拼件，不是「将来时」词形"
        scene_note: 清单原文的拼盘构成
        supports: claim
    error_cases:
      - wrong: 把 will 教成「将来时」标志
        right: 将来是一组表达手段的拼盘，各拼件自带情态色彩，逐个交代默认读法
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim；与 TA-02 的形态判据互证。
    relatives:
      - {id: VB-05, rel: 同族}
      - {id: VB-12, rel: 对照}
    quiz:
      - q: Leech 目录中与过去专章对应的将来部分叫什么？
        options: [The Future Tense, The Expression of Future Time, Will and Shall, Future Forms]
        answer: The Expression of Future Time
        hint_on_wrong: 回机制小节「章名即立场」
    probes: []
    prereq: [VB-05]
    order: 7
    pain_points: []
    adult:
      sources:
        - "Leech (2004) 全书目录，Routledge 出版社页（同 VB-05 链接）"
      boundary: 章名是范畴立场的间接证据；各拼件默认读法仍需逐个交代。
      disputes: 与 TA-02 互证且更早；分歧只在讲法（形态判据 vs 功能判据），如实登记。
      evidence_grade: 目录核实级
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-07}

  - id: VB-08
    zone: 支撑层
    group: VB
    subgroup: "Palmer:情态是动词系统的中心"
    audience: 教师/设计层
    headline: 情态先分两大阵营：对「命题真假的表态」和对「事件落地的推动」
    headline_kid: 情态动词说两种事：一种是猜——「他可能在办公室」（我对这句话是真是假的把握）；一种是推——「你必须去」（我让事情发生的劲）。同一个 must 两边都能站，要看它管的是「话」还是「事」。
    claim:
      type: tendency
      statement: "Palmer 的总框架：情态与时、体并列，是动词系统的一大范畴，关乎命题的地位。先分命题情态（propositional modality：说话人对命题事实地位的判断——认识情态 epistemic + 证据情态 evidential, 2001: 8）与事件情态（event modality：指向尚未实现的潜在事件——义务情态 deontic + 动力情态 dynamic, 2001: 8)；英语的诊断：同一情态动词常横跨两阵营，但有形式手段可分辨（认识义 must/may 不能被否定辖域覆盖、后接 have+分词必为认识义、义务义 may 可替换为 can 而认识义替换后意义翻转）。"
      evidence:
        - "Palmer (1986; 2nd ed. 2001), Mood and Modality, CUP, 236 pp., 第 1–4 章（目录经原书书前页影印与 SIL 正式书评双核；定义原文 2001: 8, 10 经 Depraetere & Reed《Handbook of English Linguistics》章节逐字转引核实）"
        - "Palmer《The English Verb》（初版 1974；第 2 版 1987/88, Longman）第 6、7 章结构与 phase（相）处理（Routledge 出版社页核对）"
      scope: 四分（认识/证据/义务/动力）是分析框架而非词表：具体到 can 的每个用法归哪类，学界（CGEL 的处理、Coates 的语料研究）有不同切法；Palmer 本人也承认英语两阵营形式同形是常态，诊断手段是倾向性的。
      exceptions:
        - 例（清单原文）：He may come tomorrow 两读；同一个 must 两边都能站。
    mechanism:
      - beat: 命题/事件二分+形式诊断
        text_kid: 情态动词说两种事：一种是猜，一种是推——要看它管的是「话」还是「事」。
        text_adult: 2001 年版以 122 种语言的材料重写初版，把英语情态放回类型学地图：命题/事件之分、realis/irrealis 对立在无关语言中反复出现，证明这不是为英语量身定做的标签。Palmer 另把完成体称作 phase（相）而非 aspect 的一部分，以示其「与现在关联」的独立地位（与 VB-05 互证）。
        visual: 命题情态/事件情态二分与四子类图 + 形式诊断清单
        anchors: []
    examples:
      - level: 1
        word_ids: [G5_0608, V6_日常_2]
        form: "He may come tomorrow（may 两读：认识义/义务义）"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 只用力图式讲 must，不给学生「先分命题/事件、再看形式诊断」的判断程序
        right: Sweetser 力图式与 Palmer 范畴地图互补并用（见 disputes）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 disputes 的互补缺口登记。
    relatives:
      - {id: VB-09, rel: 同族}
    quiz:
      - q: 后接 have + 分词的 must/may 必为哪一阵营？
        options: [事件情态（义务）, 命题情态（认识）, 两者皆可, 动力情态]
        answer: 命题情态（认识）
        hint_on_wrong: 回 claim 的形式诊断
    probes: []
    prereq: []
    order: 8
    pain_points: []
    adult:
      sources:
        - "F. R. Palmer (1986/2001), Mood and Modality, CUP；SIL 书评 https://www.scribd.com/document/264763295/SILEBR-2004-010；《The English Verb》Routledge 页 https://www.routledge.com/The-English-Verb/Palmer/p/book/9780582297142（注：Palmer《The English Verb》初版为 1974，任务书所记 1965 未见于任何书目记录，应为误记，清单已按 1974 著录）"
      boundary: 分析框架而非词表；诊断手段是倾向性的。
      disputes: 与清单 Sweetser 力动态线（GR 组）的关系：同一现象、两套统一式。Sweetser 用力图式把根情态与认识情态连成一个隐喻家族，解释「为什么同一个词管两边」；Palmer 用功能分类加形式诊断回答「这两边怎么分、在语言里怎么组织」。Sweetser 给认知机制，Palmer 给范畴地图与判据；清单目前只有 Sweetser 一线，缺 Palmer 的地图——是互补缺口，不是互斥分歧。此外两处「主观」含义不同（Palmer 的主观性是范畴的定义性特征，Sweetser 的主观化是历时—认知路径），引用时不可混用（如实保留）。
      evidence_grade: "目录+书评级（清单接触等级总表）：定义经逐字转引核实，正文未通读"
      pending:
        - "（2026-11-02 销项）《Mood and Modality》第 8 章已打开出版社正文页核实（Cambridge 官方章节页）：第 8 章 “Past tense as modal”——8.1 ‘Real’ and ‘unreal’、8.2 Modal-tense（8.2.1 Modal verbs, p. 203；8.2.2 Greek optative, p. 204）、8.3 Real and unreal conditions (p. 207)、8.4 Wishes (p. 216)、8.5 Russian ‘subjunctive’ (p. 217)、8.6 Explanation (p. 218)，目录经原书前置页扫描核对（第 2 版 2001, ISBN 0 521 80035 8 / 0 521 80479 5）。核心论证已亲见：Palmer 以 ‘unreality’ 义把过去时形式用作情态，并自设术语 modal-past / modal-tense 取代含混的 realis/irrealis 旧说；情态动词过去式（might/would）作弱化试探义即 modal-past。本条框架转述与原书一致。《The English Verb》phase 术语完整论证仍未打开，保留为子项登记"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-08}

  - id: VB-09
    zone: 支撑层
    group: VB
    subgroup: "Palmer:情态是动词系统的中心"
    audience: 教师/设计层
    headline: 「过去时也是情态」：形式上的后退一步，同时是时间、真实与礼貌上的后退
    headline_kid: 英语把「往后退一格」当成万能的客气与假设开关：事情退到过去（I went）、退出现实（If I went tomorrow…）、退远关系（I wanted to ask…）——用的是同一个形式动作。
    claim:
      type: tendency
      statement: Palmer 专设第 8 章「Past Tense as Modal」：过去时形式在大量语言中兼表非现实（irrealis)，英语 if I were / I wish I knew、礼貌试探 I wondered if…、转述后退都是同一机制——「过去」范畴的核心义含「与当下现实的距离」，时间距离只是其一。他在《The English Verb》中亦把时与相（phase）分章，使「过去形式」从纯时间标签中解放出来。
      evidence:
        - "Palmer (2001), Mood and Modality, 第 8 章（目录核对，同 VB-08）"
        - "Palmer (1986: 16) 语气定义「the grammaticalization of speakers' (subjective) attitudes and opinions」经阿拉伯语/英语语气对比综述逐字转引核实"
      scope: 「距离」是统一的语义倾向，不是每个过去形式都能自由转用。
      exceptions:
        - 历史现在时（TA-14）恰恰是反向操作（拉近），说明方向由语篇功能决定，形式只提供「可调距离」这一个维度。
    mechanism:
      - beat: 距离即通义
        text_kid: 英语把「往后退一格」当成万能的客气与假设开关，用的是同一个形式动作。
        text_adult: 类型学上「过去＝非现实」的共现极为广泛（第 6、7 章 realis/irrealis 与虚拟式材料），英语只是其中一例；这给「距离」义提供了跨语言而非英语内部的证据等级。
        visual: 时间远/现实远/关系远三用同源图
        anchors: [V6_日常_1, V6_学校_69]
    examples:
      - level: 1
        word_ids: [V6_日常_1]
        form: "If I went tomorrow…：go 的过去形式表非现实，不是表过去"
        scene_note: 清单原文例
        supports: claim
      - level: 2
        word_ids: [V6_学校_69]
        form: "I wanted to ask…：ask 前的过去形式退远关系（礼貌试探）"
        scene_note: 清单原文例（wanted 经 verb_form_of 归一至 want）
        supports: claim
    error_cases:
      - wrong: 把过去形式一律按时间义教，礼貌/假设/转述三用当作互不相干的例外罗列
        right: 三用同属 irrealis/距离范畴，按统一主线讲（与 VB-13 remote 三方汇合）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的类型学论证。
    relatives:
      - {id: VB-13, rel: 对照}
      - {id: VB-08, rel: 前置}
    quiz:
      - q: 「过去」范畴的核心义含什么？
        options: [已完成, 与当下现实的距离, 动作重复, 语气强烈]
        answer: 与当下现实的距离
        hint_on_wrong: 回机制小节「距离即通义」
    probes: []
    prereq: [VB-08]
    order: 9
    pain_points: []
    adult:
      sources:
        - "Palmer (2001), Mood and Modality, 第 8 章；(1986: 16) 定义转引（同 VB-08 链接系）"
      boundary: 统一倾向而非自由转用；方向由语篇功能决定。
      disputes: 与清单 TA-08（过去管距离）强互证，且提供其缺失的上位原理：TA-08 罗列礼貌、假设、转述三用，Palmer 给出类型学论证；与 Lewis VB-13 的 remote 说三方汇合——同一结论由类型学（Palmer)、教学语法（Lewis)、认知语法（Langacker 一系）各自独立得出，是本领域最稳固的共识之一（如实保留）。
      evidence_grade: 目录+书评级（第 8 章论证骨架经出版社章节页核实，2026-11-02）
      pending:
        - "（2026-11-02 销项）同 VB-08：第 8 章内部论证已据 Cambridge 官方章节页核实骨架与术语（modal-past / modal-tense），见 VB-08 销项"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 VB-09}

  - id: VB-10
    zone: 支撑层
    group: VB
    subgroup: "Bolinger:短语动词是可分析的机器"
    audience: 教师/设计层
    headline: 小品词自带两件行李：「穿过某地而动」＋「抵达终点/产生结果」
    headline_kid: up、out、off 这些小词不是装饰：它们走到哪儿都带着「动起来、穿过去」和「到头了、有结果了」两层意思，所以 eat up 是「吃光」，write out 是「写完整」，不是随便搭的。
    claim:
      type: tendency
      statement: "Bolinger 的核心主张（pp. 85–87，经多篇学术文献一致转引）：任一小品词的基本义必含两个特征——motion through location（经由空间的运动）与 terminus or result（终点或结果）。由此推出小品词的体貌功能：给原本无终点的动词装上终点（perfective/resultative, p. 96)，eat 无界、eat up 有界即此。每个小品词都有一张可核查的「语义身份证」（如 on 的基本义是保持在视野内的水平持续，pp. 89, 107)，而不是一串例外的清单。"
      evidence:
        - "Bolinger (1971), The Phrasal Verb in English, Harvard University Press（定义 p. 4；特征说 pp. 85–87；体貌说 pp. 96–97；on 说 pp. 89, 107——均经尼什大学《Facta Universitatis》两篇体貌研究与 VPC 及物性研究带页码转引）"
      scope: 教学中只宜取 up/out/off/away 等高频小品词的核心义网络。
      exceptions:
        - Bolinger 自设例外：并非所有小品词用法都保得住两特征（隐喻引申越远越稀薄）；on 一类持续小品词是「结果」特征的系统性例外，他本人以「持续即其基本义」处理而非硬套。
    mechanism:
      - beat: 两特征说
        text_kid: 小词走到哪儿都带着「动起来、穿过去」和「到头了、有结果了」两层意思。
        text_adult: Brinton (1985）以降的体貌研究普遍以 Bolinger 的「结果/终点」说为讨论起点；ACL 的 VPC 计算研究证实小品词的体貌义可操作化地区分并预测组合。本条是清单 P 组 Lindner（out/up 图式义）的源头论证者——缺了它，「短语动词按图式义＋动词成组教」的建议缺了最初的论证（清单对照节登记）。
        visual: 小品词语义身份证卡（以 up/out/on 为例）
        anchors: [G3_K19, G3_K21, G3_142, V6_日常_15, G3_0487]
    examples:
      - level: 1
        word_ids: [V6_日常_15, G3_K19]
        form: "eat up：up 给无界的 eat 装上终点（吃光）"
        scene_note: 清单原文例
        supports: claim
      - level: 2
        word_ids: [G3_0487, G3_K21]
        form: "write out：out 表「写完整」的结果义"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 把短语动词当作无理可讲的孤立组合逐个死记
        right: 按小品词两特征与语义身份证成组教，例外单独登记
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的两特征说与 VB-11 的能产性立场。
    relatives:
      - {id: VB-11, rel: 同族}
    quiz:
      - q: 小品词基本义的两个特征是？
        options: [方向与速度, 经由空间的运动、终点或结果, 时间与地点, 主动与被动]
        answer: 经由空间的运动、终点或结果
        hint_on_wrong: 回机制小节「两特征说」
