  - id: CB-13
    zone: 支撑层
    group: CB
    subgroup: "Granger:把学习者的话存起来"
    audience: 教师/设计层
    headline: 学习者的毛病大多是「频率错位」，不只是「用错」
    headline_kid: 学英语的小朋友不只是会说错，还会「安全的词说太多、该用的词不敢用」——这也是没学会。
    claim:
      type: tendency
      statement: 学习者产出与母语者的差距有三型：misuse（用错，真实错误）、overuse（多用：某些词与结构显著多于母语者，多为回避难点的「安全牌」）、underuse（少用：母语者常用的表达在学习者那里系统性缺席）。传统错误分析只看得见第一型；后两型是频率分布问题，只有语料对比能照出来，且直接对应教学干预。
      evidence:
        - "鲁汶大学 CECL 官方页明言 CIA 与 CEA 研究揭示 underuse、overuse 与 misuse 三类学习者现象"
        - "应用证据：基于错误标注版 ICLE 开发的学习者词典提示（Macmillan English Dictionary for Advanced Learners 第二版 get-it-right 提示框）由 CECL 完成"
      scope: overuse/underuse 是群体统计结论，落到个体需要再诊断成因（回避、迁移、教学输入偏差都可致之）。
      exceptions:
        - 「与母语者频率一致」不是唯一目标，学习者有自己的交际需求与身份表达。
    mechanism:
      - beat: 频率错位三分
        text_kid: 学英语的小朋友不只是会说错，还会「安全的词说太多、该用的词不敢用」。
        text_adult: 干预分工：少用要补输入，多用要推着走出舒适区，用错按错误分析处理；与 CG-02 戴炜栋四类负迁移（生产不足/过剩/错误/误解）在诊断谱上互补对接。
        visual: misuse/overuse/underuse 三分诊断图
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_日常_0]
        form: "get 一类母语者高频多用词在学习者产出的 underuse 观察"
        scene_note: 清单原文应用证据所涉词典提示框即 get-it-right（get）
        supports: claim
    error_cases:
      - wrong: 只用传统错误分析统计用错，宣称学生「没什么大问题」
        right: 同时查多用与少用两型频率错位（须语料对比）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的三分。
    relatives:
      - {id: CB-12, rel: 前置}
      - {id: CG-02, rel: 对照}
    quiz:
      - q: 哪两型问题只有语料对比能照出来？
        options: [misuse 与 overuse, overuse 与 underuse, 拼写与发音, 语法与词汇]
        answer: overuse 与 underuse
        hint_on_wrong: 回机制小节「频率错位三分」
    probes: []
    prereq: [CB-12]
    order: 13
    pain_points: []
    adult:
      sources:
        - "鲁汶大学 CECL 官方页（同 CB-12 链接）"
      boundary: 群体结论落个体须再诊断成因；频率一致不是唯一目标。
      disputes: 无（三分框架为学习者语料库研究共识；与传统错误分析的关系是扩展而非替代）。
      evidence_grade: 官方页核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-13}

  - id: CB-14
    zone: 支撑层
    group: CB
    subgroup: "English Profile:义项分级"
    audience: 教师/设计层
    headline: 一个词不是一级「会」的，是一个义项一级（EVP）
    headline_kid: 同一个词有好几个意思，先学会最常用的那个意思，其他意思长大一点再学——词是一层一层认识的。
    claim:
      type: tendency
      statement: English Vocabulary Profile 的分级单位不是词条，而是词条的单个义项与短语：同一词的不同义项被实证地标到不同 CEFR 级别（如 bring 的「带来」义为 A2，短语 bring sth to an end 为 C1）。分级依据是 Cambridge Learner Corpus 中全球学习者的实际产出证据——标的是「学习者在这个级别通常已经能产出这个义项」，画出的是词汇习得的真实次序而非编者直觉排序。
      evidence:
        - "English Profile Programme（CUP & Cambridge ESOL）；EVP 研究团队由 Annette Capel 领衔（Capel 2010、2012）；规模：截至 B2 约 4,700 词条、A1–C2 共约 6,970 词条（Capel 2012，转引登记）"
      scope: 级别刻画的是全球通用学习者群体的产出次序，不是中国小学生的专属次序，本地课程须再校准。
      exceptions:
        - 它标的是产出证据，儿童的接受性词汇（听读能懂）通常先于产出，不能拿 EVP 级别卡儿童的输入难度。
        - CEFR 的 A1 本身并非为低龄儿童设计，低龄段引用级别只作参照系。
    mechanism:
      - beat: 义项分级
        text_kid: 同一个词有好几个意思，先学会最常用的那个意思，其他意思长大一点再学。
        text_adult: 与 CB-11 构成「频率定序 + 义项分级」双证据；对词库的含义：多义词的义项呈现次序按 EVP 型证据排，不按词典义项顺序排（与 W2 多义波次衔接）。
        visual: 一词多义项分布在不同级别的阶梯图
        anchors: [V6_日常_7]
    examples:
      - level: 1
        word_ids: [V6_日常_7, ADD_0497]
        form: "bring：「带来」义 A2 vs 短语 bring sth to an end C1"
        scene_note: 清单原文的义项分级例（end 已入词库 ADD_0497，短语整体登记）
        supports: claim
    error_cases:
      - wrong: 按词条整体给词定级，或拿 EVP 级别卡儿童的听读输入难度
        right: 分级单位是义项与短语；级别只标产出次序，输入难度另有接受性口径
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 与 exceptions。
    relatives:
      - {id: CB-11, rel: 同族}
    quiz:
      - q: EVP 的分级单位是什么？
        options: [词条, 单个义项与短语, 词族, 主题]
        answer: 单个义项与短语
        hint_on_wrong: 回机制小节「义项分级」
    probes: []
    prereq: []
    order: 14
    pain_points: []
    adult:
      sources:
        - "English Profile Programme / Annette Capel (2010, 2012)；《English Profile in Practice》节选 http://assets.cambridge.org/97811074/93988/excerpt/9781107493988_excerpt.pdf"
      boundary: 全球学习者产出次序，本地须校准；只标产出、不卡输入；低龄只作参照系。
      disputes: 无（方法与定位在条内如实标注；分歧主要在 CEFR 向各国本地课程移植时的对齐方式，属应用层）。
      evidence_grade: 节选+转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CB-14}

  # ================= CG 中国学者与全球传统（14 条） =================
  - id: CG-01
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 句子手拉手只是表面，「意思接得上」才是真的连成一段（衔接 ≠ 连贯）
    headline_kid: 写一段话，光用 and、then、it 把句子粘住还不够——读的人心里要能顺着一幅画走下去，那才叫连成一段。
    claim:
      type: tendency
      statement: 衔接（cohesion）是语篇的表层特征——照应、替代、省略、词汇复现等看得见的线索；连贯（coherence）是交际的最终效果——读者结合语境与世界知识在心里建起的统一意义。两者不是一回事：有衔接线索而意思断裂（假连贯）与没有显眼线索却意思顺畅（隐连贯）都存在。胡壮麟把衔接手段推广到音系、词汇、句法、语义、社会符号五层——衔接是全语言系统共同干的活，不是几个连接词的事。
      evidence:
        - "胡壮麟（1994）《语篇的衔接与连贯》，上海外语教育出版社（Google Books 书目页+北大学者主页+学术转述三路核实）"
      scope: 这是写作与阅读层面的框架，不是词句对错的判据；小学阶段只取教学含义——先保「意思顺成一幅画」，连接词是后加的钉子。
      exceptions:
        - 不得反过来拿钉子（连接词）冒充画（连贯）。
    mechanism:
      - beat: 表层衔接 vs 深层连贯
        text_kid: 光用连接词把句子粘住还不够——读的人心里要能顺着一幅画走下去。
        text_adult: 该书以汉语与英语语篇的双向考察立论；「表层衔接 vs 深层连贯」的区分与国际语篇研究（de Beaugrande & Dressler、Widdowson）同向，在国内写作教学中是最常被引用的本土框架。
        visual: 五层衔接手段与连贯效果的对应图
        anchors: [V6_学校_43]
    examples:
      - level: 1
        word_ids: [V6_学校_43]
        form: "sentence 层面的连接词粘合 ≠ 语篇连贯"
        scene_note: 清单原文的对照（钉子 vs 画）
        supports: claim
    error_cases:
      - wrong: 教写作时以连接词数量充当连贯标准
        right: 先保意思顺成一幅画，连接词是后加的钉子
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的衔接/连贯之分。
    relatives:
      - {id: CB-09, rel: 对照}
    quiz:
      - q: 连贯指的是什么？
        options: [连接词的数量, 读者心里建起的统一意义, 句子长度, 语法正确率]
        answer: 读者心里建起的统一意义
        hint_on_wrong: 回机制小节「表层衔接 vs 深层连贯」
    probes: []
    prereq: []
    order: 1
    pain_points: []
    adult:
      sources:
        - "胡壮麟（1994），上海外语教育出版社；Google Books 书目页 https://books.google.com/books/about/语篇的衔接与连贯.html?id=AcwYAQAAIAAJ；北大学者主页 http://scholar.pku.edu.cn/zlhu/publications"
      boundary: 写作与阅读框架，不是词句对错判据。
      disputes: 衔接与连贯的边界在学界并未完全定型：张德禄、刘汝山把衔接扩到「语篇与语境之间」（显性/隐性衔接），覆盖面比胡壮麟更宽；也有研究者认为连贯主要是心理建构、不宜与形式手段并列成对。登记为框架层分歧，不影响本条教学用法（如实保留）。
      evidence_grade: 书目+学者主页+学术转述核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-01}

  - id: CG-02
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 母语不是只会「捣乱」：负迁移有四张脸，正迁移一直在帮忙
    headline_kid: 说错英语不全是中文在捣乱——有时候是「不敢说」、有时候是「说太多」、有时候是说错，还有时候是听岔了。中文帮上忙的时候更多，只是你没注意到。
    claim:
      type: tendency
      statement: 迁移的结果不止正/负二分：跨语言异同产生正迁移、负迁移与习得时间差异三种结果；负迁移的表现细分为四类——生产不足（回避，如中国学生回避定语从句）、生产过剩（对已掌握结构过度使用）、生产错误（替代、借用、结构改变）、误解（受母语词序、文化习惯影响而听/读岔）。四种脸对应四种完全不同的纠正办法，诊断先行。
      evidence:
        - "戴炜栋、王栋（2002）《语言迁移研究：问题与思考》，《外国语》2002 年第 6 期，第 1–9 页（书目经引用文献核实，四类划分经转述旁证）"
      scope: 四类是诊断分类，同一错误可兼有回避与替代，不能干净归类是常态。
      exceptions:
        - 不能反推「有负迁移就先把中文戒掉」——正迁移（汉字词序与英语 SVO 同序、量词意识等）是中国学生的真实资产。
    mechanism:
      - beat: 负迁移四脸
        text_kid: 说错英语不全是中文在捣乱——有时候是「不敢说」、有时候是「说太多」、有时候是说错，还有时候是听岔了。
        text_adult: 该文框架承接 Odlin (1989)《Language Transfer》，又针对汉语背景学习者立论；与 Corder/Selinker 错误分析传统互补（那边讲错误来源，这边讲迁移的表现谱），与 CB-13 频率错位三分在诊断谱上对接（生产不足/过剩与 underuse/overuse 对应）。
        visual: 四类负迁移与对应纠正办法的对照表
        anchors: [V6_学校_43]
    examples:
      - level: 1
        word_ids: [V6_学校_43]
        form: "sentence 层面的回避：只说简单句、回避定语从句（生产不足）"
        scene_note: 清单原文登记的中国学生典型表现
        supports: claim
    error_cases:
      - wrong: 把所有错误一律归因为「中文捣乱」并用同一种纠正办法
        right: 先诊断属四脸中的哪一（几）种：回避型给支架鼓励产出，过度型给边界，误解型讲英汉切分差异
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的四分。
    relatives:
      - {id: CB-13, rel: 对照}
      - {id: CB-12, rel: 对照}
    quiz:
      - q: 中国学生回避定语从句属负迁移四类中的哪一类？
        options: [生产过剩, 生产错误, 生产不足, 误解]
        answer: 生产不足
        hint_on_wrong: 回机制小节「负迁移四脸」
    probes: []
    prereq: []
    order: 2
    pain_points: []
    adult:
      sources:
        - "戴炜栋、王栋（2002），《外国语（上海外国语大学学报）》2002(6): 1–9；外研社作者页 https://heep.fltrp.com/book/detail?id=396"
      boundary: 诊断分类而非干净归类；正迁移是真实资产。
      disputes: 迁移在二语习得中的权重本身有争议：对比分析假说的强版本（差异=困难，可预测）已被证伪；当代研究（Jarvis & Pavlenko 2008「跨语言影响」框架）把迁移看作多因素之一。戴、王 (2002) 属温和版——迁移真实存在但受标记性、语言距离感知等因素制约，与本条表述一致（如实保留）。
      evidence_grade: 期刊书目核实（论点经转述旁证）
      pending:
        - "（2026-11-02 终局登记兼勘误）任务书提及的戴炜栋《外语教育学》：经查戴炜栋著作目录并无此书——其著作为《英语交际语法》(1983)、《简明英语语言学教程》(1986)、《新编英语语言学概论》(1999)、《新编简明英语语言学教程》(2002)、《外语教学与教师专业发展：理论与实践》(2006)，无《外语教育学》一题，该书名疑为任务书误记。本条只挂可核查的期刊论文（戴炜栋、王栋 2002）的口径正确、维持并终局"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-02}

  - id: CG-03
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 隐喻靠的是「有点像」：全像就不是隐喻，完全不像也成不了隐喻
    headline_kid: 把时间说成「小偷」，是因为它们有点像（都悄悄拿走东西），不是一模一样——要是一模一样，那就不是比喻，是同一件事了；要是完全不像，这个比喻也立不住。
    claim:
      type: tendency
      statement: "隐喻的意义转换是部分语义特征的转移：始源域与目标域之间必须有相似性，但相似性有程度、且与文化传统和信仰系统有关（束定芳 2000: 103–104）。由此推出两条边界：两事物完全相同则无所谓隐喻，截然没有相似则隐喻不成立。隐喻的定义层面是认知工具，不只是修辞：「隐喻不但是一种语言现象，而且在本质上是人类理解周围世界的一种感知和形成概念的工具」（2000: 30）。"
      evidence:
        - "束定芳（2000）《隐喻学研究》，上海外语教育出版社（原文页码经两篇学术论文转引核实）——国内第一部系统隐喻学专著"
      scope: 本条讲隐喻的成立条件，不是识别所有隐喻的充分算法；儿童教学取其主干——找「像在哪、没借哪」就是合格的隐喻理解。
      exceptions:
        - 有些隐喻的相似性是事后建构的（创造性隐喻先说了、听者再去找像的地方）。
    mechanism:
      - beat: 部分转移
        text_kid: 把时间说成「小偷」，是因为它们有点像，不是一模一样。
        text_adult: 与 Lakoff & Johnson (1980) 认知隐喻观同向而独立成体系；束著特别强调相似性的文化相对性——同是「时间」隐喻，汉语「光阴似箭」与英语 time flies 像的部分不同。「部分转移」解释了为什么隐喻不能字字当真（argument is war 只借「对抗」不借「流血」）。
        visual: 始源域→目标域的部分特征转移示意
        anchors: [V6_节日_0]
    examples:
      - level: 1
        word_ids: [V6_节日_0]
        form: "time flies：time 借「飞」的速度义，不借翅膀"
        scene_note: 清单原文的英汉时间隐喻对照例
        supports: claim
    error_cases:
      - wrong: 把隐喻字字当真地全盘搬运（如由 argument is war 推出争论要流血）
        right: 隐喻只转移部分特征，理解时找「像在哪、没借哪」
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的部分转移。
    relatives:
      - {id: CG-04, rel: 同族}
    quiz:
      - q: 隐喻成立对相似性的要求是？
        options: [完全相同, 完全不同, 有程度的部分相似, 与文化无关]
        answer: 有程度的部分相似
        hint_on_wrong: 回机制小节「部分转移」
    probes: []
    prereq: []
    order: 3
    pain_points: []
    adult:
      sources:
        - "束定芳（2000）《隐喻学研究》，上海外语教育出版社；转引核实 https://so01.tci-thaijo.org/index.php/CSJ/article/download/109585/86129/279354（pp. 103–104）、定义句转引（p. 30）"
      boundary: 成立条件而非识别算法；创造性隐喻的相似性可事后建构。
      disputes: 相似性究竟是隐喻的前提还是产物，学界有争论：互动论（Black）与概念整合理论（Fauconnier & Turner）认为相似性常在理解过程中被创造出来，而非预先存在。束定芳表述偏重「相似性为基础」，教学使用时应同时告诉学生：有的像，是诗人说完你才发现的（如实保留）。
      evidence_grade: 学术转引核实（页码可核）
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-03}

  - id: CG-04
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 隐喻是「跨界借」，转喻是「在本家里指代」：一个靠像，一个靠挨着
    headline_kid: 「白宫发话了」不是把白宫比作人——白宫和总统本来就挨着（在一个圈子里），拿房子代指里面的人，这叫转喻；把「时间」说成「小偷」，是跨到另一个圈子去借东西，那才是隐喻。
    claim:
      type: tendency
      statement: "隐喻涉及两个不同认知领域，基于相似性，理解过程是源域特点向目标域的映射；转喻涉及同一认知领域内的事物，基于邻近/关联关系，理解过程是据喻体特点确定所指对象（束定芳 2000: 267 一带）。判别口诀：先问「这两个东西是一个圈子的吗」——同圈指代是转喻，跨圈借像是隐喻。"
      evidence:
        - "束定芳（2000）《隐喻学研究》，上海外语教育出版社（划界经学术转述引 2000: 267 核实）；束定芳主编（2011）《隐喻与转喻研究》为延伸锚"
      scope: 小学阶段只要求能判主导机制，不追求分类学洁癖。
      exceptions:
        - 隐喻与转喻在真实语料中常交织（metaphtonymy，Goossens 的术语），不是每例都能干净二分。
    mechanism:
      - beat: 同圈/跨圈判别
        text_kid: 先问「这两个东西是一个圈子的吗」——同圈指代是转喻，跨圈借像是隐喻。
        text_adult: 这一划界与国际认知语言学共识（Lakoff & Johnson 对转喻的界定、Radden & Kövecses 的转喻类型学）基本同构，束著是中国课堂最早的系统中文表述；直接服务阅读理解（pen/sword 按转喻解立刻通）。
        visual: 同圈指代 vs 跨圈映射的双图
        anchors: [G1_003, ADD_0290, G1_035, V6_家庭_35]
    examples:
      - level: 1
        word_ids: [G1_003, ADD_0290, ADD_0572]
        sentence: "The pen is mightier than the sword."
        scene_note: 清单原文例：pen→写作/舆论、sword→武力，均转喻（句中 mightier 为 mighty（ADD_0572）的比较级词形）
        supports: claim
      - level: 2
        word_ids: [G1_035, V6_家庭_35, ADD_0472]
        form: "the White House said…：白宫（房子）代指里面的人"
        scene_note: 清单原文转喻例（crown 已入词库 ADD_0472）
        supports: claim
    error_cases:
      - wrong: 把 The pen is mightier than the sword 按隐喻硬解而卡住
        right: 按转喻解：笔→写作/舆论，剑→武力，同圈指代
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的判别口诀。
    relatives:
      - {id: CG-03, rel: 前置}
    quiz:
      - q: all hands on deck 中 hands 的机制是？
        options: [隐喻, 转喻（手→水手，同圈指代）, 夸张, 拟人]
        answer: 转喻（手→水手，同圈指代）
        hint_on_wrong: 回机制小节「同圈/跨圈判别」
    probes: []
    prereq: [CG-03]
    order: 4
    pain_points: []
    adult:
      sources:
        - "束定芳（2000）《隐喻学研究》，上海外语教育出版社，p. 267 一带（转述核实 https://pdf.hanspub.org/ml20210200000_50008584.pdf）"
      boundary: 真实语料常交织，只判主导机制。
      disputes: 转喻是否也应视为一种「映射」而非「指代」，学界有不同处理（Barcelona 等主张转喻也是域内映射）；分类的粗细（是否单列提喻 synecdoche）各家不一。本条取束定芳与 Radden & Kövecses 的主流划界（如实保留）。
      evidence_grade: 学术转述核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-04}

  - id: CG-05
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 先懂空间，才懂时间：时间词是借空间词盖的房子
    headline_kid: 我们说时间的时候，其实一直在借表示地方和方向的词。因为眼睛看得见「远近高低」，看不见「过去未来」，大脑就先拿看得见的去搭看不见的。
    claim:
      type: tendency
      statement: 空间隐喻以空间概念为始源域构建非空间目标域；人有感知空间的器官与神经、却没有感知时间的器官，对空间关系的感知和概念化先于时间，个人成长中也是先习得空间概念、后习得时间概念。教学推论：教时间介词/时间表达时先把空间图式画出来，时间义是搭在空间图式上的第二层。
      evidence:
        - "蓝纯（2003）《从认知角度看汉语和英语的空间隐喻》，外语教学与研究出版社（英文本）；先行论文《外语教学与研究》1999(4): 7–15；蓝纯（2005）《认知语言学与隐喻研究》（定义经《心理科学进展》述评转引）"
      scope: 次序说的是概念依赖，不是每条时间表达都必须先教空间义才许教（如 yesterday 等高频时间词可整体习得）。
      exceptions:
        - 空间图式本身有文化差异（汉语有纵向时间：上/下周——英语无对应），迁移时须标出分界。
    mechanism:
      - beat: 空间先于时间
        text_kid: 大脑先拿看得见的「远近高低」去搭看不见的「过去未来」。
        text_adult: 与清单 P-17（空间→时间→抽象的学习路径）同源互证：那边是 Tyler & Evans 的英语内部证据，这边是英汉双语的本土证据，且给出无时间感知器官的生理—发展理由。汉语本身即是活教材（上周/下周、前天/后天），儿童母语经验可直接正迁移（与 CG-02 对接）。
        visual: 空间图式为底层、时间义为第二层的搭建图
        anchors: [V6_自然_3, V6_节日_0, V6_节日_3]
    examples:
      - level: 1
        word_ids: [V6_节日_3]
        form: "week 的纵向编码：上周/下周（汉语借纵向空间，英语无对应）"
        scene_note: 清单原文的英汉分界例
        supports: claim
    error_cases:
      - wrong: 把时间表达当作全新词表另起炉灶背诵
        right: 先画空间图式（前后、长短、远近），时间义搭在第二层
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的教学推论。
    relatives:
      - {id: CG-06, rel: 同族}
      - {id: CG-02, rel: 对照}
    quiz:
      - q: 先习得空间概念的理由是？
        options: [课本安排, 人有空间感知器官而无时间感知器官, 空间词更短, 考试要求]
        answer: 人有空间感知器官而无时间感知器官
        hint_on_wrong: 回机制小节「空间先于时间」
    probes: []
    prereq: [CG-03]
    order: 5
    pain_points: []
    adult:
      sources:
        - "蓝纯（2003），外语教学与研究出版社；蓝纯（1999）《外语教学与研究》1999(4): 7–15；蓝纯（2005）《认知语言学与隐喻研究》；《心理科学进展》时间隐喻述评转引"
      boundary: 概念依赖而非逐词教学次序；纵向时间是英汉分界。
      disputes: 时间是否全部借自空间，学界有保留意见（Evans 2004 主张时间有独立结构——清单已登记，与本簇并存）：主流共识是「空间是时间概念化的主要而非唯一来源」。教学取主要来源即可，分歧如实并存（如实保留）。
      evidence_grade: 学术转述+述评核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-05}

  - id: CG-06
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 上/下、UP/DOWN 搭出的世界大同小异：状态第一，次序英汉不同
    headline_kid: 汉语说「情绪高涨、士气低落」，英语说 high spirits、feel down——把「高低」借去说心情，全世界都这么干。但借去说别的东西时，汉语和英语排的队不一样，不能一一对号入座。
    claim:
      type: tendency
      statement: 蓝纯对英汉「上/下」与 UP/DOWN 的语料对比给出映射优先序：四词映射到状态、质量（数量）、时间、社会等级四个目标域时，状态域在英汉中都排第一（样本：750 例「上」、434 例「下」、529 例 UP、431 例 DOWN 的统计转述）；其余三域的次序英汉不同。
      evidence:
        - "蓝纯（2003）《从认知角度看汉语和英语的空间隐喻》，第 128–164 页一带（样本量与优先序经英汉方位隐喻对比综述转引核实）"
      scope: 优先序是语料频率的统计倾向，不是语法规则；且语料年代与文体构成会影响次序，不宜把具体名次当铁律背诵。
      exceptions:
        - 个例可违反整齐对应（如 increase in softness 有 up 而无对应 down 式表达）；禁止把「上 = X」的对照表整表平移。
    mechanism:
      - beat: 状态域优先
        text_kid: 把「高低」借去说心情，全世界都这么干；借去说别的东西时，汉语和英语排的队不一样。
        text_adult: 这是国内方位隐喻研究中最早的量化对比之一，后续 COCA/CCL 语料研究大体复现「状态域优先」格局；教学先攻状态域（最普遍、最同构：UP IS GOOD），再按目标域逐个对比英汉排位。补上了清单介词簇缺失的汉语一侧数据。
        visual: 四目标域在英汉中的优先序对照表
        anchors: [G4_0601, V6_颜色_27, G6_282, G6_283]
    examples:
      - level: 1
        word_ids: [G4_0601, G6_282, ADD_0783]
        form: "high spirits：high（高）借去说状态"
        scene_note: 清单原文例（spirits 为 spirit 的复数形，spirit 已入词库 ADD_0783，短语整体登记）
        supports: claim
      - level: 2
        word_ids: [V6_颜色_27, G6_283]
        form: "feel down：down（低）借去说状态（sad 向）"
        scene_note: 清单原文例
        supports: claim
    error_cases:
      - wrong: 把「上/下 ↔ UP/DOWN」对照表整表平移教学
        right: 先攻状态域，再按目标域逐个对比英汉排位，个例登记例外
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions 与 scope。
    relatives:
      - {id: CG-05, rel: 前置}
    quiz:
      - q: 上/下与 UP/DOWN 映射中英汉共同排第一的目标域是？
        options: [时间, 社会等级, 状态, 质量]
        answer: 状态
        hint_on_wrong: 回机制小节「状态域优先」
    probes: []
    prereq: [CG-05]
    order: 6
    pain_points: []
    adult:
      sources:
        - "蓝纯（2003），外语教学与研究出版社，pp. 128–164 一带；综述转引 https://www.hanspub.org/journal/paperinformation?paperid=108814"
      boundary: 统计倾向而非规则；语料构成影响次序。
      disputes: 对不对称现象的解释有竞争：蓝纯一系归因于文化—认知因素（价值观矛盾时高位价值观胜出等）；也有研究者从构式频率与搭配惯性解释。解释层未定，数据层（状态优先）相对稳固（如实保留）。
      evidence_grade: 综述转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-06}

  - id: CG-07
    zone: 支撑层
    group: CG
    subgroup: 中国学者线
    audience: 教师/设计层
    headline: 现在完成时的判据是「与现在有关系」，不是「做完了没有」
    headline_kid: have done 不是在说「事情做完了」，是在说「以前发生的事，现在还算数」——丢了钥匙（现在没钥匙用）、去过北京（现在有这份经历）。只讲过去那一刻、不管现在，就用过去时。
    claim:
      type: tendency
      statement: 现在完成时表示动作发生在过去、但与现在情况有关系（用一个发生在过去的动作来说明现在的情况）；与一般过去时的分界不在时间远近，而在是否表示和现在的关系（薄冰《英语语法手册》定版讲法）。用法面再分：已完成/刚完成、经验或结果、延续到现在（since/for）。
      evidence:
        - "薄冰《英语语法手册》（商务印书馆，第五版修订本）现在完成时章（定义与过去时区别原文经文本核实）；《高级英语语法》为进阶版"
        - "与 Comrie 的完成体定义（现时相关性）、CGEL 现时相关诸用法在结构上一一对应（清单互证登记；另见 VB-05）"
      scope: 薄冰框架仍属传统「时态」讲法，没有区分时（tense）与体（aspect）的现代框架，也未处理现在完成时的语篇功能；小学阶段取其判据句足够，体系升级靠 TA 簇补足。
      exceptions:
        - CLEC 语料中中国学生完成时误用多为「与过去时间状语连用」，正是判据没立住（只记「做完」）的直接后果——本条的事故型证据。
    mechanism:
      - beat: 现时相关判据
        text_kid: have done 是在说「以前发生的事，现在还算数」。
        text_adult: 「现时相关」不是新发明，而是国内主流语法书数十年的定版，只是大量课堂口诀把它压扁成了「过去做完」；中外定版在此点上罕见地完全一致。
        visual: 过去事件→现在后果的牵连图 vs 只讲过去一刻的对照
        anchors: [G4_0740]
    examples:
      - level: 1
        word_ids: [G4_0740]
        form: "I have lost my key：重要的不是「丢」，是「现在没钥匙」（与 VB-05 同一招牌例）"
        scene_note: 清单原文例（lost 不作独立词条引用，仅 key 入挂接）
        supports: claim
    error_cases:
      - wrong: 完成时与过去时间状语连用（只记「做完」判据的典型误用，CLEC 语料登记）
        right: 判据是与现在有无关系：只讲过去那一刻、不管现在，就用过去时
        error_type: 学习者真实错型
        source_type: 教学文献登记错型（CLEC 语料，条内登记）
        diagnosis: 回指 exceptions——判据没立住的直接后果。
    relatives:
      - {id: VB-05, rel: 对照}
    quiz:
      - q: 现在完成时与一般过去时的分界是？
        options: [时间远近, 是否与现在有关系, 动词长短, 有无时间状语词]
        answer: 是否与现在有关系
        hint_on_wrong: 回机制小节「现时相关判据」
    probes: []
    prereq: []
    order: 7
    pain_points: []
    adult:
      sources:
        - "薄冰《英语语法手册（第五版修订）》，商务印书馆（文本核实 https://www.scribd.com/document/713213363/）；《薄冰高级英语语法》书目页 https://www.cp.com.cn/book/60294e5f-d.html"
      boundary: 传统时态框架，未分时与体，未处理语篇功能；体系升级靠 TA 簇。
      disputes: 完成时的统一定义在学界未完全收敛（现时相关说 vs 过去事件+现在状态双层说等）；英式/美式在 just/already/yet 与过去时的选择上有真实差异（美式更常用过去时），薄冰讲法偏英式规范，教学时应注明（如实保留）。
      evidence_grade: 原书文本核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-07}

  - id: CG-08
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 孩子学说话，是先学会「用话办事」：七种活儿排在语法前头
    headline_kid: 小宝宝还不会说句子，就已经会用声音办七种事：要东西、指挥大人、交朋友、表达自己、问为什么、编故事、告诉别人事情。学英语也一样——先有想办的事，才有想学的话。
    claim:
      type: tendency
      statement: 儿童在掌握成人语法之前，先后发展出七种微功能：工具型（要东西）、调节型（指挥行为）、互动型（维系关系）、个人型（表达自我）、启发型（探索求知）、想象型（假装与创造）、信息型（传递事实——最后才成熟）。成人眼中语言的「主业」传信息，在孩子那里压轴出场；这支撑小学英语的组织原则：单元按「孩子要用英语办的事」排，而不是按语法点排。
      evidence:
        - "Halliday (1975), Learning How to Mean, Edward Arnold（对自己孩子 Nigel 的纵向观察；七功能经 EBSCO 研究入门与儿童语言研究条目核实）"
      scope: 七功能源于个案纵向观察（以 Nigel 为主），功能清单与次序带个案烙印；它是发展视角的组织框架，不是课时表。
      exceptions:
        - 不能推成「一年级只教工具型」这类机械排课。
    mechanism:
      - beat: 功能先行
        text_kid: 先有想办的事，才有想学的话。
        text_adult: 该框架是后续功能教学法（意念-功能大纲 CG-11、交际教学法）与儿童二语研究的共同源头；发展次序在后来的儿童语用研究（Dore 的言语行为分类等）中被反复印证大方向。Halliday 是把系统功能语言学带入中国的桥梁人物（与 CG-01 胡壮麟首尾呼应）。
        visual: 七功能按成熟次序的排列图（信息型压轴）
        anchors: [V6_学校_69]
    examples:
      - level: 1
        word_ids: [V6_学校_69]
        form: "ask「问为什么」属启发型功能，先于信息型成熟"
        scene_note: 清单原文的七功能例示
        supports: claim
    error_cases:
      - wrong: 按语法点排单元，或把七功能推成机械课时表
        right: 单元按「孩子要用英语办的事」组织；七功能只作发展视角框架
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 与 scope。
    relatives:
      - {id: CG-11, rel: 同族}
      - {id: CG-01, rel: 对照}
    quiz:
      - q: 七种微功能中最后才成熟的是？
        options: [工具型, 互动型, 信息型, 想象型]
        answer: 信息型
        hint_on_wrong: 回 claim 的七功能次序
    probes: []
    prereq: []
    order: 8
    pain_points: []
    adult:
      sources:
        - "M. A. K. Halliday (1975), Learning How to Mean: Explorations in the Development of Language, Edward Arnold；EBSCO 研究入门 https://www.ebsco.com/research-starters/education/michael-halliday-linguist"
      boundary: 个案纵向观察，清单与次序带个案烙印；不是课时表。
      disputes: 功能分类的切法各家不同（Dore 以言语行为重切、Halliday 后期把七功能收编进三大元功能）；「功能先于形式」的强版本受到用法基础理论（Tomasello：形式-功能同时在构式中习得）的修正。本条取其稳固部分（如实保留）。
      evidence_grade: 二手研究入门核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-08}

  - id: CG-09
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 用英语上别的课，要四样一起转：内容、交流、动脑、文化（CLIL 的 4Cs）
    headline_kid: 用英语上科学课、美术课，不是「多背点单词」那么简单：一节好课要同时管四样——学到的东西、用英语说出来、脑子动起来、还顺便看看别的国家怎么想。缺一样，课就瘸一条腿。
    claim:
      type: tendency
      statement: CLIL（内容与语言融合学习，Marsh 等人 1994 年命名）由 Coyle、Hood & Marsh (2010) 定版为 4Cs 框架：Content（学科知识与技能推进）、Communication（语言既是学的内容也是学的工具：language of/for/through learning 三分）、Cognition（思维台阶须与语言台阶匹配）、Culture（通过另一门语言看世界的多元视角）。四者是共生而非相加；配套 CLIL Matrix 要求任务同时标定语言难度与认知难度。
      evidence:
        - "Coyle, Hood & Marsh (2010), CLIL: Content and Language Integrated Learning, CUP（4Cs 定版于 p. 41 一带；四项经 Bell Foundation 逐项转述与 CLIL 综述核实）"
      scope: CLIL 成效证据高度依赖实施条件（教师双语能力、课时占比、选拔性入学造成的样本偏差）；欧洲证据多来自中学与自愿项目，小学低段的直接证据薄弱。本条按「设计框架」而非「成效定论」收录。
      exceptions:
        - 「文化」维度在单语单文化课堂中最易流于表面节庆（food-flags-festivals），框架作者本人亦警告过。
    mechanism:
      - beat: 4Cs 共生
        text_kid: 一节好课要同时管四样，缺一样，课就瘸一条腿。
        text_adult: 抽掉 Cognition 只剩词汇操练，抽掉 Communication 只剩默读课文，抽掉 Content 就退回普通语言课。对 App 的直接价值：学科英语模块的设计检查表——每个模块过一遍 4Cs，缺哪补哪。
        visual: 4Cs 四维共生图 + CLIL Matrix 双难度标定
        anchors: [G3_0622]
    examples:
      - level: 1
        word_ids: [G3_0622]
        form: "talk 所属的 Communication 维：语言既是内容也是工具"
        scene_note: 清单原文的 4Cs 分工
        supports: claim
    error_cases:
      - wrong: 把 CLIL 成效当定论宣传，或文化维度只做节庆表面文章
        right: 4Cs 只作设计检查表；成效须带实施条件与样本偏差说明
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 exceptions。
    relatives:
      - {id: CG-12, rel: 对照}
    quiz:
      - q: 抽掉 Communication 的 CLIL 课会退化成什么？
        options: [词汇操练, 只剩默读课文, 普通语言课, 体育课]
        answer: 只剩默读课文
        hint_on_wrong: 回机制小节「4Cs 共生」
    probes: []
    prereq: []
    order: 9
    pain_points: []
    adult:
      sources:
        - "Do Coyle, Philip Hood & David Marsh (2010), CLIL, Cambridge University Press；Bell Foundation 转述 https://www.bell-foundation.org.uk/news/blog-integrating-content-and-language-in-multilingual-schools/"
      boundary: 成效依赖实施条件；小学低段直接证据薄弱；按设计框架收录。
      disputes: CLIL 研究内部有实质批评：Bruton 等人指出不少成效研究存在选择偏差（参加者本就是高动机、高社经家庭），语言收益可能被高估；也有学者质疑弱化语言教学系统性会损害语法准确性（与沉浸式结论 CG-12 同向）（如实保留）。
      evidence_grade: 转述核实（p. 41 一带）
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-09}

  - id: CG-10
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 先说清「能用英语做成什么事」，再倒推教什么（CEFR 的行动导向与 can-do）
    headline_kid: 学英语的目标不是「学完第三单元」，而是「能自己去问路、能给外国小朋友介绍我的学校」。把目标写成一句「我能……」，学什么、学到哪儿，一下子就清楚了。
    claim:
      type: tendency
      statement: CEFR 的核心机制是行动导向：学习者是「社会行为者」，语言教育按「在真实情境中完成任务」组织；水平不按语法覆盖量定义，而按 can-do 描述语定义（六级 A1–C2，2020 年补 Pre-A1）。方法论后果是逆向设计：课程、教材、考试都从「学习者最终需要能做什么」倒推。2020 版把调解（mediation）提升为与接收、产出、互动并列的第四种活动。
      evidence:
        - "Council of Europe (2001), CEFR, CUP；CEFR Companion Volume (2020), Council of Europe Publishing（行动导向原文经欧洲委员会官方研讨会背景读物引 pp. 28–32 核实）"
      scope: 必须如实标注——CEFR 是欧洲为通用（以成人流动为原始场景）学习者研制的参照框架，其描述语与分级不是为中国小学生的发展次序实证标定的；A1/A2 描述可借作目标措辞与大致标尺，不得把六级阶梯当作小学英语的发展定律或达标线。中国语境的法定参照是义务教育英语课程标准与 CSE 的低级别描述。
      exceptions:
        - can-do 自评在低龄儿童中的效度（儿童自评偏差）无定论。
    mechanism:
      - beat: 行动导向与逆向设计
        text_kid: 把目标写成一句「我能……」，学什么、学到哪儿，一下子就清楚了。
        text_adult: 对 App 的用途是目标语言：每个单元的学习目标改写成儿童版 can-do 句，进度按做成的事计；调解活动（把一段说明讲给同伴听）为同伴互助、图文转述提供现成任务原型（与 YL-04 衔接）。CEFR 是剑桥、歌德等考试体系对标与中国 CSE (2018) 研制的重要参照。
        visual: 从 can-do 目标倒推课程/教材/测评的逆向设计图
        anchors: [G3_0625]
    examples:
      - level: 1
        word_ids: [G3_0625]
        form: "say 的目标句形态：「我能用英语说出……」（儿童版 can-do）"
        scene_note: 清单原文给出的 App 落地形态
        supports: claim
    error_cases:
      - wrong: 把 CEFR 六级阶梯当作小学英语的发展定律或达标线
        right: 六级只作参照系与目标措辞；法定参照是课标与 CSE 低级别描述
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 的如实标注。
    relatives:
      - {id: CG-11, rel: 同族}
      - {id: CB-14, rel: 对照}
    quiz:
      - q: CEFR 定义水平的依据是？
        options: [语法覆盖量, can-do 描述语, 词汇量, 课时数]
        answer: can-do 描述语
        hint_on_wrong: 回机制小节「行动导向与逆向设计」
    probes: []
    prereq: []
    order: 10
    pain_points: []
    adult:
      sources:
        - "Council of Europe (2001), CUP; Companion Volume (2020)；官方背景读物 https://rm.coe.int/cefr-webinar-series-2021-3-background-reading/1680a54fc7"
      boundary: 非为中国小学生发展次序标定；只作参照系，不作测量定论。
      disputes: 对 CEFR 的批评长期存在：分级描述的实证标定基础（Rasch 标定样本与情境）受质疑（Fulcher 等）；「行动导向」在各国落地时常被窄化成只剩分级与考试对标，恰与其初衷相反（如实保留）。
      evidence_grade: 官方文本转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-10}

  - id: CG-11
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 先按「要办的事和要说的意思」排课，语法是随后配齐的工具（意念-功能大纲）
    headline_kid: 以前的课本按语法排队：先学现在时，再学过去时。意念-功能排法反过来：先看你要办什么事——道歉、邀请、问时间、比大小——再把办这些事需要的句子配齐。语法不是主角，是工具箱。
    claim:
      type: tendency
      statement: Wilkins (1976) 提出按两类意义组织大纲：意念（notions：时间、数量、空间、频率等语义范畴）与交际功能（functions：请求、拒绝、邀请、道歉、赞同等用语言做的事）；语法形式退居实现手段，同一功能可由多个形式实现，教学按需求分析选取与排序。van Ek (1975)《The Threshold Level》把它落成第一份完整规格，这条线直通后来的 CEFR（B1 级官方别名仍叫 Threshold）。
      evidence:
        - "Wilkins (1976), Notional Syllabuses, OUP（源起 1972 年为欧洲委员会所写工作论文）；van Ek (1975), The Threshold Level, Council of Europe（地位与别名经交际教学法史述与剑桥样章核实）"
      scope: 本条收作组织原则（单元以功能-话题为纲、语法为目），不主张废弃语法序列。
      exceptions:
        - 纯功能大纲有已知缺陷：功能清单本身无内在难度次序（道歉有一百种说法，先教哪个仍要靠语法与频率标准裁决）；「功能」在低龄段须落到具体生活场景才可教。
    mechanism:
      - beat: 功能为纲、语法为目
        text_kid: 先看你要办什么事，再把办这些事需要的句子配齐。语法不是主角，是工具箱。
        text_adult: 这是 20 世纪语言教学大纲思想的分水岭：此前大纲按结构逐个累积零件（synthetic)，此后「分析式」（按整体交际需求切分）成为主流选项之一，ESP 需求分析、任务型大纲、CEFR 皆出此源；中国现行课标的「语言功能」板块即其直系后裔。
        visual: 同一功能的多个实现形式对照（Could you…? / Please… / …!）
        anchors: [V6_节日_0]
    examples:
      - level: 1
        word_ids: [V6_节日_0]
        form: "time 属意念（语义范畴），问时间属功能——大纲按此二分排课"
        scene_note: 清单原文的意念/功能例示
        supports: claim
    error_cases:
      - wrong: 以纯功能大纲废弃语法序列
        right: 功能-话题为纲、语法为目；功能内部次序仍靠语法与频率标准裁决
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope 与 disputes（Wilkins 本人即指出互补）。
    relatives:
      - {id: CG-08, rel: 同族}
      - {id: CG-10, rel: 同族}
    quiz:
      - q: 意念-功能大纲的两类组织意义是？
        options: [时态与语态, 意念与交际功能, 词汇与拼写, 输入与输出]
        answer: 意念与交际功能
        hint_on_wrong: 回机制小节「功能为纲、语法为目」
    probes: []
    prereq: [CG-08]
    order: 11
    pain_points: []
    adult:
      sources:
        - "D. A. Wilkins (1976), Notional Syllabuses, Oxford University Press; J. A. van Ek (1975), The Threshold Level, Council of Europe；剑桥《Language Functions Revisited》样章"
      boundary: 组织原则而非废弃语法序列；低龄功能须落到具体生活场景。
      disputes: Wilkins 本人即指出意念大纲不能替代语法大纲而是与之互补；后续批评（Widdowson 等）认为按功能切分同样是一种「零件化」，真实交际的整体性仍需任务与语篇层面找回——这正是 CEFR 行动导向（CG-10）与 CLIL（CG-09）后来要补的课（如实保留）。
      evidence_grade: 史述+样章核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-11}

  - id: CG-12
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 「泡」在语言里，听读能泡出高水平，说写的准确却会卡住（沉浸式的成熟结论）
    headline_kid: 整天听英语、用英语上课，耳朵和阅读会越来越厉害；但开口说、动手写的时候，小毛病（时态、词尾、搭配）会悄悄固定下来——光泡不够，还得有人把毛病指出来、逼自己认真说一遍。
    claim:
      type: tendency
      statement: 加拿大法语沉浸式五十年评估的收敛结论：沉浸生母语与学业不受损，二语接收技能（听、读）到小学高段可接近母语者水平；而产出技能（说、写）明显滞后——流利敢说，但语法准确性、社会语言得体性与词汇精确度与母语者有持续差距。Swain 据此提出输出假说：仅靠可理解输入不足以发展完全的语法能力，学习者需要在产出中注意到缺口、被推着修正，沉浸课堂必须有意识地插入形式聚焦。
      evidence:
        - "Genesee (1987), Learning Through Two Languages, Newbury House（综述定版）"
        - "Swain 输出假说（1985/1995）与 Swain (2000), Annual Review of Applied Linguistics 综述；Cummins 三十年回顾（CARLA 档案核实）"
      scope: 加拿大沉浸是官方双语国的自愿项目（家长主动选择、教师为双语者、法语有社会地位），条件与中国 EFL 课堂差异巨大：可迁移的是机制结论（输入≠产出能力、形式聚焦不可缺），不是课时比例或成效数字。
      exceptions:
        - 沉浸生的产出差距是「相对母语者」的差距，其绝对水平远超普通外语课学生，不得反读为「沉浸无效」。
    mechanism:
      - beat: 接收—产出缺口
        text_kid: 光泡不够，还得有人把毛病指出来、逼自己认真说一遍。
        text_adult: 这是教育史上被评估得最彻底的语言项目之一（数百项研究、跨五十年、含纵向追踪），「产出缺口」已被 CLIL 研究独立观察到（CG-09 分歧栏），两条传统互证。对中国语境的意义是上限预期管理：英语角、双语课程、全英文 App 环境解决输入与流利，准确性需要产出任务+反馈+形式聚焦另外供给。
        visual: 接收技能近母语 vs 产出技能滞后的双轨图
        anchors: [G2_0642, G2_0492, G3_0619, G3_0487]
    examples:
      - level: 1
        word_ids: [G2_0642, G2_0492]
        form: "listen、read（接收技能）在沉浸中可接近母语者水平"
        scene_note: 清单原文的接收/产出对照
        supports: claim
      - level: 2
        word_ids: [G3_0619, G3_0487]
        form: "speak、write（产出技能）的准确性持续滞后"
        scene_note: 清单原文的接收/产出对照
        supports: claim
    error_cases:
      - wrong: 宣称全英文环境/多听多看即可自动带来产出准确性
        right: 输入解决流利，准确性须靠产出任务、反馈与形式聚焦另行供给
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的输出假说。
    relatives:
      - {id: CG-09, rel: 对照}
      - {id: CG-14, rel: 对照}
    quiz:
      - q: 沉浸生与母语者的持续差距主要在哪一侧？
        options: [听, 读, 说与写的准确性, 词汇量]
        answer: 说与写的准确性
        hint_on_wrong: 回机制小节「接收—产出缺口」
    probes: []
    prereq: []
    order: 12
    pain_points: []
    adult:
      sources:
        - "Fred Genesee (1987), Newbury House；Merrill Swain (1985/1995; 2000 ARAL)；Cummins 沉浸三十年回顾 https://archive.carla.umn.edu/cobaltt/modules/strategies/immersion2000.html；Lazaruk (2007), Canadian Modern Language Review"
      boundary: 只迁移机制结论，不迁移课时比例与成效数字。
      disputes: 产出差距的归因有争论：Swain 一系归因于产出机会与反馈不足；也有研究者指出沉浸课堂的输入本身即缺少某些形式（属输入质量问题）；Hammerly 等有更尖锐的批评。归因未定，现象稳固（如实保留）。
      evidence_grade: 综述+档案核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-12}

  - id: CG-13
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 初学读字，先把「拼读」这条路修直，但不能只剩拼读（Rose 审查）
    headline_kid: 刚学读英语，先学会一个本事：看见字母能拼出声音、把声音连成词（cat = c-a-t）。这条路要走得稳、走得早；但读书不只是拼出声——听故事、说话、认意思，要一起长大。
    claim:
      type: tendency
      statement: 英国政府委托的 Rose 独立审查（2006）定版结论：高质量拼读教学应是初学阅读的首要路线（prime approach)，且合成拼读（synthetic phonics）是其中最优形态——按明确递进的次序教字母-音素对应、教拼合（blending，读）与切分（segmenting，拼写），两者是可逆的同一技能。同时以简单阅读观（解码 × 语言理解）取代原「探照灯」模型：解码满分而理解为零，阅读仍是零。
      evidence:
        - "Rose (2006), Independent Review of the Teaching of Early Reading: Final Report, DfES（合成拼读四要点经教师培训评估报告引 p. 20 原文核实）"
        - "跨国对照：美国国家阅读专家组 NRP (2000) 与 Rose 在「系统拼读有效且应显性教」上收敛（清单互证登记）"
      scope: Rose 审查的对象是英语为母语的英格兰儿童（解码是其瓶颈）；中国儿童的瓶颈结构不同（解码+词汇量+听力理解三者并缺)，「首要路线」迁移时须重新排序权重。
      exceptions:
        - 报告的另一限定与「首要」同等重要：拼读须置于「广阔而丰富的多感官语言课程」之中，听说与真实阅读经验不可缺席；只引前半句即是断章取义。
    mechanism:
      - beat: 合成拼读为首要路线
        text_kid: 看见字母能拼出声音、把声音连成词，这条路要走得稳、走得早；但读书不只是拼出声。
        text_adult: 政策后果：英格兰自 2007 年起以 Letters and Sounds 落地、2012 年设一年级拼读筛查。对本 App：英式合成拼读路线（本 App 拼读体系）由此获得官方审查级的出处补强；与 S/SR 波次（W1）直接衔接。
        visual: 拼合/切分可逆技能 + 解码×理解的简单阅读观乘式图
        anchors: [G1_014]
    examples:
      - level: 1
        word_ids: [G1_014]
        form: "cat = c-a-t：拼合（blending）读出、切分（segmenting）拼出"
        scene_note: 清单原文的招牌例
        supports: claim
    error_cases:
      - wrong: 只引「拼读首要」而丢掉「置于丰富语言课程中」的限定，把课程做成只剩拼读
        right: 拼读为首要路线且与听说、真实阅读经验并行（简单阅读观：解码 × 理解）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——断章取义即是误用。
    relatives:
      - {id: LS-15, rel: 对照}
    quiz:
      - q: 简单阅读观的公式是？
        options: [解码 + 速度, 解码 × 语言理解, 拼读 + 背词, 理解 − 解码]
        answer: 解码 × 语言理解
        hint_on_wrong: 回机制小节「合成拼读为首要路线」
    probes: []
    prereq: []
    order: 13
    pain_points: []
    adult:
      sources:
        - "Jim Rose (2006), Independent Review of the Teaching of Early Reading: Final Report, DfES；评估报告转引 https://dera.ioe.ac.uk/id/eprint/8198/"
      boundary: 母语儿童证据；中国儿童瓶颈结构不同，迁移须重新排序权重。
      disputes: Rose 路线在英国学界有持续批评：Wyse & Styles 等质疑合成拼读优于其他拼读形态的证据强度，UKLA 主张理解与解码应更平衡地推进，指其政策化过程超出证据（「magic bullet」之讥）。跨国对照的稳固结论是「系统性」三字（有次序、显性、全覆盖)，「合成优先」为英方立场，如实标注（如实保留）。
      evidence_grade: 官方报告转引核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-13}

  - id: CG-14
    zone: 支撑层
    group: CG
    subgroup: 全球传统线
    audience: 教师/设计层
    headline: 听懂很多，英语就会自己长出来——影响最大的说法，也是吵得最凶的说法（Krashen 输入假说）
    headline_kid: 多听、多看你基本能懂的英语故事（稍微有一点点新东西），英语会慢慢自己长进脑子里——不用先背语法，也不用怕开口说错。这话很有道理，但「只靠听就够了」是它最容易被说过头的地方。
    claim:
      type: tendency
      statement: Krashen 的监控模型以输入假说为核心：语言是「习得」的，途径是接收可理解输入——略高于当前水平（i+1）的、能听懂意思的语言；配套假说包括习得/学得之分（显性规则只作监控校对）、自然顺序、情感过滤。本条按「有重大影响的教学主张」收录，不按已证定论收录（见 adult.disputes，全簇最重）。
      evidence:
        - "Krashen (1982), Principles and Practice in Second Language Acquisition, Pergamon; (1985), The Input Hypothesis, Longman；与 Terrell 合著 (1983), The Natural Approach"
        - "支持面：广泛阅读实证文献（Day & Bamford 传统）显示足量可懂阅读与词汇、阅读能力增长相关"
      scope: i+1 中的 i 与 +1 无法独立测量，本条只能作材料选择的方向性原则（大致可懂、略带新料），不能作精确配比公式；对中国小学生，校内输入量远达不到自然习得的量级，显性教学的效率补偿不可省略。
      exceptions:
        - App 内凡引用 Krashen，必须连同成人层分歧栏呈现。
    mechanism:
      - beat: 可理解输入
        text_kid: 多听、多看你基本能懂的英语故事，英语会慢慢自己长进脑子里。
        text_adult: 其对教学的真实贡献在于把重心从「讲解与操练」扭向「足量、有趣、可懂的听读材料」——绘本朗读、分级阅读、窄式听力皆受其推动；Krashen 对一线教师的实际影响居 20 世纪 SLA 理论之首。
        visual: i+1 输入带（大致可懂、略带新料）示意
        anchors: [G2_0642, V6_学校_44]
    examples:
      - level: 1
        word_ids: [G2_0642, V6_学校_44]
        form: "listen + story：窄式听力与绘本朗读作为可理解输入的供给形态"
        scene_note: 清单原文登记的受其推动的教学形态
        supports: claim
    error_cases:
      - wrong: 宣称「只靠听就够了」并取消显性教学与产出训练
        right: 输入必要而不充分（共识状态）；输入与显性教学、产出反馈并行（与 CG-12 对读）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 disputes 的充分性批评与 scope。
    relatives:
      - {id: CG-12, rel: 对照}
      - {id: YL-11, rel: 同族}
    quiz:
      - q: 学界对输入假说的共识状态是？
        options: [已被完全证实, 输入必要而不充分, 已被完全推翻, 只适用于成人]
        answer: 输入必要而不充分
        hint_on_wrong: 回成人层 disputes
    probes: []
    prereq: []
    order: 14
    pain_points: []
    adult:
      sources:
        - "Stephen D. Krashen (1982), Pergamon; (1985), Longman; Krashen & Terrell (1983); 四十年再评估 Lichtman & VanPatten (2021), Foreign Language Annals"
      boundary: i+1 不可独立测量，只作方向性原则；校内输入量约束下显性教学不可省略。
      disputes: "本条分歧为全簇最重，必须如实读完：① 可证伪性——Gregg (1984) 与 McLaughlin (1987) 指其核心概念无法独立检验（McLaughlin 语：理论「在每个关口都不成立」）；② 充分性——沉浸式证据（CG-12）显示足量可懂输入并不自动带来产出准确性，Swain 输出假说即由此起；③ 现代修正——技能习得研究（DeKeyser）显示显性知识可经练习自动化，「学得不能变习得」的强断言已被普遍放弃；Lichtman & VanPatten (2021) 四十年再评估为部分平反。共识状态：输入必要而不充分（如实保留，全文不裁决）。"
      evidence_grade: 原书书目+批评文献核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 CG-14}

  # ================= VB 动词专著书房（13 条） =================
  - id: VB-01
    zone: 支撑层
    group: VB
    subgroup: "Levin:动词意义决定句法行为"
    audience: 教师/设计层
    headline: 交替是探针：一个动词能进哪些句型，先由它的意思说了算
    headline_kid: 动词像不同脾气的玩具：有的能这样摆、那样摆，有的死活摆不出某个姿势——摆法早就写在它的意思里了。
    claim:
      type: tendency
      statement: "Levin 的全书假设（原书 p. 1，经学术转述核实）：动词的行为、特别是其论元的表达与解释方式，在很大程度上由它的意义决定。操作方法是把「交替」（diathesis alternations，同一动词在不同论元实现格局间的系统变换）当作探针：能参与哪些交替，探测出动词意义中哪些成分对语法可见。全书据此交叉分类 3,000 多个动词（第一部分按交替，第二部分按意义组织成 48 个大类、约 192 个小类）。"
      evidence:
        - "Levin (1993), English Verb Classes and Alternations, University of Chicago Press, xviii+348 pp.（出版社全目录已打开核对；正式书评 Somers, Computational Linguistics 20(3)；作者 2009 讲座幻灯）"
      scope: Levin 自我限定此书为 preliminary investigation（p. 17)、by no means a definitive and exhaustive classification（p. 18)；带小句补语的动词被有意排除；交替是诊断工具而非意义本身，探针探不到的意义成分（如细腻的语域差）不在此框架内。
      exceptions:
        - 旧捕鲸词 gally 例（清单原文）：只告诉你它的意思，就能预判它的句型行为——意义先行、句法随后。
    mechanism:
      - beat: 交替诊断
        text_kid: 动词能怎么摆，早就写在它的意思里了。
        text_adult: 该书是 MIT 词库计划（Lexicon Project）的产物，参考文献 700 余条；其分类后来被 VerbNet 直接继承（见 VB-03)，是「意义→句法」假设被大规模数据检验过的最完整一次。本条是 VB 组的方法总纲。
        visual: 以交替为探针探测动词意义成分的示意
        anchors: []
    examples:
      - level: 1
        word_ids: [ADD_0025, V6_日常_47]
        form: "break / cut 的交替行为差（详见 VB-02 招牌分析）"
        scene_note: 清单原文的诊断例
        supports: claim
    error_cases:
      - wrong: 把 Levin 分类当作定版完备的词典结论引用
        right: 按作者自我限定引用：preliminary investigation，类是调查的立足点
        error_type: 出处归属错误
        source_type: 条目成人层登记
        diagnosis: 回指 scope 的作者自限。
    relatives:
      - {id: VB-02, rel: 同族}
      - {id: VB-03, rel: 同族}
    quiz:
      - q: Levin 用什么当探测动词意义成分的探针？
        options: [词频, 交替（diathesis alternations）, 词源, 儿童语料]
        answer: 交替（diathesis alternations）
        hint_on_wrong: 回机制小节「交替诊断」
    probes: []
    prereq: []
    order: 1
    pain_points: []
    adult:
      sources:
        - "Beth Levin (1993), University of Chicago Press；出版社目录 https://press.uchicago.edu/ucp/books/book/chicago/E/bo3684144.html；书评 https://preview.aclanthology.org/master-new-author-system/J94-3013.pdf"
      boundary: 作者自限为初步调查；带小句补语动词被排除；探针探不到的成分不在框架内。
      disputes: 与构式语法（清单 CO 组）存在真实的理论张力：Levin 是「动词中心」——句型行为由动词意义决定；Goldberg 是「构式中心」——整句模具自带意义。Levin 自己的数据表明构式义必须尊重词汇约束，两家是约束与被约束的关系，不是二选一（如实保留）。
      evidence_grade: "目录+书评级（清单接触等级总表）：引言 pp. 1–21 原文未通读，论点经带页码转述交叉核实"
      pending:
        - "（2026-11-02 终局登记）Levin (1993) 接触等级就此定版：引言核心主张（p. 1 假设、p. 17/18 自我限定）经学术转述核实，书目与全书目录经出版社页核对，正式书评（Somers 1994）已打开；引言 pp. 1–21 通读与 Part Two 各类成员名单逐类核对无开放全文可做，封顶为「目录＋书评＋转述」级，不再作开放待核挂账（VB-02/VB-03 同此）"
    status: 入模中
