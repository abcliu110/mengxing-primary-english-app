  - id: YL-13
    zone: 支撑层
    group: YL
    subgroup: 学习载体
    audience: 教师/设计层
    headline: 先听懂、再开口，用身体记住语言（TPR）：有效但证据有边界，只适合打地基
    headline_kid: 先别急着说！听老师说指令，身体动起来做对了，就是听懂了；听懂了很多很多，才轮到嘴巴开口。
    claim:
      type: tendency
      statement: 全身反应法（TPR）类比婴儿学母语路径：儿童先经历长时间听力理解期，以全身动作回应指令，在「听—做」绑定中建立语音与意义的联结，不施加开口压力；理解基础打牢后口语自然涌现。其可保留的窄结论是「与词义紧密绑定的动作促进词汇编码」。
      evidence:
        - "Asher (1977), Learning Another Language Through Actions, Sky Oaks Productions（方法主张经 Xie 2021, JLTR 12(2): 293–303 文内梳理核实）"
        - "2026 年学前运动类语言干预系统综述（PRISMA 2020，纳入 8 项研究）：语义整合运动在较强对照研究中优于静态教学；专门针对 TPR 的证据参与度与短期学习为正向、方法学异质且不够稳健"
      scope: 证据强度如实标注为「有限」：学前 TPR 研究多为小样本、描述性或无对照设计，不能作强因果解读；证据几乎只覆盖具体词汇结果。
      exceptions:
        - 抽象词汇、复杂语法、读写技能无法靠动作表达——TPR 只适合起步阶段的听说地基，常只能作补充技术。
        - Asher 的「左右脑」理论包装不被现代证据支持，不得随方法一并呈现。
    mechanism:
      - beat: 听—做绑定
        text_kid: 先别急着说！听老师说指令，身体动起来做对了，就是听懂了。
        text_adult: 在中国小学课堂实证中，TPR 常受课时、考试导向评估与教师培训不足制约而只能作补充技术（Xie 2021 案例发现）。
        visual: 指令—动作回应序列示意
        anchors: [G3_K12, G2_085]
    examples:
      - level: 1
        word_ids: [G3_K12, G2_085]
        form: "stand（站）、jump（跳）等指令的动作回应"
        scene_note: 清单原文的指令驱动动作序列
        supports: claim
    error_cases:
      - wrong: 把 TPR 当作整套方法覆盖抽象词汇、语法与读写
        right: TPR 只作起步阶段听说地基的补充技术，证据强度标注为有限
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions 与 scope。
    relatives:
      - {id: YL-10, rel: 同族}
    quiz:
      - q: TPR 证据的可保留窄结论是什么？
        options: [左右脑理论成立, 与词义绑定的动作促进词汇编码, 口语会自动完美, 适合教语法]
        answer: 与词义绑定的动作促进词汇编码
        hint_on_wrong: 回 claim 的窄结论
    probes: []
    prereq: []
    order: 13
    pain_points: []
    adult:
      sources:
        - "James J. Asher (1977), Sky Oaks Productions；Xie (2021), Journal of Language Teaching and Research 12(2): 293–303, DOI 10.17507/jltr.1202.11；Valentini, Simone & Beretta (2026) 系统综述"
      boundary: 只适合起步听说地基；证据有限，不能作强因果解读。
      disputes: 支持方（具身认知研究线）认为动作改变记忆编码方式；保留方（方法论批评线）认为其产出延迟、纠错缺位与初级天花板使其只能作技术、不能作整套方法。两方并列登记。
      evidence_grade: 期刊梳理+系统综述核实（原书版次待核）
      pending:
        - "（2026-11-02 销项）Asher 原书版次已定版：James J. Asher《Learning Another Language Through Actions: The Complete Teacher's Guidebook》，初版 1977 年，Los Gatos, CA: Sky Oaks Productions（117 页；多家独立书目互证，如 Richards & Rodgers《Approaches and Methods》参考文献与 HLT 书目）；第 2 版 1982 年；迄 2003 年第 6 版，同社"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 YL-13}

  - id: YL-14
    zone: 支撑层
    group: YL
    subgroup: 年龄、动机与儿童参与
    audience: 教师/设计层
    headline: 让孩子参与设计与评议：儿童不只是任务的执行者，也是任务的共同作者
    headline_kid: 大人们可以问我们：这个游戏哪里太难、哪里好玩？我们自己想出来的活动，我们会更想玩。
    claim:
      type: tendency
      statement: 儿童应从「被试/被教者」推进为参与者：任务型学习应让儿童成为任务的主动创造者、系统探询儿童自己对任务的看法，乃至让儿童与教师担任共同研究者。机制依据：儿童对任务难度与趣味的自我报告是成人观察测不到的信息，且参与设计本身提升投入与自主性。
      evidence:
        - "Pinter (2015) 任务章节结论部分（WRAP 全文）；Pinter & Mathew 印度小学英语课堂共同研究者研究（British Council 官方页核实）"
        - "Pinter (2023), Engaging Children in Applied Linguistics Research, CUP（取向系统化）"
      scope: 参与不等于放任：任务目标与语言框架仍由教师把持，儿童参与的是难度校准、题材选择与形式设计；低龄儿童的自我报告需与观察数据交叉验证，不能单独作为评估依据。
      exceptions:
        - 儿童参与研究亦受《联合国儿童权利公约》(1989) 参与权框架支持（背景登记，不作方法证据）。
    mechanism:
      - beat: 儿童共同作者
        text_kid: 大人们可以问我们：这个游戏哪里太难、哪里好玩？
        text_adult: 与 YL-09 的课堂动机机制衔接：参与设计提升投入与自主性，自我报告补成人观察的盲区。
        visual: 儿童参与难度校准/题材选择/形式设计的环节图
        anchors: [G2_0990]
    examples:
      - level: 1
        word_ids: [G2_0990]
        form: "game（游戏）的难度与趣味由儿童参与评议"
        scene_note: 清单原文的参与形态
        supports: claim
    error_cases:
      - wrong: 把儿童自我报告单独作为评估依据，或放任儿童决定任务目标
        right: 自我报告与观察数据交叉验证；目标与语言框架仍由教师把持
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope。
    relatives:
      - {id: YL-09, rel: 同族}
    quiz:
      - q: 儿童参与的范围是？
        options: [决定课程目标, 难度校准、题材选择与形式设计, 替代教师评估, 只玩不学]
        answer: 难度校准、题材选择与形式设计
        hint_on_wrong: 回 claim 的 scope
    probes: []
    prereq: []
    order: 14
    pain_points: []
    adult:
      sources:
        - "Pinter (2015), Bloomsbury（WRAP 全文）；Pinter & Mathew 共同研究者研究；Pinter (2023), CUP"
      boundary: 自我报告须与观察交叉验证；目标框架由教师把持。
      disputes: 无主流分歧；方法论上对「儿童报告的可信度」有程度之争，属执行层。
      evidence_grade: 章节全文核实
      pending: []
    status: 入模中
    version: "1.0"
