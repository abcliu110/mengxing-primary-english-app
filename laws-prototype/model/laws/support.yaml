  - id: YL-06
    zone: 支撑层
    group: YL
    subgroup: 学习载体
    audience: 教师/设计层
    headline: 故事是儿童英语课的发动机：一本真实绘本可以组织一整段学习
    headline_kid: 一个好故事能带着我们学好多天：先听、再演、做手工、玩游戏，最后做出我们自己的小作品。
    claim:
      type: tendency
      statement: 故事教学法把真实故事书（为母语儿童写的绘本）置于课程中心：故事提供完整的语篇语境、可预测的重复结构与情感投入，语言项目在故事的意义网络里被带出来；操作骨架是「计划—做—回顾」（Plan, Do, Review），并可长成故事驱动大纲，与跨学科主题相连。
      evidence:
        - "Brewster, Ellis & Girard (2002), The Primary English Teacher's Guide, Penguin/Pearson, ISBN 9780582447769"
        - "Ellis & Brewster (2002), Tell it Again!（ELT 期刊书评全文：12 本真实故事完整教案与选材标准）"
      scope: 故事难度须按选材标准筛（重复结构、图文对应、语言可预测性）；教师须备不依赖绘本实物时的讲述方案。
      exceptions:
        - 无计划-做-回顾结构、无具体成果的故事活动退化为消遣——故事驱动不等于读个故事就完。
    mechanism:
      - beat: Plan-Do-Review
        text_kid: 一个好故事能带着我们学好多天：先听、再演、做手工、玩游戏，最后做出我们自己的小作品。
        text_adult: 讲前活动激活背景、预埋关键语言；讲中参与式聆听；讲后以具体成果收口（戏剧表演、棋盘游戏、手指偶剧等）。该法在欧洲小学外语课堂被广泛用作良好实践参照，与 Cameron (2001) 并列为方法论文献支柱。
        visual: 故事为中心的三段活动骨架图
        anchors: [V6_学校_44]
    examples:
      - level: 1
        word_ids: [V6_学校_44]
        form: "story-based approach：一本真实绘本组织一整段学习"
        scene_note: 清单原文的方法形态
        supports: claim
    error_cases:
      - wrong: 只读一遍故事、无讲前讲后活动与成果收口
        right: 按 Plan-Do-Review 组织并以具体成果收口
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions。
    relatives:
      - {id: YL-07, rel: 同族}
      - {id: YL-03, rel: 同族}
    quiz:
      - q: 故事教学法的操作骨架是？
        options: [读—译—背, 计划—做—回顾, 讲—练—考, 听—说—读]
        answer: 计划—做—回顾
        hint_on_wrong: 回机制小节「Plan-Do-Review」
    probes: []
    prereq: []
    order: 6
    pain_points: []
    adult:
      sources:
        - "Brewster, Ellis & Girard (2002), Penguin English/Pearson ELT；Ellis & Brewster (2002), Tell it Again!, Penguin English（书评全文核实）"
      boundary: 选材须按标准筛；绘本成本与可得性是真实约束。
      disputes: 无主流分歧；书评界的保留集中在 8–11 岁内部跨度过大、个别故事年龄适配标注不足，属执行层批评。
      evidence_grade: 书目+书评全文核实
      pending: []
