entries:
  # ================= LS 学习科学（15 条） =================
  - id: LS-01
    zone: 支撑层
    group: LS
    subgroup: 提取练习家族
    audience: 教师/设计层
    headline: 十种常见学法逐个评级：只有「自己考自己」和「分散开学」拿到最高档
    headline_kid: 最有用的学法是两个——把书合上自己考自己、把复习分开几天；最没用的是划线和一遍遍重读。
    claim:
      type: tendency
      statement: 学生最常用的十种学习技巧经系统评估分三档：高效用只有练习测验与分散练习两种；精细化提问、自我解释、交错练习为中效用；做摘要、划线、关键词记忆术、为课文造意象、反复重读为低效用。流行的学法与有效的学法系统性错位。
      evidence:
        - "Dunlosky, Rawson, Marsh, Nathan & Willingham (2013), Psychological Science in the Public Interest 14(1): 4–58（APS 旗舰综述，一手评级）"
      scope: 评估对象是「学生能自主使用的技巧」；证据主体为中学生以上与大学生，对小学生须翻译为由 App/教师代为安排的练习形态。
      exceptions:
        - 低效用不等于完全无效（如重读胜过只读一遍），是同等时间下有明显更好的替代品。
        - 关键词记忆术对短时外语词配对有局部效果，但受材料与保持期限制，仍评低效用——口诀类记忆术不能当词汇教学主力。
    mechanism:
      - beat: 评级总纲
        text_kid: 最有用的学法是两个——把书合上自己考自己、把复习分开几天；最没用的是划线和一遍遍重读。
        text_adult: 十技巧按跨年龄、跨材料、跨测验形式是否稳定有效等十个标准评估；本条是 LS 组的总纲，App 的练习形态与排程设计以此评级为据（提取与间隔为高效用主线，见 LS-02/LS-06）。
        visual: 十技巧三档评级表（设计检查表形态，不作儿童呈现）
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_38]
        form: "practice testing（练习测验）、distributed practice（分散练习）"
        scene_note: 清单原文所评的两种高效用技巧名
        supports: claim
    error_cases:
      - wrong: 把划线、反复重读、关键词口诀当作主要学法安排
        right: 主线用提取练习与分散练习，口诀类记忆术只作辅助
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim——三档评级中上述学法均为低效用。
    relatives:
      - {id: LS-02, rel: 同族}
      - {id: LS-06, rel: 同族}
      - {id: LS-11, rel: 同族}
    quiz:
      - q: 下列哪种学法在 Dunlosky (2013) 评级中属高效用？
        options: [反复重读, 练习测验, 划线标注, 关键词记忆术]
        answer: 练习测验
        hint_on_wrong: 回机制小节「评级总纲」看三档划分
    probes: []
    prereq: []
    order: 1
    pain_points: []
    adult:
      sources:
        - "Dunlosky et al. (2013), PSPI 14(1): 4–58；APS 新闻稿 https://www.eurekalert.org/news-releases/508403"
      boundary: 证据主体来自中学生以上与大学生；对小学生结论应翻译成由 App/教师代为安排的练习形态，不能指望孩子自发使用。
      disputes: 无主流分歧；争议在个别中效用技巧（交错练习）的证据成熟度，原文亦只给中档。
      evidence_grade: 一手综述核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-01}

  - id: LS-02
    zone: 支撑层
    group: LS
    subgroup: 提取练习家族
    audience: 教师/设计层
    headline: 测验效应：合上书想一遍，比把课文再读几遍记得牢得多
    headline_kid: 学完别急着再看一遍——先合上，自己想：刚才讲了啥？想的动作本身就在帮你记住。
    claim:
      type: tendency
      statement: 提取不是检查记忆的中性动作，而是改造记忆的事件：每次努力把信息取出来，取它的通路就被加固。短时（5 分钟后）重读组占优，延迟到 2 天、1 周后测验组反超且差距拉大；重读组对自己的掌握更自信，自信与实际保持脱钩。
      evidence:
        - "Roediger & Karpicke (2006), Psychological Science 17(3): 249–255（一手实验）"
        - "Adesope, Trevisan & Sundararajan (2017) 元分析，课堂情境效应量 g = 0.67（经 Frontiers in Psychology 2018 转述）"
      scope: 原实验被试为大学生、材料为科普短文；效应在延迟测验上才成立。
      exceptions:
        - 即时测验上重读反占优——复习题若只测刚看完的内容，测不出提取效应，必须隔一段时间再考。
    mechanism:
      - beat: 提取加固通路
        text_kid: 学完别急着再看一遍——先合上，自己想：刚才讲了啥？想的动作本身就在帮你记住。
        text_adult: 实验 2 中一周后反复测验组回忆出课文的 61%，反复重读组（平均读 14.2 遍）只有 40%。儿童证据见 LS-05、LS-06，方向一致但英语句型的直接证据仍薄。
        visual: 两组保持曲线对照（即时重读占优、延迟测验反超）
        anchors: []
    examples:
      - level: 1
        word_ids: [G2_0492]
        form: "re-reading（重读） vs testing（测验）的对照条件"
        scene_note: 清单原文实验条件
        supports: claim
    error_cases:
      - wrong: 学完立刻再测一遍就宣称提取练习有效
        right: 提取练习的效果在延迟测验上判定，复习题须与初学拉开时间间隔
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的 scope——短时测验上重读反而占优。
    relatives:
      - {id: LS-01, rel: 同族}
      - {id: LS-03, rel: 同族}
      - {id: LS-09, rel: 对照}
    quiz:
      - q: 测验效应在什么时间点的测验上才显现？
        options: [学完 5 分钟后, 延迟 2 天至 1 周后, 只在即时测验, 与时间无关]
        answer: 延迟 2 天至 1 周后
        hint_on_wrong: 回机制小节「提取加固通路」
    probes: []
    prereq: [LS-01]
    order: 2
    pain_points: []
    adult:
      sources:
        - "Roediger & Karpicke (2006), Psychological Science 17(3): 249–255, DOI 10.1111/j.1467-9280.2006.01693.x；摘要 https://pubmed.ncbi.nlm.nih.gov/16507066/"
      boundary: 被试为大学生、材料为科普短文；儿童材料多为事实/类别学习，英语句型直接证据仍薄。
      disputes: 无；细节争议在题型（简答 vs 选择）与是否必须反馈，见 LS-04。
      evidence_grade: 一手实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-02}

  - id: LS-03
    zone: 支撑层
    group: LS
    subgroup: 提取练习家族
    audience: 教师/设计层
    headline: 答对一次不等于学会：会了以后「继续考」才留得住，「继续看」几乎白费
    headline_kid: 一个词你答对了，别急着把它扔出复习堆——过几天再考你两次，它才真正变成你的。
    claim:
      type: tendency
      statement: 材料一旦能答对就移出练习是学习软件与学生的通病：答对之后重复学习（再看）对一周后保持几乎零贡献，重复提取（再考）贡献了几乎全部的保持增益。
      evidence:
        - "Karpicke & Roediger (2008), Science 319(5865): 966–968（一手实验，40 对斯瓦希里语—英语词对）"
      scope: 被试为大学生，材料为词配对、保持期一周；对 App 的含义是方向性的。
      exceptions:
        - 学生本人对各条件一周后表现的预测与实际成绩不相关——不能用学习者自评决定是否移出练习。
    mechanism:
      - beat: 答对后降频不移除
        text_kid: 一个词你答对了，别急着把它扔出复习堆——过几天再考你两次，它才真正变成你的。
        text_adult: 一周后答对后继续被考的条件回忆率约 80%，答对后被移出测验的条件只有约三分之一。设计含义：单词卡「答对即毕业」算法违背证据，应改为答对后降频但保留数次间隔提取。
        visual: 复习队列状态图（答对→降频保留→数次间隔提取→毕业）
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_42]
        form: "外语词配对学习（斯瓦希里语—英语）"
        scene_note: 清单原文实验材料，与英语单词学习同构
        supports: claim
    error_cases:
      - wrong: 单词卡答对一次即移出复习队列（答对即毕业）
        right: 答对后降频保留，再经数次间隔提取才毕业
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim——答对后继续看几乎白费，继续考才留得住。
    relatives:
      - {id: LS-02, rel: 前置}
      - {id: LS-06, rel: 同族}
    quiz:
      - q: 答对之后，哪种处理对一周后保持贡献最大？
        options: [再看几遍, 继续考几次, 立刻移出练习, 换新材料]
        answer: 继续考几次
        hint_on_wrong: 回机制小节「答对后降频不移除」
    probes: []
    prereq: [LS-02]
    order: 3
    pain_points: []
    adult:
      sources:
        - "Karpicke & Roediger (2008), Science 319(5865): 966–968, DOI 10.1126/science.1152408"
      boundary: 大学生、词配对、一周期限；小学生保持期与词量规模的外推需谨慎。
      disputes: 无。
      evidence_grade: 一手实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-03}

  - id: LS-04
    zone: 支撑层
    group: LS
    subgroup: 提取练习家族
    audience: 教师/设计层
    headline: 提取要配反馈：答错不可怕，没人告诉你对错才可怕
    headline_kid: 考完马上告诉我对不对、正确答案是啥——我下次就记得更牢；光考不批，错的可能越记越真。
    claim:
      type: tendency
      statement: 提取练习须配反馈：反馈放大提取的正效应（巩固答对的、尤其没把握却答对的），并拆掉选择题干扰项被误记成真知识的负效应；即时与延迟反馈都有益。
      evidence:
        - "Butler & Roediger (2008), Memory & Cognition 36(3): 604–616（一手实验）"
        - "Butler, Karpicke & Roediger (2008)：反馈尤其能保住低信心答对的内容"
      scope: 证据来自大学生与历史类短文；对小学生反馈须即时、友好、带正确答案重现。
      exceptions:
        - 选择题干扰项对低龄儿童的误导风险比成人更高，更依赖反馈兜底；只有对错标记、不重现正确答案不算合格反馈。
    mechanism:
      - beat: 反馈双职
        text_kid: 考完马上告诉我对不对、正确答案是啥——我下次就记得更牢；光考不批，错的可能越记越真。
        text_adult: 与无反馈组相比，即时与延迟反馈组在一周后线索回忆测验上答对更多、重复干扰项错误更少。
        visual: 答题→反馈（对错+正确答案重现）→再提取的闭环图
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_38]
        form: "multiple-choice testing with feedback（带反馈的选择题提取）"
        scene_note: 清单原文实验形态
        supports: claim
    error_cases:
      - wrong: 只考不批，或答错后只打叉不给正确答案
        right: 每次提取后给反馈，答错时让正确形式完整重现一次
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim——无反馈时干扰项会被误记成真知识。
    relatives:
      - {id: LS-02, rel: 同族}
    quiz:
      - q: 即时反馈与延迟反馈孰优，学界结论是？
        options: [即时必优, 延迟必优, 无定论，但有反馈大于无反馈, 无反馈更好]
        answer: 无定论，但有反馈大于无反馈
        hint_on_wrong: 回成人层 disputes
    probes: []
    prereq: [LS-02]
    order: 4
    pain_points: []
    adult:
      sources:
        - "Butler & Roediger (2008), Memory & Cognition 36(3): 604–616, DOI 10.3758/MC.36.3.604"
      boundary: 证据来自大学生与历史类短文；儿童反馈形态须按边界调整。
      disputes: 即时 vs 延迟反馈孰优无定论（不同实验结果不一），共识是「有反馈 > 无反馈」。
      evidence_grade: 一手实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-04}

  - id: LS-05
    zone: 支撑层
    group: LS
    subgroup: 提取练习家族
    audience: 教师/设计层
    headline: 小步常考在真实课堂里同样成立：六年级与八年级的整学期证据
    headline_kid: 上课时不时来个不算分的小测，不是为了为难你——测过的东西，期末你就是记得更好。
    claim:
      type: tendency
      statement: 把低风险小测嵌进正常教学，被测过的内容在单元考与学期考上都更好，效应保持到学期末累积考试；提取练习不是实验室 artifact，是可在真实课表里运行的安排。
      evidence:
        - "Roediger, Agarwal, McDaniel & McDermott (2011), J. Exp. Psychol.: Applied 17(4): 382–395（六年级社会课，三轮实验）"
        - "McDaniel et al. (2011), J. Educational Psychology 103(2): 399–414（八年级科学课，小测内容单元考提升 13%–25%）"
      scope: 本簇年龄最接近的证据，仍是 11–14 岁、社会/科学学科；向 6–10 岁与英语学科外推时题型须更游戏化、单次题量更小。
      exceptions:
        - 「小测不算分、低风险」是设计前提——变成计分考试会引入焦虑变量，证据不再直接适用。
    mechanism:
      - beat: 课堂小测
        text_kid: 上课时不时来个不算分的小测，不是为了为难你——测过的东西，期末你就是记得更好。
        text_adult: 实验室测验效应向真实课程的迁移证据：小测提升单元考与学期考成绩，且持续到累积考试。
        visual: 课表嵌入低风险小测的节奏示意
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_38]
        form: "low-stakes quizzing（低风险小测）"
        scene_note: 清单原文课堂形态
        supports: claim
    error_cases:
      - wrong: 把嵌入式小测做成计分考试
        right: 小测保持低风险、不算分，只作提取与诊断
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim 的 exceptions——计分引入焦虑变量，证据不再适用。
    relatives:
      - {id: LS-02, rel: 同族}
    quiz:
      - q: 课堂小测证据的设计前提是什么？
        options: [计分排名, 低风险不算分, 题量越大越好, 只测新学内容]
        answer: 低风险不算分
        hint_on_wrong: 回 claim 的 exceptions
    probes: []
    prereq: [LS-02]
    order: 5
    pain_points: []
    adult:
      sources:
        - "Roediger et al. (2011), JEPA 17(4): 382–395, DOI 10.1037/a0026252；McDaniel et al. (2011), JEP 103(2): 399–414"
      boundary: 11–14 岁、社会与科学学科；向低龄与英语外推须调整题型与题量。
      disputes: 无；课堂实施的争议在频率与教师负担，不在效应本身。
      evidence_grade: 一手课堂实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-05}

  - id: LS-06
    zone: 支撑层
    group: LS
    subgroup: 间隔与练习编排
    audience: 教师/设计层
    headline: 分散练习：把同一内容拆开隔几天学，赢过一口气学完——两个统计口径都指同一个结论
    headline_kid: 今天学一点、过几天再碰一点，比把所有次数挤在今天记得牢。把「学会」拆成几次见面，每次见面都比上一次记得久一点。
    claim:
      type: tendency
      statement: 间隔让第二次学习发生在「已经有点忘了」的状态，提取更费力，记忆被重新激活并改写加固；分散练习胜过集中练习，其强度由学习间隔（ISI）与保持间隔（RI）共同决定，不存在脱离 RI 的「最佳天数」。
      evidence:
        - "Cepeda, Pashler, Vul, Wixted & Rohrer (2006), Psychological Bulletin 132(3): 354–380（定量合成：839 次评估、317 个实验、184 篇文章）"
        - "Dunlosky et al. (2013) 转述口径：254 项研究、14,000+ 被试，分散后回忆率 47% vs 集中 37%（与上一口径不得混搭引用）"
        - "儿童证据：Vlach, Sandhofer & Kornell (2008) 3 岁幼儿；Gluckman, Vlach & Sandhofer (2014) 小学低年级课堂"
      scope: 元分析材料以言语回忆为主、被试以成人为主；儿童最优间隔的定量地图不存在，App 排程只可借方向、不可借参数。
      exceptions:
        - 间隔越长越好不成立：间隔相对保持期过与不及都变差（见 LS-07 的倒 U）。
    mechanism:
      - beat: 间隔效应
        text_kid: 今天学一点、过几天再碰一点，比把所有次数挤在今天记得牢。
        text_adult: 幼儿间隔以秒计已有效（Vlach 2008，范例间隔 30 秒）；小学低年级间隔以天计有效（Gluckman 2014，1 周后测验记忆与泛化均胜）——方向一致，儿童定量参数缺位。
        visual: 集中 vs 分散的排程对照图
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_节日_3]
        form: "distributed practice（分散练习）：同一内容拆开隔几天学"
        scene_note: 清单原文的操作定义
        supports: claim
    error_cases:
      - wrong: 把成人元分析的「间隔天数」直接写进儿童复习算法当定量承诺
        right: 儿童排程只借间隔效应的方向与形状，参数须本地校准
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 scope——儿童最优间隔定量地图不存在。
    relatives:
      - {id: LS-07, rel: 同族}
      - {id: LS-01, rel: 同族}
    quiz:
      - q: 引用分散练习的统计数字时必须注意什么？
        options: [两个口径可混用, 须注明用的是哪个口径, 只引百分比即可, 数字越大越可信]
        answer: 须注明用的是哪个口径
        hint_on_wrong: 回 claim 的 evidence 两条口径说明
    probes: []
    prereq: [LS-01]
    order: 6
    pain_points: []
    adult:
      sources:
        - "Cepeda et al. (2006), Psychological Bulletin 132(3): 354–380, DOI 10.1037/0033-2909.132.3.354；Vlach et al. (2008), Cognition 109(1): 163–167；Gluckman et al. (2014), Applied Cognitive Psychology 28(2): 266–273"
      boundary: 成人定量结论不能搬给儿童；可核的儿童证据形态只有秒级（幼儿）与天级（小学低年级）两个点。
      disputes: 机制解释未定论——编码变异说与提取努力说并存。
      evidence_grade: 一手元分析+儿童实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-06}

  - id: LS-07
    zone: 支撑层
    group: LS
    subgroup: 间隔与练习编排
    audience: 教师/设计层
    headline: 想记多久，就按比例隔多久：最优间隔随保持期拉长而变长，但占的比例反而变小
    headline_kid: 想记住一周的东西，隔一两天复习最好；想记住一年的东西，要隔上几周。间隔不是固定数字，它跟着「你要记多久」一起长大，只是长得没那么快。
    claim:
      type: tendency
      statement: 在任何给定的测验延迟下，把间隔从零拉长，成绩先升后降（倒 U）；最优间隔的绝对值随保持期上升，占保持期的比例却下降（保持期 1 周时约 20–40%，1 年时约 5–10%）。排复习计划的正确单位是比例，不是天数。
      evidence:
        - "Cepeda, Vul, Rohrer, Wixted & Pashler (2008), Psychological Science 19(11): 1095–1102（1,354 名被试，26 种间隔×保持期组合）"
      scope: 被试为成人（网络样本），材料是冷门知识问答，结构为最简的「学—隔—复习—测」；儿童、多次复习、真实课程的最优比例没有测过。
      exceptions:
        - 二手综述常把全程概括为「10–20%」——那只是中间段的粗略值，不得当作全程定值引用；本条按原摘要两个端点写。
        - 把 20–40% 直接写进儿童复习算法当定量承诺是超证据使用；可借的只有形状。
    mechanism:
      - beat: 时间脊线
        text_kid: 想记住一周的东西，隔一两天复习最好；想记住一年的东西，要隔上几周。
        text_adult: 间隔太短则提取太容易、加固不足；太长则提取直接失败。最优间隔画出一条随保持期移动的时间脊线（temporal ridgeline）。
        visual: 倒 U 曲线族 + 时间脊线示意
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_节日_3]
        form: "保持期 1 周 → 最优间隔约其 20–40%；保持期 1 年 → 约 5–10%"
        scene_note: 清单原文端点数据（原摘要口径）
        supports: claim
    error_cases:
      - wrong: 宣称「最优复习间隔是保持期的 10–20%」作为全程定律
        right: 按端点表述：比例随保持期变长而下降（1 周约 20–40%，1 年约 5–10%）
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——10–20% 只是中间段粗略值。
    relatives:
      - {id: LS-06, rel: 前置}
    quiz:
      - q: 保持期从 1 周拉长到 1 年，最优间隔占比如何变？
        options: [上升, 下降, 不变, 先降后升]
        answer: 下降
        hint_on_wrong: 回机制小节「时间脊线」
    probes: []
    prereq: [LS-06]
    order: 7
    pain_points: []
    adult:
      sources:
        - "Cepeda et al. (2008), Psychological Science 19(11): 1095–1102, DOI 10.1111/j.1467-9280.2008.02209.x；摘要 https://pubmed.ncbi.nlm.nih.gov/19076480/"
      boundary: 成人、冷门知识、两次学习结构；儿童与多次复习的最优比例未测。
      disputes: 无主流分歧；相邻争论在多次复习时等间隔 vs 扩展间隔孰优，本实验不直接裁决。
      evidence_grade: 一手实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-07}

  - id: LS-08
    zone: 支撑层
    group: LS
    subgroup: 合意困难与元认知
    audience: 教师/设计层
    headline: Bjork 合意困难：练得慢一点、错多一点的条件常常记得更牢——但只有「正中机制」的难才合意
    headline_kid: 练的时候有点费劲、偶尔想不起来，不一定是坏事——费点劲自己想出来的，才留得住。但难要难在点子上：字印得太小、声音太吵那种难，只会添乱，不会帮你学。
    claim:
      type: tendency
      statement: 记忆有两种独立强度：存储强度（只增不减）与提取强度（随时间涨落）；当下表现只由提取强度决定。再学习时存储强度的增益与当时提取强度成反比——间隔、交错、提取练习、变换情境先压低提取强度、再让学习者挣回来，Bjork (1994) 名之为合意困难。
      evidence:
        - "Bjork & Bjork (1992) 新废用理论（框架原始出处）；Bjork (1994)「合意困难」命名出处；Bjork & Bjork (2011) 框架自述章"
      scope: 框架性理论，无单一效应量；证据来自成人实验室材料。难度必须落在学习者靠努力可跨越的范围内、且作用在目标加工本身。
      exceptions:
        - 把字体做难认（disfluency，如 Sans Forgetica）并不带来记忆收益（Taylor et al. 2020 复制失败）——本框架不能给任何「故意制造麻烦」背书。
        - 儿童工作记忆余量更小，难度剂量须比成人更保守，且必须保留成功提取的体验；难到提不出来就只是失败。
    mechanism:
      - beat: 两强度模型
        text_kid: 练的时候有点费劲、偶尔想不起来，不一定是坏事——费点劲自己想出来的，才留得住。
        text_adult: 「现在很顺」完全可能只是提取强度虚高；框架统一解释间隔（LS-06）、提取（LS-02）、交错（LS-10）、变换情境四类操作，并给出可证伪预测。本簇按设计启发框架使用它，不当测量工具。
        visual: 存储强度/提取强度双线示意
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_38]
        form: "desirable difficulties 的四类操作：间隔、提取、交错、变换情境"
        scene_note: 清单原文列举的操作家族
        supports: claim
    error_cases:
      - wrong: 用难认字体、嘈杂环境等表面困难冒充合意困难
        right: 困难必须正中目标加工机制（提取、辨别、间隔），且学习者靠努力可跨越
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 exceptions——disfluency 路线已被复制检验否掉。
    relatives:
      - {id: LS-06, rel: 同族}
      - {id: LS-10, rel: 同族}
      - {id: LS-09, rel: 同族}
    quiz:
      - q: 当下练习表现很顺，说明什么？
        options: [存储强度高, 可能只是提取强度虚高, 已经学会, 可以停学]
        answer: 可能只是提取强度虚高
        hint_on_wrong: 回机制小节「两强度模型」
    probes: []
    prereq: []
    order: 8
    pain_points: []
    adult:
      sources:
        - "Bjork & Bjork (1992); Bjork (1994) in Metcalfe & Shimamura (Eds.) Metacognition, MIT Press, pp. 185–205; Bjork & Bjork (2011) in Psychology and the Real World, pp. 56–64"
      boundary: 理论证据来自成人实验室材料；儿童剂量须更保守。
      disputes: 存储强度「只增不减」是理论假设、不可独立直接测量，批评者质疑两强度能否真正分离观测；剂量边界仍在争论。
      evidence_grade: 框架原文+章节核实（个别转引已标）
      pending:
        - "（2026-11-02 销项）Storm, Bjork & Bjork (2008) 原文已定位并核读：Benjamin C. Storm, Elizabeth L. Bjork & Robert A. Bjork, “Accelerated relearning after retrieval-induced forgetting: The benefit of being forgotten”, Journal of Experimental Psychology: Learning, Memory, and Cognition 34(1): 230–236, DOI 10.1037/0278-7393.34.1.230——摘要经 APA PsycNet 核读（提取诱发遗忘随提取练习轮次累积；曾被遗忘的条目重学获益反而更大），作者实验室（UCLA Bjork Lab）公开全文稿。本条实验细节与原文口径一致，引用时可去「转引」标"
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-08}

  - id: LS-09
    zone: 支撑层
    group: LS
    subgroup: 合意困难与元认知
    audience: 教师/设计层
    headline: 流畅错觉：答案摊在眼前时人人觉得会了——「看着眼熟」是被实验证伪的掌握指标
    headline_kid: 课文打开看着都懂，一合上就想不起来——「看着眼熟」不算会。能不能在看不见答案的时候自己想起来，那才算数。
    claim:
      type: tendency
      statement: 学习者判断「学会了吗」时答案正摊在眼前，在场答案抬高感知到的联结（后验联想），而测验成绩取决于线索单独出现时能否引出目标（先验联想）——判断依据与成绩依据脱钩，高估由此产生（预见偏差）。重读抬高流畅感，流畅感被误读为掌握，导致过早停学与时间错配。
      evidence:
        - "Koriat & Bjork (2005), JEP:LMC 31(2): 187–194（一手词对实验）"
        - "Koriat & Bjork (2006), Memory & Cognition 34(5): 959–972（补救研究，五个实验）"
      scope: 证据为成人词对实验；儿童元认知更不成熟，错觉预计只强不弱，但无儿童定量数据，不作数值外推。
      exceptions:
        - 经验型去偏差（多经历几次测验）只修好当次判断；理论型去偏差（讲清偏差原理）才迁移到新材料。
    mechanism:
      - beat: 预见偏差
        text_kid: 课文打开看着都懂，一合上就想不起来——「看着眼熟」不算会。
        text_adult: 掌握判定必须以遮住答案后的提取成败为准；任何「看着卡片自评会不会」「跟读完就算过」的交互都在生产预见偏差。补救：先遮住答案尝试提取，或把自我判断推迟到学习之后。
        visual: 答案在场 vs 遮住答案两种判定方式对照
        anchors: []
    examples:
      - level: 1
        word_ids: [G2_0492]
        form: "反复重读组对一周后表现的预测高于测验组，实际成绩却更低（见 LS-02）"
        scene_note: 清单原文的行为后果例
        supports: claim
    error_cases:
      - wrong: 用「看着眼熟/自评会了」作为掌握判定与过关标准
        right: 掌握判定以遮住答案后的提取成败为准
        error_type: 教学设计误用
        source_type: 条目成人层登记
        diagnosis: 回指 claim——流畅感是被实验证伪的掌握指标。
    relatives:
      - {id: LS-02, rel: 同族}
      - {id: LS-08, rel: 同族}
    quiz:
      - q: 哪种判定方式不受预见偏差污染？
        options: [看卡片自评, 跟读后自评, 遮住答案提取, 看完立刻判断]
        answer: 遮住答案提取
        hint_on_wrong: 回机制小节「预见偏差」
    probes: []
    prereq: [LS-08]
    order: 9
    pain_points: []
    adult:
      sources:
        - "Koriat & Bjork (2005), JEP:LMC 31(2): 187–194, DOI 10.1037/0278-7393.31.2.187；Koriat & Bjork (2006), Memory & Cognition 34(5): 959–972"
      boundary: 成人词对实验；不作儿童数值外推。
      disputes: 无主流分歧；细部争论在去偏差的可迁移性。
      evidence_grade: 一手实验核实
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
      - {date: 2026-11-01, change: 由清单 v6 转化入模（F2 波次）, basis: 清单 v6 LS-09}

  - id: LS-10
    zone: 支撑层
    group: LS
    subgroup: 合意困难与元认知
    audience: 教师/设计层
    headline: 交错练习：把不同题型打散混着练，当下更慢更错，日后测验却赢一大截——练的其实是「先选对方法」
    headline_kid: 别把同一类题一口气做完——几类题混着来，每道题先停一下想「这道该用哪一招」。练的时候会慢一点、错多一点，可过些天再考，混着练的记得牢得多。
    claim:
      type: tendency
      statement: 分组练习时排版已替学习者选好方法，只剩执行；交错把选择权还给学习者，每道题先辨别题型、再选方法，「辨别—选择」本身被反复练到，增益主要来自题与方法配对变准。交错在练习期更慢更错，延迟测验却胜出，与 LS-09 流畅错觉互为镜像。
      evidence:
        - "Rohrer & Taylor (2007), Instructional Science 35(6): 481–498（大学生立体体积题：延迟测验交错 63% vs 分组 20%，d = 1.34）"
        - "Taylor & Rohrer (2010), Applied Cognitive Psychology 24(6): 837–848（四年级儿童，固定间隔下交错仍使一天后成绩翻倍）"
        - "Rohrer, Dedrick & Stershic (2015), JEP（七年级真实课堂 3 个月，d = 0.42/0.79）"
      scope: 直接证据集中在数学；英语侧（句型、词义类别混练）的直接证据仍少，App 用于英语编排属机制迁移。交错要求学习者对各类别已有最低限度认识。
      exceptions:
        - 归属更正（清单已登记）：「七年级真实课堂 d ≈ 1.05」常被误记在 Rohrer & Taylor (2007) 名下——2007 是大学生实验，七年级课堂是 2015 年另一篇，引用不得混搭。
        - 零基础时先给少量分组示范或范例（见 LS-14）再交错。
    mechanism:
      - beat: 辨别—选择
        text_kid: 别把同一类题一口气做完——几类题混着来，每道题先停一下想「这道该用哪一招」。
        text_adult: 错误分析显示增益来自题—方法配对而非计算变快；同类题被天然拉开间隔（与 LS-06 叠加）。练习期表现与学习效果反转（交错 60% vs 分组 89%）是「当下表现 ≠ 学习效果」的教科书数据。
        visual: 分组 vs 交错的题序编排对照
        anchors: []
    examples:
      - level: 1
        word_ids: [V6_学校_38]
        form: "四种立体体积题的分组/交错编排对照（Rohrer & Taylor 2007）"
        scene_note: 清单原文实验材料
        supports: claim
    error_cases:
      - wrong: 引用「Rohrer & Taylor (2007) 七年级课堂 d ≈ 1.05」
        right: 2007 为大学生实验（延迟 d = 1.34；d ≈ 1.06 是练习期表现受损、方向相反）；七年级课堂为 Rohrer et al. (2015)（d = 0.42/0.79）
        error_type: 出处归属错误
        source_type: 条目成人层登记（清单更正登记）
        diagnosis: 回指 exceptions 的归属更正。
    relatives:
      - {id: LS-06, rel: 同族}
      - {id: LS-08, rel: 同族}
      - {id: LS-14, rel: 对照}
    quiz:
      - q: 交错练习的增益主要来自哪一步变准？
        options: [计算速度, 题与方法配对, 记忆容量, 书写速度]
        answer: 题与方法配对
        hint_on_wrong: 回机制小节「辨别—选择」
    probes: []
    prereq: [LS-06]
    order: 10
    pain_points: []
    adult:
      sources:
        - "Rohrer & Taylor (2007), Instructional Science 35(6): 481–498；Taylor & Rohrer (2010), ACP 24(6): 837–848, DOI 10.1002/acp.1598；Rohrer, Dedrick & Stershic (2015), JEP, DOI 10.1037/edu0000001"
      boundary: 数学直接证据为主；英语应用属机制迁移；须先有最低限度类别认识。
      disputes: 交错增益中有多少是附带间隔效应未完全平息；Taylor & Rohrer (2010) 固定间隔设计分离后结论为交错有独立贡献。Dunlosky (2013) 只给中效用评级（见 LS-01）。
      evidence_grade: 一手实验核实（含归属更正）
      pending: []
    status: 入模中
    version: "1.0"
    changelog:
