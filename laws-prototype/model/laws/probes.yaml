  remedy: 回闭环第 2 步机制屏，重看 S-36 菜单的边界注「ea 的另一面」与 S-42 变脸榜 ea 组（eat/head/great/heart 四读对照），再做第 4 步分级例中 ea 词的分组例。
  source_of_prediction: S-36 边界①（ea 另有 /e/ 与 /eɪ/ 两面，本条只是主场）
  status: 已入模
  version: '1'
