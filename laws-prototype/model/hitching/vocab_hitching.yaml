# ===== has_polysemy 应标清单（W2 盘点） =====
# 口径：V 组条目实际展开多义网络/同形异义/语义韵/双尺讨论的词。
# 处置分三类：mark（应标 true）、review（同形异源，不走多义标，须双条或义项分源登记）、keep（词库已标）。
polysemy_marks:
  - word: run
    bank_id: G2_087
    action: mark
    reason: V-41/V-45 核心例：义项切分与双尺全条展开；词库现未标
  - word: get
    bank_id: V6_日常_0
    action: mark
    reason: 五构造即多义枢纽（CO-17 立条，V-40 亲戚）；词库现未标
  - word: take
    bank_id: V6_日常_6
    action: mark
    reason: V-40 反向打包：一词分管拿/带走/坐车/吃药/拍照
  - word: hold
    bank_id: V6_日常_44
    action: mark
    reason: V-42 实验词：多义引申网络全条展开
  - word: keep
    bank_id: G4_0802
    action: mark
    reason: V-42 实验词
  - word: bank
    bank_id: G5_0987
    action: review
    reason: 同形异义（两源汇流），不是多义——应分源登记，不标 has_polysemy
  - word: light
    bank_id: G4_157
    action: review
    reason: 同形异源两棵树（VF-003 已拆分）：词库现以 POLY 条处理，两源不得以单条多义标混同
  - word: eye
    bank_id: G1_009
    action: mark
    reason: V-16/V-41 多义链：眼睛→针眼/芽眼
  - word: cause
    bank_id: ADD_0442
    action: mark
    reason: V-43：语义韵附着于其搭配义项分布，补词入后应标
  - word: set
    bank_id: ADD_0635
    action: mark
    reason: 多义高频动词；Sinclair set in 观察（V-43）涉及其短语义项
  - word: watch
    bank_id: POLY_WATCH
    action: keep
    reason: 词库已标（POLY_WATCH）
  - word: turn
    bank_id: POLY_TURN
    action: keep
    reason: 词库已标（POLY_TURN）
  - word: play
    bank_id: G2_0489
    action: keep
    reason: 词库已标
  - word: book
    bank_id: G1_002
    action: keep
    reason: 词库已标
  - word: fly
    bank_id: G2_084
    action: keep
    reason: 词库已标；另注意 butterfly 命名动机无定论与多义无关
  - word: draw
    bank_id: G3_0790
    action: keep
    reason: draw the drapes 字面化（V-44）；词库已标 has_polysemy

