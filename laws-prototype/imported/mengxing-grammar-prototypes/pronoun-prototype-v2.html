<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1c2733;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}
header.top{padding:10px 2px 4px}

.card{background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:14px;margin-top:12px}

s.old{color:#b03a3a;text-decoration-thickness:2px}

<script>
var GROUPS = [{"name": "第 1 组 · 代词到底是什么", "sub": "先别背表——先搞清代词在干什么活"}, {"name": "第 2 组 · 格：站在哪儿，穿哪件", "sub": "全家福总表在这一条里"}, {"name": "第 3 组 · 指人的边界和礼貌", "sub": "we 包不包你、礼貌住哪儿、天气里的 it"}, {"name": "第 4 组 · 中国孩子的三个坑", "sub": "漏主语、there be 滥用、he/she 说混——都是有原因的"}, {"name": "第 5 组 · 写作文时怎么指人", "sub": "用代词还是说全名，看「清不清楚」定价"}, {"name": "第 6 组 · 一家子的其他成员（新拟）", "sub": "物主、反身、指示、不定四家——目录暂无定版，按业界共识补成新拟条（NEW-P1～NEW-P4）"}];
var LAWS = [{"id": "PR-01", "short": "代词先讲关系，再讲代替", "desc": "选哪个代词，先是在告诉大家：谁在说话、谁在听、谁和谁是一伙的。", "formal": "代词首先是「关系词」，不是「代替名词的词」", "kid": "代词不只是替名字省事的词——你选哪个代词，就在告诉大家「我和你是什么关系、谁和谁是一伙的」。", "claim": "传统语法把代词定义为「代替名词的词」（回指功能），顺序应当倒过来：指人表达的首要工作是个人指示、社会指示与身份建构——大多数语言里「指人的表达都包含对特定社会关系的指涉」，性别、等级、亲疏被直接编进代词系统。", "beats": [{"name": "先关系后代替", "text": "说 I、you、we 的时候，你不只是在指人，还在说清「谁跟谁是一伙的、谁在说话、谁在听」。"}, {"name": "英语里藏得深", "text": "英语的代词个子小，关系藏得深：一个 we，就能把全班说成一伙的。"}, {"name": "代替只是顺带", "text": "当然，代词也能回头指刚提过的人（Tom is here. He is my friend.）——但那是第二份工作。先把关系说清，代替自然水到渠成。"}], "examples": [{"s": "We are friends.", "note": "we 把说话人和伙伴说成一伙"}, {"s": "You are my friend.", "note": "you 与 my 同时标出关系双方"}, {"s": "They are my friends.", "note": "they 把第三方划成另一组"}, {"s": "We are classmates.", "note": "同班即共同体——学校场景"}, {"s": "Miss Li is our teacher. She is kind.", "note": "回头指刚提过的人 — 新拟例句"}, {"s": "Let us play together. We are a team.", "note": "us/we 把大家说成一伙 — 新拟例句"}], "errors": [{"wrong": "They are my class.（介绍自己班时把自己划了出去）", "right": "We are Class Two.", "type": "代词关系义忽视（语用层）", "diag": "新拟例句（目录只登记错型，未给逐字句）：说自己所在的集体要用 we 把自己包进去，才是「一伙的」；they 是把人划到另一边。"}, {"wrong": "Tom is my friend. Tom is tall. Tom plays football.", "right": "Tom is my friend. He is tall. He plays football.", "type": "全程不用代词（指称重复）", "diag": "新拟例句：名字连说三遍，既累赘也显得生分；第二次起用 he 接上。"}], "quiz": [{"q": "老师说「We are a team」时，we 除了指人，还在做什么？", "ans": "把大家说成一伙（建构共同体）", "hint": null}, {"q": "「We are a team」和「They are a team」，说话人把自己放在哪一边？", "ans": "We 把自己和听者说成一伙；They 把那群人划在外面", "hint": "回到机制第 1 节「先关系后代替」"}], "groups": [{"title": "🧩 分组看看：代词先干的两份工作", "items": [{"name": "定关系", "gloss": "先说清谁跟谁是一伙、谁说谁听", "ex": "We are friends."}, {"name": "再代替", "gloss": "关系定了，回头指人时用代词省力", "ex": "Tom is here. He is happy."}]}], "note": null, "group": 0}, {"id": "PR-02", "short": "I 永远是「正在说话的人」", "desc": "同一句 I am happy，老师说指老师，你说指你——I 跟着说话的人跑，谁说谁负责。", "formal": "「我」是把自己钉在此时此地、并为这句话担责的词", "kid": "说 I 的人永远是「正在说话的这个人」——话一换人说，I 指的人就跟着换；谁说 I，谁就为这句话负责。", "claim": "第一人称是典型的换位词（shifter）：所指随言语事件本身移动；I 把说话者「系在时空之中，并标明谁是这句话及其后果的负责人」——自我同时被定位为有身体的个体（数量同一性）与社会中的人（性质同一性），代词系统是第二种定位的语法工具。", "beats": [{"name": "换位", "text": "老师说 I，是老师；你说 I，就是你——I 永远跟着正在说话的人跑。"}, {"name": "担责与正迁移", "text": "汉语的「我」也是一样换来换去，这一条不用重新学；要记的是英语的 I 永远大写、每句都要站出来（见 PR-08）。"}, {"name": "换位怎么练", "text": "I 和 you 是一对跷跷板：谁开口，谁就是 I；听的人就是 you。角色互换游戏（你问我答再交换）练的就是这块「换位肌肉」。"}], "examples": [{"s": "I am a teacher.", "note": "老师说 I——指说话人自己"}, {"s": "I am a student.", "note": "换学生说 I——指的人立刻换了"}, {"s": "You are my friend.", "note": "you 指向听者——换位词的对偶面"}, {"s": "I am happy.", "note": "谁说 I，谁为这句「开心」担责（陈述归属）"}, {"s": "I am Tom. You are Ann.", "note": "自我介绍时 I 和 you 各就各位 — 新拟例句"}, {"s": "Are you OK? — Yes, I am fine.", "note": "问句里的 you，答句里换成 I — 新拟例句"}], "errors": [{"wrong": "You want juice.（妈妈问「Do you want juice?」，孩子照着回声答）", "right": "I want juice.", "type": "I/you 换位混淆（幼儿专名化误用）", "diag": "新拟例句（目录只登记错型）：低龄孩子常把大人嘴里的 you 当成自己的名字——换位词的规矩是「谁说谁变」：话从我嘴里出来，主角就要换成 I。"}, {"wrong": "I am juice.（想说「我要果汁」）", "right": "I want juice.", "type": "I/you 换位未完成（回声式应答）", "diag": "新拟例句：幼儿把妈妈问句里的词整块搬来，I/you 没换位。"}], "quiz": [{"q": "同一句话「I am happy」，老师说和你说，I 指的人一样吗？", "ans": "不一样，I 永远指正在说话的人", "hint": null}, {"q": "妈妈问「Do you want milk?」，你想喝，应该回答 I want 还是 You want？", "ans": "I want milk.（开口的人是 I）", "hint": "回到机制第 1 节「换位」"}], "groups": [{"title": "🧩 分组看看：一问一答里的换位", "items": [{"name": "问的人", "gloss": "提问时对方是 you", "ex": "Do you like apples?"}, {"name": "答的人", "gloss": "一开口，答的人变 I", "ex": "Yes, I do."}]}], "note": null, "group": 0}, {"id": "PR-05", "short": "英语的人称是「素颜版」", "desc": "别家语言花样很多：双人称、敬称、分包不包你；英语只留最素的一套，性别只露一下面。", "formal": "「人称」是一个范畴家族，不是一张三行表——英语的系统是「素颜版」", "kid": "全世界的语言给「人」分队的方法五花八门；英语是最简单的一版：不分双数、不分包不包你，性别只在第三人称单数露一下面。", "claim": "人称系统的可能维度至少包括：人称（1/2/3，可再分）、数（含双数、三数）、包容/排斥、性别（在许多语言受人称层级制约，常只出现在第三人称）、敬称；英语的实现恰是其中最朴素的一种：无人称内对立的包容区分、无双数、性别只在第三人称单数、格只剩代词内部残留。", "beats": [{"name": "家族全景", "text": "有的语言有「双人的我们」，有的有「皇家我们」；英语没有这些格子，先知道世界上还有别的排法。"}, {"name": "英语的留白清单", "text": "英语缺的格子：双数、包不包你、敬称、代词里的性别（只有他/她露面）。"}, {"name": "素颜的好处", "text": "格子少也有红利：英语不用分「咱/我们」、不用双数三数，第三人称之外也不用分男女——省下的力气，花在格和指代上。"}], "examples": [{"s": "He is a boy. She is a girl.", "note": "性别只在第三人称单数露面——系统的唯一性别格"}, {"s": "It is a dog.", "note": "非人用 it——第三人称的另一格"}, {"s": "They are my friends.", "note": "复数不分性别——they 通吃"}, {"s": "We are students.", "note": "we 不分包容/排斥——留白格的实例"}, {"s": "We are girls. We are friends.", "note": "we 不分性别、不分包容排斥 — 新拟例句"}, {"s": "It is my cat. It is cute.", "note": "动物常用 it — 新拟例句"}], "errors": [{"wrong": "Miss Li is our teacher. He is very kind.", "right": "Miss Li is our teacher. She is very kind.", "type": "性别格误选（背景条目补配病例）", "diag": "新拟例句（目录原登记为类型学背景条目、无对应病例型，此句为原型补配）：英语的格子再少，第三人称单数的 he/she 也不能混——选错格就指错了人。（口头说混的加工问题另见 PR-11。）"}, {"wrong": "My grandfather is old. She is 80.", "right": "My grandfather is old. He is 80.", "type": "第三人称性别误选", "diag": "新拟例句：性别只在第三人称单数露面，正是 PR-11 的高发点。"}], "quiz": [{"q": "英语的代词里，性别在哪儿露面？", "ans": "只在第三人称单数（he/she）", "hint": null}, {"q": "英语的「我们」分不分「包括你」和「不包括你」？", "ans": "不分，都用 we，靠语境猜（见 PR-03）", "hint": "回到机制第 2 节「留白清单」"}], "groups": [{"title": "🧩 分组看看：英语有 / 没有的格子", "items": [{"name": "英语有的", "gloss": "第一、第二、第三人称，单数和复数——最基础的排法", "ex": "We are students."}, {"name": "只露一下面的", "gloss": "性别只在第三人称单数出现，复数 they 不分男女", "ex": "He is a boy. She is a girl. They are my friends."}, {"name": "英语没有的", "gloss": "双数（两个人的「我们」）、包不包你、敬称（您）——这些格子英语直接留白", "ex": "It is a dog.（不是人，用 it）"}]}], "note": null, "group": 0}, {"id": "PR-07", "short": "英语的代词一个都不能少", "desc": "有些语言看动词就知道是谁在做，英语动词几乎不留记号，所以主语代词必须站出来。", "formal": "有的语言把「人」长在动词上——英语把这套拆了，所以代词必须出场", "kid": "有些语言看动词就知道是谁在做，英语的动词几乎不留记号——所以英语的句子里，I、you、he 一个都不能缺席。", "claim": "人称标记在语言中有两处住所：独立代词与动词上的一致标记（附着/词缀形式）；许多语言（西班牙语、意大利语）靠动词一致即可省代词（pro-drop）；英语在历史上把动词一致磨得只剩三单 -s 一处残迹，于是主语代词成了义务出场——这是系统配置问题，不是英语「啰嗦」。", "beats": [{"name": "两处住所", "text": "「谁在做」这件事，有的语言写在动词身上，有的写在单独的小词上；英语写在小词上，所以小词不能丢。"}, {"name": "虚主语的伏笔", "text": "（教师侧）英语连「没有谁在做」的句子都要放个 it 占位——占位规则见 PR-08/PR-10。"}, {"name": "省略的代价", "text": "省掉主语，句子就像没挂牌子的车——动词的 -s 还在，也救不回来。写句子的第一步永远是：先摆主语，再上动词。"}], "examples": [{"s": "He swims.", "note": "he 义务出场，动词只剩 -s 一点痕迹"}, {"s": "She reads.", "note": "同型：主语不可省"}, {"s": "It rains.", "note": "无「做者」也须占位——虚主语伏笔（机制见 PR-10）"}, {"s": "They play football.", "note": "复数主语同样义务出场"}, {"s": "It is cold today.", "note": "没话题可摆时 it 占位 — 新拟例句"}, {"s": "We have English on Mondays.", "note": "主语在岗 — 新拟例句"}], "errors": [{"wrong": "Swims on Sundays.（说「他星期天游泳」时把主语省了）", "right": "He swims on Sundays.", "type": "主语省略（跨条共因，见 PR-08）", "diag": "新拟例句（目录只登记错型）：英语动词身上没有「谁在做」的记号，省掉主语，听者就不知道是谁——主语代词必须出场。"}, {"wrong": "Plays football every Sunday.（说「他每周日踢球」时）", "right": "He plays football every Sunday.", "type": "主语省略（动词残迹误当主语）", "diag": "新拟例句：英语动词上只剩 -s 一点残迹，撑不起省主语。"}], "quiz": [{"q": "英语句子里主语代词为什么不能像西班牙语那样省掉？", "ans": "英语动词上几乎没有「谁在做」的记号，只能靠代词", "hint": null}, {"q": "为什么西班牙语能省主语、英语不能？", "ans": "西班牙语动词变化能标出人称，英语只剩三单 -s，信息不够", "hint": "回到机制第 1 节「两处住所」"}], "groups": [{"title": "🧩 分组看看：人称标记的两处住所", "items": [{"name": "独立代词", "gloss": "I/he/she 站在动词前", "ex": "She reads."}, {"name": "动词一致", "gloss": "英语只剩三单 -s 一处残迹", "ex": "He swims."}]}], "note": null, "group": 0}, {"id": "GR-14", "short": "站哪儿，穿哪件衣裳", "desc": "当主角穿主格，跟在动词、介词后面穿宾格；「太讲究」也会穿错。", "formal": "代词的格跟着位置走：主语位用主格、宾语位用宾格，「讲究过头」也会错", "kid": "I 和 me 是同一个人穿的两件衣裳：站在句子开头当主角穿 I，跟在动词和介词后面穿 me；穿错或「太讲究」穿错，都是错", "claim": "英语代词格是位置性标记——格由成分在句中的句法位置决定而非语义角色：主语位用主格，动词与介词后的宾语位用宾格。between you and I 这类错误是把礼貌/正式感误加到宾语位上的过度矫正。", "beats": [{"name": "位置决定穿哪件", "text": "代词站在哪儿，就穿哪件衣裳：站到句子前面当主角，穿主格；跟在动词、介词后面，穿宾格。跟它「是谁」没关系，跟它「站哪儿」有关系。"}, {"name": "讲究过头也会错", "text": "有人觉得 me 不够体面，在 between you and ___ 里也塞一个 I——体面塞错了位置，反而成了错。"}, {"name": "一招验格", "text": "拿不准用主格还是宾格时，把搭档拆掉单独念：between you and me → 拆开是 between me，一听就顺。介词后面永远是宾语位。"}], "examples": [{"s": "He and I are friends.", "note": "主语位并列：两个人都穿主格（另有「you 先人后」的礼貌顺序与之配套）"}, {"s": "She gave the book to him.", "note": "介词 to 后面：him 穿宾格"}, {"s": "Come with me, please.", "note": "介词 with 后面：me 穿宾格"}, {"s": "They play with us.", "note": "动词短语后面：us 穿宾格"}, {"s": "Look at me!", "note": "介词 at 后面用宾格 — 新拟例句"}, {"s": "We are in Class One.", "note": "句首主语位用主格 We — 新拟例句"}], "errors": [{"wrong": "between you and I", "right": "between you and me", "type": "过度矫正-格", "diag": "清单条目登记：母语者语料中 between you and I 稳定出现，是把礼貌/正式感误加到宾语位的过度矫正。回补机制第 1 节：格跟着位置走。"}, {"wrong": "Me and Tom are friends.", "right": "Tom and I are friends.", "type": "主语位误用宾格（口语迁移）", "diag": "新拟例句：主语位穿主格；把 Tom 拆掉念「Me am」立刻露馅。"}], "quiz": [{"q": "between you and ___ A. I B. me", "ans": "B. me——介词后面是宾语位，穿宾格。", "hint": "回到机制第 1 节「位置决定穿哪件」。"}, {"q": "「___ and she are in the garden.」A. He B. Him", "ans": "A. He（主语位用主格）", "hint": "回到机制第 1 节「位置决定穿哪件」"}], "groups": [{"title": "🧩 全家福：主格 ↔ 宾格配对（点开每对看例句在下方例句区）", "items": [{"name": "I ↔ me", "gloss": "「我」：站前面穿 I，跟在后面穿 me", "ex": "I am happy. / Come with me."}, {"name": "you ↔ you", "gloss": "「你」：两件衣裳长得一样，不用纠结", "ex": "You are my friend. / I like you."}, {"name": "he ↔ him", "gloss": "「他」：主格 he，宾格 him", "ex": "He and I are friends. / She gave the book to him.（him 是「他」）"}, {"name": "she ↔ her", "gloss": "「她」：主格 she，宾格 her", "ex": "She is a teacher. / I don't know her."}, {"name": "it ↔ it", "gloss": "「它」：主宾同形", "ex": "It is a dog. / What's wrong with it?"}, {"name": "we ↔ us", "gloss": "「我们」：主格 we，宾格 us", "ex": "We are classmates. / They play with us."}, {"name": "they ↔ them", "gloss": "「他们」：主格 they，宾格 them", "ex": "They are my friends. / I like them."}]}], "note": "坊间口诀（呈现层，非目录原文）：主格动词前做主，动词介词后宾格；you 和 it 主宾同，其他主宾须分清。物主代词（my/mine）、反身代词（myself）、指示代词（this/that）、不定代词（someone）四家已在第 6 组补成新拟规律 NEW-P1～NEW-P4（编号待与目录对账）。", "group": 1}, {"id": "PR-03", "short": "we 滑溜溜：包不包你靠猜", "desc": "老师说 we，有时候有你、有时候没你——听到先找一找，自己在不在里面。", "formal": "we 是最「滑」的代词：包不包你，要靠听者自己猜", "kid": "英语的 we 有时候把听的人算在里面，有时候不算——听到 we，要先想一想「这里面有没有我」。", "claim": "许多语言把「包括听者的我们」与「排除听者的我们」做成两个词（包容式/排斥式对立），英语不做这个区分，于是 we 的边界永远要靠语境裁定；we 至少向听者发出一个邀请——「请你想一想，除了我之外还指谁」，同时是一种「同说」行为：把同一命题一次性套到包括自己在内的一群人头上，共同体就此被说出来。", "beats": [{"name": "边界靠猜", "text": "老师说 We have a test today——有你；老师对另一个老师说 We have a meeting——可能没你。听到 we 先找一找自己在不在里面。"}, {"name": "汉语的对照", "text": "汉语有「咱们」帮忙（咱们 = 一定有你），可普通话里也不常用——多半还是靠听懂场合。"}, {"name": "听 we 先问一句", "text": "听到 we 先在心里补问：「把我算进去了吗？」老师说 We have a test 是「你们要考试」，妈妈对同事说的 we 又是另一伙人——答案在场合里，不在词里。"}], "examples": [{"s": "We play in the park.", "note": "包容式情境：说话人与小伙伴一起玩（含听者）"}, {"s": "We are friends.", "note": "对听者说——we 把听者包进来"}, {"s": "We are classmates.", "note": "班级共同体——we 的「同说」建构"}, {"s": "We study English.", "note": "课堂语境中的包容读法"}, {"s": "We have a test today, children.", "note": "老师的 we = 你们（不包括老师）— 新拟例句"}, {"s": "Let us go to the park. We can play there.", "note": "说话人把听者拉进 we — 新拟例句"}], "errors": [{"wrong": "I have a meeting, too!（老师对家长说「We have a meeting」，孩子抢着把自己算进 we）", "right": "The teachers have a meeting.（这个 we 只包老师们，孩子不在里面）", "type": "we 边界误判（语用理解型）", "diag": "新拟例句（目录只登记错型）：听到 we 先别急着对号入座——先找一找：说话的人把我算进去了吗？"}, {"wrong": "We will have a meeting.（孩子把老师对家长说的 we 原样转告）", "right": "The teacher said the parents will have a meeting.", "type": "we 边界转述失真", "diag": "新拟例句：转述时 we 的边界会跟着说话人变，要换算。"}], "quiz": [{"q": "老师对全班说「We have English today」，这个 we 包括你吗？", "ans": "包括（对全班说的）", "hint": null}, {"q": "爸爸对同事说「We are busy today」，这个 we 包括正在听电话的你吗？", "ans": "不包括——那是爸爸和同事那一伙", "hint": "回到机制第 1 节「边界靠猜」"}], "groups": [{"title": "🧩 分组看看：we 的两种读法", "items": [{"name": "包你进来", "gloss": "对着你们说、把大家说成一伙的时候，we 里有你", "ex": "We have English today.（老师对全班说）"}, {"name": "不包你", "gloss": "说的是「我们那边的事」，你只是听众", "ex": "We have a meeting.（老师对另一位老师说）"}]}], "note": null, "group": 2}, {"id": "PR-04", "short": "英语的礼貌搬家了", "desc": "对老师也说 you，一点没错：礼貌不住在代词里，搬去了 please、称呼和 Could you 里。", "formal": "礼貌和亲疏本来住在代词里——英语把这套系统拆了，礼貌搬了家", "kid": "以前的英语也有「您」和「你」的分工，后来只剩一个 you——所以英语的礼貌不在代词里，要靠别的说法（称呼、语气、绕个弯）来补。", "claim": "欧洲语言史上，第二人称的 T/V 对立是权力与亲疏的语法化编码；英语在近代丢失 thou/you 对立后，礼貌功能整体迁出代词系统，改由称呼语、情态与间接言语行为承担——对老师说 you 完全正确，礼貌靠 Please / Mr. / Ms. / Could you…? 补足。", "beats": [{"name": "礼貌搬家", "text": "英语里对老师也说 you，不是不礼貌——礼貌搬家了，住在 please、Mr.、Could you 这些说法里。"}, {"name": "汉语的对照", "text": "汉语的「您」是现成的概念，可惜英语没有对应的词——记住：不是所有概念都有现成的词来装。"}, {"name": "礼貌的新住址", "text": "you 对老师、校长、陌生人都照用；礼貌搬到了三个新地址：称呼（Mr./Ms.）、please、和 Could you…? 的商量口气。把这三件配齐，比在代词上绕圈子管用。"}], "examples": [{"s": "Can you help me, please?", "note": "对老师也用 you，礼貌由 please 与问句形式承担"}, {"s": "You are my teacher.", "note": "you 对老师完全正确——结论层的正例"}, {"s": "Could you give me the money?", "note": "Could you…? 的间接请求——礼貌的现行住所"}, {"s": "You read English well.", "note": "日常陈述中的 you——无亲疏标记"}, {"s": "Ms. Wang, could you help me, please?", "note": "称呼 + Could you + please，三件齐全 — 新拟例句"}, {"s": "Thank you, Mr. Li.", "note": "对老师直接用 you 完全正确 — 新拟例句"}], "errors": [{"wrong": "Miss Li, can Miss Li help me?（对老师说话时绕开 you 不用）", "right": "Miss Li, can you help me, please?", "type": "对师长避用 you（母语敬称迁移型语用失误）", "diag": "新拟例句（目录只登记错型）：孩子在等一个「您」来用，可英语没有这个词——you 对老师照样正确，礼貌由称呼和 please 补上。"}, {"wrong": "Teacher, teacher can help me?（用职业名顶替 you）", "right": "Miss Li, can you help me, please?", "type": "称呼顶替代词（敬称迁移）", "diag": "新拟例句：礼貌靠称呼和 please，不用绕开 you。"}], "quiz": [{"q": "对老师说话，英语的礼貌主要靠什么补？", "ans": "称呼、please、Could you 这类说法", "hint": null}, {"q": "想请老师帮忙，哪句最有礼貌？A. You help me! B. Could you help me, please?", "ans": "B", "hint": "回到机制第 1 节「礼貌搬家」"}], "groups": [{"title": "🧩 分组看看：礼貌的三个新地址", "items": [{"name": "称呼", "gloss": "Mr. / Ms. + 姓", "ex": "Good morning, Ms. Wang."}, {"name": "please", "gloss": "句尾加一块软垫", "ex": "Sit down, please."}, {"name": "商量口气", "gloss": "Could you…? 把命令变请求", "ex": "Could you open the door, please?"}]}], "note": null, "group": 2}, {"id": "PR-10", "short": "天气里的 it 指整个场面", "desc": "It is raining 的 it 不是凑数的假主语：它指周围整个场面——整个世界都在下雨。", "formal": "天气 it 指的是「整个环境」——一条没有共识、但有主读法的边界", "kid": "It is raining 里的 it 不是「凑数的假主语」——它指的是整个天气、整个场面：整个世界都在下雨。", "claim": "天气与环境陈述中的 it「指周围的整体环境」，并非毫无语义的凑数主语——指称沿一条由具体到全域的斜坡渐变，天气 it 处在「全域指称」的端点；但语义学界对它的记账至今分立两派，本条只立教学主读法（Bolinger 线），学术登记保留 Quirk 的虚指说并列。", "beats": [{"name": "全域指称", "text": "下雨的时候，不是某一块地方在下，是你周围的整个世界都在下——it 就管这个「整个场面」。"}, {"name": "两派并列", "text": "（教师侧）大学者们对这个问题有两种说法——本课用「环境说」讲给孩子，对立说法登记在成人层，不打架。"}, {"name": "哪些 it 是这一家", "text": "天气、时间、距离、温度，说的都是「整个场面怎么样」：It is Monday. It is far. 它们和天气 it 是同一家——指的不是某个东西，是整个局面。"}], "examples": [{"s": "It is raining.", "note": "环境 it 本景：整个场面在下雨"}, {"s": "It is sunny today.", "note": "天气陈述同型"}, {"s": "It is a new month.", "note": "时间环境陈述——渐变带向时间域的延伸"}, {"s": "It is hot. The sun is big.", "note": "对照：环境 it 与具体指称 the sun 分工"}, {"s": "It is Monday today.", "note": "日子也是整个场面 — 新拟例句"}, {"s": "It is far from here to the zoo.", "note": "距离同样用场面 it — 新拟例句"}], "errors": [{"wrong": "Is sunny today.", "right": "It is sunny today.", "type": "环境 it 省略（与 PR-08 漏主语共因）", "diag": "新拟例句（目录只登记错型）：环境 it 指整个场面，不是可有可无的凑数词——省了它，句子开头就没有「占位的人」；下面的动画演示里能看到它管多大一片。"}, {"wrong": "Is very hot today.", "right": "It is very hot today.", "type": "环境 it 省略", "diag": "新拟例句：场面 it 是占位负责人，省了句子就散架（与 PR-08 同源）。"}], "quiz": [{"q": "按本课的讲法，It is raining 里的 it 指的是？", "ans": "周围的整个环境、整个场面", "hint": null}, {"q": "「It is winter now」里的 it 指什么？", "ans": "指整个季节/环境场面，不是某个具体东西", "hint": "回到机制第 1 节「全域指称」"}], "groups": [{"title": "🧩 分组看看：场面 it 的一家子", "items": [{"name": "天气", "gloss": "下雨、晴天、冷热", "ex": "It is raining."}, {"name": "时间日子", "gloss": "几点、星期几、季节", "ex": "It is Monday."}, {"name": "距离", "gloss": "远还是近", "ex": "It is far."}]}], "note": null, "group": 2}, {"id": "PR-08", "short": "英语每句都要先摆主语", "desc": "汉语可以接着话题一路往下说，英语不行：每句先摆主语，没人可摆也要摆个 it 占位。", "formal": "中国孩子漏主语的总根源：汉语先说「话题」，英语先摆「主语」", "kid": "汉语说话先摆出「说的是什么事」，后面的句子可以接着往下说；英语每句都要先摆一个主语，哪怕是凑数的 it、there，也得摆上。", "claim": "汉语是话题突出型语言：句子围绕话题组织，话题一旦立住，后续小句可以在话题链中零指称地一路说下去；英语是主语突出型：每个小句必须有语法主语，无话题可立时也要用 it/there 占位。学习者把话题链带进英语，漏主语便成系统性现象，而非粗心。", "beats": [{"name": "话题链 vs 主语链", "text": "汉语像接龙：第一个人把话题摆好，后面的人接着说，不用每句重摆；英语像排队点名：每句都要先报一个主语的名字。"}, {"name": "纠错的抓手", "text": "写完一句英语，先回头点名：这句的主语是谁？找不到，就补一个（天冷了 → It is cold）。"}, {"name": "堵漏的顺序", "text": "改作文时按「先摆主语」一条线扫：每个小句先找主语，找不到就补 it、there 或人。话题可以留在心里，句子表面必须先挂主语牌。"}], "examples": [{"s": "It is raining.", "note": "天气句必须 it 占位——汉语「下雨了」无对应主语"}, {"s": "It is sunny today.", "note": "同型占位"}, {"s": "He studies English.", "note": "话题链第二句位：英语仍须重摆主语 he"}, {"s": "It is fun to play football.", "note": "it 占位 + 真主语后置的入门形态"}, {"s": "There is a cat under the tree.", "note": "先摆话题时用 there 占位 — 新拟例句"}, {"s": "It is time for lunch.", "note": "it 摆位再展开 — 新拟例句"}], "errors": [{"wrong": "Very cold today.（照汉语「今天很冷」直译，主语没了）", "right": "It is very cold today.", "type": "漏主语（话题链迁移型）", "diag": "新拟例句（目录只登记错型）：汉语立住话题就能顺着往下说，英语每句都要先摆主语——天气句没人可摆，就派 it 来占位。"}, {"wrong": "In the garden has a dog.（照汉语话题链直译）", "right": "There is a dog in the garden.", "type": "话题链直译（地点顶替主语）", "diag": "新拟例句：英语要先有主语或占位，再摆地点。"}], "quiz": [{"q": "「下雨了」说成英语要先补什么？", "ans": "补占位主语 It（It is raining）", "hint": null}, {"q": "「桌子上有一本书」最稳的英语起手式是什么？", "ans": "There is a book on the desk.（先占位，再摆话题）", "hint": "回到机制第 1 节"}], "groups": [{"title": "🧩 分组看看：两种摆法", "items": [{"name": "汉语：话题链", "gloss": "先把「说的事」摆好，后面接着说，不用每句重摆", "ex": "下雨了。（不用说谁）"}, {"name": "英语：主语链", "gloss": "每一句都要先报一个主语的名字，天气句用 it 占位", "ex": "It is raining. / It is sunny today."}]}], "note": null, "group": 3}, {"id": "PR-09", "short": "搬家连「摆法」一起搬", "desc": "把汉语「先摆话题」的习惯搬进英语，就会变成满篇 there be 开头、还冒出奇怪的被动句。", "formal": "迁移搬的是「功能」不只是「形式」：话题优先会变成 there be 滥用与伪被动", "kid": "学外语的时候，大脑会先把老家的「做事方法」搬过来——汉语习惯先摆话题，搬到英语里，就会变成爱用 there be 开头、或者造出奇怪的被动句。", "claim": "中国学习者把汉语的话题结构当成功能蓝图带进英语：需要「先摆出话题再展开」时，顺手抓英语现成的 there be 与主语提升构式来顶替（存现句滥用、外置句偏好、伪被动），表面形式是英语的，功能骨架是汉语的——迁移的单位是语篇组织功能，不是词形对应。", "beats": [{"name": "功能蓝图", "text": "搬家时搬的不只是家具，连房间的摆法一起搬——英语的词，汉语的话题摆法。"}, {"name": "化石化警讯", "text": "（教师侧）伪被动这类句子若长期不纠，会被大脑当成「就该这么说」固定下来。"}, {"name": "认得出才改得动", "text": "先学会认这三张面孔：there be 后面再塞动词、was happened 式伪被动、每段都用 there be 开头。认得出是哪种搬法，才知道把功能蓝图换成英语自己的摆法。"}], "examples": [{"s": "There is a book on the desk.", "note": "there be 的正位用法：存现句引介新信息（与滥用对照的基线）"}, {"s": "There is a dog in the garden.", "note": "同型存现"}, {"s": "It is fun to read this book.", "note": "外置句的正位用法——与学习者的话题偏好构式同形，须辨「合规外置」与「话题顶替」"}, {"s": "There is a ball under the desk.", "note": "方位存现——汉语「桌子下面有一个球」的合规对应"}, {"s": "A dog is running in the garden.", "note": "不用 there be 也能先摆话题：主语直接上 — 新拟例句"}, {"s": "The accident happened yesterday.", "note": "happen 没有被动 — 新拟例句"}], "errors": [{"wrong": "There is a dog is running in the garden.", "right": "A dog is running in the garden.", "type": "存现句滥用（there be 后面再塞动词）", "diag": "新拟例句（目录只登记错型）：there be 已经带了 is，后面再塞一个 is running，是把汉语「有一只狗在花园里跑」整句搬了过来——存现句只报「有」，要说动作就另起一句。"}, {"wrong": "The accident was happened yesterday.", "right": "The accident happened yesterday.", "type": "伪被动（话题功能顶替型）", "diag": "新拟例句（目录只登记错型）：happen 从来没有被动，「被发生」是话题摆法硬套出来的伪被动。"}], "quiz": [{"q": "中国学生爱用 there be 开头写作文，最深层的原因是？", "ans": "汉语的话题优先功能在找英语构式顶替", "hint": null}, {"q": "「There are many people are in the park」错在哪？", "ans": "there be 后面又塞了一个 are——一句话两个动词核", "hint": "回到机制第 1 节「功能蓝图」"}], "groups": [{"title": "🧩 分组看看：三种搬法，三张面孔", "items": [{"name": "存现句滥用", "gloss": "there be 后面再塞动词", "ex": "✗ There is a dog is running."}, {"name": "伪被动", "gloss": "happen 这类词硬套被动", "ex": "✗ was happened"}, {"name": "开头单一", "gloss": "每段都用 there be 起手", "ex": "作文里连用三句 There is…"}]}], "note": null, "group": 3}, {"id": "PR-11", "short": "he/she 说混，是「来不及」", "desc": "说得快的时候来不及选男还是女；写下来慢慢选，就很少错。所以要在「快说」里练。", "formal": "he/she 说混不是态度问题，是「开机顺序」问题：口头高发、书面低发", "kid": "中国孩子说话时把 he、she 说混，写下来却很少错——不是不用心，是说话时脑子来不及选：汉语的「tā」本来就不分男女。", "claim": "汉语普通话的第三人称在口语中只有一个音 tā，性别信息不在「开口前想好的意思」里；说英语时，性别选择被迫推迟到措辞的最后一刻，在快速口语产出中系统性地来不及——于是错误呈「口头高发、书面低发」的分布；这是产出加工的时间问题，不是性别概念问题，更不是态度问题。", "beats": [{"name": "开口前的清单", "text": "说话像发快递：汉语打包时不贴「男/女」标签，英语发货前必须贴——说得快，就容易贴错；写的时候慢慢贴，就很少错。"}, {"name": "练法跟着机制走", "text": "这种错要在「说得快」的场合练——限时口头造句，而不是罚抄写十遍。"}, {"name": "把选择提前", "text": "治法是把性别选择从「最后一刻」提前：开口介绍人之前，先在心里过一遍「男→he / 女→she」的预选；慢速跟读、看图说话练的都是这个提前量，不是记规则。"}], "examples": [{"s": "She is my sister.", "note": "she 的目标形：指女性亲属"}, {"s": "He is my father.", "note": "he 的目标形：指男性亲属"}, {"s": "She is a teacher.", "note": "口头限时替换练习素材（女教师）"}, {"s": "He is a student.", "note": "同型替换（男学生）"}, {"s": "This is my grandma. She is 70.", "note": "介绍前预选 she — 新拟例句"}, {"s": "My uncle is a cook. He works in a hotel.", "note": "男→he 预选 — 新拟例句"}], "errors": [{"wrong": "This is my mother. He is a teacher.（口头介绍妈妈时说混了）", "right": "This is my mother. She is a teacher.", "type": "he/she 口头互换（加工时序型）", "diag": "新拟例句（目录只登记错型）：口头高发、书面低发是这一型的签名——不是不会，是性别选择赶不上嘴速，要按讲解里的方法在限时口头里练。"}, {"wrong": "My sister is happy. He has a new dress.", "right": "My sister is happy. She has a new dress.", "type": "连环句性别漂移", "diag": "新拟例句：说得越快漂移越多，慢一拍预选就稳。"}], "quiz": [{"q": "he/she 总在说话时说混、写时很少错，最该怎么练？", "ans": "在限时口头产出中练性别选择", "hint": null}, {"q": "介绍奶奶前，心里先预选哪个词？", "ans": "she（女→she 先定住再开口）", "hint": "回到机制第 2 节「练法跟着机制走」"}], "groups": [{"title": "🧩 分组看看：错的分布告诉你怎么练", "items": [{"name": "口头高发", "gloss": "说得快、来不及选", "ex": "介绍家人时说混"}, {"name": "书面低发", "gloss": "有时间想，就很少错", "ex": "作文里 he/she 基本正确"}]}], "note": null, "group": 3}, {"id": "PR-06", "short": "越清楚，词越省", "desc": "刚提过的人用小代词，隔久了、多人抢镜了，就把名字说全——说太省，别人找不到你说的是谁。", "formal": "全称、代词还是干脆不说——按「心里有多清楚」定价", "kid": "提到的人越清楚，用的词越省：刚说过的用小代词，久没提的要把名字说全——说太省，别人就找不到你说的是谁。", "claim": "在完整名词、代词与零形式之间选择，是按所指对象的可及性定价的：代词只配给当前最可及的所指（刚提过、话题中心），远了、岔了、多人竞争了，就必须升回完整名词；写作文时「代词指不清」不是态度问题，是定价错误。", "beats": [{"name": "定价表", "text": "刚说过的人 → 小代词；换话题了、多人抢镜了 → 把名字说全；再清楚不过 → 可以不说（汉语常这样，英语不行，见 PR-08）。"}, {"name": "作文应用", "text": "作文里两个 he 打架时，把其中一个人的名字写全，读者立刻就清爽了。"}, {"name": "竞争时升回名词", "text": "句子里出现两个可能的人选（Tom 和 Jack 都在场），代词就「便宜没好货」了——必须升回完整名词点名，否则读者要猜。"}], "examples": [{"s": "I have a friend. He is tall.", "note": "刚提过——he 定价正确"}, {"s": "I have a dog. It is cute.", "note": "物的承接同理"}, {"s": "My friend is happy. He plays football.", "note": "话题连续——代词维持"}, {"s": "My classmates are kind. They help me.", "note": "复数承接"}, {"s": "Ann has a kite. Ann flies it in the park.", "note": "两个人选竞争时点名 Ann — 新拟例句"}, {"s": "The dog sees the cat. It runs away.", "note": "反例：it 指不清是谁跑了 — 新拟例句"}], "errors": [{"wrong": "Tom met Jack at the park. He gave him a book.（谁给谁？读的人分不清）", "right": "Tom met Jack at the park. Tom gave Jack a book.", "type": "代词指不清（作文歧义型）", "diag": "新拟例句（目录只登记错型）：he 和 him 挤在一起抢位置，定价就失灵了——把名字说全，指谁立刻清楚。下面的动画演示就是这一条。"}, {"wrong": "Lucy told Mary that she won the game.（谁赢了？）", "right": "Lucy said to Mary, \"I won the game!\"", "type": "双人竞争指代歧义", "diag": "新拟例句：两个人选在场时 she 标不出是谁，升回名词或改直接引语。"}], "quiz": [{"q": "「Tom and Jack are here. He is happy.」有什么问题？", "ans": "he 指不清——该把名字说全", "hint": null}, {"q": "「Ben and Sam are brothers. He is ten.」这句的问题是什么？", "ans": "He 指不清是 Ben 还是 Sam，要点名", "hint": "回到机制第 1 节「定价表」"}], "groups": [{"title": "🧩 分组看看：定价表（越清楚越省）", "items": [{"name": "刚提过·话题中心", "gloss": "用代词最便宜", "ex": "I have a dog. It is cute."}, {"name": "隔了几句·有点远", "gloss": "该升回名词了", "ex": "The dog is in the garden."}, {"name": "两个人选竞争", "gloss": "必须点名", "ex": "Ben is ten years old."}]}], "note": null, "group": 4}, {"id": "NEW-P1", "cand": true, "short": "谁的？分两队站", "desc": "my、your 这队后面必须跟着东西；mine、yours 这队自己就能站，后面什么都不带。", "formal": "物主代词分形容词性与名词性两队：形容词性物主代词后必须接名词，名词性物主代词独立充当论元（新拟条目，待与目录对账）", "kid": "说「谁的」有两种站法：一种后面一定要带着东西（my book，我的书），一种自己就能站住（The book is mine，这本书是我的）——两队长得像，站法不一样。", "claim": "领属关系在英语里有两种句法分布：限定词位的形容词性形式（my/your/his/her/its/our/their）与独立论元位的名词性形式（mine/yours/his/hers/ours/theirs）；his 同形、its 无名词性形式是两个系统性例外。学习者的错误集中在跨队混用：以宾格代物主（*me book）、以名词性形式回填限定词位（*yours book）。its 与 it's（it is 的缩合）的分工是小学阶段的高频书写混淆点。本条为原型新拟，目录 PR 组暂无定版条目，编号待对账。", "beats": [{"name": "两队站法", "text": "my、your、his、her、its、our、their 是「领队」：后面必须领着一个东西（my book、her bag）；mine、yours、his、hers、ours、theirs 是「单飞队」：一个词就是「我的（东西）」，后面什么都不带。"}, {"name": "his 一人分两角", "text": "his 最省事：领队和单飞长得一模一样（his book / The book is his），不用换衣服。"}, {"name": "its 不是 it's", "text": "its 是「它的」（领队，后面带东西）；it's 是 it is 的合体。写完多看一眼：有没有那一撇，意思完全不同。"}], "examples": [{"s": "This is my book.", "note": "领队 my + 东西 book"}, {"s": "The book is mine.", "note": "单飞 mine——后面不带东西"}, {"s": "Her bag is red. The red bag is hers.", "note": "her 领队、hers 单飞，一句一队"}, {"s": "The dog wagged its tail.", "note": "its「它的」——没有一撇"}, {"s": "Our classroom is clean.", "note": "our 领队带名词 — 新拟例句"}, {"s": "This is not my ruler. Mine is blue.", "note": "mine 单飞接住上文 — 新拟例句"}], "errors": [{"wrong": "This is me book.", "right": "This is my book.", "type": "拿宾格冒充物主（*me book）", "diag": "「我的书」不能抓 me 来顶：me 是宾格（站在动词、介词后面，见 GR-14），说「谁的」要用物主队里的 my。"}, {"wrong": "Is this yours book?", "right": "Is this your book?", "type": "名词性物主塞回限定词位（*yours book）", "diag": "yours 是单飞队的，后面不能再带 book；要带东西就换领队的 your。"}], "quiz": [{"q": "The bag is ___.（后面没有东西了）A. my B. mine", "ans": "B. mine——后面不带东西，用单飞队", "hint": null}, {"q": "This is ___ pen. A. mine B. my", "ans": "B. my——后面带着 pen，用领队", "hint": null}], "groups": [{"title": "🧩 分组看看：两队成对排好", "items": [{"name": "my ↔ mine", "gloss": "「我的」：my 带东西，mine 单独站", "ex": "This is my pen. / The pen is mine."}, {"name": "your ↔ yours", "gloss": "「你的」：your 带东西，yours 单独站", "ex": "Your seat is here. / This seat is yours."}, {"name": "his ↔ his", "gloss": "「他的」：两队同形，不用换", "ex": "His bike is new. / The new bike is his."}, {"name": "her ↔ hers", "gloss": "「她的」：her 带东西，hers 单独站", "ex": "Her bag is red. / The red bag is hers."}, {"name": "its ↔（没有单飞）", "gloss": "「它的」：只有领队形；it's 是 it is，别混", "ex": "The dog wagged its tail."}, {"name": "our ↔ ours", "gloss": "「我们的」：our 带东西，ours 单独站", "ex": "Our classroom is big. / The big classroom is ours."}, {"name": "their ↔ theirs", "gloss": "「他们的」：their 带东西，theirs 单独站", "ex": "Their team won. / The cup is theirs."}]}], "note": "新拟条目（NEW-P1）：呈现采用 Duolingo、British Council 通行的「成对呈现」法——形容词性与名词性逐对对照。编号与内容待与目录对账。", "group": 5}, {"id": "NEW-P2", "cand": true, "short": "动作转个弯，回到自己身上", "desc": "自己打到自己、自己教自己，就要用 myself 这一家；强调「亲自」的时候也派它上场。", "formal": "反身代词由人称代词加 -self/-selves 构成：一、二人称用物主格拼，第三人称用宾格拼；功能分反身（宾语与主语同指）与强调（亲自）两大类（新拟条目，待与目录对账）", "kid": "动作做出去又回到自己身上——我伤到了我自己、他教他自己——就用 myself、himself 这一家；想强调「就是本人亲自」，也用它们。", "claim": "反身代词的构成存在系统性不对称：一、二人称取物主格（my-/your-/our-）+ self，第三人称取宾格（him-/her-/it-/them-）+ self，这是历史形态遗留，*hisself、*theirselves 属方言形，标准语不用。复数 -selves 的 f→v 与 leaf→leaves、wife→wives 同型。功能上分两大类：论元反身（宾语与主语同指，缺之不合语法）与强调同位（可有可无，去之无碍）。本条为原型新拟，目录暂无定版，编号待对账。", "beats": [{"name": "拼法分两路", "text": "一、二人称拿「物主格」来拼：my+self、your+self、our+selves；第三人称拿「宾格」来拼：him+self、her+self、them+selves——记反了就会拼出 *hisself、*theirselves。"}, {"name": "f 变 v", "text": "不止一个人时 self 变 selves，f 要变成 v（ourselves、yourselves、themselves）——和 leaf→leaves 一个道理。"}, {"name": "两大用法", "text": "一是动作回到自己身上：主角和承受动作的人是同一个，就必须用反身代词（He hurt himself）；二是强调「亲自、本人」：The teacher herself came.（老师亲自来了）。"}], "examples": [{"s": "He hurt himself.", "note": "伤人的人和受伤的人是同一个——必须反身"}, {"s": "She taught herself English.", "note": "自己教自己"}, {"s": "We enjoyed ourselves at the party.", "note": "玩得开心——enjoy 后面的固定搭法"}, {"s": "I did the homework myself.", "note": "强调：我亲自动手（没人帮忙）"}, {"s": "The baby can feed herself.", "note": "反身必用场合 — 新拟例句"}, {"s": "They made the cake themselves.", "note": "强调「亲自」— 新拟例句"}], "errors": [{"wrong": "I hurt me.", "right": "I hurt myself.", "type": "反身宾语误用普通宾格（*I hurt me）", "diag": "动作落回自己身上，宾语要换反身代词；me 留给「别人做的动作落到我身上」：He hurt me.（他伤到了我）。"}, {"wrong": "Tom did it hisself.", "right": "Tom did it himself.", "type": "构成误拼（*hisself）", "diag": "第三人称拼反身代词要用宾格 him 来拼（him+self），不是物主格 his——拼法两路要分清。"}], "quiz": [{"q": "The cat is washing ___. A. it B. itself", "ans": "B. itself——猫给自己洗澡，动作回到自己身上", "hint": null}, {"q": "「He did it by ___」表示「独自、没人帮忙」，填什么？", "ans": "himself（by oneself = 独自）", "hint": "回到机制第 3 节「两大用法」"}], "groups": [{"title": "🧩 分组看看：按拼法分两路", "items": [{"name": "物主格拼的（一、二人称）", "gloss": "my/your/our + self/selves", "ex": "myself、yourself、ourselves、yourselves"}, {"name": "宾格拼的（第三人称）", "gloss": "him/her/it/them + self/selves——注意 f→v", "ex": "himself、herself、itself、themselves"}]}, {"title": "🧩 分组看看：两大用法", "items": [{"name": "动作回到自己身上（必用）", "gloss": "主角和承受者是同一个人，换成普通宾格就错", "ex": "He hurt himself. / She taught herself English."}, {"name": "强调「亲自」（可省）", "gloss": "放在主语后面或句尾，去掉也不影响句子成立", "ex": "The teacher herself helped us. / I did it myself."}]}], "note": "新拟条目（NEW-P var _timers = [];
function stageTimer(st){
  var fr = st.querySelectorAll('.frame');
  if(fr.length < 2) return null;
  var idx = st._idx || 0;
  return setInterval(function(){
    fr[idx].classList.remove('on');
    idx = (idx + 1) % fr.length;
    fr[idx].classList.add('on');
    st._idx = idx;
  }, parseInt(st.getAttribute('data-int') || '1600', 10));
}
function startDemos(){

}
function stopTimers(){ _timers.forEach(function(t){ clearInterval(t); }); _timers = []; }
function stageOf(btn){ return btn.parentNode.previousElementSibling; }
function toggleStage(btn){
  var st = stageOf(btn); if(!st) return;
  if(st._tm){ clearInterval(st._tm); st._tm = null; btn.textContent = '▶ 播放'; }
  else { st._tm = stageTimer(st); if(st._tm){ _timers.push(st._tm); } btn.textContent = '⏸ 暂停'; }
}
function replayStage(btn){
  var st = stageOf(btn); if(!st) return;
  if(st._tm){ clearInterval(st._tm); st._tm = null; }
  var fr = st.querySelectorAll('.frame');
  fr.forEach(function(f){ f.classList.remove('on'); });
  if(fr.length){ fr[0].classList.add('on'); }
  st._idx = 0;
  st._tm = stageTimer(st); if(st._tm){ _timers.push(st._tm); }
  var tb = btn.parentNode.querySelectorAll('button')[0];
  if(tb) tb.textContent = '⏸ 暂停';
}
