<style>

<script>
var GROUPS = [{"name": "🧲 第 1 组 · 胶水词与平等的伙伴", "sub": "连词是胶水：粘词、粘短语、粘句子；并列连词粘起来的两边一样重要"}, {"name": "🚃 第 2 组 · 挂车队：从属连词", "sub": "从属连词带的那半句是挂车，自己不能上路，必须挂上主句才完整"}, {"name": "👯 第 3 组 · 成对的搭档", "sub": "关联连词成对出门、不许串门，夹在中间的东西还要长得一样"}, {"name": "🏷️ 第 4 组 · 连接副词：力气小、规矩大", "sub": "however、therefore 是副词不是连词：力气小，粘句子要靠分号或句号"}, {"name": "🚧 第 5 组 · 句子边界与身兼数职", "sub": "逗号扛不起两个完整句；before、after 这些词一个人干三份工"}];
var LAWS = [{"id": "NEW-CJ01", "isNew": true, "group": 0, "short": "连词是胶水词", "desc": "and、but、because 都是胶水：把词、短语、句子粘在一起——I like tea and juice.", "formal": "Merriam-Webster：\"Conjunctions are words that join together other words or groups of words.\"；BBC Bitesize 儿童版：\"Conjunctions are joining words.\"", "kid": "连词就像胶水：能把两个词粘住，也能把两个句子粘成一个长句子。", "beats": [{"name": "胶水粘三样", "text": "连词能粘词（tea and juice）、粘短语，也能粘句子——Merriam-Webster 的定义说的就是 join together words or groups of words。"}, {"name": "三大家族", "text": "连词分三家：并列连词粘的两边一样重要；从属连词把一半句子变成挂车；关联连词成对出现。这个区就是按这三家排的队。"}, {"name": "胶水也有规矩", "text": "粘词、粘短语很简单；粘两个完整的句子时，标点要跟上规矩——逗号、分号各有岗位，后面几条细说（NEW-CJ03、GR-38）。"}], "examples": [{"s": "I like tea and juice.", "note": "粘两个词"}, {"s": "We sang and danced at the party.", "note": "粘两个动作"}, {"s": "I wanted to play, but it rained.", "note": "粘两个完整的句子（转折）"}, {"s": "She stayed home because she was ill.", "note": "粘主句 + 挂车（原因）"}, {"s": "Would you like milk or water?", "note": "粘两个选择"}, {"s": "Both the cat and the dog are cute.", "note": "成对的胶水（关联连词）"}], "errors": [{"wrong": "I like tea, juice.", "right": "I like tea and juice.", "type": "缺胶水", "diag": "两个词并排摆着不行，中间要有连词把它们粘住。回补机制第 1 节。"}, {"wrong": "He runs fast and he jumps high and he swims well and he sings.", "right": "He runs fast, jumps high, and swims well. He sings, too.", "type": "and 流水账", "diag": "研究合集第 4 章：孩子爱用 and 一路串下去；串句时换 because、so、but 等更有信息的连词，或者干脆拆句。回补机制第 3 节。"}], "quiz": [{"q": "哪个词是胶水词？A. happy B. and C. run", "ans": "B——and 是连词，专门负责粘。", "hint": "回到机制第 1 节「胶水粘三样」。"}, {"q": "连词能粘哪三样东西？", "ans": "词、短语、句子（分句）。", "hint": null}], "groups": [{"title": "🧩 分组看看：三大家族", "items": [{"name": "并列连词", "gloss": "粘的两边一样重要（第 1 组细讲）", "ex": "I like tea, and I like juice."}, {"name": "从属连词", "gloss": "把一半句子变成挂车，挂在主句上（第 2 组细讲）", "ex": "I stayed home because it rained."}, {"name": "关联连词", "gloss": "成对出现，前呼后应（第 3 组细讲）", "ex": "Both the cat and the dog are cute."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "定义并列取自研究合集第 1 章：Merriam-Webster 词条（verified live）、Oxford Advanced Learner's Dictionary、Grammarly、Cambridge Dictionary、British Council TeachingEnglish 均作「连接词/短语/分句」解；儿童版定义取 BBC Bitesize KS2「joining words」。三大家族划分见 Merriam-Webster 同词条对 coordinating / subordinating / correlative 的逐字概括。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ02", "isNew": true, "group": 0, "short": "FANBOYS 七兄弟", "desc": "并列连词只有七个：for、and、nor、but、or、yet、so——口诀 FANBOYS 一背就齐，如 The bus didn't come, so we caught a taxi.", "formal": "Grammarly：\"The most common coordinating conjunctions are for, and, nor, but, or, yet, and so; you can remember them by using the mnemonic device FANBOYS.\"；Cambridge：并列连词连接「of equal importance」的词、短语和分句。", "kid": "七个兄弟手拉手站成一排，两边一样重要，谁也不比谁大。", "beats": [{"name": "封闭集合，只有七个", "text": "并列连词不多不少就这七个：for、and、nor、but、or、yet、so。把七个词的首字母串起来就是 FANBOYS（粉丝男孩），背下口诀就背下了全表。"}, {"name": "两边一样重要", "text": "「并列」的意思是平等：连词两边要么都是完整的句子，要么是同类的词和短语，不分主次（Cambridge 的说法是 of equal importance）。"}, {"name": "低龄先学四个", "text": "低年级先精学 BOAS 四个——but、or、and、so（教学博客 Pennington Publishing 的缩减版口诀）；for、yet、nor 先认脸，高年级再补齐。"}, {"name": "nor 有个小脾气", "text": "nor 跟在否定句后面表「也不」，它后面的句子常常要倒装：My sister doesn't like to read, nor does she like school.（研究合集 FANBOYS 表注）"}], "examples": [{"s": "I eat healthy food, for I want to get strong.", "note": "for 表原因（British Council 例）"}, {"s": "I like to read and I like to play.", "note": "and 并列添加"}, {"s": "My sister doesn't like to read, nor does she like school.", "note": "nor 否定并列，后面倒装"}, {"s": "I wanted to go to school but I was sick.", "note": "but 转折"}, {"s": "Would you like to play soccer or go to the beach?", "note": "or 选择"}, {"s": "I like eating apples, yet oranges are even better.", "note": "yet 转折，比 but 更意外"}, {"s": "The bus didn't come so we caught a taxi.", "note": "so 表结果"}], "errors": [{"wrong": "I like apples, I like bananas.", "right": "I like apples, and I like bananas.", "type": "逗号粘连（缺连词）", "diag": "两个完整句之间只有一个逗号，没有连词——粘不住（详见 GR-38）。回补机制第 2 节。"}, {"wrong": "My brother doesn't like tea, nor he likes coffee.", "right": "My brother doesn't like tea, nor does he like coffee.", "type": "nor 后未倒装", "diag": "nor 后面的分句要把 does 提到主语前面。回补机制第 4 节「nor 有个小脾气」。"}], "quiz": [{"q": "FANBOYS 里表「转折」的是哪两个？", "ans": "but 和 yet（yet 的转折更让人意外）。", "hint": "回到分组看看，找 but 和 yet 两行。"}, {"q": "把两句合成一句：It was cold. We stayed home.（用 so）", "ans": "It was cold, so we stayed home.", "hint": "回到 NEW-CJ03 的逗号规则。"}], "groups": [{"title": "🧩 分组看看：七兄弟各管什么（例句出自研究合集 FANBOYS 表）", "items": [{"name": "for · 原因", "gloss": "表原因，正式一点，≈ because", "ex": "I eat healthy food for I want to get strong."}, {"name": "and · 添加", "gloss": "把不冲突的东西并排加上", "ex": "I like to read and I like to play."}, {"name": "nor · 否定并列", "gloss": "「也不」，跟在否定句后，后面常倒装", "ex": "My sister doesn't like to read, nor does she like school."}, {"name": "but · 转折", "gloss": "表转折或例外", "ex": "I wanted to go to school but I was sick."}, {"name": "or · 选择", "gloss": "给出另一个选项", "ex": "Would you like to play soccer or go to the beach?"}, {"name": "yet · 意外转折", "gloss": "表转折，语气比 but 更意外", "ex": "I like eating apples, yet oranges are even better."}, {"name": "so · 结果", "gloss": "表结果、后果", "ex": "The bus didn't come so we caught a taxi."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "七词全表与逐词功能、例句出自研究合集 1.3（Lumen/LibreTexts 与 British Council 两源一致，verified live）；FANBOYS 口诀引 Grammarly 原话；BOAS 缩减版见 Pennington Publishing 教学博客（index）；nor 后倒装为合集 FANBOYS 表的原注。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ03", "isNew": true, "group": 0, "short": "逗号加连词，牵手两个完整句", "desc": "两个完整的句子要合并：先放逗号，再放连词，两个一起上才拉得住——Road construction can be inconvenient, but it is necessary.", "formal": "Purdue OWL：\"Use a comma to join two independent clauses and a coordinating conjunction (and, but, or, for, nor, so).\"；同站《Commas: Quick Rules》：\"Use commas to separate independent clauses when they are joined by any of these seven coordinating conjunctions: and, but, for, or, nor, so, yet.\"", "kid": "两个完整的句子手拉手：逗号先伸出手，连词再握紧，缺了哪个都拉不牢。", "beats": [{"name": "先认「完整句」", "text": "这条规矩只管两边各自能单独站住的句子（有主语、有动词、意思完整）。两边都是完整句，才需要逗号 + 连词这套装备。"}, {"name": "逗号 + 连词，缺一不可", "text": "只有逗号、没有连词，叫逗号粘连（GR-38）；只有连词、没有逗号，正式书面语里会被算作流水句（run-on）——Lumen 的说法是：连接两个完整分句，逗号必须在连词前面。"}, {"name": "只连词或短语时，不加逗号", "text": "连词只粘两个词或两个短语时，不用逗号：Tom and Jerry are friends. / She sang and danced.逗号是给「完整句」准备的，别乱发。"}], "examples": [{"s": "Road construction can be inconvenient, but it is necessary.", "note": "Purdue OWL 原例：逗号 + but 连接两个完整句"}, {"s": "I like to read, and I like to play.", "note": "逗号 + and"}, {"s": "It was cold, so we stayed home.", "note": "逗号 + so"}, {"s": "Would you like tea, or would you like juice?", "note": "逗号 + or（问句也一样）"}, {"s": "She was tired, yet she kept walking.", "note": "逗号 + yet"}, {"s": "Tom and Jerry are friends.", "note": "对照：只连两个词，不加逗号"}, {"s": "She sang and danced.", "note": "对照：只连两个动作，不加逗号"}], "errors": [{"wrong": "I was hungry, I ate a sandwich.", "right": "I was hungry, so I ate a sandwich.", "type": "逗号粘连", "diag": "有逗号没连词，粘不住。回补机制第 2 节；四种合法改法见 GR-38。"}, {"wrong": "I was hungry so I ate a sandwich.", "right": "I was hungry, so I ate a sandwich.", "type": "连词前漏逗号", "diag": "两边都是完整句时，连词前面要先放逗号（正式书面语口径）。回补机制第 2 节。"}, {"wrong": "Tom, and Jerry are friends.", "right": "Tom and Jerry are friends.", "type": "只连词时误加逗号", "diag": "这里 and 只粘了两个名字，不是两个完整句，逗号撤掉。回补机制第 3 节。"}], "quiz": [{"q": "哪句标点对？A. I was tired, I went to bed. B. I was tired, so I went to bed.", "ans": "B——逗号 + 连词一起上。", "hint": "回到机制第 2 节「逗号 + 连词，缺一不可」。"}, {"q": "She ___ and danced.（填 sang）——and 前面要不要加逗号？", "ans": "不要：这里只连了 sang 和 danced 两个动作，不是两个完整句。", "hint": "回到机制第 3 节。"}], "groups": [{"title": "🧩 分组看看：什么时候加逗号", "items": [{"name": "连两个完整句", "gloss": "逗号 + 连词，一起上", "ex": "It was cold, so we stayed home."}, {"name": "只连两个词", "gloss": "不加逗号", "ex": "Tom and Jerry are friends."}, {"name": "只连两个动作", "gloss": "不加逗号", "ex": "She sang and danced."}, {"name": "连三样以上", "gloss": "样样之间用逗号，最后一样前 and 前也常有逗号（系列逗号，Lumen）", "ex": "I bought pens, books, and a bag."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "逗号规则引 Purdue OWL《Punctuation Overview》与《Commas: Quick Rules》原话（verified live / 经 UConn 转载核对）；「只连词或短语不用逗号」与系列逗号见 Lumen/LibreTexts 连词章（verified live）。与 GR-38 的分工：本条管「逗号 + 连词」的正面用法，GR-38 管逗号粘连的定版与四种合法连接。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ04", "isNew": true, "group": 1, "short": "从句是挂车，自己不能上路", "desc": "Although it was raining. ——这半句挂在半空没说完：从属连词带的句子是挂车，必须挂上主句，如 Although it was raining, Ram went swimming.", "formal": "EnglishClub：\"A subordinate or dependent clause 'depends' on a main or independent clause. It cannot exist alone.\"；Cambridge：分句跟上这些连词后「becomes a subordinate clause, which needs a main clause to make a complete sentence」。", "kid": "带从属连词的那半句是挂车：看着像句子，其实要主句拉着走，单独放出来，谁也听不懂它想说什么。", "beats": [{"name": "挂车长什么样", "text": "从属连词 + 主语 + 动词，零件齐全，却是个依附品：EnglishClub 的原话是它 depends on（依靠）主句，不能 exist alone（单独存在）。"}, {"name": "半句话演示", "text": "有人只对你说一句 \"Although it was raining.\" 就停下——你什么也没听懂，因为话只说了一半。补上主句，意思才落地：Although it was raining, Ram went swimming."}, {"name": "AAAWWUBBIS 大巴口诀", "text": "常用从属连词编成一辆「大巴」：After, Although, As, When, While, Until, Before, Because, If, Since——读作 AAAH-Whoo-Bus，十个队员一次记齐（课堂材料口诀，研究合集第 5 章）。"}, {"name": "逗号跟着位置走", "text": "挂车在前，挂车后面加逗号：Although it was raining, Ram went swimming.挂车在后，一般不加逗号：Ram went swimming although it was raining.（EnglishClub 结构图 / Purdue OWL）"}], "examples": [{"s": "Although it was raining, Ram went swimming.", "note": "EnglishClub 原例：挂车在前，加逗号"}, {"s": "Ram went swimming although it was raining.", "note": "挂车在后，不加逗号"}, {"s": "We left after the meeting ended.", "note": "时间挂车"}, {"s": "Call me when you arrive.", "note": "when 挂车在后"}, {"s": "If you study, you will pass.", "note": "条件挂车在前，加逗号"}, {"s": "She was absent because she was ill.", "note": "原因挂车在后"}, {"s": "Wash your hands before you eat.", "note": "before 挂车在后"}], "errors": [{"wrong": "Because I was tired.", "right": "I went to bed because I was tired.", "type": "句子残缺（fragment）", "diag": "挂车单独加句号，就是残缺句。Purdue OWL 对从属分句的定义就是 cannot stand alone。回补机制第 1、2 节。"}, {"wrong": "Although it was raining.", "right": "Although it was raining, we went out.", "type": "句子残缺（fragment）", "diag": "EnglishClub 的课堂演示就是这一句：单说它，听者什么也理解不了。回补机制第 2 节。"}], "quiz": [{"q": "哪句是完整的？A. When you arrive. B. Call me when you arrive.", "ans": "B——A 只是挂车，B 给它挂上了主句。", "hint": "回到机制第 1 节「挂车长什么样」。"}, {"q": "AAAWWUBBIS 打头的三个 A 是哪三个词？", "ans": "After, Although, As。", "hint": "回到机制第 3 节的大巴口诀。"}], "groups": [{"title": "🧩 分组看看：从属连词按意思分队（全图）", "items": [{"name": "时间队", "gloss": "after, when, before, until, while…（NEW-CJ05 细讲）", "ex": "Call me when you arrive."}, {"name": "原因队", "gloss": "because, since, as（NEW-CJ06 细讲）", "ex": "She was absent because she was ill."}, {"name": "让步队", "gloss": "although, though, even though（NEW-CJ07 细讲）", "ex": "Although the task was difficult, everyone completed it."}, {"name": "条件队", "gloss": "if, unless（NEW-CJ07 细讲）", "ex": "If you study, you will pass."}, {"name": "目的队", "gloss": "so that", "ex": "She wrote down the address so that she would not forget it."}, {"name": "结果队", "gloss": "so…that", "ex": "He was so tired that he fell asleep at his desk."}, {"name": "地点队", "gloss": "where, wherever", "ex": "Sit where you like."}, {"name": "比较队", "gloss": "than, as", "ex": "She is taller than her brother."}, {"name": "方式队", "gloss": "as if, as though", "ex": "He talks as if he knew everything."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "不能独立的规则与半句话演示引 EnglishClub《Subordinating Conjunctions》（verified live）；从属连词清单综合 Cambridge（verified live）与 Khan Academy 课程清单；九组语义分类综合 EnglishClub / Cambridge / Khan / 大学写作中心分类表（研究合集 1.4）；AAAWWUBBIS 出自课堂材料转引（index）。从属连词永远位于其分句之首，能移动的是整个分句（Cambridge）。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ05", "isNew": true, "group": 1, "short": "时间队：先做哪件，后做哪件", "desc": "when、before、after、until、while 都是报时间的：两件事谁先谁后，它们排顺序——Wash your hands before you eat.", "formal": "研究合集时间组（综合 EnglishClub / Cambridge / Khan 分类表）：after, as, as soon as, before, once, since, till, until, when, whenever, while；EnglishClub 常用表含 after, before, till, until, when, while。", "kid": "这队连词一开口，先把两件事的先后顺序报清楚。", "beats": [{"name": "报先后", "text": "两件事摆在一起，时间连词负责排队：哪件先发生、哪件后发生，一听就明白。"}, {"name": "as soon as = 一……就……", "text": "前一件刚发生，后一件马上跟上，中间不留空档。"}, {"name": "until = 一直等到", "text": "动作一直持续，到某个时间点才停：Wait here until I come back.（等到我回来为止）"}, {"name": "while = 同时进行", "text": "while 报的是「同一段时间里」：两件事同时在做。"}], "examples": [{"s": "We left after the meeting ended.", "note": "after：开完会之后（研究合集原例）"}, {"s": "Call me when you arrive.", "note": "when：到了的时候（研究合集原例）"}, {"s": "Wash your hands before you eat.", "note": "before：吃饭之前（研究合集原例）"}, {"s": "As soon as the bell rang, we ran out.", "note": "as soon as：一响铃就跑出去"}, {"s": "Wait here until I come back.", "note": "until：一直等到我回来"}, {"s": "While I was reading, Mum was cooking.", "note": "while：我看书的同时妈妈做饭"}, {"s": "Brush your teeth before you go to bed.", "note": "before：睡觉之前先刷牙"}], "errors": [{"wrong": "After the meeting ended.", "right": "We left after the meeting ended.", "type": "句子残缺（fragment）", "diag": "after 带的还是挂车，单独成句就残缺。回补 NEW-CJ04 机制第 1 节。"}, {"wrong": "When you arrive call me.", "right": "When you arrive, call me.", "type": "挂车在句首漏逗号", "diag": "从属分句放在句首时，后面要加逗号（Purdue OWL / EnglishClub）。回补 NEW-CJ04 机制第 4 节。"}, {"wrong": "As soon as, the bell rang, we ran out.", "right": "As soon as the bell rang, we ran out.", "type": "逗号位置错误", "diag": "从属连词永远站在自己分句的最前面，逗号要等整个分句说完再放。回补 NEW-CJ04 机制第 4 节。"}], "quiz": [{"q": "选词填空：___ you eat, wash your hands. A. Before B. Because", "ans": "A——说的是吃饭之前的顺序，是时间队。", "hint": "回到机制第 1 节「报先后」。"}, {"q": "「一……就……」用哪个连词？A. until B. as soon as", "ans": "B——as soon as 专管「一发生就跟上」。", "hint": "回到机制第 2 节。"}], "groups": [{"title": "🧩 分组看看：时间队队员", "items": [{"name": "when", "gloss": "当……的时候", "ex": "Call me when you arrive."}, {"name": "before", "gloss": "在……之前", "ex": "Wash your hands before you eat."}, {"name": "after", "gloss": "在……之后", "ex": "We left after the meeting ended."}, {"name": "as soon as", "gloss": "一……就……", "ex": "As soon as the bell rang, we ran out."}, {"name": "until", "gloss": "一直到……（才停）", "ex": "Wait here until I come back."}, {"name": "while", "gloss": "在……的同时", "ex": "While I was reading, Mum was cooking."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "时间组词表与例句模式出自研究合集 1.4 时间组（EnglishClub / Cambridge / Khan 分类综合）；逗号规则同 NEW-CJ04 所引 EnglishClub 结构图与 Purdue OWL。since 的时间义也在本队（since she won），其介词/原因用法见 NEW-CJ12 与 NEW-CJ06。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ06", "isNew": true, "group": 1, "short": "原因队：回答「为什么」", "desc": "because、since、as 都能说理由：because 声音最大、最直白——She was absent because she was ill.", "formal": "研究合集原因组（综合 EnglishClub / Cambridge / Khan 分类表）：as, because, now that, since；其中 as / since 表原因时语气较弱、较正式。", "kid": "想说理由就请原因队：because 是大喇叭，since 和 as 是轻声版。", "beats": [{"name": "because 是主力", "text": "直接回答「为什么」，口语书面都常用，是孩子先要掌握的那一个。"}, {"name": "since / as 是轻声版", "text": "理由是大家都知道的、只是顺带一提时，用 since 或 as：语气较弱，也较正式（研究合集原因组原注）。"}, {"name": "原因句也是挂车", "text": "because、since 带的仍然是从属分句：放在句首，后面加逗号（Since the road was blocked, we took another route.）；放在句末，一般不加逗号。"}], "examples": [{"s": "She was absent because she was ill.", "note": "because：她缺席因为生病了（研究合集原例）"}, {"s": "Since the road was blocked, we took another route.", "note": "since：路堵了，所以改道（研究合集原例，句首加逗号）"}, {"s": "I stayed home because it rained.", "note": "because 句末版（与 GR-11 同一句的正面用法）"}, {"s": "As it was late, we went home.", "note": "as：天晚了，轻声说理由"}, {"s": "He is happy because he has a new bike.", "note": "because：有新车所以开心"}, {"s": "Because the bus was late, I was late for school.", "note": "because 句首版：挂车在前，加逗号"}], "errors": [{"wrong": "Because it rained.", "right": "We stayed home because it rained.", "type": "句子残缺（fragment）", "diag": "原因句也是挂车，单独成句就残缺。回补 NEW-CJ04 机制第 1 节。"}, {"wrong": "Since the road was blocked. We took another route.", "right": "Since the road was blocked, we took another route.", "type": "句号误切挂车", "diag": "句号把挂车单独切了出去；挂车在句首时用逗号接回主句。回补机制第 3 节。"}], "quiz": [{"q": "哪个词说理由最直白？A. because B. although", "ans": "A——because 是原因队的主力。", "hint": "回到机制第 1 节。"}, {"q": "把句子补完整：Since it snowed, ___.", "ans": "参考答案：we made a snowman.（since 带出大家都知道的理由，主句说结果。）", "hint": "回到机制第 2、3 节。"}], "groups": [{"title": "🧩 分组看看：原因队三兄弟", "items": [{"name": "because", "gloss": "声音最大，直接回答「为什么」", "ex": "She was absent because she was ill."}, {"name": "since", "gloss": "理由大家都知道，顺带一提，较正式", "ex": "Since the road was blocked, we took another route."}, {"name": "as", "gloss": "和 since 像，轻声说理由", "ex": "As it was late, we went home."}]}], "note": "because 和 so 不能同上的规矩单独立条，见 GR-11（目录定版）。", "adult": [{"k": "研究依据：", "t": "原因组词表出自研究合集 1.4（EnglishClub / Cambridge / Khan 综合），as/since「较弱、较正式」为合集原注；now that 亦在原因组，小学阶段只认脸，不单列。since 的时间义见 NEW-CJ05，身兼数职的判别见 NEW-CJ12。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "GR-11", "isNew": false, "group": 1, "short": "因果只搭一座桥", "desc": "because 和 so 选一个就够：想说原因走 because，想说结果走 so——两个都上，是把汉语「因为…所以」的成对习惯搬进来了。", "formal": "because 和 so 各管一段路：英语一段因果通常只留一个连接点，两个都上是汉语的习惯迁移", "kid": "英语说因果像只搭一座桥：要么站在 because 这头说原因，要么站在 so 那头说结果；两座桥一起搭，是把汉语的习惯带过来了", "beats": [{"name": "只搭一座桥", "text": "说因果时选一座桥过河：想先说原因，就走 because；想先说结果，就走 so。一座桥就够过河了。"}, {"name": "汉语的成对习惯", "text": "汉语喜欢「因为…所以…」成对出现，这是汉语自己的规矩；搬进英语，两座桥叠在一起，英语听着就别扭。"}, {"name": "各自单独用都合法（呈现层补充）", "text": "because 单独用没问题，so 单独用也没问题；错只错在同一条因果链里两个一起上。口语中偶见的强调性叠用，不按小学阶段的错误处理。（据目录 claim 的适用范围）"}], "examples": [{"s": "I stayed home because it rained.", "note": "下雨天：站在 because 这头说原因"}, {"s": "It rained, so I stayed home.", "note": "同一件事：站在 so 那头说结果"}, {"s": "I was late because the bus was late.", "note": "上学迟到：只选 because 一座桥"}, {"s": "It was sunny, so we played outside.", "note": "放晴出门玩：只选 so 一座桥"}, {"s": "We stayed inside because the wind was strong.", "note": "新拟例句：只选 because 一座桥"}, {"s": "The wind was strong, so we stayed inside.", "note": "新拟例句：只选 so 一座桥"}], "errors": [{"wrong": "Because it rained, so I stayed home.", "right": "I stayed home because it rained. / It rained, so I stayed home.", "type": "母语迁移-连接词并用", "diag": "清单条目登记：中国学习者语料中 because…so 并用是稳定高频的迁移错误类型（连淑能形合/意合对比）。回补机制第 1 节：一座桥过河。"}, {"wrong": "Because I was hungry, so I ate a sandwich.", "right": "I ate a sandwich because I was hungry. / I was hungry, so I ate a sandwich.", "type": "母语迁移-连接词并用", "diag": "据目录登记错型补成的完整病例：同一条因果链里 because 与 so 并用，删掉一个即可。回补机制第 1 节「只搭一座桥」。"}], "quiz": [{"q": "哪句对？A. Because it rained, so I stayed home. B. It rained, so I stayed home.", "ans": "B——一段因果只留一个连接点。", "hint": "回到机制第 1 节「只搭一座桥」。"}, {"q": "哪句对？A. Because the bus was late, so I was late. B. The bus was late, so I was late.", "ans": "B——一段因果只留一个连接点。", "hint": "回到机制第 1 节「只搭一座桥」。"}], "groups": [{"title": "🧩 分组看看：两座桥，二选一", "items": [{"name": "because 桥", "gloss": "站在原因这头：先说结果，再补原因也行", "ex": "I stayed home because it rained."}, {"name": "so 桥", "gloss": "站在结果那头：先说原因，再说结果", "ex": "It rained, so I stayed home."}, {"name": "汉语的成对习惯", "gloss": "「因为…所以…」在汉语里成对出现；搬进英语要拆开，只留一座桥", "ex": "✗ Because it rained, so I stayed home."}]}], "note": "目录登记的同族规律：GR-26、GR-22、GR-38——本区的 GR-38（逗号粘连）与本条同属一个家族。让步版的双连词坑（although…but）见 NEW-CJ07。", "adult": [{"k": "目录论断：", "t": "英语从句连接以形合为常态：一个主从关系由一个从属连词标明即足。同一因果链里 because…so 并用，是汉语「因为…所以」成对关联词的意合习惯迁移到英语的冗余结构。"}, {"k": "适用范围：", "t": "问题只在同一因果链里并用；because 与 so 各自单独使用均合法。口语中偶见的强调性叠用不属小学教学范围"}, {"k": "例外：", "t": "口语中偶见的强调性叠用，不按小学阶段的错误处理"}, {"k": "来源：", "t": "连淑能《英汉对比研究》（1993，高教社）——接触等级：二手系统论述级（书目经高教社官方产品页核实：1993 年 3 月，ISBN 9787040044508, 221 页；2026-11-02 篇目级核实：目录含「形合与意合」对比专题（p. 8），该章正文——形合（显性接应、作者负责）与意合（语义接应、读者负责）之辨——经公开扫描本核读，与本条引用一致）"}, {"k": "边界：", "t": "because 与 so 当然都能用，问题只在同一因果链里并用；口语中偶见的强调性叠用不属小学教学范围。另：旧「语法树会断」伪机制已删除，不得复活。"}, {"k": "证据等级：", "t": "二手系统论述级"}]}, {"id": "NEW-CJ07", "isNew": true, "group": 1, "short": "条件与让步队：if 开条件，although 让一步", "desc": "if 说「要是…」，although 说「尽管…」：Although it was cold, he didn't wear a jacket. ——注意：although 后面不能再跟一个 but。", "formal": "研究合集条件组：as long as, even if, if, in case, only if, provided that, unless, whether or not；让步组：although, even though, though, whereas, while。Cambridge 语法栏：\"we only use one conjunction to connect words or phrases\"，并给出错误示范 \"Not: Because my alarm didn't go off, so I was late for work.\"", "kid": "if 是开关：条件到了，事情才发生。although 是让步：先让一步，后面的事照样发生。", "beats": [{"name": "if = 要是", "text": "if 领着条件：条件成立，后面的结果才来。If you study, you will pass.（要是你学习，你就会通过）"}, {"name": "unless = if…not", "text": "unless 是「除非 / 要是不……就不……」：She won't go unless you invite her.（你不邀请她，她就不去）"}, {"name": "although = 尽管", "text": "although 先让一步：情况明明不利，后面的事还是发生了。Although the task was difficult, everyone completed it."}, {"name": "双连词坑（和 GR-11 呼应）", "text": "汉语的「虽然…但是…」是成对的，搬进英语只能留一个：选 although 就扔掉 but，选 but 就扔掉 although。Cambridge 的错误示范就是这个道理（研究合集第 4 章）。"}], "examples": [{"s": "If you study, you will pass.", "note": "if：条件在前（研究合集原例）"}, {"s": "She won't go unless you invite her.", "note": "unless：不邀请就不去（研究合集原例）"}, {"s": "Although the task was difficult, everyone completed it.", "note": "although：任务难，大家还是完成了（研究合集原例）"}, {"s": "Although it was cold, he didn't wear a jacket.", "note": "although 只用一个连接点（研究合集正例）"}, {"s": "If it rains, we will stay home.", "note": "if：下雨就待在家"}, {"s": "Even though he was tired, he finished his homework.", "note": "even though：让步加强版"}], "errors": [{"wrong": "Although it was cold, but he didn't wear a jacket.", "right": "Although it was cold, he didn't wear a jacket. / It was cold, but he didn't wear a jacket.", "type": "母语迁移-双连词（虽然…但是）", "diag": "研究合集第 4 章点名的中国学生专项错误：汉语成对关联词迁移。两个连接点留一个。回补机制第 4 节；因果版见 GR-11。"}, {"wrong": "Although the task was difficult, but everyone completed it.", "right": "Although the task was difficult, everyone completed it.", "type": "母语迁移-双连词（虽然…但是）", "diag": "同一个坑：although 已经标好了让步关系，but 是多余的第二个连接点。回补机制第 4 节。"}, {"wrong": "If you study.", "right": "If you study, you will pass.", "type": "句子残缺（fragment）", "diag": "if 带的也是挂车，要挂上主句才完整。回补 NEW-CJ04 机制第 1 节。"}], "quiz": [{"q": "改错：Although I was tired, but I went to bed late.", "ans": "删掉 but（或删掉 although、把 but 留下并改成两个分句：一座桥只留一个连接点）。", "hint": "回到机制第 4 节「双连词坑」。"}, {"q": "unless 的意思最接近哪一个？A. if…not B. because", "ans": "A——unless ≈ if…not（要是不……就不……）。", "hint": "回到机制第 2 节。"}], "groups": [{"title": "🧩 分组看看：条件队", "items": [{"name": "if", "gloss": "要是……（条件成立，结果才来）", "ex": "If you study, you will pass."}, {"name": "unless", "gloss": "除非……；要是不……就不……", "ex": "She won't go unless you invite her."}, {"name": "even if", "gloss": "即使……也（认脸）", "ex": "Even if it rains, we will go."}]}, {"title": "🧩 分组看看：让步队", "items": [{"name": "although", "gloss": "尽管……（先让一步）", "ex": "Although the task was difficult, everyone completed it."}, {"name": "though", "gloss": "和 although 同义，口语里更常见", "ex": "Though it was cold, he didn't wear a jacket."}, {"name": "even though", "gloss": "尽管……（语气比 although 更强）", "ex": "Even though he was tired, he finished his homework."}]}], "note": "与 GR-11 互挂：GR-11 管 because…so，本条管 although…but，是同一个「双连词」家族的两个成员。", "adult": [{"k": "研究依据：", "t": "条件/让步分组与词表出自研究合集 1.4；双连词规则引 Cambridge 语法栏原话与错误示范（经教材转引核对，index），学理说明见合集第 4 章（UKEssays 转引 Leung & Holmer 关于中国 ESL 学习者的研究：汉语 因为…所以…、虽然…但是… 为成对关联词，学习者把成对习惯迁移进英语）。though 与 although 同义为分类表通例；even if 例句为呈现层新拟。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "GR-32", "isNew": false, "group": 2, "short": "搭档不能串门", "desc": "both 的搭档是 and，either 的搭档是 or：成对出门不串门，夹着的东西还要长得一样——I like both cats and dogs.", "formal": "关联词成对出门：both…and、either…or 各就其位，并列成分要同形，动词听离它最近的那个主语", "kid": "both 和 and 是一对搭档，搭档不能串门；两个搭档夹着的东西要长得一样；either…or 领着两个主语时，动词听离它最近的那个", "beats": [{"name": "搭档不能串门", "text": "both 的搭档是 and，either 的搭档是 or，neither 的搭档是 nor——每对搭档一起出门，不许跟别人组队。"}, {"name": "夹着的东西要同形", "text": "把关联词分别贴到两边读：I like both swimming and running——两边都是 -ing，长得一样；一头是动作、一头是名词，就别扭了。"}, {"name": "动词听最近的那个", "text": "either…or、neither…nor 领着两个数不一样的主语时，动词听离它最近的那个：students 在近处就 were，teacher 在近处就 was。"}], "examples": [{"s": "I like both cats and dogs.", "note": "配对+同形：both…and 夹着两个名词"}, {"s": "She likes both music and dancing.", "note": "同形现场：both 移到两个名词短语前面，两边对齐"}, {"s": "Neither the teacher nor the students were late.", "note": "就近现场：动词听近处的 students"}, {"s": "Neither the students nor the teacher was late.", "note": "顺序一换：动词改听近处的 teacher"}, {"s": "Either tea or juice is fine.", "note": "新拟例句：either…or 二选一，动词听近处的 juice"}, {"s": "Both my brother and my sister like music.", "note": "新拟例句：both…and 夹着两个名词短语，同形"}], "errors": [{"wrong": "She both likes music and dancing.", "right": "She likes both music and dancing.", "type": "平行结构错位", "diag": "清单机制栏登记的错位例：both 的辖域只盖住 likes，后半盖不住；把 both 移到两个同形成分之前即对齐。回补机制第 2 节。"}, {"wrong": "The teacher and the students was happy.", "right": "The teacher and the students were happy.", "type": "就近误用-and 主语", "diag": "清单边界明示：and 连接的主语永远复数，不适用就近（*The teacher and the students was 不成立）。回补机制第 3 节：就近只管 or/nor。"}], "quiz": [{"q": "both 的搭档是 and 还是 or？", "ans": "and——both…and 是一对，搭档不能串门。", "hint": "回到机制第 1 节「搭档不能串门」。"}, {"q": "选词填空：Neither the cat nor the dogs ___ in the garden. A. is B. are", "ans": "B——动词听离它最近的那个主语（dogs）。", "hint": "回到机制第 3 节「动词听最近的那个」。"}], "groups": [{"title": "🧩 分组看看：四对搭档", "items": [{"name": "both…and", "gloss": "两个都要，一起出门", "ex": "I like both cats and dogs."}, {"name": "either…or", "gloss": "二选一", "ex": "Either tea or juice is fine."}, {"name": "neither…nor", "gloss": "两个都不要；这对自带否定，后面不再加否定词", "ex": "Neither the teacher nor the students were late."}, {"name": "not only…but also", "gloss": "不但…而且；also 可以省，but 不能省（专项见 NEW-CJ08）", "ex": "She not only sings well but also dances well."}]}], "note": "目录登记的同族规律：GR-12、GR-34（不在本区）。not only…but also 的专项讲解见 NEW-CJ08。", "adult": [{"k": "目录论断：", "t": "① 配对纪律：关联并列是封闭配对——both…and…、either…or…、neither…nor…、not only…but also…（also 可省、but 不可省），混搭不成立。② 同形原则：关联词之后紧跟的成分必须同类同形。③ not only 前置句首时后半句主辅倒装。④ 就近原则：either…or / neither…nor 连接数不一致的主语时，谓语与较近的主语一致——就近在一致三原则（语法一致、意义一致、就近一致）中排位最末，只管 or/nor 型并列。"}, {"k": "适用范围：", "t": "就近只管 or/nor 型并列主语；and 连接的主语永远复数，不适用就近"}, {"k": "来源：", "t": "Purdue OWL 关联并列条；CGEL 一致三原则；Swan《PEU》——接触等级：二手系统论述级"}, {"k": "边界：", "t": "① 就近原则只管 or/nor 型并列主语；and 连接的主语永远复数。② 就近不是通用许可：The quality of the mangoes is… 中谓语必须跟真正主语 quality，跟着近处走是「就近错误」。③ 混合数主语时把复数放后面更自然，是文体建议非语法强制。④ neither…nor 本身已含否定，谓语不再加否定词。"}, {"k": "争议：", "t": "就近原则的地位有温和分歧：严格形式语法倾向把它处理为「意义一致」的副产品或口语宽容，CGEL 明列为独立原则之一。教学口径取 CGEL：规则照教，但明确它排位最末，与语法一致冲突时语法一致优先。"}, {"k": "证据等级：", "t": "二手系统论述级"}]}, {"id": "NEW-CJ08", "isNew": true, "group": 2, "short": "not only…but also：强调搭档", "desc": "想强调「不光这样，还那样」，就请这对搭档：She not only sings well but also dances well.", "formal": "Grammarly：\"Correlative conjunctions are pairs of conjunctions that work together.\"；平行结构要求（Grammarly）：\"Make sure that the phrases joined by conjunctions are parallel (share the same structure).\"；配对表例（Lumen）：\"He is not only handsome, but also brilliant.\"", "kid": "这对搭档是放大器：第一件已经不错，第二件还要更上一层。", "beats": [{"name": "成对出现，缺一不可", "text": "not only 一露面，but also 就在后面等着它——Khan Academy 的说法是 matched pairs（配好对的搭档）：看见一个，就该想到另一个。"}, {"name": "两边要同形", "text": "搭档夹着的两样东西要长得一样：都是动作，或者都是名词，或者都是形容词。一头是名词、一头是动作，就别扭了（平行结构）。"}, {"name": "also 可省，but 不可省", "text": "but also 里的 also 有时可以省，but 不能省（目录 GR-32 的 claim 定版）；省错了地方，搭档就散了。"}], "examples": [{"s": "He is not only handsome, but also brilliant.", "note": "Lumen 配对表原例"}, {"s": "She not only sings well but also dances well.", "note": "研究合集平行结构正例：两边都是动词短语"}, {"s": "He speaks not only English but also French.", "note": "夹名词：English 和 French 同形"}, {"s": "We visited not only the zoo but also the museum.", "note": "夹名词短语：the zoo 和 the museum 同形"}, {"s": "The park is not only big but also beautiful.", "note": "夹形容词：big 和 beautiful 同形"}, {"s": "The cake is not only sweet but also soft.", "note": "夹形容词"}], "errors": [{"wrong": "She is not only a good singer but also dances well.", "right": "She not only sings well but also dances well.", "type": "平行结构不对齐", "diag": "研究合集 1.5 的原例：一头是名词短语 a good singer，一头是动词 dances——把两边都改成动词短语就对齐了。回补机制第 2 节。"}, {"wrong": "I like not only cats and dogs.", "right": "I like not only cats but also dogs.", "type": "搭档缺席", "diag": "not only 出了门，搭档 but also 没跟上；这里要表「不但…而且」就得成对出现。回补机制第 1 节。"}], "quiz": [{"q": "补搭档：She not only reads fast ___ also remembers well. A. but B. or", "ans": "A——not only 的搭档是 but also。", "hint": "回到机制第 1 节。"}, {"q": "哪句两边同形？A. She is not only a singer but also dances. B. She not only sings but also dances.", "ans": "B——两边都是动词（sings / dances）。", "hint": "回到机制第 2 节「两边要同形」。"}], "groups": [{"title": "🧩 分组看看：搭档夹着的东西要同形", "items": [{"name": "夹动词", "gloss": "两边都是动词短语", "ex": "She not only sings well but also dances well."}, {"name": "夹名词", "gloss": "两边都是名词（短语）", "ex": "He speaks not only English but also French."}, {"name": "夹形容词", "gloss": "两边都是形容词", "ex": "The park is not only big but also beautiful."}]}], "note": "进阶角（给老师）：not only 放到句首时，后半句要部分倒装——Not only is he handsome, but also he is brilliant.（Lumen 配对表原文）小学阶段不要求孩子硬用，认识即可。", "adult": [{"k": "研究依据：", "t": "配对与平行结构出自研究合集 1.5：Grammarly 关联连词条（index）、Lumen 配对表（verified live）、Khan Academy「matched pairs」讲解（转录，index）；错误示范与修正句为合集 1.5 原例。also 可省一条取自目录 GR-32 的 claim 定版。句首倒装只进本页「进阶角」与成人层，不进孩子机制层。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ09", "isNew": true, "group": 3, "short": "连接副词不是连词：力气小，靠分号", "desc": "however、therefore 看着像连词，其实是副词，力气小：只用逗号粘不住两个完整句——It was raining; however, we stayed home.", "formal": "Purdue OWL：\"Use a semicolon to join two independent clauses when the second clause begins with a conjunctive adverb (however, therefore, moreover, furthermore, thus, meanwhile, nonetheless, otherwise) or a transition (in fact, for example, that is, for instance, in addition, in other words, on the other hand, even so).\"；QuillBot：并列连词可以用逗号连接两个独立分句，连接副词 \"are not strong enough to be used in this way\"；公式（SJSU）：\"Independent clause; [conjunctive adverb], independent clause.\"", "kid": "but 是钉子：逗号加 but 就把两个句子钉住了。however 只是标签：力气小，得先有分号或句号这面墙，它才能贴上去。", "beats": [{"name": "它其实是副词", "text": "连接副词不是连词，是副词（或副词短语）：普通副词修饰一个词，它修饰整个分句，负责表明和前一句的逻辑关系（ThoughtCo / QuillBot 定义）。"}, {"name": "分号公式", "text": "完整句 ; 连接副词, 完整句。——分号在前、逗号在后。也可以把分号换成句号，拆成两句：It was raining. However, we stayed home.分号表示关系更紧，句号表示停顿更强（QuillBot）。"}, {"name": "只用逗号 = 逗号粘连", "text": "连接副词没有粘合的语法力量，只用逗号把它夹在两个完整句之间，就是 comma splice 逗号粘连（Purdue OWL：\"Avoid comma splices\"）。这正是 GR-38 的头号病例。"}, {"name": "删掉它，句子还在", "text": "连接副词删掉，两个分句照样成立，只是少了逻辑提示（Grammarly：technically optional）；连词删掉，连接当场断裂。这也是它「力气小」的证据。"}], "examples": [{"s": "She had studied nonstop for months; consequently, she passed her exam with flying colors.", "note": "QuillBot 原例：分号 + consequently + 逗号"}, {"s": "It was raining; however, we stayed home.", "note": "分号公式标准形"}, {"s": "It was raining. However, we stayed home.", "note": "句号版：拆成两句同样正确"}, {"s": "The road was blocked. Therefore, we turned back.", "note": "句号 + Therefore（研究合集规则 B 例）"}, {"s": "He studied hard for the test; however, he didn't pass.", "note": "EnglishClub 转折组原例"}, {"s": "She didn't study for the exam; therefore, she failed.", "note": "EnglishClub 因果组原例"}, {"s": "The kids were playing outside; meanwhile, their mother was preparing lunch.", "note": "EnglishClub 顺序组原例"}], "errors": [{"wrong": "The night was cold and dark, however, Gladys was prepared.", "right": "The night was cold and dark. However, Gladys was prepared.", "type": "逗号粘连（连接副词版）", "diag": "QuillBot 的正误对照原例：只用逗号连接 however 两边的完整句，就是 comma splice。回补机制第 2、3 节。"}, {"wrong": "It was raining, however, we stayed home.", "right": "It was raining; however, we stayed home. / It was raining. However, we stayed home.", "type": "逗号粘连（连接副词版）", "diag": "研究合集 4.1 的原例与改法。回补机制第 3 节；定版见 GR-38。"}, {"wrong": "She was tired, however she continued.", "right": "She was tired; however, she continued.", "type": "把 however 当 but 用", "diag": "研究合集 4.5：however 不是 but，标点规矩完全不同。回补机制第 1 节。"}], "quiz": [{"q": "哪句对？A. It was cold, however, we stayed home. B. It was cold; however, we stayed home.", "ans": "B——分号在前、逗号在后。", "hint": "回到机制第 2 节「分号公式」。"}, {"q": "however 是连词还是副词？", "ans": "副词（连接副词）——所以它粘不住句子，要靠分号或句号。", "hint": "回到机制第 1 节。"}], "groups": [{"title": "🧩 分组看看：三种粘法比力气", "items": [{"name": "逗号 + 并列连词", "gloss": "钉子级：足够粘住两个完整句", "ex": "It was raining, but we stayed home."}, {"name": "分号 + 连接副词", "gloss": "先有分号这面墙，再贴 however 标签", "ex": "It was raining; however, we stayed home."}, {"name": "句号 + 连接副词", "gloss": "干脆拆成两句，停顿更强", "ex": "It was raining. However, we stayed home."}, {"name": "只有逗号", "gloss": "✗ 逗号粘连，谁也粘不住", "ex": "✗ It was raining, we stayed home."}]}], "note": "与 GR-38 互挂：逗号粘连的目录定版、四种合法连接在 GR-38；本条专管连接副词这一高发场景。", "adult": [{"k": "研究依据：", "t": "分号规则引 Purdue OWL（verified live）原话；「not strong enough」引 QuillBot（verified live）；公式引 SJSU Writing Center 讲义（index）；定义引 ThoughtCo（Nordquist，verified live）与 QuillBot；「可删性」引 Grammarly 分号条目（index）。钉子/标签比喻为研究合集标注的教学转述，规则本身以上述原文为准。Cambridge 称此类词为 linking adjuncts。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ10", "isNew": true, "group": 3, "short": "连接副词八组功能队", "desc": "按工作分队：转折请 however，因果请 therefore，排顺序请 first、next、finally——先想清要表达哪种关系，再去对应的队里拿词。", "formal": "ThoughtCo：\"a conjunctive adverb is an adverb or adverbial phrase that indicates a relation in meaning between two sequential independent clauses (or main clauses)\"；Cambridge 称此类词为 linking adjuncts。分类表综合 EnglishClub / QuillBot / ThoughtCo 三家（研究合集第 2 章）。", "kid": "连接副词像一个工具箱，每组干一种活：加话、转弯、说结果、排顺序……先想好要干哪种活，再打开对应的格子。", "beats": [{"name": "先认活，再选词", "text": "选连接副词的第一步不是背词，是想清两句话是什么关系：是往上加（添加），还是拐弯（转折），还是前因后果（因果）——关系定了，词就定了。"}, {"name": "小学先精学几个", "text": "however（转折）、therefore（因果）、first / next / finally（顺序）、for example（举例）最常用，先精学；其余的在「分组看看」里认脸，阅读时能认出就行（研究合集第 5 章的分段建议）。"}, {"name": "每组都有连词工友", "text": "连接副词和连词有功能对应：and ↔ moreover（添加）、but ↔ however（转折）、so ↔ therefore（结果）、yet ↔ nevertheless（让步转折）——活儿一样，词性和标点规矩不一样（研究合集第 3 章功能对应表）。"}], "examples": [{"s": "She loves playing the piano; moreover, she is a great singer.", "note": "添加队 moreover（EnglishClub 原例）"}, {"s": "He studied hard for the test; however, he didn't pass.", "note": "转折队 however（EnglishClub 原例）"}, {"s": "She didn't study for the exam; therefore, she failed.", "note": "因果队 therefore（EnglishClub 原例）"}, {"s": "Gather the ingredients. Next, mix them together.", "note": "顺序队 next（QuillBot 原例）"}, {"s": "He is my best friend. In fact, he is like my brother.", "note": "强调队 in fact"}, {"s": "Some animals sleep all winter; for example, bears sleep for months.", "note": "举例队 for example"}, {"s": "Tom is good at drawing. Similarly, his sister is good at painting.", "note": "类比队 similarly"}, {"s": "In conclusion, reading is fun and good for us.", "note": "总结队 in conclusion"}], "errors": [{"wrong": "I like reading, moreover, I like writing.", "right": "I like reading; moreover, I like writing. / I like reading. Moreover, I like writing.", "type": "逗号粘连（连接副词版）", "diag": "moreover 和 however 一样是连接副词：只用逗号粘不住。回补 NEW-CJ09 机制第 2、3 节。"}, {"wrong": "The movie was boring. However I stayed to the end.", "right": "The movie was boring. However, I stayed to the end.", "type": "连接副词后漏逗号", "diag": "连接副词放在句首时，后面要加逗号（Purdue OWL：逗号用在 transitional element 之后）。回补机制第 1 节。"}], "quiz": [{"q": "要表「转折」，去哪组拿词？A. however B. therefore", "ans": "A——however 是转折队的队长。", "hint": "回到分组看看的转折队。"}, {"q": "给做事排顺序，用哪一组？A. first, next, finally B. however, nevertheless", "ans": "A——顺序队专门排先后。", "hint": "回到机制第 2 节。"}], "groups": [{"title": "🧩 分组看看：八组功能队（每组先精学带 ★ 的，其余认脸）", "items": [{"name": "添加队 moreover ★", "gloss": "认脸：furthermore, in addition, also, besides", "ex": "She loves playing the piano; moreover, she is a great singer."}, {"name": "转折队 however ★", "gloss": "认脸：nevertheless, instead, on the other hand", "ex": "He studied hard for the test; however, he didn't pass."}, {"name": "因果队 therefore ★", "gloss": "认脸：consequently, as a result, thus", "ex": "She didn't study for the exam; therefore, she failed."}, {"name": "顺序队 first / next / finally ★", "gloss": "认脸：then, meanwhile, eventually", "ex": "First, wash the apples. Next, cut them. Finally, eat them."}, {"name": "强调队 in fact", "gloss": "认脸：indeed, actually", "ex": "He is my best friend. In fact, he is like my brother."}, {"name": "举例队 for example ★", "gloss": "认脸：for instance, namely", "ex": "Some animals sleep all winter; for example, bears sleep for months."}, {"name": "类比队 similarly", "gloss": "认脸：likewise", "ex": "Tom is good at drawing. Similarly, his sister is good at painting."}, {"name": "总结队 in conclusion", "gloss": "认脸：overall, in summary, in short", "ex": "In conclusion, reading is fun and good for us."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "八组分类综合 EnglishClub / QuillBot / ThoughtCo 三家分类表（三源重合度高，研究合集 2.2）；ThoughtCo 另有字母序总表备查。功能对应表见合集第 3 章。分段建议（合集 5.5）：连接副词对小学生只要求认识 however / therefore / first / next / finally 的篇章用法，不要求分号写作——本页例句中的分号句式供高年级与教师层。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "NEW-CJ11", "isNew": true, "group": 3, "short": "连接副词会走动", "desc": "however、therefore 能在自己的分句里搬家：句首、主谓之间、句末都可以住——It was raining; we, however, stayed home. 逗号跟着它走。", "formal": "ThoughtCo 引 Reid《The Prentice Hall Guide for College Writers》移动测试：\"Conjunctive adverbs can be moved; subordinating conjunctions (such as if and because) and coordinating conjunctions (but, or, yet, for, and, nor, so) cannot.\"；Cambridge：linking adjuncts \"can come in any position which an adverb can occupy\"。", "kid": "连词是钉死的，连接副词是活的：它能在自己的分句里搬家，搬到哪里，逗号就跟到哪里。", "beats": [{"name": "移动测试", "text": "分不清一个词是连词还是连接副词？把它在分句里挪个位置试试：能挪的是连接副词，挪了就坏的是连词（ThoughtCo 引 Reid 的判别法）。"}, {"name": "三个住址", "text": "句首：分号或句号之后，后面加逗号。主谓之间：前后各加一个逗号。句末：前面加逗号，后面是句号。（MIT Writing Guide 三位置规则）"}, {"name": "连词不能搬", "text": "but、because 们钉在原地：并列连词必须站在两个成分之间，从属连词必须站在自己分句的最前面——搬走，句子就坏了（Cambridge）。"}], "examples": [{"s": "It was raining; however, we stayed home.", "note": "句首：however 住在分句开头"}, {"s": "It was raining; we, however, stayed home.", "note": "句中：however 住在主谓之间，前后逗号"}, {"s": "The test was hard; I passed it, however.", "note": "句末：however 住在分句末尾，前面逗号"}, {"s": "The sun came out; therefore, we went to the park.", "note": "therefore 句首版"}, {"s": "She was tired. She, however, kept working.", "note": "句中版：however 被两个逗号夹住"}, {"s": "The lithium ion battery lasts longer than the NiCad battery; therefore, one lithium ion battery may suffice.", "note": "MIT Writing Guide 演示原例（教师演示用）"}], "errors": [{"wrong": "However it was raining, we stayed home.", "right": "Although it was raining, we stayed home. / It was raining; however, we stayed home.", "type": "把 however 当从属连词领句", "diag": "however 不是连词，不能像 although 那样领着一个分句往前走；它只能住在第二个分句里面。回补机制第 1、3 节。"}, {"wrong": "It was cold; therefore we stayed home.", "right": "It was cold; therefore, we stayed home.", "type": "句首连接副词后漏逗号", "diag": "连接副词住在句首时，后面必须跟逗号（MIT 规则一）。回补机制第 2 节。"}], "quiz": [{"q": "哪个词能在分句里搬家？A. because B. however", "ans": "B——能搬家的是连接副词 however。", "hint": "回到机制第 1 节「移动测试」。"}, {"q": "It was late; we, ___, went home.（填 however）——however 前后要不要加逗号？", "ans": "前后都要加：we, however, went home.", "hint": "回到机制第 2 节「三个住址」。"}], "groups": [{"title": "🧩 分组看看：therefore 的三个住址（MIT 演示原句）", "items": [{"name": "句首", "gloss": "分号在前，它后面加逗号", "ex": "The lithium ion battery lasts longer than the NiCad battery; therefore, one lithium ion battery may suffice."}, {"name": "主谓之间", "gloss": "前后各加一个逗号，像插入语", "ex": "The lithium ion battery lasts longer than the NiCad battery; one lithium ion battery, therefore, may suffice."}, {"name": "句末", "gloss": "前面加逗号，后面是句号", "ex": "The lithium ion battery lasts longer than the NiCad battery; one lithium ion battery may suffice, therefore."}]}], "note": null, "adult": [{"k": "研究依据：", "t": "移动测试引 ThoughtCo 转引 Reid（verified live）；三位置标点对照为 MIT Writing Guide 规则（index，QuillBot / Lumen 交叉一致）；Cambridge 的 as a result 三位置演示同向。EnglishClub 补充：therefore / thus / consequently 表严格因果时多放句首，however / indeed / in fact 放句中最自由（index）。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}, {"id": "GR-38", "isNew": false, "group": 4, "short": "逗号钩不住两节车厢", "desc": "两个完整句之间只放一个逗号，叫逗号粘连：It rained, I stayed home. ——逗号太细，钩不住两节车厢。", "formal": "标点是语法的一部分：英语的逗号扛不起两个完整句子，撇号也不是装饰", "kid": "逗号太细，钩不住两节完整的车厢：两个各自能站住的句子之间只放一个逗号，叫「逗号粘连」，是正式错误；汉语能用逗号一路串下去，这个习惯别搬进英语", "beats": [{"name": "逗号钩不住车厢", "text": "两个完整的句子像两节车厢：中间只挂一个逗号，钩子太细，跑起来就脱钩。要么分开（句号），要么换粗钩（分号、逗号+连词），要么把一节车厢降成挂车（从句）。"}, {"name": "撇号的两份工作", "text": "撇号有两份工作：Tom's 是「谁的」，it's 是「it is 的缩写」。分不清时展开一读：能展开成 it is 的，就是带撇号的那个。"}, {"name": "名家例外，学生不用（呈现层补充）", "text": "文学作品里短小平行句连排（I came, I saw, I conquered 式）是修辞手法，不判错；但学生写作不适用这个例外，判据以正式书面语为准。另外，分号连接要求两个分句意思密切相关。（据目录成人层边界）"}], "examples": [{"s": "It rained. I stayed home.", "note": "合法连接一：句号分开"}, {"s": "It rained, so I stayed home.", "note": "合法连接二：逗号+并列连词（与 GR-11 互挂）"}, {"s": "It's a cat.", "note": "撇号省略职现场：It's = It is"}, {"s": "This is Tom's book.", "note": "撇号所属职现场（人名 Tom 为句中专名，锚词取 book）"}, {"s": "It rained; I stayed home.", "note": "合法连接三：分号连接（目录 claim 登记的四种合法连接之一，此例为呈现层补例）"}, {"s": "I stayed home because it rained.", "note": "合法连接四：把一分句降级为从属分句（新拟例句）"}], "errors": [{"wrong": "It rained, I stayed home.", "right": "It rained, so I stayed home. / It rained. I stayed home.", "type": "逗号粘连", "diag": "美国大学写作中心一致把逗号粘连列为头号句界错误；中国学习者的发生率叠加了意合迁移（连淑能形合/意合对照）。回补机制第 1 节：四种合法连接选一种。"}, {"wrong": "The sun came out, we played outside.", "right": "The sun came out, so we played outside. / The sun came out. We played outside.", "type": "逗号粘连", "diag": "据目录登记错型补成的完整病例：四种合法连接任选其一。回补机制第 1 节「逗号钩不住车厢」。"}, {"wrong": "Its a cat.", "right": "It's a cat.", "type": "撇号省略职缺失（its / it's 混淆）", "diag": "据目录 claim 第 2 点补成的完整病例：能展开成 it is 的，就带撇号。回补机制第 2 节「撇号的两份工作」。"}], "quiz": [{"q": "两个完整句子之间只放一个逗号，行不行？", "ans": "不行，那是逗号粘连；要用句号、分号、逗号+连词，或把一句降为从句。", "hint": "回到机制第 1 节「逗号钩不住车厢」。"}, {"q": "哪个词是「它的」？A. its B. it's", "ans": "A——it's 是 it is 的缩写，带撇号。", "hint": "回到机制第 2 节「撇号的两份工作」。"}], "groups": [{"title": "🧩 分组看看：四种合法连接", "items": [{"name": "句号分开", "gloss": "干脆利落，两句各站各的", "ex": "It rained. I stayed home."}, {"name": "分号连接", "gloss": "两句意思贴得近时用分号", "ex": "It rained; I stayed home."}, {"name": "逗号 + 并列连词", "gloss": "逗号后面跟上 so、but 等连词（与 GR-11 互挂）", "ex": "It rained, so I stayed home."}, {"name": "降级为从句", "gloss": "把一节车厢降成挂车：加 because 等从属连词", "ex": "I stayed home because it rained."}]}, {"title": "🧩 分组看看：撇号的两份工作", "items": [{"name": "所属职", "gloss": "Tom's 里的 's 是「谁的」", "ex": "This is Tom's book."}, {"name": "省略职", "gloss": "it's = it is，撇号占了被省掉字母的位置", "ex": "It's a cat."}, {"name": "复数不加", "gloss": "普通复数绝不加撇号", "ex": "Two apples are on the table."}]}], "note": "与 GR-11 互挂：GR-11 的合法句「It rained, so I stayed home.」用的正是本条的第三种合法连接；NEW-CJ09 的分号公式也回到本条。", "adult": [{"k": "目录论断：", "t": "① 逗号粘连：两个独立分句之间只用逗号连接，在标准英语书面语中是句子边界错误；合法连接只有四种——句号分开、分号连接、逗号+并列连词、把一分句降级为从属分句。根源是句法类型差：英语是形合语言，分句关系必须明示层级；汉语是意合语言，流水句靠逗号连排合法。② 撇号二职：表所属（Tom's book）与表省略（it's = it is）；its（所属）无撇号、it's（是）有撇号；普通复数绝不加撇号。"}, {"k": "适用范围：", "t": "判据以正式书面语为准；口语转写与非正式写作（短信、日记）中逗号粘连的容忍度高"}, {"k": "来源：", "t": "Fordham、Utah Valley、Waterloo 三校写作中心讲义（本轮打开互证）；连淑能《英汉对比研究》（1993）；Swan《PEU》——接触等级：教学定版转述级（形合/意合一条经 2026-11-02 篇目级核实，见 pending 销项）"}, {"k": "边界：", "t": "① 文学例外：短小平行分句的连排（I came, I saw, I conquered 式）是修辞手法，不判错——学生写作不适用此例外。② 口语转写与非正式写作中容忍度高，本条判据以正式书面语为准。③ 分号连接要求两分句语义密切相关。④ its/it's 对母语者同样高频混淆，不渲染为中国学习者独有。"}, {"k": "争议：", "t": "无实质分歧。仅定性差：部分写作手册把逗号粘连称「重罪」，语料取向的用法学家（如 Pinker 一线）指出名家写作中不乏此式——登记为教学严格度之争，学校写作口径从严。"}, {"k": "证据等级：", "t": "教学定版转述级"}]}, {"id": "NEW-CJ12", "isNew": true, "group": 4, "short": "身兼数职的词：看后面跟什么", "desc": "before、after、since、until 有好几副面孔：后跟名词是介词，后跟句子是连词，后面什么都不跟是副词——I had never been there before.", "formal": "Khan Academy 提醒：\"some of these you might recognize as being adverbs or prepositions in other contexts… You may notice some of them like, after and before, are prepositions.\"；判别标准（研究合集 1.6）：看它后面跟什么——跟名词/代词是介词，跟完整分句是从属连词，后面什么都不跟、单独修饰动词是副词。", "kid": "同一个词，换个位置就换一身衣服。想知道它今天当什么，别看它长什么样，看它后面跟着什么。", "beats": [{"name": "判别法：看后面", "text": "三步认人：后面跟名词或代词 → 介词；后面跟一整个分句（主语 + 动词）→ 从属连词；后面什么都不跟 → 副词。"}, {"name": "before 的三副面孔", "text": "before the lesson（介词）/ before I come back（连词）/ had never been there before（副词）——同一个 before，三种身份，全看后面。"}, {"name": "since 一词两义", "text": "since 当连词时有两副面孔：表时间「自从」（since she won）和表原因「既然」（since the road was blocked）；当介词时只表时间（since 2020）。until / till 也是介词、连词两栖。"}], "examples": [{"s": "We shall discuss it before the lesson.", "note": "before 介词脸：后面跟名词 the lesson（研究合集原例）"}, {"s": "Don't go away before I come back.", "note": "before 连词脸：后面跟分句 I come back（研究合集原例）"}, {"s": "I had never been there before.", "note": "before 副词脸：后面什么都不跟（研究合集原例）"}, {"s": "We play games after school.", "note": "after 介词脸：after school"}, {"s": "We went home after the meeting ended.", "note": "after 连词脸：后面跟分句"}, {"s": "I haven't seen him since 2020.", "note": "since 介词脸：后面跟年份（时间）"}, {"s": "We waited until Friday.", "note": "until 介词脸：后面跟名词 Friday"}, {"s": "We waited until you called.", "note": "until 连词脸：后面跟分句 you called"}], "errors": [{"wrong": "「I had never been there before.」里的 before 是连词。", "right": "是副词：它后面什么都不跟，单独修饰 been there。", "type": "身份误判", "diag": "判别病例：认身份不看长相，看后面跟什么。回补机制第 1 节。"}, {"wrong": "「We shall discuss it before the lesson.」里的 before 是连词。", "right": "是介词：它后面跟的是名词 the lesson，不是一个分句。", "type": "身份误判", "diag": "判别病例：后面跟名词 → 介词脸。回补机制第 1、2 节。"}], "quiz": [{"q": "「Call me before you leave.」里的 before 是什么？A. 介词 B. 连词", "ans": "B——它后面跟的是分句 you leave。", "hint": "回到机制第 1 节「判别法：看后面」。"}, {"q": "「I have seen this film before.」里的 before 是什么？", "ans": "副词——它后面什么都不跟。", "hint": "回到机制第 2 节。"}], "groups": [{"title": "🧩 分组看看：before 的三副面孔", "items": [{"name": "介词脸", "gloss": "后面跟名词 / 代词", "ex": "We shall discuss it before the lesson."}, {"name": "连词脸", "gloss": "后面跟完整分句（主语 + 动词）", "ex": "Don't go away before I come back."}, {"name": "副词脸", "gloss": "后面什么都不跟", "ex": "I had never been there before."}]}, {"title": "🧩 分组看看：其他多面手", "items": [{"name": "after", "gloss": "after school 是介词脸；after the meeting ended 是连词脸", "ex": "We play games after school."}, {"name": "since", "gloss": "since 2020 介词脸（时间）；since she won 连词脸（时间）；since the road was blocked 连词脸（原因）", "ex": "Since the road was blocked, we took another route."}, {"name": "until", "gloss": "until Friday 介词脸；until you call 连词脸", "ex": "We waited until you called."}]}], "note": "so 也是多面手：并列连词（结果）、so that 的省略式、副词（so tired）——研究合集指出这是中国学习者最困惑的词之一；though 也有连词脸与句末副词脸（I like it, though.）。", "adult": [{"k": "研究依据：", "t": "判别法与 before 三例引研究合集 1.6（Khan Academy 讲解转录，index；例句为合集原文）；since 三用法、until/till 两栖同出该节。so 的三重身份与 though 的双身份见合集 1.6 及第 4 章注（UKEssays 转引研究指 so 的多重身份是中国学习者困惑点）。"}, {"k": "状态：", "t": "新拟规律，尚未与规律目录对账（待对账）；内容依据下列研究来源，与目录冲突时以目录为准。"}]}];
var EXTRA_TOP = "\n<div class=\"card\"><h3>🚦 先记住一条总路线：三步选连接词</h3>\n<div class=\"flow\">\n<div class=\"step fstep d1\"><b>第 1 步</b>：两边一样重要吗？一样重要 → 用<b>并列连词</b>（FANBOYS）；或者用<b>连接副词</b>，但标点要跟上</div>\n<div class=\"arrow\">↓ 有一边说不完、像挂车</div>\n<div class=\"step fstep d2\"><b>第 2 步</b>：有一边是「挂车」（半句话）吗？是 → 用<b>从属连词</b>，把挂车挂上主句</div>\n<div class=\"arrow\">↓ 最后检查标点</div>\n<div class=\"step fstep d3\"><b>第 3 步</b>：标点配对了吗？逗号 + 连词 ✓ ；分号 + 连接副词， ✓ ；只有一个逗号 ✗（逗号粘连）</div>\n</div>\n<p style=\"font-size:12px;color:#7386a0;margin-top:8px\">路线依据：Purdue OWL 标点规则与研究合集第 3 章对比表；细则见 NEW-CJ03、NEW-CJ09 与 GR-38。</p></div>\n";
var EXTRA_BOTTOM = "\n<div class=\"card\"><h3>🎬 看视频学</h3>\n<p>🎵 <a href=\"https://www.youtube.com/watch?v=RPoBE-E8VOc\" target=\"_blank\" rel=\"noopener\">Schoolhouse Rock《Conjunction Junction》(1973)</a>——最经典的连词歌，一句歌词就是定义：\"Hooking up words and phrases and clauses.\"（把词、短语和句子钩在一起）</p>\n<p style=\"margin-top:6px\">🎤 <a href=\"https://www.khanacademy.org/humanities/grammar/parts-of-speech-the-preposition-and-the-conjunction/introduction-to-conjunctions/v/subordinating-conjunctions\" target=\"_blank\" rel=\"noopener\">Khan Academy 连词课</a>——FANBOYS 助记歌出自它的并列连词一课；这一课讲从属连词和「拆句判别法」：能拆成两个完整句的是并列，拆不开的是从属。</p>\n<p style=\"margin-top:6px\">📺 <a href=\"https://www.youtube.com/watch?v=nMQEq5wq3bQ\" target=\"_blank\" rel=\"noopener\">Sparkle English《FANBOYS and Coordinating Conjunctions》</a>——七兄弟逐个讲，还专设一节讲逗号。</p>\n<p style=\"font-size:12px;color:#7386a0;margin-top:8px\">链接与说明均出自研究合集第 5 章。</p></div>\n<div class=\"card\"><h3>⚖️ 一张表看清：连词 vs 连接副词</h3>\n<p><b>并列连词</b>（and / but / so）：真连词，两边平等，逗号 + 它就能连接两个完整句。</p>\n<p style=\"margin-top:4px\"><b>从属连词</b>（because / although / if）：真连词，把一半句子降成挂车，再挂上主句。</p>\n<p style=\"margin-top:4px\"><b>连接副词</b>（however / therefore）：是副词，不是连词——自己粘不住句子，要靠句号或分号。</p>\n<p style=\"font-size:12px;color:#7386a0;margin-top:8px\">功能对应（研究合集第 3 章）：and ↔ moreover · but ↔ however · so ↔ therefore · yet ↔ nevertheless。</p></div>\n";

/* ============ cjwb 白板播放器（节奏照 v5 定版：笔速 ×1.35、字幕长定停顿、病例幕加停） ============ */
var cjwbS = { sec:null, scene:0, playing:false, raf:0, items:[], total:0, drawTotal:0, hold:0, elapsed:0, baseElapsed:0, startTs:0,
              stage:null, hand:null, board:null, capText:null, capNo:null, dots:null, sceneNo:null, btn:null };
function cjwbCardHTML(id){
  return '<div class="sec"><h4>🎬 白板动画 · 先看一遍</h4>'
    + '<div class="cjwb-board" id="cjwbBoard"><svg class="cjwb-stage" id="cjwbStage" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg"></svg><div class="cjwb-hand" id="cjwbHand">✏️</div></div>'
    + '<div class="cjwb-capbar"><span class="cjwb-no" id="cjwbCapNo">第 1 镜</span><span id="cjwbCapText">白板老师正在准备……</span></div>'
    + '<div class="cjwb-ctrl"><button class="cjwb-btn cjwb-main" id="cjwbBtnPlay" onclick="cjwbTogglePlay()">⏸ 暂停</button>'
    + '<button class="cjwb-btn" onclick="cjwbReplay()">↻ 重播</button>'
    + '<span class="cjwb-sceneno" id="cjwbSceneNo"></span><div class="cjwb-dots" id="cjwbDots"></div></div>'
    + '<div class="cjwb-src">白板动画：一镜只讲一个意思，跟着笔尖一笔一笔画出来；画完会停一会儿，慢慢读字幕。</div>'
    + '<div class="cjwb-src">形式借鉴：通用白板范式（RSA / VideoScribe 逐笔揭示）＋ Khan Academy 黑板手写风。</div></div>';
}
function cjwbStop(){
  cjwbS.playing = false;
  if(cjwbS.raf){ cancelAnimationFrame(cjwbS.raf); cjwbS.raf = 0; }
  cjwbS.startTs = 0;
  if(cjwbS.hand){ try { cjwbS.hand.style.opacity = '0'; } catch(e){} }
}
function cjwbInit(){
  cjwbStop();
  var stage = document.getElementById('cjwbStage');
  if(!stage){ cjwbS.sec = null; return; }
  var top = stack[stack.length - 1];
  var sec = (top && top.view === 'law') ? CJWB_BY_ID[top.id] : null;
  if(!sec){ cjwbS.sec = null; return; }
  cjwbS.sec = sec; cjwbS.scene = 0; cjwbS.elapsed = 0; cjwbS.baseElapsed = 0;
  cjwbS.stage = stage;
  cjwbS.hand = document.getElementById('cjwbHand');
  cjwbS.board = document.getElementById('cjwbBoard');
  cjwbS.capText = document.getElementById('cjwbCapText');
  cjwbS.capNo = document.getElementById('cjwbCapNo');
  cjwbS.dots = document.getElementById('cjwbDots');
  cjwbS.sceneNo = document.getElementById('cjwbSceneNo');
  cjwbS.btn = document.getElementById('cjwbBtnPlay');
  cjwbRenderScene();
  cjwbPlayStart();
}
function cjwbRenderDots(){
  if(!cjwbS.dots || !cjwbS.sec) return;
  var n = cjwbS.sec.scenes.length;
  cjwbS.dots.innerHTML = '';
  for(var i = 0; i < n; i++){
    var d = document.createElement('span');
    d.className = 'cjwb-dot' + (i < cjwbS.scene ? ' done' : (i === cjwbS.scene ? ' now' : ''));
    cjwbS.dots.appendChild(d);
  }
  if(cjwbS.sceneNo) cjwbS.sceneNo.textContent = '第 ' + (cjwbS.scene + 1) + ' / ' + n + ' 镜';
}
function cjwbPrepare(){
  cjwbS.items = [];
  var els = cjwbS.stage.querySelectorAll('.cjwbd, .cjwbw, .cjwbf');
  var t = 120;
  els.forEach(function(el){
    var type = el.classList.contains('cjwbd') ? 'd' : (el.classList.contains('cjwbw') ? 'w' : 'f');
    var len = 0, dur;
    if(type === 'd'){
      try { len = el.getTotalLength(); } catch(e){ len = 260; }
      if(!len || !isFinite(len)) len = 260;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      dur = Math.max(240, Math.min(1700, len * 1.5 * 1.35));
    } else if(type === 'w'){ el.style.opacity = '0'; dur = Math.round(340 * 1.35); }
    else { el.style.opacity = '0'; dur = Math.round(420 * 1.35); }
    cjwbS.items.push({ el: el, type: type, len: len, start: t, dur: dur });
    t += dur * 0.88 + 40;
  });
  cjwbS.drawTotal = t + 260;
  var capLen = (cjwbS.sec && cjwbS.sec.scenes[cjwbS.scene]) ? String(cjwbS.sec.scenes[cjwbS.scene].cap || '').length : 0;
  var hold = Math.max(2000, Math.min(4800, capLen * 160));
  if(cjwbS.sec && cjwbS.scene === cjwbS.sec.scenes.length - 1) hold += 1200;
  cjwbS.hold = hold;
  cjwbS.total = cjwbS.drawTotal + hold;
}
function cjwbApplyAt(ms){
  var current = null;
  cjwbS.items.forEach(function(it){
    var p = (ms - it.start) / it.dur;
    p = p < 0 ? 0 : (p > 1 ? 1 : p);
    if(it.type === 'd'){ it.el.style.strokeDashoffset = String(it.len * (1 - p)); }
    else { it.el.style.opacity = String(p); if(it.type === 'w') it.el.style.transform = 'translateY(' + ((1 - p) * 5) + 'px)'; }
    if(p > 0 && p < 1) current = it;
    else if(p >= 1 && !current) current = it;
  });
  if(ms >= cjwbS.drawTotal){ if(cjwbS.hand) cjwbS.hand.style.opacity = '0'; }
  else cjwbMoveHand(current);
}
function cjwbMoveHand(it){
  if(!cjwbS.hand) return;
  if(!it){ cjwbS.hand.style.opacity = '0'; return; }
  try {
    var pt = null, el = it.el;
    if(it.type === 'd' && el.getPointAtLength){
      var p = Math.max(0, Math.min(1, (cjwbS.elapsed - it.start) / it.dur));
      pt = el.getPointAtLength(it.len * p);
    } else {
      var bb = el.getBBox(); pt = { x: bb.x + bb.width, y: bb.y + bb.height };
    }
    var r = cjwbS.stage.getBoundingClientRect(), br = cjwbS.board.getBoundingClientRect();
    cjwbS.hand.style.left = ((pt.x / 560) * r.width + (r.left - br.left) - 4) + 'px';
    cjwbS.hand.style.top = ((pt.y / 380) * r.height + (r.top - br.top) - 22) + 'px';
    cjwbS.hand.style.opacity = '1';
  } catch(e){ cjwbS.hand.style.opacity = '0'; }
}
function cjwbRenderScene(){
  var sc = cjwbS.sec.scenes[cjwbS.scene];
  cjwbS.stage.innerHTML = sc.svg;
  if(cjwbS.capText) cjwbS.capText.textContent = sc.cap;
  if(cjwbS.capNo) cjwbS.capNo.textContent = '第 ' + (cjwbS.scene + 1) + ' 镜';
  cjwbRenderDots();
  cjwbPrepare();
  cjwbS.elapsed = 0;
  cjwbApplyAt(0);
}
function cjwbFrame(ts){
  if(!cjwbS.playing) return;
  if(!cjwbS.stage || document.getElementById('cjwbStage') !== cjwbS.stage){ cjwbStop(); return; }
  if(!cjwbS.startTs) cjwbS.startTs = ts;
  cjwbS.elapsed = cjwbS.baseElapsed + (ts - cjwbS.startTs);
  if(cjwbS.elapsed >= cjwbS.total){
    cjwbApplyAt(cjwbS.total);
    var n = cjwbS.sec.scenes.length;
    if(cjwbS.scene < n - 1){ cjwbS.scene++; cjwbRenderScene(); cjwbS.startTs = 0; cjwbS.baseElapsed = 0; cjwbS.raf = requestAnimationFrame(cjwbFrame); return; }
    cjwbStop(); if(cjwbS.btn) cjwbS.btn.textContent = '↻ 再看一遍'; return;
  }
  cjwbApplyAt(cjwbS.elapsed);
  cjwbS.raf = requestAnimationFrame(cjwbFrame);
}
function cjwbPlayStart(){
  cjwbS.playing = true; cjwbS.startTs = 0; cjwbS.baseElapsed = cjwbS.elapsed || 0;
  if(cjwbS.btn) cjwbS.btn.textContent = '⏸ 暂停';
  cjwbS.raf = requestAnimationFrame(cjwbFrame);
}
function cjwbTogglePlay(){
  if(!cjwbS.sec) return;
  if(cjwbS.playing){
    cjwbS.playing = false;
    if(cjwbS.raf){ cancelAnimationFrame(cjwbS.raf); cjwbS.raf = 0; }
    cjwbS.baseElapsed = cjwbS.elapsed; cjwbS.startTs = 0;
    if(cjwbS.btn) cjwbS.btn.textContent = '▶ 继续';
    if(cjwbS.hand) cjwbS.hand.style.opacity = '0';
    return;
  }
  if(cjwbS.btn && cjwbS.btn.textContent.indexOf('再看') >= 0){ cjwbS.scene = 0; cjwbRenderScene(); }
  cjwbPlayStart();
}
function cjwbReplay(){
  if(!cjwbS.sec) return;
  cjwbStop();
  cjwbS.scene = 0; cjwbS.elapsed = 0; cjwbS.baseElapsed = 0;
  cjwbRenderScene();
  cjwbPlayStart();
}

function cjFilmHTML(){
  return '<div class="cjfilm"><div class="cjfilm-t">🎬 短片 · 连词车站</div>'
    + '<div class="cjf-stage" id="cjfStage"></div>'
    + '<div class="cjf-cap" id="cjfCap"></div>'
    + '<div class="cjf-ctrl"><button class="cjf-btn-main" id="cjfBtn" onclick="cjFilmToggle()">⏸ 暂停</button>'
    + '<button class="cjf-btn" onclick="cjFilmReplay()">↻ 重播</button>'
    + '<span class="cjf-dots" id="cjfDots"></span></div></div>';
}
function cjFilmSetBtn(t){ var b = document.getElementById('cjfBtn'); if(b) b.textContent = t; }
function cjFilmRender(){
  var st = document.getElementById('cjfStage'); if(!st) return;
  st.innerHTML = CJFILM[cjF.i].svg;
  var cap = document.getElementById('cjfCap');
  if(cap) cap.textContent = CJFILM[cjF.i].cap;
  var d = document.getElementById('cjfDots');
  if(d){ var s = ''; CJFILM.forEach(function(_, i){ s += '<span class="' + (i === cjF.i ? 'on' : '') + '">●</span>'; }); d.innerHTML = s; }
}
function cjFilmStop(){
  cjF.playing = false;
  if(cjF.timer){ clearInterval(cjF.timer); cjF.timer = 0; }
}
function cjFilmTick(){
  if(cjF.i >= CJFILM.length - 1){ cjFilmStop(); cjF.done = true; cjFilmSetBtn('↻ 再看一遍'); return; }
  cjF.i++; cjFilmRender();
}
function cjFilmPlay(){
  if(cjF.done){ cjF.i = 0; cjF.done = false; cjFilmRender(); }
  cjFilmStop();
  cjF.playing = true; cjFilmSetBtn('⏸ 暂停');
  cjF.timer = setInterval(cjFilmTick, 3400);
}
function cjFilmToggle(){
  if(!document.getElementById('cjfStage')) return;
  if(cjF.playing){ cjFilmStop(); cjFilmSetBtn('▶ 继续'); }
  else cjFilmPlay();
}
function cjFilmReplay(){
  if(!document.getElementById('cjfStage')) return;
  cjF.i = 0; cjF.done = false; cjFilmRender(); cjFilmPlay();
}
function cjFilmStart(){
  if(!document.getElementById('cjfStage')) return;
  cjF.i = 0; cjF.done = false;
  cjFilmRender();
  cjFilmPlay();
}
