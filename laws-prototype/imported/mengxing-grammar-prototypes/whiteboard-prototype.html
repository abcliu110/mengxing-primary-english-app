<style>

  .board { background:#fffef9; border:9px solid #a97c50; border-radius:14px; box-shadow: 0 6px 18px rgba(80,60,30,.25), inset 0 0 60px rgba(180,200,230,.12);
           background-image: linear-gradient(rgba(90,130,200,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(90,130,200,.07) 1px, transparent 1px);
           background-size: 28px 28px; position:relative; overflow:hidden; }
  svg.stage { display:block; width:100%; height:auto; }
  svg.stage text { font-family: "Segoe Print","Bradley Hand","Comic Sans MS","PingFang SC",cursive; }
  #hand { position:absolute; font-size:26px; pointer-events:none; opacity:0; transform: rotate(-8deg); transition: opacity .2s; z-index:5; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.25)); }
  .capbar { margin-top:8px; background:#2b3a55; color:#fdf6dd; border-radius:10px; padding:9px 13px; font-size:15.5px; min-height:44px; display:flex; align-items:center;
            font-family:"Segoe Print","Bradley Hand","Comic Sans MS","PingFang SC",cursive; }
  .capbar .no { background:#f2b138; color:#2b3a55; font-weight:800; border-radius:6px; padding:1px 7px; margin-right:9px; font-size:12.5px; white-space:nowrap; font-family:"PingFang SC",sans-serif;}
  .ctrl { display:flex; align-items:center; gap:8px; margin-top:9px; }
  .btn { border:2px solid #2b3a55; background:#fffdf5; border-radius:999px; padding:7px 16px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.main { background:#f2b138; }
  .dots { display:flex; gap:6px; margin-left:auto; align-items:center; }
  .dot { width:11px; height:11px; border-radius:50%; border:2px solid #2b3a55; background:#fff; }
  .dot.done { background:#2e9e5b; border-color:#2e9e5b; }
  .dot.now { background:#f2b138; }
  .sceneno { font-size:12.5px; color:#7a7261; }
  .kid-note { margin-top:10px; font-size:12.5px; color:#7a7261; line-height:1.6; background:#fffdf5; border:1.5px dashed #b9ac8f; border-radius:10px; padding:8px 12px; }

</head>
<body>
<div class="wrap">
  <h1>🖊️ 白板动画原型 · 新拟规律专场</h1>
  <div class="sub">NEW-P1~P4（新拟 · 待对账）能不能用白板动画讲？点播放，一镜一镜画给你看</div>
  <div class="tabs" id="tabs"></div>
  <div class="board" id="board">
    <svg class="stage" id="stage" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hand">✏️</div>

  <div class="capbar"><span class="no" id="capNo">第 1 镜</span><span id="capText">点「播放」，看老师一笔一笔画。</span></div>

    <div class="dots" id="dots"></div>

</div>
<script>

/* ============ 画布小工具：人物/书/箭头的手绘片段（字符串拼装） ============ */
function kid(x, y, s, flip){ // 简笔小人：头+身+臂+腿，s=缩放
  s = s || 1;
  return '<g transform="translate('+x+','+y+') scale('+(flip?-s:s)+','+s+')">'
    + '<circle class="d" cx="0" cy="-34" r="11" fill="none" stroke="#2b3a55" stroke-width="3.4" stroke-linecap="round"/>'
    + '<path class="d" d="M0,-23 C1,-8 0,4 -1,16" fill="none" stroke="#2b3a55" stroke-width="3.4" stroke-linecap="round"/>'
    + '<path class="d" d="M0,-14 C-12,-8 -17,-2 -19,3 M0,-14 C11,-10 17,-6 21,-3" fill="none" stroke="#2b3a55" stroke-width="3.4" stroke-linecap="round"/>'
    + '<path class="d" d="M-1,16 C-7,28 -11,36 -13,44 M-1,16 C5,28 9,36 12,44" fill="none" stroke="#2b3a55" stroke-width="3.4" stroke-linecap="round"/>'
    + '</g>';
}
function book(x, y, w, col){ // 一本摊开/合上的书
  w = w || 54; col = col || '#3f6fb5';
  var h = Math.round(w*0.72);
  return '<g transform="translate('+x+','+y+')">'
    + '<path class="d" d="M2,3 C-4,'+(h*0.4)+' 2,'+(h-4)+' 4,'+h+' L'+(w-4)+','+h+' C'+(w-2)+','+(h-5)+' '+(w+3)+','+(h*0.35)+' '+(w-2)+',2 C'+(w*0.55)+',-4 '+ (w*0.4)+',-3 2,3 Z" fill="none" stroke="'+col+'" stroke-width="3.2" stroke-linecap="round"/>'
    + '<path class="d" d="M10,14 L'+(w-12)+',14 M10,24 L'+(w-16)+',24" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round"/>'
    + '</g>';
}
function star(x, y, col){
  col = col || '#f2b138';
  return '<path class="d" d="M'+x+','+(y-13)+' L'+(x+3.4)+','+(y-4)+' L'+(x+13)+','+(y-3.4)+' L'+(x+5.4)+','+(y+2.6)+' L'+(x+8)+','+(y+12)+' L'+x+','+(y+6.4)+' L'+(x-8)+','+(y+12)+' L'+(x-5.4)+','+(y+2.6)+' L'+(x-13)+','+(y-3.4)+' L'+(x-3.4)+','+(y-4)+' Z" fill="none" stroke="'+col+'" stroke-width="2.8" stroke-linejoin="round"/>';
}
function cross(x, y, s){ // 红叉
  s = s || 1;
  return '<path class="d" d="M'+(x-9*s)+','+(y-9*s)+' L'+(x+9*s)+','+(y+9*s)+' M'+(x+9*s)+','+(y-9*s)+' L'+(x-9*s)+','+(y+9*s)+'" stroke="#e05252" stroke-width="4" stroke-linecap="round" fill="none"/>';
}
function tick(x, y, s){ // 绿勾
  s = s || 1;
  return '<path class="d" d="M'+(x-11*s)+','+(y+1*s)+' L'+(x-3*s)+','+(y+9*s)+' L'+(x+12*s)+','+(y-9*s)+'" stroke="#2e9e5b" stroke-width="4" stroke-linecap="round" fill="none"/>';
}
function T(x, y, str, size, col, anchor, bold){ // 手写风文字（淡入，不逐笔）
  return '<text class="w" x="'+x+'" y="'+y+'" font-size="'+(size||22)+'" fill="'+(col||'#2b3a55')+'" text-anchor="'+(anchor||'middle')+'" font-weight="'+(bold?800:600)+'">'+str+'</text>';
}

/* ============ 播放引擎：一支笔，按 DOM 顺序逐个元素画 ============ */
var stage = document.getElementById('stage'), hand = document.getElementById('hand'), board = document.getElementById('board');
var capText = document.getElementById('capText'), capNo = document.getElementById('capNo');
var dotsEl = document.getElementById('dots'), sceneNoEl = document.getElementById('sceneNo');
var btnPlay = document.getElementById('btnPlay');
var cur = { sec: 0, scene: 0, playing: false, raf: 0, items: [], total: 0, elapsed: 0, baseElapsed: 0, startTs: 0 };

function buildTabs(){
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = SECTIONS.map(function(s, i){
    return '<button class="tab'+(i===cur.sec?' on':'')+'" data-sec="'+i+'">'+s.id+'<small>'+s.name+' · '+s.short+'</small></button>';
  }).join('');
  tabs.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ stopPlay(); cur.sec = +b.dataset.sec; cur.scene = 0; buildTabs(); renderScene(); });
  });
}
function renderDots(){
  var n = SECTIONS[cur.sec].scenes.length;
  dotsEl.innerHTML = '';
  for (var i = 0; i < n; i++){
    var d = document.createElement('span');
    d.className = 'dot' + (i < cur.scene ? ' done' : (i === cur.scene ? ' now' : ''));
    dotsEl.appendChild(d);
  }
  sceneNoEl.textContent = '第 ' + (cur.scene + 1) + ' / ' + n + ' 镜';
}
function prepareItems(){
  cur.items = [];
  var els = stage.querySelectorAll('.d, .w, .f');
  var t = 120;
  els.forEach(function(el){
    var type = el.classList.contains('d') ? 'd' : (el.classList.contains('w') ? 'w' : 'f');
    var len = 0, dur;
    if (type === 'd'){
      try { len = el.getTotalLength(); } catch(e){ len = 260; }
      if (!len || !isFinite(len)) len = 260;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      dur = Math.max(240, Math.min(1350, len * 1.5));
    } else if (type === 'w'){ el.style.opacity = '0'; dur = 340; }
    else { el.style.opacity = '0'; dur = 420; }
    cur.items.push({ el: el, type: type, len: len, start: t, dur: dur });
    t += dur * 0.82 + 40;
  });
  cur.total = t + 260;
}
function applyAt(ms){
  var current = null;
  cur.items.forEach(function(it){
    var p = (ms - it.start) / it.dur;
    p = p < 0 ? 0 : (p > 1 ? 1 : p);
    if (it.type === 'd'){ it.el.style.strokeDashoffset = String(it.len * (1 - p)); }
    else { it.el.style.opacity = String(p); if (it.type === 'w') it.el.style.transform = 'translateY(' + ((1 - p) * 5) + 'px)'; }
    if (p > 0 && p < 1) current = it;
    else if (p >= 1 && !current) current = it;
  });
  moveHand(current);
}
function moveHand(it){
  if (!it){ hand.style.opacity = '0'; return; }
  try {
    var pt = null, el = it.el;
    if (it.type === 'd' && el.getPointAtLength){
      var p = Math.max(0, Math.min(1, (cur.elapsed - it.start) / it.dur));
      pt = el.getPointAtLength(it.len * p);
    } else {
      var bb = el.getBBox(); pt = { x: bb.x + bb.width, y: bb.y + bb.height };
    }
    var r = stage.getBoundingClientRect(), br = board.getBoundingClientRect();
    hand.style.left = ((pt.x / 560) * r.width + (r.left - br.left) - 4) + 'px';
    hand.style.top = ((pt.y / 380) * r.height + (r.top - br.top) - 22) + 'px';
    hand.style.opacity = '1';
  } catch(e){ hand.style.opacity = '0'; }
}
function renderScene(){
  var sc = SECTIONS[cur.sec].scenes[cur.scene];
  stage.innerHTML = sc.svg;
  capText.textContent = sc.cap;
  capNo.textContent = '第 ' + (cur.scene + 1) + ' 镜';
  renderDots();
  prepareItems();
  cur.elapsed = 0;
  applyAt(0);
}
function frameTick(ts){
  if (!cur.playing) return;
  if (!cur.startTs) cur.startTs = ts;
  cur.elapsed = cur.baseElapsed + (ts - cur.startTs);
  if (cur.elapsed >= cur.total){
    applyAt(cur.total);
    var n = SECTIONS[cur.sec].scenes.length;
    if (cur.scene < n - 1){ cur.scene++; renderScene(); cur.startTs = 0; cur.baseElapsed = 0; cur.raf = requestAnimationFrame(frameTick); return; }
    stopPlay(); btnPlay.textContent = '↻ 再看一遍'; return;
  }
  applyAt(cur.elapsed);
  cur.raf = requestAnimationFrame(frameTick);
}
function play(){
  if (cur.playing){ // 暂停
    cur.playing = false; cancelAnimationFrame(cur.raf);
    cur.baseElapsed = cur.elapsed; cur.startTs = 0;
    btnPlay.textContent = '▶ 继续'; hand.style.opacity = '0'; return;
  }
  if (btnPlay.textContent.indexOf('再看') >= 0){ cur.scene = 0; renderScene(); }
  cur.playing = true; cur.startTs = 0; cur.baseElapsed = cur.elapsed || 0;
  btnPlay.textContent = '⏸ 暂停';
  cur.raf = requestAnimationFrame(frameTick);
}
function stopPlay(){
  cur.playing = false; cancelAnimationFrame(cur.raf); cur.startTs = 0;
  btnPlay.textContent = '▶ 播放'; hand.style.opacity = '0';
}
btnPlay.addEventListener('click', play);
document.getElementById('btnReplay').addEventListener('click', function(){
  stopPlay(); cur.scene = 0; renderScene(); play();
});
buildTabs();
renderScene();
/* 冒烟测试接口 */
window.__WB = { state: cur, sections: SECTIONS, play: play, stop: stopPlay,
  renderScene: renderScene, applyAt: applyAt,
  goto: function(s, sc){ stopPlay(); cur.sec = s; cur.scene = sc; buildTabs(); renderScene(); } };
</script>
</body>
</html>
