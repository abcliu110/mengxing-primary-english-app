<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冠词规律原型 · 萌星小学英语</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1c2733;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}
header.top{padding:10px 2px 4px}
header.top h1{font-size:22px;color:#173a6b}
header.top p{font-size:13px;color:#5b6b7d;margin-top:4px}
.card{background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:14px;margin-top:12px}
.card h3{font-size:15px;color:#173a6b;margin-bottom:6px}
.card p{font-size:13.5px}
.badge{display:inline-block;background:#33507a;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;vertical-align:2px}
.badge.amber{background:#8a5a00}
.badge.grey{background:#7386a0}
.gname{margin:20px 2px 2px;font-size:16px;color:#173a6b;font-weight:800}
.gsub{margin:0 2px 8px;font-size:12.5px;color:#7386a0}
.law{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #dde5ef;border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.law:active{background:#eef4ff}
.law .tt{font-size:15.5px;font-weight:700;color:#173a6b}
.law .ds{font-size:13px;color:#46586c;margin-top:2px}
.law .chev{margin-left:auto;color:#b9cdea;font-size:20px;line-height:1.2}
.pending{border-style:dashed;background:#fbfcfe;cursor:default}
.pending .tt{color:#5b6b7d}
.flow{display:flex;flex-direction:column;gap:0}
.step{background:#eef4ff;border:1px solid #b9cdea;border-radius:12px;padding:9px 12px;font-size:13.5px}
.step b{color:#173a6b}
.arrow{ text-align:center;color:#7386a0;font-size:14px;line-height:1.4}
button.back{background:none;border:none;color:#33507a;font-size:15px;font-weight:700;cursor:pointer;padding:6px 0;font:inherit}
h2.big{font-size:21px;color:#173a6b;margin:6px 0 4px;line-height:1.35}
.desc{font-size:14.5px;color:#33507a}
.formal{font-size:12px;color:#8a97a8;margin-top:8px}
.kidbox{background:#fff8e6;border:1px solid #f0dfa8;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.kidbox .lab{font-size:11.5px;color:#8a5a00;font-weight:700;display:block;margin-bottom:3px}
.sec{margin-top:18px}
.sec>h4{font-size:14px;color:#173a6b;margin-bottom:8px}
.beat{background:#fff;border:1px solid #dde5ef;border-left:4px solid #33507a;border-radius:10px;padding:10px 12px;margin-top:8px}
.beat .bn{font-size:12px;font-weight:700;color:#33507a}
.beat p{font-size:14px;margin-top:2px}
.grp{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:10px 12px;margin-top:8px}
.grp .gt{font-size:13px;font-weight:700;color:#173a6b;margin-bottom:6px}
.gitem{padding:7px 0;border-top:1px dashed #dde5ef}
.gitem:first-of-type{border-top:none}
.gitem .gn{font-weight:700;font-size:14px;color:#33507a}
.gitem .gg{font-size:13px;color:#46586c}
.gitem .ge{display:block;font-size:13px;color:#173a6b;background:#eef4ff;border-radius:8px;padding:4px 8px;margin-top:4px}
.ex{background:#e9f8ef;border:1px solid #bfe6cf;border-radius:10px;padding:8px 12px;margin-top:8px}
.ex .es{font-size:14.5px;font-weight:600}
.ex .en{font-size:12.5px;color:#2e7d52}
.errc{background:#fff7f7;border:1px solid #f0c9c9;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.errc .wrong{color:#b03a3a;text-decoration:line-through}
.errc .right{color:#2e7d52;font-weight:700}
.errc .gap{color:#8a5a00}
.quiz{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:12px;margin-top:8px}
.quiz .qq{font-size:14.5px}
.quiz button{margin-top:8px;background:#33507a;color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
.quiz .ans{display:none;margin-top:8px;background:#eef4ff;border-radius:8px;padding:8px 10px;font-size:13.5px}
.quiz .hint{font-size:12px;color:#7386a0;margin-top:4px}
.claim{font-size:11.5px;color:#8a97a8;margin-top:14px}
.note{background:#eef4ff;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:12px;color:#33507a}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.navrow button{flex:1;background:#fff;border:1px solid #b9cdea;color:#33507a;border-radius:12px;padding:10px 6px;font-size:13px;cursor:pointer;font:inherit}
.navrow button:disabled{opacity:.35}

.animbox{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:12px;margin-top:8px}
.animbox .at{font-size:13px;font-weight:700;color:#173a6b;margin-bottom:8px}
.stage{position:relative;background:#eef4ff;border-radius:10px;padding:16px 12px;min-height:86px;overflow:hidden;font-size:15px}
.stage .cap{margin-top:10px;font-size:13px;color:#33507a;background:#fff;border-radius:8px;padding:6px 10px}
.rline{padding:7px 10px;border-radius:8px;margin-top:6px;background:#fff;transition:background .4s}
.rline .aw{color:#b03a3a;font-weight:800}
.rline.on{background:#fff3bf;box-shadow:0 0 0 2px #f0dfa8}
.spotdog{font-size:34px;display:inline-block;margin:0 10px;opacity:.3;transition:opacity .5s}
.spotdog.lit{opacity:1}
.spotbeam{position:absolute;top:0;width:74px;height:100%;background:radial-gradient(ellipse at 50% 0%,rgba(255,224,130,.85),rgba(255,224,130,0) 75%);transition:left .7s;pointer-events:none}
.cup{font-size:32px;display:inline-block;margin:0 6px;opacity:.12;transform:translateY(6px);transition:all .5s}
.cup.on{opacity:1;transform:none}
.bigword{font-size:19px;font-weight:800;color:#173a6b}
.swrow{display:flex;gap:8px}
.swcol{flex:1;background:#fff;border-radius:8px;padding:8px 10px;font-size:13.5px;opacity:.45;transition:opacity .4s}
.swcol.on{opacity:1;box-shadow:0 0 0 2px #b9cdea}
.swcol b{color:#173a6b}
.stampS{display:inline-block;background:#b03a3a;color:#fff;font-weight:800;border-radius:8px;padding:4px 12px;font-size:18px;transition:transform .45s}
.stampS.hit{transform:translateY(10px) rotate(-8deg)}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.svgbox{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:12px;margin-top:8px}
.svgbox .at{font-size:13px;font-weight:700;color:#173a6b;margin-bottom:6px}
.step.fstep{animation:steplit 4.8s infinite}
.step.fstep.d1{animation-delay:0s}.step.fstep.d2{animation-delay:1.6s}.step.fstep.d3{animation-delay:3.2s}
@keyframes steplit{0%,30%{box-shadow:0 0 0 2px #33507a;background:#dceaff}38%,100%{box-shadow:none;background:#eef4ff}}
.cine{background:#173a6b;border-radius:14px;padding:14px;color:#fff}
.cine .ct{font-size:14px;font-weight:800;margin-bottom:8px}
.cframe{display:none;background:#22467c;border-radius:10px;padding:14px 12px;text-align:center}
.cframe.on{display:block}
.cframe .scene{font-size:40px;line-height:1.25}
.cframe .sent{font-size:16.5px;font-weight:700;margin-top:8px}
.cframe .sent b{color:#ffd75e}
.cframe .cap2{font-size:13px;color:#c9d9f2;margin-top:5px}
.cdots{text-align:center;margin-top:10px;font-size:12px;letter-spacing:4px;color:#7d97bd}
.cdots .on{color:#ffd75e}
.cine button{margin-top:10px;background:#ffd75e;color:#173a6b;border:none;border-radius:8px;padding:7px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
footer{margin-top:26px;font-size:11.5px;color:#8a97a8;text-align:center}
.wb-board{background:#fffef9;border:9px solid #a97c50;border-radius:14px;box-shadow:0 6px 18px rgba(80,60,30,.25),inset 0 0 60px rgba(180,200,230,.12);background-image:linear-gradient(rgba(90,130,200,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,130,200,.07) 1px,transparent 1px);background-size:28px 28px;position:relative;overflow:hidden}
svg.wb-stage{display:block;width:100%;height:auto}
svg.wb-stage text{font-family:"Segoe Print","Bradley Hand","Comic Sans MS","PingFang SC",cursive}
.wb-hand{position:absolute;font-size:26px;pointer-events:none;opacity:0;transform:rotate(-8deg);transition:opacity .2s;z-index:5;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.25))}
.wb-capbar{margin-top:8px;background:#2b3a55;color:#fdf6dd;border-radius:10px;padding:9px 13px;font-size:15.5px;min-height:44px;display:flex;align-items:center;font-family:"Segoe Print","Bradley Hand","Comic Sans MS","PingFang SC",cursive}
.wb-capbar .wb-no{background:#f2b138;color:#2b3a55;font-weight:800;border-radius:6px;padding:1px 7px;margin-right:9px;font-size:12.5px;white-space:nowrap;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.wb-ctrl{display:flex;align-items:center;gap:8px;margin-top:9px}
.wb-btn{border:2px solid #2b3a55;background:#fffdf5;border-radius:999px;padding:6px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#2b3a55}
.wb-btn.wb-main{background:#f2b138}
.wb-dots{display:flex;gap:6px;margin-left:auto;align-items:center}
.wb-dot{width:11px;height:11px;border-radius:50%;border:2px solid #2b3a55;background:#fff}
.wb-dot.done{background:#2e9e5b;border-color:#2e9e5b}
.wb-dot.now{background:#f2b138}
.wb-sceneno{font-size:12.5px;color:#7a7261}
.wb-src{font-size:11.5px;color:#8a97a8;margin-top:6px;line-height:1.55}
</style>
</head>

<script>
var GROUPS = [{"name": "🧱 前置组 · 先数得清，才谈冠词", "sub": "冠词的地基：先决定东西是「一个个」还是「一摊」，后面的 a / the / -s / many 才有着落（本组已按深度规格补齐）"}, {"name": "第 1 组 · a 和 the 各干什么", "sub": "一个管「认类别」，一个管「找到那一个」"}, {"name": "第 2 组 · 用 the 之前先找线索", "sub": "五条路，占一条才能用 the"}, {"name": "第 3 组 · a 还是 an，听声音", "sub": "同题两条：C-14 与 GR-15，目录里两个版本都在"}, {"name": "第 4 组 · 不加冠词，和约定搭配", "sub": "做事还是去楼、约定存货、介绍物种的三种拍法"}, {"name": "第 5 组 · 为什么总选错", "sub": "给家长和老师：错的系统原因和分型纠法"}];
var LAWS = [{"id": "C-01", "short": "数不数得清，先看怎么看", "desc": "苹果看成一个个就能数，米看成一摊就得借碗数——可数不可数，先是一种看法。", "formal": "可数不可数是「看法」，不是物体的物理属性（识解说）", "kid": "数不数得清，先看你怎么看：看成一个一个的，就能数；看成一摊、一堆的，就不能直接数，要借杯子、碗来帮忙数。", "claim": "英语数东西之前，先由说话人决定把东西看成一个个的个体，还是一摊料、一类事；形式跟着看法（识解 construal）走，不跟着物体的物理形状走——可数名词 = 在呈现中被识解为有界的区域，不可数名词不带此识解；「有界」指呈现方式（当前取景范围内是否把限界算进图里），与物体有没有物理边框无关。", "beats": [{"name": "取景决定形式", "text": "同一样东西，你把它看成「一个一个」就能数，看成「一摊」就不能数——先有看法，后有说法。"}, {"name": "旧说禁区", "text": "不是「有边没边」决定的！水装在碗里有边，也不能数；要看你心里把它当成一个个还是一摊。"}, {"name": "反例最有说服力（呈现层补充）", "text": "米一颗颗看得清清楚楚，还是不能数；家具件件有形有样，也不能数——这正说明：说了算的是英语习惯上的看法，不是东西长什么样。归属最终听习惯，不许自己乱造。"}], "examples": [{"s": "I can count the apples, but I cannot count the rice.", "note": "苹果一个个 vs 米一摊——总开关的最小对照"}, {"s": "I want a cake, and a glass of water, please.", "note": "cake 可数读法与 water 借 glass 计数同句对照"}, {"s": "There is water in the bowl.", "note": "水有碗作物理边界，仍不可数——证伪物理说的关键帧"}, {"s": "The furniture is in the box.", "note": "家具件件有形却整类不可数（furniture 单数处理）"}, {"s": "I can count the books on the desk.", "note": "书是一个个的——新拟例句"}, {"s": "There is rice in the bowl.", "note": "米是一摊的——新拟例句"}], "errors": [{"wrong": "I have many rices for lunch.", "right": "I have much rice for lunch.", "type": "物理属性判可数（*many rices 型）", "diag": "新拟例句：米看得清颗粒，就以为能数——英语习惯上把米看成一摊料，量多用 much。"}, {"wrong": "The furnitures are new.", "right": "The furniture is new.", "type": "整类打包误加 -s（呈现层同型）", "diag": "新拟例句：家具件件有形也整类不可数，不加 -s、动词用单数。"}], "quiz": [{"q": "rice 明明一颗颗看得清，为什么不能说 many rices？", "ans": "英语习惯上把米看成一摊料，不是一个个", "hint": "回到机制第 1 节「取景决定形式」"}, {"q": "furniture 件件有形，为什么不能说 many furnitures？", "ans": "英语习惯上把家具整类打包成一摊，不是一个个——看法说了算", "hint": null}], "groups": [{"title": "🧩 分组看看：三种东西，三种看法", "items": [{"name": "一个个的一家", "gloss": "看成一个一个的个体，直接能数", "ex": "I can count the apples."}, {"name": "一摊料的一家", "gloss": "看成一摊，不直接数，要借碗、杯来数", "ex": "I cannot count the rice."}, {"name": "有形也整包的一家", "gloss": "件件有形，英语还是整类打包，不可数", "ex": "The furniture is in the box."}]}], "note": null, "group": 0, "svg": "countview"}, {"id": "C-02", "short": "切多少份，都还是它", "desc": "一滴水也是水，一小块面包也是面包——切开不变名的东西，不能一个一个数。", "formal": "物质名词的判据是「同质」：随便拿一小份，还是它", "kid": "一滴水也是水，一小块面包也是面包——切多少份都还是它，这样的东西不能一个一个数。", "claim": "水、木头、面包这类词指的东西，任意取一小份，性质与整体完全相同——这种「同质」使它不需要边界也能被认出是哪种东西，所以不直接计数：物质由「质」定义而非由「形」定义，语言不给它配个体化装置（a / -s），改为借单位切分后才计数。", "beats": [{"name": "切一切还是它", "text": "面包切一小块，还是面包；水倒一小杯，还是水——切多少份，名字都不变。"}, {"name": "演示不是定律", "text": "（教师侧）「切一切」只是帮忙理解的演示，不能当成判可数的定律——米切不开，却一样不可数。"}, {"name": "例外先记牢（呈现层补充）", "text": "米、沙一颗一颗分得清，可英语把它们整摊打包——同质和习惯打包压过「数得清」，照样不可数。"}], "examples": [{"s": "The bread is on the table, and the water is in the cup.", "note": "面包与水——同质双例"}, {"s": "The table is made of wood.", "note": "原文例 wood：一小块木头也是木头"}, {"s": "There is milk in the cup.", "note": "牛奶倒出多少杯都还是牛奶"}, {"s": "The cheese is on the plate.", "note": "奶酪切块不变名"}, {"s": "She eats bread for breakfast.", "note": "面包作料读法——新拟例句"}, {"s": "There is sand on the beach.", "note": "沙是颗粒集合，整摊处理——新拟例句"}], "errors": [{"wrong": "I want three breads.", "right": "I want three pieces of bread.", "type": "切块计数误用（*three breads 型）", "diag": "新拟例句：面包切成三块还是面包，要数先借 piece 把它装成份。"}, {"wrong": "I need a wood for the box.", "right": "I need some wood for the box.", "type": "同质料误加 a（呈现层同型）", "diag": "新拟例句：木头是料，没有一个个的单位，不能直接加 a。"}], "quiz": [{"q": "一小块面包切下来，为什么还叫 bread 不用换名字？", "ans": "面包是同质的：每一小份都还是面包", "hint": "回到机制第 1 节「切一切还是它」"}, {"q": "一滴水也是水——water 为什么不能加 -s？", "ans": "它同质：每一份都是水，没有一个个的单位可复制", "hint": null}], "groups": [{"title": "🧩 分组看看：切开还是它的一家", "items": [{"name": "液体组", "gloss": "倒出多少杯都还是它", "ex": "There is milk in the cup."}, {"name": "食物料组", "gloss": "切多少块都还是它", "ex": "The cheese is on the plate."}, {"name": "材料组", "gloss": "锯下一小块都还是它", "ex": "The table is made of wood."}, {"name": "例外组", "gloss": "颗粒分得清，也整摊打包", "ex": "rice / sand（见 C-01）"}]}], "note": null, "group": 0, "svg": "bread"}, {"id": "C-03", "short": "边糊一点，照样能数", "desc": "季节的边说不清，可我们还是说「一个季节」——心里当成一整段，就能数。", "formal": "可数名词的「界」可以是模糊的：season、tummy 都可数", "kid": "说得出「一个」的，不一定边边角角都很清楚——「一个季节」说得通，因为我们心里把它当成一整段。", "claim": "「有界」不要求边界锋利：季节、肚子这类边界模糊的东西照样可数，因为说话人把它们当作一个整体单位来指——限界是概念化操作的结果，可以由语境临时设定，其锐利程度不影响单位性成立。", "beats": [{"name": "界是心里设的", "text": "一个季节从哪天算起，说不太清；可我们还是说「一个季节」——界是心里把它当成一整段。"}, {"name": "模糊不是随便", "text": "界糊涂一点没关系，但不能自己乱造：information 就不能说 an information。"}, {"name": "摸不着的也能切段（呈现层补充）", "text": "moment（一刻）没有任何形状，可心里能把它切成一段，所以能说 a moment——有界遍布抽象世界，更说明和物理形状无关。"}], "examples": [{"s": "A year has four seasons.", "note": "季节边界模糊而单位成立"}, {"s": "I eat an apple, and my stomach is full.", "note": "肚子（stomach）轮廓模糊仍是可数单位"}, {"s": "A month has four weeks.", "note": "月份——被命名的抽象有界时段"}, {"s": "The morning is a part of today.", "note": "上午是被切出的一段"}, {"s": "Spring is a season.", "note": "季节当成一整段——新拟例句"}, {"s": "He has a big tummy.", "note": "tummy 轮廓模糊，照样可数——新拟例句"}], "errors": [{"wrong": "*an information", "right": "some information / a piece of information", "type": "抽象料误加 a（自创可数）", "diag": "学习者把「模糊有界」误推成「任意可数」；information 的归属由习惯用法裁定，走 C-15 的一类事路径加借单位。（目录登记病例）"}, {"wrong": "I have an advice for you.", "right": "I have a piece of advice for you.", "type": "抽象料误加 a（呈现层同型）", "diag": "新拟例句：advice 和 information 同型：整包的一类事，要数先借 piece。"}], "quiz": [{"q": "season 边界那么模糊，为什么还能说 a season？", "ans": "我们心里把它当成一整段（一个单位）", "hint": "回到机制第 1 节「界是心里设的」"}, {"q": "「一个时刻」a moment 能说吗？", "ans": "能——心里把时间切成一段，就是一个单位", "hint": null}], "groups": [{"title": "🧩 分组看看：界糊也能数的一家", "items": [{"name": "时间段", "gloss": "边说不清，心里切成段就能数", "ex": "A year has four seasons."}, {"name": "身体部位", "gloss": "轮廓糊，整体是一个单位", "ex": "He has a big tummy."}, {"name": "红线", "gloss": "模糊不是随便——归属听习惯，不能自创", "ex": "information 不能说 an information"}]}], "note": null, "group": 0, "svg": "season"}, {"id": "C-04", "short": "换个看法，就换个说法", "desc": "咖啡装进杯里能数（two coffees），苹果打成果泥就不能数了——看法能当场切换。", "formal": "看法可以当场切换：磨成料、分作份（grinding / portioning）", "kid": "同一样东西，换个看法就换个说法：苹果看成一摊果泥就不能数了；啤酒按「一杯一杯」看，又能数了。", "claim": "同一个词换个看法就换语法：把可数名词「磨碎」看成料（grinding），把不可数名词按「份」看即可数（portioning，如 two coffees = 两杯）——可数性是当场的 , "text": "建议是 a piece of advice，不是 a bowl of advice——哪个料配哪个单位，要一个一个记好。"}, {"name": "-s 只认单位（呈现层补充）", "text": "two bowls of rice 里，-s 长在 bowls 身上；说成 two rices，就是把 -s 放错了地方。"}], "examples": [{"s": "I want a bowl of rice.", "note": "食堂打饭——汉语「一碗饭」的同构场景"}, {"s": "Give me a piece of paper, please.", "note": "一张纸——piece 与「张」对应"}, {"s": "Two bowls of rice, please.", "note": "-s 落在 bowls 上"}, {"s": "Let me give you a piece of advice.", "note": "抽象料同样借 piece（与 C-15 衔接）"}, {"s": "I want two cups of tea.", "note": "茶借杯数——新拟例句"}, {"s": "Give me a bottle of water, please.", "note": "水借瓶数——新拟例句"}], "errors": [{"wrong": "I want two rices.", "right": "I want two bowls of rice.", "type": "-s 误落料上（*two rices 型）", "diag": "新拟例句：-s 要落在单位 bowls 上，料 rice 永远不接 -s。"}, {"wrong": "Give me two papers, please.", "right": "Give me two pieces of paper, please.", "type": "单位缺失致歧义（呈现层同型）", "diag": "新拟例句：想要两张纸要借 piece；two papers 是指两份报纸/试卷，意思变了。"}], "quiz": [{"q": "two bowls of rice 里，真正被数的是什么？", "ans": "碗（单位）", "hint": "回到机制第 1 节「单位先行」"}, {"q": "「一张纸」为什么是 a piece of paper，不是 a paper？", "ans": "纸是料，要借单位 piece 来装；a paper 指一份报纸/一张试卷", "hint": null}], "groups": [{"title": "🧩 分组看看：单位帮手图鉴", "items": [{"name": "碗", "gloss": "装饭、装汤的帮手", "ex": "a bowl of rice"}, {"name": "杯", "gloss": "装茶、装咖啡的帮手", "ex": "two cups of tea"}, {"name": "瓶", "gloss": "装水的帮手", "ex": "a bottle of water"}, {"name": "piece", "gloss": "万能帮手：纸、建议都归它装", "ex": "a piece of paper / a piece of advice"}]}], "note": null, "group": 0, "svg": "units"}, {"id": "C-15", "short": "摸不着的事，整包处理", "desc": "作业、消息、建议摸不着、切不开，英语把它们当成「一类事」：不加 a、不加 -s。", "formal": "抽象名词不可数，因为它们被看成「一类事」", "kid": "作业、消息、建议这些东西摸不着、切不开，英语就把它们当成「一类事」整包处理；想数，就借 piece（条）来数。", "claim": "homework、information、advice 没有形状可切——它们被英语整类打包成「一类事」来处理，所以不可数；识解不限于物理域：在抽象域中，事体以类别而非个体的形式被概念化，继承物质名词的全部语法待遇（无 a、无 -s、借单位计数、配 much）。", "beats": [{"name": "抽象域的整包", "text": "作业不是一件一件的「东西」，是「一类事」——整包拿走，不能拆开数。"}, {"name": "借条计数", "text": "想说「一条建议」，借 piece 来装：a piece of advice——数的还是单位。"}, {"name": "三位钉子户（ name": "两位不跟队伍（呈现层补充）", "text": "police 和 people 不玩切换游戏：它们永远是复数待遇，are 跟它们走——这是词条级的约定，单记。英式英语把 family 看成几口人更自由，美式偏单数，先学主读法即可。"}], "examples": [{"s": "My family is big.", "note": "整体读法——单数（家庭合影场景）"}, {"s": "Our team is great.", "note": "队作一个单位"}, {"s": "My class is quiet today.", "note": "班作整体"}, {"s": "The police are here.", "note": "约定例外：police 只有复数待遇"}, {"s": "My family are happy.", "note": "成员读法——英式常见，看懂即可（新拟例句）"}, {"s": "Our class is big.", "note": "班作一个整体——新拟例句"}], "errors": [{"wrong": "The police is here.", "right": "The police are here.", "type": "集合名词一致误用", "diag": "新拟例句：police 是约定例外，不参加轮廓切换——永远用复数 are。"}, {"wrong": "People is in the park.", "right": "People are in the park.", "type": "约定例外词误用单数（呈现层同型）", "diag": "新拟例句：people 和 police 同型：只有复数待遇，动词用 are。"}], "quiz": [{"q": "「My family ___ big.」先按主读法填哪个？", "ans": "is（看成一个整体）", "hint": "回到机制第 2 节「小学主读法」"}, {"q": "「The police ___ here.」填 is 还是 are？", "ans": "are——police 是约定例外，永远复数待遇", "hint": null}], "groups": [{"title": "🧩 分组看看：两种看法", "items": [{"name": "看成一个单位", "gloss": "整体读法，动词用单数——小学主读法", "ex": "My family is big."}, {"name": "看成几口人", "gloss": "成员读法，英式可用复数——看懂即可", "ex": "My family are happy."}, {"name": "约定例外", "gloss": "police、people 不切换，永远复数", "ex": "The police are here."}]}], "note": null, "group": 0, "svg": "family"}, {"id": "C-17", "short": "many 和 much，同一个开关", "desc": "先定看法：一个个的用 many，一摊的用 much——冠词、-s、量词是同一个开关的三个出口。", "formal": "量词排队先看识解：many/much、few/little 是同一总开关的下游", "kid": "先决定东西是「一个个」还是「一摊」：一个个的用 many/few，一摊的用 much/little——开关只有一个，灯有好几盏。", "claim": "选 many 还是 much、(a) few 还是 (a) little，不取决于词本身，只取决于被量的东西当前被看成「一个个」还是「一摊」——量化词与冠词、复数 -s 是同一个识解总开关（C-01）的三个出口；量化是对已识解完毕的指称域作量级评估。", "beats": [{"name": "一个开关三个出口", "text": "先想：是一个个，还是一摊？想好了，冠词、-s、量词会一起跟着对。"}, {"name": "鸡的两副面孔", "text": "盘子里的鸡肉是 much chicken；院子里跑的鸡是 many chickens——同一只鸡，两种看法。"}, {"name": "有个万能旁路（呈现层补充）", "text": "a lot of 两边通吃：一个个、一摊它都能管——那是它绕过了开关，不是开关坏了。拿不准时口语可用，但考试要把 many/much 分清；less 配可数名词是口语变迁，教学守 fewer。"}], "examples": [{"s": "I have many books.", "note": "书是一个个的——many"}, {"s": "We have much water.", "note": "水是一摊的——much"}, {"s": "We eat much chicken today.", "note": "鸡肉读法——much chicken（登记正例）"}, {"s": "We have many chickens.", "note": "活鸡读法——many chickens"}, {"s": "I have a few friends.", "note": "一个个的一家：a few——新拟例句"}, {"s": "There is a little milk in the cup.", "note": "一摊的一家：a little——新拟例句"}], "errors": [{"wrong": "We have much chickens in the yard.", "right": "We have many chickens in the yard.", "type": "三出口打架（量词与识解不照应，*much chickens 型）", "diag": "新拟例句：chickens 已经是「一只只」的看法，量词也要跟上：换成 many，三个出口才一致。"}, {"wrong": "I have much books.", "right": "I have many books.", "type": "量词与看法不照应（呈现层同型）", "diag": "新拟例句：书是一个个的，配 many；much 只配一摊的东西。"}], "quiz": [{"q": "盘子里是鸡肉，该说 much chicken 还是 many chickens？", "ans": "much chicken（看成一摊料）", "hint": "回到机制第 2 节「鸡的两副面孔」"}, {"q": "「a lot of」为什么 many 的、much 的东西都能跟？", "ans": "它走的是旁路，不标看法——一个个和一摊都能用", "hint": null}], "groups": [{"title": "🧩 分组看看：一个开关，三个出口", "items": [{"name": "出口一 · 冠词", "gloss": "一个个 → a；一摊 → 什么都不加", "ex": "a book / water"}, {"name": "出口二 · 复数 -s", "gloss": "一个个 → 落 -s；一摊 → 不落", "ex": "books / rice"}, {"name": "出口三 · 量词", "gloss": "一个个 → many、few；一摊 → much、little", "ex": "many books / much water"}, {"name": "旁路", "gloss": "a lot of 两边通吃，不标看法", "ex": "a lot of books / a lot of water"}]}], "note": null, "group": 0, "anim": "switch"}, {"id": "C-18", "short": "-s 是枚复制章，只盖单位", "desc": "-s 只能盖在能一份一份的东西上；一摊料盖不上，先装进瓶子、碗里再盖。", "formal": "复数 -s 只落在「有界单位」上：这是它从不落在料上的原因", "kid": "-s 是「复制章」：只能盖在能一份一份的东西上；一摊东西没法盖章，先装进瓶子、碗里，章盖在瓶子和碗上。", "claim": "-s 的语义是「同一个有界单位被复制了多份」；料没有单位可复制，所以 *rices、*waters（日常义）不成立，要复数先借单位（two bottles of water）——可数域的参数组（有界、同质/异质、可扩展/可收缩、可复制）中，复数形态正对应「可复制（replicability）」一项。", "beats": [{"name": "复制章", "text": "一个杯子，盖一下章变两个、三个；一摊水没法盖章——先装进瓶子，章盖在瓶子上。"}, {"name": "同形分轨", "text": "（教师侧）动词后面的 -s（三单）是另一个章，长得像，管的事完全不同，不能混。"}, {"name": "先问有没有单位（呈现层补充）", "text": "看到一个词先问一句：它有单位吗？有，-s 直接落；没有，先借单位再落——这一问，能挡住 *rices、*homeworks 一大串错。"}], "examples": [{"s": "Two bot versity 开头是辅音声「优」。"}], "quiz": [{"q": "hour 前面用 an，是因为？", "ans": "hour 的第一个声音是元音（h 不发音）", "hint": null}, {"q": "「___ umbrella」填 a 还是 an？", "ans": "an——umbrella 是元音声开头", "hint": null}], "groups": [{"title": "🧩 分组看看：an 和 a 的地盘", "items": [{"name": "元音声开头 → an", "gloss": "第一个声音是「啊诶咦哦呜」这类元音", "ex": "an egg / an apple"}, {"name": "h 不出声 → an", "gloss": "字母是 h，可它不出声，第一个声音还是元音", "ex": "an hour / an honest boy"}, {"name": "辅音声开头 → a", "gloss": "第一个声音是辅音，哪怕第一个字母是元音字母", "ex": "a university（读「优」）/ a book"}]}], "note": null, "group": 3}, {"id": "GR-15", "short": "耳朵决定，字母只是参考", "desc": "和 C-14 是同一条规律的语法组版本：先把词读出声，再选 a 还是 an。", "formal": "a / an 按声音不按字母：耳朵决定，字母只是参考", "kid": "a 还是 an，不看第一个字母长什么样，看第一个声音是不是元音：an hour 的 h 不出声，a unit 开头是「优」的辅音味儿", "claim": "an 的 -n 是为避免两个元音相撞而保留的连接音：冠词形式由后随词的起始音素（语音）决定，不由拼写字母决定。", "beats": [{"name": "耳朵说了算", "text": "选 a 还是 an，先把词读出声：第一个音是元音，就用 an 把两个元音隔开；第一个音是辅音，就用 a。字母长什么样，不算数。"}, {"name": "两个陷阱词", "text": "hour 的 h 是哑巴，听到的第一个音是元音，所以 an hour；unit 的第一个字母是元音字母 u，声音却是辅音打头，所以 a unit。"}, {"name": "一个判据，两个考场", "text": "C-14 讲的是 a/an 这对词本身；这一条是同一判据在语法总表里的登记：凡选 a/an，先读出声、再下笔。两处说的是同一件事，考试和写作都按耳朵办。"}], "examples": [{"s": "I waited an hour.", "note": "h 不出声：第一个音是元音，用 an"}, {"s": "This is a unit about animals.", "note": "u 开头却是辅音声：用 a"}, {"s": "He is an honest man.", "note": "honest 的 h 也不出声，用 an"}, {"s": "I have an egg.", "note": "第一个音就是元音，用 an"}, {"s": "It is an orange.", "note": "o 是元音音 — 新拟例句"}, {"s": "She has a useful book.", "note": "useful 读 /j/ 辅音音 — 新拟例句"}], "errors": [{"wrong": "He is a honest man.", "right": "He is an honest man.", "type": "按字母判 a/an（目录未登记逐字病例）", "diag": "新拟例句：honest 的 h 不出声，第一个音是元音——耳朵决定，用 an。"}, {"wrong": "I need an uniform.", "right": "I need a uniform.", "type": "按字母判 a/an（u 开头误用 an）", "diag": "新拟例句：uniform 读 /ˈjuːnɪfɔːm/，第一个音是辅音 /j/，用 a。"}], "quiz": [{"q": "___ hour A. a B. an", "ans": "B. an——h 不出声，第一个音是元音。", "hint": "回到机制第 1 节「耳朵说了算」：先读出声再选。"}, {"q": "「___ unit」填 a 还是 an？", "ans": "a——unit 开头是「优」的辅音声，耳朵说了算", "hint": null}], "groups": [{"title": "🧩 分组看看：两个陷阱窝", "items": [{"name": "h 不出声 → an", "gloss": "字母是 h，声音却是元音开头", "ex": "an hour / an honest man"}, {"name": "元音字母辅音声 → a", "gloss": "字母是元音字母，声音却是「优」这样的辅音开头", "ex": "a unit / a university"}]}], "note": "对账提示：本条与 C-14 同题——C-14 在小系统组（C 组），本条在语法组（GR 组），目录里两条并存，原型照录两条，未合并。", "group": 3}, {"id": "C-11", "short": "去做事，还是去那栋楼", "desc": "go to school 是去「上学」这件事，不加 the；go to the school 是去「那栋楼」办事，加 the。", "formal": "机构名词有两种读法：「去做那件事」不加冠词，「去那栋楼」才加", "kid": "go to school 是「去上学」（做事），go to the school 是「去那所学校」（去一栋楼）——加不加 the，看你说的是事还是楼。", "claim": "school、bed、hospital 这类词，当它表示「去做那件事」（上学、睡觉、看病）时零冠词；当它表示那栋建筑、那件家具时加 the——冠词在这里标的是「活动读法 vs 实物读法」的识解切换。", "beats": [{"name": "活动读法脱个体", "text": "去上学，不是去看那栋楼，是去「上学」这件事——说事的时候，不用 the。"}, {"name": "交通同型", "text": "by bus 是「坐车（怎么去）」，on a bus 是「在一辆车上」——一个讲办法，一个讲东西。"}, {"name": "一眼分清两种读法", "text": "看人物在干什么：go to school 是去上学（做那件事），go to the school 是去那栋楼（找人、参观）。问自己：他是去做那件事，还是去那个地方？"}], "examples": [{"s": "We go to school.", "note": "去上学——活动读法零冠词"}, {"s": "My father goes to the school.", "note": "家长去那所学校（办事/开会）——实物读法加 the"}, {"s": "We go to bed.", "note": "去睡觉——bed 的活动读法"}, {"s": "We go to school by bus.", "note": "by bus 方式读法零冠词（登记对：ex-bed-bus）"}, {"s": "He is in hospital.", "note": "住院看病 = 做那件事，零冠词 — 新拟例句"}, {"s": "The hospital is near my home.", "note": "说的是那栋建筑 — 新拟例句"}], "errors": [{"wrong": "I go to the school every day.", "right": "I go to school every day.", "type": "机构名词两种读法混淆", "diag": "新拟例句：说的是『我每天去上学』（做事），误加 the 就成了『去那栋楼』——活动读法零冠词。"}, {"wrong": "I go to the bed at nine.", "right": "I go to bed at nine.", "type": "睡觉读法误加 the", "diag": "新拟例句：go to bed 是去睡觉（做那件事），不加 the。"}], "quiz": [{"q": "「Dad goes to the school today.」里的 Dad 是去干什么？", "ans": "去那所学校（楼/办事）", "hint": null}, {"q": "妈妈去学校开家长会，说 go to school 还是 go to the school？", "ans": "go to the school——她是去那栋楼办事，不是去上学", "hint": null}], "groups": [{"title": "🧩 分组看看：两种读法对照", "items": [{"name": "做事 → 不加", "gloss": "说的是活动本身：上学、睡觉", "ex": "We go to school. / We go to be var WB_BY_ID = {};
WB_SECTIONS.forEach(function(s){ WB_BY_ID[s.id] = s; });
var wbS = { sec:null, scene:0, playing:false, raf:0, items:[], total:0, elapsed:0, baseElapsed:0, startTs:0,
            stage:null, hand:null, board:null, capText:null, capNo:null, dots:null, sceneNo:null, btn:null };
function wbCardHTML(id){
  return '<div class="sec"><h4>🎬 白板动画 · 先看一遍</h4>'
    + '<div class="wb-board" id="wbBoard"><svg class="wb-stage" id="wbStage" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg"></svg><div class="wb-hand" id="wbHand">✏️</div></div>'
    + '<div class="wb-capbar"><span class="wb-no" id="wbCapNo">第 1 镜</span><span id="wbCapText">白板老师正在准备……</span></div>'
    + '<div class="wb-ctrl"><button class="wb-btn wb-main" id="wbBtnPlay" onclick="wbTogglePlay()">⏸ 暂停</button>'
    + '<button class="wb-btn" onclick="wbReplay()">↻ 重播</button>'
    + '<span class="wb-sceneno" id="wbSceneNo"></span><div class="wb-dots" id="wbDots"></div></div>'
    + '<div class="wb-src">形式借鉴：' + ((WB_BY_ID[id] && WB_BY_ID[id].src) ? WB_BY_ID[id].src : '通用白板范式。') + '</div></div>';
}
function wbStop(){
  wbS.playing = false;
  if(wbS.raf){ cancelAnimationFrame(wbS.raf); wbS.raf = 0; }
  wbS.startTs = 0;
  if(wbS.hand){ try { wbS.hand.style.opacity = '0'; } catch(e){} }
}
function wbInit(){
  wbStop();
  var stage = document.getElementById('wbStage');
  if(!stage){ wbS.sec = null; return; }
  var top = stack[stack.length - 1];
  var sec = (top && top.view === 'law') ? WB_BY_ID[top.id] : null;
  if(!sec){ wbS.sec = null; return; }
  wbS.sec = sec; wbS.scene = 0; wbS.elapsed = 0; wbS.baseElapsed = 0;
  wbS.stage = stage;
  wbS.hand = document.getElementById('wbHand');
  wbS.board = document.getElementById('wbBoard');
  wbS.capText = document.getElementById('wbCapText');
  wbS.capNo = document.getElementById('wbCapNo');
  wbS.dots = document.getElementById('wbDots');
  wbS.sceneNo = document.getElementById('wbSceneNo');
  wbS.btn = document.getElementById('wbBtnPlay');
  wbRenderScene();
  wbPlayStart();
}
function wbRenderDots(){
  if(!wbS.dots || !wbS.sec) return;
  var n = wbS.sec.scenes.length;
  wbS.dots.innerHTML = '';
  for(var i = 0; i < n; i++){
    var d = document.createElement('span');
    d.className = 'wb-dot' + (i < wbS.scene ? ' done' : (i === wbS.scene ? ' now' : ''));
    wbS.dots.appendChild(d);
  }
  if(wbS.sceneNo) wbS.sceneNo.textContent = '第 ' + (wbS.scene + 1) + ' / ' + n + ' 镜';
}
function wbPrepare(){
  wbS.items = [];
  var els = wbS.stage.querySelectorAll('.wbd, .wbw, .wbf');
  var t = 120;
  els.forEach(function(el){
    var type = el.classList.contains('wbd') ? 'd' : (el.classList.contains('wbw') ? 'w' : 'f');
    var len = 0, dur;
    if(type === 'd'){
      try { len = el.getTotalLength(); } catch(e){ len = 260; }
      if(!len || !isFinite(len)) len = 260;
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      dur = Math.max(324, Math.min(1700, len * 2.025));
    } else if(type === 'w'){ el.style.opacity = '0'; dur = 460; }
    else { el.style.opacity = '0'; dur = 567; }
    wbS.items.push({ el: el, type: type, len: len, start: t, dur: dur });
    t += dur * 0.88 + 40;
  });
  wbS.drawTotal = t + 260;
  var _cap = (wbS.sec && wbS.sec.scenes[wbS.scene]) ? wbS.sec.scenes[wbS.scene].cap : '';
  var _hold = Math.max(2000, Math.min(4800, _cap.length * 160));
  if(wbS.sec && wbS.scene === wbS.sec.scenes.length - 1) _hold += 1200;
  wbS.hold = _hold;
  wbS.total = wbS.drawTotal + _hold;
}
function wbApplyAt(ms){
  if(wbS.drawTotal && ms >= wbS.drawTotal){
    wbS.items.forEach(function(it){
      if(it.type === 'd'){ it.el.style.strokeDashoffset = '0'; }
      else { it.el.style.opacity = '1'; if(it.type === 'w') it.el.style.transform = 'translateY(0px)'; }
    });
    wbMoveHand(null);
    return;
  }
  var current = null;
  wbS.items.forEach(function(it){
    var p = (ms - it.start) / it.dur;
    p = p < 0 ? 0 : (p > 1 ? 1 : p);
    if(it.type === 'd'){ it.el.style.strokeDashoffset = String(it.len * (1 - p)); }
    else { it.el.style.opacity = String(p); if(it.type === 'w') it.el.style.transform = 'translateY(' + ((1 - p) * 5) + 'px)'; }
    if(p > 0 && p < 1) current = it;
    else if(p >= 1 && !current) current = it;
  });
  wbMoveHand(current);
}
function wbMoveHand(it){
  if(!wbS.hand) return;
  if(!it){ wbS.hand.style.opacity = '0'; return; }
  try {
    var pt = null, el = it.el;
    if(it.type === 'd' && el.getPointAtLength){
      var p = Math.max(0, Math.min(1, (wbS.elapsed - it.start) / it.dur));
      pt = el.getPointAtLength(it.len * p);
    } else {
      var bb = el.getBBox(); pt = { x: bb.x + bb.width, y: bb.y + bb.height };
    }
    var r = wbS.stage.getBoundingClientRect(), br = wbS.board.getBoundingClientRect();
    wbS.hand.style.left = ((pt.x / 560) * r.width + (r.left - br.left) - 4) + 'px';
    wbS.hand.style.top = ((pt.y / 380) * r.height + (r.top - br.top) - 22) + 'px';
    wbS.hand.style.opacity = '1';
  } catch(e){ wbS.hand.style.opacity = '0'; }
}
function wbRenderScene(){
  var sc = wbS.sec.scenes[wbS.scene];
  wbS.stage.innerHTML = sc.svg;
  if(wbS.capText) wbS.capText.textContent = sc.cap;
  if(wbS.capNo) wbS.capNo.textContent = '第 ' + (wbS.scene + 1) + ' 镜';
  wbRenderDots();
  wbPrepare();
  wbS.elapsed = 0;
  wbApplyAt(0);
}
function wbFrame(ts){
  if(!wbS.playing) return;
  if(!wbS.stage || document.getElementById('wbStage') !== wbS.stage){ wbStop(); return; }
  if(!wbS.startTs) wbS.startTs = ts;
  wbS.elapsed = wbS.baseElapsed + (ts - wbS.startTs);
  if(wbS.elapsed >= wbS.total){
    wbApplyAt(wbS.total);
    var n = wbS.sec.scenes.length;
    if(wbS.scene < n - 1){ wbS.scene++; wbRenderScene(); wbS.startTs = 0; wbS.baseElapsed = 0; wbS.raf = requestAnimationFrame(wbFrame); return; }
    wbStop(); if(wbS.btn) wbS.btn.textContent = '↻ 再看一遍'; return;
  }
  wbApplyAt(wbS.elapsed);
  wbS.raf = requestAnimationFrame(wbFrame);
}
function wbPlayStart(){
  wbS.playing = true; wbS.startTs = 0; wbS.baseElapsed = wbS.elapsed || 0;
  if(wbS.btn) wbS.btn.textContent = '⏸ 暂停';
  wbS.raf = requestAnimationFrame(wbFrame);
}
function wbTogglePlay(){
  if(!wbS.sec) return;
  if(wbS.playing){
    wbS.playing = false;
    if(wbS.raf){ cancelAnimationFrame(wbS.raf); wbS.raf = 0; }
    wbS.baseElapsed = wbS.elapsed; wbS.startTs = 0;
    if(wbS.btn) wbS.btn.textContent = '▶ 继续';
    if(wbS.hand) wbS.hand.style.opacity = '0';
    return;
  }
  if(wbS.btn && wbS.btn.textContent.indexOf('再看') >= 0){ wbS.scene = 0; wbRenderScene(); }
  wbPlayStart();
}
function wbReplay(){
  if(!wbS.sec) return;
  wbStop();
  wbS.scene = 0; wbS.elapsed = 0; wbS.baseElapsed = 0;
  wbRenderScene();
  wbPlayStart();
}


render();
</script>
