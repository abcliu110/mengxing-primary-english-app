<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f5f9;color:#1c2733;line-height:1.55}

button.back{background:none;border:none;color:#33507a;font-size:15px;font-weight:700;cursor:pointer;padding:6px 0;font:inherit}

footer{margin-top:26px;font-size:11.5px;color:#8a97a8;text-align:center}

<script>
var GROUPS = [{"name": "🧱 前置组 · 先数得清，才谈冠词", "sub": "冠词的地基：先决定东西是「一个个」还是「一摊」，后面的 a / the / -s / many 才有着落（本组已按深度规格补齐）"}, {"name": "第 1 组 · a 和 the 各干什么", "sub": "一个管「认类别」，一个管「找到那一个」"}, {"name": "第 2 组 · 用 the 之前先找线索", "sub": "五条路，占一条才能用 the"}, {"name": "第 3 组 · a 还是 an，听声音", "sub": "同题两条：C-14 与 GR-15，目录里两个版本都在"}, {"name": "第 4 组 · 不加冠词，和约定搭配", "sub": "做事还是去楼、约定存货、介绍物种的三种拍法"}, {"name": "第 5 组 · 为什么总选错", "sub": "给家长和老师：错的系统原因和分型纠法"}];
var LAWS = [{"id": "C-01", "short": "数不数得清，先看怎么看", "desc": "苹果看成一个个就能数，米看成一摊就得借碗数——可数不可数，先是一种看法。", "formal": "可数不可数是「看法」，不是物体的物理属性（识解说）", "kid": "数不数得清，先看你怎么看：看成一个一个的，就能数；看成一摊、一堆的，就不能直接数，要借杯子、碗来帮忙数。", "claim": "英语数东西之前，先由说话人决定把东西看成一个个的个体，还是一摊料、一类事；形式跟着看法（识解 construal）走，不跟着物体的物理形状走——可数名词 = 在呈现中被识解为有界的区域，不可数名词不带此识解；「有界」指呈现方式（当前取景范围内是否把限界算进图里），与物体有没有物理边框无关。", "beats": [{"name": "取景决定形式", "text": "同一样东西，你把它看成「一个一个」就能数，看成「一摊」就不能数——先有看法，后有说法。"}, {"name": "旧说禁区", "text": "不是「有边没边」决定的！水装在碗里有边，也不能数；要看你心里把它当成一个个还是一摊。"}, {"name": "反例最有说服力（呈现层补充）", "text": "米一颗颗看得清清楚楚，还是不能数；家具件件有形有样，也不能数——这正说明：说了算的是英语习惯上的看法，不是东西长什么样。归属最终听习惯，不许自己乱造。"}], "examples": [{"s": "I can count the apples, but I cannot count the rice.", "note": "苹果一个个 vs 米一摊——总开关的最小对照"}, {"s": "I want a cake, and a glass of water, please.", "note": "cake 可数读法与 water 借 glass 计数同句对照"}, {"s": "There is water in the bowl.", "note": "水有碗作物理边界，仍不可数——证伪物理说的关键帧"}, {"s": "The furniture is in the box.", "note": "家具件件有形却整类不可数（furniture 单数处理）"}, {"s": "I can count the books on the desk.", "note": "书是一个个的——新拟例句"}, {"s": "There is rice in the bowl.", "note": "米是一摊的——新拟例句"}], "errors": [{"wrong": "I have many rices for lunch.", "right": "I have much rice for lunch.", "type": "物理属性判可数（*many rices 型）", "diag": "新拟例句：米看得清颗粒，就以为能数——英语习惯上把米看成一摊料，量多用 much。"}, {"wrong": "The furnitures are new.", "right": "The furniture is new.", "type": "整类打包误加 -s（呈现层同型）", "diag": "新拟例句：家具件件有形也整类不可数，不加 -s、动词用单数。"}], "quiz": [{"q": "rice 明明一颗颗看得清，为什么不能说 many rices？", "ans": "英语习惯上把米看成一摊料，不是一个个", "hint": "回到机制第 1 节「取景决定形式」"}, {"q": "furniture 件件有形，为什么不能说 many furnitures？", "ans": "英语习惯上把家具整类打包成一摊，不是一个个——看法说了算", "hint": null}], "groups": [{"title": "🧩 分组看看：三种东西，三种看法", "items": [{"name": "一个个的一家", "gloss": "看成一个一个的个体，直接能数", "ex": "I can count the apples."}, {"name": "一摊料的一家", "gloss": "看成一摊，不直接数，要借碗、杯来数", "ex": "I cannot count the rice."}, {"name": "有形也整包的一家", "gloss": "件件有形，英语还是整类打包，不可数", "ex": "The furniture is in the box."}]}], "note": null, "group": 0, "svg": "countview"}, {"id": "C-02", "short": "切多少份，都还是它", "desc": "一滴水也是水，一小块面包也是面包——切开不变名的东西，不能一个一个数。", "formal": "物质名词的判据是「同质」：随便拿一小份，还是它", "kid": "一滴水也是水，一小块面包也是面包——切多少份都还是它，这样的东西不能一个一个数。", "claim": "水、木头、面包这类词指的东西，任意取一小份，性质与整体完全相同——这种「同质」使它不需要边界也能被认出是哪种东西，所以不直接计数：物质由「质」定义而非由「形」定义，语言不给它配个体化装置（a / -s），改为借单位切分后才计数。", "beats": [{"name": "切一切还是它", "text": "面包切一小块，还是面包；水倒一小杯，还是水——切多少份，名字都不变。"}, {"name": "演示不是定律", "text": "（教师侧）「切一切」只是帮忙理解的演示，不能当成判可数的定律——米切不开，却一样不可数。"}, {"name": "例外先记牢（呈现层补充）", "text": "米、沙一颗一颗分得清，可英语把它们整摊打包——同质和习惯打包压过「数得清」，照样不可数。"}], "examples": [{"s": "The bread is on the table, and the water is in the cup.", "note": "面包与水——同质双例"}, {"s": "The table is made of wood.", "note": "原文例 wood：一小块木头也是木头"}, {"s": "There is milk in the cup.", "note": "牛奶倒出多少杯都还是牛奶"}, {"s": "The cheese is on the plate.", "note": "奶酪切块不变名"}, {"s": "She eats bread for breakfast.", "note": "面包作料读法——新拟例句"}, {"s": "There is sand on the beach.", "note": "沙是颗粒集合，整摊处理——新拟例句"}], "errors": [{"wrong": "I want three breads.", "right": "I want three pieces of bread.", "type": "切块计数误用（*three breads 型）", "diag": "新拟例句：面包切成三块还是面包，要数先借 piece 把它装成份。"}, {"wrong": "I need a wood for the box.", "right": "I need some wood for the box.", "type": "同质料误加 a（呈现层同型）", "diag": "新拟例句：木头是料，没有一个个的单位，不能直接加 a。"}], "quiz": [{"q": "一小块面包切下来，为什么还叫 bread 不用换名字？", "ans": "面包是同质的：每一小份都还是面包", "hint": "回到机制第 1 节「切一切还是它」"}, {"q": "一滴水也是水——water 为什么不能加 -s？", "ans": "它同质：每一份都是水，没有一个个的单位可复制", "hint": null}], "groups": [{"title": "🧩 分组看看：切开还是它的一家", "items": [{"name": "液体组", "gloss": "倒出多少杯都还是它", "ex": "There is milk in the cup."}, {"name": "食物料组", "gloss": "切多少块都还是它", "ex": "The cheese is on the plate."}, {"name": "材料组", "gloss": "锯下一小块都还是它", "ex": "The table is made of wood."}, {"name": "例外组", "gloss": "颗粒分得清，也整摊打包", "ex": "rice / sand（见 C-01）"}]}], "note": null, "group": 0, "svg": "bread"}, {"id": "C-03", "short": "边糊一点，照样能数", "desc": "季节的边说不清，可我们还是说「一个季节」——心里当成一整段，就能数。", "formal": "可数名词的「界」可以是模糊的：season、tummy 都可数", "kid": "说得出「一个」的，不一定边边角角都很清楚——「一个季节」说得通，因为我们心里把它当成一整段。", "claim": "「有界」不要求边界锋利：季节、肚子这类边界模糊的东西照样可数，因为说话人把它们当作一个整体单位来指——限界是概念化操作的结果，可以由语境临时设定，其锐利程度不影响单位性成立。", "beats": [{"name": "界是心里设的", "text": "一个季节从哪天算起，说不太清；可我们还是说「一个季节」——界是心里把它当成一整段。"}, {"name": "模糊不是随便", "text": "界糊涂一点没关系，但不能自己乱造：information 就不能说 an information。"}, {"name": "摸不着的也能切段（呈现层补充）", "text": "moment（一刻）没有任何形状，可心里能把它切成一段，所以能说 a moment——有界遍布抽象世界，更说明和物理形状无关。"}], "examples": [{"s": "A year has four seasons.", "note": "季节边界模糊而单位成立"}, {"s": "I eat an apple, and my stomach is full.", "note": "肚子（stomach）轮廓模糊仍是可数单位"}, {"s": "A month has four weeks.", "note": "月份——被命名的抽象有界时段"}, {"s": "The morning is a part of today.", "note": "上午是被切出的一段"}, {"s": "Spring is a season.", "note": "季节当成一整段——新拟例句"}, {"s": "He has a big tummy.", "note": "tummy 轮廓模糊，照样可数——新拟例句"}], "errors": [{"wrong": "*an information", "right": "some information / a piece of information", "type": "抽象料误加 a（自创可数）", "diag": "学习者把「模糊有界」误推成「任意可数」；information 的归属由习惯用法裁定，走 C-15 的一类事路径加借单位。（目录登记病例）"}, {"wrong": "I have an advice for you.", "right": "I have a piece of advice for you.", "type": "抽象料误加 a（呈现层同型）", "diag": "新拟例句：advice 和 information 同型：整包的一类事，要数先借 piece。"}], "quiz": [{"q": "season 边界那么模糊，为什么还能说 a season？", "ans": "我们心里把它当成一整段（一个单位）", "hint": "回到机制第 1 节「界是心里设的」"}, {"q": "「一个时刻」a moment 能说吗？", "ans": "能——心里把时间切成一段，就是一个单位", "hint": null}], "groups": [{"title": "🧩 分组看看：界糊也能数的一家", "items": [{"name": "时间段", "gloss": "边说不清，心里切成段就能数", "ex": "A year has four seasons."}, {"name": "身体部位", "gloss": "轮廓糊，整体是一个单位", "ex": "He has a big tummy."}, {"name": "红线", "gloss": "模糊不是随便——归属听习惯，不能自创", "ex": "information 不能说 an information"}]}], "note": null, "group": 0, "svg": "season"}, {"id": "C-04", "short": "换个看法，就换个说法", "desc": "咖啡装进杯里能数（two coffees），苹果打成果泥就不能数了——看法能当场切换。", "formal": "看法可以当场切换：磨成料、分作份（grinding / portioning）", "kid": "同一样东西，换个看法就换个说法：苹果看成一摊果泥就不能数了；啤酒按「一杯一杯」看，又能数了。", "claim": "同一个词换个看法就换语法：把可数名词「磨碎」看成料（grinding），把不可数名词按「份」看即可数（portioning，如 two coffees = 两杯）——可数性是当场的识解选择，不是词的终身标签；-s 落在被省略的单位（杯）上。", "beats": [{"name": "分作份", "text": "咖啡本来不能数，装进杯子里，一杯一杯就能数了：two coffees！"}, {"name": "磨成料", "text": "（理解即可）苹果打成果泥，就不再是一个一个的苹果了——看法反过来走也行。"}, {"name": "切换有规矩（呈现层补充）", "text": "能这样切换的是少数「双生活」词（cake、coffee、tea…），不是每个词都行；而且要看场合——点单时说 two coffees，平时说咖啡这种料还是不可数。"}], "examples": [{"s": "Two coffees, please.", "note": "餐馆点单——分份省略读法的登记场景"}, {"s": "Two teas, please.", "note": "茶同型：按杯计数"}, {"s": "There is cake on the plate.", "note": "蛋糕作料读法——与 a cake 的整只读法对照"}, {"s": "I want a cake for my birthday.", "note": "整只蛋糕——可数读法（生日场景）"}, {"s": "Two juices, please.", "note": "果汁按杯点单——新拟例句"}, {"s": "Can I have a coffee?", "note": "一份咖啡——分份读法——新拟例句"}], "errors": [{"wrong": "“Two coffees” is wrong. Coffee cannot have -s.", "right": "“Two coffees” is right. It means two cups of coffee.", "type": "标签固化误判（把 two coffees 判错句）", "diag": "新拟例句：目录登记的错型正是「把对的判成错的」：点单场景里 two coffees 是分份读法，-s 落在省略的「杯」上，不是错句。"}, {"wrong": "I want two cake for my birthday.", "right": "I want two cakes for my birthday.", "type": "整只读法漏 -s（呈现层同型）", "diag": "新拟例句：想说两只整蛋糕时，cake 是可数读法，-s 不能丢。"}], "quiz": [{"q": "餐馆里说 Two coffees，被数的是什么？", "ans": "杯（一杯一杯的咖啡）", "hint": "回到机制第 1 节「分作份」"}, {"q": "「There is cake on the plate」里的 cake 为什么不加 a？", "ans": "这里把蛋糕看成一摊料（磨成料读法），不是一整只", "hint": null}], "groups": [{"title": "🧩 分组看看：两个方向", "items": [{"name": "分作份", "gloss": "料装进杯、份里，就能数了", "ex": "Two coffees, please."}, {"name": "磨成料", "gloss": "个体磨成一摊，就不能数了", "ex": "There is cake on the plate."}, {"name": "整只对照", "gloss": "同一词的整只读法，加 a、加 -s", "ex": "I want a cake for my birthday."}]}], "note": null, "group": 0, "anim": "cups"}, {"id": "C-05", "short": "数一摊东西，要借单位", "desc": "一碗饭、两张纸——碗和张能数，饭和纸跟着走；汉语量词就是现成的老师。", "formal": "数一摊东西要借单位，而汉语量词就是现成的老师", "kid": "米饭不能一粒一粒数？借个碗！「一碗饭、两碗饭」——碗能数，饭跟着碗走。英语也是这么干的。", "claim": "料不能直接数，就借单位词先把它切成有界的份再数——a bowl of rice、two pieces of paper；复数 -s 加在单位上，不加在料上。汉语「一碗饭、两张纸」用的正是同一套办法，是现成的正迁移资源。", "beats": [{"name": "单位先行", "text": "先找一个能数的帮手：碗、张、条——帮手站在前面数，后面的料跟着走。"}, {"name": "搭配要逐个记", "text": "建议是 a piece of advice，不是 a bowl of advice——哪个料配哪个单位，要一个一个记好。"}, {"name": "-s 只认单位（呈现层补充）", "text": "two bowls of rice 里，-s 长在 bowls 身上；说成 two rices，就是把 -s 放错了地方。"}], "examples": [{"s": "I want a bowl of rice.", "note": "食堂打饭——汉语「一碗饭」的同构场景"}, {"s": "Give me a piece of paper, please.", "note": "一张纸——piece 与「张」对应"}, {"s": "Two bowls of rice, please.", "note": "-s 落在 bowls 上"}, {"s": "Let me give you a piece of advice.", "note": "抽象料同样借 piece（与 C-15 衔接）"}, {"s": "I want two cups of tea.", "note": "茶借杯数——新拟例句"}, {"s": "Give me a bottle of water, please.", "note": "水借瓶数——新拟例句"}], "errors": [{"wrong": "I want two rices.", "right": "I want two bowls of rice.", "type": "-s 误落料上（*two rices 型）", "diag": "新拟例句：-s 要落在单位 bowls 上，料 rice 永远不接 -s。"}, {"wrong": "Give me two papers, please.", "right": "Give me two pieces of paper, please.", "type": "单位缺失致歧义（呈现层同型）", "diag": "新拟例句：想要两张纸要借 piece；two papers 是指两份报纸/试卷，意思变了。"}], "quiz": [{"q": "two bowls of rice 里，真正被数的是什么？", "ans": "碗（单位）", "hint": "回到机制第 1 节「单位先行」"}, {"q": "「一张纸」为什么是 a piece of paper，不是 a paper？", "ans": "纸是料，要借单位 piece 来装；a paper 指一份报纸/一张试卷", "hint": null}], "groups": [{"title": "🧩 分组看看：单位帮手图鉴", "items": [{"name": "碗", "gloss": "装饭、装汤的帮手", "ex": "a bowl of rice"}, {"name": "杯", "gloss": "装茶、装咖啡的帮手", "ex": "two cups of tea"}, {"name": "瓶", "gloss": "装水的帮手", "ex": "a bottle of water"}, {"name": "piece", "gloss": "万能帮手：纸、建议都归它装", "ex": "a piece of paper / a piece of advice"}]}], "note": null, "group": 0, "svg": "units"}, {"id": "C-15", "short": "摸不着的事，整包处理", "desc": "作业、消息、建议摸不着、切不开，英语把它们当成「一类事」：不加 a、不加 -s。", "formal": "抽象名词不可数，因为它们被看成「一类事」", "kid": "作业、消息、建议这些东西摸不着、切不开，英语就把它们当成「一类事」整包处理；想数，就借 piece（条）来数。", "claim": "homework、information、advice 没有形状可切——它们被英语整类打包成「一类事」来处理，所以不可数；识解不限于物理域：在抽象域中，事体以类别而非个体的形式被概念化，继承物质名词的全部语法待遇（无 a、无 -s、借单位计数、配 much）。", "beats": [{"name": "抽象域的整包", "text": "作业不是一件一件的「东西」，是「一类事」——整包拿走，不能拆开数。"}, {"name": "借条计数", "text": "想说「一条建议」，借 piece 来装：a piece of advice——数的还是单位。"}, {"name": "三位钉子户（呈现层补充）", "text": "homework、information、advice 是中国学生最爱误加 a、误加 -s 的三个词——先把这三个钉牢，比背一整表都管用。旧讲法「没有形状所以不可数」是错的：看法整包才是原因。"}], "examples": [{"s": "I have homework today.", "note": "作业是「一类事」——不加 a、不加 -s"}, {"s": "Let me give you a piece of advice.", "note": "借 piece 数建议（与 C-05 同句呼应）"}, {"s": "The information is good.", "note": "消息整包处理，动词用单数"}, {"s": "We have much homework today.", "note": "配 much 不配 many——四项测试之一"}, {"s": "That is good advice.", "note": "建议整包，不加 a——新拟例句"}, {"s": "I need information about the school.", "note": "消息整包处理——新拟例句"}], "errors": [{"wrong": "*an information", "right": "some information / a piece of information", "type": "抽象料误加 a", "diag": "把抽象名词按普通可数名词处理；information 被整类打包成「一类事」，要计数先借 piece。与 C-18 的 *informations 型同源。（目录登记病例，与 C-03 共案）"}, {"wrong": "I have many homeworks today.", "right": "I have much homework today.", "type": "整包料误配 many（呈现层同型）", "diag": "新拟例句：homework 是整包的一类事：不加 -s，量多配 much 不配 many。"}], "quiz": [{"q": "「一条建议」用英语怎么说才对？", "ans": "a piece of advice", "hint": "回到机制第 2 节「借条计数」"}, {"q": "homework 前面能加 an 吗？", "ans": "不能——它被整包看成一类事，要数就借 piece", "hint": null}], "groups": [{"title": "🧩 分组看看：一类事的一家", "items": [{"name": "作业", "gloss": "homework——整包，不加 a、不加 -s", "ex": "I have homework today."}, {"name": "消息", "gloss": "information——整包，动词用单数", "ex": "The information is good."}, {"name": "建议", "gloss": "advice——整包，想数借 piece", "ex": "a piece of advice"}, {"name": "共同待遇", "gloss": "和物质名词同款：无 a、无 -s、配 much、借单位", "ex": "We have much homework today."}]}], "note": null, "group": 0, "svg": "pack"}, {"id": "C-16", "short": "一家人：一个单位，还是几口人", "desc": "family 看成一个整体，动词用单数；看成几口人（英式常见），可以用复数。", "formal": "集合名词可单可复，看你把「一家人」看成一个单位还是几口人", "kid": "「我们班」可以是一个班（一个整体），也可以是班上的同学们（好多人）——心里想的是哪个，动词就跟着哪个走。", "claim": "family、team、class 这类词指「一群互连的成员」：看成一个整体单位时动词用单数，看成成员们时可用复数——区域本就是「一组互连的实体」，集合名词的轮廓可在「集合体」与「成员集」之间切换，主谓一致随轮廓切换而变。", "beats": [{"name": "轮廓切换", "text": "一个班，手拉手站成一个圆圈是一个班；散开来是三十个同学——看成哪个，动词就听哪个的。"}, {"name": "小学主读法", "text": "先把「一家人、一个队」当成一个整体记：动词用单数，不会错。"}, {"name": "两位不跟队伍（呈现层补充）", "text": "police 和 people 不玩切换游戏：它们永远是复数待遇，are 跟它们走——这是词条级的约定，单记。英式英语把 family 看成几口人更自由，美式偏单数，先学主读法即可。"}], "examples": [{"s": "My family is big.", "note": "整体读法——单数（家庭合影场景）"}, {"s": "Our team is great.", "note": "队作一个单位"}, {"s": "My class is quiet today.", "note": "班作整体"}, {"s": "The police are here.", "note": "约定例外：police 只有复数待遇"}, {"s": "My family are happy.", "note": "成员读法——英式常见，看懂即可（新拟例句）"}, {"s": "Our class is big.", "note": "班作一个整体——新拟例句"}], "errors": [{"wrong": "The police is here.", "right": "The police are here.", "type": "集合名词一致误用", "diag": "新拟例句：police 是约定例外，不参加轮廓切换——永远用复数 are。"}, {"wrong": "People is in the park.", "right": "People are in the park.", "type": "约定例外词误用单数（呈现层同型）", "diag": "新拟例句：people 和 police 同型：只有复数待遇，动词用 are。"}], "quiz": [{"q": "「My family ___ big.」先按主读法填哪个？", "ans": "is（看成一个整体）", "hint": "回到机制第 2 节「小学主读法」"}, {"q": "「The police ___ here.」填 is 还是 are？", "ans": "are——police 是约定例外，永远复数待遇", "hint": null}], "groups": [{"title": "🧩 分组看看：两种看法", "items": [{"name": "看成一个单位", "gloss": "整体读法，动词用单数——小学主读法", "ex": "My family is big."}, {"name": "看成几口人", "gloss": "成员读法，英式可用复数——看懂即可", "ex": "My family are happy."}, {"name": "约定例外", "gloss": "police、people 不切换，永远复数", "ex": "The police are here."}]}], "note": null, "group": 0, "svg": "family"}, {"id": "C-17", "short": "many 和 much，同一个开关", "desc": "先定看法：一个个的用 many，一摊的用 much——冠词、-s、量词是同一个开关的三个出口。", "formal": "量词排队先看识解：many/much、few/little 是同一总开关的下游", "kid": "先决定东西是「一个个」还是「一摊」：一个个的用 many/few，一摊的用 much/little——开关只有一个，灯有好几盏。", "claim": "选 many 还是 much、(a) few 还是 (a) little，不取决于词本身，只取决于被量的东西当前被看成「一个个」还是「一摊」——量化词与冠词、复数 -s 是同一个识解总开关（C-01）的三个出口；量化是对已识解完毕的指称域作量级评估。", "beats": [{"name": "一个开关三个出口", "text": "先想：是一个个，还是一摊？想好了，冠词、-s、量词会一起跟着对。"}, {"name": "鸡的两副面孔", "text": "盘子里的鸡肉是 much chicken；院子里跑的鸡是 many chickens——同一只鸡，两种看法。"}, {"name": "有个万能旁路（呈现层补充）", "text": "a lot of 两边通吃：一个个、一摊它都能管——那是它绕过了开关，不是开关坏了。拿不准时口语可用，但考试要把 many/much 分清；less 配可数名词是口语变迁，教学守 fewer。"}], "examples": [{"s": "I have many books.", "note": "书是一个个的——many"}, {"s": "We have much water.", "note": "水是一摊的——much"}, {"s": "We eat much chicken today.", "note": "鸡肉读法——much chicken（登记正例）"}, {"s": "We have many chickens.", "note": "活鸡读法——many chickens"}, {"s": "I have a few friends.", "note": "一个个的一家：a few——新拟例句"}, {"s": "There is a little milk in the cup.", "note": "一摊的一家：a little——新拟例句"}], "errors": [{"wrong": "We have much chickens in the yard.", "right": "We have many chickens in the yard.", "type": "三出口打架（量词与识解不照应，*much chickens 型）", "diag": "新拟例句：chickens 已经是「一只只」的看法，量词也要跟上：换成 many，三个出口才一致。"}, {"wrong": "I have much books.", "right": "I have many books.", "type": "量词与看法不照应（呈现层同型）", "diag": "新拟例句：书是一个个的，配 many；much 只配一摊的东西。"}], "quiz": [{"q": "盘子里是鸡肉，该说 much chicken 还是 many chickens？", "ans": "much chicken（看成一摊料）", "hint": "回到机制第 2 节「鸡的两副面孔」"}, {"q": "「a lot of」为什么 many 的、much 的东西都能跟？", "ans": "它走的是旁路，不标看法——一个个和一摊都能用", "hint": null}], "groups": [{"title": "🧩 分组看看：一个开关，三个出口", "items": [{"name": "出口一 · 冠词", "gloss": "一个个 → a；一摊 → 什么都不加", "ex": "a book / water"}, {"name": "出口二 · 复数 -s", "gloss": "一个个 → 落 -s；一摊 → 不落", "ex": "books / rice"}, {"name": "出口三 · 量词", "gloss": "一个个 → many、few；一摊 → much、little", "ex": "many books / much water"}, {"name": "旁路", "gloss": "a lot of 两边通吃，不标看法", "ex": "a lot of books / a lot of water"}]}], "note": null, "group": 0, "anim": "switch"}, {"id": "C-18", "short": "-s 是枚复制章，只盖单位", "desc": "-s 只能盖在能一份一份的东西上；一摊料盖不上，先装进瓶子、碗里再盖。", "formal": "复数 -s 只落在「有界单位」上：这是它从不落在料上的原因", "kid": "-s 是「复制章」：只能盖在能一份一份的东西上；一摊东西没法盖章，先装进瓶子、碗里，章盖在瓶子和碗上。", "claim": "-s 的语义是「同一个有界单位被复制了多份」；料没有单位可复制，所以 *rices、*waters（日常义）不成立，要复数先借单位（two bottles of water）——可数域的参数组（有界、同质/异质、可扩展/可收缩、可复制）中，复数形态正对应「可复制（replicability）」一项。", "beats": [{"name": "复制章", "text": "一个杯子，盖一下章变两个、三个；一摊水没法盖章——先装进瓶子，章盖在瓶子上。"}, {"name": "同形分轨", "text": "（教师侧）动词后面的 -s（三单）是另一个章，长得像，管的事完全不同，不能混。"}, {"name": "先问有没有单位（呈现层补充）", "text": "看到一个词先问一句：它有单位吗？有，-s 直接落；没有，先借单位再落——这一问，能挡住 *rices、*homeworks 一大串错。"}], "examples": [{"s": "Two bottles of water, please.", "note": "-s 落在 bottles 上"}, {"s": "Two bowls of rice, please.", "note": "同型：章盖在单位上"}, {"s": "I have three apples.", "note": "有界单位直接复制"}, {"s": "The books are on the desk.", "note": "书是单位——-s 本景"}, {"s": "I have two cups.", "note": "杯子是单位，直接盖章——新拟例句"}, {"s": "We need two chairs.", "note": "椅子是单位，直接复制——新拟例句"}], "errors": [{"wrong": "She gave me two informations.", "right": "She gave me two pieces of information.", "type": "-s 误落料上（*informations 型）", "diag": "新拟例句：information 是整包的料，没有单位可复制——借 piece，章盖在 pieces 上。"}, {"wrong": "I drink two waters every day.", "right": "I drink two bottles of water every day.", "type": "-s 误落料上（*waters 日常义型）", "diag": "新拟例句：日常喝水是「一摊水」，先装进瓶子，-s 落在 bottles 上。"}], "quiz": [{"q": "为什么不能说 two waters（一摊水）？", "ans": "水没有单位可复制，-s 没处落", "hint": "回到机制第 1 节「复制章」"}, {"q": "two bottles of water 里，-s 为什么落在 bottles 上？", "ans": "瓶子是有界单位，可以复制；水是料，没有单位可复制", "hint": null}], "groups": [{"title": "🧩 分组看看：章盖三处", "items": [{"name": "直接盖", "gloss": "本身就是单位的词，-s 直接落", "ex": "three apples / two chairs"}, {"name": "盖在借来的单位上", "gloss": "料先装进瓶、碗，章盖在容器上", "ex": "two bottles of water"}, {"name": "盖不上", "gloss": "料本身没有单位可复制——*rices 不成立", "ex": "rice → two bowls of rice"}]}], "note": null, "group": 0, "anim": "stamp"}, {"id": "C-06", "short": "a：认出是哪一类就行", "desc": "第一次提、随便哪一个、说职业——都用 a：先让对方认出「是哪一种东西」。", "formal": "a 的本职：让听者「认出是哪一类」就够了", "kid": "说 a 的时候，是在说「随便哪一个都行，我说的就是这种东西里的一个」。", "claim": "a/an 传递的信息只有一条：「我说的是这一类里的某一个，你认出类别就行，不必知道是哪一个」——在给定性等级中 a N 对应「类型可辨识（type identifiable）」一级，是给听者的最低限度定位指令；首次提及、泛指其一、职业身份（a teacher）都用它。", "beats": [{"name": "只认类别", "text": "第一次说起一只狗，说 a dog 就够了：听的人知道「哦，是一只狗」，不用知道是哪一只。"}, {"name": "职业也是类别", "text": "My mum is a teacher——说的是「她是当老师的这一类人」。"}, {"name": "为什么先只认类别", "text": "听者脑子里还没有这只狗的档案，先把类别递过去建档；一上来就说 the，等于让人去翻一份还没建的档案。"}], "examples": [{"s": "I have a dog.", "note": "首次提及——只认类别"}, {"s": "This is a book.", "note": "介绍一个新东西"}, {"s": "My mother is a teacher.", "note": "职业身份——类别归属"}, {"s": "I want an apple.", "note": "随便哪一个苹果都行（an 的声音判据见 C-14）"}, {"s": "Can I have a pen, please?", "note": "借东西时随便哪一支都行 — 新拟例句"}, {"s": "She is a nurse.", "note": "职业身份也是只认类别 — 新拟例句"}], "errors": [{"wrong": "I have the dog.", "right": "I have a dog.", "type": "首次提及误用 the（与 C-09 同型）", "diag": "新拟例句：第一次跟朋友提起自己养的狗，对方还没见过它——只认类别，用 a。"}, {"wrong": "I am teacher.", "right": "I am a teacher.", "type": "职业前漏 a", "diag": "新拟例句：说职业就是报类别，a 不能省。"}], "quiz": [{"q": "第一次跟朋友说起「我养了一只狗」，用 a dog 还是 the dog？", "ans": "a dog（只认类别就行）", "hint": null}, {"q": "「She is a doctor.」这里的 a 是哪个活儿？", "ans": "说职业身份——她是当医生的那一类人", "hint": null}], "groups": [{"title": "🧩 分组看看：a 的三个活儿", "items": [{"name": "第一次提", "gloss": "新东西第一次出场，先用 a 介绍", "ex": "I have a dog."}, {"name": "随便哪一个", "gloss": "哪一个都行，不挑", "ex": "I want an apple."}, {"name": "说职业身份", "gloss": "职业也是一种「类别」：她是当老师的那类人", "ex": "My mother is a teacher."}]}], "note": null, "group": 1, "svg": "anycat"}, {"id": "C-07", "short": "the：就是那一个", "desc": "说 the 之前先确认：对方能一下子找到是哪个吗？找不到，就不能用 the。", "formal": "the 的本职：让听者「唯一定位到那一个」", "kid": "说 the 的时候，是在说「就是那一个，你知道的」——对方得能一下子找到它。", "claim": "the 传递的信息是：「线索已经够了，你能在心里唯一定位到我指的那一个（或那一整类）」——在给定性等级中 the N 对应「可唯一辨识（uniquely identifiable）」级；说 the 而听者定位不到，就是误用。", "beats": [{"name": "定位完成指令", "text": "说 the 之前先想：对方能一下子找到是哪个吗？找不到，就不能用 the。"}, {"name": "线索可以不在上文", "text": "太阳不用介绍也能说 the sun——因为全世界就一个，大家都知道。"}, {"name": "说 the 之前先自查", "text": "说 the 等于向听者打包票「你一定找得到」。找不到就是空头支票——先在心里走一遍五条线索（见 C-08），有一条通了再说。"}], "examples": [{"s": "The book on the desk is mine.", "note": "修饰语当场锁定唯一一本"}, {"s": "The sun is up.", "note": "常识唯一——定位无需上文"}, {"s": "I have a dog. The dog is cute.", "note": "先 a 后 the：第二次提及已可定位"}, {"s": "Pass me the salt, please.", "note": "餐桌上就一瓶盐——情境定位"}, {"s": "Open the door, please.", "note": "门就在眼前，情境定位 — 新拟例句"}, {"s": "The teacher is in the classroom.", "note": "双方都知道是哪位老师 — 新拟例句"}], "errors": [{"wrong": "I see the cat in the garden.", "right": "I see a cat in the garden.", "type": "the 滥用（定位不到而加 the）", "diag": "新拟例句：第一次说起花园里的一只猫，五条线索一条没占、对方定位不到——先用 a 介绍。"}, {"wrong": "I like the dogs.", "right": "I like dogs.", "type": "泛指一类误加 the", "diag": "新拟例句：说的是狗这一类，不是某几只具体的狗，零冠词。"}], "quiz": [{"q": "什么时候才可以用 the？", "ans": "对方能凭线索唯一定位到那一个时", "hint": null}, {"q": "「Close the door.」能用 the，是因为？", "ans": "门就在眼前，对方一下子就知道是哪扇门", "hint": null}], "groups": [{"title": "🧩 分组看看：对方靠什么找到它", "items": [{"name": "回头找", "gloss": "刚才上文说过，对方回头就能找到", "ex": "I have a dog. The dog is cute."}, {"name": "眼睛找", "gloss": "东西就在眼前，伸手就能指出来", "ex": "Pass me the salt, please."}, {"name": "脑子找", "gloss": "全世界只有一个，不用说也知道", "ex": "The sun is up."}]}], "note": "业界常用比喻（呈现层）：the 像聚光灯，只照那一个；a 像广角镜，先认出一类。", "group": 1, "anim": "spot"}, {"id": "C-19", "short": "选冠词，先替对方想一步", "desc": "对方找得到吗？没见过，先用 a 介绍；见过了，再用 the；接着往下说，用 it。", "formal": "选冠词时，心里要过一遍「对方知道吗」——冠词是给听者的服务", "kid": "说英语的时候要多想一步：「我说的这个东西，对方找得到吗？」把答案用小词标出来，听的人才不迷路。", "claim": "a/the/零 的选择本质上是说话人替听者算账：持续估算「对方现在能不能定位」，并用冠词把答案标在句子表面；形式越往给定性等级高端走（a → the → this/that → 代词），预设的听者认知状态越高；汉语把这笔账记在语境里，英语把它写出来。", "beats": [{"name": "替听者算账", "text": "说话之前先替对方想一想：他见过我说的东西吗？没见过，先用 a 介绍；见过了，再用 the。"}, {"name": "两端的用法", "text": "刚提到的用小代词接着说（it、he）；说了很久以前的，要把名字重新说全。"}, {"name": "等级只升不降", "text": "账算好之后有个方向：a 建档 → the 查档 → it 直接指。一旦升到 the，不要退回 a；退回去等于跟听者说「刚才那只不算，换一只」。"}], "examples": [{"s": "I have a dog. The dog is cute. It is my friend.", "note": "一条等级链：a 介绍 → the 定位 → it 承接"}, {"s": "I have a book. The book is new.", "note": "书的同型链"}, {"s": "The sun and the moon are in the sky.", "note": "常识定位直接 the 起手"}, {"s": "The cat is cute. It is in the box.", "note": "已定位的猫用 it 承接（box 场景）"}, {"s": "I see a bird. The bird is in the tree. It is small.", "note": "a→the→it 完整接力 — 新拟例句"}, {"s": "This is a photo. The girl in the photo is my sister.", "note": "照片带出关联物，用 the — 新拟例句"}], "errors": [{"wrong": "I have a dog. A dog is cute.", "right": "I have a dog. The dog is cute.", "type": "定位预期错发（a/the 升降级错误）", "diag": "新拟例句：第二次提还用 a，对方会以为是另一只狗；已经介绍过的要升到 the，接着说用 it。"}, {"wrong": "Look at the moon. A moon is round.", "right": "Look at the moon. The moon is round.", "type": "升了级又降回 a", "diag": "新拟例句：月亮全世界一个，第二次提不能退回 a。"}], "quiz": [{"q": "说话时选 a 还是 the，心里要先问什么？", "ans": "对方现在能不能定位到它", "hint": null}, {"q": "刚介绍完 a dog，下一句接着夸它可爱，用 the dog 还是 a dog？", "ans": "the dog——已经介绍过，对方找得到了", "hint": null}], "groups": [{"title": "🧩 分组看看：一条接力链", "items": [{"name": "a 介绍", "gloss": "第一次出现，对方还没见过", "ex": "I have a dog."}, {"name": "the 定位", "gloss": "已经介绍过了，对方找得到", "ex": "The dog is cute."}, {"name": "it 承接", "gloss": "就在眼前这句话里，接着用小代词", "ex": "It is my friend."}]}], "note": null, "group": 1, "anim": "relay"}, {"id": "C-08", "short": "把东西找出来，只有五条路", "desc": "说过、挨着带出来、话里说清、就在眼前、全世界只有一个——总得占一条，才能用 the。", "formal": "把东西「找出来」的线索只有五条路（定指的建立菜单）", "kid": "说 the 之前先检查：对方能凭什么找到它？说过、挨着、看得见、大家都知道——总得有一条路。", "claim": "听者能定位一个 the 名词，靠的无非五条路：上文刚提过（回指）、关联物带出（a wedding → the bride）、句中修饰语当场锁定（the book on the desk）、眼前情境就在（Pass me the salt）、全世界只有一个的常识（the sun）——五路皆无，就不能用 the；五条路是「充分线索」的清单。", "beats": [{"name": "五条路清单", "text": "找东西有五条路：刚才说过、跟着别的东西来、话里说清了、就在眼前、全世界只有一个。"}, {"name": "分路练", "text": "（教师侧）五条路难易不同：关联那条路最难学会，要单独多练。"}, {"name": "五路皆无怎么办", "text": "五条路一条都不通时，老实降级：第一次提就用 a（只认类别），或者用零冠词说一类。硬上 the，听者会满世界找「哪一个？」"}], "examples": [{"s": "I have a dog. The dog is cute.", "note": "回指路：上文刚提过"}, {"s": "She is going to a wedding. The bride is her sister.", "note": "关联路：婚礼带出新娘（新拟例句）"}, {"s": "Pass me the salt, please.", "note": "情境路：就在餐桌上"}, {"s": "The book on the desk is my book.", "note": "修饰锁定路：on the desk 当场圈定"}, {"s": "The moon is up in the sky.", "note": "常识路：月亮只有一个"}, {"s": "The first day of school is busy.", "note": "序数词当场锁定 — 新拟例句"}, {"s": "Be careful! The floor is wet.", "note": "眼前情境 + 提醒 — 新拟例句"}], "errors": [{"wrong": "I read the book yesterday.", "right": "I read a book yesterday.", "type": "五路皆无而用 the", "diag": "新拟例句：从没提过这本书、对方也不知道是哪本——五条路一条没占，不能用 the。"}, {"wrong": "I want to buy the book about cats.", "right": "I want to buy a book about cats.", "type": "修饰语没锁死也用 the", "diag": "新拟例句：about cats 只是话题，没有把书锁定到唯一一本，仍是第一次提，用 a。"}], "quiz": [{"q": "「Pass me the salt」能用 the，走的是哪条路？", "ans": "眼前情境就在", "hint": null}, {"q": "「The book on the desk is mine.」走的是哪条路？", "ans": "修饰锁定路——on the desk 当场圈定", "hint": null}], "groups": [{"title": "🧩 分组看看：五条路，一条一条看", "items": [{"name": "回指路", "gloss": "刚才上文刚说过，对方记得", "ex": "I have a dog. The dog is cute."}, {"name": "关联路", "gloss": "跟着一个提过的东西一起带出来：先说婚礼，新娘就跟着出来了", "ex": "She is going to a wedding. The bride is her sister.（新拟例句）"}, {"name": "修饰锁定路", "gloss": "话里多说几个字，当场圈定是哪一个", "ex": "The book on the desk is my book."}, {"name": "情境路", "gloss": "东西就在眼前，不用说也知道", "ex": "Pass me the salt, please."}, {"name": "常识路", "gloss": "全世界只有一个，大家都知道", "ex": "The moon is up in the sky."}]}], "note": null, "group": 2}, {"id": "C-14", "short": "a/an 看声音，不看字母", "desc": "hour 的 h 不出声，用 an；university 是辅音声开头，用 a。耳朵说了算。", "formal": "a/an 看声音不看字母：an 是原形，a 是弱化形", "kid": "a 和 an 是同一个小词：后面词的第一个声音是元音，它就多留一个 n 垫着读；看的是声音，不是字母。", "claim": "a 与 an 是同一个词的两副面孔：它本是古英语 ān「一」，元音开头的词前保留 an（防吞音），辅音前弱化成 a；所以判据永远是读音——an hour（h 不发音）、a university（读 /j/ 辅音音）。", "beats": [{"name": "一个词两副面孔", "text": "an 是哥哥，a 是弟弟：后面是元音开头时，哥哥多带一个 n 垫着，读起来不打架。"}, {"name": "耳朵判据", "text": "拿到一个词，先读出声：第一个声音是「啊、诶、咦、哦、呜」这类元音，就用 an。"}, {"name": "为什么是声音说了算", "text": "a/an 是先说出口的词，先过耳朵再过眼睛：两个元音撞在一起难发音，an 的 n 就是垫在中间的缓冲垫。"}], "examples": [{"s": "I have an egg.", "note": "元音开头——an 的本景"}, {"s": "I have an apple.", "note": "同型巩固"}, {"s": "An hour is a long time.", "note": "hour 的 h 不发音——看声音不看字母"}, {"s": "He is an honest boy.", "note": "honest 同型：h 脱落的登记词"}, {"s": "A university is a big school.", "note": "university 读 /j/ 辅音开头——看声音不看字母（与 honest 的 an 对照）"}, {"s": "I have an umbrella.", "note": "u 读元音 /ʌ/，用 an — 新拟例句"}], "errors": [{"wrong": "I waited for a hour.", "right": "I waited for an hour.", "type": "按字母判 a/an（*a hour 型）", "diag": "新拟例句：盯着字母 h 选了 a，没听声音——hour 的第一个声音是元音。"}, {"wrong": "This is an university.", "right": "This is a university.", "type": "按字母判 a/an（*an university 型）", "diag": "新拟例句：盯着字母 u 选了 an，没听声音——university 开头是辅音声「优」。"}], "quiz": [{"q": "hour 前面用 an，是因为？", "ans": "hour 的第一个声音是元音（h 不发音）", "hint": null}, {"q": "「___ umbrella」填 a 还是 an？", "ans": "an——umbrella 是元音声开头", "hint": null}], "groups": [{"title": "🧩 分组看看：an 和 a 的地盘", "items": [{"name": "元音声开头 → an", "gloss": "第一个声音是「啊诶咦哦呜」这类元音", "ex": "an egg / an apple"}, {"name": "h 不出声 → an", "gloss": "字母是 h，可它不出声，第一个声音还是元音", "ex": "an hour / an honest boy"}, {"name": "辅音声开头 → a", "gloss": "第一个声音是辅音，哪怕第一个字母是元音字母", "ex": "a university（读「优」）/ a book"}]}], "note": null, "group": 3}, {"id": "GR-15", "short": "耳朵决定，字母只是参考", "desc": "和 C-14 是同一条规律的语法组版本：先把词读出声，再选 a 还是 an。", "formal": "a / an 按声音不按字母：耳朵决定，字母只是参考", "kid": "a 还是 an，不看第一个字母长什么样，看第一个声音是不是元音：an hour 的 h 不出声，a unit 开头是「优」的辅音味儿", "claim": "an 的 -n 是为避免两个元音相撞而保留的连接音：冠词形式由后随词的起始音素（语音）决定，不由拼写字母决定。", "beats": [{"name": "耳朵说了算", "text": "选 a 还是 an，先把词读出声：第一个音是元音，就用 an 把两个元音隔开；第一个音是辅音，就用 a。字母长什么样，不算数。"}, {"name": "两个陷阱词", "text": "hour 的 h 是哑巴，听到的第一个音是元音，所以 an hour；unit 的第一个字母是元音字母 u，声音却是辅音打头，所以 a unit。"}, {"name": "一个判据，两个考场", "text": "C-14 讲的是 a/an 这对词本身；这一条是同一判据在语法总表里的登记：凡选 a/an，先读出声、再下笔。两处说的是同一件事，考试和写作都按耳朵办。"}], "examples": [{"s": "I waited an hour.", "note": "h 不出声：第一个音是元音，用 an"}, {"s": "This is a unit about animals.", "note": "u 开头却是辅音声：用 a"}, {"s": "He is an honest man.", "note": "honest 的 h 也不出声，用 an"}, {"s": "I have an egg.", "note": "第一个音就是元音，用 an"}, {"s": "It is an orange.", "note": "o 是元音音 — 新拟例句"}, {"s": "She has a useful book.", "note": "useful 读 /j/ 辅音音 — 新拟例句"}], "errors": [{"wrong": "He is a honest man.", "right": "He is an honest man.", "type": "按字母判 a/an（目录未登记逐字病例）", "diag": "新拟例句：honest 的 h 不出声，第一个音是元音——耳朵决定，用 an。"}, {"wrong": "I need an uniform.", "right": "I need a uniform.", "type": "按字母判 a/an（u 开头误用 an）", "diag": "新拟例句：uniform 读 /ˈjuːnɪfɔːm/，第一个音是辅音 /j/，用 a。"}], "quiz": [{"q": "___ hour A. a B. an", "ans": "B. an——h 不出声，第一个音是元音。", "hint": "回到机制第 1 节「耳朵说了算」：先读出声再选。"}, {"q": "「___ unit」填 a 还是 an？", "ans": "a——unit 开头是「优」的辅音声，耳朵说了算", "hint": null}], "groups": [{"title": "🧩 分组看看：两个陷阱窝", "items": [{"name": "h 不出声 → an", "gloss": "字母是 h，声音却是元音开头", "ex": "an hour / an honest man"}, {"name": "元音字母辅音声 → a", "gloss": "字母是元音字母，声音却是「优」这样的辅音开头", "ex": "a unit / a university"}]}], "note": "对账提示：本条与 C-14 同题——C-14 在小系统组（C 组），本条在语法组（GR 组），目录里两条并存，原型照录两条，未合并。", "group": 3}, {"id": "C-11", "short": "去做事，还是去那栋楼", "desc": "go to school 是去「上学」这件事，不加 the；go to the school 是去「那栋楼」办事，加 the。", "formal": "机构名词有两种读法：「去做那件事」不加冠词，「去那栋楼」才加", "kid": "go to school 是「去上学」（做事），go to the school 是「去那所学校」（去一栋楼）——加不加 the，看你说的是事还是楼。", "claim": "school、bed、hospital 这类词，当它表示「去做那件事」（上学、睡觉、看病）时零冠词；当它表示那栋建筑、那件家具时加 the——冠词在这里标的是「活动读法 vs 实物读法」的识解切换。", "beats": [{"name": "活动读法脱个体", "text": "去上学，不是去看那栋楼，是去「上学」这件事——说事的时候，不用 the。"}, {"name": "交通同型", "text": "by bus 是「坐车（怎么去）」，on a bus 是「在一辆车上」——一个讲办法，一个讲东西。"}, {"name": "一眼分清两种读法", "text": "看人物在干什么：go to school 是去上学（做那件事），go to the school 是去那栋楼（找人、参观）。问自己：他是去做那件事，还是去那个地方？"}], "examples": [{"s": "We go to school.", "note": "去上学——活动读法零冠词"}, {"s": "My father goes to the school.", "note": "家长去那所学校（办事/开会）——实物读法加 the"}, {"s": "We go to bed.", "note": "去睡觉——bed 的活动读法"}, {"s": "We go to school by bus.", "note": "by bus 方式读法零冠词（登记对：ex-bed-bus）"}, {"s": "He is in hospital.", "note": "住院看病 = 做那件事，零冠词 — 新拟例句"}, {"s": "The hospital is near my home.", "note": "说的是那栋建筑 — 新拟例句"}], "errors": [{"wrong": "I go to the school every day.", "right": "I go to school every day.", "type": "机构名词两种读法混淆", "diag": "新拟例句：说的是『我每天去上学』（做事），误加 the 就成了『去那栋楼』——活动读法零冠词。"}, {"wrong": "I go to the bed at nine.", "right": "I go to bed at nine.", "type": "睡觉读法误加 the", "diag": "新拟例句：go to bed 是去睡觉（做那件事），不加 the。"}], "quiz": [{"q": "「Dad goes to the school today.」里的 Dad 是去干什么？", "ans": "去那所学校（楼/办事）", "hint": null}, {"q": "妈妈去学校开家长会，说 go to school 还是 go to the school？", "ans": "go to the school——她是去那栋楼办事，不是去上学", "hint": null}], "groups": [{"title": "🧩 分组看看：两种读法对照", "items": [{"name": "做事 → 不加", "gloss": "说的是活动本身：上学、睡觉", "ex": "We go to school. / We go to bed."}, {"name": "去楼 → 加 the", "gloss": "说的是那栋建筑、那件家具，要去那儿办事", "ex": "My father goes to the school."}, {"name": "讲办法 → 不加", "gloss": "by bus 是「怎么去」，不是「哪辆车」", "ex": "We go to school by bus."}]}], "note": null, "group": 4, "svg": "school"}, {"id": "C-12", "short": "有些搭配没道理，整串记住", "desc": "弹钢琴加 the、踢足球不加——这是大家说定的约定，编理由反而会把 the 乱推广。", "formal": "有些搭配是「约定存货」：play the piano 加 the、play football 不加", "kid": "有的说法就是大家习惯这么说，没有道理可讲，像游戏规则一样记住就好：弹钢琴要加 the，踢足球不加。", "claim": "乐器前加 the、球类运动前不加，是历史沉淀的约定，机制只能解释一部分——这类搭配的正确教法是整块记住并注明「这里没有为什么」，而不是编一套因果故事；约定部分靠频率与整块记忆习得，强行理据化会产生错误迁移。", "beats": [{"name": "语言的两个抽屉", "text": "英语有两个抽屉：一个装「有道理的」，一个装「大家说好就这么定的」——钢琴和足球在第二个抽屉里。"}, {"name": "按串整记", "text": "乐器是一串：钢琴、吉他都加 the；球类是一串：足球、篮球都不加——一串一串记，不用一个一个背。"}, {"name": "没有为什么，就背整串", "text": "这类搭配问不出道理：piano 前面一直加 the，football 一直不加。教法是整串领读、整串听写，把「play the + 乐器」「play + 球类」当成两首小歌谣背下来。"}], "examples": [{"s": "I can play the piano.", "note": "乐器串——加 the（约定登记）"}, {"s": "We play football.", "note": "球类串——零冠词（约定登记）"}, {"s": "She can play the guitar.", "note": "吉他归乐器串（现代口语松动见 exceptions）"}, {"s": "They play football in the park.", "note": "操场场景——球类串整块使用"}, {"s": "He can play the violin.", "note": "乐器串 — 新拟例句"}, {"s": "We play basketball after class.", "note": "球类串 — 新拟例句"}], "errors": [{"wrong": "We play the football after school.", "right": "We play football after school.", "type": "约定搭配强行理据化（教学侧伪因果）", "diag": "新拟例句：把钢琴的 the 编成道理推广到球类，就会多出这个 the——约定搭配整串记，不编理由。"}, {"wrong": "She plays piano every day.", "right": "She plays the piano every day.", "type": "乐器前漏 the", "diag": "新拟例句：约定就是约定，乐器前的 the 不能省。"}], "quiz": [{"q": "play the piano 的 the，为什么不能编一个「因为钢琴是乐器之王」之类的理由？", "ans": "它是约定，没有为什么；编理由会害人把 the 乱推广", "hint": null}, {"q": "「play ___ basketball」填 the 还是不填？", "ans": "不填——篮球归球类串，约定不加", "hint": null}], "groups": [{"title": "🧩 分组看看：两个抽屉", "items": [{"name": "乐器串 → 加 the", "gloss": "钢琴、吉他……成串记，都加 the", "ex": "I can play the piano. / She can play the guitar."}, {"name": "球类串 → 不加", "gloss": "足球、篮球……成串记，都不加", "ex": "We play football."}]}], "note": null, "group": 4}, {"id": "C-13", "short": "介绍一种动物，有三种拍法", "desc": "a tiger 是随便一只代表全类，the tiger 是把物种当成一个大家伙，tigers 是一群一起敞开说。", "formal": "类指有三种说法，分工不同：a tiger / the tiger / tigers", "kid": "介绍一种动物有三台摄像机：一只代表大家、把全种当成一个大家伙、或者一群一起上镜——选哪台，句子就不一样。", "claim": "说「老虎（这一物种）」有三种合法形式：a tiger（任取一只代表全类）、the tiger（把物种当作一个整体个体）、tigers（整类敞开说）——三者不是随便换的同义形式，而是三种不同的取景；分工可由谓词选择验证：濒危是物种整体的属性，须用 the tiger；条纹是任一样本的属性，可用 a tiger。", "beats": [{"name": "三台摄像机", "text": "一只老虎代表全班（a）、把老虎这个物种当成一个大家伙（the）、一群老虎一起上镜（零冠词复数）。"}, {"name": "谓词验分工", "text": "（教师侧）「有条纹」哪台都能拍；「快灭绝了」只能用把物种当整体的那台——谓词会挑摄像机。"}, {"name": "下笔前先想清说哪一层", "text": "先问自己：随手举一只当例子（a）、把整个物种当一个整体说（the）、还是把这一类全敞开（复数零冠词）？谓词会替你验票：endangered 只收 the，has stripes 用 a 最自然。"}], "examples": [{"s": "Tigers are big.", "note": "零冠词复数类指——小学主教形式"}, {"s": "A tiger has stripes.", "note": "a 类指：任取一只代表全类"}, {"s": "The tiger is a big cat.", "note": "the 类指的入门形态：把物种当一个整体介绍（高年级完整版见成人层）"}, {"s": "I can see tigers in the zoo.", "note": "对照：具体的一群老虎（非类指）也用零冠词复数，靠语境分"}, {"s": "The panda is a symbol of China.", "note": "物种当整体 — 新拟例句"}, {"s": "A panda eats bamboo.", "note": "任取一只当代表 — 新拟例句"}], "errors": [{"wrong": "*A tiger is endangered.", "right": "The tiger is endangered.", "type": "类指形式与谓词不匹配", "diag": "endangered（濒危）是物种整体的属性，不是任一样本的属性；a 的取景是「任取一只样本」，与整体谓词冲突，须改用把物种个体化的 the 类指。"}, {"wrong": "Pandas is a big animal.", "right": "Pandas are big animals.", "type": "类指主谓不一致", "diag": "新拟例句：复数类指要配 are + 复数表语；想用单数，就走 a 的拍法（A panda is a big animal）。"}], "quiz": [{"q": "介绍「老虎有条纹」给全班听，哪种说法不对？", "ans": "三种都可以（条纹是任一只都有的属性）", "hint": null}, {"q": "「___ tiger is endangered.（老虎快灭绝了）」填 A 还是 The？", "ans": "The——灭绝是整个物种的事，要用把物种当整体的 the", "hint": null}], "groups": [{"title": "🧩 分组看看：三台摄像机", "items": [{"name": "a tiger：一只代表", "gloss": "任取一只，代表全类——说每只都有的本事时用它", "ex": "A tiger has stripes."}, {"name": "the tiger：当成一个整体", "gloss": "把物种当成一个大家伙——说「快灭绝了」这种整体的事只能用它", "ex": "The tiger is a big cat."}, {"name": "tigers：一群敞开说", "gloss": "复数不加冠词，小学最常用的介绍
