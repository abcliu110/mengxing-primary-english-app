<script>
const DATA = {"units": [{"id": "TA-01", "kid": "时态像两个开关：一个管「什么时候」，一个管「怎么看」；开关一组合，样子就出来了，不用背一大张表", "beats": [{"b": "两个开关", "t": "一个开关管「什么时候」（现在还是过去），一个开关管「怎么看」（看整件、看中间、看痕迹）。两个开关一组合，时态的样子就定了。", "v": "两个拨动开关的图式：时间开关（现在/过去）× 看法开关（全景/进行/完成），组合格亮起"}, {"b": "组合不是背诵", "t": "先想「这件事在什么时候、我要怎么看它」，再去选样子——顺序反过来，表背得再熟也会选错。", "v": "同一件事（小男孩踢球）配三副不同镜头框，落在组合格的不同格子里"}], "ex": [{"s": "I am reading now.", "note": "晚饭后读绘本，正在发生——时间=现在，看法=钻进中间（进行）", "lv": 1, "z": "present"}, {"s": "I read a story yesterday.", "note": "昨天读完的故事——时间=过去，看法=看整件（一般）", "lv": 1, "z": "past"}, {"s": "I have finished my homework.", "note": "作业做完了，痕迹是现在可以出去玩——时间=过去的事，看法=对准现在的牵连（完成）", "lv": 2, "z": "perfect"}, {"s": "We were playing football in the afternoon.", "note": "回忆昨天下午踢球踢到一半的画面——时间=过去，看法=钻进中间（过去进行）", "lv": 2, "z": "past"}], "err": [], "quiz": [], "rel": [{"id": "TA-02", "rel": "同族"}, {"id": "TA-03", "rel": "同族"}]}, {"id": "TA-02", "kid": "英语动词变来变去，只有「现在」和「过去」两件衣裳；说将来的事，要借 will、going to 这些小帮手的力气", "beats": [{"b": "两件衣裳", "t": "动词自己能换的衣裳只有两件：现在样、过去样。说将来的事，动词要请小帮手（will、going to）来搭把手。", "v": "衣架上两件衣服（现在/过去），旁边一排「借来的工具」：will、going to、时刻表现在时"}, {"b": "分歧登记", "t": "这件事老师们也有不同看法，详情放在大人看的地方；我们先按「没有将来时这件衣裳」来学。", "v": "无（分歧只入成人层，不上儿童屏）"}], "ex": [{"s": "We play games today.", "note": "动词的「现在」衣裳", "lv": 1, "z": "present"}, {"s": "We played games yesterday.", "note": "动词的「过去」衣裳", "lv": 1, "z": "past"}, {"s": "We will visit Grandma tomorrow.", "note": "说将来的事要借 will——will 是帮手，不是动词自己的衣裳", "lv": 2, "z": "future"}, {"s": "Look at the clouds! It is going to rain.", "note": "借 going to 谈将来（此例同 TA-11 登记例）", "lv": 2, "z": "future"}], "err": [], "quiz": [], "rel": [{"id": "TA-01", "rel": "同族"}, {"id": "TA-10", "rel": "同族"}, {"id": "TA-11", "rel": "同族"}, {"id": "TA-13", "rel": "同族"}]}, {"id": "TA-03", "kid": "看一件事像看录像：可以站在远处看完整件，也可以把镜头推进去，只看正在发生的中间一段——选哪种看法，就是选哪种「体」", "beats": [{"b": "全景与特写", "t": "同一件事，可以站在远处看它从头到尾（全景），也可以把镜头推近，只看中间正在动的那一段（特写）。看的方法不同，说出来的样子就不同。", "v": "同一段踢球录像的两个画框：远景全程 vs 推近到脚触球的一瞬"}, {"b": "类比的失效处", "t": "镜头是比喻，不是真的照相机：有的动词天生没有「中间一段」可看（比如 know），镜头就推不进去——这是动词的形状决定的（TA-07）。", "v": "know 的牌子图标旁镜头推近被挡住的示意"}], "ex": [{"s": "They built a house.", "note": "站远处看整件事：房子从无到有，一次看完（全景）", "lv": 1, "z": "past"}, {"s": "They were building a house.", "note": "把镜头推近：只看正在盖的中间一段（钻进去看）", "lv": 1, "z": "past"}, {"s": "He ran in the park.", "note": "全景看跑步这件事", "lv": 2, "z": "past"}, {"s": "He was running when I saw him.", "note": "我看见他时，他正在跑的中间一段", "lv": 2, "z": "past"}], "err": [], "quiz": [], "rel": [{"id": "TA-01", "rel": "前置"}, {"id": "TA-07", "rel": "同族"}, {"id": "TA-18", "rel": "同族"}]}, {"id": "TA-04", "kid": "「我现在说」只有一眨眼那么短，一件完整的事塞不进这一眨眼；所以正在做的事要钻进镜头里说（进行时），一般现在时平时管的是习惯和老道理", "beats": [{"b": "一眨眼的现在", "t": "「现在」只有一眨眼那么短。踢球、吃饭这种要花时间的事，整件塞不进一眨眼，只好钻进镜头里说：I am eating.", "v": "一条时间轴上一个极短的「现在」亮点，一件完整事件的方框塞不进、改用进行中的截面呈现"}, {"b": "一般现在时的正职", "t": "一般现在时平时管两件事：天天都做的习惯（I get up at seven）和永远对的老道理（The sun rises in the east）。", "v": "日历上重复打勾的作息图 + 太阳升起图"}], "ex": [{"s": "I am eating now.", "note": "正在吃饭——必须钻进镜头（进行时）", "lv": 1, "z": "present"}, {"s": "I get up at seven every day.", "note": "天天的习惯——一般现在时的正职", "lv": 1, "z": "present"}, {"s": "The sun rises in the east.", "note": "永远对的老道理——一般现在时", "lv": 2, "z": "present"}, {"s": "Look! They are playing football now.", "note": "眼前正在发生——进行时", "lv": 2, "z": "present"}], "err": [], "quiz": [], "rel": [{"id": "TA-14", "rel": "同族"}, {"id": "TA-13", "rel": "同族"}]}, {"id": "TA-05", "kid": "完成时不是说「以前做完了」，是说「以前那件事，现在还留着印子」：钥匙丢过——所以现在进不了门", "beats": [{"b": "看痕迹不看完没完", "t": "完成时盯着的是「现在留下的印子」：钥匙丢了（印子：现在进不了门）、去过北京（印子：有了这份经验）。", "v": "地上脚印（过去的脚步 → 现在的痕迹）图式：脚步在左、痕迹在右并被圈出"}, {"b": "何时必须用、何时不能用", "t": "讲机制之外还要给清单：想说「印子还在」时用它；一旦点名昨天几点，就不能用它（TA-06）。", "v": "两栏选择框：盯着现在结果 → 用完成体；点名过去时间 → 用过去时"}], "ex": [{"s": "I have lost my key.", "note": "钥匙丢了——印子是现在进不了门（结果用法；清单儿童版登记例）", "lv": 1, "z": "perfect"}, {"s": "I have been to Beijing.", "note": "去过北京——印子是经验本身（经历用法；清单边界登记例）", "lv": 1, "z": "perfect"}, {"s": "I have finished my homework.", "note": "作业完成——印子是现在可以玩了（结果用法）", "lv": 2, "z": "perfect"}, {"s": "We have lived here for three years.", "note": "住了三年而且还住着——持续用法，牵连一直连到现在", "lv": 2, "z": "perfect"}], "err": [], "quiz": [], "rel": [{"id": "TA-06", "rel": "同族"}, {"id": "TA-09", "rel": "同族"}, {"id": "TA-12", "rel": "对照"}, {"id": "TA-16", "rel": "易混"}]}, {"id": "TA-06", "kid": "完成时的眼睛盯着「现在」，你一旦说出「昨天几点」这种明确的过去时间，等于把它的眼睛硬掰回过去，句子就别扭了", "beats": [{"b": "两套定位打架", "t": "完成时说「我盯着现在」；yesterday 说「回到昨天去」。一句话里两个命令相反，句子就坏了。想点名时间，就换过去时来讲。", "v": "一只眼睛望向「现在」旗杆，yesterday 的手把视线往回掰、句子裂开的图式"}], "ex": [{"s": "I saw him yesterday.", "note": "点名了昨天——用一般过去时（正形，与病例错形对照）", "lv": 1, "z": "past"}, {"s": "I have seen him.", "note": "不点名时间，只说与现在有牵连——完成时可用", "lv": 1, "z": "perfect"}, {"s": "We have lived here since 2021.", "note": "since/for 给的是「连到现在的一段」——完成时的合法时间伴侣", "lv": 2, "z": "perfect"}], "err": [{"wrong": "I have seen him yesterday.", "right": "I saw him yesterday.", "type": "完成时误配过去时间状语", "diag": "完成时参照点在现在，yesterday 把定位锚回过去，两套定位冲突（回 TA-06 机制节、TA-05 现时相关）", "src": "教学文献登记错型"}], "quiz": [], "rel": [{"id": "TA-05", "rel": "前置"}, {"id": "TA-16", "rel": "易混"}]}, {"id": "TA-07", "kid": "动词像不同形状的玩具：run 是可以一直转的轮子，build a house 是有头有尾的一段路，know 是静止的牌子——形状不对，镜头（进行时）就套不上", "beats": [{"b": "四种形状", "t": "know 是静止的牌子（没有过程），run 是能一直转的轮子（没有终点），paint a picture 是一段有头有尾的路，find 是啪的一下（瞬间）。形状先看清，再选镜头。", "v": "四个形状图标：牌子（状态）、轮子（活动）、有终点的路（完结）、闪光点（达成）"}, {"b": "按短语判断", "t": "同一个 run，光跑步是轮子，加上「一英里」就变成有终点的路——看形状要看整个短语，不能只看一个动词。", "v": "run 与 run a mile 并排，形状从轮子变成有终点的路"}], "ex": [{"s": "I know the answer.", "note": "状态——静止的牌子，没有过程可看", "lv": 1, "z": "present"}, {"s": "The children run in the park.", "note": "活动——可以一直转的轮子，没有固有终点", "lv": 1, "z": "other"}, {"s": "She painted a picture.", "note": "完结——有头有尾的一段路，画完为止", "lv": 2, "z": "other"}, {"s": "He found his key.", "note": "达成——瞬间发生，啪的一下", "lv": 2, "z": "past"}], "err": [{"wrong": "I am knowing the answer.", "right": "I know the answer.", "type": "状态动词误套进行体", "diag": "know 是状态型，没有内部过程可看，进行体的镜头套不上（回 TA-07 机制节；清单支撑登记 *I am knowing 的不可接受性）", "src": "教学文   app.innerHTML = h; window.scrollTo(0,0);
}

function unitPage(id){
  const u = DATA.units.find(function(x){ return x.id===id; });
  if(!u) return home();
  if(!(id in stageSel)) stageSel[id] = 0;
  let h = '<span class="back" data-nav="home">← 返回</span>';
  h += '<h2>'+u.id+' · '+esc(u.kid)+'</h2>';
  // 时间轴舞台
  h += '<div class="panel"><div style="font-weight:700">🕰️ 时间轴舞台：点一点站位，看句子怎么变</div><div class="axis">';
  ZONES.forEach(function(z){
    h += '<div class="zone"><div class="zn">'+z[1]+'</div>';
    u.ex.forEach(function(x,i){ if(x.z===z[0]) h += '<button class="mk'+(stageSel[id]===i?' on':'')+'" data-stage="'+i+'" data-unit="'+u.id+'">例 '+(i+1)+'</button>'; });
    h += '</div>';
  });
  h += '</div>';
  const others = u.ex.map(function(x,i){return [x,i];}).filter(function(p){ return p[0].z==='other'; });
  if(others.length){
    h += '<div class="grp">对照例句（不挂时间站位，并排看形式）：';
    others.forEach(function(p){ h += '<button class="mk'+(stageSel[id]===p[1]?' on':'')+'" data-stage="'+p[1]+'" data-unit="'+u.id+'">例 '+(p[1]+1)+'</button>'; });
    h += '</div>';
  }
  const cur = u.ex[stageSel[id]] || u.ex[0];
  if(cur){
    h += '<div class="stageSent">'+hi(cur.s)+sayBtn(cur.s,'sent-spk')+'</div><div class="stageNote">'+esc(cur.note)+'</div>';
  }
  h += '</div>';
  // 机制 beats
  h += '<h3>⚙️ 机制</h3>';
  u.beats.forEach(function(b){
    h += '<div class="beat"><div class="bn">'+esc(b.b)+'</div><div class="bt">'+esc(b.t)+'</div>'+(b.v?'<div class="bv">图式：'+esc(b.v)+'</div>':'')+'</div>';
  });
  // 例句区
  h += '<h3>📝 例句（点小喇叭听整句）</h3><div class="panel" id="exzone">';
  u.ex.forEach(function(x){
    h += '<div class="exrow"><span class="es">'+hi(x.s)+'</span>'+sayBtn(x.s,'sent-spk')+'<div class="en">'+esc(x.note)+'</div></div>';
  });
  h += '</div>';
  // 病句医院
  h += '<h3>🏥 病句医院</h3>';
  if(u.err.length){
    u.err.forEach(function(c){
      h += '<div class="err"><div>❌ <span class="w">'+esc(c.wrong)+'</span></div><div>✅ <span class="r">'+esc(c.right)+'</span></div><div class="grp">错型：'+esc(c.type)+(c.src?'（来源：'+esc(c.src)+'）':'')+'</div><div>'+esc(c.diag)+'</div></div>';
    });
  } else {
    h += '<div class="todo">病例待补：本单元在模型中暂无实录错例，补录后上线，不编造。</div>';
  }
  // 练习
  h += '<h3>🧩 练习</h3>';
  if(u.quiz.length){
    u.quiz.forEach(function(q,qi){
      h += '<div class="panel quizbox" data-quiz="'+u.id+'-'+qi+'"></div>';
    });
  } else {
    h += '<div class="todo">练习待补：本单元在模型中暂无题目，题目入模后上线，不自造。</div>';
  }
  // 亲戚
  if(u.rel.length){
    h += '<h3>🔗 相关规律</h3><div>';
    u.rel.forEach(function(r){ h += '<span class="chip" data-nav="unit" data-arg="'+esc(r.id)+'">'+esc(r.id)+'（'+esc(r.rel)+'）</span>'; });
    h += '</div>';
  }
  app.innerHTML = h; window.scrollTo(0,0);
  u.quiz.forEach(function(q,qi){ renderQuiz(u, q, qi); });
}
function renderQuiz(u, q, qi){
  const box = document.querySelector('[data-quiz="'+u.id+'-'+qi+'"]');
  if(!box) return;
  const stem = q.question || q.stem || '';
  const opts = q.options || [];
  const ans = q.answer;
  if(!stem || opts.length < 2){ box.innerHTML = '<div class="todo">练习待补。</div>'; return; }
  let h = '<p style="font-weight:700">'+esc(stem)+'</p>';
  opts.forEach(function(o){ h += '<button class="opt" data-ans="'+esc(o===ans?'1':'0')+'">'+esc(o)+'</button>'; });
  h += '<div class="hint">'+esc(q.hint || '回到上面的机制再想想。')+'</div>';
  box.innerHTML = h;
  box.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.dataset.ans==='1'){ btn.classList.add('ok'); }
      else { btn.classList.add('no'); const hint = box.querySelector('.hint'); if(hint) hint.style.display='block'; }
    });
  });
}

function formCell(f){ return '<b>'+esc(f.w)+'</b>'+sayBtn(f.w,'fspk')+'<span class="fm">'+esc(f.m)+'</span>'; }
function formsPage(){
  const st = DATA.stats;
  const G = [['AAA','A-A-A · 三形同形'],['ABA','A-B-A · 分词回到原形'],['ABB','A-B-B · 过去式与分词同形'],['ABC','全不同'],['ONLY','过去式单列（过去分词词库未单列）']];
  let h = '<span class="back" data-nav="home">← 返回</span><h2>📋 动词形式总表</h2>';
  h += '<p class="sub">变化表由词库 '+st.form_entries_total+' 条屈折形条目按 verb_form_of 回链推导：共 '+st.change_bases+' 个基形。分组由三形字符串现算，不手编。发音按钮读的是形式本身——这里发音就是内容。</p>';
  G.forEach(function(g){
    const rs = DATA.rows.filter(function(r){ return r.grp===g[0]; });
    h += '<h3>'+g[1]+' · '+rs.length+' 个</h3>';
    if(!rs.length){ h += '<div class="todo">词库中暂无此组（现算结果为 0）。</div>'; return; }
    h += '<table class="ftable"><tr><th>基形（原形）</th><th>过去式</th><th>过去分词</th></tr>';
    rs.forEach(function(r){
      h += '<tr><td><b>'+esc(r.base)+'</b></td><td>'+r.past.map(formCell).join('<br>')+'</td><td>'+
        (r.part.length ? r.part.map(formCell).join('<br>') : '<span class="miss">词库未单列（只有过去式条目）</span>')+'</td></tr>';
    });
    h += '</table>';
  });
  h += '<h3>附：第三人称单数与 -ing 形式 · '+DATA.appendix.length+' 条</h3><table class="ftable"><tr><th>形式</th><th>基形</th><th>说明（词库释义）</th></tr>';
  DATA.appendix.forEach(function(a){
    h += '<tr><td><b>'+esc(a.w)+'</b>'+sayBtn(a.w,'fspk')+'</td><td>'+esc(a.base)+'</td><td>'+esc(a.m)+'</td></tr>';
  });
  h += '</table>';
  h += '<h3>动词总表 · '+DATA.verbs.length+' 条</h3><p class="sub">口径：词库中词性（pos_tags）含 v. 的全部条目，逐条呈现，A–Z。紧凑行：词形 + 中文义。</p>';
  h += '<table class="vtable">';
  DATA.verbs.forEach(function(v){ h += '<tr><td>'+esc(v[0])+'</td><td>'+esc(v[1])+'</td></tr>'; });
  h += '</table>';
  app.innerHTML = h; window.scrollTo(0,0);
}

const ROUTE_TXT = {R1:'词库多义标记', R2:'释义多义项', R3:'规律挂接'};
function polyMenu(){
  const st = DATA.stats;
  let h = '<span class="back" data-nav="home">← 返回</span><h2>🌳 一词多义动词 · '+DATA.poly.length+' 个</h2>';
  h += '<p class="sub">收录口径（三路并集，逐词现算）：① 词库 has_polysemy 标记的动词 '+st.poly_r1+' 个；② 词性含 v. 且释义（；分隔）含 2 个以上义项的动词 '+st.poly_r2+' 个；③ 词汇区多义规律在挂接表中点名补标的动词（'+st.poly_r3_new.join('、')+' 等）。义项逐字取自词库释义；有规律覆盖的词，点开能看到规律的机制讲解。</p>';
  h += '<div>';
  DATA.poly.forEach(function(r){
    h += '<span class="chip" data-nav="polyword" data-arg="'+r.id+'">'+esc(r.w)+' <small>('+r.senses.length+' 义项'+(r.lawdata.length?' · 有规律讲解':'')+')</small></span>';
  });
  h += '</div>';
  app.innerHTML = h; window.scrollTo(0,0);
}
function polyWord(id){
  const r = DATA.poly.find(function(x){ return x.id===id; });
  if(!r) return polyMenu();
  let h = '<span class="back" data-nav="poly">← 返回一词多义菜单</span>';
  h += '<h2>'+esc(r.w)+'</h2><div>'+r.routes.map(function(x){ return '<span class="badge b2">'+ROUTE_TXT[x]+'</span>'; }).join('')+'</div>';
  h += '<h3>义项（来自词库释义）</h3><div class="panel">';
  r.senses.forEach(function(s,i){ h += '<div class="sense"><span class="no">'+(i+1)+'.</span>'+esc(s)+'</div>'; });
  h += '</div>';
  if(r.lawdata.length){
    h += '<h3>📖 规律怎么讲这个词</h3>';
    r.lawdata.forEach(function(L){
      h += '<div class="lawbox"><div class="kid">'+L.id+' · '+esc(L.kid)+'</div>';
      L.beats.forEach(function(b){ h += '<div class="beat"><div class="bn">'+esc(b.b)+'</div><div class="bt">'+esc(b.t)+'</div></div>'; });
      L.ex.forEach(function(x){ h += '<div class="exrow"><span class="es">'+hi(x.s)+'</span>'+sayBtn(x.s,'sent-spk')+'<div class="en">'+esc(x.note)+'</div></div>'; });
      h += '</div>';
    });
  } else {
    h += '<div class="todo">暂无词汇规律专门覆盖此词；义项先按词库释义呈现，规律讲解入模后补上。</div>';
  }
  app.innerHTML = h; window.scrollTo(0,0);
}

document.addEventListener('click', function(ev){
  const say = ev.target.closest ? ev.target.closest('[data-say]') : null;
  if(say){ ev.stopPropagation(); speak(say.getAttribute('data-say')); return; }
  const st = ev.target.closest ? ev.target.closest('[data-stage]') : null;
  if(st){ stageSel[st.getAttribute('data-unit')] = parseInt(st.getAttribute('data-stage'),10); unitPage(st.getAttribute('data-unit')); return; }
  const nav = ev.target.closest ? ev.target.closest('[data-nav]') : null;
  if(nav){
    const k = nav.getAttribute('data-nav'), a = nav.getAttribute('data-arg');
    if(k==='home') home(); else if(k==='unit') unitPage(a); else if(k==='forms') formsPage();
    else if(k==='poly') polyMenu(); else if(k==='polyword') polyWord(a);
  }
});
home();
</script>
</body>
</html>
